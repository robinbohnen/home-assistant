bathroom_covers_package:
  automation:
    - id: bathroom_covers_close
      alias: Bathroom - Close covers
      description: "Close bathroom covers when bedroom button is pressed"
      mode: single
      triggers:
        # Eén event uit de router in
        # packages/1 - First Floor/Bedroom/Buttons.yaml; die kent de
        # knoppen en de ochtend-/avondgrens.
        - trigger: event
          event_type: huis_routine
          event_data:
            routine: avond
      conditions: []
      actions:
        - action: cover.set_cover_position
          data:
            position: 15
          target:
            entity_id: cover.badkamer_rolluik_low_speed
