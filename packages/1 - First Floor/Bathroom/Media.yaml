bathroom_media_package:
  automation:
    - id: media_movement_bathroom
      alias: Bathroom - Media
      description: "Turn on the media in the bathroom if there is movement detected"
      use_blueprint:
        path: robin/sonos_motion_join.yaml
        input:
          bewegingssensor: binary_sensor.pir_group_bathroom
          # Wie 's ochtends de badkamer binnenstapt staat vaak nog buiten het
          # bereik van de PIR; de deur is dan het eerste signaal.
          deur_contacten:
            - binary_sensor.badkamer_deur_contact
          speaker: media_player.badkamer_sonos
          schakelaar: input_boolean.enable_pir_bathroom
          # Plafond, geen instelling: staat hij al zachter dan blijft dat zo.
          # 's Ochtends vroeg hoeft de badkamer niet hard.
          volume_niveau: 0.15
          # Geen muziek voor 07:15 of na bedtijd - dan slaapt de rest nog.
          # Dit venster hoort alleen het AANsluiten tegen te houden. Stond het
          # als algemene conditie (zoals tot 2026-08-06), dan blokkeerde het ook
          # het loskoppelen: ging de badkamer vlak voor bedtijd nog aan, dan
          # bleef die speaker de hele nacht aan de woonkamergroep hangen omdat
          # de unjoin-tak buiten het venster viel. Dezelfde fout als indertijd
          # in motion_light.yaml, waar blokkades sindsdien alleen nog voor
          # aanzetten gelden.
          join_vereisten:
            - condition: time
              after: "07:15:00"
              before: input_datetime.bedtime_mini
