bathroom_media_package:
  automation:
    - id: media_movement_bathroom
      alias: Bathroom - Media
      description: "Turn on the media in the bathroom if there is movement detected"
      use_blueprint:
        path: robin/sonos_motion_join.yaml
        input:
          bewegingssensor: binary_sensor.pir_group_bathroom
          # Wie 's ochtends de badkamer binnenstapt staat vaak nog buiten het
          # bereik van de PIR; de deur is dan het eerste signaal.
          deur_contacten:
            - binary_sensor.badkamer_deur_contact
          speaker: media_player.badkamer_sonos
          schakelaar: input_boolean.enable_pir_bathroom
          # Plafond, geen instelling: staat hij al zachter dan blijft dat zo.
          # 's Ochtends vroeg hoeft de badkamer niet hard.
          volume_niveau: 0.15
          # Geen muziek voor 07:15 of na bedtijd - dan slaapt de rest nog.
          # Dit venster hoort alleen het AANsluiten tegen te houden. Stond het
          # als algemene conditie (zoals tot 2026-08-06), dan blokkeerde het ook
          # het loskoppelen: ging de badkamer vlak voor bedtijd nog aan, dan
          # bleef die speaker de hele nacht aan de woonkamergroep hangen omdat
          # de unjoin-tak buiten het venster viel. Dezelfde fout als indertijd
          # in motion_light.yaml, waar blokkades sindsdien alleen nog voor
          # aanzetten gelden.
          join_vereisten:
            - condition: time
              after: "07:15:00"
              before: input_datetime.bedtime_mini

    ##########################################################################
    ## DEUR STAAT OPEN
    ##########################################################################
    ##
    ## Twee minuten open en dan één keer omroepen op de badkamerspeaker.
    ##
    ## HOE VAAK DIT GAAT AFGAAN
    ## Nagemeten over 12 t/m 15 augustus 2026: de deur ging 61 keer open, maar
    ## bleef maar 11 keer langer dan twee minuten open - zo'n drie of vier keer
    ## per dag. De rest zijn passages van een paar seconden. Die twee minuten
    ## zijn dus een echte zeef en geen vertraging.
    ##
    ## WAAROM DE NACHTREM, EN WAAROM HET EEN KLOK IS EN GEEN SENSOR
    ## In diezelfde meting stond de deur op 15 augustus vanaf 01:56 ruim vier
    ## uur open. Een stem in de badkamer om twee uur 's nachts maakt het halve
    ## huis wakker voor een deur waar op dat moment niemand bij staat.
    ##
    ## Hier stond eerst `binary_sensor.huis_slaapt`, het huisbrede nachtvenster
    ## dat de overlopen ook gebruiken. Dat is voor deze melding te ruim, aan
    ## allebei de kanten:
    ##   - 's avonds slaat hij om op de laatste kinderbedtijd. In de historie
    ##     van 12 t/m 14 augustus was dat 19:00, 19:00 en 19:34 - een
    ##     badkamerbezoek om acht uur zou dus al zwijgen.
    ##   - 's ochtends blijft hij `on` tot iemand de slaapkamerknop indrukt.
    ##     Op 15 augustus stond de deur vanaf 06:33 zesendertig minuten open
    ##     terwijl de sensor `on` was (pas om 07:08 wakker). Juist de
    ##     doucheochtend waar je dit voor wilt.
    ##
    ## Van de elf lange openingen in die drie dagen valt er precies één buiten
    ## 06:30-22:30, en dat is die van 01:56. Een kale klok haalt er dus alleen
    ## uit wat eruit moet. Verzet de grenzen gerust; er hangt verder niets aan.
    ##########################################################################
    - id: bathroom_door_open_announce
      alias: Badkamer - Deur staat open
      description: >-
        Roept eenmalig op de badkamerspeaker om dat de badkamerdeur openstaat,
        twee minuten nadat hij is opengegaan.
      # Eenmalig zit al in de trigger: die vuurt één keer per keer-open. Single
      # + silent dekt alleen het geval dat de vorige omroep nog bezig is.
      mode: single
      max_exceeded: silent
      triggers:
        - trigger: state
          entity_id: binary_sensor.badkamer_deur_contact
          to: "on"
          # Komt het contact na een storing of herstart terug op `on`, dan is
          # dat geen deur die opengaat. Zelfde guard als op de bewegings- en
          # deurtriggers elders in dit huis.
          not_from:
            - unknown
            - unavailable
          for: "00:02:00"
      conditions:
        - alias: Niet midden in de nacht
          condition: time
          after: "06:30:00"
          before: "22:30:00"
      actions:
        # Zelfde vorm als de douchemeldingen in Douche.yaml: `announce: true`
        # duikt onder de muziek door op déze speaker (de badkamer hangt tijdens
        # het douchen meestal aan de woonkamergroep, zie hierboven), de
        # clipvolume van 50 staat los van het speakervolume, en
        # `continue_on_error` houdt een weggevallen Sonos uit het log.
        - alias: Omroepen op de badkamerspeaker
          action: media_player.play_media
          continue_on_error: true
          target:
            entity_id: media_player.badkamer_sonos
          data:
            announce: true
            extra:
              volume: 50
            media:
              media_content_type: music
              media_content_id: >-
                media-source://tts/tts.google_translate_nl_nl?message={{
                'De badkamerdeur staat open.' | urlencode }}
