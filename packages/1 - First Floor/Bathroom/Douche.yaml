##############################################################################
## DOUCHETIMER - elke vijf minuten een knipper, zodat je weet hoe lang je staat
##############################################################################
##
## WAAROM WATERDEBIET EN NIET DE LUCHTVOCHTIGHEID
## Het oorspronkelijke idee was om op de luchtvochtigheid te sturen. Dat werkt,
## maar minder goed dan het lijkt. `sensor.badkamer_badkamer_temperatuur_
## luchtvochtigheid` rapporteert standaard maar eens per 4,9 minuten (wel
## sneller zodra er echt iets verandert, minimaal zo'n 60 seconden ertussen).
##
## Nagemeten op de douchebeurt van 10 augustus 2026:
##
##   20:33:49  water gaat lopen        <- de echte start
##   20:36:23  luchtvochtigheid 56,6 -> 64,8 %   <- pas hier zichtbaar
##
## Tweeënhalve minuut te laat, en dat is precies de fout die je in een
## vijfminutensignaal niet wilt hebben. Erger: de luchtvochtigheid zegt niets
## over het STOPPEN. Na die beurt stond hij nog een uur boven de 70%, dus je
## kunt er niet aan zien of de kraan nog loopt - en dus ook niet of er een
## tweede iemand onder staat.
##
## Het waterdebiet ziet allebei wel. Het is een huisbrede meter, dus de vraag
## was of je een douche eruit kunt pikken. Over 8 t/m 10 augustus geanalyseerd:
## 121 keer liep er ergens water, waarvan 24 keer langer dan anderhalve minuut,
## maar SLECHTS VIER KEER langer dan vier minuten aaneengesloten - en dat waren
## exact de vier douchebeurten van die twee dagen. De eerste knipper valt op
## vijf minuten, dus die zeef is nog een slag strenger dan wat hier gemeten is:
## alles wat korter is (wc, handen, de vaatwasser die vult) haalt hem sowieso
## niet. Met de badkamerlamp erbij als voorwaarde blijft er weinig ruimte voor
## vergissingen over.
##
## De luchtvochtigheid wordt hier dus niet gebruikt. Wil je hem er ooit als
## extra zekerheid bij, dan is de bruikbare drempel +3% binnen 6 minuten: dat
## kwam in een week 29 keer voor, netjes verdeeld over 9 douchebeurten, terwijl
## de normale drift 0,1% per 5 minuten is.
##
## DE TWEEDE DOUCHER
## Die herkent hij, zolang de kraan tussendoor even uit gaat. Een sessie is
## afgelopen als het water twee minuten stilstaat; stapt de volgende er daarna
## in, dan begint de telling gewoon opnieuw bij nul. Twee minuten en niet één,
## want op 10 augustus zat er midden in één douchebeurt een pauze van 62
## seconden - iemand die zich staat in te zepen. Met een kortere drempel telde
## die persoon zichzelf halverwege terug naar nul.
##
## Wat hij NIET ziet: een wisseling waarbij de kraan blijft lopen. Dan is er
## voor deze meter niets gebeurd en telt hij door vanaf de eerste. Daar is met
## een huisbrede waterhoeveelheid niet omheen te komen.
##############################################################################

bathroom_shower_package:
  automation:
    - id: bathroom_shower_timer
      alias: Badkamer - Douchetimer
      description: >-
        Knippert de badkamerlampen elke vijf minuten kort zolang er gedoucht
        wordt, zodat je weet hoe lang je onder de douche staat. Het aantal
        knippers is het aantal blokken van vijf minuten.
      mode: single
      # Silent: gaat de kraan tijdens een lopende sessie even uit en weer aan
      # (inzepen), dan vuurt de starttrigger opnieuw. Die hoort dan niets te
      # doen - de telling loopt al - en zeker geen waarschuwing in het log.
      max_exceeded: silent
      triggers:
        # Een minuut aaneengesloten water. Een wc-spoeling duurt een seconde of
        # vijftien en handen wassen nog minder, dus die komen hier niet doorheen.
        # De meter flikkert tussen 6, 12, 18 en 24 L/min - allemaal boven nul -
        # en valt bij een korte onderbreking even terug op 0; dan begint deze
        # minuut opnieuw. Op 10 augustus leverde dat een start op 20:35:27, dus
        # bijna een minuut eerder dan de luchtvochtigheid het had gezien.
        - trigger: numeric_state
          entity_id: sensor.meterkast_slimhuys_zonneplan_waterdebiet
          above: 0
          for: "00:01:00"
      conditions:
        # De poort die van "er loopt ergens water" een douche maakt.
        - condition: state
          entity_id: light.badkamer_lampen
          state: "on"
      actions:
        - repeat:
            sequence:
              # WACHTEN TOT HET VOLGENDE VIJFMINUTENPUNT, OF TOT HET KLAAR IS
              #
              # De eerste ronde wacht vier minuten en niet vijf: de trigger
              # hierboven vuurt pas nadat het water al een minuut liep, dus die
              # minuut is al verstreken. Zo valt de eerste knipper op het echte
              # vijfminutenpunt van de douche en niet een minuut te laat.
              #
              # `wait_for_trigger` en geen kale `delay`: zo stopt de lus meteen
              # als de douche klaar is, in plaats van pas bij het volgende
              # vijfminutenpunt.
              - wait_for_trigger:
                  - trigger: numeric_state
                    entity_id: sensor.meterkast_slimhuys_zonneplan_waterdebiet
                    below: 1
                    for: "00:02:00"
                  # Een minuut, want de bewegingsmelder haalt het licht tijdens
                  # het douchen af en toe even weg: op 10 augustus ging de lamp
                  # om 20:45:12 uit en om 20:45:16 weer aan. Zonder die minuut
                  # zou dat de telling afbreken.
                  - trigger: state
                    entity_id: light.badkamer_lampen
                    to: "off"
                    for: "00:01:00"
                timeout: "{{ '00:04:00' if repeat.index == 1 else '00:05:00' }}"
                continue_on_timeout: true
              # EÉN UITGANG, EN DIE KIJKT NAAR DE TOESTAND ZELF
              # Niet naar `wait.trigger`, want een `numeric_state`-trigger met
              # `for` heeft een overgang nodig. Valt het debiet net tijdens de
              # knipper hierboven terug naar nul, dan is die overgang al geweest
              # voordat de volgende `wait_for_trigger` staat te kijken en vuurt
              # hij nooit meer - en dan zou de lus vrolijk doorknipperen tot de
              # bovengrens. Deze controle leest gewoon hoe het er nú voor staat
              # en heeft dat probleem niet; de triggers hierboven zijn er alleen
              # om er snel bij te zijn.
              - alias: Douche voorbij of niemand meer in de badkamer
                if:
                  - condition: or
                    conditions:
                      - alias: Water staat al twee minuten stil
                        condition: template
                        value_template: >-
                          {% set s = states.sensor.meterkast_slimhuys_zonneplan_waterdebiet %}
                          {{ s is not none
                             and s.state | float(0) < 1
                             and (now() - s.last_changed).total_seconds() > 120 }}
                      - condition: state
                        entity_id: light.badkamer_lampen
                        state: "off"
                        for: "00:01:00"
                then:
                  - stop: "Douche voorbij"
              - variables:
                  blok: "{{ repeat.index }}"
                  minuten: "{{ repeat.index * 5 }}"
              # Knipperen en omroepen tegelijk, en niet na elkaar: de knippers
              # duren met vijf stuks tien seconden en dan zou de stem daar
              # achteraan komen sukkelen.
              - parallel:
                  # ZOVEEL KNIPPERS ALS ER BLOKKEN VAN VIJF MINUTEN OM ZIJN
                  # Nu er ook een stem is die het getal noemt, is dit vooral
                  # het vangnet: de Sonos kan uit staan, losgekoppeld zijn of
                  # net onbereikbaar. Het licht is er altijd, en tweemaal
                  # knipperen blijft "tien minuten". Boven de vijf houdt het op.
                  - alias: Kort knipperen met de badkamerlampen
                    repeat:
                      count: "{{ [blok | int(1), 5] | min }}"
                      sequence:
                        # `effect: blink` is de Identify-knipper van het
                        # zigbee-apparaat zelf: één commando, geen stand die
                        # onthouden en teruggezet moet worden. Dat is hier het
                        # verschil tussen wel en niet veilig -
                        # dimmen-en-herstellen laat de badkamer op 1% staan
                        # zodra dat tweede commando sneuvelt, en dat gebeurt in
                        # dit huis nu eenmaal.
                        - action: light.turn_on
                          target:
                            entity_id: light.badkamer_lampen
                          data:
                            effect: blink
                          continue_on_error: true
                        - delay: "00:00:02"
                  # `announce: true` is de audioclip-functie van Sonos: hij
                  # duikt onder de muziek door op déze speaker en pakt daarna
                  # de draad weer op. Belangrijk hier, want de badkamerspeaker
                  # hangt tijdens het douchen meestal aan de woonkamergroep
                  # (zie Media.yaml) - zonder announce zou de omroep door het
                  # halve huis gaan.
                  #
                  # De clipvolume staat los van het speakervolume, dus die 50
                  # verandert niets aan de muziek. Het is wel hét getal om te
                  # draaien als het boven een lopende douche niet te verstaan
                  # is; de muziek zelf staat hier op hoogstens 0,15.
                  #
                  # `continue_on_error` omdat een speaker die net weg is de
                  # telling niet mag afbreken - dan blijft het knipperen over.
                  - alias: Omroepen op de badkamerspeaker
                    action: media_player.play_media
                    continue_on_error: true
                    target:
                      entity_id: media_player.badkamer_sonos
                    data:
                      announce: true
                      extra:
                        volume: 50
                      media:
                        media_content_type: music
                        media_content_id: >-
                          media-source://tts/tts.google_translate_nl_nl?message={{
                          ('Je doucht nu ' ~ minuten ~ ' minuten.') | urlencode }}
            # Bovengrens: een uur (twaalf blokken van vijf minuten). Puur een
            # noodrem voor het geval het water blijft lopen en het licht aan
            # blijft.
            until:
              - condition: template
                value_template: "{{ repeat.index >= 12 }}"

    ##########################################################################
    ## VIJFENZEVENTIG LITER
    ##########################################################################
    ##
    ## De minutenteller hierboven zegt hoe lang je staat, deze zegt hoeveel er
    ## doorheen gaat - en dat is niet hetzelfde getal. De douchebeurt van 11
    ## augustus 2026 duurde zeven minuten en kostte 89 liter; 75 liter viel
    ## daarin op 08:13:20, ruim ná de knipper van vijf minuten en ruim vóór die
    ## van tien. Precies daarom staat dit los van die lus: het moment waarop de
    ## 75 liter vol is, valt nu eenmaal niet op een blokgrens.
    ##
    ## EEN APARTE AUTOMATISERING EN GEEN TAK IN DE LUS
    ## In de lus hierboven zou een liter-uitgang de telling verzetten - de
    ## volgende ronde begint dan opnieuw te wachten en het vijfminutenritme
    ## loopt scheef. Los ernaast heeft elk zijn eigen klok.
    ##
    ## WAAROM DE METERSTAND EN NIET HET DEBIET
    ## `sensor.slimhuys_zonneplan_water_totaal` telt in stappen van één liter en
    ## meldt elke stap meteen: tijdens die douchebeurt kwam er gemiddeld elke
    ## vijf seconden een nieuwe waarde binnen. Optellen van het debiet zou een
    ## eigen integratie vragen en zou de foutjes van een sensor die tussen 6,
    ## 12, 18 en 24 L/min heen en weer springt netjes opstapelen.
    ##
    ## HET NULPUNT
    ## Deze begint bij de éérste liter en niet, zoals de minutenteller, pas na
    ## een minuut lopend water: die minuut is bij een douche al gauw twaalf
    ## liter, en dan zou "75 liter" er in werkelijkheid bijna negentig zijn.
    ## De prijs daarvan is dat een wc-spoeling vlak voor het douchen in de
    ## telling meeloopt (een liter of zes). Dat is geen fout: er is dan ook echt
    ## water verbruikt. Blijft het bij die spoeling, dan haalt hij de 75 nooit
    ## en stopt hij vanzelf zodra het water twee minuten stilstaat.
    ##########################################################################
    - id: bathroom_shower_liters
      alias: Badkamer - Douche vijfenzeventig liter
      description: >-
        Zegt eenmalig op de badkamerspeaker dat er 75 liter verbruikt is,
        gerekend vanaf het moment dat de kraan opengaat met de badkamerlamp aan.
      mode: single
      # Zelfde reden als bij de douchetimer: gaat de kraan tijdens het inzepen
      # even uit en weer aan, dan vuurt de trigger opnieuw terwijl de telling
      # al loopt. Dat hoort niets te doen en zeker niets in het log.
      max_exceeded: silent
      triggers:
        - trigger: numeric_state
          entity_id: sensor.meterkast_slimhuys_zonneplan_waterdebiet
          above: 0
      conditions:
        - condition: state
          entity_id: light.badkamer_lampen
          state: "on"
      variables:
        # Automatiseringsvariabelen worden bij het afgaan van de trigger
        # gerenderd, dus dit is de meterstand van het moment dat de kraan
        # opengaat. In liters, want de meter staat in m³.
        start_liter: >-
          {{ states('sensor.slimhuys_zonneplan_water_totaal') | float(0) * 1000 }}
      actions:
        - alias: Wachten op de 75e liter, of op het einde van de douche
          wait_for_trigger:
            - trigger: template
              id: liters
              value_template: >-
                {{ states('sensor.slimhuys_zonneplan_water_totaal') | float(0) * 1000
                   - start_liter >= 75 }}
            # Dezelfde twee einde-signalen als de douchetimer: twee minuten
            # stilstaand water, of een minuut donkere badkamer. Zie de
            # toelichting daar voor waarom het twee en één minuut zijn.
            - trigger: numeric_state
              entity_id: sensor.meterkast_slimhuys_zonneplan_waterdebiet
              below: 1
              for: "00:02:00"
            - trigger: state
              entity_id: light.badkamer_lampen
              to: "off"
              for: "00:01:00"
          # Noodrem, net als de twaalf blokken hierboven: zonder deze zou een
          # einde-signaal dat nooit komt (meter blijft hangen) deze
          # automatisering laten staan, en `mode: single` houdt de volgende
          # douche dan buiten de deur.
          timeout: "01:00:00"
          continue_on_timeout: true
        - alias: Alleen omroepen als het de liters waren en niet het einde
          condition: template
          value_template: "{{ wait.trigger is not none and wait.trigger.id == 'liters' }}"
        # Alleen een stem, geen knippers: het licht telt hier de vijf minuten
        # en een extra knipper zou als een blok gelezen worden.
        - alias: Omroepen op de badkamerspeaker
          action: media_player.play_media
          continue_on_error: true
          target:
            entity_id: media_player.badkamer_sonos
          data:
            announce: true
            extra:
              volume: 50
            media:
              media_content_type: music
              media_content_id: >-
                media-source://tts/tts.google_translate_nl_nl?message={{
                'Je hebt nu vijfenzeventig liter water verbruikt.' | urlencode }}
