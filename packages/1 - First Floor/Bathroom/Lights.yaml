bathroom_lights_package:

  binary_sensor:
    - platform: group
      unique_id: pir_sensors_bathroom
      name: PIR Group Bathroom
      entities:
        - binary_sensor.badkamer_beweging_achter_occupancy
        - binary_sensor.badkamer_beweging_voor_occupancy

  input_number:
    lights_bathroom_percentage:
      name: "Lights Bathroom - Percentage"
      min: 0
      max: 100
      step: 1
      icon: mdi:lightbulb-on-70

  input_boolean:
    enable_pir_bathroom:
      name: "PIR in Bathroom"
      icon: mdi:motion-sensor

  automation:
    - id: lights_movement_bathroom
      alias: Bathroom - Lights
      description: "Turn on the lights of the bathroom if there is movement detected"
      use_blueprint:
        path: robin/motion_light.yaml
        input:
          bewegingssensor: binary_sensor.pir_group_bathroom
          deur_contacten:
            - binary_sensor.badkamer_deur_contact
          lamp: light.badkamer_spots
          schakelaar: input_boolean.enable_pir_bathroom
          helderheid: input_number.lights_bathroom_percentage

    # De helderheid-helper wordt hieronder met de zon meegeschakeld: fel
    # overdag, gedimd 's avonds en 's nachts. De blueprint leest de helper bij
    # elke beweging, dus dit werkt automatisch door.
    - id: lights_change_brightness_bathroom
      alias: Bathroom - Lights Change Brightness
      description: "Change the brightness at sunset and sunrise in the bathroom"
      mode: single
      triggers:
        - trigger: sun
          event: sunset
          offset: 0
          id: sunset
        - trigger: sun
          event: sunrise
          offset: 0
          id: sunrise
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - sunset
              sequence:
                - action: input_number.set_value
                  metadata: {}
                  data:
                    value: 5
                  target:
                    entity_id: input_number.lights_bathroom_percentage
            - conditions:
                - condition: trigger
                  id:
                    - sunrise
              sequence:
                - action: input_number.set_value
                  metadata: {}
                  data:
                    value: 80
                  target:
                    entity_id: input_number.lights_bathroom_percentage
