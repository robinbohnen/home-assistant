corridor_lights_package:

  input_number:
    lights_corridor_percentage:
      name: "Lights Corridor - Percentage"
      min: 0
      max: 100
      step: 1
      icon: mdi:lightbulb-on-70

  input_boolean:
    enable_pir_corridor:
      name: "PIR in Corridor"
      icon: mdi:motion-sensor

  automation:
    - id: lights_movement_corridor
      alias: Corridor - Lights
      description: "Turn on the lights of the corridor if there is movement detected"
      use_blueprint:
        path: robin/motion_light.yaml
        input:
          bewegingssensor: binary_sensor.overloop_beweging_occupancy
          lamp: light.overloop_lampen
          schakelaar: input_boolean.enable_pir_corridor
          helderheid: input_number.lights_corridor_percentage
          # 's NACHTS GEEN BEWEGINGSLICHT (Robin, 12 augustus 2026)
          # Op 11 augustus gingen hier alle blokkades eruit; een nacht later
          # bleek de bedtijdrem wél gewenst: tussen bedtijd en opstaan hoeft de
          # overloop niet aan te floepen van iedere beweging. De lux-drempel
          # blijft eruit, die zei niets over hoe donker het híer is.
          #
          # Het venster loopt van de laatste bedtijd tot het huis zichzelf
          # wakker meldt en staat in binary_sensor.huis_slaapt (gedefinieerd
          # naast binary_sensor.bedtime_kids in Bedroom Maxi/Bedtime.yaml; daar
          # staat ook waarom het die twee helften zijn). De overloop zolder
          # leest dezelfde sensor - twee kopieën van dit venster is precies hoe
          # de kamers vóór de blueprint uit elkaar liepen.
          #
          # Alleen het AANzetten wordt geblokkeerd; uitzetten gaat er buitenom
          # (zie de blueprint), anders blijft een lamp die om 20:55 aanging de
          # hele nacht branden.
          #
          # Doet Mini na zonsondergang haar deur open, dan gaan beide overlopen
          # gewoon aan - dat doet automation.bedroom_mini_lights_doors_open
          # rechtstreeks (Bedroom Mini/Lights.yaml) en niet via deze blueprint,
          # dus daar raakt dit venster niet aan.
          #
          # Een template-conditie en geen state-conditie op "off": is de sensor
          # er even niet, dan hoort het licht gewoon te werken.
          aan_blokkades:
            - alias: "Niet tussen bedtijd en opstaan"
              condition: template
              value_template: "{{ not is_state('binary_sensor.huis_slaapt', 'on') }}"
