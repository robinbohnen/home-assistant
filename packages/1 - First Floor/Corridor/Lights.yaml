corridor_lights_package:

  input_number:
    lights_corridor_percentage:
      name: "Lights Corridor - Percentage"
      min: 0
      max: 100
      step: 1
      icon: mdi:lightbulb-on-70

  input_boolean:
    enable_pir_corridor:
      name: "PIR in Corridor"
      icon: mdi:motion-sensor

  automation:
    - id: lights_movement_corridor
      alias: Corridor - Lights
      description: "Turn on the lights of the corridor if there is movement detected"
      use_blueprint:
        path: robin/motion_light.yaml
        input:
          bewegingssensor: binary_sensor.overloop_beweging_occupancy
          lamp: light.overloop_lampen
          schakelaar: input_boolean.enable_pir_corridor
          helderheid: input_number.lights_corridor_percentage
          # BEWUST GEEN BLOKKADES (Robin, 11 augustus 2026)
          # Hier stonden twee: geen licht na de bedtijd van de kinderen, en
          # geen licht boven 20.000 lux buiten. Allebei eruit - beweging of een
          # deur die opengaat is voortaan het enige dat telt, en dan gaat de
          # lamp ook aan. Op de overloop is in het donker struikelen erger dan
          # een streep licht onder een slaapkamerdeur, en het buitenlicht zegt
          # weinig over hoe donker het híer is.
          #
          # Wil je de bedtijdrem terug, dan is dit de vorm (alleen het
          # aanzetten blokkeren, nooit het uitzetten - anders blijft een lamp
          # die net vóór bedtijd aanging de hele nacht branden):
          #
          #   aan_blokkades:
          #     - condition: not
          #       conditions:
          #         - condition: time
          #           after: input_datetime.bedtime_maxi
          #           before: "07:15:00"
