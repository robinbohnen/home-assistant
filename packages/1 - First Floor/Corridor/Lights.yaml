corridor_lights_package:

  input_number:
    lights_corridor_percentage:
      name: "Lights Corridor - Percentage"
      min: 0
      max: 100
      step: 1
      icon: mdi:lightbulb-on-70

  input_boolean:
    enable_pir_corridor:
      name: "PIR in Corridor"
      icon: mdi:motion-sensor

  automation:
    - id: lights_movement_corridor
      alias: Corridor - Lights
      description: "Turn on the lights of the corridor if there is movement detected"
      use_blueprint:
        path: robin/motion_light.yaml
        input:
          bewegingssensor: binary_sensor.overloop_beweging_occupancy
          lamp: light.overloop_lampen
          schakelaar: input_boolean.enable_pir_corridor
          helderheid: input_number.lights_corridor_percentage
          # Na bedtijd van de kinderen geen licht op de overloop; ouders die
          # langslopen zouden anders licht onder de slaapkamerdeuren door laten
          # schijnen. Alleen het aanzetten wordt geblokkeerd: uitzetten na de
          # wachttijd mag altijd, anders blijft een lamp die net vóór bedtijd
          # aanging de hele nacht branden.
          aan_blokkades:
            - condition: not
              conditions:
                - condition: time
                  after: input_datetime.bedtime_maxi
                  before: "07:15:00"
            - condition: not
              conditions:
                - condition: time
                  after: input_datetime.bedtime_mini
                  before: "07:15:00"
          # Overdag bij vol daglicht hoeft hier geen lamp aan; zie de
          # toelichting bij de speelkamer voor de drempelkeuze.
          lux_sensor: sensor.buiten_zon_luminance_max
          lux_drempel: 20000
