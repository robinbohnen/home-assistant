bedroom_lights_package:
  automation:
    - id: bedroom_lights_onoff
      alias: Bedroom - Lights
      description: Automate lights when certain conditions are met
      use_blueprint:
        path: robin/lights_onoff.yaml
        input:
          lamp:
            - light.slaapkamer_lampen
          # Alleen doven bij vertrek: licht dat vanzelf aanspringt zodra de
          # voordeur opengaat is in de slaapkamer niet gewenst.
          aan_bij_thuiskomst: false
          # Bewust geen knop_triggers: de welterustenknop staat hier naast het
          # bed en dooft de rest van het huis. Zou hij deze lamp ook doven, dan
          # sta je in het donker terwijl je nog moet gaan liggen.

    - id: bedroom_lights_doorbell
      alias: Bedroom - Lights on Doorbell Ring
      description: Flash lights when we are in bed and doorbell is ringed
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - binary_sensor.g4_doorbell_voortuin_doorbell
          to: "on"
      conditions:
        - condition: numeric_state
          entity_id: cover.slaapkamer_rolluik
          attribute: current_position
          below: 16
        - condition: time
          after: "19:30:00"
          before: "09:30:00"
      actions:
        - action: light.turn_on
          metadata: {}
          data:
            effect: breathe
            brightness_pct: 25
          target:
            entity_id: light.slaapkamer_lampen
        - delay:
            hours: 0
            minutes: 2
            seconds: 0
            milliseconds: 0
        - action: light.turn_off
          metadata: {}
          data: {}
          target:
            entity_id: light.slaapkamer_lampen
