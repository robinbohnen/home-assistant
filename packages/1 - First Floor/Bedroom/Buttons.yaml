bedroom_buttons_package:
  automation:
    - id: bedroom_buttons_pressed
      alias: Bedroom - Buttons pressed
      description: When someone touches the buttons in the slaapkamer
      mode: single
      triggers:
        - domain: mqtt
          device_id: !secret bedroom_button_1
          type: action
          subtype: single
          trigger: device
          id: single
        - domain: mqtt
          device_id: !secret bedroom_button_2
          type: action
          subtype: single
          trigger: device
          id: single
        - domain: mqtt
          device_id: !secret bedroom_button_1
          type: action
          subtype: double
          trigger: device
          id: double
        - domain: mqtt
          device_id: !secret bedroom_button_2
          type: action
          subtype: double
          trigger: device
          id: double
        - domain: mqtt
          device_id: !secret bedroom_button_1
          type: action
          subtype: hold
          trigger: device
          id: hold
        - domain: mqtt
          device_id: !secret bedroom_button_2
          type: action
          subtype: hold
          trigger: device
          id: hold
        # Virtuele drukken via script.virtual_button_press — zelfde trigger-id's
        # als de fysieke knoppen hierboven, zie packages/9 - Other/Virtual Buttons.yaml
        - trigger: event
          event_type: virtual_button
          event_data:
            button: bedroom_buttons
            action: single
          id: single
        - trigger: event
          event_type: virtual_button
          event_data:
            button: bedroom_buttons
            action: double
          id: double
        - trigger: event
          event_type: virtual_button
          event_data:
            button: bedroom_buttons
            action: hold
          id: hold
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - single
                    - hold
              sequence:
                - choose:
                    - conditions:
                        - condition: time
                          after: "06:00:00"
                          before: "17:00:00"
                      sequence:
                        - if:
                            - condition: state
                              entity_id: lock.kroon18voordeur
                              state: locked
                          then:
                            - action: lock.unlock
                              metadata: {}
                              data: {}
                              target:
                                entity_id: lock.kroon18voordeur
                          alias: Unlock lock
                      alias: Wake up
                    - conditions:
                        - condition: time
                          after: "17:00:00"
                          before: "06:00:00"
                      sequence:
                        - if:
                            - condition: state
                              entity_id: alarm_control_panel.alarmo
                              state: disarmed
                          then:
                            - action: alarm_control_panel.alarm_arm_home
                              metadata: {}
                              data: {}
                              target:
                                entity_id: alarm_control_panel.alarmo
                          alias: Turn on alarm
                        - action: climate.turn_off
                          target:
                            entity_id: climate.airco_woonkamer
                          data: {}
                          continue_on_error: true
                        # De zolderairco is vaak onbereikbaar: apart script dat
                        # het blijft proberen, zie packages/2 - Second Floor/Attic/AC.yaml.
                        # Via script.turn_on zodat de rest van de knopactie niet wacht.
                        - action: script.turn_on
                          target:
                            entity_id: script.script_attic_ac_off
                          data: {}
                        - action: cover.set_cover_position
                          metadata: {}
                          data:
                            position: 15
                          target:
                            entity_id: cover.slaapkamer_rolluik_low_speed
                      alias: Go to bed
            - conditions:
                - condition: trigger
                  id:
                    - double
              sequence:
                - action: light.toggle
                  metadata: {}
                  data: {}
                  target:
                    entity_id: light.slaapkamer_lampen
