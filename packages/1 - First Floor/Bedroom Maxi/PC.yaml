##############################################################################
## DE PC VAN LOGAN
##
## De stekker `switch.slaapkamer_logan_slaapkamer_maxi_stopcontact_apparatuur`
## staat altijd aan; wat je eraan ziet is het vermogen. Dat is bimodaal en
## scherp gescheiden - gemeten over 17 en 18 augustus 2026 (2.472 metingen):
##
##     rust  :   8 -  29 W   (monitor uit, laders, wat sluimert)
##     pc aan:  70 - 233 W   (zwaartepunt 140-230 W)
##
## Daartussen zit vrijwel niets: tussen 30 en 69 W vielen 3 van de 2.472
## metingen, en dat waren aan- en uitloopjes. 50 W ligt dus in het midden van
## een leeg gebied en niet op een grens waar hij van kan gaan flapperen.
##
## EEN DAGTOTAAL, GEEN SESSIETELLER
## Dit stond eerst op "anderhalf uur onafgebroken aan". Dat is precies het
## soort regel waar een kind omheen leert lopen: pc uit, vijf minuten wachten,
## pc weer aan en de teller staat op nul - je mag dan de hele dag gamen in
## blokken van 89 minuten. Sinds 22 augustus 2026 telt daarom niet de sessie
## maar de dag: `sensor.pc_logan_gametijd` is alle pc-tijd van vandaag bij
## elkaar opgeteld. Uitzetten pauzeert die teller, hij zet hem niet terug.
##
## Zodra dat dagtotaal over de limiet gaat wordt er gepord. Zet hij hem daarna
## uit en weer aan, dan begint het porren meteen opnieuw - het dagtotaal staat
## dan immers nog steeds boven de limiet.
##
## DE LIMIET IS EEN HELPER
## `input_number.pc_logan_gametijd_limiet` (in minuten, standaard 90). Draaien
## kan gewoon in de UI, zonder deze file aan te raken; vakantie ruimer, week
## voor een toets krapper. Alle teksten hieronder rekenen het getal zelf om
## naar "1 uur en 30 minuten", dus er staat nergens nog "anderhalf uur".
##
## HOE HET PORREN GAAT
## Het blijft niet bij die ene melding: zolang de pc aan blijft komt hij elke
## twee minuten terug, nu ook met knipperend licht. Dat is hetzelfde idee als
## de douchetimer in packages/1 - First Floor/Bathroom/Douche.yaml - stem én
## licht, want de Sonos kan uit staan en het licht is er altijd. Het stopt
## vanzelf zodra de pc uitgaat, en houdt na een half uur op met porren.
##############################################################################

pc_logan_package:

  input_number:
    # Geen `initial:`, om dezelfde reden als bij de ventilatiedrempels in
    # packages/9 - Other/Ventilation.yaml: `initial` zet je eigen instelling
    # bij ELKE herstart terug naar de fabriekswaarde. De automatisering
    # `bedroom_maxi_pc_gametijd_limiet_vullen` onderaan vult hem eenmalig op
    # 90; wat je daarna zelf draait blijft staan.
    pc_logan_gametijd_limiet:
      name: "PC Logan - Gametijd per dag"
      icon: mdi:timer-cog-outline
      min: 15
      max: 480
      step: 15
      unit_of_measurement: min
      mode: box

  sensor:
    ##########################################################################
    ## Hoeveel pc-tijd zit er vandaag op
    ##
    ## DE DAG LOOPT VAN 05:00 TOT 05:00 EN NIET VAN MIDDERNACHT
    ## Met een grens op middernacht zou een sessie die doorloopt tot half een
    ## precies daar op nul springen - hetzelfde gat als het uit-en-weer-aan
    ## dat we hier dichten, alleen dan met de klok als medeplichtige. Om 05:00
    ## slaapt iedereen en is de vorige dag echt afgelopen.
    ##
    ## Deze telt in uren (dat kan history_stats niet anders); de sensor in
    ## minuten staat hieronder bij de template-blokken.
    ##########################################################################
    - platform: history_stats
      name: pc_logan_gametijd_vandaag_uren
      unique_id: pc_logan_gametijd_vandaag_uren
      entity_id: binary_sensor.pc_logan_aan
      state: "on"
      type: time
      start: >-
        {{ today_at('05:00') if now() >= today_at('05:00')
           else today_at('05:00') - timedelta(days=1) }}
      end: "{{ now() }}"

  template:
    - binary_sensor:
        # `delay_on` van twee minuten: een pc die opstart trekt meteen stroom,
        # maar een stofzuiger of een föhn in datzelfde stopcontact ook. Twee
        # minuten is te lang voor die twee en te kort om van een echte sessie
        # iets te missen.
        #
        # `delay_off` STOND OP VIJF MINUTEN EN MAG NU KORTER
        # Die vijf minuten waren er om te voorkomen dat een pc in slaapstand
        # de sessieteller op nul zette. Die teller is er niet meer - het
        # dagtotaal hierboven pauzeert bij een slaapstand en telt daarna
        # gewoon door - dus die reden is vervallen. Wat de vijf minuten wél
        # deden is elke sessie vijf minuten te lang laten meetellen in dat
        # dagtotaal. Drie minuten is nog steeds ruim genoeg om een monitor die
        # even uitvalt of een filmpje in beeldscherm-uit niet als "pc uit" te
        # lezen, en houdt de telling eerlijk: twee minuten te laat aan, drie
        # minuten te laat uit, netto één minuut per sessie.
        - name: pc_logan_aan
          unique_id: pc_logan_aan
          icon: mdi:desktop-tower-monitor
          device_class: running
          delay_on: "00:02:00"
          delay_off: "00:03:00"
          # Een stekker die niets meldt is geen pc die aanstaat: `float(-1)`
          # houdt hem uit.
          state: >
            {{ states('sensor.slaapkamer_logan_slaapkamer_maxi_stopcontact_apparatuur_vermogen')
               | float(-1) >= 50 }}
          attributes:
            watt: >
              {{ states('sensor.slaapkamer_logan_slaapkamer_maxi_stopcontact_apparatuur_vermogen')
                 | float(-1) | round(0) | int }}
            # De porlus hieronder leest deze drempel uit in plaats van de 50
            # nog een keer op te schrijven. Draai je hem hier, dan draait het
            # porren mee.
            drempel: 50

    - sensor:
        # Hetzelfde dagtotaal, maar in hele minuten. Dat is niet alleen
        # prettiger lezen dan "1.53 uur": de trigger hieronder vergelijkt hem
        # rechtstreeks met `input_number.pc_logan_gametijd_limiet`, en een
        # `numeric_state`-trigger kan geen eenheden omrekenen. Beide in
        # minuten dus, anders vergelijk je uren met minuten en gaat het
        # ongemerkt mis.
        - name: pc_logan_gametijd
          unique_id: pc_logan_gametijd
          icon: mdi:timer-play-outline
          unit_of_measurement: min
          device_class: duration
          state_class: measurement
          # Zonder deze regel zou een history_stats die nog aan het opstarten
          # is als "0 minuten" gelezen worden, en dan telt een dag waarop hij
          # allang over de limiet zit even opnieuw vanaf nul.
          availability: "{{ has_value('sensor.pc_logan_gametijd_vandaag_uren') }}"
          state: >
            {{ (states('sensor.pc_logan_gametijd_vandaag_uren') | float(0) * 60)
               | round(0) | int }}
          attributes:
            limiet_minuten: >
              {{ states('input_number.pc_logan_gametijd_limiet')
                 | float(90) | round(0) | int }}
            over_limiet: >
              {{ states('sensor.pc_logan_gametijd_vandaag_uren') | float(0) * 60
                 > states('input_number.pc_logan_gametijd_limiet') | float(90) }}

  script:
    ##########################################################################
    ## Omroepen op de Sonos van Logan
    ##
    ## Stond eerst als losse acties in de automatisering hieronder. Nu het
    ## bericht ook elke twee minuten herhaald wordt, zou die hele mute-dans
    ## er twee keer in staan - en dan is het een kwestie van tijd tot iemand
    ## er één van bijwerkt.
    ##########################################################################
    pc_logan_omroepen:
      alias: PC Logan - Omroepen op zijn Sonos
      description: >-
        Zegt een zin op de Sonos van Logan, ook als die gemute is en ook als
        er muziek op staat. Zet mute daarna terug zoals hij hem aantrof.
      icon: mdi:bullhorn
      # `single`: er is één aanroeper (de automatisering hieronder) en die
      # roept netjes na elkaar aan. Zou er ooit een tweede bij komen, maak er
      # dan `queued` van - `single` laat de tweede omroep stilletjes vallen.
      mode: single
      fields:
        bericht:
          name: Bericht
          description: Wat er omgeroepen wordt
          required: true
          example: Logan, je gametijd voor vandaag is op.
          selector:
            text:
      sequence:
        # DE SPEAKER KAN GEMUTE ZIJN, EN STAAT VAAK ZACHT
        # `announce: true` speelt een audioclip met een eigen volume (`extra`),
        # los van het speakervolume - dat staat hier op 5%, dus zonder die clip
        # zou dit niets worden. Wat die clip NIET met zekerheid overstemt is de
        # mute-knop: afhankelijk van het model speelt Sonos een clip via de
        # audioClip-API (mute maakt niet uit) of via snapshot-afspelen-herstellen
        # (mute maakt wél uit). Daarom zetten we mute hier zelf even uit en
        # daarna terug - dat kost twee commando's en haalt de twijfel weg.
        - variables:
            was_gemute: >-
              {{ state_attr('media_player.slaapkamer_maxi_sonos',
                            'is_volume_muted') | bool(false) }}
        - if:
            - condition: template
              value_template: "{{ was_gemute }}"
          then:
            - action: media_player.volume_mute
              continue_on_error: true
              target:
                entity_id: media_player.slaapkamer_maxi_sonos
              data:
                is_volume_muted: false
            # Even lucht tussen ontdempen en de clip: Sonos neemt het commando
            # aan voordat hij het uitgevoerd heeft.
            - delay: "00:00:01"
        - alias: Omroepen op de Sonos van Logan
          action: media_player.play_media
          # Een speaker die net van het net is mag de rest van deze run niet
          # afbreken - dan blijft de mute hieronder namelijk uit staan.
          continue_on_error: true
          target:
            entity_id: media_player.slaapkamer_maxi_sonos
          data:
            announce: true
            extra:
              volume: 50
            media:
              media_content_type: music
              media_content_id: >-
                media-source://tts/tts.google_translate_nl_nl?message={{
                bericht | urlencode }}
        - if:
            - condition: template
              value_template: "{{ was_gemute }}"
          then:
            # Wachten tot de clip klaar is, anders dempen we onze eigen omroep.
            # Tien seconden is ruim voor een zin van drie tellen.
            - delay: "00:00:10"
            - action: media_player.volume_mute
              continue_on_error: true
              target:
                entity_id: media_player.slaapkamer_maxi_sonos
              data:
                is_volume_muted: true

  automation:
    ##########################################################################
    ## De gametijd van vandaag is op
    ##
    ## TWEE TRIGGERS, ÉÉN VERVOLG
    ## 1. Het dagtotaal gaat over de limiet heen. Dat is de gewone: hij zit te
    ##    gamen en de tijd raakt op.
    ## 2. De pc gaat aan terwijl het dagtotaal al over de limiet is. Dit is de
    ##    trigger die het uit-en-weer-aan afvangt: trigger 1 vuurt maar één
    ##    keer per dag (hij kan die grens maar één keer passeren), dus zonder
    ##    deze tweede zou een herstart na het porren gratis zijn.
    ##
    ## Daarna houdt de run zichzelf aan tot de pc uitgaat (of tot het half uur
    ## porren om is). Komt trigger 2 langs terwijl er al gepord wordt, dan laat
    ## `mode: single` hem stilletjes vallen - dat is precies goed, hij wordt al
    ## gepord.
    ##
    ## LET OP bij een herstart van Home Assistant: het dagtotaal komt uit de
    ## recorder en overleeft een herstart dus wél, maar een lopende porlus niet.
    ## Zat hij op dat moment over de limiet met de pc aan, dan pakt trigger 2
    ## hem opnieuw zodra de sensor weer 'on' meldt.
    ##########################################################################
    # De `id` blijft met opzet `..._anderhalf_uur` heten, ook al gaat het daar
    # niet meer over: aan die id hangt HA de bestaande entiteit
    # `automation.bedroom_maxi_pc_staat_anderhalf_uur_aan` met zijn historie en
    # zijn aan/uit-stand. Hernoemen levert een nieuwe entiteit op en laat de
    # oude als wees in het register achter. De alias (wat je in de UI ziet)
    # klopt weer wel.
    - id: bedroom_maxi_pc_anderhalf_uur
      alias: Bedroom Maxi - Gametijd van Logan is op
      description: >-
        Roept op de Sonos van Logan om zodra zijn pc-tijd van vandaag over de
        limiet uit `input_number.pc_logan_gametijd_limiet` gaat, en herhaalt
        dat elke twee minuten met knipperend licht zolang hij hem aan laat
        staan. Zet hij de pc uit en weer aan terwijl de tijd al op is, dan
        begint het porren opnieuw.
      mode: single
      max_exceeded: silent
      triggers:
        - id: limiet_bereikt
          trigger: numeric_state
          entity_id: sensor.pc_logan_gametijd
          above: input_number.pc_logan_gametijd_limiet
        - id: weer_aan
          trigger: state
          entity_id: binary_sensor.pc_logan_aan
          to: "on"
          # Een sensor die na een herstart uit 'unknown' komt opborrelen is geen
          # pc die net aanging; zelfde guard als op de deur- en raamtriggers
          # elders in dit huis.
          not_from:
            - unknown
            - unavailable
      conditions:
        # DRAAIT HIJ OP DIT MOMENT ECHT?
        # Geen tijdvenster - het bericht aan de ouders gaat ALTIJD, ook 's
        # nachts; alleen de omroep en de knipper hieronder kijken naar de klok.
        # Wat hier wél weggefilterd wordt is de samenloop waarin het dagtotaal
        # de limiet passeert op het moment dat hij de pc net uitzet: dan is er
        # niemand om te porren en zou de eerste melding alsnog vertrekken. Het
        # vermogen is bij het echte werk binnen seconden, de sensor met zijn
        # `delay_off` niet - dus hier het vermogen.
        - condition: template
          value_template: >-
            {{ states('sensor.slaapkamer_logan_slaapkamer_maxi_stopcontact_apparatuur_vermogen')
               | float(-1)
               >= state_attr('binary_sensor.pc_logan_aan', 'drempel') | int(50) }}
        # Bij trigger 2 moet de tijd al op zijn; bij trigger 1 is dat per
        # definitie zo. Een pc die 's ochtends voor het eerst aangaat mag geen
        # melding opleveren.
        - condition: template
          value_template: >-
            {{ states('sensor.pc_logan_gametijd') | float(0)
               > states('input_number.pc_logan_gametijd_limiet') | float(90) }}
      variables:
        # De limiet als tekst, bijvoorbeeld "1 uur en 30 minuten". Het anker is
        # er omdat de porlus dit opnieuw uitrekent: een variabele op dit niveau
        # wordt één keer gerenderd, bij de trigger, en tijdens een half uur
        # porren kan iemand de helper draaien.
        limiet_tekst: &limiettekst >-
          {% set m = states('input_number.pc_logan_gametijd_limiet')
                     | float(90) | round(0) | int %}
          {% set u = m // 60 %}{% set r = m % 60 %}
          {{ (u ~ ' uur') if u else '' }}{{ ' en ' if u and r else ''
          }}{{ (r ~ (' minuut' if r == 1 else ' minuten')) if r or not u else '' }}
        # Hoeveel er vandaag al op zit, in dezelfde vorm.
        gebruikt_tekst: &gebruikttekst >-
          {% set m = states('sensor.pc_logan_gametijd') | float(0) | round(0) | int %}
          {% set u = m // 60 %}{% set r = m % 60 %}
          {{ (u ~ ' uur') if u else '' }}{{ ' en ' if u and r else ''
          }}{{ (r ~ (' minuut' if r == 1 else ' minuten')) if r or not u else '' }}
        # Sinds wanneer de pc nu onafgebroken aanstaat. Alleen ter informatie
        # in het bericht aan de ouders - de teller hangt er niet meer aan. Dit
        # is het moment waarop de sensor aanging, dus zo'n twee minuten ná de
        # pc zelf (de `delay_on` hierboven). Leeg als hij niet aanstaat, en dan
        # blijft de zin er ook uit.
        sinds: &sindstekst >-
          {% set s = states.binary_sensor.pc_logan_aan %}
          {{ (s.last_changed | as_local | as_timestamp | timestamp_custom('%H:%M'))
             if s is not none and s.state == 'on' else '' }}
        # Het venster voor de omroep: van 07:00 tot Logans eigen bedtijd. Een
        # omroep om kwart over acht 's avonds gaat dus gewoon door - dat is juist
        # het moment dat hij helpt.
        #
        # NIET `binary_sensor.huis_slaapt`, hoe verleidelijk ook: die blijft
        # 's ochtends aan tot iemand het huis wakker meldt (de slaapkamerknop,
        # uiterlijk 12:00). Een zaterdagochtendsessie van 09:00 tot 10:30 zou
        # daarmee stilletjes overgeslagen worden.
        #
        # Vrijdag en zaterdag telt de weekendbedtijd; dat is dezelfde verdeling
        # als de bedtijd-markers op de tijdlijn (`wd === 5 || wd === 6` daar,
        # weekday() 4 en 5 hier - beide vrijdag en zaterdag). Staat een helper
        # op onzin, dan valt hij terug op 21:30.
        omroepen: &omroepvenster >-
          {% set helper = 'input_datetime.bedtime_maxi_weekend'
                          if now().weekday() in [4, 5]
                          else 'input_datetime.bedtime_maxi' %}
          {% set bed = states(helper) %}
          {% set bed = bed if ':' in bed else '21:30:00' %}
          {{ now() >= today_at('07:00') and now() < today_at(bed) }}
        # Hoe vaak er na de eerste melding nog gepord wordt: 15 x 2 minuten is
        # een half uur. Dit is het enige getal dat je hoeft te draaien als het
        # te veel of te weinig blijkt.
        herhalingen: 15
      actions:
        # EERST DE OUDERS, DAN DE SPEAKER
        # De omroep hieronder doet er met ontdempen en herstellen ruim tien
        # seconden over; dat hoeft het bericht niet af te wachten. De vaste tag
        # zorgt dat een volgende sessie de vorige melding vervangt in plaats van
        # een stapel op te bouwen - en dat de herhalingen hieronder de telefoon
        # niet volstapelen.
        - alias: Bericht aan de ouders
          action: notify.mobile_devices_adults
          data:
            title: >-
              {{ 'Gametijd Logan - pc weer aan' if trigger.id == 'weer_aan'
                 else 'Gametijd Logan - tijd is op' }}
            message: >-
              {% if trigger.id == 'weer_aan' %}
              Logan heeft zijn pc weer aangezet terwijl zijn gametijd op is.{%
              endif %}
              Vandaag staat hij {{ gebruikt_tekst }} aan; de limiet is
              {{ limiet_tekst }}.
              {{ 'Deze sessie loopt sinds ' ~ sinds ~ '.' if sinds else '' }}
              {{ 'Hij heeft het net op zijn Sonos gehoord.' if omroepen
                 else 'Het is buiten de omroeptijden, dus er is niets omgeroepen.' }}
            data: &meldingdata
              tag: pc-logan-gametijd
              notification_icon: mdi:desktop-tower-monitor
        - alias: Omroepen, maar niet 's nachts
          if:
            - condition: template
              value_template: "{{ omroepen }}"
          then:
            - action: script.pc_logan_omroepen
              data:
                bericht: >-
                  {% if trigger.id == 'weer_aan' %}
                  Logan, je gametijd voor vandaag is al op. Zet je computer uit.
                  {% else %}
                  Logan, je hebt vandaag {{ gebruikt_tekst }} achter je computer
                  gezeten. Je gametijd van {{ limiet_tekst }} is op.
                  {% endif %}

        ######################################################################
        ## PORREN TOT DE PC UIT IS
        ##
        ## NIET OP `binary_sensor.pc_logan_aan` KIJKEN
        ## Die heeft `delay_off`, en dat is precies wat je hier niet wil: Logan
        ## zet de pc uit en krijgt daarna nog een stem en een knipperlamp over
        ## zich heen. Het vermogen zelf is er binnen seconden bij. De drempel
        ## komt uit het attribuut van de sensor, zodat hij maar op één plek
        ## staat.
        ######################################################################
        - alias: Blijft hij aan, dan elke twee minuten opnieuw
          repeat:
            sequence:
              # Twee minuten wachten, maar meteen door zodra het vermogen
              # inzakt. Een stekker die niets meldt levert -1 op en telt dus
              # als uit: bij twijfel houden we op met porren.
              - alias: Twee minuten wachten, tenzij de pc eerder uitgaat
                wait_template: >-
                  {{ states('sensor.slaapkamer_logan_slaapkamer_maxi_stopcontact_apparatuur_vermogen')
                     | float(-1)
                     < state_attr('binary_sensor.pc_logan_aan', 'drempel') | int(50) }}
                timeout: "00:02:00"
                continue_on_timeout: true
              - alias: Pc is uit - klaar
                if:
                  - condition: template
                    value_template: "{{ wait.completed }}"
                then:
                  - stop: "De pc is uit"

              - variables:
                  # Opnieuw uitrekenen, zie de ankers hierboven.
                  omroepen: *omroepvenster
                  limiet_tekst: *limiettekst
                  gebruikt_tekst: *gebruikttekst
                  sinds: *sindstekst

              - alias: Bericht aan de ouders
                action: notify.mobile_devices_adults
                data:
                  title: Gametijd Logan - pc staat nog aan
                  message: >-
                    De pc van Logan staat nog steeds aan. Vandaag is dat
                    {{ gebruikt_tekst }}, bij een limiet van {{ limiet_tekst }}.
                    {{ 'Deze sessie loopt sinds ' ~ sinds ~ '.' if sinds else '' }}
                    {{ 'Hij hoort het op zijn Sonos en zijn licht knippert.'
                       if omroepen
                       else 'Het is buiten de omroeptijden, dus er klinkt en knippert niets.' }}
                  data: *meldingdata

              # Buiten de omroeptijden alleen het bericht naar boven. De
              # knipper valt onder dezelfde regel als de stem: ligt hij te
              # slapen met de pc aan, dan is dit niet het moment om zijn kamer
              # te laten flitsen. Wil je dat wél, haal deze `if` dan weg -
              # maar niet alleen voor het licht, want dan wordt hij wakker van
              # een lamp zonder te horen waarom.
              - alias: Stem en licht, maar niet 's nachts
                if:
                  - condition: template
                    value_template: "{{ omroepen }}"
                then:
                  # Tegelijk en niet na elkaar, net als bij de douchetimer: de
                  # omroep doet er met de mute-dans ruim tien seconden over en
                  # dan zou het knipperen daar achteraan komen sukkelen.
                  - parallel:
                      - alias: Omroepen op de Sonos van Logan
                        action: script.pc_logan_omroepen
                        data:
                          bericht: >-
                            Logan, je computer staat nog steeds aan. Zet hem uit.
                      - alias: Knipperen met de lampen van Logan
                        sequence:
                          # `effect: blink` is de Identify-knipper van het
                          # zigbee-apparaat zelf: één commando, geen stand die
                          # onthouden en teruggezet moet worden. Wat het wél
                          # doet is de lamp aanzetten (de service heet niet
                          # voor niets `light.turn_on`), en dat moet terug als
                          # hij in het donker zat te gamen. Vandaar deze ene
                          # uitlezing vooraf - géén helderheid of kleur
                          # onthouden, want dat is precies het herstellen dat
                          # de badkamerlampen ooit op 1% liet staan.
                          - variables:
                              licht_stond_uit: >-
                                {{ is_state('light.slaapkamer_maxi_lampen', 'off') }}
                          - repeat:
                              count: 3
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: light.slaapkamer_maxi_lampen
                                  data:
                                    effect: blink
                                  continue_on_error: true
                                - delay: "00:00:02"
                          # Onvoorwaardelijk uit als hij uit stond, dus geen
                          # tweede blik op de state: zo'n blik is precies het
                          # vangnet dat niets doet zodra de state liegt. Blijft
                          # hij door een misgelopen commando toch aan, dan
                          # pakt de nabrander in Bedtime.yaml hem 's avonds
                          # binnen tien minuten alsnog.
                          - alias: Stond het licht uit, dan gaat het weer uit
                            if:
                              - condition: template
                                value_template: "{{ licht_stond_uit }}"
                            then:
                              - action: light.turn_off
                                target:
                                  entity_id: light.slaapkamer_maxi_lampen
                                continue_on_error: true
            until:
              - condition: template
                value_template: "{{ repeat.index >= herhalingen | int(15) }}"

        # ALLEEN BEREIKBAAR ALS HET HALF UUR OP IS
        # Gaat de pc uit, dan stopt de `stop:` hierboven de hele run en komt
        # deze regel nooit aan de beurt. Zonder dit bericht zou het stilvallen
        # van de meldingen te lezen zijn als "hij heeft hem uitgezet", en dat
        # is dan juist niet zo.
        - alias: We houden op met porren
          action: notify.mobile_devices_adults
          data:
            title: Gametijd Logan - er wordt niet meer gepord
            message: >-
              De pc van Logan stond na een half uur porren nog steeds aan;
              vandaag staat er {{ gebruikt_tekst }} op. Vanaf nu is het stil;
              hier gebeurt niets meer tot hij hem uitzet. Zet hij hem uit en
              weer aan, dan begint het porren opnieuw.
            data: *meldingdata

    ##########################################################################
    ## De limiet eenmalig vullen
    ##
    ## De helper hierboven heeft bewust geen `initial:`, want dat zou je eigen
    ## instelling bij elke herstart overschrijven. Prijs daarvan is dat hij de
    ## allereerste keer op `unknown` staat, en dan kan de `numeric_state`-
    ## trigger hierboven nergens mee vergelijken en vuurt hij dus nooit - een
    ## storing die je niet ziet. Deze zet hem dan op 90 minuten.
    ##########################################################################
    - id: bedroom_maxi_pc_gametijd_limiet_vullen
      alias: Bedroom Maxi - Gametijdlimiet eenmalig vullen
      description: >-
        Zet input_number.pc_logan_gametijd_limiet op 90 minuten zolang hij nog
        nooit een waarde heeft gehad. Raakt een limiet die je zelf hebt
        ingesteld niet aan.
      mode: single
      max_exceeded: silent
      triggers:
        - trigger: homeassistant
          event: start
        - trigger: state
          entity_id: input_number.pc_logan_gametijd_limiet
          to: unknown
      actions:
        # Bij een herstart komt de opgeslagen waarde terug uit de database, en
        # dat gaat niet altijd vóór het start-event. Even wachten scheelt een
        # helper die zichzelf op 90 zet terwijl er 120 in stond.
        - delay: "00:00:30"
        - condition: template
          value_template: >-
            {{ not has_value('input_number.pc_logan_gametijd_limiet') }}
        - action: input_number.set_value
          target:
            entity_id: input_number.pc_logan_gametijd_limiet
          data:
            value: 90
