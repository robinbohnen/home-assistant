bedtime_maxi_package:
  input_datetime:
    bedtime_maxi:
      name: "Bedroom Maxi - Bedtime Maxi"
      has_time: true
      icon: mdi:clock-time-eight
    bedtime_maxi_1h_off:
      name: "Bedroom Maxi - Bedtime Maxi (1h off)"
      has_time: true
      icon: mdi:clock-time-seven
    bedtime_maxi_weekend:
      name: "Bedroom Maxi - Bedtime Maxi (Weekend)"
      has_time: true
      icon: mdi:clock-time-nine

  template:
    - binary_sensor:
        # De naam blijft bewust kleingeschreven: het entity_id komt hiervandaan
        # en het dashboard verwijst naar binary_sensor.bedtime_kids.
        #
        # Het hele template stond eerder tussen aanhalingstekens binnen het
        # blok, waardoor de uitkomst een string met quotes werd in plaats van
        # true/false - en die is nooit als "aan" te lezen. Deze sensor stond dus
        # altijd op off.
        - name: bedtime_kids
          unique_id: bedtime_kids
          icon: mdi:sleep
          availability: >
            {{ has_value('input_datetime.bedtime_maxi_1h_off')
               and has_value('input_datetime.bedtime_mini_1h_off') }}
          state: >
            {% set maxi = strptime(states('input_datetime.bedtime_maxi_1h_off'), '%H:%M:%S').hour %}
            {% set mini = strptime(states('input_datetime.bedtime_mini_1h_off'), '%H:%M:%S').hour %}
            {{ now().hour >= maxi or now().hour >= mini or now().hour < 9 }}

        # De nacht zoals de bewegingslichten op de twee overlopen hem tellen:
        # van het moment dat de kinderen écht in bed liggen tot het huis
        # zichzelf wakker meldt (Robin, 12 augustus 2026).
        #
        # Waarom niet bedtime_kids hierboven: die hangt aan de *_1h_off-helpers
        # (19:30) en dan lopen de kinderen nog naar boven - precies wanneer je
        # licht op de overloop wilt. Hier telt het maximum van de vier échte
        # bedtijd-helpers, nu 21:00 (de weekendstand). Verzet Robin een
        # bedtijd, dan schuift dit mee.
        #
        # Waarom niet gewoon "klimaat_wakker uit": die vlag valt elke avond om
        # 22:00 al terug en zegt tussen bedtijd en 22:00 dus nog niets. Vandaar
        # twee helften: na de laatste bedtijd, of 's ochtends vóór de
        # slaapkamerknop. De grens van 12:00 is een noodrem - raakt die vlag
        # overdag uit, dan is het huis daarmee niet ineens weer in slaap.
        #
        # Bewust geen availability: valt een helper weg, dan hoort deze sensor
        # 'off' te melden en het licht dus gewoon te werken. Een sensor die
        # 'unavailable' wordt is op een donkere overloop de verkeerde kant om.
        #
        # De klok is niet het hele verhaal: komen we na de laatste bedtijd thuis
        # en staan beide kinderdeuren nog open, dan liggen ze er niet in en zijn
        # wij ook nog niet naar bed - dan mogen de overlopen gewoon aan (Robin,
        # 13 augustus 2026). Sluiten gebeurt bij het naar bed brengen: op 12
        # augustus gingen Mini en Maxi om 21:40 binnen 16 seconden van elkaar
        # dicht, en daarna telt het venster weer normaal.
        #
        # Bewust `is_state(...,'on')` op allebei en geen `!= 'off'`: valt een
        # deurcontact weg, dan telt hij niet als open en blijft de nachtrem
        # staan. Eén open deur is ook niet genoeg - dat is een kind naar de wc,
        # geen huis dat nog wakker is. Alleen deze avondhelft kent de
        # uitzondering; 's ochtends zegt een open deur iets heel anders en
        # blijft `voor_opstaan` de baas tot de slaapkamerknop omgaat.
        #
        # De uitzondering eindigt om 00:00 - en dat is een KEUZE, geen
        # bijeffect (Robin, 14 augustus 2026). Om middernacht neemt
        # `voor_opstaan` het over en die kijkt bewust niet naar de deuren:
        # kom je ná twaalven nog thuis met de deuren open, dan geldt de
        # nachtrem dus gewoon. Wie de grens ooit wil verleggen moet de
        # deurencheck een eigen tijdvenster geven in de voor_opstaan-helft.
        - name: huis_slaapt
          unique_id: huis_slaapt
          icon: mdi:home-clock
          state: >
            {% set bedtijden = ['input_datetime.bedtime_maxi',
                                'input_datetime.bedtime_mini',
                                'input_datetime.bedtime_maxi_weekend',
                                'input_datetime.bedtime_mini_weekend']
                               | map('states')
                               | reject('in', ['unknown', 'unavailable', ''])
                               | list %}
            {% set kinderen_nog_op =
                 is_state('binary_sensor.slaapkamer_maxi_deur_contact', 'on')
                 and is_state('binary_sensor.slaapkamer_mini_deur_contact', 'on') %}
            {% set na_bedtijd = bedtijden
               and now().strftime('%H:%M:%S') >= bedtijden | max
               and not kinderen_nog_op %}
            {% set voor_opstaan = now().hour < 12
               and is_state('input_boolean.klimaat_wakker', 'off') %}
            {{ na_bedtijd or voor_opstaan }}

  automation:
    ###########################################################################
    ## LICHT UIT NA BEDTIJD - MET NABRANDER
    ##
    ## Het bedtijdstip is één moment. Staat het licht dán al tien minuten aan,
    ## dan gaat het uit; wie in die laatste tien minuten nog op de knop drukt
    ## viel er dwars doorheen en had de rest van de avond licht. Precies dat
    ## gebeurde op 18 augustus 2026: Logan drukte om 21:21:29 het licht aan,
    ## om 21:30 telde dat pas 8,5 minuut, de conditie klopte niet, en daarna
    ## keek niets er meer naar - tot iemand om 21:57 zelf op de knop drukte.
    ##
    ## Vandaar de tweede trigger. Staat het licht binnen de nacht tien minuten
    ## aan, dan gaat het alsnog uit, ongeacht hoe het aan is gekomen. Het
    ## bedtijdstip zelf blijft staan: dat pakt het gewone geval (het licht
    ## brandt al uren) op de seconde nauwkeurig, met dezelfde tien minuten
    ## speling als altijd. De twee triggers overlappen dus bewust.
    ##
    ## Het nachtvenster loopt van de vroegste van de twee bedtijd-helpers tot
    ## 07:00, en eerder als het huis zich voor die tijd wakker meldt
    ## (`input_boolean.klimaat_wakker`, zie packages/9 - Other/Klimaat
    ## Zonwering.yaml). Die 07:00 is een KEUZE en geen bijeffect: 's nachts is
    ## brandend licht altijd fout, maar een kind dat 's ochtends zelf zijn licht
    ## aandoet moet dat mogen houden - anders klapt het elke tien minuten uit
    ## terwijl hij ligt te lezen. Deze automatisering is bewust strenger dan de
    ## nachtrem op de overlopen, die tot 12:00 doorloopt: die houdt alleen
    ## bewegingslicht tegen, deze zet iets uit dat iemand net zelf aanzette.
    ## Wil je de grens verleggen, dan is dit het enige getal dat mee moet.
    ##
    ## `mode: restart` en niet `single`: de reeks hieronder duurt door de
    ## nachtlamp een kwartier, en met `single` zou een druk binnen dat kwartier
    ## precies weer stilletjes wegvallen - hetzelfde gat, andere oorzaak.
    ###########################################################################
    - id: bedtime_for_maxi_lights_off
      alias: Bedroom Maxi - Bedtime Lights Off
      description: Turn off the lights at maxis bedroom after bedtime
      triggers:
        - at: input_datetime.bedtime_maxi
          trigger: time
          id: bedtijd
        - at: input_datetime.bedtime_maxi_weekend
          trigger: time
          id: bedtijd
        - trigger: state
          entity_id: light.slaapkamer_maxi_lampen
          to: "on"
          for:
            hours: 0
            minutes: 10
            seconds: 0
          id: nabrander
      conditions:
        - condition: or
          conditions:
            # Het bedtijdstip: alleen ingrijpen als het licht er al tien
            # minuten aan staat, zodat een lamp die net aanging niet meteen
            # onder je handen uitgaat.
            - condition: and
              conditions:
                - condition: trigger
                  id: bedtijd
                - condition: state
                  entity_id: light.slaapkamer_maxi_lampen
                  state: "on"
                  for:
                    hours: 0
                    minutes: 10
                    seconds: 0
            # De nabrander telt die tien minuten in de trigger zelf al af - die
            # conditie hier nog eens herhalen zou op de seconde af een race
            # zijn. Hier hoeft alleen te kloppen dat het nacht is.
            - condition: and
              conditions:
                - condition: trigger
                  id: nabrander
                - condition: template
                  value_template: >-
                    {% set bedtijden = ['input_datetime.bedtime_maxi',
                                        'input_datetime.bedtime_maxi_weekend']
                                       | map('states')
                                       | reject('in', ['unknown', 'unavailable', ''])
                                       | list %}
                    {% set na_bedtijd = bedtijden
                       and now().strftime('%H:%M:%S') >= bedtijden | min %}
                    {% set voor_opstaan = now().hour < 7
                       and is_state('input_boolean.klimaat_wakker', 'off') %}
                    {{ na_bedtijd or voor_opstaan }}
      actions:
        - action: light.turn_off
          metadata: {}
          data: {}
          target:
            entity_id: light.slaapkamer_maxi_lampen
        - action: light.turn_on
          metadata: {}
          target:
            entity_id: light.slaapkamer_losse_lamp_maxi
          data:
            brightness_pct: 1
            transition: 3
        - delay:
            hours: 0
            minutes: 15
            seconds: 0
            milliseconds: 0
        - action: light.turn_off
          metadata: {}
          target:
            entity_id: light.slaapkamer_losse_lamp_maxi
          data: {}
      mode: restart

    - id: bedtime_for_maxi_media_off
      alias: "Bedroom Maxi - Bedtime Media Off"
      description: "Turn off all media when bedtime is due"
      mode: single
      triggers:
        - trigger: time
          at: input_datetime.bedtime_maxi
        - trigger: time
          at: "19:00:00"
      conditions: []
      # Zelfde volgorde en zelfde reden als bij Mini (zie
      # packages/2 - Second Floor/Bedroom Mini/Bedtime.yaml): eerst uit de
      # groep, dan pas stoppen, anders legt de stop het hele huis stil.
      actions:
        - action: media_player.unjoin
          metadata: {}
          data: {}
          target:
            entity_id: media_player.slaapkamer_maxi_sonos
        - action: media_player.media_stop
          continue_on_error: true
          data: {}
          target:
            entity_id: media_player.slaapkamer_maxi_sonos
