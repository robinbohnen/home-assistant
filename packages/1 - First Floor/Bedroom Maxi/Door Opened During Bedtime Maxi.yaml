maxi_opened_door_bedtime_package:

  timer:
    # GEDEELD MET DE KAMER VAN MINI, en daarom hier maar één keer gedefinieerd.
    # Hij staat in dit bestand omdat het er ergens moest staan; wie hem hernoemt
    # of weghaalt, breekt ook packages/2 - Second Floor/Bedroom Mini/Door Opened
    # During Bedtime Mini.yaml.
    #
    # Waar hij voor is: de blueprint zet alleen die kamer met `mode: single`
    # vast, maar de attentielampen beneden zijn van iedereen. Gingen beide
    # kinderdeuren binnen de ademduur open, dan maakte de tweede een
    # momentopname van de al ademende lampen en zette die naderhand terug -
    # waarna ze blauw of roze bleven staan tot iemand het zag.
    #
    # Een minuut, ruim boven de ademduur van twintig seconden: de blueprint zet
    # hem aan het eind zelf stop, dus die looptijd geldt alleen als een run
    # onderweg sneuvelt (een reload is al genoeg). Dan geeft hij vanzelf vrij in
    # plaats van het slot voor altijd dicht te houden.
    kinderdeur_attentie_bezig:
      name: "Kinderdeur - attentielampen bezig"
      duration: "00:01:00"
      icon: mdi:lightbulb-alert

  automation:
    # De id blijft ongewijzigd: daar hangt de bestaande entiteit aan vast, een
    # nieuwe id levert een tweede automatisering op in plaats van deze.
    - id: maxi_opened_door_bedtime
      alias: Bedroom maxi - Opened door during bedtime
      description: >-
        maxi has opened her door during bedtime; notice parents by breathe some lights
        in color
      use_blueprint:
        path: robin/door_opened_bedtime.yaml
        input:
          deur_contact: binary_sensor.slaapkamer_maxi_deur_contact
          bedtijd: input_datetime.bedtime_maxi_1h_off
          # scene.maxi_door_sleeping bestaat al live; hier niets aan veranderen.
          scene_id: maxi_door_sleeping
          attentie_lampen:
            - light.woonkamer_tv_kast_hue_bar_links
            - light.achtertuin_overkapping_wand_kort_spot_boven
          # Blauw is van Maxi.
          kleur: [0, 0, 249]
          melding_titel: Deur maxi open
          melding_tekst: De deur van maxi is geopend tijdens bedtijd, lampen zijn uit dus.
          # Gedeeld slot; de timer staat bovenaan dit bestand en wordt ook door
          # de kamer van Mini gebruikt. Zonder dit zouden twee deuren binnen
          # twintig seconden elkaars momentopname overschrijven.
          bezet_timer: timer.kinderdeur_attentie_bezig
