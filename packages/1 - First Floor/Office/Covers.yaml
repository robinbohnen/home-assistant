office_covers_package:
  cover:
    - platform: group
      unique_id: covers_office
      name: Covers Office
      entities:
        - cover.kantoor_links_low_speed
        - cover.kantoor_rechts_low_speed

  automation:
    - id: office_covers_close
      alias: Office - Close covers
      description: "Close office covers when bedroom button is pressed"
      mode: single
      triggers:
        # Eén event uit de router in
        # packages/1 - First Floor/Bedroom/Buttons.yaml; die kent de
        # knoppen en de ochtend-/avondgrens.
        - trigger: event
          event_type: huis_routine
          event_data:
            routine: avond
      conditions: []
      actions:
        - action: cover.set_cover_position
          data:
            position: 15
          target:
            entity_id: cover.covers_office
