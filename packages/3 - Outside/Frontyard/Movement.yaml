frontyard_movement_package:
  automation:
    - id: lights_movement_carport
      alias: Frontyard - Movement Lights
      description: "Turn up the brightness of the lights at the frontyard"
      triggers:
        # Let op: NIET switch.g6_180_detections_person - dat is de instelling
        # die persoonsdetectie aan/uit zet, geen detectie. Die stond hier
        # oorspronkelijk (nog met de oude voortuin-G5) waardoor deze
        # automatisering alleen vuurde als je die knop zelf omzette.
        - trigger: state
          entity_id:
            - binary_sensor.g6_180_persoon_gedetecteerd
          to: "on"
      conditions:
        - condition: state
          entity_id: light.carport_lampen
          state: "on"
      actions:
        - action: scene.create
          metadata: {}
          data:
            scene_id: carport_previous_state
            snapshot_entities:
              - light.carport_lampen
              - light.voortuin_lampen
        - action: light.turn_on
          metadata: {}
          data:
            brightness_pct: 100
          target:
            entity_id:
              - light.carport_lampen
              - light.voortuin_lampen
        - delay:
            hours: 0
            minutes: 0
            seconds: 30
            milliseconds: 0
        - action: scene.turn_on
          metadata: {}
          target:
            entity_id: scene.carport_previous_state
      mode: single
