frontyard_frontdoor_lights_package:

  input_number:
    lights_frontyard_frontdoor_percentage:
      name: "Lights Frontyard Frontdoor - Percentage"
      min: 0
      max: 100
      step: 1
      icon: mdi:lightbulb-on-70

  automation:
    # De hele automatisering (triggers, tijden, de ontbrekende default) staat
    # sinds 15 augustus 2026 in blueprints/automation/robin/buitenlicht.yaml en
    # wordt gedeeld met de carport en - sinds 17 augustus - de achtertuin. Die
    # eerste twee waren op de lampgroep en de helper na letterlijk gelijk. De
    # toelichting bij de ochtendtrigger die hier stond, staat nu in de kop van
    # die blueprint.
    - id: lights_frontdoor
      alias: "Frontyard Frontdoor - Lights"
      description: "Turn on or off the lights at the frontdoor"
      use_blueprint:
        path: robin/buitenlicht.yaml
        input:
          lamp: light.voortuin_lampen
          helderheid: input_number.lights_frontyard_frontdoor_percentage
