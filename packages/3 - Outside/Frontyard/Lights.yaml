frontyard_frontdoor_lights_package:

  input_number:
    lights_frontyard_frontdoor_percentage:
      name: "Lights Frontyard Frontdoor - Percentage"
      min: 0
      max: 100
      step: 1
      icon: mdi:lightbulb-on-70

  automation:
    - id: lights_frontdoor
      alias: "Frontyard Frontdoor - Lights"
      description: "Turn on or off the lights at the frontdoor"
      triggers:
        - id: sunset
          trigger: sun
          event: sunset
          offset: "-01:00:00"
        # Zonder deze id deed de ochtend-trigger NIETS: de uit-tak checkt op
        # id "sunrise", en een trigger zonder id krijgt zijn volgnummer. Dat
        # bleef onzichtbaar zolang `default: light.toggle` het opving; sinds
        # die weg is bleven de lampen dus de hele dag branden.
        - id: sunrise
          trigger: sun
          event: sunrise
          offset: "+01:00:00"
      actions:
        - choose:
          - conditions:
            - condition: trigger
              id:
                - sunset
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.voortuin_lampen
                data:
                  transition: "{{ states('input_number.lights_transition_seconds')|int }}"
                  brightness_pct: "{{ states('input_number.lights_frontyard_frontdoor_percentage')|int }}"
          - conditions:
            - condition: trigger
              id:
                - sunrise
            sequence:
              - action: light.turn_off
                target:
                  entity_id: light.voortuin_lampen
                data:
                  transition: "{{ states('input_number.lights_transition_seconds')|int }}"
          # Bewust geen default: een trigger zonder afgedekte id moet niets
          # doen, geen light.toggle (zie Backyard/Lights.yaml).
