backyard_spa_package:
  input_number:
    backyard_spa_target_temperature:
      name: "Backyard Spa - Target Temperature"
      min: 20
      max: 40
      step: 1
      icon: mdi:hot-tub

  input_boolean:
    backyard_spa_temperature_reached_today:
      name: "Backyard Spa - Temperature Reached Today"
      icon: mdi:temperature-celsius
    backyard_spa_keep_warm:
      name: "Backyard Spa - Keep Warm"
      icon: mdi:temperature-celsius
    backyard_spa_free_heating_enabled:
      name: "Backyard Spa - Free Heating Enabled"
      icon: mdi:currency-eur

  ###########################################################################
  ## STAAT DE SPA ER NOG, OF IS HIJ OPGERUIMD
  ###########################################################################
  # De jacuzzi is een zomerding: hij gaat in het najaar het schuurtje in en in
  # het voorjaar weer op het terras. In de tussentijd blijft deze hele config
  # gewoon staan - er hoeft niets weg en niets terug. Wat wél weg moet is de
  # rommel die een opgeruimde spa achterlaat:
  #
  #   * de kaarten op het overzicht (een mushroom-kaart van een verdwenen
  #     entiteit wordt een rode foutkaart, en het Jacuzzi-blok in de
  #     Schakelaars-popup staat er een half jaar grijs bij)
  #   * de samenvatting onder de Schakelaars-tegel, die "spa offline" blijft
  #     melden zolang de wifi-module weg is
  #   * de melding "Jacuzzi reageert niet meer". Die is bedoeld voor een
  #     wifi-module die eruit klapt terwijl de spa gewoon buiten staat, en gaat
  #     dan één keer af. Maar hij hangt aan een state-trigger op `unavailable`
  #     met `for: 15 minuten`, en bij een herstart van Home Assistant komt de
  #     entiteit opnieuw als `unavailable` binnen. Dus kreeg je 'm ELKE
  #     HERSTART opnieuw, de hele winter door.
  #
  # Vandaar deze binaire sensor. Alles hierboven hangt eraan; dat is de enige
  # plek waar "is de spa er nog" wordt vastgesteld.
  #
  # WAAROM EEN INPUT_DATETIME EN NIET `delay_off: 24:00:00`
  # Dat laatste is één regel en zou hier precies het verkeerde doen: de
  # afteltijd van een template-binarysensor overleeft een herstart niet. Na
  # elke reboot begint hij opnieuw aan zijn 24 uur, dus zou de spa er telkens
  # een dag lang weer "zijn" - inclusief de kaarten en de melding die we juist
  # kwijt wilden. Een input_datetime overleeft wél, dus die houdt vast wanneer
  # de spa voor het laatst een waarde gaf.
  input_datetime:
    backyard_spa_laatst_gezien:
      name: "Backyard Spa - Laatst gezien"
      has_date: true
      has_time: true
      icon: mdi:hot-tub

  template:
    - binary_sensor:
        - name: Backyard Spa - Aanwezig
          unique_id: backyard_spa_aanwezig
          icon: mdi:hot-tub
          # `has_value` dekt allebei de manieren waarop de spa kan verdwijnen:
          # de wifi-module die wegvalt (entiteit blijft bestaan, staat op
          # `unavailable`) en de integratie die eruit gaat (entiteit bestaat
          # niet meer). In allebei de gevallen onwaar.
          #
          # De 24 uur zijn ruim bemeten met opzet: een spa die een nacht van
          # het net is, is stuk en geen opgeruimde spa. Pas als hij een etmaal
          # niets heeft gezegd gaan we ervan uit dat hij is opgeborgen.
          state: >-
            {% set gezien = state_attr('input_datetime.backyard_spa_laatst_gezien',
                                       'timestamp') | float(0) %}
            {{ has_value('climate.intex_purespa')
               or (gezien > 0 and (now().timestamp() - gezien) < 86400) }}

  automation:
    # Het stempel bijhouden zolang de spa leeft. De tijdtrigger is de echte
    # motor - een spa die uren stil op temperatuur staat verandert van state
    # bijna niets, en dan zou het stempel verlopen terwijl hij er gewoon staat.
    # De starttrigger is er voor de allereerste keer: zonder stempel staat een
    # verse input_datetime op 1970 en zou de spa meteen als opgeruimd gelden.
    - id: backyard_spa_laatst_gezien
      alias: Backyard - Spa laatst gezien
      description: >-
        Houdt bij wanneer de spa voor het laatst een waarde gaf. Zie de
        toelichting bij binary_sensor.backyard_spa_aanwezig.
      mode: single
      triggers:
        - trigger: state
          entity_id: climate.intex_purespa
        - trigger: time_pattern
          minutes: "/30"
        - trigger: homeassistant
          event: start
      conditions:
        - condition: template
          value_template: "{{ has_value('climate.intex_purespa') }}"
      actions:
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.backyard_spa_laatst_gezien
          data:
            timestamp: "{{ now().timestamp() }}"

    - id: backyard_spa_error
      alias: Backyard - Spa Error
      description: >-
        Meldt spa-storingen in gewone taal. Er zijn twee soorten: de spa is
        bereikbaar en meldt zelf een code, of de spa is helemaal van het net
        (wifi-module). Dat laatste gebeurt regelmatig en kwam er eerst niet
        door: de oude conditie was "niet melden als climate.intex_purespa
        unavailable is", en juist bij verbindingsverlies vallen de errorcode
        en de climate-entiteit op dezelfde seconde om. Op 15-08-2026 om 02:50
        stond er e81 en ging er dus geen melding uit.
      mode: queued
      max: 5
      variables:
        code: "{{ states('sensor.intex_purespa_error_code') }}"
        # De *_error_description sensor levert alleen de sleutel ("e81"); de
        # leesbare tekst zit in de vertaling van de integratie en komt dus niet
        # mee in een notificatie. Daarom hier in het Nederlands, ontleend aan
        # de en.json van mathieu-mp/homeassistant-intex-spa.
        uitleg: >-
          {% set teksten = {
            'e81': 'geen verbinding met de spa - controleer of hij aan staat en of de wifi-module bereik heeft',
            'e90': 'te weinig of geen doorstroming - filtercartridge en circulatie nakijken',
            'e91': 'te weinig zout - zout bijvullen en de kabel van de zoutcel controleren',
            'e92': 'te veel zout - deels aftappen en met schoon water bijvullen',
            'e94': 'water te koud (onder 5 graden) - warm water bijvullen',
            'e95': 'water te heet - verwarming uit, filter en circulatie nakijken',
            'e96': 'systeemfout in de besturing - spa uitzetten en de stekker eruit',
            'e97': 'droogkookbeveiliging - meteen de stekker eruit en Intex bellen',
            'e99': 'temperatuursensor stuk - meteen de stekker eruit en Intex bellen' } %}
          {{ teksten.get(code, 'onbekende code, kijk op het bedieningspaneel') }}
      triggers:
        # De spa is bereikbaar en meldt zelf iets.
        #
        # DIE HALVE MINUUT IS GEEN BEDENKTIJD MAAR EEN VOLGORDEKWESTIE
        # De tak hieronder mag alleen af als de spa écht bereikbaar is, en dat
        # leest hij aan `climate.intex_purespa`. Bij verbindingsverlies zetten
        # allebei die entiteiten in dezelfde update om: in de historie van 15
        # augustus 2026 staan e81 en unavailable allebei op 00:50:41, tot op de
        # seconde. Wie van de twee de automatisering het eerst wakker maakt, is
        # dan niet iets om op te bouwen - kwam de errorcode eerst binnen, dan
        # stond de climate nog op `off` en ging er meteen een melding uit die
        # juist een kwartier had moeten wachten (en een kwartier later nog een
        # keer, voor hetzelfde voorval). Na dertig seconden staat het stof neer
        # en klopt de conditie hoe dan ook.
        #
        # Prijs: een echte spa-code komt een halve minuut later binnen dan hij
        # zou kunnen. Voor een melding over zout of doorstroming maakt dat
        # niets uit.
        - trigger: state
          entity_id: sensor.intex_purespa_error_code
          not_to:
            - none
            - unknown
            - unavailable
          for: "00:00:30"
          id: errorcode
        # De spa is weg. Een kwartier wachten: korte hikjes (wifi, een
        # herstartende module) herstellen vanzelf en zijn geen melding waard.
        - trigger: state
          entity_id: climate.intex_purespa
          to: unavailable
          for: "00:15:00"
          id: offline
        - trigger: state
          entity_id: climate.intex_purespa
          from: unavailable
          id: hersteld
      conditions:
        # Na een herstart komt alles kort als unavailable binnen; dat is geen
        # storing. Zie sensor.home_assistant_gestart in Dashboard Context.yaml.
        - condition: template
          value_template: >-
            {% set start = states('sensor.home_assistant_gestart') %}
            {{ start in ['unknown', 'unavailable']
               or (now() - (start | as_datetime)) > timedelta(minutes = 10) }}
      actions:
        - choose:
            - alias: Spa is van het net
              conditions:
                - condition: trigger
                  id: offline
                # EEN OPGERUIMDE SPA REAGEERT NIET, EN DAT IS GOED NIEUWS
                # Deze trigger hangt aan `unavailable` met `for: 15 minuten`,
                # en na een herstart van Home Assistant komt de entiteit
                # opnieuw als `unavailable` binnen. Zonder deze conditie kwam
                # deze melding er dus bij elke reboot weer uit, de hele winter
                # dat de spa in de schuur staat.
                #
                # De eerste keer gaat hij nog gewoon af: het stempel is dan een
                # kwartier oud en de sensor staat nog `on`. Pas na een etmaal
                # stilte valt hij om en houdt het op.
                - alias: Alleen als de spa hier hoort te staan
                  condition: state
                  entity_id: binary_sensor.backyard_spa_aanwezig
                  state: "on"
              sequence:
                - action: notify.mobile_devices_adults
                  metadata: {}
                  data:
                    title: Jacuzzi reageert niet meer
                    message: >-
                      Geen contact sinds
                      {{ trigger.to_state.last_changed | as_local
                         | as_timestamp | timestamp_custom('%H:%M') }}
                      {%- if code not in ['none', 'unknown', 'unavailable'] %},
                      laatste melding {{ code | upper }} ({{ uitleg }}){%- endif %}.
                      Verwarmen en de gratis-stroomregeling doen tot die tijd
                      niets. Meestal helpt de spa een halve minuut van het net
                      halen.
            - alias: Spa is er weer
              conditions:
                - condition: trigger
                  id: hersteld
                # Alleen als er ook een offline-melding uit is gegaan; onder
                # het kwartier van die trigger heeft "hij is er weer" geen
                # betekenis.
                - condition: template
                  value_template: >-
                    {{ (now() - trigger.from_state.last_changed).total_seconds() >= 900 }}
              sequence:
                - action: notify.mobile_devices_adults
                  metadata: {}
                  data:
                    title: Jacuzzi is er weer
                    message: >-
                      {% set temp = state_attr('climate.intex_purespa', 'current_temperature') %}
                      De spa reageert weer na
                      {{ ((now() - trigger.from_state.last_changed).total_seconds()
                          / 60) | round }} minuten. Verwarming staat
                      {{ 'aan' if is_state('switch.intex_purespa_power', 'on') else 'uit' }}
                      {%- if temp is number %}, water {{ temp | round(1) }} graden
                      {%- endif %}.
            - alias: Spa is bereikbaar en meldt een code
              conditions:
                - condition: trigger
                  id: errorcode
                # Bij verbindingsverlies verschijnt e81 terwijl de climate
                # omvalt; die kant hoort bij de offline-tak hierboven, die
                # eerst een kwartier wacht. Deze conditie kan daar alleen op
                # vertrouwen doordat de trigger een halve minuut wacht - zie
                # de toelichting daar.
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: climate.intex_purespa
                      state: unavailable
              sequence:
                - action: notify.mobile_devices_adults
                  metadata: {}
                  data:
                    title: "Jacuzzi meldt {{ code | upper }}"
                    message: "{{ uitleg | capitalize }}."

    - id: backyard_spa_temperature
      alias: Backyard - Spa Temperature
      description: Automations for Spa Temperature
      mode: single
      triggers:
        - trigger: template
          value_template: >-
            {{ state_attr('climate.intex_purespa', 'current_temperature') | int(0) >=
            states('input_number.backyard_spa_target_temperature') | int(0) }}
          id: temperature_reached
        - trigger: time
          at: "23:59:00"
          id: reset-today
        - trigger: state
          entity_id:
            - climate.intex_purespa
          attribute: current_temperature
          id: temperature-change
        - trigger: numeric_state
          attribute: current_temperature
          entity_id:
            - climate.intex_purespa
          below: 20
          id: too_cold
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - temperature_reached
              sequence:
                - action: climate.turn_off
                  metadata: {}
                  data: {}
                  target:
                    entity_id: climate.intex_purespa
                - if:
                    - condition: state
                      entity_id: input_boolean.backyard_spa_temperature_reached_today
                      state: "off"
                  then:
                    - action: notify.mobile_devices_adults
                      metadata: {}
                      data:
                        title: Intex Spa
                        message: >-
                          De ingestelde temperatuur van {{
                          state_attr('climate.intex_purespa','current_temperature') }}
                          °C is bereikt!
                    - action: input_boolean.turn_on
                      metadata: {}
                      data: {}
                      target:
                        entity_id:
                          - input_boolean.backyard_spa_keep_warm
                          - input_boolean.backyard_spa_temperature_reached_today
            - conditions:
                - condition: trigger
                  id:
                    - reset-today
              sequence:
                - action: input_boolean.turn_off
                  metadata: {}
                  data: {}
                  target:
                    entity_id:
                      - input_boolean.backyard_spa_temperature_reached_today
                      - input_boolean.backyard_spa_keep_warm
            - conditions:
                - condition: trigger
                  id:
                    - temperature-change
              sequence:
                - if:
                    - condition: and
                      conditions:
                        - condition: template
                          value_template: >-
                            {{ state_attr('climate.intex_purespa', 'current_temperature') | int(0) <
                            states('input_number.backyard_spa_target_temperature') | int(0) }}
                        - condition: state
                          entity_id: input_boolean.backyard_spa_keep_warm
                          state: "on"
                        - condition: state
                          entity_id: switch.intex_purespa_sanitizer
                          state: "off"
                  then:
                    - action: climate.turn_on
                      metadata: {}
                      data: {}
                      target:
                        entity_id: climate.intex_purespa
                    - action: climate.set_hvac_mode
                      metadata: {}
                      data:
                        hvac_mode: heat
                      target:
                        entity_id: climate.intex_purespa
            - conditions:
                - condition: trigger
                  id:
                    - too_cold
              sequence:
                - action: climate.turn_on
                  metadata: {}
                  data: {}
                  target:
                    entity_id: climate.intex_purespa
                - action: climate.set_hvac_mode
                  metadata: {}
                  data:
                    hvac_mode: heat
                  target:
                    entity_id: climate.intex_purespa

    - id: backyard_spa_sanitizer
      alias: Backyard - Spa Sanitizer
      description: Turn on the sanitizer when too long off
      mode: single
      triggers:
        - trigger: time_pattern
          hours: /1
          id: check_for_longtime_off
        - trigger: state
          entity_id:
            - switch.intex_purespa_sanitizer
          from: "on"
          to: "off"
          id: sanitizer_finished
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - check_for_longtime_off
              sequence:
                - if:
                    - condition: and
                      conditions:
                        - condition: not
                          conditions:
                            - condition: state
                              entity_id: climate.intex_purespa
                              state: heat
                        - condition: state
                          entity_id: switch.intex_purespa_sanitizer
                          state: "off"
                          for:
                            hours: 24
                            minutes: 0
                            seconds: 0
                  then:
                    - action: switch.turn_on
                      metadata: {}
                      data: {}
                      target:
                        entity_id: switch.intex_purespa_sanitizer
            - conditions:
                - condition: trigger
                  id:
                    - sanitizer_finished
              sequence:
                - stop: Dit willen we even niet meer
                  error: false
                - action: climate.turn_on
                  metadata: {}
                  data: {}
                  target:
                    entity_id: climate.intex_purespa
                - action: climate.set_hvac_mode
                  metadata: {}
                  data:
                    hvac_mode: heat
                  target:
                    entity_id: climate.intex_purespa

    - id: backyard_spa_free_power
      alias: Backyard - Spa free heating
      description: Turn on spa when heating is free (overcapacity) or even paid!
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - switch.live_energieverbruik_totaal_negatief
          to: "on"
          for:
            hours: 0
            minutes: 5
            seconds: 0
          id: much_overcapacity
        - trigger: numeric_state
          entity_id:
            - sensor.live_energieverbruik_totaal
          for:
            hours: 0
            minutes: 5
            seconds: 0
          above: 0
          id: no_overcapacity
        # Let op de sensornaam: ..._negatieve_ALL_IN_prijs_nu, niet
        # ..._negatieve_prijs_nu. Die laatste kijkt naar de kale marktprijs,
        # terwijl we bij verbruik het hele tarief betalen (markt + inkoop +
        # energiebelasting + btw). Bij een licht negatieve marktprijs kost
        # opwarmen dus nog gewoon geld; pas onder een negatief totaaltarief
        # krijgen we betaald om te stoken.
        #
        # Die som stond hier eerst met de hand uitgeschreven; sinds 2026-08-06
        # levert SlimHuys hem kant-en-klaar. Scheelt ook het randgeval waarin
        # het tarief precies 0,00 is en tussen `below` en `above` door viel.
        - trigger: state
          entity_id: binary_sensor.meterkast_slimhuys_zonneplan_negatieve_all_in_prijs_nu
          to: "on"
          # Na een herstart komt een binary sensor via `unknown`
          # binnen; zonder deze guard telt dat als een echte
          # prijswissel en gaat de tak eronder onnodig lopen.
          not_from:
            - unknown
            - unavailable
          id: negative_price
        - trigger: state
          entity_id: binary_sensor.meterkast_slimhuys_zonneplan_negatieve_all_in_prijs_nu
          to: "off"
          # Na een herstart komt een binary sensor via `unknown`
          # binnen; zonder deze guard telt dat als een echte
          # prijswissel en gaat de tak eronder onnodig lopen.
          not_from:
            - unknown
            - unavailable
          id: positive_price
      conditions:
        - condition: not
          conditions:
            - condition: state
              entity_id: climate.intex_purespa
              state: unavailable
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - much_overcapacity
                    - negative_price
                - condition: state
                  entity_id: input_boolean.backyard_spa_free_heating_enabled
                  state: "off"
              sequence:
                - alias: Turn on
                  if:
                    - condition: state
                      entity_id: switch.intex_purespa_power
                      state: "off"
                  then:
                    - action: switch.turn_on
                      metadata: {}
                      data: {}
                      target:
                        entity_id: switch.intex_purespa_power
                - alias: Turn on climate
                  if:
                    - condition: state
                      entity_id: climate.intex_purespa
                      state: "off"
                  then:
                    - action: climate.turn_on
                      metadata: {}
                      data: {}
                      target:
                        entity_id: climate.intex_purespa
                    - action: climate.set_hvac_mode
                      metadata: {}
                      data:
                        hvac_mode: heat
                      target:
                        entity_id: climate.intex_purespa
                - action: climate.set_temperature
                  metadata: {}
                  data:
                    temperature: 37
                  target:
                    entity_id: climate.intex_purespa
                - action: input_boolean.turn_on
                  metadata: {}
                  data: {}
                  target:
                    entity_id: input_boolean.backyard_spa_free_heating_enabled
            - conditions:
                - condition: trigger
                  id:
                    - positive_price
                    - no_overcapacity
                - condition: state
                  entity_id: input_boolean.backyard_spa_free_heating_enabled
                  state: "on"
              sequence:
                - action: climate.turn_off
                  metadata: {}
                  data: {}
                  target:
                    entity_id: climate.intex_purespa
                - action: input_boolean.turn_off
                  metadata: {}
                  data: {}
                  target:
                    entity_id: input_boolean.backyard_spa_free_heating_enabled
