backyard_spa_package:
  input_number:
    backyard_spa_target_temperature:
      name: "Backyard Spa - Target Temperature"
      min: 20
      max: 40
      step: 1
      icon: mdi:hot-tub

  input_boolean:
    backyard_spa_temperature_reached_today:
      name: "Backyard Spa - Temperature Reached Today"
      icon: mdi:temperature-celsius
    backyard_spa_keep_warm:
      name: "Backyard Spa - Keep Warm"
      icon: mdi:temperature-celsius
    backyard_spa_free_heating_enabled:
      name: "Backyard Spa - Free Heating Enabled"
      icon: mdi:currency-eur

  ###########################################################################
  ## STAAT DE SPA ER NOG, OF IS HIJ OPGERUIMD
  ###########################################################################
  # De jacuzzi is een zomerding: hij gaat in het najaar het schuurtje in en in
  # het voorjaar weer op het terras. In de tussentijd blijft deze hele config
  # gewoon staan - er hoeft niets weg en niets terug. Wat wél weg moet is de
  # rommel die een opgeruimde spa achterlaat:
  #
  #   * de kaarten op het overzicht (een mushroom-kaart van een verdwenen
  #     entiteit wordt een rode foutkaart, en het Jacuzzi-blok in de
  #     Schakelaars-popup staat er een half jaar grijs bij)
  #   * de samenvatting onder de Schakelaars-tegel, die "spa offline" blijft
  #     melden zolang de wifi-module weg is
  #   * de melding "Jacuzzi reageert niet meer". Die is bedoeld voor een
  #     wifi-module die eruit klapt terwijl de spa gewoon buiten staat, en gaat
  #     dan één keer af. Maar hij hangt aan een state-trigger op `unavailable`
  #     met `for: 15 minuten`, en bij een herstart van Home Assistant komt de
  #     entiteit opnieuw als `unavailable` binnen. Dus kreeg je 'm ELKE
  #     HERSTART opnieuw, de hele winter door.
  #
  # Vandaar deze binaire sensor. Alles hierboven hangt eraan; dat is de enige
  # plek waar "is de spa er nog" wordt vastgesteld.
  #
  # WAAROM EEN INPUT_DATETIME EN NIET `delay_off: 24:00:00`
  # Dat laatste is één regel en zou hier precies het verkeerde doen: de
  # afteltijd van een template-binarysensor overleeft een herstart niet. Na
  # elke reboot begint hij opnieuw aan zijn 24 uur, dus zou de spa er telkens
  # een dag lang weer "zijn" - inclusief de kaarten en de melding die we juist
  # kwijt wilden. Een input_datetime overleeft wél, dus die houdt vast wanneer
  # de spa voor het laatst een waarde gaf.
  input_datetime:
    backyard_spa_laatst_gezien:
      name: "Backyard Spa - Laatst gezien"
      has_date: true
      has_time: true
      icon: mdi:hot-tub

  ###########################################################################
  ## DE SPA GAAT NIET MEER UIT ZICHZELF AAN
  ###########################################################################
  # Er waren drie plekken waar het huis de verwarming aanzette zonder dat
  # iemand daarom gevraagd had: gratis stroom, water onder de 20 graden, en
  # het bijstoken van `keep_warm`. Alle drie stellen ze nu eerst de vraag, via
  # dezelfde weg als het zonnescherm en de zolderairco: een melding met
  # Ja/Nee, de satelliet in de keuken als er iemand thuis is, en de vraag-pil
  # op het Overzicht-dashboard.
  #
  # De vraag en het antwoord staan bewust los van elkaar. Een
  # `wait_for_trigger` die op jouw antwoord staat te wachten overleeft geen
  # reload van de YAML; de vraag staat dan nog op je telefoon terwijl "Ja"
  # nergens meer aankomt. Dat is precies waarom de zonnescherm- en
  # airco-vragen op 2026-08-06 gesplitst zijn - hier staat het meteen zo.
  timer:
    # Zolang deze loopt is de vraag al gesteld en wordt hij niet opnieuw
    # gesteld, ook niet voor een van de andere twee redenen. Alle drie komen
    # ze op hetzelfde neer ("zal ik de spa opwarmen?"), dus wie net "nee" zei
    # op de gratis-stroomvraag hoeft een half uur later niet dezelfde vraag te
    # krijgen omdat het water inmiddels onder de 20 staat.
    #
    # `restore`, anders begint hij na een herstart weer op idle: de
    # numeric_state- en template-triggers hieronder maken bij het opstarten een
    # verse overgang, dus op een koude dag kreeg je de vraag na elke herstart
    # opnieuw. Zelfde reden als bij timer.airco_zolder_vraag.
    backyard_spa_vraag:
      name: "Backyard Spa - Vraag gesteld"
      duration: "02:00:00"
      icon: mdi:comment-question-outline
      restore: true

    # Hoe lang "Ja" nog geldt. Even lang als het venster dat de satelliet
    # meekrijgt (30 minuten), zodat het niet uitmaakt via welk kanaal je
    # antwoordt. Lang genoeg om een melding op te merken, kort genoeg dat je
    # 's avonds niet per ongeluk de vraag van vanmiddag beantwoordt.
    backyard_spa_antwoord:
      name: "Backyard Spa - Antwoordvenster"
      duration: "00:30:00"
      icon: mdi:comment-question-outline
      restore: true

  template:
    - binary_sensor:
        - name: Backyard Spa - Aanwezig
          unique_id: backyard_spa_aanwezig
          icon: mdi:hot-tub
          # `has_value` dekt allebei de manieren waarop de spa kan verdwijnen:
          # de wifi-module die wegvalt (entiteit blijft bestaan, staat op
          # `unavailable`) en de integratie die eruit gaat (entiteit bestaat
          # niet meer). In allebei de gevallen onwaar.
          #
          # De 24 uur zijn ruim bemeten met opzet: een spa die een nacht van
          # het net is, is stuk en geen opgeruimde spa. Pas als hij een etmaal
          # niets heeft gezegd gaan we ervan uit dat hij is opgeborgen.
          state: >-
            {% set gezien = state_attr('input_datetime.backyard_spa_laatst_gezien',
                                       'timestamp') | float(0) %}
            {{ has_value('climate.intex_purespa')
               or (gezien > 0 and (now().timestamp() - gezien) < 86400) }}

  automation:
    # Het stempel bijhouden zolang de spa leeft. De tijdtrigger is de echte
    # motor - een spa die uren stil op temperatuur staat verandert van state
    # bijna niets, en dan zou het stempel verlopen terwijl hij er gewoon staat.
    # De starttrigger is er voor de allereerste keer: zonder stempel staat een
    # verse input_datetime op 1970 en zou de spa meteen als opgeruimd gelden.
    - id: backyard_spa_laatst_gezien
      alias: Backyard - Spa laatst gezien
      description: >-
        Houdt bij wanneer de spa voor het laatst een waarde gaf. Zie de
        toelichting bij binary_sensor.backyard_spa_aanwezig.
      mode: single
      triggers:
        - trigger: state
          entity_id: climate.intex_purespa
        - trigger: time_pattern
          minutes: "/30"
        - trigger: homeassistant
          event: start
      conditions:
        - condition: template
          value_template: "{{ has_value('climate.intex_purespa') }}"
      actions:
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.backyard_spa_laatst_gezien
          data:
            timestamp: "{{ now().timestamp() }}"

    - id: backyard_spa_error
      alias: Backyard - Spa Error
      description: >-
        Meldt spa-storingen in gewone taal. Er zijn twee soorten: de spa is
        bereikbaar en meldt zelf een code, of de spa is helemaal van het net
        (wifi-module). Dat laatste gebeurt regelmatig en kwam er eerst niet
        door: de oude conditie was "niet melden als climate.intex_purespa
        unavailable is", en juist bij verbindingsverlies vallen de errorcode
        en de climate-entiteit op dezelfde seconde om. Op 15-08-2026 om 02:50
        stond er e81 en ging er dus geen melding uit.
      mode: queued
      max: 5
      variables:
        code: "{{ states('sensor.intex_purespa_error_code') }}"
        # De *_error_description sensor levert alleen de sleutel ("e81"); de
        # leesbare tekst zit in de vertaling van de integratie en komt dus niet
        # mee in een notificatie. Daarom hier in het Nederlands, ontleend aan
        # de en.json van mathieu-mp/homeassistant-intex-spa.
        uitleg: >-
          {% set teksten = {
            'e81': 'geen verbinding met de spa - controleer of hij aan staat en of de wifi-module bereik heeft',
            'e90': 'te weinig of geen doorstroming - filtercartridge en circulatie nakijken',
            'e91': 'te weinig zout - zout bijvullen en de kabel van de zoutcel controleren',
            'e92': 'te veel zout - deels aftappen en met schoon water bijvullen',
            'e94': 'water te koud (onder 5 graden) - warm water bijvullen',
            'e95': 'water te heet - verwarming uit, filter en circulatie nakijken',
            'e96': 'systeemfout in de besturing - spa uitzetten en de stekker eruit',
            'e97': 'droogkookbeveiliging - meteen de stekker eruit en Intex bellen',
            'e99': 'temperatuursensor stuk - meteen de stekker eruit en Intex bellen' } %}
          {{ teksten.get(code, 'onbekende code, kijk op het bedieningspaneel') }}
      triggers:
        # De spa is bereikbaar en meldt zelf iets.
        #
        # DIE HALVE MINUUT IS GEEN BEDENKTIJD MAAR EEN VOLGORDEKWESTIE
        # De tak hieronder mag alleen af als de spa écht bereikbaar is, en dat
        # leest hij aan `climate.intex_purespa`. Bij verbindingsverlies zetten
        # allebei die entiteiten in dezelfde update om: in de historie van 15
        # augustus 2026 staan e81 en unavailable allebei op 00:50:41, tot op de
        # seconde. Wie van de twee de automatisering het eerst wakker maakt, is
        # dan niet iets om op te bouwen - kwam de errorcode eerst binnen, dan
        # stond de climate nog op `off` en ging er meteen een melding uit die
        # juist een kwartier had moeten wachten (en een kwartier later nog een
        # keer, voor hetzelfde voorval). Na dertig seconden staat het stof neer
        # en klopt de conditie hoe dan ook.
        #
        # Prijs: een echte spa-code komt een halve minuut later binnen dan hij
        # zou kunnen. Voor een melding over zout of doorstroming maakt dat
        # niets uit.
        - trigger: state
          entity_id: sensor.intex_purespa_error_code
          not_to:
            - none
            - unknown
            - unavailable
          for: "00:00:30"
          id: errorcode
        # De spa is weg. Een kwartier wachten: korte hikjes (wifi, een
        # herstartende module) herstellen vanzelf en zijn geen melding waard.
        - trigger: state
          entity_id: climate.intex_purespa
          to: unavailable
          for: "00:15:00"
          id: offline
        - trigger: state
          entity_id: climate.intex_purespa
          from: unavailable
          id: hersteld
      conditions:
        # Na een herstart komt alles kort als unavailable binnen; dat is geen
        # storing. Zie sensor.home_assistant_gestart in Dashboard Context.yaml.
        - condition: template
          value_template: >-
            {% set start = states('sensor.home_assistant_gestart') %}
            {{ start in ['unknown', 'unavailable']
               or (now() - (start | as_datetime)) > timedelta(minutes = 10) }}
      actions:
        - choose:
            - alias: Spa is van het net
              conditions:
                - condition: trigger
                  id: offline
                # EEN OPGERUIMDE SPA REAGEERT NIET, EN DAT IS GOED NIEUWS
                # Deze trigger hangt aan `unavailable` met `for: 15 minuten`,
                # en na een herstart van Home Assistant komt de entiteit
                # opnieuw als `unavailable` binnen. Zonder deze conditie kwam
                # deze melding er dus bij elke reboot weer uit, de hele winter
                # dat de spa in de schuur staat.
                #
                # De eerste keer gaat hij nog gewoon af: het stempel is dan een
                # kwartier oud en de sensor staat nog `on`. Pas na een etmaal
                # stilte valt hij om en houdt het op.
                - alias: Alleen als de spa hier hoort te staan
                  condition: state
                  entity_id: binary_sensor.backyard_spa_aanwezig
                  state: "on"
              sequence:
                - action: notify.mobile_devices_adults
                  metadata: {}
                  data:
                    title: Jacuzzi reageert niet meer
                    message: >-
                      Geen contact sinds
                      {{ trigger.to_state.last_changed | as_local
                         | as_timestamp | timestamp_custom('%H:%M') }}
                      {%- if code not in ['none', 'unknown', 'unavailable'] %},
                      laatste melding {{ code | upper }} ({{ uitleg }}){%- endif %}.
                      Verwarmen en de gratis-stroomregeling doen tot die tijd
                      niets. Meestal helpt de spa een halve minuut van het net
                      halen.
            - alias: Spa is er weer
              conditions:
                - condition: trigger
                  id: hersteld
                # Alleen als er ook een offline-melding uit is gegaan; onder
                # het kwartier van die trigger heeft "hij is er weer" geen
                # betekenis.
                - condition: template
                  value_template: >-
                    {{ (now() - trigger.from_state.last_changed).total_seconds() >= 900 }}
              sequence:
                - action: notify.mobile_devices_adults
                  metadata: {}
                  data:
                    title: Jacuzzi is er weer
                    message: >-
                      {% set temp = state_attr('climate.intex_purespa', 'current_temperature') %}
                      De spa reageert weer na
                      {{ ((now() - trigger.from_state.last_changed).total_seconds()
                          / 60) | round }} minuten. Verwarming staat
                      {{ 'aan' if is_state('switch.intex_purespa_power', 'on') else 'uit' }}
                      {%- if temp is number %}, water {{ temp | round(1) }} graden
                      {%- endif %}.
            - alias: Spa is bereikbaar en meldt een code
              conditions:
                - condition: trigger
                  id: errorcode
                # Bij verbindingsverlies verschijnt e81 terwijl de climate
                # omvalt; die kant hoort bij de offline-tak hierboven, die
                # eerst een kwartier wacht. Deze conditie kan daar alleen op
                # vertrouwen doordat de trigger een halve minuut wacht - zie
                # de toelichting daar.
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: climate.intex_purespa
                      state: unavailable
              sequence:
                - action: notify.mobile_devices_adults
                  metadata: {}
                  data:
                    title: "Jacuzzi meldt {{ code | upper }}"
                    message: "{{ uitleg | capitalize }}."

    - id: backyard_spa_temperature
      alias: Backyard - Spa Temperature
      description: Automations for Spa Temperature
      mode: single
      triggers:
        - trigger: template
          value_template: >-
            {{ state_attr('climate.intex_purespa', 'current_temperature') | int(0) >=
            states('input_number.backyard_spa_target_temperature') | int(0) }}
          id: temperature_reached
        - trigger: time
          at: "23:59:00"
          id: reset-today
        - trigger: state
          entity_id:
            - climate.intex_purespa
          attribute: current_temperature
          id: temperature-change
        - trigger: numeric_state
          attribute: current_temperature
          entity_id:
            - climate.intex_purespa
          below: 20
          id: too_cold
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - temperature_reached
              sequence:
                - action: climate.turn_off
                  metadata: {}
                  data: {}
                  target:
                    entity_id: climate.intex_purespa
                - if:
                    - condition: state
                      entity_id: input_boolean.backyard_spa_temperature_reached_today
                      state: "off"
                  then:
                    - action: notify.mobile_devices_adults
                      metadata: {}
                      data:
                        title: Intex Spa
                        message: >-
                          De ingestelde temperatuur van {{
                          state_attr('climate.intex_purespa','current_temperature') }}
                          °C is bereikt!
                    - action: input_boolean.turn_on
                      metadata: {}
                      data: {}
                      target:
                        entity_id:
                          - input_boolean.backyard_spa_keep_warm
                          - input_boolean.backyard_spa_temperature_reached_today
            - conditions:
                - condition: trigger
                  id:
                    - reset-today
              sequence:
                - action: input_boolean.turn_off
                  metadata: {}
                  data: {}
                  target:
                    entity_id:
                      - input_boolean.backyard_spa_temperature_reached_today
                      - input_boolean.backyard_spa_keep_warm
            # Bijstoken zodra het water onder de streeftemperatuur zakt. Ook dit
            # is nu een vraag. Let op de twee guards onderaan: zonder de eerste
            # zou hij tíjdens het opwarmen blijven vragen (het water is dan nog
            # steeds te koud en `current_temperature` verandert continu), en de
            # tweede houdt het bij hooguit één vraag per twee uur.
            - conditions:
                - condition: trigger
                  id:
                    - temperature-change
              sequence:
                - if:
                    - condition: and
                      conditions:
                        - condition: template
                          value_template: >-
                            {{ state_attr('climate.intex_purespa', 'current_temperature') | int(0) <
                            states('input_number.backyard_spa_target_temperature') | int(0) }}
                        - condition: state
                          entity_id: input_boolean.backyard_spa_keep_warm
                          state: "on"
                        - condition: state
                          entity_id: switch.intex_purespa_sanitizer
                          state: "off"
                        - alias: De spa staat niet al te verwarmen
                          condition: state
                          entity_id: climate.intex_purespa
                          state: "off"
                        - alias: Recent al gevraagd? Dan nu even niet
                          condition: state
                          entity_id: timer.backyard_spa_vraag
                          state: idle
                  then:
                    - action: script.spa_verwarmen_vragen
                      data:
                        reden: warmhouden
            # Water onder de 20 graden ging vroeger meteen op de verwarming.
            # Dat is geen vorstbeveiliging - bij 20 graden vriest er niets - maar
            # een comfortkeuze, en die is aan jou. Vandaar ook hier een vraag.
            - conditions:
                - condition: trigger
                  id:
                    - too_cold
              sequence:
                - if:
                    - alias: De spa staat niet al te verwarmen
                      condition: state
                      entity_id: climate.intex_purespa
                      state: "off"
                    - alias: Recent al gevraagd? Dan nu even niet
                      condition: state
                      entity_id: timer.backyard_spa_vraag
                      state: idle
                  then:
                    - action: script.spa_verwarmen_vragen
                      data:
                        reden: koud

    - id: backyard_spa_sanitizer
      alias: Backyard - Spa Sanitizer
      description: Turn on the sanitizer when too long off
      mode: single
      triggers:
        - trigger: time_pattern
          hours: /1
          id: check_for_longtime_off
        - trigger: state
          entity_id:
            - switch.intex_purespa_sanitizer
          from: "on"
          to: "off"
          id: sanitizer_finished
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - check_for_longtime_off
              sequence:
                - if:
                    - condition: and
                      conditions:
                        - condition: not
                          conditions:
                            - condition: state
                              entity_id: climate.intex_purespa
                              state: heat
                        - condition: state
                          entity_id: switch.intex_purespa_sanitizer
                          state: "off"
                          for:
                            hours: 24
                            minutes: 0
                            seconds: 0
                  then:
                    - action: switch.turn_on
                      metadata: {}
                      data: {}
                      target:
                        entity_id: switch.intex_purespa_sanitizer
            - conditions:
                - condition: trigger
                  id:
                    - sanitizer_finished
              sequence:
                - stop: Dit willen we even niet meer
                  error: false
                - action: climate.turn_on
                  metadata: {}
                  data: {}
                  target:
                    entity_id: climate.intex_purespa
                - action: climate.set_hvac_mode
                  metadata: {}
                  data:
                    hvac_mode: heat
                  target:
                    entity_id: climate.intex_purespa

    - id: backyard_spa_free_power
      alias: Backyard - Spa free heating
      description: Turn on spa when heating is free (overcapacity) or even paid!
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - switch.live_energieverbruik_totaal_negatief
          to: "on"
          for:
            hours: 0
            minutes: 5
            seconds: 0
          id: much_overcapacity
        - trigger: numeric_state
          entity_id:
            - sensor.live_energieverbruik_totaal
          for:
            hours: 0
            minutes: 5
            seconds: 0
          above: 0
          id: no_overcapacity
        # Let op de sensornaam: ..._negatieve_ALL_IN_prijs_nu, niet
        # ..._negatieve_prijs_nu. Die laatste kijkt naar de kale marktprijs,
        # terwijl we bij verbruik het hele tarief betalen (markt + inkoop +
        # energiebelasting + btw). Bij een licht negatieve marktprijs kost
        # opwarmen dus nog gewoon geld; pas onder een negatief totaaltarief
        # krijgen we betaald om te stoken.
        #
        # Die som stond hier eerst met de hand uitgeschreven; sinds 2026-08-06
        # levert SlimHuys hem kant-en-klaar. Scheelt ook het randgeval waarin
        # het tarief precies 0,00 is en tussen `below` en `above` door viel.
        - trigger: state
          entity_id: binary_sensor.meterkast_slimhuys_zonneplan_negatieve_all_in_prijs_nu
          to: "on"
          # Na een herstart komt een binary sensor via `unknown`
          # binnen; zonder deze guard telt dat als een echte
          # prijswissel en gaat de tak eronder onnodig lopen.
          not_from:
            - unknown
            - unavailable
          id: negative_price
        - trigger: state
          entity_id: binary_sensor.meterkast_slimhuys_zonneplan_negatieve_all_in_prijs_nu
          to: "off"
          # Na een herstart komt een binary sensor via `unknown`
          # binnen; zonder deze guard telt dat als een echte
          # prijswissel en gaat de tak eronder onnodig lopen.
          not_from:
            - unknown
            - unavailable
          id: positive_price
      conditions:
        - condition: not
          conditions:
            - condition: state
              entity_id: climate.intex_purespa
              state: unavailable
      actions:
        - choose:
            # HIER GING DE SPA VROEGER GEWOON AAN
            # Deze tak zette de spa op 37 graden zodra de stroom niets kostte.
            # Dat is een prima aanbod maar geen besluit dat het huis alleen
            # hoort te nemen: je staat er niet altijd op te wachten, en een spa
            # van 37 graden die niemand gebruikt is alsnog zonde. Nu is het een
            # vraag; het antwoord komt binnen bij `backyard_spa_antwoord`.
            #
            # Alleen "ja" zet `free_heating_enabled` aan, en dat is de vlag
            # waarop de tak hieronder hem straks weer uitzet als de prijs
            # omslaat. Blijft de vraag onbeantwoord, dan is er niets aangezet
            # en valt er ook niets uit te zetten.
            - conditions:
                - condition: trigger
                  id:
                    - much_overcapacity
                    - negative_price
                - condition: state
                  entity_id: input_boolean.backyard_spa_free_heating_enabled
                  state: "off"
                # Draait hij al (met de hand, of omdat je net "ja" zei op een
                # van de andere vragen), dan valt er niets te vragen. Dit dekt
                # meteen een onbereikbare spa af: die staat niet op `off`.
                - alias: De spa staat niet al te verwarmen
                  condition: state
                  entity_id: climate.intex_purespa
                  state: "off"
                # Overcapaciteit wipt op een dag met wolkenvelden om de haverklap
                # over de grens heen en weer. Zonder deze rem is dat elke keer
                # een nieuwe melding.
                - alias: Recent al gevraagd? Dan nu even niet
                  condition: state
                  entity_id: timer.backyard_spa_vraag
                  state: idle
              sequence:
                - action: script.spa_verwarmen_vragen
                  data:
                    reden: gratis
            - conditions:
                - condition: trigger
                  id:
                    - positive_price
                    - no_overcapacity
                - condition: state
                  entity_id: input_boolean.backyard_spa_free_heating_enabled
                  state: "on"
              sequence:
                - action: climate.turn_off
                  metadata: {}
                  data: {}
                  target:
                    entity_id: climate.intex_purespa
                - action: input_boolean.turn_off
                  metadata: {}
                  data: {}
                  target:
                    entity_id: input_boolean.backyard_spa_free_heating_enabled

    ###########################################################################
    ## HET ANTWOORD OP DE VRAAG AFHANDELEN
    ###########################################################################
    # Los van de vraag zelf, zodat er niets hoeft te blijven wachten - zie de
    # toelichting bovenaan dit bestand. Alle drie de antwoordkanalen komen
    # hier binnen: de knoppen op de telefoon, het `spraak_antwoord`-event van
    # de satelliet in de keuken, en de Ja/Nee-knoppen in de vraag-popup op het
    # Overzicht-dashboard (die vuren hetzelfde event).
    #
    # De telefoonknoppen hebben vaste namen (`SPA_GRATIS_JA` en verwanten) en
    # geen `context.id` erachter zoals bij het zonnescherm: deze afhandelaar
    # is een losse automatisering en kan een per-run gegenereerde naam toch
    # niet kennen. De geldigheid komt van `timer.backyard_spa_antwoord`.
    #
    # Waarom twee sleutels en niet één: "ja" op de gratis-stroomvraag doet iets
    # anders dan "ja" op de andere twee. Alleen de eerste stookt naar 37 graden
    # en zet `free_heating_enabled` aan, waardoor hij vanzelf weer uitgaat als
    # de prijs omslaat. De sleutel zit in de naam van de knop en in de
    # `vraag`-sleutel van de satelliet, dus er hoeft nergens iets onthouden te
    # worden.
    - id: backyard_spa_antwoord
      alias: Backyard - Spa antwoord op de vraag
      description: >-
        Warmt de spa op als je "Ja" antwoordt op de opwarmvraag, mits het
        antwoordvenster nog loopt. "Nee" legt de vraag zes uur stil.
      mode: single
      triggers:
        # Zonder filter: de knopnamen staan hieronder in de conditie, en een
        # event van een andere melding (zonnescherm, zolderairco) valt daar af.
        - trigger: event
          event_type: mobile_app_notification_action
        - trigger: event
          event_type: spraak_antwoord
          event_data:
            vraag: spa_gratis
        - trigger: event
          event_type: spraak_antwoord
          event_data:
            vraag: spa_warm
      conditions:
        - alias: Hoort bij de spa-vraag
          condition: template
          value_template: >-
            {% set actie = trigger.event.data.action | default('', true) %}
            {{ trigger.event.event_type == 'spraak_antwoord'
               or actie.startswith('SPA_GRATIS_')
               or actie.startswith('SPA_WARM_') }}
        - alias: Het antwoordvenster loopt nog
          condition: state
          entity_id: timer.backyard_spa_antwoord
          state: active
      actions:
        - variables:
            actie: "{{ trigger.event.data.action | default('', true) }}"
        - variables:
            ja: >-
              {{ trigger.event.data.get('antwoord') == 'ja'
                 or actie.endswith('_JA') }}
            gratis: >-
              {{ trigger.event.data.get('vraag') == 'spa_gratis'
                 or actie.startswith('SPA_GRATIS_') }}
        # Venster meteen dicht: twee telefoons die allebei "Ja" tikken hoeven
        # de spa niet twee keer aan te zetten.
        - action: timer.cancel
          target:
            entity_id: timer.backyard_spa_antwoord
        # Beantwoord op de telefoon? Dan hoeft de satelliet er niet meer op te
        # wachten. Kwam het antwoord uit de keuken, dan heeft het intent de
        # vraag zelf al gesloten en doet deze aanroep niets.
        - action: script.spraak_vraag_sluiten
        - choose:
            - alias: Nee, nu even niet
              conditions:
                - "{{ not ja }}"
              sequence:
                # Zelfde gedachte als het zonnescherm-override: wie nee zegt
                # wil er voorlopig niet meer over gebeld worden. Zes uur is
                # ruim langer dan de gewone rem van twee, en korter dan een
                # hele dag - vanavond mag hij het best opnieuw vragen.
                - action: timer.start
                  target:
                    entity_id: timer.backyard_spa_vraag
                  data:
                    duration: "06:00:00"
            - alias: Ja, en het was de gratis-stroomvraag
              conditions:
                - "{{ gratis }}"
              sequence:
                # De vraag mag een half uur open blijven staan, en zo lang duurt
                # een gratis venster niet altijd. Zonder deze hercontrole zet
                # een late "Ja" de spa op 37 graden op vol tarief - precies wat
                # deze hele regeling wilde voorkomen.
                - if:
                    - alias: Het is nog steeds gratis
                      condition: template
                      value_template: >-
                        {{ is_state('binary_sensor.meterkast_slimhuys_zonneplan_negatieve_all_in_prijs_nu', 'on')
                           or is_state('switch.live_energieverbruik_totaal_negatief', 'on') }}
                  then:
                    - if:
                        - condition: state
                          entity_id: switch.intex_purespa_power
                          state: "off"
                      then:
                        - action: switch.turn_on
                          target:
                            entity_id: switch.intex_purespa_power
                    - action: climate.turn_on
                      target:
                        entity_id: climate.intex_purespa
                    - action: climate.set_temperature
                      target:
                        entity_id: climate.intex_purespa
                      data:
                        temperature: 37
                        hvac_mode: heat
                    - action: input_boolean.turn_on
                      target:
                        entity_id: input_boolean.backyard_spa_free_heating_enabled
                  else:
                    - action: notify.mobile_devices_adults
                      data:
                        title: Gratis stroom is net voorbij
                        message: >-
                          De spa blijft uit: opwarmen kost nu gewoon geld. Wil
                          je het toch, zet hem dan met de hand aan.
          default:
            # "Ja" op de koud- of warmhoudenvraag: opwarmen naar de ingestelde
            # streeftemperatuur. `backyard_spa_temperature` zet hem daar weer
            # uit zodra die gehaald is.
            - action: climate.turn_on
              target:
                entity_id: climate.intex_purespa
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.intex_purespa
              data:
                hvac_mode: heat

  script:
    ###########################################################################
    ## ALLEEN VRAGEN; HET ANTWOORD WORDT ELDERS AFGEHANDELD
    ###########################################################################
    # Eén script voor alle drie de redenen, zodat de vraag overal hetzelfde
    # klinkt en de rem, het antwoordvenster en de nachtstilte maar op één plek
    # staan. De aanroepers hoeven alleen te weten waaróm ze het vragen.
    spa_verwarmen_vragen:
      alias: Spa - Vragen of hij opgewarmd mag worden
      description: >-
        Stelt de vraag "zal ik de spa opwarmen?" op de telefoon, op de
        satelliet en op het wandpaneel. Het antwoord komt binnen bij
        automation.backyard_spa_antwoord; hier blijft niets staan wachten.
      icon: mdi:hot-tub
      mode: single
      max_exceeded: silent
      fields:
        reden:
          name: Reden
          description: Waarom het huis het vraagt
          required: true
          example: gratis
          selector:
            select:
              options:
                - gratis
                - koud
                - warmhouden
      sequence:
        # Staat de spa in het schuurtje, dan valt er niets op te warmen. Zie de
        # toelichting bij binary_sensor.backyard_spa_aanwezig; dat is de enige
        # plek waar "is de spa er nog" wordt vastgesteld.
        - alias: De spa staat er nog
          condition: state
          entity_id: binary_sensor.backyard_spa_aanwezig
          state: "on"
        # Een negatief tarief valt ook wel eens om drie uur 's nachts. Vroeger
        # ging de spa dan stil aan; nu zou het een melding zijn die je wakker
        # maakt voor iets dat tot morgen kan wachten. De prijs hiervan is dat
        # een gratis nachtvenster ongebruikt voorbijgaat. Zelfde afweging als
        # bij de zolderairco, die tussen 22:30 en 08:00 ook niets vraagt.
        - alias: Niet midden in de nacht vragen
          condition: time
          after: "07:00:00"
          before: "23:00:00"
        - variables:
            doel: "{{ states('input_number.backyard_spa_target_temperature') | int(38) }}"
            # De sleutel die de satelliet en de vraag-pil op het dashboard
            # onthouden. Twee sleutels, want het antwoord pakt er anders op uit;
            # zie de toelichting bij `backyard_spa_antwoord`. Rechtstreeks uit
            # `reden` afgeleid en niet uit een tussenvariabele: dan kan het niet
            # misgaan op een "False" die als tekst waar blijkt te zijn.
            sleutel: "{{ 'spa_gratis' if reden == 'gratis' else 'spa_warm' }}"
            water: >-
              {%- set temp = state_attr('climate.intex_purespa', 'current_temperature') -%}
              {%- if temp is number -%}Het water is {{ temp | round(1) }} graden.
              {%- else -%}De spa geeft nu geen temperatuur door.{%- endif -%}
            titel: >-
              {%- if reden == 'gratis' -%}Gratis stroom - spa opwarmen?
              {%- elif reden == 'koud' -%}Spa is koud - opwarmen?
              {%- else -%}Spa warm houden?{%- endif -%}
        # Alle regels hieronder staan even diep ingesprongen, en dat is geen
        # opmaak maar noodzaak: in een `>-`-blok wordt een regel die dieper
        # inspringt dan de eerste letterlijk overgenomen, mét regeleinde. Zet je
        # de tekst netjes onder de `{% if %}` ingesprongen, dan staan er harde
        # enters in de melding en leest de satelliet ze mee voor.
        - variables:
            vraagtekst: >-
              {%- if reden == 'gratis' -%}
              De stroom is nu gratis of levert zelfs geld op. {{ water }} Zal ik
              de spa opwarmen naar 37 graden?
              {%- elif reden == 'koud' -%}
              {{ water }} Zal ik hem opwarmen naar {{ doel }} graden?
              {%- else -%}
              {{ water }} Dat is onder de ingestelde {{ doel }} graden. Zal ik de
              spa bijstoken?
              {%- endif -%}
        # Eerst de rem, dan pas de vraag: gaat er onderweg iets mis, dan is de
        # melding hooguit blijven liggen in plaats van elk kwartier opnieuw
        # verstuurd.
        - action: timer.start
          target:
            entity_id: timer.backyard_spa_vraag
        - action: timer.start
          target:
            entity_id: timer.backyard_spa_antwoord
        - action: notify.mobile_devices_adults
          data:
            title: "{{ titel }}"
            message: "{{ vraagtekst }}"
            data:
              actions:
                - action: "{{ 'SPA_GRATIS_JA' if reden == 'gratis' else 'SPA_WARM_JA' }}"
                  title: Ja
                - action: "{{ 'SPA_GRATIS_NEE' if reden == 'gratis' else 'SPA_WARM_NEE' }}"
                  title: Nee
        # Tweede en derde kanaal, dezelfde vraag. Is er iemand thuis, dan vraagt
        # de keuken-satelliet het ook hardop en luistert hij naar het antwoord;
        # tegelijk verschijnt de vraag-pil op het Overzicht-dashboard, want die
        # hangt aan dezelfde input_text. Het script stopt vanzelf als de
        # satelliet er niet is; de melding op de telefoon staat daar los van.
        #
        # `script.turn_on` en niet een gewone aanroep: dat script staat te
        # luisteren of je antwoord geeft, en daar zou deze run anders op
        # blijven wachten. Het venster van 30 minuten is even lang als
        # timer.backyard_spa_antwoord, zodat het niet uitmaakt via welk kanaal
        # je antwoordt.
        - if:
            - condition: state
              entity_id: group.all_adults
              state: home
          then:
            - action: script.turn_on
              target:
                entity_id: script.spraak_vraag_stellen
              data:
                variables:
                  vraag: "{{ sleutel }}"
                  tekst: "{{ vraagtekst }}"
                  minuten: 30
              continue_on_error: true
