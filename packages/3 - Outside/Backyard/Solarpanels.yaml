backyard_solarpanels_package:

  template:
    - sensor:
        - name: Forecast Solar Production Today
          unique_id: forecast_solar_production_today
          unit_of_measurement: kWh
          state_class: total
          device_class: energy
          # `| float` zonder default brak het hele template zodra een van de
          # bronnen unavailable was (sensor stuk + errors in de log). Met
          # availability wordt de sensor dan netjes unavailable, en de
          # batterij-ochtendtrigger die hierop leunt slaat die dag over.
          availability: >-
            {{ has_value('sensor.overloop_zolder_zonnepanelen_schatting_geschatte_energieproductie_vandaag')
               and has_value('sensor.energy_production_today') }}
          state: >-
            {{ states('sensor.overloop_zolder_zonnepanelen_schatting_geschatte_energieproductie_vandaag') | float(0)
               + states('sensor.energy_production_today') | float(0) }}

        ######################################################################
        ## DE TWEE ARRAYS HEBBEN ELK HUN EIGEN FORECAST.SOLAR-SENSOREN
        ##
        ## `sensor.energy_production_*` klinkt als het hele huis, maar dat is
        ## alleen de OVERKAPPING - zie de friendly name, die begint met
        ## "Overkapping Zonnepanelen Schatting". De zolder voorzijde zit in
        ## `sensor.overloop_zolder_zonnepanelen_schatting_*`.
        ##
        ## Dat is een makkelijke val: de batterijregie keek tot 2026-08-15
        ## alleen naar de overkapping en zag daardoor structureel zo'n 35% te
        ## weinig zon aankomen (op 15 augustus 11,4 kWh terwijl er 17,7
        ## verwacht werd). Elke drempel die je daarop zet is dus verkeerd
        ## geijkt. Alles wat over "de zonverwachting" gaat hoort daarom deze
        ## drie sensoren te gebruiken en nooit één array los.
        ######################################################################
        - name: Forecast Solar Production Today Remaining
          unique_id: forecast_solar_production_today_remaining
          unit_of_measurement: kWh
          state_class: total
          device_class: energy
          availability: >-
            {{ has_value('sensor.overloop_zolder_zonnepanelen_schatting_geschatte_energieproductie_resterend_vandaag')
               and has_value('sensor.energy_production_today_remaining') }}
          state: >-
            {{ states('sensor.overloop_zolder_zonnepanelen_schatting_geschatte_energieproductie_resterend_vandaag') | float(0)
               + states('sensor.energy_production_today_remaining') | float(0) }}

        - name: Forecast Solar Production Tomorrow
          unique_id: forecast_solar_production_tomorrow
          unit_of_measurement: kWh
          state_class: total
          device_class: energy
          availability: >-
            {{ has_value('sensor.overloop_zolder_zonnepanelen_schatting_geschatte_energieproductie_morgen')
               and has_value('sensor.energy_production_tomorrow') }}
          state: >-
            {{ states('sensor.overloop_zolder_zonnepanelen_schatting_geschatte_energieproductie_morgen') | float(0)
               + states('sensor.energy_production_tomorrow') | float(0) }}

  automation:
    - id: notification_backyard_solarpanels_error
      alias: Backyard Solarpanels - Inverter Error
      description: >-
        The inverter in the backyard for our solarpanels can create errors; I want
        them as push notification
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - sensor.errors
          to: null
          for:
            hours: 0
            minutes: 1
            seconds: 0
      conditions: []
      actions:
        - if:
            - condition: template
              value_template: >-
                {% if (states.sensor.errors.state == "") %} false {% else %} true {%
                endif %}
          then:
            - action: notify.mobile_devices_adults
              metadata: {}
              data:
                message: >-
                  Er zijn errors op de omvormer in de overkapping;
                  {{states.sensor.errors.state}}
                title: Achtertuin Overkapping - Omvormer Error
          else:
            - action: notify.mobile_devices_adults
              metadata: {}
              data:
                message: Er zijn geen errors meer op de omvormer in de overkapping.
                title: Achtertuin Overkapping - Omvormer Error

    - id: restart_solarpanels_backyard
      alias: Solarpanels - Restart Integration when needed
      description: "Restart the integration when unavailable"
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - sensor.inverter_kroon_18_overkapping_energy
          to: unavailable
          for:
            hours: 0
            minutes: 1
            seconds: 0
        - trigger: state
          entity_id:
            - sensor.inverter_kroon_18_zolder_voorzijde_energy
          to: unavailable
          for:
            hours: 0
            minutes: 1
            seconds: 0
        - trigger: time_pattern
          minutes: /5
      conditions: []
      actions:
        - if:
            - condition: state
              entity_id: sensor.inverter_kroon_18_overkapping_energy
              state: unavailable
          then:
            - action: homeassistant.reload_config_entry
              metadata: {}
              data:
                entry_id: 01JCBKTQAM72Y8202G7F57WN6Z
        - if:
            - condition: state
              entity_id: sensor.inverter_kroon_18_zolder_voorzijde_energy
              state: unavailable
          then:
            - action: homeassistant.reload_config_entry
              metadata: {}
              data:
                entry_id: 01JCBKS8RM752RMKK5RPYZBGSS
    - id: solarpanels_backyard_onoff
      alias: Solarpanels - Turn off - Energyprice negative
      description: "Solarpanels off when the all-in power price is negative"
      mode: single
      triggers:
        # Let op de sensornaam: ..._negatieve_ALL_IN_prijs_nu, niet
        # ..._negatieve_prijs_nu. Die laatste kijkt naar de kale marktprijs, en
        # bij teruglevering krijgen we het TOTAALtarief (markt + inkoop +
        # energiebelasting + btw). Bij een licht negatieve marktprijs levert
        # teruglevering dus nog gewoon geld op en horen de panelen aan te
        # blijven; uitzetten mag pas als het totaaltarief zelf onder nul zakt.
        #
        # Hier stond die som met de hand (numeric_state op huidige_prijs onder
        # nul). Sinds 2026-08-06 rekent SlimHuys hem zelf uit en draagt de
        # sensor `epex_now`, `total_now` en `threshold` als attributen mee, dus
        # er valt hier niets meer zelf te bedenken. Bijvangst: een tarief van
        # precies 0,00 viel tussen `below: 0` en `above: 0` door en liet de
        # panelen in hun laatste stand hangen.
        - trigger: state
          entity_id: binary_sensor.meterkast_slimhuys_zonneplan_negatieve_all_in_prijs_nu
          to: "on"
          # Na een herstart komt een binary sensor via `unknown`
          # binnen; zonder deze guard telt dat als een echte
          # prijswissel en gaat de tak eronder onnodig lopen.
          not_from:
            - unknown
            - unavailable
          id: solar_panels_off
        - trigger: state
          entity_id: binary_sensor.meterkast_slimhuys_zonneplan_negatieve_all_in_prijs_nu
          to: "off"
          # Na een herstart komt een binary sensor via `unknown`
          # binnen; zonder deze guard telt dat als een echte
          # prijswissel en gaat de tak eronder onnodig lopen.
          not_from:
            - unknown
            - unavailable
          id: solar_panels_on
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - solar_panels_off
              sequence:
                - action: notify.mobile_devices_adults
                  metadata: {}
                  data:
                    message: >-
                      Totaaltarief is € {{ states('sensor.slimhuys_zonneplan_huidige_prijs') }}
                      per kWh; zonnepanelen zijn uitgezet, hou in de gaten of ze
                      ook weer aan gaan!
                    title: Totaaltarief negatief
                - action: select.select_option
                  metadata: {}
                  data:
                    option: off_grid
                  target:
                    entity_id: select.goodwe_bedrijfsmodus_omvormer
            - conditions:
                - condition: trigger
                  id:
                    - solar_panels_on
              sequence:
                - action: select.select_option
                  metadata: {}
                  data:
                    option: general
                  target:
                    entity_id: select.goodwe_bedrijfsmodus_omvormer
                - action: notify.mobile_devices_adults
                  metadata: {}
                  data:
                    message: Zonnepanelen zijn weer aangezet
                    title: Totaaltarief positief
