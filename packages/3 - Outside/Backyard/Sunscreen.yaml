backyard_sunscreen_package:
  automation:
    - id: backyard_sunscreen
      alias: Backyard - Sunscreen open or close
      description: Backyard sunscreen close when sun is gone or open when sun is there
      mode: single
      triggers:
        - trigger: numeric_state
          entity_id:
            - sensor.achtertuin_zon_luminance
          for:
            hours: 0
            minutes: 30
            seconds: 0
          below: 20000
          id: sun_gone_30m
        - trigger: numeric_state
          entity_id:
            - sensor.achtertuin_zon_luminance
          for:
            hours: 0
            minutes: 30
            seconds: 0
          above: 20000
          id: sun_above_30m
        - domain: mqtt
          device_id: !secret bedroom_button_1
          type: action
          subtype: single
          trigger: device
          id: single
        - domain: mqtt
          device_id: !secret bedroom_button_2
          type: action
          subtype: single
          trigger: device
          id: single
        # Virtuele druk, zie packages/9 - Other/Virtual Buttons.yaml
        - trigger: event
          event_type: virtual_button
          event_data:
            button: bedroom_buttons
            action: single
          id: single
      conditions:
        # Vervangen door de klimaatregie zodra die aan staat: die kijkt naar
        # het seizoen en naar de gevel in plaats van alleen naar lux, en houdt
        # het scherm 's winters juist ingetrokken voor de gratis warmte.
        # Zie packages/9 - Other/Klimaat Zonwering.yaml (zone 'zonnescherm').
        - condition: state
          entity_id: input_boolean.klimaatregie_actief
          state: "off"
      actions:
        - variables:
            action_sunscreen_open: "{{ 'OPEN_' ~ context.id }}"
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - sun_gone_30m
                    - single
              sequence:
                - if:
                    - condition: state
                      entity_id: cover.achtertuin_zonnescherm
                      state: open
                  then:
                    - action: cover.close_cover
                      metadata: {}
                      data: {}
                      target:
                        entity_id: cover.achtertuin_zonnescherm
            - conditions:
                - condition: trigger
                  id:
                    - sun_above_30m
              sequence:
                - if:
                    - condition: state
                      entity_id: cover.achtertuin_zonnescherm
                      state: closed
                  then:
                    - action: notify.mobile_devices_adults
                      metadata: {}
                      data:
                        message: Zon in de achtertuin, wil je het zonnescherm uit?
                        title: Zon achter
                        data:
                          actions:
                            - action: "{{ action_sunscreen_open }}"
                              title: Ja
                    - wait_for_trigger:
                        - event_type: mobile_app_notification_action
                          event_data:
                            action: "{{ action_sunscreen_open }}"
                          trigger: event
                      timeout:
                        hours: 0
                        minutes: 15
                        seconds: 0
                        milliseconds: 0
                    - choose:
                        - conditions:
                            # `wait.trigger` is None bij een timeout; zonder
                            # die check gooit dit template dan een fout.
                            - condition: template
                              value_template: >-
                                {{ wait.trigger is not none
                                   and wait.trigger.event.data.action ==
                                   action_sunscreen_open }}
                          sequence:
                            - action: cover.open_cover
                              metadata: {}
                              data: {}
                              target:
                                entity_id: cover.achtertuin_zonnescherm

    - id: backyard_sunscreen_close
      alias: Zonwering - Binnenhalen bij regen
      description: >-
        Notify adults when rain is expected and the backyard sunscreen and/or the
        kitchen screens are still out, so they can be taken in with one tap
      mode: single
      # Let op de omgekeerde betekenis: het zonnescherm is uitgerold als het
      # 'open' is (close_cover haalt het in), de keukenscreens hangen omlaag als
      # ze 'closed' zijn (open_cover haalt ze op). Zie ook
      # packages/9 - Other/Covers.yaml -> covers_sun_protection.
      variables:
        sunscreen_out: "{{ is_state('cover.achtertuin_zonnescherm', 'open') }}"
        kitchen_screens_down: >-
          {{ expand('cover.keuken_screen_links', 'cover.keuken_screen_rechts')
             | selectattr('state', 'in', ['closed', 'closing'])
             | map(attribute='entity_id') | list }}
      triggers:
        - trigger: numeric_state
          entity_id:
            - sensor.neerslag_komende_30_minuten
          # Sinds sensor.neerslag_komende_30_minuten echte millimeters geeft
          # (was de opgetelde 0-255 intensiteitscode, ~550 bij motregen) hoort
          # hier geen 1 meer: 1 mm in een half uur is een flinke bui en dan
          # kwam deze melding vrijwel nooit meer. 0 houdt het gedrag zoals het
          # was — elke voorspelde neerslag — want de sensor rondt op 2
          # decimalen af, dus droog is exact 0. Te gretig? Zet hem op 0.1.
          above: 0
      conditions:
        # Staat de klimaatregie aan, dan haalt die de screens bij regen zelf
        # binnen (regel 6 in custom_templates/klimaat.jinja) en is deze vraag
        # alleen nog een tik op je telefoon voor iets dat al gebeurd is.
        - condition: state
          entity_id: input_boolean.klimaatregie_actief
          state: "off"
        - alias: Staat er nog iets uit?
          condition: template
          value_template: "{{ sunscreen_out or kitchen_screens_down | count > 0 }}"
      actions:
        - variables:
            action_sunscreen_close: "{{ 'CLOSE_' ~ context.id }}"
            zonwering: >-
              {% if sunscreen_out and kitchen_screens_down %}het zonnescherm en de keukenscreens staan
              {%- elif sunscreen_out %}het zonnescherm staat
              {%- else %}de keukenscreens staan{%- endif %}
        - action: notify.mobile_devices_adults
          metadata: {}
          data:
            title: Zonwering uit; het gaat regenen
            message: >-
              Het gaat regenen in de komende 30 minuten en {{ zonwering }} nog uit,
              wil je deze binnenhalen?
            data:
              actions:
                - action: "{{ action_sunscreen_close }}"
                  title: Ja
        - wait_for_trigger:
            - event_type: mobile_app_notification_action
              event_data:
                action: "{{ action_sunscreen_close }}"
              trigger: event
          timeout:
            hours: 0
            minutes: 15
            seconds: 0
            milliseconds: 0
          continue_on_timeout: false
        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ wait.trigger.event.data.action == action_sunscreen_close }}"
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ sunscreen_out }}"
                  then:
                    - action: cover.close_cover
                      metadata: {}
                      data: {}
                      target:
                        entity_id: cover.achtertuin_zonnescherm
                  alias: Zonnescherm inrollen
                - if:
                    - condition: template
                      value_template: "{{ kitchen_screens_down | count > 0 }}"
                  then:
                    - action: cover.open_cover
                      metadata: {}
                      data: {}
                      target:
                        entity_id: "{{ kitchen_screens_down }}"
                  alias: Keukenscreens omhoog
