backyard_lights_package:
  input_number:
    lights_backyard_plants_percentage:
      name: "Lights Backyard Plants - Percentage"
      min: 0
      max: 100
      step: 1
      icon: mdi:lightbulb-on-70

  automation:
    # Sinds 17 augustus 2026 op dezelfde blueprint als de carport en de
    # voordeur. Hiervoor had de achtertuin als enige een eigen luxtak, en dat
    # liep zichtbaar uit elkaar: op een grauwe ochtend gingen alle drie om
    # 07:26 uit op zonsopkomst +1u, waarna de luxmeter alléén de achtertuin om
    # 07:56 weer aanzette. De drempels en de reden erachter staan nu in de kop
    # van blueprints/automation/robin/buitenlicht.yaml.
    #
    # Wat hier verdwenen is: de oude uit-tak mocht alleen tussen 09:00 en 17:00
    # schakelen terwijl de aan-tak nergens aan gebonden was. Die scheefheid is
    # precies waarom de lampen een hele grauwe dag konden blijven branden. De
    # blueprint bakent nu beide kanten met dezelfde zonmomenten af.
    - id: lights_backyard
      alias: Backyard - Lights
      description: Turn on or off the lights at the backyard
      use_blueprint:
        path: robin/buitenlicht.yaml
        input:
          lamp: light.achtertuin_lampen
          helderheid: input_number.lights_backyard_plants_percentage

    # Het enige wat de achtertuin écht apart doet en dus buiten de blueprint
    # blijft: thuiskomen in het donker. Ontwapen je het alarm tussen
    # zonsondergang -1u en zonsopkomst +1u, dan staat de tuin meteen aan.
    # Dezelfde twee zonmomenten als de blueprint gebruikt, met opzet.
    - id: lights_backyard_alarm_disarmed
      alias: Backyard - Lights - Alarm disarmed
      description: Turn on the backyard lights when the alarm is disarmed after dark
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - alarm_control_panel.alarmo
          to: disarmed
      conditions:
        - condition: sun
          after: sunset
          after_offset: "-01:00:00"
          before: sunrise
          before_offset: "+01:00:00"
      actions:
        - action: light.turn_on
          data:
            transition: "{{ states('input_number.lights_transition_seconds')|int }}"
            brightness_pct: "{{ states('input_number.lights_backyard_plants_percentage')|int }}"
          target:
            entity_id:
              - light.achtertuin_lampen

    - id: backyard_lights_bedroom_button_single_press
      alias: Backyard - Lights - Bedroom Buttons - Single Press
      description: "One single press on one of the bedroom buttons"
      mode: single
      triggers:
        # Eén event uit de router in
        # packages/1 - First Floor/Bedroom/Buttons.yaml.
        - trigger: event
          event_type: huis_routine
          event_data:
            routine: avond
      conditions: []
      actions:
        - action: light.turn_off
          data:
            transition: "{{ states('input_number.lights_transition_seconds')|int }}"
          target:
            entity_id:
              - light.achtertuin_lampen
        # Een groep losse lampen laat er met één uit-commando met transition
        # geregeld eentje branden; vandaar de tweede zonder fade.
        - delay:
            seconds: 2
        - action: light.turn_off
          target:
            entity_id:
              - light.achtertuin_lampen
