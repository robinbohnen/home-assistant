backyard_lights_package:
  input_number:
    lights_backyard_plants_percentage:
      name: "Lights Backyard Plants - Percentage"
      min: 0
      max: 100
      step: 1
      icon: mdi:lightbulb-on-70

  automation:
    - id: lights_backyard
      alias: Backyard - Lights
      description: Turn on or off the lights at the backyard
      triggers:
        - id: sunset
          trigger: sun
          event: sunset
          offset: "-01:00:00"
        - id: sunrise
          trigger: sun
          event: sunrise
          offset: "+01:00:00"
        - trigger: state
          entity_id:
            - alarm_control_panel.alarmo
          to: disarmed
          id: alarm_off
        - trigger: numeric_state
          entity_id:
            - sensor.achtertuin_zon_luminance
          below: 1000
          id: dark_outside
        - trigger: numeric_state
          entity_id:
            - sensor.achtertuin_zon_luminance
          above: 1000
          id: light_outside
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - sunset
              sequence:
                - action: light.turn_on
                  metadata: {}
                  data:
                    transition: "{{ states('input_number.lights_transition_seconds')|int }}"
                    brightness_pct: "{{ states('input_number.lights_backyard_plants_percentage')|int }}"
                  target:
                    entity_id:
                      - light.achtertuin_lampen
            - conditions:
                - condition: trigger
                  id:
                    - sunrise
              sequence:
                - action: light.turn_off
                  target:
                    entity_id:
                      - light.achtertuin_lampen
                  data:
                    transition: "{{ states('input_number.lights_transition_seconds')|int }}"
            - conditions:
                - condition: trigger
                  id:
                    - alarm_off
              sequence:
                - if:
                    - condition: sun
                      after: sunset
                      after_offset: "-01:00:00"
                      before: sunrise
                      before_offset: "+01:00:00"
                  then:
                    - action: light.turn_on
                      metadata: {}
                      data:
                        transition: "{{ states('input_number.lights_transition_seconds')|int }}"
                        brightness_pct: "{{ states('input_number.lights_backyard_plants_percentage')|int }}"
                      target:
                        entity_id:
                          - light.achtertuin_lampen
            - conditions:
                - condition: trigger
                  id:
                    - dark_outside
              sequence:
                - action: light.turn_on
                  metadata: {}
                  data:
                    transition: "{{ states('input_number.lights_transition_seconds')|int }}"
                    brightness_pct: "{{ states('input_number.lights_backyard_plants_percentage')|int }}"
                  target:
                    entity_id:
                      - light.achtertuin_lampen
            - conditions:
                - condition: trigger
                  id:
                    - light_outside
                - condition: time
                  after: "09:00:00"
                  before: "17:00:00"
              sequence:
                - action: light.turn_off
                  metadata: {}
                  data:
                    transition: "{{ states('input_number.lights_transition_seconds')|int }}"
                  target:
                    entity_id: light.achtertuin_lampen
          # Bewust geen default. Hier stond light.toggle, en die was wél
          # bereikbaar: een lux-stijging boven 1000 buiten het 09:00-17:00-
          # venster (koplampen, het buitenlicht zelf) viel door de afgewezen
          # tijdconditie hierboven in de default en toggelde de tuinverlichting
          # 's avonds gewoon aan.

    - id: backyard_lights_bedroom_button_single_press
      alias: Backyard - Lights - Bedroom Buttons - Single Press
      description: "One single press on one of the bedroom buttons"
      mode: single
      triggers:
        # Eén event uit de router in
        # packages/1 - First Floor/Bedroom/Buttons.yaml.
        - trigger: event
          event_type: huis_routine
          event_data:
            routine: avond
      conditions: []
      actions:
        - action: light.turn_off
          data:
            transition: "{{ states('input_number.lights_transition_seconds')|int }}"
          target:
            entity_id:
              - light.achtertuin_lampen
        # Een groep losse lampen laat er met één uit-commando met transition
        # geregeld eentje branden; vandaar de tweede zonder fade.
        - delay:
            seconds: 2
        - action: light.turn_off
          target:
            entity_id:
              - light.achtertuin_lampen
