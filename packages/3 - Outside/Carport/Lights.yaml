frontyard_carport_lights_package:

  input_number:
    lights_frontyard_carport_percentage:
      name: "Lights Frontyard Carport - Percentage"
      min: 0
      max: 100
      step: 1
      icon: mdi:lightbulb-on-70

  automation:
    # Zie de opmerking in packages/3 - Outside/Frontyard/Lights.yaml: dit is
    # dezelfde blueprint met een andere lampgroep.
    - id: lights_carport
      alias: "Frontyard Carport - Lights"
      description: "Turn on or off the lights at the carport"
      use_blueprint:
        path: robin/buitenlicht_zon.yaml
        input:
          lamp: light.carport_lampen
          helderheid: input_number.lights_frontyard_carport_percentage
