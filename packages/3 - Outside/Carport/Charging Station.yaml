carport_charging_station_package:
  rest_command:
    start_charging:
      url: "https://slimhuys.nl/laadpaal24.php?action=start"
    stop_charging:
      url: "https://slimhuys.nl/laadpaal24.php?action=stop"
    stop_charging_if_full:
      url: "https://slimhuys.nl/laadpaal24.php?action=stop_if_full"
    # De URL bevat een token en die hoort niet in een publieke repo. Stond hier
    # vanaf de eerste commit (15-11-2024) in het openbaar; zie de opmerking bij
    # de webhooks in packages/9 - Other/Brandweer Automations.yaml voor waarom
    # roteren nodig is en niet alleen verplaatsen.
    112hooktest:
      url: !secret hook112_test_url

  automation:
    - id: carport_charging_station_charge
      alias: Carport - Charging Station Charge
      description: Start and stop charging at certain times
      mode: parallel
      max: 3
      triggers:
        - at: "22:00:00"
          trigger: time
          id: start
        - trigger: time
          at: "06:15:00"
          id: stop_6
        - trigger: time
          at: "08:05:00"
          id: stop_8
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - start
              sequence:
                - data: {}
                  action: rest_command.start_charging
            - conditions:
                - condition: trigger
                  id:
                    - stop_6
                    - stop_8
              sequence:
                - data: {}
                  action: rest_command.stop_charging_if_full
          # Bewust geen default. Hier stond rest_command.start_charging: elke
          # later toegevoegde trigger zonder afgedekte id zou dan stilletjes
          # het laden starten.
