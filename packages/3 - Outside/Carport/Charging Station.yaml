carport_charging_station_package:
  rest_command:
    start_charging:
      url: "https://slimhuys.nl/laadpaal24.php?action=start"
    stop_charging:
      url: "https://slimhuys.nl/laadpaal24.php?action=stop"
    stop_charging_if_full:
      url: "https://slimhuys.nl/laadpaal24.php?action=stop_if_full"
    # De URL bevat een token en die hoort niet in een publieke repo. Stond hier
    # vanaf de eerste commit (15-11-2024) in het openbaar; zie de opmerking bij
    # de webhooks in packages/9 - Other/Brandweer Automations.yaml voor waarom
    # roteren nodig is en niet alleen verplaatsen.
    112hooktest:
      url: !secret hook112_test_url

  # Hier stond `carport_charging_station_charge`: een vast nachtschema dat om
  # 22:00 de oude EVHUB startte en hem om 06:15 en 08:05 stopte als hij vol
  # was, via laadpaal24.php. Sinds de KEBA P40 Pro op de kwartierprijzen laadt
  # (KEBA P40 Pro.yaml) was dat een tweede baas die elke dag nog vuurde, dus
  # weg ermee. De rest_commands hierboven blijven bewust staan als
  # handgereedschap voor die oude paal; niets roept ze nog automatisch aan.
  #
  # De "Laadpaal Starten"-knoppen op het dashboard wezen naar dat schema en
  # roepen nu script.charging_station_nu_laden aan.
