carport_keba_p40_package:
  # De KEBA P40 Pro (KC-P40-32EU0, serienummer 36462996) hangt op
  # 192.168.30.135, een in de router vastgezet adres in een eigen VLAN.
  #
  # Stond tot 2026-09-11 op 192.168.2.136 en verhuisde toen hij zichzelf
  # herstartte. Zo ziet dat eruit: ALLE sensoren hieronder staan op
  # `unknown` (niet op `unavailable`), Home Assistant logt niets, en de
  # paal antwoordt niet eens op een ping. Herken je dat, kijk dan eerst
  # naar het adres voordat je aan modbus gaat sleutelen - Joulo blijft in
  # zo'n geval vrolijk melden dat het laadstation actief is, zie de
  # opmerking bij de meterkoppeling in de Lader-popup.
  # Hij praat twee talen tegelijk en die bijten elkaar niet:
  #
  #  * De HACS-integratie `keba_p40` (Ich-h4lt) gebruikt de lokale REST v2-API
  #    met JWT. Die levert de bedienbare kant: number/select/button voor stroom,
  #    fases en start/stop, plus temperatuur en firmware (5.0.1). Alleen heten
  #    al zijn entiteiten `sensor.keba_p40_36462996_2`, `_3`, `_stroom_4` - niet
  #    te lezen op een dashboard.
  #  * Dit bestand leest modbus TCP op poort 502. Dat geeft nette namen en een
  #    paar dingen die de REST-API niet heeft: kabelstatus, sessie-energie,
  #    power factor, failsafe-instellingen en het fast-charging-veld.
  #
  # LET OP - de wallbox accepteert maar EEN modbus-sessie tegelijk. De TCP-
  # handshake van een tweede client lukt nog wel, maar daarna komt er nooit een
  # antwoord terug terwijl de eerste verbinding gewoon doorloopt (nagemeten op
  # 2026-09-10). Home Assistant houdt zijn verbinding open, dus zolang dit
  # draait kan er geen tweede modbus-client bij: geen evcc, geen los testscript.
  # Moet je debuggen, zet dan eerst deze integratie stil.
  #
  # Alles hieronder is op 2026-09-10 tegen het apparaat zelf gemeten, niet uit
  # documentatie overgeschreven (de KEBA-PDF is een scan zonder tekstlaag).
  # Drie dingen kwamen daaruit die je in de meeste voorbeeldconfigs fout ziet:
  #
  #  1. ELK register in het 1000-blok is een uint32 op een even adres, met de
  #     waarde in het TWEEDE register. Lees je er uint16 van, dan lees je het
  #     hoge woord en krijg je altijd 0. Alleen het 5000-blok is echt 16-bits.
  #  2. Laadstatus is 1000, kabelstatus is 1004. Twee sensoren op 1004 zetten
  #     levert twee keer dezelfde kabelstatus op, niet de laadstatus.
  #  3. Het zijn allemaal HOLDING registers (functiecode 3). Functiecode 4
  #     geeft op elk adres modbus-exception 2, dus `input_type: input` werkt
  #     nergens. De HA-default is holding, daarom staat het er niet bij.
  #
  # De schalen zijn gecontroleerd tegen de REST-sensoren van de HACS-integratie,
  # die onafhankelijk dezelfde meting doen: register 1036 = 55280 naast
  # `sensor.keba_p40_36462996_energie` = 5,528 kWh, register 1008 = 4 naast
  # 0,004 A, 1100 = 16000 naast 16 A. mA, mW en 0,1 Wh dus.
  #
  # Niet opgenomen omdat ze niets toevoegen: 1014 (serienummer) en 1016
  # (producttype) staan al in de entity-id's van de REST-integratie, en 1700 /
  # 1702 antwoorden wel (12 en 7) maar staan in geen enkele registerlijst.
  modbus:
    - name: KebaP40Pro
      type: tcp
      host: 192.168.30.135
      port: 502
      # Geen message_wait_milliseconds: 57 reads achter elkaar zonder pauze
      # gingen in 0,84 s foutloos door. Deze wallbox heeft geen ademruimte nodig.
      sensors:
        # ------------------------------------------------------------------
        # Status. De ruwe getallen krijgen verderop in dit bestand een
        # leesbare vertaling; deze twee blijven bestaan omdat een automatisering
        # liever op een getal dan op een vertaalde zin triggert.
        - name: "Charging Station - Charging state (raw)"
          unique_id: wallbox_charging_state_raw
          slave: 255
          address: 1000
          data_type: uint32
          scan_interval: 30

        - name: "Charging Station - Cable state (raw)"
          unique_id: wallbox_cable_state_raw
          slave: 255
          address: 1004
          data_type: uint32
          scan_interval: 30

        - name: "Charging Station - Error code"
          unique_id: wallbox_error_code
          slave: 255
          address: 1006
          data_type: uint32
          scan_interval: 60

        # ------------------------------------------------------------------
        # Meting. Stroom in mA, vermogen in mW, energie in 0,1 Wh.
        - name: "Charging Station - Current P1"
          unique_id: wallbox_current_l1
          slave: 255
          address: 1008
          data_type: uint32
          scale: 0.001
          precision: 3
          unit_of_measurement: "A"
          state_class: measurement
          device_class: current
          scan_interval: 30

        - name: "Charging Station - Current P2"
          unique_id: wallbox_current_l2
          slave: 255
          address: 1010
          data_type: uint32
          scale: 0.001
          precision: 3
          unit_of_measurement: "A"
          state_class: measurement
          device_class: current
          scan_interval: 30

        - name: "Charging Station - Current P3"
          unique_id: wallbox_current_l3
          slave: 255
          address: 1012
          data_type: uint32
          scale: 0.001
          precision: 3
          unit_of_measurement: "A"
          state_class: measurement
          device_class: current
          scan_interval: 30

        # Levert 10500 op, en dat is NIET de firmwareversie zoals de REST-API
        # die noemt (5.0.1). Wat het wel is heb ik niet kunnen herleiden, dus
        # het blijft een ruw getal - handig om te zien of er iets wijzigt na een
        # update, niet om aan iemand te tonen.
        - name: "Charging Station - Firmware version (raw)"
          unique_id: wallbox_firmware_version
          slave: 255
          address: 1018
          data_type: uint32
          scan_interval: 300

        - name: "Charging Station - Active power"
          unique_id: wallbox_active_power
          slave: 255
          address: 1020
          data_type: uint32
          scale: 0.001
          precision: 0
          unit_of_measurement: "W"
          state_class: measurement
          device_class: power
          scan_interval: 30

        # total_increasing en niet total: de teller loopt alleen op en begint na
        # een vervanging of reset weer bij nul. Met `total` telt Home Assistant
        # zo'n terugval als negatief verbruik mee in het energiedashboard.
        - name: "Charging Station - Total energy"
          unique_id: wallbox_total_energy
          slave: 255
          address: 1036
          data_type: uint32
          scale: 0.0001
          precision: 4
          unit_of_measurement: "kWh"
          state_class: total_increasing
          device_class: energy
          scan_interval: 60

        - name: "Charging Station - Voltage P1"
          unique_id: wallbox_voltage_l1
          slave: 255
          address: 1040
          data_type: uint32
          precision: 0
          unit_of_measurement: "V"
          state_class: measurement
          device_class: voltage
          scan_interval: 30

        - name: "Charging Station - Voltage P2"
          unique_id: wallbox_voltage_l2
          slave: 255
          address: 1042
          data_type: uint32
          precision: 0
          unit_of_measurement: "V"
          state_class: measurement
          device_class: voltage
          scan_interval: 30

        - name: "Charging Station - Voltage P3"
          unique_id: wallbox_voltage_l3
          slave: 255
          address: 1044
          data_type: uint32
          precision: 0
          unit_of_measurement: "V"
          state_class: measurement
          device_class: voltage
          scan_interval: 30

        # 1000 = 100,0%. Staat op 0 zolang er geen auto laadt.
        - name: "Charging Station - Power factor"
          unique_id: wallbox_power_factor
          slave: 255
          address: 1046
          data_type: uint32
          scale: 0.1
          precision: 1
          unit_of_measurement: "%"
          state_class: measurement
          device_class: power_factor
          scan_interval: 30

        # ------------------------------------------------------------------
        # Grenzen. 1100 is wat er nu is ingesteld, 1110 wat de installatie
        # maximaal toestaat. Beide 16 A hier, ondanks de 32 in het typenummer.
        - name: "Charging Station - Max charging current"
          unique_id: wallbox_max_charging_current
          slave: 255
          address: 1100
          data_type: uint32
          scale: 0.001
          precision: 3
          unit_of_measurement: "A"
          state_class: measurement
          device_class: current
          scan_interval: 30

        - name: "Charging Station - Max supported current"
          unique_id: wallbox_max_supported_current
          slave: 255
          address: 1110
          data_type: uint32
          scale: 0.001
          precision: 3
          unit_of_measurement: "A"
          state_class: measurement
          device_class: current
          scan_interval: 300

        # uint32, niet uint16 - zie punt 1 in de kop van dit bestand.
        - name: "Charging Station - Fast charging state (raw)"
          unique_id: wallbox_fast_charging_state_raw
          slave: 255
          address: 1200
          data_type: uint32
          scan_interval: 60

        - name: "Charging Station - Session energy"
          unique_id: wallbox_session_energy
          slave: 255
          address: 1502
          data_type: uint32
          scale: 0.0001
          precision: 4
          unit_of_measurement: "kWh"
          state_class: total_increasing
          device_class: energy
          scan_interval: 30

        # 1550 is de bron die fasen mag wisselen, 1552 de stand die er nu
        # staat. De eerste is een instelling van de wallbox en verandert bijna
        # nooit, maar hij hoort er wel bij: staat hij niet op modbus, dan doet
        # het schakelscript niets en zoek je je scheel naar de fout.
        - name: "Charging Station - Phase switching source (raw)"
          unique_id: wallbox_phase_switching_source
          slave: 255
          address: 1550
          data_type: uint32
          scan_interval: 300

        - name: "Charging Station - Phase switching state (raw)"
          unique_id: wallbox_phase_switching_state
          slave: 255
          address: 1552
          data_type: uint32
          scan_interval: 30

        # ------------------------------------------------------------------
        # Failsafe. Zodra er ooit naar het 5000-blok geschreven wordt, moet dat
        # binnen `Failsafe timeout` seconden herhaald blijven worden; blijft dat
        # uit, dan valt de wallbox terug op `Failsafe current`. Die twee horen
        # daarom bij elkaar - de stroom alleen zegt niets zonder de tijd.
        - name: "Charging Station - Failsafe current"
          unique_id: wallbox_failsafe_current
          slave: 255
          address: 1600
          data_type: uint32
          scale: 0.001
          precision: 3
          unit_of_measurement: "A"
          state_class: measurement
          device_class: current
          scan_interval: 300

        - name: "Charging Station - Failsafe timeout"
          unique_id: wallbox_failsafe_timeout
          slave: 255
          address: 1602
          data_type: uint32
          precision: 0
          unit_of_measurement: "s"
          device_class: duration
          scan_interval: 300

        # ------------------------------------------------------------------
        # Het 5000-blok zijn de schrijfregisters, en die zijn hier echt 16-bits:
        # alleen het even adres antwoordt, het adres erna bestaat niet. Ze
        # spiegelen wat er via modbus is GESCHREVEN, niet wat de wallbox doet.
        # Zolang Home Assistant er niets heen stuurt staan ze allebei op 0, en
        # die 0 betekent dus niet "laden geblokkeerd". Na een herstart van de
        # wallbox staan ze ook weer op 0: nagemeten op 2026-09-11, toen hij
        # uit zichzelf herstartte terwijl het setpoint nog op 16000 stond.
        - name: "Charging Station - Modbus current setpoint"
          unique_id: wallbox_charging_current
          slave: 255
          address: 5004
          data_type: uint16
          scale: 0.001
          precision: 3
          unit_of_measurement: "A"
          state_class: measurement
          device_class: current
          scan_interval: 30

        - name: "Charging Station - Modbus charging enabled (raw)"
          unique_id: wallbox_charging_register
          slave: 255
          address: 5014
          data_type: uint16
          scan_interval: 15

  # --------------------------------------------------------------------------
  # De vertaling van de ruwe statusgetallen. Bewust geen binary_sensor voor
  # "stekker erin" of "laadt": die staan al in de REST-integratie
  # (binary_sensor.keba_p40_36462996_stekker en _actief) en twee bronnen voor
  # dezelfde ja/nee-vraag is precies hoe je later een tegenstrijdig dashboard
  # krijgt.
  template:
    - sensor:
        - name: "Charging Station - Charging state"
          unique_id: charging_station_charging_state
          icon: mdi:ev-station
          availability: "{{ has_value('sensor.charging_station_charging_state_raw') }}"
          state: >-
            {% set m = {
              '0': 'Opstarten',
              '1': 'Niet gereed',
              '2': 'Gereed, wacht op auto',
              '3': 'Aan het laden',
              '4': 'Storing',
              '5': 'Tijdelijk onderbroken' } %}
            {{ m.get(states('sensor.charging_station_charging_state_raw'), 'Onbekend') }}

        - name: "Charging Station - Cable state"
          unique_id: charging_station_cable_state
          icon: mdi:ev-plug-type2
          availability: "{{ has_value('sensor.charging_station_cable_state_raw') }}"
          state: >-
            {% set m = {
              '0': 'Geen kabel',
              '1': 'Alleen in de laadpaal',
              '3': 'In de laadpaal, vergrendeld',
              '5': 'In laadpaal en auto, niet vergrendeld',
              '7': 'In laadpaal en auto, vergrendeld' } %}
            {{ m.get(states('sensor.charging_station_cable_state_raw'), 'Onbekend') }}

        # 1 of 3, en dit is de stand die er ECHT staat. De REST-integratie
        # heeft hier ook een select van, maar die onthoudt alleen wat er als
        # laatste gevraagd is; de API geeft de werkelijke stand niet terug.
        - name: "Charging Station - Phases"
          unique_id: charging_station_phases
          icon: mdi:sine-wave
          availability: "{{ has_value('sensor.charging_station_phase_switching_state_raw') }}"
          state: "{{ states('sensor.charging_station_phase_switching_state_raw') }}"

  # ==========================================================================
  # BEDIENING
  #
  # De P40 stuurt anders dan de P30, en dat is de grootste valkuil van dit blok.
  # Op de P30 is register 5014 de aan/uit-vlag. Op de P40 doet EEN register het
  # werk: 5004, de laadstroom in mA. 0 betekent pauze, 6000 tot 16000 betekent
  # laden op die stroom. 5014 laat de P40 links liggen; evcc schrijft er voor
  # dit model niet naar en leest de aan/uit-stand gewoon terug uit 5004.
  #
  # DE FAILSAFE IS HIER EEN VRIEND, GEEN OBSTAKEL. Register 1602 staat op 30
  # seconden: blijft er na een modbus-commando 30 seconden lang een nieuw
  # commando uit, dan valt de wallbox terug op de failsafe-stroom uit 1600.
  # Die staat op 32 A en de installatie kan 16 A, dus de terugval is "gewoon
  # weer vol laden". Precies wat je wilt als Home Assistant omvalt tijdens het
  # laden. De prijs is dat een verlaagd setpoint alleen blijft staan zolang HA
  # het herhaalt - vandaar de hartslag van 15 seconden hieronder, de helft van
  # de timeout, dezelfde marge die evcc aanhoudt.
  #
  # Zet je de failsafe uit door 0 naar 5018 te schrijven, dan hoeft die hartslag
  # niet meer, maar dan blijft een geschreven 0 óók staan als HA wegvalt en
  # laadt de auto nooit meer. Niet doen.
  #
  # Fasen omschakelen gaat via 5052: 0 is 1 fase, 1 is 3 fasen. Dat werkt pas
  # als de wallbox modbus als bron voor fasewisseling accepteert; register 1550
  # zegt welke bron dat is. Stond hier eerst op 2, en toen slikte de wallbox het
  # commando zonder iets te doen - geen foutmelding, gewoon stilte. Sinds Robin
  # het op 2026-09-10 in de paal omzette schakelt hij wel. Nagemeten: 1552 ging
  # van 3 naar 1 en weer terug.
  #
  # Reken op een halve minuut voordat je het ziet. Een deel daarvan is de
  # wallbox die zijn relais schakelt, een deel is de `scan_interval` van 30 s op
  # de sensor hieronder. Lees dus 1552 voor de werkelijke stand en niet wat je
  # als laatste gevraagd hebt.
    # ------------------------------------------------------------------------
    # HET LAADPLAN
    #
    # Rekent uit hoeveel er in de accu moet, hoe lang dat duurt, en welk
    # aaneengesloten venster in de kwartierprijzen dat het goedkoopst doet vóór
    # `klaar_om`. Zelfde zoekmethode als `sensor.goedkoopste_laadvenster` in
    # packages/9 - Other/Stroomprijs.yaml, met twee verschillen: de lengte volgt
    # uit de auto in plaats van een vaste drie uur, en het venster moet vóór de
    # deadline afgelopen zijn.
    #
    # Trigger-based met een minuut-tik, net als die andere: een gewone template
    # met `now()` zou ook werken, maar zo staat de berekening één keer in
    # `variables` en rekenen state en attributen gegarandeerd over hetzelfde
    # plan.
    #
    # Waar de getallen vandaan komen:
    #  * 60 kWh bruikbare capaciteit. Dat de Megane de EV60 is en niet de EV40
    #    is onderbouwd in packages/9 - Other/Car.yaml; dezelfde constante.
    #  * 90% rendement. Wat er uit de muur gaat is meer dan wat er in de accu
    #    komt; laadverlies en accuconditionering zitten daarin.
    #  * 15% marge bovenop de rekentijd. Een auto trekt de laatste procenten
    #    langzamer, en een venster dat net te kort is kost je de deadline.
    #  * Het vermogen komt uit de WALLBOX (max stroom maal fasen maal 230 V) en
    #    niet uit de auto: `sensor.hrh85f_admissible_charging_power` staat hier
    #    standaard op `unknown`. Dat is een bovengrens, dus als de auto minder
    #    aankan duurt het langer dan gepland. Daarom stopt het laden ook niet
    #    aan het eind van het venster maar pas als de auto vol is of de deadline
    #    verstrijkt: dan kost een te optimistische schatting je wat geld, geen
    #    lege accu.
    #
    # Let op bij het lezen van `gemiddelde`: dat is het gemiddelde over het hele
    # venster. Dat kan hóger zijn dan de prijs van dit moment terwijl het plan
    # toch klopt - het lopende kwartier kan goedkoop zijn met een dure staart
    # erachter. Vergelijk dus vensters met vensters, niet met de spotprijs.
    - triggers:
        - trigger: time_pattern
          minutes: "/1"
        - trigger: state
          entity_id:
            - sensor.slimhuys_zonneplan_prijzen_vandaag_kwartier
            - sensor.slimhuys_zonneplan_prijzen_morgen
            - sensor.hrh85f_batterij
            - number.megane_e_tech_target_charge_level
            - input_datetime.charging_station_klaar_om
      variables:
        plan: >-
          {% set cap = 60 %}
          {% set rendement = 0.90 %}
          {% set marge = 1.15 %}
          {% set soc = states('sensor.hrh85f_batterij') | float(none) %}
          {% set doel = states('number.megane_e_tech_target_charge_level') | float(100) %}
          {% set amp = states('sensor.charging_station_max_supported_current') | float(16) %}
          {% set fasen = states('sensor.charging_station_phases') | float(3) %}
          {% set vermogen = (amp * 230 * fasen / 1000) | round(2) %}
          {# Geen accustand? Dan rekenen we op een volle lading. Liever een
             venster dat te lang is dan een auto die 's ochtends leeg staat. #}
          {% set tekort = (cap * doel / 100) if soc is none else ([0, doel - soc] | max * cap / 100) %}
          {% set uren = (tekort / rendement / vermogen * marge) | round(3) if vermogen > 0 else 0 %}
          {# Het `timestamp`-attribuut en niet de state: die state heeft geen
             tijdzone en vergelijken met now() geeft dan een TypeError. Staat de
             deadline in het verleden (nog nooit gezet, of de vorige laadbeurt),
             dan vallen we terug op de eerstvolgende 07:00. #}
          {% set ts = state_attr('input_datetime.charging_station_klaar_om', 'timestamp') | float(none) %}
          {% set standaard = today_at('07:00') %}
          {% set standaard = standaard if standaard > now() else standaard + timedelta(days=1) %}
          {% set eind = (ts | as_datetime(none) | as_local) if ts is not none and ts > as_timestamp(now()) else standaard %}
          {% set kw = state_attr('sensor.slimhuys_zonneplan_prijzen_vandaag_kwartier', 'raw_today') %}
          {% set vandaag = kw if kw else (state_attr('sensor.slimhuys_zonneplan_prijzen_vandaag', 'raw_today') or []) %}
          {% set morgen = state_attr('sensor.slimhuys_zonneplan_prijzen_morgen', 'raw_tomorrow') or [] %}
          {% set ns = namespace(punten=[]) %}
          {% for b in vandaag + morgen %}
            {% set s = b.start | as_datetime(none) %}
            {% set p = b.value | float(none) %}
            {% if s is not none and p is not none %}{% set ns.punten = ns.punten + [{'t': as_timestamp(s), 'p': p}] %}{% endif %}
          {% endfor %}
          {% set punten = ns.punten | sort(attribute='t') %}
          {% set nu = as_timestamp(now()) %}
          {% set eind_ts = as_timestamp(eind) %}
          {% if uren <= 0.01 %}
            {{ {'reden': 'vol', 'uren': 0, 'kwh': 0, 'vermogen': vermogen, 'deadline': eind.isoformat()} }}
          {% elif (punten | count) < 2 %}
            {{ {'reden': 'geen prijzen', 'uren': uren, 'kwh': tekort | round(2), 'vermogen': vermogen, 'deadline': eind.isoformat()} }}
          {% else %}
            {% set stap = punten[1].t - punten[0].t %}
            {% set nodig = [1, ((uren * 3600) / stap) | round(0, 'ceil') | int] | max %}
            {% set best = namespace(gem=none, van=none, tot=none) %}
            {% for i in range(0, (punten | count) - nodig + 1) %}
              {% set start = punten[i].t %}
              {% set stop = punten[i + nodig - 1].t + stap %}
              {# Het lopende blok telt mee, maar een venster dat al voorbij is niet.
                 En het moet in zijn geheel vóór de deadline passen. #}
              {% if start + stap > nu and stop <= eind_ts %}
                {% set w = namespace(som=0.0, ok=true) %}
                {% for j in range(nodig) %}
                  {% if j > 0 and (punten[i + j].t - punten[i + j - 1].t) != stap %}{% set w.ok = false %}{% endif %}
                  {% set w.som = w.som + punten[i + j].p %}
                {% endfor %}
                {% if w.ok %}
                  {% set gem = w.som / nodig %}
                  {% if best.gem is none or gem < best.gem %}
                    {% set best.gem = gem %}{% set best.van = start %}{% set best.tot = stop %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% if best.gem is none %}
              {{ {'reden': 'past niet', 'uren': uren, 'kwh': tekort | round(2),
                  'vermogen': vermogen, 'deadline': eind.isoformat(),
                  'van': (nu | as_datetime | as_local).isoformat(), 'tot': eind.isoformat()} }}
            {% else %}
              {{ {'reden': 'plan', 'uren': uren, 'kwh': tekort | round(2), 'vermogen': vermogen,
                  'deadline': eind.isoformat(),
                  'van': (best.van | as_datetime | as_local).isoformat(),
                  'tot': (best.tot | as_datetime | as_local).isoformat(),
                  'gemiddelde': best.gem | round(4)} }}
            {% endif %}
          {% endif %}
      sensor:
        # De state is de RÉDEN en niet de starttijd. Een timestamp-sensor zou
        # `unavailable` moeten worden zodra er niets te plannen valt, en dan zijn
        # de attributen in een automatisering ook niet meer te vertrouwen.
        # "vol" / "plan" / "past niet" / "geen prijzen" is altijd leesbaar.
        - name: "Charging Station - Laadplan"
          unique_id: charging_station_laadplan
          icon: mdi:calendar-clock
          state: "{{ plan.reden if plan is mapping else 'onbekend' }}"
          attributes:
            van: "{{ plan.van if plan is mapping and 'van' in plan else none }}"
            tot: "{{ plan.tot if plan is mapping and 'tot' in plan else none }}"
            uren: "{{ plan.uren if plan is mapping else none }}"
            kwh: "{{ plan.kwh if plan is mapping else none }}"
            vermogen: "{{ plan.vermogen if plan is mapping else none }}"
            gemiddelde: "{{ plan.gemiddelde if plan is mapping and 'gemiddelde' in plan else none }}"
            deadline: "{{ plan.deadline if plan is mapping else none }}"

    - sensor:
        # DE ENIGE BRON VOOR WAT ER NAAR REGISTER 5004 GAAT. Eén schrijver, zodat
        # handbediening en slim laden niet om de beurt een ander getal in de
        # wallbox duwen. `unavailable` betekent hier "Home Assistant stuurt
        # niet"; dan schrijft het script hieronder niets en laat het de wallbox
        # via zijn eigen failsafe terugvallen op vol vermogen.
        - name: "Charging Station - Gewenste stroom"
          unique_id: charging_station_gewenste_stroom
          unit_of_measurement: "A"
          device_class: current
          icon: mdi:current-ac
          availability: >-
            {{ is_state('input_boolean.charging_station_smart_charging', 'on')
               or is_state('input_boolean.charging_station_modbus_control', 'on') }}
          state: >-
            {% if is_state('input_boolean.charging_station_smart_charging', 'on') %}
              {{ (states('sensor.charging_station_max_supported_current') | float(16)) | round(0) | int
                 if is_state('input_boolean.charging_station_laadsessie', 'on') else 0 }}
            {% else %}
              {{ states('input_number.charging_station_charging_current') | float(0) | round(0) | int }}
            {% endif %}

  input_boolean:
    # Uit = de wallbox doet zijn eigen ding op vol vermogen en HA schrijft
    # niets. Aan = HA houdt het setpoint hieronder vast met de hartslag.
    charging_station_modbus_control:
      name: "Charging Station - Modbus control"
      icon: mdi:transmission-tower-import

    # Slim laden op de kwartierprijzen. Aan betekent: de wallbox staat
    # permanent op 0 A, ook als er geen auto hangt, en gaat alleen open in het
    # geplande venster. Dat "permanent" is geen slordigheid maar de kern: de
    # KEBA begint binnen een paar seconden na het insteken te laden, dus als je
    # pas op de stekker reageert ben je te laat en heb je al op het duurste
    # moment geladen. Keerzijde: zolang dit aan staat kan een bezoeker hier ook
    # niet laden zonder de schakelaar om te zetten.
    charging_station_smart_charging:
      name: "Charging Station - Smart charging"
      icon: mdi:cash-clock

    # De grendel. Zonder deze vlag zou het plan zichzelf in de staart bijten:
    # het plan wordt elke minuut opnieuw uitgerekend, en zodra er stroom in de
    # accu zit is er minder tijd nodig, dus verschuift het goedkoopste venster
    # naar later. Dan valt "nu" buiten het venster, stopt het laden, blijft de
    # accustand staan, schuift het venster terug, en begint het laden weer.
    # Daarom: eenmaal begonnen blijft de sessie open tot de auto vol is, de
    # deadline verstrijkt of de stekker eruit gaat.
    charging_station_laadsessie:
      name: "Charging Station - Laadsessie actief"
      icon: mdi:ev-station

  input_number:
    # 0 is pauze, 6 tot 16 is laden. De KEBA kent niets tussen 0 en 6 A, dus
    # alles onder de 6 wordt hieronder als pauze gelezen. Het bereik begint bij
    # 0 en niet bij 6 zodat pauzeren een stand is en geen apart knopje.
    charging_station_charging_current:
      name: "Charging Station - Charging current"
      min: 0
      max: 16
      step: 1
      unit_of_measurement: "A"
      icon: mdi:current-ac

  input_datetime:
    # Uiterlijk klaar. Alles wat het plan kiest moet vóór dit MOMENT afgelopen
    # zijn; past de benodigde laadtijd er niet meer in, dan begint hij meteen.
    #
    # Met datum én tijd, en dat is het verschil tussen zeven euro en drie. Een
    # deadline van alleen "07:00" betekent altijd de eerstvolgende ochtend, en
    # dan moet hij wel 's nachts laden. Op 2026-09-11 kostte dat € 7,47 terwijl
    # dezelfde 21 kWh de volgende middag € 2,75 kostte: zonovergoten zaterdag,
    # € 0,13 per kWh tegen € 0,36 's nachts. Wie de auto pas 's middags nodig
    # heeft, moet dat dus kunnen zeggen - vandaar de vraag bij het insteken.
    charging_station_klaar_om:
      name: "Charging Station - Klaar om"
      has_date: true
      has_time: true
      icon: mdi:clock-check-outline

    # De deadline van de LOPENDE sessie, vastgelegd op het moment dat hij opent.
    # Kan niet uit het laadplan gelezen worden: die deadline rolt om zodra de
    # klok er voorbij is, dus "now() >= deadline" wordt daar nooit waar en zou
    # het laden nooit afkappen.
    charging_station_sessie_deadline:
      name: "Charging Station - Sessie deadline"
      has_date: true
      has_time: true
      icon: mdi:clock-alert-outline

  script:
    charging_station_push_setpoint:
      alias: "Charging Station - Push setpoint"
      icon: mdi:transmission-tower-import
      mode: single
      max_exceeded: silent
      sequence:
        # Eerst de hartslag naar 5018, dan pas de stroom. Andersom kan het
        # setpoint in het ergste geval een tel zonder geldige failsafe staan.
        - action: modbus.write_register
          data:
            hub: KebaP40Pro
            slave: 255
            address: 5018
            value: "{{ states('sensor.charging_station_failsafe_timeout') | int(30) }}"
        - action: modbus.write_register
          data:
            hub: KebaP40Pro
            slave: 255
            address: 5004
            value: >-
              {% set a = states('sensor.charging_station_gewenste_stroom') | float(0) %}
              {{ 0 if a < 6 else (a * 1000) | round(0) | int }}

    charging_station_release:
      alias: "Charging Station - Release to full current"
      icon: mdi:transmission-tower-off
      mode: single
      sequence:
        # Niet wachten tot de failsafe het na 30 seconden zelf doet: meteen de
        # maximale stroom schrijven maakt het loslaten zichtbaar en direct.
        - action: modbus.write_register
          data:
            hub: KebaP40Pro
            slave: 255
            address: 5004
            value: >-
              {{ (states('sensor.charging_station_max_supported_current') | float(16) * 1000) | round(0) | int }}

    # Eén plek waar "ochtend", "middag" en "later" een concreet moment worden.
    # Staat bewust in een script en niet in de knoppen zelf: een tap_action op
    # een dashboard rendert GEEN Jinja, dus daar kun je niet uitrekenen wat de
    # eerstvolgende 07:00 is. Een script doet dat wel, en nu delen de melding op
    # je telefoon en de knoppen in de popup dezelfde regel.
    #
    # Die regel: neem het eerstvolgende moment met die kloktijd dat minstens
    # drie uur weg is. Zonder ondergrens zou "middag" om kwart voor vijf 's
    # middags een deadline van een kwartier later opleveren, en dan is er niets
    # meer te plannen.
    charging_station_deadline_zetten:
      alias: "Charging Station - Deadline zetten"
      icon: mdi:clock-check-outline
      mode: single
      fields:
        wanneer:
          name: Wanneer
          description: ochtend, middag of later
          required: true
          example: middag
          selector:
            select:
              options:
                - ochtend
                - middag
                - later
      sequence:
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.charging_station_klaar_om
          data:
            datetime: >-
              {% set klok = '17:00' if wanneer == 'middag' else '07:00' %}
              {% set t = today_at(klok) %}
              {% set t = t if (t - now()).total_seconds() > 10800 else t + timedelta(days=1) %}
              {% set t = t + timedelta(days=1) if wanneer == 'later' else t %}
              {{ t.strftime('%Y-%m-%d %H:%M:%S') }}

    charging_station_set_phases:
      alias: "Charging Station - Set phases"
      icon: mdi:sine-wave
      mode: single
      fields:
        phases:
          name: Fasen
          description: 1 of 3
          required: true
          example: 3
          selector:
            number:
              min: 1
              max: 3
              step: 2
      sequence:
        - action: modbus.write_register
          data:
            hub: KebaP40Pro
            slave: 255
            address: 5052
            value: "{{ 1 if (phases | int(3)) == 3 else 0 }}"

  automation:
    - id: charging_station_modbus_steering
      alias: "Carport - Charging Station Modbus steering"
      description: "Houdt het laadstroom-setpoint vast zolang HA de wallbox stuurt"
      mode: single
      max_exceeded: silent
      triggers:
        - trigger: state
          entity_id: sensor.charging_station_gewenste_stroom
        # De hartslag. Vuurt altijd, maar de conditie hieronder laat hem er
        # alleen door als HA ook echt stuurt.
        - trigger: time_pattern
          seconds: "/15"
      conditions:
        # `unavailable` op deze sensor betekent: noch handbediening noch slim
        # laden staat aan, dus niets schrijven.
        - condition: template
          value_template: "{{ has_value('sensor.charging_station_gewenste_stroom') }}"
        # Schrijven terwijl de hub weg is levert alleen een logregel op. Deze
        # sensor komt uit dezelfde modbus-verbinding, dus als hij een waarde
        # heeft staat de verbinding.
        - condition: template
          value_template: "{{ has_value('sensor.charging_station_max_supported_current') }}"
      actions:
        - action: script.charging_station_push_setpoint

    - id: charging_station_modbus_release
      alias: "Carport - Charging Station Modbus release"
      description: "Geeft de wallbox terug aan zichzelf zodra HA stopt met sturen"
      mode: single
      triggers:
        - trigger: state
          entity_id: sensor.charging_station_gewenste_stroom
          to:
            - unavailable
            - unknown
      conditions:
        # Zonder deze guard vuurt hij ook bij het opstarten van Home Assistant,
        # als de sensor van `unknown` naar een waarde gaat en er dus nooit iets
        # losgelaten hoefde te worden.
        - condition: template
          value_template: >-
            {{ trigger.from_state is not none
               and trigger.from_state.state not in ['unavailable', 'unknown'] }}
      actions:
        - action: script.charging_station_release

    # ------------------------------------------------------------------------
    # SLIM LADEN
    #
    # De grendel uit `charging_station_laadsessie` wordt hier gezet en gehaald.
    # Zolang hij dicht is staat de gewenste stroom op 0 en laadt de auto niet,
    # ook al zit de stekker erin. Dat is het gedrag dat gevraagd is: insteken
    # betekent niet meteen laden.
    #
    # Waarom de sessie niet gewoon "nu in het venster?" leest: het plan wordt
    # elke minuut opnieuw gemaakt en schuift op zodra er stroom in de accu zit.
    # Zonder grendel zou hij zichzelf na een paar minuten weer uitzetten. Zie de
    # toelichting bij de helper.
    #
    # Kabelstatus 5 of 7 betekent "kabel zit in de auto"; 0, 1 en 3 zijn alle
    # varianten van "hangt alleen aan de paal". Die komt uit de wallbox en niet
    # uit `binary_sensor.hrh85f_stekker`, want dat is de Renault-cloud en die
    # zwijgt regelmatig - zie de opmerking bij de laadregel op het dashboard.
    - id: charging_station_smart_charge_start
      alias: "Carport - Charging Station Smart charge start"
      description: "Opent de laadsessie zodra het geplande goedkope venster begint"
      mode: single
      max_exceeded: silent
      triggers:
        # Vijf minuten is ruim genoeg op kwartierblokken: je verliest hooguit
        # een paar minuten aan de voorkant van een venster van uren.
        - trigger: time_pattern
          minutes: "/5"
        - trigger: state
          entity_id: sensor.charging_station_cable_state_raw
      conditions:
        - condition: state
          entity_id: input_boolean.charging_station_smart_charging
          state: "on"
        - condition: state
          entity_id: input_boolean.charging_station_laadsessie
          state: "off"
        - condition: template
          value_template: "{{ states('sensor.charging_station_cable_state_raw') in ['5', '7'] }}"
        # "vol" valt hier af, want dan is er niets te laden. "geen prijzen"
        # start meteen: zonder prijsvoorspelling is een lege auto 's ochtends
        # erger dan een paar euro te veel betalen.
        - condition: template
          value_template: >-
            {% set reden = states('sensor.charging_station_laadplan') %}
            {% set van = state_attr('sensor.charging_station_laadplan', 'van') | as_datetime(none) %}
            {{ reden in ['plan', 'past niet', 'geen prijzen']
               and (van is none or now() >= van) }}
      actions:
        # Eerst de deadline vastleggen, dan pas de grendel open. Andersom kan de
        # stop-automatisering een sessie zien met een deadline van de vorige keer.
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.charging_station_sessie_deadline
          data:
            datetime: >-
              {% set dl = state_attr('sensor.charging_station_laadplan', 'deadline') | as_datetime(none) %}
              {{ (dl | as_local).strftime('%Y-%m-%d %H:%M:%S')
                 if dl is not none else (now() + timedelta(hours=12)).strftime('%Y-%m-%d %H:%M:%S') }}
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.charging_station_laadsessie

    # Vier manieren om te stoppen, en geen daarvan is "het venster is voorbij".
    # Het geplande vermogen is een BOVENGRENS uit de wallbox; kan de auto minder
    # aan, dan duurt het langer dan gepland. Afkappen op de vensterrand zou dan
    # een halfvolle accu opleveren. Doorladen tot vol of tot de deadline kost in
    # het slechtste geval wat geld, en dat is de goede kant om fout te zitten.
    - id: charging_station_smart_charge_stop
      alias: "Carport - Charging Station Smart charge stop"
      description: "Sluit de laadsessie bij vol, deadline, stekker eruit of slim laden uit"
      mode: single
      max_exceeded: silent
      triggers:
        - trigger: time_pattern
          minutes: "/5"
        - trigger: state
          entity_id:
            - sensor.hrh85f_batterij
            - sensor.charging_station_cable_state_raw
            - input_boolean.charging_station_smart_charging
      conditions:
        - condition: state
          entity_id: input_boolean.charging_station_laadsessie
          state: "on"
        - condition: template
          value_template: >-
            {% set soc = states('sensor.hrh85f_batterij') | float(none) %}
            {% set doel = states('number.megane_e_tech_target_charge_level') | float(100) %}
            {# Het `timestamp`-attribuut en niet de state: die state is een tijd
               ZONDER tijdzone, en `now()` heeft er wel een. Vergelijken geeft dan
               "can't compare offset-naive and offset-aware datetimes" en dan
               stopt deze automatisering nooit meer. #}
            {% set dl = state_attr('input_datetime.charging_station_sessie_deadline', 'timestamp') | float(none) %}
            {{ states('sensor.charging_station_cable_state_raw') not in ['5', '7']
               or is_state('input_boolean.charging_station_smart_charging', 'off')
               or (soc is not none and soc >= doel)
               or (dl is not none and as_timestamp(now()) >= dl) }}
      actions:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.charging_station_laadsessie

    # ------------------------------------------------------------------------
    # "WANNEER MOET HIJ KLAAR ZIJN?"
    #
    # De deadline bepaalt bijna alles aan de prijs. Moet de auto 's ochtends om
    # zeven uur klaar zijn, dan kan er alleen 's nachts geladen worden en betaal
    # je het nachttarief. Mag hij een halve dag later klaar zijn, dan valt de
    # zonnepiek van de middag binnen bereik. Op 2026-09-11 scheelde dat op één
    # laadbeurt € 7,47 tegen € 2,75 voor dezelfde 21 kWh.
    #
    # Dat is te veel om standaard goed te gokken, dus vraagt hij het bij het
    # insteken. Tot er een antwoord komt geldt de veilige aanname: klaar om
    # 07:00. Wie niets doet heeft dus gewoon een volle auto 's ochtends.
    #
    # De knoppen heten naar het tijdstip en niet naar de dag ("Ochtend 07:00",
    # niet "morgenochtend"), want steek je om twee uur 's nachts in, dan is de
    # eerstvolgende ochtend vandaag. De regel die dat uitrekent staat drie keer
    # hieronder: neem het eerstvolgende moment met die kloktijd dat minstens
    # drie uur weg is. Zonder die ondergrens zou "Middag 17:00" om kwart voor
    # vijf 's middags een deadline van een kwartier later opleveren.
    - id: charging_station_vraag_deadline
      alias: "Carport - Charging Station Vraag deadline"
      description: "Vraagt bij het insteken hoe laat de auto klaar moet zijn"
      mode: single
      triggers:
        - trigger: state
          entity_id: sensor.charging_station_cable_state_raw
          to:
            - "5"
            - "7"
      conditions:
        - condition: state
          entity_id: input_boolean.charging_station_smart_charging
          state: "on"
        # Niet vragen als de kabel alleen even los zat: van 5 naar 7 is
        # vergrendelen, niet opnieuw insteken.
        - condition: template
          value_template: >-
            {{ trigger.from_state is not none
               and trigger.from_state.state not in ['5', '7'] }}
      actions:
        # Terugvallen op de veilige aanname. Doet niemand iets, dan is de auto
        # 's ochtends vol.
        - action: script.charging_station_deadline_zetten
          data:
            wanneer: ochtend
        # Even wachten tot het laadplan opnieuw gerekend heeft; de deadline
        # staat in zijn triggerlijst, dus dat gaat vanzelf. Zelfde truc als bij
        # de knopmelding in packages/1 - First Floor/Bedroom Maxi.
        - delay: "00:00:05"
        - action: notify.mobile_devices_adults
          data:
            title: Auto hangt aan de lader
            message: >-
              {% set van = state_attr('sensor.charging_station_laadplan', 'van') | as_datetime(none) %}
              {% set tot = state_attr('sensor.charging_station_laadplan', 'tot') | as_datetime(none) %}
              {% set kwh = state_attr('sensor.charging_station_laadplan', 'kwh') | float(0) %}
              {% set gem = state_attr('sensor.charging_station_laadplan', 'gemiddelde') | float(none) %}
              {% if van is not none %}
              Klaar om 07:00 betekent laden van {{ van.strftime('%H:%M') }} tot {{ tot.strftime('%H:%M') }}:
              {{ kwh | round(0) | int }} kWh{{ ' voor € ' ~ ('%.2f' | format(gem * kwh)) | replace('.', ',') if gem is not none else '' }}.
              Mag hij later klaar zijn? Dan is het meestal een stuk goedkoper.
              {% else %}
              Hoe laat moet hij klaar zijn?
              {% endif %}
            data:
              tag: laadpaal_deadline
              actions:
                - action: LAADPAAL_KLAAR_OCHTEND
                  title: Ochtend 07:00
                - action: LAADPAAL_KLAAR_MIDDAG
                  title: Middag 17:00
                - action: LAADPAAL_KLAAR_LATER
                  title: Pas een dag later

    - id: charging_station_deadline_antwoord
      alias: "Carport - Charging Station Deadline antwoord"
      description: "Verwerkt de keuze uit de melding en bevestigt het nieuwe plan"
      mode: single
      triggers:
        - trigger: event
          event_type: mobile_app_notification_action
          event_data:
            action: LAADPAAL_KLAAR_OCHTEND
          id: ochtend
        - trigger: event
          event_type: mobile_app_notification_action
          event_data:
            action: LAADPAAL_KLAAR_MIDDAG
          id: middag
        - trigger: event
          event_type: mobile_app_notification_action
          event_data:
            action: LAADPAAL_KLAAR_LATER
          id: later
      conditions: []
      actions:
        - action: script.charging_station_deadline_zetten
          data:
            wanneer: "{{ trigger.id }}"

        # De melding staat ook op de andere telefoon; zonder dit blijft daar een
        # vraag staan die al beantwoord is.
        - action: notify.mobile_devices_adults
          data:
            message: clear_notification
            data:
              tag: laadpaal_deadline
        - delay: "00:00:05"
        - action: notify.mobile_devices_adults
          data:
            title: Laadplan aangepast
            message: >-
              {% set reden = states('sensor.charging_station_laadplan') %}
              {% set van = state_attr('sensor.charging_station_laadplan', 'van') | as_datetime(none) %}
              {% set tot = state_attr('sensor.charging_station_laadplan', 'tot') | as_datetime(none) %}
              {% set kwh = state_attr('sensor.charging_station_laadplan', 'kwh') | float(0) %}
              {% set gem = state_attr('sensor.charging_station_laadplan', 'gemiddelde') | float(none) %}
              {% set dl = state_attr('input_datetime.charging_station_klaar_om', 'timestamp') | as_datetime(none) %}
              {% if reden == 'plan' and van is not none %}
              Klaar om {{ (dl | as_local).strftime('%H:%M') }}. Laden van
              {{ van.strftime('%H:%M') }} tot {{ tot.strftime('%H:%M') }}, {{ kwh | round(0) | int }} kWh
              {{- ' voor € ' ~ ('%.2f' | format(gem * kwh)) | replace('.', ',') if gem is not none else '' }}.
              {% elif reden == 'vol' %}
              De auto is al vol, er valt niets te plannen.
              {% else %}
              Het past niet meer voor die tijd, hij begint meteen.
              {% endif %}
            data:
              tag: laadpaal_deadline_bevestiging
