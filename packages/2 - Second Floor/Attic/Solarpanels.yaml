solar_panels_package:
  ######################################################################
  ## DE ZON KOMT SINDS 14 OKTOBER 2026 UIT DE DEYE
  ##
  ## Tot die dag hingen de panelen aan twee GoodWe-omvormers: zuidwest op
  ## de overkapping (16 panelen, GW5000N-EH, 5 kW) en oost op de zolder
  ## (12 panelen, GW3000D-NS, 3 kW). Die zijn eruit; alle panelen hangen nu
  ## aan de Deye, en die komt via MarkeDroid binnen (Battery.yaml):
  ## `sensor.markedroid_zon_vermogen` (W, elke ~10 s) en
  ## `sensor.markedroid_zon_energie` (Wh, opgeteld uit `TotWhInc`).
  ##
  ## Weg zijn daarmee: de sensoren per set (`zon_vermogen_zw/_o`,
  ## `zon_vandaag_zw/_o`), het vasthouden van een haperende omvormer tot tien
  ## minuten, de terugval van de lokale GoodWe-koppeling op de SEMS-cloud en
  ## de UI-helper `attic_solar_total_today`. Dat was allemaal reparatiewerk
  ## voor twee omvormers die elk los wegvielen (elf keer op 27-08-2026). De
  ## MarkeDroid-feed is één bron; valt die een minuut stil, dan maakt
  ## `expire_after: 60` hem unavailable en wordt de zon hier eerlijk `—`.
  ##
  ## MarkeDroid geeft alleen het totaal, niet per string. De ZW/O-percentages
  ## op het Overzicht, de klok en de spraak-intent werken daarom nu met één
  ## totaal en het piekvermogen hieronder.
  ##
  ## Alles in huis leest de zon via deze twee sensoren en nooit via
  ## `sensor.markedroid_*` zelf - zelfde patroon als de accu en de P1.
  ######################################################################
  utility_meter:
    zon_deye_vandaag:
      name: Zon Deye Vandaag
      unique_id: zon_deye_vandaag
      source: sensor.markedroid_zon_energie
      cycle: daily

  template:
    ######################################################################
    ## EEN 0 W-SAMPLE MIDDEN OP DE DAG IS EEN LEESFOUT, GEEN WOLK
    ##
    ## Sinds de panelen aan de Deye hangen stuurt MarkeDroid in `solar.W`
    ## geregeld een 0 terwijl de omvormer gewoon doorlevert: 12% van de
    ## productie-samples op 15-10, 20% op 16-10, 12% op 17-10 (gemeten uit
    ## de historie; vóór 14-10 kwam het niet voor). Meestal één bericht van
    ## 10 s, soms twee of drie achter elkaar. Dat het een leesfout is blijkt
    ## uit de andere drie stromen op hetzelfde moment: accu laadt 1,6 kW,
    ## last 0,5 kW, net 0 W - die 2,1 kW moet ergens vandaan komen. `load.W`
    ## valt op die momenten vaak mee naar 0; `battery` en `meter` niet.
    ##
    ## Zonder filter zakte `huis_verbruik` (net + zon - accu) bij elke
    ## leesfout naar 0 kW (48x in twee uur) en trok dat het 120 s-gemiddelde
    ## op het Overzicht een paar procent omlaag. SlimHuys negeert 0 W-samples
    ## al in zijn mediaan; HA liet ze door.
    ##
    ## Daarom een trigger-sensor op het MQTT-bericht zelf: komt er een 0
    ## binnen terwijl de vorige stand > 300 W was EN de Wh-teller in
    ## hetzelfde bericht zegt dat er wél geproduceerd is (`TotWhInc`
    ## omgerekend > 100 W), dan blijft de vorige stand staan. Valt de zon
    ## echt weg, dan is `TotWhInc` ook ~0 en gaat de sensor gewoon naar 0.
    ## De trigger vuurt op ELK bericht, ook als de waarde gelijk blijft, zodat
    ## een tweede 0 op rij ook wordt gevangen.
    ##
    ## NIET gerepareerd: `sensor.markedroid_zon_energie`. MarkeDroid rekent
    ## `TotWhInc` kennelijk uit zijn eigen (foute) samples, want per kwartier
    ## loopt die teller gelijk met het gemiddelde INCLUSIEF de nullen en
    ## 12-17% onder het gemiddelde zonder. De dagopbrengst (hier én bij
    ## SlimHuys, die dezelfde teller krijgt) is dus vermoedelijk ~10% te
    ## laag. Dat is een melding voor ModuSun, niet iets om in HA bij te
    ## verzinnen.
    ##
    ## SINDS 26-10-2026 ~23:20 OOK ONZIN IN DE HONDERDDUIZENDEN
    ## Daarna kwamen er ~60 per etmaal waarden als 263.457 W, 193.740 W of
    ## 417.801 W binnen, ook midden in de nacht, af en toe eentje rond de
    ## 5 kW om 23:00 en een enkele negatieve (-137 W). Altijd één bericht.
    ## Ze liepen door naar `huis_verbruik` (418 kW op 27-10) en de klokken.
    ## Twee regels vangen dat af:
    ## - Is de zon dieper onder dan 3 graden, dan is het 0. -3 en niet 0,
    ##   want vlak na zonsondergang levert het strooilicht nog wat; een
    ##   glitch in die schemer gaat er dus nog door.
    ## - Boven het plafond (1,3 x `piekvermogen`, ~12,3 kW) of onder 0 blijft
    ##   de vorige stand staan. Een glitch onder het plafond overdag
    ##   herkennen we niet; daar is geen tweede bron voor.
    ## De Wh-teller (Battery.yaml) gebruikt dezelfde grens.
    ######################################################################
    - triggers:
        - trigger: mqtt
          topic: "public/realtimedata/solar"
        # Zonder deze twee blijft de sensor na een stille broker staan op zijn
        # laatste waarde: de availability van een trigger-sensor wordt alleen
        # bij een trigger opnieuw bekeken. De MQTT-sensor gaat na 60 s stilte
        # op unavailable (expire_after), en dat moment moet hier doorkomen.
        - trigger: state
          entity_id: sensor.markedroid_zon_vermogen
          to: unavailable
        - trigger: state
          entity_id: sensor.markedroid_zon_vermogen
          from: unavailable
      sensor:
        - name: "Zon Vermogen Nu"
          unique_id: zon_vermogen_nu
          default_entity_id: sensor.zon_vermogen_nu
          unit_of_measurement: "W"
          device_class: power
          state_class: measurement
          availability: "{{ has_value('sensor.markedroid_zon_vermogen') }}"
          state: >-
            {% set mqtt = trigger.platform == 'mqtt' and trigger.payload_json is defined %}
            {% set w = (trigger.payload_json.W | default(0) if mqtt
                        else states('sensor.markedroid_zon_vermogen')) | float(0) %}
            {% set inc = (trigger.payload_json.TotWhInc | default(0) if mqtt else 0) | float(0) %}
            {% set sl = (trigger.payload_json.SinceLast | default(10) if mqtt else 10) | float(10) %}
            {% set teller_w = (inc / sl * 3600) if sl > 0 else 0 %}
            {% set plafond = state_attr('sensor.zon_vermogen_nu', 'piekvermogen') | float(9460) * 1.3 %}
            {# Geen sun.sun? Dan niet alles op 0 zetten: 90 graden. #}
            {% set nacht = state_attr('sun.sun', 'elevation') | float(90) < -3 %}
            {% set vorige = this.state | float(0) if is_number(this.state) else 0 %}
            {% set vorige = vorige if 0 <= vorige <= plafond else 0 %}
            {% if nacht %}
              0
            {% elif w < 0 or w > plafond %}
              {{ vorige | round(1) }}
            {% elif w == 0 and vorige > 300 and teller_w > 100 %}
              {{ vorige | round(1) }}
            {% else %}
              {{ w | round(1) }}
            {% endif %}
          attributes:
            # Het piekvermogen van ALLE panelen samen, in W: de 100% voor de
            # klok, de spraak-intent en het Overzicht. Eén plek, zodat die
            # drie niet elk een eigen getal gaan verzinnen.
            #
            # 9,46 kWp: de 28 panelen samen (28-10-2026, zoals in SlimHuys).
            # Tot die dag stond hier 8000, de AC-plafonds van de twee oude
            # GoodWe's. Ook de leesfout-grens hierboven (1,3 x dit getal) en
            # die van de Wh-teller in Battery.yaml rekenen hiermee.
            piekvermogen: 9460

        - name: "Zon Opgewekt Vandaag"
          unique_id: zon_opgewekt_vandaag
          default_entity_id: sensor.zon_opgewekt_vandaag
          unit_of_measurement: "kWh"
          device_class: energy
          # Een dagteller die om middernacht naar 0 gaat. De utility_meter
          # hierboven doet de dagwissel; `markedroid_zon_energie` telt alleen
          # op (een negatief increment telt daar als 0), dus binnen een dag
          # kan hij niet dalen.
          state_class: total_increasing
          availability: "{{ has_value('sensor.zon_deye_vandaag') }}"
          state: "{{ (states('sensor.zon_deye_vandaag') | float(0) / 1000) | round(2) }}"
