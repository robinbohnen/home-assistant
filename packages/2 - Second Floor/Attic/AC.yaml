attic_ac_package:

  sensor:
    # Hier stond een `group:` van deze vijf sensoren, waar de trigger hieronder
    # een numeric_state op deed. Een groep middelt geen sensorwaarden maar geeft
    # een groepsstatus, en die blijft bij sensoren `unknown`: de trigger is
    # daardoor nooit afgegaan en de airco-vraag is nooit gesteld. Een min_max
    # met type mean geeft wel een getal om op te triggeren.
    - platform: min_max
      type: mean
      round_digits: 1
      name: Temperatuur boven gemiddeld
      unique_id: temperatuur_boven_gemiddeld
      entity_ids:
        - sensor.badkamer_badkamer_temperatuur_temperatuur
        - sensor.slaapkamer_slaapkamer_temperatuur_temperatuur
        # De multisensor sinds 4 september 2026, dezelfde bron die
        # kamers.jinja en klimaat.jinja voor deze kamer aanwijzen. De oude
        # TIMMERFLOTTE bewust NIET laten staan: die hangt in dezelfde kamer en
        # zou dit gemiddelde over vijf kamers met twee stemmen laten meetellen.
        - sensor.slaapkamer_logan_slaapkamer_maxi_multisensor_temperatuur
        - sensor.slaapkamer_emma_slaapkamer_mini_temperatuur_temperatuur
        - sensor.kantoor_kantoor_temperatuur_temperatuur

  timer:
    # Zolang deze loopt is de vraag "wil je de airco aanzetten?" al gesteld en
    # wordt hij niet opnieuw gesteld. Zelfde opzet als timer.zonnescherm_vraag
    # in packages/9 - Other/Klimaat Zonwering.yaml.
    airco_zolder_vraag:
      name: "Airco zolder - vraag gesteld"
      duration: "04:00:00"
      icon: mdi:comment-question-outline
      # Zonder restore begint deze timer na een herstart van Home Assistant weer
      # op idle. De numeric_state-trigger hieronder maakt bij het opstarten een
      # verse overgang (unavailable -> boven de grens), dus op een warme dag
      # kreeg je de vraag na elke herstart opnieuw.
      restore: true

    # Hoe lang "Ja" op de melding nog geldt. Stond effectief op twee minuten
    # (de timeout van de oude wait_for_trigger), en dat is voor een melding op
    # je telefoon niet te halen tenzij je hem toevallig in je hand hebt - de
    # knop deed dus meestal niets. Een kwartier is lang genoeg om te antwoorden
    # en kort genoeg dat je niet 's avonds alsnog per ongeluk de airco aanzet
    # op een vraag van vanmiddag. Restore, zodat een herstart binnen dat
    # kwartier het venster niet stiekem openhoudt of dichtgooit.
    airco_zolder_antwoord:
      name: "Airco zolder - antwoordvenster"
      duration: "00:15:00"
      icon: mdi:comment-question-outline
      restore: true

  cover:
    - platform: group
      unique_id: covers_upstairs
      name: All covers Upstairs
      entities:
        - cover.badkamer_rolluik
        - cover.kantoor_links
        - cover.kantoor_rechts
        - cover.slaapkamer_rolluik
        - cover.slaapkamer_mini
        - cover.slaapkamer_maxi_rechts
        - cover.slaapkamer_maxi_links

  automation:
    - id: airco_automatic_on
      alias: Attic AC - Automatically On
      description: "Turn on the AC if it is too hot upstairs"
      mode: single
      triggers:
        # De grens stond op 21, maar die is nooit in de praktijk getoetst omdat
        # de trigger niet werkte (zie de sensor hierboven). 21 graden gemiddeld
        # over vijf kamers is een normale kamertemperatuur, geen "snikheet":
        # daarmee zou deze vraag vrijwel elke zomerdag binnenkomen. 24 ligt in
        # lijn met de woonkamer, die op 22,5 vraagt voor één kamer.
        # `for` vangt af dat een gemiddelde dat rond de grens schommelt de vraag
        # meerdere keren per dag stelt.
        - trigger: numeric_state
          entity_id: sensor.temperatuur_boven_gemiddeld
          above: 24
          for: "00:10:00"
      conditions:
        # Het gemiddelde over vijf kamers schommelt rond de grens, en een
        # numeric_state-trigger vuurt bij élke overschrijding. Zonder deze
        # cooldown krijg je de vraag op een warme dag meerdere keren.
        - alias: Vandaag al gevraagd? Dan nu even niet
          condition: state
          entity_id: timer.airco_zolder_vraag
          state: idle
        # Op een tropische avond blijft dat gemiddelde ook om half twaalf boven
        # de 24 staan. Een vraag die je wakker maakt om te vertellen dat het
        # warm is heeft niemand iets aan; slaap je al, dan lost de airco het
        # vannacht toch niet meer op.
        - alias: Niet midden in de nacht vragen
          condition: time
          after: "08:00:00"
          before: "22:30:00"
      actions:
        # Hier stond een `not` op het attribuut `fan_mode` (staat hij al op
        # `high`?). Dat is de verkeerde vraag op twee manieren: een airco die
        # draait op `medium`, `auto` of `low` - bijvoorbeeld met de hand of via
        # de afstandsbediening aangezet - telde als uit, en een integratie die
        # de stand met een hoofdletter teruggeeft (`High`) matcht nooit,
        # waardoor de vraag élke keer gesteld werd. Wat we willen weten is
        # simpelweg of hij uit staat.
        - if:
            - alias: Airco op zolder staat uit
              condition: state
              entity_id: climate.airco_zolder
              state: "off"
          then:
            # Timer eerst: gaat er daarna iets mis, dan is de vraag hooguit
            # blijven liggen in plaats van elk half uur opnieuw gesteld.
            - action: timer.start
              target:
                entity_id: timer.airco_zolder_vraag
            - data: {}
              action: script.script_attic_ac

    ###########################################################################
    ## Het antwoord op die vraag afhandelen
    ###########################################################################
    # Los van de vraag, zodat er niets hoeft te blijven wachten. De knop op de
    # telefoon heet vast `AIRCO_ZOLDER_JA`; de geldigheid komt van het
    # antwoordvenster, niet van een lopende run.
    - id: airco_zolder_antwoord
      alias: Attic AC - Antwoord op de vraag
      description: >-
        Zet de zolderairco aan als je "Ja" antwoordt op de vraag, mits het
        antwoordvenster nog loopt.
      mode: single
      triggers:
        - trigger: event
          event_type: mobile_app_notification_action
          event_data:
            action: AIRCO_ZOLDER_JA
      conditions:
        - alias: Vraag staat nog open
          condition: state
          entity_id: timer.airco_zolder_antwoord
          state: active
      actions:
        # Venster meteen dicht: twee telefoons die allebei "Ja" tikken hoeven
        # de airco niet twee keer aan te zetten.
        - action: timer.cancel
          target:
            entity_id: timer.airco_zolder_antwoord
        - action: cover.close_cover
          target:
            entity_id: cover.all_covers_upstairs
        - action: climate.turn_on
          target:
            entity_id: climate.airco_zolder
        - action: climate.set_temperature
          target:
            entity_id: climate.airco_zolder
          data:
            temperature: 18
            hvac_mode: cool
        - action: climate.set_fan_mode
          target:
            entity_id: climate.airco_zolder
          data:
            fan_mode: high

  script:
    # ALLEEN VRAGEN; HET ANTWOORD WORDT ELDERS AFGEHANDELD
    # Hier stond een `wait_for_trigger` van twee minuten met de hele uitvoering
    # erachter. Zo'n wachtende run overleeft geen reload van de scripts, en dat
    # is precies wat er gebeurt zodra je één YAML-bestand aanraakt: de vraag
    # staat dan nog op je telefoon, maar "Ja" komt bij niemand meer aan. Dezelfde
    # constructie zat bij de zonneschermvraag en is daar op 2026-08-06 om die
    # reden gesplitst; zie packages/9 - Other/Klimaat Zonwering.yaml.
    #
    # Het antwoord komt nu binnen bij `airco_zolder_antwoord` hierboven, en die
    # heeft niets nodig dat blijft draaien.
    script_attic_ac:
      alias: Airco aan wanneer warm vraag
      mode: single
      sequence:
        - action: timer.start
          target:
            entity_id: timer.airco_zolder_antwoord
        - alias: Ask if airco need to turn on
          action: notify.mobile_devices_adults
          data:
            title: Airco zolder aanzetten?
            message: Het is snikheet boven, wil je de airco aanzetten?
            data:
              actions:
                # Vaste naam, geen context.id meer: de afhandelaar is een losse
                # automatisering en kan een per-run gegenereerde naam niet
                # kennen. Het antwoordvenster hieronder bewaakt de geldigheid.
                - action: AIRCO_ZOLDER_JA
                  title: Ja

    script_attic_ac_off:
      alias: Airco zolder uit (met herhaalpogingen)
      description: >-
        Zet de airco op zolder uit en blijft het proberen zolang hij
        onbereikbaar is. Eerst een paar snelle pogingen, daarna rustiger.
      mode: restart
      sequence:
        - repeat:
            sequence:
              # continue_on_error: bij een onbereikbare airco faalt de service
              # call, dat mag de herhaallus niet afbreken.
              - action: climate.turn_off
                target:
                  entity_id: climate.airco_zolder
                data: {}
                continue_on_error: true
              # Wacht op bevestiging, maar ga direct verder zodra hij uit is.
              # Eerste 6 pogingen snel achter elkaar, daarna elke 30 seconden.
              - wait_template: "{{ is_state('climate.airco_zolder', 'off') }}"
                timeout: "{{ 5 if repeat.index <= 6 else 30 }}"
                continue_on_timeout: true
            until:
              # Stoppen zodra hij uit is, of na ~5,5 minuut proberen.
              - condition: template
                value_template: >-
                  {{ is_state('climate.airco_zolder', 'off') or repeat.index >= 16 }}
        - if:
            - condition: not
              conditions:
                - condition: state
                  entity_id: climate.airco_zolder
                  state: "off"
          then:
            - action: notify.mobile_devices_adults
              data:
                title: Airco zolder
                message: >-
                  De airco op zolder kon niet worden uitgezet, hij blijft
                  onbereikbaar.
