bedroom_mini_covers_package:
  automation:
    - id: bedroom_mini_covers
      alias: Bedroom Mini - Covers
      description: "Shut all covers at bedtime"
      mode: single
      triggers:
        - trigger: time
          at: "19:00:00"
      conditions:
        # Vervangen door de klimaatregie zodra die aan staat, zie
        # packages/9 - Other/Klimaat Zonwering.yaml.
        - condition: state
          entity_id: input_boolean.klimaatregie_actief
          state: "off"
      actions:
        - action: cover.close_cover
          metadata: {}
          data: {}
          target:
            entity_id:
              - cover.slaapkamer_mini
