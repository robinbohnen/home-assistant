mini_opened_door_bedtime_package:

  automation:
    # De id blijft ongewijzigd: daar hangt de bestaande entiteit aan vast, een
    # nieuwe id levert een tweede automatisering op in plaats van deze.
    - id: mini_opened_door_bedtime
      alias: Bedroom Mini - Opened door during bedtime
      description: >-
        Mini has opened her door during bedtime; notice parents by breathe some lights
        in color
      use_blueprint:
        path: robin/door_opened_bedtime.yaml
        input:
          deur_contact: binary_sensor.slaapkamer_mini_deur_contact
          bedtijd: input_datetime.bedtime_mini_1h_off
          # Eigen scene_id, anders overschrijven Maxi en Mini elkaars
          # momentopname en zet de een de lampen terug in de ademstand van de ander.
          scene_id: mini_door_sleeping
          attentie_lampen:
            - light.woonkamer_tv_kast_hue_bar_links
            - light.achtertuin_overkapping_wand_kort_spot_boven
          # Roze is van Mini.
          kleur: [255, 64, 255]
          melding_titel: Deur Mini open
          melding_tekst: De deur van mini is geopend tijdens bedtijd, lampen zijn uit dus.
