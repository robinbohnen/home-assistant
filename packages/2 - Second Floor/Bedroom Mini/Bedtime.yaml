bedtime_mini_package:

  input_datetime:
    bedtime_mini:
      name: "Bedroom Mini - Bedtime Mini"
      has_time: true
      icon: mdi:clock-time-eight
    bedtime_mini_1h_off:
      name: "Bedroom Mini - Bedtime Mini (1h off)"
      has_time: true
      icon: mdi:clock-time-seven
    bedtime_mini_weekend:
      name: "Bedroom Mini - Bedtime Mini (Weekend)"
      has_time: true
      icon: mdi:clock-time-nine

  automation:
    ###########################################################################
    ## LICHT UIT NA BEDTIJD - MET NABRANDER
    ##
    ## Zelfde constructie en dezelfde reden als bij Maxi; die kamer heeft het
    ## verhaal erbij staan (packages/1 - First Floor/Bedroom Maxi/Bedtime.yaml).
    ## Kort: het bedtijdstip is één moment, dus een druk op de knop in de tien
    ## minuten ervóór glipt langs de conditie en dan brandt het licht door. De
    ## tweede trigger doet het licht alsnog uit zodra het binnen de nacht tien
    ## minuten aan staat. Bij Maxi ging het op 18 augustus 2026 mis; hier stond
    ## exact hetzelfde gat, alleen viel het nog niet op.
    ##
    ## En dezelfde uitzondering: staat `input_boolean.kinderen_mogen_wakker_worden`
    ## aan, dan laat de ochtendhelft het licht met rust. Zie de Maxi-package voor
    ## het waarom.
    ###########################################################################
    - id: bedtime_for_mini_lights_off
      alias: 'Bedroom Mini - Bedtime Lights Off'
      description: 'Turn off the lights at minis bedroom after bedtime'
      triggers:
        - at: input_datetime.bedtime_mini
          trigger: time
          id: bedtijd
        - at: input_datetime.bedtime_mini_weekend
          trigger: time
          id: bedtijd
        - trigger: state
          entity_id: light.slaapkamer_mini_lampen
          to: "on"
          for:
            hours: 0
            minutes: 10
            seconds: 0
          id: nabrander
      conditions:
        - condition: or
          conditions:
            - condition: and
              conditions:
                - condition: trigger
                  id: bedtijd
                - condition: state
                  entity_id: light.slaapkamer_mini_lampen
                  state: "on"
                  for:
                    hours: 0
                    minutes: 10
                    seconds: 0
            - condition: and
              conditions:
                - condition: trigger
                  id: nabrander
                - condition: template
                  value_template: >-
                    {% set bedtijden = ['input_datetime.bedtime_mini',
                                        'input_datetime.bedtime_mini_weekend']
                                       | map('states')
                                       | reject('in', ['unknown', 'unavailable', ''])
                                       | list %}
                    {% set na_bedtijd = bedtijden
                       and now().strftime('%H:%M:%S') >= bedtijden | min %}
                    {% set voor_opstaan = now().hour < 7
                       and is_state('input_boolean.klimaat_wakker', 'off')
                       and not is_state('input_boolean.kinderen_mogen_wakker_worden', 'on') %}
                    {{ na_bedtijd or voor_opstaan }}
      actions:
        - action: light.turn_off
          metadata: {}
          data: {}
          target:
            entity_id: light.slaapkamer_mini_lampen
      mode: single

    - id: bedtime_for_mini_media_off
      alias: 'Bedroom Mini - Bedtime Media Off'
      description: "Turn off all media when bedtime is due"
      mode: single
      triggers:
        - trigger: time
          at: input_datetime.bedtime_mini
        - trigger: time
          at: "19:00:00"
      conditions: []
      # De volgorde is niet vrij: `media_stop` op een speaker die nog in een
      # groep zit, gaat naar de groepsleider en legt daarmee het hele huis stil.
      # Dus eerst los, dan pas stoppen.
      #
      # Zonder die stop bleef de speaker de hele nacht op `paused` staan met de
      # laatste zender nog geladen; op het Overzicht-dashboard toont dat gewoon
      # de Qmusic-artwork en -titel, en dan lijkt het alsof er muziek aanstaat
      # in een slaapkamer waar geslapen wordt (2026-08-09 zo gemeld). Met stop
      # gaat hij naar `idle` en is de kaart leeg, net als bij Maxi.
      actions:
        - action: media_player.unjoin
          metadata: {}
          data: {}
          target:
            entity_id: media_player.slaapkamer_mini_sonos
        - action: media_player.media_stop
          continue_on_error: true
          data: {}
          target:
            entity_id: media_player.slaapkamer_mini_sonos
