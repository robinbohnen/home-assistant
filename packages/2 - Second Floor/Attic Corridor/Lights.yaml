attic_corridor_lights_package:

  input_number:
    lights_attic_corridor_percentage:
      name: "Lights Attic Corridor - Percentage"
      min: 0
      max: 100
      step: 1
      icon: mdi:lightbulb-on-70

  input_boolean:
    enable_pir_attic_corridor:
      name: "PIR in Attic Corridor"
      icon: mdi:motion-sensor

  automation:
    - id: lights_movement_attic_corridor
      alias: Attic Corridor - Lights
      description: "Turn on the lights of the attic corridor if there is movement detected"
      use_blueprint:
        path: robin/motion_light.yaml
        input:
          bewegingssensor: binary_sensor.overloop_zolder_beweging_occupancy
          lamp: light.overloop_zolder_lampen
          schakelaar: input_boolean.enable_pir_attic_corridor
          helderheid: input_number.lights_attic_corridor_percentage
          # Zelfde bedtijdblokkades als de overloop op de eerste verdieping;
          # zie de toelichting daar. Alleen het aanzetten wordt geblokkeerd.
          aan_blokkades:
            - condition: not
              conditions:
                - condition: time
                  after: input_datetime.bedtime_maxi
                  before: "07:15:00"
            - condition: not
              conditions:
                - condition: time
                  after: input_datetime.bedtime_mini
                  before: "07:15:00"
          # Overdag bij vol daglicht hoeft hier geen lamp aan; zie de
          # toelichting bij de speelkamer voor de drempelkeuze.
          lux_sensor: sensor.buiten_zon_luminance_max
          lux_drempel: 20000
