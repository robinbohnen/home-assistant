attic_corridor_lights_package:

  input_number:
    lights_attic_corridor_percentage:
      name: "Lights Attic Corridor - Percentage"
      min: 0
      max: 100
      step: 1
      icon: mdi:lightbulb-on-70

  input_boolean:
    enable_pir_attic_corridor:
      name: "PIR in Attic Corridor"
      icon: mdi:motion-sensor

  automation:
    - id: lights_movement_attic_corridor
      alias: Attic Corridor - Lights
      description: "Turn on the lights of the attic corridor if there is movement detected"
      use_blueprint:
        path: robin/motion_light.yaml
        input:
          bewegingssensor: binary_sensor.overloop_zolder_beweging_occupancy
          lamp:
            - light.overloop_zolder_lampen
          schakelaar: input_boolean.enable_pir_attic_corridor
          helderheid: input_number.lights_attic_corridor_percentage
          # VANGNET (13 november 2026): deze lamp ging vaak niet meer vanzelf
          # uit. De oorzaak is niet uit de config te halen (geen logboek bij de
          # hand), maar er zijn drie routes waarop de gewone uit-trigger nooit
          # komt: Mini's deur zet hem na zonsondergang aan zonder dat hier
          # iemand loopt (automation.bedroom_mini_lights_on_door_opened, één
          # los uit-commando na vijf minuten, weg bij een herlaad tijdens die
          # `delay`), hij gaat aan via dashboard of stem, en valt de melder weg
          # terwijl hij `on` staat en komt hij terug op `off`, dan telt dat
          # bewust niet als "geen beweging". Het vangnet dekt alle drie.
          #
          # Tien minuten: ruim na de vijf minuten van Mini's deur, zodat die
          # automatisering eerst zelf haar werk doet. Uitleg in de blueprint
          # bij de trigger `vangnet`.
          vangnet_na:
            hours: 0
            minutes: 10
            seconds: 0
          # Geen daglichtdrempel; beweging is overdag het enige dat telt.
          #
          # 's Nachts niet: dezelfde rem als op de overloop een verdieping
          # lager (Robin, 12 augustus 2026), inclusief de uitzondering voor
          # twee openstaande kinderdeuren. Het venster zelf staat in
          # binary_sensor.huis_slaapt, zodat de twee overlopen niet uit elkaar
          # kunnen lopen; de toelichting staat bij die sensor in
          # packages/1 - First Floor/Bedroom Maxi/Bedtime.yaml en bij de
          # overloop in packages/1 - First Floor/Corridor/Lights.yaml.
          #
          # Doet Mini na zonsondergang haar deur open, dan gaat deze overloop
          # gewoon aan: dat doet automation.bedroom_mini_lights_on_door_opened
          # rechtstreeks en niet via deze blueprint. Die automatisering dooft
          # na vijf minuten zelf weer, tenzij de bewegingssensor hier dan nog
          # iemand ziet - en het uitzetten door de blueprint blijft ook 's
          # nachts gewoon werken, want blokkades gelden alleen voor het
          # aanzetten.
          aan_blokkades:
            - alias: "Niet tussen bedtijd en opstaan"
              condition: template
              value_template: "{{ not is_state('binary_sensor.huis_slaapt', 'on') }}"
