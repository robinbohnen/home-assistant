toilet_media_package:
  automation:
    - id: media_movement_toilet
      alias: Toilet - Media
      description: "Turn on the media in the toilet if there is movement detected"
      use_blueprint:
        path: robin/sonos_motion_join.yaml
        input:
          bewegingssensor: binary_sensor.toilet_beweging_occupancy
          # De PIR ziet je pas als de deur al dicht is; het deurcontact is hier
          # de snellere trigger.
          deur_contacten:
            - binary_sensor.toilet_deur_contact
          speaker: media_player.toilet_sonos
          schakelaar: input_boolean.enable_pir_toilet
          # Deze speaker is hardwarematig begrensd, dus vol is hier gewoon het
          # luisterniveau - en het wordt elke keer teruggezet.
          volume_niveau: 1
          volume_forceren: true
