toilet_lights_package:

  input_number:
    lights_toilet_percentage:
      name: "Lights Toilet - Percentage"
      min: 0
      max: 100
      step: 1
      icon: mdi:lightbulb-on-70

  input_boolean:
    enable_pir_toilet:
      name: "PIR in Toilet"
      icon: mdi:motion-sensor

  automation:
    - id: lights_movement_toilet
      alias: Toilet - Lights
      description: "Turn on the lights in the toilet if there is movement detected"
      use_blueprint:
        path: robin/motion_light.yaml
        input:
          bewegingssensor: binary_sensor.toilet_beweging_occupancy
          deur_contacten:
            - binary_sensor.toilet_deur_contact
          lamp: light.toilet_hanglamp
          schakelaar: input_boolean.enable_pir_toilet
          helderheid: input_number.lights_toilet_percentage
