hallway_lock_package:
  automation:
    - id: hallway_auto_lock
      alias: Hallway - Lock
      description: Auto lock and unlock hallway lock
      mode: single
      triggers:
        - trigger: time
          at: "19:00:00"
          id: bedtime
        # Uit de router in packages/1 - First Floor/Bedroom/Buttons.yaml.
        # De ochtend-/avondsplitsing zat hier eerder als tijdconditie in
        # de choose; die staat nu in het event zelf.
        - trigger: event
          event_type: huis_routine
          event_data:
            routine: ochtend
          id: routine_ochtend
        - trigger: event
          event_type: huis_routine
          event_data:
            routine: avond
          id: routine_avond
        - trigger: time
          at: "09:30:00"
          id: morning
        - trigger: state
          entity_id:
            - alarm_control_panel.alarmo
          to: armed_away
          id: alarm_on_not_home
        - trigger: state
          entity_id:
            - alarm_control_panel.alarmo
          to: armed_home
          id: alarm_on_home
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - bedtime
                    - alarm_on_not_home
                    - alarm_on_home
              sequence:
                - if:
                    - condition: state
                      entity_id: lock.kroon18voordeur
                      state: unlocked
                  then:
                    - action: lock.lock
                      metadata: {}
                      data: {}
                      target:
                        entity_id: lock.kroon18voordeur
                  alias: Lock
            - conditions:
                - condition: trigger
                  id:
                    - routine_ochtend
              sequence:
                - if:
                    - condition: state
                      entity_id: lock.kroon18voordeur
                      state: locked
                  then:
                    - action: lock.unlock
                      target:
                        entity_id: lock.kroon18voordeur
                  alias: Unlock
            - conditions:
                - condition: trigger
                  id:
                    - routine_avond
              sequence:
                - if:
                    - condition: state
                      entity_id: lock.kroon18voordeur
                      state: unlocked
                  then:
                    - action: lock.lock
                      target:
                        entity_id: lock.kroon18voordeur
                  alias: Lock
            - conditions:
                - condition: trigger
                  id:
                    - morning
              sequence:
                - if:
                    - condition: state
                      entity_id: group.all_adults
                      state: home
                    - condition: state
                      entity_id: lock.kroon18voordeur
                      state: locked
                  then:
                    - action: lock.unlock
                      metadata: {}
                      data: {}
                      target:
                        entity_id: lock.kroon18voordeur
                  alias: Unlock if someone is home

    ###########################################################################
    ## VIJF MINUTEN VOOR BEDTIJD NOG EEN KEER KIJKEN
    ##
    ## Om 19:00 gaat het slot er standaard op (de `bedtime`-tak hierboven),
    ## maar daarna wordt de deur nog gebruikt: de tuin in, iemand die langskomt,
    ## de laatste boodschap. Zit hij daarna niet meer op slot, dan merkt niemand
    ## dat: het huis kijkt er pas weer naar als het alarm aangaat. Vijf minuten
    ## voor de kinderen naar bed gaan is daar het natuurlijke moment voor - je
    ## loopt dan toch naar boven - en zit hij er niet op, dan doet dit het
    ## alsnog (Robin, 22 augustus 2026).
    ##
    ## De vier bedtijd-helpers staan nu alle vier op 21:30, dus in de praktijk
    ## is dit 21:25. Verzet Robin een bedtijd, dan schuift de controle mee. Het
    ## zijn dezelfde vier helpers waar de rest van het huis op stuurt; de
    ## time-trigger telt de `offset` gewoon bij de tijd uit de helper op en
    ## loopt desnoods over middernacht heen.
    ##
    ## Een eigen automatisering en niet een tak erbij in `Hallway - Lock`: die
    ## staat op `mode: single`, en vier helpers met dezelfde tijd zijn vier
    ## triggers op dezelfde seconde. Drie daarvan zouden dan elke avond een
    ## "already running" in het log zetten voor iets dat gewoon klopt. Hier
    ## vangt `max_exceeded: silent` dat af, zonder dat het de rest van het
    ## slotverhaal raakt.
    ##
    ## De conditie kijkt naar alles wat niet aantoonbaar op slot zit en niet
    ## alleen naar `unlocked`: een slot dat klemt of nog openstaat (`jammed`,
    ## `open`) hoort hier ook een commando te krijgen. `unavailable`/`unknown`
    ## juist niet - dan weet je het niet, en een commando naar een slot dat er
    ## op dat moment niet is levert alleen een fout in de trace op.
    ###########################################################################
    - id: hallway_lock_before_kids_bedtime
      alias: Hallway - Lock check voor bedtijd kinderen
      description: >-
        Kijkt vijf minuten voor de bedtijd van de kinderen of de voordeur op
        slot zit, en doet hem alsnog op slot als dat niet zo is.
      mode: single
      max_exceeded: silent
      triggers:
        - trigger: time
          at:
            - entity_id: input_datetime.bedtime_maxi
              offset: "-00:05:00"
            - entity_id: input_datetime.bedtime_mini
              offset: "-00:05:00"
            - entity_id: input_datetime.bedtime_maxi_weekend
              offset: "-00:05:00"
            - entity_id: input_datetime.bedtime_mini_weekend
              offset: "-00:05:00"
      conditions:
        - condition: not
          conditions:
            - condition: state
              entity_id: lock.kroon18voordeur
              state:
                - locked
                - locking
                - unavailable
                - unknown
      actions:
        - action: lock.lock
          metadata: {}
          data: {}
          target:
            entity_id: lock.kroon18voordeur

    - id: hallway_lock_unlock_fingerprint
      alias: Hallway - Lock Unlock on Fingerprint
      description: Unlock lock when known fingerprint is detected
      mode: single
      triggers:
        - trigger: event
          event_type: state_changed
          event_data:
            entity_id: event.g4_doorbell_voortuin_fingerprint
      conditions:
        - condition: or
          conditions:
            - condition: state
              entity_id: event.g4_doorbell_voortuin_fingerprint
              attribute: ulp_id
              state: 2a13d91c-1f4f-4f03-83a5-b8eb61d27c4c
            - condition: state
              entity_id: event.g4_doorbell_voortuin_fingerprint
              attribute: ulp_id
              state: 72cc747f-2b58-43f2-8dcc-554a5a12307c
            - condition: state
              entity_id: event.g4_doorbell_voortuin_fingerprint
              attribute: ulp_id
              state: 66c43620-e78a-4611-8032-7765169cb118
            - condition: state
              entity_id: event.g4_doorbell_voortuin_fingerprint
              attribute: ulp_id
              state: 8b93c462-d1c1-44c0-a171-38507166d3f9
        - condition: template
          value_template: |-
            {{
               not trigger.event.data.old_state.attributes.get('restored', false) and
               not trigger.event.data.old_state.state == 'unavailable' and
               trigger.event.data.new_state is not none and
               trigger.event.data.new_state.attributes.event_type == 'identified' and
               (trigger.event.data.new_state.attributes.ulp_id|default('')) != ''
            }}
      actions:
        - action: lock.open
          metadata: {}
          data: {}
          target:
            entity_id: lock.kroon18voordeur
        - choose:
            - conditions:
                - condition: state
                  entity_id: event.g4_doorbell_voortuin_fingerprint
                  attribute: ulp_id
                  state: 2a13d91c-1f4f-4f03-83a5-b8eb61d27c4c
              sequence:
                - action: notify.mobile_devices_adults
                  metadata: {}
                  data:
                    title: Deur geopend met vingerafdruk
                    message: De deur is geopend door Robin
            - conditions:
                - condition: state
                  entity_id: event.g4_doorbell_voortuin_fingerprint
                  attribute: ulp_id
                  state: 66c43620-e78a-4611-8032-7765169cb118
              sequence:
                - action: notify.mobile_devices_adults
                  metadata: {}
                  data:
                    title: Deur geopend met vingerafdruk
                    message: >-
                      De deur is geopend door {{
                      states['input_text.naam_partner'].state }}
            - conditions:
                - condition: state
                  entity_id: event.g4_doorbell_voortuin_fingerprint
                  attribute: ulp_id
                  state: 72cc747f-2b58-43f2-8dcc-554a5a12307c
              sequence:
                - action: notify.mobile_devices_adults
                  metadata: {}
                  data:
                    title: Deur geopend met vingerafdruk
                    message: >-
                      De deur is geopend door {{ states['input_text.naam_mini'].state
                      }}
            - conditions:
                - condition: state
                  entity_id: event.g4_doorbell_voortuin_fingerprint
                  attribute: ulp_id
                  state: 8b93c462-d1c1-44c0-a171-38507166d3f9
              sequence:
                - action: notify.mobile_devices_adults
                  metadata: {}
                  data:
                    title: Deur geopend met vingerafdruk
                    message: >-
                      De deur is geopend door {{ states['input_text.naam_maxi'].state
                      }}
