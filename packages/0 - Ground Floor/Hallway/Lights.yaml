hallway_lights_package:
  input_number:
    lights_hallway_percentage:
      name: "Lights Hallway - Percentage"
      min: 0
      max: 100
      step: 1
      icon: mdi:lightbulb-on-70

  input_boolean:
    enable_pir_hallway:
      name: "PIR in Hallway"
      icon: mdi:motion-sensor

  automation:
    - id: lights_movement_hallway
      alias: Hallway - Lights
      description: "Turn on the lights of the hallway if there is movement detected"
      use_blueprint:
        path: robin/motion_light.yaml
        input:
          bewegingssensor: binary_sensor.entree_beweging_occupancy
          deur_contacten:
            - binary_sensor.entree_deur_contact
            # De voordeur zelf: thuiskomen in het donker hoort licht te geven
            # zonder eerst voor de bewegingsmelder langs te moeten lopen.
            # Let op: tussen 03:00 en 07:15 blijft de hal donker, want de
            # blokkade hieronder geldt voor élke aan-trigger, ook deze.
            - binary_sensor.entree_entree_voordeur_deur
          # TWEE PROTOCOLLEN IN ÉÉN KAMER (4 september 2026)
          # De kastlamp is van IKEA TRADFRI (Zigbee, via zigbee2mqtt) naar
          # Matter gegaan en kan daardoor niet meer in de Zigbee2MQTT-groep
          # `light.entree_lampen` - die groep leeft in het Zigbee-netwerk.
          # In `entree_lampen` zitten nu alleen nog de hanglamp en de
          # schoenenkast-ledstrip. Zie docs/matter-lampgroepen.md.
          lamp:
            - light.entree_lampen
            - light.entree_entree_kast_lamp
          schakelaar: input_boolean.enable_pir_hallway
          helderheid: input_number.lights_hallway_percentage
          # Deze blokkades gelden alleen voor het aanzetten. Als voorheen ook
          # het uitzetten hierdoor geblokkeerd werd, bleef licht dat om 02:58
          # aanging de hele nacht branden.
          aan_blokkades:
            # 's Nachts geen licht in de hal bij een verdwaalde beweging.
            - condition: not
              conditions:
                - condition: time
                  after: "03:00:00"
                  before: "07:15:00"
            # Tijdens een film mag de hal niet opflitsen (open zichtlijn).
            - condition: not
              conditions:
                - condition: state
                  entity_id: media_player.woonkamer_appletv
                  state: playing
          # De slaapkamerknop (welterusten/goedemorgen) dooft de hal direct.
          extra_uit_triggers:
            # Uit de router in
            # packages/1 - First Floor/Bedroom/Buttons.yaml.
            - trigger: event
              event_type: huis_routine
              event_data:
                routine: avond
              id: uit
