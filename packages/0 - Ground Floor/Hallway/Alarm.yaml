hallway_alarm_package:

  automation:
    - id: 'alarm_on_automatically'
      alias: Hallway Alarm - On Automatically
      description: "Turn on the alarm Automatically if everyone left the house"
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - group.all_adults
          to: not_home
      conditions: []
      actions:
        - data:
            mode: away
            skip_delay: true
            force: true
            entity_id: alarm_control_panel.alarmo
          action: alarmo.arm

    - id: 'alarm_off_automatically'
      alias: Hallway Alarm - Off Automatically
      description: "Turn off the alarm Automatically someone comes home"
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - lock.kroon18voordeur
          to: unlocked
        - trigger: state
          entity_id:
            - group.all_adults
          to: home
        - trigger: zone
          entity_id: !secret person_maxi
          zone: zone.home
          event: enter
        - trigger: zone
          entity_id: !secret person_mini
          zone: zone.home
          event: enter
        - trigger: zone
          entity_id: !secret person_partner
          zone: zone.home
          event: enter
        - trigger: zone
          entity_id: person.robin_bohnen
          zone: zone.home
          event: enter
      conditions: []
      actions:
        - if:
            - condition: not
              conditions:
                - condition: state
                  entity_id: alarm_control_panel.alarmo
                  state: disarmed
          then:
            - action: alarm_control_panel.alarm_disarm
              metadata: {}
              data: {}
              target:
                entity_id: alarm_control_panel.alarmo

    - id: 'alarm_on_automatically_robin_to_work'
      alias: Hallway Alarm - On Automatically Robin to Work
      description: If Robin left to work turn on alarm automatically
      mode: single
      triggers:
        - entity_id: person.robin_bohnen
          zone: zone.home
          event: leave
          trigger: zone
      conditions:
        - condition: and
          conditions:
            - condition: time
              after: "05:30:00"
              before: "07:00:00"
            - condition: not
              conditions:
                - condition: numeric_state
                  entity_id: cover.slaapkamer_rolluik
                  attribute: current_position
                  below: 15
      actions:
        - if:
            - condition: zone
              entity_id: person.samantha_henkelman
              zone: zone.home
          then:
            - data: {}
              target:
                entity_id: alarm_control_panel.alarmo
              action: alarm_control_panel.alarm_arm_home
            - if:
                - condition: state
                  entity_id: light.eettafel_lampen
                  state: "on"
              then:
                - metadata: {}
                  data: {}
                  target:
                    entity_id: light.eettafel_lampen
                  action: light.turn_off
              alias: Eettafel
            - if:
                - condition: state
                  entity_id: light.woonkamer_lampen
                  state: "on"
              then:
                - metadata: {}
                  data: {}
                  action: light.turn_off
                  target:
                    entity_id: light.woonkamer_lampen
              alias: Woonkamer
            - if:
                - condition: state
                  entity_id: light.keuken_lampen
                  state: "on"
              then:
                - metadata: {}
                  data: {}
                  action: light.turn_off
                  target:
                    entity_id: light.keuken_lampen
              alias: Keuken
            - if:
                - condition: state
                  entity_id: light.speelkamer_lampen
                  state: "on"
              then:
                - metadata: {}
                  data: {}
                  action: light.turn_off
                  target:
                    entity_id:
                      - light.speelkamer_lampen
              alias: Speelkamer
          else:
            - action: alarm_control_panel.alarm_arm_away
              target:
                entity_id: alarm_control_panel.alarmo
              data: {}

    - id: 'alarm_failed_to_arm_notify'
      alias: Hallway Alarm - Melding als inschakelen mislukt
      description: >-
        Alarmo weigert in te schakelen zolang er een deur of raam openstaat en
        die sensor géén "Automatisch omzeilen" heeft. Zonder melding merk je
        dat niet: de welterusten-knop lijkt gewoon te werken en het huis staat
        de hele nacht onbewaakt. Staat omzeilen wél aan, dan schakelt hij in
        en meldt alarm_bypassed_sensors_notify hieronder wat er niet bewaakt
        wordt.
      mode: queued
      max: 5
      max_exceeded: silent
      triggers:
        - trigger: event
          event_type: alarmo_failed_to_arm
      conditions: []
      actions:
        - variables:
            namen: >-
              {{ expand(trigger.event.data.sensors | default([], true))
                 | map(attribute='name') | list | join(', ') }}
        # Critical: een onbewaakt huis moet je nu weten, niet morgenochtend.
        - action: script.notify_critical
          data:
            doelgroep: notify.mobile_devices_adults
            titel: Alarm NIET ingeschakeld
            bericht: >-
              Het alarm kon niet op {{ trigger.event.data.command | default('aan', true) }}
              gezet worden{% if namen %}: {{ namen }} staat nog open{% endif %}.
              Het huis is dus niet bewaakt.
            volume: 0.7

    - id: 'alarm_bypassed_sensors_notify'
      alias: Hallway Alarm - Melding bij overgeslagen sensoren
      description: >-
        Met "Automatisch omzeilen" schakelt Alarmo gewoon in terwijl een raam
        openstaat, maar dat raam wordt dan de hele periode NIET bewaakt - en
        dat zie je verder nergens. Deze melding zegt precies welke. Let op: een
        raam dat dicht was bij het inschakelen wordt wél bewaakt, dus dat kun
        je daarna niet alsnog openzetten zonder het alarm af te laten gaan.
        Alarmo vuurt hier geen event voor; vandaar het attribuut.
      mode: single
      max_exceeded: silent
      triggers:
        # 10 seconden wachten tot de lijst stabiel is: tijdens het inschakelen
        # (exit delay) schuift dit attribuut nog heen en weer.
        - trigger: state
          entity_id: alarm_control_panel.alarmo
          attribute: bypassed_sensors
          for: "00:00:10"
      conditions:
        - condition: template
          value_template: >-
            {{ (state_attr('alarm_control_panel.alarmo', 'bypassed_sensors') or []) | count > 0 }}
        - condition: state
          entity_id: alarm_control_panel.alarmo
          state:
            - armed_home
            - armed_away
            - armed_night
            - armed_vacation
            - armed_custom_bypass
      actions:
        - variables:
            namen: >-
              {{ expand(state_attr('alarm_control_panel.alarmo', 'bypassed_sensors') or [])
                 | map(attribute='name') | list | join(', ') }}
        - action: notify.mobile_devices_adults
          data:
            title: Alarm aan, maar niet alles bewaakt
            message: >-
              Het alarm staat op
              {{ states('alarm_control_panel.alarmo') | replace('armed_', '') }},
              maar {{ namen }} stond open bij het inschakelen en wordt dus niet
              bewaakt.

    - id: 'alarm_off_automatically_morning'
      alias: Hallway Alarm - Off Automatically Morning
      description: "Turn off the alarm Automatically when someone wakes up"
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - binary_sensor.entree_deur_contact
          to: "on"
        - trigger: state
          entity_id:
            - binary_sensor.woonkamer_beweging_voor_occupancy
          to: "on"
      conditions:
        - condition: state
          entity_id: group.all_adults
          state: home
        - condition: state
          entity_id: alarm_control_panel.alarmo
          state: armed_home
        - condition: time
          after: "06:00:00"
          before: "23:30:00"
      actions:
        - action: alarm_control_panel.alarm_disarm
          metadata: {}
          data: {}
          target:
            entity_id: alarm_control_panel.alarmo
