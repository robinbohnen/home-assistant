closet_lights_package:

  input_number:
    lights_closet_percentage:
      name: "Lights Closet - Percentage"
      min: 0
      max: 100
      step: 1
      icon: mdi:lightbulb-on-70

  input_boolean:
    enable_pir_closet:
      name: "PIR in Closet"
      icon: mdi:motion-sensor

  automation:
    - id: lights_movement_closet
      alias: Closet - Lights
      description: "Turn on the lights in the closet if there is movement detected"
      use_blueprint:
        path: robin/motion_light.yaml
        input:
          bewegingssensor: binary_sensor.trapkast_beweging_occupancy
          lamp:
            - light.trapkast_lampen
          schakelaar: input_boolean.enable_pir_closet
          helderheid: input_number.lights_closet_percentage
