garage_media_package:
  automation:
    - id: media_movement_garage
      alias: Garage - Media
      description: "Turn on the media in the garage if there is movement detected"
      use_blueprint:
        path: robin/sonos_motion_join.yaml
        input:
          bewegingssensor: binary_sensor.pir_group_garage
          speaker: media_player.garage_sonos
          schakelaar: input_boolean.enable_pir_garage
          # Bewust geen volumeregeling: in de garage staat de speaker altijd
          # goed en wil je hem juist zelf harder kunnen zetten.
