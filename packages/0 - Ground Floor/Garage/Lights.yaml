garage_lights_package:

  binary_sensor:
    - platform: group
      unique_id: pir_sensors_garage
      name: PIR Group Garage
      entities:
        - binary_sensor.garage_beweging_achter_occupancy
        - binary_sensor.garage_beweging_voor_occupancy

  input_number:
    lights_garage_percentage:
      name: "Lights Garage - Percentage"
      min: 0
      max: 100
      step: 1
      icon: mdi:lightbulb-on-70

  input_boolean:
    enable_pir_garage:
      name: "PIR in Garage"
      icon: mdi:motion-sensor

  automation:
    - id: lights_movement_garage
      alias: Garage - Lights
      description: "Turn on the lights of the garage if there is movement detected"
      use_blueprint:
        path: robin/motion_light.yaml
        input:
          bewegingssensor: binary_sensor.pir_group_garage
          lamp:
            - light.garage_lampen
          schakelaar: input_boolean.enable_pir_garage
          helderheid: input_number.lights_garage_percentage
