#############################################################################
## Spraak - de satelliet in de keuken
#############################################################################
#
# Home Assistant Voice PE in de keuken. Wat hier staat is het huis-eigen deel
# van Assist: vragen die alleen dit huis kan beantwoorden, en het mechanisme
# waarmee het huis zélf een vraag kan stellen en op het antwoord kan wachten.
#
# HET APPARAAT
# De satelliet is `assist_satellite.home_assistant_voice_09a3f2_assist_satellite`
# - de naam die ESPHome zelf meegeeft, met het serienummer erin. Hij staat als
# `default` bij het veld `satelliet` van `spraak_vraag_stellen` en
# `spraak_omroepen`, en nergens anders: dat zijn de twee regels die je aanpast
# als je het apparaat hernoemt (dan wordt het `assist_satellite.<nieuwe naam>`).
# Alle aanroepen geven het veld bewust niet mee, zodat er één plek blijft.
#
# WAAROM EIGEN INTENTS EN NIET METEEN EEN TAALMODEL
# De vragen hieronder gaan over dingen waar het huis het antwoord al op weet
# (`sensor.brandweer_bezetting`, `sensor.kamers`, het zonweringsadvies). Een
# intent is dan sneller, gratis, werkt zonder internet en geeft elke keer
# hetzelfde antwoord. Een taalmodel is de laag die híer overheen komt, voor de
# zinnen die niet in `custom_sentences/nl/huis.yaml` staan; zet het in de
# pipeline op "probeer eerst lokale intents", dan blijft dit bestand de baas
# over wat het huis over zichzelf zegt. Zie docs/spraak.md.
#
# WAAROM HET ZONNESCHERM EIGEN COMMANDO'S HEEFT
# `cover.achtertuin_zonnescherm` is omgekeerd bedraad: HA-stand `open` is het
# scherm UITGESCHOVEN. Zou je die cover aan Assist blootstellen, dan doet "doe
# het zonnescherm dicht" precies het omgekeerde van wat je bedoelt. Daarom
# staat hij níet blootgesteld en gaat het via `ZonneschermUit`/`ZonneschermIn`
# hieronder, in de woorden die je in de tuin gebruikt.
#
# WAAROM EEN "OPENSTAANDE VRAAG"
# `assist_satellite.ask_question` stelt de vraag en wacht daarna één keer op
# antwoord. Zeg je niets, of iets dat er niet op lijkt, dan is dat moment weg -
# en dat is precies wanneer je twee minuten later alsnog "ja" roept. Daarom
# onthoudt `input_text.spraak_openstaande_vraag` wélke vraag open staat en
# bewaakt `timer.spraak_antwoordvenster` hoe lang dat late antwoord nog telt.
# Binnen dat venster doet "Okay Nabu, ja" precies hetzelfde als meteen
# antwoorden; staat er niets open, dan zegt het huis dat gewoon.
#
# Het antwoord komt naar buiten als event `spraak_antwoord`, met `vraag` en
# `antwoord` in de data - dezelfde opzet als het `virtual_button`-event in
# packages/9 - Other/Virtual Buttons.yaml. De vragensteller (nu alleen
# "Klimaat - Zonnescherm vragen") hoeft daardoor niets van spraak te weten en
# blijft werken als deze satelliet er niet is.
#
# LET OP: nieuwe pakketbestanden en nieuwe zinnen in custom_sentences vragen
# allebei een volledige herstart van Home Assistant.

keuken_voice_package:
  input_text:
    spraak_openstaande_vraag:
      name: "Spraak - Openstaande vraag"
      icon: mdi:comment-question-outline
      min: 0
      max: 50
      # Leeg = er staat niets open. De waarde is de sleutel van de vraag
      # ('zonnescherm'), niet de vraag zelf: de tekst mag veranderen zonder
      # dat de afhandeling meeverandert.

  timer:
    spraak_antwoordvenster:
      name: "Spraak - Antwoordvenster"
      icon: mdi:timer-sand
      duration: "00:10:00"
      # Zonder venster blijft "ja" uren geldig en beantwoord je 's avonds nog
      # de vraag van vanmiddag. Loopt hij af, dan ruimt de automation onderaan
      # de openstaande vraag op.
      #
      # De restore is voor een herstart bínnen het venster: zonder komt de
      # timer op idle terug zonder actief->idle-flank, vuurt de opruim-
      # automation nooit en blijft input_text.spraak_openstaande_vraag
      # eeuwig staan. Antwoorden faalde al veilig (conditie "timer active"),
      # dit ruimt alleen de hangende vraag netjes op.
      restore: true

  script:
    ###########################################################################
    ## Het huis stelt een vraag
    ###########################################################################
    spraak_vraag_stellen:
      alias: Spraak - Vraag stellen
      description: >-
        Laat de satelliet een vraag stellen en daarna luisteren. Het antwoord
        komt terug als event `spraak_antwoord`.
      icon: mdi:comment-question-outline
      mode: single
      max_exceeded: silent
      fields:
        vraag:
          name: Vraag
          description: Sleutel van de vraag, komt terug in het event
          required: true
          example: zonnescherm
          selector:
            text:
        tekst:
          name: Tekst
          description: Wat de satelliet hardop vraagt
          required: true
          example: Zal ik het zonnescherm uitzetten?
          selector:
            text:
        minuten:
          name: Antwoordvenster
          description: Hoe lang "ja" nog telt
          default: 10
          selector:
            number:
              min: 1
              max: 60
              unit_of_measurement: minuten
        satelliet:
          name: Satelliet
          description: Welke satelliet het vraagt
          default: assist_satellite.home_assistant_voice_09a3f2_assist_satellite
          selector:
            entity:
              domain: assist_satellite
      sequence:
        - variables:
            sat: "{{ satelliet | default('assist_satellite.home_assistant_voice_09a3f2_assist_satellite', true) }}"
            venster: "{{ minuten | default(10, true) | int(10) }}"
        # Eerst kijken of er iets te vragen valt. Anders zou er een vraag open
        # komen te staan die niemand gehoord heeft, en zou "ja" een uur later
        # alsnog het zonnescherm uitzetten.
        - alias: Satelliet bestaat en doet het
          condition: template
          value_template: "{{ has_value(sat) and states(sat) not in ['unavailable', 'unknown'] }}"
        - action: input_text.set_value
          target:
            entity_id: input_text.spraak_openstaande_vraag
          data:
            value: "{{ vraag }}"
        - action: timer.start
          target:
            entity_id: timer.spraak_antwoordvenster
          data:
            duration: "{{ venster * 60 }}"
        # WAAROM `ask_question` EN NIET `start_conversation`
        # `start_conversation` laat de satelliet een gesprek beginnen, en dát
        # mag alleen een gespreksagent die een gesprek kan voortzetten. De
        # ingebouwde agent weigert het:
        #
        #   Built-in conversation agent does not support starting conversations
        #
        # (gemeten 2026-08-05; `supported_features` van de satelliet stond op 3,
        # dus het apparaat kon het wél - naar dat attribuut kijken helpt niet.)
        #
        # `ask_question` stelt de vraag én luistert, maar gáát langs de
        # gespreksagent heen: Home Assistant matcht het antwoord zelf tegen de
        # zinnen hieronder. Daarom werkt het met de ingebouwde agent, en is er
        # voor een ja/nee-vraag geen taalmodel nodig.
        #
        # Deze zinnen staan bewust hier en niet in custom_sentences: ze gelden
        # alleen zolang deze vraag gesteld wordt. Buiten dit moment is "ja" een
        # zin die nergens op slaat, en dat hoort hij dan ook te zeggen.
        #
        # continue_on_error: praat er iemand doorheen of is de satelliet net
        # bezig, dan is de vraag hooguit niet gesteld. De melding op de telefoon
        # staat daar los van en is al verstuurd.
        - action: assist_satellite.ask_question
          target:
            entity_id: "{{ sat }}"
          data:
            question: "{{ tekst }}"
            answers:
              - id: ja
                sentences:
                  - "ja [graag|hoor|prima|doe maar]"
                  - "doe maar [wel]"
                  - "(oke|oké)"
              - id: nee
                sentences:
                  - "nee [hoor|dank je|bedankt|laat maar]"
                  - "laat maar [zitten]"
                  - "niet doen"
                  - "liever niet"
          response_variable: gehoord
          continue_on_error: true
        # Antwoord binnen? Dan meteen doorgeven en de vraag sluiten. Kwam er
        # niets bruikbaar uit (niet verstaan, of iets heel anders gezegd), dan
        # blijft de vraag het hele antwoordvenster open staan en kan "Okay Nabu,
        # ja" hem alsnog beantwoorden via AntwoordJa/AntwoordNee.
        - if:
            - condition: template
              value_template: "{{ (gehoord.id | default('')) in ['ja', 'nee'] }}"
          then:
            - event: spraak_antwoord
              event_data:
                vraag: "{{ vraag }}"
                antwoord: "{{ gehoord.id }}"
            - action: script.spraak_vraag_sluiten

    spraak_vraag_sluiten:
      alias: Spraak - Vraag sluiten
      description: Zet de openstaande vraag terug op niets.
      icon: mdi:comment-check-outline
      mode: single
      sequence:
        - action: timer.cancel
          target:
            entity_id: timer.spraak_antwoordvenster
        - action: input_text.set_value
          target:
            entity_id: input_text.spraak_openstaande_vraag
          data:
            value: ""

    ###########################################################################
    ## Het huis zegt iets, zonder te vragen
    ###########################################################################
    # De satelliet heeft een klein speakertje: prima voor één zin in de keuken,
    # niet voor een mededeling aan het hele huis. Vandaar het veld `sonos`:
    # dezelfde tekst gaat dan ook over een speaker naar keuze.
    #
    # WAAROM GOOGLE ALS DEFAULT
    # `tts.speak` heeft een `tts.`-ENTITEIT nodig. De Azure-stem is als
    # klassiek `tts:`-platform in configuration.yaml wél kiesbaar in een
    # pipeline (de satelliet praat er ook mee), maar zo'n platform levert
    # alleen de dienst `tts.microsoft_say`. De entiteit waarvan zeker is dat
    # hij bestaat is `tts.google_translate_nl_nl` - dezelfde die het alarm en
    # de brandweermelding al gebruiken. Staat de Microsoft-stem óók als
    # `tts.`-entiteit in Toestanden, zet hem dan hieronder bij `stem`; dan
    # klinkt een omroep hetzelfde als de satelliet.
    spraak_omroepen:
      alias: Spraak - Omroepen
      description: Zegt een zin op de satelliet, en desgewenst ook op de Sonos.
      icon: mdi:bullhorn
      mode: queued
      max: 5
      fields:
        tekst:
          name: Tekst
          required: true
          example: Het eten is klaar.
          selector:
            text:
        satelliet:
          name: Satelliet
          default: assist_satellite.home_assistant_voice_09a3f2_assist_satellite
          selector:
            entity:
              domain: assist_satellite
        sonos:
          name: Ook op de Sonos
          description: Speaker die het mee moet omroepen (leeg = alleen de satelliet)
          default: ""
          selector:
            entity:
              domain: media_player
        stem:
          name: Stem
          default: tts.google_translate_nl_nl
          selector:
            entity:
              domain: tts
      sequence:
        - variables:
            sat: "{{ satelliet | default('assist_satellite.home_assistant_voice_09a3f2_assist_satellite', true) }}"
            speaker: "{{ sonos | default('', true) }}"
            engine: "{{ stem | default('tts.google_translate_nl_nl', true) }}"
        - if:
            - condition: template
              value_template: "{{ has_value(sat) and states(sat) not in ['unavailable', 'unknown'] }}"
          then:
            - action: assist_satellite.announce
              target:
                entity_id: "{{ sat }}"
              data:
                message: "{{ tekst }}"
              continue_on_error: true
        - if:
            - condition: template
              value_template: "{{ speaker != '' and has_value(speaker) }}"
          then:
            - action: tts.speak
              target:
                entity_id: "{{ engine }}"
              data:
                media_player_entity_id: "{{ speaker }}"
                message: "{{ tekst }}"
              continue_on_error: true

  ###########################################################################
  ## De vragen die alleen dit huis kan beantwoorden
  ##
  ## De zinnen staan in custom_sentences/nl/huis.yaml; hier staat wat het
  ## antwoord is. tests/test_spraak.py rendert elke `speech`-tekst offline,
  ## dus een fout in een template hoeft niet op een herstart te wachten.
  ###########################################################################
  intent_script:
    #########################################################################
    ## Kazerne
    #########################################################################
    BrandweerBezetting:
      description: Hoe staat de bezetting van de dienstdoende ploeg ervoor.
      speech:
        text: >-
          {%- set s = 'sensor.brandweer_bezetting' -%}
          {%- set dienst = is_state('binary_sensor.brandweer_ik_heb_dienst', 'on') -%}
          {%- set mijn = ' Jij hebt deze week dienst.' if dienst else '' -%}
          {%- if not has_value(s) -%}
            {#- De webhook vuurt bij elke PreCom-wijziging, maar na een verse
                installatie kan die sensor nog leeg zijn. Dan de REST-sensor,
                die elke vijf minuten ververst. -#}
            {%- set ploeg = states('input_select.brandweer_dienstdoende_ploeg') -%}
            {%- set letter = ploeg[0] | lower -%}
            {%- set aantal = states('sensor.bezetting_ploeg_' ~ letter) -%}
            {%- if aantal not in ['unknown', 'unavailable'] -%}
              Er staan {{ aantal }} man op bij de {{ ploeg }}. Meer weet ik nog niet,
              er is sinds de herstart geen bezettingsmelding binnengekomen.{{ mijn }}
            {%- else -%}
              Ik heb nog geen bezetting binnengekregen.
            {%- endif -%}
          {%- else -%}
            {%- set type = states(s) -%}
            {%- set ploeg = state_attr(s, 'ploeg') -%}
            {%- set aantal = state_attr(s, 'aantal') | int(0) -%}
            {%- set tekort = state_attr(s, 'tekort') | int(0) -%}
            {%- set kort = (state_attr(s, 'samenvatting') or '') | replace(' · ', ', ') -%}
            {%- if type == 'onderbezet' -%}
              De {{ ploeg }}-ploeg is onderbezet: {{ aantal }} man, {{ tekort }}
              {{ 'persoon' if tekort == 1 else 'personen' }} tekort. {{ kort }}.{{ mijn }}
            {%- elif type == 'krap' -%}
              De {{ ploeg }}-ploeg staat krap met {{ aantal }} man. {{ kort }}.{{ mijn }}
            {%- else -%}
              De {{ ploeg }}-ploeg is op orde met {{ aantal }} man.{{ mijn }}
            {%- endif -%}
          {%- endif -%}

    #########################################################################
    ## Stroom
    #########################################################################
    StroomprijsNu:
      description: Wat kost de stroom nu, en wordt het beter of slechter.
      speech:
        text: >-
          {%- set p = states('sensor.slimhuys_zonneplan_huidige_prijs') | float(none) -%}
          {%- set nu = states('sensor.slimhuys_zonneplan_tariefniveau_nu') -%}
          {%- set straks = states('sensor.stroomprijs_niveau_volgend_uur') -%}
          {%- if p is none -%}
            Ik krijg de stroomprijs even niet binnen.
          {%- else -%}
            {%- set cent = (p * 100) | round(1) | string | replace('.', ',') -%}
            {#- Vijf niveaus (very_low tot very_high), dus testen op het woord
                'low' en niet op de hele waarde: komt er ooit een zesde bij,
                dan blijft dit kloppen. Zie packages/9 - Other/Stroomprijs.yaml. -#}
            {%- set goedkoop = 'low' in nu -%}
            {%- set duur = 'high' in nu -%}
            {{ cent }} cent per kilowattuur, dat is
            {{ 'goedkoop' if goedkoop else ('duur' if duur else 'gemiddeld') }}.
            {#- De sensor van het volgende uur kent bewust maar drie standen. -#}
            {%- if straks == 'low' and not goedkoop %} Het volgende uur is goedkoper.
            {%- elif straks == 'high' and not duur %} Het volgende uur wordt duurder.
            {%- endif -%}
          {%- endif -%}

    #########################################################################
    ## Energie
    #########################################################################
    ThuisAccu:
      description: Hoe vol de Marstek-thuisaccu is en of hij laadt of levert.
      speech:
        text: >-
          {%- set soc = states('sensor.lilygo_rs485_marstek_battery_state_of_charge') | float(none) -%}
          {%- if soc is none -%}
            Ik kan de thuisaccu even niet lezen.
          {%- else -%}
            {#- Zelfde logica als de accu-app op de klokken (Klokken.yaml): de
                inverter-state is leidend, het vermogen is de terugval met een
                dode zone van 20 W. Positief vermogen = laden.
                float(none) en niet float(0): een weggevallen vermogenssensor
                is "weet ik niet", geen 0 W - anders zegt de stem "laadt met
                0 watt" zodra de inverter-state Charge meldt. Het wattage
                wordt dan gewoon weggelaten. -#}
            {%- set pw = states('sensor.lilygo_rs485_marstek_battery_power') | float(none) -%}
            {%- set inv = states('sensor.lilygo_rs485_marstek_inverter_state') -%}
            {%- set laadt = inv == 'Charge' or (inv not in ['Charge', 'Discharge'] and pw is not none and pw > 20) -%}
            {%- set ontlaadt = inv == 'Discharge' or (inv not in ['Charge', 'Discharge'] and pw is not none and pw < -20) -%}
            De thuisaccu zit op {{ soc | round(0) | int }} procent
            {%- if laadt %} en laadt{% if pw is not none %} met {{ pw | abs | round(0) | int }} watt{% endif %}
            {%- elif ontlaadt %} en levert{% if pw is not none %} {{ pw | abs | round(0) | int }} watt{% endif %} aan het huis
            {%- endif %}.
          {%- endif -%}

    Zonnepanelen:
      description: Wat de zonnepanelen nu leveren en wat er vandaag al op de teller staat.
      speech:
        text: >-
          {%- set nu = states('sensor.solar_power_generated_now') | float(none) -%}
          {%- set vandaag = states('sensor.solar_power_generated_today') | float(none) -%}
          {%- if nu is none and vandaag is none -%}
            Ik kan de zonnepanelen even niet lezen.
          {%- else -%}
            {%- if nu is not none -%}
              {#- Plafond uit de capacity-sensoren (kW), net als de
                  productietegel op het overzicht; terugval 5+3 als een
                  omvormer even weg is. In de praktijk komt dit nooit op 100%:
                  de sets pieken op verschillende momenten. -#}
              {%- set cap = (states('sensor.inverter_kroon_18_achtertuin_capacity') | float(5))
                          + (states('sensor.inverter_kroon_18_zolder_capacity') | float(3)) -%}
              {#- De `| max` met 1: float(5)/float(3) vangt alleen een
                  niet-numerieke sensor op; meldt een omvormer numeriek 0,
                  dan zou dit delen door nul zijn en faalt de hele
                  spraakreactie. Zelfde guard als in Klokken.yaml. -#}
              {%- set pct = (nu / ([cap * 1000, 1] | max) * 100) | round(0) | int -%}
              {%- if nu >= 1000 -%}
                De panelen leveren nu {{ (nu / 1000) | round(1) | string | replace('.', ',') }} kilowatt, {{ pct }} procent van wat ze kunnen.
              {%- else -%}
                De panelen leveren nu {{ nu | round(0) | int }} watt, {{ pct }} procent van wat ze kunnen.
              {%- endif -%}
            {%- endif -%}
            {%- if vandaag is not none %} Vandaag staat de teller op {{ vandaag | round(1) | string | replace('.', ',') }} kilowattuur.
            {%- endif -%}
          {%- endif -%}

    #########################################################################
    ## Auto
    #########################################################################
    AutoStatus:
      description: Hoe vol de Mégane is, hoe ver je daarmee komt en of hij laadt.
      speech:
        text: >-
          {%- set soc = states('sensor.hrh85f_batterij') | float(none) -%}
          {%- if soc is none -%}
            Ik krijg de auto even niet te pakken.
          {%- else -%}
            {%- set km = states('sensor.hrh85f_battery_autonomy') | float(none) -%}
            De auto zit op {{ soc | round(0) | int }} procent
            {%- if km is not none %}, goed voor zo'n {{ km | round(0) | int }} kilometer{% endif %}.
            {%- if is_state('binary_sensor.hrh85f_opladen', 'on') -%}
              {%- set rest = states('sensor.hrh85f_charging_remaining_time') | float(none) -%}
              {%- if rest is not none and rest >= 120 %} Hij is aan het laden, nog ongeveer {{ (rest / 60) | round(0) | int }} uur.
              {%- elif rest is not none and rest > 0 %} Hij is aan het laden, nog ongeveer {{ rest | round(0) | int }} minuten.
              {%- else %} Hij is aan het laden.
              {%- endif -%}
            {%- elif is_state('binary_sensor.hrh85f_stekker', 'on') %} De stekker zit erin maar hij laadt op dit moment niet.
            {%- endif -%}
          {%- endif -%}

    ReistijdWerk:
      description: Reistijd naar het werk volgens Waze.
      speech:
        text: >-
          {%- set m = states('sensor.robin_reistijd_naar_werk') | float(none) -%}
          {%- if m is none -%}
            Ik kan de reistijd even niet ophalen.
          {%- else -%}
            Naar het werk is het nu {{ m | round(0) | int }} minuten rijden.
          {%- endif -%}

    #########################################################################
    ## Gezin
    #########################################################################
    WieThuis:
      description: Wie er volgens de trackers thuis is en wie niet.
      speech:
        text: >-
          {#- De leden komen uit de groepen, niet als losse entity-id's: de
              kinderen staan als !secret in Persons.yaml en horen hier dus ook
              niet met naam en toenaam te staan. Voornaam = eerste woord van de
              friendly name. -#}
          {%- set leden = (state_attr('group.all_adults', 'entity_id') or [])
                        + (state_attr('group.all_children', 'entity_id') or []) -%}
          {%- if leden | count == 0 -%}
            Ik kan de gezinsleden even niet lezen.
          {%- else -%}
            {%- set ns = namespace(thuis=[], weg=[]) -%}
            {%- for p in leden -%}
              {%- set naam = ((state_attr(p, 'friendly_name') or p.split('.') | last).split(' ')) | first -%}
              {%- if states(p) == 'home' -%}
                {%- set ns.thuis = ns.thuis + [naam] -%}
              {%- else -%}
                {%- set ns.weg = ns.weg + [naam] -%}
              {%- endif -%}
            {%- endfor -%}
            {%- if ns.weg | count == 0 -%}
              Iedereen is thuis.
            {%- elif ns.thuis | count == 0 -%}
              Volgens de trackers is er niemand thuis.
            {%- else -%}
              {%- if ns.thuis | count == 1 -%}
                {{ ns.thuis | first }} is thuis;
              {%- else -%}
                {{ ns.thuis[:-1] | join(', ') }} en {{ ns.thuis | last }} zijn thuis;
              {%- endif -%}
              {%- if ns.weg | count == 1 %} {{ ns.weg | first }} niet.
              {%- else %} {{ ns.weg[:-1] | join(', ') }} en {{ ns.weg | last }} niet.
              {%- endif -%}
            {%- endif -%}
          {%- endif -%}

    #########################################################################
    ## Afval
    #########################################################################
    Afval:
      description: Welke bak er vandaag of morgen aan de straat moet.
      speech:
        text: >-
          {%- set vandaag = states('sensor.afvalinfo_home_trash_type_today') -%}
          {%- set morgen = states('sensor.afvalinfo_home_trash_type_tomorrow') -%}
          {%- if vandaag in ['unknown', 'unavailable'] and morgen in ['unknown', 'unavailable'] -%}
            Ik kan de afvalkalender even niet lezen.
          {%- else -%}
            {#- 'geen' is de echte sensorwaarde voor een dag zonder ophaling,
                zie ook de afvalcheck in Clock Display.yaml. -#}
            {%- set v = vandaag not in ['unknown', 'unavailable', 'geen', ''] -%}
            {%- set m = morgen not in ['unknown', 'unavailable', 'geen', ''] -%}
            {%- if v and m -%}
              Vandaag wordt {{ vandaag | lower }} opgehaald, en morgen {{ morgen | lower }}.
            {%- elif v -%}
              Vandaag wordt {{ vandaag | lower }} opgehaald.
            {%- elif m -%}
              Morgen wordt {{ morgen | lower }} opgehaald; die bak kan vanavond aan de straat.
            {%- else -%}
              Er hoeft geen bak aan de straat, vandaag en morgen wordt er niets opgehaald.
            {%- endif -%}
          {%- endif -%}

    #########################################################################
    ## Zonwering
    #########################################################################
    ZonneschermAdvies:
      description: Wat vindt de klimaatregie op dit moment van het zonnescherm.
      speech:
        text: >-
          {%- set s = 'sensor.zonwering_advies_zonnescherm' -%}
          {%- set c = 'cover.achtertuin_zonnescherm' -%}
          {%- if not has_value(s) -%}
            Ik kan het zonweringsadvies even niet lezen.
          {%- else -%}
            {#- Omgekeerde cover: HA-stand `open` is het scherm uitgeschoven.
                Advies 'dicht' betekent zonwering dicht, dus scherm eruit. -#}
            {%- set uit = is_state(c, 'open') -%}
            {%- set wil_uit = states(s) == 'dicht' -%}
            {%- set reden = state_attr(s, 'reden') or '' -%}
            {%- set blokkade = state_attr(s, 'blokkade') or '' -%}
            Het scherm staat {{ 'uit' if uit else 'ingetrokken' }}.
            {%- if wil_uit and not uit %} {{ reden | capitalize }}, dus het mag eruit.
              {%- if blokkade %} Alleen: {{ blokkade }}.{% endif %}
              {%- if not blokkade %} Zeg "zet het zonnescherm uit" als je wil.{% endif %}
            {%- elif not wil_uit and uit %} {{ reden | capitalize }}, het mag terug naar binnen.
            {%- else %} {{ reden | capitalize }}.
            {%- endif -%}
          {%- endif -%}

    ZonneschermUit:
      description: Schuift het zonnescherm uit (HA-stand open).
      action:
        - action: cover.open_cover
          target:
            entity_id: cover.achtertuin_zonnescherm
          continue_on_error: true
      speech:
        text: >-
          {%- set s = 'sensor.zonwering_advies_zonnescherm' -%}
          {%- set reden = state_attr(s, 'reden') or '' -%}
          {#- Uitvoeren doen we altijd: wie het vraagt staat in de tuin en ziet
              meer dan de sensoren. Maar wél zeggen wat de regie ervan vindt.
              Het scherm blijft daarna met rust: "Klimaat - Handbediening
              herkennen" ziet binnen anderhalve minuut dat het ergens anders
              staat dan geadviseerd en start de override zelf. -#}
          Het scherm gaat eruit.
          {%- if states(s) == 'open' %} Let op: {{ reden }}.{% endif -%}

    ZonneschermIn:
      description: Trekt het zonnescherm in (HA-stand closed).
      action:
        - action: cover.close_cover
          target:
            entity_id: cover.achtertuin_zonnescherm
          continue_on_error: true
      speech:
        text: "Ik haal het zonnescherm binnen."

    #########################################################################
    ## Het huis
    #########################################################################
    HuisOpen:
      description: Staat er nog een raam of deur open.
      speech:
        text: >-
          {%- set kamers = state_attr('sensor.kamers', 'kamers') or [] -%}
          {%- if kamers | count == 0 -%}
            Ik kan de kamerstatus even niet lezen.
          {%- else -%}
            {%- set ns = namespace(namen=[]) -%}
            {%- for k in kamers if k.contacten.open > 0 -%}
              {%- set ns.namen = ns.namen + k.contacten.namen -%}
            {%- endfor -%}
            {%- if ns.namen | count == 0 -%}
              Alles is dicht.
            {%- elif ns.namen | count == 1 -%}
              Er staat er één open: {{ ns.namen | first }}.
            {%- else -%}
              Er staan er {{ ns.namen | count }} open:
              {{ ns.namen[:-1] | join(', ') }} en {{ ns.namen | last }}.
            {%- endif -%}
          {%- endif -%}

    HuisAandacht:
      description: Welke ruimtes vragen aandacht (te warm, CO2, vocht).
      speech:
        text: >-
          {%- set kamers = state_attr('sensor.kamers', 'kamers') or [] -%}
          {%- if kamers | count == 0 -%}
            Ik kan de kamerstatus even niet lezen.
          {%- else -%}
            {#- Score 2 is 'slecht', 1 is 'let op'. Alleen de ergste drie
                noemen: een opsomming van zeven kamers onthoudt niemand. -#}
            {%- set let_op = kamers | selectattr('score', 'ge', 1)
                             | sort(attribute='score', reverse=true) | list -%}
            {%- if let_op | count == 0 -%}
              Alles staat goed.
            {%- else -%}
              {%- set ns = namespace(regels=[]) -%}
              {%- for k in let_op[:3] -%}
                {%- set ns.regels = ns.regels + [k.naam ~ ': ' ~ k.reden] -%}
              {%- endfor -%}
              {{ ns.regels | join('. ') }}.
              {%- if let_op | count > 3 %} En nog {{ let_op | count - 3 }} andere.{% endif -%}
            {%- endif -%}
          {%- endif -%}

    LichtenUit:
      description: Doet de lichten beneden en op de overloop uit.
      action:
        # Dezelfde lampgroepen als "Lights - Auto turn off all" in
        # packages/9 - Other/Lights.yaml. Staat daar een groep bij, dan hoort
        # hij hier ook: dit is de handmatige versie van dezelfde ronde.
        - action: light.turn_off
          target:
            entity_id:
              - light.woonkamer_lampen
              - light.garage_lampen
              - light.speelkamer_lampen
              - light.keuken_lampen
              - light.eettafel_lampen
              - light.entree_lampen
              - light.toilet_lampen
              - light.trapkast_lampen
              - light.overloop_lampen
              - light.overloop_zolder_lampen
          continue_on_error: true
      speech:
        text: "Doe ik, de lichten gaan uit."

    #########################################################################
    ## Acties: het huis iets laten DOEN
    #########################################################################
    # De intents hierboven lezen alleen af; deze groep grijpt in. Twee regels
    # die voor alle drie gelden:
    #
    # 1. Alleen de veilige kant kan met de stem. Het alarm kan wél aan en
    #    NIET uit: een gesproken commando is niet te onderscheiden van iemand
    #    die door de brievenbus roept, en een satelliet hoort ook wat er op tv
    #    gebeurt. Uitzetten blijft aan het slot, de app en de code.
    # 2. Elke actie zegt wat er is gebeurd, ook als er niets gebeurde. Een
    #    stille satelliet laat je in het ongewisse of hij je verstond.
    RoutineAvond:
      description: Start de avondroutine, hetzelfde als de knop naast het bed.
      action:
        # Via het event en niet via de losse acties: de router in
        # packages/1 - First Floor/Bedroom/Buttons.yaml is sinds 2026-08-06 de
        # enige plek waar staat wat een routine inhoudt. Elf abonnees luisteren
        # hierop, dus dit blijft vanzelf gelijk aan de knop.
        - event: huis_routine
          event_data:
            routine: avond
      speech:
        text: "Welterusten. Ik doe het huis op slot en de lichten uit."

    RoutineOchtend:
      description: Start de ochtendroutine, hetzelfde als de knop naast het bed.
      action:
        - event: huis_routine
          event_data:
            routine: ochtend
      speech:
        text: "Goedemorgen. Ik zet het huis aan."

    AutoAirco:
      description: Start de airco van de auto alvast.
      action:
        - if:
            # De auto weigert zelf onder een drempel (live 8%) en meldt dat
            # nergens terug; dan zou de stem "doe ik" zeggen en gebeurt er
            # niets. De drempel komt van de auto zelf, niet uit een eigen
            # getal, zodat Renault hem mag verzetten.
            - condition: template
              value_template: >-
                {{ (states('sensor.hrh85f_batterij') | float(0))
                   > (states('sensor.hrh85f_hvac_soc_threshold') | float(20)) }}
          then:
            - action: button.press
              target:
                entity_id: button.hrh85f_start_air_conditioner
              continue_on_error: true
      speech:
        text: >-
          {%- set soc = states('sensor.hrh85f_batterij') | float(none) -%}
          {%- set drempel = states('sensor.hrh85f_hvac_soc_threshold') | float(20) -%}
          {%- if soc is none -%}
            Ik krijg de auto even niet te pakken.
          {%- elif soc > drempel -%}
            Doe ik, de airco van de auto start.
            {%- if not is_state('binary_sensor.hrh85f_stekker', 'on') %} Let op: de stekker zit er niet in, dus dit gaat van de accu.{% endif -%}
          {%- else -%}
            De auto staat op {{ soc | round(0) | int }} procent en start de airco
            pas boven {{ drempel | round(0) | int }} procent.
          {%- endif -%}

    AlarmAan:
      description: Zet het alarm aan; thuis of afwezig op basis van wie er is.
      action:
        - if:
            - condition: template
              value_template: "{{ not is_state('alarm_control_panel.alarmo', 'disarmed') }}"
          then: []
          else:
            # `force: true` omzeilt openstaande sensoren niet stilletjes: wat
            # er omzeild is meldt `alarm_bypassed_sensors_notify` in
            # Hallway/Alarm.yaml, en lukt het armen helemaal niet dan komt
            # `alarm_failed_to_arm_notify` erachteraan. Zelfde stand als de
            # welterusten-knop gebruikt.
            - action: alarmo.arm
              data:
                mode: >-
                  {{ 'home' if is_state('group.all_adults', 'home') else 'away' }}
                skip_delay: true
                force: true
                entity_id: alarm_control_panel.alarmo
      speech:
        text: >-
          {%- set stand = states('alarm_control_panel.alarmo') -%}
          {%- if stand in ['unknown', 'unavailable'] -%}
            Ik kan het alarm even niet bereiken.
          {%- elif stand != 'disarmed' -%}
            Het alarm staat al aan.
          {%- elif is_state('group.all_adults', 'home') -%}
            Doe ik, het alarm gaat op thuis.
          {%- else -%}
            Doe ik, het alarm gaat op afwezig.
          {%- endif -%}

    #########################################################################
    ## Antwoorden op een vraag die het huis zelf gesteld heeft
    #########################################################################
    # Waarom de tekst uit `action` komt en niet uit de state: `speech` wordt
    # gerenderd NA `action`, en die heeft de openstaande vraag dan net
    # opgeruimd. De variabelen worden daarom vóór het opruimen vastgelegd en
    # als antwoord teruggegeven. Kent deze Home Assistant `action_response`
    # niet, dan valt de zin terug op "Oké" - nooit op een fout.
    AntwoordJa:
      description: Bevestigt de vraag die het huis zelf gesteld heeft.
      action:
        - variables:
            vraag: "{{ states('input_text.spraak_openstaande_vraag') }}"
            staat_open: >-
              {{ states('input_text.spraak_openstaande_vraag')
                 not in ['', 'unknown', 'unavailable']
                 and is_state('timer.spraak_antwoordvenster', 'active') }}
        - if:
            - condition: template
              value_template: "{{ staat_open }}"
          then:
            - event: spraak_antwoord
              event_data:
                vraag: "{{ vraag }}"
                antwoord: ja
            - action: script.spraak_vraag_sluiten
        - variables:
            resultaat:
              tekst: >-
                {%- set bevestiging = {
                      'zonnescherm': 'Doe ik, het zonnescherm gaat eruit.'
                    } -%}
                {{ bevestiging.get(vraag, 'Doe ik.') if staat_open
                   else 'Er staat op dit moment geen vraag open.' }}
        - stop: "Antwoord verwerkt"
          response_variable: resultaat
      speech:
        text: "{{ action_response.tekst if action_response is defined else 'Oké.' }}"

    AntwoordNee:
      description: Wijst de vraag af die het huis zelf gesteld heeft.
      action:
        - variables:
            vraag: "{{ states('input_text.spraak_openstaande_vraag') }}"
            staat_open: >-
              {{ states('input_text.spraak_openstaande_vraag')
                 not in ['', 'unknown', 'unavailable']
                 and is_state('timer.spraak_antwoordvenster', 'active') }}
        - if:
            - condition: template
              value_template: "{{ staat_open }}"
          then:
            - event: spraak_antwoord
              event_data:
                vraag: "{{ vraag }}"
                antwoord: nee
            - action: script.spraak_vraag_sluiten
        - variables:
            resultaat:
              tekst: >-
                {%- set afwijzing = {
                      'zonnescherm': 'Goed, dan laat ik het scherm een paar uur met rust.'
                    } -%}
                {{ afwijzing.get(vraag, 'Goed, dan doe ik niks.') if staat_open
                   else 'Er staat op dit moment geen vraag open.' }}
        - stop: "Antwoord verwerkt"
          response_variable: resultaat
      speech:
        text: "{{ action_response.tekst if action_response is defined else 'Oké.' }}"

  automation:
    ###########################################################################
    ## Een vraag die niemand beantwoordt, blijft niet openstaan
    ###########################################################################
    # De timer loopt af (of wordt door `spraak_vraag_sluiten` gestopt) en komt
    # dan op `idle`. Dat is het moment om de vraag te vergeten, zodat een "ja"
    # van een uur later nergens meer op slaat.
    - id: spraak_vraag_opruimen
      alias: Spraak - Openstaande vraag opruimen
      description: Vergeet de openstaande vraag zodra het antwoordvenster dicht is.
      mode: single
      triggers:
        - trigger: state
          entity_id: timer.spraak_antwoordvenster
          to: idle
      conditions:
        - condition: template
          value_template: "{{ states('input_text.spraak_openstaande_vraag') != '' }}"
      actions:
        - action: input_text.set_value
          target:
            entity_id: input_text.spraak_openstaande_vraag
          data:
            value: ""
