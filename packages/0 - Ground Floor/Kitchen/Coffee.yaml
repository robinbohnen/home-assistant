coffee_package:

  input_boolean:
    # "Geen koffie meer vandaag." Gaat vanzelf aan als je de machine met de
    # hand uitzet en vervalt om 07:00 of zodra je hem weer aanzet; zie de
    # toelichting bij `turn_on_coffee_machine`. Los te bedienen vanaf het
    # dashboard, zodat je hem ook vooraf kunt zetten.
    koffie_pauze:
      name: "Koffie - Geen koffie meer vandaag"
      icon: mdi:coffee-off-outline

  input_datetime:
    coffee_backflush_date:
      name: "Kitchen Coffee - Backflush Date"
      has_date: true
      icon: mdi:calendar

  timer:
    coffee_shottimer:
      name: Kitchen Coffee - Shottimer
      duration: 33
      icon: mdi:coffee-to-go

  automation:
    ###########################################################################
    ## DE MACHINE HOORT AAN TE STAAN ALS ER KOFFIE GEDRONKEN KAN WORDEN
    ##
    ## De regel is simpel: tussen 07:00 en 19:00 met minstens één volwassene
    ## thuis staat hij aan, daarbuiten uit. `group.all_adults` is `home` zodra
    ## er één thuis is, dus die ene conditie dekt zowel "iemand is er" als
    ## "iedereen is weg".
    ##
    ## WAAROM DE `ging_uit`-TRIGGER BESTAAT
    ## De machine zet zichzelf na verloop van tijd uit (zijn eigen auto-aan/uit-
    ## schema, `switch.linea_micra_kroon_18_auto_on_off_klpggoz`). Binnen het
    ## venster zetten we hem dan gewoon weer aan.
    ##
    ## EN HOE JE HEM DAN ALSNOG UIT KRIJGT
    ## Precies dát maakte hem eerder onuitzetbaar: elke handmatige uit werd
    ## binnen een seconde teruggedraaid. Het verschil zit in de context van de
    ## statuswissel. Zet jij hem uit via het dashboard, de app of de stem, dan
    ## staat er een `user_id` bij; doet de machine het zelf, dan niet. Bij een
    ## menselijke uit gaat `input_boolean.koffie_pauze` aan en blijft hij uit.
    ## Zet je hem met de hand weer aan, dan vervalt de pauze meteen - "uit" is
    ## dus "geen koffie meer" en "aan" is "toch weer koffie".
    ##
    ## De pauze vervalt sowieso om 07:00, anders zou één keer uitzetten alle
    ## volgende ochtenden meenemen.
    ##
    ## LET OP: de knop op de machine zelf geeft géén user_id (die wissel komt
    ## via de integratie binnen en is niet te onderscheiden van de automatische
    ## uitschakeling). Zet hem dus uit via het dashboard of de pauzeschakelaar,
    ## niet op het apparaat, anders staat hij zo weer aan.
    ###########################################################################
    - id: turn_on_coffee_machine
      alias: Kitchen - Coffee
      description: >-
        Zet de koffiemachine aan tussen 07:00 en 19:00 zolang er een volwassene
        thuis is, zet hem uit om 19:00 en als iedereen weg is, en respecteert
        een handmatige uitschakeling via input_boolean.koffie_pauze.
      # queued en niet single: de triggers kunnen elkaar in dezelfde seconde
      # raken (iedereen weg -> wij zetten uit -> dat is zelf weer een trigger)
      # en dan mag er geen run wegvallen.
      mode: queued
      max: 10
      max_exceeded: silent
      triggers:
        - trigger: time
          at: "07:00:00"
          id: ochtend
        - trigger: time
          at: "19:00:00"
          id: avond
        # De groep is `home` zodra er één volwassene thuis is.
        - trigger: state
          entity_id: group.all_adults
          to: home
          not_from:
            - unknown
            - unavailable
          id: iemand_thuis
        - trigger: state
          entity_id: group.all_adults
          to: not_home
          not_from:
            - unknown
            - unavailable
          id: iedereen_weg
        # Het alarm op afwezig is een snellere "iedereen is weg" dan de groep:
        # person.robin_bohnen hangt ook aan de router-tracker en die blijft na
        # vertrek nog 7 tot 12 minuten `home` melden. Alarmo gaat alleen op
        # away als er niemand in zone.home is, dus dit kan niet afgaan terwijl
        # er nog iemand thuis koffie staat te zetten.
        - trigger: state
          entity_id: alarm_control_panel.alarmo
          to: armed_away
          not_from:
            - unknown
            - unavailable
          id: iedereen_weg
        - trigger: state
          entity_id: switch.linea_micra_kroon_18
          to: "off"
          not_from:
            - unknown
            - unavailable
          id: ging_uit
        - trigger: state
          entity_id: switch.linea_micra_kroon_18
          to: "on"
          not_from:
            - unknown
            - unavailable
          id: ging_aan
        - trigger: state
          entity_id: input_boolean.koffie_pauze
          to: "on"
          id: pauze_aan
        - trigger: state
          entity_id: input_boolean.koffie_pauze
          to: "off"
          id: pauze_af
      conditions: []
      actions:
        # Een nieuwe dag begint zonder pauze van gisteren.
        - if:
            - condition: trigger
              id: ochtend
          then:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.koffie_pauze

        - variables:
            # Heeft een mens deze wissel veroorzaakt? Een service-call vanuit
            # een automatisering of een update van de integratie heeft geen
            # user_id; het dashboard, de app en de spraakassistent wel.
            door_mens: >-
              {{ trigger.to_state is defined
                 and trigger.to_state.context.user_id is not none }}
            # Het venster waarin er koffie gedronken wordt.
            koffietijd: >-
              {{ today_at('07:00') <= now() < today_at('19:00')
                 and is_state('group.all_adults', 'home') }}

        - choose:
            # Met de hand uitgezet = geen koffie meer. De pauze houdt de
            # aan-tak hieronder tegen tot je hem weer aanzet of tot 07:00.
            - alias: Handmatig uitgezet, dus laat hem uit
              conditions:
                - condition: trigger
                  id: ging_uit
                - condition: template
                  value_template: "{{ door_mens }}"
                # Zet jij de pauze zelf aan, dan zet de tak onderaan de machine
                # uit - en die uitschakeling erft jouw user_id, dus zonder deze
                # regel zou hij hier binnenlopen en de pauze nog eens aanzetten
                # met een tweede logboekregel erbij.
                - condition: state
                  entity_id: input_boolean.koffie_pauze
                  state: "off"
              sequence:
                - action: input_boolean.turn_on
                  target:
                    entity_id: input_boolean.koffie_pauze
                - action: logbook.log
                  data:
                    name: Koffiemachine
                    message: >-
                      Met de hand uitgezet; blijft uit tot je hem weer aanzet
                      of tot morgenochtend 07:00.

            # Met de hand aangezet = toch weer koffie.
            - alias: Handmatig aangezet, dus pauze vervalt
              conditions:
                - condition: trigger
                  id: ging_aan
                - condition: template
                  value_template: "{{ door_mens }}"
                - condition: state
                  entity_id: input_boolean.koffie_pauze
                  state: "on"
              sequence:
                - action: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.koffie_pauze

            - alias: Aanzetten binnen het koffievenster
              conditions:
                - condition: trigger
                  id:
                    - ochtend
                    - iemand_thuis
                    - ging_uit
                    - pauze_af
                - condition: template
                  value_template: "{{ koffietijd }}"
                - condition: state
                  entity_id: input_boolean.koffie_pauze
                  state: "off"
                - condition: state
                  entity_id: switch.linea_micra_kroon_18
                  state: "off"
              sequence:
                - action: switch.turn_on
                  target:
                    entity_id: switch.linea_micra_kroon_18

            - alias: Uitzetten na negenen, als iedereen weg is of op pauze
              conditions:
                - condition: trigger
                  id:
                    - avond
                    - iedereen_weg
                    - pauze_aan
                - condition: state
                  entity_id: switch.linea_micra_kroon_18
                  state: "on"
              sequence:
                - action: switch.turn_off
                  target:
                    entity_id: switch.linea_micra_kroon_18

    - id: backflush_coffee
      alias: Kitchen - Coffee Backflushed
      description: "Set the new backflush date when backflush is active on coffee machine"
      triggers:
        - trigger: state
          entity_id:
            - binary_sensor.linea_micra_kroon_18_backflush_active
          to: "on"
      conditions: []
      actions:
        - action: input_datetime.set_datetime
          metadata: {}
          data:
            datetime: "{{ (now() + timedelta(days=14)).strftime('%Y-%m-%d %H:%M:%S') }}"
          target:
            entity_id: input_datetime.coffee_backflush_date

    ###########################################################################
    ## HERINNERING OM 10:30, NIET 'S AVONDS
    ##
    ## Het reinigen is een klusje van vijf minuten, maar 's avonds heeft
    ## niemand er zin meer in en dan blijft het liggen. Om 10:30 is de machine
    ## al warm (hij gaat om 07:00 aan) en is de ochtendkoffie op, dus dan kan
    ## het meteen.
    ##
    ## De datumconditie blijft waar tot er daadwerkelijk gebackflusht is, dus
    ## een dag waarop je niet thuis bent kost hooguit een dag: morgen om 10:30
    ## staat de herinnering er weer.
    ###########################################################################
    - id: backflush_coffee_notification
      alias: Kitchen - Coffee need Backflush Notification
      description: "Send a notification to all parents when coffee machine needs backflush"
      triggers:
        - at: "10:30:00"
          trigger: time
      conditions:
        - condition: template
          value_template: "{{ now() >= states('input_datetime.coffee_backflush_date') | as_datetime | as_local }}"
        - condition: zone
          entity_id: person.robin_bohnen
          zone: zone.home
      actions:
        - data:
            message: "Koffie moet worden gereinigd "
            title: La Marzocco
          action: notify.mobile_devices_adults

    - id: shottimer_coffee
      alias: Kitchen - Coffee Shottimer
      description: "Set the shottimer on the clock in the kitchen"
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - binary_sensor.linea_micra_kroon_18_brewing_active
          to: "on"
      conditions: []
      actions:
        - data:
            topic: clock_1/notify
            payload: >-
              { "icon": 19109, "color":"FFFFFF", "sound": "notify", "repeat": 2,
              "text": "Prebrewing", "stack": false, "scrollSpeed": 75 }
          action: mqtt.publish
        - action: timer.start
          metadata: {}
          data: {}
          target:
            entity_id: timer.coffee_shottimer
        - repeat:
            sequence:
              - delay:
                  hours: 0
                  minutes: 0
                  seconds: 0
                  milliseconds: 500
              - data:
                  topic: clock_1/notify
                  payload: >-
                    { "icon": 19109, "color":"FFFFFF", "repeat": 1, "text": "{{
                    (as_datetime(state_attr('timer.coffee_shottimer', 'finishes_at'))
                    - now()).total_seconds() | timestamp_custom('%S', false) }} s",
                    "stack": false, "scrollSpeed": 75 }
                action: mqtt.publish
            until:
              - condition: template
                value_template: >-
                  {% set f = state_attr('timer.coffee_shottimer', 'finishes_at') %}
                  {{ 'true' if (
                    (f == None) or
                    (states['binary_sensor.linea_micra_kroon_18_brewing_active'].state == "off" ) or
                    (as_datetime(f) - now()).total_seconds() | int <= 0)
                    else 'false'
                  }}
        - data:
            topic: clock_1/notify
            payload: >-
              { "icon": 19109, "color":"FFFFFF", "sound": "notify", "repeat": 2,
              "text": "Klaar", "stack": false, "scrollSpeed": 75 }
          action: mqtt.publish
