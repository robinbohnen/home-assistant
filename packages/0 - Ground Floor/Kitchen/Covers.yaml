kitchen_covers_package:

  cover:
    - platform: group
      unique_id: covers_kitchen_screens
      name: "Covers Kitchen Screens"
      entities:
        - cover.keuken_screen_links
        - cover.keuken_screen_rechts
    - platform: group
      unique_id: covers_kitchen_rollerblinds
      name: Covers Kitchen Rollerblinds
      entities:
        - cover.rollerblind_0001
        - cover.rollerblind_0002

  template:
    ##########################################################################
    ## MAG DIT ROLGORDIJN DICHT?
    ##
    ## Je rolt geen gordijn tegen een openstaand raam aan, dus kijkt elke
    ## sluiter eerst naar het raamcontact. Tot nu toe stond dat overal als
    ## `state: "off"`, en telde een contact op 'unavailable' dus als open.
    ##
    ## Dat is goed bedoeld en precies wat er twee avonden misging. Het contact
    ## van het grote keukenraam is op 10 augustus om 02:06 van het netwerk
    ## gevallen (met een volle batterij: 100%, 3025 mV) en is sindsdien weg. De
    ## sluiters lazen dat als "raam open" en hebben het grote rolgordijn op 10
    ## en 11 augustus geen enkel commando gestuurd; Robin deed het allebei de
    ## avonden met de hand (22:12 en 20:52). Het vangnet in
    ## packages/9 - Other/Covers.yaml kon daar niets aan doen: dat kijkt of een
    ## VERSTUURD commando is aangekomen, en hier werd er nooit een verstuurd.
    ## De inhaaltrigger "sluit alsnog zodra het raam dichtgaat" hielp evenmin,
    ## want een contact dat weg is meldt ook geen dichtgaan meer.
    ##
    ## Vandaar dit onderscheid: een raam dat ZEGT dat het openstaat houdt het
    ## rolgordijn tegen, maar een contact dat al twee uur niets meer zegt weet
    ## het gewoon niet - en dan is een gordijn dat zakt beter dan een gordijn
    ## dat wekenlang blijft hangen. De sluiter meldt het wel, zie `vertrouwd`;
    ## zo blijft een dood contact niet nog eens twee dagen onopgemerkt.
    ##
    ## Twee uur, en niet meteen: na een herstart van Home Assistant komen deze
    ## batterijcontacten pas bij hun eerste melding weer boven water. Let op dat
    ## een herstart `last_changed` ook opnieuw zet - herstart HA binnen twee uur
    ## vóór de sluiting, dan telt een dood contact die avond alsnog als open.
    ##########################################################################
    - binary_sensor:
        - name: keuken_rolgordijn_groot_mag_dicht
          unique_id: keuken_rolgordijn_groot_mag_dicht
          icon: mdi:blinds
          state: >
            {% set r = states.binary_sensor.keuken_raam_groot_contact %}
            {{ r is none
               or r.state == 'off'
               or (r.state in ['unknown', 'unavailable']
                   and (now() - r.last_changed).total_seconds() > 7200) }}
          attributes:
            contact: binary_sensor.keuken_raam_groot_contact
            vertrouwd: >
              {{ states('binary_sensor.keuken_raam_groot_contact')
                 in ['on', 'off'] }}
        - name: keuken_rolgordijn_klein_mag_dicht
          unique_id: keuken_rolgordijn_klein_mag_dicht
          icon: mdi:blinds
          state: >
            {% set r = states.binary_sensor.keuken_raam_klein_contact %}
            {{ r is none
               or r.state == 'off'
               or (r.state in ['unknown', 'unavailable']
                   and (now() - r.last_changed).total_seconds() > 7200) }}
          attributes:
            contact: binary_sensor.keuken_raam_klein_contact
            vertrouwd: >
              {{ states('binary_sensor.keuken_raam_klein_contact')
                 in ['on', 'off'] }}

  automation:
    ##########################################################################
    ## Rolgordijnen dicht voor de avond
    ##
    ## Dit liep alleen op zonsondergang -30 min. In de winter is dat rond 16:00
    ## en prima, maar in juni is het 21:35 - twee uur nadat de kinderen naar bed
    ## zijn, en dit ding is door het hele huis te horen. Hij sluit nu op wat het
    ## eerst komt: die zonsondergang, of het begin van de naar-bed-routine
    ## (`input_datetime.bedtime_*_1h_off`, een uur voor lichten uit).
    ##
    ## Dat tweede tijdstip is hetzelfde als BEDTIJDEN in
    ## custom_templates/klimaat.jinja: vanaf dat moment adviseert de
    ## klimaatregie 'rust' voor deze twee rolgordijnen. Die twee horen gelijk te
    ## blijven. Sloot deze automatisering eerder dan de klimaatregie loslaat,
    ## dan trok de uitvoerder ze een kwartier later weer omhoog en zette hij er
    ## ook nog vier uur handbediening op omdat hij zijn eigen tegenwerking als
    ## handbediening herkent.
    ##
    ## Beide triggers vuren elke dag; wat het laatst komt vindt de rolgordijnen
    ## al dicht en doet dan niets meer.
    ##
    ## Per rolgordijn en niet als groep, want elk raam heeft zijn eigen contact:
    ## je rolt geen gordijn tegen een openstaand raam aan. Hiervoor sloot hij de
    ## groep zonder ergens naar te kijken, terwijl `covers_lock_alarm_events` en
    ## de klimaatregie dat contact wél allebei respecteren. Of een contact het
    ## rolgordijn mag tegenhouden staat sinds 12 augustus 2026 in de twee
    ## `*_mag_dicht`-sensoren bovenaan dit bestand; daar staat ook waarom een
    ## contact dat al uren niets meldt niet meer als "raam open" telt.
    ##
    ## Die raamcheck maakte wel een nieuw gat: beide tijdstriggers zijn mómenten,
    ## dus stond een raam net op dat ene moment open - op precies de warme avond
    ## waarop je de keuken lucht - dan bleef dat rolgordijn de hele nacht omhoog.
    ## `covers_lock_alarm_events` haalt dat niet in, want die kijkt alleen naar
    ## slot- en alarmgebeurtenissen en slaat een open raam net zo goed over.
    ## Daarom sluit hij nu alsnog zodra het raam dichtgaat, mits we op dat moment
    ## in het avond-/nachtvenster zitten.
    ##########################################################################
    - id: kitchen_covers_close
      alias: Kitchen - Covers
      description: >-
        Laat de keukenrolgordijnen zakken voor de avond, op wat het eerst komt:
        het begin van de naar-bed-routine van de kinderen of een half uur voor
        zonsondergang. Een rolgordijn waarvan het raam openstaat blijft omhoog en
        gaat alsnog dicht zodra dat raam gesloten wordt.
      # `queued` en niet `single`: twee ramen die vlak na elkaar dichtgaan zijn
      # twee triggers, en met `single` at de lopende run de tweede op. Dat
      # gebeurde op 17 augustus 2026 (zie de uitleg hierboven): het kleine raam
      # ging vijf seconden na het grote dicht, viel middenin de lopende run, en
      # het kleine rolgordijn bleef de hele nacht omhoog. Ze horen achter elkaar
      # afgehandeld te worden, niet weggegooid.
      mode: queued
      max: 5
      triggers:
        - trigger: sun
          event: sunset
          offset: "-00:30:00"
        - trigger: time
          at:
            - input_datetime.bedtime_maxi_1h_off
            - input_datetime.bedtime_mini_1h_off
        # Op de `*_mag_dicht`-sensoren en NIET op de raamcontacten zelf: de
        # sluiting hieronder beslist op die sensoren, en die lopen anderhalve
        # milliseconde achter op het contact waar ze uit volgen. Trigger je op
        # het contact, dan leest de run de sensor van vóór zijn eigen trigger en
        # doet hij niets - precies wat op 17 augustus 2026 het grote rolgordijn
        # eerst oversloeg (21:10:25,801 contact, 21:10:25,802 sensor) en daarna
        # het kleine helemaal miste (21:10:30,410 het besluit, 21:10:30,412 de
        # sensor). Trigger en besluit staan nu op dezelfde bron.
        #
        # Dit vangt ook het dode contact af: de sensor springt twee uur na de
        # laatste melding vanzelf op 'on', en dan sluit het rolgordijn alsnog
        # zodra we in het venster hieronder zitten.
        #
        # `not_from` expliciet, zodat een sensor die na een herstart uit
        # 'unknown'/'unavailable' komt opborrelen niet als "raam net
        # dichtgedaan" telt.
        - trigger: state
          entity_id:
            - binary_sensor.keuken_rolgordijn_groot_mag_dicht
            - binary_sensor.keuken_rolgordijn_klein_mag_dicht
          to: "on"
          not_from:
            - unknown
            - unavailable
          id: raam_dicht
      conditions:
        # Alleen de raamtrigger heeft een tijdvenster nodig; de twee andere
        # triggers zíjn het moment. Ondergrens is hetzelfde "wat het eerst komt"
        # als hierboven, bovengrens 06:00 zodat een raam dat 's ochtends
        # dichtgaat niet met de ochtendroutine gaat vechten.
        - condition: or
          conditions:
            - condition: not
              conditions:
                - condition: trigger
                  id: raam_dicht
            - condition: template
              value_template: >-
                {% set zon = state_attr('sun.sun', 'next_setting') | as_datetime %}
                {% set voorbij_zon = is_state('sun.sun', 'below_horizon')
                     or (zon is not none and now() > zon - timedelta(minutes=30)) %}
                {% set ns = namespace(voorbij_bed=false) %}
                {% for b in ['input_datetime.bedtime_maxi_1h_off',
                             'input_datetime.bedtime_mini_1h_off' ] %}
                  {% set s = states(b) %}
                  {% if s not in ['unknown', 'unavailable', 'none', '']
                        and now() >= today_at(s) %}
                    {% set ns.voorbij_bed = true %}
                  {% endif %}
                {% endfor %}
                {{ (voorbij_zon or ns.voorbij_bed)
                   and (now().hour >= 12 or now().hour < 6) }}
      variables:
        # De contacten waarop we straks wél sluiten maar die zich niet gemeld
        # hebben. Op automatiseringsniveau, zodat de melding onderaan dezelfde
        # lijst gebruikt als waar de sluiting op leunt.
        dode_contacten: >-
          {% set ns = namespace(l=[]) %}
          {% for s in ['binary_sensor.keuken_rolgordijn_groot_mag_dicht',
                       'binary_sensor.keuken_rolgordijn_klein_mag_dicht'] %}
            {% if is_state(s, 'on')
                  and not (state_attr(s, 'vertrouwd') | bool(true)) %}
              {% set ns.l = ns.l + [state_attr(s, 'contact')] %}
            {% endif %}
          {% endfor %}
          {{ ns.l }}
      actions:
        - if:
            - condition: template
              value_template: >-
                {{ is_state('binary_sensor.keuken_rolgordijn_groot_mag_dicht',
                            'on') }}
            - condition: not
              conditions:
                - condition: state
                  entity_id: cover.rollerblind_0001
                  state: closed
          then:
            # Via `script.cover_zetten_en_nakijken` (packages/9 - Other/
            # Covers.yaml): dit rolgordijn mist het commando af en toe, en dan
            # bleef hij tot nu toe de hele avond omhoog staan. Het script kijkt
            # na of hij het gehoord heeft en stuurt het anders nog een paar keer.
            # Met `script.turn_on`, want zo'n ronde kan twintig minuten duren en
            # het tweede rolgordijn hieronder hoort daar niet op te wachten.
            - action: script.turn_on
              target:
                entity_id: script.cover_zetten_en_nakijken
              data:
                variables:
                  cover: cover.rollerblind_0001
                  doel: 0
        - if:
            - condition: template
              value_template: >-
                {{ is_state('binary_sensor.keuken_rolgordijn_klein_mag_dicht',
                            'on') }}
            - condition: not
              conditions:
                - condition: state
                  entity_id: cover.rollerblind_0002
                  state: closed
          then:
            - action: script.turn_on
              target:
                entity_id: script.cover_zetten_en_nakijken
              data:
                variables:
                  cover: cover.rollerblind_0002
                  doel: 0
        # Sluiten op een contact dat zich niet meldt mag, maar dan hoort er wel
        # iemand naar dat contact te kijken. Vaste tag: hij vervangt zichzelf,
        # dus een dood contact levert geen stapel meldingen op maar wel elke
        # avond weer een herinnering tot het gemaakt is.
        - alias: Melden als we op een stil raamcontact hebben gesloten
          if:
            - condition: template
              value_template: "{{ dode_contacten | count > 0 }}"
          then:
            - action: notify.mobile_devices_robin
              data:
                title: Raamcontact meldt zich niet
                message: >-
                  {{ dode_contacten
                     | map('state_attr', 'friendly_name')
                     | join(' en ') }}
                  is al uren stil. Het rolgordijn is toch gezakt - kijk even of
                  dat raam echt dicht is, en of het contact nog leeft.
                data:
                  tag: raamcontact-stil
                  notification_icon: mdi:window-closed-variant
