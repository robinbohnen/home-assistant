kitchen_clock_display_package:
  automation:
    - id: kitchen_clock_display_onoff
      alias: Kitchen - Clock Turn on/off
      description: "Turn on or off the display in the kitchen"
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - alarm_control_panel.alarmo
          to: disarmed
          id: alarm_off
        - trigger: state
          entity_id:
            - light.woonkamer_lampen
          to: "on"
          id: lights_on
        - trigger: state
          entity_id:
            - alarm_control_panel.alarmo
          to: armed_away
          id: alarm_away
        - trigger: state
          entity_id:
            - alarm_control_panel.alarmo
          to: armed_home
          id: alarm_home
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - alarm_away
                    - alarm_home
              sequence:
                - data:
                    qos: 0
                    retain: false
                    topic: clock_1/power
                    payload: '{"power": false}'
                  action: mqtt.publish
            - conditions:
                - condition: trigger
                  id:
                    - alarm_off
                    - lights_on
              sequence:
                - data:
                    qos: 0
                    retain: false
                    topic: clock_1/power
                    payload: '{"power": true}'
                  action: mqtt.publish
          default:
            - action: light.toggle
              metadata: {}
              data: {}
              target:
                entity_id: light.awtrix_121d6c_matrix

    - id: kitchen_clock_display_partner_home
      alias: Kitchen - Clock Locations Family
      description: "Display message on clock when someone return home"
      mode: single
      triggers:
        - entity_id: person.samantha_henkelman
          zone: zone.home
          event: enter
          trigger: zone
          id: partner
        - trigger: zone
          entity_id: person.robin_bohnen
          zone: zone.home
          event: enter
          id: robin
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - partner
              sequence:
                - data:
                    topic: clock_1/notify
                    payload: >-
                      { "icon": 22078, "color":"FFFFFF", "sound": "notify", "repeat":
                      2, "text": "{{ states['input_text.naam_partner'].state }} komt
                      thuis", "stack": false, "scrollSpeed": 75 }
                  action: mqtt.publish
            - conditions:
                - condition: trigger
                  id:
                    - robin
              sequence:
                - data:
                    topic: clock_1/notify
                    payload: >-
                      { "icon": 22078, "color":"FFFFFF", "sound": "notify", "repeat":
                      2, "text": "Robin komt thuis", "stack": false, "scrollSpeed": 75
                      }
                  action: mqtt.publish

    - id: kitchen_clock_display_traveltime
      alias: Kitchen - Clock Time to Travel Work Robin
      description: "Display the time it takes to travel to the office for Robin"
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - binary_sensor.entree_deur_contact
          to: "on"
      conditions:
        - condition: time
          after: "06:00:00"
          before: "07:00:00"
          weekday:
            - mon
            - tue
            - thu
            - wed
        # Zonder deze check scrolde er "unknown min naar werk" over de klok. Dat
        # is geen theorie: op 2026-08-06 stonden alle zes reistijdsensoren op
        # `unknown` omdat de Routes API voor de Google-sleutel uit staat, en dan
        # zet de klok zichzelf ook nog eens een minuut aan voor niets. Liever
        # niets tonen dan onzin.
        - alias: Er is een echte reistijd bekend
          condition: template
          value_template: >-
            {{ states('sensor.robin_reistijd_naar_werk') | float(-1) >= 0 }}
      actions:
        - data:
            qos: 0
            retain: true
            topic: clock_1/power
            payload: '{"power": true}'
          action: mqtt.publish
        - data:
            qos: 0
            retain: true
            topic: clock_1/notify
            # Afronden is niet cosmetisch: Waze levert gebroken minuten
            # (27.05, 5.083...) waar Google een heel getal gaf. Zonder round
            # scrolt er "27.05 min naar werk" over de klok.
            payload: >-
              {"icon": 1635,"duration": 60, "scrollSpeed": 50, "text": "{{
              states('sensor.robin_reistijd_naar_werk') | float(0) | round(0) | int
              }} min naar werk"}
          action: mqtt.publish
        - delay:
            hours: 0
            minutes: 1
            seconds: 0
            milliseconds: 0
        - data:
            qos: 0
            retain: true
            topic: clock_1/power
            payload: '{"power": false}'
          action: mqtt.publish

    - id: kitchen_clock_display_apps
      alias: Kitchen - Clock Display all Apps
      description: Display apps in rotation with all kinds of useful information
      triggers:
        - seconds: /30
          trigger: time_pattern
      conditions:
        - condition: state
          entity_id: light.awtrix_121d6c_matrix
          state: "on"
      actions:
        - data:
            qos: 0
            retain: true
            topic: clock_1/custom/temperature_living
            # Eerste bron met een waarde wint. Hier stond alleen de oude
            # sensor.woonkamer_temperatuur; toen die stil wegviel bleef de klok
            # op '--' staan zonder dat iets dat meldde. Vandaar de terugval.
            payload: >-
              {%- set ns = namespace(t=none) -%}
              {%- for s in ['sensor.woonkamer_woonkamer_multisensor_temperatuur',
                            'sensor.woonkamer_kamertemperatuur'] -%}
                {%- if ns.t is none and has_value(s) -%}
                  {%- set ns.t = states(s) | float(none) -%}
                {%- endif -%}
              {%- endfor -%}
              {"icon": 7112,"color":"FFFFFF","repeat": 2,"text": "{{
              ns.t | round(1) if ns.t is not none else '--' }}"}
          action: mqtt.publish
          alias: Display temperature
        - data:
            qos: 0
            retain: true
            topic: clock_1/custom/power_usage
            # Groen bij negatief verbruik: dan leveren we terug aan het net.
            payload: >-
              {"icon": 54077,"color":"{{ '32D74B' if
              states('sensor.live_energieverbruik_totaal') | float(0) < 0
              else 'FFFFFF' }}","repeat": 2,"text": "{{
              states('sensor.live_energieverbruik_totaal') | float(0) | round(2)
              if has_value('sensor.live_energieverbruik_totaal') else '--' }}"}
          action: mqtt.publish
          alias: Display power usage
        # ZON EN ACCU STAAN NIET MEER HIER
        # Beide frames zijn met de hand uitgerekende pixels, en de woonkamer-
        # en garageklok tonen exact dezelfde twee apps. Drie kopieen van die
        # wiskunde lopen bij de eerste correctie uit elkaar, dus staat het nu
        # een keer in packages/9 - Other/Klokken.yaml.
        - alias: Display solar overview and home battery
          action: script.klok_zon_en_accu
          data:
            klokken:
              - clock_1
        - data:
            qos: 0
            retain: true
            topic: clock_1/custom/today costs
            # sensor.total_costs_today_calculated (packages/9 - Other/Electricity.yaml)
            # rekent exact dezelfde som al uit, inclusief availability-guard.
            payload: >-
              {"icon": 2147,"color":"{{ '32D74B' if
              states('sensor.total_costs_today_calculated') | float(0) < 0
              else 'FFFFFF' }}","repeat": 2,"text": "€ {{
              '{:.2f}'.format(states('sensor.total_costs_today_calculated') | float(0))
              if has_value('sensor.total_costs_today_calculated') else '--' }}"}
          action: mqtt.publish
          alias: Display total costs today
        - alias: Display spa temperature
          if:
            - condition: state
              entity_id: switch.intex_purespa_power
              state: "on"
          then:
            - alias: Display spa temperature
              data:
                qos: 0
                retain: true
                topic: clock_1/custom/spa_temperature
                payload: >-
                  {"icon": 7097,"color":"FFFFFF","repeat": 2,"text": "{{
                  state_attr('climate.intex_purespa','current_temperature') | float(0) | round(1)
                  if state_attr('climate.intex_purespa','current_temperature') is not none
                  else '--' }}"}
              action: mqtt.publish
          else:
            - data:
                qos: 0
                retain: true
                topic: clock_1/custom/spa_temperature
              action: mqtt.publish
        - if:
            - condition: and
              conditions:
                - condition: state
                  entity_id: media_player.woonkamer_sonos
                  state: playing
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: media_player.woonkamer_sonos
                      attribute: source
                      state: TV
          then:
            - data:
                qos: 0
                retain: true
                topic: clock_1/custom/music
                # to_json quote en escape de titel: nummers met een " of \ erin
                # maakten anders ongeldige JSON, waarna de app stil bleef hangen.
                payload: >-
                  {%- set titel = state_attr('media_player.woonkamer_sonos','media_title') -%}
                  {%- set artiest = state_attr('media_player.woonkamer_sonos','media_artist') -%}
                  {%- set tekst = (titel or 'Muziek') ~ (' - ' ~ artiest if artiest else '') -%}
                  {"icon": 29944,"color":"FFFFFF","repeat": 2, "scrollSpeed": 50,
                  "text": {{ tekst | to_json }}}
              action: mqtt.publish
          else:
            - data:
                qos: 0
                retain: true
                topic: clock_1/custom/music
              action: mqtt.publish
          alias: Display current song
        - if:
            # has_value erbij: anders is "unavailable" ook ongelijk aan "geen"
            # en stond er letterlijk "unavailable" op de klok.
            - condition: template
              value_template: >-
                {{ has_value('sensor.afvalinfo_home_trash_type_today')
                   and states('sensor.afvalinfo_home_trash_type_today') != 'geen' }}
          then:
            - data:
                qos: 0
                retain: false
                topic: clock_1/custom/afval
                payload: >-
                  { "icon": 9399,"color":"FFFFFF", "repeat": 2, "scrollSpeed": 50,
                  "text": {{ states('sensor.afvalinfo_home_trash_type_today') | to_json }} }
              action: mqtt.publish
          else:
            # Lege payload verwijdert de app; "{}" liet een lege app staan.
            - data:
                qos: 0
                retain: false
                topic: clock_1/custom/afval
              action: mqtt.publish
          alias: Display todays trash
        - if:
            - condition: not
              conditions:
                - condition: state
                  entity_id: person.robin_bohnen
                  state: home
          then:
            - data:
                qos: 0
                retain: false
                topic: clock_1/custom/robin
                # Zonder guard werd dit "R: None in None" zodra de geo-sensor geen
                # straat of plaats had; nu vallen we terug op wat wel bekend is.
                payload: >-
                  {%- set straat = state_attr('sensor.robin_bohnen_geo','street') -%}
                  {%- set plaats = state_attr('sensor.robin_bohnen_geo','city') -%}
                  {%- set toestand = states('person.robin_bohnen') -%}
                  {%- if toestand not in ['not_home', 'unavailable', 'unknown'] -%}
                  {%- set waar = toestand -%}
                  {%- elif straat and plaats -%}
                  {%- set waar = straat ~ ' in ' ~ plaats -%}
                  {%- else -%}
                  {%- set waar = plaats or straat or 'onderweg' -%}
                  {%- endif -%}
                  { "icon": 27335,"color":"FFFFFF", "repeat": 2, "scrollSpeed": 50,
                  "text": {{ ('R: ' ~ waar) | to_json }} }
              action: mqtt.publish
          else:
            - data:
                qos: 0
                retain: false
                topic: clock_1/custom/robin
              action: mqtt.publish
          alias: Display location Robin
        - if:
            - condition: not
              conditions:
                - condition: state
                  entity_id: person.samantha_henkelman
                  state: home
          then:
            - data:
                qos: 0
                retain: false
                topic: clock_1/custom/samantha
                payload: >-
                  {%- set straat = state_attr('sensor.samantha_henkelman_geo','street') -%}
                  {%- set plaats = state_attr('sensor.samantha_henkelman_geo','city') -%}
                  {%- set toestand = states('person.samantha_henkelman') -%}
                  {%- if toestand not in ['not_home', 'unavailable', 'unknown'] -%}
                  {%- set waar = toestand -%}
                  {%- elif straat and plaats -%}
                  {%- set waar = straat ~ ' in ' ~ plaats -%}
                  {%- else -%}
                  {%- set waar = plaats or straat or 'onderweg' -%}
                  {%- endif -%}
                  { "icon": 27335,"color":"FFFFFF", "repeat": 2, "scrollSpeed": 50,
                  "text": {{ ('S: ' ~ waar) | to_json }} }
              action: mqtt.publish
          else:
            - data:
                qos: 0
                retain: false
                topic: clock_1/custom/samantha
              action: mqtt.publish
          alias: Display location Partner
        - alias: Display next calendar event
          # Zonder deze guard viel as_timestamp(None) om zodra er geen volgende
          # afspraak was, waardoor de automation afbrak en de BRW-app hieronder
          # niet meer werd bijgewerkt.
          if:
            - condition: template
              value_template: >-
                {{ state_attr('calendar.robin_en_sam', 'start_time') is not none }}
          then:
            - alias: Show next event
              data:
                qos: 0
                retain: true
                topic: clock_1/custom/next_cal_event
                payload: >-
                  {%- set titel = state_attr('calendar.robin_en_sam', 'message') or 'Afspraak' -%}
                  {%- set start = state_attr('calendar.robin_en_sam', 'start_time') | as_datetime | as_local -%}
                  {%- if start.date() == now().date() -%}
                  {%- set dag = 'vandaag' -%}
                  {%- elif start.date() == (now() + timedelta(days=1)).date() -%}
                  {%- set dag = 'morgen' -%}
                  {%- else -%}
                  {%- set dag = start.strftime('%d-%m') -%}
                  {%- endif -%}
                  {%- set tijd = '' if state_attr('calendar.robin_en_sam', 'all_day')
                                 else ' om ' ~ start.strftime('%H:%M') -%}
                  {"icon": 10498,"color":"FFFFFF","repeat": 2, "scrollSpeed": 50,
                  "text": {{ (titel ~ ' - ' ~ dag ~ tijd) | to_json }}}
              action: mqtt.publish
          else:
            - data:
                qos: 0
                retain: true
                topic: clock_1/custom/next_cal_event
              action: mqtt.publish
        - alias: Display BRW occupation
          data:
            qos: 0
            retain: true
            topic: clock_1/custom/brw_occupation
            payload: >-
              {#- DEZELFDE BRON ALS HET DASHBOARD, IN DEZELFDE VOLGORDE
                  Hier stond alleen `sensor.bezetting_ploeg_*`: de poll van
                  112radar, die elke vijf minuten ververst. Het dashboard leest
                  bij voorkeur het `ploegen`-attribuut van de PreCom-webhook, en
                  die twee tellen niet gelijk - op 2026-08-07 zei de klok 3/5/6
                  en het dashboard 2/4/6. Twee schermen die hetzelfde zouden
                  moeten zeggen en dat niet doen is erger dan een getal dat vijf
                  minuten oud is, dus nu overal de webhook eerst en de poll als
                  terugval. Zie dashboards/home/nest_hub.yaml voor dezelfde
                  keuze in JS. -#}
              {%- macro ploeg(letter) -%}
                {%- set w = (state_attr('sensor.brandweer_bezetting', 'ploegen') or [])
                            | selectattr('ploeg', 'eq', letter) | list -%}
                {%- set poll = 'sensor.bezetting_ploeg_' ~ (letter | lower) -%}
                {%- if w | count > 0 and w[0].aantal is defined -%}{{ w[0].aantal }}
                {%- elif has_value(poll) -%}{{ states(poll) }}
                {%- else -%}?{%- endif -%}
              {%- endmacro -%}
              {"icon": 8050,"color":"FFFFFF","repeat": 3, "scrollSpeed": 50,
              "text": {{ ('A Ploeg: ' ~ ploeg('A') | trim ~
              ', B Ploeg: ' ~ ploeg('B') | trim ~
              ', C Ploeg: ' ~ ploeg('C') | trim) | to_json }}}
          action: mqtt.publish
      mode: single

    - id: kitchen_clock_turn_on
      alias: Kitchen - Clock turn on
      description: "Turn on clock when livingroom lights turned on"
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - light.woonkamer_lampen
          to: "on"
          from: "off"
      conditions: []
      actions:
        - action: light.turn_on
          metadata: {}
          data:
            brightness_pct: 50
          target:
            entity_id: light.awtrix_121d6c_matrix

    - id: kitchen_clock_always_on
      alias: Kitchen - Display always on
      description: "Kitchen display keep always on"
      triggers:
        - trigger: state
          entity_id:
            - light.awtrix_121d6c_matrix
          to: "off"
      conditions:
        - condition: state
          entity_id: light.woonkamer_lampen
          state: "on"
      actions:
        - action: light.turn_on
          metadata: {}
          data: {}
          target:
            entity_id: light.awtrix_121d6c_matrix
      mode: single
