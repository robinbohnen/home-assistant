##############################################################################
## AAN EN UIT STAAT NIET MEER IN DIT BESTAND
## Hier stonden drie automatiseringen over de stand van het scherm en die
## spraken elkaar tegen: `Clock Turn on/off` zette de klok uit bij `armed_home`,
## waarna `Display always on` hem meteen weer aanzette zolang de woonkamerlampen
## brandden. Wie won hing af van de volgorde waarin HA ze afwerkte.
##
## Het is nu een regel voor de keuken- en de woonkamerklok samen, in
## packages/9 - Other/Klokken.yaml: aan als het alarm uit staat of als het licht
## in de woonkamer brandt, anders uit. Dat bestand stuurt de matrix-entiteit
## aan; de app-rotatie hieronder kijkt naar diezelfde entiteit en publiceert
## dus vanzelf niets meer zodra het scherm uit is.
##
## Wat hier wel blijft staan is alles wat de keukenklok als enige doet: de
## app-rotatie, de thuiskomst-melding en de reistijd 's ochtends.
##############################################################################

kitchen_clock_display_package:
  automation:
    - id: kitchen_clock_display_partner_home
      alias: Kitchen - Clock Locations Family
      description: "Display message on clock when someone return home"
      mode: single
      triggers:
        - entity_id: person.samantha_henkelman
          zone: zone.home
          event: enter
          trigger: zone
          id: partner
        - trigger: zone
          entity_id: person.robin_bohnen
          zone: zone.home
          event: enter
          id: robin
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - partner
              sequence:
                - data:
                    topic: clock_1/notify
                    payload: >-
                      { "icon": 22078, "color":"FFFFFF", "sound": "notify", "repeat":
                      2, "text": "{{ states['input_text.naam_partner'].state }} komt
                      thuis", "stack": false, "scrollSpeed": 75 }
                  action: mqtt.publish
            - conditions:
                - condition: trigger
                  id:
                    - robin
              sequence:
                - data:
                    topic: clock_1/notify
                    payload: >-
                      { "icon": 22078, "color":"FFFFFF", "sound": "notify", "repeat":
                      2, "text": "Robin komt thuis", "stack": false, "scrollSpeed": 75
                      }
                  action: mqtt.publish

    - id: kitchen_clock_display_traveltime
      alias: Kitchen - Clock Time to Travel Work Robin
      description: "Display the time it takes to travel to the office for Robin"
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - binary_sensor.entree_deur_contact
          to: "on"
      conditions:
        - condition: time
          after: "06:00:00"
          before: "07:00:00"
          weekday:
            - mon
            - tue
            - thu
            - wed
        # Zonder deze check scrolde er "unknown min naar werk" over de klok. Dat
        # is geen theorie: op 2026-08-06 stonden alle zes reistijdsensoren op
        # `unknown` omdat de Routes API voor de Google-sleutel uit staat, en dan
        # zet de klok zichzelf ook nog eens een minuut aan voor niets. Liever
        # niets tonen dan onzin.
        - alias: Er is een echte reistijd bekend
          condition: template
          value_template: >-
            {{ states('sensor.robin_reistijd_naar_werk') | float(-1) >= 0 }}
      actions:
        # RETAIN: FALSE OP `power`, EN MET REDEN
        # De broker bewaart per topic het laatste bericht. Met `retain: true`
        # bleef hier een `{"power": ...}` van vanochtend staan, die de klok bij
        # elke herverbinding opnieuw binnenkreeg - dan hing de stand van het
        # scherm ineens af van het laatste bericht van een reistijd-app in
        # plaats van van de huisregel in packages/9 - Other/Klokken.yaml.
        - data:
            qos: 0
            retain: false
            topic: clock_1/power
            payload: '{"power": true}'
          action: mqtt.publish
        - data:
            qos: 0
            retain: true
            topic: clock_1/notify
            # Afronden is niet cosmetisch: Waze levert gebroken minuten
            # (27.05, 5.083...) waar Google een heel getal gaf. Zonder round
            # scrolt er "27.05 min naar werk" over de klok.
            payload: >-
              {"icon": 1635,"duration": 60, "scrollSpeed": 50, "text": "{{
              states('sensor.robin_reistijd_naar_werk') | float(0) | round(0) | int
              }} min naar werk"}
          action: mqtt.publish
        - delay:
            hours: 0
            minutes: 1
            seconds: 0
            milliseconds: 0
        # Niet blind uit: om half zeven kan het alarm er allang af zijn en de
        # keukenlamp aan staan, en dan hoort dit scherm gewoon te blijven
        # branden. Het script zet hem terug op wat de huisregel zegt.
        - action: script.klok_keuken_woonkamer_stand

    - id: kitchen_clock_display_apps
      alias: Kitchen - Clock Display all Apps
      description: Display apps in rotation with all kinds of useful information
      triggers:
        - seconds: /30
          trigger: time_pattern
      conditions:
        - condition: state
          entity_id: light.keuken_klok_awtrix_keuken_matrix
          state: "on"
      actions:
        - data:
            qos: 0
            retain: true
            topic: clock_1/custom/temperature_living
            # Eerste bron met een waarde wint. Hier stond alleen de oude
            # sensor.woonkamer_temperatuur; toen die stil wegviel bleef de klok
            # op '--' staan zonder dat iets dat meldde. Vandaar de terugval.
            payload: >-
              {%- set ns = namespace(t=none) -%}
              {%- for s in ['sensor.woonkamer_woonkamer_multisensor_temperatuur',
                            'sensor.woonkamer_kamertemperatuur'] -%}
                {%- if ns.t is none and has_value(s) -%}
                  {%- set ns.t = states(s) | float(none) -%}
                {%- endif -%}
              {%- endfor -%}
              {"icon": 7112,"color":"FFFFFF","repeat": 2,"text": "{{
              ns.t | round(1) if ns.t is not none else '--' }}"}
          action: mqtt.publish
          alias: Display temperature
        - data:
            qos: 0
            retain: true
            topic: clock_1/custom/power_usage
            # Groen bij negatief verbruik: dan leveren we terug aan het net.
            payload: >-
              {"icon": 54077,"color":"{{ '32D74B' if
              states('sensor.live_energieverbruik_totaal') | float(0) < 0
              else 'FFFFFF' }}","repeat": 2,"text": "{{
              states('sensor.live_energieverbruik_totaal') | float(0) | round(2)
              if has_value('sensor.live_energieverbruik_totaal') else '--' }}"}
          action: mqtt.publish
          alias: Display power usage
        # ZON EN ACCU STAAN NIET MEER HIER
        # Beide frames zijn met de hand uitgerekende pixels, en de woonkamer-
        # en garageklok tonen exact dezelfde twee apps. Drie kopieen van die
        # wiskunde lopen bij de eerste correctie uit elkaar, dus staat het nu
        # een keer in packages/9 - Other/Klokken.yaml.
        - alias: Display solar overview and home battery
          action: script.klok_zon_en_accu
          data:
            klokken:
              - clock_1
        - data:
            qos: 0
            retain: true
            topic: clock_1/custom/today costs
            # sensor.total_costs_today_calculated (packages/9 - Other/Electricity.yaml)
            # rekent exact dezelfde som al uit, inclusief availability-guard.
            payload: >-
              {"icon": 2147,"color":"{{ '32D74B' if
              states('sensor.total_costs_today_calculated') | float(0) < 0
              else 'FFFFFF' }}","repeat": 2,"text": "€ {{
              '{:.2f}'.format(states('sensor.total_costs_today_calculated') | float(0))
              if has_value('sensor.total_costs_today_calculated') else '--' }}"}
          action: mqtt.publish
          alias: Display total costs today
        - alias: Display spa temperature
          if:
            - condition: state
              entity_id: switch.intex_purespa_power
              state: "on"
          then:
            - alias: Display spa temperature
              data:
                qos: 0
                retain: true
                topic: clock_1/custom/spa_temperature
                payload: >-
                  {"icon": 7097,"color":"FFFFFF","repeat": 2,"text": "{{
                  state_attr('climate.intex_purespa','current_temperature') | float(0) | round(1)
                  if state_attr('climate.intex_purespa','current_temperature') is not none
                  else '--' }}"}
              action: mqtt.publish
          else:
            - data:
                qos: 0
                retain: true
                topic: clock_1/custom/spa_temperature
              action: mqtt.publish
        - if:
            - condition: and
              conditions:
                - condition: state
                  entity_id: media_player.woonkamer_sonos
                  state: playing
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: media_player.woonkamer_sonos
                      attribute: source
                      state: TV
          then:
            - data:
                qos: 0
                retain: true
                topic: clock_1/custom/music
                # to_json quote en escape de titel: nummers met een " of \ erin
                # maakten anders ongeldige JSON, waarna de app stil bleef hangen.
                payload: >-
                  {%- set titel = state_attr('media_player.woonkamer_sonos','media_title') -%}
                  {%- set artiest = state_attr('media_player.woonkamer_sonos','media_artist') -%}
                  {%- set tekst = (titel or 'Muziek') ~ (' - ' ~ artiest if artiest else '') -%}
                  {"icon": 29944,"color":"FFFFFF","repeat": 2, "scrollSpeed": 50,
                  "text": {{ tekst | to_json }}}
              action: mqtt.publish
          else:
            - data:
                qos: 0
                retain: true
                topic: clock_1/custom/music
              action: mqtt.publish
          alias: Display current song
        - if:
            # has_value erbij: anders is "unavailable" ook ongelijk aan "geen"
            # en stond er letterlijk "unavailable" op de klok.
            - condition: template
              value_template: >-
                {{ has_value('sensor.afvalinfo_home_trash_type_today')
                   and states('sensor.afvalinfo_home_trash_type_today') != 'geen' }}
          then:
            - data:
                qos: 0
                retain: false
                topic: clock_1/custom/afval
                payload: >-
                  { "icon": 9399,"color":"FFFFFF", "repeat": 2, "scrollSpeed": 50,
                  "text": {{ states('sensor.afvalinfo_home_trash_type_today') | to_json }} }
              action: mqtt.publish
          else:
            # Lege payload verwijdert de app; "{}" liet een lege app staan.
            - data:
                qos: 0
                retain: false
                topic: clock_1/custom/afval
              action: mqtt.publish
          alias: Display todays trash
        - if:
            - condition: not
              conditions:
                - condition: state
                  entity_id: person.robin_bohnen
                  state: home
          then:
            - data:
                qos: 0
                retain: false
                topic: clock_1/custom/robin
                # Zonder guard werd dit "R: None in None" zodra de geo-sensor geen
                # straat of plaats had; nu vallen we terug op wat wel bekend is.
                payload: >-
                  {%- set straat = state_attr('sensor.robin_bohnen_geo','street') -%}
                  {%- set plaats = state_attr('sensor.robin_bohnen_geo','city') -%}
                  {%- set toestand = states('person.robin_bohnen') -%}
                  {%- if toestand not in ['not_home', 'unavailable', 'unknown'] -%}
                  {%- set waar = toestand -%}
                  {%- elif straat and plaats -%}
                  {%- set waar = straat ~ ' in ' ~ plaats -%}
                  {%- else -%}
                  {%- set waar = plaats or straat or 'onderweg' -%}
                  {%- endif -%}
                  { "icon": 27335,"color":"FFFFFF", "repeat": 2, "scrollSpeed": 50,
                  "text": {{ ('R: ' ~ waar) | to_json }} }
              action: mqtt.publish
          else:
            - data:
                qos: 0
                retain: false
                topic: clock_1/custom/robin
              action: mqtt.publish
          alias: Display location Robin
        - if:
            - condition: not
              conditions:
                - condition: state
                  entity_id: person.samantha_henkelman
                  state: home
          then:
            - data:
                qos: 0
                retain: false
                topic: clock_1/custom/samantha
                payload: >-
                  {%- set straat = state_attr('sensor.samantha_henkelman_geo','street') -%}
                  {%- set plaats = state_attr('sensor.samantha_henkelman_geo','city') -%}
                  {%- set toestand = states('person.samantha_henkelman') -%}
                  {%- if toestand not in ['not_home', 'unavailable', 'unknown'] -%}
                  {%- set waar = toestand -%}
                  {%- elif straat and plaats -%}
                  {%- set waar = straat ~ ' in ' ~ plaats -%}
                  {%- else -%}
                  {%- set waar = plaats or straat or 'onderweg' -%}
                  {%- endif -%}
                  { "icon": 27335,"color":"FFFFFF", "repeat": 2, "scrollSpeed": 50,
                  "text": {{ ('S: ' ~ waar) | to_json }} }
              action: mqtt.publish
          else:
            - data:
                qos: 0
                retain: false
                topic: clock_1/custom/samantha
              action: mqtt.publish
          alias: Display location Partner
        - alias: Display next calendar event
          # Zonder deze guard viel as_timestamp(None) om zodra er geen volgende
          # afspraak was, waardoor de automation afbrak en de BRW-app hieronder
          # niet meer werd bijgewerkt.
          #
          # EN VERDER DAN 48 UUR VOORUIT KIJKT DEZE KLOK NIET
          # Hier stond de eerstvolgende afspraak, hoe ver weg ook. Een afspraak
          # van over drie dagen scrolde dus drie dagen lang elke 84 seconden
          # voorbij zonder dat er iets aan veranderde, terwijl deze app met 25
          # seconden de duurste van de rotatie was. Buiten het venster gaat er
          # een lege payload heen en valt hij uit de rotatie, net als `afval`
          # en `regen`.
          if:
            - condition: template
              value_template: >-
                {%- set s = state_attr('calendar.robin_en_sam', 'start_time') -%}
                {{ s is not none
                   and (s | as_datetime | as_local | as_timestamp)
                       < as_timestamp(now()) + 48 * 3600 }}
          then:
            - alias: Show next event
              data:
                qos: 0
                retain: true
                topic: clock_1/custom/next_cal_event
                payload: >-
                  {#- TIJD VOOROP, EN GEEN VERBINDINGSWOORDEN
                      Dit was `Logan gesprek - 12-08 om 19:30`. De ` - ` en het
                      woordje ` om ` zijn zeven tekens die niets toevoegen maar
                      wel meescrollen, en de tijd stond helemaal achteraan -
                      precies het stuk dat je wil weten voordat de titel voorbij
                      is. Binnen 48 uur kan een afspraak alleen vandaag, morgen
                      of overmorgen vallen, en dat zijn drie verschillende
                      weekdagen; twee letters zijn dus genoeg om ze uit elkaar
                      te houden. Vandaag krijgt niets, want dat is de normale
                      situatie.

                      `repeat` staat op 1 en niet meer op 2: de app komt sowieso
                      elke 84 seconden terug, dus die tweede rondgang koopt je
                      niets. `scrollSpeed: 50` blijft wel staan - dat is halve
                      snelheid en de enige reden dat je 'm kunt lezen. -#}
                  {%- set titel = state_attr('calendar.robin_en_sam', 'message') or 'Afspraak' -%}
                  {%- set start = state_attr('calendar.robin_en_sam', 'start_time') | as_datetime | as_local -%}
                  {%- set dagen = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'] -%}
                  {%- set dag = '' if start.date() == now().date()
                                else dagen[start.weekday()] ~ ' ' -%}
                  {%- set tijd = '' if state_attr('calendar.robin_en_sam', 'all_day')
                                 else start.strftime('%H:%M') ~ ' ' -%}
                  {"icon": 10498,"color":"FFFFFF","repeat": 1, "scrollSpeed": 50,
                  "text": {{ (dag ~ tijd ~ titel) | to_json }}}
              action: mqtt.publish
          else:
            - data:
                qos: 0
                retain: true
                topic: clock_1/custom/next_cal_event
              action: mqtt.publish
        - alias: Display rain incoming
          data:
            qos: 0
            retain: true
            topic: clock_1/custom/regen
            payload: >-
              {#- ALLEEN OP HET SCHERM ALS HET GAAT REGENEN
                  Deze app hoort bij `afval`, `robin` en `samantha`: geen bui op
                  komst is een lege payload, en dan valt hij uit de rotatie in
                  plaats van dat je 84 seconden lang langs een nul scrolt. Zie
                  de kop van packages/9 - Other/Klokken.yaml.

                  BRON: BUIENALARM, NIET `neerslag_komende_30_minuten`
                  Die laatste sensor is een som over een half uur - hij zegt
                  hoevéél er valt, niet wannéér. Het `data`-attribuut van
                  Buienalarm is een lijst met een waarde per vijf minuten
                  (`delta`) vanaf een epoch (`start`), en daarmee is het eerste
                  natte vakje wel te vinden. Buienradar levert hetzelfde in een
                  tekstformaat (`000|10:50 ...`) als je ooit een terugval wil.

                  EEN UUR VOORUIT EN NIET TWEE
                  De reeks loopt twee uur door, maar een bui die over 100
                  minuten valt is geen reden om nu iets te doen - en dan staat
                  hij dus voor niets in de rotatie. -#}
              {%- set d = state_attr('sensor.neerslag_buienalarm_regen_data', 'data') -%}
              {%- if d and d.get('success') and d.get('precip') -%}
              {%- set ns = namespace(vak=-1) -%}
              {%- for v in d.precip -%}
              {%- if ns.vak < 0 and (v | float(0)) > 0 -%}{%- set ns.vak = loop.index0 -%}{%- endif -%}
              {%- endfor -%}
              {%- if ns.vak >= 0 -%}
              {%- set minuten = (((d.start + ns.vak * d.delta) - as_timestamp(now())) / 60) | round(0) | int -%}
              {%- if minuten <= 60 -%}
              {#- Een wolk van vier balkjes met drie druppels eronder, op x=0
                  t/m 7 - even breed als de firmware-iconen, zodat deze app
                  naast de andere niet uit de toon valt. Handwerk, want er zit
                  geen regen-icoon op de klok en `draw` verdringt het
                  firmware-icoon toch; zie de BRW-app hieronder.

                  Rechts uitlijnen tot x=29: cijfers en de `m` zijn 3 px breed
                  en schuiven 4 op (opgemeten), en x=30 en x=31 zijn van de
                  indicatorstipjes. "nu" zodra de bui binnen een vakje van vijf
                  minuten valt; een tijdstip zou hier niets helpen, want deze
                  klok toont de tijd zelf niet. -#}
              {%- set tekst = 'nu' if minuten <= 0 else (minuten | string) ~ 'm' -%}
              {%- set x = 31 - (tekst | length * 4) -%}
              {"draw": [
              {"df": [2, 0, 4, 1, "#8E8E93"]},
              {"df": [1, 1, 6, 1, "#8E8E93"]},
              {"df": [0, 2, 8, 1, "#8E8E93"]},
              {"df": [1, 3, 6, 1, "#8E8E93"]},
              {"df": [1, 4, 1, 2, "#0A84FF"]},
              {"df": [4, 5, 1, 2, "#0A84FF"]},
              {"df": [6, 4, 1, 2, "#0A84FF"]},
              {"dt": [{{ x }}, 0, "{{ tekst }}", "#FFFFFF"]}
              ], "duration": 8}
              {%- endif -%}
              {%- endif -%}
              {%- endif -%}
          action: mqtt.publish
        - alias: Display BRW occupation
          data:
            qos: 0
            retain: true
            topic: clock_1/custom/brw_occupation
            payload: >-
              {#- DEZELFDE BRON ALS HET DASHBOARD, IN DEZELFDE VOLGORDE
                  Hier stond alleen `sensor.bezetting_ploeg_*`: de poll van
                  112radar, die elke vijf minuten ververst. Het dashboard leest
                  bij voorkeur het `ploegen`-attribuut van de PreCom-webhook, en
                  die twee tellen niet gelijk - op 2026-08-07 zei de klok 3/5/6
                  en het dashboard 2/4/6. Twee schermen die hetzelfde zouden
                  moeten zeggen en dat niet doen is erger dan een getal dat vijf
                  minuten oud is, dus nu overal de webhook eerst en de poll als
                  terugval. Zie dashboards/home/nest_hub.yaml voor dezelfde
                  keuze in JS. -#}

              {#- WAAROM DIT NIET MEER SCROLT
                  Hier stond `A Ploeg: 3, B Ploeg: 5, C Ploeg: 6`. Dat is ruim
                  honderd pixels breed, dus AWTRIX had geen keus en liet het
                  langslopen - en scrollende cijfers lees je in het voorbijgaan
                  niet. Drie losse getallen zijn samen 9 px en passen dus
                  gewoon stil op het scherm. De volgorde is altijd A, B, C; dat
                  is de legenda, en daarom staan de letters er niet meer bij.

                  WAAROM DE VLAM MET DE HAND GETEKEND IS
                  De firmware-icoontjes en `draw` gaan niet samen: op de klok
                  nagegaan met /api/screen bleef kolom 0 t/m 7 leeg zodra er
                  een `draw` in de payload zat. En `draw` is nodig, want alleen
                  zo krijgt elk cijfer zijn eigen kleur - met `text` geldt
                  `color` voor de hele regel. Dus icoon 8050 eruit en een vlam
                  van elf rechthoekjes ervoor in de plaats, op x=0 t/m 5.

                  DE POSITIES ZIJN OPGEMETEN, NIET GESCHAT
                  Een cijfer is 3 px breed en schuift 4 op. De drie vakjes
                  eindigen op x=12, 20 en 28; elk getal wordt daarbinnen rechts
                  uitgelijnd, zodat een ploeg van tien of meer naar links
                  uitloopt in plaats van van het scherm af te vallen. x=30 en
                  x=31 blijven sowieso vrij, want daar tekent de firmware de
                  indicatorstipjes overheen. -#}
              {%- macro tel(letter) -%}
                {%- set w = (state_attr('sensor.brandweer_bezetting', 'ploegen') or [])
                            | selectattr('ploeg', 'eq', letter) | list -%}
                {%- set poll = 'sensor.bezetting_ploeg_' ~ (letter | lower) -%}
                {%- if w | count > 0 and w[0].aantal is defined -%}{{ w[0].aantal }}
                {%- elif has_value(poll) -%}{{ states(poll) }}
                {%- else -%}-1{%- endif -%}
              {%- endmacro -%}
              {#- Dezelfde drempels als het indicatorstipje in
                  packages/9 - Other/Klokken.yaml. Onbekend wordt grijs en niet
                  rood: een cijfer dat bij elke hapering van de webhook alarm
                  slaat kijk je binnen een week overheen. -#}
              {%- macro kleur(n) -%}
                {%- if n < 0 -%}#3A3A3A
                {%- elif n < 4 -%}#FF3B30
                {%- elif n < 6 -%}#FF9F0A
                {%- else -%}#32D74B{%- endif -%}
              {%- endmacro -%}
              {%- set dienst = (states('input_select.brandweer_dienstdoende_ploeg')[0] | upper)
                               if has_value('input_select.brandweer_dienstdoende_ploeg')
                               else (state_attr('sensor.brandweer_bezetting', 'ploeg') or '') -%}
              {"draw": [
              {"df": [3, 0, 1, 1, "#FF3B30"]},
              {"df": [2, 1, 2, 1, "#FF3B30"]},
              {"df": [1, 2, 4, 1, "#FF3B30"]},
              {"df": [1, 3, 4, 1, "#FF3B30"]},
              {"df": [0, 4, 6, 1, "#FF3B30"]},
              {"df": [0, 5, 6, 1, "#FF3B30"]},
              {"df": [1, 6, 4, 1, "#FF3B30"]},
              {"df": [2, 3, 2, 1, "#FFD60A"]},
              {"df": [1, 4, 4, 1, "#FFD60A"]},
              {"df": [1, 5, 4, 1, "#FFD60A"]},
              {"df": [2, 6, 2, 1, "#FFD60A"]}
              {%- for letter, rechts in [('A', 12), ('B', 20), ('C', 28)] %}
              {%- set n = tel(letter) | trim | int(-1) -%}
              {%- set tekst = (n | string) if n >= 0 else '?' -%}
              {%- set breed = tekst | length * 4 - 1 -%}
              {%- set x = rechts - breed + 1 -%}
              , {"dt": [{{ x }}, 0, "{{ tekst }}", "{{ kleur(n) | trim }}"]}
              {%- if letter == dienst %}
              {#- Streep onder de ploeg die dienst heeft, in dezelfde kleur als
                  het cijfer: zonder die streep moet je zelf onthouden of jij
                  vandaag aan de beurt bent. -#}
              , {"df": [{{ x - 1 }}, 6, {{ breed + 2 }}, 1, "{{ kleur(n) | trim }}"]}
              {%- endif -%}
              {%- endfor %}
              ], "duration": 8}
          action: mqtt.publish
      mode: single
