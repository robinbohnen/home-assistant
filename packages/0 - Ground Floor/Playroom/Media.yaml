playroom_media_package:
  automation:
    - id: playroom_tv_off
      alias: Playroom - Media Join Unjoin
      description: "Join or unjoin the Sonos when tv status changes"
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - media_player.speelkamer_tv
          to: "on"
          id: tv_on
        - trigger: state
          entity_id:
            - media_player.speelkamer_tv
          to: "off"
          id: tv_off
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - tv_on
              sequence:
                - action: media_player.unjoin
                  metadata: {}
                  data: {}
                  target:
                    entity_id: media_player.speelkamer_sonos
            - conditions:
                - condition: trigger
                  id:
                    - tv_off
              sequence:
                - action: media_player.join
                  metadata: {}
                  data:
                    group_members:
                      - media_player.speelkamer_sonos
                  target:
                    entity_id: media_player.woonkamer_sonos

    - id: media_movement_playroom
      alias: Playroom - Media Movement
      description: "Turn on the media in the playroom if there is movement detected"
      use_blueprint:
        path: robin/sonos_motion_join.yaml
        input:
          bewegingssensor: binary_sensor.pir_group_playroom
          speaker: media_player.speelkamer_sonos
          schakelaar: input_boolean.enable_pir_playroom
          # Kinderen zitten hier langer stil dan een PIR volhoudt.
          uit_na:
            hours: 0
            minutes: 5
            seconds: 0
          # De tv en de Sonos delen de kamer: staat de tv aan, dan wint die.
          join_vereisten:
            - condition: state
              entity_id: media_player.speelkamer_tv
              state: "off"
          # Ook hier de tv-eis, al is die bij het loskoppelen strikt genomen
          # overbodig: staat de tv aan, dan heeft de automatisering hierboven
          # (Media Join Unjoin) de Sonos al losgekoppeld. Behouden zoals het
          # was, want weghalen zou de speaker in dat geval alsnog een unjoin
          # sturen op een moment dat er niets te ontkoppelen valt.
          unjoin_vereisten:
            - condition: state
              entity_id: media_player.speelkamer_tv
              state: "off"
          # Bewust geen volumeregeling: hier wordt het volume met de hand
          # gekozen en dat mag zo blijven staan.
