playroom_lights_package:

  binary_sensor:
    - platform: group
      unique_id: pir_sensors_playroom
      name: PIR Group Playroom
      entities:
        - binary_sensor.speelkamer_beweging_links_occupancy
        - binary_sensor.speelkamer_beweging_rechts_occupancy

  input_number:
    lights_playroom_percentage:
      name: "Lights Playroom - Percentage"
      min: 0
      max: 100
      step: 1
      icon: mdi:lightbulb-on-70

  input_boolean:
    enable_pir_playroom:
      name: "PIR in Playroom"
      icon: mdi:motion-sensor

  automation:
    - id: lights_movement_playroom
      alias: Playroom - Lights
      description: Turn on the lights of the playroom if there is movement detected
      use_blueprint:
        path: robin/motion_light.yaml
        input:
          bewegingssensor: binary_sensor.pir_group_playroom
          lamp: light.speelkamer_lampen
          schakelaar: input_boolean.enable_pir_playroom
          helderheid: input_number.lights_playroom_percentage
          # Kinderen zitten hier langer stil dan een PIR volhoudt.
          uit_na:
            hours: 0
            minutes: 5
            seconds: 0
          # Niet uitgaan terwijl er tv gekeken wordt.
          uit_vereisten:
            - condition: state
              entity_id: media_player.speelkamer_tv
              state: "off"
          # Overdag bij vol daglicht hoeft hier geen lamp aan. Drempel bewust
          # hoog (zelfde 20.000 lx als de klimaatregie voor "zon op de gevel"):
          # liever een keer onnodig licht dan in een schemerige kamer zitten.
          # Te ruim? Verlaag richting 10.000 en vergelijk een week met de
          # kalibratiegrafiek op de Klimaat-weergave.
          lux_sensor: sensor.buiten_zon_luminance_max
          lux_drempel: 20000
