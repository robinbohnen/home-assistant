playroom_button_package:
  timer:
    # Zolang deze loopt zijn de automatische-alarm-automations gepauzeerd.
    # Dit was een delay van 10 minuten binnen de automatisering zelf, maar een
    # herstart of reload tijdens die delay betekende dat de automations nooit
    # meer aangezet werden - en dus dat het alarm 's avonds stil bleef.
    # `restore: true` laat de timer een herstart overleven; de automatisering
    # hieronder zet alles weer aan zodra hij afloopt.
    alarm_automations_pauze:
      name: "Alarm automations - Gepauzeerd"
      duration: "00:10:00"
      restore: true
      icon: mdi:alarm-snooze

  automation:
    - id: playroom_button_disable_alarm
      alias: Playroom - Disable alarm temporary
      description: Turn off the automatic alarm when button is pressed
      mode: single
      triggers:
        - domain: mqtt
          device_id: 34cddcaf7a2e1cc3e1f6645cea07a54b
          type: action
          subtype: single
          trigger: device
          id: single
        - domain: mqtt
          device_id: 34cddcaf7a2e1cc3e1f6645cea07a54b
          type: action
          subtype: double
          trigger: device
          id: double
        - domain: mqtt
          device_id: 34cddcaf7a2e1cc3e1f6645cea07a54b
          type: action
          subtype: hold
          trigger: device
          id: hold
        # Virtuele druk, zie packages/9 - Other/Virtual Buttons.yaml
        - trigger: event
          event_type: virtual_button
          event_data:
            button: playroom_button
            action: single
          id: single
        - trigger: event
          event_type: virtual_button
          event_data:
            button: playroom_button
            action: double
          id: double
        - trigger: event
          event_type: virtual_button
          event_data:
            button: playroom_button
            action: hold
          id: hold
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: state
                  entity_id: alarm_control_panel.alarmo
                  state: disarmed
              sequence:
                - action: automation.turn_off
                  metadata: {}
                  data:
                    stop_actions: true
                  target:
                    entity_id:
                      # Een entity_id wordt bij het aanmaken uit de alias
                      # afgeleid en verandert daarna NIET meer mee als de alias
                      # wordt hernoemd. Deze heet daarom nog steeds
                      # automation.alarm_on_automatically, ook al is de alias
                      # inmiddels "Hallway Alarm - On Automatically" - dat is
                      # geverifieerd tegen de draaiende HA op 2026-08-06.
                      - automation.alarm_on_automatically
                      - automation.hallway_alarm_on_automatically_robin_to_work
                # Het weer aanzetten doet playroom_button_enable_alarm zodra de
                # timer afloopt; een delay hier overleefde geen herstart.
                - action: timer.start
                  target:
                    entity_id: timer.alarm_automations_pauze
              alias: Alarm is off
            - conditions:
                - condition: template
                  value_template: >-
                    {{ (is_state('alarm_control_panel.alarmo', 'armed_away') or
                    is_state('alarm_control_panel.alarmo', 'armed_home')) and (now() -
                    states.alarm_control_panel.alarmo.last_changed).total_seconds() <
                    2*60 }}
              sequence:
                - action: alarm_control_panel.alarm_disarm
                  metadata: {}
                  data: {}
                  target:
                    entity_id: alarm_control_panel.alarmo
              alias: Alarm is on for max 2 min
          default:
            - action: notify.mobile_devices_adults
              metadata: {}
              data:
                title: Foutmelding
                message: Knop speelkamer ingedrukt maar dit zou niet moeten kunnen

    - id: playroom_button_enable_alarm
      alias: Playroom - Enable alarm after pause
      description: >-
        Zet de automatische-alarm-automations weer aan zodra de pauzetimer
        afloopt. De start-trigger is het vangnet: de timer heeft restore: true,
        maar mocht hij toch ooit als idle terugkomen terwijl de automations nog
        uit staan, dan zet de herstart ze alsnog aan.
      mode: single
      triggers:
        - trigger: event
          event_type: timer.finished
          event_data:
            entity_id: timer.alarm_automations_pauze
        - trigger: homeassistant
          event: start
      conditions:
        - condition: state
          entity_id: timer.alarm_automations_pauze
          state: idle
      actions:
        - action: automation.turn_on
          target:
            entity_id:
              - automation.alarm_on_automatically
              - automation.hallway_alarm_on_automatically_robin_to_work
