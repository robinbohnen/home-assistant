playroom_button_package:
  timer:
    # Zolang deze loopt zijn de automatische-alarm-automations gepauzeerd.
    # Dit was een delay van 10 minuten binnen de automatisering zelf, maar een
    # herstart of reload tijdens die delay betekende dat de automations nooit
    # meer aangezet werden - en dus dat het alarm 's avonds stil bleef.
    # `restore: true` laat de timer een herstart overleven; de automatisering
    # hieronder zet alles weer aan zodra hij afloopt.
    alarm_automations_pauze:
      name: "Alarm automations - Gepauzeerd"
      # 15 minuten, geen 10: op 2026-08-17 liep de pauze om 16:17:31 af en ging
      # het alarm om 16:18:30 alsnog op scherp, omdat de tracker de laatste
      # volwassene pas 11 minuten na de druk op de knop als weg zag. Het venster
      # moet ruimer zijn dan de vertraging van de trackers, niet krapper.
      duration: "00:15:00"
      restore: true
      icon: mdi:alarm-snooze

  automation:
    - id: playroom_button_disable_alarm
      alias: Playroom - Disable alarm temporary
      description: Turn off the automatic alarm when button is pressed
      mode: single
      triggers:
        - domain: mqtt
          device_id: 34cddcaf7a2e1cc3e1f6645cea07a54b
          type: action
          subtype: single
          trigger: device
          id: single
        - domain: mqtt
          device_id: 34cddcaf7a2e1cc3e1f6645cea07a54b
          type: action
          subtype: double
          trigger: device
          id: double
        - domain: mqtt
          device_id: 34cddcaf7a2e1cc3e1f6645cea07a54b
          type: action
          subtype: hold
          trigger: device
          id: hold
        # Virtuele druk, zie packages/9 - Other/Virtual Buttons.yaml
        - trigger: event
          event_type: virtual_button
          event_data:
            button: playroom_button
            action: single
          id: single
        - trigger: event
          event_type: virtual_button
          event_data:
            button: playroom_button
            action: double
          id: double
        - trigger: event
          event_type: virtual_button
          event_data:
            button: playroom_button
            action: hold
          id: hold
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: state
                  entity_id: alarm_control_panel.alarmo
                  state: disarmed
              sequence:
                - action: automation.turn_off
                  metadata: {}
                  data:
                    stop_actions: true
                  target:
                    entity_id:
                      # Een entity_id wordt bij het aanmaken uit de alias
                      # afgeleid en verandert daarna NIET meer mee als de alias
                      # wordt hernoemd. Deze heet daarom nog steeds
                      # automation.alarm_on_automatically, ook al is de alias
                      # inmiddels "Hallway Alarm - On Automatically" - dat is
                      # geverifieerd tegen de draaiende HA op 2026-08-06.
                      - automation.alarm_on_automatically
                      - automation.hallway_alarm_on_automatically_robin_to_work
                # Het weer aanzetten doet playroom_button_enable_alarm zodra de
                # timer afloopt; een delay hier overleefde geen herstart.
                - action: timer.start
                  target:
                    entity_id: timer.alarm_automations_pauze
              alias: Alarm is off
            # 15 minuten, was 2. Dat venster is bewust eindig: zonder grens is
            # dit een volwaardige uitschakelknop op kindhoogte, en die zet
            # 's nachts ook armed_home uit. Een alarm dat net automatisch aan
            # ging is hooguit minuten oud; armed_home van gisteravond niet.
            - conditions:
                - condition: template
                  value_template: >-
                    {{ (is_state('alarm_control_panel.alarmo', 'armed_away') or
                    is_state('alarm_control_panel.alarmo', 'armed_home')) and (now() -
                    states.alarm_control_panel.alarmo.last_changed).total_seconds() <
                    15*60 }}
              sequence:
                - action: alarm_control_panel.alarm_disarm
                  metadata: {}
                  data: {}
                  target:
                    entity_id: alarm_control_panel.alarmo
                # Alleen uitschakelen is niet genoeg: de automatisering die het
                # alarm net aanzette staat nog scherp, dus de eerstvolgende
                # tracker-hik zet hem meteen terug. Een druk op de knop betekent
                # in beide takken hetzelfde: laat me 15 minuten met rust.
                - action: automation.turn_off
                  data:
                    stop_actions: true
                  target:
                    entity_id:
                      - automation.alarm_on_automatically
                      - automation.hallway_alarm_on_automatically_robin_to_work
                - action: timer.start
                  target:
                    entity_id: timer.alarm_automations_pauze
              alias: Alarm is on for max 15 min
          default:
            - action: notify.mobile_devices_adults
              metadata: {}
              data:
                title: Knop speelkamer doet niets
                message: >-
                  Het alarm staat op
                  {{ states('alarm_control_panel.alarmo') }}{% if
                  is_state('alarm_control_panel.alarmo', 'triggered') or
                  is_state('alarm_control_panel.alarmo', 'pending') %} - een
                  afgaand alarm zet je bewust alleen via de app of het paneel
                  uit{% else %} en al langer dan 15 minuten; de knop schakelt
                  alleen een net ingeschakeld alarm uit{% endif %}.

    - id: playroom_button_enable_alarm
      alias: Playroom - Enable alarm after pause
      description: >-
        Zet de automatische-alarm-automations weer aan zodra de pauzetimer
        afloopt. De start-trigger is het vangnet: de timer heeft restore: true,
        maar mocht hij toch ooit als idle terugkomen terwijl de automations nog
        uit staan, dan zet de herstart ze alsnog aan.
      mode: single
      triggers:
        - trigger: event
          event_type: timer.finished
          event_data:
            entity_id: timer.alarm_automations_pauze
        - trigger: homeassistant
          event: start
      conditions:
        - condition: state
          entity_id: timer.alarm_automations_pauze
          state: idle
      actions:
        - action: automation.turn_on
          target:
            entity_id:
              - automation.alarm_on_automatically
              - automation.hallway_alarm_on_automatically_robin_to_work

    - id: playroom_button_alarm_armed_anyway
      alias: Playroom - Alarm ging alsnog aan na knopdruk
      description: >-
        Vangnet voor het geval de pauze net te kort was: op 2026-08-17 liep hij
        om 16:17:31 af en ging het alarm om 16:18:30 alsnog op scherp, omdat de
        tracker de laatste volwassene pas 11 minuten na de knopdruk als weg zag.
        Dat merk je verder nergens - je loopt terug naar binnen en het huis
        staat op scherp. Deze melding zegt het, met een knop om het alsnog uit
        te zetten zonder de automatisering op te hoeven zoeken.

        Het venster zijn de 10 minuten nadat de pauze is afgelopen: speling
        voor een trage tracker. Ga je gewoon weg, dan is er geen pauze geweest
        en blijft het stil.
      mode: restart
      triggers:
        - trigger: state
          entity_id: alarm_control_panel.alarmo
          to:
            - armed_away
            - armed_home
          not_from:
            - unknown
            - unavailable
      conditions:
        # KIJKEN NAAR DE PAUZE ZELF, NIET NAAR DE KNOP
        # Dit keek eerst naar `last_triggered` van de knopautomatisering. Die
        # schuift bij ELKE druk op, ook als de knop niets doet (de default-tak
        # met "Knop speelkamer doet niets") - dus wie 's avonds per ongeluk op
        # de knop drukte en daarna gewoon welterusten deed, kreeg bij de
        # normale armed_home "Alarm ging alsnog aan" op zijn telefoon.
        #
        # Nu telt alleen een pauze die écht gelopen heeft en net is
        # afgelopen: de timer staat weer op idle, en dat is minder dan tien
        # minuten geleden gebeurd. Loopt de pauze nog, dan kan de
        # automatische inschakeling het niet geweest zijn (die staat dan uit)
        # en heeft iemand het alarm zelf aangezet - daar hoort geen melding
        # bij. De timer wordt nergens geannuleerd, dus idle-sinds-kort
        # betekent hier "afgelopen". armed_home blijft erin: de
        # Robin-naar-werk-automatisering die de pauze stillegt kiest zelf
        # armed_home als Samantha thuis is.
        #
        # Bekend randje: na een herstart van HA staat `last_changed` van de
        # timer op het opstartmoment, dus een inschakeling in de eerste tien
        # minuten daarna meldt zich hier ook. Zeldzaam en onschuldig - de
        # melding heeft een knop om het alarm uit te zetten, meer niet.
        - alias: Pauze van de speelkamerknop is net afgelopen
          condition: template
          value_template: >-
            {% set t = states.timer.alarm_automations_pauze %}
            {{ t is not none and t.state == 'idle'
               and (now() - t.last_changed).total_seconds() < 10*60 }}
      actions:
        - variables:
            minuten: >-
              {{ ((now() - states.timer.alarm_automations_pauze.last_changed)
                  .total_seconds() / 60) | round(0) | int }}
        - action: notify.mobile_devices_adults
          data:
            title: Alarm ging alsnog aan
            message: >-
              De pauze van de knop in de speelkamer liep {{ minuten }}
              {{ 'minuut' if minuten == 1 else 'minuten' }} geleden af, en
              het alarm staat nu op
              {{ states('alarm_control_panel.alarmo') | replace('armed_', '') }}.
            data:
              tag: speelkamer_knop_alarm
              actions:
                - action: SPEELKAMER_ALARM_UIT
                  title: Alarm uit

        # De melding blijft anders op beide telefoons staan met een knop die al
        # niets meer doet - ook als je het alarm via de app of het paneel uitzet.
        - wait_for_trigger:
            - trigger: state
              entity_id: alarm_control_panel.alarmo
              to: disarmed
          timeout: "00:20:00"
          continue_on_timeout: true
        - if:
            - condition: state
              entity_id: alarm_control_panel.alarmo
              state: disarmed
          then:
            - action: notify.mobile_devices_adults
              data:
                message: clear_notification
                data:
                  tag: speelkamer_knop_alarm

    - id: playroom_button_alarm_uit_via_melding
      alias: Playroom - Alarm uit via de melding
      description: >-
        Zet het alarm uit als iemand op "Alarm uit" tikt in de melding
        hierboven. De action-key is de lijm tussen die twee: verander je hem,
        verander hem op beide plekken.

        Doet daarna hetzelfde als een druk op de knop zelf - pauze starten -
        want zonder dat zet de eerstvolgende tracker-overgang het alarm meteen
        terug op scherp.
      mode: single
      triggers:
        - trigger: event
          event_type: mobile_app_notification_action
          event_data:
            action: SPEELKAMER_ALARM_UIT
      conditions: []
      actions:
        - action: alarm_control_panel.alarm_disarm
          data: {}
          target:
            entity_id: alarm_control_panel.alarmo
        - action: automation.turn_off
          data:
            stop_actions: true
          target:
            entity_id:
              - automation.alarm_on_automatically
              - automation.hallway_alarm_on_automatically_robin_to_work
        - action: timer.start
          target:
            entity_id: timer.alarm_automations_pauze
