livingroom_aquarium_package:

  automation:
    - id: livingroom_aquarium_onoff
      alias: Livingroom - Aquarium Off/On
      description: Turn on or off the aquarium thingies
      mode: single
      triggers:
        - trigger: time
          at: "12:00:00"
          id: time_pre_morning
        - trigger: time
          at: "13:00:00"
          id: time_morning
        - trigger: time
          at: "22:00:00"
          id: time_evening
        - trigger: state
          entity_id:
            - switch.aquarium_stopcontact_co2
          to: "on"
          for:
            hours: 9
            minutes: 0
            seconds: 0
          id: on_too_long
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - time_pre_morning
              sequence:
                - action: switch.turn_on
                  metadata: {}
                  data: {}
                  target:
                    entity_id: switch.aquarium_stopcontact_co2
            - conditions:
                - condition: trigger
                  id:
                    - time_evening
                    - on_too_long
              sequence:
                - if:
                    - condition: state
                      entity_id: switch.aquarium_stopcontact_co2
                      state: "on"
                  then:
                    - action: switch.turn_off
                      metadata: {}
                      data: {}
                      target:
                        entity_id:
                          - switch.aquarium_stopcontact_co2
          default:
            - action: switch.toggle
              metadata: {}
              data: {}
              target:
                entity_id:
                  - switch.aquarium_stopcontact_co2

    # Hier stond livingroom_aquarium_feed ("aquarium weer aan 15 minuten na het
    # voeren"). Verwijderd op 2026-08-06: de trigger hing aan de stekker
    # "Aquarium Stopcontact Pomp & Skimmer", en die is uit Zigbee2MQTT verdwenen
    # - het apparaat staat nog in de registratie maar heeft geen entiteiten
    # meer. De automatisering kon dus nooit meer afgaan. Erger was waar hij
    # naartoe schakelde: het tweede device_id blijkt "Garage Stopcontact
    # Wasmachine en Droger" te zijn, dus hád hij gevuurd, dan had hij de
    # wasmachine aangezet.

    - id: livingroom_aquarium_buttons
      alias: Livingroom - Aquarium Toggle Pumps
      description: "Toggle pumps on button press"
      mode: single
      triggers:
        - domain: mqtt
          device_id: 406dbd816277ec97bf6f1fbf2a262c86
          type: action
          subtype: on_press
          trigger: device
        # Virtuele druk, zie packages/9 - Other/Virtual Buttons.yaml
        - trigger: event
          event_type: virtual_button
          event_data:
            button: aquarium_button
            action: on_press
      conditions: []
      actions:
        # Stond op switch.aquarium_stopcontact_pomp_skimmer; die stekker bestaat
        # niet meer, dus deze knop deed niets. Dit is het enige aquarium-
        # stopcontact dat er nog is naast de CO2-stekker.
        - action: switch.toggle
          metadata: {}
          data: {}
          target:
            entity_id: switch.aquarium_stopcontact_alles
