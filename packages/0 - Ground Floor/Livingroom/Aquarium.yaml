livingroom_aquarium_package:

  automation:
    - id: livingroom_aquarium_onoff
      alias: Livingroom - Aquarium Off/On
      description: Turn on or off the aquarium thingies
      mode: single
      triggers:
        - trigger: time
          at: "12:00:00"
          id: time_pre_morning
        - trigger: time
          at: "13:00:00"
          id: time_morning
        - trigger: time
          at: "22:00:00"
          id: time_evening
        - trigger: state
          entity_id:
            - switch.aquarium_stopcontact_co2
          to: "on"
          for:
            hours: 9
            minutes: 0
            seconds: 0
          id: on_too_long
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - time_pre_morning
              sequence:
                - action: switch.turn_on
                  metadata: {}
                  data: {}
                  target:
                    entity_id: switch.aquarium_stopcontact_co2
            - conditions:
                - condition: trigger
                  id:
                    - time_evening
                    - on_too_long
              sequence:
                - if:
                    - condition: state
                      entity_id: switch.aquarium_stopcontact_co2
                      state: "on"
                  then:
                    - action: switch.turn_off
                      metadata: {}
                      data: {}
                      target:
                        entity_id:
                          - switch.aquarium_stopcontact_co2
          default:
            - action: switch.toggle
              metadata: {}
              data: {}
              target:
                entity_id:
                  - switch.aquarium_stopcontact_co2

    # Hier stond livingroom_aquarium_feed ("aquarium weer aan 15 minuten na het
    # voeren"). Verwijderd op 2026-08-06: de trigger hing aan de stekker
    # "Aquarium Stopcontact Pomp & Skimmer", en die is uit Zigbee2MQTT verdwenen
    # - het apparaat staat nog in de registratie maar heeft geen entiteiten
    # meer. De automatisering kon dus nooit meer afgaan. Erger was waar hij
    # naartoe schakelde: het tweede device_id blijkt "Garage Stopcontact
    # Wasmachine en Droger" te zijn, dus hád hij gevuurd, dan had hij de
    # wasmachine aangezet.

    # Hier stond livingroom_aquarium_buttons ("pompen aan/uit met de Hue-knop
    # naast het aquarium"). Verwijderd op 2026-08-06: hij schakelde
    # switch.aquarium_stopcontact_pomp_skimmer, en die stekker bestaat niet meer
    # (het apparaat staat nog in de registratie maar heeft geen entiteiten). De
    # knop deed dus al niets. Robin heeft bevestigd dat die opstelling weg is en
    # dat het overgebleven stopcontact `alles` níét de vervanger is - dat zou
    # het hele aquarium uitzetten in plaats van alleen de pompen.
    #
    # Het Hue-apparaat 406dbd81... bestaat nog wel. Wil je die knop opnieuw een
    # taak geven, dan is dit de plek; `aquarium_button` staat ook nog als optie
    # in packages/9 - Other/Virtual Buttons.yaml.
