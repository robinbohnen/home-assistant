livingroom_media_package:
  input_number:
    tv_playing_percentage:
      name: "TV Playing Lights Percentage"
      min: 0
      max: 100
      step: 1
      icon: mdi:lightbulb-on-70
    # Bias lighting achter het beeld. De twee Hue Play bars en de Signe zitten
    # in `light.woonkamer_lampen` en gingen dus mee naar tv-niveau - precies de
    # lampen die bij een film juist aan horen te staan. Ze krijgen nu hun eigen
    # niveau, zie `script.woonkamer_media_licht`.
    tv_bias_percentage:
      name: "TV Bias Lighting Percentage"
      min: 0
      max: 100
      step: 1
      icon: mdi:television-ambient-light

  input_boolean:
    # "Het Sonos-volume is deze kijksessie al een keer teruggezet." Zonder deze
    # vlag zou elke keer dat de Apple TV op `playing` springt - ook na een korte
    # pauze of het overslaan van een aflevering - het volume weer naar 0,17
    # gezet worden, dwars door een handmatige aanpassing heen.
    #
    # Tot 2026-08-06 ging hij alleen aan en nooit meer uit. Gevolg: de tv heeft
    # het volume precies één keer verlaagd en daarna nooit meer. Hij wordt nu
    # weer vrijgegeven zodra de sessie echt afgelopen is, zie
    # `livingroom_tv_volume_reset` hieronder.
    changed_tv_volume:
      name: "TV Volume changed"
      icon: mdi:remote-tv

    # "Er loopt een kijksessie." Aan zodra er gedimd is, uit pas als de sessie
    # echt voorbij is - een pauze laat hem bewust staan.
    #
    # Hij doet twee dingen. Ten eerste hangt het terugzetten hieraan en niet aan
    # de lux, want dimmen mag alleen als het donker is, terwijl terugzetten ook
    # moet kunnen als het inmiddels licht is geworden. Zonder die scheiding zou
    # een pauze midden op een zomermiddag - toen er nooit gedimd is - de
    # woonkamer alsnog naar 80% duwen.
    #
    # Ten tweede bepaalt hij wanneer de momentopname gemaakt wordt: alleen bij
    # de éérste keer dimmen van een sessie. Zou hij bij elke pauze omvallen, dan
    # maakte het hervatten een nieuwe momentopname van de pauzestand (80%) en
    # was de stand van vóór de film kwijt.
    #
    # De tik van 04:00 in `livingroom_media_lights` is het vangnet, voor het
    # geval de Apple TV wegvalt zonder ooit netjes af te melden.
    woonkamer_kijksessie:
      name: "Woonkamer kijksessie bezig"
      icon: mdi:television-ambient-light

  script:
    ###########################################################################
    ## Wat de drie lichtstanden betekenen - op één plek
    ###########################################################################
    # Dit stond eerst twee keer uitgeschreven: als `livingroom_media_playing`
    # en als `livingroom_media_paused`. Die twee liepen uit elkaar (de pauze-
    # kant zette de lampen die uitgingen nooit terug), en Brandweer moest ze
    # allebei aanroepen via `automation.trigger` met `skip_condition: true` -
    # een omweg die de condities van een automatisering bewust omzeilt om bij
    # de acties te komen.
    #
    # Nu roepen de automatisering én Brandweer dit script aan. Zelfde truc als
    # `sonos_overkapping_toggle` in packages/9 - Other/Sonos Groups.yaml.
    #
    # Let op het verschil tussen `pauze` en `klaar`. Pauze geeft licht: alles
    # wat brandt naar het gewone avondniveau, want je staat op om iets te halen.
    # Klaar zet terug wat het wás, uit de momentopname - inclusief lampen die
    # vóór de film uit stonden. Zou pauze dat ook doen, dan ging het licht in
    # een donkere kamer bij elke pauze weer uit.
    woonkamer_media_licht:
      alias: Woonkamer - Media licht
      description: >-
        Zet de woonkamerverlichting in de kijkstand, op het gewone avondniveau
        (pauze), of terug op de stand van vóór de film (klaar).
      icon: mdi:television-ambient-light
      mode: restart
      fields:
        stand:
          name: Stand
          description: >-
            `kijken` = dimmen voor de tv. `pauze` = alles wat brandt naar het
            gewone avondniveau. `klaar` = terug naar de momentopname van vóór
            de film.
          required: true
          example: kijken
          selector:
            select:
              options:
                - kijken
                - pauze
                - klaar
      # De samenstelling van de lampgroepen blijft in de groepen zelf staan;
      # hier wordt hij alleen uitgelezen. Twee accessors omdat het twee soorten
      # groepen zijn: `light.tv_kast_lampen` is een oude platformgroep en heeft
      # het attribuut `entity_id`, `light.woonkamer_lampen` is een helper-groep
      # en heeft `group_entities`. `expand()` werkt op die tweede soort niet -
      # dat geeft gewoon de groep zelf terug, geen leden.
      variables:
        bias: >-
          {{ (state_attr('light.tv_kast_lampen', 'entity_id') or []) | list
             + ['light.woonkamer_hue_signe_gradient'] }}
        plafond: >-
          {{ (state_attr('light.woonkamer_lampen', 'group_entities') or [])
             | reject('in', bias) | list }}
        # Alles wat de momentopname moet vasthouden, als losse lampen. Een
        # groep in de momentopname zetten werkt ook, maar dan komt iedereen
        # terug op dezelfde helderheid en is het verschil tussen de tafellamp
        # en de spots weg.
        alle_lampen: >-
          {{ plafond + bias
             + (state_attr('light.keuken_lampen', 'group_entities') or [])
             + (state_attr('light.eettafel_lampen', 'group_entities') or []) }}
        # De twee AWTRIX-klokken die vanuit de bank te zien zijn. De garageklok
        # hoort er niet bij: die kijkt niemand op tijdens een film.
        #
        # ALLEEN DE KLOKKEN DIE AL AAN STAAN
        # `light.turn_on` met een helderheid zet een scherm ook aan. Zonder deze
        # selectie zou een film op een avond dat het alarm aan staat en het
        # licht uit is de klokken alsnog laten oplichten - op 1%, maar wel de
        # hele nacht, want de huisregel in packages/9 - Other/Klokken.yaml komt
        # daarna pas weer langs als het alarm of het licht verandert.
        # Ze staan bewust niet in `alle_lampen`: de momentopname hoort over
        # lampen te gaan, en het terugzetten gebeurt hieronder met een vast
        # percentage.
        klokken: >-
          {{ ['light.keuken_klok_awtrix_keuken_matrix',
              'light.woonkamer_klok_awtrix_woonkamer_matrix']
             | select('is_state', 'on') | list }}
      sequence:
        - if:
            - condition: template
              value_template: "{{ stand == 'kijken' }}"
          then:
            # Alleen bij de eerste keer dimmen van een sessie. Zie de
            # toelichting bij input_boolean.woonkamer_kijksessie hierboven.
            - if:
                - condition: state
                  entity_id: input_boolean.woonkamer_kijksessie
                  state: "off"
              then:
                - action: scene.create
                  data:
                    scene_id: woonkamer_voor_media
                    snapshot_entities: "{{ alle_lampen }}"
            # Plafondspots, tafellamp, keuken en eettafel omlaag. De Play bars
            # en de Signe zitten hier bewust niet bij; die staan in `bias`.
            - action: light.turn_on
              target:
                entity_id: >-
                  {{ plafond + ['light.keuken_lampen', 'light.eettafel_lampen'] }}
              data:
                transition: "{{ states('input_number.lights_transition_seconds') | int(1) }}"
                brightness_pct: "{{ states('input_number.tv_playing_percentage') | int(35) }}"
            # 2200 K is bewust warm en ligt net boven de ondergrens van deze
            # lampen (2000 K). Het gaat om licht achter het scherm, niet om
            # licht in de kamer.
            - action: light.turn_on
              target:
                entity_id: "{{ bias }}"
              data:
                transition: "{{ states('input_number.lights_transition_seconds') | int(1) }}"
                # Een net aangemaakte input_number begint op zijn minimum, dus
                # op 0 - en dat zou betekenen dat de bias lighting de eerste
                # avond gewoon uit blijft. `or 60` vangt dat af: 0 is voor een
                # lamp toch geen zinnige waarde (dat is "uit"), dus die lezen we
                # als "nog niet ingesteld".
                brightness_pct: "{{ states('input_number.tv_bias_percentage') | int(0) or 60 }}"
                color_temp_kelvin: 2200
            # Licht dat het beeld in schijnt. Speelkamer, garage en trapkast
            # hangen aan de motion_light-blueprint en gaan vanzelf weer aan
            # zodra er iemand loopt; daarom staan ze niet in de terugzet-tak.
            - action: light.turn_off
              target:
                entity_id:
                  - light.entree_lampen
                  - light.speelkamer_lampen
                  - light.garage_lampen
                  - light.trapkast_lampen
                  - light.woonkamer_humble
            - action: light.turn_on
              target:
                entity_id: light.keuken_klok_awtrix_keuken_matrix
              data:
                brightness_pct: 1
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.woonkamer_kijksessie

          else:
            - choose:
                - alias: "Klaar, en er is een momentopname om op terug te vallen"
                  conditions:
                    - condition: template
                      value_template: "{{ stand == 'klaar' }}"
                    # Scenes uit `scene.create` overleven een herstart van HA
                    # niet. Is hij weg, dan valt hij hieronder terug op het
                    # gewone avondniveau in plaats van niets te doen.
                    - condition: template
                      value_template: "{{ states.scene.woonkamer_voor_media is not none }}"
                  sequence:
                    - action: scene.turn_on
                      target:
                        entity_id: scene.woonkamer_voor_media
                      data:
                        transition: "{{ states('input_number.lights_transition_seconds') | int(1) }}"
              default:
                # Pauze, en klaar zonder momentopname. Alleen lampen die aan
                # staan: anders zou het einde van een film om half twaalf de
                # keuken en de eettafel aandoen die de hele avond bewust uit
                # stonden.
                - variables:
                    branden: >-
                      {{ ['light.woonkamer_lampen',
                          'light.keuken_lampen',
                          'light.eettafel_lampen'] | select('is_state', 'on') | list }}
                - if:
                    - condition: template
                      value_template: "{{ branden | count > 0 }}"
                  then:
                    - action: light.turn_on
                      target:
                        entity_id: "{{ branden }}"
                      data:
                        transition: "{{ states('input_number.lights_transition_seconds') | int(1) }}"
                        brightness_pct: "{{ states('input_number.lights_livingroom_percentage') | int(80) }}"

            # De humble ging bij het kijken uit en zit in geen enkele groep
            # hierboven, dus ook niet in de momentopname.
            # `livingroom_lights_ambient_fill` in Lights.yaml zet hem alleen op
            # zijn eigen triggers aan (lux die onder 1000 zakt, of
            # woonkamer_lampen die aangaan) en die komen na een film niet meer
            # langs. De 20% en 3984 K hieronder horen gelijk te blijven aan wat
            # daar staat.
            - if:
                - condition: numeric_state
                  entity_id: sensor.achtertuin_zon_luminance
                  below: 1000
                - condition: state
                  entity_id: light.woonkamer_lampen
                  state: "on"
              then:
                - action: light.turn_on
                  target:
                    entity_id: light.woonkamer_humble
                  data:
                    brightness_pct: 20
                    color_temp_kelvin: 3984
            - action: light.turn_on
              target:
                entity_id: light.keuken_klok_awtrix_keuken_matrix
              data:
                brightness_pct: 50
            # Alleen `klaar` sluit de sessie af. Pauze laat de vlag staan, zodat
            # het hervatten niet opnieuw een momentopname maakt.
            - if:
                - condition: template
                  value_template: "{{ stand == 'klaar' }}"
              then:
                - action: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.woonkamer_kijksessie

  automation:
    ###########################################################################
    ## Licht meebewegen met wat er op de tv gebeurt
    ###########################################################################
    # De `id` blijft `livingroom_media_playing`: daar hangt de bestaande
    # entiteit aan vast, en de sub-knop op de tv-kaart in
    # dashboards/home/dashboard.yaml toggelt precies die entity_id als
    # noodstop. Een nieuwe id levert een tweede automatisering op en een dode
    # knop. De alias mag wel mee met de nieuwe lading; de entity_id volgt die
    # niet (de registry wint), zie ook de opmerking in packages/9 - Other/Music.yaml.
    #
    # Wat er is samengevoegd en waarom:
    #
    #   * `livingroom_media_paused` is opgegaan in de `pauze`-tak hieronder.
    #     Die stond op `condition: time before "00:30:00"` zonder `after`; HA
    #     vult dan 00:00 in, dus die conditie klopte alleen tussen middernacht
    #     en half één. Bij een gewone pauze om acht uur 's avonds viel hij af,
    #     en daarom werden de lampen na een pauze nooit weer feller. De enige
    #     runs die je in de historie ziet komen van Brandweer, dat hem met
    #     `skip_condition: true` aanriep.
    #   * De `media_player.unjoin` die hier stond is weg. `livingroom_tv_on`
    #     hieronder doet exact dezelfde unjoin op exact dezelfde trigger.
    #   * `mode: parallel, max: 10` is `restart` geworden. Elke keer skippen of
    #     hervatten was een extra parallelle run die de lampen opnieuw zette;
    #     in het logboek van 5 augustus staan er twee binnen één minuut.
    #   * De donkertest is `sensor.achtertuin_zon_luminance` onder 1000
    #     geworden, dezelfde grens die `livingroom_lights_ambient_fill` in
    #     Lights.yaml gebruikt. Die stond hier als een omgekeerde zon-conditie
    #     ge-OR'd met een tijdvenster, wat op een grijze middag niet meedeed.
    - id: livingroom_media_playing
      alias: Livingroom - Media Lights
      description: >-
        Dimt de woonkamer zodra er op de tv gekeken of gegamed wordt, geeft
        licht bij een pauze en zet aan het eind terug wat het was.
      mode: restart
      triggers:
        # not_from overal: na een herstart komen deze spelers uit `unknown` of
        # `unavailable` en dat is geen echte start of stop.
        - trigger: state
          entity_id: media_player.woonkamer_appletv
          to: playing
          not_from:
            - unknown
            - unavailable
          id: kijken
        - trigger: state
          entity_id: media_player.playstation_5
          to: playing
          not_from:
            - unknown
            - unavailable
          id: kijken
        # De tv zelf, voor zijn eigen apps. Een halve minuut speling omdat de
        # samsungtv-integratie over het netwerk polt en bij een hik `off` en
        # daarna weer `on` meldt; zie de toelichting bij `play_music_tv_off` in
        # packages/9 - Other/Music.yaml. De Apple TV hierboven dekt het normale
        # geval binnen een paar seconden af.
        - trigger: state
          entity_id: media_player.woonkamer_77_oled_3
          to: "on"
          not_from:
            - unknown
            - unavailable
          for: "00:00:30"
          id: kijken
        # Begint de film terwijl het buiten nog licht is, dan dimde er vroeger
        # die hele avond niets meer: de enige kans om te dimmen was het moment
        # van starten. Nu telt het moment waarop het donker wordt ook mee.
        - trigger: numeric_state
          entity_id: sensor.achtertuin_zon_luminance
          below: 1000
          id: kijken
        # Acht seconden speling: spoelen en het overslaan van een intro gaan bij
        # de Apple TV via `paused`, en zonder deze wachttijd knippert de hele
        # benedenverdieping mee met de afstandsbediening.
        - trigger: state
          entity_id: media_player.woonkamer_appletv
          to:
            - paused
            - idle
          not_from:
            - unknown
            - unavailable
          for: "00:00:08"
          id: pauze
        - trigger: state
          entity_id: media_player.woonkamer_appletv
          to:
            - "off"
            - standby
          not_from:
            - unknown
            - unavailable
          id: klaar
        - trigger: state
          entity_id: media_player.playstation_5
          to:
            - "off"
            - standby
          not_from:
            - unknown
            - unavailable
          id: klaar
        - trigger: state
          entity_id: media_player.woonkamer_77_oled_3
          to: "off"
          not_from:
            - unknown
            - unavailable
          for: "00:02:00"
          id: klaar
        # Vangnet voor de sessievlag, zelfde gedachte en zelfde tijdstip als bij
        # `livingroom_tv_volume_reset` hieronder: valt de Apple TV weg zonder
        # ooit `off` te melden, dan blijft de vlag anders staan en denkt de
        # pauze-tak morgenavond dat er nog een sessie loopt. Bewust alleen de
        # vlag en niet het licht: om vier uur 's nachts hoort er niets aan te
        # gaan.
        - trigger: time
          at: "04:00:00"
          id: vangnet
      conditions: []
      actions:
        - choose:
            - alias: "Er wordt gekeken en het is donker genoeg"
              conditions:
                - condition: trigger
                  id: kijken
                # Nodig omdat de lux-trigger ook afgaat als er niemand kijkt.
                - alias: "Er speelt ook echt iets"
                  condition: or
                  conditions:
                    - condition: state
                      entity_id: media_player.woonkamer_appletv
                      state: playing
                    - condition: state
                      entity_id: media_player.playstation_5
                      state: playing
                    - condition: state
                      entity_id: media_player.woonkamer_77_oled_3
                      state: "on"
                # Muziek via de Apple TV is geen reden om de benedenverdieping
                # te verduisteren. Ontbreekt het attribuut (speler uit, of een
                # bron die het niet invult), dan is de uitkomst `none` en dus
                # niet 'music' - dan dimt hij gewoon.
                - alias: "Geen muziek via de Apple TV"
                  condition: template
                  value_template: >-
                    {{ state_attr('media_player.woonkamer_appletv', 'media_content_type') != 'music' }}
                # De lux is leidend, maar het is wel een buitensensor: valt hij
                # weg, dan zou een kale numeric_state altijd `false` opleveren
                # en dimde de tv nooit meer - zonder dat iemand doorheeft
                # waarom. Alleen dán valt hij terug op het tijdvenster dat hier
                # vroeger stond. Zolang de sensor het doet, telt het tijdvenster
                # niet mee; anders zou een grijze middag alsnog dimmen.
                - alias: "Donker genoeg (lux, tijdvenster als terugval)"
                  condition: or
                  conditions:
                    - condition: numeric_state
                      entity_id: sensor.achtertuin_zon_luminance
                      below: 1000
                    - condition: and
                      conditions:
                        - condition: template
                          value_template: "{{ not has_value('sensor.achtertuin_zon_luminance') }}"
                        - condition: time
                          after: "18:30:00"
                          before: "05:00:00"
              sequence:
                - if:
                    - condition: state
                      entity_id: input_boolean.changed_tv_volume
                      state: "off"
                  then:
                    - action: media_player.volume_set
                      data:
                        volume_level: 0.17
                      target:
                        entity_id: media_player.woonkamer_sonos
                    - action: input_boolean.turn_on
                      target:
                        entity_id: input_boolean.changed_tv_volume
                - action: script.woonkamer_media_licht
                  data:
                    stand: kijken

            # Pauze en einde sessie hangen aan de vlag en niet aan de lux,
            # zodat een film die tot na zonsopkomst doorloopt aan het eind
            # netjes terugzet.
            - alias: "Pauze of einde sessie"
              conditions:
                - condition: trigger
                  id:
                    - pauze
                    - klaar
                - condition: state
                  entity_id: input_boolean.woonkamer_kijksessie
                  state: "on"
                # Anders haalt het in slaap vallen van de Apple TV midden in
                # een PS5-sessie de lampen omhoog, en omgekeerd het uitzetten
                # van de PS5 midden in een film.
                - alias: "En er speelt verder niets meer"
                  condition: not
                  conditions:
                    - condition: state
                      entity_id: media_player.playstation_5
                      state: playing
                    - condition: state
                      entity_id: media_player.woonkamer_appletv
                      state: playing
              sequence:
                - action: script.woonkamer_media_licht
                  data:
                    stand: "{{ 'klaar' if trigger.id == 'klaar' else 'pauze' }}"

            - alias: "Vangnet: sessievlag vrijgeven"
              conditions:
                - condition: trigger
                  id: vangnet
              sequence:
                - action: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.woonkamer_kijksessie
        # Bewust geen default-tak: een trigger zonder afgedekte id hoort niets
        # te doen. Let op dat `automation.trigger` hier dus ook niets uitricht -
        # wie de lampen van buitenaf wil zetten, roept het script aan.

    - id: livingroom_tv_on
      alias: Livingroom - Media TV On
      description: "Unjoin everything if TV is turned on"
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - media_player.woonkamer_77_oled_3
          to: "on"
        - trigger: state
          entity_id:
            - media_player.woonkamer_appletv
          to: playing
      conditions: []
      actions:
        - action: media_player.unjoin
          data: {}
          target:
            entity_id: group.all_sonos_secondary

    ###########################################################################
    ## De volumevlag weer vrijgeven
    ###########################################################################
    # `livingroom_media_playing` verlaagt het Sonos-volume alleen als deze vlag
    # uit staat, zodat een handmatige correctie tijdens het kijken niet elke
    # keer overreden wordt. Alleen: niets zette hem ooit terug, dus na de
    # allereerste keer gebeurde het nooit meer.
    #
    # Niet op `paused` of `idle` resetten: een plaspauze of het overslaan van
    # een aflevering hoort geen nieuwe sessie te zijn - dan zou het volume bij
    # het hervatten alsnog over je aanpassing heen gaan. Pas als de Apple TV of
    # de televisie echt uit is, is de sessie voorbij.
    #
    # De tik van 04:00 is het vangnet: valt de Apple TV weg zonder ooit netjes
    # `off` te melden (unavailable na een netwerkstoring bijvoorbeeld), dan zou
    # de vlag blijven hangen en waren we terug bij het oude gedrag. Vier uur 's
    # nachts ligt na het laatste realistische kijkmoment en ruim voor het
    # eerste, dus hij valt nooit midden in een sessie.
    - id: livingroom_tv_volume_reset
      alias: Livingroom - TV volumevlag vrijgeven
      description: >-
        Geeft input_boolean.changed_tv_volume weer vrij zodra de kijksessie
        voorbij is, zodat de volgende keer het Sonos-volume weer automatisch
        zacht gaat.
      mode: single
      triggers:
        # not_from voorkomt dat een herstart (unknown -> off) hier als "tv gaat
        # uit" telt; dat is onschuldig, maar het houdt de trace leesbaar.
        - trigger: state
          entity_id: media_player.woonkamer_appletv
          to:
            - "off"
            - standby
          not_from:
            - unknown
            - unavailable
        - trigger: state
          entity_id: media_player.woonkamer_77_oled_3
          to: "off"
          not_from:
            - unknown
            - unavailable
        - trigger: time
          at: "04:00:00"
      conditions:
        - condition: state
          entity_id: input_boolean.changed_tv_volume
          state: "on"
      actions:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.changed_tv_volume
