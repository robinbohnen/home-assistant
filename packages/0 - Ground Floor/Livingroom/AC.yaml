airco_livingroom_package:
  automation:
    - id: ac_off_nobody_home
      alias: AC - Turn off when nobody home
      description: Turn off all ACs when all adults leave and an AC is running
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - group.all_adults
          from: home
          to: not_home
      conditions:
        # Alle standen waarin de unit echt iets doet, niet alleen `heat`.
        # Hier stond jarenlang alleen `heat`, en dat is precies de helft van
        # het jaar dat het misgaat: verlieten we in de zomer het huis met een
        # koelende airco, dan viel deze automatisering stil en bleef hij de
        # lege woonkamer koelen tot iemand thuiskwam. Sinds de aircoregie
        # (packages/9 - Other/Klimaat Airco.yaml) kan de airco ook zonder dat
        # iemand hem heeft aangezet aan staan, en dan telt dat dubbel.
        - condition: or
          conditions:
            - condition: state
              entity_id: climate.airco_woonkamer
              state: &aan_standen [heat, cool, dry, heat_cool, fan_only]
            - condition: state
              entity_id: climate.airco_zolder
              state: *aan_standen
      actions:
        - action: climate.turn_off
          data: {}
          target:
            entity_id: climate.airco_woonkamer
        # De zolder-airco is regelmatig onbereikbaar; een kale turn_off faalt
        # dan stil en je rijdt weg met een airco die aan blijft. Daarvoor is
        # script_attic_ac_off er (herhaalpogingen plus een melding als het
        # echt niet lukt) - de slaapkamerknop gebruikt hem al.
        - action: script.turn_on
          target:
            entity_id: script.script_attic_ac_off
        - action: notify.mobile_devices_adults
          data:
            title: Airco's uitgeschakeld
            message: Niemand meer thuis, airco's zijn automatisch uitgezet.

    - id: ac_off_evening
      alias: Livingroom - AC Automatically off
      description: "Turn off AC when is on for more than 2 hours and almost time to go to bed"
      mode: single
      triggers:
        - trigger: time
          at: "21:00:00"
        - trigger: time
          at: "22:00:00"
        - trigger: time
          at: "23:00:00"
      conditions:
        - condition: state
          entity_id: climate.airco_woonkamer
          state:
            - heat
          for:
            hours: 2
            minutes: 0
            seconds: 0
        - condition: numeric_state
          entity_id: climate.airco_woonkamer
          attribute: current_temperature
          above: 20
      actions:
        - action: climate.turn_off
          metadata: {}
          target:
            entity_id: climate.airco_woonkamer
          data: {}
