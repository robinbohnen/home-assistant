airco_livingroom_package:
  automation:
    - id: ac_off_nobody_home
      alias: AC - Turn off when nobody home
      description: Turn off all ACs when all adults leave and AC is heating
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - group.all_adults
          from: home
          to: not_home
      conditions:
        - condition: or
          conditions:
            - condition: state
              entity_id: climate.airco_woonkamer
              state: heat
            - condition: state
              entity_id: climate.airco_zolder
              state: heat
      actions:
        - action: climate.turn_off
          data: {}
          target:
            entity_id:
              - climate.airco_woonkamer
              - climate.airco_zolder
        - action: notify.mobile_devices_adults
          data:
            title: Airco's uitgeschakeld
            message: Niemand meer thuis, airco's zijn automatisch uitgezet.

    - id: ac_off_evening
      alias: Livingroom - AC Automatically off
      description: "Turn off AC when is on for more than 2 hours and almost time to go to bed"
      mode: single
      triggers:
        - trigger: time
          at: "21:00:00"
        - trigger: time
          at: "22:00:00"
        - trigger: time
          at: "23:00:00"
      conditions:
        - condition: state
          entity_id: climate.airco_woonkamer
          state:
            - heat
          for:
            hours: 2
            minutes: 0
            seconds: 0
        - condition: numeric_state
          entity_id: climate.airco_woonkamer
          attribute: current_temperature
          above: 20
      actions:
        - action: climate.turn_off
          metadata: {}
          target:
            entity_id: climate.airco_woonkamer
          data: {}
