livingroom_doorbell_package:
  automation:
    - id: livingroom_doorbell
      alias: Livingroom - Doorbell
      description: "Play doorbell to Sonos to announce someone is there"
      mode: single
      triggers:
        # De event-entiteit en niet meer de binary_sensor (die verdwijnt uit
        # UniFi Protect in HA 2027.1). event.received vuurt niet op de
        # unavailable->stand-flank na een herstart, wel op de eerste bel daarna.
        - trigger: event.received
          target:
            entity_id: event.g4_doorbell_voortuin_doorbell
          options:
            event_type: ring
      conditions: []
      actions:
        - action: mqtt.publish
          data:
            topic: clock_1/notify
            payload: >-
              {"icon": 56373, "color": "FFAA00", "sound": "doorbell", "repeat": 3,
              "text": "Deurbel!", "stack": false, "scrollSpeed": 75}
        - action: sonos.snapshot
          metadata: {}
          data:
            with_group: true
            entity_id: media_player.woonkamer_sonos
        - action: media_player.volume_set
          metadata: {}
          data:
            volume_level: 0.40
          target:
            entity_id: media_player.woonkamer_sonos
        - action: media_player.play_media
          metadata: {}
          data:
            media_content_id: https://home-assistant.kroon18.slimhuys.nl/local/chime.mp3
            media_content_type: music
          target:
            entity_id: media_player.woonkamer_sonos
        - delay:
            hours: 0
            minutes: 0
            seconds: 4
            milliseconds: 0
        - action: media_player.play_media
          metadata: {}
          data:
            media_content_id: https://home-assistant.kroon18.slimhuys.nl/local/chime.mp3
            media_content_type: music
          target:
            entity_id: media_player.woonkamer_sonos
        - delay:
            hours: 0
            minutes: 0
            seconds: 4
            milliseconds: 0
        - action: sonos.restore
          metadata: {}
          data:
            with_group: true
            entity_id: media_player.woonkamer_sonos
