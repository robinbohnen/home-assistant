##############################################################################
## SCHOOL - de melding van 16:00 over morgen
##############################################################################
#
# Elke dag om 16:00, per kind: staat er voor MORGEN nog iets open, dan gaat er
# een bericht naar alle volwassenen én naar de telefoon van dat kind zelf.
# Staat er niets, dan gebeurt er niets - er is geen "alles is af"-bericht, want
# een melding die ook komt als er niets aan de hand is, leer je wegtikken.
#
# De tekst wordt niet hier opgebouwd maar door `melding_morgen()` in
# `custom_templates/school.jinja`, dezelfde plek waar de School-weergave zijn
# kaarten vandaan haalt. Deze automatisering doet drie dingen: klok, kinderen,
# versturen.
#
# ---------------------------------------------------------------------------
# WAT "NOG NIET AF" HIER BETEKENT - EN WAT NIET
# ---------------------------------------------------------------------------
# Dit is de belangrijkste beperking van deze melding, en hij is niet op te
# lossen zonder de integratie aan te passen:
#
#   OPDRACHTEN  hebben een veld `ingeleverd_op`. Staat daar geen datum in, dan
#               is de opdracht aantoonbaar nog niet ingeleverd. Die staan in het
#               bericht onder "Nog niet ingeleverd".
#   HUISWERK    kent Home Assistant alleen als "er staat huiswerk voor morgen".
#               De Magister-API heeft per afspraak wel een afgerond-vlag, maar
#               de integratie leest die niet uit (magister_school v2.0.1). Het
#               bericht somt huiswerk en toetsen daarom OP zonder te beweren dat
#               ze niet af zijn.
#
# Het verschil zit bewust in de woorden ("nog niet ingeleverd" tegenover
# "huiswerk"), zodat niemand het bericht leest als een aanklacht die hij niet
# waar kan maken. Komt die afgerond-vlag ooit door, dan hoeft alleen
# `melding_morgen()` in school.jinja aangepast te worden.
#
# ---------------------------------------------------------------------------
# EEN TWEEDE KIND
# ---------------------------------------------------------------------------
# Eén regel in de lijst `kinderen` hieronder: roepnaam, de sensor-prefix uit
# Magister, en de notify-dienst van zijn eigen telefoon. Verder niets - de
# tekst, de drempel en de bezorging zijn voor elk kind gelijk.
#
# De lijst staat hier UITGESCHREVEN en wordt niet uit de entiteiten afgeleid.
# Dat is dezelfde keuze als in `Kinderen Wakker.yaml`: een kind dat je vergeet
# levert een zichtbaar gat op ("waarom kreeg ik niets over Emma"), terwijl een
# automatisch gevonden lijst stilletjes naar het verkeerde toestel kan sturen.
#
# LET OP: nieuw packagebestand, dus dit laadt pas na een VOLLEDIGE HERSTART.
# Datzelfde geldt voor `school.jinja` waar de tekst vandaan komt.

school_meldingen_package:

  ###########################################################################
  ## Merken dat Magister stil is gevallen
  ###########################################################################
  #
  # Magister is een bron die kan wegvallen zonder dat er iets kapot LIJKT: het
  # wachtwoord verloopt, of de school verandert iets aan het account, en dan
  # blijven alle sensoren gewoon op hun laatste waarde staan. Het rooster op de
  # weergave klopt dan nog steeds - het is alleen van vorige week. Er is niets
  # aan te zien, en dat is precies het probleem.
  #
  # Deze sensor is de enige plek in de config die dat kan zien, en hij bestaat
  # om de Onderhoud-kaarten op de School-weergave te STUREN: die staan er alleen
  # als hij aan staat. Een kaart die altijd "✅ alles goed" zegt lees je na een
  # week niet meer, en dan zegt hij ook niets meer als het een keer misgaat.
  #
  # De drempel van een uur is dezelfde als in de tekst op die kaart, en dat moet
  # zo blijven: gaan ze uit elkaar lopen, dan verschijnt er een kaart met een
  # groen vinkje erop.
  #
  # `sensor.magister_data` zet er een KALE tijd in zonder tijdzone, en die is
  # lokaal. `as_timestamp` leest een naïeve tijd ook als lokale tijd, dus dit
  # klopt. (`as_local(as_datetime(...))` zou hetzelfde doen: HA plakt op een
  # naïeve tijd de LOKALE zone en rekent niet om vanuit UTC - live nagemeten
  # op 2026.9.3, "10:00:00" werd 10:00+02:00. Een eerdere versie van dit
  # commentaar beweerde het omgekeerde.) De `0` als tweede argument vangt een
  # tijd af die helemaal niet te lezen is: die telt als "lang geleden", en dat
  # is hier de veilige kant.
  #
  # `now()` in een template laat Home Assistant hem uit zichzelf elke minuut
  # opnieuw uitrekenen; er is geen trigger of tijdpatroon voor nodig.
  #
  # `delay_on` is er voor het herstarten van Home Assistant: dan is de sensor
  # even onbereikbaar terwijl er niets aan de hand is. Tien minuten is ruim
  # langer dan de integratie nodig heeft om zijn eerste ronde te doen (hij
  # ververst elk kwartier), en de storing zelf duurt toch al minstens een uur
  # voor hij zich meldt.
  template:
    # Het geheugen van `school_nieuw_cijfer`: per cijfersensor de cijfers die
    # al gemeld zijn (zie `cijfer_sleutels()` in school.jinja). Trigger-based,
    # want die zet zijn attributen terug na een herstart - een gewone
    # template-sensor rekent alles opnieuw uit en weet dan niets meer.
    # Alleen de automatisering schrijft hierin, via het event.
    - triggers:
        - trigger: event
          event_type: magister_cijfers_gezien
      sensor:
        - name: "Magister cijfers al gemeld"
          unique_id: magister_cijfers_al_gemeld
          icon: mdi:certificate-outline
          device_class: timestamp
          state: "{{ now().isoformat() }}"
          attributes:
            gezien: >-
              {% set oud = this.attributes.get('gezien') or {} %}
              {% set k = trigger.event.data.sensor %}
              {{ dict(oud.items() | rejectattr(0, 'eq', k) | list + [(k, trigger.event.data.sleutels)]) }}

    - binary_sensor:
        - name: "Magister haalt niets meer op"
          unique_id: magister_haalt_niets_meer_op
          device_class: problem
          icon: mdi:school-outline
          delay_on: "00:10:00"
          delay_off: "00:01:00"
          state: >
            {% set t = states('sensor.magister_data') %}
            {% if t in ['unknown', 'unavailable', 'none', ''] %}
              true
            {% else %}
              {{ (as_timestamp(now()) - as_timestamp(t, 0)) > 3600 }}
            {% endif %}

  automation:
    - id: school_werk_voor_morgen
      alias: School - Wat moet er morgen af (16:00)
      description: >-
        Meldt om 16:00 per kind wat er voor morgen open staat: opdrachten die
        nog niet ingeleverd zijn, plus het huiswerk en de toetsen die morgen op
        het rooster staan. Stuurt niets als er niets is.
      mode: single

      triggers:
        - trigger: time
          at: "16:00:00"

      actions:
        - variables:
            kinderen:
              - naam: Logan
                prefix: sensor.magister_logan_veen
                telefoon: notify.mobile_app_iphone_van_logan
              # - naam: Emma
              #   prefix: sensor.magister_emma_bohnen
              #   telefoon: notify.mobile_app_iphone_van_emma

        - repeat:
            for_each: "{{ kinderen }}"
            sequence:
              - variables:
                  # Import en aanroep staan met opzet op ÉÉN regel. In een
                  # gevouwen blok (`>-`) worden die twee regels met een SPATIE
                  # aan elkaar geplakt, en dan hangt het van de streepjes in
                  # `-%}` af of `tekst` leeg is of één spatie bevat - waarmee
                  # de test hieronder ("is er iets te melden?") altijd waar zou
                  # zijn en er elke dag om 16:00 een leeg bericht uitgaat.
                  tekst: "{% from 'school.jinja' import melding_morgen %}{{ melding_morgen(repeat.item.prefix) | trim }}"


              # Een `condition:` op deze plek zou de hele herhaling afbreken,
              # dus ook het kind dat er nog achter staat. Met `if/then` slaat
              # hij alleen dít kind over.
              - if:
                  - condition: template
                    value_template: "{{ tekst != '' }}"
                then:
                  - action: notify.mobile_devices_adults
                    data:
                      title: "{{ repeat.item.naam }} - voor morgen"
                      message: "{{ tekst }}"
                      data: &melding_opties
                        # Eén tag per kind: stuurt hij morgen opnieuw, dan
                        # vervangt dat bericht het oude in plaats van een
                        # stapel te maken. Twee kinderen houden zo elk hun
                        # eigen melding.
                        tag: "school-morgen-{{ repeat.item.prefix }}"
                        group: school
                        # `url` is wat iOS opent, `clickAction` wat Android
                        # opent. Allebei meesturen is de gewone manier.
                        url: /lovelace/school
                        clickAction: /lovelace/school

                  # Apart bericht en niet dezelfde tekst met dezelfde kop: de
                  # ouders lezen "Logan - voor morgen", het kind leest een
                  # bericht dat tegen hem zelf praat.
                  - action: "{{ repeat.item.telefoon }}"
                    data:
                      title: Voor morgen
                      message: "{{ tekst }}"
                      data: *melding_opties

    ###########################################################################
    ## Nieuw cijfer in Magister -> pushbericht naar de ouders
    ###########################################################################
    #
    # Vergelijkt per kind de cijferlijst met wat er al gemeld is (bewaard in
    # `sensor.magister_cijfers_al_gemeld`, hierboven) en meldt alleen het
    # verschil. Welke cijfers nieuw zijn bepaalt `melding_nieuwe_cijfers()` in
    # school.jinja; zie daar waarom tellen niet werkt en waarom zes-of-meer
    # tegelijk wordt genegeerd.
    #
    # WAAROM NIET "VORIGE STAND VAN DE SENSOR": de eerste versie deed dat, en
    # sloeg overgangen uit `unavailable` over om herstarts niet als een stapel
    # nieuwe cijfers te lezen. Maar de Magister-sensor valt een paar keer per
    # dag op `unavailable` als een ophaalronde mislukt, en het eerste echte
    # cijfer (13-10-2026) kwam precies binnen in de ronde daarna: 0 ->
    # unavailable -> 1. Overgeslagen. Met een eigen geheugen maakt het niet
    # meer uit hoe de sensor ertussendoor heeft gestaan.
    #
    # Daarom ook kijkt hij niet naar `trigger`: de state-trigger is er voor de
    # snelheid, het kwartierpatroon vangt alles wat die mist (een herstart, of
    # een kind dat in dezelfde ronde ververst werd).
    #
    # STAAT ER VOOR EEN KIND NOG NIETS IN HET GEHEUGEN (eerste keer na het
    # invoeren, of een nieuw kind), dan wordt de huidige lijst stil
    # vastgelegd. Anders krijg je bij een nieuw kind in één klap al zijn
    # cijfers van dit jaar.
    #
    # Alleen naar de ouders, niet naar het kind: die ziet het cijfer zelf al in
    # de Magister-app.
    #
    # Een tweede kind: zijn `sensor.magister_<kind>_cijfers` in de trigger én
    # in `kinderen`. De naam in de titel komt uit de sensor zelf (`kind_naam`).
    - id: school_nieuw_cijfer
      alias: School - Nieuw cijfer naar de ouders
      description: >-
        Stuurt de ouders een pushbericht zodra er in Magister een nieuw cijfer
        bij een kind staat, met vak, cijfer en waarvoor.
      mode: queued

      triggers:
        - trigger: state
          entity_id:
            - sensor.magister_logan_veen_cijfers
          attribute: cijfers
        - trigger: time_pattern
          minutes: /15

      actions:
        - variables:
            kinderen:
              - sensor.magister_logan_veen_cijfers

        - repeat:
            for_each: "{{ kinderen }}"
            sequence:
              - variables:
                  sensor: "{{ repeat.item }}"
                  geldig: >-
                    {{ states(sensor) not in ['unknown', 'unavailable']
                       and state_attr(sensor, 'cijfers') is list }}
                  gezien: "{{ (state_attr('sensor.magister_cijfers_al_gemeld', 'gezien') or {}).get(sensor) }}"
                  # Op één regel om dezelfde reden als `tekst` hierboven.
                  sleutels: "{% from 'school.jinja' import cijfer_sleutels %}{{ cijfer_sleutels(state_attr(sensor, 'cijfers')) }}"

              # `if/then` en geen `condition:`, anders breekt een kind zonder
              # nieuws de herhaling voor het kind erachter af.
              - if:
                  - condition: template
                    value_template: "{{ geldig and (gezien is none or (sleutels | sort) != (gezien | sort)) }}"
                then:
                  - variables:
                      naam: "{{ (state_attr(sensor, 'kind_naam') | default('', true)).split(' ') | first | default('Magister', true) }}"
                      tekst: "{% from 'school.jinja' import melding_nieuwe_cijfers %}{% if gezien is not none %}{{ melding_nieuwe_cijfers(sensor | regex_replace('_cijfers$', ''), gezien, state_attr(sensor, 'cijfers')) | trim }}{% endif %}"

                  # Eerst vastleggen, dan melden: lukt de push niet, dan liever
                  # één cijfer gemist dan elk kwartier dezelfde melding.
                  - event: magister_cijfers_gezien
                    event_data:
                      sensor: "{{ sensor }}"
                      sleutels: "{{ sleutels }}"

                  - if:
                      - condition: template
                        value_template: "{{ tekst != '' }}"
                    then:
                      - action: notify.mobile_devices_adults
                        data:
                          title: "{{ naam }} - {{ 'nieuwe cijfers' if '\n' in tekst else 'nieuw cijfer' }}"
                          message: "{{ tekst }}"
                          data:
                            group: school
                            url: /lovelace/school
                            clickAction: /lovelace/school
