# Hulp-sensoren voor de contextuele "pills" in de header van het Overzicht-dashboard.
dashboard_context_package:

  # sensor.time tikt elke minuut. De begroetingskaart in de kopbalk toont een
  # klok maar heeft verder geen entiteit, en button-card rendert alleen opnieuw
  # als zijn entity verandert. Op een wandpaneel dat dagen achtereen open staat
  # bleef die tijd daardoor staan op het moment van de laatste page-load.
  sensor:
    - platform: time_date
      display_options:
        - time

  template:
    # Het systeemdashboard rekent leeftijden uit met last_changed/last_updated.
    # Na een herstart staat álles op het herstartmoment, dus "9 uur weg" en
    # "9 uur niets gehoord" betekenen daar iets heel anders dan hetzelfde
    # getal op een draaiend systeem. Met dit tijdstempel kan de kaart die twee
    # uit elkaar houden. De uptime-integratie kan dit ook, maar is UI-only
    # (geen YAML-platform meer), en dit hoort bij deze config.
    #
    # Trigger-based, dus de waarde blijft staan tot de volgende start en
    # overleeft een template-reload. Direct na een schone installatie is hij
    # 'unknown' tot de eerste herstart; de kaarten vallen dan terug op de
    # gewone leeftijdsweergave.
    - trigger:
        - platform: homeassistant
          event: start
      sensor:
        - name: Home Assistant gestart
          unique_id: home_assistant_gestart
          icon: mdi:restart
          device_class: timestamp
          state: "{{ now().isoformat() }}"

    - binary_sensor:
        - name: Iemand onderweg naar huis
          unique_id: iemand_onderweg_naar_huis
          icon: mdi:car-arrow-right
          state: >
            {% set ns = namespace(any=false) %}
            {% for p, r in [
              ('person.robin_bohnen','sensor.robin_reistijd_naar_huis'),
              ('person.samantha_henkelman','sensor.samantha_reistijd_naar_huis'),
              ('person.emma_bohnen','sensor.emma_reistijd_naar_huis'),
              ('person.logan_veen','sensor.logan_reistijd_naar_huis') ] %}
              {% if states(p) not in ['home','unknown','unavailable']
                    and states(r) | float(-1) > 0 %}
                {% set ns.any = true %}
              {% endif %}
            {% endfor %}
            {{ ns.any }}

    # De deurbel-sensor van UniFi staat maar een paar tellen op 'on'. Te kort om
    # een pil in de kopbalk aan op te hangen: wie langsloopt heeft hem dan al
    # gemist. Deze blijft drie minuten staan, zodat je bij binnenkomst nog ziet
    # dát er is aangebeld en met één tik de camera erbij pakt.
    - trigger:
        - trigger: state
          entity_id: binary_sensor.g4_doorbell_voortuin_doorbell
          to: "on"
      binary_sensor:
        - name: Deurbel recent
          unique_id: deurbel_recent
          icon: mdi:doorbell-video
          state: "true"
          auto_off:
            minutes: 3

    # Systeemgezondheid in één entiteit: de state ('ok' of 'aandacht') stuurt de
    # zichtbaarheid van de pil, de attributen leveren de tekst. Bewust
    # TRIGGER-based: een gewone template-sensor die over `states` loopt abonneert
    # zich op élke statuswijziging in huis en zou bij elke lamp opnieuw rekenen.
    # Nu gebeurt dat eens per vijf minuten (en meteen als de zigbee-bridge omvalt).
    - trigger:
        - trigger: time_pattern
          minutes: "/5"
        - trigger: homeassistant
          event: start
        - trigger: state
          entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state_3
      sensor:
        - name: Systeem status
          unique_id: systeem_status
          icon: mdi:heart-pulse
          # WAAROM HIER NIET MEER "X ONBESCHIKBAAR" STAAT
          # Dat telde elke entiteit op `unavailable` en kwam op 473 uit. In dit
          # huis is dat geen storing maar de normale toestand: tientallen spots
          # hangen aan een wandschakelaar, en zodra die uit gaat verdwijnen de
          # lamp én al zijn knopjes, selects en getallen uit de lijst. Van de 77
          # volledig weggevallen apparaten waren er precies drie interessant.
          # Een getal dat altijd hoog staat lees je na een week niet meer.
          #
          # De pil noemt nu alleen dingen waar je iets mee kúnt:
          #   - de zigbee-bridge (die verklaart de rest meestal)
          #   - sensor.watchdog_kritieke_sensoren: de korte lijst waar de
          #     klimaat-, batterij- en alarmlogica op leunt, zie Watchdog.yaml
          #   - batterijapparaten die niets meer laten horen; die kun je niet
          #     met een schakelaar uitzetten, dus stil = stuk of leeg
          #   - batterijen die echt bijna leeg zijn
          #
          # Het ruwe totaal staat nog wel op de systeempagina
          # (dashboards/home/systeem.yaml), want dáár zoek je het op als je al
          # weet dát er iets is.
          state: >
            {% set kritiek = states('sensor.watchdog_kritieke_sensoren') | int(0) %}
            {% set zigbee = states('binary_sensor.zigbee2mqtt_bridge_connection_state_3')
                            in ['off', 'unavailable'] %}
            {% set ns = namespace(stil=0, leeg=0) %}
            {% for s in states.sensor %}
              {% if s.attributes.device_class | default('') == 'battery'
                    and 'state_of_charge' not in s.entity_id
                    and 'state_of_health' not in s.entity_id %}
                {% if s.state == 'unavailable' %}
                  {% set ns.stil = ns.stil + 1 %}
                {% elif s.state | float(101) <= 10 %}
                  {% set ns.leeg = ns.leeg + 1 %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ 'aandacht' if (kritiek > 0 or ns.stil > 0 or ns.leeg > 0 or zigbee) else 'ok' }}
          attributes:
            # Uit packages/9 - Other/Watchdog.yaml; die lijst is met naam en
            # toenaam samengesteld, dus elke 1 hierboven is er een die telt.
            kritiek: "{{ states('sensor.watchdog_kritieke_sensoren') | int(0) }}"
            # Een batterijsensor op `unavailable` betekent dat het hele apparaat
            # niets meer laat horen. Bij een raamcontact of bewegingsmelder is
            # dat geen "staat uit" maar een gat in je alarm of je brandmelding -
            # op 2026-08-06 stonden zo drie raamcontacten stil (badkamer en twee
            # in het kantoor) die in de all_windows-groep van Firealarm.yaml
            # zitten, en dat zag niemand omdat ze wegvielen tegen die 473.
            #
            # De uitzondering op `state_of_charge`/`state_of_health`: dat zijn
            # meetwaarden van de thuisaccu en de omvormer. Die hebben
            # device_class battery maar zijn geen cel die je vervangt; ze stonden
            # allebei op 0% en meldden dus eeuwig "2 lege batterijen".
            batterijen_stil: >
              {% set ns = namespace(n=0) %}
              {% for s in states.sensor %}
                {% if s.attributes.device_class | default('') == 'battery'
                      and 'state_of_charge' not in s.entity_id
                      and 'state_of_health' not in s.entity_id
                      and s.state == 'unavailable' %}
                  {% set ns.n = ns.n + 1 %}
                {% endif %}
              {% endfor %}
              {{ ns.n }}
            batterijen_stil_namen: >
              {% set ns = namespace(namen=[]) %}
              {% for s in states.sensor %}
                {% if s.attributes.device_class | default('') == 'battery'
                      and 'state_of_charge' not in s.entity_id
                      and 'state_of_health' not in s.entity_id
                      and s.state == 'unavailable' %}
                  {% set ns.namen = ns.namen + [s.name] %}
                {% endif %}
              {% endfor %}
              {{ ns.namen | join(', ') }}
            kritieke_batterijen: >
              {% set ns = namespace(n=0) %}
              {% for s in states.sensor %}
                {% if s.attributes.device_class | default('') == 'battery'
                      and 'state_of_charge' not in s.entity_id
                      and 'state_of_health' not in s.entity_id
                      and s.state != 'unavailable'
                      and s.state | float(101) <= 10 %}
                  {% set ns.n = ns.n + 1 %}
                {% endif %}
              {% endfor %}
              {{ ns.n }}
            # Updates zetten de pil bewust NIET aan: er is bijna altijd wel iets
            # bij te werken en dan staat hij permanent aan, waarna je hem niet
            # meer ziet. Ze verschijnen alleen als extra regel zodra er tóch al
            # iets stuk is.
            updates: >
              {% set ns = namespace(n=0) %}
              {% for s in states.update %}
                {% if s.state == 'on' %}{% set ns.n = ns.n + 1 %}{% endif %}
              {% endfor %}
              {{ ns.n }}
            zigbee: >
              {{ 'stuk' if states('binary_sensor.zigbee2mqtt_bridge_connection_state_3')
                 in ['off', 'unavailable'] else 'ok' }}
