ventilation_cooling_package:

  #############################################################################
  ## Ventilatoren schuur, meterkast & serverrack
  ##
  ## Doel: ventilator AAN als het warm is én ventileren écht koelt
  ## (aangevoerde lucht is kouder dan de ruimte), en UIT zodra afkoelen
  ## geen effect meer heeft (referentielucht niet meer koeler dan binnen)
  ## of de ruimte voldoende is afgekoeld.
  ##
  ## Extra UIT-reden: stagnatie. Draait de ventilator al een uur en is de
  ## ruimte in dat uur niet minstens X graden gezakt, dan levert draaien
  ## niets meer op -> uit, met een lockout zodat hij niet meteen weer
  ## aanslaat op de gewone AAN-voorwaarden.
  ##
  ## Schuur, meterkast en serverrack hebben elk hun eigen drempel-helpers.
  ##
  ## Het serverrack krijgt daarbovenop een kritieke drempel: daarboven altijd
  ## aan, ook als de garage niet koeler is, tijdens een lockout, en zonder
  ## stagnatie-uit. Plus aan als de rack-sensor een half uur geen meting
  ## geeft. De stagnatie-uit zelf doet hij wel (Robin, 19 september 2026):
  ## er staat weinig warmmakends in en de ventilatoren maken herrie.
  ##
  ## HANDBEDIENING SERVERRACK
  ## script.ventilation_serverrack_handbediening klapt de stekker om én zet
  ## input_datetime.ventilation_serverrack_handbediening_tot twee uur vooruit.
  ## Zolang die loopt doet de automatisering niets - alleen de kritieke
  ## drempel wint er nog van. Zonder die pauze zet de automatisering een
  ## handmatig aangezette ventilator binnen een kwartier weer uit, en dan lijkt
  ## de knop stuk. Dezelfde reden waarom de knop een script is en geen kale
  ## toggle op de stekker.
  ##
  ## Gebruikte entiteiten:
  ##   sensor.achtertuin_schuur_temperatuur_temperature             (temp schuur)
  ##   switch.achtertuin_achtertuin_schuur_stopcontact_ventilatoren (ventilatoren schuur)
  ##   sensor.meterkast_temperatuur_temperature                     (temp meterkast)
  ##   switch.meterkast_meterkast_stopcontact_ventilatoren          (ventilator meterkast)
  ##   sensor.garage_serverrack_temperatuur_temperature             (temp serverrack)
  ##   switch.garage_garage_stopcontact_serverrack_ventilatoren     (ventilatoren serverrack)
  ## Referentie schuur (blaast naar buiten): sensor.knmi_temperatuur
  ## Referentie meterkast (blaast de hal in): sensor.woonkamer_kamertemperatuur
  ## Referentie serverrack (zuigt garagelucht aan): sensor.garage_garage_temperatuur_temperatuur
  #############################################################################

  input_number:
    # Zelfde constructie als input_number.klimaat_config_versie: de drempels
    # hieronder hadden een `initial:` en die zet je eigen instellingen bij
    # élke herstart terug naar de fabriekswaarde. Nu vult de automatisering
    # onderaan ze eenmalig; alles wat je daarna zelf bijstelt blijft staan.
    ventilation_config_versie:
      name: "Ventilatie - Config versie"
      icon: mdi:counter
      min: 0
      max: 99
      step: 1
      mode: box

    ## --- Schuur ---
    # Warm genoeg om te willen koelen: ventilator mag pas hierboven aan
    ventilation_schuur_warm_threshold:
      name: "Ventilatie Schuur - Warm drempel (aan boven)"
      icon: mdi:thermometer-high
      min: 18
      max: 35
      step: 0.5
      unit_of_measurement: "°C"
      mode: box
    # Afgekoeld genoeg: onder deze binnentemperatuur nooit ventileren
    ventilation_schuur_cool_threshold:
      name: "Ventilatie Schuur - Koel drempel (uit onder)"
      icon: mdi:thermometer-low
      min: 15
      max: 30
      step: 0.5
      unit_of_measurement: "°C"
      mode: box
    # Hoeveel koeler moet de referentie zijn voordat ventileren nut heeft (aanzetten)
    ventilation_schuur_delta_on:
      name: "Ventilatie Schuur - Min. verschil om aan te zetten"
      icon: mdi:thermometer-plus
      min: 0.5
      max: 6
      step: 0.5
      unit_of_measurement: "°C"
      mode: box
    # Zodra het verschil hieronder zakt heeft ventileren geen effect meer (uit)
    ventilation_schuur_delta_off:
      name: "Ventilatie Schuur - Min. verschil om aan te houden"
      icon: mdi:thermometer-minus
      min: 0
      max: 4
      step: 0.5
      unit_of_measurement: "°C"
      mode: box

    ## --- Meterkast ---
    ventilation_meterkast_warm_threshold:
      name: "Ventilatie Meterkast - Warm drempel (aan boven)"
      icon: mdi:thermometer-high
      min: 18
      max: 35
      step: 0.5
      unit_of_measurement: "°C"
      mode: box
    ventilation_meterkast_cool_threshold:
      name: "Ventilatie Meterkast - Koel drempel (uit onder)"
      icon: mdi:thermometer-low
      min: 15
      max: 30
      step: 0.5
      unit_of_measurement: "°C"
      mode: box
    ventilation_meterkast_delta_on:
      name: "Ventilatie Meterkast - Min. verschil om aan te zetten"
      icon: mdi:thermometer-plus
      min: 0.5
      max: 6
      step: 0.5
      unit_of_measurement: "°C"
      mode: box
    ventilation_meterkast_delta_off:
      name: "Ventilatie Meterkast - Min. verschil om aan te houden"
      icon: mdi:thermometer-minus
      min: 0
      max: 4
      step: 0.5
      unit_of_measurement: "°C"
      mode: box

    ## --- Serverrack ---
    ventilation_serverrack_warm_threshold:
      name: "Ventilatie Serverrack - Warm drempel (aan boven)"
      icon: mdi:thermometer-high
      min: 20
      max: 45
      step: 0.5
      unit_of_measurement: "°C"
      mode: box
    ventilation_serverrack_cool_threshold:
      name: "Ventilatie Serverrack - Koel drempel (uit onder)"
      icon: mdi:thermometer-low
      min: 15
      max: 40
      step: 0.5
      unit_of_measurement: "°C"
      mode: box
    ventilation_serverrack_delta_on:
      name: "Ventilatie Serverrack - Min. verschil om aan te zetten"
      icon: mdi:thermometer-plus
      min: 0.5
      max: 6
      step: 0.5
      unit_of_measurement: "°C"
      mode: box
    ventilation_serverrack_delta_off:
      name: "Ventilatie Serverrack - Min. verschil om aan te houden"
      icon: mdi:thermometer-minus
      min: 0
      max: 4
      step: 0.5
      unit_of_measurement: "°C"
      mode: box
    # Boven deze racktemperatuur altijd aan, ongeacht de garagelucht
    ventilation_serverrack_critical_threshold:
      name: "Ventilatie Serverrack - Kritiek (altijd aan boven)"
      icon: mdi:thermometer-alert
      min: 25
      max: 50
      step: 0.5
      unit_of_measurement: "°C"
      mode: box

    ## --- Stagnatie ---
    # Minimale daling per uur die de ventilator moet realiseren. Zakt de
    # temperatuur in een uur minder dan dit, dan gaat hij uit.
    ventilation_schuur_stagnation_delta:
      name: "Ventilatie Schuur - Min. daling per uur"
      icon: mdi:trending-down
      min: 0.1
      max: 2
      step: 0.1
      unit_of_measurement: "°C"
      mode: box
    ventilation_meterkast_stagnation_delta:
      name: "Ventilatie Meterkast - Min. daling per uur"
      icon: mdi:trending-down
      min: 0.1
      max: 2
      step: 0.1
      unit_of_measurement: "°C"
      mode: box
    ventilation_serverrack_stagnation_delta:
      name: "Ventilatie Serverrack - Min. daling per uur"
      icon: mdi:trending-down
      min: 0.1
      max: 2
      step: 0.1
      unit_of_measurement: "°C"
      mode: box

  input_datetime:
    # Tot wanneer de ventilator niet opnieuw mag aanslaan na een stagnatie-uit.
    ventilation_schuur_lockout_until:
      name: "Ventilatie Schuur - Geblokkeerd tot"
      icon: mdi:timer-lock-outline
      has_date: true
      has_time: true
    ventilation_meterkast_lockout_until:
      name: "Ventilatie Meterkast - Geblokkeerd tot"
      icon: mdi:timer-lock-outline
      has_date: true
      has_time: true
    ventilation_serverrack_lockout_until:
      name: "Ventilatie Serverrack - Geblokkeerd tot"
      icon: mdi:timer-lock-outline
      has_date: true
      has_time: true
    # Tot wanneer de automatisering met haar handen van de rackventilatoren
    # afblijft, omdat jij ze zelf hebt omgezet.
    ventilation_serverrack_handbediening_tot:
      name: "Ventilatie Serverrack - Handbediening tot"
      icon: mdi:hand-back-right-outline
      has_date: true
      has_time: true

  sensor:
    # Temperatuurverandering over het laatste uur (laatste meting minus de
    # oudste in het venster). Negatief = de ruimte koelt af.
    - platform: statistics
      name: "Ventilatie Schuur Temp Verandering 1u"
      unique_id: ventilation_schuur_temp_change_1h
      entity_id: sensor.achtertuin_schuur_temperatuur_temperature
      state_characteristic: change
      sampling_size: 500
      max_age:
        hours: 1
    - platform: statistics
      name: "Ventilatie Meterkast Temp Verandering 1u"
      unique_id: ventilation_meterkast_temp_change_1h
      entity_id: sensor.meterkast_temperatuur_temperature
      state_characteristic: change
      sampling_size: 500
      max_age:
        hours: 1
    - platform: statistics
      name: "Ventilatie Serverrack Temp Verandering 1u"
      unique_id: ventilation_serverrack_temp_change_1h
      entity_id: sensor.garage_serverrack_temperatuur_temperature
      state_characteristic: change
      sampling_size: 500
      max_age:
        hours: 1

  automation:
    ###########################################################################
    ## Standaardwaarden invullen - zie de uitleg bij klimaat_standaardwaarden
    ## in packages/9 - Other/Klimaat Regime.yaml: alleen drempels die nog
    ## exact op hun minimum staan (nooit door jou gezet) worden gevuld, en
    ## alleen als het versienummer omhoog is gegaan.
    ###########################################################################
    - id: ventilation_standaardwaarden
      alias: Ventilatie - Standaardwaarden invullen
      description: Vult nieuwe drempels die nog nooit zijn ingesteld
      mode: single
      variables:
        # 1 = eerste set (de waardes die eerder als initial: in dit bestand
        # stonden)
        # 2 = serverrack erbij (19 september 2026)
        config_versie: 2
      triggers:
        - trigger: homeassistant
          event: start
      conditions:
        - condition: template
          value_template: >-
            {{ states('input_number.ventilation_config_versie') | int(0) < config_versie }}
      actions:
        - variables:
            standaard:
              input_number.ventilation_schuur_warm_threshold: 24
              input_number.ventilation_schuur_cool_threshold: 21
              input_number.ventilation_schuur_delta_on: 2
              input_number.ventilation_schuur_delta_off: 0.5
              input_number.ventilation_meterkast_warm_threshold: 22
              input_number.ventilation_meterkast_cool_threshold: 20
              input_number.ventilation_meterkast_delta_on: 1
              input_number.ventilation_meterkast_delta_off: 0.5
              input_number.ventilation_schuur_stagnation_delta: 0.2
              input_number.ventilation_meterkast_stagnation_delta: 0.2
              input_number.ventilation_serverrack_warm_threshold: 28
              input_number.ventilation_serverrack_cool_threshold: 25
              input_number.ventilation_serverrack_delta_on: 2
              input_number.ventilation_serverrack_delta_off: 0.5
              input_number.ventilation_serverrack_critical_threshold: 35
              input_number.ventilation_serverrack_stagnation_delta: 0.2
        - repeat:
            for_each: "{{ standaard.keys() | list }}"
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {% set nu = states(repeat.item) %}
                      {{ nu in ['unknown', 'unavailable', 'none', '']
                         or (nu | float(-9999)) == (state_attr(repeat.item, 'min') | float(-9998)) }}
                then:
                  - action: input_number.set_value
                    target:
                      entity_id: "{{ repeat.item }}"
                    data:
                      value: "{{ standaard[repeat.item] }}"
                    continue_on_error: true
        - action: input_number.set_value
          target:
            entity_id: input_number.ventilation_config_versie
          data:
            value: "{{ config_versie }}"
        - action: logbook.log
          data:
            name: Ventilatie
            message: >-
              Standaardwaarden bijgewerkt naar versie {{ config_versie }}.

    - id: ventilation_cooling_shed
      alias: Ventilation - Schuur ventilator koelen
      description: >-
        Zet de schuurventilator aan als de schuur warm is en de buitenlucht
        duidelijk koeler, en uit zodra ventileren niet meer koelt.
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - sensor.achtertuin_schuur_temperatuur_temperature
          id: eval
        - trigger: state
          entity_id:
            - sensor.knmi_temperatuur
          id: eval
        # Veiligheids-herevaluatie, ook als sensoren stil blijven
        - trigger: time_pattern
          minutes: "/15"
          id: eval
      conditions: []
      actions:
        - choose:
            # AAN: warm binnen én buiten voldoende koeler
            - conditions:
                - condition: template
                  value_template: >-
                    {% set binnen = states('sensor.achtertuin_schuur_temperatuur_temperature') | float(none) %}
                    {% set buiten = states('sensor.knmi_temperatuur') | float(none) %}
                    {% set warm = states('input_number.ventilation_schuur_warm_threshold') | float %}
                    {% set delta_on = states('input_number.ventilation_schuur_delta_on') | float %}
                    {{ binnen is not none and buiten is not none
                       and binnen >= warm and (binnen - buiten) >= delta_on }}
                - condition: state
                  entity_id: switch.achtertuin_achtertuin_schuur_stopcontact_ventilatoren
                  state: "off"
                # Niet aanzetten zolang de stagnatie-lockout loopt
                - condition: template
                  value_template: >-
                    {{ now().timestamp() >=
                       (state_attr('input_datetime.ventilation_schuur_lockout_until', 'timestamp') | float(0)) }}
              sequence:
                - action: switch.turn_on
                  target:
                    entity_id: switch.achtertuin_achtertuin_schuur_stopcontact_ventilatoren
            # UIT: afgekoeld genoeg of ventileren heeft geen effect meer
            - conditions:
                - condition: template
                  value_template: >-
                    {% set binnen = states('sensor.achtertuin_schuur_temperatuur_temperature') | float(none) %}
                    {% set buiten = states('sensor.knmi_temperatuur') | float(none) %}
                    {% set koel = states('input_number.ventilation_schuur_cool_threshold') | float %}
                    {% set delta_off = states('input_number.ventilation_schuur_delta_off') | float %}
                    {{ binnen is not none and buiten is not none
                       and (binnen <= koel or (binnen - buiten) <= delta_off) }}
                - condition: state
                  entity_id: switch.achtertuin_achtertuin_schuur_stopcontact_ventilatoren
                  state: "on"
              sequence:
                - action: switch.turn_off
                  target:
                    entity_id: switch.achtertuin_achtertuin_schuur_stopcontact_ventilatoren
            # UIT: draait al een uur maar koelt niet meer merkbaar
            - conditions:
                # Pas beoordelen na een vol uur draaien, anders kijkt het
                # meetvenster deels naar de periode vóór het aanzetten.
                - condition: state
                  entity_id: switch.achtertuin_achtertuin_schuur_stopcontact_ventilatoren
                  state: "on"
                  for:
                    hours: 1
                - condition: template
                  value_template: >-
                    {% set verandering = states('sensor.ventilatie_schuur_temp_verandering_1u') | float(none) %}
                    {% set stagnatie = states('input_number.ventilation_schuur_stagnation_delta') | float %}
                    {{ verandering is not none and verandering > (0 - stagnatie) }}
              sequence:
                - action: switch.turn_off
                  target:
                    entity_id: switch.achtertuin_achtertuin_schuur_stopcontact_ventilatoren
                # 2 uur niet opnieuw aanslaan, anders start hij bij de
                # volgende evaluatie meteen weer op de gewone AAN-voorwaarden.
                - action: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.ventilation_schuur_lockout_until
                  data:
                    datetime: "{{ (now() + timedelta(hours=2)).strftime('%Y-%m-%d %H:%M:%S') }}"

    - id: ventilation_cooling_meter_cupboard
      alias: Ventilation - Meterkast ventilator koelen
      description: >-
        Zet de meterkastventilator aan als de meterkast warm is en de hallucht
        koeler, en uit zodra ventileren niet meer koelt.
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - sensor.meterkast_temperatuur_temperature
          id: eval
        - trigger: state
          entity_id:
            - sensor.woonkamer_kamertemperatuur
          id: eval
        - trigger: time_pattern
          minutes: "/15"
          id: eval
      conditions: []
      actions:
        - choose:
            # AAN: warm in de meterkast én de hal voldoende koeler
            - conditions:
                - condition: template
                  value_template: >-
                    {% set binnen = states('sensor.meterkast_temperatuur_temperature') | float(none) %}
                    {% set buiten = states('sensor.woonkamer_kamertemperatuur') | float(none) %}
                    {% set warm = states('input_number.ventilation_meterkast_warm_threshold') | float %}
                    {% set delta_on = states('input_number.ventilation_meterkast_delta_on') | float %}
                    {{ binnen is not none and buiten is not none
                       and binnen >= warm and (binnen - buiten) >= delta_on }}
                - condition: state
                  entity_id: switch.meterkast_meterkast_stopcontact_ventilatoren
                  state: "off"
                # Niet aanzetten zolang de stagnatie-lockout loopt
                - condition: template
                  value_template: >-
                    {{ now().timestamp() >=
                       (state_attr('input_datetime.ventilation_meterkast_lockout_until', 'timestamp') | float(0)) }}
              sequence:
                - action: switch.turn_on
                  target:
                    entity_id: switch.meterkast_meterkast_stopcontact_ventilatoren
            # UIT: afgekoeld genoeg of ventileren heeft geen effect meer
            - conditions:
                - condition: template
                  value_template: >-
                    {% set binnen = states('sensor.meterkast_temperatuur_temperature') | float(none) %}
                    {% set buiten = states('sensor.woonkamer_kamertemperatuur') | float(none) %}
                    {% set koel = states('input_number.ventilation_meterkast_cool_threshold') | float %}
                    {% set delta_off = states('input_number.ventilation_meterkast_delta_off') | float %}
                    {{ binnen is not none and buiten is not none
                       and (binnen <= koel or (binnen - buiten) <= delta_off) }}
                - condition: state
                  entity_id: switch.meterkast_meterkast_stopcontact_ventilatoren
                  state: "on"
              sequence:
                - action: switch.turn_off
                  target:
                    entity_id: switch.meterkast_meterkast_stopcontact_ventilatoren
            # UIT: draait al een uur maar koelt niet meer merkbaar
            - conditions:
                - condition: state
                  entity_id: switch.meterkast_meterkast_stopcontact_ventilatoren
                  state: "on"
                  for:
                    hours: 1
                - condition: template
                  value_template: >-
                    {% set verandering = states('sensor.ventilatie_meterkast_temp_verandering_1u') | float(none) %}
                    {% set stagnatie = states('input_number.ventilation_meterkast_stagnation_delta') | float %}
                    {{ verandering is not none and verandering > (0 - stagnatie) }}
              sequence:
                - action: switch.turn_off
                  target:
                    entity_id: switch.meterkast_meterkast_stopcontact_ventilatoren
                - action: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.ventilation_meterkast_lockout_until
                  data:
                    datetime: "{{ (now() + timedelta(hours=2)).strftime('%Y-%m-%d %H:%M:%S') }}"

    - id: ventilation_cooling_server_rack
      alias: Ventilation - Serverrack ventilatoren koelen
      description: >-
        Zet de rackventilatoren aan als het rack warm is en de garagelucht
        koeler, of altijd boven de kritieke drempel; uit zodra het rack is
        afgekoeld, ventileren niet meer koelt of een uur draaien niets oplevert.
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - sensor.garage_serverrack_temperatuur_temperature
          id: eval
        - trigger: state
          entity_id:
            - sensor.garage_garage_temperatuur_temperatuur
          id: eval
        - trigger: time_pattern
          minutes: "/15"
          id: eval
        # Geen meting meer uit het rack: liever onnodig blazen dan blind
        # warm laten lopen.
        - trigger: state
          entity_id:
            - sensor.garage_serverrack_temperatuur_temperature
          to:
            - unavailable
            - unknown
          for:
            minutes: 30
          id: sensor_weg
      conditions: []
      actions:
        - choose:
            # AAN: rack-sensor al een half uur zonder meting
            - conditions:
                - condition: trigger
                  id: sensor_weg
                # Niets doen zolang de handbediening loopt
                - condition: template
                  value_template: >-
                    {{ now().timestamp() >=
                       (state_attr('input_datetime.ventilation_serverrack_handbediening_tot', 'timestamp') | float(0)) }}
                - condition: state
                  entity_id: switch.garage_garage_stopcontact_serverrack_ventilatoren
                  state: "off"
              sequence:
                - action: switch.turn_on
                  target:
                    entity_id: switch.garage_garage_stopcontact_serverrack_ventilatoren
            # AAN: boven de kritieke drempel - ook tijdens een lockout
            - conditions:
                - condition: template
                  value_template: >-
                    {% set binnen = states('sensor.garage_serverrack_temperatuur_temperature') | float(none) %}
                    {% set kritiek = states('input_number.ventilation_serverrack_critical_threshold') | float %}
                    {{ binnen is not none and binnen >= kritiek }}
                - condition: state
                  entity_id: switch.garage_garage_stopcontact_serverrack_ventilatoren
                  state: "off"
              sequence:
                - action: switch.turn_on
                  target:
                    entity_id: switch.garage_garage_stopcontact_serverrack_ventilatoren
            # AAN: warm én garage voldoende koeler
            - conditions:
                - condition: template
                  value_template: >-
                    {% set binnen = states('sensor.garage_serverrack_temperatuur_temperature') | float(none) %}
                    {% set buiten = states('sensor.garage_garage_temperatuur_temperatuur') | float(none) %}
                    {% set warm = states('input_number.ventilation_serverrack_warm_threshold') | float %}
                    {% set delta_on = states('input_number.ventilation_serverrack_delta_on') | float %}
                    {{ binnen is not none and buiten is not none
                       and binnen >= warm and (binnen - buiten) >= delta_on }}
                - condition: template
                  value_template: >-
                    {{ now().timestamp() >=
                       (state_attr('input_datetime.ventilation_serverrack_lockout_until', 'timestamp') | float(0)) }}
                # Niets doen zolang de handbediening loopt
                - condition: template
                  value_template: >-
                    {{ now().timestamp() >=
                       (state_attr('input_datetime.ventilation_serverrack_handbediening_tot', 'timestamp') | float(0)) }}
                - condition: state
                  entity_id: switch.garage_garage_stopcontact_serverrack_ventilatoren
                  state: "off"
              sequence:
                - action: switch.turn_on
                  target:
                    entity_id: switch.garage_garage_stopcontact_serverrack_ventilatoren
            # UIT: afgekoeld genoeg of ventileren heeft geen effect meer -
            # maar nooit boven de kritieke drempel
            - conditions:
                - condition: template
                  value_template: >-
                    {% set binnen = states('sensor.garage_serverrack_temperatuur_temperature') | float(none) %}
                    {% set buiten = states('sensor.garage_garage_temperatuur_temperatuur') | float(none) %}
                    {% set koel = states('input_number.ventilation_serverrack_cool_threshold') | float %}
                    {% set kritiek = states('input_number.ventilation_serverrack_critical_threshold') | float %}
                    {% set delta_off = states('input_number.ventilation_serverrack_delta_off') | float %}
                    {{ binnen is not none and buiten is not none
                       and binnen < kritiek
                       and (binnen <= koel or (binnen - buiten) <= delta_off) }}
                # Niets doen zolang de handbediening loopt
                - condition: template
                  value_template: >-
                    {{ now().timestamp() >=
                       (state_attr('input_datetime.ventilation_serverrack_handbediening_tot', 'timestamp') | float(0)) }}
                - condition: state
                  entity_id: switch.garage_garage_stopcontact_serverrack_ventilatoren
                  state: "on"
              sequence:
                - action: switch.turn_off
                  target:
                    entity_id: switch.garage_garage_stopcontact_serverrack_ventilatoren
            # UIT: draait al een uur maar koelt niet meer merkbaar - niet
            # boven de kritieke drempel
            - conditions:
                - condition: state
                  entity_id: switch.garage_garage_stopcontact_serverrack_ventilatoren
                  state: "on"
                  for:
                    hours: 1
                - condition: template
                  value_template: >-
                    {% set binnen = states('sensor.garage_serverrack_temperatuur_temperature') | float(none) %}
                    {% set kritiek = states('input_number.ventilation_serverrack_critical_threshold') | float %}
                    {% set verandering = states('sensor.ventilatie_serverrack_temp_verandering_1u') | float(none) %}
                    {% set stagnatie = states('input_number.ventilation_serverrack_stagnation_delta') | float %}
                    {{ binnen is not none and binnen < kritiek
                       and verandering is not none and verandering > (0 - stagnatie) }}
                # Niets doen zolang de handbediening loopt
                - condition: template
                  value_template: >-
                    {{ now().timestamp() >=
                       (state_attr('input_datetime.ventilation_serverrack_handbediening_tot', 'timestamp') | float(0)) }}
              sequence:
                - action: switch.turn_off
                  target:
                    entity_id: switch.garage_garage_stopcontact_serverrack_ventilatoren
                - action: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.ventilation_serverrack_lockout_until
                  data:
                    datetime: "{{ (now() + timedelta(hours=2)).strftime('%Y-%m-%d %H:%M:%S') }}"

  script:
    ###########################################################################
    ## HANDBEDIENING RACKVENTILATOREN
    ## De knoppen op het dashboard roepen dit script aan; de stekker zelf
    ## omzetten werkt ook, maar dan zet de automatisering hem bij de volgende
    ## evaluatie gewoon weer terug.
    ###########################################################################
    ventilation_serverrack_handbediening:
      alias: Ventilatie Serverrack - Handbediening
      description: >-
        Klapt de rackventilatoren om en laat de automatisering er twee uur van
        af. Daarna neemt ze het vanzelf weer over.
      icon: mdi:fan
      mode: single
      fields:
        uren:
          name: Uren
          description: Hoe lang de automatisering er vanaf blijft
          required: false
          example: 2
          default: 2
          selector:
            number:
              min: 0.5
              max: 12
              step: 0.5
      sequence:
        - action: switch.toggle
          target:
            entity_id: switch.garage_garage_stopcontact_serverrack_ventilatoren
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.ventilation_serverrack_handbediening_tot
          data:
            datetime: >-
              {{ (now() + timedelta(hours=(uren | default(2)) | float(2))).strftime('%Y-%m-%d %H:%M:%S') }}
        # Een stagnatie-lockout van eerder hoort hier te vervallen: je hebt nu
        # zelf gezegd wat er moet gebeuren. Bleef hij staan, dan zou de
        # automatisering na de handbediening alsnog uren niet mogen aanzetten.
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.ventilation_serverrack_lockout_until
          data:
            datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        - action: logbook.log
          data:
            name: Ventilatie serverrack
            message: >-
              Handbediening: ventilatoren
              {{ 'aan' if is_state('switch.garage_garage_stopcontact_serverrack_ventilatoren', 'on') else 'uit' }}
              gezet, automatisering pauzeert {{ (uren | default(2)) | float(2) }} uur.

    # Terug naar automatisch zonder te wachten: handbediening meteen aflopen
    # laten. De eerstvolgende evaluatie (elk kwartier, of eerder bij een nieuwe
    # meting) beslist dan weer zelf.
    ventilation_serverrack_automatisch:
      alias: Ventilatie Serverrack - Weer automatisch
      icon: mdi:autorenew
      mode: single
      sequence:
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.ventilation_serverrack_handbediening_tot
          data:
            datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        - action: automation.trigger
          target:
            entity_id: automation.ventilation_serverrack_ventilatoren_koelen
          data:
            skip_condition: true
