car_package:
  input_number:
    lease_contract_kms:
      name: Lease - Contract KMs
      min: -1000
      max: 999999
      step: 41
      unit_of_measurement: KM
      icon: mdi:car-info

  template:
    - sensor:
        - name: "Car - Next location"
          state: "{{ state_attr('calendar.auto','location') }}"
          unique_id: car_next_location
          # Zonder deze guard werd de sensor letterlijk 'None' zodra er geen
          # agenda-afspraak met locatie was, en dat ging als zoekterm naar de
          # geocoder hieronder. Die vond er prompt iets bij: de kaart toonde
          # "Unknown, New Providence, Bahamas" als volgende bestemming.
          # Zelfde opzet als "Car - Departing in hours" hieronder.
          availability: >-
            {{ state_attr('calendar.auto', 'location') not in [none, ''] }}
        # Wat de gereden kilometers tot nu toe extra kosten: het verschil
        # tussen de echte kilometerstand en het budget dat het contract tot
        # vandaag toestaat (`lease_contract_kms`, elke nacht +41 door
        # `car_lease_allowed_kms` hieronder), maal € 0,12 per kilometer.
        # Negatief = je zit eronder; dat is speling, geen geld terug.
        #
        # Dezelfde availability-guard als de twee sensoren hieromheen: zonder
        # die guard maakt `| int` van een `unavailable` kilometerstand er stil
        # een 0 van, en dan staat er ineens een rekening van ruim tweeduizend
        # euro omdat het hele budget als overschrijding wordt gelezen.
        - name: "Car - Price additional KM's"
          state: "{{ ((states('sensor.hrh85f_kilometerstand') | int - states('input_number.lease_contract_kms') | int) * 0.12) | round(2) }}"
          unique_id: car_price_add_kms
          unit_of_measurement: EUR
          availability: >-
            {{ has_value('sensor.hrh85f_kilometerstand')
               and has_value('input_number.lease_contract_kms') }}
        - name: "Car - Departing in hours"
          state: >-
            {% set start = state_attr('calendar.auto', 'start_time') %}
            {% if start %}
              {{ ((as_timestamp(start) - as_timestamp(now())) / 3600) | int }}
            {% else %}
              0
            {% endif %}
          availability: "{{ state_attr('calendar.auto', 'start_time') is not none }}"
          unit_of_measurement: "hour"
          unique_id: car_departing_in_hours

        # ------------------------------------------------------------------
        # VERBRUIK IN kWh PER 100 KM
        #
        # De drie sensoren hieronder delen een kWh-teller door een km-teller.
        # Die tellers staan verderop in dit bestand (`Car - Energy used` en
        # `Car - Distance driven`) en worden opgeteld uit het accupercentage
        # en de kilometerstand, want de Renault levert zelf geen energiemeting.
        # Lees daar waarom dit een schatting is en geen meting.
        #
        # WAAROM ELKE SENSOR EEN MINIMUM AAN KILOMETERS EIST
        # Onder een paar tientallen kilometers is dit cijfer onbruikbaar. Uit
        # de historie van 16-08 t/m 25-08-2026, met dezelfde rekenwijze:
        #
        #   17-08  56 km -> 17,1      20-08  11 km -> 27,3
        #   18-08  59 km -> 18,3      21-08  11 km -> 38,2
        #   23-08  79 km -> 17,5      25-08  11 km ->  5,5
        #   24-08  66 km -> 16,4      16-08   9 km -> 13,3
        #
        # De lange dagen liggen binnen twee punten van elkaar, de korte dagen
        # schieten van 5 naar 38. Dat komt niet doordat hij die dagen anders
        # reed. Percentage en kilometerstand komen op hun eigen momenten
        # binnen (elke ~6 minuten aan de lader, elke ~30 minuten onderweg), en
        # valt de laatste percentagemelding van een rit net na middernacht en
        # die van de kilometers ervoor, dan staan de kWh's op de ene dag en de
        # km's op de andere. Bij 60 km verdwijnt dat in het totaal, bij 11 km
        # is het de helft van het cijfer.
        #
        # Onder de drempel is de sensor `unavailable`. Dat is de bedoeling: de
        # grafiek tekent dan geen staaf, en een gat is eerlijker dan een
        # verzonnen getal.
        - name: "Car - Consumption today"
          unique_id: car_consumption_today
          unit_of_measurement: "kWh/100km"
          state_class: measurement
          state: >-
            {{ ((states('sensor.car_energy_today') | float)
                / (states('sensor.car_distance_today') | float) * 100) | round(1) }}
          availability: >-
            {{ has_value('sensor.car_energy_today')
               and has_value('sensor.car_distance_today')
               and states('sensor.car_distance_today') | float(0) >= 25 }}

        # Een maand is lang genoeg om de dagruis eruit te middelen, dus hier
        # mag de drempel laag: 100 km is de eerste week van een gemiddelde
        # maand. Dit is het cijfer waarmee je zomer en winter vergelijkt.
        - name: "Car - Consumption this month"
          unique_id: car_consumption_this_month
          unit_of_measurement: "kWh/100km"
          state_class: measurement
          state: >-
            {{ ((states('sensor.car_energy_this_month') | float)
                / (states('sensor.car_distance_this_month') | float) * 100) | round(1) }}
          availability: >-
            {{ has_value('sensor.car_energy_this_month')
               and has_value('sensor.car_distance_this_month')
               and states('sensor.car_distance_this_month') | float(0) >= 100 }}

        # Alles sinds de tellers zijn gaan lopen. Geen venster, geen reset:
        # dit is het anker waar de dag- en maandcijfers tegen afgezet worden.
        # De tellers beginnen op nul zodra dit pakket voor het eerst laadt, dus
        # de eerste week staat hier nog niets - dat klopt en gaat vanzelf over.
        - name: "Car - Consumption average"
          unique_id: car_consumption_average
          unit_of_measurement: "kWh/100km"
          state_class: measurement
          state: >-
            {{ ((states('sensor.car_energy_used') | float)
                / (states('sensor.car_distance_driven') | float) * 100) | round(1) }}
          availability: >-
            {{ has_value('sensor.car_energy_used')
               and has_value('sensor.car_distance_driven')
               and states('sensor.car_distance_driven') | float(0) >= 100 }}

    # ==========================================================================
    # DE TWEE VERBRUIKSTELLERS
    #
    # De Renault-integratie levert geen enkele energiemeting. De kWh-sensor die
    # er wel bij zit (`sensor.hrh85f_battery_available_energy`) staat permanent
    # op `unknown` en is dus nutteloos. Wat er wel is: een accupercentage en een
    # kilometerstand, allebei bijgewerkt zodra de auto zich meldt.
    #
    # Daaruit valt het verbruik op te tellen. Elke DALING van het percentage is
    # verbruikte energie, elke STIJGING van de kilometerstand is afstand. Twee
    # tellers die alleen omhoog gaan; de verhouding ertussen is het verbruik.
    # Over 16-08 t/m 25-08-2026 gaf dat 355 km op 63,6 kWh = 17,9 kWh/100 km,
    # een geloofwaardig cijfer voor deze auto.
    #
    # DIT IS EEN SCHATTING, GEEN METING - zelfde categorie als de
    # powercalc-sensoren elders in deze config. Er wordt geen stroom gemeten;
    # er wordt een percentage vermenigvuldigd met een aangenomen capaciteit.
    # De kleinste stap die deze teller kan zien is 1% = 0,6 kWh. Gebruik hem
    # voor de trend, niet als bewijs voor een los ritje. Dat is ook de reden
    # dat de sensoren hierboven een minimum aan kilometers eisen.
    #
    # Beide sensoren zijn trigger-based en houden hun eigen vorige stand bij via
    # `this.state`. Trigger-based template-entiteiten herstellen die stand na een
    # herstart, dus de tellers lopen door. Gaat er ooit toch een verloren, dan
    # begint hij bij nul en vangt `state_class: total_increasing` die val op.
    - trigger:
        # `not_from` is hier het hele punt en niet alleen netheid. De Renault
        # valt regelmatig even weg (17-08 04:16, 18-08 17:58, 21-08 01:13 in de
        # historie) en komt daarna terug op dezelfde waarde. Zonder deze filter
        # ziet de teller `unavailable -> 100` als een sprong en gaat rekenen op
        # een getal dat geen accustand is.
        - trigger: state
          entity_id: sensor.hrh85f_batterij
          not_from:
            - unknown
            - unavailable
          not_to:
            - unknown
            - unavailable
        # ZONDER DEZE TWEE KOMT DE TELLER NOOIT UIT `unknown`
        # De startwaarde hieronder zit in de DEFAULT van `this.state`, en die
        # wordt pas gelezen als er een trigger vuurt. Na de herstart van
        # 26-08 09:13 en de reload van 09:21 stond de accu op 100% en hing de
        # auto niet aan de lader: `sensor.hrh85f_batterij` veranderde dus niet,
        # de trigger vuurde niet, en de teller bleef `unknown`. Daarmee vielen
        # de utility_meters om ("received an invalid new state ... unknown") en
        # bleef het hele Verbruik-blok op het dashboard leeg.
        #
        # `homeassistant start` vangt de herstart. De time_pattern vangt de
        # reload - `template.reload` geeft geen start-event, en de teller mag
        # daar geen tien uur op wachten. Beide komen bij `was < 0` uit en geven
        # `vorige` onveranderd terug, dus de recorder ziet dezelfde state en
        # slaat hem over: dit kost niets en telt niets dubbel.
        - trigger: homeassistant
          event: start
        - trigger: time_pattern
          minutes: "/10"
      sensor:
        - name: "Car - Energy used"
          unique_id: car_energy_used
          unit_of_measurement: kWh
          state_class: total_increasing
          # Bewust GEEN `device_class: energy`. Met die class biedt HA deze
          # teller aan als bron voor het energiedashboard, en daar hoort alleen
          # echt gemeten energie in. Dit is een som van percentagestapjes.
          state: >-
            {# Bruikbare accucapaciteit van de Megane E-Tech EV60. Dat het de
               EV60 is en niet de EV40 blijkt van twee kanten: 360 km bereik bij
               100%, en het verbruik dat er dan uit rolt (17,9 kWh/100 km). Met
               40 kWh zou daar 11,9 uit komen en dat rijdt geen Megane. Loopt de
               accu na jaren terug, dan pas je dit getal aan; de al opgetelde
               kWh's worden niet herrekend, dat hoort ook zo. #}
            {% set capaciteit = 60 %}
            {# STARTWAARDE UIT DE HISTORIE
               Deze twee tellers zijn op 26-08-2026 aangezet, maar de recorder
               had toen al tien dagen accupercentage en kilometerstand staan.
               Diezelfde rekenwijze losgelaten op 16-08 t/m 25-08-2026 gaf
               63,60 kWh over 355,0 km (= 17,9 kWh/100 km). Dat is hier de
               startwaarde, zodat het gemiddelde meteen klopt in plaats van pas
               na een week rijden.

               Waarom als DEFAULT van `this.state` en niet eenmalig via de API:
               een state die je met POST /api/states in de state machine zet,
               overleeft geen onverwachte herstart - dat is op 26-08 precies
               gebeurd, de teller stond daarna weer op `unknown`. Zo staat de
               startwaarde in de config en kan hij niet meer zoekraken.

               Valt de teller ooit terug op deze waarde nadat hij verder was,
               dan ziet `total_increasing` dat als een reset en vangt het op -
               net zoals bij de 0 die hier eerst stond, maar met een getal dat
               tenminste ergens op slaat. #}
            {% set vorige = this.state | float(63.6) %}
            {# De triggers hierboven zijn niet allemaal state-triggers, en bij een
               start- of time_pattern-trigger BESTAAT `trigger.from_state` niet.
               `trigger.from_state.state` geeft dan een Undefined, en `| float(-1)`
               vangt dat NIET op - de float-filter roept `__float__` aan en dat
               gooit alsnog een UndefinedError, waarna de hele sensor omvalt.
               Vandaar eerst de `is defined`-test en pas daarna de filter; `none`
               loopt wel netjes in de default van `float`. #}
            {% set from_s = trigger.from_state.state
                 if trigger.from_state is defined and trigger.from_state is not none
                 else none %}
            {% set to_s = trigger.to_state.state
                 if trigger.to_state is defined and trigger.to_state is not none
                 else none %}
            {% set was = from_s | float(-1) %}
            {% set nu = to_s | float(-1) %}
            {% set daling = was - nu %}
            {% if was < 0 or nu < 0 %}
              {{ vorige }}
            {% elif is_state('binary_sensor.hrh85f_stekker', 'on') %}
              {# Aan de stekker telt een daling niet mee. Hij hangt hier vaak
                 uren ingeplugd zonder te laden - het laadschema start pas om
                 22:00 (packages/3 - Outside/Carport/Charging Station.yaml) - en
                 wat de auto in die uren aan standby wegtrekt is geen rijden.
                 In de veertien dagen historie kwam zo'n daling nul keer voor,
                 dus dit is puur een vangnet.

                 Let op de vorm: alleen overslaan als de stekker AANTOONBAAR
                 aan zit. Stond hier `not is_state(..., 'off')`, dan zou een
                 stekkersensor die los `unavailable` wordt de hele telling
                 stilzetten, en dan leest het verbruik straks te laag zonder
                 dat iets dat verraadt. Een stille nul is erger dan een
                 standby-procentje dat meelift. #}
              {{ vorige }}
            {% elif daling <= 0 or daling > 60 %}
              {# Stijgingen zijn laden en horen hier niet. De bovengrens vangt
                 glitches: 60 procentpunt in een enkele melding is geen rit
                 maar een integratie die iets raars doorgeeft. #}
              {{ vorige }}
            {% else %}
              {{ (vorige + daling * capaciteit / 100) | round(3) }}
            {% endif %}

    - trigger:
        - trigger: state
          entity_id: sensor.hrh85f_kilometerstand
          not_from:
            - unknown
            - unavailable
          not_to:
            - unknown
            - unavailable
        # Zelfde reden als bij de kWh-teller hierboven: zonder een trigger die
        # ook zonder ritje vuurt, blijft deze teller na een herstart of reload
        # op `unknown` staan en start zijn utility_meter niet.
        - trigger: homeassistant
          event: start
        - trigger: time_pattern
          minutes: "/10"
      sensor:
        - name: "Car - Distance driven"
          unique_id: car_distance_driven
          unit_of_measurement: km
          state_class: total_increasing
          state: >-
            {# STARTWAARDE UIT DE HISTORIE
               Deze twee tellers zijn op 26-08-2026 aangezet, maar de recorder
               had toen al tien dagen accupercentage en kilometerstand staan.
               Diezelfde rekenwijze losgelaten op 16-08 t/m 25-08-2026 gaf
               63,60 kWh over 355,0 km (= 17,9 kWh/100 km). Dat is hier de
               startwaarde, zodat het gemiddelde meteen klopt in plaats van pas
               na een week rijden.

               Waarom als DEFAULT van `this.state` en niet eenmalig via de API:
               een state die je met POST /api/states in de state machine zet,
               overleeft geen onverwachte herstart - dat is op 26-08 precies
               gebeurd, de teller stond daarna weer op `unknown`. Zo staat de
               startwaarde in de config en kan hij niet meer zoekraken.

               Valt de teller ooit terug op deze waarde nadat hij verder was,
               dan ziet `total_increasing` dat als een reset en vangt het op -
               net zoals bij de 0 die hier eerst stond, maar met een getal dat
               tenminste ergens op slaat. #}
            {% set vorige = this.state | float(355.0) %}
            {# De triggers hierboven zijn niet allemaal state-triggers, en bij een
               start- of time_pattern-trigger BESTAAT `trigger.from_state` niet.
               `trigger.from_state.state` geeft dan een Undefined, en `| float(-1)`
               vangt dat NIET op - de float-filter roept `__float__` aan en dat
               gooit alsnog een UndefinedError, waarna de hele sensor omvalt.
               Vandaar eerst de `is defined`-test en pas daarna de filter; `none`
               loopt wel netjes in de default van `float`. #}
            {% set from_s = trigger.from_state.state
                 if trigger.from_state is defined and trigger.from_state is not none
                 else none %}
            {% set to_s = trigger.to_state.state
                 if trigger.to_state is defined and trigger.to_state is not none
                 else none %}
            {% set was = from_s | float(-1) %}
            {% set nu = to_s | float(-1) %}
            {% set stap = nu - was %}
            {# Bovengrens van 2000: onderweg meldt de auto elke ~30 minuten, en
               ook na een week zonder bereik komt daar geen tweeduizend
               kilometer uit. Zo'n sprong is een teller die is teruggezet of een
               waarde uit een ander voertuig, niet een rit. #}
            {% if was < 0 or nu < 0 or stap <= 0 or stap > 2000 %}
              {{ vorige }}
            {% else %}
              {{ (vorige + stap) | round(1) }}
            {% endif %}


  # --------------------------------------------------------------------------
  # Dag- en maandvensters over de twee verbruikstellers hierboven. De tellers
  # zelf lopen alleen omhoog en zijn daarmee onleesbaar op een dashboard; wat
  # je wil zien is "hoeveel deze dag" en "hoeveel deze maand", en dat is
  # precies waar utility_meter voor is. De verhouding tussen elk paar is het
  # verbruik - zie de drie `Car - Consumption ...` sensoren hierboven.
  #
  # Beide helften van een paar knippen op hetzelfde moment (middernacht, de
  # eerste van de maand), dus een rit die over de grens loopt verdeelt zijn
  # kWh's en zijn kilometers over dezelfde twee dagen. De verhouding blijft
  # daardoor kloppen, ook al valt de rit in tweeen.
  utility_meter:
    car_energy_today:
      name: Car - Energy today
      unique_id: car_energy_today
      source: sensor.car_energy_used
      cycle: daily
    car_distance_today:
      name: Car - Distance today
      unique_id: car_distance_today
      source: sensor.car_distance_driven
      cycle: daily
    car_energy_this_month:
      name: Car - Energy this month
      unique_id: car_energy_this_month
      source: sensor.car_energy_used
      cycle: monthly
    car_distance_this_month:
      name: Car - Distance this month
      unique_id: car_distance_this_month
      source: sensor.car_distance_driven
      cycle: monthly

  input_text:
    geoapify_api_key:
      name: Geoapify API Key
      initial: !secret geoapify_api_key
      mode: password

  sensor:
    - platform: rest
      name: car_next_location_geo
      # EEN DAG, NIET DE STANDAARD DERTIG SECONDEN
      # Zonder scan_interval pollt een rest-sensor elke 30 seconden: bijna 3.000
      # Geoapify-aanroepen per dag, en dat voor een adres dat alleen verandert
      # als er een andere afspraak in de agenda komt. Precies dát moment vangt
      # `car_next_geolocation_fetch` hieronder al af met een update_entity, dus
      # dit getal is puur een vangnet.
      scan_interval: 86400
      # Twee vangnetten: geen bruikbare zoekterm, of een geocoder die niets
      # vindt (dan is `results` leeg en klaagde het log met "JSON result was not
      # a dictionary or list with 0th element a dictionary").
      value_template: >-
        {% if states('sensor.car_next_location')
              in ['unknown', 'unavailable', 'none', 'None', ''] %}
          {{ none }}
        {% elif (value_json.results | default([]) | count) > 0 %}
          {{ value_json.results[0].formatted }}
        {% else %}
          {{ none }}
        {% endif %}
      json_attributes_path: "$.results[0]"
      json_attributes:
        - lat
        - lon
        - district
        - city
        - postcode
        - street
        - housenumber
        - state
        - country
        - country_code
      verify_ssl: true
      resource_template: >
        {{
          "https://api.geoapify.com/v1/geocode/search?text="
          + states('sensor.car_next_location') | urlencode
          + "&apiKey=" + states('input_text.geoapify_api_key')
          + "&format=json"
        }}

  automation:
    - id: car_next_geolocation_fetch
      alias: Car - Update geolocation from calendar
      description: "Car - Update geo location when calendar updates"
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - calendar.auto
          attribute: location
      conditions: []
      actions:
        - action: homeassistant.update_entity
          metadata: {}
          data:
            entity_id:
              - sensor.car_next_location_geo

    - id: car_lease_allowed_kms
      alias: Car - Update lease KMs till today
      description: "Update the KMs to today (with +41 per day)s"
      mode: single
      triggers:
        - trigger: time
          at: "00:01:00"
      conditions: []
      actions:
        - action: input_number.increment
          target:
            entity_id:
              - input_number.lease_contract_kms
          data: {}
