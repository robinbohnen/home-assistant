##############################################################################
## THREAD - merken dat de border router eruit ligt, en hem terugzetten
##############################################################################
##
## WAT ER OP 5 AUGUSTUS 2026 GEBEURDE
## De radio van de OpenThread Border Router zit niet in de HA-machine maar op
## het netwerk: een SLZB-MR3 op 192.168.2.207, waar de add-on via socat mee
## praat op poort 6638. Om 18:01 gaf de RCP het op ("Too many rcp failures,
## exiting"), waarna s6 de container stopte. Daarna bleef de add-on herstarten,
## maar die host was op dat moment onbereikbaar ("No route to host"), dus kwam
## hij niet meer op. Resultaat: van 18:02 tot de volgende ochtend was élk
## Matter-over-Thread apparaat weg. De automatiseringen liepen gewoon door -
## `light.turn_on` en `switch.turn_off` werden netjes aangeroepen en verdwenen
## in het niets. Dat is het venijnige: in de trace is niets te zien.
##
## WAT HET UITEINDELIJK OPLOSTE, EN IN WELKE VOLGORDE
## Alleen de add-on herstarten was niet genoeg - dat had de Supervisor de hele
## nacht al gedaan. Wat wél werkte:
##
##   1. `button.slzb_mr3_core_restart` indrukken (de coördinator zelf herstarten)
##   2. daarna pas de OTBR-add-on opnieuw starten
##   3. een paar minuten wachten tot de apparaten zich weer melden
##
## Die volgorde is de kern: de add-on kan niets zolang de radio aan de andere
## kant van die TCP-verbinding hangt te wezen. Vandaar dat de automatisering
## hieronder eerst de SLZB reset en pas daarna de add-on aanraakt.
##
## WAT DE OORZAAK WAS, EN WAT NIET
## De SLZB is bekabeld aangesloten. Een bekabeld apparaat dat "No route to
## host" geeft, antwoordt niet eens op ARP - dat is geen netwerkstoring maar
## een vastgelopen apparaat. Samen met het feit dat juist een core-restart hem
## terugbracht, is de conclusie: de SLZB-MR3 was gehangen en nam zijn
## netwerkstack én de RCP mee. Niet: wifi-powersave (hij zit aan een kabel),
## niet: DHCP (dan was hij blijven pingen op een ander adres).
##
## De Supervisor-watchdog van de add-on stond op dat moment op `failed`; die
## geeft het op na een reeks mislukte herstarts. Dat verklaart waarom er 's
## nachts op een gegeven moment niets meer probeerde. Staat inmiddels weer aan,
## maar het is wél de reden dat een herstartlus in HA (dit bestand) nodig is
## náást die van de Supervisor: die van de Supervisor kan uitvallen, en hij kan
## sowieso alleen de add-on herstarten, niet de radio erachter.
##
## OPEN VRAAG: de meshgezondheid ervóór
## De mesh was die dag al niet lekker - uren NoAck en ChannelAccessFailure, en
## rond 11:21-11:25 een reeks partitiewissels waarbij het mesh-local prefix
## veranderde van fdb8:5ccd:7435:: naar fd8e:4b9a:dcda::. Om 11:33 stond er
## `MultiAilDetect: BRs on multi AIL detected` (en om 11:22 juist `cleared`).
## Die melding gaat over BORDER ROUTERS die elkaar over verschillende
## infrastructuurlinks zien, niet over waar je Matter-apparaten hangen; een
## Apple TV of Nest Hub is óók een border router zonder dat je hem zo hebt
## ingericht, en dat is op geen van beide uit te zetten.
##
## Ga hier NIET achteraan zonder aanleiding. Meerdere border routers op één
## Thread-netwerk is de bedoeling - dat is redundantie, valt de SLZB weg dan
## blijft de mesh via de Apple TV overeind. De melding klaagt over het
## verschillende-links-deel, niet over het aantal. Is het LAN plat (één subnet,
## geen IoT-VLAN, geen client-isolatie op de AP's), dan is er niets te doen; in
## het log stond hij om 11:22 dan ook alweer op `cleared`. Eén keer kijken kan
## onder Instellingen > Apparaten & diensten > Thread, dat toont per netwerk
## welke border routers HA ziet.
##
## Het is bovendien NIET aangetoond dat dit met de crash van 18:01 te maken
## heeft. De hangende SLZB verklaart die op zichzelf al volledig.
##
## Dít bestand lost dat sowieso niet op; het zorgt er alleen voor dat je het
## merkt en dat de boel zichzelf terugzet.
##
## WAAROM DE MATER-ENTITEITEN DE MELDER ZIJN EN NIET DE ADD-ON
## De Supervisor maakt per add-on wél een `binary_sensor.*_running`, maar die
## staat standaard uit en moet per hand aangezet worden. Bovendien zegt "de
## add-on draait" niet dat de mesh het doet: gisteren draaide hij prima terwijl
## de helft van de pakketten geen ack kreeg. Onbereikbare apparaten zijn het
## symptoom dat telt. Zet je die binary_sensor alsnog aan, dan is hij een
## prima extra trigger onder `triggers:` hieronder.
##
## HIER WORDT WÉL AUTOMATISCH GEDETECTEERD
## Overal elders in deze config wijzen we aan wat er in hoort in plaats van een
## lijst op te bouwen met een uitsluitlijst. Hier niet: een nieuw Matter-
## apparaat hoort meteen meegewogen te worden zonder dat iemand eraan denkt dit
## bestand bij te werken. Een waakhond die alleen let op wat je hem in 2026 hebt
## verteld, is over een jaar geen waakhond meer.
##
## DE HERSTELLADDER ZELF STAAT IN ZIGBEE.YAML
## De SLZB-MR3 heeft twee radio's - poort 6638 is deze (Silicon Labs, ASH/EZSP),
## poort 7638 is Zigbee (TI, ZNP) - maar het is één kastje, met één resetknop en
## één PoE-poort. De ladder om het terug te zetten (core-restart -> PoE eraf ->
## opgeven) is dus voor allebei dezelfde en staat één keer uitgeschreven, in
## `script.slzb_radio_terugzetten` onderaan packages/9 - Other/Zigbee.yaml.
## Daar staat ook de hardware-uitleg over het kastje en de ZNP-pingtest.
##
## Thread is het geval mét een extra stap: ná de radio moet ook de OTBR-add-on
## opnieuw op. Die stap komt hieronder uit dit bestand - het script krijgt de
## slug en de wachttijden als veld mee, en doet zonder slug (zoals bij Zigbee)
## niets extra's. De volgorde blijft daarmee zoals hierboven beschreven: eerst
## de radio, dan pas de add-on.
##
## LET OP: dit is een nieuw packagebestand; het laadt pas na een volledige
## herstart van Home Assistant, een YAML-reload is niet genoeg.
##############################################################################

thread_package:

  template:
    - sensor:
        # Hoeveel Matter-entiteiten er onbereikbaar zijn. `integration_entities`
        # geeft alles wat aan de Matter-config-entry hangt, dus ook Matter-
        # over-wifi. Dat is met opzet: die blijven bij een Thread-storing juist
        # wél bereikbaar en houden zo het percentage laag, wat een prima rem is
        # op vals alarm.
        - name: "Thread Matter onbereikbaar"
          unique_id: thread_matter_onbereikbaar
          icon: mdi:access-point-network
          unit_of_measurement: "entiteiten"
          state_class: measurement
          state: >
            {% set ns = namespace(n=0) %}
            {% for e in integration_entities('matter') %}
              {% if states(e) in ['unknown', 'unavailable', 'none', ''] %}
                {% set ns.n = ns.n + 1 %}
              {% endif %}
            {% endfor %}
            {{ ns.n }}
          attributes:
            totaal: "{{ integration_entities('matter') | count }}"
            aandeel: >
              {% set alle = integration_entities('matter') %}
              {% set ns = namespace(n=0) %}
              {% for e in alle %}
                {% if states(e) in ['unknown', 'unavailable', 'none', ''] %}
                  {% set ns.n = ns.n + 1 %}
                {% endif %}
              {% endfor %}
              {{ 0 if alle | count == 0 else (100 * ns.n / (alle | count)) | round(0) }}
            namen: >
              {% set ns = namespace(namen=[]) %}
              {% for e in integration_entities('matter') %}
                {% if states(e) in ['unknown', 'unavailable', 'none', ''] %}
                  {% set ns.namen = ns.namen + [state_attr(e, 'friendly_name') or e] %}
                {% endif %}
              {% endfor %}
              {{ ns.namen | join(', ') }}

    - binary_sensor:
        # De drempel: minstens drie Matter-entiteiten in totaal (anders zegt een
        # percentage niets) én minstens 70% ervan weg. Eén apparaat met een lege
        # batterij haalt dat niet; een dode border router wel.
        #
        # `delay_on` van tien minuten vangt het normale beeld na een herstart
        # van HA op: dan is álles even onbereikbaar. Tien minuten is ruim langer
        # dan een Matter-integratie nodig heeft om zijn apparaten terug te
        # vinden, en kort genoeg om 's ochtends niet voor niets naast een dood
        # huis te staan.
        - name: "Thread netwerk stuk"
          unique_id: thread_netwerk_stuk
          device_class: problem
          icon: mdi:lan-disconnect
          delay_on: "00:10:00"
          delay_off: "00:01:00"
          state: >
            {% set alles = state_attr('sensor.thread_matter_onbereikbaar', 'totaal')
                           | int(0) %}
            {% set aandeel = state_attr('sensor.thread_matter_onbereikbaar', 'aandeel')
                             | float(0) %}
            {{ alles >= 3 and aandeel >= 70 }}

  automation:
    ###########################################################################
    ## De mesh zelf terugzetten als hij weg is
    ###########################################################################
    #
    # DRIE TREDEN, VAN ZACHT NAAR HARD:
    #
    #   1. SLZB-core resetten  -> add-on herstarten -> een kwartier wachten
    #   2. PoE-poort uit/aan   -> add-on herstarten -> een kwartier wachten
    #   3. opgeven met een critical melding
    #
    # Die ladder staat in `script.slzb_radio_terugzetten` (onderaan
    # packages/9 - Other/Zigbee.yaml); hieronder staat alleen wanneer we hem voor
    # Thread aanroepen en waarmee.
    #
    # Trede 1 wordt overgeslagen als de SLZB zelf niet meer reageert; dan valt
    # er softwarematig niets te resetten en is de stroom de enige weg. Elke
    # trede stopt zodra de mesh terug is, dus normaal gesproken komt hij nooit
    # verder dan de eerste.
    #
    # Worst case duurt een hele ronde ~35 minuten (2 + 15 + 3 + 15). Dat past
    # binnen de rem van één poging per uur hieronder, en `mode: single` zorgt
    # dat een tweede storing tijdens die ronde niet meeloopt.
    - id: thread_border_router_herstart
      alias: Thread - Mesh terugzetten
      description: >-
        Zet het Thread-netwerk terug als vrijwel alle Matter-apparaten tien
        minuten onbereikbaar zijn: eerst een SLZB-reset, dan de PoE eraf, en
        een melding over wat er gebeurde en of het hielp.
      mode: single
      max_exceeded: silent
      triggers:
        # De gewone flank: Thread valt weg terwijl HA gewoon draait.
        - trigger: state
          entity_id: binary_sensor.thread_netwerk_stuk
          to: "on"
        # Vangnet voor de storing die een herstart van HA overleeft: de sensor
        # staat dan al op `on` binnen het venster dat de opstartconditie
        # wegfiltert, en daarna komt er nooit meer een flank.
        - trigger: state
          entity_id: binary_sensor.thread_netwerk_stuk
          to: "on"
          for: "00:15:00"
        # Nieuwe poging zolang het stuk blijft; zonder deze trigger deed de
        # uurrem hieronder niets.
        - trigger: time_pattern
          hours: "/1"
      # Deze vier condities blijven hier staan en gaan niet mee het gedeelde
      # script in: `last_triggered` wordt pas gezet als de acties beginnen, dus
      # ná deze condities, en `this` wijst in een script naar het script zelf.
      # Zouden ze daar staan, dan zou een ronde voor Zigbee die van Thread een
      # uur lang blokkeren. Zie de langere uitleg in Zigbee.yaml.
      conditions:
        - condition: state
          entity_id: binary_sensor.thread_netwerk_stuk
          state: "on"
        # Niet meteen na een herstart van HA aan de gang: dan is de Matter-
        # integratie soms nog aan het opstarten en is `delay_on` alleen niet
        # genoeg (de teller begint namelijk pas te lopen ná de start).
        - condition: template
          value_template: >-
            {% set start = states('sensor.home_assistant_gestart') | as_datetime %}
            {{ start is none or (now() - start) > timedelta(minutes=20) }}
        # Hooguit één herstartpoging per uur. Zonder deze rem zou een radio die
        # écht stuk is de hele nacht herstart worden - en dat is precies het
        # gedrag dat de add-on gisteren al vertoonde.
        - condition: template
          value_template: >-
            {{ this.attributes.last_triggered is none
               or now() - this.attributes.last_triggered > timedelta(hours=1) }}
        # Na zes uur lost het zichzelf niet meer op en levert doorgaan alleen
        # nog een critical melding per uur op over iets dat allang gemeld is.
        - condition: template
          value_template: >-
            {% set sinds = states.binary_sensor.thread_netwerk_stuk.last_changed %}
            {{ sinds is none or (now() - sinds) < timedelta(hours=6) }}
      actions:
        # Vanaf hier is alles gelijk aan Zigbee, op de add-on na; zie
        # `script.slzb_radio_terugzetten` onderaan Zigbee.yaml. Deze aanroep is
        # met opzet de laatste actie: een `stop:` in het script beëindigt dan de
        # hele ronde, net als toen het nog één blok was.
        - action: script.slzb_radio_terugzetten
          data:
            naam: Thread
            andere_radio: Zigbee
            stuk_sensor: binary_sensor.thread_netwerk_stuk
            apparaten: Matter-apparaten
            # Bij de handmatige reddingsactie duurde terugkomen "enkele
            # minuten"; een kwartier is dus ruim.
            wachttijd: "00:15:00"
            # DE EXTRA STAP DIE THREAD HEEFT EN ZIGBEE NIET
            # Op 2026-08-05 nagekeken: de slug is `core_openthread_border_router`.
            # Installeer je de add-on ooit opnieuw uit een andere repository, dan
            # verandert die. De juiste staat in de URL van de add-on:
            # /hassio/addon/<slug>/info. Het script zet er `continue_on_error` op
            # als vangnet: bij een verkeerde slug loopt de ronde door naar de
            # controle en krijg je alsnog een melding, in plaats van dat hij
            # halverwege stilvalt.
            addon: core_openthread_border_router
            # De SLZB moet op zijn en zijn TCP-poort weer openzetten voordat de
            # add-on er iets mee kan. Te vroeg beginnen levert precies de
            # crashlus op die we willen mijden. Na een koude start via de PoE
            # duurt dat langer dan na een core-restart.
            addon_wacht_na_reset: "00:02:00"
            addon_wacht_na_poe: "00:03:00"
            meldingen:
              stuk: >-
                {{ states('sensor.thread_matter_onbereikbaar') }} van de
                {{ state_attr('sensor.thread_matter_onbereikbaar', 'totaal') }}
                Matter-entiteiten zijn onbereikbaar.
              zachte_reset: >-
                Ik reset de SLZB en start de border router opnieuw.
              hersteld_zacht: >-
                SLZB gereset en border router herstart; de Matter-apparaten
                zijn weer bereikbaar.
              hersteld_poe: >-
                De SLZB is via de PoE-poort opnieuw opgestart en de
                Matter-apparaten zijn weer bereikbaar.
              # Alles gehad: zachte reset, stroom eraf, add-on opnieuw. Dan zit
              # het dieper dan een vastgelopen radio.
              #
              # Let op: deze teksten worden bij het aanroepen ingevuld, dus het
              # aantal hieronder is dat van het begin van de ronde en niet van
              # ~35 minuten later. Bij een storing die het hele Thread-netwerk
              # plat legt is dat hetzelfde getal; komt er in de tussentijd een
              # deel terug, dan is het de stand van bij het begin.
              opgegeven: >-
                SLZB spanningsloos gemaakt én de border router herstart, maar
                {{ states('sensor.thread_matter_onbereikbaar') }} entiteiten
                zijn nog steeds onbereikbaar. Dit lost zichzelf niet op.
