general_locations_package:
  automation:
    - id: general_locations_notifcations
      alias: General - Locations send notifications
      description: "Send notifications when someone leaves a zone to interested persons"
      mode: single
      triggers:
        - trigger: zone
          entity_id: !secret person_partner
          zone: zone.crole
          event: leave
          id: partner_crole
        - trigger: zone
          entity_id: !secret person_partner
          zone: zone.efteling
          event: leave
          id: partner_efteling
        - trigger: zone
          entity_id: person.robin_bohnen
          zone: zone.brandweer_kazerne_s_hertogenbosch
          event: leave
          id: robin_work
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - partner_crole
              sequence:
                # Volume 0.1: dit moet je wel merken als je telefoon stil staat,
                # maar het is geen noodgeval - vandaar het laagste volume dat
                # script.notify_critical kent.
                - action: script.notify_critical
                  data:
                    doelgroep: notify.mobile_devices_robin
                    titel: "{{ states['input_text.naam_partner'].state }} gaat weg bij Crole"
                    bericht: >-
                      {{ states['input_text.naam_partner'].state }} gaat weg bij Crole en is over {{
                      states['sensor.samantha_reistijd_naar_huis'].state }} minuten
                      thuis.
                    volume: 0.1
            - conditions:
                - condition: trigger
                  id:
                    - partner_efteling
              sequence:
                - action: script.notify_critical
                  data:
                    doelgroep: notify.mobile_devices_robin
                    titel: "{{ states['input_text.naam_partner'].state }} gaat weg bij de Efteling"
                    bericht: >-
                      {{ states['input_text.naam_partner'].state }} gaat weg bij de Efteling en is over {{
                      states['sensor.samantha_reistijd_naar_huis'].state }} minuten
                      thuis.
                    volume: 0.1
            - conditions:
                - condition: trigger
                  id:
                    - robin_work
              sequence:
                # Spiegelbeeld van de twee hierboven: deze gaat naar de partner,
                # niet naar Robin zelf.
                - action: script.notify_critical
                  data:
                    doelgroep: notify.mobile_devices_partner
                    titel: Robin gaat weg op het werk
                    bericht: >-
                      Robin gaat weg op het werk en is over {{
                      states['sensor.robin_reistijd_naar_huis'].state }} minuten
                      thuis.
                    volume: 0.1
