###############################################################################
## F1-MELDINGEN
##
## Stonden tot 25 oktober 2026 alleen als UI-automations in HA. Daar zaten
## twee dingen mis:
##
## 1. "null at null has started". Het bericht las `sensor.f1_session_status`,
##    maar die bestaat niet; de integratie noemt hem
##    `sensor.f1_session_f1_session_status`. De sessienaam staat daar
##    bovendien niet op, alleen op `sensor.f1_session_f1_current_session`
##    (attribuut `name`, ook als de state even `unknown` is).
##
## 2. Ook 's nachts een melding. Races buiten Europa vallen midden in de
##    nacht. Staat het alarm op armed_home, dan liggen we op bed: geen
##    melding. Kanttekening: armed_home gaat ook aan als je overdag de tuin in
##    loopt, en ook dan blijft de melding weg.
##
## Kwalificatie gaat live -> break -> live voor Q1, Q2 en Q3. Een sessie die
## na een `break` weer start telt niet als nieuwe start, anders krijg je drie
## meldingen voor één kwalificatie.
###############################################################################

f1_package:
  automation:
    - id: f1_melding_sessie_begint_zo
      alias: F1 - Sessie begint zo
      description: "Melding 30 minuten voor elke F1-sessie, niet als we op bed liggen"
      mode: single
      triggers:
        - trigger: calendar
          event: start
          entity_id: calendar.f1_race_f1_season_calendar
          offset: "-0:30:0"
      conditions:
        - condition: not
          conditions:
            - condition: state
              entity_id: alarm_control_panel.alarmo
              state: armed_home
      actions:
        - action: notify.mobile_devices_adults
          data:
            title: F1 begint zo
            message: "{{ trigger.calendar_event.summary }} begint over 30 minuten."

    - id: f1_melding_sessie_live
      alias: F1 - Sessie is live
      description: "Melding als een F1-sessie start, niet als we op bed liggen"
      mode: single
      triggers:
        - trigger: state
          entity_id: sensor.f1_session_f1_session_status
          to: live
      conditions:
        - condition: template
          value_template: "{{ trigger.from_state is none or trigger.from_state.state != 'break' }}"
        - condition: not
          conditions:
            - condition: state
              entity_id: alarm_control_panel.alarmo
              state: armed_home
      actions:
        - action: notify.mobile_devices_adults
          data:
            title: F1 is live
            message: >-
              {% set sessie = state_attr('sensor.f1_session_f1_current_session', 'name') or 'De sessie' %}
              {% set gp = state_attr('sensor.f1_session_f1_session_status', 'meeting_name') %}
              {{ sessie }}{{ ' van de ' ~ gp if gp else '' }} is begonnen.
