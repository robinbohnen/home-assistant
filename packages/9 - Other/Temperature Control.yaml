##############################################################################
## RAMEN-ADVIES - meldingen op de momenten dat ramen open of dicht lonen
##
## Dit bestand verving de oude "Temperature Control - All rooms", die in de
## praktijk vrijwel nooit iets stuurde. Waarom niet, en wat hier anders is:
##
##   1. De oude automatisering triggerde per kamer op het exacte moment dat
##      buiten de kamertemperatuur kruiste. Het nuttigste kruismoment (buiten
##      zakt 's avonds onder binnen -> "zet ramen open") valt in de zomer
##      meestal ná 21:00 - precies buiten het 08:00-21:00-venster dat over de
##      hele automatisering stond. En in een hittegolf zakt buiten overdag
##      helemaal nooit onder binnen. Het advies waar je het meest aan had,
##      kwam dus vrijwel nooit door.
##   2. Eén kruismoment per dag: herstart gemist = dag gemist. Daarom heeft
##      elk advies hier een tweede, vaste-tijd-trigger als vangnet; de
##      condities bepalen of hij dan alsnog zinnig is.
##   3. Drie triggers (garage, speelkamer, kantoor) hadden geen actie-tak.
##   4. Geen regime-kennis (adviezen ook buiten het koelseizoen), geen
##      hysterese (0,1 graad kruising was genoeg) en geen cooldown.
##
## De drempels komen uit de klimaatregie-helpers (kamer_warm, spui_delta,
## regime), zodat dit advies hetzelfde "denkt" als de zonwering. Puur
## meldingen: covers zijn het domein van de klimaatregie zelf.
## Binnen = woonkamer-multisensor (leefverdieping); buiten = KNMI.
##
## Het rekenwerk zelf staat in custom_templates/klimaat.jinja, onderaan bij
## "RAMEN-ADVIES": `buitenlucht()` (binnen/buiten/delta plus de drie
## vergelijkingen), `open_ramen()` en `cooldown_voorbij()`. Dat stond hier
## eerst vijftien keer uitgeschreven, en dan is één plek die je vergeet bij te
## werken genoeg om twee adviezen tegen elkaar in te laten denken.
## LET OP: aanpassen van dat bestand vraagt een volledige herstart van Home
## Assistant, herladen van de templates is niet genoeg.
##############################################################################

temp_control_package:
  automation:
    ###########################################################################
    ## Avond: buiten is koeler geworden dan binnen -> ramen open loont
    ###########################################################################
    - id: ramen_advies_open_avond
      alias: Ramen advies - Open bij avondkoelte
      description: >-
        Meldt op koeldagen het moment waarop de buitenlucht koeler is dan
        binnen en ramen openzetten dus gratis koelte oplevert.
      mode: single
      triggers:
        # Het echte moment: buiten zakt onder binnen minus de spui-delta en
        # blijft daar een kwartier (geen gefladder rond de kruising).
        - trigger: template
          value_template: >-
            {% from 'klimaat.jinja' import buitenlucht %}
            {{ (buitenlucht() | from_json).spui_ok }}
          for: "00:15:00"
        # Vangnet: was het kruismoment vóór het tijdvenster (of miste een
        # herstart hem), dan beoordeelt deze vaste check het alsnog.
        - trigger: time
          at: "19:30:00"
      conditions:
        # Alleen in het koelseizoen is avondkoelte binnenhalen het doel.
        - condition: state
          entity_id: input_select.klimaat_regime
          state: Koelen
        # Binnen moet het ook echt te warm zijn.
        - condition: numeric_state
          entity_id: sensor.woonkamer_woonkamer_multisensor_temperatuur
          above: input_number.klimaat_kamer_warm
        # Herbevestig de kruising (voor de vaste-tijd-trigger).
        - condition: template
          value_template: >-
            {% from 'klimaat.jinja' import buitenlucht %}
            {{ (buitenlucht() | from_json).spui_ok }}
        # Niet midden in de nacht en niet vlak na het opstaan.
        - condition: time
          after: "17:00:00"
          before: "22:30:00"
        # Iemand moet er iets mee kunnen.
        - condition: state
          entity_id: group.all_adults
          state: home
        # Staat er al iets open, dan is de tip al opgevolgd.
        - condition: state
          entity_id: binary_sensor.all_windows
          state: "off"
        # Max één keer per dag, ook al vuren beide triggers.
        - condition: template
          value_template: >-
            {% from 'klimaat.jinja' import cooldown_voorbij %}
            {{ cooldown_voorbij(this.attributes.last_triggered, 12) }}
      actions:
        - variables:
            lucht: >-
              {% from 'klimaat.jinja' import buitenlucht %}
              {{ buitenlucht() | from_json }}
        - action: notify.mobile_devices_adults
          data:
            title: Ramen open
            message: >-
              Buiten is het nu {{ lucht.buiten | round(1) }}°,
              binnen {{ lucht.binnen | round(1) }}°.
              Goed moment om ramen open te zetten en gratis af te koelen.

    ###########################################################################
    ## Ochtend: buiten wordt warmer dan binnen -> wat open staat kan dicht
    ###########################################################################
    - id: ramen_advies_dicht_ochtend
      alias: Ramen advies - Dicht als buiten warmer wordt
      description: >-
        Meldt op koeldagen het moment waarop de buitenlucht warmer wordt dan
        binnen, met de lijst van ramen en tuindeuren die nog open staan.
      mode: single
      triggers:
        - trigger: template
          value_template: >-
            {% from 'klimaat.jinja' import buitenlucht %}
            {{ (buitenlucht() | from_json).buiten_warmer }}
          for: "00:15:00"
        # Vangnet, zie de open-variant hierboven.
        - trigger: time
          at: "10:30:00"
      conditions:
        - condition: state
          entity_id: input_select.klimaat_regime
          state: Koelen
        - condition: template
          value_template: >-
            {% from 'klimaat.jinja' import buitenlucht %}
            {{ (buitenlucht() | from_json).buiten_warmer }}
        - condition: time
          after: "07:30:00"
          before: "15:00:00"
        # Alleen zinnig als er echt iets open staat: een raam of een van de
        # openslaande tuindeuren (die zitten in all_doors, niet all_windows).
        - condition: or
          conditions:
            - condition: state
              entity_id: binary_sensor.all_windows
              state: "on"
            - condition: state
              entity_id: binary_sensor.woonkamer_openslaande_deuren_contact
              state: "on"
            - condition: state
              entity_id: binary_sensor.speelkamer_openslaande_deuren_contact
              state: "on"
        - condition: template
          value_template: >-
            {% from 'klimaat.jinja' import cooldown_voorbij %}
            {{ cooldown_voorbij(this.attributes.last_triggered, 12) }}
      actions:
        - variables:
            lucht: >-
              {% from 'klimaat.jinja' import buitenlucht %}
              {{ buitenlucht() | from_json }}
            nog_open: >-
              {% from 'klimaat.jinja' import open_ramen %}
              {{ open_ramen() | from_json | join(', ') }}
        - action: notify.mobile_devices_adults
          data:
            title: Ramen dicht
            message: >-
              Buiten wordt het nu warmer dan binnen
              ({{ lucht.buiten | round(1) }}° om
              {{ lucht.binnen | round(1) }}°).
              Nog open: {{ nog_open }}.

    ###########################################################################
    ## Koelseizoen: er staat een raam open terwijl buiten heter is -> hitte
    ##
    ## Het ochtendadvies hierboven is een eenmalig tipje op het kruismoment:
    ## de template-trigger vuurt alleen op de overgang, en zodra buiten een
    ## keer boven binnen is gekomen blijft die de rest van de dag waar. Zet je
    ## om 16:00 alsnog een raam open terwijl het buiten 32° is, dan hoor je
    ## niets meer. Deze automatisering is de bewaker die daarbij hoort - het
    ## spiegelbeeld van de warmteverlies-melding hieronder, maar dan voor
    ## warmte die naar binnen komt in plaats van weglekt.
    ###########################################################################
    - id: ramen_advies_dicht_hitte
      alias: Ramen advies - Open raam tijdens hitte
      description: >-
        Meldt in het koelen-regime welke ramen of tuindeuren open staan terwijl
        de buitenlucht duidelijk warmer is dan binnen.
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - binary_sensor.all_windows
            - binary_sensor.woonkamer_openslaande_deuren_contact
            - binary_sensor.speelkamer_openslaande_deuren_contact
          to: "on"
          for: "00:45:00"
        # Een state-trigger met `for` overleeft geen herstart, en het kan ook
        # zo zijn dat het raam al open stond toen buiten warmer werd. Deze
        # periodieke check vangt beide gevallen; de cooldown remt de spam.
        - trigger: time_pattern
          minutes: "/30"
      conditions:
        - condition: state
          entity_id: input_select.klimaat_regime
          state: Koelen
        # Dezelfde dode zone als bij het spuien, maar dan de andere kant op:
        # pas melden als buiten er echt bovenuit komt, niet bij 0,1 graad
        # verschil. Daarmee komt deze melding ook altijd ná het ochtendadvies
        # (dat al bij buiten >= binnen afgaat) en niet gelijktijdig.
        - condition: template
          value_template: >-
            {% from 'klimaat.jinja' import buitenlucht %}
            {{ (buitenlucht() | from_json).buiten_heter }}
        # Bewust geen kamer_warm-drempel: juist als binnen nog koel is, is een
        # open raam op een hittedag het duurst. Dan gooi je de voorsprong weg.
        - condition: or
          conditions:
            - condition: state
              entity_id: binary_sensor.all_windows
              state: "on"
              for: "00:45:00"
            - condition: state
              entity_id: binary_sensor.woonkamer_openslaande_deuren_contact
              state: "on"
              for: "00:45:00"
            - condition: state
              entity_id: binary_sensor.speelkamer_openslaande_deuren_contact
              state: "on"
              for: "00:45:00"
        - condition: state
          entity_id: group.all_adults
          state: home
        # Nachtrust: 's nachts is buiten toch koeler, dan haalt de conditie
        # hierboven het sowieso niet.
        - condition: time
          after: "08:00:00"
          before: "22:00:00"
        # Korter dan de 6 uur van de stookvariant: op een hittedag telt elk
        # uur dat de warmte binnenstroomt zwaarder dan wat stookkosten.
        - condition: template
          value_template: >-
            {% from 'klimaat.jinja' import cooldown_voorbij %}
            {{ cooldown_voorbij(this.attributes.last_triggered, 3) }}
      actions:
        - variables:
            lucht: >-
              {% from 'klimaat.jinja' import buitenlucht %}
              {{ buitenlucht() | from_json }}
            nog_open: >-
              {% from 'klimaat.jinja' import open_ramen %}
              {{ open_ramen() | from_json | join(', ') }}
        - action: notify.mobile_devices_adults
          data:
            title: Hitte komt binnen
            message: >-
              Buiten is het {{ lucht.buiten | round(1) }}°,
              binnen {{ lucht.binnen | round(1) }}°.
              Dit staat al drie kwartier open en haalt warmte naar binnen:
              {{ nog_open }}.

    ###########################################################################
    ## Stookseizoen: er staat al een tijd een raam open -> warmteverlies
    ###########################################################################
    - id: ramen_advies_warmteverlies
      alias: Ramen advies - Open raam tijdens verwarmen
      description: >-
        Meldt in het verwarmen-regime welke ramen al drie kwartier open staan;
        luchten is prima, vergeten kost stookkosten.
      mode: single
      triggers:
        - trigger: state
          entity_id: binary_sensor.all_windows
          to: "on"
          for: "00:45:00"
        # Een state-trigger met `for` overleeft geen herstart; deze periodieke
        # check vangt dat op. De cooldown hieronder voorkomt herhaal-spam.
        - trigger: time_pattern
          minutes: "/30"
      conditions:
        - condition: state
          entity_id: input_select.klimaat_regime
          state: Verwarmen
        - condition: state
          entity_id: binary_sensor.all_windows
          state: "on"
          for: "00:45:00"
        - condition: state
          entity_id: group.all_adults
          state: home
        # Nachtrust: geen stookmeldingen in bed.
        - condition: time
          after: "08:00:00"
          before: "22:00:00"
        - condition: template
          value_template: >-
            {% from 'klimaat.jinja' import cooldown_voorbij %}
            {{ cooldown_voorbij(this.attributes.last_triggered, 6) }}
      actions:
        # Zonder tuindeuren: zie de macro, het stookadvies kijkt net als zijn
        # trigger alleen naar de ramengroep.
        - variables:
            nog_open: >-
              {% from 'klimaat.jinja' import open_ramen %}
              {{ open_ramen(false) | from_json | join(', ') }}
        - action: notify.mobile_devices_adults
          data:
            title: Raam staat open
            message: >-
              Er staat al zeker drie kwartier een raam open terwijl we
              verwarmen: {{ nog_open }}. Even luchten is prima, maar dicht is
              goedkoper.
