##############################################################################
## KLIMAATREGIE - laag 1 (dagregime) en laag 2 (waar staat de zon)
##
## Laag 1: één keer per dag bepalen wat voor dag het wordt op basis van de
##         VERWACHTE maximumtemperatuur. Daarmee kan de zonwering al dicht
##         voordat de warmte binnen is, in plaats van pas als de lux-sensor
##         het merkt.
## Laag 2: per gevel twee sensoren:
##           zon_op_<gevel>       de zon schijnt er nu echt op (lux + stand)
##           zon_richting_<gevel> de zon staat aan die kant, ook bij bewolking
##
## De beslissing zelf staat in custom_templates/klimaat.jinja, het uitvoeren
## in "Klimaat Zonwering.yaml". Zie docs/klimaatregie.md.
##############################################################################

klimaat_regime_package:

  input_select:
    klimaat_regime:
      name: "Klimaat - Regime van vandaag"
      icon: mdi:home-thermometer
      # Neutraal staat bewust vooraan: zonder herstelde waarde pakt Home
      # Assistant de eerste optie, en dat moet de onschuldigste zijn. De
      # automatisering hieronder zet 'm bij het opstarten meteen goed.
      options:
        - Neutraal
        - Koelen
        - Verwarmen

  input_boolean:
    klimaat_regime_handmatig:
      name: "Klimaat - Regime handmatig vastzetten"
      icon: mdi:hand-back-right

  input_number:
    # --- Regimegrenzen (verwachte maximumtemperatuur van vandaag) ---
    klimaat_koelen_vanaf:
      name: "Klimaat - Koelen vanaf verwachte max"
      icon: mdi:snowflake-thermometer
      min: 15
      max: 35
      step: 0.5
      unit_of_measurement: "°C"
      mode: box
    klimaat_verwarmen_tot:
      name: "Klimaat - Verwarmen tot verwachte max"
      icon: mdi:sun-thermometer
      min: 0
      max: 20
      step: 0.5
      unit_of_measurement: "°C"
      mode: box
    klimaat_hittedag_vanaf:
      name: "Klimaat - Hittedag vanaf verwachte max"
      icon: mdi:weather-sunny-alert
      min: 20
      max: 40
      step: 0.5
      unit_of_measurement: "°C"
      mode: box
    # Houdt bij welke set standaardwaarden al is ingevuld. Komen er nieuwe
    # instellingen bij, dan gaat het versienummer in de automatisering omhoog
    # en worden alleen de drempels gevuld die jij nog nooit hebt aangeraakt.
    # Op 0 zetten en herstarten = terug naar de fabriekswaarden.
    klimaat_config_versie:
      name: "Klimaat - Configuratieversie"
      icon: mdi:counter
      min: 0
      max: 99
      step: 1
      mode: box

    # Gezet door de automatisering hieronder, staat hier zodat het zichtbaar
    # en corrigeerbaar is.
    klimaat_verwachte_max:
      name: "Klimaat - Verwachte max vandaag"
      icon: mdi:thermometer-chevron-up
      min: -20
      max: 50
      step: 0.1
      unit_of_measurement: "°C"
      mode: box

    # --- Wanneer telt de zon als "op de gevel" ---
    klimaat_zon_lux_drempel:
      name: "Klimaat - Zon lux drempel"
      icon: mdi:brightness-5
      min: 5000
      max: 60000
      step: 1000
      unit_of_measurement: "lx"
      mode: box
    klimaat_zon_min_elevatie:
      name: "Klimaat - Zon minimale hoogte"
      icon: mdi:angle-acute
      min: 0
      max: 30
      step: 1
      unit_of_measurement: "°"
      mode: box

    # --- Gevelrichtingen in kompasgraden (0 = noord, 90 = oost) ---
    # Kroon 18 staat aan de westkant van de straat, dus de voorgevel (keuken,
    # entree, Logan) kijkt op het oosten, de tuin op het westen en de zijgevel
    # (speelkamer, deel van de keuken, kantoor, Emma) op het zuiden.
    # De achtergevel wordt afgeleid uit de voorgevel + 180, die twee liggen
    # per definitie tegenover elkaar.
    klimaat_voorgevel_richting:
      name: "Klimaat - Voorgevel kijkt op"
      icon: mdi:compass-outline
      min: 0
      max: 359
      step: 5
      unit_of_measurement: "°"
      mode: box
    klimaat_zijgevel_richting:
      name: "Klimaat - Zijgevel kijkt op"
      icon: mdi:compass-outline
      min: 0
      max: 359
      step: 5
      unit_of_measurement: "°"
      mode: box
    # Hoe ver de zon van recht-voor-de-gevel mag staan en er nog op schijnt.
    # 85° is bijna het theoretische maximum (90° = precies langs de gevel);
    # lager zetten maakt het systeem kieskeuriger.
    klimaat_gevel_breedte:
      name: "Klimaat - Hoek waarover een gevel zon vangt"
      icon: mdi:angle-obtuse
      min: 30
      max: 90
      step: 5
      unit_of_measurement: "°"
      mode: box

  template:
    - sensor:
        # De zonstand wordt wél bewaard in de recorder (het domein sun. niet),
        # zodat je achteraf kunt zien bij welke azimut de voortuin oplichtte.
        # Dat is precies wat je nodig hebt om de gevelsectoren te kalibreren.
        - name: "Klimaat zon azimut"
          unique_id: klimaat_zon_azimut
          icon: mdi:compass
          unit_of_measurement: "°"
          state_class: measurement
          state: "{{ state_attr('sun.sun', 'azimuth') | float(0) | round(1) }}"

        - name: "Klimaat zon elevatie"
          unique_id: klimaat_zon_elevatie
          icon: mdi:angle-acute
          unit_of_measurement: "°"
          state_class: measurement
          state: "{{ state_attr('sun.sun', 'elevation') | float(0) | round(1) }}"

    - binary_sensor:
        #######################################################################
        ## De zon staat geometrisch aan deze kant (ook door de wolken heen).
        ## Loopt vóór op de lux-sensor, dus bruikbaar om preventief te sluiten.
        ##
        ## De hoekberekening `((az - normaal + 180) % 360) - 180` geeft het
        ## kortste verschil tussen twee kompasrichtingen, ook over 0° heen.
        #######################################################################
        - name: "Zon richting voorgevel"
          unique_id: zon_richting_voorgevel
          icon: mdi:sun-compass
          state: >
            {% set az = state_attr('sun.sun', 'azimuth') | float(0) %}
            {% set el = state_attr('sun.sun', 'elevation') | float(-90) %}
            {% set normaal = states('input_number.klimaat_voorgevel_richting') | float(80) %}
            {% set breedte = states('input_number.klimaat_gevel_breedte') | float(85) %}
            {% set min_el = states('input_number.klimaat_zon_min_elevatie') | float(8) %}
            {{ el >= min_el and (((az - normaal + 180) % 360) - 180) | abs <= breedte }}

        - name: "Zon richting zijgevel"
          unique_id: zon_richting_zijgevel
          icon: mdi:sun-compass
          state: >
            {% set az = state_attr('sun.sun', 'azimuth') | float(0) %}
            {% set el = state_attr('sun.sun', 'elevation') | float(-90) %}
            {% set normaal = states('input_number.klimaat_zijgevel_richting') | float(170) %}
            {% set breedte = states('input_number.klimaat_gevel_breedte') | float(85) %}
            {% set min_el = states('input_number.klimaat_zon_min_elevatie') | float(8) %}
            {{ el >= min_el and (((az - normaal + 180) % 360) - 180) | abs <= breedte }}

        - name: "Zon richting achtergevel"
          unique_id: zon_richting_achtergevel
          icon: mdi:sun-compass
          state: >
            {% set az = state_attr('sun.sun', 'azimuth') | float(0) %}
            {% set el = state_attr('sun.sun', 'elevation') | float(-90) %}
            {% set normaal = (states('input_number.klimaat_voorgevel_richting') | float(80) + 180) % 360 %}
            {% set breedte = states('input_number.klimaat_gevel_breedte') | float(85) %}
            {% set min_el = states('input_number.klimaat_zon_min_elevatie') | float(8) %}
            {{ el >= min_el and (((az - normaal + 180) % 360) - 180) | abs <= breedte }}

        #######################################################################
        ## De zon schijnt er nu echt op: richting + genoeg licht.
        ##
        ## Hysterese via `this.state`: aangaan bij de drempel, uitgaan pas
        ## onder 70% daarvan, plus delay_off. Zonder dat gaat de zonwering
        ## klepperen bij overdrijvende wolken.
        #######################################################################
        - name: "Zon op voorgevel"
          unique_id: zon_op_voorgevel
          icon: mdi:weather-sunny
          delay_on: "00:02:00"
          delay_off: "00:10:00"
          state: >
            {% set lux = states('sensor.voortuin_zon_luminance') | float(0) %}
            {% set drempel = states('input_number.klimaat_zon_lux_drempel') | float(20000) %}
            {% set aan = this.state == 'on' %}
            {{ is_state('binary_sensor.zon_richting_voorgevel', 'on')
               and (lux >= drempel or (aan and lux >= drempel * 0.7)) }}

        # De zijgevel heeft geen eigen lichtsensor. De hoogste van de twee
        # tuinsensoren is hier de maat voor "het is echt zonnig"; de richting
        # doet het onderscheid tussen de gevels.
        - name: "Zon op zijgevel"
          unique_id: zon_op_zijgevel
          icon: mdi:weather-sunny
          delay_on: "00:02:00"
          delay_off: "00:10:00"
          state: >
            {% set lux = [states('sensor.voortuin_zon_luminance') | float(0),
                          states('sensor.achtertuin_zon_luminance') | float(0)] | max %}
            {% set drempel = states('input_number.klimaat_zon_lux_drempel') | float(20000) %}
            {% set aan = this.state == 'on' %}
            {{ is_state('binary_sensor.zon_richting_zijgevel', 'on')
               and (lux >= drempel or (aan and lux >= drempel * 0.7)) }}

        - name: "Zon op achtergevel"
          unique_id: zon_op_achtergevel
          icon: mdi:weather-sunny
          delay_on: "00:02:00"
          delay_off: "00:10:00"
          state: >
            {% set lux = states('sensor.achtertuin_zon_luminance') | float(0) %}
            {% set drempel = states('input_number.klimaat_zon_lux_drempel') | float(20000) %}
            {% set aan = this.state == 'on' %}
            {{ is_state('binary_sensor.zon_richting_achtergevel', 'on')
               and (lux >= drempel or (aan and lux >= drempel * 0.7)) }}

  automation:
    ###########################################################################
    ## Standaardwaarden invullen
    ##
    ## Bewust geen `initial:` op de helpers hierboven: dat zet je eigen
    ## instellingen bij élke herstart terug.
    ##
    ## Kijken of een waarde "nog leeg" is werkt hier niet: een input_number
    ## zonder opgeslagen waarde start niet op `unknown` maar op zijn MINIMUM.
    ## Daarom twee slagen om de arm: alleen drempels die nog exact op hun
    ## minimum staan (dus nooit door jou gezet) worden gevuld, en dat gebeurt
    ## alleen als het versienummer omhoog is gegaan. Komt er later een nieuwe
    ## instelling bij, verhoog dan `config_versie` hieronder; alles wat jij al
    ## had bijgesteld blijft dan staan.
    ###########################################################################
    - id: klimaat_standaardwaarden
      alias: Klimaat - Standaardwaarden invullen
      description: Vult nieuwe drempels die nog nooit zijn ingesteld
      mode: single
      variables:
        # 1 = eerste set, 2 = screens-windgrens erbij, 3 = screens-regengrens,
        # 4 = de vier drempels van de aircoregie (laag 5)
        config_versie: 4
      triggers:
        - trigger: homeassistant
          event: start
      conditions:
        - condition: template
          value_template: >-
            {{ states('input_number.klimaat_config_versie') | int(0) < config_versie }}
      actions:
        - variables:
            standaard:
              input_number.klimaat_koelen_vanaf: 23
              input_number.klimaat_verwarmen_tot: 14
              input_number.klimaat_hittedag_vanaf: 28
              input_number.klimaat_zon_lux_drempel: 20000
              input_number.klimaat_zon_min_elevatie: 8
              # Kroon 18: voorgevel op het oosten, zijgevel op het zuiden.
              input_number.klimaat_voorgevel_richting: 80
              input_number.klimaat_zijgevel_richting: 170
              input_number.klimaat_gevel_breedte: 85
              input_number.klimaat_kamer_warm: 22
              input_number.klimaat_spui_delta: 1
              input_number.klimaat_kier_positie: 15
              input_number.klimaat_override_uren: 4
              input_number.klimaat_screen_max_wind: 45
              input_number.klimaat_screen_max_regen: 0.1
              # Laag 5, de airco's. `kamer_koud` is de onderkant van dezelfde
              # comfortband waarvan `kamer_warm` de bovenkant is; de twee
              # delta's eromheen zijn de dode zone die het pendelen tegenhoudt
              # (aan op 23,5°, uit op 21,5°). Zie de AIRCO-sectie in
              # custom_templates/klimaat.jinja.
              input_number.klimaat_kamer_koud: 19
              input_number.klimaat_airco_aan_delta: 1.5
              input_number.klimaat_airco_uit_delta: 0.5
              input_number.klimaat_airco_voorkoelen_min: 20
        - repeat:
            for_each: "{{ standaard.keys() | list }}"
            sequence:
              # Alleen aanraken wat nog op de ondergrens van zijn schuifbereik
              # staat; dat is de waarde die Home Assistant zelf invult als er
              # niets is opgeslagen.
              - if:
                  - condition: template
                    value_template: >-
                      {% set nu = states(repeat.item) %}
                      {{ nu in ['unknown', 'unavailable', 'none', '']
                         or (nu | float(-9999)) == (state_attr(repeat.item, 'min') | float(-9998)) }}
                then:
                  - action: input_number.set_value
                    target:
                      entity_id: "{{ repeat.item }}"
                    data:
                      value: "{{ standaard[repeat.item] }}"
                    continue_on_error: true
        - action: input_number.set_value
          target:
            entity_id: input_number.klimaat_config_versie
          data:
            value: "{{ config_versie }}"
        - action: logbook.log
          data:
            name: Klimaatregie
            message: >-
              Standaardwaarden bijgewerkt naar versie {{ config_versie }}.

    ###########################################################################
    ## Regime van de dag bepalen uit de weersverwachting
    ###########################################################################
    - id: klimaat_regime_bepalen
      alias: Klimaat - Regime bepalen
      description: >-
        Kies koelen/neutraal/verwarmen op basis van de verwachte maximum-
        temperatuur van vandaag. 's Ochtends vroeg, zodat de zonwering de
        warmte vóór kan zijn, en 's middags nog een keer als bijsturing.
      mode: single
      triggers:
        - trigger: time
          at: "05:30:00"
        - trigger: time
          at: "12:00:00"
        - trigger: homeassistant
          event: start
        - trigger: state
          entity_id: input_boolean.klimaat_regime_handmatig
          to: "off"
      conditions:
        - condition: state
          entity_id: input_boolean.klimaat_regime_handmatig
          state: "off"
      actions:
        - action: weather.get_forecasts
          target:
            entity_id: weather.knmi_thuis
          data:
            type: daily
          response_variable: verwachting
          continue_on_error: true
        - variables:
            # Valt terug op de actuele buitentemperatuur als de verwachting
            # (nog) niet beschikbaar is, zodat het regime nooit blijft hangen.
            max_vandaag: >-
              {% set f = (verwachting | default({}, true)).get('weather.knmi_thuis', {}).get('forecast', []) %}
              {{ (f[0].temperature if f | count > 0 else states('sensor.knmi_temperatuur'))
                 | float(states('sensor.knmi_temperatuur') | float(18)) }}
        - action: input_number.set_value
          target:
            entity_id: input_number.klimaat_verwachte_max
          data:
            value: "{{ max_vandaag | round(1) }}"
        - action: input_select.select_option
          target:
            entity_id: input_select.klimaat_regime
          data:
            option: >-
              {% set koelen = states('input_number.klimaat_koelen_vanaf') | float(23) %}
              {% set verwarmen = states('input_number.klimaat_verwarmen_tot') | float(14) %}
              {{ 'Koelen' if max_vandaag >= koelen
                 else ('Verwarmen' if max_vandaag <= verwarmen else 'Neutraal') }}
