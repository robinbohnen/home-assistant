presence_package:
  #################################################################
  ## Bayesian presence detection
  ##
  ## Combineert meerdere signalen (telefoon GPS + UniFi WiFi) om
  ## betrouwbaardere aanwezigheidsdetectie te krijgen. Een enkel
  ## signaal dat wegvalt zorgt niet meer voor een fout-negatief.
  ##
  ## Deze twee sensoren sturen niets aan; ze bestaan om de conflictmeldingen
  ## onderaan dit bestand te voeden. Voor de vraag "is er een volwassene thuis"
  ## gebruikt de rest van de config group.all_adults.
  #################################################################

  binary_sensor:
    #################################################################
    ## Robin - Bayesian aanwezigheid
    #################################################################
    - platform: bayesian
      name: "Robin thuis"
      unique_id: bayesian_robin_home
      device_class: presence
      # Prior: geschatte fractie van de tijd dat Robin thuis is
      prior: 0.35
      # Drempelwaarde: boven 85% zekerheid → thuis
      probability_threshold: 0.85
      observations:
        # Telefoon GPS (hoge betrouwbaarheid, maar kan laggen bij vertrek)
        - platform: state
          entity_id: person.robin_bohnen
          to_state: "home"
          prob_given_true: 0.95   # Als Robin thuis is, zegt GPS bijna altijd 'home'
          prob_given_false: 0.03  # GPS zegt zelden 'home' als Robin weg is

        # UniFi WiFi aanwezigheid (sneller bij aankomst/vertrek, maar kan kort verbreken)
        # Vervang dit met jouw echte UniFi device tracker entity ID
        # Voorbeeld: device_tracker.robin_iphone  of  device_tracker.192_168_1_100
        # WiFi is een positief boostsignaal, maar een uitval bewijst niks.
        # prob_given_true laag houden zodat WiFi-drop de GPS niet overstemt.
        - platform: state
          entity_id: device_tracker.iphone_9
          to_state: "home"
          prob_given_true: 0.50   # WiFi connected = extra zekerheid, maar niet verplicht als je thuis bent
          prob_given_false: 0.05  # WiFi connected terwijl je weg bent = zelden

    #################################################################
    ## Samantha - Bayesian aanwezigheid
    #################################################################
    # Spiegelbeeld van Robin hierboven, met dezelfde kansen. Deze sensor heeft
    # één afnemer en dat is met opzet: de conflictmelding onderaan dit bestand.
    # Hij bestond eerder ook al, maar toen zonder die melding - hij werd alleen
    # gelezen door een combinatiesensor die zelf nergens werd gebruikt, en is op
    # 2026-08-06 daarom eerst weggegooid en meteen daarna teruggezet mét het
    # stuk dat er altijd al bij hoorde.
    #
    # Wat er NIET terugkomt is die combinatiesensor ("Volwassenen thuis"). Voor
    # de vraag of er een volwassene thuis is gebruikt de rest van de config
    # group.all_adults, en twee bronnen voor hetzelfde is precies hoe ze uit
    # elkaar gaan lopen.
    - platform: bayesian
      name: "Samantha thuis"
      unique_id: bayesian_samantha_home
      device_class: presence
      prior: 0.40
      probability_threshold: 0.85
      observations:
        - platform: state
          entity_id: person.samantha_henkelman
          to_state: "home"
          prob_given_true: 0.95
          prob_given_false: 0.03

        # De UniFi-tracker van haar telefoon, het spiegelbeeld van
        # device_tracker.iphone_9 bij Robin.
        - platform: state
          entity_id: device_tracker.apple_iphone_samantha
          to_state: "home"
          prob_given_true: 0.50
          prob_given_false: 0.05

  #################################################################
  ## Notificatie bij onbetrouwbare detectie
  ## Waarschuwt als GPS en WiFi het oneens zijn (mogelijke storing)
  #################################################################
  automation:
    - id: presence_conflict_robin
      alias: Presence - GPS en WiFi conflict Robin
      description: Waarschuw als GPS en WiFi-aanwezigheid voor Robin conflicteren
      mode: single
      triggers:
        - trigger: state
          entity_id: person.robin_bohnen
          to: "home"
          for:
            minutes: 10
        - trigger: state
          entity_id: person.robin_bohnen
          to: "not_home"
          for:
            minutes: 10
      conditions:
        # Trigger alleen als GPS en Bayesian sensor het niet eens zijn
        - condition: template
          value_template: >-
            {% set gps_home = is_state('person.robin_bohnen', 'home') %}
            {% set bayesian_home = is_state('binary_sensor.robin_thuis', 'on') %}
            {{ gps_home != bayesian_home }}
      actions:
        - action: notify.mobile_devices_robin
          data:
            title: "Aanwezigheid conflict"
            message: >-
              GPS zegt Robin is {% if is_state('person.robin_bohnen', 'home') %}thuis{% else %}weg{% endif %},
              maar WiFi zegt het tegenovergestelde. Controleer je aanwezigheid in HA.
            data:
              push:
                sound: default

    # Spiegelbeeld van presence_conflict_robin. Dit is waarom
    # binary_sensor.samantha_thuis bestaat: zonder deze melding was die sensor
    # alleen maar een tweede mening die niemand las.
    #
    # De melding gaat naar Robin en niet naar Samantha, want dit is geen bericht
    # over waar iemand is maar een storingssignaal over de detectie zelf - en
    # dat is Robins werk. Wil je het toch naar haar sturen, dan is
    # notify.mobile_devices_partner de andere kant van dat ene regeltje.
    - id: presence_conflict_samantha
      alias: Presence - GPS en WiFi conflict Samantha
      description: Waarschuw als GPS en WiFi-aanwezigheid voor Samantha conflicteren
      mode: single
      triggers:
        - trigger: state
          entity_id: person.samantha_henkelman
          to: "home"
          for:
            minutes: 10
        - trigger: state
          entity_id: person.samantha_henkelman
          to: "not_home"
          for:
            minutes: 10
      conditions:
        # Alleen melden als GPS en de Bayesian-sensor het oneens zijn
        - condition: template
          value_template: >-
            {% set gps_home = is_state('person.samantha_henkelman', 'home') %}
            {% set bayesian_home = is_state('binary_sensor.samantha_thuis', 'on') %}
            {{ gps_home != bayesian_home }}
      actions:
        - action: notify.mobile_devices_robin
          data:
            title: "Aanwezigheid conflict"
            message: >-
              GPS zegt Samantha is {% if is_state('person.samantha_henkelman', 'home') %}thuis{% else %}weg{% endif %},
              maar WiFi zegt het tegenovergestelde. Controleer haar aanwezigheid in HA.
            data:
              push:
                sound: default
