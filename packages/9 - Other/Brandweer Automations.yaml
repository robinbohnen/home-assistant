    - id: brandweer_start_car_hvac
      alias: Brandweer - Start car HVAC
      description: Start HVAC in car if humidity is high or temperature is low
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - input_text.brandweer_laatste_melding
      conditions:
        - condition: state
          entity_id: device_tracker.hrh85f_locatie
          state: home
        - condition: numeric_state
          entity_id: sensor.hrh85f_batterij
          above: 30
        - condition: or
          conditions:
            - condition: numeric_state
              entity_id: sensor.knmi_temperatuur
              below: sensor.knmi_dauwpunt
            - condition: numeric_state
              entity_id: sensor.knmi_temperatuur
              below: 15
      actions:
        - action: button.press
          metadata: {}
          data: {}
          target:
            entity_id: button.hrh85f_start_air_conditioner

    - id: brandweer_light_p1_p2
      alias: Brandweer - Turn on P1 or P2 lights
      description: "Change light color on P1 or P2"
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - input_text.brandweer_laatste_melding
      conditions:
        - condition: state
          entity_id: light.woonkamer_hue_tafellamp
          state:
            - "on"
      actions:
        - action: scene.create
          metadata: {}
          data:
            scene_id: hue_taffellamp_nu
            snapshot_entities:
              - light.woonkamer_hue_tafellamp
        - if:
            - condition: template
              value_template: |2
                 {% set STRING = states('input_text.brandweer_laatste_melding') %}
                 {% if STRING[:3] == "P 1" %}
                 true
                 {% else %}
                 false
                 {% endif %}
          then:
            - action: light.turn_on
              metadata: {}
              target:
                entity_id: light.woonkamer_hue_tafellamp
              data:
                rgb_color:
                  - 255
                  - 38
                  - 0
          else:
            - action: light.turn_on
              metadata: {}
              target:
                entity_id: light.woonkamer_hue_tafellamp
              data:
                rgb_color:
                  - 79
                  - 122
                  - 40
        - delay:
            hours: 0
            minutes: 0
            seconds: 30
            milliseconds: 0
        - action: scene.turn_on
          metadata: {}
          target:
            entity_id: scene.hue_taffellamp_nu
          data: {}

    # De PreCom-cron POST hier bij ELKE wijziging: een statuswissel (ok <->
    # krap <-> onderbezet) óf alleen een personele wijziging in PreCom bij een
    # gelijkblijvende status, voor vandaag én morgen. Dat is een stuk vaker dan
    # de statuswissels van vroeger.
    #
    # DAAROM: alles doorgeven, maar alleen púshen bij een statuswissel.
    # `trigger.json.status_veranderd` zegt welke van de twee het is. De
    # sensoren, het dashboard, de dienstdoende ploeg en de status-input_select
    # lopen dus bij elke binnenkomst bij; de telefoon gaat alleen af als de
    # bezetting daadwerkelijk van kleur verandert - net zo vaak als voorheen.
    #
    # De payload is een volledige stand: per functie wie er beschikbaar is, wie
    # zijn pager uit heeft en wie zich heeft afgemeld, plus alle drie de
    # ploegen en wat er sinds de vorige stand is veranderd. Het uitpakken
    # daarvan staat in custom_templates/brandweer.jinja, het bewaren in
    # packages/9 - Other/Brandweer Bezetting.yaml. Deze automatisering doet
    # alleen de doorgifte en de melding.
    #
    # `queued` en niet `single`: twee standen kort na elkaar (iemand meldt zich
    # af en er komt iemand bij) zouden bij `single` de tweede laten vallen, en
    # dan klopt de opgeslagen stand niet meer met PreCom. Met de hogere
    # frequentie is de wachtrij ruimer: een reeks wijzigingen achter elkaar mag
    # niet stilletjes afgekapt worden.
    - id: brandweer_bezetting_webhook
      alias: Brandweer - (Onder)bezetting bericht
      description: Webhook voor bezettingswijzigingen brandweer
      mode: queued
      max: 10
      triggers:
        - trigger: webhook
          allowed_methods:
            - POST
            - PUT
          local_only: false
          webhook_id: brandweer-onder-bezetting-bericht-dykzRyg6UOQoTloNGJjCYxlW
      conditions: []
      actions:
        - variables:
            status: "{{ trigger.json.type }}"
            ploeg_optie: "{{ trigger.json.ploeg }} Ploeg"
            # Wisselde de status, of veranderde alleen de personele stand?
            # Ontbreekt het veld (cron van vóór augustus 2026), dan gaan we uit
            # van een wissel: liever een melding te veel dan stilletjes geen
            # enkele meer.
            status_veranderd: "{{ trigger.json.get('status_veranderd', true) | bool(true) }}"
            # Hoe hard de melding mag: alleen onderbezetting in mijn eigen
            # dienstweek is een reden voor geluid. De rest is informatie, en
            # tussen 23:00 en 06:30 is informatie geen melding waard - de
            # sensoren en het dashboard lopen dan wel gewoon bij. Hetzelfde
            # geldt voor een stand zonder statuswissel: wel verwerken, niet
            # pushen.
            ik_dienst: "{{ ploeg_optie == states('input_select.brandweer_mijn_huidige_ploeg') }}"
            urgent: "{{ status == 'onderbezet' and ik_dienst }}"
            nachtrust: "{{ now() >= today_at('23:00') or now() < today_at('06:30') }}"
        # Eerst doorgeven aan de sensoren: dan staat het dashboard goed, ook
        # als er hieronder iets misgaat (of er helemaal niet gepusht wordt).
        - alias: Stand doorgeven aan de bezettingssensoren
          event: brandweer_bezetting
          event_data:
            payload: "{{ trigger.json }}"
        # PreCom weet zeker welke ploeg dienst heeft; de maandagwissel hierboven
        # is maar een aanname die na een storing of een geruilde week scheef
        # staat. Bij verschil wint PreCom. Alleen zetten als het echt een
        # bestaande optie is, anders faalt de actie.
        - alias: Dienstdoende ploeg gelijktrekken met PreCom
          if:
            - condition: template
              value_template: >-
                {{ ploeg_optie != states('input_select.brandweer_dienstdoende_ploeg')
                   and ploeg_optie in state_attr('input_select.brandweer_dienstdoende_ploeg', 'options') }}
          then:
            - action: input_select.select_option
              target:
                entity_id: input_select.brandweer_dienstdoende_ploeg
              data:
                option: "{{ ploeg_optie }}"
        # Push met een vaste `tag`, zodat een nieuwe stand de vorige VERVANGT in
        # plaats van erbovenop te stapelen. Daarom gaat het herstelbericht ook
        # gewoon mee: dat maakt van een blijvende waarschuwing op het
        # vergrendelscherm een "weer op orde".
        - alias: Melding naar mijn telefoon
          if:
            - condition: template
              value_template: "{{ status_veranderd and (urgent or not nachtrust) }}"
          then:
            # Titel en tekst pas hier opbouwen: bij verreweg de meeste standen
            # wordt er niet gepusht en hoeft de macro niet te draaien.
            - variables:
                melding: >
                  {% from 'brandweer.jinja' import melding_json %}
                  {{ melding_json(trigger.json) | trim | from_json }}
            - action: notify.mobile_devices_robin
              data:
                title: "{{ melding.titel }}"
                message: "{{ melding.tekst }}"
                data:
                  tag: brandweer-bezetting
                  group: brandweer-bezetting
                  notification_icon: mdi:fire-truck
                  channel: Brandweer bezetting
                  importance: "{{ 'high' if urgent else 'default' }}"
                  color: >-
                    {{ '#ef4444' if status == 'onderbezet'
                       else ('#f59e0b' if status == 'krap' else '#4ade80') }}
                  push:
                    interruption-level: >-
                      {{ 'time-sensitive' if urgent
                         else ('active' if status != 'ok' and ik_dienst else 'passive') }}
                    sound: "{{ 'default' if urgent else 'none' }}"
                  actions:
                    - action: URI
                      title: PreCom
                      uri: https://brandweeruden.112radar.nl/
                    - action: URI
                      title: Bezetting
                      uri: /lovelace/overzicht#ov-brandweer
