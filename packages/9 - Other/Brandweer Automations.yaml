brandweer_package:
  rest:
    - resource: https://brandweeruden.112radar.nl/status.php
      scan_interval: 300
      sensor:
        - name: "Bezetting Ploeg A"
          icon: mdi:alpha-a-circle
          state_class: measurement
          value_template: "{{ value_json.ploegen.A.beschikbaar | float(0) | round(0)}}"
          json_attributes_path: "$.ploegen.A"
          json_attributes:
            - status
            - onderbezetting

        - name: "Bezetting Ploeg B"
          icon: mdi:alpha-b-circle
          state_class: measurement
          value_template: "{{ value_json.ploegen.B.beschikbaar | float(0)| round(0)}}"
          json_attributes_path: "$.ploegen.B"
          json_attributes:
            - status
            - onderbezetting

        - name: "Bezetting Ploeg C"
          icon: mdi:alpha-c-circle
          state_class: measurement
          value_template: "{{ value_json.ploegen.C.beschikbaar | float(0)| round(0)}}"
          json_attributes_path: "$.ploegen.C"
          json_attributes:
            - status
            - onderbezetting
  counter:
    brandweer_uden_a_ploeg_uitrukken:
      name: "Brandweer - Uitrukken A Ploeg"
      icon: mdi:fire-circle
    brandweer_uden_b_ploeg_uitrukken:
      name: "Brandweer - Uitrukken B Ploeg"
      icon: mdi:fire-circle
    brandweer_uden_c_ploeg_uitrukken:
      name: "Brandweer - Uitrukken C Ploeg"
      icon: mdi:fire-circle
    brandweer_totaal_aantal_uitrukken:
      name: "Brandweer - Totaal aantal uitrukken"
      icon: mdi:fire-circle

  input_number:
    brandweer_uitruktijd_secondes:
      name: "Brandweer - Laatste uitruktijd"
      min: 0
      max: 360
      step: 0.1
      icon: mdi:firebase
      unit_of_measurement: seconde

  input_select:
    brandweer_dienstdoende_ploeg:
      name: "Brandweer - Dienstdoende Ploeg"
      options:
        - A Ploeg
        - B Ploeg
        - C Ploeg
      icon: mdi:firebase
    brandweer_mijn_huidige_ploeg:
      name: "Brandweer - Mijn Huidige Ploeg"
      options:
        - A Ploeg
        - B Ploeg
        - C Ploeg
      icon: mdi:firebase

  input_text:
    # max: 255 en niet de standaard 100. Een P2000-regel met veel eenheden
    # ("BR heide (Uitbr.: hoog) Goordreef Erp 210093 210091 213861 214131
    # 222841" zat al op 83) loopt daar overheen, en dan faalt input_text.set_value
    # op de EERSTE actie van de webhook-automatisering: geen melding, geen TTS,
    # geen agenda. Stil falen op de grootste inzetten is precies verkeerd om.
    brandweer_laatste_melding:
      name: "Brandweer - Laatste melding"
      icon: mdi:fire-circle
      max: 255
    brandweer_laatste_melding_fonetisch:
      name: "Brandweer - Laatste Melding Fonetisch"
      icon: mdi:account-voice
      max: 255

  input_datetime:
    brandweer_laatste_melding:
      name: "Brandweer - Laatste datum/tijd Melding"
      has_date: true
      has_time: true
      icon: mdi:fire-circle
    brandweer_laatste_uitgerukt:
      name: "Brandweer - Laatst Uitgerukt op datum/tijd"
      has_date: true
      has_time: true
      icon: mdi:fire-circle

  input_boolean:
    brandweer_uitgerukt:
      name: "Brandweer - Nu uitgerukt"
      icon: mdi:fire-circle
    # Staat op `on` zolang de melding in `brandweer_laatste_melding` een
    # NA-alarmering is: een tweede P2000-bericht op hetzelfde incident, waarin
    # extra eenheden worden bijgeroepen. De webhook zet hem vóór de melding
    # zelf, zodat automatiseringen die op die input_text triggeren hem al goed
    # zien staan. Wordt gebruikt om niet twee keer een uitruk te tellen.
    brandweer_laatste_melding_na_alarmering:
      name: "Brandweer - Laatste melding is na-alarmering"
      icon: mdi:bell-plus

  template:
    - binary_sensor:
        - name: Brandweer - Uitgerukt op laatste melding
          unique_id: brandweer_uitgerukt_op_laatste_melding
          state: >-
            {% if (as_timestamp(states('input_datetime.brandweer_laatste_uitgerukt')) - as_timestamp(states('input_datetime.brandweer_laatste_melding'))) < 360 and (as_timestamp(states('input_datetime.brandweer_laatste_uitgerukt')) - as_timestamp(states('input_datetime.brandweer_laatste_melding'))) > 0 %}
              on
            {% else %}
              off
            {% endif %}

  automation:
    # Blind doortellen; de correctie komt uit PreCom. Elke bezettingswebhook
    # noemt de ploeg die écht dienst heeft en zet die hieronder gelijk (zie
    # `brandweer_bezetting_webhook`), dus een gemiste maandag of een geruilde
    # week loopt vanzelf weer recht.
    - id: brandweer_groepswissel
      alias: Brandweer - Groepswissel
      description: "Wissel de dienstdoende ploeg op maandag om 06:00"
      mode: single
      triggers:
        - hours: "6"
          trigger: time_pattern
      conditions:
        - condition: time
          weekday:
            - mon
      actions:
        - metadata: {}
          data:
            cycle: true
          target:
            entity_id: input_select.brandweer_dienstdoende_ploeg
          action: input_select.select_next

    - id: brandweer_webhook_main
      alias: Brandweer - Webhook MAIN
      description: Webhook to my firestation and team with p2000 notifications
      mode: queued
      max: 10
      triggers:
        - allowed_methods:
            - POST
            - PUT
          local_only: false
          # ROTEREN, NIET ALLEEN VERPLAATSEN
          # Een webhook-id is het wachtwoord: wie hem kent kan zonder inloggen
          # POSTen naar /api/webhook/<id>, en `local_only: false` laat dat van
          # buiten toe. Deze id stond vanaf de eerste commit (15-11-2024) in
          # het openbaar op github.com/robinbohnen/home-assistant. Hem hier
          # weghalen helpt dus niets zolang de oude waarde geldig blijft - die
          # staat nog in de git-historie. De volgorde is: nieuwe id in HA en
          # bij de verzender, daarna pas de waarde in secrets.yaml vervangen.
          webhook_id: !secret brandweer_webhook_main
          trigger: webhook
      # WELK BERICHT BESCHRIJFT DEZE WEBHOOK EIGENLIJK?
      # `trigger_message` is het P2000-bericht dat DEZE webhook liet vuren;
      # `incident` is de verzamelstand van het incident. Bij een na-alarmering
      # (tweede bericht op hetzelfde incident, extra eenheden) lopen die twee
      # uiteen, want de verzender staat op `after_enrichment` - dat is stage 1,
      # en de voertuigverrijking van bericht 2 landt pas ná die webhook op het
      # incident. In delivery 119023 stond de waterwagen dan ook alleen in
      # `trigger_message`; `incident.body` en `tts_text` beschreven nog steeds
      # de tankautospuit uit bericht 1.
      #
      # Sturen op `incident.body` maakte de tweede webhook dus niet te
      # onderscheiden van de eerste: de dedup hieronder slikte hem op, en had
      # hij dat niet gedaan, dan had de Sonos nóg een keer "1e Tankautospuit"
      # omgeroepen in plaats van de waterwagen.
      #
      # Daarom: `trigger_message` wint als die er is. Dat klopt ook wanneer de
      # verzender omgezet wordt naar `after_type_enrichment` met "elk bericht"
      # aan - dan is er een compleet incident-blok per bericht en wijst
      # `trigger_message` gewoon hetzelfde bericht aan.
      variables:
        tm_body: "{{ trigger.json.get('trigger_message', {}).get('body', '') }}"
        inc_body: "{{ trigger.json.get('incident', {}).get('body', '') }}"
        # Loopt `trigger_message` vóór op `incident`, dan is die de verse: dat
        # is de `after_enrichment`-stand hierboven. Zijn ze gelijk, dan draait
        # de verzender op `after_type_enrichment` met "elk bericht" en is
        # `incident` al compleet - dan pakken we die gewoon.
        gebruik_trigger_bericht: "{{ tm_body != '' and tm_body != inc_body }}"
        melding_body: "{{ tm_body if gebruik_trigger_bericht else inc_body }}"
        melding_tts: >-
          {{ trigger.json.get('trigger_tts_text') if (gebruik_trigger_bericht and trigger.json.get('trigger_tts_text')) else trigger.json.get('tts_text', '') }}
        # IS DIT EEN NA-ALARMERING?
        # Niet af te leiden uit `trigger_message` vs `incident`: op
        # `after_type_enrichment` met "elk bericht" zijn die twee bij een
        # na-alarmering identiek, en dan zou de ploegteller alsnog twee keer
        # oplopen voor één incident.
        #
        # Wat in béide standen klopt: een na-alarmering beschrijft hetzelfde
        # incident, alleen met andere eenheden erachter. Een P2000-body eindigt
        # op de roepnummers (zes cijfers, soms een rij: "... Goordreef Erp
        # 210093 210091 213861 214131 222841"). Haal die eraf en je houdt de
        # incidentregel over; is die gelijk aan die van de vorige melding, dan
        # gaat het om hetzelfde incident.
        #
        # De grens van 2 uur zit erbij omdat een échte nieuwe uitruk naar
        # dezelfde straat anders als na-alarmering zou gelden en niet geteld
        # zou worden. Alleen de teller hangt hieraan - de melding, de TTS en de
        # lampen gaan hoe dan ook af.
        # Let op de blok-notatie `>-` bij deze twee: in een blokwaarde blijft
        # `\\s` staan zoals het er staat, en dat is precies wat Jinja nodig
        # heeft om er `\s` van te maken. In een `"..."`-waarde eet YAML de
        # eerste backslash al op en houdt Jinja een ongeldige escape over.
        incident_kern: >-
          {{ melding_body | regex_replace('(\\s+\\d{6})+\\s*$', '') | trim }}
        vorige_kern: >-
          {{ states('input_text.brandweer_laatste_melding') | regex_replace('(\\s+\\d{6})+\\s*$', '') | trim }}
        vorige_leeftijd: >-
          {{ (now() - states.input_text.brandweer_laatste_melding.last_changed).total_seconds() }}
        na_alarmering: "{{ incident_kern != '' and incident_kern == vorige_kern and vorige_leeftijd < 2 * 60 * 60 }}"
      conditions:
        # Dedup op de tekst die we DAADWERKELIJK gaan opslaan, niet op
        # `incident.body`: zie hierboven, dat veld staat bij een na-alarmering
        # nog op bericht 1 en wees elke na-alarmering af als duplicaat.
        #
        # De rem van 60 seconden die hier stond is daarmee vervallen. Die was
        # bedoeld tegen dubbele webhooks, maar een na-alarmering komt juist
        # vaak binnen die minuut - en die moet er langs. Identieke tekst wordt
        # nog steeds geweigerd, en dát is de echte dubbele-webhook-guard: een
        # herhaalde webhook levert per definitie dezelfde body op.
        - alias: Alleen een melding die afwijkt van de vorige
          condition: template
          value_template: "{{ melding_body != '' and melding_body != states('input_text.brandweer_laatste_melding') }}"
      actions:
        # Eerst de vlag, dan pas de melding: alles wat op
        # `brandweer_laatste_melding` triggert leest deze boolean, en moet hem
        # dus al goed zien staan op het moment dat het afgaat.
        # `continue_on_error` omdat dit de EERSTE actie is: bestaat de
        # input_boolean nog niet (automations herladen zonder de rest van het
        # package), dan zou een mislukking hier de melding, de TTS én de agenda
        # meenemen - dezelfde stille storing als de 255-tekengrens hierboven.
        # Een verkeerd getelde uitruk is een stuk minder erg dan een uitruk die
        # nergens aankomt.
        - alias: Markeer of dit een na-alarmering is
          action: "input_boolean.turn_{{ 'on' if na_alarmering else 'off' }}"
          continue_on_error: true
          target:
            entity_id: input_boolean.brandweer_laatste_melding_na_alarmering
        - target:
            entity_id: input_text.brandweer_laatste_melding
          data:
            value: "{{ melding_body }}"
          alias: Stel variabele in met de laatste melding erin
          action: input_text.set_value
        - target:
            entity_id: input_text.brandweer_laatste_melding_fonetisch
          data:
            value: "{{ melding_tts }}"
          alias: Stel variabele in met de laatste melding erin (fonetisch)
          action: input_text.set_value
        - metadata: {}
          data:
            timestamp: "{{ now().timestamp() }}"
          target:
            entity_id: input_datetime.brandweer_laatste_melding
          action: input_datetime.set_datetime

    - id: brandweer_tts_nesthub
      alias: Brandweer - TTS on Nest Hub Livingroom
      description: TTS on Nest Hub in the livingroom if door opens
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - binary_sensor.entree_deur_contact
          from: "off"
          to: "on"
        - trigger: state
          entity_id:
            - input_text.brandweer_laatste_melding_fonetisch
      conditions:
        # EEN RELOAD IS GEEN NIEUWE MELDING
        # Een YAML-reload schrijft deze input_text opnieuw weg met exact
        # dezelfde tekst: `last_changed` blijft staan, `last_updated` springt
        # naar nu. Voor een state-trigger zonder `to:` telt dat als een
        # wijziging. Op 2026-08-08 om 11:57 ging daardoor de melding van drie
        # uur eerder opnieuw af - critical push dwars door de stille modus, de
        # BRW-lampen aan, omroep op de Sonos en een uitruk extra op de teller.
        # Deze conditie eist dat de tekst echt anders is; `is not none` vangt
        # daarnaast de herstart af, want dan is er geen vorige toestand.
        # De deurtrigger hierboven komt er gewoon langs: off -> on is een
        # echte wijziging.
        - alias: Alleen bij een echt nieuwe melding
          condition: template
          value_template: >-
            {{ trigger.from_state is not none
               and trigger.to_state is not none
               and trigger.from_state.state != trigger.to_state.state }}
        # `last_changed` en niet `last_updated`: juist die laatste springt mee
        # bij een reload, waardoor de controle die dit had moeten tegenhouden
        # degene was die het doorliet.
        - alias: Kijk of de laatste wijzigingen minder dan 2 minuten geleden was
          condition: template
          value_template: >-
            {{ (now() -
            states.input_text.brandweer_laatste_melding_fonetisch.last_changed).total_seconds()
            < 2 * 60 }}
      actions:
        - parallel:
            - alias: Zet het bericht op de klok in de keuken
              data:
                qos: 0
                retain: false
                topic: clock_1/notify
                payload: >-
                  {"icon": 555, "repeat": 4, "text": " {{
                  states.input_text.brandweer_laatste_melding.state }}",
                  "scrollSpeed": 50, "stack": false}
              action: mqtt.publish
            - action: media_player.play_media
              target:
                entity_id: media_player.woonkamer_sonos
              data:
                announce: true
                extra:
                  volume: 40
                media:
                  media_content_id: >-
                    media-source://tts/tts.google_translate_nl_nl?message={{
                    states.input_text.brandweer_laatste_melding_fonetisch.state}}
                  media_content_type: music
                  metadata: {}

    - id: brandweer_count_teams
      alias: Brandweer - Counter Teams
      description: "Plus counter if team is called"
      mode: single
      triggers:
        - entity_id:
            - input_text.brandweer_laatste_melding
          trigger: state
      conditions:
        # Een reload herschrijft de melding met dezelfde tekst en telde hier
        # een uitruk bij die nooit heeft plaatsgevonden; zie de toelichting bij
        # `brandweer_tts_nesthub`.
        - alias: Alleen bij een echt nieuwe melding
          condition: template
          value_template: >-
            {{ trigger.from_state is not none
               and trigger.to_state is not none
               and trigger.from_state.state != trigger.to_state.state }}
        # Een na-alarmering is extra materieel op een uitruk die al loopt, geen
        # tweede uitruk. Sinds de webhook ook op `trigger_message` stuurt komen
        # die berichten hier wél binnen (voorheen sneuvelden ze in de dedup) -
        # en dan zou de ploegteller twee keer oplopen voor één incident.
        - alias: Niet nog eens tellen bij een na-alarmering
          condition: state
          entity_id: input_boolean.brandweer_laatste_melding_na_alarmering
          state: "off"
        - condition: template
          value_template: >-
            {% if 'TESTMELDING' in states.input_text.brandweer_laatste_melding.state %}
            false
            {% else %}
            true
            {% endif %}
        - condition: template
          value_template: >-
            {% if 'INTREKKEN ALARM' in states.input_text.brandweer_laatste_melding.state %}
            false
            {% else %}
            true
            {% endif %}
      actions:
        - choose:
            - conditions:
                - condition: state
                  entity_id: input_select.brandweer_dienstdoende_ploeg
                  state: A Ploeg
              sequence:
                - action: counter.increment
                  metadata: {}
                  data: {}
                  target:
                    entity_id: counter.brandweer_uden_a_ploeg_uitrukken
            - conditions:
                - condition: state
                  entity_id: input_select.brandweer_dienstdoende_ploeg
                  state: B Ploeg
              sequence:
                - action: counter.increment
                  metadata: {}
                  data: {}
                  target:
                    entity_id: counter.brandweer_uden_b_ploeg_uitrukken
            - conditions:
                - condition: state
                  entity_id: input_select.brandweer_dienstdoende_ploeg
                  state: C Ploeg
              sequence:
                - action: counter.increment
                  metadata: {}
                  data: {}
                  target:
                    entity_id: counter.brandweer_uden_c_ploeg_uitrukken

    - id: brandweer_count_incidents
      alias: Brandweer - Count my incidents
      description: "Add 1 to counter of my own incidents"
      triggers:
        - entity_id:
            - input_boolean.brandweer_uitgerukt
          to: "on"
          trigger: state
      conditions:
        - condition: template
          value_template: >-
            {% if 'TESTMELDING' in states.input_text.brandweer_laatste_melding.state %}
            false
            {% elif 'INTREKKEN' in states.input_text.brandweer_laatste_melding.state %}
            false
            {% else %}
            true
            {% endif %}
      actions:
        - action: counter.increment
          metadata: {}
          data: {}
          target:
            entity_id: counter.brandweer_totaal_aantal_uitrukken
      mode: single

    - id: brandweer_extend_calendar
      alias: Brandweer - Extend Calendar Appointment
      description: "Auto extend the appointment if still at incident"
      mode: single
      triggers:
        - minutes: /5
          trigger: time_pattern
      conditions:
        - condition: state
          entity_id: input_boolean.brandweer_uitgerukt
          state: "on"
      actions:
        - data:
            event_id: "{{ state_attr('sensor.recente_uitruk_in_agenda','uid') }}"
            subject: "{{ state_attr('sensor.recente_uitruk_in_agenda','summary') }}"
            end: >-
              {{ (as_timestamp(now()) + (60*20)  | float) |
              timestamp_custom('%Y-%m-%dT%H:%M:%S') }}
          target:
            entity_id: calendar.robin_bohnen_nl_brandweer_uitrukken
          action: ms365_calendar.modify_calendar_event
        - data:
            event_id: "{{ state_attr('sensor.recente_uitruk_in_agenda_business','uid') }}"
            subject: "{{ state_attr('sensor.recente_uitruk_in_agenda_business','summary') }}"
            end: >-
              {{ (as_timestamp(now()) + (60*20)  | float) |
              timestamp_custom('%Y-%m-%dT%H:%M:%S') }}
          target:
            entity_id: calendar.r_bohnen_vrbn_nl_agenda
          action: ms365_calendar.modify_calendar_event

    # Zelfde trackerkeuze als in `brandweer_webhook_main_calendar` hieronder: de
    # GPS-tracker van de app in plaats van person.robin_bohnen.
    - id: brandweer_back_at_station
      alias: Brandweer - Back at Station
      description: Cancel incident if back at the firestation
      mode: single
      triggers:
        - entity_id: device_tracker.iphone_van_robin
          zone: zone.brandweer_kazerne_uden
          event: enter
          trigger: zone
        - entity_id: device_tracker.iphone_van_robin
          zone: zone.home
          event: enter
          trigger: zone
      conditions:
        # `for: 5 minuten` want de eerste trigger hierboven vuurt OOK op mijn
        # aankomst bij het uitrukken - precies het moment waarop de
        # agenda-automatisering de vlag aanzet. Zonder deze rem is het een race
        # tussen twee automatiseringen die op dezelfde state-change reageren, en
        # verliest hij: de afspraak zou meteen weer afgesloten worden. Met de
        # snellere app-tracker wordt dat venster scherper dan het was.
        - condition: state
          entity_id: input_boolean.brandweer_uitgerukt
          state: "on"
          for:
            hours: 0
            minutes: 5
            seconds: 0
      actions:
        - metadata: {}
          data: {}
          target:
            entity_id: input_boolean.brandweer_uitgerukt
          action: input_boolean.turn_off
        - metadata: {}
          data:
            title: Robin is weer terug van de uitruk
            message: Robin is terug op de kazerne / thuis van de brandweer melding.
          action: notify.notify
        - data:
            event_id: "{{ state_attr('sensor.recente_uitruk_in_agenda_business','uid') }}"
            end: "{{ now() }}"
            subject: "{{ state_attr('sensor.recente_uitruk_in_agenda_business','summary') }}"
          target:
            entity_id: calendar.r_bohnen_vrbn_nl_agenda
          action: ms365_calendar.modify_calendar_event
        - data:
            event_id: "{{ state_attr('sensor.recente_uitruk_in_agenda','uid') }}"
            end: "{{ now() }}"
            subject: "{{ state_attr('sensor.recente_uitruk_in_agenda','summary') }}"
          target:
            entity_id: calendar.robin_bohnen_nl_brandweer_uitrukken
          action: ms365_calendar.modify_calendar_event
        - metadata: {}
          data:
            availability: Available
          target:
            entity_id:
              - sensor.r_bohnen_vrbn_nl_status
          action: ms365_teams.update_user_preferred_status

    - id: brandweer_send_message_uden
      alias: Brandweer - Webhook MAIN - Send messages
      description: "Send message when input text changes"
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - input_text.brandweer_laatste_melding
      conditions:
        # Een reload herschrijft de melding met dezelfde tekst en stuurde hier
        # een critical push voor een uitruk van uren eerder; zie de toelichting
        # bij `brandweer_tts_nesthub`.
        - alias: Alleen bij een echt nieuwe melding
          condition: template
          value_template: >-
            {{ trigger.from_state is not none
               and trigger.to_state is not none
               and trigger.from_state.state != trigger.to_state.state }}
      actions:
        # De titel zegt of dit een eerste alarmering is of extra materieel op
        # een uitruk die al loopt. Zonder dat verschil is een na-alarmering op
        # het vergrendelscherm niet van een dubbele melding te onderscheiden.
        - variables:
            melding_titel: >-
              {{ 'Brandweer Uden - na-alarmering'
                 if is_state('input_boolean.brandweer_laatste_melding_na_alarmering', 'on')
                 else 'Brandweer Uden' }}
        - alias: Stuur bericht naar Home Assistant gebruikers
          if:
            - condition: template
              value_template: "{{ states('input_select.brandweer_dienstdoende_ploeg') == states('input_select.brandweer_mijn_huidige_ploeg') }}"
              alias: Kijk of ik momenteel dienst heb
          then:
            # Volume 1 en critical: een uitruk mag geen stille modus overleven.
            # De else-tak hieronder stuurt dezelfde tekst zonder geluid, want
            # dan heb ik geen dienst.
            - data:
                doelgroep: notify.mobile_devices_all
                titel: "{{ melding_titel }}"
                bericht: "{{ states.input_text.brandweer_laatste_melding.state }}"
                volume: 1
              alias: Stuur HA notificatie naar alle gebruikers met hoge prioriteit
              action: script.notify_critical
          else:
            - metadata: {}
              data:
                title: "{{ melding_titel }}"
                message: "{{ states.input_text.brandweer_laatste_melding.state }}"
              alias: Stuur HA notificatie naar alle gebruikers met lage prioriteit
              action: notify.mobile_devices_all

    - id: brandweer_webhook_main_automations
      alias: Brandweer - Webhook MAIN - Light and Alarm
      description: Change all lights based on service or not and turn off and on Alarm
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - input_text.brandweer_laatste_melding
      conditions:
        # Een reload herschrijft de melding met dezelfde tekst en zette hier de
        # lampen op de uitruk-stand; zie de toelichting bij
        # `brandweer_tts_nesthub`.
        - alias: Alleen bij een echt nieuwe melding
          condition: template
          value_template: >-
            {{ trigger.from_state is not none
               and trigger.to_state is not none
               and trigger.from_state.state != trigger.to_state.state }}
      actions:
        # WELKE LAMPEN STONDEN ER UIT TOEN DE MELDING BINNENKWAM
        # Nodig om ze naderhand weer uit te kunnen doen, en dat is nodig omdat
        # het ontwapenen hieronder veel meer aanzet dan deze automatisering
        # zelf. `alarm_control_panel.alarmo` op `disarmed` is namelijk het
        # thuiskomst-signaal van het hele huis: elke kamer op
        # blueprints/automation/robin/lights_onoff.yaml luistert erop, net als
        # `Backyard - Lights`. Op 9 augustus 2026 om 23:37 en 23:40 ging
        # daardoor binnen twee seconden werkelijk alles aan - keuken, woonkamer,
        # tv-kast, hue-tafellamp, de brw-groepen en de hele achtertuin.
        #
        # Bij het weer aanzetten van het alarm gaat dat NIET vanzelf terug. Die
        # blueprint dooft alleen als er geen volwassene meer thuis is, en bij een
        # nachtelijke uitruk is dat precies niet het geval: Samantha ligt boven,
        # dus het wordt `armed_home` en de "vertrek"-tak slaat over. Wat er
        # daarna uitging waren alleen de vier groepen die hieronder met naam
        # genoemd staan; de rest bleef de hele nacht branden. Nagemeten in de
        # geschiedenis van 9 op 10 augustus.
        #
        # Vandaar deze momentopname: aan het eind gaat alles wat tóen uit stond
        # en nu aan staat weer uit. Een lamp die al brandde blijft dus branden.
        - alias: Onthoud welke lampen uit stonden
          variables:
            lampen_vooraf_uit: >-
              {{ states.light
                 | selectattr('state', 'eq', 'off')
                 | map(attribute='entity_id')
                 | list }}
        - parallel:
            - alias: Zet bericht op de keukenklok
              # DE STAND VAN DE KLOK ZELF, NIET EEN TWEEDE AFLEIDING ERVAN
              # Hier stond `light.woonkamer_lampen` aan als voorwaarde. Maar of
              # de keukenklok aan staat wordt bepaald door
              # `script.klok_keuken_woonkamer_stand`, en dat is een ruimere
              # regel: alarm uit OF woonkamerlicht aan. Overdag met het alarm
              # eraf en de lampen uit stond die klok dus gewoon te branden
              # terwijl er bij een uitruk niets op verscheen. De matrix-entiteit
              # navragen kan niet uit de pas gaan lopen als die regel ooit
              # verandert - dezelfde reden waarom dat script bestaat.
              #
              # EN WAAROM DE ANDERE TWEE KLOKKEN HIER GEEN CHECK KRIJGEN
              # Op 2026-08-09 nagemeten op de garageklok: stuur je een `notify`
              # naar een klok waarvan de matrix uit staat, dan wordt het bericht
              # wel in de buffer getekend en heet de app `Notification`, maar
              # `matrix` blijft `false` - het scherm gaat er dus niet vanzelf
              # van aan en je ziet niets. Onschadelijk: de herhalingen lopen
              # ondertussen af, dus er blijft ook niets staan voor de volgende
              # keer dat het scherm aangaat. Een check zou daar dus niets
              # veranderen behalve het geval waarin het scherm halverwege
              # aangaat, en dan vang je juist liever nog de staart mee.
              if:
                - condition: state
                  entity_id: light.keuken_klok_awtrix_keuken_matrix
                  state: "on"
              then:
                - data:
                    qos: 0
                    retain: false
                    topic: clock_1/notify
                    # `to_json` om de tekst, om dezelfde reden als bij de
                    # woonkamer- en garageklok hieronder: een melding met een
                    # aanhalingsteken of backslash erin maakte hier ongeldige
                    # JSON, en dan blijft dit scherm stil bij precies het
                    # bericht dat niet gemist mag worden.
                    payload: >-
                      {"icon": 555, "repeat": 4, "scrollSpeed": 50,
                      "sound": "alarm", "stack": false,
                      "text": {{ (' ' ~ states('input_text.brandweer_laatste_melding')) | to_json }}}
                  action: mqtt.publish
            # DE WOONKAMER- EN GARAGEKLOK KRIJGEN HEM ALTIJD
            # Zonder gok op de woonkamerlampen: die twee klokken staan altijd
            # aan en tonen verder alleen zon en accu, dus een melding is daar
            # het enige dat om aandacht vraagt. Zie packages/9 - Other/
            # Klokken.yaml voor wat er verder op die schermen gebeurt.
            #
            # `rtttl` EN NIET `sound`
            # `sound` verwijst naar een bestand in /MELODIES op de klok zelf.
            # Die map is op een nieuwe klok leeg, en dan scrollt de melding
            # geluidloos voorbij zonder dat iets dat meldt. De sirene gaat
            # daarom als losse noten mee - zelfde deuntje als alarm.txt op de
            # keukenklok, maar zonder iets dat op het apparaat moet staan.
            #
            # HET ICOON MOET ER WEL OP STAAN
            # Icoon 555 is een bestand in /ICONS. Voor een nieuwe klok:
            #   curl -o 555.jpg http://<ip-keukenklok>/ICONS/555.jpg
            #   curl -F "data=@555.jpg;filename=/ICONS/555.jpg" http://<ip-nieuwe-klok>/edit
            - alias: Zet bericht op de woonkamer- en garageklok
              repeat:
                for_each:
                  - clock_2
                  - clock_3
                sequence:
                  - action: mqtt.publish
                    data:
                      qos: 0
                      retain: false
                      topic: "{{ repeat.item }}/notify"
                      # to_json om de tekst: een melding met een aanhalingsteken
                      # of backslash erin maakt anders ongeldige JSON en dan
                      # blijft het scherm stil - precies bij het bericht dat
                      # niet gemist mag worden. De spatie ervoor laat de tekst
                      # netjes het scherm in schuiven.
                      payload: >-
                        {"icon": 555, "repeat": 4, "scrollSpeed": 50,
                        "stack": false,
                        "rtttl": "siren:d=8,o=5,b=50:b,e,b,e,b,e",
                        "text": {{ (' ' ~ states('input_text.brandweer_laatste_melding')) | to_json }}}
            - if:
                # DE MOMENTOPNAME, NIET DE LIVE STAND
                # Hier stond een live check op `light.woonkamer_lampen == on`,
                # en dat was 's nachts een race: het ontwapenen is het
                # thuiskomst-signaal van het hele huis en zet die lampen ~1 s
                # na de trigger alsnog aan. Of het effect kwam hing dus af van
                # wie er eerder was (op 9 augustus scheelde het 3 seconden).
                # De momentopname bovenaan is genomen vóór het ontwapenen en
                # ligt vast: brandden de lampen al, dan is er iemand op en mag
                # het effect komen. En dat de tak 's nachts overslaat is de
                # bedoeling - bij een nachtelijke uitruk wil je gewoon licht
                # om je spullen te vinden, geen rood/blauw ademende lampen
                # (Robin, 14 augustus 2026).
                - condition: template
                  alias: Woonkamerlampen brandden al vóór de melding
                  value_template: >-
                    {{ 'light.woonkamer_lampen' not in lampen_vooraf_uit }}
                # De live check blijft er alleen bij voor `unavailable`: een
                # weggevallen groep staat niet in de uit-lijst en zou anders
                # als "aan" doortellen.
                - condition: state
                  entity_id: light.woonkamer_lampen
                  state: "on"
              then:
                - if:
                    - condition: template
                      value_template: "{{ states('input_select.brandweer_dienstdoende_ploeg') == states('input_select.brandweer_mijn_huidige_ploeg') }}"
                      alias: Kijk of ik momenteel dienst heb
                  then:
                    - metadata: {}
                      data:
                        scene_id: brandweer_pre_lampen
                        snapshot_entities:
                          - light.brw_groep_1
                          - light.brw_groep_2
                      alias: Huidige lampen scene aanmaken
                      action: scene.create
                    - data:
                        rgb_color:
                          - 255
                          - 0
                          - 0
                        effect: breathe
                      action: light.turn_on
                      target:
                        entity_id: light.brw_groep_1
                    - data:
                        rgb_color:
                          - 0
                          - 0
                          - 255
                        effect: breathe
                      target:
                        entity_id: light.brw_groep_2
                      action: light.turn_on
                    - delay:
                        hours: 0
                        minutes: 0
                        seconds: 15
                        milliseconds: 0
                    # Riep hiervoor automation.livingroom_media_playing en
                    # ...media_paused aan met `skip_condition: true` - de omweg
                    # om bij de acties van een andere automatisering te komen
                    # zonder haar condities. Die acties staan nu in
                    # script.woonkamer_media_licht (packages/0 - Ground
                    # Floor/Livingroom/Media.yaml), dus het kan rechtstreeks.
                    #
                    # De scene hieronder komt er bewust ná: die zet de lampen
                    # uit de momentopname terug op precies de stand van vóór het
                    # alarm. Dit script vult aan wat niet in die momentopname
                    # zat (eettafel, awtrix, de meelift-lampen).
                    - alias: Apple TV aan of uit, juiste lichtstand
                      if:
                        - condition: state
                          entity_id: media_player.woonkamer_appletv
                          state: playing
                      then:
                        - action: script.woonkamer_media_licht
                          data:
                            stand: kijken
                      else:
                        - action: script.woonkamer_media_licht
                          data:
                            stand: pauze
                    - target:
                        entity_id: scene.brandweer_pre_lampen
                      data:
                        transition: 3
                      alias: Alle lampen terug op eerdere instellingen
                      action: scene.turn_on
                  else:
                    - metadata: {}
                      data:
                        scene_id: brandweer_tv_kast_lampen
                        snapshot_entities:
                          - light.woonkamer_tv_kast_hue_bar_links
                          - light.woonkamer_tv_kast_hue_bar_rechts
                          - light.woonkamer_ledstrip_tv_kast
                      alias: TV Kast scene aanmaken
                      action: scene.create
                    - metadata: {}
                      data:
                        rgb_color:
                          - 4
                          - 51
                          - 255
                      target:
                        entity_id:
                          - light.woonkamer_tv_kast_hue_bar_links
                          - light.woonkamer_ledstrip_tv_kast
                      action: light.turn_on
                    - metadata: {}
                      data:
                        rgb_color:
                          - 255
                          - 38
                          - 0
                      target:
                        entity_id: light.woonkamer_tv_kast_hue_bar_rechts
                      action: light.turn_on
                    - delay:
                        hours: 0
                        minutes: 0
                        seconds: 15
                        milliseconds: 0
                    - metadata: {}
                      target:
                        entity_id: scene.brandweer_tv_kast_lampen
                      action: scene.turn_on
                      data: {}
                    # Zelfde omzetting als in de dienst-tak hierboven: geen
                    # automation.trigger met skip_condition meer, maar het
                    # script dat de twee lichtstanden beschrijft.
                    - alias: Apple TV aan of uit, juiste lichtstand
                      if:
                        - condition: state
                          entity_id: media_player.woonkamer_appletv
                          state: playing
                      then:
                        - action: script.woonkamer_media_licht
                          data:
                            stand: kijken
                      else:
                        - action: script.woonkamer_media_licht
                          data:
                            stand: pauze
              alias: Stel lampen in op kleur
            - alias: Slaapkamer licht weer uit
              if:
                - condition: numeric_state
                  entity_id: cover.slaapkamer_rolluik
                  attribute: current_position
                  below: 16
                - condition: time
                  after: "19:30:00"
                  before: "07:00:00"
              then:
                - sequence:
                    - if:
                        - condition: template
                          value_template: "{{ states('input_select.brandweer_dienstdoende_ploeg') == states('input_select.brandweer_mijn_huidige_ploeg') }}"
                          alias: Kijk of ik momenteel dienst heb
                      then:
                        - action: light.turn_on
                          metadata: {}
                          data:
                            brightness_pct: 10
                            transition: 2
                          target:
                            entity_id: light.slaapkamer_lampen
                    - wait_for_trigger:
                        - trigger: state
                          entity_id:
                            - binary_sensor.slaapkamer_slaapkamer_deur_deur
                          from: "on"
                          to: "off"
                      timeout:
                        hours: 0
                        minutes: 1
                        seconds: 0
                        milliseconds: 0
                    - alias: Slaapkamer licht weer uit
                      metadata: {}
                      data:
                        transition: 1
                      target:
                        entity_id: light.slaapkamer_lampen
                      action: light.turn_off
            - alias: Al het licht weer uit en alarm aan
              if:
                - condition: numeric_state
                  entity_id: cover.slaapkamer_rolluik
                  attribute: current_position
                  below: 16
                - condition: time
                  after: "19:30:00"
                  before: "07:00:00"
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: alarm_control_panel.alarmo
                      state: disarmed
                      for:
                        hours: 0
                        minutes: 15
                        seconds: 0
              then:
                - sequence:
                    - if:
                        - condition: template
                          value_template: "{{ states('input_select.brandweer_dienstdoende_ploeg') == states('input_select.brandweer_mijn_huidige_ploeg') }}"
                          alias: Kijk of ik momenteel dienst heb
                      then:
                        - action: alarm_control_panel.alarm_disarm
                          metadata: {}
                          data: {}
                          target:
                            entity_id: alarm_control_panel.alarmo
                        - action: light.turn_on
                          metadata: {}
                          data: {}
                          target:
                            entity_id:
                              - light.eettafel_lampen
                              - light.entree_lampen
                              - light.speelkamer_lampen
                      alias: Als ik wel dienst heb
                    - alias: Als ik geen dienst heb
                      if:
                        - condition: template
                          value_template: "{{ states('input_select.brandweer_dienstdoende_ploeg') != states('input_select.brandweer_mijn_huidige_ploeg') }}"
                          alias: Kijk of ik momenteel geen dienst heb
                      then:
                        - wait_for_trigger:
                            - trigger: state
                              entity_id:
                                - binary_sensor.slaapkamer_slaapkamer_deur_deur
                              from: "off"
                              to: "on"
                            - trigger: state
                              entity_id:
                                - binary_sensor.entree_deur_contact
                              from: "off"
                              to: "on"
                          timeout:
                            hours: 0
                            minutes: 2
                            seconds: 30
                          continue_on_timeout: false
                        - action: alarm_control_panel.alarm_disarm
                          metadata: {}
                          data: {}
                          target:
                            entity_id: alarm_control_panel.alarmo
                        - action: light.turn_on
                          metadata: {}
                          data: {}
                          target:
                            entity_id:
                              - light.eettafel_lampen
                              - light.entree_lampen
                              - light.speelkamer_lampen
                    - alias: Wacht tot Robin thuis weggaat
                      wait_for_trigger:
                        - entity_id: person.robin_bohnen
                          zone: zone.home
                          event: leave
                          trigger: zone
                      timeout:
                        hours: 0
                        minutes: 2
                        seconds: 30
                        milliseconds: 0
                      continue_on_timeout: true
                    - alias: Licht weer uit
                      data: {}
                      target:
                        entity_id:
                          - light.slaapkamer_lampen
                          - light.entree_lampen
                          - light.eettafel_lampen
                          - light.speelkamer_lampen
                      action: light.turn_off
                    # EN DE REST VAN HET HUIS, DAT DOOR HET ONTWAPENEN AANGING
                    # De vier hierboven blijven met naam staan: die zet deze
                    # automatisering zelf aan, en die horen hoe dan ook uit -
                    # ook als er eentje toevallig al brandde toen de melding
                    # binnenkwam. Hieronder gaat alleen uit wat bij de melding
                    # aantoonbaar uit stónd; zie de momentopname bovenaan de
                    # acties. Wat er al brandde raken we niet aan.
                    #
                    # Dit staat expres vóór het alarm hieronder, in dezelfde
                    # volgorde als de regel erboven: eerst het huis donker, dan
                    # pas op scherp.
                    - alias: Wat door het ontwapenen aanging ook weer uit
                      variables:
                        weer_uit: >-
                          {% set aan_nu = states.light
                             | selectattr('state', 'eq', 'on')
                             | map(attribute='entity_id')
                             | list %}
                          {{ lampen_vooraf_uit | select('in', aan_nu) | list }}
                    - if:
                        - condition: template
                          value_template: "{{ weer_uit | count > 0 }}"
                      then:
                        - action: light.turn_off
                          data: {}
                          target:
                            entity_id: "{{ weer_uit }}"
                    - alias: Alarm weer aanzetten
                      choose:
                        - conditions:
                            - condition: state
                              entity_id: alarm_control_panel.alarmo
                              state: disarmed
                            - condition: zone
                              entity_id: person.samantha_henkelman
                              zone: zone.home
                          sequence:
                            - metadata: {}
                              data: {}
                              action: alarm_control_panel.alarm_arm_home
                              target:
                                entity_id: alarm_control_panel.alarmo
                        - conditions:
                            - condition: state
                              entity_id: alarm_control_panel.alarmo
                              state: disarmed
                            - condition: not
                              conditions:
                                - condition: zone
                                  entity_id: person.samantha_henkelman
                                  zone: zone.home
                          sequence:
                            - action: alarm_control_panel.alarm_arm_away
                              metadata: {}
                              data: {}
                              target:
                                entity_id: alarm_control_panel.alarmo

    # LET OP: hier staat bewust `device_tracker.iphone_van_robin` en NIET
    # `person.robin_bohnen`. De person-entiteit hangt aan twee trackers, en
    # `device_tracker.iphone_9` is er een van het type `router`. Home Assistant
    # geeft een niet-GPS-tracker die `home` zegt voorrang boven de GPS-tracker,
    # en die router bleef in de praktijk 7 tot 12 minuten "thuis" melden nadat
    # ik al weg was. De zone-enter op de kazerne kwam daardoor bij `person` vaak
    # helemaal niet binnen - de app-tracker had me er al na 2 a 4 minuten staan.
    # Gevolg: de wait_for_trigger hieronder liep af, `continue_on_timeout: false`
    # kapte de run af, en de uitruk kwam nergens terecht (agenda, uitgerukt-vlag,
    # teller). In de 11 dagen die de recorder bewaarde miste dat 4 van de 6
    # uitrukken; de twee die het haalden waren mazzel (5m48 van de 6 minuten) of
    # omdat ik al op de kazerne stond. Zelfde reden in `brandweer_back_at_station`.
    - id: brandweer_webhook_main_calendar
      alias: Brandweer - Webhook MAIN - Calendar changes
      description: Add appointment to calendar when gone with firestation
      mode: single
      triggers:
        # GEEN wait_for_trigger meer: die wachtte hier tot 10 minuten op de
        # kazerne-aankomst, en een automation-reload in dat venster doodde de
        # wachtende run - dan kwam de hele uitruk nergens terecht (agenda,
        # uitgerukt-vlag, teller). Zelfde kwaal en zelfde oplossing als bij de
        # zonnescherm- en zoldervraag: de aankomst is nu zelf een trigger en
        # de versheid van de melding een conditie, in plaats van een run die
        # in leven moet blijven.
        - trigger: state
          entity_id:
            - input_text.brandweer_laatste_melding
          id: melding
        - trigger: zone
          entity_id: device_tracker.iphone_van_robin
          zone: zone.brandweer_kazerne_uden
          event: enter
          id: kazerne
      conditions:
        - condition: or
          conditions:
            # Tak 1: melding terwijl ik al op de kazerne sta - dan komt er
            # geen zone-enter meer. De from/to-check: een reload herschrijft
            # de melding met dezelfde tekst; zie `brandweer_tts_nesthub`.
            - condition: and
              conditions:
                - condition: trigger
                  id: melding
                - alias: Alleen bij een echt nieuwe melding
                  condition: template
                  value_template: >-
                    {{ trigger.from_state is not none
                       and trigger.to_state is not none
                       and trigger.from_state.state != trigger.to_state.state }}
                - condition: zone
                  entity_id: device_tracker.iphone_van_robin
                  zone: zone.brandweer_kazerne_uden
            # Tak 2: aankomst op de kazerne binnen 10 minuten na de melding.
            # 10 en niet 6 minuten om dezelfde reden als voorheen bij de wait:
            # een telefoon die even geen fix heeft of een uitruk waarbij ik
            # van verder moet komen mag niet stilletjes buiten de boot vallen.
            # Te laat een agenda-item is beter dan geen.
            - condition: and
              conditions:
                - condition: trigger
                  id: kazerne
                - alias: Melding is minder dan 10 minuten oud
                  condition: template
                  value_template: >-
                    {{ (now() - states.input_text.brandweer_laatste_melding.last_changed)
                       .total_seconds() < 600 }}
      actions:
        # De conditions hierboven garanderen al dat ik op de kazerne sta; deze
        # buitenste if bewaart de structuur van vóór de refactor (zodat het
        # registratieblok eronder niet hoefde te verspringen) en vangt het
        # theoretische geval dat de tracker wegspringt tussen conditie en
        # actie.
        - alias: Alleen registreren als ik echt op de kazerne sta
          if:
            - condition: zone
              entity_id: device_tracker.iphone_van_robin
              zone: zone.brandweer_kazerne_uden
          then:
            - alias: Als Robin op de kazerne is
              if:
                - alias: Kijk of ik op de kazerne ben
                  condition: or
                  conditions:
                    - condition: zone
                      entity_id: device_tracker.iphone_van_robin
                      zone: zone.brandweer_kazerne_uden
              then:
                - if:
                    - condition: not
                      conditions:
                        - condition: state
                          entity_id: sensor.recente_uitruk_in_agenda
                          state: "on"
                      alias: Kijk of er nog geen melding in de agenda staat
                  then:
                    - metadata: {}
                      data:
                        title: Robin is uitgerukt
                        message: >-
                          Naar deze melding; {{
                          states.input_text.brandweer_laatste_melding.state }}
                      action: notify.mobile_devices_all
                    - metadata: {}
                      data: {}
                      target:
                        entity_id: input_boolean.brandweer_uitgerukt
                      action: input_boolean.turn_on
                    - metadata: {}
                      data:
                        timestamp: "{{ now().timestamp() }}"
                      target:
                        entity_id: input_datetime.brandweer_laatste_uitgerukt
