            uitvoeren: "{% from 'klimaat.jinja' import advies %}{{ (advies('keuken_rolgordijn_groot') | trim | from_json).uitvoeren }}"
            vraagt: "{% from 'klimaat.jinja' import advies %}{{ (advies('keuken_rolgordijn_groot') | trim | from_json).vraagt }}"
            reden: "{% from 'klimaat.jinja' import advies %}{{ (advies('keuken_rolgordijn_groot') | trim | from_json).reden }}"
            blokkade: "{% from 'klimaat.jinja' import advies %}{{ (advies('keuken_rolgordijn_groot') | trim | from_json).blokkade }}"
            cover: "{% from 'klimaat.jinja' import advies %}{{ (advies('keuken_rolgordijn_groot') | trim | from_json).cover }}"

        - name: "Zonwering advies Keuken rolgordijn klein"
          unique_id: zonwering_advies_keuken_rolgordijn_klein
          icon: mdi:blinds
          state: "{% from 'klimaat.jinja' import advies %}{{ (advies('keuken_rolgordijn_klein') | trim | from_json).advies }}"
          attributes:
            positie: "{% from 'klimaat.jinja' import advies %}{{ (advies('keuken_rolgordijn_klein') | trim | from_json).positie }}"
            uitvoeren: "{% from 'klimaat.jinja' import advies %}{{ (advies('keuken_rolgordijn_klein') | trim | from_json).uitvoeren }}"
            vraagt: "{% from 'klimaat.jinja' import advies %}{{ (advies('keuken_rolgordijn_klein') | trim | from_json).vraagt }}"
            reden: "{% from 'klimaat.jinja' import advies %}{{ (advies('keuken_rolgordijn_klein') | trim | from_json).reden }}"
            blokkade: "{% from 'klimaat.jinja' import advies %}{{ (advies('keuken_rolgordijn_klein') | trim | from_json).blokkade }}"
            cover: "{% from 'klimaat.jinja' import advies %}{{ (advies('keuken_rolgordijn_klein') | trim | from_json).cover }}"

        - name: "Zonwering advies Kantoor links"
          unique_id: zonwering_advies_kantoor_links
          icon: mdi:window-shutter
          state: "{% from 'klimaat.jinja' import advies %}{{ (advies('kantoor_links') | trim | from_json).advies }}"
          attributes:
            positie: "{% from 'klimaat.jinja' import advies %}{{ (advies('kantoor_links') | trim | from_json).positie }}"
            uitvoeren: "{% from 'klimaat.jinja' import advies %}{{ (advies('kantoor_links') | trim | from_json).uitvoeren }}"
            vraagt: "{% from 'klimaat.jinja' import advies %}{{ (advies('kantoor_links') | trim | from_json).vraagt }}"
            reden: "{% from 'klimaat.jinja' import advies %}{{ (advies('kantoor_links') | trim | from_json).reden }}"
            blokkade: "{% from 'klimaat.jinja' import advies %}{{ (advies('kantoor_links') | trim | from_json).blokkade }}"
            cover: "{% from 'klimaat.jinja' import advies %}{{ (advies('kantoor_links') | trim | from_json).cover }}"

        - name: "Zonwering advies Kantoor rechts"
          unique_id: zonwering_advies_kantoor_rechts
          icon: mdi:window-shutter
          state: "{% from 'klimaat.jinja' import advies %}{{ (advies('kantoor_rechts') | trim | from_json).advies }}"
          attributes:
            positie: "{% from 'klimaat.jinja' import advies %}{{ (advies('kantoor_rechts') | trim | from_json).positie }}"
            uitvoeren: "{% from 'klimaat.jinja' import advies %}{{ (advies('kantoor_rechts') | trim | from_json).uitvoeren }}"
            vraagt: "{% from 'klimaat.jinja' import advies %}{{ (advies('kantoor_rechts') | trim | from_json).vraagt }}"
            reden: "{% from 'klimaat.jinja' import advies %}{{ (advies('kantoor_rechts') | trim | from_json).reden }}"
            blokkade: "{% from 'klimaat.jinja' import advies %}{{ (advies('kantoor_rechts') | trim | from_json).blokkade }}"
            cover: "{% from 'klimaat.jinja' import advies %}{{ (advies('kantoor_rechts') | trim | from_json).cover }}"

        - name: "Zonwering advies Badkamer"
          unique_id: zonwering_advies_badkamer
          icon: mdi:window-shutter
          state: "{% from 'klimaat.jinja' import advies %}{{ (advies('badkamer') | trim | from_json).advies }}"
          attributes:
            positie: "{% from 'klimaat.jinja' import advies %}{{ (advies('badkamer') | trim | from_json).positie }}"
            uitvoeren: "{% from 'klimaat.jinja' import advies %}{{ (advies('badkamer') | trim | from_json).uitvoeren }}"
