            blokkade: "{% from 'klimaat.jinja' import advies %}{{ (advies('badkamer') | trim | from_json).blokkade }}"
            cover: "{% from 'klimaat.jinja' import advies %}{{ (advies('badkamer') | trim | from_json).cover }}"

        - name: "Zonwering advies Slaapkamer"
