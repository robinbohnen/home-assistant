##############################################################################
## KLIMAATREGIE - laag 3 (advies per zone) en laag 4 (uitvoeren)
##
## Laag 3: per zone een sensor met wat die zone wil (open/kier/dicht/rust),
##         waarom, en of de uitvoerder er iets mee mag. De beslislogica zelf
##         staat in custom_templates/klimaat.jinja - dat is de enige plek waar
##         je hoeft te zijn als het gedrag moet veranderen.
## Laag 4: één automatisering die die adviezen uitvoert, plus één die
##         handbediening herkent en de zone dan met rust laat.
##
## AAN/UIT: input_boolean.klimaatregie_actief. Staat die uit, dan beweegt hier
## niets en doen de oude cover-automatiseringen hun oude werk. Staat hij aan,
## dan stappen die opzij (ze hebben er een conditie voor gekregen). Eén schuif
## dus, en volledig terug te draaien.
##
## Zie docs/klimaatregie.md.
##############################################################################

klimaat_zonwering_package:

  input_boolean:
    klimaatregie_actief:
      name: "Klimaat - Klimaatregie stuurt de zonwering"
      icon: mdi:window-shutter-auto
    klimaat_nachtspui:
      name: "Klimaat - Nachtspui toestaan"
      icon: mdi:weather-night
    # Staat deze uit, dan blijven de slaapzones ná het einde van de stille uren
    # nog staan waar ze staan. Zie WAKKER_UITERLIJK in custom_templates/klimaat.jinja.
    klimaat_wakker:
      name: "Klimaat - Het huis is wakker"
      icon: mdi:weather-sunset-up
    # Per zone op handmatig te zetten zonder de rest te raken.
    # Uit = de klimaatregie mag deze zone sturen.
    zonwering_handmatig_keuken_screens:
      name: "Zonwering handmatig - Keuken screens"
      icon: mdi:blinds-horizontal
    zonwering_handmatig_keuken_rolgordijn_groot:
      name: "Zonwering handmatig - Keuken rolgordijn groot"
      icon: mdi:blinds
    zonwering_handmatig_keuken_rolgordijn_klein:
      name: "Zonwering handmatig - Keuken rolgordijn klein"
      icon: mdi:blinds
    zonwering_handmatig_kantoor_links:
      name: "Zonwering handmatig - Kantoor links"
      icon: mdi:window-shutter
    zonwering_handmatig_kantoor_rechts:
      name: "Zonwering handmatig - Kantoor rechts"
      icon: mdi:window-shutter
    zonwering_handmatig_badkamer:
      name: "Zonwering handmatig - Badkamer"
      icon: mdi:window-shutter
    zonwering_handmatig_slaapkamer:
      name: "Zonwering handmatig - Slaapkamer"
      icon: mdi:window-shutter
    zonwering_handmatig_slaapkamer_logan:
      name: "Zonwering handmatig - Slaapkamer Logan"
      icon: mdi:window-shutter
    zonwering_handmatig_slaapkamer_emma:
      name: "Zonwering handmatig - Slaapkamer Emma"
      icon: mdi:window-shutter
    zonwering_handmatig_zonnescherm:
      name: "Zonwering handmatig - Zonnescherm achtertuin"
      icon: mdi:awning-outline

  input_number:
    klimaat_kamer_warm:
      name: "Klimaat - Kamer is warm boven"
      icon: mdi:home-thermometer-outline
      min: 16
      max: 30
      step: 0.5
      unit_of_measurement: "°C"
      mode: box
    klimaat_spui_delta:
      name: "Klimaat - Buiten moet koeler zijn voor spuien"
      icon: mdi:thermometer-minus
      min: 0
      max: 6
      step: 0.5
      unit_of_measurement: "°C"
      mode: box
    klimaat_kier_positie:
      name: "Klimaat - Stand van een kier"
      icon: mdi:arrow-expand-vertical
      min: 5
      max: 60
      step: 5
      unit_of_measurement: "%"
      mode: box
    # Boven deze windsnelheid gaan de buitenscreens in. De waarde komt uit
    # weather.knmi_thuis (km/u); windkracht 6 begint rond de 40.
    klimaat_screen_max_wind:
      name: "Klimaat - Screens in boven windsnelheid"
      icon: mdi:weather-windy
      min: 10
      max: 100
      step: 5
      unit_of_measurement: "km/u"
      mode: box
    # Boven deze verwachte neerslag gaan de buitenscreens in. De waarde komt uit
    # sensor.neerslag_komende_30_minuten (echte millimeters); 0,1 mm in een half
    # uur is lichte motregen. Op 0 zetten betekent elke voorspelde druppel.
    klimaat_screen_max_regen:
      name: "Klimaat - Screens in boven verwachte neerslag"
      icon: mdi:weather-pouring
      min: 0
      max: 2
      step: 0.1
      unit_of_measurement: "mm"
      mode: box
    klimaat_override_uren:
      name: "Klimaat - Handbediening blijft gelden"
      icon: mdi:hand-back-right-outline
      min: 0.5
      max: 24
      step: 0.5
      unit_of_measurement: "u"
      mode: box

  timer:
    # Zolang zo'n timer loopt blijft de uitvoerder van die zone af.
    #
    # De `restore: true` op alle tien: zonder begint een lopende override na
    # een HA-herstart weer op idle, en dan zet de eerstvolgende kwartierronde
    # de cover terug op het advies terwijl iemand hem net bewust anders had
    # gezet. "Blijf van deze zone af" moet een herstart overleven.
    override_keuken_screens:
      name: "Handbediening Keuken screens"
      duration: "04:00:00"
      icon: mdi:hand-back-right
      restore: true
    override_keuken_rolgordijn_groot:
      name: "Handbediening Keuken rolgordijn groot"
      duration: "04:00:00"
      icon: mdi:hand-back-right
      restore: true
    override_keuken_rolgordijn_klein:
      name: "Handbediening Keuken rolgordijn klein"
      duration: "04:00:00"
      icon: mdi:hand-back-right
      restore: true
    override_kantoor_links:
      name: "Handbediening Kantoor links"
      duration: "04:00:00"
      icon: mdi:hand-back-right
      restore: true
    override_kantoor_rechts:
      name: "Handbediening Kantoor rechts"
      duration: "04:00:00"
      icon: mdi:hand-back-right
      restore: true
    override_badkamer:
      name: "Handbediening Badkamer"
      duration: "04:00:00"
      icon: mdi:hand-back-right
      restore: true
    override_slaapkamer:
      name: "Handbediening Slaapkamer"
      duration: "04:00:00"
      icon: mdi:hand-back-right
      restore: true
    override_slaapkamer_logan:
      name: "Handbediening Slaapkamer Logan"
      duration: "04:00:00"
      icon: mdi:hand-back-right
      restore: true
    override_slaapkamer_emma:
      name: "Handbediening Slaapkamer Emma"
      duration: "04:00:00"
      icon: mdi:hand-back-right
      restore: true
    override_zonnescherm:
      name: "Handbediening Zonnescherm achtertuin"
      duration: "04:00:00"
      icon: mdi:hand-back-right
      restore: true
    # Zolang deze loopt is de vraag "zal ik het zonnescherm uitzetten?" al
    # gesteld en wordt hij niet opnieuw gesteld. Anders zou hij bij elke
    # kwartierronde opnieuw in beeld komen als er niemand antwoordt.
    zonnescherm_vraag:
      name: "Zonnescherm - vraag gesteld"
      duration: "02:00:00"
      icon: mdi:comment-question-outline
      # Zonder restore begint deze timer na een herstart weer op idle en
      # stelt het /15-vangnet de vraag opnieuw. De kopie in Attic/AC.yaml
      # (timer.airco_zolder_vraag) had deze regel al om precies die reden;
      # dit is het terugporteren naar het origineel.
      restore: true

  ###########################################################################
  ## Laag 3 - het advies per zone
  ##
  ## Alle tien sensoren komen uit dezelfde macro; verander je de tabel in
  ## custom_templates/klimaat.jinja, dan verandert alles mee. `positie` en
  ## `uitvoeren` zijn wat de uitvoerder leest, `reden` en `blokkade` zijn voor
  ## het dashboard.
  ##
  ## WAAROM ÉÉN TRIGGER-BLOK EN NIET TIEN GEWONE SENSOREN
  ## State en attributen worden ieder apart gerenderd. Met de macro-aanroep in
  ## elk van die templates draaide `advies()` zeven keer per sensor - één keer
  ## voor de state en zes keer voor de attributen - en dus zeventig keer per
  ## ronde, elke keer met exact dezelfde uitkomst. Een variabele uit de
  ## `action:`-sectie is beschikbaar in de templates van álle entiteiten in dit
  ## blok, dus nu draait de macro nog één keer per zone: tien keer per ronde.
  ## Zelfde patroon en dezelfde reden als packages/9 - Other/Kamers.yaml; het
  ## vraagt HA 2024.10 of nieuwer.
  ##
  ## WAAROM DIE TRIGGERLIJST
  ## De prijs van dit patroon: een trigger-based template volgt niet meer
  ## vanzelf alles wat de macro onderweg uitleest, hij ververst alleen op zijn
  ## eigen triggers. De minuuttik onderaan is daarom het echte vangnet - nooit
  ## meer dan zestig seconden achterstand, en de uitvoerder zelf loopt op een
  ## kwartier. De state-triggers erboven staan er voor de gevallen waar een
  ## minuut wachten wél opvalt of gevaarlijk is: iets dat een mens net heeft
  ## aangeraakt, en de meldingen die een screen naar binnen moeten halen.
  ## Wat er níet bij staat beweegt uit zichzelf traag (kamertemperatuur,
  ## zonshoogte, buitentemperatuur, de bedtijd-helpers) en heeft aan de
  ## minuuttik ruim genoeg.
  ##
  ## Na een template-reload staan deze sensoren hoogstens één minuut op
  ## `unknown`. De uitvoerder leest dan `positie` als -1 en doet niets, dus dat
  ## is stil wachten en geen verkeerde beweging.
  ###########################################################################
  template:
    - trigger:
        # 1. De knoppen en schuifjes van de klimaatregie zelf. Zet je op het
        #    dashboard iets om, dan hoor je het advies te zien veranderen
        #    terwijl je kijkt - niet ergens in de minuut erna.
        - trigger: state
          entity_id:
            - input_boolean.klimaatregie_actief
            - input_boolean.klimaat_wakker
            - input_boolean.klimaat_nachtspui
            - input_select.klimaat_regime
            - input_number.klimaat_kamer_warm
            - input_number.klimaat_hittedag_vanaf
            - input_number.klimaat_verwachte_max
            - input_number.klimaat_spui_delta
            - input_number.klimaat_kier_positie
            - input_number.klimaat_screen_max_wind
            - input_number.klimaat_screen_max_regen
        # 2. Per zone de handmatig-schakelaar en de handbedieningstimer. Deze
        #    twee bepalen `uitvoeren`: zet je een zone op handmatig, dan mag de
        #    uitvoerder daar in de minuut erna niet nog één keer aan trekken.
        #    Dit lijstje loopt per zone en wordt met de hand bijgehouden. Komt
        #    er een zone bij en vergeet je hem hier, dan is het gevolg mild:
        #    die zone merkt zijn eigen schakelaar pas bij de volgende minuuttik.
        - trigger: state
          entity_id:
            - input_boolean.zonwering_handmatig_keuken_screens
            - input_boolean.zonwering_handmatig_keuken_rolgordijn_groot
            - input_boolean.zonwering_handmatig_keuken_rolgordijn_klein
            - input_boolean.zonwering_handmatig_kantoor_links
            - input_boolean.zonwering_handmatig_kantoor_rechts
            - input_boolean.zonwering_handmatig_badkamer
            - input_boolean.zonwering_handmatig_slaapkamer
            - input_boolean.zonwering_handmatig_slaapkamer_logan
            - input_boolean.zonwering_handmatig_slaapkamer_emma
            - input_boolean.zonwering_handmatig_zonnescherm
            - timer.override_keuken_screens
            - timer.override_keuken_rolgordijn_groot
            - timer.override_keuken_rolgordijn_klein
            - timer.override_kantoor_links
            - timer.override_kantoor_rechts
            - timer.override_badkamer
            - timer.override_slaapkamer
            - timer.override_slaapkamer_logan
            - timer.override_slaapkamer_emma
            - timer.override_zonnescherm
        # 3. Veiligheid: wind, storm, regen en een openstaand raam. Dit zijn de
        #    redenen om een screen in te halen of een rolgordijn juist niet te
        #    laten zakken, en daar wil je geen minuut op wachten.
        - trigger: state
          entity_id:
            - weather.knmi_thuis
            - binary_sensor.knmi_waarschuwing
            - sensor.neerslag_komende_30_minuten
            - binary_sensor.keuken_raam_groot_contact
            - binary_sensor.keuken_raam_klein_contact
        # 4. De zon per gevel: dit is de prikkel waar het hele advies om draait
        #    en hij schakelt maar een paar keer per dag.
        - trigger: state
          entity_id:
            - binary_sensor.zon_op_voorgevel
            - binary_sensor.zon_op_zijgevel
            - binary_sensor.zon_op_achtergevel
            - binary_sensor.zon_richting_voorgevel
            - binary_sensor.zon_richting_zijgevel
            - binary_sensor.zon_richting_achtergevel
        # 5. Wie er thuis is, of het alarm scherp staat, en of het keukenscreen
        #    er nog hangt - dat laatste bepaalt of de rolgordijnen bijspringen.
        - trigger: state
          entity_id:
            - group.all_adults
            - alarm_control_panel.alarmo
            - cover.covers_kitchen_screens
        # 6. Het vangnet voor al het andere dat de macro leest: kamer- en
        #    buitentemperatuur, de zonshoogte en de bedtijd-helpers. Die
        #    kruipen, dus een minuut achterstand is er geen.
        - trigger: time_pattern
          minutes: "/1"
        # Zonder deze staan alle adviezen na een herstart een minuut op unknown.
        - trigger: homeassistant
          event: start

      action:
        # Eén ronde langs alle zones, en de uitkomst gaat als dict {zone: advies}
        # naar de sensoren hieronder. De macro levert al JSON, dus we plakken die
        # stukken aan elkaar en parsen één keer; dat scheelt tien keer heen en
        # weer serialiseren. Een dict opbouwen met .update() kan hier niet - de
        # template-sandbox van Home Assistant blokkeert het muteren van dicts.
        - variables:
            adviezen: >-
              {% from 'klimaat.jinja' import advies, zone_lijst %}
              {%- set ns = namespace(delen=[]) -%}
              {%- for z in zone_lijst() | from_json -%}
                {%- set ns.delen = ns.delen + [(z | to_json) ~ ':' ~ (advies(z) | trim)] -%}
              {%- endfor -%}
              {{ ('{' ~ ns.delen | join(',') ~ '}') | from_json }}

      sensor:
        - name: "Zonwering advies Keuken screens"
          unique_id: zonwering_advies_keuken_screens
          icon: mdi:blinds-horizontal
          state: "{{ adviezen.keuken_screens.advies }}"
          attributes:
            positie: "{{ adviezen.keuken_screens.positie }}"
            uitvoeren: "{{ adviezen.keuken_screens.uitvoeren }}"
            vraagt: "{{ adviezen.keuken_screens.vraagt }}"
            spoed: "{{ adviezen.keuken_screens.spoed }}"
            reden: "{{ adviezen.keuken_screens.reden }}"
            blokkade: "{{ adviezen.keuken_screens.blokkade }}"
            cover: "{{ adviezen.keuken_screens.cover }}"

        # Binnenzonwering. Die springt alleen bij als het screen ervoor niet
        # omlaag staat; zie blok 5b in klimaat.jinja.
        - name: "Zonwering advies Keuken rolgordijn groot"
          unique_id: zonwering_advies_keuken_rolgordijn_groot
          icon: mdi:blinds
          state: "{{ adviezen.keuken_rolgordijn_groot.advies }}"
          attributes:
            positie: "{{ adviezen.keuken_rolgordijn_groot.positie }}"
            uitvoeren: "{{ adviezen.keuken_rolgordijn_groot.uitvoeren }}"
            vraagt: "{{ adviezen.keuken_rolgordijn_groot.vraagt }}"
            spoed: "{{ adviezen.keuken_rolgordijn_groot.spoed }}"
            reden: "{{ adviezen.keuken_rolgordijn_groot.reden }}"
            blokkade: "{{ adviezen.keuken_rolgordijn_groot.blokkade }}"
            cover: "{{ adviezen.keuken_rolgordijn_groot.cover }}"

        - name: "Zonwering advies Keuken rolgordijn klein"
          unique_id: zonwering_advies_keuken_rolgordijn_klein
          icon: mdi:blinds
          state: "{{ adviezen.keuken_rolgordijn_klein.advies }}"
          attributes:
            positie: "{{ adviezen.keuken_rolgordijn_klein.positie }}"
            uitvoeren: "{{ adviezen.keuken_rolgordijn_klein.uitvoeren }}"
            vraagt: "{{ adviezen.keuken_rolgordijn_klein.vraagt }}"
            spoed: "{{ adviezen.keuken_rolgordijn_klein.spoed }}"
            reden: "{{ adviezen.keuken_rolgordijn_klein.reden }}"
            blokkade: "{{ adviezen.keuken_rolgordijn_klein.blokkade }}"
            cover: "{{ adviezen.keuken_rolgordijn_klein.cover }}"

        - name: "Zonwering advies Kantoor links"
          unique_id: zonwering_advies_kantoor_links
          icon: mdi:window-shutter
          state: "{{ adviezen.kantoor_links.advies }}"
          attributes:
            positie: "{{ adviezen.kantoor_links.positie }}"
            uitvoeren: "{{ adviezen.kantoor_links.uitvoeren }}"
            vraagt: "{{ adviezen.kantoor_links.vraagt }}"
            spoed: "{{ adviezen.kantoor_links.spoed }}"
            reden: "{{ adviezen.kantoor_links.reden }}"
            blokkade: "{{ adviezen.kantoor_links.blokkade }}"
            cover: "{{ adviezen.kantoor_links.cover }}"

        - name: "Zonwering advies Kantoor rechts"
          unique_id: zonwering_advies_kantoor_rechts
          icon: mdi:window-shutter
          state: "{{ adviezen.kantoor_rechts.advies }}"
          attributes:
            positie: "{{ adviezen.kantoor_rechts.positie }}"
            uitvoeren: "{{ adviezen.kantoor_rechts.uitvoeren }}"
            vraagt: "{{ adviezen.kantoor_rechts.vraagt }}"
            spoed: "{{ adviezen.kantoor_rechts.spoed }}"
            reden: "{{ adviezen.kantoor_rechts.reden }}"
            blokkade: "{{ adviezen.kantoor_rechts.blokkade }}"
            cover: "{{ adviezen.kantoor_rechts.cover }}"

        - name: "Zonwering advies Badkamer"
          unique_id: zonwering_advies_badkamer
          icon: mdi:window-shutter
          state: "{{ adviezen.badkamer.advies }}"
          attributes:
            positie: "{{ adviezen.badkamer.positie }}"
            uitvoeren: "{{ adviezen.badkamer.uitvoeren }}"
            vraagt: "{{ adviezen.badkamer.vraagt }}"
            spoed: "{{ adviezen.badkamer.spoed }}"
            reden: "{{ adviezen.badkamer.reden }}"
            blokkade: "{{ adviezen.badkamer.blokkade }}"
            cover: "{{ adviezen.badkamer.cover }}"

        - name: "Zonwering advies Slaapkamer"
          unique_id: zonwering_advies_slaapkamer
          icon: mdi:window-shutter
          state: "{{ adviezen.slaapkamer.advies }}"
          attributes:
            positie: "{{ adviezen.slaapkamer.positie }}"
            uitvoeren: "{{ adviezen.slaapkamer.uitvoeren }}"
            vraagt: "{{ adviezen.slaapkamer.vraagt }}"
            spoed: "{{ adviezen.slaapkamer.spoed }}"
            reden: "{{ adviezen.slaapkamer.reden }}"
            blokkade: "{{ adviezen.slaapkamer.blokkade }}"
            cover: "{{ adviezen.slaapkamer.cover }}"

        - name: "Zonwering advies Slaapkamer Logan"
          # unique_id blijft 'maxi': hij staat al zo in het entiteitenregister
          # en wijzigen zou een tweede entiteit met een _2-achtervoegsel
          # opleveren. Het entity_id komt van de naam hierboven.
          unique_id: zonwering_advies_maxi
          icon: mdi:window-shutter
          state: "{{ adviezen.slaapkamer_logan.advies }}"
          attributes:
            positie: "{{ adviezen.slaapkamer_logan.positie }}"
            uitvoeren: "{{ adviezen.slaapkamer_logan.uitvoeren }}"
            vraagt: "{{ adviezen.slaapkamer_logan.vraagt }}"
            spoed: "{{ adviezen.slaapkamer_logan.spoed }}"
            reden: "{{ adviezen.slaapkamer_logan.reden }}"
            blokkade: "{{ adviezen.slaapkamer_logan.blokkade }}"
            cover: "{{ adviezen.slaapkamer_logan.cover }}"

        - name: "Zonwering advies Slaapkamer Emma"
          # Zie de opmerking bij Logan hierboven.
          unique_id: zonwering_advies_mini
          icon: mdi:window-shutter
          state: "{{ adviezen.slaapkamer_emma.advies }}"
          attributes:
            positie: "{{ adviezen.slaapkamer_emma.positie }}"
            uitvoeren: "{{ adviezen.slaapkamer_emma.uitvoeren }}"
            vraagt: "{{ adviezen.slaapkamer_emma.vraagt }}"
            spoed: "{{ adviezen.slaapkamer_emma.spoed }}"
            reden: "{{ adviezen.slaapkamer_emma.reden }}"
            blokkade: "{{ adviezen.slaapkamer_emma.blokkade }}"
            cover: "{{ adviezen.slaapkamer_emma.cover }}"

        # Het zonnescherm. `positie` is hier al vertaald naar cover-termen
        # (die cover is omgekeerd bedraad), dus de uitvoerder hoeft niets
        # bijzonders te doen. Zie de opmerking onderaan klimaat.jinja.
        - name: "Zonwering advies Zonnescherm"
          unique_id: zonwering_advies_zonnescherm
          icon: mdi:awning-outline
          state: "{{ adviezen.zonnescherm.advies }}"
          attributes:
            positie: "{{ adviezen.zonnescherm.positie }}"
            uitvoeren: "{{ adviezen.zonnescherm.uitvoeren }}"
            vraagt: "{{ adviezen.zonnescherm.vraagt }}"
            spoed: "{{ adviezen.zonnescherm.spoed }}"
            reden: "{{ adviezen.zonnescherm.reden }}"
            blokkade: "{{ adviezen.zonnescherm.blokkade }}"
            cover: "{{ adviezen.zonnescherm.cover }}"

  automation:
    ###########################################################################
    ## Wakker-signaal
    ##
    ## Het einde van de stille uren is een klok en zegt dus niets over of er
    ## iemand op is. In de zomer stond de zon om 07:00 allang op en gingen de
    ## slaapkamerrolluiken omhoog terwijl er nog geslapen werd. De slaapkamer-
    ## knop is het signaal dat het huis wakker is; zolang die niet is ingedrukt
    ## blijven die zones staan (zie WAKKER_UITERLIJK in klimaat.jinja voor de
    ## noodrem).
    ###########################################################################
    - id: klimaat_wakker_bijhouden
      alias: Klimaat - Wakker bijhouden
      description: >-
        Een druk op de slaapkamerknop tussen 06:00 en 17:00 is de opstaan-
        routine en meldt het huis wakker; daarbuiten is het de naar-bed-routine
        en gaat de vlag juist uit. Drukt niemand, dan gaat de vlag om 10:00
        vanzelf aan - anders zit je op een vrije dag tot de avond in het donker.
        Om 22:00 valt hij sowieso terug, zodat een vergeten avonddruk de
        rolluiken morgenochtend niet alsnog opent.
      mode: single
      triggers:
        # Uit de router in packages/1 - First Floor/Bedroom/Buttons.yaml. Die
        # kent de knoppen en bepaalt of het ochtend of avond is.
        - trigger: event
          event_type: huis_routine
          event_data:
            routine: ochtend
          id: knop_ochtend
        - trigger: event
          event_type: huis_routine
          event_data:
            routine: avond
          id: knop_avond
        # Noodrem aan de ochtendkant: drukt niemand op de knop, dan is het huis
        # om 10:00 wakker verklaard en mag alles weer automatisch. Zelfde
        # tijdstip als WAKKER_UITERLIJK in klimaat.jinja; die twee horen gelijk
        # te blijven.
        - trigger: time
          at: "10:00:00"
          id: wakker_uiterlijk
        # Vangnet: wordt er 's avonds niet gedrukt, dan mag de vlag niet blijven
        # staan - anders gaan de rolluiken morgenochtend om 07:00 open terwijl
        # er nog geslapen wordt. Zelfde tijdstip als STIL_VAN in klimaat.jinja.
        - trigger: time
          at: "22:00:00"
          id: nacht_reset
      conditions: []
      actions:
        - choose:
            # De router beslist wat ochtend is; het label op de kaart
            # "Slaapkamer knop" in dashboards/home/overzicht.yaml gebruikt
            # hetzelfde venster en hoort daarmee gelijk te blijven.
            - conditions:
                - condition: trigger
                  id:
                    - knop_ochtend
                    - wakker_uiterlijk
              sequence:
                - action: input_boolean.turn_on
                  target:
                    entity_id: input_boolean.klimaat_wakker
          # Al het andere zet de vlag uit: de avondroutine van de knop, of de
          # reset van 22:00.
          default:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.klimaat_wakker

    ###########################################################################
    ## Laag 4a - adviezen uitvoeren
    ###########################################################################
    - id: klimaat_zonwering_uitvoeren
      alias: Klimaat - Zonwering uitvoeren
      description: >-
        Voert het advies per zone uit, maar alleen als die zone niet op
        handbediening staat en de stand echt afwijkt. Beweegt dus niets zolang
        er niets te winnen valt. Zonwering die eerst toestemming vraagt (het
        zonnescherm) slaat hij over zolang het advies "naar buiten" is; het
        binnenhalen doet hij wél gewoon zelf.
      # `queued` en niet `single`: verandert het advies terwijl deze ronde
      # loopt, dan is die wijziging een nieuwe trigger - en met `single` plus
      # `max_exceeded: silent` verdween precies de correctie die de vorige
      # ronde had moeten rechtzetten. Drie in de rij is ruim: een ronde is in
      # een seconde klaar, en de rustpauze hieronder houdt een tweede ronde
      # sowieso van een cover af die net bewogen heeft.
      mode: queued
      max: 3
      max_exceeded: silent
      triggers:
        # Alleen op de twee attributen die er echt toe doen; op de sensor zelf
        # triggeren zou ook afgaan op elke wijziging van de reden-tekst.
        - trigger: state
          entity_id: &advies_sensoren
            - sensor.zonwering_advies_keuken_screens
            - sensor.zonwering_advies_keuken_rolgordijn_groot
            - sensor.zonwering_advies_keuken_rolgordijn_klein
            - sensor.zonwering_advies_kantoor_links
            - sensor.zonwering_advies_kantoor_rechts
            - sensor.zonwering_advies_badkamer
            - sensor.zonwering_advies_slaapkamer
            - sensor.zonwering_advies_slaapkamer_logan
            - sensor.zonwering_advies_slaapkamer_emma
            - sensor.zonwering_advies_zonnescherm
          attribute: positie
        - trigger: state
          entity_id: *advies_sensoren
          attribute: uitvoeren
        # Vangnet: ook bijsturen als er niets veranderde maar de stand toch
        # afwijkt (cover was onbereikbaar, handbediening afgelopen, herstart).
        #
        # Op seconde 30 en niet op 0: de adviessensoren hierboven rekenen op
        # `time_pattern /1` en schrijven dus precies op de minuutgrens. Tikte
        # deze ronde daar bovenop, dan las hij het advies van de vórige minuut.
        # Op 14 augustus 2026 om 19:30:00 sprong het advies naar 'rust' (de
        # kinderen naar bed) en rolde deze automatisering het keukenrolgordijn
        # om 19:30:06 alsnog helemaal open op het verlopen advies; om 19:30:14
        # ging de deur op slot en trok `covers_lock_alarm_events` het weer
        # dicht. Een halve minuut ertussen is genoeg: het advies staat dan.
        - trigger: time_pattern
          minutes: "/15"
          seconds: 30
        - trigger: homeassistant
          event: start
      conditions:
        - condition: state
          entity_id: input_boolean.klimaatregie_actief
          state: "on"
      variables:
        # Na een herstart krijgt élke cover een verse `last_updated`, en dan
        # zou de rustpauze hieronder het hele huis een kwartier stil zetten
        # terwijl er juist bijgestuurd moet worden. De startronde slaat de
        # pauze daarom over.
        herstart: >-
          {{ trigger is defined
             and (trigger.platform | default('')) == 'homeassistant' }}
      actions:
        - repeat:
            for_each: >-
              {% from 'klimaat.jinja' import zone_lijst %}
              {{ zone_lijst() | from_json }}
            sequence:
              - variables:
                  advies_sensor: "sensor.zonwering_advies_{{ repeat.item }}"
              - variables:
                  cover: "{{ state_attr(advies_sensor, 'cover') }}"
                  doel: "{{ state_attr(advies_sensor, 'positie') | int(-1) }}"
                  mag: "{{ state_attr(advies_sensor, 'uitvoeren') in [true, 'True', 'true'] }}"
                  # Zone die eerst toestemming vraagt en nu naar buiten zou
                  # gaan: die laat `klimaat_zonnescherm_vragen` afhandelen.
                  vraagt: "{{ state_attr(advies_sensor, 'vraagt') in [true, 'True', 'true'] }}"
                  # Wind, regen of vorst op een screen: dat is het enige advies
                  # dat niet op de rustpauze hieronder mag wachten. Zie blok 6
                  # in custom_templates/klimaat.jinja.
                  spoed: "{{ state_attr(advies_sensor, 'spoed') in [true, 'True', 'true'] }}"
              - variables:
                  # Covers zonder tussenstand (de screengroep) kennen geen
                  # current_position; die vertalen we naar 100 of 0.
                  huidig: >-
                    {% set p = state_attr(cover, 'current_position') %}
                    {{ p | int(0) if p is not none
                       else (100 if is_state(cover, 'open') else 0) }}
                  # RUSTPAUZE - minstens een kwartier tussen twee bewegingen
                  #
                  # Het advies volgt de wolken, en de covers volgden het advies
                  # op de seconde. Op 17 augustus 2026 gingen de keukenscreens
                  # tussen 11:32 en 12:16 vier keer volledig op en neer omdat
                  # `binary_sensor.zon_op_voorgevel` heen en weer sprong - en
                  # dat ondanks de 2/10 minuten vertraging die daar al op zit.
                  # Kantoor links wisselde diezelfde ochtend meermaals per
                  # minuut tussen 'kier' (kamer 24.8°) en 'dicht' (zon op de
                  # gevel); dat het stil bleef was toeval, want er stond net
                  # een override op.
                  #
                  # Een cover die net bewogen heeft blijft daarom een kwartier
                  # staan. `last_updated` is hier de juiste maat en niet
                  # `last_changed`: een rolgordijn dat van 100 naar 15 gaat
                  # blijft de hele rit 'open', dus `last_changed` verspringt
                  # dan niet eens. Deze covers melden niets uit zichzelf, dus
                  # `last_updated` ís het einde van de laatste beweging.
                  mag_nu_bewegen: >-
                    {% set c = states[cover]
                       if cover is string and '.' in cover else none %}
                    {{ spoed or herstart or c is none
                       or (now() - c.last_updated).total_seconds() >= 900 }}
              - if:
                  - condition: template
                    value_template: >-
                      {{ mag and not vraagt and doel >= 0
                         and cover not in [none, 'None']
                         and (huidig - doel) | abs > 5
                         and mag_nu_bewegen }}
                then:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ doel >= 95 }}"
                        sequence:
                          - action: cover.open_cover
                            target:
                              entity_id: "{{ cover }}"
                            continue_on_error: true
                      - conditions:
                          - condition: template
                            value_template: "{{ doel <= 5 }}"
                        sequence:
                          - action: cover.close_cover
                            target:
                              entity_id: "{{ cover }}"
                            continue_on_error: true
                    default:
                      - action: cover.set_cover_position
                        target:
                          entity_id: "{{ cover }}"
                        data:
                          position: "{{ doel }}"
                        continue_on_error: true
                  # Even spreiden, zeven rolluiken tegelijk is veel voor het
                  # zigbee-netwerk.
                  - delay:
                      seconds: 2

    ###########################################################################
    ## Laag 4b - handbediening herkennen
    ##
    ## Elke beweging die 90 seconden stil ligt op een andere stand dan het
    ## advies telt als handbediening: app, knop, wandschakelaar of een van de
    ## oude automatiseringen. De zone wordt dan een paar uur met rust gelaten.
    ## Zet iemand hem terug op de geadviseerde stand, dan vervalt dat weer.
    ##
    ## Onze eigen bewegingen eindigen per definitie op het advies, dus die
    ## herkent hij niet als handbediening.
    ##
    ## Uitzondering: een zone die eerst toestemming vraagt en nu naar buiten
    ## zou gaan (`vraagt`). Die staat per definitie op een andere stand dan het
    ## advies zolang er nog geen antwoord is - dat is geen handbediening maar
    ## een openstaande vraag. Die situatie is van
    ## `klimaat_zonnescherm_vragen`. Trekt iemand het scherm juist zelf uit
    ## terwijl het advies binnenhalen is, dan telt dat wél gewoon mee.
    ###########################################################################
    - id: klimaat_handbediening_herkennen
      alias: Klimaat - Handbediening herkennen
      description: Laat een zone met rust nadat iemand de cover zelf heeft gezet
      mode: queued
      max: 20
      max_exceeded: silent
      triggers:
        - trigger: state
          entity_id: &beheerde_covers
            - cover.covers_kitchen_screens
            # De rolgordijnen staan hier per stuk: de groep zou de bediening van
            # één rolgordijn als handbediening van allebei laten tellen.
            - cover.rollerblind_0001
            - cover.rollerblind_0002
            - cover.kantoor_links_low_speed
            - cover.kantoor_rechts_low_speed
            - cover.badkamer_rolluik_low_speed
            - cover.slaapkamer_rolluik_low_speed
            - cover.covers_bedroom_maxi
            - cover.slaapkamer_mini
            - cover.achtertuin_zonnescherm
          attribute: current_position
          for: "00:01:30"
        - trigger: state
          entity_id: *beheerde_covers
          to:
            - open
            - closed
          for: "00:01:30"
      conditions:
        - condition: state
          entity_id: input_boolean.klimaatregie_actief
          state: "on"
        # Na een HA-herstart of Zigbee-herstel maakt elke cover een
        # unavailable->stand-flank. Stond HA even uit terwijl het advies
        # veranderde (zon op/onder), dan wijkt de teruggekeerde stand af van
        # het advies en zou dat hier als "iemand wilde dit zo" tellen - vier
        # uur onterechte override, rolluiken de hele ochtend dicht. Een echte
        # handbediening begint nooit in unknown/unavailable. Als template-
        # conditie en niet als not_from op de triggers, omdat de eerste
        # trigger op een attribuut staat en not_from daar naar de
        # attribuutwaarde zou kijken.
        - alias: Geen herstart- of herstel-flank
          condition: template
          value_template: >-
            {{ trigger.from_state is not none
               and trigger.to_state is not none
               and trigger.from_state.state not in ['unknown', 'unavailable']
               and trigger.to_state.state not in ['unknown', 'unavailable'] }}
      actions:
        - variables:
            zone: >-
              {% from 'klimaat.jinja' import zone_van_cover %}
              {{ zone_van_cover(trigger.entity_id) | trim }}
        - variables:
            advies_sensor: "sensor.zonwering_advies_{{ zone }}"
            override_timer: "timer.override_{{ zone }}"
        - variables:
            doel: "{{ state_attr(advies_sensor, 'positie') | int(-1) }}"
            # Openstaande vraag, geen handbediening: zie de kop hierboven.
            vraagt: "{{ state_attr(advies_sensor, 'vraagt') in [true, 'True', 'true'] }}"
            # IS HET ADVIES ZELF NET VERSCHOVEN?
            #
            # De uitvoerder zet een cover op het advies van dát moment. Verandert
            # het advies binnen de anderhalve minuut hieronder, dan staat die
            # cover ineens naast het NIEUWE advies en telde zijn eigen zet als
            # handbediening. Op 15 augustus 2026 zette de uitvoerder kantoor
            # links om 09:11:08 op 0 (advies: dicht), sprong het advies om
            # 09:12:30 naar kier 15, en stond er om 09:12:38 vier uur
            # handbediening op een rolluik dat niemand had aangeraakt - op een
            # hittedag, waardoor het de rest van de ochtend op 0 bleef staan.
            #
            # `last_changed` en niet `last_updated`: het advieswoord verspringt
            # alleen als de gewenste stand verandert, terwijl `reden` bij elke
            # tiende graad een nieuwe tekst krijgt. 150 seconden dekt de 90 uit
            # de trigger plus de rit van de cover zelf. Een sensor die er niet
            # is telt als stabiel - dan blijft het gedrag zoals het was.
            advies_stabiel: >-
              {% set s = states[advies_sensor] %}
              {{ s is none or (now() - s.last_changed).total_seconds() > 150 }}
            huidig: >-
              {% set p = state_attr(trigger.entity_id, 'current_position') %}
              {{ p | int(0) if p is not none
                 else (100 if is_state(trigger.entity_id, 'open') else 0) }}
        - choose:
            # Staat ergens anders dan geadviseerd: iemand wilde dit zo.
            - conditions:
                - condition: template
                  value_template: >-
                    {{ zone != '' and not vraagt and doel >= 0
                       and (huidig - doel) | abs > 5
                       and advies_stabiel }}
              sequence:
                - action: timer.start
                  target:
                    entity_id: "{{ override_timer }}"
                  data:
                    duration: >-
                      {{ (states('input_number.klimaat_override_uren') | float(4) * 3600) | int }}
            # Staat weer op het advies: handbediening mag vervallen.
            - conditions:
                - condition: template
                  value_template: >-
                    {{ zone != '' and doel >= 0 and (huidig - doel) | abs <= 5
                       and is_state(override_timer, 'active') }}
              sequence:
                - action: timer.cancel
                  target:
                    entity_id: "{{ override_timer }}"

    ###########################################################################
    ## Laag 4c - het zonnescherm vraagt eerst
    ##
    ## Het zonnescherm gaat niet uit zichzelf naar buiten. Het is het enige
    ## stuk zonwering dat je vanuit de tuin in de weg kunt zitten (en het enige
    ## dat kapot waait als je het vergeet), dus hier hoort een mens aan te pas
    ## te komen. Binnenhalen blijft wél automatisch: dat doet de uitvoerder
    ## hierboven zodra de zon van de achtergevel af is, en meteen bij wind,
    ## vorst of regen.
    ##
    ## De vraag wordt hoogstens één keer per twee uur gesteld
    ## (`timer.zonnescherm_vraag`). Antwoord je "Nee", dan blijft het scherm
    ## de hele overridetijd met rust - net als bij handbediening.
    ###########################################################################
    - id: klimaat_zonnescherm_vragen
      alias: Klimaat - Zonnescherm vragen
      description: >-
        Stuurt een vraag in plaats van het zonnescherm zomaar uit te schuiven.
        Ja rolt hem uit, Nee laat hem een paar uur met rust.
      mode: single
      max_exceeded: silent
      triggers:
        - trigger: state
          entity_id: sensor.zonwering_advies_zonnescherm
          attribute: vraagt
        # Vangnet, zelfde ritme als de uitvoerder: ook vragen als het advies
        # al stond te wachten toen de cooldown afliep of Home Assistant net
        # opnieuw begon.
        - trigger: time_pattern
          minutes: "/15"
      conditions:
        - condition: state
          entity_id: input_boolean.klimaatregie_actief
          state: "on"
        # Al gevraagd in de afgelopen twee uur? Dan nu even niet.
        - condition: state
          entity_id: timer.zonnescherm_vraag
          state: idle
        - alias: Advies wil naar buiten, mag uitgevoerd worden, en dat is het nog niet
          condition: template
          value_template: >-
            {% set s = 'sensor.zonwering_advies_zonnescherm' %}
            {% set doel = state_attr(s, 'positie') | int(-1) %}
            {% set huidig = state_attr('cover.achtertuin_zonnescherm', 'current_position')
                            | int(100 if is_state('cover.achtertuin_zonnescherm', 'open') else 0) %}
            {{ state_attr(s, 'vraagt') in [true, 'True', 'true']
               and state_attr(s, 'uitvoeren') in [true, 'True', 'true']
               and doel >= 0 and (huidig - doel) | abs > 5 }}
      actions:
        # Eerst de cooldown, dan pas de vraag: gaat er onderweg iets mis, dan
        # is de melding hooguit blijven liggen in plaats van elk kwartier
        # opnieuw verstuurd.
        - action: timer.start
          target:
            entity_id: timer.zonnescherm_vraag
        - variables:
            actie_ja: "{{ 'ZONNESCHERM_JA_' ~ context.id }}"
            actie_nee: "{{ 'ZONNESCHERM_NEE_' ~ context.id }}"
            reden: "{{ state_attr('sensor.zonwering_advies_zonnescherm', 'reden') }}"
        # De reden is leeg als je de automatisering met de hand draait, en dan
        # begon zowel de melding als de gesproken vraag met ". Zal ik het
        # zonnescherm uitzetten?". Eén keer opbouwen, allebei dezelfde zin.
        - variables:
            vraagtekst: >-
              {{ ((reden | capitalize) ~ '. ') if reden else '' }}Zal ik het
              zonnescherm uitzetten?
        - action: notify.mobile_devices_adults
          data:
            title: Zonnescherm uitzetten?
            message: "{{ vraagtekst }}"
            data:
              actions:
                - action: "{{ actie_ja }}"
                  title: Ja
                - action: "{{ actie_nee }}"
                  title: Nee
        # Tweede kanaal, dezelfde vraag. Is er iemand thuis, dan vraagt de
        # keuken-satelliet het ook hardop en luistert hij naar het antwoord.
        # Het venster is even lang als de timeout hieronder, zodat een "ja" op
        # de satelliet precies zo lang geldig is als de knop op de telefoon.
        # Het script stopt vanzelf als de satelliet er niet is; de melding op
        # de telefoon is dan nog steeds verstuurd.
        - if:
            - condition: state
              entity_id: group.all_adults
              state: home
          then:
            # `script.turn_on` en niet `script.spraak_vraag_stellen`: bij een
            # gewone scriptaanroep wacht deze automatisering tot het script
            # klaar is, en dat script stáát te luisteren of je antwoord geeft -
            # dat duurt dus tot je iets zegt of het venster verloopt. Met
            # turn_on loopt het script ernaast en is deze ronde meteen klaar.
            - action: script.turn_on
              target:
                entity_id: script.spraak_vraag_stellen
              data:
                variables:
                  vraag: zonnescherm
                  tekst: "{{ vraagtekst }}"
                  minuten: 30
              continue_on_error: true
        # Het antwoord wordt NIET hier afgewacht maar in een eigen
        # automatisering hieronder (`klimaat_zonnescherm_antwoord`). Tot
        # 2026-08-06 stond hier een `wait_for_trigger` van dertig minuten, en
        # zo'n wachtende run overleeft geen enkele reload van de
        # automatiseringen. Bewerkte je in dat halfuur één YAML-bestand, dan
        # was de run weg terwijl de vraag op je telefoon en de
        # antwoordtimer van de satelliet gewoon bleven staan: je kon nog "ja"
        # zeggen, de satelliet antwoordde keurig "Doe ik, het zonnescherm gaat
        # eruit", en er bewoog niets.

    ###########################################################################
    ## Het antwoord op die vraag afhandelen
    ###########################################################################
    # Los van de vraag zelf, zodat er niets hoeft te blijven wachten. Beide
    # kanalen komen hier binnen: de knop op de telefoon en het
    # `spraak_antwoord`-event uit packages/0 - Ground Floor/Kitchen/Voice.yaml.
    #
    # De telefoonknoppen heten `ZONNESCHERM_JA_<context.id>`, dus er valt niet
    # op een vaste waarde te filteren; het event komt hier binnen zonder filter
    # en de conditie hieronder kijkt naar het begin van de naam.
    - id: klimaat_zonnescherm_antwoord
      alias: Klimaat - Zonnescherm antwoord
      description: >-
        Voert uit wat je antwoordt op de zonnescherm-vraag: ja schuift hem uit,
        nee laat hem een paar uur met rust.
      mode: single
      triggers:
        - trigger: event
          event_type: mobile_app_notification_action
        - trigger: event
          event_type: spraak_antwoord
          event_data:
            vraag: zonnescherm
      conditions:
        - alias: Hoort bij de zonneschermvraag, en die is nog geen half uur oud
          condition: template
          value_template: >-
            {% set actie = trigger.event.data.action | default('', true) %}
            {% set hoort_erbij = trigger.event.event_type == 'spraak_antwoord'
                 or actie.startswith('ZONNESCHERM_JA_')
                 or actie.startswith('ZONNESCHERM_NEE_') %}
            {% set gevraagd = state_attr('automation.klimaat_zonnescherm_vragen',
                                         'last_triggered') %}
            {{ hoort_erbij and gevraagd is not none
               and (now() - gevraagd) < timedelta(minutes=30) }}
      actions:
        - variables:
            ja: >-
              {{ trigger.event.data.get('antwoord') == 'ja'
                 or (trigger.event.data.action | default('', true)).startswith('ZONNESCHERM_JA_') }}
        # Beantwoord op de telefoon? Dan hoeft de satelliet er niet meer op te
        # wachten. Kwam het antwoord uit de keuken, dan heeft het intent de
        # vraag zelf al gesloten en doet deze aanroep niets.
        - action: script.spraak_vraag_sluiten
        - if:
            - condition: template
              value_template: "{{ ja }}"
          then:
            # Omgekeerd bedraad: open_cover = uitschuiven. Deze cover kent
            # geen tussenstand, dus positie is hier altijd 100.
            - action: cover.open_cover
              target:
                entity_id: cover.achtertuin_zonnescherm
              continue_on_error: true
          else:
            # Zelfde behandeling als een handmatige bediening: een paar uur
            # niets meer over dit scherm.
            - action: timer.start
              target:
                entity_id: timer.override_zonnescherm
              data:
                duration: >-
                  {{ (states('input_number.klimaat_override_uren') | float(4) * 3600) | int }}
