firealarm_package:

  light:
    - platform: group
      unique_id: all_lights
      name: All Lights
      entities:
        - light.achtertuin_lampen
        - light.badkamer_lampen
        - light.carport_lampen
        - light.eettafel_lampen
        - light.entree_lampen
        - light.garage_lampen
        - light.kantoor_lampen
        - light.keuken_lampen
        - light.overloop_lampen
        - light.overloop_zolder_lampen
        - light.slaapkamer_lampen
        - light.slaapkamer_mini_lampen
        - light.slaapkamer_maxi_lampen
        - light.speelkamer_lampen
        - light.trapkast_lampen
        - light.voortuin_lampen
        - light.woonkamer_lampen
        # Aparte groep sinds de plafondspots op Matter zitten: een
        # Zigbee2MQTT-groep kan geen Matter-lamp bevatten. Zie de kop van
        # packages/0 - Ground Floor/Livingroom/Lights.yaml.
        - light.woonkamer_spots

  binary_sensor:
    - platform: group
      unique_id: nest_protects_smoke
      name: All Nest Protect Fire Alarms
      entities:
        - binary_sensor.nest_protect_hallway_smoke_status
        - binary_sensor.nest_protect_garage_smoke_status
        - binary_sensor.nest_protect_upstairs_smoke_status
        - binary_sensor.nest_protect_cv_kast_smoke_status
        - binary_sensor.nest_protect_zolder_smoke_status
    - platform: group
      unique_id: nest_protects_co
      name: All Nest Protect CO Alarms
      entities:
        - binary_sensor.nest_protect_hallway_co_status
        - binary_sensor.nest_protect_garage_co_status
        - binary_sensor.nest_protect_upstairs_co_status
        - binary_sensor.nest_protect_cv_kast_co_status
        - binary_sensor.nest_protect_zolder_co_status
    - platform: group
      unique_id: all_windows
      name: All Windows
      entities:
        - binary_sensor.badkamer_raam_contact
        - binary_sensor.kantoor_raam_links_contact
        - binary_sensor.kantoor_raam_rechts_contact
        - binary_sensor.keuken_raam_groot_contact
        - binary_sensor.keuken_raam_klein_contact
        - binary_sensor.slaapkamer_raam_links_contact
        - binary_sensor.slaapkamer_raam_rechts_contact
        - binary_sensor.slaapkamer_mini_dakraam_contact
        - binary_sensor.slaapkamer_mini_raam_contact
        - binary_sensor.slaapkamer_maxi_raam_links_contact
        - binary_sensor.slaapkamer_maxi_raam_rechts_contact
    - platform: group
      unique_id: all_doors
      name: All Doors
      entities:
        - binary_sensor.badkamer_deur_contact
        - binary_sensor.entree_deur_contact
        - binary_sensor.kantoor_deur_contact
        # Verving op 2026-08-06 de oude binary_sensor.slaapkamer_deur_contact;
        # dezelfde deur, dezelfde hernoeming naar <area>_<apparaat>_<entiteit>
        # als de voordeur hieronder.
        - binary_sensor.slaapkamer_slaapkamer_deur_deur
        - binary_sensor.slaapkamer_mini_deur_contact
        - binary_sensor.slaapkamer_maxi_deur_contact
        - binary_sensor.toilet_deur_contact
        # Het magneetcontact op de voordeur. Verving op 2026-08-04 de oude
        # binary_sensor.entree_voordeur_contact; dezelfde deur, nieuwe
        # naamgeving (<area>_<apparaat>_<entiteit>, zoals schuur en meterkast).
        - binary_sensor.entree_entree_voordeur_deur
        - binary_sensor.garage_achterdeur_contact
        - binary_sensor.woonkamer_achterdeur_contact
        - binary_sensor.speelkamer_openslaande_deuren_contact
        - binary_sensor.woonkamer_openslaande_deuren_contact

  automation:
    - id: open_covers_firealarm
      alias: General - Alarm Fire
      description: "Do a lot of things when firealarm is triggered to make sure everyone stays safe"
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - binary_sensor.all_nest_protect_fire_alarms
          to: "on"
      conditions: []
      actions:
        - action: cover.open_cover
          metadata: {}
          data: {}
          target:
            entity_id: cover.all_covers_upstairs
        - action: light.turn_on
          metadata: {}
          data:
            brightness_pct: "100"
          target:
            entity_id: light.all_lights
        # De vluchtinstructies hieronder in de `!= dicht`-vorm en niet als
        # `state: on`: bij brand is het niet denkbeeldig dat Zigbee er net uit
        # ligt (de coordinator hangt in de meterkast) en dan is de groep
        # unavailable. Een strikte on-check laat de melding dan stil wegvallen;
        # deze vorm kiest de veilige kant en waarschuwt ook bij twijfel.
        - if:
            - condition: template
              alias: Ramen niet aantoonbaar allemaal dicht
              value_template: "{{ not is_state('binary_sensor.all_windows', 'off') }}"
          then:
            # Volume 1: hier moet iemand het huis uit, dus dit mag door alles
            # heen. Het geluid zelf staat in script.notify_critical.
            - action: script.notify_critical
              data:
                doelgroep: notify.mobile_devices_adults
                titel: Brandalarm!
                bericht: >-
                  Er zijn nog ramen open, sluit deze en ga zo snel mogelijk naar
                  buiten.
                volume: 1
        - if:
            - condition: template
              alias: Deuren niet aantoonbaar allemaal dicht
              value_template: "{{ not is_state('binary_sensor.all_doors', 'off') }}"
          then:
            - action: script.notify_critical
              data:
                doelgroep: notify.mobile_devices_adults
                titel: Brandalarm!
                bericht: >-
                  Er zijn nog deuren open, sluit deze en ga zo snel mogelijk naar
                  buiten.
                volume: 1
    - id: open_covers_coalarm
      alias: General - Alarm CO
      description: "Do a lot of things when CO alarm is triggered to make sure everyone stays safe"
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - binary_sensor.all_nest_protect_co_alarms
          to: "on"
      conditions: []
      actions:
        - action: cover.open_cover
          metadata: {}
          data: {}
          target:
            entity_id: cover.all_covers_upstairs
        - action: light.turn_on
          metadata: {}
          data:
            brightness_pct: "100"
          target:
            entity_id: light.all_lights
        # Zelfde omkering als bij het brandalarm hierboven, spiegelbeeldig:
        # `!= open` in plaats van `state: off`, zodat een unavailable groep
        # (Zigbee weg) de open-die-ramen-instructie niet stil laat wegvallen.
        - if:
            - condition: template
              alias: Ramen niet aantoonbaar open
              value_template: "{{ not is_state('binary_sensor.all_windows', 'on') }}"
          then:
            - action: script.notify_critical
              data:
                doelgroep: notify.mobile_devices_adults
                titel: CO Alarm!
                bericht: >-
                  Er zijn nog ramen dicht, open deze en ga zo snel mogelijk naar
                  buiten.
                volume: 1
        - if:
            - condition: template
              alias: Deuren niet aantoonbaar open
              value_template: "{{ not is_state('binary_sensor.all_doors', 'on') }}"
          then:
            - action: script.notify_critical
              data:
                doelgroep: notify.mobile_devices_adults
                titel: CO Alarm!
                bericht: >-
                  Er zijn nog deuren gesloten, open deze en ga zo snel mogelijk naar
                  buiten.
                volume: 1
