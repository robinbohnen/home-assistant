electricity_package:
  template:
    - switch:
        - name: Live Energieverbruik Totaal Negatief
          unique_id: live_energieverbruik_totaal_negatief
          turn_off: []
          turn_on: []
          default_entity_id: switch.live_energieverbruik_totaal_negatief
          # De guard stond er niet en `states(entity, 0)` leest niet als een
          # standaardwaarde: die 0 is de parameter `rounded`. Zonder bron werd
          # 'unavailable' dus `float(0)` -> 0 -> `on`, en dan kleurde de tegel
          # "Totaal" op het dashboard groen alsof we terugleverden. Dat viel op
          # toen DSMR eruit ging (04-09-2026): de kaart stond op teruglevering
          # terwijl er niets gemeten werd. Bron weg = geen claim, dus `off`.
          state: >-
            {{ has_value('sensor.live_energieverbruik_totaal')
               and states('sensor.live_energieverbruik_totaal') | float(0) <= 0 }}
    - sensor:
        - name: "Live Energieverbruik Totaal"
          unique_id: live_energieverbruik_totaal
          # NETTO OP DE AANSLUITING: positief = afname, negatief = teruglevering.
          # Kwam tot 04-09-2026 uit DSMR als `energieverbruik - energieproductie`
          # (allebei kW). De NUC hangt niet meer in de meterkast, dus de P1-kabel
          # is weg en die integratie is verwijderd; SlimHuys leest de meter nu.
          #
          # Dat is meteen een aftreksom minder: SlimHuys publiceert het netto
          # zelf. Bij ~2,3 metingen per seconde leverde het verschil van twee
          # los vernieuwende sensoren geregeld een oude min een nieuwe waarde op
          # - zichtbaar als pieken van honderden watts die er nooit waren.
          #
          # SlimHuys meet in W; deze sensor blijft in kW, want `huis_verbruik`
          # hieronder en alle energiekaarten rekenen daarmee.
          state: "{{ (states('sensor.meterkast_slimhuys_zonneplan_netto_vermogen') | float(0) / 1000) | round(3) }}"
          availability: >-
            {{ states('sensor.meterkast_slimhuys_zonneplan_netto_vermogen') not in ['unavailable', 'unknown'] }}
          unit_of_measurement: "kW"
          device_class: "power"
          state_class: "measurement"
    # WAT HET HUIS ZELF TREKT - NIET DE METERSTAND
    # Zelfde optelsom als de energieflow op het Overzicht-paneel (dashboards/
    # home/overzicht/kolom_midden.yaml, custom_field `flow` - wijzigt de formule
    # daar, dan ook hier): net + zon, min wat de accu wegzet. De accu telt
    # positief bij laden, dus aftrekken; valt de accusensor langer dan twee
    # minuten weg dan rekenen we met 0, net als de flow-kaart (korter: zie de
    # state hieronder). Onder nul komt in de praktijk alleen
    # meetruis voor, dus dat wordt op 0 afgekapt.
    #
    # `sensor.accu_vermogen` EN NIET DE OMVORMER ZELF (20 september 2026). Hier
    # stond de Marstek-sensor; die accu gaat eruit en de Deye komt ervoor in de
    # plaats. Belangrijker dan de naam is het TEKEN: de Deye telt ontladen
    # positief, precies omgekeerd. Die omkering staat één keer in
    # packages/9 - Other/Battery.yaml en nergens anders - vandaar dat deze som
    # onveranderd kan blijven aftrekken.
    #
    # BEWUST GESAMPLED EN NIET STATE-GEDREVEN: de slimme meter meldt zich
    # meerdere keren per seconde (via DSMR nagemeten 24-08-2026: ~8.300 punten
    # in 20 minuten; via SlimHuys op 04-09-2026 ~2.800, dus dezelfde orde en
    # dezelfde reden). Een gewone template-sensor rendert op elke bronupdate en
    # zou de recorder daarmee volschrijven. Elke 5 s (was 15 s; Robin wilde
    # de live-strook sneller zien bewegen) is ~17.000 rijen per dag - ruim
    # binnen wat de recorder aankan, en de kaart tekent bij elke update.
    - triggers:
        - trigger: time_pattern
          seconds: "/5"
        - trigger: homeassistant
          event: start
      sensor:
        - name: "Huis Verbruik"
          unique_id: huis_verbruik
          default_entity_id: sensor.huis_verbruik
          # EEN ACCU-HIKJE IS GEEN SPRONG IN HET VERBRUIK (21-09-2026)
          # De Deye valt ~2x per uur zo'n tien seconden weg. Met `float(0)`
          # telde de accu dan als 0 W, en bij 3 kW laden sprong het huis voor
          # die ene sample 3 kW omhoog - een piek die er nooit was. Zelfde
          # keuze als bij de zonsensoren (Solarpanels.yaml): vasthouden in
          # plaats van blanken. Is de accu korter dan twee minuten weg, dan
          # blijft de vorige waarde staan; daarna wordt het weer "accu = 0",
          # zodat een dode accu dit getal niet voor altijd bevriest. Geen
          # availability op de accu: dan zat er elk half uur een gat in de
          # live-grafiek.
          state: >-
            {% set netto = states('sensor.live_energieverbruik_totaal') | float(0) %}
            {% set zon_ruw = states('sensor.zon_vermogen_nu') | float(0) %}
            {% set zon = zon_ruw if state_attr('sensor.zon_vermogen_nu', 'unit_of_measurement') == 'kW' else zon_ruw / 1000 %}
            {% set accu_bron = states.sensor.accu_vermogen %}
            {% set hikje = accu_bron is not none
               and not is_number(accu_bron.state)
               and now() - accu_bron.last_changed < timedelta(minutes=2) %}
            {% if hikje and is_number(this.state) %}{{ this.state | float }}
            {% else %}
            {% set accu = states('sensor.accu_vermogen') | float(0) / 1000 %}
            {{ [netto + zon - accu, 0] | max | round(3) }}
            {% endif %}
          # De guard op de zonsensor blijft staan - zonder zon is het huis-
          # verbruik niet te berekenen en zou de kaart een te laag getal tonen.
          # Hij kost sinds 27-08-2026 alleen bijna nooit meer wat: `zon_vermogen_nu`
          # houdt een haperende omvormer tien minuten vast en gaat pas op
          # unavailable als beide arrays weg zijn. Tot die dag hing deze sensor
          # aan de min_max-som, die al bij één wegvallende omvormer `unknown`
          # gaf - vandaar de gaten in de live-grafiek.
          availability: >-
            {{ states('sensor.live_energieverbruik_totaal') not in ['unavailable', 'unknown']
               and states('sensor.zon_vermogen_nu') not in ['unavailable', 'unknown'] }}
          unit_of_measurement: "kW"
          device_class: "power"
          state_class: "measurement"
    # WAT VANDAAG GEKOST HEEFT: AFNAME - TERUGLEVERING + GAS
    #
    # VAN DRIE ZONNEPLAN-SENSOREN NAAR ÉÉN SLIMHUYS-SENSOR (14 september 2026)
    # De som stond hier zelf uitgeschreven uit
    # `zonneplan_electricity_delivery_costs_today`,
    # `..._production_costs_today` en `zonneplan_gas_delivery_costs_today`, met
    # een availability die eiste dat alle drie een waarde hadden. Dat was de
    # zwakke schakel: één `unknown` en de hele tegel stond op "Niet
    # beschikbaar", ook als de stroomkant prima was.
    #
    # En dat gebeurde elke nacht. Om 00:04 rolt Zonneplan de dag om en gaan
    # alle `*_today`-sensoren even op `unknown`. Stroom komt na vijf minuten
    # terug, GAS DUURT RUIM TWEE UUR - gemeten op drie opeenvolgende nachten:
    # 00:00 -> 02:10, 00:04 -> 02:09, en op 14 september kwam hij pas na meer
    # dan acht uur terug (Zonneplan stond toen nog op 0 m³ terwijl de meter via
    # SlimHuys al 0,095 m³ had geteld). De tegel was dus standaard elke ochtend
    # twee uur dood.
    #
    # SlimHuys maakt exact dezelfde som al: 2,06 - 0,30 + 0,17 = 1,93, dezelfde
    # drie posten uit dezelfde P1-meter. Over drie dagen historie (841
    # meetpunten) stond die sensor drie keer kort op unavailable, alle drie
    # tijdens huisbrede hikjes waarop Zonneplan óók weg was - een terugval op
    # Zonneplan zou daar dus niets aan helpen en is bewust weggelaten. Hij
    # reset om 00:04 netjes naar 0,01 en telt gewoon door.
    #
    # De entity-id blijft `sensor.total_costs_today_calculated`, want er hangen
    # zes plekken aan: de klokdisplay (packages/0 - Ground Floor/Kitchen/Clock
    # Display.yaml), de nest hub, het Overzicht en kolom_midden. Ook `EUR` als
    # eenheid blijft staan en wordt niet het `€` van de bron: een sensor met
    # langetermijnstatistieken die van eenheid wisselt, geeft een waarschuwing
    # en een gat in de grafiek.
    #
    # Wat je erop inlevert: twee decimalen in plaats van zeven. Voor een
    # kostentegel is dat geen verlies.
    - sensor:
        - name: "Total costs today calculated"
          unique_id: daily_total_costs_today_calculated
          state: >-
            {{ states('sensor.meterkast_slimhuys_zonneplan_netto_kosten_vandaag') | float(0) }}
          availability: >-
            {{ has_value('sensor.meterkast_slimhuys_zonneplan_netto_kosten_vandaag') }}
          unit_of_measurement: "EUR"
          device_class: "monetary"
          state_class: "total"
