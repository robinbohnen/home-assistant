electricity_package:

  # (Hier stond van 3 oktober tot 4 november 2026 `sensor.huis_verbruik_gemiddeld`,
  # een gemiddelde over 120 s voor het grote getal op de energiekaart, omdat de
  # losse bronnen niet gelijk liepen. Sinds `huis_verbruik` hieronder een
  # momentopname uit één Solarman-ronde is, is dat niet meer nodig.)
  sensor:
    # WARMTEPOMP IN KWH, VOOR HET ENERGY-DASHBOARD (13 oktober 2026)
    # De VR940 meldt via EEBUS alleen vermogen (sensor.vaillant_vr940_power,
    # add-on SlimHuys EEBUS), geen energieteller; het dashboard wil kWh. Dit
    # telt het vermogen op tot kWh.
    #
    # `left` en niet de standaard `trapezoidal`: de VR940 meldt alleen bij een
    # wijziging, dus een waarde geldt tot de volgende. Trapezium zou tussen
    # 24 W (standby) en een opstart naar 2 kW een schuine lijn trekken over
    # het hele stille stuk ervoor en zo energie verzinnen.
    #
    # `max_sub_interval`: zonder nieuwe melding telt hij niet bij. Blijft de
    # pomp een kwartier stabiel op 1,8 kW, dan zou die energie pas bij de
    # volgende wijziging in één keer bijkomen; zo telt hij elke minuut door.
    #
    # Is de bron `unavailable` (add-on weg of de waarde langer dan 12 min niet
    # ververst), dan telt deze teller niet en verzint dus ook niets.
    - platform: integration
      name: "Warmtepomp energie"
      unique_id: warmtepomp_energie
      source: sensor.vaillant_vr940_power
      method: left
      unit_prefix: k
      round: 3
      max_sub_interval:
        minutes: 1

  template:
    - switch:
        - name: Live Energieverbruik Totaal Negatief
          unique_id: live_energieverbruik_totaal_negatief
          turn_off: []
          turn_on: []
          default_entity_id: switch.live_energieverbruik_totaal_negatief
          # De guard stond er niet en `states(entity, 0)` leest niet als een
          # standaardwaarde: die 0 is de parameter `rounded`. Zonder bron werd
          # 'unavailable' dus `float(0)` -> 0 -> `on`, en dan kleurde de tegel
          # "Totaal" op het dashboard groen alsof we terugleverden. Dat viel op
          # toen DSMR eruit ging (04-09-2026): de kaart stond op teruglevering
          # terwijl er niets gemeten werd. Bron weg = geen claim, dus `off`.
          state: >-
            {{ has_value('sensor.live_energieverbruik_totaal')
               and states('sensor.live_energieverbruik_totaal') | float(0) <= 0 }}
    - sensor:
        - name: "Live Energieverbruik Totaal"
          unique_id: live_energieverbruik_totaal
          # NETTO OP DE AANSLUITING: positief = afname, negatief = teruglevering.
          # Kwam tot 04-09-2026 uit DSMR als `energieverbruik - energieproductie`
          # (allebei kW). De NUC hangt niet meer in de meterkast, dus de P1-kabel
          # is weg en die integratie is verwijderd; SlimHuys leest de meter nu.
          #
          # Dat is meteen een aftreksom minder: SlimHuys publiceert het netto
          # zelf. Bij ~2,3 metingen per seconde leverde het verschil van twee
          # los vernieuwende sensoren geregeld een oude min een nieuwe waarde op
          # - zichtbaar als pieken van honderden watts die er nooit waren.
          #
          # SlimHuys meet in W; deze sensor blijft in kW, want `huis_verbruik`
          # hieronder en alle energiekaarten rekenen daarmee.
          state: "{{ (states('sensor.meterkast_slimhuys_zonneplan_netto_vermogen') | float(0) / 1000) | round(3) }}"
          availability: >-
            {{ states('sensor.meterkast_slimhuys_zonneplan_netto_vermogen') not in ['unavailable', 'unknown'] }}
          unit_of_measurement: "kW"
          device_class: "power"
          state_class: "measurement"
    # WAT HET HUIS ZELF TREKT - NIET DE METERSTAND
    # Net + zon, min wat de accu wegzet (de accu telt positief bij laden).
    #
    # SINDS 4 NOVEMBER 2026 ÉÉN MOMENTOPNAME UIT ÉÉN SOLARMAN-RONDE
    # Tot die dag kwam het net van de P1 (via SlimHuys 10-16 s te laat), de
    # zon en de accu van MarkeDroid/Solarman, en las de energiekaart daar een
    # gemiddelde over 120 s van. Op het paneel telde "zon 653 + net 814" dan
    # op tot 1467 W onder een huis van 1654 W. Nu komen alle drie uit dezelfde
    # uitleesronde van de Deye (~5 s):
    #   net  = `sensor.omvormer_net_vermogen` (CT van de Deye op de aansluiting)
    #   zon  = `sensor.zon_vermogen_nu` (met het 0 W-filter, Solarpanels.yaml)
    #   accu = `sensor.accu_vermogen` (+ = laden, Battery.yaml)
    # en staan ze alle drie als ATTRIBUUT op deze sensor (`net_w`, `zon_w`,
    # `accu_w`, plus `huis_w` en `bron`). Een kaart die die vier van deze ene
    # entiteit leest, toont ze dus altijd van hetzelfde moment en ze tellen
    # altijd op: net + zon - accu = huis.
    #
    # DE ~80 W VERSCHIL MET DE P1 is het eigen verbruik van de omvormer (Robin,
    # 4 november): de P1 ziet hem, de som hier niet. Dat is goed zo - de
    # omvormer is geen huis.
    #
    # NOG NIET GETOETST: of de laadpaal achter de CT van de Deye zit. Hij zit
    # aan de netkant van de backup-uitgang, maar meet de CT hem mee? Bij de
    # eerste laadsessie `omvormer_net_vermogen` naast de P1 leggen: lopen ze
    # gelijk op, dan zit hij erin; loopt de P1 kW's hoger, dan mist dit getal
    # de auto.
    #
    # DE P1 IS DE TERUGVAL. Is Solarman stil (`inverter_connection` uit, of
    # een van de drie bronnen weg), dan net = P1 zoals vóór 4 november. Een
    # accu die korter dan twee minuten weg is houdt dan de vorige stand vast
    # (21-09-2026: anders sprong het huis bij 3 kW laden voor één sample 3 kW
    # omhoog).
    #
    # HOE VAAK: elke seconde gekeken, maar HA schrijft alleen als het getal
    # verandert, en dat doet het met de Deye-bron één keer per ronde (~5 s).
    # Elke seconde, zodat een nieuwe ronde binnen een seconde in het getal
    # staat in plaats van tot 5 s later. Een tijdtrigger en niet een trigger op
    # de bronnen: een Solarman-ronde schrijft alle entiteiten in één keer, en
    # een tijdtik ziet daardoor altijd een hele ronde en nooit een halve. In
    # de P1-terugval alleen elke 5 s, want de P1 meldt zich ~2x per seconde
    # en dan zou elke tik een rij in de database zijn (24-08-2026 gemeten).
    - triggers:
        - trigger: time_pattern
          seconds: "/1"
          id: snel
        - trigger: homeassistant
          event: start
          id: start
      sensor:
        - name: "Huis Verbruik"
          unique_id: huis_verbruik
          default_entity_id: sensor.huis_verbruik
          state: >-
            {% set deye = is_state('binary_sensor.inverter_connection', 'on')
               and has_value('sensor.omvormer_net_vermogen')
               and has_value('sensor.zon_vermogen_nu') and has_value('sensor.accu_vermogen') %}
            {% set zon = states('sensor.zon_vermogen_nu') | float(0) / 1000 %}
            {% if deye %}
              {% set net = states('sensor.omvormer_net_vermogen') | float(0) / 1000 %}
              {% set accu = states('sensor.accu_vermogen') | float(0) / 1000 %}
              {{ [net + zon - accu, 0] | max | round(3) }}
            {% elif trigger.id == 'snel' and now().second % 5 != 0 and is_number(this.state) %}
              {{ this.state }}
            {% else %}
              {% set net = states('sensor.live_energieverbruik_totaal') | float(0) %}
              {% set accu_bron = states.sensor.accu_vermogen %}
              {% set hikje = accu_bron is not none
                 and not is_number(accu_bron.state)
                 and now() - accu_bron.last_changed < timedelta(minutes=2) %}
              {% if hikje and is_number(this.state) %}{{ this.state | float }}
              {% else %}
                {% set accu = states('sensor.accu_vermogen') | float(0) / 1000 %}
                {{ [net + zon - accu, 0] | max | round(3) }}
              {% endif %}
            {% endif %}
          # De momentopname in W. In de terugval is `net_w` de P1 en klopt de
          # som niet op de watt (de P1 loopt achter); `bron` zegt welke het is.
          # Bij een tussentik in de terugval blijven ze staan, net als de state.
          attributes:
            bron: >-
              {% set deye = is_state('binary_sensor.inverter_connection', 'on')
                 and has_value('sensor.omvormer_net_vermogen')
                 and has_value('sensor.zon_vermogen_nu') and has_value('sensor.accu_vermogen') %}
              {% set houd = not deye and trigger.id == 'snel' and now().second % 5 != 0
                 and this.attributes is defined and this.attributes.get('bron') is not none %}
              {% if houd %}{{ this.attributes.get('bron') }}{% else %}{{ 'deye' if deye else 'p1' }}{% endif %}
            net_w: >-
              {% set deye = is_state('binary_sensor.inverter_connection', 'on')
                 and has_value('sensor.omvormer_net_vermogen')
                 and has_value('sensor.zon_vermogen_nu') and has_value('sensor.accu_vermogen') %}
              {% set houd = not deye and trigger.id == 'snel' and now().second % 5 != 0
                 and this.attributes is defined and this.attributes.get('net_w') is not none %}
              {% if houd %}{{ this.attributes.get('net_w') }}{% else %}{{ (states('sensor.omvormer_net_vermogen') | float(0) if deye else states('sensor.live_energieverbruik_totaal') | float(0) * 1000) | round(0) }}{% endif %}
            zon_w: >-
              {% set deye = is_state('binary_sensor.inverter_connection', 'on')
                 and has_value('sensor.omvormer_net_vermogen')
                 and has_value('sensor.zon_vermogen_nu') and has_value('sensor.accu_vermogen') %}
              {% set houd = not deye and trigger.id == 'snel' and now().second % 5 != 0
                 and this.attributes is defined and this.attributes.get('zon_w') is not none %}
              {% if houd %}{{ this.attributes.get('zon_w') }}{% else %}{{ states('sensor.zon_vermogen_nu') | float(0) | round(0) }}{% endif %}
            accu_w: >-
              {% set deye = is_state('binary_sensor.inverter_connection', 'on')
                 and has_value('sensor.omvormer_net_vermogen')
                 and has_value('sensor.zon_vermogen_nu') and has_value('sensor.accu_vermogen') %}
              {% set houd = not deye and trigger.id == 'snel' and now().second % 5 != 0
                 and this.attributes is defined and this.attributes.get('accu_w') is not none %}
              {% if houd %}{{ this.attributes.get('accu_w') }}{% else %}{{ states('sensor.accu_vermogen') | float(0) | round(0) }}{% endif %}
            huis_w: >-
              {% set deye = is_state('binary_sensor.inverter_connection', 'on')
                 and has_value('sensor.omvormer_net_vermogen')
                 and has_value('sensor.zon_vermogen_nu') and has_value('sensor.accu_vermogen') %}
              {% set houd = not deye and trigger.id == 'snel' and now().second % 5 != 0
                 and this.attributes is defined and this.attributes.get('huis_w') is not none %}
              {% if houd %}{{ this.attributes.get('huis_w') }}{% else %}{% set net = states('sensor.omvormer_net_vermogen') | float(0) if deye else states('sensor.live_energieverbruik_totaal') | float(0) * 1000 %}{{ [net + states('sensor.zon_vermogen_nu') | float(0) - states('sensor.accu_vermogen') | float(0), 0] | max | round(0) }}{% endif %}
          # Zonder zon is het huisverbruik niet te berekenen. Zonder Deye-net
          # én zonder P1 ook niet.
          availability: >-
            {{ has_value('sensor.zon_vermogen_nu')
               and (has_value('sensor.omvormer_net_vermogen')
                    or has_value('sensor.live_energieverbruik_totaal')) }}
          unit_of_measurement: "kW"
          device_class: "power"
          state_class: "measurement"
    # WAT VANDAAG GEKOST HEEFT: AFNAME - TERUGLEVERING + GAS
    #
    # VAN DRIE ZONNEPLAN-SENSOREN NAAR ÉÉN SLIMHUYS-SENSOR (14 september 2026)
    # De som stond hier zelf uitgeschreven uit
    # `zonneplan_electricity_delivery_costs_today`,
    # `..._production_costs_today` en `zonneplan_gas_delivery_costs_today`, met
    # een availability die eiste dat alle drie een waarde hadden. Dat was de
    # zwakke schakel: één `unknown` en de hele tegel stond op "Niet
    # beschikbaar", ook als de stroomkant prima was.
    #
    # En dat gebeurde elke nacht. Om 00:04 rolt Zonneplan de dag om en gaan
    # alle `*_today`-sensoren even op `unknown`. Stroom komt na vijf minuten
    # terug, GAS DUURT RUIM TWEE UUR - gemeten op drie opeenvolgende nachten:
    # 00:00 -> 02:10, 00:04 -> 02:09, en op 14 september kwam hij pas na meer
    # dan acht uur terug (Zonneplan stond toen nog op 0 m³ terwijl de meter via
    # SlimHuys al 0,095 m³ had geteld). De tegel was dus standaard elke ochtend
    # twee uur dood.
    #
    # SlimHuys maakt exact dezelfde som al: 2,06 - 0,30 + 0,17 = 1,93, dezelfde
    # drie posten uit dezelfde P1-meter. Over drie dagen historie (841
    # meetpunten) stond die sensor drie keer kort op unavailable, alle drie
    # tijdens huisbrede hikjes waarop Zonneplan óók weg was - een terugval op
    # Zonneplan zou daar dus niets aan helpen en is bewust weggelaten. Hij
    # reset om 00:04 netjes naar 0,01 en telt gewoon door.
    #
    # De entity-id blijft `sensor.total_costs_today_calculated`, want er hangen
    # zes plekken aan: de klokdisplay (packages/0 - Ground Floor/Kitchen/Clock
    # Display.yaml), de nest hub, het Overzicht en kolom_midden. Ook `EUR` als
    # eenheid blijft staan en wordt niet het `€` van de bron: een sensor met
    # langetermijnstatistieken die van eenheid wisselt, geeft een waarschuwing
    # en een gat in de grafiek.
    #
    # Wat je erop inlevert: twee decimalen in plaats van zeven. Voor een
    # kostentegel is dat geen verlies.
    - sensor:
        - name: "Total costs today calculated"
          unique_id: daily_total_costs_today_calculated
          state: >-
            {{ states('sensor.meterkast_slimhuys_zonneplan_netto_kosten_vandaag') | float(0) }}
          availability: >-
            {{ has_value('sensor.meterkast_slimhuys_zonneplan_netto_kosten_vandaag') }}
          unit_of_measurement: "EUR"
          device_class: "monetary"
          state_class: "total"
