#############################################################################
## Kamerstatus - één sensor die het hele huis beschrijft
#############################################################################
#
# De inhoud komt uit `custom_templates/kamers.jinja`; hier staat alleen hoe
# vaak er gemeten wordt en hoe het naar buiten komt. Zie ook
# `dashboards/home/kamers.yaml`, dat is de enige afnemer.
#
# WAAROM DIE `kamers_package:`-SLEUTEL BOVENAAN
# `configuration.yaml` laadt de packages met `!include_dir_merge_named`, en die
# gooit de INHOUD van alle bestanden in één dict. Twee bestanden met dezelfde
# sleutel op het hoogste niveau overschrijven elkaar dus. Begint dit bestand
# met `template:`, dan wordt "template" een pakketnaam en verdwijnt de sensor
# zonder dat er iets kapot lijkt. Elk pakket hier heeft daarom een eigen unieke
# naam op regel één.
#
# WAAROM ÉÉN SENSOR EN NIET ÉÉN PER KAMER
# Twee redenen, allebei geleerd in dit huis:
#   1. Een button-card rendert alleen opnieuw als zijn `entity` verandert. Met
#      één sensor kan elke tegel `entity: sensor.kamers` gebruiken en ververst
#      het hele raster tegelijk. Met zeventien sensoren zou elke tegel op zijn
#      eigen entiteit moeten wachten en zouden de tegels dus op verschillende
#      momenten bijwerken.
#   2. De macro doet één ronde langs alle kamers. Zeventien losse sensoren
#      zouden die ronde zeventien keer doen.
#
# WAAROM ELKE MINUUT EN NIET BIJ ELKE WIJZIGING
# Een gewone (state-based) template sensor zou hertekenen bij élke wijziging
# van élke sensor die hij aanraakt - inclusief alle bewegingsmelders, die
# tientallen keren per minuut kunnen schakelen. Dit is een overzichtspagina,
# geen alarm: één keer per minuut is ruim genoeg en veel voorspelbaarder.
# De prijs is dat de bewegingsstip tot 60 seconden achterloopt.
#
# WAAROM DE MACRO IN `action:` STAAT EN NIET IN DE TEMPLATES ZELF
# State en attributen worden apart gerenderd, dus met de macro in allebei liep
# hij twee keer per minuut. Een variabele uit de `action:`-sectie is beschikbaar
# in de templates van álle entiteiten in dit blok, dus nu draait hij één keer.
# (Vereist HA 2024.10 of nieuwer - dezelfde versie die ook de `trigger:`-sleutel
# hieronder introduceerde. Blijft `sensor.kamers` na een herstart leeg, kijk dan
# eerst in het log of dit blok wel geladen is.)
#
# LET OP: wijzigingen in kamers.jinja vragen een volledige herstart van Home
# Assistant - een template-reload is niet genoeg.
#
# `sensor.kamers` staat bewust in de recorder-uitsluiting in
# configuration.yaml: het attribuut is een blok van zo'n 10 kB en zou anders
# elke minuut opnieuw worden weggeschreven.

kamers_package:
  template:
    - trigger:
        - trigger: time_pattern
          minutes: "/1"
        # Zonder deze staat de tegelmuur na een herstart een minuut leeg.
        - trigger: homeassistant
          event: start

      action:
        - variables:
            kamerlijst: >
              {% from 'kamers.jinja' import kamers_json %}
              {{ (kamers_json() | trim | from_json).kamers }}

      sensor:
        # De state is het aantal ruimtes dat aandacht vraagt, zodat je er een
        # melding of een badge op kunt hangen zonder in de attributen te graven.
        - name: Kamers
          unique_id: kamers
          icon: mdi:home-search-outline
          state: >
            {{ kamerlijst | selectattr('score', 'ge', 1) | list | count }}
          attributes:
            kamers: "{{ kamerlijst }}"

    #########################################################################
    ## De onderhoudslijst: wat hangt er wél, maar is niet gekoppeld
    #########################################################################
    # Sinds de kamers hun sensoren aangewezen krijgen in plaats van zoeken, komt
    # een nieuw apparaat niet meer vanzelf op het dashboard. Deze sensor maakt
    # dat zichtbaar, zodat "aanwijzen" geen "vergeten" wordt.
    #
    # Eén keer per uur is genoeg: dit verandert alleen als je een apparaat
    # toevoegt of verplaatst. Elke minuut zou een area-scan over het hele huis
    # betekenen, en dat is precies de kost die uit `sensor.kamers` is gehaald.
    - trigger:
        - trigger: time_pattern
          hours: "/1"
        - trigger: homeassistant
          event: start

      action:
        - variables:
            los: >
              {% from 'kamers.jinja' import ongekoppeld_json %}
              {{ (ongekoppeld_json() | trim | from_json).sensoren }}

      sensor:
        - name: Kamers niet gekoppeld
          unique_id: kamers_niet_gekoppeld
          icon: mdi:link-variant-off
          state: "{{ los | count }}"
          attributes:
            sensoren: "{{ los }}"
