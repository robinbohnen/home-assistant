##############################################################################
## KLOKKEN - DEZELFDE ZON- EN ACCU-APP OP MEERDERE AWTRIX-SCHERMEN
##
## Er hangen drie Ulanzi TC001's in huis:
##   clock_1  keuken     - draait de volle app-rotatie, zie
##                         packages/0 - Ground Floor/Kitchen/Clock Display.yaml
##   clock_2  woonkamer
##   clock_3  garage      - staat alleen aan als er beweging is, zie onderaan
## De laatste twee tonen bewust maar twee dingen: wat de panelen doen en hoe de
## thuisaccu ervoor staat. Daarnaast branden hun twee bovenste indicatoren:
##   indicator 1  stroomprijs nu, een kleur per tariefniveau:
##                blauw spotgoedkoop / groen goedkoop / oranje midden /
##                diep oranje duur / rood spotduur
##   indicator 2  bezetting van de dienstdoende ploeg, alleen als het knelt
## Een indicator is een stipje van een pixel: het zegt "kijk even" en verder
## niets. Alles wat een getal of een naam nodig heeft hoort in een app.
##
## WAAROM DE TEKENLOGICA HIER STAAT EN NIET DRIE KEER IN EEN ROOM-PACKAGE
## Beide frames zijn met de hand uitgerekende pixels op een 32x8-matrix: waar
## het zonnetje ophoudt, hoe breed een cijfer is, waar een balk mag beginnen.
## Dat drie keer kopieren betekent dat een correctie drie keer moet gebeuren en
## de schermen bij de eerste vergeten kopie uit elkaar lopen. Twee klokken die
## hetzelfde zouden moeten zeggen en dat niet doen is erger dan een klok die
## iets niet toont, dus: een script, een bron.
##
## WAAROM DE PAYLOAD EEN VARIABELE IS EN NIET PER KLOK GERENDERD WORDT
## De templates worden een keer aan het begin van het script uitgerekend en
## daarna onveranderd naar elke klok gestuurd. Zou je per klok renderen, dan
## kan een sensor tussen twee publishes door veranderen en staat er op de
## garageklok een ander getal dan in de woonkamer.
##
## LEGE PAYLOAD = APP WEG
## Is er geen opwek of geen accudata, dan gaat er een lege payload heen. Dat
## verwijdert de app op de klok; `{}` liet een lege app staan. Met `retain:
## true` wist die lege publish meteen het bewaarde bericht op de broker.
##
## RETAIN WERKT OOK VOORUIT
## De broker bewaart per topic het laatste bericht. Een klok die nu nog niet
## bestaat of net opnieuw opstart, krijgt bij het verbinden dus direct beide
## apps binnen zonder op de volgende cyclus te wachten.
##
## WANNEER STAAT ER EEN SCHERM AAN
## Het alarm is de hoofdschakelaar: staat het huis op scherp, dan gaan alle drie
## de schermen uit. Voor de keuken- en woonkamerklok is er een uitzondering -
## brandt het licht in de woonkamer, dan mogen die twee toch aan, want dan is er
## iemand beneden. De garageklok kent die uitzondering niet en hangt verder aan
## beweging. Beide regels staan onderaan dit bestand; in
## packages/0 - Ground Floor/Kitchen/Clock Display.yaml zit hier bewust niets
## meer over, want daar stonden ze elkaar tegen te werken.
##
## HOE FEL DAT SCHERM DAN STAAT
## De keuken- en woonkamerklok volgen dezelfde twee niveaus als de rest van de
## woonkamer: 1% zolang er een film loopt, 50% zodra hij op pauze of afgelopen
## staat. Het zetten gebeurt op twee plekken en dat is met opzet.
## `script.woonkamer_media_licht` doet het op het moment dat de kijkstand
## verandert - dat is waar de andere lampen ook geregeld worden - en het script
## hieronder doet het nog een keer bij het aanzetten, voor de klok die tijdens
## de film uit stond en die overgang dus gemist heeft.
## De garageklok houdt zijn eigen `BRI`; die hangt in een ruimte zonder
## avondstand.
##
## EEN NIEUWE KLOK KOMT MET VIER FIRMWARE-APPS
## Uit de doos draaien Time, Temperature, Humidity en Battery mee in de
## rotatie; op clock_2 en clock_3 stonden ze op 2026-08-08 nog tussen de twee
## eigen apps. Uitzetten gaat met `script.klok_native_apps_uit`, zie daar.
##############################################################################

klokken_package:

  script:
    # HANDMATIG GEREEDSCHAP - wordt bewust nergens door een automation
    # aangeroepen (zelfde categorie als `script.spraak_omroepen`). Draai hem
    # zelf vanuit Ontwikkelhulpmiddelen bij een nieuwe of gereset klok.
    klok_native_apps_uit:
      alias: Klok - Firmware-apps uitzetten
      description: >-
        Zet de ingebouwde AWTRIX-apps (tijd, temperatuur, luchtvochtigheid,
        accu) uit, zodat een klok alleen de apps toont die hier gepubliceerd
        worden. Eenmalig draaien per nieuwe of gereset klok.
      icon: mdi:apps-box
      mode: single
      fields:
        klokken:
          name: Klokken
          description: Lijst met MQTT topic-prefixes, net als bij het teken-script.
          required: true
          example: "[clock_2, clock_3]"
          selector:
            object:
      sequence:
        # RETAIN: FALSE, EN MET REDEN
        # De klok schrijft elke settings-publish naar zijn flash. Bewaard op de
        # broker zou dat bij elke herverbinding opnieuw gebeuren, voor een
        # instelling die de klok zelf al onthoudt.
        - alias: Firmware-apps uit op elke klok
          repeat:
            for_each: "{{ klokken }}"
            sequence:
              - action: mqtt.publish
                data:
                  qos: 0
                  retain: false
                  topic: "{{ repeat.item }}/settings"
                  payload: >-
                    {"TIM": false, "DAT": false, "HUM": false, "TEMP": false,
                    "BAT": false}
        # DE APP-LIJST VOLGT PAS NA EEN HERSTART
        # Firmware 0.98 slaat de instelling meteen op, maar bouwt de lopende
        # rotatie niet opnieuw op: de vier apps bleven in `/api/loop` staan
        # totdat de klok opnieuw opstartte. Er is geen MQTT-topic voor, dus dat
        # gaat met de hand:
        #   curl -X POST http://<ip-van-de-klok>/api/reboot
        # De klok is na een seconde of tien terug en pikt de bewaarde apps
        # direct weer op.

    klok_keuken_woonkamer_stand:
      alias: Klok - Stand keuken en woonkamer bijwerken
      description: >-
        Zet de keuken- en woonkamerklok aan of uit volgens de huisregel: aan als
        het alarm uit staat of als het licht in de woonkamer brandt, en meteen
        op de juiste helderheid (1% tijdens een film, anders 50%).
      icon: mdi:monitor-dashboard
      # WAAROM DIT EEN SCRIPT IS EN NIET GEWOON DE AUTOMATISERING
      # De reistijd-app in Kitchen/Clock Display.yaml zet de keukenklok 's
      # ochtends een minuut aan en moet hem daarna teruggeven. Die stand
      # daar nog een keer uitrekenen betekent twee plekken die het eens moeten
      # blijven; nu vraagt hij het gewoon hier op.
      mode: restart
      sequence:
        - variables:
            # Onbekend of onbereikbaar telt als "alarm uit": een scherm dat
            # zwart blijft omdat Alarmo even weg was is erger dan een scherm
            # dat aan staat terwijl het huis op scherp had gestaan - dat
            # laatste zie je meteen, het eerste zoek je een avond.
            klok_aan: >-
              {{ states('alarm_control_panel.alarmo')
                 in ['disarmed', 'unavailable', 'unknown']
                 or is_state('light.woonkamer_lampen', 'on') }}
            # Een sessie die niet op pauze staat. De pauze-tak van
            # `livingroom_media_playing` gaat af als de Apple TV op `paused` of
            # `idle` springt en zet de klokken juist wel op 50%, dus die twee
            # standen tellen hier niet als kijken. Loopt de sessie via de
            # PlayStation of de tv zelf, dan komt de Apple TV die standen niet
            # binnen en blijft het dus gewoon kijken - net als daar.
            film_loopt: >-
              {{ is_state('input_boolean.woonkamer_kijksessie', 'on')
                 and states('media_player.woonkamer_appletv')
                     not in ['paused', 'idle'] }}
        # DE HELDERHEID VOLGT DE KIJKSESSIE, NIET DE STAND VAN DE KLOK
        # Dezelfde twee niveaus als in `script.woonkamer_media_licht`: 1% als er
        # een film loopt, anders 50%. Dat script zet ze alleen op klokken die op
        # dat moment aan staan, en dat is niet genoeg. Ging de klok tijdens de
        # film uit (licht uit, alarm aan) en liep de film daarna af, dan is er
        # niemand meer die de 1% terugdraait en kwam hij de volgende ochtend
        # gedimd terug tot de eerstvolgende film. Nu bepaalt het aanzetten zelf
        # het niveau en verdwijnt dat gat.
        - if:
            - condition: template
              value_template: "{{ klok_aan }}"
          then:
            - action: light.turn_on
              target:
                entity_id:
                  - light.keuken_klok_awtrix_keuken_matrix
                  - light.woonkamer_klok_awtrix_woonkamer_matrix
              data:
                brightness_pct: "{{ 1 if film_loopt else 50 }}"
          else:
            - action: light.turn_off
              target:
                entity_id:
                  - light.keuken_klok_awtrix_keuken_matrix
                  - light.woonkamer_klok_awtrix_woonkamer_matrix

    klok_zon_en_accu:
      alias: Klok - Zon en accu tekenen
      description: >-
        Tekent het zonne-overzicht en de accustatus en zet ze op elke opgegeven
        AWTRIX-klok. Verwacht MQTT topic-prefixes, niet de entity-id's van de
        klokken.
      icon: mdi:solar-power-variant
      # PARALLEL, EN MET REDEN
      # De keuken en de twee andere klokken hebben allebei hun eigen
      # automatisering op dezelfde `/30`-tik. Met `mode: single` zou de tweede
      # aanroep stilletjes vervallen en bleef er telkens een klok achter op de
      # ander.
      mode: parallel
      max: 4
      fields:
        klokken:
          name: Klokken
          description: >-
            Lijst met MQTT topic-prefixes, zoals ze in de AWTRIX-webinterface
            zijn ingesteld. Dus `clock_2`, niet `light.awtrix_..._matrix`.
          required: true
          example: "[clock_2, clock_3]"
          selector:
            object:
      sequence:
        - alias: Beide frames een keer uitrekenen
          variables:
            # Een frame op 32x8: links een zonnetje, rechts het totaal, en
            # onderaan een balk per set panelen.
            #
            # HET ZONNETJE IS GEEN VERSIERING
            # Het is het enige dat zegt waar je naar kijkt. Zonder dat plaatje
            # staat er een getal op het scherm waarvan je niet weet of het
            # opwek, verbruik of teruglevering is - dat is uitgeprobeerd en het
            # leest niet. Zeven pixels breed en dat is hij waard.
            #
            # DE VOLGORDE VAN DE BALKEN IS DE VOLGORDE OP DE KAVEL
            # Van voor naar achter gezien: zolder (voorzijde) boven, de derde
            # set straks in het midden, achtertuin onder. Dat onthoud je zonder
            # legenda, en het klopt toevallig ook met de orientatie - de
            # bovenste balk piekt dus 's ochtends en de onderste 's middags.
            #
            # Zolang die derde set er niet is staan zolder en achtertuin
            # gewoon tegen elkaar op rij 6 en 7, en blijft rij 5 leeg als lucht
            # tussen de tekst en de balken. Een lege rij tussen de balken in
            # openhouden zag er rommeliger uit dan die lucht bovenaan. Komt de
            # derde set, dan schuift zolder een rij omhoog naar 5 en neemt de
            # nieuwe set de middelste plek op rij 6 in; de volgorde van voor
            # naar achter klopt dan nog steeds.
            #
            # WAAROM EEN BALK PER SET EN NIET EEN VOOR HET TOTAAL
            # Elke set heeft een eigen plafond en piekt op een ander moment.
            # Achtertuin: 16 panelen, 10 graden zuidwest, GW5000N-EH, 5 kW AC.
            # Zolder: 12 panelen, 45 graden oost, GW3000D-NS, 3 kW AC. Samen
            # 8 kW, maar in de praktijk haal je hooguit ~7 kW omdat de
            # ochtendpiek van oost al voorbij is als zuidwest zijn middagpiek
            # draait. Een balk op 8000 W zou dus nooit verder komen dan een
            # procent of 85 en altijd halfleeg lijken. Per set gedeeld door zijn
            # eigen omvormer raakt de achtertuin op heldere dagen wel echt 100%,
            # en dan zie je precies wat je wil zien: een vlakke top, oftewel de
            # omvormer die staat te klippen.
            #
            # De plafonds komen uit `..._capacity` (in kW) en niet uit een getal
            # in dit bestand, zodat een andere omvormer vanzelf de schaal
            # meeneemt. Let op de namen: het vermogen van de achtertuin heet bij
            # GoodWe `..._overkapping`, het plafond `..._achtertuin_capacity`.
            # Zelfde omvormer, twee namen.
            zon_payload: >-
              {%- if (has_value('sensor.inverter_kroon_18_overkapping')
                      or has_value('sensor.inverter_kroon_18_zolder_voorzijde'))
                     and states('sensor.zon_vermogen_nu') | float(0) > 0 -%}
              {%- set p_zolder = states('sensor.inverter_kroon_18_zolder_voorzijde') | float(0) -%}
              {%- set p_tuin = states('sensor.inverter_kroon_18_overkapping') | float(0) -%}
              {%- set c_zolder = [states('sensor.inverter_kroon_18_zolder_capacity') | float(3) * 1000, 1] | max -%}
              {%- set c_tuin = [states('sensor.inverter_kroon_18_achtertuin_capacity') | float(5) * 1000, 1] | max -%}
              {%- set tot = p_zolder + p_tuin -%}
              {#- HELE WATTS, MAAR KW ZODRA HET ER VIJF CIJFERS WORDEN
                  Twee sets halen samen nooit meer dan 8000 W en dat past. Met
                  een derde omvormer erbij kan het totaal over de 9999 en dan
                  loopt het label het zonnetje in. Boven de 10 kW dus kW met een
                  decimaal; dat is drie tekens korter en op dat niveau zegt een
                  losse watt toch niets meer. -#}
              {%- if tot < 10000 -%}
              {%- set label = (tot | round(0) | int) | string ~ 'W' -%}
              {%- else -%}
              {%- set label = '%.1f' | format(tot / 1000) ~ 'kW' -%}
              {%- endif -%}
              {#- DE BREEDTE WORDT PER TEKEN GETELD EN NIET GESCHAT
                  Opgemeten door een testframe terug te lezen met /api/screen:
                  een cijfer schuift 4 px op, een punt 2, de `k` 4 en de `W` 6.
                  Rechts uitlijnen tot en met x=29 en niet tot de rand, want op
                  x=30 en x=31 tekent de firmware de indicatorstipjes en die
                  gaan er overheen. `31 - breedte` levert precies dat op: het
                  breedste label ("11.4kW", 24 px) begint dan op x=7, direct
                  naast het zonnetje dat tot x=6 loopt. -#}
              {%- set tekenbreedte = {'.': 2, 'W': 6} -%}
              {%- set b = namespace(px=0) -%}
              {%- for teken in label -%}
              {%- set b.px = b.px + tekenbreedte.get(teken, 4) -%}
              {%- endfor -%}
              {%- set tx = 31 - b.px -%}
              {%- set l_zolder = [[(p_zolder * 32 / c_zolder) | round(0) | int, 32] | min, 0] | max -%}
              {%- set l_tuin = [[(p_tuin * 32 / c_tuin) | round(0) | int, 32] | min, 0] | max -%}
              {#- Geel zodra een omvormer tegen zijn plafond zit: dat is geen
                  storing maar wel het moment waarop je opwek verliest. Op een
                  balk van 32 px is 98% en 100% een verschil van een pixel, dus
                  zonder die kleurwissel zou je het klippen simpelweg niet
                  zien. -#}
              {%- set k_zolder = '#FFD60A' if p_zolder >= c_zolder * 0.98 else '#32D74B' -%}
              {%- set k_tuin = '#FFD60A' if p_tuin >= c_tuin * 0.98 else '#32D74B' -%}
              {#- Rij 5 krijgt bewust ook geen donkere achtergrond: een lege
                  goot ziet eruit als een set die niets doet, en die set bestaat
                  nog niet. Straks komen hier de achtergrond en de balk van
                  zolder te staan en schuift de derde set op rij 6 tussen de
                  twee bestaande in, met dezelfde twee regels als hieronder. -#}
              {"draw": [
              {"df": [0, 6, 32, 1, "#222222"]},
              {"df": [0, 7, 32, 1, "#222222"]},
              {"df": [2, 2, 3, 2, "#FFD60A"]},
              {"df": [3, 0, 1, 1, "#FFD60A"]},
              {"df": [3, 4, 1, 1, "#FFD60A"]},
              {"df": [0, 2, 1, 1, "#FFD60A"]},
              {"df": [6, 2, 1, 1, "#FFD60A"]},
              {"dt": [{{ tx }}, 0, "{{ label }}", "#FFFFFF"]}
              {%- if l_zolder > 0 %}, {"df": [0, 6, {{ l_zolder }}, 1, "{{ k_zolder }}"]}{% endif %}
              {%- if l_tuin > 0 %}, {"df": [0, 7, {{ l_tuin }}, 1, "{{ k_tuin }}"]}{% endif %}
              ], "duration": 8, "lifetime": 300, "lifetimeMode": 0}
              {%- endif -%}
            # Een frame op 32x8: batterijsymbool met vulniveau (links, kleur =
            # laden / ontladen / idle), percentage rechts uitgelijnd, en op de
            # onderste rij een vermogensbalk vanaf links: lengte = vermogen
            # (volle breedte = 2500 W), kleur = richting. Eerder liep die balk
            # vanuit het midden, maar zonder zichtbaar nulpunt was niet af te
            # lezen waar hij begon.
            # Let op: bij "dt" is y de bovenkant van de tekst, niet de baseline -
            # daarom y=0, anders valt de tekst buiten het scherm.
            accu_payload: >-
              {%- if has_value('sensor.lilygo_rs485_marstek_battery_state_of_charge') -%}
              {%- set soc = [[states('sensor.lilygo_rs485_marstek_battery_state_of_charge') | float(0) | round(0) | int, 0] | max, 100] | min -%}
              {%- set pw = states('sensor.lilygo_rs485_marstek_battery_power') | float(0) -%}
              {%- set inv = states('sensor.lilygo_rs485_marstek_inverter_state') -%}
              {%- set laadt = inv == 'Charge' or (inv not in ['Charge', 'Discharge'] and pw > 20) -%}
              {%- set ontlaadt = inv == 'Discharge' or (inv not in ['Charge', 'Discharge'] and pw < -20) -%}
              {%- set vul = [[(soc * 9 / 100) | round(0) | int, 1] | max, 9] | min -%}
              {%- set vulkleur = '#FF3B30' if soc <= 10 else ('#32D74B' if laadt else ('#FF9F0A' if ontlaadt else '#0A84FF')) -%}
              {%- set label = soc | string ~ '%' -%}
              {#- 31 en niet 32: net als bij het zonneframe eindigt het label
                  dan op x=30, vrij van de indicatorstipjes in de rechter
                  bovenhoek. Met 32 viel de laatste kolom van het %-teken
                  structureel onder de (vrijwel altijd brandende)
                  prijsindicator. -#}
              {%- set tx = 31 - (label | length * 4) -%}
              {%- set lengte = [[((pw | abs) * 32 / 2500) | round(0) | int, 32] | min, 1] | max -%}
              {"draw": [
              {"df": [0, 7, 32, 1, "#222222"]},
              {"dr": [0, 0, 11, 6, "#3A3A3A"]},
              {"df": [11, 2, 1, 2, "#3A3A3A"]},
              {"df": [1, 1, {{ vul }}, 4, "{{ vulkleur }}"]},
              {"dt": [{{ tx }}, 0, "{{ label }}", "#FFFFFF"]}
              {%- if laadt or ontlaadt %}, {"df": [0, 7, {{ lengte }}, 1, "{{ '#32D74B' if laadt else '#FF9F0A' }}"]}{% endif %}
              ], "duration": 8, "lifetime": 300, "lifetimeMode": 0}
              {%- endif -%}
        - alias: Beide frames naar elke klok sturen
          repeat:
            for_each: "{{ klokken }}"
            sequence:
              - alias: Zonne-overzicht
                action: mqtt.publish
                data:
                  qos: 0
                  retain: true
                  topic: "{{ repeat.item }}/custom/power_generated"
                  payload: "{{ zon_payload }}"
              - alias: Accustatus
                action: mqtt.publish
                data:
                  qos: 0
                  retain: true
                  topic: "{{ repeat.item }}/custom/battery"
                  payload: "{{ accu_payload }}"

  automation:
    - id: klokken_zon_accu_woonkamer_garage
      alias: Klokken - Zon en accu woonkamer en garage
      description: >-
        Houdt de twee apps op de woonkamer- en garageklok bij. Deze twee tonen
        verder niets, dus er zit hier bewust geen aan/uit-check op de matrix
        voor: dan zou de app na vijf minuten (`lifetime: 300`) van het scherm
        vallen terwijl de klok gewoon aan is.
      mode: single
      triggers:
        - trigger: time_pattern
          seconds: /30
      conditions: []
      actions:
        - action: script.klok_zon_en_accu
          data:
            klokken:
              - clock_2
              - clock_3

    - id: klokken_indicatoren_woonkamer_garage
      alias: Klokken - Indicatoren stroomprijs en bezetting
      description: >-
        De twee stipjes rechts op alle drie de klokken. Boven (1) is de
        stroomprijs van nu, midden (2) de bezetting van de dienstdoende ploeg.
      # HET ID ZEGT WOONKAMER_GARAGE EN DAT KLOPT NIET MEER
      # De keukenklok is er later bij gekomen. Het `id` hernoemen zou een
      # nieuwe automatisering opleveren en de oude als wees achterlaten, dus
      # dat blijft staan; de alias en deze beschrijving zijn wel bijgewerkt.
      #
      # LET OP DE ENTITEITNAAM VAN DE KEUKEN
      # Indicator 1 en 3 van de keukenklok heten `light.awtrix_121d6c_...`,
      # maar indicator 2 heet `light.klok_awtrix_indicator_2`. Daar is ooit een
      # entiteit hernoemd. Wie de lijst hieronder kopieert en het patroon
      # doortrekt, zet dus een stipje aan dat niet bestaat.
      # WAAROM DIT OVER DE LICHT-ENTITEITEN GAAT EN NIET OVER MQTT
      # De AWTRIX-integratie maakt van elke indicator een rgb-lamp. Daarmee
      # weet HA de huidige kleur, blijft `light.turn_off` gewoon uit gaan, en
      # hoeft hier geen tweede plek te bestaan waar topic-namen kloppen moeten.
      #
      # DE STIPJES LIGGEN OP DE MATRIX ZELF EN GAAN OVER DE APP HEEN
      # Opgemeten door ze aan te zetten en /api/screen terug te lezen:
      # indicator 1 pakt (30,0), (31,0) en (31,1), indicator 2 (31,3) en
      # (31,4), indicator 3 (31,6), (30,7) en (31,7). Daarom stopt het label in
      # `script.klok_zon_en_accu` op x=29. Neem je indicator 3 ooit in gebruik,
      # dan raakt de onderste balk (achtertuin) zijn laatste twee pixels kwijt
      # en is een volle balk daar niet meer van 94% te onderscheiden.
      #
      # `brightness` MOET MEE
      # Een `light.turn_on` met alleen `rgb_color` liet het stipje uit: de
      # integratie schaalt de kleur met de helderheid, en die was nog nooit
      # gezet. Met `brightness: 255` erbij gaat hij meteen aan.
      mode: queued
      max: 5
      triggers:
        - trigger: state
          entity_id: sensor.slimhuys_zonneplan_tariefniveau_nu
        # De webhook-sensor verandert vaak alleen van attribuut (de stand van
        # een ploeg zonder statuswissel); een state-trigger zonder `to:` vangt
        # dat mee. De poll-sensoren staan erbij voor als de webhook stilvalt.
        - trigger: state
          entity_id:
            - sensor.brandweer_bezetting
            - sensor.bezetting_ploeg_a
            - sensor.bezetting_ploeg_b
            - sensor.bezetting_ploeg_c
            - input_select.brandweer_dienstdoende_ploeg
        # Een klok komt na een herstart met gedoofde indicatoren terug: die
        # staan, anders dan de apps, niet als retained bericht op de broker.
        # Vandaar deze twee triggers - zonder was het stipje weg tot de prijs
        # of de bezetting toevallig veranderde.
        - trigger: state
          entity_id:
            - light.keuken_klok_awtrix_keuken_matrix
            - light.woonkamer_klok_awtrix_woonkamer_matrix
            - light.garage_klok_awtrix_garage_matrix
          from: unavailable
        - trigger: homeassistant
          event: start
      conditions: []
      actions:
        - alias: Beide kleuren bepalen
          variables:
            # tariefniveau_nu kent ZES niveaus, zie de kop van
            # packages/9 - Other/Stroomprijs.yaml: een test op alleen 'low' of
            # 'high' mist juist het goedkoopste en het duurste uur. Elk niveau
            # krijgt hier zijn eigen kleur, zodat het stipje het verschil
            # tussen "gewoon duur" en "nu echt niet" ook laat zien.
            #
            # `peak` IS ER OP 2026-08-23 BIJ GEKOMEN
            # SlimHuys stuurt sindsdien `peak` in plaats van `very_high` (de
            # `level`-attribuut van sensor.slimhuys_zonneplan_huidige_prijs
            # zegt hetzelfde). Die viel hieronder in de else-tak, dus ging het
            # stipje juist op de duurste uren UIT - precies wanneer je hem
            # nodig hebt. `very_high` blijft staan voor het geval de
            # integratie terugdraait; een niveau te veel kost niets.
            #
            # ELKE ONBEKENDE WAARDE DOOFT HET STIPJE, EN DAT IS HET GEVAAR
            # Er staat geen alarm op: verzint de integratie morgen weer een
            # nieuwe naam, dan is het stipje stil weg en merk je dat pas als je
            # er naar zoekt. Zie ook packages/9 - Other/Battery.yaml, dat op
            # dezelfde lijst niveaus stuurt.
            #
            # LET OP - dit zijn NIET de iOS-systeemkleuren die de apps in dit
            # bestand gebruiken (#0A84FF / #32D74B / #FF9F0A / #FF3B30). Op een
            # scherm klopt #FF3B30 als rood, maar een indicator is een enkele
            # diffuse pixel op vol vermogen, en daar wassen de 59 groen en 48
            # blauw hem zichtbaar uit naar roze. Vandaar hier kleuren met de
            # bijmenging eruit geknepen. Wijzig je ze, kijk dan naar de klok en
            # niet naar de hex.
            prijs_kleur: >-
              {%- set n = states('sensor.slimhuys_zonneplan_tariefniveau_nu') -%}
              {%- if n == 'very_low' -%}[0, 60, 255]
              {%- elif n == 'low' -%}[50, 215, 75]
              {%- elif n == 'medium' -%}[255, 159, 10]
              {%- elif n == 'high' -%}[255, 70, 0]
              {%- elif n in ['very_high', 'peak'] -%}[255, 0, 0]
              {%- else -%}uit{%- endif -%}
            # Zelfde bronvolgorde als de BRW-app op de keukenklok en het
            # dashboard: eerst het `ploegen`-attribuut van de PreCom-webhook,
            # dan pas de 5-minutenpoll. Twee schermen die hetzelfde zouden
            # moeten zeggen en dat niet doen is erger dan een oud getal.
            bezetting_kleur: >-
              {%- set ds = states('input_select.brandweer_dienstdoende_ploeg') -%}
              {%- set letter = (ds[0] | upper) if has_value('input_select.brandweer_dienstdoende_ploeg')
                               else (state_attr('sensor.brandweer_bezetting', 'ploeg') or '') -%}
              {%- set w = (state_attr('sensor.brandweer_bezetting', 'ploegen') or [])
                          | selectattr('ploeg', 'eq', letter) | list -%}
              {%- set poll = 'sensor.bezetting_ploeg_' ~ (letter | lower) -%}
              {%- if w | count > 0 and w[0].aantal is defined -%}
              {%- set n = w[0].aantal | int(-1) -%}
              {%- elif has_value(poll) -%}
              {%- set n = states(poll) | int(-1) -%}
              {%- else -%}
              {%- set n = -1 -%}
              {%- endif -%}
              {#- Onbekend gaat uit en niet op rood: een stipje dat bij elke
                  hapering van de webhook alarm slaat kijk je binnen een week
                  overheen, en dan mis je het wel echte tekort ook. -#}
              {%- if n < 0 -%}uit
              {%- elif n < 4 -%}[255, 59, 48]
              {%- elif n < 6 -%}[255, 159, 10]
              {%- else -%}uit{%- endif -%}
        - alias: Indicator 1 - stroomprijs nu
          if:
            - condition: template
              value_template: "{{ prijs_kleur == 'uit' }}"
          then:
            - action: light.turn_off
              target:
                entity_id:
                  - light.awtrix_121d6c_indicator_1
                  - light.awtrix_9c6510_indicator_1
                  - light.awtrix_9bf654_indicator_1
          else:
            - action: light.turn_on
              target:
                entity_id:
                  - light.awtrix_121d6c_indicator_1
                  - light.awtrix_9c6510_indicator_1
                  - light.awtrix_9bf654_indicator_1
              data:
                brightness: 255
                rgb_color: "{{ prijs_kleur }}"
        - alias: Indicator 2 - bezetting dienstdoende ploeg
          if:
            - condition: template
              value_template: "{{ bezetting_kleur == 'uit' }}"
          then:
            - action: light.turn_off
              target:
                entity_id:
                  - light.klok_awtrix_indicator_2
                  - light.awtrix_9c6510_indicator_2
                  - light.awtrix_9bf654_indicator_2
          else:
            - action: light.turn_on
              target:
                entity_id:
                  - light.klok_awtrix_indicator_2
                  - light.awtrix_9c6510_indicator_2
                  - light.awtrix_9bf654_indicator_2
              data:
                brightness: 255
                rgb_color: "{{ bezetting_kleur }}"

    - id: klokken_scherm_keuken_woonkamer
      alias: Klokken - Scherm keuken en woonkamer aan of uit
      description: >-
        Zet de keuken- en woonkamerklok uit zodra het alarm aan staat, en weer
        aan zodra het alarm eraf gaat of er beneden licht brandt.
      # EEN REGEL, TWEE KLOKKEN: aan = alarm uit OF woonkamerlampen aan.
      #
      # LICHT WINT VAN HET ALARM, EN MET REDEN
      # `armed_home` betekent dat er juist wel iemand thuis is. Ga je 's avonds
      # nog een keer naar beneden en doe je de lamp aan, dan hoort de klok mee
      # aan te gaan - anders sta je in de keuken naar een zwart scherm te kijken
      # terwijl het huis "aan" staat. Bij `armed_away` staat dat licht toch niet
      # aan, dus daar valt niets te winnen.
      #
      # DE GARAGEKLOK VALT HIER BUITEN
      # Die hangt aan beweging (zie de automatisering hieronder) en heeft zijn
      # eigen alarm-check; woonkamerlicht zegt niets over de garage.
      #
      # WAAROM DE LICHT-ENTITEIT EN NIET `clock_x/power`
      # HA kent de stand van de matrix dan zelf. Dat is niet cosmetisch: de
      # app-rotatie van de keukenklok draait op `state: on` van deze entiteit,
      # en een MQTT-publish liet HA daarover in het ongewisse. Het aan- en
      # uitzetten zelf staat in `script.klok_keuken_woonkamer_stand`, zie daar.
      mode: restart
      triggers:
        # `to:` staat er niet voor de sier: Alarmo werkt zijn attribuut
        # `open_sensors` bij elke deur die open of dicht gaat bij, en een
        # state-trigger zonder `to:` vuurt daar ook op.
        - trigger: state
          entity_id: alarm_control_panel.alarmo
          to:
            - disarmed
            - arming
            - armed_home
            - armed_away
            # De drie hieronder worden (nog) niet gebruikt, maar het script
            # rekent ze al correct als "op scherp" - zonder trigger bleven de
            # klokken dan branden tot de eerstvolgende lichtwissel.
            - armed_night
            - armed_vacation
            - armed_custom_bypass
        - trigger: state
          entity_id: light.woonkamer_lampen
          to:
            - "on"
            - "off"
        # Een klok die opnieuw opstart komt terug met de stand die in zijn eigen
        # flash staat, niet met de stand die hier hoort. Deze trigger haalt dat
        # meteen weer recht.
        - trigger: state
          entity_id:
            - light.keuken_klok_awtrix_keuken_matrix
            - light.woonkamer_klok_awtrix_woonkamer_matrix
          from: unavailable
        - trigger: homeassistant
          event: start
      conditions: []
      actions:
        - action: script.klok_keuken_woonkamer_stand

    - id: klokken_garage_matrix_beweging
      alias: Klokken - Garageklok aan bij beweging
      description: >-
        De garage is meestal leeg; daar hoeft geen scherm voor te branden. Bij
        beweging gaat hij aan, twee minuten na de laatste beweging weer uit, en
        zodra het alarm aan staat blijft hij uit.
      # WAAROM NIET DE BEWEGINGSLICHT-BLUEPRINT
      # Die wil een helderheid- en een overgangshelper en brengt deurcontacten,
      # een lux-drempel en het alarm mee. Een display is geen lamp: de
      # helderheid komt uit de klok zelf (`BRI`, en die regelt hij desgewenst
      # op zijn eigen lichtsensor), en een fade bestaat er niet. Wat overblijft
      # is precies wat hieronder staat.
      #
      # DE APPS LOPEN ONDERTUSSEN DOOR
      # Zon en accu worden elke 30 seconden met `retain: true` gepubliceerd, de
      # indicatoren onthoudt de klok zelf over een uit/aan heen (nagegaan via
      # /api/stats). Er staat dus meteen weer iets op het scherm zodra je de
      # garage in loopt, zonder wachten op de volgende cyclus.
      mode: single
      triggers:
        - trigger: state
          entity_id: binary_sensor.pir_group_garage
          to: "on"
          id: beweging
        # Twee minuten, gelijk aan de standaard `uit_na` van de
        # bewegingslicht-blueprint: de garagelampen doven dan ook, en een klok
        # die daarna nog staat te branden in een donkere garage is precies het
        # soort verschil waar je later over struikelt.
        - trigger: state
          entity_id: binary_sensor.pir_group_garage
          to: "off"
          for:
            minutes: 2
          id: stil
        # EEN HERSTART VALT TUSSEN TWEE TRIGGERS IN
        # Beide triggers hierboven vragen om een overgang. Staat de klok aan op
        # het moment dat HA herstart en beweegt er daarna niets meer, dan komt
        # die overgang nooit en brandt hij tot iemand de garage in loopt. Na de
        # herstart van 2026-08-08 stond hij daardoor voor niets aan.
        - trigger: homeassistant
          event: start
          id: herstart
        # Alarm aan = niemand hoort hier te zijn. Anders dan bij de keuken- en
        # woonkamerklok is er geen licht-uitzondering: woonkamerlicht zegt niets
        # over wie er in de garage staat.
        - trigger: state
          entity_id: alarm_control_panel.alarmo
          to:
            - arming
            - armed_home
            - armed_away
            # Zelfde aanvulling als bij de keuken-/woonkamerklok hierboven.
            - armed_night
            - armed_vacation
            - armed_custom_bypass
          id: alarm_aan
      # DE HOOFDSCHAKELAAR STAAT NU PER TAK EN NIET MEER HIER
      # `input_boolean.enable_pir_garage` is dezelfde schakelaar als bij de
      # garagelampen. Uit betekent daar "hier beweegt niets, ook niet bij
      # vertrek"; dan hoort dit scherm ook niet ineens uit zichzelf te doven
      # terwijl je eronder staat te sleutelen. Voor het alarm geldt dat juist
      # niet: staat het huis op scherp, dan gaat dit scherm uit, ook met de
      # schakelaar uit. Daarom is de conditie de takken in gezakt.
      conditions: []
      actions:
        - variables:
            # Andere naam dan de trigger-id hierboven: die twee zeggen niet
            # hetzelfde. De trigger vuurt op het moment dat het alarm aangaat,
            # deze variabele zegt of het nu aan staat - dat laatste is wat de
            # beweging- en herstart-tak nodig hebben.
            huis_op_scherp: >-
              {{ states('alarm_control_panel.alarmo')
                 not in ['disarmed', 'unavailable', 'unknown'] }}
        - choose:
            - alias: Alarm aan - scherm uit
              conditions:
                - condition: trigger
                  id: alarm_aan
              sequence:
                - action: light.turn_off
                  target:
                    entity_id: light.garage_klok_awtrix_garage_matrix
            - alias: Beweging - scherm aan
              conditions:
                - condition: trigger
                  id: beweging
                - condition: state
                  entity_id: input_boolean.enable_pir_garage
                  state: "on"
                - alias: Het huis staat niet op scherp
                  condition: template
                  value_template: "{{ not huis_op_scherp }}"
              sequence:
                # Bewust zonder helderheid: dan houdt de klok de stand die hij
                # zelf had (`BRI`), in plaats van dat dit bestand er een tweede
                # waarheid naast zet.
                - action: light.turn_on
                  target:
                    entity_id: light.garage_klok_awtrix_garage_matrix
            - alias: Twee minuten stil - scherm uit
              conditions:
                - condition: trigger
                  id: stil
                - condition: state
                  entity_id: input_boolean.enable_pir_garage
                  state: "on"
              sequence:
                - action: light.turn_off
                  target:
                    entity_id: light.garage_klok_awtrix_garage_matrix
            # Bewust alleen uitzetten en niet aan: staat de sensor bij het
            # opstarten juist op beweging, dan is de gewone aan-trigger zo weer
            # aan de beurt.
            - alias: Na een herstart de stand inhalen
              conditions:
                - condition: trigger
                  id: herstart
                - condition: or
                  conditions:
                    - alias: Het huis staat op scherp
                      condition: template
                      value_template: "{{ huis_op_scherp }}"
                    - alias: Het is stil en de bewegingsschakelaar staat aan
                      condition: and
                      conditions:
                        - condition: state
                          entity_id: input_boolean.enable_pir_garage
                          state: "on"
                        - condition: state
                          entity_id: binary_sensor.pir_group_garage
                          state: "off"
              sequence:
                - action: light.turn_off
                  target:
                    entity_id: light.garage_klok_awtrix_garage_matrix
