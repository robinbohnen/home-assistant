##############################################################################
## KLIMAATREGIE - laag 5: de airco's
##
## De vier lagen van de zonwering verplaatsen warmte die er al is. Deze laag
## maakt koelte (en warmte): als het huis bewoond is en het is te warm, mag de
## airco aan, en hij mag alvast beginnen als er iemand bijna thuis is.
##
## Zelfde opzet als de zonwering, en met opzet: de beslislogica staat in
## custom_templates/klimaat.jinja (macro `airco_advies`), hier staat alleen het
## meten en het uitvoeren. Dezelfde drempels (`klimaat_kamer_warm`, het regime,
## `group.all_adults`) sturen dus zowel de rolluiken als de airco's - twee
## bronnen voor "het is te warm" is precies hoe die twee uit elkaar gaan lopen.
##
## AAN/UIT: input_boolean.aircoregie_actief. Staat die uit, dan stuurt hier
## niets; de adviessensoren blijven wel rekenen, zodat je op de Klimaat-
## weergave een week kunt meekijken voordat je hem aanzet.
##
## NIET PENDELEN is de hele opgave; de vijf remmen staan uitgelegd bij de
## AIRCO-sectie in custom_templates/klimaat.jinja. Drie ervan staan hieronder
## als timer, en die hebben allemaal `restore: true`: "hij draait nog geen half
## uur" moet een herstart overleven, anders is een reload genoeg om de
## minimumtijden te omzeilen.
##
## Zie docs/klimaatregie.md.
##############################################################################

klimaat_airco_package:

  input_boolean:
    aircoregie_actief:
      name: "Klimaat - Airco's automatisch regelen"
      icon: mdi:air-conditioner
    # Per unit uit te zetten zonder de andere te raken.
    # Uit = de klimaatregie mag deze unit sturen.
    airco_handmatig_woonkamer:
      name: "Airco handmatig - Woonkamer"
      icon: mdi:hand-back-right-outline
    airco_handmatig_zolder:
      name: "Airco handmatig - Boven"
      icon: mdi:hand-back-right-outline
    # Gezet door `klimaat_airco_storing_herkennen` als een unit kort na het
    # aanzetten twee keer vanzelf uitvalt. Zolang deze aan staat, start de
    # regie hem niet meer - zie de toelichting bij die automatisering.
    airco_storing_woonkamer:
      name: "Airco storing - Woonkamer"
      icon: mdi:alert-circle-outline
    airco_storing_zolder:
      name: "Airco storing - Boven"
      icon: mdi:alert-circle-outline

  input_text:
    # De `context.id` van de laatste opdracht die de uitvoerder aan deze unit
    # gaf. Een standswijziging met díe context (of met die als parent, via
    # script_attic_ac_off) is van ons; alles met een andere context is een
    # mens of een andere automatisering, en dat is handbediening. Zie
    # `airco_wissel_herkomst` in klimaat.jinja. Een input_text en geen
    # variabele: de wissel komt binnen in een andere automatisering dan de
    # opdracht, en het moet een herstart overleven.
    airco_regie_context_woonkamer:
      name: "Airco woonkamer - context laatste regie-opdracht"
      icon: mdi:identifier
      max: 64
    airco_regie_context_zolder:
      name: "Airco boven - context laatste regie-opdracht"
      icon: mdi:identifier
      max: 64

  input_number:
    # De ondergrens van de comfortband. `klimaat_kamer_warm` (22°) is de
    # bovengrens en die bestond al; deze hoort erbij en wordt ook door niets
    # anders gebruikt. De cv doet het gewone verwarmen - de airco springt pas
    # bij als een ruimte er echt onder zakt (19 - 1,5 = 17,5°).
    klimaat_kamer_koud:
      name: "Klimaat - Kamer is koud onder"
      icon: mdi:home-thermometer-outline
      min: 10
      max: 24
      step: 0.5
      unit_of_measurement: "°C"
      mode: box
    # De dode zone. Aanzetten bij warm + aan_delta, uitzetten bij
    # warm - uit_delta: met de standaardwaarden dus aan op 23,5° en uit op
    # 21,5°. Die twee graden ertussen zijn wat het pendelen tegenhoudt; maak je
    # ze kleiner, dan gaat hij vaker aan en uit voor minder resultaat.
    klimaat_airco_aan_delta:
      name: "Klimaat - Airco aan vanaf (boven de comfortgrens)"
      icon: mdi:thermometer-plus
      min: 0.5
      max: 5
      step: 0.5
      unit_of_measurement: "°C"
      mode: box
    klimaat_airco_uit_delta:
      name: "Klimaat - Airco uit bij (onder de comfortgrens)"
      icon: mdi:thermometer-minus
      min: 0
      max: 3
      step: 0.5
      unit_of_measurement: "°C"
      mode: box
    # Hoe ver van huis "bijna thuis" is. Een airco heeft twintig minuten nodig
    # om iets te betekenen, dus korter zetten maakt het voorkoelen zinloos;
    # veel langer en je koelt voor iemand die onderweg nog van gedachten
    # verandert.
    klimaat_airco_voorkoelen_min:
      name: "Klimaat - Voorkoelen vanaf reistijd"
      icon: mdi:car-clock
      min: 0
      max: 60
      step: 5
      unit_of_measurement: "min"
      mode: box

    # De kamertemperatuur op het moment dat wij de unit aanzetten. Daar legt
    # `klimaat_airco_voortgang_bewaken` de meting van drie kwartier later naast.
    # Een input_number en geen variabele: dit moet een herstart overleven en het
    # is prettig om op het dashboard te kunnen zien waar hij vandaan kwam.
    airco_start_temp_woonkamer:
      name: "Airco woonkamer - temperatuur bij starten"
      icon: mdi:thermometer-chevron-down
      min: -20
      max: 50
      step: 0.1
      unit_of_measurement: "°C"
      mode: box
    airco_start_temp_zolder:
      name: "Airco boven - temperatuur bij starten"
      icon: mdi:thermometer-chevron-down
      min: -20
      max: 50
      step: 0.1
      unit_of_measurement: "°C"
      mode: box

  timer:
    # REM 2: minimale looptijd. Eenmaal aan blijft hij een half uur aan, ook
    # als de gemeten temperatuur eerder onder het doel duikt. De eerste
    # minuten koelt een airco vooral de thermometer, niet de kamer.
    airco_minimaal_aan_woonkamer:
      name: "Airco woonkamer - minimale looptijd"
      duration: "00:30:00"
      icon: mdi:timer-play-outline
      restore: true
    airco_minimaal_aan_zolder:
      name: "Airco boven - minimale looptijd"
      duration: "00:30:00"
      icon: mdi:timer-play-outline
      restore: true

    # REM 3: minimale rust. Na uitzetten twintig minuten niet opnieuw starten.
    airco_rust_woonkamer:
      name: "Airco woonkamer - rustpauze"
      duration: "00:20:00"
      icon: mdi:timer-pause-outline
      restore: true
    airco_rust_zolder:
      name: "Airco boven - rustpauze"
      duration: "00:20:00"
      icon: mdi:timer-pause-outline
      restore: true

    # Loopt vanaf het moment dat wíj de unit aanzetten. Valt hij binnen dit
    # halfuur vanzelf uit, dan is dat geen toeval maar een storing; zie
    # `klimaat_airco_storing_herkennen`. De zolderunit viel in augustus 2026 na
    # 10-25 minuten uit op foutcode E48. Hier stond een kwartier, en dan viel
    # juist de trage helft van die uitvallers buiten het venster: die telden
    # nergens, en de regie startte hem na elke uitval gewoon opnieuw.
    airco_gestart_woonkamer:
      name: "Airco woonkamer - net gestart"
      duration: "00:30:00"
      icon: mdi:timer-alert-outline
      restore: true
    airco_gestart_zolder:
      name: "Airco boven - net gestart"
      duration: "00:30:00"
      icon: mdi:timer-alert-outline
      restore: true

    # Het voortgangsvenster. Loopt vanaf het aanzetten en wordt bij elke
    # geslaagde controle opnieuw gestart, dus zolang de unit wint blijft hij
    # rollen. Gaat de unit uit, dan zet de uitvoerder hem stil - en een
    # `timer.cancel` vuurt geen `timer.finished`, dus dan controleert er niets.
    airco_voortgang_woonkamer:
      name: "Airco woonkamer - voortgangsvenster"
      duration: "00:45:00"
      icon: mdi:chart-line
      restore: true
    airco_voortgang_zolder:
      name: "Airco boven - voortgangsvenster"
      duration: "00:45:00"
      icon: mdi:chart-line
      restore: true

    # Loopt na een venster zonder voortgang. Zolang deze loopt blijft de unit
    # uit: hij heeft het net drie kwartier geprobeerd en er gebeurde niets, dus
    # meteen opnieuw beginnen levert hetzelfde op. Twee uur, want in die tijd
    # verandert er genoeg (de zon draait van de gevel, een raam gaat dicht) om
    # een tweede poging zinvol te maken.
    airco_kansloos_woonkamer:
      name: "Airco woonkamer - kwam niet vooruit"
      duration: "02:00:00"
      icon: mdi:trending-neutral
      restore: true
    airco_kansloos_zolder:
      name: "Airco boven - kwam niet vooruit"
      duration: "02:00:00"
      icon: mdi:trending-neutral
      restore: true

    # Handbediening, precies zoals timer.override_<zone> bij de zonwering: zet
    # iemand de airco zelf aan of uit, dan blijft de regie er een paar uur van
    # af. Duur komt uit input_number.klimaat_override_uren.
    airco_override_woonkamer:
      name: "Handbediening Airco woonkamer"
      duration: "04:00:00"
      icon: mdi:hand-back-right
      restore: true
    airco_override_zolder:
      name: "Handbediening Airco boven"
      duration: "04:00:00"
      icon: mdi:hand-back-right
      restore: true

  counter:
    # Hoe vaak een unit vandaag kort na het aanzetten vanzelf uitviel. Bij twee
    # gaat de storingsvlag om. Wordt elke nacht om 04:00 op nul gezet, zodat
    # een eenmalige hik het niet permanent blokkeert en een echte storing
    # zichzelf de volgende dag weer meldt.
    airco_storingen_woonkamer:
      name: "Airco woonkamer - afgebroken starts"
      icon: mdi:alert-circle-check-outline
      initial: 0
      step: 1
      maximum: 99
    airco_storingen_zolder:
      name: "Airco boven - afgebroken starts"
      icon: mdi:alert-circle-check-outline
      initial: 0
      step: 1
      maximum: 99

  ###########################################################################
  ## Het advies per unit
  ##
  ## Eén trigger-blok voor beide units, om dezelfde reden als bij de zonwering:
  ## state en attributen worden ieder apart gerenderd, dus met de macro-aanroep
  ## in elk template zou `airco_advies()` acht keer per unit draaien in plaats
  ## van één keer.
  ##
  ## De STATE is de modus (cool/heat/off/rust). Dat is bewust: de uitvoerder
  ## triggert dan alleen als het advies echt verschuift, en niet bij elke
  ## tiende graad in `reden`. (De handbediening-herkenning keek hier vroeger
  ## ook naar; die let nu op de context van de wissel - zie laag 5b.)
  ###########################################################################
  template:
    - trigger:
        # De knoppen en schuifjes van de aircoregie zelf.
        - trigger: state
          entity_id:
            - input_boolean.aircoregie_actief
            - input_boolean.airco_handmatig_woonkamer
            - input_boolean.airco_handmatig_zolder
            - input_boolean.airco_storing_woonkamer
            - input_boolean.airco_storing_zolder
            - input_number.klimaat_kamer_warm
            - input_number.klimaat_kamer_koud
            - input_number.klimaat_airco_aan_delta
            - input_number.klimaat_airco_uit_delta
            - input_number.klimaat_airco_voorkoelen_min
            - input_select.klimaat_regime
        # De timers die de remmen vormen. Loopt er een af, dan hoort het advies
        # dat meteen te weten en niet pas bij de volgende minuuttik.
        - trigger: state
          entity_id:
            - timer.airco_minimaal_aan_woonkamer
            - timer.airco_minimaal_aan_zolder
            - timer.airco_rust_woonkamer
            - timer.airco_rust_zolder
            - timer.airco_override_woonkamer
            - timer.airco_override_zolder
            - timer.airco_kansloos_woonkamer
            - timer.airco_kansloos_zolder
        # De units zelf: hun stand bepaalt of "doorkoelen" of "aanzetten" het
        # advies is.
        - trigger: state
          entity_id:
            - climate.airco_woonkamer
            - climate.airco_zolder
        # Een raam dat opengaat hoort de airco meteen uit te zetten, niet over
        # een minuut. Dit is dezelfde lijst als in `AIRCOS` in klimaat.jinja.
        - trigger: state
          entity_id: &airco_ramen
            - binary_sensor.keuken_raam_groot_contact
            - binary_sensor.keuken_raam_klein_contact
            - binary_sensor.woonkamer_woonkamer_openslaande_deuren_deur
            - binary_sensor.woonkamer_achterdeur_contact
            - binary_sensor.speelkamer_openslaande_deuren_contact
            - binary_sensor.badkamer_raam_contact
            - binary_sensor.kantoor_raam_links_contact
            - binary_sensor.kantoor_raam_rechts_contact
            - binary_sensor.slaapkamer_raam_links_contact
            - binary_sensor.slaapkamer_raam_rechts_contact
            - binary_sensor.slaapkamer_mini_raam_contact
            - binary_sensor.slaapkamer_mini_dakraam_contact
            - binary_sensor.slaapkamer_maxi_raam_links_contact
            - binary_sensor.slaapkamer_maxi_raam_rechts_contact
        # Wie er thuis is, en wie er aankomt.
        - trigger: state
          entity_id:
            - group.all_adults
            - person.robin_bohnen
            - person.samantha_henkelman
        # Vangnet voor de rest: kamertemperaturen en de reistijdsensoren. Die
        # kruipen, dus een minuut achterstand is er geen.
        - trigger: time_pattern
          minutes: "/1"
        - trigger: homeassistant
          event: start

      action:
        - variables:
            adviezen: >-
              {% from 'klimaat.jinja' import airco_advies, airco_lijst %}
              {%- set ns = namespace(delen=[]) -%}
              {%- for u in airco_lijst() | from_json -%}
                {%- set ns.delen = ns.delen + [(u | to_json) ~ ':' ~ (airco_advies(u) | trim)] -%}
              {%- endfor -%}
              {{ ('{' ~ ns.delen | join(',') ~ '}') | from_json }}

      sensor:
        - name: "Airco advies woonkamer"
          unique_id: airco_advies_woonkamer
          icon: mdi:air-conditioner
          state: "{{ adviezen.woonkamer.modus }}"
          attributes:
            doel: "{{ adviezen.woonkamer.doel }}"
            fan: "{{ adviezen.woonkamer.fan }}"
            uitvoeren: "{{ adviezen.woonkamer.uitvoeren }}"
            spoed: "{{ adviezen.woonkamer.spoed }}"
            reden: "{{ adviezen.woonkamer.reden }}"
            blokkade: "{{ adviezen.woonkamer.blokkade }}"
            naam: "{{ adviezen.woonkamer.naam }}"
            entiteit: "{{ adviezen.woonkamer.entiteit }}"
            temp: "{{ adviezen.woonkamer.temp }}"
            voortgang_min: "{{ adviezen.woonkamer.voortgang_min }}"
            uit_script: "{{ adviezen.woonkamer.uit_script }}"
            rustpauze_min: "{{ adviezen.woonkamer.rustpauze_min }}"

        - name: "Airco advies zolder"
          unique_id: airco_advies_zolder
          icon: mdi:air-conditioner
          state: "{{ adviezen.zolder.modus }}"
          attributes:
            doel: "{{ adviezen.zolder.doel }}"
            fan: "{{ adviezen.zolder.fan }}"
            uitvoeren: "{{ adviezen.zolder.uitvoeren }}"
            spoed: "{{ adviezen.zolder.spoed }}"
            reden: "{{ adviezen.zolder.reden }}"
            blokkade: "{{ adviezen.zolder.blokkade }}"
            naam: "{{ adviezen.zolder.naam }}"
            entiteit: "{{ adviezen.zolder.entiteit }}"
            temp: "{{ adviezen.zolder.temp }}"
            voortgang_min: "{{ adviezen.zolder.voortgang_min }}"
            uit_script: "{{ adviezen.zolder.uit_script }}"
            rustpauze_min: "{{ adviezen.zolder.rustpauze_min }}"

  automation:
    ###########################################################################
    ## Laag 5a - het advies uitvoeren
    ##
    ## Draait op vijf minuten en niet op elke wijziging: een airco is geen
    ## lamp. Elke opdracht draagt de context van deze run, en die schrijft hij
    ## eerst weg in `input_text.airco_regie_context_<unit>`: zo herkent laag 5b
    ## zijn wissels als "van ons" en alle andere als handbediening.
    ###########################################################################
    - id: klimaat_airco_uitvoeren
      alias: Klimaat - Airco's uitvoeren
      description: >-
        Zet de airco's aan en uit volgens het advies, met minimale looptijd,
        rustpauze en een setpoint dat maar één keer meegaat.
      mode: queued
      max: 3
      max_exceeded: silent
      triggers:
        # De state van deze sensoren ís de modus, dus dit vuurt alleen als het
        # advies echt verschuift en niet bij elke tiende graad in `reden`.
        - trigger: state
          entity_id: &airco_advies_sensoren
            - sensor.airco_advies_woonkamer
            - sensor.airco_advies_zolder
        - trigger: state
          entity_id: *airco_advies_sensoren
          attribute: uitvoeren
        # Vangnet. Op seconde 30, net als bij de zonwering: de adviessensoren
        # rekenen op de minuutgrens, en er bovenop tikken zou het advies van de
        # vorige minuut lezen.
        - trigger: time_pattern
          minutes: "/5"
          seconds: 30
        - trigger: homeassistant
          event: start
      conditions:
        - condition: state
          entity_id: input_boolean.aircoregie_actief
          state: "on"
      variables:
        # Na een herstart heeft élke entiteit een verse `last_changed` en zou
        # de rustpauze hieronder alles tien minuten stilzetten terwijl er juist
        # bijgestuurd moet worden.
        herstart: >-
          {{ trigger is defined
             and (trigger.platform | default('')) == 'homeassistant' }}
      actions:
        # Direct bij het opstarten staat op de adviessensoren nog het advies
        # van vóór de herstart (trigger-sensoren worden hersteld), en dat mag
        # juist hier de rustpauze overslaan. Eerst laten doorrekenen: de
        # sensoren rekenen zelf bij het opstarten en daarna elke minuut, en de
        # units zijn dan ook weer bereikbaar.
        - if:
            - condition: template
              value_template: "{{ herstart }}"
          then:
            - delay: "00:01:30"
        - repeat:
            for_each: >-
              {% from 'klimaat.jinja' import airco_lijst %}
              {{ airco_lijst() | from_json }}
            sequence:
              - variables:
                  advies_sensor: "sensor.airco_advies_{{ repeat.item }}"
              - variables:
                  modus: "{{ states(advies_sensor) }}"
                  entiteit: "{{ state_attr(advies_sensor, 'entiteit') }}"
                  doel: "{{ state_attr(advies_sensor, 'doel') | float(0) }}"
                  fan: "{{ state_attr(advies_sensor, 'fan') }}"
                  mag: "{{ state_attr(advies_sensor, 'uitvoeren') in [true, 'True', 'true'] }}"
                  # Raam open, leeg huis of storing: dat mag niet op de
                  # rustpauze wachten.
                  spoed: "{{ state_attr(advies_sensor, 'spoed') in [true, 'True', 'true'] }}"
                  uit_script: "{{ state_attr(advies_sensor, 'uit_script') }}"
                  temp_sensor: "{{ state_attr(advies_sensor, 'temp') }}"
                  pauze_min: "{{ state_attr(advies_sensor, 'rustpauze_min') | int(10) }}"
              - variables:
                  huidig: "{{ states(entiteit) }}"
                  # Staat er al een startpoging open? Dan niet opnieuw
                  # commanderen. Zonder deze rem herstart elke ronde de
                  # `gestart`-timer en vuurt `timer.finished` dus nooit -
                  # waarmee een unit die het commando simpelweg negeert (hij
                  # blijft `off`, er is geen overgang om op te tellen) elke vijf
                  # minuten opnieuw geprobeerd zou worden, voor altijd.
                  gestart_bezig: >-
                    {{ is_state('timer.airco_gestart_' ~ repeat.item, 'active') }}
                  # REM 4 - de uitvoerder blijft van een unit af in de minuten
                  # na zijn laatste standswijziging.
                  #
                  # Dit remt ons eigen heen-en-weer, en het vangt een unit op
                  # die zijn stand via de cloud traag terugmeldt. De
                  # handbediening hangt hier niet meer aan: die herkent een
                  # wissel aan zijn context, meteen (laag 5b).
                  mag_nu: >-
                    {% set c = states[entiteit]
                       if entiteit is string and '.' in entiteit else none %}
                    {{ spoed or herstart or c is none
                       or (now() - c.last_changed).total_seconds() >= pauze_min * 60 }}
              - choose:
                  # UIT
                  - conditions:
                      - condition: template
                        value_template: >-
                          {{ mag and mag_nu and modus == 'off'
                             and huidig not in ['off', 'unknown', 'unavailable'] }}
                    sequence:
                      # EERST de timers, dan pas het commando. Andersom is er
                      # een race: de unit meldt `off` terug voordat de
                      # `timer.cancel` hieronder heeft gedraaid, en dan telt
                      # `klimaat_airco_storing_herkennen` onze eigen nette
                      # uitschakeling als een afgebroken start.
                      - action: timer.cancel
                        target:
                          entity_id:
                            - "timer.airco_minimaal_aan_{{ repeat.item }}"
                            - "timer.airco_gestart_{{ repeat.item }}"
                            - "timer.airco_voortgang_{{ repeat.item }}"
                      - action: timer.start
                        target:
                          entity_id: "timer.airco_rust_{{ repeat.item }}"
                      # Onze handtekening, vóór het commando: de wissel die
                      # hierop volgt draagt deze context, en zo weet laag 5b
                      # dat dit geen handbediening is.
                      - action: input_text.set_value
                        target:
                          entity_id: "input_text.airco_regie_context_{{ repeat.item }}"
                        data:
                          value: "{{ context.id }}"
                      # De zolderunit is regelmatig onbereikbaar en een kale
                      # turn_off faalt dan stil; script_attic_ac_off blijft het
                      # proberen en meldt het als het echt niet lukt.
                      - if:
                          - condition: template
                            value_template: "{{ uit_script not in [none, 'None', ''] }}"
                        then:
                          - action: script.turn_on
                            target:
                              entity_id: "{{ uit_script }}"
                        else:
                          - action: climate.turn_off
                            target:
                              entity_id: "{{ entiteit }}"
                            continue_on_error: true

                  # AAN (koelen of verwarmen)
                  - conditions:
                      - condition: template
                        value_template: >-
                          {{ mag and mag_nu and modus in ['cool', 'heat']
                             and huidig != modus
                             and huidig not in ['unknown', 'unavailable']
                             and not gestart_bezig }}
                    # `unknown`/`unavailable` hierboven: `huidig != modus` is
                    # dan ook waar, en dan zette deze tak de rustpauze stil,
                    # overschreef hij de starttemperatuur en startte hij de
                    # timers voor commando's die nergens aankwamen. Komt de
                    # unit terug, dan beslist de volgende ronde gewoon opnieuw.
                    sequence:
                      # Ook hier de timers eerst, en om dezelfde reden andersom:
                      # een unit die het commando weigert meldt soms binnen een
                      # seconde weer `off` (HA schrijft optimistisch `cool`, de
                      # Intesis-cloud zegt daarna `off`). Loopt `gestart` dan nog
                      # niet, dan telt die geweigerde start nergens.
                      - action: timer.cancel
                        target:
                          entity_id: "timer.airco_rust_{{ repeat.item }}"
                      - action: timer.start
                        target:
                          entity_id:
                            - "timer.airco_minimaal_aan_{{ repeat.item }}"
                            - "timer.airco_gestart_{{ repeat.item }}"
                      # Vastleggen waar we vandaan komen. Drie kwartier later
                      # legt `klimaat_airco_voortgang_bewaken` de meting hier
                      # naast; is er niets gebeurd, dan draait de unit ergens
                      # tegenop en heeft doorgaan geen zin. Zonder meting geen
                      # venster: `float(0)` schreef hier 0° weg, en dan leek
                      # elke koelende unit drie kwartier later kansloos.
                      - if:
                          - condition: template
                            value_template: "{{ is_number(states(temp_sensor)) }}"
                        then:
                          - action: input_number.set_value
                            target:
                              entity_id: "input_number.airco_start_temp_{{ repeat.item }}"
                            data:
                              value: "{{ states(temp_sensor) | float | round(1) }}"
                            continue_on_error: true
                          - action: timer.start
                            target:
                              entity_id: "timer.airco_voortgang_{{ repeat.item }}"
                      # Onze handtekening, vóór het commando - zie de UIT-tak.
                      - action: input_text.set_value
                        target:
                          entity_id: "input_text.airco_regie_context_{{ repeat.item }}"
                        data:
                          value: "{{ context.id }}"
                      # Modus en setpoint in één call, en daarna niet meer
                      # aangeraakt: de inverter moduleert zelf. Elke ronde een
                      # nieuw streefgetal sturen is hoe je een warmtepomp aan
                      # het stuiteren krijgt.
                      - action: climate.set_temperature
                        target:
                          entity_id: "{{ entiteit }}"
                        data:
                          hvac_mode: "{{ modus }}"
                          temperature: "{{ doel }}"
                        continue_on_error: true
                      - action: climate.set_fan_mode
                        target:
                          entity_id: "{{ entiteit }}"
                        data:
                          fan_mode: "{{ fan }}"
                        continue_on_error: true

    ###########################################################################
    ## Laag 5b - handbediening herkennen
    ##
    ## Elke standswijziging die niet van de uitvoerder komt, is handbediening:
    ## een mens (knop, app, afstandsbediening) of een ándere automatisering (de
    ## "naar bed"-knop, `ac_off_evening`). Die unit wordt dan met rust gelaten
    ## zolang `klimaat_override_uren` duurt - in beide richtingen: met de hand
    ## uit blijft uit, met de hand aan blijft aan.
    ##
    ## Herkend aan de CONTEXT van de wissel, niet meer aan het advies. Hier
    ## stond "staat hij vijf minuten anders dan het advies?", en dat kon niet
    ## werken: het advies rekent met de stand van de unit zelf, dus zet iemand
    ## hem uit, dan draait het advies in dezelfde seconde mee naar 'off'. Geen
    ## verschil, geen override, en tien minuten later zette de uitvoerder hem
    ## weer aan (naar bed om 21:45, airco weer aan om 21:55). Andersom gaf een
    ## met de hand aangezette unit onder de aanzetgrens het advies 'rust', dat
    ## telde niet mee, en dan zette de regie hem uit. De uitvoerder schrijft nu
    ## zijn `context.id` in `input_text.airco_regie_context_<unit>` voordat hij
    ## iets stuurt; zie `airco_wissel_herkomst` in klimaat.jinja voor de rest.
    ##
    ## Geen `for` meer: de context staat op de wissel zelf, er valt niets af te
    ## wachten. Dat `gestart` hieronder op het moment van de wissel wordt
    ## gelezen, en niet op een later moment, is wat een E48-uitval hier buiten
    ## houdt - die telt bij 5c, niet als handbediening.
    ###########################################################################
    - id: klimaat_airco_handbediening_herkennen
      alias: Klimaat - Airco handbediening herkennen
      description: Laat een unit met rust nadat iemand hem zelf heeft gezet
      mode: queued
      max: 6
      max_exceeded: silent
      triggers:
        # `not_from`/`not_to` in plaats van een kale state-trigger: zonder
        # een van die twee vuurt hij ook op elke attribuutwijziging (de
        # kamertemperatuur van de unit zelf), en dan draagt de "wissel" de
        # context van een cloud-poll.
        - trigger: state
          entity_id: &beheerde_aircos
            - climate.airco_woonkamer
            - climate.airco_zolder
          not_from: &niet_beschikbaar
            - unknown
            - unavailable
          not_to: *niet_beschikbaar
      conditions:
        - condition: state
          entity_id: input_boolean.aircoregie_actief
          state: "on"
      actions:
        - variables:
            unit: >-
              {% from 'klimaat.jinja' import airco_van_entiteit %}
              {{ airco_van_entiteit(trigger.entity_id) | trim }}
        - condition: template
          value_template: "{{ unit != '' }}"
        - variables:
            override_timer: "timer.airco_override_{{ unit }}"
            # Liep `gestart` op het moment van de wissel? Ofwel hij loopt nog,
            # ofwel hij is ná de wissel stilgezet - door laag 5c, die precies
            # deze uitval telt en de timer dan meteen annuleert.
            gestart: >-
              {% set g = states['timer.airco_gestart_' ~ unit] %}
              {{ g is not none and (g.state == 'active'
                 or g.last_changed >= trigger.to_state.last_changed) }}
        - variables:
            herkomst: >-
              {% from 'klimaat.jinja' import airco_wissel_herkomst %}
              {{ airco_wissel_herkomst(trigger.from_state.state,
                   trigger.to_state.state,
                   trigger.to_state.context.id,
                   trigger.to_state.context.parent_id,
                   trigger.to_state.context.user_id,
                   states('input_text.airco_regie_context_' ~ unit),
                   gestart) | trim }}
        - condition: template
          value_template: "{{ herkomst == 'hand' }}"
        # Uit in een leeg huis is geen keuze om te respecteren: het advies
        # zegt dan zelf al 'off' (spoed), en een override zou alleen het
        # voorkoelen blokkeren als er vier uur lang iemand thuiskomt. Dit is
        # `ac_off_nobody_home`, en die hoort de regie niet stil te zetten.
        - condition: template
          alias: Niet de uitschakeling bij vertrek
          value_template: >-
            {{ not (trigger.to_state.state == 'off'
                    and is_state('group.all_adults', 'not_home')) }}
        - action: timer.start
          target:
            entity_id: "{{ override_timer }}"
          data:
            duration: >-
              {{ (states('input_number.klimaat_override_uren') | float(4) * 3600) | int }}
        - action: logbook.log
          data:
            name: Aircoregie
            message: >-
              {{ unit }}: {{ trigger.from_state.state }} -> {{ trigger.to_state.state }}
              niet door de regie ({{ 'door een gebruiker in Home Assistant'
                if trigger.to_state.context.user_id
                else ('door een automatisering'
                      if trigger.to_state.context.parent_id
                      else 'afstandsbediening, app of een tijdgestuurde automatisering') }}),
              handbediening voor
              {{ states('input_number.klimaat_override_uren') | float(4) | round(1) }} uur.

    ###########################################################################
    ## Laag 5c - een unit die zichzelf uitschakelt
    ##
    ## Op 19 augustus 2026 viel de zolderairco tien tot vijfentwintig minuten
    ## na het aanzetten steeds vanzelf uit, op foutcode E48 (de buitenventilator
    ## draaide niet). Handmatig is dat vervelend; automatisch is het schadelijk,
    ## want dan blijft het huis het de hele dag opnieuw proberen terwijl de
    ## compressor elke keer op zijn beveiliging klapt.
    ##
    ## Valt een unit binnen een halfuur na ONZE start vanzelf uit, dan telt dat
    ## hier. Bij de tweede keer op een dag gaat de storingsvlag om en start de
    ## regie hem niet meer. Met de hand aanzetten kan altijd nog.
    ##
    ## Na elke uitval gaat ook de rustpauze lopen, net als wanneer de uitvoerder
    ## hem zelf uitzet. Die startte alleen in de UIT-tak van de uitvoerder, dus
    ## een unit die zelf uitviel was voor de regie meteen weer startklaar: de
    ## eerstvolgende ronde zette hem opnieuw aan, en een unit die om de paar
    ## minuten klapt kwam zo niet eens aan de twee getelde starts toe.
    ##
    ## Wat hier telt beslist `airco_wissel_herkomst` in klimaat.jinja, dezelfde
    ## macro als laag 5b: zo kan één wissel nooit tegelijk storing én
    ## handbediening zijn. Een uitschakeling met een user_id of parent_id kwam
    ## via Home Assistant (de "naar bed"-knop, `ac_off_nobody_home`) en telt
    ## dus NIET als storing - dat telde vroeger wel, en dan ging na twee keer
    ## naar bed binnen het halfuur de storingsvlag om.
    ##
    ## LET OP wat dit niet kan zien: een lege context in het logboek betekent
    ## "niet via Home Assistant", niet "het apparaat deed het zelf". De
    ## fabrikant-app en de afstandsbediening komen net zo binnen. Vandaar dat de
    ## melding vraagt om te kijken en niets als bewezen presenteert.
    ###########################################################################
    - id: klimaat_airco_storing_herkennen
      alias: Klimaat - Airco valt vanzelf uit
      description: >-
        Telt hoe vaak een unit een start niet volhoudt en blokkeert automatisch
        starten na de tweede keer op een dag.
      mode: queued
      max: 6
      max_exceeded: silent
      triggers:
        # Hij ging aan en viel binnen het halfuur weer uit.
        - trigger: state
          entity_id: *beheerde_aircos
          to: "off"
          id: uitgevallen
        # Of hij kwam helemaal niet op gang. Zonder deze tweede trigger blijft
        # een unit die het commando gewoon negeert (of hem optimistisch aanneemt
        # en meteen terugvalt) elke vijf minuten opnieuw geprobeerd worden: er
        # is dan namelijk nooit een overgang naar `off` om op te tellen.
        # `timer.finished` vuurt niet bij een `timer.cancel`, dus onze eigen
        # nette uitschakeling komt hier niet langs.
        - trigger: event
          event_type: timer.finished
          id: nooit_gestart
      conditions:
        - condition: state
          entity_id: input_boolean.aircoregie_actief
          state: "on"
      actions:
        - variables:
            unit: >-
              {% if trigger.id == 'uitgevallen' %}
                {% from 'klimaat.jinja' import airco_van_entiteit %}
                {{ airco_van_entiteit(trigger.entity_id) | trim }}
              {% else %}
                {% set e = trigger.event.data.entity_id | default('') %}
                {{ e | replace('timer.airco_gestart_', '')
                   if e.startswith('timer.airco_gestart_') else '' }}
              {% endif %}
        - condition: template
          value_template: "{{ unit != '' }}"
        - variables:
            gestart_timer: "timer.airco_gestart_{{ unit }}"
            teller: "counter.airco_storingen_{{ unit }}"
            vlag: "input_boolean.airco_storing_{{ unit }}"
            entiteit: "{{ state_attr('sensor.airco_advies_' ~ unit, 'entiteit') }}"
        - condition: template
          alias: Is dit echt een mislukte start?
          value_template: >-
            {% if trigger.id == 'uitgevallen' %}
              {# Alleen tellen als wij hem net hebben aangezet en hij niet via
                 Home Assistant uitging. Ging hij uit omdat het advies dat
                 wilde, dan heeft de uitvoerder deze timer al stilgezet (en
                 draagt de wissel onze eigen context). Een flank uit
                 unknown/unavailable is een hik in de cloud, geen storing. #}
              {% from 'klimaat.jinja' import airco_wissel_herkomst %}
              {% set g = states[gestart_timer] %}
              {% set gestart = g is not none and (g.state == 'active'
                   or g.last_changed >= trigger.to_state.last_changed) %}
              {{ trigger.from_state is not none
                 and trigger.from_state.state != 'off'
                 and (airco_wissel_herkomst(trigger.from_state.state,
                       trigger.to_state.state,
                       trigger.to_state.context.id,
                       trigger.to_state.context.parent_id,
                       trigger.to_state.context.user_id,
                       states('input_text.airco_regie_context_' ~ unit),
                       gestart) | trim) == 'storing' }}
            {% else %}
              {# Halfuur om en hij staat nog steeds uit: hij is nooit
                 aangeslagen. Staat hij te draaien, dan is er niets aan de hand. #}
              {{ is_state(entiteit, 'off') }}
            {% endif %}
        # Vooraf lezen en zelf optellen, in plaats van na `counter.increment`
        # opnieuw de state uitlezen: dan hangt de melding niet aan de vraag of
        # de state al is bijgewerkt op het moment dat de volgende stap draait.
        - variables:
            nieuw_aantal: "{{ (states(teller) | int(0)) + 1 }}"
        - action: counter.increment
          target:
            entity_id: "{{ teller }}"
        # Zelfde opruiming als de UIT-tak van de uitvoerder: de unit staat uit,
        # dus looptijd en voortgangsvenster zeggen niets meer, en de rustpauze
        # houdt de volgende poging twintig minuten tegen.
        - action: timer.cancel
          target:
            entity_id:
              - "{{ gestart_timer }}"
              - "timer.airco_minimaal_aan_{{ unit }}"
              - "timer.airco_voortgang_{{ unit }}"
        - action: timer.start
          target:
            entity_id: "timer.airco_rust_{{ unit }}"
        - if:
            - condition: template
              value_template: "{{ nieuw_aantal | int(0) >= 2 }}"
          then:
            - action: input_boolean.turn_on
              target:
                entity_id: "{{ vlag }}"
            - action: notify.mobile_devices_adults
              data:
                title: >-
                  {{ state_attr('sensor.airco_advies_' ~ unit, 'naam')
                     | default('Airco', true) }} houdt het niet vol
                message: >-
                  Twee starts op rij mislukt vandaag
                  ({{ 'viel binnen een halfuur weer uit'
                      if trigger.id == 'uitgevallen'
                      else 'sloeg helemaal niet aan' }}).
                  Automatisch starten staat nu uit tot vannacht 04:00; met de
                  hand aanzetten kan gewoon. Kijk even in de app of er een
                  foutcode staat - bij de zolderunit was dat in augustus 2026
                  E48, een buitenventilator die niet draaide.
          else:
            - action: logbook.log
              data:
                name: Aircoregie
                message: >-
                  {{ unit }}: start mislukt ({{ nieuw_aantal }}e keer vandaag,
                  bij twee gaat automatisch starten uit).

    ###########################################################################
    ## Laag 5d - komt hij eigenlijk wel vooruit?
    ##
    ## Een doel dat niet gehaald wordt is geen fout van de regeling: op een
    ## hete dag is "zo koel mogelijk" het beste antwoord dat er is, en dan hoort
    ## een airco te blijven draaien. Maar zonder controle lijkt dat precies op
    ## de gevallen waarin doordraaien niets oplevert:
    ##
    ##   - een raam of deur open in een ruimte zonder contact;
    ##   - een unit die het niet meer doet (de zolderunit stond op 20 augustus
    ##     2026 vier uur op 18°/high terwijl het gemiddelde boven van 22,4 naar
    ##     22,2 ging en twee kamers wármer werden - acht ramen stonden open);
    ##   - een doel dat op deze sensor gewoon niet te halen is.
    ##
    ## Vandaar deze meting in plaats van een aanname. Elke 45 minuten: is het
    ## minstens AIRCO_VOORTGANG_MIN opgeschoven? Zo ja, venster resetten en
    ## doorgaan. Zo nee, twee uur stoppen en de gemeten cijfers melden - dan kan
    ## een mens bepalen of het aan een raam ligt of aan de grens.
    ##
    ## Vlak bij het doel wordt er niet geoordeeld. Een kamer van 21,7° met een
    ## doel van 21,5° kán geen 0,3° meer zakken, en een unit die op zijn eigen
    ## thermometer het setpoint al heeft gehaald moduleert terug; dat is geen
    ## "komt niet vooruit" maar "is er zo goed als". Dan begint het venster
    ## gewoon opnieuw. Zie `airco_voortgang_oordeel` in klimaat.jinja.
    ##
    ## Het is bewust GEEN storingsvlag: dit zegt niets over het apparaat. De
    ## unit doet het waarschijnlijk prima en vecht tegen iets anders.
    ##
    ## Na een herstart: een venster dat afliep terwijl Home Assistant uit
    ## stond, vuurt zijn `timer.finished` bij het opstarten, vóórdat deze
    ## automatisering luistert. Die controle is dan weg en het venster staat
    ## stil - zie `klimaat_airco_na_herstart` hieronder, die hem weer start.
    ###########################################################################
    - id: klimaat_airco_voortgang_bewaken
      alias: Klimaat - Airco komt niet vooruit
      description: >-
        Meet elke drie kwartier of een draaiende airco echt iets opschuift en
        zet hem anders een paar uur stil, met de cijfers erbij.
      mode: queued
      max: 6
      max_exceeded: silent
      triggers:
        - trigger: event
          event_type: timer.finished
      conditions:
        - condition: state
          entity_id: input_boolean.aircoregie_actief
          state: "on"
      actions:
        - variables:
            unit: >-
              {% set e = trigger.event.data.entity_id | default('') %}
              {{ e | replace('timer.airco_voortgang_', '')
                 if e.startswith('timer.airco_voortgang_') else '' }}
        - condition: template
          value_template: "{{ unit != '' }}"
        - variables:
            advies_sensor: "sensor.airco_advies_{{ unit }}"
        - variables:
            entiteit: "{{ state_attr(advies_sensor, 'entiteit') }}"
            temp_sensor: "{{ state_attr(advies_sensor, 'temp') }}"
            drempel: "{{ state_attr(advies_sensor, 'voortgang_min') | float(0.3) }}"
            naam: "{{ state_attr(advies_sensor, 'naam') | default('Airco', true) }}"
            start_helper: "input_number.airco_start_temp_{{ unit }}"
        - variables:
            stand: "{{ states(entiteit) }}"
            nu_temp: "{{ states(temp_sensor) | float('onbekend') }}"
            start_temp: "{{ states(start_helper) | float('onbekend') }}"
        - condition: template
          alias: Draait hij nog, en hebben we twee bruikbare metingen?
          value_template: >-
            {{ stand in ['cool', 'heat']
               and nu_temp not in ['onbekend', 'unknown']
               and start_temp not in ['onbekend', 'unknown'] }}
        - variables:
            # Koelen wint als het kouder wordt, verwarmen als het warmer wordt.
            # Eén getal, zodat de rest van deze automatisering niet meer hoeft
            # te weten welke kant op hij aan het werk was.
            vooruit: >-
              {{ ((start_temp | float(0)) - (nu_temp | float(0)))
                 if stand == 'cool'
                 else ((nu_temp | float(0)) - (start_temp | float(0))) }}
            # Het setpoint op de unit is het doel dat de uitvoerder meestuurde
            # (en dat daarna niet meer wordt bijgesteld). Het advies-attribuut
            # `doel` is het niet: dat staat tijdens het verwarmen gewoon op het
            # koeldoel, omdat het advies dan 'rust' is.
            oordeel: >-
              {% from 'klimaat.jinja' import airco_voortgang_oordeel %}
              {{ airco_voortgang_oordeel(stand, start_temp, nu_temp,
                   state_attr(entiteit, 'temperature'),
                   state_attr(entiteit, 'current_temperature'),
                   drempel) | trim }}
        - choose:
            # Hij wint, of hij is er zo goed als. Venster opnieuw beginnen vanaf
            # de huidige stand, zodat de volgende controle over de vólgende drie
            # kwartier gaat en niet over de hele run - anders blijft een unit
            # die alleen in het eerste half uur iets deed de rest van de dag
            # "in orde".
            - conditions:
                - condition: template
                  value_template: "{{ oordeel in ['vooruit', 'bij_doel'] }}"
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: "{{ start_helper }}"
                  data:
                    value: "{{ nu_temp | float(0) | round(1) }}"
                - action: timer.start
                  target:
                    entity_id: "timer.airco_voortgang_{{ unit }}"
          default:
            - action: timer.start
              target:
                entity_id: "timer.airco_kansloos_{{ unit }}"
            - action: logbook.log
              data:
                name: Aircoregie
                message: >-
                  {{ unit }}: drie kwartier {{ 'gekoeld' if stand == 'cool'
                  else 'verwarmd' }} zonder resultaat
                  ({{ start_temp }}° -> {{ nu_temp }}°), twee uur gepauzeerd.
            - action: notify.mobile_devices_adults
              data:
                title: "{{ naam }} komt niet vooruit"
                message: >-
                  Drie kwartier {{ 'koelen' if stand == 'cool' else 'verwarmen' }}
                  bracht {{ start_temp }}° naar {{ nu_temp }}°
                  ({{ (vooruit | float(0)) | round(1) }}° opgeschoven, er is
                  {{ (drempel | float(0.3)) | round(1) }}° nodig). Hij staat nu
                  twee uur uit. Kijk naar een deur of raam dat openstaat in een
                  ruimte zonder contact - en bij de unit boven ook naar het
                  doel zelf: die regelt op het gemiddelde van vijf kamers en
                  blaast niet door een dichte slaapkamerdeur.

    # Een timer met `restore: true` die tijdens een herstart afloopt, vuurt zijn
    # `timer.finished` bij het opstarten - vóórdat de automatiseringen hierboven
    # luisteren. Voor het voortgangsvenster betekent dat: de controle is weg en
    # de timer staat stil, dus een draaiende unit wordt de rest van de run niet
    # meer bewaakt. Hier gaat het venster dan opnieuw lopen, vanaf de huidige
    # temperatuur.
    #
    # Alleen voor units waar de regie over gaat (geen handbediening, niet op
    # handmatig). Een `gestart` die tijdens de herstart afliep wordt niet
    # hersteld: staat de unit nog uit, dan probeert de uitvoerder hem opnieuw
    # en telt de volgende mislukte start gewoon mee.
    - id: klimaat_airco_na_herstart
      alias: Klimaat - Airco voortgangsvenster na herstart
      description: >-
        Start het voortgangsvenster opnieuw voor een draaiende unit als dat
        tijdens een herstart is afgelopen.
      mode: single
      triggers:
        - trigger: homeassistant
          event: start
      conditions:
        - condition: state
          entity_id: input_boolean.aircoregie_actief
          state: "on"
      actions:
        # De Intesis-units staan de eerste minuut na het opstarten nog op
        # unavailable.
        - delay: "00:02:00"
        - repeat:
            for_each: >-
              {% from 'klimaat.jinja' import airco_lijst %}
              {{ airco_lijst() | from_json }}
            sequence:
              - variables:
                  advies_sensor: "sensor.airco_advies_{{ repeat.item }}"
              - variables:
                  entiteit: "{{ state_attr(advies_sensor, 'entiteit') }}"
                  temp_sensor: "{{ state_attr(advies_sensor, 'temp') }}"
              - if:
                  - condition: template
                    value_template: >-
                      {{ entiteit is string
                         and states(entiteit) in ['cool', 'heat']
                         and is_number(states(temp_sensor))
                         and is_state('timer.airco_voortgang_' ~ repeat.item, 'idle')
                         and is_state('timer.airco_override_' ~ repeat.item, 'idle')
                         and is_state('timer.airco_kansloos_' ~ repeat.item, 'idle')
                         and not is_state('input_boolean.airco_handmatig_' ~ repeat.item, 'on') }}
                then:
                  - action: input_number.set_value
                    target:
                      entity_id: "input_number.airco_start_temp_{{ repeat.item }}"
                    data:
                      value: "{{ states(temp_sensor) | float | round(1) }}"
                  - action: timer.start
                    target:
                      entity_id: "timer.airco_voortgang_{{ repeat.item }}"

    - id: klimaat_airco_storing_resetten
      alias: Klimaat - Airco storingsteller resetten
      description: >-
        Zet de tellers en de storingsvlaggen elke nacht terug, zodat één hik
        niet permanent blokkeert en een echte storing zich opnieuw meldt.
      mode: single
      triggers:
        - trigger: time
          at: "04:00:00"
      actions:
        - repeat:
            for_each: >-
              {% from 'klimaat.jinja' import airco_lijst %}
              {{ airco_lijst() | from_json }}
            sequence:
              - action: counter.reset
                target:
                  entity_id: "counter.airco_storingen_{{ repeat.item }}"
              - action: input_boolean.turn_off
                target:
                  entity_id: "input_boolean.airco_storing_{{ repeat.item }}"
