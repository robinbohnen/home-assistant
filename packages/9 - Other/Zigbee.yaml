##############################################################################
## ZIGBEE - merken dat de coördinator hangt, en hem terugzetten
##############################################################################
##
## WAT ER OP 5 AUGUSTUS 2026 GEBEURDE
## Alle Zigbee-apparaten waren onbereikbaar. Niet MQTT, niet Zigbee2MQTT: de
## TI-radio in de SLZB op 192.168.2.207 was gehangen. Het venijnige is dat de
## TCP-poort gewoon open bleef staan - een poortcheck zegt hier dus niets. Wat
## het wél aantoonde was een ruwe ZNP-ping rechtstreeks naar de radio, met
## Zigbee2MQTT gestopt zodat niemand anders op de lijn zat:
##
##     printf '\xFE\x00\x21\x01\x20' | nc 192.168.2.207 7638 | xxd
##
## Antwoordt hij, dan komt er `fe026101....` terug en leeft de radio. Bleef het
## stil, en crashte Zigbee2MQTT op .203 dus terecht in een lus met
## `SRSP - SYS - ping after 6000ms`.
##
## Wat het oploste was één core-restart van de SLZB. Daarna kwam de radio na
## ~50 seconden terug, pakte systemd Zigbee2MQTT vanzelf op, en meldden de
## apparaten zich over de volgende vijf minuten weer aan (van 61 offline naar
## 12, en die twaalf waren lampen op een fysieke schakelaar en batterij-
## raamsensoren die alleen bij verandering inchecken).
##
## DE TWEE RADIO'S IN DIT KASTJE - NIET VERWARREN
## De SLZB is een multiradio en heeft er twee, elk op een eigen poort:
##
##   poort 7638   TI / Z-Stack   -> DIT netwerk. Kanaal 25, pan_id 54588,
##                                  coördinator-IEEE 00124b0033c75db0, ~156
##                                  apparaten. Spreekt ZNP.
##   poort 6638   Silicon Labs   -> Thread. Spreekt ASH/EZSP (frames tussen
##                                  0x7E-bytes). Hier hangt de OTBR-add-on aan,
##                                  zie packages/9 - Other/Thread.yaml.
##
## Poort 6638 antwoordt vrolijk terwijl 7638 muisstil is - dat is precies wat er
## op 5 augustus gebeurde. Ga dan NIET Zigbee2MQTT naar 6638 verleggen: dat is
## een ander netwerk zonder jouw apparaten, en je krijgt een lege lijst terug.
##
## WAAROM HIER NIETS ZIGBEE2MQTT HERSTART
## Zigbee2MQTT draait op 192.168.2.203 als systemd-service, niet als add-on.
## Home Assistant kan er dus sowieso niet bij. Dat hoeft ook niet: de unit staat
## op `Restart=always` met tien seconden ertussen, en de burst-limiet van
## systemd (vijf starts binnen tien seconden) wordt nooit geraakt omdat één
## crashcyclus ruim dertig seconden duurt. Op 5 augustus liep de teller dan ook
## rustig door tot negen zonder dat systemd het opgaf. Zodra de radio weer
## antwoordt, staat Zigbee2MQTT er binnen een halve minuut uit zichzelf weer op.
##
## Blijft de bridge ná een geslaagde coördinator-reset toch offline, dan is het
## niet de radio maar Zigbee2MQTT zelf, en moet je op .203 kijken. De laatste
## melding hieronder zegt dat er ook bij.
##
## LET OP: DIT DEELT ÉÉN APPARAAT MET THREAD
## `button.slzb_mr3_core_restart` herstart het hele kastje, dus beide radio's.
## Zet deze automatisering de Zigbee-radio terug, dan valt Thread een minuut of
## twee weg. Dat is expres geen probleem gemaakt: `binary_sensor.thread_netwerk_stuk`
## heeft een `delay_on` van tien minuten en slaat daar niet op aan.
##
## Andersom geldt hetzelfde, en dáárom staat er hieronder een conditie op het
## tijdstip van de laatste druk op die knop. De state van een button-entiteit ís
## namelijk het tijdstip van de laatste druk. Zo weten deze automatisering en
## die in Thread.yaml van elkaar dat het kastje net al opnieuw is opgestart,
## zonder dat ze elkaars automatiseringen bij naam hoeven te kennen - en zonder
## dat een storing die beide netwerken raakt het apparaat twee keer achter
## elkaar reset.
##
## DE HERSTELLADDER STAAT ONDERAAN DIT BESTAND, VOOR BEIDE RADIO'S
## `script.slzb_radio_terugzetten` is de ladder van zacht naar hard
## (core-restart -> PoE eraf -> opgeven), en die is voor Zigbee en Thread
## letterlijk dezelfde: het is één kastje, één knop, één PoE-poort. Hij stond
## twee keer uitgeschreven en moest met de hand in de pas gehouden worden - de
## interlock tussen beide radio's werkt alleen als de tijdvensters aan weerszijden
## gelijk zijn. Nu staat hij één keer.
##
## Hij staat hier en niet in Thread.yaml omdat dit de kale ladder is: Zigbee doet
## precies wat het script doet en niets meer. Thread zet er één stap bovenop (de
## OTBR-add-on opnieuw starten na de radio) en geeft die als veld mee. De basis
## hoort bij het basisgeval; bovendien staat de hardware-uitleg over het kastje -
## de twee poorten, de ZNP-ping - hierboven al.
##
## Wat radio-eigen is (welke sensor, welke wachttijd, welke teksten, wel of geen
## add-on) komt uit de aanroeper. Wat over het kastje gaat, staat in het script.
##
## LET OP: dit is een nieuw packagebestand; het laadt pas na een volledige
## herstart van Home Assistant, een YAML-reload is niet genoeg.
##############################################################################

zigbee_package:

  template:
    - binary_sensor:
        # De bridge-entiteit van Zigbee2MQTT is het snelste signaal: bij de
        # storing van 5 augustus kwam hij niet eens tot MQTT - hij crasht op de
        # adapter en stopt - dus bleef de `offline` uit zijn last will staan.
        # Dat is harder en eerder dan wachten tot apparaten één voor één op
        # `unavailable` vallen. Alléén hierop kijken bleek op 6 augustus niet
        # genoeg; zie de uitleg bij `state:` hieronder.
        #
        # De `_3` in de naam is geen typefout maar de entiteit die er staat; die
        # wordt ook al gebruikt in packages/9 - Other/Dashboard Context.yaml.
        # Hernoem je hem, pas het op beide plekken aan.
        #
        # Tien minuten `delay_on`: een gewone herstart van Zigbee2MQTT (na een
        # configwijziging of een update) is binnen een minuut rond, en na een
        # herstart van Home Assistant duurt het even voor MQTT alles heeft
        # ingelezen. Een gehangen radio blijft staan. Twee minuten `delay_off`
        # zodat één geslaagde reconnect nog niet meteen "opgelost" roept.
        - name: "Zigbee netwerk stuk"
          unique_id: zigbee_netwerk_stuk
          device_class: problem
          icon: mdi:zigbee
          delay_on: "00:10:00"
          delay_off: "00:02:00"
          # TWEE SIGNALEN, WANT ER ZIJN TWEE MANIEREN OM STUK TE GAAN
          #
          # 1. Zigbee2MQTT komt niet meer tot MQTT. Dat was 5 augustus 2026: hij
          #    crasht op de adapter en stopt, waarna zijn last will `offline`
          #    blijft staan.
          #
          # 2. Zigbee2MQTT draait vrolijk door, maar de radio eronder bereikt
          #    geen enkel apparaat meer. Dat gebeurde op 6 augustus 2026 en die
          #    zag deze sensor NIET, want de bridge stond gewoon op `on`. Wat je
          #    dan wél ziet: alle netgevoede apparaten (lampen, stopcontacten)
          #    vallen om omdat Zigbee2MQTT ze actief pingt en geen antwoord
          #    krijgt, terwijl deurcontacten en bewegingsmelders nog "beschikbaar"
          #    heten - die worden pas na 25 uur passief afgeschreven.
          #
          # De drempel van 60% zit ruim tussen beide werelden: normaal staat dit
          # huis op ~37% onbereikbaar (tientallen spots hangen aan een
          # wandschakelaar), tijdens de storing van 6 augustus op 70%.
          state: >
            {% set bridge_weg = states('binary_sensor.zigbee2mqtt_bridge_connection_state_3')
                                in ['off', 'unavailable'] %}
            {% set aandeel = state_attr('sensor.zigbee_apparaten_onbereikbaar', 'aandeel')
                             | float(0) %}
            {% set totaal = state_attr('sensor.zigbee_apparaten_onbereikbaar', 'totaal')
                            | int(0) %}
            {# Vlak na een herstart is vrijwel alles even weg tot MQTT opnieuw
               is ingelezen; die tien minuten mogen geen storing heten. De
               bridge-tak hierboven heeft die rem niet nodig, want een lege
               last will is meteen raak. #}
            {% set start = states('sensor.home_assistant_gestart') | as_datetime %}
            {% set lang_genoeg_op = start is none or (now() - start) > timedelta(minutes=15) %}
            {{ bridge_weg or (lang_genoeg_op and totaal >= 20 and aandeel >= 60) }}

    # Hoeveel Zigbee-entiteiten er onbereikbaar zijn. Zelfde opzet en dezelfde
    # reden als `sensor.thread_matter_onbereikbaar` in
    # packages/9 - Other/Thread.yaml: een waakhond die alleen let op wat je hem
    # ooit hebt opgesomd, mist het apparaat dat je vorige week toevoegde. Daarom
    # `integration_entities` en geen handmatige lijst.
    #
    # TRIGGER-BASED, want dit loopt over honderden entiteiten. Een gewone
    # template-sensor zou dat bij élke statuswijziging in huis opnieuw doen.
    # Elke minuut is ruim genoeg voor iets waar tien minuten `delay_on` op zit.
    - trigger:
        - trigger: time_pattern
          minutes: "/1"
        - trigger: homeassistant
          event: start
        - trigger: state
          entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state_3
      sensor:
        - name: "Zigbee apparaten onbereikbaar"
          unique_id: zigbee_apparaten_onbereikbaar
          icon: mdi:zigbee
          unit_of_measurement: "entiteiten"
          state_class: measurement
          state: >
            {% set ns = namespace(n=0) %}
            {% for e in integration_entities('mqtt') %}
              {% if states(e) == 'unavailable' %}{% set ns.n = ns.n + 1 %}{% endif %}
            {% endfor %}
            {{ ns.n }}
          attributes:
            totaal: "{{ integration_entities('mqtt') | count }}"
            aandeel: >
              {% set alle = integration_entities('mqtt') %}
              {% set ns = namespace(n=0) %}
              {% for e in alle %}
                {% if states(e) == 'unavailable' %}{% set ns.n = ns.n + 1 %}{% endif %}
              {% endfor %}
              {{ 0 if alle | count == 0 else (100 * ns.n / (alle | count)) | round(0) }}

  automation:
    ###########################################################################
    ## De coördinator terugzetten als Zigbee weg is
    ###########################################################################
    #
    # DRIE TREDEN, VAN ZACHT NAAR HARD:
    #
    #   1. SLZB-core resetten -> tien minuten wachten of de bridge terugkomt
    #   2. PoE-poort uit/aan  -> tien minuten wachten
    #   3. opgeven met een critical melding
    #
    # Die ladder staat onderaan dit bestand in `script.slzb_radio_terugzetten`;
    # hieronder staat alleen wanneer we hem voor Zigbee aanroepen en waarmee.
    #
    # Trede 1 wordt overgeslagen als de SLZB zelf niet meer reageert; dan valt er
    # softwarematig niets te resetten en is de stroom de enige weg. Elke trede
    # stopt zodra de bridge terug is, dus normaal komt hij nooit verder dan de
    # eerste - op 5 augustus was één core-restart genoeg.
    #
    # Er wordt niet gewacht tot álle apparaten terug zijn, alleen tot de bridge
    # weer verbonden is. Het mesh hervormt zich daarna in zijn eigen tempo (reken
    # op een minuut of vijf) en een lamp op een fysieke schakelaar komt sowieso
    # nooit terug. Daarop wachten zou de automatisering altijd laten afgaan op
    # trede 3.
    - id: zigbee_coordinator_herstart
      alias: Zigbee - Coördinator terugzetten
      description: >-
        Zet de Zigbee-coördinator terug als Zigbee2MQTT tien minuten geen
        verbinding heeft: eerst een SLZB-reset, dan de PoE eraf, en een melding
        over wat er gebeurde en of het hielp.
      mode: single
      max_exceeded: silent
      triggers:
        # De gewone flank: het netwerk valt weg terwijl HA gewoon draait.
        - trigger: state
          entity_id: binary_sensor.zigbee_netwerk_stuk
          to: "on"
        # Vangnet voor de storing die een herstart van HA overleeft. De sensor
        # staat dan na tien minuten uptime al op `on`, dus de flank hierboven
        # valt precies in het venster dat de opstartconditie wegfiltert - en
        # daarna komt er nooit meer een flank. Deze vuurt op 25 minuten uptime,
        # ruim ná dat venster.
        - trigger: state
          entity_id: binary_sensor.zigbee_netwerk_stuk
          to: "on"
          for: "00:15:00"
        # Nieuwe poging zolang het stuk blijft. Zonder deze trigger kreeg een
        # radio die na de eerste ronde nog weg was nooit een tweede kans, en
        # deed de uurrem hieronder niets.
        - trigger: time_pattern
          hours: "/1"
      # DEZE VIER CONDITIES BLIJVEN HIER STAAN, EN NIET IN HET GEDEELDE SCRIPT.
      # Dat is geen slordigheid maar het enige dat werkt: `last_triggered` van
      # een automatisering wordt pas gezet als de acties écht beginnen, dus ná
      # deze conditieś. Zou de opstart- of zesuursgrens in het script staan, dan
      # telde elke afgeknepen ronde alsnog mee als "getriggerd" en zou de uurrem
      # hieronder de vangnettrigger van 25 minuten uptime wegdrukken.
      #
      # En `this` wijst in een script naar het script zelf, niet naar de
      # aanroeper: één gedeelde `last_triggered` zou betekenen dat een ronde voor
      # Zigbee die van Thread een uur lang blokkeert. Elke radio hoort zijn eigen
      # uurbudget te hebben.
      conditions:
        # Bij de uurtrigger is dit de eigenlijke toets; bij de flanken een
        # goedkope zekerheid tegen een sensor die net weer omklapte.
        - condition: state
          entity_id: binary_sensor.zigbee_netwerk_stuk
          state: "on"
        # Niet meteen na een herstart van Home Assistant aan de gang: MQTT is
        # dan soms nog aan het inlezen, en `delay_on` helpt daar niet tegen
        # omdat die teller pas ná de start begint te lopen.
        - condition: template
          value_template: >-
            {% set start = states('sensor.home_assistant_gestart') | as_datetime %}
            {{ start is none or (now() - start) > timedelta(minutes=20) }}
        # Hooguit één ronde per uur. Zonder deze rem wordt een radio die écht
        # stuk is de hele nacht doorgereset.
        - condition: template
          value_template: >-
            {{ this.attributes.last_triggered is none
               or now() - this.attributes.last_triggered > timedelta(hours=1) }}
        # Na zes uur is duidelijk dat het zichzelf niet meer oplost. Doorgaan
        # levert alleen nog een critical melding per uur op, de hele nacht, over
        # iets dat allang gemeld is.
        - condition: template
          value_template: >-
            {% set sinds = states.binary_sensor.zigbee_netwerk_stuk.last_changed %}
            {{ sinds is none or (now() - sinds) < timedelta(hours=6) }}
      actions:
        # Vanaf hier is alles gelijk aan Thread; zie het script onderaan dit
        # bestand. Deze aanroep is met opzet de laatste actie: een `stop:` in het
        # script beëindigt dan de hele ronde, net als toen het nog één blok was.
        - action: script.slzb_radio_terugzetten
          data:
            naam: Zigbee
            andere_radio: Thread
            stuk_sensor: binary_sensor.zigbee_netwerk_stuk
            apparaten: Zigbee-apparaten
            # Gemeten op 5 augustus: web-UI terug na ~40 seconden, de radio
            # antwoordde na ~50. Daarna moet systemd op .203 Zigbee2MQTT nog
            # oppakken (tien seconden tussen twee pogingen) en moet die zich bij
            # MQTT melden. Tien minuten is daar ruim voor; hier is niets te
            # winnen met haast. Na de PoE dezelfde tien minuten, met de
            # opstarttijd van het kastje erbij.
            wachttijd: "00:10:00"
            # Leeg, want Zigbee2MQTT draait op 192.168.2.203 als systemd-service
            # en niet als add-on: Home Assistant kan er niet bij en hoeft dat ook
            # niet. Zie de kop van dit bestand. Thread geeft hier wél een slug
            # mee, en dát is het enige inhoudelijke verschil tussen de twee.
            addon: ""
            meldingen:
              stuk: >-
                Zigbee2MQTT heeft al tien minuten geen verbinding, dus de Zigbee-
                apparaten doen niets.
              zachte_reset: >-
                Ik herstart de coördinator; Thread valt daarbij twee minuten weg.
              hersteld_zacht: >-
                De coördinator is herstart en Zigbee2MQTT heeft weer verbinding.
                Het mesh vult zich de komende minuten vanzelf.
              hersteld_poe: >-
                De SLZB is via de PoE-poort opnieuw opgestart en Zigbee2MQTT
                heeft weer verbinding.
              # Coördinator gereset én spanningsloos gemaakt, en nog steeds geen
              # bridge. Dan ligt het niet aan de radio maar aan Zigbee2MQTT zelf.
              opgegeven: >-
                De coördinator is gereset én spanningsloos gemaakt, maar
                Zigbee2MQTT heeft nog steeds geen verbinding. Dan ligt het niet
                aan de radio: kijk op 192.168.2.203 met
                `systemctl status zigbee2mqtt`.

  ###########################################################################
  ## GEDEELD MET THREAD - de herstelladder van het kastje zelf
  ###########################################################################
  script:
    # Aangeroepen door `zigbee_coordinator_herstart` hierboven en door
    # `thread_border_router_herstart` in packages/9 - Other/Thread.yaml. Beide
    # radio's zitten in dezelfde SLZB-MR3 op 192.168.2.207, aan dezelfde
    # PoE-poort, achter dezelfde resetknop - dus is de manier om ze terug te
    # zetten ook dezelfde.
    #
    # WAT HIER NIET IN ZIT, EN WAAROM
    # Het besluit óf er een ronde mag lopen (netwerk stuk, HA lang genoeg op,
    # hooguit één poging per uur, na zes uur ophouden) staat bij de aanroepers.
    # Dat moet ook: `last_triggered` van een automatisering wordt pas gezet als
    # haar acties beginnen, en `this` wijst hier naar het script en niet naar de
    # aanroeper. Zie de uitleg boven `conditions:` hierboven.
    slzb_radio_terugzetten:
      alias: SLZB - Radio terugzetten
      description: >-
        De herstelladder van de SLZB-MR3: eerst een core-restart, dan de PoE
        eraf, dan opgeven met een critical melding. Stopt zodra het netwerk
        terug is en meldt bij elke stap wat er gebeurt.
      icon: mdi:restart-alert
      # PARALLEL, EN MET GOEDE REDEN
      # Valt het hele kastje uit, dan merken Zigbee en Thread dat allebei en
      # roepen ze dit script vrijwel tegelijk aan. Met `mode: single` zou de
      # tweede aanroep stilletjes verdampen - géén melding, terwijl juist de
      # melding "de PoE is net al eraf geweest" het antwoord is dat je dan wil.
      # De interlocks hieronder (`recent_gereset`, `poe_recent_gecycled`) doen
      # dat werk; die hebben een tweede ronde nodig om het te kunnen zeggen.
      # Meer dan twee radio's zitten er niet in het kastje, dus max 2.
      mode: parallel
      max: 2
      fields:
        naam:
          name: Netwerk
          description: Hoe dit netwerk in de meldingen heet
          required: true
          example: Zigbee
          selector:
            text:
        andere_radio:
          name: Andere radio
          description: De andere radio in hetzelfde kastje, voor de tekst bij de interlock
          required: true
          example: Thread
          selector:
            text:
        stuk_sensor:
          name: Stuk-sensor
          description: De binary_sensor die `on` staat zolang dit netwerk eruit ligt
          required: true
          example: binary_sensor.zigbee_netwerk_stuk
          selector:
            entity:
              domain: binary_sensor
        apparaten:
          name: Apparaten
          description: Hoe de apparaten van dit netwerk heten in de melding
          required: true
          example: Zigbee-apparaten
          selector:
            text:
        wachttijd:
          name: Wachttijd per trede
          description: Hoe lang er na een reset op herstel gewacht wordt
          required: true
          example: "00:10:00"
          selector:
            text:
        addon:
          name: Add-on
          description: >-
            Slug van een add-on die ná de radio opnieuw op moet, of leeg als er
            geen is
          default: ""
          selector:
            text:
        addon_wacht_na_reset:
          name: Wachten voor de add-on (na core-restart)
          description: Hoe lang de SLZB krijgt om op te komen voor de add-on herstart
          default: "00:02:00"
          selector:
            text:
        addon_wacht_na_poe:
          name: Wachten voor de add-on (na PoE)
          description: Idem, maar na een koude start - die duurt langer
          default: "00:03:00"
          selector:
            text:
        meldingen:
          name: Meldingsteksten
          description: >-
            De inhoudelijke zinnen: `stuk`, `zachte_reset`, `hersteld_zacht`,
            `hersteld_poe` en `opgegeven`. De titels en de rest van de zinnen
            maakt het script zelf.
          required: true
          selector:
            object:
      sequence:
        #####################################################################
        ## Wat kan er nog, en wat heeft de andere radio net al gedaan
        #####################################################################
        # Twee redenen om de zachte trede over te slaan en meteen de stroom te
        # pakken:
        #
        #   - De SLZB-entiteiten staan op `unavailable`, dus de integratie kan
        #     het kastje niet bereiken en er valt niets te resetten. Precies de
        #     situatie van 5 augustus, toen socat "No route to host" gaf.
        #   - Het kastje is in het afgelopen half uur al opnieuw opgestart. De
        #     state van een button ís namelijk het tijdstip van de laatste druk,
        #     dus dit ziet ook een reset door de ándere waakhond of eentje met de
        #     hand. Een core-restart die hielp is binnen een minuut of twee
        #     zichtbaar; is het netwerk daarna nóg tien minuten weg, dan lost een
        #     tweede druk op diezelfde knop het niet alsnog op.
        #
        # Dit staat expres niet bij de `conditions:` van de aanroepers. Daar zou
        # het de hele ronde blokkeren - geen melding, geen escalatie - terwijl
        # een reset die net niet hielp juist de reden is om door te gaan naar de
        # PoE.
        - variables:
            slzb_reageert: >-
              {{ states('button.slzb_mr3_core_restart')
                 not in ['unavailable', 'unknown', 'none', ''] }}
            recent_gereset: >-
              {% set laatst = states('button.slzb_mr3_core_restart') | as_datetime %}
              {{ laatst is not none and (now() - laatst) < timedelta(minutes=30) }}
            zachte_reset_zinvol: "{{ slzb_reageert and not recent_gereset }}"
            # Zelfde trucje als hierboven, nu voor de PoE-poort. Valt het hele
            # kastje uit, dan zien Zigbee en Thread dat allebei en willen ze
            # allebei deze poort power-cyclen; zonder deze check reboot de
            # tweede het apparaat midden in het herstel van de eerste.
            poe_recent_gecycled: >-
              {% set laatst = states('button.usw_pro_max_16_poe_meterkast_port_1_power_cycle')
                              | as_datetime %}
              {{ laatst is not none and (now() - laatst) < timedelta(minutes=15) }}

        - action: notify.mobile_devices_adults
          data:
            title: "{{ naam }} ligt eruit"
            message: >-
              {{ meldingen.stuk }}
              {% if zachte_reset_zinvol %}
                {{ meldingen.zachte_reset }}
              {% elif not slzb_reageert %}
                De SLZB reageert zelf ook niet, dus ik haal de PoE eraf.
              {% else %}
                De SLZB is net al herstart en dat hielp niet, dus ik haal de PoE
                eraf.
              {% endif %}

        #####################################################################
        ## Poging 1 - zachte reset, alleen als die iets kan opleveren
        #####################################################################
        - if:
            - condition: template
              value_template: "{{ zachte_reset_zinvol }}"
          then:
            - action: button.press
              target:
                entity_id: button.slzb_mr3_core_restart
            # De radio eerst, dan pas wat eraan hangt. Andersom hielp op
            # 5 augustus niet: de add-on kan niets zolang de radio aan de andere
            # kant van die TCP-verbinding hangt te wezen. Zie Thread.yaml, dat
            # als enige een slug meegeeft; voor Zigbee slaat dit blok over.
            - if:
                - condition: template
                  value_template: "{{ addon | default('', true) != '' }}"
              then:
                - delay: "{{ addon_wacht_na_reset | default('00:02:00', true) }}"
                - action: hassio.addon_restart
                  data:
                    addon: "{{ addon }}"
                  continue_on_error: true
            # `wait_template` en geen `wait_for_trigger`: de sensor komt hier uit
            # een veld, en in een trigger mag `entity_id` geen template zijn.
            # Bijvangst: staat hij al op `off`, dan lopen we meteen door in
            # plaats van op een flank te wachten die al geweest is.
            - wait_template: "{{ is_state(stuk_sensor, 'off') }}"
              timeout: "{{ wachttijd }}"
              continue_on_timeout: true

        - if:
            - condition: template
              value_template: "{{ is_state(stuk_sensor, 'off') }}"
          then:
            - action: notify.mobile_devices_adults
              data:
                title: "{{ naam }} is terug"
                message: "{{ meldingen.hersteld_zacht }}"
            - stop: "Hersteld met een zachte reset"

        #####################################################################
        ## Poging 2 - stroom eraf
        #####################################################################
        # PoE-poort 1 van de switch in de meterkast voedt de SLZB (nagekeken op
        # 2026-08-05). Dit is het enige dat een gehangen kastje terugbrengt
        # zonder dat er iemand naar de meterkast loopt - en dat was op 5 augustus
        # precies wat er nodig was.
        #
        # Waarom pas hier: spanning wegnemen is grover dan nodig zolang het
        # apparaat nog praat, en een koude start kost meer tijd. Reageert de SLZB
        # niet meer, dan wordt poging 1 hierboven overgeslagen en komt hij meteen
        # hier terecht.
        #
        # Alleen `unavailable` betekent onbereikbaar. `unknown` stond hier ook,
        # maar de state van een button ís het tijdstip van de laatste druk, en
        # deze knop is nog nooit ingedrukt - dus hij staat gewoon op `unknown` en
        # trede 2 stopte er altijd. Geverifieerd tegen de draaiende HA op
        # 2026-08-06.
        - if:
            - condition: state
              entity_id: button.usw_pro_max_16_poe_meterkast_port_1_power_cycle
              state: unavailable
          then:
            - action: script.notify_critical
              data:
                doelgroep: notify.mobile_devices_adults
                titel: "{{ naam }} weg, switch onbereikbaar"
                bericht: >-
                  De {{ apparaten }} zijn weg en de PoE-switch in de meterkast
                  reageert ook niet, dus ik kan de SLZB niet spanningsloos
                  maken. Hier moet iemand naar kijken.
                volume: 0.7
            - stop: "Switch onbereikbaar, handmatig nakijken"

        - if:
            - condition: template
              value_template: "{{ poe_recent_gecycled }}"
          then:
            - action: notify.mobile_devices_adults
              data:
                title: "{{ naam }} weg, herstel loopt al"
                message: >-
                  De PoE van de SLZB is net al eraf geweest - vrijwel zeker door
                  de {{ andere_radio }}-waakhond, want het is hetzelfde kastje.
                  Ik doe het niet nog een keer; als {{ naam }} over een uur nog
                  weg is, probeer ik het opnieuw.
            - stop: "PoE net al gecycled, herstel van de andere radio afwachten"

        - action: notify.mobile_devices_adults
          data:
            title: "{{ naam }} nog steeds weg"
            message: Ik haal de PoE van de SLZB er even af.

        - action: button.press
          target:
            entity_id: button.usw_pro_max_16_poe_meterkast_port_1_power_cycle

        # Een koude start duurt langer dan een core-restart, vandaar een eigen
        # (langere) wachttijd voordat de add-on het opnieuw mag proberen.
        - if:
            - condition: template
              value_template: "{{ addon | default('', true) != '' }}"
          then:
            - delay: "{{ addon_wacht_na_poe | default('00:03:00', true) }}"
            - action: hassio.addon_restart
              data:
                addon: "{{ addon }}"
              continue_on_error: true

        - wait_template: "{{ is_state(stuk_sensor, 'off') }}"
          timeout: "{{ wachttijd }}"
          continue_on_timeout: true

        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ is_state(stuk_sensor, 'off') }}"
              sequence:
                - action: notify.mobile_devices_adults
                  data:
                    title: "{{ naam }} is terug"
                    message: "{{ meldingen.hersteld_poe }}"
          default:
            # Alles gehad: zachte reset, stroom eraf. Dan zit het dieper dan een
            # vastgelopen radio. Critical, want zonder Zigbee doet het halve huis
            # niets en zonder Thread de lampen en luchtreinigers beneden - en je
            # ziet dat verder nergens aan.
            - action: script.notify_critical
              data:
                doelgroep: notify.mobile_devices_adults
                titel: "{{ naam }} blijft weg"
                bericht: "{{ meldingen.opgegeven }}"
                volume: 0.7
