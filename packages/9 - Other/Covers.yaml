covers_package:
  ###########################################################################
  ## EEN COVER ZETTEN EN NAKIJKEN OF HIJ HET DEED
  ##
  ## De keukenrolgordijnen missen af en toe een commando. Ze melden hun echte
  ## stand daarna gewoon netjes, dus je kunt zien dát ze niets gedaan hebben -
  ## alleen keek er tot nu toe niemand.
  ##
  ## LET OP - HET GEVAL VAN 10 AUGUSTUS WAS DIT NIET (rechtgezet op 12 augustus
  ## 2026). Hier stond dat het grote rolgordijn die avond een commando gemist
  ## had. De geschiedenis zegt iets anders: `binary_sensor.keuken_raam_groot_
  ## contact` viel die nacht om 02:06 van het netwerk en is daarna niet
  ## teruggekomen, dus lazen alle sluiters "raam open" en is er nooit een
  ## commando geweest om te missen. Op 11 augustus ging het om dezelfde reden
  ## opnieuw mis. Dat gat zit nu dicht in Kitchen/Covers.yaml (de
  ## `*_mag_dicht`-sensoren); dit script blijft staan, want een gemist commando
  ## is een echt en apart probleem - het heeft alleen nog niet bewezen dát het
  ## hier speelde.
  ##
  ## WAAROM DE BESTAANDE VANGNETTEN DAT NIET OPVINGEN
  ## `klimaat_zonwering_uitvoeren` kijkt elk kwartier of de stand nog bij het
  ## advies past en stuurt bij - dat is precies zo'n vangnet. Maar de twee
  ## sluiters hierboven en in Kitchen/Covers.yaml starten bij het sluiten
  ## meteen de override-timer van die zone (met goede reden, zie de uitleg
  ## daar), en een zone op override laat de uitvoerder juist met rust. Het
  ## vangnet staat dus uit op precies het moment dat het nodig is.
  ##
  ## WAT DIT SCRIPT WEL EN NIET DOET
  ## Het stuurt het commando nog een paar keer, met oplopende tussenpozen, maar
  ## ALLEEN zolang de cover geen millimeter bewogen heeft. Dat is namelijk de
  ## handtekening van een gemist commando. Beweegt hij wél en komt hij ergens
  ## anders uit - iemand pakt de app, of hij stopt tegen een obstakel - dan
  ## houdt het script op. Anders zou het met een mens gaan vechten, en dat is
  ## erger dan een rolgordijn dat verkeerd staat.
  ##
  ## Aanroepen met `script.turn_on` en niet rechtstreeks: een ronde duurt tot
  ## ruim twintig minuten en de aanroeper (een automatisering die ook andere
  ## dingen doet) hoort daar niet op te blijven staan.
  ###########################################################################
  script:
    cover_zetten_en_nakijken:
      alias: Cover - Zetten en nakijken
      description: >-
        Zet een cover op een stand en controleert of hij het commando ook
        uitgevoerd heeft. Deed hij helemaal niets, dan gaat het commando er nog
        een paar keer overheen.
      icon: mdi:window-shutter-auto
      # Parallel: vier rolgordijnen/rolluiken tegelijk in de gaten houden moet
      # kunnen, en twee sluiters die vlak na elkaar dezelfde cover aansturen
      # (18:45 slot/alarm en de avondsluiting) mogen elkaar niet wegdrukken.
      mode: parallel
      max: 10
      fields:
        cover:
          name: Cover
          description: De cover die gezet moet worden
          required: true
          example: cover.rollerblind_0001
          selector:
            entity:
              domain: cover
        doel:
          name: Gewenste stand
          description: 0 is dicht, 100 is open
          required: true
          example: 0
          selector:
            number:
              min: 0
              max: 100
        wachttijden:
          name: Wachttijden per poging
          description: >-
            Hoe lang er per poging op beweging gewacht wordt. Het aantal
            wachttijden ís het aantal pogingen; de oplopende reeks vangt zowel
            een enkel verdwenen commando op als een radio die even weg is.
          default:
            - "00:01:30"
            - "00:05:00"
            - "00:15:00"
          selector:
            object:
        melden:
          name: Melden als het niet lukt
          default: true
          selector:
            boolean:
      sequence:
        # Marge van 5, dezelfde als in `klimaat_zonwering_uitvoeren`: een
        # rolgordijn stopt zelden op de punt en 42 tegen 45 is geen verschil
        # waar iemand iets van merkt.
        #
        # Covers zonder tussenstand kennen geen `current_position`; die
        # vertalen we naar 100 of 0, net als de klimaatuitvoerder doet. Een
        # cover die niets zinnigs meldt levert -1 op en telt daarmee nooit als
        # "staat al goed".
        #
        # De twee ankers hieronder zijn er zodat deze twee uitdrukkingen maar
        # één keer in het bestand staan: `bereikt` (staat hij waar we hem
        # willen) en `huidig` (waar staat hij nu). Ze worden op elk gebruik
        # opnieuw gerenderd - een anker deelt de tekst, niet de uitkomst.
        - alias: Staat hij al goed, dan is er niets te doen
          if:
            - condition: template
              value_template: &bereikt >-
                {% set p = state_attr(cover, 'current_position') %}
                {% set h = p | int(-1) if p is not none
                           else (100 if is_state(cover, 'open')
                                 else (0 if is_state(cover, 'closed') else -1)) %}
                {{ h >= 0 and (h - (doel | int(-1))) | abs <= 5 }}
          then:
            - stop: "Stond al op de gevraagde stand"
        - repeat:
            for_each: >-
              {{ wachttijden | default(['00:01:30', '00:05:00', '00:15:00'], true) }}
            sequence:
              - variables:
                  stand_vooraf: &huidig >-
                    {% set p = state_attr(cover, 'current_position') %}
                    {{ p | int(-1) if p is not none
                       else (100 if is_state(cover, 'open')
                             else (0 if is_state(cover, 'closed') else -1)) }}
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ doel | int(-1) >= 95 }}"
                    sequence:
                      - action: cover.open_cover
                        target:
                          entity_id: "{{ cover }}"
                        continue_on_error: true
                  - conditions:
                      - condition: template
                        value_template: "{{ doel | int(-1) <= 5 }}"
                    sequence:
                      - action: cover.close_cover
                        target:
                          entity_id: "{{ cover }}"
                        continue_on_error: true
                default:
                  - action: cover.set_cover_position
                    target:
                      entity_id: "{{ cover }}"
                    data:
                      position: "{{ doel | int }}"
                    continue_on_error: true
              # Wachten tot hij er is, en niet blind een vaste tijd: een
              # geslaagd commando is meestal binnen een halve minuut rond en
              # dan hoeft er niets meer.
              - wait_template: *bereikt
                timeout: "{{ repeat.item }}"
                continue_on_timeout: true
              - variables:
                  huidig_na: *huidig
              - alias: Gelukt
                if:
                  - condition: template
                    value_template: >-
                      {{ huidig_na | int(-1) >= 0
                         and (huidig_na | int(-1) - (doel | int(-1))) | abs <= 5 }}
                then:
                  - stop: "Cover staat op de gevraagde stand"
              # HIJ BEWOOG WEL, MAAR NIET NAAR WAAR WIJ HEM WILDEN
              # Dan is het geen gemist commando. Iemand bedient hem met de hand,
              # of hij loopt ergens tegenaan. In beide gevallen is nog eens
              # hetzelfde commando sturen precies het verkeerde.
              - alias: Beweegt zelf - niet tegenwerken
                if:
                  - condition: template
                    value_template: "{{ huidig_na | int(-1) != stand_vooraf | int(-1) }}"
                then:
                  - stop: "Cover beweegt, maar ergens anders heen"
        - alias: Alle pogingen gehad en hij staat er nog steeds niet
          if:
            - condition: template
              value_template: "{{ melden | default(true, true) }}"
          then:
            - action: notify.mobile_devices_robin
              data:
                title: Cover reageert niet
                message: >-
                  {{ state_attr(cover, 'friendly_name') | default(cover, true) }}
                  heeft alle pogingen genegeerd en staat nog op
                  {% set p = state_attr(cover, 'current_position') %}
                  {{ p if p is not none else states(cover) }} in plaats van
                  {{ doel | int }}.
                data:
                  tag: "cover-reageert-niet-{{ cover }}"
                  notification_icon: mdi:window-shutter-alert

  group:
    # LET OP: dit zijn dezelfde zeven ramen als `cover.all_covers_upstairs` in
    # packages/2 - Second Floor/Attic/AC.yaml, maar dan de `_low_speed`-
    # varianten - die lopen langzamer en zijn 's ochtends niet door het hele
    # huis te horen. Twee lijsten van dezelfde ramen dus, met een ander doel:
    # deze voor de dagelijkse routines, die andere voor brand- en alarmgevallen
    # waar snelheid boven stilte gaat. Komt er een rolluik bij, zet het in
    # ALLEBEI. (`cover.slaapkamer_mini` heeft geen low_speed-variant en staat
    # daarom in beide lijsten met dezelfde entiteit.)
    covers_first_floor:
      name: Rolluiken eerste verdieping
      icon: mdi:window-shutter
      entities:
        - cover.kantoor_links_low_speed
        - cover.kantoor_rechts_low_speed
        - cover.badkamer_rolluik_low_speed
        - cover.slaapkamer_rolluik_low_speed
        - cover.slaapkamer_maxi_links_low_speed
        - cover.slaapkamer_maxi_rechts_low_speed
        - cover.slaapkamer_mini

  automation:
    #################################################################
    ## Bedroom button press - open covers
    #################################################################
    - id: covers_bedroom_button
      alias: Covers - Bedroom button press
      description: Open covers when bedroom button is pressed
      mode: single
      triggers:
        # Uit de router in packages/1 - First Floor/Bedroom/Buttons.yaml. Die
        # bepaalt of het ochtend of avond is; hier hoeft alleen de ochtend
        # opgevangen te worden, want 's avonds doet deze automatisering niets.
        - trigger: event
          event_type: huis_routine
          event_data:
            routine: ochtend
      conditions: []
      ##################################################################
      ## DE KLIMAATREGIE MOET HIER EVEN AF BLIJVEN
      ##
      ## Dit is een knop die iemand indrukt, en tot nu toe won de
      ## klimaatregie daar binnen twee minuten van: op 15 augustus 2026
      ## ging om 09:08:32 alles boven naar 100, en om 09:10:21 trok
      ## `klimaat_zonwering_uitvoeren` kantoor weer naar 0 en de
      ## slaapkamer naar 15 ("zon op de voor/zijgevel"). Alles omhoog en
      ## twee minuten later weer omlaag; ook gezien op 12 augustus.
      ##
      ## Daarom start deze automatisering dezelfde override-timers die de
      ## avondsluiting al zet - maar op een half uur in plaats van de
      ## vier uur van een echte handbediening. Lang genoeg om te
      ## ontbijten met de rolluiken open, kort genoeg dat de zonwering op
      ## een hittedag niet de hele ochtend uit staat. Wil je die
      ## verhouding anders, dan is `duration` hieronder de enige knop.
      ##################################################################
      actions:
        - if:
            - condition: numeric_state
              entity_id: sensor.voortuin_zon_luminance
              above: 20000
          then:
            - action: cover.open_cover
              data: {}
              target:
                entity_id:
                  - cover.badkamer_rolluik_low_speed
                  - cover.slaapkamer_rolluik_low_speed
            - action: cover.close_cover
              data: {}
              target:
                entity_id:
                  - cover.keuken_screen_links
                  - cover.keuken_screen_rechts
            - alias: Klimaatregie een half uur van deze zones af houden
              action: timer.start
              data:
                duration: "00:30:00"
              target:
                entity_id:
                  - timer.override_badkamer
                  - timer.override_slaapkamer
                  - timer.override_keuken_screens
          else:
            - action: cover.open_cover
              data: {}
              target:
                entity_id: group.covers_first_floor
            # Per rolgordijn en via het script, want de groep kan niet
            # nakijken of allebei de helften het commando ook echt gehoord
            # hebben; zie de kop van dit bestand.
            - repeat:
                for_each:
                  - cover.rollerblind_0001
                  - cover.rollerblind_0002
                sequence:
                  - action: script.turn_on
                    target:
                      entity_id: script.cover_zetten_en_nakijken
                    data:
                      variables:
                        cover: "{{ repeat.item }}"
                        doel: 100
            - alias: Klimaatregie een half uur van deze zones af houden
              action: timer.start
              data:
                duration: "00:30:00"
              target:
                entity_id:
                  - timer.override_kantoor_links
                  - timer.override_kantoor_rechts
                  - timer.override_badkamer
                  - timer.override_slaapkamer
                  - timer.override_slaapkamer_logan
                  - timer.override_slaapkamer_emma
                  - timer.override_keuken_rolgordijn_groot
                  - timer.override_keuken_rolgordijn_klein

    #################################################################
    ## Lock/alarm events - open/close kitchen rollerblinds
    #################################################################
    - id: covers_lock_alarm_events
      alias: Covers - Lock and alarm events
      description: Open or close covers based on lock and alarm state changes
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - lock.kroon18voordeur
          to: unlocked
          id: lock_unlocked
        - trigger: state
          entity_id:
            - alarm_control_panel.alarmo
          to: disarmed
          id: alarm_off
        - trigger: state
          entity_id:
            - alarm_control_panel.alarmo
          to: armed_away
          id: alarm_on_not_home
        - trigger: state
          entity_id:
            - alarm_control_panel.alarmo
          to: armed_home
          id: alarm_on_home
        - trigger: state
          entity_id:
            - lock.kroon18voordeur
          to: locked
          id: lock_locked
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - lock_unlocked
                    - alarm_off
              sequence:
                - if:
                    - condition: time
                      after: "08:30:00"
                      before: "19:00:00"
                    - condition: numeric_state
                      entity_id: sensor.voortuin_zon_luminance
                      below: 20000
                    - condition: sun
                      before: sunset
                      before_offset: "-00:30:00"
                  then:
                    - repeat:
                        for_each:
                          - cover.rollerblind_0001
                          - cover.rollerblind_0002
                        sequence:
                          - action: script.turn_on
                            target:
                              entity_id: script.cover_zetten_en_nakijken
                            data:
                              variables:
                                cover: "{{ repeat.item }}"
                                doel: 100
            - conditions:
                - condition: trigger
                  id:
                    - alarm_on_not_home
                    - alarm_on_home
                    - lock_locked
              sequence:
                - alias: Close covers when windows are closed and no-one is home
                  if:
                    - condition: or
                      conditions:
                        - condition: not
                          conditions:
                            - condition: state
                              entity_id: group.all_adults
                              state: home
                        - condition: time
                          after: "18:45:00"
                          before: "01:00:00"
                  # DE OVERRIDE-TIMER HOORT HIER METEEN BIJ
                  # Tussen 18:45 en de bedtijd van de kinderen vindt de
                  # klimaatregie deze rolgordijnen nog "open - daglicht"; pas
                  # vanaf die bedtijd laat hij ze met rust (zie BEDTIJDEN in
                  # custom_templates/klimaat.jinja). In dat gat sluit deze
                  # automatisering ze wél, en dan draait de uitvoerder ze
                  # doodleuk weer omhoog.
                  #
                  # `klimaat_handbediening_herkennen` zou dat opvangen, maar die
                  # wacht anderhalve minuut voordat een stand als handbediening
                  # telt - en de uitvoerder komt elke minuut langs. Op
                  # 2026-08-06 werd het grote rolgordijn om 19:01:55 net op tijd
                  # beschermd en ging het kleine er om 19:02:01 weer uit; drie
                  # seconden verschil.
                  #
                  # Dit ís geen handbediening maar wel dezelfde bedoeling: blijf
                  # van deze zone af. Daarom zetten we de timer hier zelf, op het
                  # moment van sluiten, in plaats van te hopen dat de herkenning
                  # er eerder bij is.
                  then:
                    # Dezelfde raamvraag als in Kitchen/Covers.yaml, en bewust
                    # via diezelfde sensor: stond hier `state: "off"` op het
                    # contact, dan bleef dit pad een dood contact als "raam
                    # open" lezen terwijl de avondsluiter allang doorheeft dat
                    # het contact niets meer zegt.
                    - if:
                        - condition: template
                          value_template: >-
                            {{ is_state(
                                 'binary_sensor.keuken_rolgordijn_groot_mag_dicht',
                                 'on') }}
                      then:
                        - action: script.turn_on
                          target:
                            entity_id: script.cover_zetten_en_nakijken
                          data:
                            variables:
                              cover: cover.rollerblind_0001
                              doel: 0
                        - action: timer.start
                          target:
                            entity_id: timer.override_keuken_rolgordijn_groot
                    - if:
                        - condition: template
                          value_template: >-
                            {{ is_state(
                                 'binary_sensor.keuken_rolgordijn_klein_mag_dicht',
                                 'on') }}
                      then:
                        - action: script.turn_on
                          target:
                            entity_id: script.cover_zetten_en_nakijken
                          data:
                            variables:
                              cover: cover.rollerblind_0002
                              doel: 0
                        - action: timer.start
                          target:
                            entity_id: timer.override_keuken_rolgordijn_klein
