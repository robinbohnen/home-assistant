music_package:
  group:
    all_sonos:
      name: Alle Sonos speakers
      icon: mdi:speaker-group
      entities:
        - media_player.badkamer_sonos
        - media_player.garage_sonos
        - media_player.keuken_sonos
        - media_player.keuken_sonos_2
        - media_player.kantoor_sonos
        - media_player.overkapping_sonos
        - media_player.slaapkamer_mini_sonos
        - media_player.slaapkamer_maxi_sonos
        - media_player.speelkamer_sonos
        - media_player.toilet_sonos
        - media_player.woonkamer_sonos

    all_sonos_secondary:
      name: Alle Sonos speakers (zonder woonkamer)
      icon: mdi:speaker-group
      entities:
        - media_player.badkamer_sonos
        - media_player.garage_sonos
        - media_player.keuken_sonos
        - media_player.keuken_sonos_2
        - media_player.kantoor_sonos
        - media_player.overkapping_sonos
        - media_player.slaapkamer_mini_sonos
        - media_player.slaapkamer_maxi_sonos
        - media_player.speelkamer_sonos
        - media_player.toilet_sonos

  automation:
    # LET OP: het entity_id van deze automatisering is
    # automation.general_play_default_music en volgt hier NIET de alias. Hij is
    # ooit in de UI hernoemd, en de entity registry wint van de alias-slug.
    # Niet "corrigeren" naar general_music_play_default - dan breekt de
    # Q-Music-knop op het dashboard en de trigger in Music Play Default TV Off.
    - id: play_music
      alias: General - Music Play Default
      description: Play default music automation
      mode: single
      triggers:
        - trigger: time
          at: "09:00:00"
          id: ochtend
        - trigger: state
          entity_id:
            - light.woonkamer_lampen
          to: "on"
          id: lights_on
      conditions:
        - condition: state
          entity_id: group.all_adults
          state: home
        - condition: not
          conditions:
            - condition: state
              entity_id: media_player.woonkamer_sonos
              state: playing
          alias: Als Sonos niet al speelt
        - alias: Als het niet te vroeg of te laat is
          condition: not
          conditions:
            - alias: Doordeweeks of weekend
              condition: or
              conditions:
                - alias: Doordeweeks
                  condition: and
                  conditions:
                    - condition: time
                      weekday:
                        - mon
                        - tue
                        - wed
                        - thu
                        - fri
                    - condition: or
                      conditions:
                        - condition: time
                          after: input_datetime.bedtime_maxi_1h_off
                        - condition: time
                          after: input_datetime.bedtime_mini_1h_off
                        - condition: time
                          before: "08:30:00"
                      alias: Bekijk de tijd
                - alias: In het weekend
                  condition: and
                  conditions:
                    - condition: time
                      weekday:
                        - sat
                        - sun
                    - condition: or
                      conditions:
                        - condition: time
                          after: input_datetime.bedtime_maxi_1h_off
                        - condition: time
                          after: input_datetime.bedtime_mini_1h_off
                        - condition: time
                          before: "09:00:00"
                      alias: Bekijk de tijd
      # De twee kinderslaapkamers stonden hieronder vast in de volume- en de
      # joinlijst. Om 09:00 werden Maxi en Mini dus altijd aan de woonkamergroep
      # geplakt, ook als er nog geslapen werd; dat het op 2026-08-08 stil bleef
      # kwam alleen doordat die speakers met de hand gemute stonden. Nergens in
      # deze config zit een `volume_mute`, dus dat is geen vangnet waar je op
      # kunt bouwen - de Sonos-app haalt hem er zo weer af.
      #
      # `klimaat_wakker` is het bestaande wakker-signaal van het huis: aan zodra
      # er 's ochtends op de slaapkamerknop is gedrukt, en anders vanzelf om
      # 10:00 (zie de noodrem in packages/9 - Other/Klimaat Zonwering.yaml, waar
      # de helper ook gedefinieerd staat). Om 09:00 staat hij op een normale dag
      # dus nog uit en blijven beide kinderkamers buiten de groep.
      #
      # Waarom een variabele en niet een tweede join-actie erachteraan: het
      # groeperen moet één aanroep blijven, om precies de reden die bij die
      # actie hieronder staat.
      #
      # Niet toevoegen is niet hetzelfde als eraf halen: `media_player.join`
      # voegt de genoemde speakers toe en laat de rest van de groep staan.
      # Zat een kinderkamer om 09:00 al in de woonkamergroep - blijven hangen
      # van gisteren, of met de hand via de "Gehele huis samen"-knop - dan
      # houdt `kinderkamers` hem daar niet uit, en begint de radio alsnog naast
      # een slapend kind. Vandaar `speakers_los` en de unjoin hieronder.
      #
      # Datzelfde geldt voor de overkapping. Die hoort 's ochtends niet
      # standaard mee te spelen - buiten geluid is een keuze die je zelf maakt,
      # via de tuinknop of de dashboardkaart (allebei
      # script.sonos_overkapping_toggle in Sonos Groups.yaml). Hij staat daarom
      # niet in de joinlijst, maar hangt hij er van gisteravond nog aan, dan
      # gaat hij bij de ochtendstart los.
      #
      # Alleen bij de ochtendstart, en dat is het verschil met de kinderkamers.
      # Deze automatisering draait namelijk ook overdag: als de woonkamerlampen
      # aangaan, en via `Music Play Default TV Off`. Zou de overkapping daar ook
      # losgetrokken worden, dan valt op een zomeravond de tuin uit de groep op
      # het moment dat de tv uitgaat - precies andersom dan bedoeld. Vandaar
      # `trigger.id`; bij een aanroep via `automation.trigger` (de TV-off-
      # automatisering en de Q-Music-knop) bestaat die niet, en dat is hier
      # dus ook het goede antwoord.
      variables:
        ochtend: "{{ (trigger | default({})).get('id', '') == 'ochtend' }}"
        wakker: "{{ is_state('input_boolean.klimaat_wakker', 'on') }}"
        kinderkamers: >-
          {{ ['media_player.slaapkamer_maxi_sonos',
              'media_player.slaapkamer_mini_sonos']
             if wakker else [] }}
        # Alleen de speakers die op dít moment echt in de groep zitten. Zo
        # blijft een unjoin op een speaker die er al los van staat achterwege.
        speakers_los: >-
          {{ ((['media_player.overkapping_sonos'] if ochtend else [])
              + ([] if wakker else
                 ['media_player.slaapkamer_maxi_sonos',
                  'media_player.slaapkamer_mini_sonos']))
             | select('in', state_attr('media_player.woonkamer_sonos', 'group_members') or [])
             | list }}
      actions:
        # Eerst loskoppelen, dan pas volume en join: de groep moet kloppen
        # voordat er geluid is, om dezelfde reden als bij de join hieronder.
        - alias: Overkapping en slapende kinderkamers uit de groep halen
          if:
            - condition: template
              value_template: "{{ speakers_los | count > 0 }}"
          then:
            - action: media_player.unjoin
              continue_on_error: true
              data: {}
              target:
                entity_id: "{{ speakers_los }}"
        - action: media_player.volume_set
          metadata: {}
          data:
            volume_level: 0.05
          target:
            entity_id: >-
              {{ ['media_player.badkamer_sonos',
                  'media_player.garage_sonos',
                  'media_player.keuken_sonos',
                  'media_player.keuken_sonos_2',
                  'media_player.kantoor_sonos',
                  'media_player.speelkamer_sonos',
                  'media_player.woonkamer_sonos'] + kinderkamers }}
        # Eerst groeperen, dan pas afspelen. Andersom was het jarenlang de
        # oorzaak van "de radio staat maar in de helft van het huis aan".
        #
        # `media_player.join` wacht bij Sonos tot de groep exact zo is als
        # gevraagd (HA vergelijkt de verzamelingen letterlijk) en geeft het na
        # 30 seconden op. Belangrijker: bij die timeout breekt HA de hele
        # groepeeractie af, dus alle speakers die nog aan de beurt moesten
        # komen blijven stil achter.
        #
        # En wie veranderde die groep tussendoor? Deze automatisering zelf.
        # `play_media` zette de woonkamer op `playing`, drie seconden later
        # triggerde `Kitchen - Media` daarop en joinde de twee keukenspeakers -
        # midden in het wachten hierboven. Verzameling wijkt af, 30 seconden
        # wachten, foutmelding, rest van het huis stil. Zo ging het op
        # 2026-08-07 om 13:47 en 13:58.
        #
        # Door eerst te joinen is de groep al compleet voordat er geluid is.
        # `Kitchen - Media` en de kamers op `blueprints/.../sonos_motion_join`
        # slaan dan over, want hun speaker is dan geen `idle` meer.
        #
        # `continue_on_error` hoort bij die omdraaiing: loopt het groeperen
        # alsnog vast, dan mag dat de muziek niet tegenhouden. De fout blijft
        # gewoon in de trace staan.
        - action: media_player.join
          continue_on_error: true
          metadata: {}
          data:
            # De woonkamer staat hier bewust niet tussen: dat is de
            # groepsleider (het `target` hieronder), niet iemand die zich bij
            # zichzelf aansluit. `kinderkamers` is leeg zolang het huis niet
            # wakker gemeld is - zie de toelichting bij `variables` hierboven.
            group_members: >-
              {{ ['media_player.garage_sonos',
                  'media_player.speelkamer_sonos',
                  'media_player.kantoor_sonos',
                  'media_player.keuken_sonos',
                  'media_player.keuken_sonos_2'] + kinderkamers }}
          target:
            entity_id: media_player.woonkamer_sonos
        - action: media_player.play_media
          metadata:
            title: Qmusic
            thumbnail: http://cdn-radiotime-logos.tunein.com/s87683q.png
            media_class: genre
            children_media_class: null
            navigateIds:
              - {}
              - media_content_type: favorites
                media_content_id: ""
              - media_content_type: favorites_folder
                media_content_id: object.item.audioItem.audioBroadcast
          data:
            media_content_id: FV:2/20
            media_content_type: favorite_item_id
          target:
            entity_id: media_player.woonkamer_sonos

    # De trigger-entiteit komt van de samsungtv-integratie, die aan/uit over het
    # netwerk polt. Reageert de tv even niet - een netwerkhik, of de verbinding
    # die na een herstart van HA opnieuw moet opbouwen - dan zet die integratie
    # hem op `off` in plaats van `unavailable`. Op 2026-08-07 om 13:47 gebeurde
    # dat midden in een PS5-sessie: negen seconden "uit", en de radio ging aan
    # in een kamer waar iemand zat te gamen.
    #
    # Vandaar de drie remmen hieronder. `for` filtert de korte blips weg (een
    # echte tv-uit blijft uit), `not_from` vangt de herstart-overgang af net
    # zoals bij `livingroom_tv_volume_reset`, en de PS5-conditie zorgt dat een
    # gamesessie sowieso nooit de muziek aanzet - ook niet als de tv-entiteit
    # langer dan twee minuten de weg kwijt is.
    - id: play_music_tv_off
      alias: General - Music Play Default TV Off
      description: "When TV is turned off; play default music"
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - media_player.woonkamer_77_oled_3
          to: "off"
          not_from:
            - unknown
            - unavailable
          for: "00:02:00"
      conditions:
        - condition: and
          conditions:
            - condition: time
              before: input_datetime.bedtime_maxi_1h_off
            - condition: time
              before: input_datetime.bedtime_mini_1h_off
            - condition: sun
              after: sunrise
            - alias: Niet terwijl er op de PS5 gespeeld wordt
              condition: not
              conditions:
                - condition: state
                  entity_id: media_player.playstation_5
                  state: playing
      actions:
        - action: automation.trigger
          metadata: {}
          data:
            skip_condition: true
          target:
            entity_id: automation.general_play_default_music

    - id: "music_stop_gone"
      alias: General - Music Stop Everyone Gone
      description: "When alarm is turned on or lock is locked stop music everywhere"
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - alarm_control_panel.alarmo
          to: armed_away
          id: armed_away
        - trigger: state
          entity_id:
            - alarm_control_panel.alarmo
          to: armed_home
          id: armed_home
        - trigger: state
          entity_id:
            - lock.kroon18voordeur
          to: locked
          id: locked
          for:
            hours: 0
            minutes: 1
            seconds: 0
      conditions:
        - condition: not
          conditions:
            - condition: state
              entity_id: group.all_adults
              state: home
      actions:
        - action: media_player.media_stop
          metadata: {}
          data: {}
          target:
            entity_id: group.all_sonos
          alias: Turn off all media

    ###########################################################################
    ## MUZIEK UIT ALS WIJ NAAR BED GAAN
    ##
    ## `music_stop_gone` hierboven dekt maar één helft: zijn conditie is
    ## letterlijk "geen volwassene thuis". Gaan wij zélf naar bed, dan valt de
    ## avondroutine daar buiten en blijft de radio gewoon doorspelen.
    ##
    ## Dat is de nacht van 26 op 27 augustus 2026 ook precies gebeurd. Om
    ## 22:04:55 zette de slaapkamerknop het alarm op armed_home (logbook:
    ## context `Bedroom - Buttons pressed`, event `huis_routine`), en om 07:40
    ## de volgende ochtend stonden woonkamer, keuken, keuken 2 en kantoor nog
    ## steeds op `playing` met Qmusic - onafgebroken sinds 20:00:53, dus ruim
    ## elf uur. Dat het niemand wakker heeft gehouden komt alleen doordat ze
    ## alle vier op volume 0.05 stonden; dat is geen vangnet waar je op kunt
    ## bouwen, want de Sonos-app draait dat zo weer omhoog.
    ##
    ## WAAROM HET EVENT EN NIET HET ALARM
    ## `huis_routine` met `routine: avond` is het huisbrede naar-bed-signaal uit
    ## packages/1 - First Floor/Bedroom/Buttons.yaml, en de haak waar de lampen,
    ## de rolluiken en de airco ook al aan hangen. Op `armed_home` triggeren zou
    ## een tweede definitie van "nacht" opleveren naast die ene - en armed_home
    ## gaat ook aan als je 's middags de tuin in loopt. Het bestaande
    ## `music_stop_gone` blijft daarom staan zoals het is: dat gaat over een
    ## leeg huis, deze over een slapend huis.
    ##
    ## ALLE ELF, OOK DE KINDERKAMERS
    ## De twee kinderkamers stoppen zichzelf al op hun eigen bedtijd (de
    ## `bedtime_for_*_media_off`-automatiseringen), maar die ronde ligt uren
    ## eerder; wat daarna nog is aangezet hoort hier alsnog uit. Dit gebruikt
    ## `group.all_sonos` uit dit bestand, dezelfde lijst als music_stop_gone,
    ## zodat er één plek blijft waar staat welke speakers er zijn.
    ##
    ## STOPPEN, NIET LOSKOPPELEN
    ## `media_stop` naar een speaker die in een groep zit gaat naar de
    ## groepsleider (zie de volgorde-noot in packages/2 - Second Floor/Bedroom
    ## Mini/Bedtime.yaml). Daar loop je hier niet tegenaan maar profiteer je
    ## juist van: één stil huis, of je nou de leider of een lid raakt. De groep
    ## zelf blijft staan zoals hij stond - `play_music` haalt de overkapping en
    ## de slapende kinderkamers 's ochtends zelf weer uit de woonkamergroep.
    ##
    ## `media_stop` en niet `media_pause`: een gepauzeerde Sonos houdt titel en
    ## artwork vast en toont op het Overzicht-dashboard dus nog steeds muziek in
    ## een huis dat slaapt. Met stop gaat hij naar `idle` en is de kaart leeg -
    ## dezelfde afweging als bij Mini hierboven.
    ###########################################################################
    - id: music_stop_bedtime
      alias: General - Music Stop Bedtime
      description: >-
        Stopt alle Sonos-spelers zodra de avondroutine van de slaapkamerknop
        loopt, zodat er 's nachts niets doorspeelt terwijl wij liggen te slapen.
      mode: single
      max_exceeded: silent
      triggers:
        - trigger: event
          event_type: huis_routine
          event_data:
            routine: avond
      conditions: []
      actions:
        # Eén speaker die net offline is mag de andere tien niet tegenhouden;
        # zelfde reden als bij de omroep in Bathroom/Media.yaml.
        - alias: Alle Sonos-spelers stoppen
          action: media_player.media_stop
          continue_on_error: true
          data: {}
          target:
            entity_id: group.all_sonos
