music_package:
  group:
    all_sonos:
      name: Alle Sonos speakers
      icon: mdi:speaker-group
      entities:
        - media_player.badkamer_sonos
        - media_player.garage_sonos
        - media_player.keuken_sonos
        - media_player.keuken_sonos_2
        - media_player.kantoor_sonos
        - media_player.overkapping_sonos
        - media_player.slaapkamer_mini_sonos
        - media_player.slaapkamer_maxi_sonos
        - media_player.speelkamer_sonos
        - media_player.toilet_sonos
        - media_player.woonkamer_sonos

    all_sonos_secondary:
      name: Alle Sonos speakers (zonder woonkamer)
      icon: mdi:speaker-group
      entities:
        - media_player.badkamer_sonos
        - media_player.garage_sonos
        - media_player.keuken_sonos
        - media_player.keuken_sonos_2
        - media_player.kantoor_sonos
        - media_player.overkapping_sonos
        - media_player.slaapkamer_mini_sonos
        - media_player.slaapkamer_maxi_sonos
        - media_player.speelkamer_sonos
        - media_player.toilet_sonos

  automation:
    # LET OP: het entity_id van deze automatisering is
    # automation.general_play_default_music en volgt hier NIET de alias. Hij is
    # ooit in de UI hernoemd, en de entity registry wint van de alias-slug.
    # Niet "corrigeren" naar general_music_play_default - dan breekt de
    # Q-Music-knop op het dashboard en de trigger in Music Play Default TV Off.
    - id: play_music
      alias: General - Music Play Default
      description: Play default music automation
      mode: single
      triggers:
        - trigger: time
          at: "09:00:00"
        - trigger: state
          entity_id:
            - light.woonkamer_lampen
          to: "on"
          id: lights_on
      conditions:
        - condition: state
          entity_id: group.all_adults
          state: home
        - condition: not
          conditions:
            - condition: state
              entity_id: media_player.woonkamer_sonos
              state: playing
          alias: Als Sonos niet al speelt
        - alias: Als het niet te vroeg of te laat is
          condition: not
          conditions:
            - alias: Doordeweeks of weekend
              condition: or
              conditions:
                - alias: Doordeweeks
                  condition: and
                  conditions:
                    - condition: time
                      weekday:
                        - mon
                        - tue
                        - wed
                        - thu
                        - fri
                    - condition: or
                      conditions:
                        - condition: time
                          after: input_datetime.bedtime_maxi_1h_off
                        - condition: time
                          after: input_datetime.bedtime_mini_1h_off
                        - condition: time
                          before: "08:30:00"
                      alias: Bekijk de tijd
                - alias: In het weekend
                  condition: and
                  conditions:
                    - condition: time
                      weekday:
                        - sat
                        - sun
                    - condition: or
                      conditions:
                        - condition: time
                          after: input_datetime.bedtime_maxi_1h_off
                        - condition: time
                          after: input_datetime.bedtime_mini_1h_off
                        - condition: time
                          before: "09:00:00"
                      alias: Bekijk de tijd
      actions:
        - action: media_player.volume_set
          metadata: {}
          data:
            volume_level: 0.05
          target:
            entity_id:
              - media_player.badkamer_sonos
              - media_player.garage_sonos
              - media_player.keuken_sonos
              - media_player.keuken_sonos_2
              - media_player.kantoor_sonos
              - media_player.slaapkamer_mini_sonos
              - media_player.slaapkamer_maxi_sonos
              - media_player.speelkamer_sonos
              - media_player.woonkamer_sonos
        # Eerst groeperen, dan pas afspelen. Andersom was het jarenlang de
        # oorzaak van "de radio staat maar in de helft van het huis aan".
        #
        # `media_player.join` wacht bij Sonos tot de groep exact zo is als
        # gevraagd (HA vergelijkt de verzamelingen letterlijk) en geeft het na
        # 30 seconden op. Belangrijker: bij die timeout breekt HA de hele
        # groepeeractie af, dus alle speakers die nog aan de beurt moesten
        # komen blijven stil achter.
        #
        # En wie veranderde die groep tussendoor? Deze automatisering zelf.
        # `play_media` zette de woonkamer op `playing`, drie seconden later
        # triggerde `Kitchen - Media` daarop en joinde de twee keukenspeakers -
        # midden in het wachten hierboven. Verzameling wijkt af, 30 seconden
        # wachten, foutmelding, rest van het huis stil. Zo ging het op
        # 2026-08-07 om 13:47 en 13:58.
        #
        # Door eerst te joinen is de groep al compleet voordat er geluid is.
        # `Kitchen - Media` en de kamers op `blueprints/.../sonos_motion_join`
        # slaan dan over, want hun speaker is dan geen `idle` meer.
        #
        # `continue_on_error` hoort bij die omdraaiing: loopt het groeperen
        # alsnog vast, dan mag dat de muziek niet tegenhouden. De fout blijft
        # gewoon in de trace staan.
        - action: media_player.join
          continue_on_error: true
          metadata: {}
          data:
            # De woonkamer staat hier bewust niet tussen: dat is de
            # groepsleider (het `target` hieronder), niet iemand die zich bij
            # zichzelf aansluit.
            group_members:
              - media_player.garage_sonos
              - media_player.speelkamer_sonos
              - media_player.kantoor_sonos
              - media_player.slaapkamer_maxi_sonos
              - media_player.slaapkamer_mini_sonos
              - media_player.keuken_sonos
              - media_player.keuken_sonos_2
          target:
            entity_id: media_player.woonkamer_sonos
        - action: media_player.play_media
          metadata:
            title: Qmusic
            thumbnail: http://cdn-radiotime-logos.tunein.com/s87683q.png
            media_class: genre
            children_media_class: null
            navigateIds:
              - {}
              - media_content_type: favorites
                media_content_id: ""
              - media_content_type: favorites_folder
                media_content_id: object.item.audioItem.audioBroadcast
          data:
            media_content_id: FV:2/20
            media_content_type: favorite_item_id
          target:
            entity_id: media_player.woonkamer_sonos

    # De trigger-entiteit komt van de samsungtv-integratie, die aan/uit over het
    # netwerk polt. Reageert de tv even niet - een netwerkhik, of de verbinding
    # die na een herstart van HA opnieuw moet opbouwen - dan zet die integratie
    # hem op `off` in plaats van `unavailable`. Op 2026-08-07 om 13:47 gebeurde
    # dat midden in een PS5-sessie: negen seconden "uit", en de radio ging aan
    # in een kamer waar iemand zat te gamen.
    #
    # Vandaar de drie remmen hieronder. `for` filtert de korte blips weg (een
    # echte tv-uit blijft uit), `not_from` vangt de herstart-overgang af net
    # zoals bij `livingroom_tv_volume_reset`, en de PS5-conditie zorgt dat een
    # gamesessie sowieso nooit de muziek aanzet - ook niet als de tv-entiteit
    # langer dan twee minuten de weg kwijt is.
    - id: play_music_tv_off
      alias: General - Music Play Default TV Off
      description: "When TV is turned off; play default music"
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - media_player.woonkamer_77_oled_3
          to: "off"
          not_from:
            - unknown
            - unavailable
          for: "00:02:00"
      conditions:
        - condition: and
          conditions:
            - condition: time
              before: input_datetime.bedtime_maxi_1h_off
            - condition: time
              before: input_datetime.bedtime_mini_1h_off
            - condition: sun
              after: sunrise
            - alias: Niet terwijl er op de PS5 gespeeld wordt
              condition: not
              conditions:
                - condition: state
                  entity_id: media_player.playstation_5
                  state: playing
      actions:
        - action: automation.trigger
          metadata: {}
          data:
            skip_condition: true
          target:
            entity_id: automation.general_play_default_music

    - id: "music_stop_gone"
      alias: General - Music Stop Everyone Gone
      description: "When alarm is turned on or lock is locked stop music everywhere"
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - alarm_control_panel.alarmo
          to: armed_away
          id: armed_away
        - trigger: state
          entity_id:
            - alarm_control_panel.alarmo
          to: armed_home
          id: armed_home
        - trigger: state
          entity_id:
            - lock.kroon18voordeur
          to: locked
          id: locked
          for:
            hours: 0
            minutes: 1
            seconds: 0
      conditions:
        - condition: not
          conditions:
            - condition: state
              entity_id: group.all_adults
              state: home
      actions:
        - action: media_player.media_stop
          metadata: {}
          data: {}
          target:
            entity_id: group.all_sonos
          alias: Turn off all media
