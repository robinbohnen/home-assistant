# sensor.slimhuys_zonneplan_tariefniveau_nu kent VIJF niveaus:
# very_low | low | medium | high | very_high. Deze automation luisterde alleen
# op low/medium/high, waardoor een sprong van medium naar very_low geen enkele
# trigger raakte: de batterij begon dan juist op het allergoedkoopste moment
# niet te laden. very_low telt daarom als low en very_high als high.
battery_package:

  input_number:
    # Geen `initial:`: dat zet je eigen instelling bij elke herstart terug.
    # Een input_number zonder opgeslagen waarde start op zijn minimum, dus het
    # minimum is hier bewust een waarde waarmee je veilig zit.
    batterij_min_soc:
      name: "Batterij - Niet verder ontladen dan"
      icon: mdi:battery-low
      min: 10
      max: 90
      step: 5
      unit_of_measurement: "%"
      mode: box

  automation:
    - id: battery_disable_charging
      alias: Battery - Disable charging when no low pricing
      description: Change modes on battery when needed; to create low charing points
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - sensor.slimhuys_zonneplan_tariefniveau_nu
          to:
            - very_low
            - low
          id: low_price
        - trigger: time
          at: "06:00:00"
          id: morning
        - trigger: time
          at: "12:00:00"
          id: afternoon
        - trigger: state
          entity_id:
            - sensor.slimhuys_zonneplan_tariefniveau_nu
          to:
            - high
            - very_high
          id: high_price
        - trigger: state
          entity_id:
            - sensor.slimhuys_zonneplan_tariefniveau_nu
          to: medium
          id: medium_price
        # Vangnetten voor het geforceerd ontladen, zie de laatste tak.
        - trigger: numeric_state
          entity_id: sensor.lilygo_rs485_marstek_battery_state_of_charge
          below: input_number.batterij_min_soc
          id: soc_leeg
        # Let op de sensornaam: ..._negatieve_ALL_IN_prijs_nu, niet
        # ..._negatieve_prijs_nu. Die laatste kijkt naar de kale marktprijs,
        # terwijl teruglevering het hele tarief oplevert (markt + inkoop +
        # energiebelasting + btw). Bij een licht negatieve marktprijs krijgen we
        # nog gewoon geld terug; pas onder nul totaal kost ontladen ons geld.
        # SlimHuys rekent dat sinds 2026-08-06 zelf uit, dus die vergelijking
        # staat hier niet meer met de hand.
        - trigger: state
          entity_id: binary_sensor.meterkast_slimhuys_zonneplan_negatieve_all_in_prijs_nu
          to: "on"
          # Na een herstart komt een binary sensor via `unknown`
          # binnen; zonder deze guard telt dat als een echte
          # prijswissel en gaat de tak eronder onnodig lopen.
          not_from:
            - unknown
            - unavailable
          id: prijs_negatief
        - trigger: state
          entity_id: sensor.slimhuys_zonneplan_tariefniveau_nu
          to:
            - unknown
            - unavailable
          for: "00:15:00"
          id: tarief_weg
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - low_price
              sequence:
                - action: select.select_option
                  metadata: {}
                  data:
                    option: disable
                  target:
                    entity_id: select.lilygo_rs485_marstek_rs485_control_mode
              alias: Low price; start charging
            - conditions:
                - condition: trigger
                  id:
                    - morning
                - condition: numeric_state
                  entity_id: sensor.forecast_solar_production_today
                  above: 20
                - condition: state
                  entity_id: select.lilygo_rs485_marstek_rs485_control_mode
                  state: disable
              sequence:
                - action: select.select_option
                  metadata: {}
                  data:
                    option: enable
                  target:
                    entity_id: select.lilygo_rs485_marstek_rs485_control_mode
                - action: select.select_option
                  metadata: {}
                  data:
                    option: stop
                  target:
                    entity_id: select.lilygo_rs485_marstek_forcible_charge_discharge
              alias: Morning and forecast is positive; charge later on
            - conditions:
                - condition: trigger
                  id:
                    - afternoon
              sequence:
                - action: select.select_option
                  metadata: {}
                  data:
                    option: disable
                  target:
                    entity_id: select.lilygo_rs485_marstek_rs485_control_mode
              alias: Afternoon; start own program
            - conditions:
                - condition: trigger
                  id:
                    - medium_price
                - condition: state
                  entity_id: select.lilygo_rs485_marstek_rs485_control_mode
                  state: enable
              sequence:
                - action: select.select_option
                  metadata: {}
                  data:
                    option: disable
                  target:
                    entity_id: select.lilygo_rs485_marstek_rs485_control_mode
              alias: Medium price; start own program
            - conditions:
                - condition: trigger
                  id:
                    - high_price
                # Niet onder de ondergrens leegtrekken: geforceerd ontladen
                # stopt hier niet uit zichzelf, dus zonder deze conditie loopt
                # de batterij bij een lange dure periode helemaal leeg en staat
                # er 's avonds niets meer om mee te overbruggen.
                - condition: numeric_state
                  entity_id: sensor.lilygo_rs485_marstek_battery_state_of_charge
                  above: input_number.batterij_min_soc
                # Bij een negatief totaaltarief kost teruglevering geld. "Hoog
                # tarief" en "negatieve prijs" kunnen tegelijk voorkomen doordat
                # het niveau over de dag wordt bepaald en de prijs per kwartier.
                # Staat de sensor op `unavailable`, dan is dit niet 'off' en
                # ontladen we dus niet - dezelfde veilige kant als voorheen.
                - condition: state
                  entity_id: binary_sensor.meterkast_slimhuys_zonneplan_negatieve_all_in_prijs_nu
                  state: "off"
              sequence:
                - action: select.select_option
                  metadata: {}
                  data:
                    option: enable
                  target:
                    entity_id: select.lilygo_rs485_marstek_rs485_control_mode
                - action: select.select_option
                  metadata: {}
                  data:
                    option: discharge
                  target:
                    entity_id: select.lilygo_rs485_marstek_forcible_charge_discharge
                - action: number.set_value
                  metadata: {}
                  data:
                    value: "2500"
                  target:
                    entity_id: number.lilygo_rs485_marstek_forcible_discharge_power
              alias: High price; discharge
            # Vangnet. Geforceerd ontladen blijft staan tot een volgende
            # trigger het omzet, en die komt niet meer als de tariefsensor
            # wegvalt: dan blijft de batterij leegtrekken zonder dat er nog
            # iets meekijkt. Hetzelfde geldt zodra de ondergrens bereikt is of
            # de prijs negatief wordt. Terug naar het eigen programma van de
            # batterij is in al die gevallen de veilige stand.
            - conditions:
                - condition: trigger
                  id:
                    - soc_leeg
                    - prijs_negatief
                    - tarief_weg
                - condition: state
                  entity_id: select.lilygo_rs485_marstek_forcible_charge_discharge
                  state: discharge
              sequence:
                - action: select.select_option
                  metadata: {}
                  data:
                    option: stop
                  target:
                    entity_id: select.lilygo_rs485_marstek_forcible_charge_discharge
                - action: select.select_option
                  metadata: {}
                  data:
                    option: disable
                  target:
                    entity_id: select.lilygo_rs485_marstek_rs485_control_mode
                - action: logbook.log
                  data:
                    name: Batterij
                    message: >-
                      Geforceerd ontladen gestopt:
                      {{ 'ondergrens bereikt' if trigger.id == 'soc_leeg'
                         else ('negatieve prijs' if trigger.id == 'prijs_negatief'
                         else 'tariefniveau niet beschikbaar') }}.
              alias: Stop discharging; guard tripped
