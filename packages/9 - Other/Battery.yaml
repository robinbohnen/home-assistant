##############################################################################
## TWEE REGIMES, NOOIT TEGELIJK
##
## Standaard stuurt `battery_disable_charging` hieronder op het GROVE
## tariefniveau van de dag (very_low..very_high). Sinds 2026-08-14 kan het ook
## op de KWARTIERBLOKKEN van SlimHuys: dan laadt de accu in de N goedkoopste
## kwartieren van de komende 24 uur en ontlaadt hij in de M duurste, in plaats
## van in een hele "dure periode".
##
## `input_boolean.batterij_kwartierregie` bepaalt wie de baas is. Staat hij
## aan, dan slaan alle prijs-takken van de oude automatisering over (zie de
## conditie die daar bij elke tak staat) en stuurt `battery_kwartierregie`.
## Het vangnet onderaan de oude automatisering blijft in BEIDE regimes lopen -
## dat is de rem die geforceerd ontladen stopt bij een lege accu, een negatieve
## prijs of een weggevallen tariefsensor, en die hoort nooit uit te staan.
##
## De schakelaar staat na aanmaken UIT. Dit stuurt echte hardware op prijzen
## die per dag verschillen; eerst een dag meekijken op de kaart is verstandiger
## dan hem blind aanzetten.
##
## LET OP bij het oude regime: sensor.slimhuys_zonneplan_tariefniveau_nu kent
## VIJF niveaus (very_low | low | medium | high | very_high). De automatisering
## luisterde ooit alleen op low/medium/high, waardoor een sprong van medium
## naar very_low geen enkele trigger raakte: de accu begon dan juist op het
## allergoedkoopste moment niet te laden. very_low telt daarom als low en
## very_high als high.
##############################################################################

battery_package:

  input_boolean:
    batterij_kwartierregie:
      name: "Batterij - Sturen op kwartierprijzen"
      icon: mdi:chart-timeline-variant

  input_number:
    # Geen `initial:`: dat zet je eigen instelling bij elke herstart terug.
    # Een input_number zonder opgeslagen waarde start op zijn minimum, dus het
    # minimum is hier bewust een waarde waarmee je veilig zit.
    batterij_min_soc:
      name: "Batterij - Niet verder ontladen dan"
      icon: mdi:battery-low
      min: 10
      max: 90
      step: 5
      unit_of_measurement: "%"
      mode: box

    # Aantal kwartierblokken uit de komende 24 uur. Vier blokken = één uur.
    # Ook hier geen `initial:`, dus ze starten op hun minimum: één uur laden en
    # één uur ontladen per etmaal is de voorzichtige kant.
    batterij_laad_kwartieren:
      name: "Batterij - Laden in de X goedkoopste kwartieren"
      icon: mdi:battery-arrow-up
      min: 4
      max: 40
      step: 4
      unit_of_measurement: "blokken"
      mode: box

    batterij_ontlaad_kwartieren:
      name: "Batterij - Ontladen in de X duurste kwartieren"
      icon: mdi:battery-arrow-down
      min: 4
      max: 40
      step: 4
      unit_of_measurement: "blokken"
      mode: box

    # Boven deze verwachte opbrengst slaat de regie het netladen over: de zon
    # vult de accu die dag toch wel.
    #
    # DIT IS GEEN "OPWEK MIN VERBRUIK"-SOM. Dat is geprobeerd en het klopt
    # niet: het huis gebruikt 40 kWh op een dag (mediaan over de laatste 30
    # dagen, auto er al af) en de auto komt daar op ruim een derde van de
    # dagen nog eens 23 kWh bovenop, 71% daarvan tussen 09:00 en 17:00 - dus
    # precies in het zonvenster. Reserveer je zon voor die twee, dan wordt de
    # drempel nooit gehaald en laadt een accu van 5 kWh permanent uit het net.
    #
    # Wat telt is niet de dagbalans maar het OVERSCHOT op het moment, en dat
    # is er ook op dagen dat het verbruik boven de opwek ligt. Gemeten over
    # 182 dagen, teruglevering NADAT de auto en de accu hun deel al hadden:
    #   opwek 20-30 kWh -> 7 van de 22 dagen hielden 5 kWh over
    #   opwek 30-40 kWh -> 28 van de 34
    #   opwek 40-50 kWh -> 36 van de 38
    # Het kantelpunt ligt dus rond 30 kWh ECHTE opbrengst. De forecast loopt
    # daar zo'n 25% onder (38,7 voorspeld tegen 46,7 gemeten op 13 augustus,
    # vijf dagen op rij hetzelfde beeld), dus 30 kWh VOORSPELD komt neer op
    # ~37 kWh echt: ruim in de bak waar het overschot er vrijwel altijd is.
    # Dat is bewust de voorzichtige kant - liever een keer te veel goedkoop
    # inkopen dan op een misgelopen voorspelling de avondpiek verliezen.
    #
    # Hoger zetten = vaker netladen (veiliger, duurder), lager = vaker op de
    # zon gokken. In de winter doet de drempel vanzelf zijn werk: 22 van de
    # 182 dagen hadden minder dan 1 kWh teruglevering.
    #
    # LET OP: het oude regime hieronder gebruikt nog `> 20` op
    # sensor.forecast_solar_production_today voor zijn ochtendtak. Dat is de
    # hele dag in plaats van wat er nog komt, en het staat los van deze knop.
    # Zolang de kwartierregie aan staat is die tak toch dood.
    batterij_zon_drempel:
      name: "Batterij - Niet netladen bij meer zon dan"
      icon: mdi:weather-sunny
      min: 5
      max: 50
      step: 5
      unit_of_measurement: "kWh"
      mode: box

  template:
    - trigger:
        # Kwartieren wisselen op :00, :15, :30 en :45 - allemaal veelvouden van
        # vijf, dus dit loopt nooit achter. Vaker dan nodig is hier gratis: het
        # rekenwerk is één keer door ~96 blokken.
        - trigger: time_pattern
          minutes: "/5"
        # Zonder deze staat het plan na een herstart tot het volgende
        # vijfminutenpunt op unknown, en dan zou de regie even stuurloos zijn.
        - trigger: homeassistant
          event: start
        # Nieuwe prijzen (rond 13:00 komt morgen binnen) mogen meteen mee.
        - trigger: state
          entity_id:
            - sensor.slimhuys_zonneplan_prijzen_vandaag_kwartier
            - sensor.slimhuys_zonneplan_prijzen_morgen
        # En de instellingen zelf: zonder deze stond het plan tot vijf minuten
        # lang nog op het oude aantal blokken, terwijl je net iets verschoven
        # had en op het dashboard naar de uitkomst zat te kijken.
        - trigger: state
          entity_id:
            - input_number.batterij_laad_kwartieren
            - input_number.batterij_ontlaad_kwartieren
      # Het rekenwerk staat in een `action`-variabele en niet in de sensor
      # zelf: zo wordt het één keer gedaan en lezen alle attributen dezelfde
      # uitkomst. Zelfde opzet als de advies-sensoren in Klimaat Zonwering.yaml.
      action:
        - variables:
            plan: >-
              {#- Een blok mag tot 24 uur vooruit liggen, dus alleen "12:45"
                  tonen is misleidend: op 14 augustus om 15:58 lagen de zes
                  goedkoopste blokken allemaal de volgende middag, en dan lijkt
                  het net alsof het laadmoment al voorbij is. Verder dan morgen
                  kan het venster niet reiken, dus één woord volstaat. -#}
              {%- macro tijdstip(blok) -%}
                {%- if blok is none -%}-
                {%- elif blok.start.date() == now().date() -%}{{ blok.start.strftime('%H:%M') }}
                {%- else -%}morgen {{ blok.start.strftime('%H:%M') }}
                {%- endif -%}
              {%- endmacro -%}
              {#- De kwartierblokken, met de uurblokken als terugval en de
                  blokken van morgen erbij zodat het rond middernacht klopt.
                  Zelfde bronvolgorde als sensor.stroomprijs_volgend_uur in
                  Stroomprijs.yaml. -#}
              {%- set kw = state_attr('sensor.slimhuys_zonneplan_prijzen_vandaag_kwartier', 'raw_today') -%}
              {%- set vandaag = kw if kw else (state_attr('sensor.slimhuys_zonneplan_prijzen_vandaag', 'raw_today') or []) -%}
              {%- set morgen = state_attr('sensor.slimhuys_zonneplan_prijzen_morgen', 'raw_tomorrow') or [] -%}
              {%- set ns = namespace(v=[]) -%}
              {%- for b in (vandaag + morgen) -%}
                {%- set s = b.start | as_datetime -%}
                {%- set e = b.end | as_datetime -%}
                {#- Alleen wat nog komt (of nu loopt), en niet verder dan een
                    etmaal vooruit: anders zou "de goedkoopste vier blokken"
                    op een dag met morgen erbij ineens over 48 uur gaan. -#}
                {%- if s is not none and e is not none
                       and e > now() and s < now() + timedelta(hours=24) -%}
                  {%- set ns.v = ns.v + [{'start': s, 'end': e, 'value': b.value | float(0)}] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set prijzen = ns.v | map(attribute='value') | list -%}
              {%- set spreiding = (prijzen | max - prijzen | min) if prijzen else 0 -%}
              {#- DE SETS MOGEN ELKAAR NOOIT RAKEN. Vraag je 40 laad- en 40
                  ontlaadblokken terwijl er nog maar 55 blokken over zijn, dan
                  zit hetzelfde kwartier in allebei: de laadgrens komt dan
                  BOVEN de ontlaadgrens te liggen en de accu zou duur laden en
                  goedkoop ontladen. Elke kant krijgt daarom hoogstens de helft
                  van wat er ligt, waarmee "de goedkoopste k" en "de duurste m"
                  per definitie los van elkaar staan. Aan het eind van de dag
                  slinken beide sets dus vanzelf mee. -#}
              {%- set helft = (ns.v | count) // 2 -%}
              {%- set n_laad = [states('input_number.batterij_laad_kwartieren') | int(4), helft] | min -%}
              {%- set n_ontlaad = [states('input_number.batterij_ontlaad_kwartieren') | int(4), helft] | min -%}
              {%- set oplopend = ns.v | sort(attribute='value') -%}
              {%- set laadset = oplopend[:n_laad] -%}
              {%- set ontlaadset = (oplopend | reverse | list)[:n_ontlaad] -%}
              {%- set laad_starts = laadset | map(attribute='start') | list -%}
              {%- set ontlaad_starts = ontlaadset | map(attribute='start') | list -%}
              {#- Overal `lijst[0] if lijst else none` en NIET `| first`: die
                  filter gooit "No first item, sequence was empty" zodra de
                  lijst leeg is, en dat gebeurt gewoon in de praktijk - later
                  op de avond zijn alle goedkope blokken van het venster al
                  voorbij en is er geen volgend laadblok meer. Dan zou het hele
                  plan op unavailable vallen precies als de accu nog moet
                  ontladen. -#}
              {%- set nu_lijst = ns.v | selectattr('start', 'le', now())
                                      | selectattr('end', 'gt', now()) | list -%}
              {%- set nu_blok = nu_lijst[0] if nu_lijst else none -%}
              {%- set laad_komt = laadset | sort(attribute='start')
                                  | selectattr('start', 'gt', now()) | list -%}
              {%- set komende_laad = laad_komt[0] if laad_komt else none -%}
              {%- set ontlaad_komt = ontlaadset | sort(attribute='start')
                                     | selectattr('start', 'gt', now()) | list -%}
              {%- set komende_ontlaad = ontlaad_komt[0] if ontlaad_komt else none -%}

              {#- ================= VULLEN VÓÓR DE PIEK =================
                  De zes goedkoopste blokken van het venster zeggen niets over
                  de VOLGORDE. Op 14 augustus lagen ze allemaal de volgende
                  middag, terwijl de dure blokken diezelfde avond kwamen: het
                  plan was dus "vanavond leegtrekken en morgenmiddag weer
                  vullen", zonder ooit te vragen of er genoeg in zat om die
                  avond te halen. Dat was het niet - 3,08 kWh bruikbaar tegen
                  3,60 kWh aan ontlaadblokken.
                  Hieronder wordt dat tekort uitgerekend en aangevuld met de
                  goedkoopste blokken die VOOR de piek liggen. Alles hier komt
                  uit het apparaat zelf (vermogens, vloer, capaciteit), zodat
                  een andere accu of een gewijzigde instelling meeverandert. -#}
              {%- set p_laad = states('number.lilygo_rs485_marstek_max_charge_power') | float(2500) -%}
              {%- set p_ontlaad = states('number.lilygo_rs485_marstek_max_discharge_power') | float(800) -%}
              {%- set soc = states('sensor.lilygo_rs485_marstek_battery_state_of_charge') | float(0) -%}
              {%- set rest_kwh = states('sensor.lilygo_rs485_marstek_battery_remaining_capacity') | float(0) -%}
              {#- Capaciteit uit de accu zelf afleiden; onder de 5% is die deling
                  te grof, dan de nominale 5,12 kWh van dit apparaat. -#}
              {%- set cap = (rest_kwh / (soc / 100)) if soc > 5 and rest_kwh > 0 else 5.12 -%}
              {#- De vloer is de hoogste van twee: onze eigen ondergrens en die
                  van het apparaat. Het apparaat stopt sowieso, dus daaronder
                  rekenen zou een tekort verzinnen dat niet bestaat. -#}
              {%- set vloer = [states('input_number.batterij_min_soc') | float(10),
                               states('number.lilygo_rs485_marstek_discharging_cutoff_capacity') | float(12)] | max -%}
              {%- set beschikbaar = [((soc - vloer) / 100) * cap, 0] | max -%}
              {#- De piek die als eerste aan de beurt is: alle ontlaadblokken
                  tot aan het eerstvolgende gewone laadblok. Wat daarna komt
                  wordt door dát laadblok bediend en telt hier niet mee. -#}
              {%- set grens = komende_laad.start if komende_laad is not none
                              else (ns.v | map(attribute='start') | max) -%}
              {%- set piek = ontlaadset | sort(attribute='start')
                             | selectattr('start', 'lt', grens) | list -%}
              {%- set nodig = (piek | count) * (p_ontlaad / 1000) * 0.25 -%}
              {%- set tekort = nodig - beschikbaar -%}
              {#- Kopen om te verkopen loont alleen met marge: een retourtje
                  door de accu kost rendement, dus 5 cent onder de ontlaadgrens
                  is de ondergrens van de moeite. -#}
              {%- set plafond = (ontlaadset | map(attribute='value') | min | default(0, true)) - 0.05 -%}
              {%- set eerste_piek = piek[0].start if piek else grens -%}
              {%- set kandidaten = ns.v | sort(attribute='value')
                                   | selectattr('start', 'lt', eerste_piek)
                                   | rejectattr('start', 'in', laad_starts)
                                   | selectattr('value', 'lt', plafond) | list -%}
              {%- set aantal = ((tekort / ((p_laad / 1000) * 0.25)) | round(0, 'ceil') | int)
                               if tekort > 0 else 0 -%}
              {%- set bijvul = kandidaten[:aantal] if aantal > 0 else [] -%}
              {%- set bijvul_starts = bijvul | map(attribute='start') | list -%}
              {%- if not ns.v or nu_blok is none -%}
                {%- set stand = 'rust' -%}
                {%- set reden = 'geen prijsblokken beschikbaar' -%}
              {#- Een vlakke dag is de slijtage niet waard: onder 2 cent
                  verschil valt er niets te verdienen en laadt de accu heen en
                  weer voor niets. Zelfde ondergrens als de driedeling in
                  Stroomprijs.yaml. -#}
              {%- elif spreiding < 0.02 -%}
                {%- set stand = 'rust' -%}
                {%- set reden = 'vlakke prijs, minder dan 2 cent verschil' -%}
              {%- elif nu_blok.start in laad_starts -%}
                {%- set stand = 'laden' -%}
                {%- set reden = 'een van de ' ~ n_laad ~ ' goedkoopste kwartieren' -%}
              {#- Vóór de ontlaadset kijken: een bijvulblok is per definitie
                  goedkoper dan de piek die hij bedient, dus deze twee kunnen
                  elkaar niet overlappen. -#}
              {%- elif nu_blok.start in bijvul_starts -%}
                {%- set stand = 'laden' -%}
                {%- set reden = 'bijvullen voor de piek, ' ~ (tekort | round(1)) ~ ' kWh tekort' -%}
              {%- elif nu_blok.start in ontlaad_starts -%}
                {%- set stand = 'ontladen' -%}
                {%- set reden = 'een van de ' ~ n_ontlaad ~ ' duurste kwartieren' -%}
              {%- else -%}
                {%- set stand = 'rust' -%}
                {%- set reden = 'gewoon tarief' -%}
              {%- endif -%}
              {{ {'stand': stand,
                  'reden': reden,
                  'blokken': ns.v | count,
                  'prijs_nu': (nu_blok.value | round(4)) if nu_blok is not none else none,
                  'laad_grens': (laadset | map(attribute='value') | max | round(4)) if laadset else none,
                  'ontlaad_grens': (ontlaadset | map(attribute='value') | min | round(4)) if ontlaadset else none,
                  'volgend_laadblok': tijdstip(komende_laad) | trim,
                  'volgend_ontlaadblok': tijdstip(komende_ontlaad) | trim,
                  'piek_blokken': piek | count,
                  'piek_nodig': nodig | round(2),
                  'accu_beschikbaar': beschikbaar | round(2),
                  'bijvul_blokken': bijvul | count,
                  'bijvul_vanaf': tijdstip(bijvul | sort(attribute='start') | first
                                           if bijvul else none) | trim} }}

      sensor:
        - name: "Batterij kwartierplan"
          unique_id: batterij_kwartierplan
          icon: mdi:chart-timeline-variant
          # `laden` | `ontladen` | `rust` voor het kwartier waar we NU in
          # zitten. De automatisering eronder doet er iets mee; deze sensor
          # weet niets van de accu zelf en is dus ook los te lezen op het
          # dashboard voordat je de regie aanzet.
          state: "{{ plan.stand }}"
          attributes:
            reden: "{{ plan.reden }}"
            prijs_nu: "{{ plan.prijs_nu }}"
            laad_grens: "{{ plan.laad_grens }}"
            ontlaad_grens: "{{ plan.ontlaad_grens }}"
            volgend_laadblok: "{{ plan.volgend_laadblok }}"
            volgend_ontlaadblok: "{{ plan.volgend_ontlaadblok }}"
            blokken_bekend: "{{ plan.blokken }}"

  automation:
    ###########################################################################
    ## Kwartierregie: laden in de goedkoopste blokken, ontladen in de duurste
    ###########################################################################
    # Stuurt op sensor.batterij_kwartierplan. Dezelfde drie service-calls als
    # de oude automatisering hieronder gebruikt, zodat er maar één manier is
    # waarop deze accu bediend wordt:
    #   eigen programma  = control_mode disable
    #   geforceerd       = control_mode enable + forcible charge/discharge
    - id: battery_kwartierregie
      alias: Battery - Sturen op kwartierprijzen
      description: >-
        Laadt de thuisaccu in de goedkoopste kwartieren van de komende 24 uur
        en ontlaadt hem in de duurste. Alleen actief als
        input_boolean.batterij_kwartierregie aan staat; de prijs-takken van
        "Disable charging when no low pricing" slaan dan over.
      mode: single
      max_exceeded: silent
      triggers:
        - trigger: state
          entity_id: sensor.batterij_kwartierplan
          # Een herstart brengt de sensor via unknown binnen; dat is geen
          # nieuwe stand maar dezelfde ronde opnieuw.
          not_from:
            - unknown
            - unavailable
          not_to:
            - unknown
            - unavailable
        # Aanzetten van de regie moet meteen effect hebben, anders staat de
        # accu tot het volgende kwartier nog op zijn eigen programma.
        - trigger: state
          entity_id: input_boolean.batterij_kwartierregie
          to: "on"
        # Overschot komt en gaat sneller dan een kwartier. Zonder deze trigger
        # zou een laadblok dat begon terwijl de zon leverde nooit alsnog uit
        # het net gaan laden als er een wolk voorbij komt - de tak hieronder
        # wordt alleen bij een trigger opnieuw gewogen.
        - trigger: state
          entity_id: switch.live_energieverbruik_totaal_negatief
          not_from:
            - unknown
            - unavailable
        # De zonverwachting wordt door de dag heen bijgesteld. Zonder deze
        # triggers zou een laadblok dat begon toen de voorspelling nog mager
        # was, blijven laden nadat hij is opgeschroefd (en omgekeerd).
        - trigger: state
          entity_id:
            - sensor.forecast_solar_production_today_remaining
            - sensor.forecast_solar_production_tomorrow
          not_from:
            - unknown
            - unavailable
      conditions:
        - condition: state
          entity_id: input_boolean.batterij_kwartierregie
          state: "on"
      actions:
        - choose:
            - alias: Laden in een goedkoop kwartier
              conditions:
                - condition: state
                  entity_id: sensor.batterij_kwartierplan
                  state: laden
                # Een volle accu hoeft niet geforceerd geladen te worden; de
                # 95% laat ruimte zodat hij niet om de kilowattuur aan- en
                # uitklapt rond de bovengrens.
                - condition: numeric_state
                  entity_id: sensor.lilygo_rs485_marstek_battery_state_of_charge
                  below: 95
                # NIET UIT HET NET LADEN TERWIJL DE ZON AL OVERSCHOT LEVERT.
                # De goedkope blokken liggen midden op de dag, precies wanneer
                # de panelen leveren. Geforceerd laden koopt dan stroom die we
                # net gratis het net op sturen. Staat deze vlag aan, dan valt
                # de tak door naar `default` en doet de accu zijn eigen
                # programma - en dat is anti-feed, dus die vult zich vanzelf
                # met het overschot. Zelfde bron als de gratis-stoken-regel
                # van de jacuzzi (packages/3 - Outside/Backyard/Spa.yaml).
                - condition: state
                  entity_id: switch.live_energieverbruik_totaal_negatief
                  state: "off"
                # EN NIET LADEN ALS DE ZON HET MORGEN TOCH DOET.
                # Welke voorspelling telt, hangt van de klok af:
                #   overdag en 's nachts vóór twaalven -> wat er vandaag nog
                #     moet komen (`today_remaining` is dan de hele dag)
                #   na zonsondergang -> de opbrengst van morgen
                # Zonder die splitsing zou je om 02:00 naar de verkeerde dag
                # kijken: `tomorrow` slaat dan op overmorgen-in-de-praktijk,
                # terwijl de zon die deze accu vult over een paar uur opkomt.
                # Dezelfde uur>=12-truc als in Kitchen/Covers.yaml.
                #
                # De SoC-ondergrens is het vangnet onder de voorspelling: is de
                # accu bijna leeg, dan laden we sowieso bij. Een misgelopen
                # weersverwachting kost je anders de hele avondpiek, en dat is
                # precies het uur waarvoor deze accu bedoeld is.
                - alias: Niet genoeg zon op komst, te leeg om te gokken, of bijvullen voor de piek
                  condition: template
                  value_template: >-
                    {#- WIE WINT ER VAN WIE
                        De overschot-rem hierboven blijft altijd staan: die
                        meet dat de zon op dit moment ECHT levert, en dan koop
                        je niets. Deze rem is een VOORSPELLING, en die legt het
                        af tegen een uitgerekend tekort: zegt het plan
                        "bijvullen voor de piek", dan is er een concreet aantal
                        kWh nodig voor een piek die vanavond komt, en dat weegt
                        zwaarder dan de kans dat de zon het nog doet. Het gaat
                        bovendien nooit om meer dan het tekort zelf - de
                        plansensor kiest precies genoeg blokken. -#}
                    {% if 'bijvullen' in (state_attr('sensor.batterij_kwartierplan', 'reden') | default('', true)) %}
                      {{ true }}
                    {% else %}
                    {#- BEIDE ARRAYS, niet alleen de overkapping.
                        `sensor.energy_production_*` stond hier tot 2026-08-15,
                        en dat is ondanks de generieke naam maar één van de
                        twee velden: de zolder voorzijde ontbrak, zo'n 35% van
                        de verwachting. De regie zag daardoor structureel te
                        weinig zon aankomen en kocht stroom in op dagen dat de
                        panelen het zelf deden. De optellingen staan in
                        packages/3 - Outside/Backyard/Solarpanels.yaml, naast
                        de bestaande dagtotaal-sensor.
                        Valt een van de twee bronnen weg, dan is de som
                        unavailable en levert `| float(0)` een 0 op - dat leest
                        als "geen zon op komst" en laat netladen dus toe. Dat
                        is de veilige kant: goedkoop inkopen kost geld, een
                        lege accu in de avondpiek kost meer. -#}
                    {% set na_zonsondergang = is_state('sun.sun', 'below_horizon')
                                              and now().hour >= 12 %}
                    {% set zon = states('sensor.forecast_solar_production_tomorrow') | float(0)
                                 if na_zonsondergang
                                 else states('sensor.forecast_solar_production_today_remaining') | float(0) %}
                    {% set soc = states('sensor.lilygo_rs485_marstek_battery_state_of_charge') | float(0) %}
                    {{ zon < (states('input_number.batterij_zon_drempel') | float(30))
                       or soc < 30 }}
                    {% endif %}
              sequence:
                - action: select.select_option
                  data:
                    option: enable
                  target:
                    entity_id: select.lilygo_rs485_marstek_rs485_control_mode
                - action: select.select_option
                  data:
                    option: charge
                  target:
                    entity_id: select.lilygo_rs485_marstek_forcible_charge_discharge
                # Het vermogen komt van de omvormer zelf en staat hier niet
                # hardgecodeerd: `max_charge_power` is wat dit apparaat aankan.
                # Zelfde reden als de SoC-drempel van de auto in Voice.yaml -
                # een eigen getal loopt vroeg of laat uit de pas met de
                # hardware.
                - action: number.set_value
                  data:
                    value: >-
                      {{ states('number.lilygo_rs485_marstek_max_charge_power') | float(2500) }}
                  target:
                    entity_id: number.lilygo_rs485_marstek_forcible_charge_power
            - alias: Ontladen in een duur kwartier
              conditions:
                - condition: state
                  entity_id: sensor.batterij_kwartierplan
                  state: ontladen
                # Dezelfde twee remmen als de high_price-tak hieronder: niet
                # onder de eigen ondergrens leegtrekken, en niet terugleveren
                # als het totaaltarief negatief is (dan kost dat geld). Een
                # unavailable sensor is niet 'off' en houdt dus tegen.
                - condition: numeric_state
                  entity_id: sensor.lilygo_rs485_marstek_battery_state_of_charge
                  above: input_number.batterij_min_soc
                - condition: state
                  entity_id: binary_sensor.meterkast_slimhuys_zonneplan_negatieve_all_in_prijs_nu
                  state: "off"
              sequence:
                - action: select.select_option
                  data:
                    option: enable
                  target:
                    entity_id: select.lilygo_rs485_marstek_rs485_control_mode
                - action: select.select_option
                  data:
                    option: discharge
                  target:
                    entity_id: select.lilygo_rs485_marstek_forcible_charge_discharge
                # ONTLADEN KAN MAAR 800 W OP DIT APPARAAT, LADEN 2500.
                # Hier stond `2500` hardgecodeerd; die waarde valt binnen het
                # bereik van de entiteit (0-2500) en wordt dus geaccepteerd,
                # maar de omvormer haalt hem nooit - en het overschreef de 800
                # die er met de hand in gezet was. `max_discharge_power` is de
                # echte grens en die leest de regie nu uit.
                - action: number.set_value
                  data:
                    value: >-
                      {{ states('number.lilygo_rs485_marstek_max_discharge_power') | float(800) }}
                  target:
                    entity_id: number.lilygo_rs485_marstek_forcible_discharge_power
          # Alles wat geen laad- of ontlaadblok is - inclusief een tak
          # hierboven die op zijn eigen rem stukliep - gaat terug naar het
          # eigen programma van de accu. Dat is bewust de default en niet een
          # aparte `rust`-tak: blijft er ooit een stand over die hier niet
          # genoemd staat, dan is "de accu doet het zelf" de veilige uitkomst.
          # Geen sluiproute dus, maar de enige veilige eindstand.
          default:
            - action: select.select_option
              data:
                option: stop
              target:
                entity_id: select.lilygo_rs485_marstek_forcible_charge_discharge
            - action: select.select_option
              data:
                option: disable
              target:
                entity_id: select.lilygo_rs485_marstek_rs485_control_mode

    # Zet je de regie uit terwijl hij net staat te laden of te ontladen, dan
    # blijft die geforceerde stand staan: de oude automatisering wacht op een
    # tariefwissel en die kan uren wegblijven. Terug naar het eigen programma
    # is de enige nette overdracht. Aparte automatisering en geen extra tak
    # hierboven, omdat die juist alleen mag lopen als de regie AAN staat.
    - id: battery_kwartierregie_uit
      alias: Battery - Kwartierregie uitgezet
      description: >-
        Zet de accu terug op zijn eigen programma zodra de kwartierregie uit
        gaat, zodat er geen geforceerde stand blijft hangen.
      mode: single
      triggers:
        - trigger: state
          entity_id: input_boolean.batterij_kwartierregie
          to: "off"
          not_from:
            - unknown
            - unavailable
      conditions:
        - condition: not
          conditions:
            - condition: state
              entity_id: select.lilygo_rs485_marstek_forcible_charge_discharge
              state: stop
      actions:
        - action: select.select_option
          data:
            option: stop
          target:
            entity_id: select.lilygo_rs485_marstek_forcible_charge_discharge
        - action: select.select_option
          data:
            option: disable
          target:
            entity_id: select.lilygo_rs485_marstek_rs485_control_mode
        - action: logbook.log
          data:
            name: Batterij
            message: >-
              Kwartierregie uit; accu terug op zijn eigen programma.

    - id: battery_disable_charging
      alias: Battery - Disable charging when no low pricing
      description: Change modes on battery when needed; to create low charing points
      mode: single
      triggers:
        - trigger: state
          entity_id:
            - sensor.slimhuys_zonneplan_tariefniveau_nu
          to:
            - very_low
            - low
          id: low_price
        - trigger: time
          at: "06:00:00"
          id: morning
        - trigger: time
          at: "12:00:00"
          id: afternoon
        - trigger: state
          entity_id:
            - sensor.slimhuys_zonneplan_tariefniveau_nu
          # `peak` staat erbij sinds SlimHuys dat niveau op 2026-08-23
          # introduceerde; zonder deze regel vuurt de tak niet als het tarief
          # rechtstreeks van medium naar peak springt. Tot nu toe kwam elke
          # peak uit high, dus de accu stond al goed - dit is het gat dichten,
          # geen storing repareren.
          to:
            - high
            - very_high
            - peak
          id: high_price
        - trigger: state
          entity_id:
            - sensor.slimhuys_zonneplan_tariefniveau_nu
          to: medium
          id: medium_price
        # Vangnetten voor het geforceerd ontladen, zie de laatste tak.
        - trigger: numeric_state
          entity_id: sensor.lilygo_rs485_marstek_battery_state_of_charge
          below: input_number.batterij_min_soc
          id: soc_leeg
        # Let op de sensornaam: ..._negatieve_ALL_IN_prijs_nu, niet
        # ..._negatieve_prijs_nu. Die laatste kijkt naar de kale marktprijs,
        # terwijl teruglevering het hele tarief oplevert (markt + inkoop +
        # energiebelasting + btw). Bij een licht negatieve marktprijs krijgen we
        # nog gewoon geld terug; pas onder nul totaal kost ontladen ons geld.
        # SlimHuys rekent dat sinds 2026-08-06 zelf uit, dus die vergelijking
        # staat hier niet meer met de hand.
        - trigger: state
          entity_id: binary_sensor.meterkast_slimhuys_zonneplan_negatieve_all_in_prijs_nu
          to: "on"
          # Na een herstart komt een binary sensor via `unknown`
          # binnen; zonder deze guard telt dat als een echte
          # prijswissel en gaat de tak eronder onnodig lopen.
          not_from:
            - unknown
            - unavailable
          id: prijs_negatief
        - trigger: state
          entity_id: sensor.slimhuys_zonneplan_tariefniveau_nu
          to:
            - unknown
            - unavailable
          for: "00:15:00"
          id: tarief_weg
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - low_price
                - condition: state
                  entity_id: input_boolean.batterij_kwartierregie
                  state: "off"
              sequence:
                - action: select.select_option
                  metadata: {}
                  data:
                    option: disable
                  target:
                    entity_id: select.lilygo_rs485_marstek_rs485_control_mode
              alias: Low price; start charging
            - conditions:
                - condition: trigger
                  id:
                    - morning
                - condition: state
                  entity_id: input_boolean.batterij_kwartierregie
                  state: "off"
                - condition: numeric_state
                  entity_id: sensor.forecast_solar_production_today
                  above: 20
                - condition: state
                  entity_id: select.lilygo_rs485_marstek_rs485_control_mode
                  state: disable
              sequence:
                - action: select.select_option
                  metadata: {}
                  data:
                    option: enable
                  target:
                    entity_id: select.lilygo_rs485_marstek_rs485_control_mode
                - action: select.select_option
                  metadata: {}
                  data:
                    option: stop
                  target:
                    entity_id: select.lilygo_rs485_marstek_forcible_charge_discharge
              alias: Morning and forecast is positive; charge later on
            - conditions:
                - condition: trigger
                  id:
                    - afternoon
                - condition: state
                  entity_id: input_boolean.batterij_kwartierregie
                  state: "off"
              sequence:
                - action: select.select_option
                  metadata: {}
                  data:
                    option: disable
                  target:
                    entity_id: select.lilygo_rs485_marstek_rs485_control_mode
              alias: Afternoon; start own program
            - conditions:
                - condition: trigger
                  id:
                    - medium_price
                - condition: state
                  entity_id: input_boolean.batterij_kwartierregie
                  state: "off"
                - condition: state
                  entity_id: select.lilygo_rs485_marstek_rs485_control_mode
                  state: enable
              sequence:
                - action: select.select_option
                  metadata: {}
                  data:
                    option: disable
                  target:
                    entity_id: select.lilygo_rs485_marstek_rs485_control_mode
              alias: Medium price; start own program
            - conditions:
                - condition: trigger
                  id:
                    - high_price
                - condition: state
                  entity_id: input_boolean.batterij_kwartierregie
                  state: "off"
                # Niet onder de ondergrens leegtrekken: geforceerd ontladen
                # stopt hier niet uit zichzelf, dus zonder deze conditie loopt
                # de batterij bij een lange dure periode helemaal leeg en staat
                # er 's avonds niets meer om mee te overbruggen.
                - condition: numeric_state
                  entity_id: sensor.lilygo_rs485_marstek_battery_state_of_charge
                  above: input_number.batterij_min_soc
                # Bij een negatief totaaltarief kost teruglevering geld. "Hoog
                # tarief" en "negatieve prijs" kunnen tegelijk voorkomen doordat
                # het niveau over de dag wordt bepaald en de prijs per kwartier.
                # Staat de sensor op `unavailable`, dan is dit niet 'off' en
                # ontladen we dus niet - dezelfde veilige kant als voorheen.
                - condition: state
                  entity_id: binary_sensor.meterkast_slimhuys_zonneplan_negatieve_all_in_prijs_nu
                  state: "off"
              sequence:
                - action: select.select_option
                  metadata: {}
                  data:
                    option: enable
                  target:
                    entity_id: select.lilygo_rs485_marstek_rs485_control_mode
                - action: select.select_option
                  metadata: {}
                  data:
                    option: discharge
                  target:
                    entity_id: select.lilygo_rs485_marstek_forcible_charge_discharge
                # Zelfde correctie als in de kwartierregie hierboven: 2500 is
                # geen haalbaar ontlaadvermogen op dit apparaat (de omvormer
                # doet er 800) en overschreef een handmatig gezette waarde.
                - action: number.set_value
                  metadata: {}
                  data:
                    value: >-
                      {{ states('number.lilygo_rs485_marstek_max_discharge_power') | float(800) }}
                  target:
                    entity_id: number.lilygo_rs485_marstek_forcible_discharge_power
              alias: High price; discharge
            # Vangnet. Geforceerd ontladen blijft staan tot een volgende
            # trigger het omzet, en die komt niet meer als de tariefsensor
            # wegvalt: dan blijft de batterij leegtrekken zonder dat er nog
            # iets meekijkt. Hetzelfde geldt zodra de ondergrens bereikt is of
            # de prijs negatief wordt. Terug naar het eigen programma van de
            # batterij is in al die gevallen de veilige stand.
            - conditions:
                - condition: trigger
                  id:
                    - soc_leeg
                    - prijs_negatief
                    - tarief_weg
                - condition: state
                  entity_id: select.lilygo_rs485_marstek_forcible_charge_discharge
                  state: discharge
              sequence:
                - action: select.select_option
                  metadata: {}
                  data:
                    option: stop
                  target:
                    entity_id: select.lilygo_rs485_marstek_forcible_charge_discharge
                - action: select.select_option
                  metadata: {}
                  data:
                    option: disable
                  target:
                    entity_id: select.lilygo_rs485_marstek_rs485_control_mode
                - action: logbook.log
                  data:
                    name: Batterij
                    message: >-
                      Geforceerd ontladen gestopt:
                      {{ 'ondergrens bereikt' if trigger.id == 'soc_leeg'
                         else ('negatieve prijs' if trigger.id == 'prijs_negatief'
                         else 'tariefniveau niet beschikbaar') }}.
              alias: Stop discharging; guard tripped
