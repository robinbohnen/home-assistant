##############################################################################
## DE THUISACCU - ÉÉN LAAG TUSSEN HET APPARAAT EN DE REST VAN HET HUIS
##
## Dit bestand stuurde tot 20 september 2026 de Marstek aan: twee regimes
## (tariefniveau van de dag en de kwartierregie) met ruim 900 regels aan
## automatiseringen, helpers en een `sensor.batterij_kwartierplan`. Dat is
## allemaal weg. De Marstek gaat het huis uit en de Deye wordt niet door Home
## Assistant gestuurd maar door de MarkeDroid-appliance van ModuSun. Eén accu
## met twee bazen is precies het soort storing waar je later een avond naar
## zoekt, dus HA leest hier alleen nog. Schrijf dus NOOIT vanuit HA naar de
## `number.inverter_*`, `select.inverter_*`, `switch.inverter_*` of
## `time.inverter_*` die de Solarman-integratie aanbiedt: dat zijn de registers
## waar MarkeDroid op stuurt.
##
## WAT ER VOOR IN DE PLAATS KOMT
## Een handvol sensoren die de rest van het huis leest. Geen automatisering en
## geen dashboard leest lading, vermogen of inhoud rechtstreeks van de bron -
## net zoals iedereen `sensor.zon_vermogen_nu` leest en niet de omvormer
## (packages/2 - Second Floor/Attic/Solarpanels.yaml). De Marstek-wissel kostte
## elf bestanden; de wissels daarna (Solarman -> MarkeDroid op 22 september,
## MarkeDroid -> Solarman op 4 november) daardoor bijna alleen dit bestand.
##
##   sensor.accu_lading          %     hoe vol
##   sensor.accu_vermogen        W     POSITIEF = LADEN
##   sensor.accu_status                laden | ontladen | rust
##   sensor.accu_capaciteit      kWh   wat er in zou passen (+ afslag/herstart)
##   sensor.accu_inhoud          kWh   wat er nu in zit
##   sensor.accu_temperatuur     °C    van de cellen (BMS)
##   sensor.accu_geladen_totaal  kWh   teller, voor het Energie-dashboard
##   sensor.accu_ontladen_totaal kWh   idem
##   sensor.accu_vandaag_geladen / _ontladen   kWh, dagtellers (utility_meter)
##   sensor.omvormer_net_vermogen W    wat de Deye-CT op de aansluiting ziet
##   binary_sensor.omvormer_net_uitgevallen    alle drie de fases < 50 V
##   binary_sensor.omvormer_storing            alarm of fout van omvormer/BMS
##
## ================== DE BRON IS SINDS 4 NOVEMBER 2026 SOLARMAN ==================
## Geschiedenis in het kort:
##   * 20-22 september: Solarman (ha-solarman, davidrapan) via de LSW-3-logger
##     (192.168.30.152:8899). Botste met MarkeDroid op dezelfde RS485-lijn:
##     30-50 mislukte rondes per uur, `unpack requires a buffer of N bytes`.
##   * 22 september - 4 november: alleen de MQTT-berichten van MarkeDroid.
##     Traag (10 s), alleen het zon-TOTAAL, en met eigen leesfouten.
##   * Sinds 4 november: Solarman is terug (entiteiten `*.inverter_*`), om de
##     ~5 s, met de zon per string, omvormertemperatuur, meldingen, de eigen
##     kWh-tellers van de Deye en het afslag-/herstartpunt als register.
##     MarkeDroid levert alleen nog wat ALLEEN MarkeDroid weet: zijn regie,
##     de exportbegrenzer en flex (zie de MARKEDROID-kop onderaan).
##
## LET OP DE BOTSING VAN SEPTEMBER. Leest MarkeDroid nog via dezelfde logger,
## dan kan die weer optreden. Op 4 november had `binary_sensor.inverter_connection`
## in vijf uur acht korte onderbrekingen (seconden tot ~9 minuten); de sensoren
## hieronder overbruggen een korte hik, maar houd het in de gaten.
##
## ================== HET TEKEN ==================
## POSITIEF = LADEN, zoals bij de Marstek. `sensor.huis_verbruik` trekt het
## accuvermogen van de som af en alle kaarten lezen `> 0 = laadt`; één
## vergeten plek geeft een huisverbruik dat er kilowatts naast zit.
##
## De Deye telt het OMGEKEERD: `sensor.inverter_battery_power` is POSITIEF BIJ
## ONTLADEN. Opnieuw nagemeten op 4 november: de integraal van de positieve
## kant over 07:14-11:59 UTC was 3,57 kWh, `today_battery_discharge` liep in
## die tijd 3,6 kWh op. `sensor.accu_vermogen` draait het teken daarom om, op
## één plek, hier.
##
## ================== LEESFOUTEN VAN SOLARMAN (gemeten 4 november) ==================
##   * een negatief vermogen zonder teken: 65.497 = -39 W. 53x in vijf uur in
##     `inverter_grid_power`. Een 16-bits register dat als unsigned gelezen
##     wordt; boven 32.767 trekken we er 65.536 af (`sensor.omvormer_net_vermogen`).
##   * `inverter_internal_power` geeft daarnaast onzin als -16.713.419 W en
##     wordt nergens gebruikt.
##   * een hele uitleesronde op 0: zon, last en backup-last tegelijk 0 terwijl
##     de accu 2,8 kW levert. ~11% van de zon-samples overdag. Zelfde patroon
##     als MarkeDroid had - dat zat dus in de omvormer/logger, niet in
##     MarkeDroid. De zon vangt dat af in Attic/Solarpanels.yaml.
##   * de INSTELREGISTERS (`number.inverter_*`) vallen af en toe in één blok op
##     0: capaciteit, afslag, herstart, low-SOC tegelijk, een ronde later weer
##     terug. `sensor.accu_capaciteit` negeert die 0.
##   * `inverter_battery_power` is schoon (geen enkele glitch op 2.500 samples).
##
## ================== DE DODE ZONE ==================
## `accu_status` gebruikt ±50 W. Niet geijkt; staat de kaart de halve dag op
## "ontladen" terwijl er niets gebeurt, dan is deze 50 te laag.
##############################################################################

##############################################################################
## NOODSTROOM (21 september 2026, bron omgezet 22 september en 4 november)
##
## Alle groepen hangen aan de backup-uitgang van de Deye, BEHALVE DE LAADPAAL.
## Die zit bewust aan de netkant: de auto uit de thuisaccu laden is twee keer
## omzettingsverlies (net -> accu -> auto) - advies van de elektricien.
## Gevolg bij een storing: het huis draait door, de laadpaal valt stil.
##
## NIET UITGEZOCHT, WEL OPGEVALLEN (4 november): `sensor.inverter_load_ups_power`
## (de backup-uitgang) gaf 450-1.300 W terwijl de hele last van de Deye
## (`inverter_load_power`) 2,5 kW was en de laadpaal stil stond. Dat past niet
## bij "alles behalve de laadpaal hangt aan de backup". Tot dat uitgezocht is
## rekent `noodstroom_resterend` voorzichtig met het hele huis min de laadpaal.
##
## HOE WEET JE DAT HET EEN STORING IS
## Drie lagen:
##
##   1. `binary_sensor.accu_geinstalleerd` - een GRENDEL die aangaat zodra er
##      één keer netspanning is gezien en daarna nooit meer uit.
##   2. `binary_sensor.huis_op_accu` - het net is weg en de grendel is aan.
##      "Het net is weg" = de Deye meet op alle drie de fases van zijn
##      netaansluiting onder 50 V (`binary_sensor.omvormer_net_uitgevallen`).
##      Valt Solarman zelf stil, dan telt het pas als de P1-meter óók stil is:
##      die was tussen 5 en 21 september 84 keer langer dan 30 seconden stil
##      zonder storing, dus alleen is hij geen getuige, maar samen met een
##      stille omvormer wel.
##   3. Het attribuut `oorzaak` - is de P1-meter óók stil, dan is het een
##      stroomstoring (de dongel hangt aan de netkant). Praat de meter nog
##      terwijl de Deye 0 V meldt, dan is het `omvormer`: de Deye ziet geen
##      net terwijl het er wel is.
##
## BEWUST NIET het netrelais (`sensor.inverter_device_relay`) of
## `binary_sensor.inverter_grid`: in september ging het relais drie keer ~30
## seconden open terwijl het net er gewoon was, en zette deze sensor twee keer
## vals aan. De spanning zelf is de betere getuige.
##
## HOE LANG NOG
## `sensor.noodstroom_resterend` rekent in twee standen met een ander getal:
##   * NET ERBIJ: het uurgemiddelde van `sensor.noodstroom_huislast` = het
##     huisverbruik min de laadpaal. Dat is "als het nú uitvalt".
##   * OP DE ACCU: wat de accu het laatste kwartier WERKELIJK afgaf.
## Gerekend tot het afslagpunt, niet tot 0%. Afslag- en herstartpunt staan als
## attribuut op `sensor.accu_capaciteit`, sinds 4 november weer gelezen uit de
## registers van de Deye.
##############################################################################

battery_package:

  # Tijdgewogen gemiddelden (`average_step`) en geen gewoon `mean`: de bron
  # meldt zich alleen als het getal verandert, dus een gewoon gemiddelde telt
  # een onrustig kwartiertje zwaarder dan een uur vlakke last.
  sensor:
    - platform: statistics
      name: "Noodstroom huislast uurgemiddelde"
      unique_id: noodstroom_huislast_uurgemiddelde
      entity_id: sensor.noodstroom_huislast
      state_characteristic: average_step
      # Om de vijf seconden een meting, dus ~720 per uur; ruim erboven zodat
      # het venster door de tijd wordt begrensd en niet door de buffer.
      sampling_size: 2000
      max_age:
        hours: 1
      # Zonder deze regel valt het gemiddelde op `unknown` zodra de last een
      # uur lang precies gelijk blijft - 's nachts niet ondenkbaar.
      keep_last_sample: true
    - platform: statistics
      name: "Noodstroom accu kwartiergemiddelde"
      unique_id: noodstroom_accu_kwartiergemiddelde
      # Positief = laden, dus leeglopen is hier NEGATIEF.
      entity_id: sensor.accu_vermogen
      state_characteristic: average_step
      sampling_size: 1000
      max_age:
        minutes: 15
      keep_last_sample: true

  # Dagtellers voor de Accu-pagina (VANDAAG), in kWh, op de tellers van de
  # Deye zelf. NIEUWE NAMEN (4 november): tot die dag heetten ze
  # `accu_geladen_vandaag`/`_ontladen_vandaag`, in Wh, op de MarkeDroid-tellers.
  # Een utility_meter met dezelfde naam op een andere bron neemt de oude stand
  # mee en telt het verschil tussen twee tellers als verbruik (honderden kWh);
  # met een nieuwe naam begint hij schoon.
  #
  # Waarom niet `inverter_today_battery_charge` zelf: die zet de Deye om
  # middernacht van ZIJN klok op nul. Deze tellen vanaf middernacht van HA.
  utility_meter:
    accu_vandaag_geladen:
      name: "Accu vandaag geladen"
      unique_id: accu_vandaag_geladen
      source: sensor.accu_geladen_totaal
      cycle: daily
    accu_vandaag_ontladen:
      name: "Accu vandaag ontladen"
      unique_id: accu_vandaag_ontladen
      source: sensor.accu_ontladen_totaal
      cycle: daily

  template:
    - sensor:
        ######################################################################
        ## Hoe vol
        ######################################################################
        - name: "Accu lading"
          unique_id: accu_lading
          default_entity_id: sensor.accu_lading
          unit_of_measurement: "%"
          device_class: battery
          state_class: measurement
          icon: mdi:home-battery
          # Zonder deze guard leest `float(0)` een wegvallende Solarman als een
          # lege accu en springt de klokdisplay op rood.
          availability: "{{ has_value('sensor.inverter_battery') }}"
          # Afkappen op 0..100: een BMS geeft af en toe 101 terug en dan tekent
          # het batterijsymbool op de klokken buiten zijn eigen vakje.
          state: >-
            {{ [[states('sensor.inverter_battery') | float(0) | round(0) | int, 0] | max, 100] | min }}

        ######################################################################
        ## Vermogen - POSITIEF IS LADEN, zie de kop van dit bestand
        ######################################################################
        - name: "Accu vermogen"
          unique_id: accu_vermogen
          default_entity_id: sensor.accu_vermogen
          unit_of_measurement: "W"
          device_class: power
          state_class: measurement
          icon: mdi:battery-sync
          availability: "{{ has_value('sensor.inverter_battery_power') }}"
          # De Deye telt ontladen positief; hier dus het omgekeerde. Een getal
          # boven 25 kW kan deze accu niet (max 16 kW): dan de vorige stand.
          # Vandaag nooit gezien, maar de rest van de Solarman-feed doet het wel.
          state: >-
            {% set w = states('sensor.inverter_battery_power') | float(0) %}
            {% if w | abs > 25000 %}
              {{ this.state | float(0) if is_number(this.state) else 0 }}
            {% else %}
              {{ (0 - w) | round(0) }}
            {% endif %}

        ######################################################################
        ## Wat hij doet
        ######################################################################
        - name: "Accu status"
          unique_id: accu_status
          default_entity_id: sensor.accu_status
          # Uit het vermogen en niet uit de eigen state: een sensor die in
          # zijn icoon naar zichzelf verwijst is een template-lus.
          icon: >-
            {% set pw = states('sensor.accu_vermogen') | float(0) %}
            {{ 'mdi:battery-arrow-up' if pw > 50
               else ('mdi:battery-arrow-down' if pw < -50 else 'mdi:battery-clock') }}
          availability: "{{ has_value('sensor.accu_vermogen') }}"
          state: >-
            {% set pw = states('sensor.accu_vermogen') | float(0) %}
            {{ 'laden' if pw > 50 else ('ontladen' if pw < -50 else 'rust') }}
          attributes:
            # Zodat een kaart de band kan noemen zonder hem te hoeven kennen.
            dode_zone: "50"

        ######################################################################
        ## Capaciteit en inhoud
        ######################################################################
        - name: "Accu capaciteit"
          unique_id: accu_capaciteit
          default_entity_id: sensor.accu_capaciteit
          unit_of_measurement: "kWh"
          device_class: energy_storage
          state_class: measurement
          icon: mdi:battery-heart-variant
          # Ah uit het register van de Deye x 51,2 V, de nominale spanning van
          # een 16-cels LFP-pakket. NIET de 48 V die Solarman als "Nominal
          # Voltage" opgeeft: daarmee kwam er in september 28,8 kWh uit voor
          # wat er 30,72 waren. Sinds eind oktober staat het register op
          # 1.000 Ah = 51,2 kWh, gelijk aan wat MarkeDroid meldde. (Het
          # attribuut "Corrected Capacity" van `sensor.inverter_battery` zegt
          # nog 600 Ah en wordt hier dus niet gebruikt;
          # `sensor.inverter_battery_capacity` blijft `unknown`.)
          # EEN 0 IN DEZE REGISTERS IS EEN LEESFOUT (gezien op 4 november, om
          # 11:11 en 12:48): capaciteit, afslag-, herstart- en low-SOC vielen
          # in één blok tegelijk op 0 en kwamen een uitleesronde later terug.
          # Een accu van 0 Ah of een afslag op 0% bestaat hier niet. Bij een 0
          # blijft dus de vorige stand staan, en zonder vorige stand de waarde
          # die tot 4 november vast in dit bestand stond.
          availability: >-
            {{ states('number.inverter_battery_capacity') | float(0) > 0 or is_number(this.state) }}
          state: >-
            {% set ah = states('number.inverter_battery_capacity') | float(0) %}
            {{ (ah * 51.2 / 1000) | round(1) if ah > 0 else this.state }}
          attributes:
            # Het afslag- en herstartpunt, sinds 4 november weer gelezen uit de
            # registers van de Deye (`battery_shutdown_soc`/`_restart_soc`).
            # Tussen 22 september en 4 november stonden ze hier vast op 10 en
            # 50; dat blijft de terugval. De noodstroomsommen en de kaarten
            # lezen deze attributen, nergens anders het register.
            afslag_procent: >-
              {% set v = states('number.inverter_battery_shutdown_soc') | int(0) %}
              {{ v if v > 0 else (this.attributes.afslag_procent | default(10) | int(10)) }}
            herstart_procent: >-
              {% set v = states('number.inverter_battery_restart_soc') | int(0) %}
              {{ v if v > 0 else (this.attributes.herstart_procent | default(50) | int(50)) }}
            # Wat je er echt uit kunt halen: de omvormer stopt bij zijn eigen
            # afslagpunt en niet bij nul.
            bruikbaar: >-
              {% set v = states('number.inverter_battery_shutdown_soc') | int(0) %}
              {% set vloer = v if v > 0 else (this.attributes.afslag_procent | default(10) | int(10)) %}
              {{ (this.state | float(0) * (100 - vloer) / 100) | round(1) if is_number(this.state) else none }}
            # Gezondheid volgens het BMS, en hoeveel volle cycli hij al deed.
            gezondheid_procent: "{{ states('sensor.inverter_battery_soh') | float(none) }}"
            cycli: "{{ states('sensor.inverter_total_battery_life_cycles') | float(none) }}"

        - name: "Accu inhoud"
          unique_id: accu_inhoud
          default_entity_id: sensor.accu_inhoud
          unit_of_measurement: "kWh"
          device_class: energy_storage
          state_class: measurement
          icon: mdi:battery-high
          availability: >-
            {{ has_value('sensor.accu_lading') and has_value('sensor.accu_capaciteit') }}
          state: >-
            {{ (states('sensor.accu_capaciteit') | float(0)
                * states('sensor.accu_lading') | float(0) / 100) | round(2) }}

        - name: "Accu temperatuur"
          unique_id: accu_temperatuur
          default_entity_id: sensor.accu_temperatuur
          unit_of_measurement: "°C"
          device_class: temperature
          state_class: measurement
          availability: "{{ has_value('sensor.inverter_battery_temperature') }}"
          state: "{{ states('sensor.inverter_battery_temperature') | float(0) | round(1) }}"

        ######################################################################
        ## Energietellers (kWh) - voor het Energie-dashboard en de dagtellers
        ##
        ## De eigen tellers van de Deye, 0,1 kWh nauwkeurig en ongeveer elke
        ## tien minuten ververst. Ze lopen door terwijl HA plat ligt, dus geen
        ## gat meer zoals bij de opgetelde MarkeDroid-increments.
        ##
        ## TWEE REGELS TEGEN LEESFOUTEN (dezelfde als de zonteller in
        ## Attic/Solarpanels.yaml): een teller die DAALT houdt de vorige stand
        ## vast - `total_increasing` zou dat als meterwissel lezen en de hele
        ## stand opnieuw optellen - en een STIJGING groter dan de accu in die
        ## tijd had kunnen doen (1,3 x 16 kW, plus 1 kWh marge) ook. Na een
        ## `unknown`/`unavailable` (herstart, Solarman weg) gaat de eerste
        ## waarde ongezien door; anders zou een lange uitval de teller voor
        ## altijd vastzetten.
        ######################################################################
        - name: "Accu geladen totaal"
          unique_id: accu_geladen_totaal
          default_entity_id: sensor.accu_geladen_totaal
          unit_of_measurement: "kWh"
          device_class: energy
          state_class: total_increasing
          icon: mdi:battery-arrow-up
          availability: "{{ has_value('sensor.inverter_total_battery_charge') }}"
          state: >-
            {% set n = states('sensor.inverter_total_battery_charge') | float(0) %}
            {% if not is_number(this.state) %}{{ n }}
            {% else %}
              {% set oud = this.state | float %}
              {% set uren = (now() - this.last_changed).total_seconds() / 3600 %}
              {{ oud if n < oud or n - oud > 16 * 1.3 * uren + 1 else n }}
            {% endif %}
        - name: "Accu ontladen totaal"
          unique_id: accu_ontladen_totaal
          default_entity_id: sensor.accu_ontladen_totaal
          unit_of_measurement: "kWh"
          device_class: energy
          state_class: total_increasing
          icon: mdi:battery-arrow-down
          availability: "{{ has_value('sensor.inverter_total_battery_discharge') }}"
          state: >-
            {% set n = states('sensor.inverter_total_battery_discharge') | float(0) %}
            {% if not is_number(this.state) %}{{ n }}
            {% else %}
              {% set oud = this.state | float %}
              {% set uren = (now() - this.last_changed).total_seconds() / 3600 %}
              {{ oud if n < oud or n - oud > 16 * 1.3 * uren + 1 else n }}
            {% endif %}

        ######################################################################
        ## Wat de Deye op de aansluiting meet - POSITIEF = AFNEMEN
        ##
        ## De externe CT van de Deye hangt op hetzelfde punt als de P1-meter:
        ## op 4 november correlatie 0,87 met de P1 tien seconden later, mediaan
        ## ~85 W verschil (P1 hoger). Twee bruikbare dingen: hij komt ~10 s
        ## eerder binnen dan de P1, en hij is de getuige voor "ziet de Deye
        ## het verbruik wel" (`accu_stroommeting_verdacht`). De bron voor het
        ## huisverbruik blijft de P1 (Electricity.yaml): dat is de geijkte meter.
        ##
        ## 65.497 is -39 W: een 16-bits register als unsigned gelezen.
        ######################################################################
        - name: "Omvormer net vermogen"
          unique_id: omvormer_net_vermogen
          default_entity_id: sensor.omvormer_net_vermogen
          unit_of_measurement: "W"
          device_class: power
          state_class: measurement
          icon: mdi:transmission-tower
          availability: "{{ has_value('sensor.inverter_grid_power') }}"
          state: >-
            {% set w = states('sensor.inverter_grid_power') | float(0) %}
            {% set w = w - 65536 if 32767 < w < 65536 else w %}
            {% if w | abs > 50000 %}
              {{ this.state | float(0) if is_number(this.state) else 0 }}
            {% else %}
              {{ w | round(0) }}
            {% endif %}

    - binary_sensor:
        # Alle drie de fases van de netaansluiting van de Deye onder 50 V.
        # Een getuige voor `binary_sensor.huis_op_accu`, geen vervanging: die
        # heeft de grendel en de 30 seconden vertraging. Volgt de oude
        # `binary_sensor.markedroid_net_uitgevallen` op (zelfde regel, toen op
        # MarkeDroids meter).
        - name: "Omvormer net uitgevallen"
          unique_id: omvormer_net_uitgevallen
          default_entity_id: binary_sensor.omvormer_net_uitgevallen
          device_class: problem
          icon: mdi:transmission-tower-off
          availability: >-
            {{ has_value('sensor.inverter_grid_l1_voltage')
               and has_value('sensor.inverter_grid_l2_voltage')
               and has_value('sensor.inverter_grid_l3_voltage') }}
          state: >-
            {{ states('sensor.inverter_grid_l1_voltage') | float(999) < 50
               and states('sensor.inverter_grid_l2_voltage') | float(999) < 50
               and states('sensor.inverter_grid_l3_voltage') | float(999) < 50 }}

        # Een melding of fout van de omvormer of het BMS. Dit konden we tussen
        # 22 september en 4 november niet zien (MarkeDroid stuurde het niet).
        # `unavailable` telt niet als storing: dat is de verbinding, niet de
        # omvormer. Een minuut vertraging tegen een enkele foute uitlees.
        - name: "Omvormer storing"
          unique_id: omvormer_storing
          default_entity_id: binary_sensor.omvormer_storing
          device_class: problem
          icon: mdi:alert-outline
          availability: >-
            {{ has_value('sensor.inverter_device_alarm') or has_value('sensor.inverter_device_fault') }}
          state: >-
            {% set a = states('sensor.inverter_device_alarm') %}
            {% set f = states('sensor.inverter_device_fault') %}
            {{ (has_value('sensor.inverter_device_alarm') and a != 'OK')
               or (has_value('sensor.inverter_device_fault') and f != 'OK')
               or is_state('binary_sensor.inverter_battery_alarm', 'on')
               or is_state('binary_sensor.inverter_battery_fault', 'on') }}
          delay_on: "00:01:00"
          attributes:
            # Wat er staat, zodat de melding en de kaarten het kunnen noemen.
            omschrijving: >-
              {% set d = namespace(t=[]) %}
              {% set a = states('sensor.inverter_device_alarm') %}
              {% set f = states('sensor.inverter_device_fault') %}
              {% if has_value('sensor.inverter_device_alarm') and a != 'OK' %}{% set d.t = d.t + ['melding: ' ~ a] %}{% endif %}
              {% if has_value('sensor.inverter_device_fault') and f != 'OK' %}{% set d.t = d.t + ['fout: ' ~ f] %}{% endif %}
              {% if is_state('binary_sensor.inverter_battery_alarm', 'on') %}{% set d.t = d.t + ['accu-melding'] %}{% endif %}
              {% if is_state('binary_sensor.inverter_battery_fault', 'on') %}{% set d.t = d.t + ['accufout'] %}{% endif %}
              {{ d.t | join(', ') if d.t else 'geen' }}

        # DE METER ZELF (14 november 2026)
        # Raakt de Deye zijn meter kwijt, dan zegt hij dat letterlijk:
        # `sensor.inverter_device_alarm` = "Meter communication failure" (en
        # "OK" als alles goed is). Dat is de directe bron voor "doet de meter
        # het?" - geen afleiding uit accu- en netvermogen meer nodig, zoals
        # `accu_stroommeting_verdacht` hieronder deed toen we deze melding nog
        # niet zagen (22 september tot 4 november).
        #
        # Een deel-tekst en geen `==`: staan er twee meldingen tegelijk, dan
        # komen ze samen in één state, en ook dan hoort deze aan te gaan.
        # `unavailable` is de verbinding met de omvormer, niet de meter: dan
        # weten we het niet, en dan is deze ook `unavailable`.
        - name: "Omvormer meter storing"
          unique_id: omvormer_meter_storing
          default_entity_id: binary_sensor.omvormer_meter_storing
          device_class: problem
          icon: mdi:meter-electric-outline
          availability: "{{ has_value('sensor.inverter_device_alarm') }}"
          state: >-
            {{ 'meter communication' in states('sensor.inverter_device_alarm') | lower }}
          # Zelfde minuut als `omvormer_storing`: één foute uitlees is geen storing.
          delay_on: "00:01:00"

    ##########################################################################
    ## Noodstroom - zie de NOODSTROOM-kop bovenaan
    ##########################################################################
    # De grendel. Vijf minuten als vangnet naast de state-trigger: gaat de
    # opgeslagen stand ooit verloren terwijl het net er gewoon is, dan komt er
    # geen overgang meer langs en zou hij anders `unknown` blijven.
    - triggers:
        - trigger: state
          entity_id: binary_sensor.omvormer_net_uitgevallen
          to: "off"
        - trigger: homeassistant
          event: start
        - trigger: time_pattern
          minutes: "/5"
      binary_sensor:
        - name: "Accu geïnstalleerd"
          unique_id: accu_geinstalleerd
          default_entity_id: binary_sensor.accu_geinstalleerd
          icon: mdi:transmission-tower-import
          # Eenmaal aan, altijd aan. Er is bewust geen weg terug: een omvormer
          # die later geen net ziet is precies het geval dat we willen melden.
          state: "{{ this.state == 'on' or is_state('binary_sensor.omvormer_net_uitgevallen', 'off') }}"

    # Om de tien seconden opnieuw, naast de statuswissels: een meter die
    # stilvalt is geen statuswissel, die houdt gewoon op. Kost niets in de
    # database: zolang stand en attributen gelijk blijven schrijft HA niets.
    - triggers:
        - trigger: state
          entity_id:
            - binary_sensor.omvormer_net_uitgevallen
            - binary_sensor.accu_geinstalleerd
        - trigger: time_pattern
          seconds: "/10"
        - trigger: homeassistant
          event: start
      binary_sensor:
        - name: "Huis op accu"
          unique_id: huis_op_accu
          default_entity_id: binary_sensor.huis_op_accu
          icon: >-
            {{ 'mdi:home-battery' if is_state('binary_sensor.omvormer_net_uitgevallen', 'on')
               else 'mdi:transmission-tower' }}
          # Zie de kop: de Deye zegt "0 V" -> weg. Zegt hij niets (Solarman
          # stil, dus `unavailable`), dan alleen als de P1-meter óók stil is.
          # `last_reported` en niet `last_updated`: die tweede verspringt alleen
          # als het getal verandert, en een vlakke meting is geen stille meter.
          state: >-
            {% set p1 = 'sensor.meterkast_slimhuys_zonneplan_netto_vermogen' %}
            {% set p1_stil = not has_value(p1)
               or (now() - states[p1].last_reported).total_seconds() > 60 %}
            {% set ov = states('binary_sensor.omvormer_net_uitgevallen') %}
            {{ is_state('binary_sensor.accu_geinstalleerd', 'on')
               and (ov == 'on' or (ov in ['unavailable', 'unknown'] and p1_stil)) }}
          # Een spanningsdip is geen storing. De meter telde er tientallen per
          # fase; zonder deze vertraging knippert de pil op het wandpaneel.
          delay_on: "00:00:30"
          attributes:
            # `stroomstoring` | `omvormer` - zie de kop.
            oorzaak: >-
              {% set p1 = 'sensor.meterkast_slimhuys_zonneplan_netto_vermogen' %}
              {% set stil = not has_value(p1)
                 or (now() - states[p1].last_reported).total_seconds() > 60 %}
              {{ 'stroomstoring' if stil else 'omvormer' }}

    - sensor:
        # Wat er bij een storing aan de accu blijft hangen: het huis min de
        # laadpaal (die zit aan de netkant). Wat verder aan de netkant hangt
        # zit hier nog in; dat maakt de schatting iets aan de voorzichtige
        # kant, en dat is de goede kant. Zie ook de NOODSTROOM-kop over
        # `inverter_load_ups_power`.
        - name: "Noodstroom huislast"
          unique_id: noodstroom_huislast
          default_entity_id: sensor.noodstroom_huislast
          unit_of_measurement: "W"
          device_class: power
          state_class: measurement
          icon: mdi:home-lightning-bolt
          availability: "{{ has_value('sensor.huis_verbruik') }}"
          state: >-
            {% set huis = states('sensor.huis_verbruik') | float(0) * 1000 %}
            {% set laadpaal = states('sensor.charging_station_active_power') | float(0) %}
            {{ [huis - laadpaal, 0] | max | round(0) }}

        - name: "Noodstroom resterend"
          unique_id: noodstroom_resterend
          default_entity_id: sensor.noodstroom_resterend
          unit_of_measurement: "h"
          state_class: measurement
          icon: mdi:timer-sand
          availability: >-
            {{ is_state('binary_sensor.accu_geinstalleerd', 'on')
               and has_value('sensor.accu_lading') and has_value('sensor.accu_capaciteit') }}
          # `unknown` als er niets af gaat - de zon vult hem bij, of er is geen
          # last. Bewust geen 0: dat leest als "leeg". Wat er dan wél aan de
          # hand is staat in het attribuut `stand`.
          state: >-
            {% set cap = states('sensor.accu_capaciteit') | float(0) %}
            {% set vloer = state_attr('sensor.accu_capaciteit', 'afslag_procent') | float(10) %}
            {% set bruikbaar = [(states('sensor.accu_lading') | float(0) - vloer) / 100 * cap, 0] | max %}
            {% if is_state('binary_sensor.huis_op_accu', 'on') %}
              {% set last = 0 - states('sensor.noodstroom_accu_kwartiergemiddelde') | float(0) %}
            {% else %}
              {% set last = states('sensor.noodstroom_huislast_uurgemiddelde') | float(0) %}
            {% endif %}
            {{ (bruikbaar / (last / 1000)) | round(1) if last >= 50 else none }}
          attributes:
            # Wat de kaart en de pil tonen. Hier één keer uitgerekend, zodat ze
            # niet ieder hun eigen versie van deze som bijhouden.
            bruikbaar_kwh: >-
              {% set cap = states('sensor.accu_capaciteit') | float(0) %}
              {% set vloer = state_attr('sensor.accu_capaciteit', 'afslag_procent') | float(10) %}
              {{ ([(states('sensor.accu_lading') | float(0) - vloer) / 100 * cap, 0] | max) | round(1) }}
            last_w: >-
              {% if is_state('binary_sensor.huis_op_accu', 'on') %}
                {{ (0 - states('sensor.noodstroom_accu_kwartiergemiddelde') | float(0)) | round(0) }}
              {% else %}
                {{ states('sensor.noodstroom_huislast_uurgemiddelde') | float(0) | round(0) }}
              {% endif %}
            # `huislast_uur` = gerekend met wat het huis het laatste uur trok;
            # `accu_kwartier` = met wat de accu tijdens de storing werkelijk afgaf.
            basis: >-
              {{ 'accu_kwartier' if is_state('binary_sensor.huis_op_accu', 'on') else 'huislast_uur' }}
            # `loopt_leeg` | `laadt_bij` | `geen_last`
            stand: >-
              {% if is_state('binary_sensor.huis_op_accu', 'on') %}
                {% set pw = states('sensor.noodstroom_accu_kwartiergemiddelde') | float(0) %}
                {{ 'loopt_leeg' if pw <= -50 else ('laadt_bij' if pw >= 50 else 'geen_last') }}
              {% else %}
                {{ 'loopt_leeg' if states('sensor.noodstroom_huislast_uurgemiddelde') | float(0) >= 50 else 'geen_last' }}
              {% endif %}
            afslag_procent: "{{ state_attr('sensor.accu_capaciteit', 'afslag_procent') | int(10) }}"
            herstart_procent: "{{ state_attr('sensor.accu_capaciteit', 'herstart_procent') | int(50) }}"

    ##########################################################################
    ## Stroommeting verdacht (29 oktober 2026)
    ##
    ## In `eigen_verbruik` hoort de accu het net op nul te regelen: het huis
    ## trekt stroom, de accu levert die. Haalt het huis tien minuten lang
    ## stroom van het net terwijl de accu stil blijft (binnen ±100 W), dan
    ## ziet de Deye of MarkeDroid het verbruik niet - de stroommeting werkt
    ## niet goed. De automatisering `accu_stroommeting_melding` onderaan
    ## stuurt dan een bericht.
    ##
    ## Wat hem bewust NIET aanzet:
    ##   * een andere regie dan `eigen_verbruik` - bij `vasthouden`,
    ##     `geblokkeerd` of `flex` staat de accu met opzet stil;
    ##   * de laadpaal: die zit aan de netkant (zie de NOODSTROOM-kop) en
    ##     telt dus niet mee als verbruik dat de accu had moeten dekken;
    ##   * een lege accu: tot 5% boven het afslagpunt mag hij stil staan.
    ##     NIET GETOETST: of de Deye na een afslag pas bij het herstartpunt
    ##     (50%) weer ontlaadt. Komt er een melding bij 15-50% na een lege
    ##     nacht, dan is dát het, en moet de grens hier naar `herstart_procent`;
    ##   * een stille Solarman: dan is het accuvermogen `unavailable`.
    ## De 200 W en de tien minuten zijn niet geijkt. De P1 loopt ~10-16 s
    ## achter; een last die aanslaat geeft dus even een bult van het net,
    ## maar geen tien minuten.
    ##
    ## SINDS 4 NOVEMBER MET EEN GETUIGE: de netmeting van de Deye zelf
    ## (`sensor.omvormer_net_vermogen`) staat als attribuut `deye_net_w` naast
    ## die van de P1 (`p1_net_w`). Zegt de P1 1 kW en de Deye ~0, dan ziet de
    ## CT van de Deye het verbruik niet; zeggen ze allebei 1 kW, dan ziet de
    ## Deye het wel en doet de regie (MarkeDroid) niets.
    ##
    ## SINDS 14 NOVEMBER ALLEEN NOG ALS VANGNET: of de meter praat, zegt de
    ## Deye nu zelf (`binary_sensor.omvormer_meter_storing`). Meldt hij dat,
    ## dan blijft deze uit - de oorzaak is dan bekend en
    ## `omvormer_storing_melding` heeft het al gezegd. Wat deze nog vangt, is
    ## wat de Deye niet meldt: een meter die praat maar het verbruik niet ziet,
    ## of een regie die niets doet.
    ##########################################################################
    - binary_sensor:
        - name: "Accu stroommeting verdacht"
          unique_id: accu_stroommeting_verdacht
          default_entity_id: binary_sensor.accu_stroommeting_verdacht
          device_class: problem
          icon: mdi:current-ac
          state: >-
            {% set accu = states('sensor.accu_vermogen') %}
            {% set net = states('sensor.slimhuys_zonneplan_actief_vermogen') %}
            {% set laadpaal = states('sensor.charging_station_active_power') | float(0) %}
            {% set afslag = state_attr('sensor.accu_capaciteit', 'afslag_procent') | float(10) %}
            {{ is_state('sensor.markedroid_regie', 'eigen_verbruik')
               and is_number(accu) and accu | float | abs < 100
               and is_number(net) and net | float - laadpaal > 200
               and states('sensor.accu_lading') | float(0) > afslag + 5
               and not is_state('binary_sensor.omvormer_meter_storing', 'on') }}
          delay_on: "00:10:00"
          # Eén meting onder de drempel is nog geen herstel; zonder dit tikt
          # hij bij een wisselende last aan en uit.
          delay_off: "00:01:00"
          attributes:
            deye_net_w: "{{ states('sensor.omvormer_net_vermogen') | float(none) }}"
            p1_net_w: "{{ states('sensor.slimhuys_zonneplan_actief_vermogen') | float(none) }}"

  ############################################################################
  ## MARKEDROID - WAT ALLEEN DE REGISSEUR WEET (21 september 2026)
  ##
  ## De MarkeDroid-appliance (192.168.30.64) draait een eigen MQTT-broker
  ## zonder login en publiceert daar om de ~10 seconden vier JSON-berichten
  ## op `public/realtimedata/{solar,load,battery,meter}`. Alleen lezen: hij
  ## neemt over MQTT geen opdrachten aan, en dat is precies goed zo.
  ##
  ## HA's MQTT-integratie praat met één broker, en dat is die in CT 108. De
  ## berichten komen hier dus binnen via een BRUG in die Mosquitto
  ## (`topic public/realtimedata/+ in 0`), niet via een tweede integratie.
  ##
  ## SINDS 4 NOVEMBER ALLEEN NOG WAT DE OMVORMER NIET WEET: de regie (welke
  ## stand MarkeDroid de accu gaf), de exportbegrenzer, flex en of MarkeDroid
  ## er nog is. Alle MEETWAARDEN (zon, accu, net, spanning, temperatuur,
  ## energietellers) komen uit Solarman; de `sensor.markedroid_*`-versies
  ## daarvan zijn geschrapt. Waarom: Solarman leest om de ~5 s in plaats van
  ## 10, geeft de zon per string, en MarkeDroids eigen tellers bleken
  ## onbetrouwbaar (`net_afname` 668 Wh tegen 1.588 Wh van de P1 op dezelfde
  ## ochtend, en een zonteller die 23,5 kWh te veel optelde door glitches).
  ##
  ## Lees de regie hier direct (`sensor.markedroid_regie`): die heeft alleen
  ## MarkeDroid, daar valt niets te abstraheren.
  ##
  ## `CurrentCmnd`, `VppValue` en `VppComponent` werden volgens ModuSun
  ## geleidelijk uitgerold. Zonder dat veld staat de regie op `niet_geleverd`
  ## - en dat is geen storing.
  ############################################################################
  mqtt:
    sensor:
      # De stand waarin MarkeDroid de accu nu heeft gezet. Bedoeld als rem voor
      # alles wat later zware lasten op zonne-overschot schakelt: tijdens
      # `geforceerd_laden`, `flex` en `geblokkeerd` doet MarkeDroid iets met
      # opzet, en een automatisering die daar tegenin stuurt is de tweede baas
      # waar de kop van dit bestand voor waarschuwt.
      - name: "MarkeDroid regie"
        unique_id: markedroid_regie
        default_entity_id: sensor.markedroid_regie
        state_topic: "public/realtimedata/battery"
        icon: mdi:battery-sync
        # Een ontbrekend veld is een ander verhaal dan een stille broker: het
        # eerste geeft `niet_geleverd`, het tweede via `expire_after`
        # `unavailable`.
        value_template: >-
          {% set namen = {0: 'geen_regie', 1: 'geblokkeerd', 2: 'vasthouden',
                          3: 'geforceerd_laden', 4: 'teruglevering_voorrang',
                          5: 'eigen_verbruik', 6: 'flex', 7: 'max_terugleveren'} %}
          {% set c = value_json.CurrentCmnd if value_json.CurrentCmnd is defined else none %}
          {{ 'niet_geleverd' if c is none else namen.get(c | int(-1), 'onbekend_' ~ c) }}
        json_attributes_topic: "public/realtimedata/battery"
        json_attributes_template: >-
          {% set tekst = {0: 'MarkeDroid stuurt niet', 1: 'accu geblokkeerd, laden en ontladen dicht',
                          2: 'vasthouden, alleen laden', 3: 'geforceerd laden van het net',
                          4: 'teruglevering heeft voorrang', 5: 'vrij, eigen verbruik',
                          6: 'flex-opdracht (VPP)', 7: 'maximaal terugleveren'} %}
          {% set c = value_json.CurrentCmnd if value_json.CurrentCmnd is defined else none %}
          {{ {
               'code': c,
               'omschrijving': ('geen regie-veld in de berichten' if c is none
                                else tekst.get(c | int(-1), 'onbekende code ' ~ c)),
               'flex_w': value_json.VppValue if value_json.VppValue is defined else none,
               'flex_meetpunt': value_json.VppComponent if value_json.VppComponent is defined else none
             } | tojson }}
        expire_after: 60

      # 0 = teruglevering zoals altijd, 1 = MarkeDroid zet de export op 0 W
      # (meestal een negatieve prijs), 2 = de begrenzer zelf is in storing.
      - name: "MarkeDroid exportbegrenzer"
        unique_id: markedroid_exportbegrenzer
        default_entity_id: sensor.markedroid_exportbegrenzer
        state_topic: "public/realtimedata/solar"
        value_template: >-
          {% set s = value_json.ExpLimiterState if value_json.ExpLimiterState is defined else none %}
          {{ {0: 'uit', 1: 'actief', 2: 'storing'}.get(s | int(-1), 'onbekend') if s is not none else 'onbekend' }}
        icon: mdi:transmission-tower-export
        expire_after: 60

      # Het flex-doel (VPP), positief = van het net kopen. `unknown` zolang er
      # geen flex-opdracht loopt of het veld nog niet is uitgerold.
      - name: "MarkeDroid flex vermogen"
        unique_id: markedroid_flex_vermogen
        default_entity_id: sensor.markedroid_flex_vermogen
        state_topic: "public/realtimedata/battery"
        value_template: "{{ value_json.VppValue if value_json.VppValue is defined and value_json.VppValue is number else none }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        expire_after: 60

    binary_sensor:
      # Aan zolang er berichten komen; valt uit na een minuut stilte. Een
      # `off_delay` en niet `expire_after`: die tweede maakt er `unavailable`
      # van, en dan kan een kaart "geen verbinding" niet onderscheiden van
      # "HA weet het niet". De timer begint bij elk bericht opnieuw.
      - name: "MarkeDroid verbinding"
        unique_id: markedroid_verbinding
        default_entity_id: binary_sensor.markedroid_verbinding
        state_topic: "public/realtimedata/battery"
        value_template: "ON"
        device_class: connectivity
        off_delay: 60

      # De exportbegrenzer op 1. De handleiding noemt dit "negatieve prijs",
      # maar MarkeDroid zegt alleen dát hij dichtzet, niet waarom.
      - name: "MarkeDroid negatieve prijs"
        unique_id: markedroid_negatieve_prijs
        default_entity_id: binary_sensor.markedroid_negatieve_prijs
        state_topic: "public/realtimedata/solar"
        value_template: "{{ 'ON' if value_json.ExpLimiterState is defined and value_json.ExpLimiterState == 1 else 'OFF' }}"
        icon: mdi:cash-minus
        expire_after: 60

      - name: "MarkeDroid flex actief"
        unique_id: markedroid_flex_actief
        default_entity_id: binary_sensor.markedroid_flex_actief
        state_topic: "public/realtimedata/battery"
        value_template: >-
          {{ 'ON' if value_json.CurrentCmnd is defined and value_json.CurrentCmnd == 6
                     and value_json.VppValue is defined and value_json.VppValue is number else 'OFF' }}
        icon: mdi:swap-vertical-bold
        expire_after: 60

  ############################################################################
  ## MELDINGEN - alleen een bericht, geen sturing
  ##
  ## De kop zegt "HA leest hier alleen nog", en dat blijft zo: dit stuurt
  ## niets naar de accu, het vertelt het alleen.
  ############################################################################
  automation:
    - id: accu_stroommeting_melding
      alias: Accu - Stroommeting werkt niet goed
      description: >-
        Meldt als MarkeDroid op eigen verbruik staat, het huis van het net
        trekt en de accu toch stil blijft.
      mode: single
      max_exceeded: silent
      triggers:
        # De tien minuten zitten al in de `delay_on` van de sensor.
        - trigger: state
          entity_id: binary_sensor.accu_stroommeting_verdacht
          to: "on"
      conditions:
        # Hooguit één keer per twaalf uur; een meting die stuk blijft gaat
        # anders bij elke wisselende last opnieuw af.
        - condition: template
          value_template: >-
            {{ this.attributes.last_triggered is none
               or now() - this.attributes.last_triggered > timedelta(hours=12) }}
      actions:
        - action: notify.mobile_devices_robin
          data:
            title: Stroommeting accu werkt niet goed
            message: >-
              {% set deye = states('sensor.omvormer_net_vermogen') %}
              MarkeDroid staat op eigen verbruik, maar de accu doet al tien
              minuten niets ({{ states('sensor.accu_vermogen') | float(0) | round(0) | int }} W)
              terwijl het huis {{ states('sensor.slimhuys_zonneplan_actief_vermogen') | float(0) | round(0) | int }} W
              van het net haalt.
              {%- if is_number(deye) %}
              De Deye zelf meet {{ deye | float | round(0) | int }} W op de aansluiting
              {{- ': zijn CT ziet het verbruik dus niet.' if deye | float < 100 else ', dus hij ziet het wel; dan doet de regie niets.' }}
              {%- endif %}
              Kijk in de ModuSun-app.

    # Tussen 22 september en 4 november zag HA dit niet; nu weer wel. Eén
    # bericht per storing, en hooguit één per zes uur: een melding die blijft
    # staan hoeft niet elke keer opnieuw.
    - id: omvormer_storing_melding
      alias: Omvormer - Melding of fout
      description: >-
        Meldt een alarm of fout van de Deye of het BMS van de accu.
      mode: single
      max_exceeded: silent
      triggers:
        # De minuut vertraging zit al in de `delay_on` van de sensor.
        - trigger: state
          entity_id: binary_sensor.omvormer_storing
          from: "off"
          to: "on"
      conditions:
        - condition: template
          value_template: >-
            {{ this.attributes.last_triggered is none
               or now() - this.attributes.last_triggered > timedelta(hours=6) }}
      actions:
        - action: notify.mobile_devices_robin
          data:
            title: Omvormer meldt een probleem
            message: >-
              De Deye meldt: {{ state_attr('binary_sensor.omvormer_storing', 'omschrijving') }}.
              {#- Ook de ruwe melding: beide sensoren wachten een minuut, en
                  welke het eerst omgaat is niet te zeggen. #}
              {%- if is_state('binary_sensor.omvormer_meter_storing', 'on')
                     or 'meter communication' in states('sensor.inverter_device_alarm') | lower %}
              Hij krijgt geen meting meer van de meter, dus de accu kan het
              verbruik van het huis niet volgen.
              {%- endif %}
              Kijk in de ModuSun- of Solarman-app.
