##############################################################################
## DE THUISACCU - ÉÉN LAAG TUSSEN HET APPARAAT EN DE REST VAN HET HUIS
##
## Dit bestand stuurde tot 20 september 2026 de Marstek aan: twee regimes
## (tariefniveau van de dag en de kwartierregie) met ruim 900 regels aan
## automatiseringen, helpers en een `sensor.batterij_kwartierplan`. Dat is
## allemaal weg. De Marstek gaat het huis uit en de Deye wordt niet door Home
## Assistant gestuurd maar door de MarkeDroid-appliance van ModuSun. Eén accu
## met twee bazen is precies het soort storing waar je later een avond naar
## zoekt, dus HA leest hier alleen nog.
##
## WAT ER VOOR IN DE PLAATS KOMT
## Vijf sensoren die de rest van het huis leest. Geen automatisering en geen
## dashboard leest lading, vermogen of inhoud nog rechtstreeks van
## `sensor.deye_*` - net zoals niemand de ruwe omvormersensoren leest maar
## iedereen `sensor.zon_vermogen_nu` (packages/2 - Second Floor/Attic/
## Solarpanels.yaml). Die wissel kostte deze keer elf bestanden; de volgende
## keer is het dit ene.
##
## EEN UITZONDERING, BEWUST (21-09-2026): de Accu-pagina
## (dashboards/home/accu.yaml) leest wél `sensor.deye_*` voor wat alleen déze
## omvormer heeft en waar geen teken aan zit: netspanning, huislast,
## dagtellers, verlies, meldingen, temperaturen, verbinding en het
## afslagpunt. Die hier allemaal doorlussen levert een tweede naam per sensor
## op zonder dat er iets aan omgerekend wordt, en bij een andere accu is die
## pagina toch opnieuw te maken. Het vermogen - het enige getal met een
## omgedraaid teken - komt ook daar uit `sensor.accu_vermogen`.
##
##   sensor.accu_lading       %     hoe vol
##   sensor.accu_vermogen     W     POSITIEF = LADEN (zie hieronder)
##   sensor.accu_status             laden | ontladen | rust
##   sensor.accu_capaciteit   kWh   wat er in zou passen
##   sensor.accu_inhoud       kWh   wat er nu in zit
##
## ================== HET TEKEN IS OMGEKEERD ==================
## DE DEYE TELT ONTLADEN POSITIEF, DE MARSTEK TELDE LADEN POSITIEF.
##
## Vastgesteld op 20 september 2026 uit de eerste veertien uur historie:
## `sensor.deye_battery_power` stond onafgebroken op +75..83 W terwijl de
## laadtoestand van 51% naar 44% zakte, `today_battery_charge` op 0 stond en
## `today_battery_discharge` op 0,7 kWh. Twee onafhankelijke bevestigingen uit
## de integratie zelf: `sensor.deye_battery_state` (die ha-solarman uit
## datzelfde vermogen afleidt met een band van ±50 W) meldde `discharging`, en
## de sensor draagt een attribuut `−x` met de waarde −80.
##
## LET OP - DE LAADKANT IS NOG NIET GEZIEN. De Deye hing tijdens die meting
## niet aan het net (alle drie de fases op 0 V) en heeft nog geen kilowattuur
## geladen. Zodra hij voor het eerst écht laadt, is dit de eerste sensor om te
## controleren: staat `accu_vermogen` dan NEGATIEF terwijl de lading oploopt,
## dan moet de min hieronder eruit. Alles wat met de accu rekent hangt aan dit
## teken - de huis-verbruiksom in Electricity.yaml, de energieflow op het
## Overzicht, de klokdisplay - dus één keer verkeerd is overal verkeerd.
##
## DE RICHTING IS DIE VAN DE MARSTEK GEBLEVEN (laden positief) en niet die van
## de Deye. Niet uit gewoonte: `sensor.huis_verbruik` trekt het accuvermogen
## van de som af, en in alle kaarten staat `> 0 = laadt`. Het teken hier
## omdraaien betekent vijftien plekken omdraaien, en één vergeten plek geeft
## een huisverbruik dat er structureel een paar kilowatt naast zit zonder dat
## iets op storing springt.
##
## ================== DE DODE ZONE ==================
## `accu_status` gebruikt ±50 W, dezelfde band als ha-solarman zelf hanteert.
## Bij de Marstek stond die op 15 W, gemeten aan zijn eigen ruststroom. Voor de
## Deye is die band NIET geijkt: op 20 september trok hij 80 W uit de accu,
## maar dat was eilandbedrijf zonder net - met het net erop komt dat verbruik
## uit de meterkast en niet uit de accu. Kijk hier opnieuw naar zodra hij een
## week normaal gedraaid heeft; staat de kaart dan de halve dag op "ontladen"
## terwijl er niets gebeurt, dan is deze 50 te laag.
##############################################################################

##############################################################################
## NOODSTROOM (21 september 2026)
##
## Alle groepen hangen aan de backup-uitgang van de Deye, BEHALVE DE LAADPAAL.
## Die zit bewust aan de netkant: de auto uit de thuisaccu laden is twee keer
## omzettingsverlies (net -> accu -> auto) voor stroom die je ook direct had
## kunnen nemen - advies van de elektricien. Gevolg bij een storing: het hele
## huis draait door, de laadpaal valt stil.
##
## Daardoor is `sensor.deye_load_ups_power` precies "het huis zonder de
## laadpaal", zonder aftreksom. Controleer dat één keer zodra hij aangesloten
## is: tijdens een laadsessie van 11 kW mag dat getal NIET mee omhoog. Doet hij
## dat wel, dan hangt de laadpaal toch aan de backup-kant en rekent de kaart
## met een last die bij een storing in één keer de accu leegtrekt.
##
## HOE WEET JE DAT HET EEN STORING IS
## `binary_sensor.deye_grid` alleen is niet genoeg: tot de installatie staat
## die permanent uit (de Deye hangt nergens aan). En de P1-meter alleen ook
## niet - die was tussen 5 en 21 september vier keer onbeschikbaar (één keer
## vier uur) en 84 keer langer dan 30 seconden stil, zonder dat er één keer
## een storing was. Dus drie lagen:
##
##   1. `binary_sensor.accu_geinstalleerd` - een GRENDEL die aangaat zodra de
##      Deye één keer netspanning heeft gezien en daarna nooit meer uit. Tot de
##      installatie kan er dus niets alarmeren, en daarna hoeft niemand iets om
##      te zetten.
##   2. `binary_sensor.huis_op_accu` - de Deye ziet geen net, en de grendel is
##      aan. Dat is het feit dat telt: het huis draait op de accu.
##   3. Het attribuut `oorzaak` daarop - is de P1-meter óók stil, dan is het
##      een stroomstoring (de dongel haalt zijn stroom uit de meter en die
##      staat aan de netkant). Praat de meter nog, dan is het net er wel en
##      heeft de omvormer zichzelf losgekoppeld: een zekering, of netspanning
##      buiten de grenzen. Ook dan draait het huis op de accu, maar de
##      oplossing is een andere.
##
## HOE LANG NOG
## `sensor.noodstroom_resterend` rekent in twee standen met een ander getal:
##   * NET ERBIJ: het uurgemiddelde van de huislast. Dat is "als het nú
##     uitvalt". Niet het momentane getal: een waterkoker maakt van zes uur
##     anders even anderhalf.
##   * OP DE ACCU: wat de accu het laatste kwartier WERKELIJK afgaf. Levert de
##     zon tijdens de storing mee (hangt er zon aan de backup-kant), dan zit dat
##     daar vanzelf in, zonder dat deze som hoeft te weten hoe die bedraad is.
## Gerekend tot het afslagpunt (`number.deye_battery_shutdown_soc`), niet tot
## 0%. En let op het HERSTARTPUNT (`number.deye_battery_restart_soc`, 50% op
## 21 september): is hij eenmaal afgeslagen, dan gaat de uitgang pas weer aan
## als de accu terug op dat niveau is. Bij 28,8 kWh is dat ruim 11 kWh zon.
##############################################################################

battery_package:

  # Tijdgewogen gemiddelden (`average_step`) en geen gewoon `mean`: de bron
  # meldt zich alleen als het getal verandert, dus een gewoon gemiddelde telt
  # een onrustig kwartiertje zwaarder dan een uur vlakke last.
  sensor:
    - platform: statistics
      name: "Noodstroom huislast uurgemiddelde"
      unique_id: noodstroom_huislast_uurgemiddelde
      entity_id: sensor.deye_load_ups_power
      state_characteristic: average_step
      # Om de vijf seconden een meting, dus ~720 per uur; ruim erboven zodat
      # het venster door de tijd wordt begrensd en niet door de buffer.
      sampling_size: 2000
      max_age:
        hours: 1
      # Zonder deze regel valt het gemiddelde op `unknown` zodra de last een
      # uur lang precies gelijk blijft - 's nachts niet ondenkbaar.
      keep_last_sample: true
    - platform: statistics
      name: "Noodstroom accu kwartiergemiddelde"
      unique_id: noodstroom_accu_kwartiergemiddelde
      # `accu_vermogen` en niet de Deye zelf: hetzelfde teken als overal
      # (positief = laden), dus leeglopen is hier NEGATIEF.
      entity_id: sensor.accu_vermogen
      state_characteristic: average_step
      sampling_size: 1000
      max_age:
        minutes: 15
      keep_last_sample: true

  template:
    - sensor:
        ######################################################################
        ## Hoe vol
        ######################################################################
        - name: "Accu lading"
          unique_id: accu_lading
          default_entity_id: sensor.accu_lading
          unit_of_measurement: "%"
          device_class: battery
          state_class: measurement
          icon: mdi:home-battery
          # De verbinding valt kort weg - op 20 september twee keer in een uur,
          # ongeveer tien seconden per keer. Zonder deze guard leest `float(0)`
          # dat als een lege accu en springt de klokdisplay op rood.
          availability: "{{ has_value('sensor.deye_battery') }}"
          # Afkappen op 0..100: de BMS geeft af en toe 101 terug en dan tekent
          # het batterijsymbool op de klokken buiten zijn eigen vakje.
          state: >-
            {{ [[states('sensor.deye_battery') | float(0) | round(0) | int, 0] | max, 100] | min }}

        ######################################################################
        ## Vermogen - POSITIEF IS LADEN, zie de kop van dit bestand
        ######################################################################
        - name: "Accu vermogen"
          unique_id: accu_vermogen
          default_entity_id: sensor.accu_vermogen
          unit_of_measurement: "W"
          device_class: power
          state_class: measurement
          icon: mdi:battery-sync
          availability: "{{ has_value('sensor.deye_battery_power') }}"
          # De enige plek in het hele huis waar dit teken wordt omgedraaid.
          # Niet via het attribuut `−x` van de bron: dat is een min-teken uit
          # de Unicode (U+2212) en geen gewone koppelstreepje, en zo'n
          # attribuutnaam is een voetangel in elk template dat er later bij
          # komt.
          state: "{{ (0 - (states('sensor.deye_battery_power') | float(0))) | round(0) }}"

        ######################################################################
        ## Wat hij doet
        ######################################################################
        - name: "Accu status"
          unique_id: accu_status
          default_entity_id: sensor.accu_status
          # Uit het vermogen en niet uit de eigen state: een sensor die in
          # zijn icoon naar zichzelf verwijst is een template-lus.
          icon: >-
            {% set pw = states('sensor.accu_vermogen') | float(0) %}
            {{ 'mdi:battery-arrow-up' if pw > 50
               else ('mdi:battery-arrow-down' if pw < -50 else 'mdi:battery-clock') }}
          availability: "{{ has_value('sensor.accu_vermogen') }}"
          # Zelf afgeleid en niet `sensor.deye_battery_state` overgenomen: die
          # geeft Engelse woorden en een band die de integratie zonder
          # aankondiging kan veranderen. Eén plek waar de dode zone staat is
          # meer waard dan een sensor minder.
          state: >-
            {% set pw = states('sensor.accu_vermogen') | float(0) %}
            {{ 'laden' if pw > 50 else ('ontladen' if pw < -50 else 'rust') }}
          attributes:
            # Zodat een kaart de band kan noemen zonder hem te hoeven kennen.
            dode_zone: "50"

        ######################################################################
        ## Capaciteit en inhoud
        ######################################################################
        - name: "Accu capaciteit"
          unique_id: accu_capaciteit
          default_entity_id: sensor.accu_capaciteit
          unit_of_measurement: "kWh"
          device_class: energy_storage
          state_class: measurement
          icon: mdi:battery-heart-variant
          # `sensor.deye_battery_capacity` (kWh) en `sensor.deye_battery_soh`
          # komen bij deze omvormer niet door - ze staan sinds de koppeling op
          # `unknown`. Het getal staat wél in de attributen van
          # sensor.deye_battery, die de BMS uitleest: 600 Ah bij 48 V nominaal
          # = 28,8 kWh. Dus rekenen we het zelf uit, uit die attributen en niet
          # uit een hier ingetypt getal - dan klopt het vanzelf nog als er een
          # rek bij komt.
          availability: >-
            {{ (state_attr('sensor.deye_battery', 'Corrected Capacity') | float(0)) > 0
               or (states('number.deye_battery_capacity') | float(0)) > 0 }}
          state: >-
            {% set ah = state_attr('sensor.deye_battery', 'Corrected Capacity') | float(0) %}
            {% set ah = ah if ah > 0 else states('number.deye_battery_capacity') | float(0) %}
            {% set v = state_attr('sensor.deye_battery', 'Nominal Voltage') | float(0) %}
            {# 48 V is de nominale spanning van dit 16s-pakket; de gemeten
               klemspanning (52 V) zou de capaciteit ~9% te hoog maken. #}
            {% set v = v if v > 0 else 48 %}
            {{ (ah * v / 1000) | round(1) }}
          attributes:
            # Wat je er echt uit kunt halen: de omvormer stopt bij zijn eigen
            # afslagpunt en niet bij nul. Zonder dit getal lees je 28,8 kWh en
            # reken je met 3 kWh die er nooit uitkomt.
            bruikbaar: >-
              {# Zelfde som als de state hierboven, en bewust niet
                 `states('sensor.accu_capaciteit')`: een attribuut dat de eigen
                 state leest loopt een ronde achter en is een lus. #}
              {% set ah = state_attr('sensor.deye_battery', 'Corrected Capacity') | float(0) %}
              {% set ah = ah if ah > 0 else states('number.deye_battery_capacity') | float(0) %}
              {% set v = state_attr('sensor.deye_battery', 'Nominal Voltage') | float(0) %}
              {% set cap = ah * (v if v > 0 else 48) / 1000 %}
              {% set vloer = states('number.deye_battery_shutdown_soc') | float(10) %}
              {{ (cap * (100 - vloer) / 100) | round(1) }}

        - name: "Accu inhoud"
          unique_id: accu_inhoud
          default_entity_id: sensor.accu_inhoud
          unit_of_measurement: "kWh"
          device_class: energy_storage
          state_class: measurement
          icon: mdi:battery-high
          availability: >-
            {{ has_value('sensor.accu_lading') and has_value('sensor.accu_capaciteit') }}
          state: >-
            {{ (states('sensor.accu_capaciteit') | float(0)
                * states('sensor.accu_lading') | float(0) / 100) | round(2) }}

    ##########################################################################
    ## Noodstroom - zie de NOODSTROOM-kop bovenaan
    ##########################################################################
    # De grendel. Vijf minuten als vangnet naast de state-trigger: gaat de
    # opgeslagen stand ooit verloren terwijl het net er gewoon is, dan komt er
    # geen overgang naar `on` meer langs en zou hij anders `unknown` blijven.
    - triggers:
        - trigger: state
          entity_id: binary_sensor.deye_grid
          to: "on"
        - trigger: homeassistant
          event: start
        - trigger: time_pattern
          minutes: "/5"
      binary_sensor:
        - name: "Accu geïnstalleerd"
          unique_id: accu_geinstalleerd
          default_entity_id: binary_sensor.accu_geinstalleerd
          icon: mdi:transmission-tower-import
          # Eenmaal aan, altijd aan. Er is bewust geen weg terug: een Deye die
          # later geen net ziet is precies het geval dat we willen melden.
          state: "{{ this.state == 'on' or is_state('binary_sensor.deye_grid', 'on') }}"

    # Om de tien seconden opnieuw, naast de statuswissels: de P1-meter die
    # stilvalt is geen statuswissel, die houdt gewoon op. Zonder deze tik zou
    # `oorzaak` tot een minuut lang "omvormer" zeggen tijdens een echte storing.
    # Kost niets in de database: zolang stand en attributen gelijk blijven
    # schrijft HA geen nieuwe rij.
    - triggers:
        - trigger: state
          entity_id:
            - binary_sensor.deye_grid
            - binary_sensor.accu_geinstalleerd
        - trigger: time_pattern
          seconds: "/10"
        - trigger: homeassistant
          event: start
      binary_sensor:
        - name: "Huis op accu"
          unique_id: huis_op_accu
          default_entity_id: binary_sensor.huis_op_accu
          icon: >-
            {{ 'mdi:home-battery' if is_state('binary_sensor.deye_grid', 'off')
               else 'mdi:transmission-tower' }}
          # Weet HA niet of de Deye net ziet, dan weet hij ook niet of het huis
          # op de accu draait - en "nee" zeggen zou een storing kunnen
          # verzwijgen.
          availability: "{{ has_value('binary_sensor.deye_grid') }}"
          state: >-
            {{ is_state('binary_sensor.accu_geinstalleerd', 'on')
               and is_state('binary_sensor.deye_grid', 'off') }}
          # Een spanningsdip is geen storing. De meter telde er tientallen per
          # fase; de Deye schakelt binnen milliseconden om en weer terug, en
          # zonder deze vertraging knippert de pil op het wandpaneel.
          delay_on: "00:00:30"
          attributes:
            # `stroomstoring` | `omvormer` - zie de kop. `last_reported` en niet
            # `last_updated`: die tweede verspringt alleen als het getal
            # verandert, en een vlakke meting is geen stille meter.
            oorzaak: >-
              {% set p1 = 'sensor.meterkast_slimhuys_zonneplan_netto_vermogen' %}
              {% set stil = not has_value(p1)
                 or (now() - states[p1].last_reported).total_seconds() > 60 %}
              {{ 'stroomstoring' if stil else 'omvormer' }}

    - sensor:
        - name: "Noodstroom resterend"
          unique_id: noodstroom_resterend
          default_entity_id: sensor.noodstroom_resterend
          unit_of_measurement: "h"
          state_class: measurement
          icon: mdi:timer-sand
          # Zonder installatie is er geen noodstroom om over te rekenen: de Deye
          # voedt dan alleen zichzelf (66 W), en dat leverde "95 uur" op.
          availability: >-
            {{ is_state('binary_sensor.accu_geinstalleerd', 'on')
               and has_value('sensor.accu_lading') and has_value('sensor.accu_capaciteit') }}
          # `unknown` als er niets af gaat - de zon vult hem bij, of er is geen
          # last. Bewust geen 0: dat leest als "leeg". Wat er dan wél aan de
          # hand is staat in het attribuut `stand`.
          state: >-
            {% set cap = states('sensor.accu_capaciteit') | float(0) %}
            {% set vloer = states('number.deye_battery_shutdown_soc') | float(10) %}
            {% set bruikbaar = [(states('sensor.accu_lading') | float(0) - vloer) / 100 * cap, 0] | max %}
            {% if is_state('binary_sensor.huis_op_accu', 'on') %}
              {% set last = 0 - states('sensor.noodstroom_accu_kwartiergemiddelde') | float(0) %}
            {% else %}
              {% set last = states('sensor.noodstroom_huislast_uurgemiddelde') | float(0) %}
            {% endif %}
            {{ (bruikbaar / (last / 1000)) | round(1) if last >= 50 else none }}
          attributes:
            # Wat de kaart en de pil tonen. Hier één keer uitgerekend, zodat ze
            # niet ieder hun eigen versie van deze som bijhouden.
            bruikbaar_kwh: >-
              {% set cap = states('sensor.accu_capaciteit') | float(0) %}
              {% set vloer = states('number.deye_battery_shutdown_soc') | float(10) %}
              {{ ([(states('sensor.accu_lading') | float(0) - vloer) / 100 * cap, 0] | max) | round(1) }}
            last_w: >-
              {% if is_state('binary_sensor.huis_op_accu', 'on') %}
                {{ (0 - states('sensor.noodstroom_accu_kwartiergemiddelde') | float(0)) | round(0) }}
              {% else %}
                {{ states('sensor.noodstroom_huislast_uurgemiddelde') | float(0) | round(0) }}
              {% endif %}
            # `huislast_uur` = gerekend met wat het huis het laatste uur trok;
            # `accu_kwartier` = met wat de accu tijdens de storing werkelijk afgaf.
            basis: >-
              {{ 'accu_kwartier' if is_state('binary_sensor.huis_op_accu', 'on') else 'huislast_uur' }}
            # `loopt_leeg` | `laadt_bij` | `geen_last`
            stand: >-
              {% if is_state('binary_sensor.huis_op_accu', 'on') %}
                {% set pw = states('sensor.noodstroom_accu_kwartiergemiddelde') | float(0) %}
                {{ 'loopt_leeg' if pw <= -50 else ('laadt_bij' if pw >= 50 else 'geen_last') }}
              {% else %}
                {{ 'loopt_leeg' if states('sensor.noodstroom_huislast_uurgemiddelde') | float(0) >= 50 else 'geen_last' }}
              {% endif %}
            afslag_procent: "{{ states('number.deye_battery_shutdown_soc') | int(10) }}"
            herstart_procent: "{{ states('number.deye_battery_restart_soc') | int(50) }}"

    ##########################################################################
    ## MarkeDroid energietellers - zie de MARKEDROID-kop hieronder
    ##
    ## MarkeDroid stuurt geen standen maar de Wh SINDS HET VORIGE BERICHT
    ## (`TotWhInc` e.d.). Die tellen we hier op. Nauwkeuriger dan de
    ## integratie-helper uit de handleiding, die het vermogen van tien seconden
    ## geleden doortrekt: dit is wat MarkeDroid zelf gemeten heeft.
    ##
    ## IN Wh EN NIET IN kWh, met twee decimalen. Stationair komen er
    ## increments van 0,02 Wh binnen; in kWh op drie decimalen rondt elk
    ## daarvan af naar nul en telt de teller structureel te laag.
    ##
    ## Een trigger-sensor onthoudt zijn stand over een herstart. Wat MarkeDroid
    ## publiceert terwijl HA plat ligt is weg - een gat, geen sprong. Een
    ## negatief increment (zou niet moeten kunnen) telt als nul, anders ziet
    ## `total_increasing` een meterwissel.
    ##########################################################################
    - triggers:
        - trigger: mqtt
          topic: "public/realtimedata/solar"
      sensor:
        - name: "MarkeDroid zon energie"
          unique_id: markedroid_zon_energie
          default_entity_id: sensor.markedroid_zon_energie
          unit_of_measurement: "Wh"
          device_class: energy
          state_class: total_increasing
          icon: mdi:solar-power
          state: >-
            {{ ((this.state | float(0)) + ([trigger.payload_json.TotWhInc | float(0), 0] | max)) | round(2) }}
    - triggers:
        - trigger: mqtt
          topic: "public/realtimedata/load"
      sensor:
        - name: "MarkeDroid last energie"
          unique_id: markedroid_last_energie
          default_entity_id: sensor.markedroid_last_energie
          unit_of_measurement: "Wh"
          device_class: energy
          state_class: total_increasing
          icon: mdi:home-lightning-bolt
          state: >-
            {{ ((this.state | float(0)) + ([trigger.payload_json.TotWhInc | float(0), 0] | max)) | round(2) }}
    - triggers:
        - trigger: mqtt
          topic: "public/realtimedata/battery"
      sensor:
        - name: "MarkeDroid accu geladen"
          unique_id: markedroid_accu_geladen
          default_entity_id: sensor.markedroid_accu_geladen
          unit_of_measurement: "Wh"
          device_class: energy
          state_class: total_increasing
          icon: mdi:battery-arrow-up
          state: >-
            {{ ((this.state | float(0)) + ([trigger.payload_json.TotWhChaInc | float(0), 0] | max)) | round(2) }}
    - triggers:
        - trigger: mqtt
          topic: "public/realtimedata/battery"
      sensor:
        - name: "MarkeDroid accu ontladen"
          unique_id: markedroid_accu_ontladen
          default_entity_id: sensor.markedroid_accu_ontladen
          unit_of_measurement: "Wh"
          device_class: energy
          state_class: total_increasing
          icon: mdi:battery-arrow-down
          state: >-
            {{ ((this.state | float(0)) + ([trigger.payload_json.TotWhDisChaInc | float(0), 0] | max)) | round(2) }}
    - triggers:
        - trigger: mqtt
          topic: "public/realtimedata/meter"
      sensor:
        - name: "MarkeDroid net afname"
          unique_id: markedroid_net_afname
          default_entity_id: sensor.markedroid_net_afname
          unit_of_measurement: "Wh"
          device_class: energy
          state_class: total_increasing
          icon: mdi:transmission-tower-import
          state: >-
            {{ ((this.state | float(0)) + ([trigger.payload_json.TotWhImpInc | float(0), 0] | max)) | round(2) }}
    - triggers:
        - trigger: mqtt
          topic: "public/realtimedata/meter"
      sensor:
        - name: "MarkeDroid net teruglevering"
          unique_id: markedroid_net_teruglevering
          default_entity_id: sensor.markedroid_net_teruglevering
          unit_of_measurement: "Wh"
          device_class: energy
          state_class: total_increasing
          icon: mdi:transmission-tower-export
          state: >-
            {{ ((this.state | float(0)) + ([trigger.payload_json.TotWhExpInc | float(0), 0] | max)) | round(2) }}

  ############################################################################
  ## MARKEDROID - WAT DE REGISSEUR ZELF ZEGT (21 september 2026)
  ##
  ## De MarkeDroid-appliance (192.168.30.64) draait een eigen MQTT-broker
  ## zonder login en publiceert daar om de ~10 seconden vier JSON-berichten
  ## op `public/realtimedata/{solar,load,battery,meter}`. Alleen lezen: hij
  ## neemt over MQTT geen opdrachten aan, en dat is precies goed zo.
  ##
  ## HA's MQTT-integratie praat met één broker, en dat is die in CT 108. De
  ## berichten komen hier dus binnen via een BRUG in die Mosquitto
  ## (`topic public/realtimedata/+ in 0`), niet via een tweede integratie.
  ##
  ## TWEE SOORTEN ENTITEITEN
  ##   * Wat NIEMAND anders weet: `sensor.markedroid_regie` (in welke stand
  ##     MarkeDroid de accu heeft gezet), `sensor.markedroid_exportbegrenzer`
  ##     en `binary_sensor.markedroid_verbinding`. Daar mag een automatisering
  ##     op sturen.
  ##   * DE REST VAN DE FEED (`sensor.markedroid_zon_*`, `_last_*`, `_accu_*`,
  ##     `_net_*` en de energietellers): wat MarkeDroid zelf ziet, om naast de
  ##     Deye en de P1 te leggen als er iets niet klopt. NIET de bron voor de
  ##     rest van het huis - dat blijven `sensor.accu_*` hierboven en de P1
  ##     ([[slimhuys-p1-bron]]). Twee kopieën van hetzelfde getal met een
  ##     andere vertraging is een uitnodiging om ze door elkaar te gebruiken.
  ##
  ## TWEE DINGEN UIT DE LIVE BERICHTEN DIE NIET IN DE HANDLEIDING STAAN
  ##   * HET TEKEN VAN `battery.W` IS HIER OMGEKEERD T.O.V. DE DOCUMENTATIE.
  ##     De handleiding zegt "negatief = laden". Op 21 september 17:07 gaf
  ##     MarkeDroid -697 W terwijl `TotWhDisChaInc` opliep, `TotWhChaInc` op 0
  ##     stond, `DCI` negatief was en de Deye zelf +716 W ONTladen meldde.
  ##     Bij ons is het dus positief = laden, gelijk aan `sensor.accu_vermogen`.
  ##     Wie hier ooit een vermogen van overneemt: vertrouw de handleiding niet,
  ##     vertrouw de `Inc`-tellers.
  ##   * `load.W` IS NIET HET HUISVERBRUIK. Op datzelfde moment: load 728 W,
  ##     terwijl de zolderpanelen 2,4 kW leverden en de P1 op nul stond. De
  ##     panelen op zolder hangen aan een eigen omvormer die MarkeDroid niet
  ##     ziet. `sensor.huis_verbruik` blijft de bron.
  ##
  ## `CurrentCmnd`, `VppValue` en `VppComponent` worden volgens ModuSun
  ## geleidelijk uitgerold en zaten op 21 september nog NIET in onze
  ## berichten. Tot ze komen staat de regie op `niet_geleverd` - en dat is
  ## geen storing.
  ############################################################################
  mqtt:
    sensor:
      # De stand waarin MarkeDroid de accu nu heeft gezet. Bedoeld als rem voor
      # alles wat later zware lasten op zonne-overschot schakelt: tijdens
      # `geforceerd_laden`, `flex` en `geblokkeerd` doet MarkeDroid iets met
      # opzet, en een automatisering die daar tegenin stuurt is de tweede baas
      # waar de kop van dit bestand voor waarschuwt.
      - name: "MarkeDroid regie"
        unique_id: markedroid_regie
        default_entity_id: sensor.markedroid_regie
        state_topic: "public/realtimedata/battery"
        icon: mdi:battery-sync
        # Een ontbrekend veld is een ander verhaal dan een stille broker: het
        # eerste geeft `niet_geleverd`, het tweede via `expire_after`
        # `unavailable`.
        value_template: >-
          {% set namen = {0: 'geen_regie', 1: 'geblokkeerd', 2: 'vasthouden',
                          3: 'geforceerd_laden', 4: 'teruglevering_voorrang',
                          5: 'eigen_verbruik', 6: 'flex', 7: 'max_terugleveren'} %}
          {% set c = value_json.CurrentCmnd if value_json.CurrentCmnd is defined else none %}
          {{ 'niet_geleverd' if c is none else namen.get(c | int(-1), 'onbekend_' ~ c) }}
        json_attributes_topic: "public/realtimedata/battery"
        json_attributes_template: >-
          {% set tekst = {0: 'MarkeDroid stuurt niet', 1: 'accu geblokkeerd, laden en ontladen dicht',
                          2: 'vasthouden, alleen laden', 3: 'geforceerd laden van het net',
                          4: 'teruglevering heeft voorrang', 5: 'vrij, eigen verbruik',
                          6: 'flex-opdracht (VPP)', 7: 'maximaal terugleveren'} %}
          {% set c = value_json.CurrentCmnd if value_json.CurrentCmnd is defined else none %}
          {{ {
               'code': c,
               'omschrijving': ('geen regie-veld in de berichten' if c is none
                                else tekst.get(c | int(-1), 'onbekende code ' ~ c)),
               'flex_w': value_json.VppValue if value_json.VppValue is defined else none,
               'flex_meetpunt': value_json.VppComponent if value_json.VppComponent is defined else none
             } | tojson }}
        expire_after: 60

      # 0 = teruglevering zoals altijd, 1 = MarkeDroid zet de export op 0 W
      # (meestal een negatieve prijs), 2 = de begrenzer zelf is in storing.
      - name: "MarkeDroid exportbegrenzer"
        unique_id: markedroid_exportbegrenzer
        default_entity_id: sensor.markedroid_exportbegrenzer
        state_topic: "public/realtimedata/solar"
        value_template: >-
          {% set s = value_json.ExpLimiterState if value_json.ExpLimiterState is defined else none %}
          {{ {0: 'uit', 1: 'actief', 2: 'storing'}.get(s | int(-1), 'onbekend') if s is not none else 'onbekend' }}
        icon: mdi:transmission-tower-export
        expire_after: 60

      ########################################################################
      ## DE REST VAN DE FEED - kijken, niet sturen (zie de kop hierboven)
      ########################################################################
      # Alleen de PV aan de Deye. De zolderpanelen hangen aan een eigen omvormer
      # en zitten hier NIET in - daarvoor is `sensor.zon_vermogen_nu`.
      - name: "MarkeDroid zon vermogen"
        unique_id: markedroid_zon_vermogen
        default_entity_id: sensor.markedroid_zon_vermogen
        state_topic: "public/realtimedata/solar"
        value_template: "{{ value_json.W }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        expire_after: 60
      # Heet in de handleiding 'geinstalleerd PV-vermogen', maar staat bij ons op
      # 20.000: dat is het vermogen van de omvormer, niet van de panelen.
      - name: "MarkeDroid zon capaciteit"
        unique_id: markedroid_zon_capaciteit
        default_entity_id: sensor.markedroid_zon_capaciteit
        state_topic: "public/realtimedata/solar"
        value_template: "{{ value_json.SolarWCapacity }}"
        unit_of_measurement: "W"
        device_class: power
        icon: mdi:solar-panel
        expire_after: 60
      # NIET het huisverbruik - zie de kop. `sensor.huis_verbruik` blijft de bron.
      - name: "MarkeDroid last vermogen"
        unique_id: markedroid_last_vermogen
        default_entity_id: sensor.markedroid_last_vermogen
        state_topic: "public/realtimedata/load"
        value_template: "{{ value_json.W }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        expire_after: 60
      # Doorgegeven zoals MarkeDroid het stuurt, en dat is bij ons POSITIEF =
      # LADEN, tegen de handleiding in (zie de kop). Zet ModuSun dat ooit
      # recht, dan draait dit getal om en `sensor.accu_vermogen` niet.
      - name: "MarkeDroid accu vermogen"
        unique_id: markedroid_accu_vermogen
        default_entity_id: sensor.markedroid_accu_vermogen
        state_topic: "public/realtimedata/battery"
        value_template: "{{ value_json.W }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        expire_after: 60
      - name: "MarkeDroid accu lading"
        unique_id: markedroid_accu_lading
        default_entity_id: sensor.markedroid_accu_lading
        state_topic: "public/realtimedata/battery"
        value_template: "{{ value_json.SoC }}"
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        expire_after: 60
      # 30,72 kWh = 600 Ah x 51,2 V; `sensor.accu_capaciteit` rekent met 48 V.
      - name: "MarkeDroid accu capaciteit"
        unique_id: markedroid_accu_capaciteit
        default_entity_id: sensor.markedroid_accu_capaciteit
        state_topic: "public/realtimedata/battery"
        value_template: "{{ (value_json.CapacityWh | float(0) / 1000) | round(2) }}"
        unit_of_measurement: "kWh"
        device_class: energy_storage
        expire_after: 60
      - name: "MarkeDroid accu temperatuur"
        unique_id: markedroid_accu_temperatuur
        default_entity_id: sensor.markedroid_accu_temperatuur
        state_topic: "public/realtimedata/battery"
        value_template: "{{ value_json.BatTemp }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        expire_after: 60
      - name: "MarkeDroid accu spanning"
        unique_id: markedroid_accu_spanning
        default_entity_id: sensor.markedroid_accu_spanning
        state_topic: "public/realtimedata/battery"
        value_template: "{{ value_json.DCV }}"
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        expire_after: 60
      - name: "MarkeDroid accu stroom"
        unique_id: markedroid_accu_stroom
        default_entity_id: sensor.markedroid_accu_stroom
        state_topic: "public/realtimedata/battery"
        value_template: "{{ value_json.DCI }}"
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        expire_after: 60
      # Het flex-doel (VPP), positief = van het net kopen. `unknown` zolang er
      # geen flex-opdracht loopt of het veld nog niet is uitgerold.
      - name: "MarkeDroid flex vermogen"
        unique_id: markedroid_flex_vermogen
        default_entity_id: sensor.markedroid_flex_vermogen
        state_topic: "public/realtimedata/battery"
        value_template: "{{ value_json.VppValue if value_json.VppValue is defined and value_json.VppValue is number else none }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        expire_after: 60
      # Positief = afnemen, negatief = terugleveren. Zelfde punt als de P1;
      # de P1 blijft de bron, dit is de getuige.
      - name: "MarkeDroid net vermogen"
        unique_id: markedroid_net_vermogen
        default_entity_id: sensor.markedroid_net_vermogen
        state_topic: "public/realtimedata/meter"
        value_template: "{{ value_json.W }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        expire_after: 60
      - name: "MarkeDroid net vermogen L1"
        unique_id: markedroid_net_vermogen_l1
        default_entity_id: sensor.markedroid_net_vermogen_l1
        state_topic: "public/realtimedata/meter"
        value_template: "{{ value_json.WphA }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        expire_after: 60
      - name: "MarkeDroid net vermogen L2"
        unique_id: markedroid_net_vermogen_l2
        default_entity_id: sensor.markedroid_net_vermogen_l2
        state_topic: "public/realtimedata/meter"
        value_template: "{{ value_json.WphB }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        expire_after: 60
      - name: "MarkeDroid net vermogen L3"
        unique_id: markedroid_net_vermogen_l3
        default_entity_id: sensor.markedroid_net_vermogen_l3
        state_topic: "public/realtimedata/meter"
        value_template: "{{ value_json.WphC }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        expire_after: 60
      - name: "MarkeDroid net spanning L1"
        unique_id: markedroid_net_spanning_l1
        default_entity_id: sensor.markedroid_net_spanning_l1
        state_topic: "public/realtimedata/meter"
        value_template: "{{ value_json.VphA }}"
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        expire_after: 60
      - name: "MarkeDroid net spanning L2"
        unique_id: markedroid_net_spanning_l2
        default_entity_id: sensor.markedroid_net_spanning_l2
        state_topic: "public/realtimedata/meter"
        value_template: "{{ value_json.VphB }}"
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        expire_after: 60
      - name: "MarkeDroid net spanning L3"
        unique_id: markedroid_net_spanning_l3
        default_entity_id: sensor.markedroid_net_spanning_l3
        state_topic: "public/realtimedata/meter"
        value_template: "{{ value_json.VphC }}"
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        expire_after: 60

    binary_sensor:
      # Aan zolang er berichten komen; valt uit na een minuut stilte. Een
      # `off_delay` en niet `expire_after`: die tweede maakt er `unavailable`
      # van, en dan kan een kaart "geen verbinding" niet onderscheiden van
      # "HA weet het niet". De timer begint bij elk bericht opnieuw.
      - name: "MarkeDroid verbinding"
        unique_id: markedroid_verbinding
        default_entity_id: binary_sensor.markedroid_verbinding
        state_topic: "public/realtimedata/battery"
        value_template: "ON"
        device_class: connectivity
        off_delay: 60

      - name: "MarkeDroid teruglevering"
        unique_id: markedroid_teruglevering
        default_entity_id: binary_sensor.markedroid_teruglevering
        state_topic: "public/realtimedata/meter"
        # 100 W marge, zoals de handleiding: rond nul tikt de meter heen en weer.
        value_template: "{{ 'ON' if value_json.W | float(0) < -100 else 'OFF' }}"
        icon: mdi:transmission-tower-export
        expire_after: 60

      # Alle drie de fases onder 50 V, gezien door MarkeDroids eigen meter. Een
      # tweede getuige naast `binary_sensor.huis_op_accu`, geen vervanging: die
      # heeft de grendel en de 30 seconden vertraging.
      - name: "MarkeDroid net uitgevallen"
        unique_id: markedroid_net_uitgevallen
        default_entity_id: binary_sensor.markedroid_net_uitgevallen
        state_topic: "public/realtimedata/meter"
        value_template: >-
          {{ 'ON' if value_json.VphA | float(999) < 50 and value_json.VphB | float(999) < 50
                     and value_json.VphC | float(999) < 50 else 'OFF' }}
        device_class: problem
        expire_after: 60

      # De exportbegrenzer op 1. De handleiding noemt dit "negatieve prijs",
      # maar MarkeDroid zegt alleen dát hij dichtzet, niet waarom.
      - name: "MarkeDroid negatieve prijs"
        unique_id: markedroid_negatieve_prijs
        default_entity_id: binary_sensor.markedroid_negatieve_prijs
        state_topic: "public/realtimedata/solar"
        value_template: "{{ 'ON' if value_json.ExpLimiterState is defined and value_json.ExpLimiterState == 1 else 'OFF' }}"
        icon: mdi:cash-minus
        expire_after: 60

      - name: "MarkeDroid flex actief"
        unique_id: markedroid_flex_actief
        default_entity_id: binary_sensor.markedroid_flex_actief
        state_topic: "public/realtimedata/battery"
        value_template: >-
          {{ 'ON' if value_json.CurrentCmnd is defined and value_json.CurrentCmnd == 6
                     and value_json.VppValue is defined and value_json.VppValue is number else 'OFF' }}
        icon: mdi:swap-vertical-bold
        expire_after: 60
