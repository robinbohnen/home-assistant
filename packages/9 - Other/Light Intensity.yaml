light_intensity_package:
  sensor:
    # Daglichtsignaal voor de bewegingslichten (blueprint robin/motion_light):
    # het maximum van de twee buitenlichtmeters. De kamers waar dit gebruikt
    # wordt liggen niet allemaal aan dezelfde gevel, en pas als het aan de
    # LICHTSTE kant van het huis helder is, is het overal binnen licht genoeg
    # om de lamp uit te laten. Valt een van de meters weg, dan telt de andere;
    # vallen ze allebei weg, dan leest de blueprint 0 en doen de lampen gewoon
    # hun werk - falen betekent hier licht aan, niet in het donker staan.
    - platform: min_max
      type: max
      round_digits: 0
      name: Buiten Zon Luminance Max
      unique_id: buiten_zon_luminance_max
      entity_ids:
        - sensor.voortuin_zon_luminance
        - sensor.achtertuin_zon_luminance

  automation:
    - id: light_intensity_changes
      alias: General - Light Intensity
      description: Change Light Intensity on sunset and sunrise
      mode: single
      triggers:
        - trigger: sun
          event: sunrise
          offset: 0
          id: sunrise
        - trigger: sun
          event: sunset
          offset: 0
          id: sunset
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - sunrise
              sequence:
                - action: input_number.set_value
                  metadata: {}
                  data:
                    value: 80
                  target:
                    entity_id:
                      - input_number.lights_garage_percentage
                      - input_number.lights_attic_corridor_percentage
                      - input_number.lights_toilet_percentage
                      - input_number.lights_bathroom_percentage
                      - input_number.lights_playroom_percentage
                      - input_number.lights_corridor_percentage
                      - input_number.lights_hallway_percentage
            - conditions:
                - condition: trigger
                  id:
                    - sunset
              sequence:
                - action: input_number.set_value
                  metadata: {}
                  data:
                    value: 40
                  target:
                    entity_id:
                      - input_number.lights_garage_percentage
                      - input_number.lights_attic_corridor_percentage
                      - input_number.lights_toilet_percentage
                      - input_number.lights_bathroom_percentage
                      - input_number.lights_playroom_percentage
                      - input_number.lights_corridor_percentage
                      - input_number.lights_hallway_percentage
          default:
            - choose:
                - conditions:
                    - condition: sun
                      before: sunrise
                      after: sunset
                  sequence:
                    - action: input_number.set_value
                      metadata: {}
                      data:
                        value: 40
                      target:
                        entity_id:
                          - input_number.lights_garage_percentage
                          - input_number.lights_attic_corridor_percentage
                          - input_number.lights_toilet_percentage
                          - input_number.lights_bathroom_percentage
                          - input_number.lights_playroom_percentage
                          - input_number.lights_corridor_percentage
                          - input_number.lights_hallway_percentage
                  alias: sunset
                - conditions:
                    - condition: sun
                      before: sunset
                      after: sunrise
                  sequence:
                    - action: input_number.set_value
                      metadata: {}
                      data:
                        value: 80
                      target:
                        entity_id:
                          - input_number.lights_garage_percentage
                          - input_number.lights_attic_corridor_percentage
                          - input_number.lights_toilet_percentage
                          - input_number.lights_bathroom_percentage
                          - input_number.lights_playroom_percentage
                          - input_number.lights_corridor_percentage
                          - input_number.lights_hallway_percentage
                  alias: sunrise
