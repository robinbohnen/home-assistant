light_intensity_package:
  sensor:
    # Daglichtsignaal: het maximum van de twee buitenlichtmeters. Bewust het
    # MAXIMUM - de achtertuinmeter staat 's ochtends in de schaduw en zou in
    # zijn eentje beweren dat het nog nacht is. Pas als het aan de lichtste
    # kant van het huis donker is, is het overal donker. Valt een van de meters
    # weg, dan telt de andere.
    #
    # Sinds 17 augustus 2026 hangt hier de buitenverlichting aan
    # (blueprints/automation/robin/buitenlicht.yaml, gedeeld door carport,
    # voordeur en achtertuin). Dáár staan ook de drempels en waarom ze zo
    # liggen. Verander je de bronnen hieronder, dan verandert het schakelmoment
    # van alle drie de buitengroepen mee.
    #
    # Oorspronkelijk gebouwd voor de bewegingslichten (blueprint
    # robin/motion_light), maar sinds 11 augustus 2026 leest geen enkele kamer
    # dit meer: de twee overloopen waren de laatste gebruikers en die moeten van
    # Robin ALTIJD aan bij beweging. De `lux_sensor`-ingang van die blueprint
    # bestaat nog, dus één regel in een kamerpakket en de daglichtcheck is terug.
    - platform: min_max
      type: max
      round_digits: 0
      name: Buiten Zon Luminance Max
      unique_id: buiten_zon_luminance_max
      entity_ids:
        - sensor.voortuin_zon_luminance
        - sensor.achtertuin_zon_luminance

  automation:
    - id: light_intensity_changes
      alias: General - Light Intensity
      description: Change Light Intensity on sunset and sunrise
      mode: single
      triggers:
        - trigger: sun
          event: sunrise
          offset: 0
          id: sunrise
        - trigger: sun
          event: sunset
          offset: 0
          id: sunset
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - sunrise
              sequence:
                - action: input_number.set_value
                  metadata: {}
                  data:
                    value: 80
                  target:
                    entity_id:
                      - input_number.lights_garage_percentage
                      - input_number.lights_attic_corridor_percentage
                      - input_number.lights_toilet_percentage
                      - input_number.lights_bathroom_percentage
                      - input_number.lights_playroom_percentage
                      - input_number.lights_corridor_percentage
                      - input_number.lights_hallway_percentage
            - conditions:
                - condition: trigger
                  id:
                    - sunset
              sequence:
                - action: input_number.set_value
                  metadata: {}
                  data:
                    value: 40
                  target:
                    entity_id:
                      - input_number.lights_garage_percentage
                      - input_number.lights_attic_corridor_percentage
                      - input_number.lights_toilet_percentage
                      - input_number.lights_bathroom_percentage
                      - input_number.lights_playroom_percentage
                      - input_number.lights_corridor_percentage
                      - input_number.lights_hallway_percentage
          default:
            - choose:
                - conditions:
                    - condition: sun
                      before: sunrise
                      after: sunset
                  sequence:
                    - action: input_number.set_value
                      metadata: {}
                      data:
                        value: 40
                      target:
                        entity_id:
                          - input_number.lights_garage_percentage
                          - input_number.lights_attic_corridor_percentage
                          - input_number.lights_toilet_percentage
                          - input_number.lights_bathroom_percentage
                          - input_number.lights_playroom_percentage
                          - input_number.lights_corridor_percentage
                          - input_number.lights_hallway_percentage
                  alias: sunset
                - conditions:
                    - condition: sun
                      before: sunset
                      after: sunrise
                  sequence:
                    - action: input_number.set_value
                      metadata: {}
                      data:
                        value: 80
                      target:
                        entity_id:
                          - input_number.lights_garage_percentage
                          - input_number.lights_attic_corridor_percentage
                          - input_number.lights_toilet_percentage
                          - input_number.lights_bathroom_percentage
                          - input_number.lights_playroom_percentage
                          - input_number.lights_corridor_percentage
                          - input_number.lights_hallway_percentage
                  alias: sunrise
