# De zinnen bij de intents uit packages/0 - Ground Floor/Kitchen/Voice.yaml.
#
# Home Assistant leest alles onder custom_sentences/<taal>/ en matcht letterlijk:
# er zit geen taalmodel tussen, dus wat hier niet staat wordt niet herkend. Vandaar
# per intent een handvol formuleringen in plaats van één nette. Hoofdletters en
# leestekens doen niet mee; [blokhaken] zijn optioneel, (a|b) is een keuze.
#
# tests/test_spraak.py bewaakt dat deze lijst en de intents in het pakket bij
# elkaar blijven horen. Nieuwe zinnen vragen een volledige herstart.

language: "nl"

intents:
  ###########################################################################
  ## Kazerne
  ###########################################################################
  BrandweerBezetting:
    data:
      - sentences:
          - "(hoe|wat) is de bezetting [op de kazerne]"
          - "hoe staat de (bezetting|kazerne|ploeg) ervoor"
          - "hoeveel man staat er op [de kazerne]"
          - "hoeveel man (is|zijn) er beschikbaar"
          - "is de ploeg op orde"
          - "zijn we onderbezet"
          - "heb ik [deze week] dienst"

  ###########################################################################
  ## Stroom
  ###########################################################################
  StroomprijsNu:
    data:
      - sentences:
          - "is de stroom [nu] goedkoop"
          - "is de stroom [nu] duur"
          - "wat kost de stroom [nu]"
          - "hoe duur is de stroom [nu]"
          - "wat is de stroomprijs [nu]"
          - "is dit een goed moment om te laden"

  ###########################################################################
  ## Energie
  ###########################################################################
  ThuisAccu:
    data:
      - sentences:
          - "hoe vol (is|zit) de (accu|thuisaccu)"
          - "hoe staat de (accu|thuisaccu) ervoor"
          - "wat doet de (accu|thuisaccu)"
          - "is de (accu|thuisaccu) [al] vol"
          - "hoe vol is de (thuisbatterij|batterij van het huis)"

  Zonnepanelen:
    data:
      - sentences:
          - "wat leveren de (panelen|zonnepanelen) [nu] [op]"
          - "hoe doen de (panelen|zonnepanelen) het [vandaag]"
          - "hoeveel wekken we [nu] op"
          - "hoeveel hebben we vandaag opgewekt"
          - "draaien de (panelen|zonnepanelen) [goed]"

  ###########################################################################
  ## Auto
  ###########################################################################
  AutoStatus:
    data:
      - sentences:
          - "hoe vol (is|zit) de auto"
          - "hoe staat de auto ervoor"
          - "is de auto (vol|opgeladen)"
          - "is de auto [nog] aan het laden"
          - "laadt de auto [nog]"
          - "hoe ver (kom ik|komen we) [nog] met de auto"
          - "kan ik weg met de auto"

  ReistijdWerk:
    data:
      - sentences:
          - "hoe lang is het [rijden] naar [het] werk"
          - "hoe druk is het [op de weg] naar [het] werk"
          - "wat is de reistijd naar [het] werk"

  ###########################################################################
  ## Gezin
  ###########################################################################
  WieThuis:
    data:
      - sentences:
          - "wie (is|zijn) er [allemaal] thuis"
          - "is iedereen thuis"
          - "wie is er [allemaal] weg"
          - "zijn de kinderen [al] thuis"

  ###########################################################################
  ## Afval
  ###########################################################################
  Afval:
    data:
      - sentences:
          - "(welke|wat voor) (bak|container|kliko) moet [er] (buiten|aan de straat)"
          - "moet er [vandaag|vanavond] een (bak|container|kliko) (buiten|aan de straat)"
          - "(welk|wat voor) afval wordt er (vandaag|morgen) opgehaald"
          - "wordt er (vandaag|morgen) afval opgehaald"

  ###########################################################################
  ## Zonwering
  ##
  ## Let op: cover.achtertuin_zonnescherm is omgekeerd bedraad en staat daarom
  ## bewust NIET blootgesteld aan Assist. Zou hij dat wel zijn, dan pakt de
  ## ingebouwde cover-intent "doe het zonnescherm dicht" op en gebeurt het
  ## omgekeerde. Zie de kop van het pakket.
  ###########################################################################
  ZonneschermAdvies:
    data:
      - sentences:
          - "moet het zonnescherm (uit|eruit)"
          - "kan het zonnescherm (uit|eruit)"
          - "wat doet het zonnescherm"
          - "hoe staat het zonnescherm"
          - "wat vindt de zonwering ervan"

  ZonneschermUit:
    data:
      - sentences:
          - "(zet|doe|schuif|rol) het zonnescherm (uit|eruit)"
          - "zonnescherm (uit|eruit)"
          - "doe het scherm eruit"

  ZonneschermIn:
    data:
      - sentences:
          - "(haal|trek|doe|zet|rol) het zonnescherm (in|binnen)"
          - "zonnescherm (in|binnen)"
          - "haal het scherm binnen"

  ###########################################################################
  ## Het huis
  ###########################################################################
  HuisOpen:
    data:
      - sentences:
          - "staat er nog (iets|een raam|een deur) open"
          - "staat er (iets|ergens iets) open"
          - "wat staat er [nog] open"
          - "(is|staat) alles dicht"

  HuisAandacht:
    data:
      - sentences:
          - "hoe staat het huis ervoor"
          - "hoe is het binnen"
          - "welke (kamers|ruimtes) vragen aandacht"
          - "is er (iets|ergens iets) aan de hand"

  LichtenUit:
    data:
      - sentences:
          - "(doe|zet) alle lichten uit"
          - "alle lichten uit"
          - "(doe|zet) de lichten [beneden] uit"

  ###########################################################################
  ## Acties
  ##
  ## Let op de volgorde-gevoeligheid: "ik ga slapen" en "ik ga naar bed" zijn
  ## aparte zinnen, want de matcher kent geen synoniemen. Het alarm kan hier
  ## alleen AAN - uitzetten met de stem staat bewust nergens, zie de
  ## toelichting bij de intents zelf.
  ###########################################################################
  # BEWUST GEEN "welterusten", "goedenacht" of "goedemorgen" - dat zijn
  # groeten die hier tegen elkaar gezegd worden. Tijdens een open
  # antwoordvenster luistert de satelliet zonder wake word, en dan zou een
  # welterusten tegen de kinderen het huis op slot doen. Zelfde afweging als
  # eerder bij LichtenUit, zie docs/spraak.md.
  RoutineAvond:
    data:
      - sentences:
          - "(ik ga|we gaan) (slapen|naar bed)"
          - "start de avondroutine"
          - "doe de avondroutine"

  RoutineOchtend:
    data:
      - sentences:
          - "(ik ben|we zijn) wakker"
          - "start de ochtendroutine"
          - "doe de ochtendroutine"

  AutoAirco:
    data:
      - sentences:
          - "(start|zet) de airco van de auto [aan]"
          - "(koel|verwarm) de auto [vast|alvast]"
          - "zet de auto vast (aan|klaar)"
          - "airco van de auto aan"

  AlarmAan:
    data:
      - sentences:
          - "(zet|doe) het alarm aan"
          - "alarm aan"
          - "(zet|doe) het huis op scherp"
          - "schakel het alarm in"

  ###########################################################################
  ## Antwoorden op een vraag die het huis zelf gesteld heeft
  ##
  ## Deze zinnen matchen altijd, ook als er niets open staat - dan zegt het
  ## huis dat. Ze staan bewust kort: na een vraag van de satelliet antwoord je
  ## met één woord, niet met een volzin.
  ###########################################################################
  AntwoordJa:
    data:
      - sentences:
          # De optionele staart dekt ook het kale "ja"; twee keer dezelfde zin
          # in één intent zetten heeft geen zin.
          - "ja [graag|hoor|prima|doe maar]"
          - "doe maar [wel]"
          - "(oke|oké)"

  AntwoordNee:
    data:
      - sentences:
          - "nee [hoor|dank je|bedankt|laat maar]"
          - "laat maar [zitten]"
          - "niet doen"
          - "liever niet"
