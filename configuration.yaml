#################################################################
## Home Assistant Core
#################################################################

homeassistant:
  auth_providers:
    - type: homeassistant
  auth_mfa_modules:
    - type: totp
      name: Authenticator app
  packages: !include_dir_merge_named packages/
  external_url: !secret homeassistant_url
  internal_url: !secret homeassistant_url
  allowlist_external_dirs:
    - /config/www

frontend:
  # De map themes/ staat NIET in deze repo en dat is goed: hij wordt gevuld door
  # HACS (nu de Frosted Glass-varianten, geverifieerd op de draaiende HA op
  # 2026-08-06). Kloon je deze config naar een lege machine, dan moet HACS eerst
  # zijn thema's binnenhalen; zonder die map faalt deze include.
  themes: !include_dir_merge_named themes/
  # Card-mod haakt zich in op het aanmaken van kaarten, kiosk-mode op het
  # opbouwen van header en sidebar. Als Lovelace-resource laden ze pas terwijl
  # de view al rendert; verliezen ze die race (Safari doet dat regelmatig), dan
  # blijven de styles weg of flitst de header alsnog door tot een handmatige
  # reload. extra_module_url laadt ze vóór Lovelace. Zelfde URL's als in
  # dashboards/resources.yaml, dus de modules worden niet dubbel uitgevoerd.
  extra_module_url:
    - /hacsfiles/lovelace-card-mod/card-mod.js
    - /hacsfiles/kiosk-mode/kiosk-mode.js

history:

logbook:
  exclude:
    #    entities:
    entity_globs:
      - binary_sensor.pir*
    domains:
      - automation
      - input_boolean
      - media_player

logger:
  default: warn
  logs:
    homeassistant.components.analytics: info # I'd like to see what is sent
  filters:
    homeassistant:
      - "Error doing job"
    homeassistant.components.goodwe.coordinator:
      - "No valid response received even after 10 retries"
    py.warnings:
      - "InsecureRequestWarning"
      - "functools.partial will be a method descriptor"
    homeassistant.components.waze_travel_time:
      - "Error on retrieving data"
    homeassistant.components.waze_travel_time.sensor:
      - "No routes found"
    homeassistant.helpers.entity:
      - "Update of sensor.robin_reistijd_naar_werk is taking over 10 seconds"
      - "Update of sensor.samantha_reistijd_naar_huis is taking over 10 seconds"
      - "Update of sensor.robin_reistijd_naar_huis is taking over 10 seconds"
    custom_components.nest_protect.pynest:
      - "Authentication error: invalid_request"
      - "Could not interpret Nest response"
    custom_components.nest_protect:
      - "Unknown pynest exception. Please create an issue on GitHub with your logfile. Updates paused for 1 minute."
    custom_components.sems.sems_api:
      - "Unable to fetch data from SEMS."

lovelace:
  mode: yaml
  resources: !include dashboards/resources.yaml

recorder:
  # Standaard bewaart HA 10 dagen. Dat is te kort voor de kaarten die over een
  # maand kijken: apexcharts leest rauwe historie, dus een `graph_span: 30d`
  # (zoals "Verbruik per dag" op het overzicht) tekende met de default nooit
  # meer dan tien staafjes en liet de rest leeg - wat leest als een kapotte
  # sensor terwijl de data simpelweg al gepurged was.
  #
  # Dit geldt voor ALLE ~4.300 entiteiten, niet alleen de auto, dus de database
  # wordt navenant groter. De uitsluitingen hieronder houden dat in toom;
  # groeit het alsnog uit de hand, dan is dit getal de eerste knop.
  purge_keep_days: 35
  exclude:
    domains:
      - camera
      - media_player
      - sun
      - update
    entity_globs:
      - sensor.sun_*
    entities:
      # Draagt het hele kamer-overzicht in één attribuut (~10 kB) en werkt elke
      # minuut bij. Opnemen zou de database met tientallen MB's per dag laten
      # groeien voor een pagina die alleen het nu laat zien; de historie per
      # meetwaarde haal je uit de sensoren zelf. Zie packages/9 - Other/Kamers.yaml.
      - sensor.kamers
      # Zelfde verhaal: een onderhoudslijst met entity-id's in een attribuut,
      # waarvan alleen het nu telt.
      - sensor.kamers_niet_gekoppeld
      # Draagt de hele PreCom-stand (alle functies, alle namen) in attributen.
      # De historie die er wél toe doet staat als los getal in
      # sensor.brandweer_bezetting_tekort. Zie packages/9 - Other/Brandweer Bezetting.yaml.
      - sensor.brandweer_bezetting
      # Onderstaande vier zetten allemaal meer dan 16 kB aan attributen weg en
      # kregen daar bij elke herstart een waarschuwing over ("State attributes
      # ... exceed maximum size of 16384 bytes. This can cause database
      # performance issues"), gezien in het log van 2026-08-06.
      #
      # De twee prijssensoren dragen de hele dagstaffel in `raw_today`. De
      # dashboards lezen dat attribuut zoals het NU is (de grafieken in
      # dashboard.yaml, nest_hub.yaml en overzicht/kolom_links.yaml bouwen hun
      # balken daaruit op), dus aan de historie van dat attribuut heeft niemand
      # iets - terwijl hij elke dag opnieuw tientallen kB's wegschrijft.
      - sensor.slimhuys_zonneplan_prijzen_vandaag
      - sensor.slimhuys_zonneplan_prijzen_vandaag_kwartier
      # Nergens in deze config gebruikt en niet in het Energy-dashboard
      # (nagekeken op 2026-08-06); puur een grote attributenbak.
      - sensor.meterkast_slimhuys_zonneplan_teruglevering_vandaag
      # Interne sensor van bubble-card met de kaartmodules erin. Geen meetwaarde,
      # alleen code die toevallig in een attribuut staat.
      - sensor.bubble_card_modules

tts:
  - platform: microsoft
    api_key: !secret azure_voice_key
    region: !secret azure_voice_region
    language: !secret azure_voice_language
    type: !secret azure_voice_name

#################################################################
## Includes
#################################################################
automation: !include automations.yaml
script: !include scripts.yaml

#################################################################
## default_config items not included elsewhere
#################################################################
#default_config:
application_credentials:
# Assist. Zit normaal in default_config, en die staat hier uit: zonder deze
# drie is er geen pipeline, geen `conversation.process` en worden de zinnen in
# custom_sentences/nl/ niet ingelezen. `intent` komt als afhankelijkheid van
# `conversation` toch wel mee, maar staat er expliciet bij omdat de intents in
# packages/0 - Ground Floor/Kitchen/Voice.yaml erop leunen. Zie docs/spraak.md.
assist_pipeline:
conversation:
intent:
backup:
bluetooth:
cloud:
dhcp:
diagnostics:
energy:
homeassistant_alerts:
media_source:
mobile_app:
my:
ssdp:
stream:
sun:
webhook:
zeroconf:

#################################################################
## Components not using includes
#################################################################
command_line:
  notify:
    # Notify bogus service
    # Used to let automations not error out
    name: bogus
    command: ":" # bash no-op command

climate:
  - platform: intesishome
    username: !secret intesishome_username
    password: !secret intesishome_password
    device: airconwithme

