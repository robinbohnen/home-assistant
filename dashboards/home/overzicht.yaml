kiosk_mode:
  user_settings:
    - users:
        - Robin Bohnen
        - Samantha Henkelman
      kiosk: true
      hide_header: true
      hide_sidebar: true
      hide_menu_button: true
      hide_overflow: true
title: Overzicht
path: overzicht
icon: mdi:view-dashboard-outline
panel: true
cards:
  - type: vertical-stack
    card_mod:
      style: |
        :host { height: 100% !important; }
        #root {
          /* Paneelstijl staat hier als custom properties. Die erven door shadow-DOM
             heen, zodat de kolombestanden geen YAML-anchor nodig hebben.
             --ov-panel-bg en de kleurtokens staan NIET meer hier maar in
             www/ov-tokens.js: die moeten ook op de Nest Hub gelden, en daar
             draait card-mod niet. Alleen vorm staat hier. */
          --ov-panel-border: 1px solid var(--ov-ink-6);
          --ov-panel-radius: 20px;
          --ov-panel-padding: 13px 16px;
          /* SCHAALFACTOR VOOR SMALLE SCHERMEN - zie het blok met media queries
             onderaan dit `style`. Header, kolommen en tijdlijn lezen hem elk
             als `zoom: var(--ov-zoom)`; de popups bewust niet, die openen
             schermvullend en mogen op ware grootte blijven. */
          --ov-zoom: 1;
          gap: 14px !important;
          min-height: calc(100vh - 8px) !important;
          margin: 0 !important;
          padding: 20px 24px 24px 24px !important;
          background: var(--primary-background-color) !important;
          box-sizing: border-box !important;
        }
        @media (max-width: 800px) {
          #root { padding: 14px 12px 16px 12px !important; gap: 14px !important; }
        }

        /* ==================== SCHALEN OP EEN TABLET ====================
           Dit dashboard is getekend op de breedte van het wandpaneel: ~1870px
           werkruimte (schermbreedte min de marges, sidebar verborgen door
           kiosk-mode). De drie kolommen hebben op ware grootte samen ongeveer
           1500px nodig. Een iPad in landschap heeft er 1076 (1180 CSS-px min
           de sidebar van 56 en de marges van 48), en daar liep de inhoud dus
           over: personen over hun batterijpercentage, de brandweermelding
           halverwege een woord afgekapt, de mediakaart buiten de kaartrand.

           Verkleinen in plaats van herindelen. Een tussenstap met twee
           kolommen (links en rechts onder elkaar, midden ernaast) paste wel,
           maar maakte de pagina ~650px langer - "2 kolommen en een lange
           scrolllijst eronder". Met `zoom` blijft de compositie exact die van
           het paneel en wordt alles alleen kleiner: `zoom` verkleint niet
           alleen de weergave maar ook de coordinaten, dus de kolom rekent met
           1076 / 0.72 = 1494px aan ruimte. Dat is precies de breedte waarvoor
           de kaarten getekend zijn.

           Kleiner is hier niet slechter leesbaar: 14,5px op 72% is 10,4px op
           een tablet op leesafstand, en dat is hoekgemeten ruimer dan 14,5px
           op een paneel aan de muur op twee meter.

           De trappen mikken allemaal op ~1500-1650px rekenbreedte; wil je het
           groter of kleiner, dan is dit blok de enige plek om te draaien.
           Boven 1650px is er ruimte genoeg en staat de schaal op 1.
           Onder 1001px valt alles al in een kolom (zie de body-stack) en is
           schalen niet nodig - dan is er breedte zat voor een kolom. */
        @media (min-width: 1001px) and (max-width: 1150px) { #root { --ov-zoom: 0.62; } }
        @media (min-width: 1151px) and (max-width: 1300px) { #root { --ov-zoom: 0.72; } }
        @media (min-width: 1301px) and (max-width: 1450px) { #root { --ov-zoom: 0.82; } }
        @media (min-width: 1451px) and (max-width: 1650px) { #root { --ov-zoom: 0.92; } }
    cards:
      # =================== HEADER ===================
      - !include overzicht/header.yaml

      # =================== ALARM AFGEGAAN ===================
      # Een popup die zichzelf opent vraagt browser_mod (zie de comment bij de
      # deurbel-popup verderop); dat zit niet in dashboards/resources.yaml.
      # Dit is de vervanging: een balk die je niet kunt missen zodra Alarmo
      # `pending` of `triggered` is, met één tik naar #ov-alarm waar de
      # uit-knop staat. Een `conditional`-kaart zet zichzelf op display:none,
      # dus in de rest van de tijd kost dit geen enkele pixel - ook geen gat
      # in de `gap` van de vertical-stack.
      #
      # `pending` staat er bewust bij: dat is de entry delay, het moment dat je
      # binnenkomt en het alarm nog NIET is afgegaan. Precies dan wil je die
      # knop zien, niet pas als de sirene loopt.
      - type: conditional
        conditions:
          - condition: state
            entity: alarm_control_panel.alarmo
            state:
              - triggered
              - pending
        card:
          type: custom:button-card
          entity: alarm_control_panel.alarmo
          show_name: false
          show_icon: false
          show_state: false
          tap_action:
            action: navigate
            navigation_path: "#ov-alarm"
          extra_styles: |
            @keyframes ov_alarm_pulse {
              0%, 100% { box-shadow: 0 0 0 0 var(--ov-bad-45); }
              50%      { box-shadow: 0 0 0 10px var(--ov-bad-0); }
            }
          styles:
            card:
              - background: var(--ov-bad-20)
              - border: 1px solid var(--ov-bad-55)
              - border-radius: 18px
              - padding: 14px 18px
              - height: auto
              - animation: ov_alarm_pulse 1.8s ease-out infinite
            grid:
              - grid-template-areas: '"c"'
            custom_fields:
              c:
                # Zonder expliciete breedte krijgt een custom_field de breedte
                # van zijn inhoud, niet van de kaart - dan staat de balk links
                # gepropt in plaats van over de volle breedte.
                - width: 100%
          custom_fields:
            c: |
              [[[
                var s = entity.state;
                var os = entity.attributes.open_sensors || {};
                var namen = Object.keys(os).map(function(e){
                  return (states[e] && states[e].attributes.friendly_name) || e;
                }).join(', ');
                var kop = (s === 'pending') ? 'Alarm gaat zo af' : 'ALARM AFGEGAAN';
                var sub = namen || 'geen sensor gemeld';
                return `<div style="display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;width:100%">
                  <ha-icon icon="mdi:shield-alert" style="--mdc-icon-size:30px;color:var(--ov-bad);justify-self:start"></ha-icon>
                  <div style="min-width:0;text-align:left">
                    <div style="font-size:19px;font-weight:800;color:var(--primary-text-color);letter-spacing:0.4px">${kop}</div>
                    <div style="font-size:13px;color:var(--ov-ink-72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${sub}</div>
                  </div>
                  <div style="font-size:13px;font-weight:600;color:var(--ov-bad);background:var(--ov-ink-10);padding:8px 14px;border-radius:14px;white-space:nowrap;justify-self:end">Tik om uit te zetten</div>
                </div>`;
              ]]]

      # =================== BODY (3 columns) ===================
      - type: horizontal-stack
        card_mod:
          style: |
            #root {
              display: grid !important;
              grid-template-columns: 1fr 1.95fr 1fr !important;
              gap: 16px !important;
              align-items: start !important;
              zoom: var(--ov-zoom, 1) !important;
            }
            /* Onder de 1000px is er voor drie kolommen ook geschaald geen
               ruimte meer (een telefoon), dus daar valt alles onder elkaar.
               Daartussen blijven het drie kolommen en doet --ov-zoom het werk;
               zie de toelichting bij die variabele bovenaan dit bestand. */
            @media (max-width: 1000px) {
              #root { grid-template-columns: 1fr !important; }
            }
        cards:
          # ----------- LEFT COLUMN -----------
          - !include overzicht/kolom_links.yaml
          # ----------- CENTER COLUMN -----------
          - !include overzicht/kolom_midden.yaml
          # ----------- RIGHT COLUMN -----------
          - !include overzicht/kolom_rechts.yaml

      # =================== TIJDLIJN (12 uur) ===================
      - !include overzicht/tijdlijn.yaml

      # =================== POPUPS ===================
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-personen"
        name: Personen
        icon: mdi:account-group
        # BREEDTE VAN ALLE POPUPS
        # Bubble-card doet standaard 540px op desktop. Dat is smal voor een
        # wandpaneel: de verdiepingspopups werden er zo lang van dat je moest
        # scrollen om bij de rolluiken te komen. Op 1000px passen er drie
        # mushroom-kaarten naast elkaar en past een verdieping vrijwel in beeld.
        # Eén anker, zodat de veertien andere popups niet uit de pas gaan lopen.
        # Op mobiel doet bubble-card sowieso volle breedte; `width_desktop`
        # geldt alleen boven zijn eigen breekpunt.
        #
        # NIET DOEN: een eigen `max-width` op `.bubble-pop-up` in de styles
        # hieronder als "vangnet" voor smalle schermen. Bubble-card regelt zijn
        # breedte zélf via max-width; een eigen regel met !important vervangt
        # die begrenzing in plaats van hem aan te vullen, en dan negeert de
        # popup `width_desktop` en rekt hij op tot jouw waarde. Op 2026-08-05
        # liep hij daardoor rechts het scherm uit (sluitkruis onbereikbaar).
        # Breedte hoort hier te staan, niet in de CSS.
        width_desktop: &ov_popup_width 1000px
        styles: &ov_popup |
          .bubble-pop-up {
            background: var(--ov-surface-deep) !important;
            backdrop-filter: blur(18px) !important;
            border: 1px solid var(--ov-ink-6) !important;
            --ha-card-background: var(--ov-panel-bg-2);
            --card-background-color: var(--ov-panel-bg-2);
            --ha-card-border-color: var(--ov-ink-7);
            --ha-card-border-width: 1px;
            --ha-card-border-radius: 16px;
            /* Hier stond `--primary-text-color: #ffffff` om witte tekst in de
               popup te forceren toen die altijd donker was. Weggehaald: de
               popup erft nu de tekstkleur van het thema, en dat is precies
               wat een lichte variant nodig heeft. Terugzetten als var(--...)
               mag NIET - dat is een cyclus en maakt de property ongeldig. */
            --secondary-text-color: var(--ov-ink-55);
            --mush-rgb-disabled: 130, 130, 140;
          }
          .bubble-pop-up-background {
            backdrop-filter: blur(4px) !important;
            background: var(--ov-scrim) !important;
          }
          .bubble-header {
            background: transparent !important;
          }
          .bubble-header .bubble-button-card-container,
          .bubble-button-card-container {
            background: var(--ov-ink-5) !important;
            border: 1px solid var(--ov-ink-6) !important;
            box-shadow: none !important;
          }
          .bubble-icon-container {
            background: var(--ov-ink-8) !important;
          }
          .bubble-icon {
            color: var(--ov-ink-90) !important;
          }
          .bubble-name,
          .bubble-header-name {
            color: var(--primary-text-color) !important;
          }
          .bubble-close,
          .bubble-close-container {
            background: var(--ov-ink-5) !important;
            border: 1px solid var(--ov-ink-6) !important;
            box-shadow: none !important;
          }
          .bubble-close {
            color: var(--ov-ink-85) !important;
          }
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: person.robin_bohnen
                primary: Robin
                secondary: >-
                  {{ 'Thuis' if is_state('person.robin_bohnen','home') else 'Afwezig' }}{{ (' · ' ~ states('sensor.iphone_van_robin_battery_level') ~ '%') if has_value('sensor.iphone_van_robin_battery_level') else '' }}
                icon: mdi:account
                icon_color: "{{ 'green' if is_state('person.robin_bohnen','home') else 'grey' }}"
                tap_action:
                  action: navigate
                  navigation_path: "#ov-persoon-robin"
              - type: custom:mushroom-template-card
                entity: person.samantha_henkelman
                primary: Samantha
                secondary: >-
                  {{ 'Thuis' if is_state('person.samantha_henkelman','home') else 'Afwezig' }}{{ (' · ' ~ states('sensor.iphone_van_samantha_battery_level') ~ '%') if has_value('sensor.iphone_van_samantha_battery_level') else '' }}
                icon: mdi:account
                icon_color: "{{ 'green' if is_state('person.samantha_henkelman','home') else 'grey' }}"
                tap_action:
                  action: navigate
                  navigation_path: "#ov-persoon-samantha"
              - type: custom:mushroom-template-card
                entity: person.emma_bohnen
                primary: Emma
                secondary: >-
                  {{ 'Thuis' if is_state('person.emma_bohnen','home') else 'Afwezig' }}{{ (' · ' ~ states('sensor.iphone_van_emma_battery_level') ~ '%') if has_value('sensor.iphone_van_emma_battery_level') else '' }}
                icon: mdi:account
                icon_color: "{{ 'green' if is_state('person.emma_bohnen','home') else 'grey' }}"
                tap_action:
                  action: navigate
                  navigation_path: "#ov-persoon-emma"
              - type: custom:mushroom-template-card
                entity: person.logan_veen
                primary: Logan
                secondary: >-
                  {{ 'Thuis' if is_state('person.logan_veen','home') else 'Afwezig' }}{{ (' · ' ~ states('sensor.iphone_battery_level') ~ '%') if has_value('sensor.iphone_battery_level') else '' }}
                icon: mdi:account
                icon_color: "{{ 'green' if is_state('person.logan_veen','home') else 'grey' }}"
                tap_action:
                  action: navigate
                  navigation_path: "#ov-persoon-logan"
          - type: map
            default_zoom: 11
            hours_to_show: 12
            aspect_ratio: "16:9"
            entities:
              - person.robin_bohnen
              - person.samantha_henkelman
              - person.emma_bohnen
              - person.logan_veen
      # =================== PERSOON-POPUPS (met spoor) ===================
      # De more-info van een person-entiteit toont alleen de huidige locatie:
      # een kaartje met één speld, geen route. Wie wil zien waar iemand net
      # vandaan komt ("is ze de wijk al uit?") heeft daar niets aan. Vandaar
      # per persoon een eigen popup met een map-kaart die wél `hours_to_show`
      # zet; dat is de enige knop waarmee de kaart een spoor tekent.
      #
      # Twee uur is bewust kort: dat is ongeveer een schoolrit of een boodschap
      # heen-en-terug, en het spoor blijft leesbaar. Langer terugkijken kan met
      # de gezamenlijke kaart in #ov-personen (12 uur). Wil je hier een ander
      # venster, dan is `hours_to_show` per kaart de enige regel die je aanraakt.
      #
      # NIET DOEN: de device_tracker van de app in plaats van de person-entiteit
      # gebruiken "omdat die nauwkeuriger is". De person-entiteit valt terug op
      # de router-tracker als de app zwijgt; de kaart tekent dan alsnog het
      # laatste GPS-punt door. Ruil je hem om, dan is het spoor leeg zodra
      # iemand thuis op wifi zit.
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-persoon-robin"
        name: Robin
        icon: mdi:account
        width_desktop: *ov_popup_width
        styles: *ov_popup
        cards:
          - type: custom:mushroom-template-card
            entity: person.robin_bohnen
            primary: Robin
            secondary: >-
              {% set p = states('person.robin_bohnen') %}{% set m = states('sensor.robin_reistijd_naar_huis') | float(-1) %}{{ 'Thuis' if p == 'home' else ('Afwezig' if p in ['not_home','unknown','unavailable'] else p) }}{{ (' · ' ~ (m | round(0) | int) ~ ' min naar huis') if p != 'home' and m > 0 else '' }}{{ (' · ' ~ states('sensor.iphone_van_robin_battery_level') ~ '%') if has_value('sensor.iphone_van_robin_battery_level') else '' }}
            icon: mdi:account
            icon_color: "{{ 'green' if is_state('person.robin_bohnen','home') else 'grey' }}"
            tap_action:
              action: more-info
          - type: map
            default_zoom: 12
            hours_to_show: 2
            aspect_ratio: "16:9"
            entities:
              - person.robin_bohnen
          - type: custom:mushroom-template-card
            primary: Alle personen
            secondary: Kaart van het hele gezin, 12 uur terug
            icon: mdi:account-group
            icon_color: blue
            tap_action:
              action: navigate
              navigation_path: "#ov-personen"
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-persoon-samantha"
        name: Samantha
        icon: mdi:account
        width_desktop: *ov_popup_width
        styles: *ov_popup
        cards:
          - type: custom:mushroom-template-card
            entity: person.samantha_henkelman
            primary: Samantha
            secondary: >-
              {% set p = states('person.samantha_henkelman') %}{% set m = states('sensor.samantha_reistijd_naar_huis') | float(-1) %}{{ 'Thuis' if p == 'home' else ('Afwezig' if p in ['not_home','unknown','unavailable'] else p) }}{{ (' · ' ~ (m | round(0) | int) ~ ' min naar huis') if p != 'home' and m > 0 else '' }}{{ (' · ' ~ states('sensor.iphone_van_samantha_battery_level') ~ '%') if has_value('sensor.iphone_van_samantha_battery_level') else '' }}
            icon: mdi:account
            icon_color: "{{ 'green' if is_state('person.samantha_henkelman','home') else 'grey' }}"
            tap_action:
              action: more-info
          - type: map
            default_zoom: 12
            hours_to_show: 2
            aspect_ratio: "16:9"
            entities:
              - person.samantha_henkelman
          - type: custom:mushroom-template-card
            primary: Alle personen
            secondary: Kaart van het hele gezin, 12 uur terug
            icon: mdi:account-group
            icon_color: blue
            tap_action:
              action: navigate
              navigation_path: "#ov-personen"
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-persoon-emma"
        name: Emma
        icon: mdi:account
        width_desktop: *ov_popup_width
        styles: *ov_popup
        cards:
          - type: custom:mushroom-template-card
            entity: person.emma_bohnen
            primary: Emma
            secondary: >-
              {% set p = states('person.emma_bohnen') %}{% set m = states('sensor.emma_reistijd_naar_huis') | float(-1) %}{{ 'Thuis' if p == 'home' else ('Afwezig' if p in ['not_home','unknown','unavailable'] else p) }}{{ (' · ' ~ (m | round(0) | int) ~ ' min naar huis') if p != 'home' and m > 0 else '' }}{{ (' · ' ~ states('sensor.iphone_van_emma_battery_level') ~ '%') if has_value('sensor.iphone_van_emma_battery_level') else '' }}
            icon: mdi:account
            icon_color: "{{ 'green' if is_state('person.emma_bohnen','home') else 'grey' }}"
            tap_action:
              action: more-info
          - type: map
            default_zoom: 12
            hours_to_show: 2
            aspect_ratio: "16:9"
            entities:
              - person.emma_bohnen
          - type: custom:mushroom-template-card
            primary: Alle personen
            secondary: Kaart van het hele gezin, 12 uur terug
            icon: mdi:account-group
            icon_color: blue
            tap_action:
              action: navigate
              navigation_path: "#ov-personen"
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-persoon-logan"
        name: Logan
        icon: mdi:account
        width_desktop: *ov_popup_width
        styles: *ov_popup
        cards:
          - type: custom:mushroom-template-card
            entity: person.logan_veen
            primary: Logan
            secondary: >-
              {% set p = states('person.logan_veen') %}{% set m = states('sensor.logan_reistijd_naar_huis') | float(-1) %}{{ 'Thuis' if p == 'home' else ('Afwezig' if p in ['not_home','unknown','unavailable'] else p) }}{{ (' · ' ~ (m | round(0) | int) ~ ' min naar huis') if p != 'home' and m > 0 else '' }}{{ (' · ' ~ states('sensor.iphone_battery_level') ~ '%') if has_value('sensor.iphone_battery_level') else '' }}
            icon: mdi:account
            icon_color: "{{ 'green' if is_state('person.logan_veen','home') else 'grey' }}"
            tap_action:
              action: more-info
          - type: map
            default_zoom: 12
            hours_to_show: 2
            aspect_ratio: "16:9"
            entities:
              - person.logan_veen
          - type: custom:mushroom-template-card
            primary: Alle personen
            secondary: Kaart van het hele gezin, 12 uur terug
            icon: mdi:account-group
            icon_color: blue
            tap_action:
              action: navigate
              navigation_path: "#ov-personen"
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-energie"
        name: Energie
        icon: mdi:flash
        width_desktop: *ov_popup_width
        styles: *ov_popup
        cards:
          - type: custom:apexcharts-card
            graph_span: 24h
            header:
              show: true
              title: Verbruik & productie (24u)
            series:
              - entity: sensor.electricity_meter_energieverbruik
                name: Verbruik
                type: area
                color: "var(--ov-info-strong)"
                stroke_width: 2
                group_by:
                  duration: 5m
                  func: avg
              - entity: sensor.zon_vermogen_nu
                name: Productie
                type: area
                color: "var(--ov-ok)"
                stroke_width: 2
                float_precision: 2
                # Deze sensor staat in W en het verbruik in kW; zonder gelijk-
                # trekken drukt de productie (duizendtallen) de verbruikslijn
                # plat tegen de nullijn. Zelfde transform als in kolom_midden.
                transform: >-
                  return hass.states['sensor.zon_vermogen_nu']
                    .attributes.unit_of_measurement === 'W' ? x / 1000 : x;
                group_by:
                  duration: 5m
                  func: avg
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.zon_opgewekt_vandaag
                primary: Opgewekt vandaag
                secondary: "{{ (states('sensor.zon_opgewekt_vandaag') ~ ' kWh') if has_value('sensor.zon_opgewekt_vandaag') else '—' }}"
                icon: mdi:solar-power-variant
                icon_color: amber
              - type: custom:mushroom-template-card
                entity: sensor.forecast_solar_production_today
                primary: Verwacht
                secondary: "{{ (states('sensor.forecast_solar_production_today') ~ ' kWh') if has_value('sensor.forecast_solar_production_today') else '—' }}"
                icon: mdi:weather-sunny
                icon_color: amber
              - type: custom:mushroom-template-card
                entity: sensor.zonneplan_electricity_consumption_today
                primary: Verbruik vandaag
                secondary: "{{ (states('sensor.zonneplan_electricity_consumption_today') ~ ' kWh') if has_value('sensor.zonneplan_electricity_consumption_today') else '—' }}"
                icon: mdi:flash
                icon_color: blue
              - type: custom:mushroom-template-card
                entity: sensor.zonneplan_gas_consumption_today
                primary: Gas vandaag
                secondary: "{{ (states('sensor.zonneplan_gas_consumption_today') ~ ' m³') if has_value('sensor.zonneplan_gas_consumption_today') else '—' }}"
                icon: mdi:fire
                icon_color: orange
              - type: custom:mushroom-template-card
                entity: sensor.total_costs_today_calculated
                primary: Kosten vandaag
                secondary: "{{ ('€ ' ~ states('sensor.total_costs_today_calculated')) if has_value('sensor.total_costs_today_calculated') else '—' }}"
                icon: mdi:currency-eur
                icon_color: "{{ 'green' if states('sensor.total_costs_today_calculated')|float(0) < 0 else 'grey' }}"
              - type: custom:mushroom-template-card
                entity: sensor.slimhuys_zonneplan_huidige_prijs
                primary: Huidig tarief
                secondary: "{{ ('€ ' ~ states('sensor.slimhuys_zonneplan_huidige_prijs')) if has_value('sensor.slimhuys_zonneplan_huidige_prijs') else '—' }}"
                icon: mdi:cash-clock
                # Een test op alleen 'low' liet het goedkoopste tarief grijs.
                # `peak` bevat het woord 'high' niet en moet er los bij, anders
                # is het duurste uur van de dag ook grijs.
                icon_color: >-
                  {% set n = states('sensor.slimhuys_zonneplan_tariefniveau_nu') %}
                  {{ 'green' if 'low' in n else ('red' if ('high' in n or n == 'peak') else 'grey') }}
              - type: custom:mushroom-template-card
                entity: sensor.lilygo_rs485_marstek_battery_state_of_charge
                primary: Thuisbatterij
                secondary: >-
                  {{ (states('sensor.lilygo_rs485_marstek_battery_state_of_charge') ~ '%')
                     if has_value('sensor.lilygo_rs485_marstek_battery_state_of_charge') else '—' }} ·
                  {{ (states('sensor.lilygo_rs485_marstek_battery_power') ~ ' W')
                     if has_value('sensor.lilygo_rs485_marstek_battery_power') else '—' }}
                icon: mdi:home-battery
                icon_color: green
              - type: custom:mushroom-template-card
                entity: sensor.zon_vermogen_nu
                primary: Productie nu
                secondary: "{{ (states('sensor.zon_vermogen_nu') ~ ' W') if has_value('sensor.zon_vermogen_nu') else '—' }}"
                icon: mdi:solar-power
                icon_color: amber
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-auto"
        name: Auto
        icon: mdi:car-electric
        width_desktop: *ov_popup_width
        styles: *ov_popup
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.hrh85f_batterij
                primary: Batterij
                secondary: "{{ (states('sensor.hrh85f_batterij') ~ '%') if has_value('sensor.hrh85f_batterij') else '—' }}"
                icon: mdi:battery-charging
                icon_color: "{{ 'green' if states('sensor.hrh85f_batterij')|float(0) > 20 else 'amber' }}"
              - type: custom:mushroom-template-card
                entity: sensor.hrh85f_battery_autonomy
                primary: Bereik
                secondary: "{{ (states('sensor.hrh85f_battery_autonomy') ~ ' km') if has_value('sensor.hrh85f_battery_autonomy') else '—' }}"
                icon: mdi:map-marker-distance
                icon_color: blue
              - type: custom:mushroom-template-card
                entity: sensor.hrh85f_kilometerstand
                primary: Kilometerstand
                secondary: "{{ (states('sensor.hrh85f_kilometerstand') ~ ' km') if has_value('sensor.hrh85f_kilometerstand') else '—' }}"
                icon: mdi:counter
                icon_color: grey
              - type: custom:mushroom-template-card
                entity: sensor.hrh85f_charge_state
                primary: Laadstatus
                secondary: >-
                  {% set m = {'charge_in_progress': 'aan het laden', 'not_in_charge': 'niet aan lader',
                              'waiting_for_a_planned_charge': 'gepland', 'waiting_for_current_charge': 'wacht',
                              'charge_error': 'laadfout', 'energy_flap_opened': 'klep open', 'charge_ended': 'vol'} %}
                  {{ m.get(states('sensor.hrh85f_charge_state'), states('sensor.hrh85f_charge_state'))
                     if has_value('sensor.hrh85f_charge_state') else '—' }}
                icon: mdi:ev-station
                icon_color: "{{ 'green' if is_state('sensor.hrh85f_charge_state','charge_in_progress') else 'grey' }}"
          # ----- Leasekilometers -----
          # Staat direct onder de kilometerstand, want dat is precies het
          # getal waar dit mee vergeleken wordt. Het contract staat 41 km per
          # dag toe; `input_number.lease_contract_kms` telt die elke nacht op
          # (packages/9 - Other/Car.yaml) en het verschil met de echte stand
          # maal € 0,12 is de rekening tot nu toe.
          #
          # Onder het budget is de sensor negatief, en dat is géén geld terug
          # maar ruimte om te rijden - vandaar dat deze kaart dan de
          # overgebleven kilometers toont en geen bedrag. Twee kleuren en geen
          # derde: boven contract kost geld (amber), eronder niet (groen). Een
          # rode grens zou een bedrag moeten verzinnen dat "te veel" heet, en
          # dat hangt aan een contracteinde dat hier nergens staat.
          - type: grid
            columns: 1
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.car_price_additional_km_s
                primary: >-
                  {% set p = states('sensor.car_price_additional_km_s') | float(none) %}
                  {% if p is none %}Leasekilometers
                  {% elif p > 0 %}€ {{ '%.2f' | format(p) | replace('.', ',') }} extra
                  {% else %}Binnen het contract{% endif %}
                secondary: >-
                  {% set km = states('sensor.hrh85f_kilometerstand') | float(none) %}
                  {% set budget = states('input_number.lease_contract_kms') | float(none) %}
                  {% if km is none or budget is none %}
                    kilometerstand of contractbudget onbekend
                  {% else %}
                    {% set over = (km - budget) | round(0) | int %}
                    {% if over > 0 %}
                      {{ '{:,}'.format(over) | replace(',', '.') }} km boven contract · € 0,12 per km
                    {% elif over == 0 %}
                      precies op het contractbudget
                    {% else %}
                      nog {{ '{:,}'.format(over | abs) | replace(',', '.') }} km speling
                    {% endif %}
                  {% endif %}
                icon: mdi:car-info
                icon_color: >-
                  {% set p = states('sensor.car_price_additional_km_s') | float(none) %}
                  {{ 'grey' if p is none else ('orange' if p > 0 else 'green') }}
                tap_action:
                  action: more-info
          # ----- Verbruik -----
          # Er wordt hier niets gemeten: de Renault levert geen kWh-teller, dus
          # packages/9 - Other/Car.yaml telt het verbruik op uit dalingen van
          # het accupercentage maal 60 kWh. Vandaar dat de ondertitel het
          # "schatting" noemt en niet "verbruik" - zelfde reden als bij de
          # powercalc-sensoren elders.
          - type: custom:mushroom-title-card
            title: Verbruik
            subtitle: schatting uit accupercentage × 60 kWh
          - type: grid
            columns: 2
            square: false
            cards:
              # De kleur vergelijkt met zijn EIGEN gemiddelde en niet met een
              # verzonnen drempel. Wat "zuinig" is hangt aan het seizoen: 17 in
              # augustus is niks bijzonders, 17 in januari is een prestatie. Een
              # vaste grens zou de halve winter rood kleuren zonder dat er iets
              # aan de hand is. Is er nog geen gemiddelde (de eerste 100 km na
              # het aanzetten van de tellers), dan blijft de kaart grijs.
              - type: custom:mushroom-template-card
                entity: sensor.car_consumption_today
                primary: Vandaag
                secondary: >-
                  {% if has_value('sensor.car_consumption_today') %}
                    {{ states('sensor.car_consumption_today') | replace('.', ',') }} kWh/100 km
                  {% else %}
                    {% set km = states('sensor.car_distance_today') | float(none) %}
                    {% if km is none %}nog geen meting
                    {% else %}{{ km | round(0) | int }} km · te weinig voor een cijfer{% endif %}
                  {% endif %}
                icon: mdi:lightning-bolt-outline
                icon_color: >-
                  {% set v = states('sensor.car_consumption_today') | float(none) %}
                  {% set g = states('sensor.car_consumption_average') | float(none) %}
                  {% if v is none or g is none %}grey
                  {% elif v <= g %}green
                  {% elif v > g * 1.15 %}orange
                  {% else %}blue{% endif %}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.car_consumption_this_month
                primary: Deze maand
                secondary: >-
                  {% set m = states('sensor.car_consumption_this_month') | float(none) %}
                  {% set g = states('sensor.car_consumption_average') | float(none) %}
                  {% if m is none %}nog te weinig kilometers
                  {% else %}
                    {{ ('%.1f' | format(m)) | replace('.', ',') }} kWh/100 km{{
                      ' · gemiddeld ' ~ (('%.1f' | format(g)) | replace('.', ',')) if g is not none else '' }}
                  {% endif %}
                icon: mdi:calendar-month
                icon_color: blue
                tap_action:
                  action: more-info
          # 30 dagen en staafjes per dag. `fill: null` is hier het verschil
          # tussen een eerlijke en een leugenachtige grafiek: de standaard van
          # apexcharts is `last`, en die trekt de waarde van gisteren door over
          # elke dag waarop de sensor niets zei. Dagen onder de 25 km hebben
          # geen cijfer (zie de drempel in het pakket) en horen leeg te blijven
          # staan, niet de vorige dag te herhalen.
          - type: custom:apexcharts-card
            graph_span: 30d
            span:
              end: day
            header:
              show: true
              title: Verbruik per dag (kWh/100 km)
              show_states: false
            apex_config:
              chart:
                height: 170
              tooltip:
                x:
                  format: "ddd d MMM"
            yaxis:
              - id: verbruik
                min: 0
                decimals: 1
            series:
              - entity: sensor.car_consumption_today
                name: kWh/100 km
                type: column
                color: "var(--ov-info)"
                yaxis_id: verbruik
                float_precision: 1
                group_by:
                  duration: 1d
                  func: last
                  fill: "null"
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Start opladen
                icon: mdi:ev-station
                icon_color: green
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.hrh85f_start_opladen
              - type: custom:mushroom-template-card
                entity: binary_sensor.hrh85f_hvac
                primary: >-
                  {% set t = state_attr('weather.knmi_thuis','temperature') | float(18) %}
                  {{ 'Voorverwarmen' if t < 15 else ('Voorkoelen' if t > 22 else 'Klimaat starten') }}
                secondary: >-
                  {% if is_state('binary_sensor.hrh85f_hvac','on') %}actief
                  {%- else %}{% set t = state_attr('weather.knmi_thuis','temperature') %}
                  {{- 'buiten ' ~ (t | round(0)) ~ '°' if t is not none else 'tik om te starten' }}{% endif %}
                icon: >-
                  {% set t = state_attr('weather.knmi_thuis','temperature') | float(18) %}
                  {{ 'mdi:fire' if t < 15 else ('mdi:snowflake' if t > 22 else 'mdi:air-conditioner') }}
                icon_color: >-
                  {% if is_state('binary_sensor.hrh85f_hvac','on') %}green
                  {%- else %}{% set t = state_attr('weather.knmi_thuis','temperature') | float(18) %}{{ 'orange' if t < 15 else 'blue' }}{% endif %}
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.hrh85f_start_air_conditioner
          - type: map
            default_zoom: 10
            aspect_ratio: "16:9"
            entities:
              - device_tracker.hrh85f_locatie
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-vandaag"
        name: Vandaag
        icon: mdi:calendar-check
        width_desktop: *ov_popup_width
        styles: *ov_popup
        cards:
          - type: custom:mushroom-title-card
            title: Afval
            subtitle: Ophaalmomenten
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.afvalinfo_home_trash_type_today
                primary: Vandaag
                secondary: "{{ (states('sensor.afvalinfo_home_trash_type_today')) if has_value('sensor.afvalinfo_home_trash_type_today') else '—' }}"
                icon: mdi:trash-can
                icon_color: teal
              - type: custom:mushroom-template-card
                entity: sensor.afvalinfo_home_trash_type_tomorrow
                primary: Morgen
                secondary: "{{ (states('sensor.afvalinfo_home_trash_type_tomorrow')) if has_value('sensor.afvalinfo_home_trash_type_tomorrow') else '—' }}"
                icon: mdi:trash-can-outline
                icon_color: teal
              - type: custom:mushroom-template-card
                entity: sensor.afvalinfo_home_gft
                primary: GFT
                secondary: "{{ (states('sensor.afvalinfo_home_gft')) if has_value('sensor.afvalinfo_home_gft') else '—' }}"
                icon: mdi:leaf
                icon_color: green
              - type: custom:mushroom-template-card
                entity: sensor.afvalinfo_home_papier
                primary: Papier
                secondary: "{{ (states('sensor.afvalinfo_home_papier')) if has_value('sensor.afvalinfo_home_papier') else '—' }}"
                icon: mdi:newspaper
                icon_color: blue
              - type: custom:mushroom-template-card
                entity: sensor.afvalinfo_home_pbd
                primary: PBD
                secondary: "{{ (states('sensor.afvalinfo_home_pbd')) if has_value('sensor.afvalinfo_home_pbd') else '—' }}"
                icon: mdi:recycle
                icon_color: orange
              - type: custom:mushroom-template-card
                entity: sensor.afvalinfo_home_restafval
                primary: Restafval
                secondary: "{{ (states('sensor.afvalinfo_home_restafval')) if has_value('sensor.afvalinfo_home_restafval') else '—' }}"
                icon: mdi:delete
                icon_color: grey
          - type: custom:mushroom-title-card
            title: Agenda
          - type: calendar
            initial_view: listWeek
            entities:
              - calendar.r_bohnen_vrbn_nl_agenda
              - calendar.robin_bohnen_nl_agenda
              - calendar.robin_en_sam
              - calendar.brandweer
              - calendar.maxi
              - calendar.mini
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-klimaat"
        name: Klimaat
        icon: mdi:thermometer
        width_desktop: *ov_popup_width
        styles: *ov_popup
        cards:
          - type: custom:mushroom-climate-card
            entity: climate.airco_woonkamer
            name: Airco woonkamer
            hvac_modes:
              - "off"
              - cool
              - heat
              - dry
              - fan_only
            show_temperature_control: true
            collapsible_controls: true
          - type: custom:mushroom-climate-card
            entity: climate.airco_zolder
            name: Airco zolder
            hvac_modes:
              - "off"
              - cool
              - heat
              - dry
              - fan_only
            show_temperature_control: true
            collapsible_controls: true
          # Valt weg zolang de spa opgeruimd is - een mushroom-kaart van een
          # entiteit die niet meer bestaat wordt een rode foutkaart. Zie
          # binary_sensor.backyard_spa_aanwezig in
          # packages/3 - Outside/Backyard/Spa.yaml.
          - type: custom:mushroom-climate-card
            entity: climate.intex_purespa
            name: Intex PureSpa
            show_temperature_control: true
            collapsible_controls: true
            visibility:
              - condition: state
                entity: binary_sensor.backyard_spa_aanwezig
                state: "on"
          - type: custom:mushroom-cover-card
            entity: cover.achtertuin_zonnescherm
            name: Zonnescherm achtertuin
            show_buttons_control: true
            show_position_control: true

      # --------- Lucht woonkamer ---------
      # De regel op de KLIMAAT-kaart vat drie metingen samen, maar tikken gaf
      # more-info van alleen de luchtkwaliteits-entiteit: één grafiek, en juist
      # niet die van CO2, fijnstof of vocht. Hier staan ze alle drie, met de
      # drempels uit de kaartcode als lijn in de grafiek zodat een uitschieter
      # meteen te plaatsen is. De lijst onderaan haalt met een glob alles op wat
      # dit apparaat verder nog levert (VOC, temperatuur, batterij, ...), zodat
      # er niets buiten beeld valt wat ik hier niet met naam ken.
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-lucht"
        name: Lucht woonkamer
        icon: mdi:air-filter
        width_desktop: *ov_popup_width
        styles: *ov_popup
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.woonkamer_woonkamer_multisensor_kooldioxide
                primary: CO₂
                secondary: >-
                  {{ (states('sensor.woonkamer_woonkamer_multisensor_kooldioxide') | round(0) ~ ' ppm')
                     if has_value('sensor.woonkamer_woonkamer_multisensor_kooldioxide') else '—' }}
                icon: mdi:molecule-co2
                # float(-1) als sein voor "geen meting": met float(0) viel een
                # uitgevallen sensor onder elke drempel en stond het icoon
                # groen, alsof de lucht prima was.
                icon_color: >-
                  {% set v = states('sensor.woonkamer_woonkamer_multisensor_kooldioxide') | float(-1) %}
                  {{ 'grey' if v < 0 else ('red' if v >= 1200 else ('orange' if v >= 800 else 'green')) }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.woonkamer_woonkamer_multisensor_pm2_5
                primary: Fijnstof
                secondary: >-
                  {{ ('PM2.5 ' ~ states('sensor.woonkamer_woonkamer_multisensor_pm2_5'))
                     if has_value('sensor.woonkamer_woonkamer_multisensor_pm2_5') else '—' }}
                icon: mdi:blur
                icon_color: >-
                  {% set v = states('sensor.woonkamer_woonkamer_multisensor_pm2_5') | float(-1) %}
                  {{ 'grey' if v < 0 else ('red' if v >= 35 else ('orange' if v >= 15 else 'green')) }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.woonkamer_woonkamer_multisensor_luchtvochtigheid
                primary: Luchtvochtigheid
                secondary: >-
                  {{ (states('sensor.woonkamer_woonkamer_multisensor_luchtvochtigheid') | round(0) ~ '% rv')
                     if has_value('sensor.woonkamer_woonkamer_multisensor_luchtvochtigheid') else '—' }}
                icon: mdi:water-percent
                # Vocht knijpt aan twee kanten: te droog is net zo goed mis.
                icon_color: >-
                  {% set v = states('sensor.woonkamer_woonkamer_multisensor_luchtvochtigheid') | float(-1) %}
                  {{ 'grey' if v < 0 else ('orange' if (v < 30 or v > 70) else 'green') }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.woonkamer_woonkamer_multisensor_luchtkwaliteit
                primary: Luchtkwaliteit
                secondary: >-
                  {% set m = {'excellent': 'uitstekend', 'good': 'goed', 'fair': 'redelijk',
                              'moderate': 'matig', 'poor': 'slecht', 'very_poor': 'zeer slecht',
                              'extremely_poor': 'extreem slecht'} %}
                  {% set s = states('sensor.woonkamer_woonkamer_multisensor_luchtkwaliteit') %}
                  {{ m.get(s, s | replace('_', ' '))
                     if has_value('sensor.woonkamer_woonkamer_multisensor_luchtkwaliteit') else '—' }}
                icon: mdi:air-filter
                icon_color: >-
                  {% set s = states('sensor.woonkamer_woonkamer_multisensor_luchtkwaliteit') %}
                  {{ 'green' if s in ['excellent', 'good'] else
                     ('red' if s in ['very_poor', 'extremely_poor'] else
                     ('orange' if s in ['moderate', 'poor'] else 'grey')) }}
                tap_action:
                  action: more-info
          - type: custom:apexcharts-card
            graph_span: 24h
            header:
              show: true
              title: CO₂ (24 uur)
            # 800 ppm wordt benauwd, boven 1200 echt ventileren; dezelfde
            # drempels als de kleuren op de KLIMAAT-kaart.
            apex_config:
              chart:
                height: 150
              annotations:
                yaxis:
                  - y: 800
                    borderColor: "var(--ov-warn)"
                    strokeDashArray: 4
                  - y: 1200
                    borderColor: "var(--ov-bad)"
                    strokeDashArray: 4
            series:
              - entity: sensor.woonkamer_woonkamer_multisensor_kooldioxide
                name: CO₂
                type: area
                color: "var(--ov-info)"
                stroke_width: 2
                float_precision: 0
                group_by:
                  duration: 10m
                  func: avg
          - type: custom:apexcharts-card
            graph_span: 24h
            header:
              show: true
              title: Fijnstof PM2.5 (24 uur)
            # WHO-daggemiddelde ligt op 15 µg/m³.
            apex_config:
              chart:
                height: 150
              annotations:
                yaxis:
                  - y: 15
                    borderColor: "var(--ov-warn)"
                    strokeDashArray: 4
            series:
              - entity: sensor.woonkamer_woonkamer_multisensor_pm2_5
                name: PM2.5
                type: area
                color: "var(--ov-accent)"
                stroke_width: 2
                float_precision: 1
                group_by:
                  duration: 10m
                  func: avg
          - type: custom:apexcharts-card
            graph_span: 24h
            header:
              show: true
              title: Luchtvochtigheid (24 uur)
            apex_config:
              chart:
                height: 150
              annotations:
                yaxis:
                  - y: 30
                    borderColor: "var(--ov-warn)"
                    strokeDashArray: 4
                  - y: 70
                    borderColor: "var(--ov-warn)"
                    strokeDashArray: 4
            series:
              - entity: sensor.woonkamer_woonkamer_multisensor_luchtvochtigheid
                name: Luchtvochtigheid
                type: line
                color: "var(--ov-ok)"
                stroke_width: 2
                float_precision: 0
                group_by:
                  duration: 10m
                  func: avg
          # Vangnet: alles wat dit apparaat verder nog levert en hierboven geen
          # eigen grafiek heeft. Glob, dus een nieuwe meting verschijnt vanzelf.
          - type: custom:mushroom-title-card
            title: Alle metingen van deze sensor
          - type: custom:auto-entities
            show_empty: false
            card:
              type: grid
              columns: 2
              square: false
            card_param: cards
            sort:
              method: friendly_name
            filter:
              include:
                - entity_id: sensor.woonkamer_woonkamer_multisensor_*
                  options:
                    type: custom:mushroom-entity-card
                    secondary_info: last-changed
                    tap_action:
                      action: more-info
              exclude:
                - state: unavailable
                - state: unknown
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-brandweer"
        name: Brandweer
        icon: mdi:fire-truck
        width_desktop: *ov_popup_width
        styles: *ov_popup
        cards:
          - type: custom:mushroom-template-card
            entity: input_text.brandweer_laatste_melding
            primary: Laatste melding
            secondary: "{{ (states('input_text.brandweer_laatste_melding')) if has_value('input_text.brandweer_laatste_melding') else '—' }}"
            icon: mdi:message-alert
            icon_color: red
            multiline_secondary: true
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: input_select.brandweer_dienstdoende_ploeg
                primary: Dienstdoend
                secondary: "{{ (states('input_select.brandweer_dienstdoende_ploeg')) if has_value('input_select.brandweer_dienstdoende_ploeg') else '—' }}"
                icon: mdi:account-group
                icon_color: blue
              - type: custom:mushroom-template-card
                entity: input_select.brandweer_mijn_huidige_ploeg
                primary: Mijn ploeg
                secondary: "{{ (states('input_select.brandweer_mijn_huidige_ploeg')) if has_value('input_select.brandweer_mijn_huidige_ploeg') else '—' }}"
                icon: mdi:account
                icon_color: blue
              - type: custom:mushroom-template-card
                entity: sensor.robin_reistijd_naar_brandweer_uden
                primary: Reistijd kazerne
                # round(0): Waze geeft gebroken minuten (5.083...), Google gaf
                # een heel getal. Zonder afronden staat hier een rij decimalen.
                secondary: >-
                  {% set s = 'sensor.robin_reistijd_naar_brandweer_uden' %}
                  {{ ((states(s) | float(0) | round(0) | int) ~ ' min')
                     if has_value(s) else '—' }}
                icon: mdi:fire-station
                icon_color: orange
          # ---------- Stand van de dienstdoende ploeg ----------
          # Alles hieronder komt uit de attributen van sensor.brandweer_bezetting;
          # die wordt gevuld door de PreCom-webhook (zie
          # packages/9 - Other/Brandweer Bezetting.yaml), en wel bij élke
          # wijziging — ook als de status hetzelfde blijft en er dus geen
          # melding op de telefoon komt. Tot de eerste stand is hij leeg —
          # vandaar overal een terugval op de vijfminuten-poll of op '—'.
          - type: custom:mushroom-title-card
            title: Bezetting nu
          - type: custom:mushroom-template-card
            entity: sensor.brandweer_bezetting
            primary: >-
              {% set s = states('sensor.brandweer_bezetting') %}
              {{ {'ok': 'Op orde', 'krap': 'Krap bezet', 'onderbezet': 'Onderbezet'}.get(s, 'Nog geen stand ontvangen') }}
              {%- if s in ['ok', 'krap', 'onderbezet'] %} · {{ state_attr('sensor.brandweer_bezetting', 'ploeg') }}-ploeg{% endif %}
            secondary: >-
              {% set b = 'sensor.brandweer_bezetting' %}
              {%- if has_value(b) -%}
              {{ state_attr(b, 'samenvatting') }} · {{ state_attr(b, 'aantal') }} beschikbaar · kwartier {{ state_attr(b, 'kwartier') }}
              {%- else -%}
              Komt binnen bij de eerstvolgende PreCom-wijziging
              {%- endif -%}
            icon: >-
              {% set s = states('sensor.brandweer_bezetting') %}
              {{ {'onderbezet': 'mdi:account-alert', 'krap': 'mdi:account-clock'}.get(s, 'mdi:account-check') }}
            icon_color: >-
              {% set s = states('sensor.brandweer_bezetting') %}
              {{ {'onderbezet': 'red', 'krap': 'orange', 'ok': 'green'}.get(s, 'grey') }}
            multiline_secondary: true
            tap_action:
              action: more-info
          # Per functie, in de volgorde die PreCom aanhoudt (bevelvoerder eerst).
          # De namen staan erbij: bij een gat wil je weten wie er al staat en of
          # jouw functie het probleem is.
          - type: markdown
            content: |
              {% set functies = state_attr('sensor.brandweer_bezetting', 'functies') or [] %}
              {% if functies %}
              | Functie | Nu | Wie |
              | --- | --- | --- |
              {% for r in functies -%}
              | {{ {'onderbezet': '🔴', 'krap': '🟠'}.get(r.status, '🟢') }} {{ r.functie }} | **{{ r.beschikbaar }}**{% if r.nodig %}/{{ r.nodig }}{% endif %}{% if r.gewenst > r.nodig %} <sub>(wens {{ r.gewenst }})</sub>{% endif %} | {{ r.personen | join(', ') if r.personen else '—' }} |
              {% endfor -%}
              {% else %}
              Nog geen stand van PreCom ontvangen. Die komt binnen zodra er in
              PreCom iets verandert; de cijfers hieronder komen uit de poll van
              elke vijf minuten.
              {% endif %}
          # Pager uit staat bewust bovenaan: dat zijn de mensen die er wél zijn
          # maar niet aanstaan, dus dáár zit de winst als het krap is.
          - type: markdown
            content: |
              {% set b = 'sensor.brandweer_bezetting' %}
              {% set pager = state_attr(b, 'pager_uit') or [] %}
              {% set afwezig = state_attr(b, 'afwezig') or [] %}
              {% set wijz = state_attr(b, 'wijzigingen') or [] %}
              **Pager uit** ({{ pager | count }}): {{ pager | join(', ') if pager else '—' }}

              **Afgemeld** ({{ afwezig | count }}): {{ afwezig | join(', ') if afwezig else '—' }}

              {# Alle drie de ploegen en beide dagen; de ploegletter staat er
                 daarom voor en morgen wordt apart gemerkt. #}
              **Sinds de vorige stand**:{% if wijz %}{% for w in wijz %}
              {{ '- ' }}**{{ w.ploeg }}**{% if w.dag != 'vandaag' %} <sub>morgen</sub>{% endif %} {{ w.kort }}
              {%- endfor %}{% else %} geen wijzigingen{% endif %}
              {% if state_attr(b, 'tijdstip') %}

              <sub>Stand van {{ state_attr(b, 'tijdstip') }}, kwartier {{ state_attr(b, 'kwartier') }}.</sub>
              {% endif %}
          - type: custom:mushroom-title-card
            title: Bezetting per ploeg
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.bezetting_ploeg_a
                primary: >-
                  {% if states('input_select.brandweer_dienstdoende_ploeg')[0] | lower == 'a' %}A-ploeg · dienst{% else %}A-ploeg{% endif %}
                secondary: >-
                  {% set p = (state_attr('sensor.brandweer_bezetting', 'ploegen') or [])
                             | selectattr('ploeg', 'eq', 'A') | list | first %}
                  {% if p %}{{ p.aantal }} beschikbaar
                  {%- elif has_value('sensor.bezetting_ploeg_a') %}{{ states('sensor.bezetting_ploeg_a') }} beschikbaar
                  {%- else %}—{% endif %}
                icon: >-
                  {% if states('input_select.brandweer_dienstdoende_ploeg')[0] | lower == 'a' %}mdi:account-multiple-check{% else %}mdi:account-multiple-outline{% endif %}
                icon_color: >-
                  {% set p = (state_attr('sensor.brandweer_bezetting', 'ploegen') or [])
                             | selectattr('ploeg', 'eq', 'A') | list | first %}
                  {% if p %}{{ {'onderbezet': 'red', 'krap': 'orange'}.get(p.status, 'green') }}
                  {%- else %}{% set n = states('sensor.bezetting_ploeg_a') | int(0) %}{{ 'red' if n < 4 else ('orange' if n < 6 else 'green') }}{% endif %}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.bezetting_ploeg_b
                primary: >-
                  {% if states('input_select.brandweer_dienstdoende_ploeg')[0] | lower == 'b' %}B-ploeg · dienst{% else %}B-ploeg{% endif %}
                secondary: >-
                  {% set p = (state_attr('sensor.brandweer_bezetting', 'ploegen') or [])
                             | selectattr('ploeg', 'eq', 'B') | list | first %}
                  {% if p %}{{ p.aantal }} beschikbaar
                  {%- elif has_value('sensor.bezetting_ploeg_b') %}{{ states('sensor.bezetting_ploeg_b') }} beschikbaar
                  {%- else %}—{% endif %}
                icon: >-
                  {% if states('input_select.brandweer_dienstdoende_ploeg')[0] | lower == 'b' %}mdi:account-multiple-check{% else %}mdi:account-multiple-outline{% endif %}
                icon_color: >-
                  {% set p = (state_attr('sensor.brandweer_bezetting', 'ploegen') or [])
                             | selectattr('ploeg', 'eq', 'B') | list | first %}
                  {% if p %}{{ {'onderbezet': 'red', 'krap': 'orange'}.get(p.status, 'green') }}
                  {%- else %}{% set n = states('sensor.bezetting_ploeg_b') | int(0) %}{{ 'red' if n < 4 else ('orange' if n < 6 else 'green') }}{% endif %}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.bezetting_ploeg_c
                primary: >-
                  {% if states('input_select.brandweer_dienstdoende_ploeg')[0] | lower == 'c' %}C-ploeg · dienst{% else %}C-ploeg{% endif %}
                secondary: >-
                  {% set p = (state_attr('sensor.brandweer_bezetting', 'ploegen') or [])
                             | selectattr('ploeg', 'eq', 'C') | list | first %}
                  {% if p %}{{ p.aantal }} beschikbaar
                  {%- elif has_value('sensor.bezetting_ploeg_c') %}{{ states('sensor.bezetting_ploeg_c') }} beschikbaar
                  {%- else %}—{% endif %}
                icon: >-
                  {% if states('input_select.brandweer_dienstdoende_ploeg')[0] | lower == 'c' %}mdi:account-multiple-check{% else %}mdi:account-multiple-outline{% endif %}
                icon_color: >-
                  {% set p = (state_attr('sensor.brandweer_bezetting', 'ploegen') or [])
                             | selectattr('ploeg', 'eq', 'C') | list | first %}
                  {% if p %}{{ {'onderbezet': 'red', 'krap': 'orange'}.get(p.status, 'green') }}
                  {%- else %}{% set n = states('sensor.bezetting_ploeg_c') | int(0) %}{{ 'red' if n < 4 else ('orange' if n < 6 else 'green') }}{% endif %}
                tap_action:
                  action: more-info
          # Wie er in welke ploeg zit. Een ploeg waarvan PreCom niets wist
          # ontbreekt in de payload, dus dit loopt over wat er ís en niet over
          # A/B/C.
          - type: markdown
            content: |
              {% set ploegen = state_attr('sensor.brandweer_bezetting', 'ploegen') or [] %}
              {% if ploegen %}
              | Ploeg | Nu | Wie |
              | --- | --- | --- |
              {% for p in ploegen -%}
              | **{{ p.ploeg }}** <sub>{{ {'dienstdoend': 'deze week', 'volgende_week': 'volgende week', 'week_erna': 'week erna'}.get(p.dienst, p.dienst) }}</sub> | {{ p.aantal }} | {{ p.personen | join(', ') if p.personen else '—' }}{% if p.aspiranten %} <sub>(asp. {{ p.aspiranten | join(', ') }})</sub>{% endif %} |
              {% endfor -%}
              {% else %}
              Ploegsamenstelling komt binnen bij de eerstvolgende statuswissel.
              {% endif %}
          - type: custom:mushroom-title-card
            title: Uitrukken
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: counter.brandweer_totaal_aantal_uitrukken
                primary: Totaal
                secondary: "{{ (states('counter.brandweer_totaal_aantal_uitrukken')) if has_value('counter.brandweer_totaal_aantal_uitrukken') else '—' }}"
                icon: mdi:sigma
                icon_color: grey
              - type: custom:mushroom-template-card
                entity: counter.brandweer_uden_a_ploeg_uitrukken
                primary: A
                secondary: "{{ (states('counter.brandweer_uden_a_ploeg_uitrukken')) if has_value('counter.brandweer_uden_a_ploeg_uitrukken') else '—' }}"
                icon: mdi:alpha-a-circle
                icon_color: blue
              - type: custom:mushroom-template-card
                entity: counter.brandweer_uden_b_ploeg_uitrukken
                primary: B
                secondary: "{{ (states('counter.brandweer_uden_b_ploeg_uitrukken')) if has_value('counter.brandweer_uden_b_ploeg_uitrukken') else '—' }}"
                icon: mdi:alpha-b-circle
                icon_color: blue
              - type: custom:mushroom-template-card
                entity: counter.brandweer_uden_c_ploeg_uitrukken
                primary: C
                secondary: "{{ (states('counter.brandweer_uden_c_ploeg_uitrukken')) if has_value('counter.brandweer_uden_c_ploeg_uitrukken') else '—' }}"
                icon: mdi:alpha-c-circle
                icon_color: blue
          - type: logbook
            hours_to_show: 336
            entities:
              - input_text.brandweer_laatste_melding
              - binary_sensor.brandweer_uitgerukt_op_laatste_melding

      # --------- Deurbel ---------
      # Echt automatisch openklappen bij een bel vraagt browser_mod (om een
      # specifiek scherm te laten navigeren); dat staat niet in
      # dashboards/resources.yaml. Daarom hangt dit aan de pil in de kopbalk:
      # die verschijnt drie minuten na een bel en brengt je hier met één tik.
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-deurbel"
        name: Deurbel
        icon: mdi:doorbell-video
        width_desktop: *ov_popup_width
        styles: *ov_popup
        cards:
          # Zelfde cameraparen als de #doorbell-popup op het oude dashboard:
          # de deurbel zelf plus de pakketcamera die omlaag kijkt.
          - type: custom:advanced-camera-card
            cameras:
              - camera_entity: camera.g4_doorbell_pro_high_resolution_channel
              - camera_entity: camera.g4_doorbell_pro_package_camera
          # Opendoen vanaf het wandpaneel; de reden dat je hier staat te kijken.
          - type: custom:mushroom-lock-card
            entity: lock.kroon18voordeur
            name: Voordeur
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: binary_sensor.g4_doorbell_voortuin_doorbell
                primary: Laatst aangebeld
                secondary: >-
                  {% set s = states.binary_sensor.g4_doorbell_voortuin_doorbell %}
                  {{ (relative_time(s.last_changed) ~ ' geleden') if s else '—' }}
                icon: mdi:doorbell
                icon_color: >-
                  {{ 'amber' if is_state('binary_sensor.deurbel_recent','on') else 'grey' }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: binary_sensor.g4_doorbell_pro_motion
                primary: Beweging voordeur
                secondary: >-
                  {% set s = states.binary_sensor.g4_doorbell_pro_motion %}
                  {{ 'nu' if is_state('binary_sensor.g4_doorbell_pro_motion','on')
                     else ((relative_time(s.last_changed) ~ ' geleden') if s else '—') }}
                icon: mdi:motion-sensor
                icon_color: >-
                  {{ 'amber' if is_state('binary_sensor.g4_doorbell_pro_motion','on') else 'grey' }}
                tap_action:
                  action: more-info
          - type: logbook
            hours_to_show: 48
            entities:
              - binary_sensor.g4_doorbell_voortuin_doorbell
              - binary_sensor.g4_doorbell_pro_motion
              - lock.kroon18voordeur
              # Het deurcontact erbij: bel, beweging en slot zeggen niet of er
              # daadwerkelijk iemand binnen is gekomen, dit wel.
              - binary_sensor.entree_entree_voordeur_deur

      # --------- Alarm ---------
      # Opent vanaf twee plekken: de rode balk bovenaan (alleen bij pending/
      # triggered) en de amber pil in de kopbalk (zolang het alarm aan staat).
      # De uit-knop staat bewust achter die ene tik in plaats van direct op de
      # balk: een wandpaneel op looproute vangt makkelijk een toevallige tik,
      # en dit is de knop die het huis onbewaakt achterlaat.
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-alarm"
        name: Alarm
        icon: mdi:shield-home
        width_desktop: *ov_popup_width
        styles: *ov_popup
        cards:
          # ----- Uitzetten (alles behalve disarmed) -----
          - type: custom:mushroom-template-card
            entity: alarm_control_panel.alarmo
            primary: Alarm uitzetten
            secondary: >-
              {% set s = states('alarm_control_panel.alarmo') %}
              {% set o = state_attr('alarm_control_panel.alarmo', 'open_sensors') %}
              {% set namen = (expand(o | list) | map(attribute='name') | list | join(', ')) if o else '' %}
              {% if s == 'triggered' %}
                Afgegaan om
                {{ states.alarm_control_panel.alarmo.last_changed | as_local | as_timestamp | timestamp_custom('%H:%M') }}{{
                ' · ' ~ namen if namen }}
              {% elif s == 'pending' %}
                Aftellen loopt{{ ' · ' ~ namen if namen }} - nu uitzetten
              {% else %}
                Staat op {{ s | replace('armed_', '') | replace('_', ' ') }}
              {% endif %}
            icon: mdi:shield-off-outline
            icon_color: red
            tap_action:
              action: perform-action
              perform_action: alarm_control_panel.alarm_disarm
              target:
                entity_id: alarm_control_panel.alarmo
            visibility:
              # `state_not` in plaats van een opsomming van alle armed-standen:
              # Alarmo kent er zes en die lijst loopt gegarandeerd een keer uit
              # de pas met de werkelijkheid.
              - condition: state
                entity: alarm_control_panel.alarmo
                state_not: disarmed

          # ----- Aanzetten (alleen als hij uit staat) -----
          - type: grid
            columns: 2
            square: false
            visibility: &alarm_uit
              - condition: state
                entity: alarm_control_panel.alarmo
                state: disarmed
            cards:
              - type: custom:mushroom-template-card
                primary: Aan - thuis
                secondary: iedereen is binnen
                icon: mdi:shield-home
                icon_color: amber
                tap_action:
                  action: perform-action
                  perform_action: alarm_control_panel.alarm_arm_home
                  target:
                    entity_id: alarm_control_panel.alarmo
              - type: custom:mushroom-template-card
                primary: Aan - weg
                secondary: niemand thuis
                icon: mdi:shield-lock
                icon_color: amber
                tap_action:
                  action: perform-action
                  perform_action: alarm_control_panel.alarm_arm_away
                  target:
                    entity_id: alarm_control_panel.alarmo

          # Zonder dit is de popup bij een uitgeschakeld alarm twee knoppen en
          # verder niets - dat leest als een storing in plaats van als rust.
          - type: custom:mushroom-template-card
            primary: Alarm staat uit
            secondary: >-
              Sinds
              {{ states.alarm_control_panel.alarmo.last_changed | as_local | as_timestamp | timestamp_custom('%H:%M') }}.
              Het gaat vanzelf weer aan zodra iedereen weg is.
            icon: mdi:shield-check
            icon_color: green
            visibility: *alarm_uit

          # ----- Wie staat er voor de deur -----
          # Dezelfde vraag als bij de deurbel: je zet een afgegaan alarm niet
          # uit zonder eerst gekeken te hebben. Camera's laden pas als deze
          # popup openstaat, dus dit kost het wandpaneel niets in rust.
          - type: custom:advanced-camera-card
            cameras:
              - camera_entity: camera.g6_180_high_resolution_channel
              - camera_entity: camera.g4_doorbell_pro_high_resolution_channel
              - camera_entity: camera.g5_ultra_turret_overkapping_high_resolution_channel

          - type: logbook
            hours_to_show: 48
            entities:
              - alarm_control_panel.alarmo
              - binary_sensor.entree_entree_voordeur_deur
              - binary_sensor.achtertuin_achtertuin_schuur_deur_deur
              - lock.kroon18voordeur

      # --------- Openstaande vraag ---------
      # De vraag-pil in de kopbalk opent deze popup. Ja/Nee loopt via
      # script.spraak_antwoord_geven (Kitchen/Voice.yaml): dat vuurt hetzelfde
      # `spraak_antwoord`-event als de satelliet-intents en de telefoonknoppen
      # voeden, dus de afhandelende automatisering (bv. Klimaat - Zonnescherm
      # antwoord) ziet geen verschil tussen paneel, telefoon en stem. Na een
      # tik leegt het script de input_text; de knoppen hieronder klappen dan
      # in en de "geen vraag"-kaart komt terug. De popup sluit zichzelf niet -
      # dat kan bubble-card niet zonder browser_mod - maar er valt daarna ook
      # niets verkeerds meer te tikken (het script stopt stil als er niets
      # open staat).
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-vraag"
        name: Vraag van het huis
        icon: mdi:comment-question-outline
        width_desktop: *ov_popup_width
        styles: *ov_popup
        cards:
          - type: grid
            columns: 1
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: input_text.spraak_openstaande_vraag
                primary: >-
                  {% set m = {'zonnescherm': 'Zal ik het zonnescherm uitzetten?',
                              'spa_gratis': 'De stroom is gratis. Zal ik de spa opwarmen?',
                              'spa_warm': 'Zal ik de spa opwarmen?'} %}
                  {% set s = states('input_text.spraak_openstaande_vraag') %}
                  {{ m.get(s, (s | replace('_', ' ') | capitalize) ~ '?') }}
                secondary: >-
                  {% set f = state_attr('timer.spraak_antwoordvenster', 'finishes_at') %}
                  {% if is_state('timer.spraak_antwoordvenster', 'active') and f %}
                    antwoorden kan nog tot {{ (f | as_datetime | as_local).strftime('%H:%M') }}
                  {% else %}
                    het antwoordvenster is gesloten
                  {% endif %}
                icon: mdi:comment-question-outline
                icon_color: blue
                visibility: &vraag_open
                  - condition: state
                    entity: input_text.spraak_openstaande_vraag
                    state_not: ""
          - type: grid
            columns: 2
            square: false
            visibility: *vraag_open
            cards:
              - type: custom:mushroom-template-card
                primary: Ja
                secondary: doe het
                icon: mdi:check-circle
                icon_color: green
                tap_action:
                  action: perform-action
                  perform_action: script.spraak_antwoord_geven
                  data:
                    antwoord: ja
              - type: custom:mushroom-template-card
                primary: Nee
                secondary: laat maar
                icon: mdi:close-circle
                icon_color: red
                tap_action:
                  action: perform-action
                  perform_action: script.spraak_antwoord_geven
                  data:
                    antwoord: nee
          # Zonder openstaande vraag legt deze kaart uit wat hier normaal
          # staat; een lege popup leest als een storing.
          - type: grid
            columns: 1
            square: false
            visibility:
              - condition: state
                entity: input_text.spraak_openstaande_vraag
                state: ""
            cards:
              - type: custom:mushroom-template-card
                primary: Geen openstaande vraag
                secondary: >-
                  Als het huis iets wil weten (zonnescherm uit? airco aan?)
                  verschijnt hier de vraag, met dezelfde Ja/Nee als op de
                  telefoon en de satelliet.
                icon: mdi:comment-check-outline
                icon_color: grey
      # --------- Deuren & ramen ---------
      # De rij in de RUIMTES-kaart zegt alleen dát er iets open staat. Hier
      # staat wélk contact dat is: gesorteerd op state (reverse, dus "on" boven
      # "off"), zodat wat open staat altijd bovenaan begint. De lijsten zijn
      # dezelfde als de groepen in packages/9 - Other/Firealarm.yaml; komt daar
      # een contact bij, dan ook hier.
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-deuren"
        name: Deuren & ramen
        icon: mdi:door-open
        width_desktop: *ov_popup_width
        styles: *ov_popup
        cards:
          - type: custom:mushroom-template-card
            entity: binary_sensor.all_doors
            primary: >-
              {% set d = is_state('binary_sensor.all_doors','on') %}
              {% set r = is_state('binary_sensor.all_windows','on') %}
              {{ 'Alles dicht' if not d and not r else
                 (('Deur' if d else '') ~ (' & ' if d and r else '') ~ ('Raam' if r else '')) ~ ' open' }}
            secondary: >-
              {% set n = expand('binary_sensor.all_doors','binary_sensor.all_windows')
                         | selectattr('state','eq','on') | list | count %}
              {{ 'het huis is dicht' if n == 0 else (n ~ (' contact' if n == 1 else ' contacten') ~ ' open') }}
            icon: >-
              {{ 'mdi:door-open' if is_state('binary_sensor.all_doors','on')
                 else ('mdi:window-open-variant' if is_state('binary_sensor.all_windows','on') else 'mdi:home-lock') }}
            icon_color: >-
              {{ 'amber' if is_state('binary_sensor.all_doors','on')
                    or is_state('binary_sensor.all_windows','on') else 'green' }}
          - type: custom:mushroom-title-card
            title: Deuren
          - type: custom:auto-entities
            show_empty: false
            card:
              type: grid
              columns: 2
              square: false
            card_param: cards
            sort:
              method: state
              reverse: true
            filter:
              include:
                - entity_id: binary_sensor.entree_entree_voordeur_deur
                  options: &ov_contact
                    type: custom:mushroom-entity-card
                    secondary_info: last-changed
                    tap_action:
                      action: more-info
                - entity_id: binary_sensor.garage_achterdeur_contact
                  options: *ov_contact
                - entity_id: binary_sensor.woonkamer_achterdeur_contact
                  options: *ov_contact
                - entity_id: binary_sensor.woonkamer_openslaande_deuren_contact
                  options: *ov_contact
                - entity_id: binary_sensor.speelkamer_openslaande_deuren_contact
                  options: *ov_contact
                - entity_id: binary_sensor.entree_deur_contact
                  options: *ov_contact
                - entity_id: binary_sensor.badkamer_deur_contact
                  options: *ov_contact
                - entity_id: binary_sensor.kantoor_deur_contact
                  options: *ov_contact
                - entity_id: binary_sensor.slaapkamer_slaapkamer_deur_deur
                  options: *ov_contact
                - entity_id: binary_sensor.slaapkamer_mini_deur_contact
                  options: *ov_contact
                - entity_id: binary_sensor.slaapkamer_maxi_deur_contact
                  options: *ov_contact
                - entity_id: binary_sensor.toilet_deur_contact
                  options: *ov_contact
              exclude:
                - state: unavailable
                - state: unknown
          - type: custom:mushroom-title-card
            title: Ramen
          - type: custom:auto-entities
            show_empty: false
            card:
              type: grid
              columns: 2
              square: false
            card_param: cards
            sort:
              method: state
              reverse: true
            filter:
              include:
                - entity_id: binary_sensor.keuken_raam_groot_contact
                  options: *ov_contact
                - entity_id: binary_sensor.keuken_raam_klein_contact
                  options: *ov_contact
                - entity_id: binary_sensor.badkamer_raam_contact
                  options: *ov_contact
                - entity_id: binary_sensor.kantoor_raam_links_contact
                  options: *ov_contact
                - entity_id: binary_sensor.kantoor_raam_rechts_contact
                  options: *ov_contact
                - entity_id: binary_sensor.slaapkamer_raam_links_contact
                  options: *ov_contact
                - entity_id: binary_sensor.slaapkamer_raam_rechts_contact
                  options: *ov_contact
                - entity_id: binary_sensor.slaapkamer_maxi_raam_links_contact
                  options: *ov_contact
                - entity_id: binary_sensor.slaapkamer_maxi_raam_rechts_contact
                  options: *ov_contact
                - entity_id: binary_sensor.slaapkamer_mini_raam_contact
                  options: *ov_contact
                - entity_id: binary_sensor.slaapkamer_mini_dakraam_contact
                  options: *ov_contact
              exclude:
                - state: unavailable
                - state: unknown
          # Het voordeurslot hoort bij dit blik op "is het huis dicht", maar
          # zit niet in de deurgroep: dat is een lock, geen contactsensor.
          - type: custom:mushroom-title-card
            title: Slot
          - type: custom:mushroom-lock-card
            entity: lock.kroon18voordeur
            name: Voordeur

      # =================== RUIMTE-POPUPS ===================
      #
      # VASTE OPBOUW - elke verdiepingspopup heeft dezelfde vier blokken in
      # dezelfde volgorde:
      #
      #   1. Temperatuur   mini-kaarten per kamer, alleen lezen (tik = more-info)
      #   2. Verlichting   "alles uit" + één lamp per kamer
      #   3. Rolluiken     hele verdieping omhoog/omlaag + elke kamer los
      #   4. Klimaat       airco of verwarming van deze verdieping
      #
      # Bestaat een blok op een verdieping niet (de garage heeft geen rolluik,
      # buiten heeft geen klimaatbediening), dan valt dát blok weg en schuift de
      # rest niet op. Zo staat dezelfde knop op elke verdieping op dezelfde
      # plek - dat is het hele punt van deze structuur, dus voeg hier niets
      # tussen zonder het op álle popups te doen.
      #
      # WELKE THERMOMETER BIJ WELKE KAMER HOORT
      # Die koppeling staat op één plek: de `KAMERS`-lijst in
      # `custom_templates/kamers.jinja`, sleutel `klimaat`. Daar staan de
      # sensoren die écht de kamerlucht meten - zigbee2mqtt hangt aan bijna elk
      # apparaat óók een `device_temperature` (de printplaat, structureel te
      # warm) en die mag hier dus niet in. Verandert er iets in die lijst, dan
      # hier ook. Kamers zonder thermometer (keuken, entree, toilet, overloop,
      # zolder, voortuin) staan er bewust helemaal niet tussen in plaats van
      # als kaart met een streepje: een lege kaart ziet eruit als een storing.
      #
      # De kleurschaal is overal gelijk: <18 blauw, 18-23 groen, 23-26 oranje,
      # daarboven rood. Geen meting = grijs.
      #
      # KOLOMMEN
      # Elk raster krijgt zoveel kolommen dat de laatste rij vol is, tot een
      # maximum dat past bij wat er in de kaart moet passen:
      #
      #   temperatuur  max 4   naam + getal, verder niets
      #   verlichting  max 3   moet een helderheidsschuif kwijt
      #   rolluiken    max 2   vier knoppen én een positieschuif
      #   omhoog/omlaag altijd 2 - dat is een paar en hoort er als paar uit te zien
      #
      # Zijn er minder kaarten dan het maximum, dan is `columns` gelijk aan het
      # aantal kaarten. Met een vast getal wordt een verdieping met één rolluik
      # een smal kaartje in een verder lege rij.
      #
      # Eén rij komt er niet vol uit: de begane grond en de eerste verdieping
      # hebben allebei vijf lampen, dus 3 + 2. Vijf kolommen zou dat oplossen
      # maar maakt de helderheidsschuif ~165px breed, en dat is op een
      # touchscreen niet meer te bedienen. Die ene open plek is het waard.
      #
      # LOSSE KAARTEN ALTIJD IN EEN RASTER MET ÉÉN KOLOM
      # Een kaart die rechtstreeks onder `cards:` van de popup hangt, krijgt van
      # bubble-card maar de halve breedte; een `type: grid` pakt wél de volle
      # breedte. "Alles uit", de klimaatkaarten en het zonnescherm stonden
      # daardoor als halve kaart met een gat ernaast. Ze zitten nu allemaal in
      # een raster met `columns: 1`. Dat is verder een no-op, dus doe het ook bij
      # een nieuwe losse kaart in plaats van uit te zoeken of hij "breed genoeg"
      # oogt.
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-groundfloor"
        name: Begane grond
        icon: mdi:home-floor-0
        width_desktop: *ov_popup_width
        styles: *ov_popup
        cards:
          # ----- 1. Temperatuur -----
          # Speelkamer, garage en meterkast liggen ook op de begane grond, dus
          # ze horen in dit overzicht. Hun lampen zitten in #ov-garage; die
          # popup toont dezelfde twee thermometers nog een keer. Dat is bewust:
          # allebei de ingangen moeten op zichzelf compleet zijn.
          - type: custom:mushroom-title-card
            subtitle: Temperatuur
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.woonkamer_woonkamer_multisensor_temperatuur
                primary: Woonkamer
                secondary: >-
                  {% set t = states('sensor.woonkamer_woonkamer_multisensor_temperatuur') | float(none) %}
                  {{ (t | round(1) | string | replace('.', ',') ~ ' °C') if t is not none else 'Geen meting' }}
                icon: mdi:sofa-outline
                icon_color: >-
                  {% set t = states('sensor.woonkamer_woonkamer_multisensor_temperatuur') | float(none) %}
                  {{ 'grey' if t is none else 'blue' if t < 18 else 'green' if t < 23 else 'orange' if t < 26 else 'red' }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.speelkamer_speelkamer_temperatuur_temperatuur
                primary: Speelkamer
                secondary: >-
                  {% set t = states('sensor.speelkamer_speelkamer_temperatuur_temperatuur') | float(none) %}
                  {{ (t | round(1) | string | replace('.', ',') ~ ' °C') if t is not none else 'Geen meting' }}
                icon: mdi:teddy-bear
                icon_color: >-
                  {% set t = states('sensor.speelkamer_speelkamer_temperatuur_temperatuur') | float(none) %}
                  {{ 'grey' if t is none else 'blue' if t < 18 else 'green' if t < 23 else 'orange' if t < 26 else 'red' }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.garage_garage_temperatuur_temperatuur
                primary: Garage
                secondary: >-
                  {% set t = states('sensor.garage_garage_temperatuur_temperatuur') | float(none) %}
                  {{ (t | round(1) | string | replace('.', ',') ~ ' °C') if t is not none else 'Geen meting' }}
                icon: mdi:garage-variant
                icon_color: >-
                  {% set t = states('sensor.garage_garage_temperatuur_temperatuur') | float(none) %}
                  {{ 'grey' if t is none else 'blue' if t < 18 else 'green' if t < 23 else 'orange' if t < 26 else 'red' }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.meterkast_temperatuur_temperature
                primary: Meterkast
                secondary: >-
                  {% set t = states('sensor.meterkast_temperatuur_temperature') | float(none) %}
                  {{ (t | round(1) | string | replace('.', ',') ~ ' °C') if t is not none else 'Geen meting' }}
                icon: mdi:flash-outline
                icon_color: >-
                  {% set t = states('sensor.meterkast_temperatuur_temperature') | float(none) %}
                  {{ 'grey' if t is none else 'blue' if t < 18 else 'green' if t < 23 else 'orange' if t < 26 else 'red' }}
                tap_action:
                  action: more-info

          # ----- 2. Verlichting -----
          - type: custom:mushroom-title-card
            subtitle: Verlichting
          - type: grid
            columns: 1
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Alles uit
                secondary: Begane grond
                icon: mdi:lightbulb-group-off
                icon_color: grey
                tap_action:
                  action: perform-action
                  perform_action: light.turn_off
                  target:
                    entity_id:
                      - light.woonkamer_lampen
                      - light.keuken_lampen
                      - light.eettafel_lampen
                      - light.entree_lampen
                      - light.trapkast_lampen
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-light-card
                entity: light.woonkamer_lampen
                name: Woonkamer
                show_brightness_control: true
                use_light_color: true
              - type: custom:mushroom-light-card
                entity: light.keuken_lampen
                name: Keuken
                show_brightness_control: true
                use_light_color: true
              - type: custom:mushroom-light-card
                entity: light.eettafel_lampen
                name: Eettafel
                show_brightness_control: true
                use_light_color: true
              - type: custom:mushroom-light-card
                entity: light.entree_lampen
                name: Entree
                show_brightness_control: true
                use_light_color: true
              - type: custom:mushroom-light-card
                entity: light.trapkast_lampen
                name: Trapkast
                show_brightness_control: true
                use_light_color: true

          # ----- 3. Rolluiken en schermen -----
          # De keuken is de enige ruimte op deze verdieping met covers; het
          # knoppenpaar pakt daarom screens én rolgordijnen tegelijk.
          - type: custom:mushroom-title-card
            subtitle: Rolluiken en schermen
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Schermen omhoog
                secondary: Hele verdieping
                icon: mdi:window-shutter-open
                icon_color: blue
                tap_action:
                  action: perform-action
                  perform_action: cover.open_cover
                  target:
                    entity_id:
                      - cover.covers_kitchen_screens
                      - cover.covers_kitchen_rollerblinds
              - type: custom:mushroom-template-card
                primary: Schermen omlaag
                secondary: Hele verdieping
                icon: mdi:window-shutter
                icon_color: grey
                tap_action:
                  action: perform-action
                  perform_action: cover.close_cover
                  target:
                    entity_id:
                      - cover.covers_kitchen_screens
                      - cover.covers_kitchen_rollerblinds
          # Eén bediening per kamer: de twee keukenscreens zitten samen in
          # `cover.covers_kitchen_screens` en de twee rolgordijnen in
          # `cover.covers_kitchen_rollerblinds` (allebei cover-groups uit
          # packages/0 - Ground Floor/Kitchen/Covers.yaml). Los per raam kan via
          # more-info op de groep; dat hoort niet op een wandpaneel.
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-cover-card
                entity: cover.covers_kitchen_screens
                name: Keuken screens
                show_buttons_control: true
                show_position_control: true
              - type: custom:mushroom-cover-card
                entity: cover.covers_kitchen_rollerblinds
                name: Keuken rolgordijnen
                show_buttons_control: true
                show_position_control: true

          # ----- 4. Klimaat -----
          - type: custom:mushroom-title-card
            subtitle: Klimaat
          - type: grid
            columns: 1
            square: false
            cards:
              - type: custom:mushroom-climate-card
                entity: climate.airco_woonkamer
                name: Airco woonkamer
                hvac_modes:
                  - "off"
                  - cool
                  - heat
                  - dry
                  - fan_only
                show_temperature_control: true
                collapsible_controls: true
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-firstfloor"
        name: Eerste verdieping
        icon: mdi:home-floor-1
        width_desktop: *ov_popup_width
        styles: *ov_popup
        cards:
          # ----- 1. Temperatuur -----
          # De overloop heeft geen thermometer en staat er daarom niet tussen.
          - type: custom:mushroom-title-card
            subtitle: Temperatuur
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.slaapkamer_slaapkamer_temperatuur_temperatuur
                primary: Slaapkamer
                secondary: >-
                  {% set t = states('sensor.slaapkamer_slaapkamer_temperatuur_temperatuur') | float(none) %}
                  {{ (t | round(1) | string | replace('.', ',') ~ ' °C') if t is not none else 'Geen meting' }}
                icon: mdi:bed-king-outline
                icon_color: >-
                  {% set t = states('sensor.slaapkamer_slaapkamer_temperatuur_temperatuur') | float(none) %}
                  {{ 'grey' if t is none else 'blue' if t < 18 else 'green' if t < 23 else 'orange' if t < 26 else 'red' }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.slaapkamer_logan_slaapkamer_maxi_temperatuur_temperatuur
                primary: Slaapkamer Logan
                secondary: >-
                  {% set t = states('sensor.slaapkamer_logan_slaapkamer_maxi_temperatuur_temperatuur') | float(none) %}
                  {{ (t | round(1) | string | replace('.', ',') ~ ' °C') if t is not none else 'Geen meting' }}
                icon: mdi:bed-single-outline
                icon_color: >-
                  {% set t = states('sensor.slaapkamer_logan_slaapkamer_maxi_temperatuur_temperatuur') | float(none) %}
                  {{ 'grey' if t is none else 'blue' if t < 18 else 'green' if t < 23 else 'orange' if t < 26 else 'red' }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.badkamer_badkamer_temperatuur_temperatuur
                primary: Badkamer
                secondary: >-
                  {% set t = states('sensor.badkamer_badkamer_temperatuur_temperatuur') | float(none) %}
                  {{ (t | round(1) | string | replace('.', ',') ~ ' °C') if t is not none else 'Geen meting' }}
                icon: mdi:shower
                icon_color: >-
                  {% set t = states('sensor.badkamer_badkamer_temperatuur_temperatuur') | float(none) %}
                  {{ 'grey' if t is none else 'blue' if t < 18 else 'green' if t < 23 else 'orange' if t < 26 else 'red' }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.kantoor_kantoor_temperatuur_temperatuur
                primary: Kantoor
                secondary: >-
                  {% set t = states('sensor.kantoor_kantoor_temperatuur_temperatuur') | float(none) %}
                  {{ (t | round(1) | string | replace('.', ',') ~ ' °C') if t is not none else 'Geen meting' }}
                icon: mdi:desk
                icon_color: >-
                  {% set t = states('sensor.kantoor_kantoor_temperatuur_temperatuur') | float(none) %}
                  {{ 'grey' if t is none else 'blue' if t < 18 else 'green' if t < 23 else 'orange' if t < 26 else 'red' }}
                tap_action:
                  action: more-info

          # ----- 2. Verlichting -----
          - type: custom:mushroom-title-card
            subtitle: Verlichting
          - type: grid
            columns: 1
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Alles uit
                secondary: Eerste verdieping
                icon: mdi:lightbulb-group-off
                icon_color: grey
                tap_action:
                  action: perform-action
                  perform_action: light.turn_off
                  target:
                    entity_id:
                      - light.badkamer_lampen
                      - light.slaapkamer_lampen
                      - light.slaapkamer_maxi_lampen
                      # De losse lamp van Logan zit NIET in de zigbee-groep
                      # `slaapkamer_maxi_lampen` en moet hier dus apart bij.
                      # Bewijs: op 10 augustus 2026 om 21:00:01 zette de
                      # bedtijdroutine die groep uit en deze lamp tegelijk aan.
                      # Stond hij hier niet, dan liet "Alles uit" hem branden.
                      - light.slaapkamer_losse_lamp_maxi
                      - light.kantoor_lampen
                      - light.overloop_lampen
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-light-card
                entity: light.badkamer_lampen
                name: Badkamer
                show_brightness_control: true
                use_light_color: true
              - type: custom:mushroom-light-card
                entity: light.slaapkamer_lampen
                name: Slaapkamer
                show_brightness_control: true
                use_light_color: true
              - type: custom:mushroom-light-card
                entity: light.slaapkamer_maxi_lampen
                name: Slaapkamer Logan
                show_brightness_control: true
                use_light_color: true
              # Staat direct achter de kamer waar hij bij hoort, zodat de
              # tweede rij precies vol loopt met Kantoor en Overloop.
              - type: custom:mushroom-light-card
                entity: light.slaapkamer_losse_lamp_maxi
                name: Losse lamp Logan
                show_brightness_control: true
                use_light_color: true
              - type: custom:mushroom-light-card
                entity: light.kantoor_lampen
                name: Kantoor
                show_brightness_control: true
                use_light_color: true
              - type: custom:mushroom-light-card
                entity: light.overloop_lampen
                name: Overloop
                show_brightness_control: true
                use_light_color: true

          # ----- 3. Rolluiken -----
          # Overal de low_speed-varianten, want de rest van het huis
          # (packages/9 - Other/Covers.yaml) stuurt ze ook zo aan. Door hier de
          # gewone entiteit te pakken zou dezelfde rolluik op twee snelheden
          # lopen afhankelijk van waar je hem bedient.
          - type: custom:mushroom-title-card
            subtitle: Rolluiken
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Rolluiken omhoog
                secondary: Hele verdieping
                icon: mdi:window-shutter-open
                icon_color: blue
                tap_action:
                  action: perform-action
                  perform_action: cover.open_cover
                  target:
                    entity_id:
                      - cover.kantoor_links_low_speed
                      - cover.kantoor_rechts_low_speed
                      - cover.badkamer_rolluik_low_speed
                      - cover.slaapkamer_rolluik_low_speed
                      - cover.slaapkamer_maxi_links_low_speed
                      - cover.slaapkamer_maxi_rechts_low_speed
              - type: custom:mushroom-template-card
                primary: Rolluiken omlaag
                secondary: Hele verdieping
                icon: mdi:window-shutter
                icon_color: grey
                tap_action:
                  action: perform-action
                  perform_action: cover.close_cover
                  target:
                    entity_id:
                      - cover.kantoor_links_low_speed
                      - cover.kantoor_rechts_low_speed
                      - cover.badkamer_rolluik_low_speed
                      - cover.slaapkamer_rolluik_low_speed
                      - cover.slaapkamer_maxi_links_low_speed
                      - cover.slaapkamer_maxi_rechts_low_speed
          # Eén bediening per kamer. Logan en het kantoor hebben allebei twee
          # rolluiken; die gaan via hun bestaande cover-group, zodat een tik
          # altijd de hele kamer doet en de twee helften niet uit elkaar kunnen
          # lopen. Beide groepen bevatten de low_speed-varianten, dus dat blijft
          # kloppen met de rest van het huis.
          #   cover.covers_bedroom_maxi -> packages/1 - First Floor/Bedroom Maxi/Covers.yaml
          #   cover.covers_office       -> packages/1 - First Floor/Office/Covers.yaml
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-cover-card
                entity: cover.slaapkamer_rolluik_low_speed
                name: Slaapkamer
                show_buttons_control: true
                show_position_control: true
              - type: custom:mushroom-cover-card
                entity: cover.badkamer_rolluik_low_speed
                name: Badkamer
                show_buttons_control: true
                show_position_control: true
              - type: custom:mushroom-cover-card
                entity: cover.covers_bedroom_maxi
                name: Slaapkamer Logan
                show_buttons_control: true
                show_position_control: true
              - type: custom:mushroom-cover-card
                entity: cover.covers_office
                name: Kantoor
                show_buttons_control: true
                show_position_control: true

          # ----- 4. Klimaat -----
          # Alleen verwarmen/uit; deze thermostaat kent geen cool/dry/fan_only.
          - type: custom:mushroom-title-card
            subtitle: Klimaat
          - type: grid
            columns: 1
            square: false
            cards:
              - type: custom:mushroom-climate-card
                entity: climate.kantoor_verwarming
                name: Verwarming kantoor
                hvac_modes:
                  - "off"
                  - heat
                show_temperature_control: true
                collapsible_controls: true
          # ----- Extra (alleen deze verdieping) -----
          # Bootst een druk op de fysieke slaapkamerknoppen na, zie
          # packages/9 - Other/Virtual Buttons.yaml. Alle 11 automations die op
          # die knop reageren gaan mee, dus ook slot, rolluiken en alarm.
          # Tik/dubbeltik/vasthouden = precies wat de knop zelf ook doet;
          # secondary zegt daarom welke routine een tik nú start.
          # Staat bewust ná de vier vaste blokken, zodat de vaste volgorde
          # hierboven op elke verdieping klopt.
          - type: custom:mushroom-title-card
            subtitle: Routines
          - type: grid
            columns: 1
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Slaapkamer knop
                secondary: >-
                  {{ 'Tik: opstaan-routine' if 6 <= now().hour < 17 else 'Tik:
                  naar bed-routine' }}
                icon: mdi:gesture-tap-button
                icon_color: purple
                tap_action:
                  action: perform-action
                  perform_action: script.virtual_button_press
                  data:
                    button: bedroom_buttons
                    action: single
                double_tap_action:
                  action: perform-action
                  perform_action: script.virtual_button_press
                  data:
                    button: bedroom_buttons
                    action: double
                hold_action:
                  action: perform-action
                  perform_action: script.virtual_button_press
                  data:
                    button: bedroom_buttons
                    action: hold
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-secondfloor"
        name: Tweede verdieping
        icon: mdi:home-floor-2
        width_desktop: *ov_popup_width
        styles: *ov_popup
        cards:
          # ----- 1. Temperatuur -----
          # De zolder zelf heeft geen thermometer; de airco hieronder meet wel,
          # maar dat is de aanzuigtemperatuur van het apparaat en geen
          # kamermeting, dus die staat hier niet als kamerkaart.
          - type: custom:mushroom-title-card
            subtitle: Temperatuur
          - type: grid
            columns: 1
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.slaapkamer_emma_slaapkamer_mini_temperatuur_temperatuur
                primary: Slaapkamer Emma
                secondary: >-
                  {% set t = states('sensor.slaapkamer_emma_slaapkamer_mini_temperatuur_temperatuur') | float(none) %}
                  {{ (t | round(1) | string | replace('.', ',') ~ ' °C') if t is not none else 'Geen meting' }}
                icon: mdi:bed-single-outline
                icon_color: >-
                  {% set t = states('sensor.slaapkamer_emma_slaapkamer_mini_temperatuur_temperatuur') | float(none) %}
                  {{ 'grey' if t is none else 'blue' if t < 18 else 'green' if t < 23 else 'orange' if t < 26 else 'red' }}
                tap_action:
                  action: more-info

          # ----- 2. Verlichting -----
          - type: custom:mushroom-title-card
            subtitle: Verlichting
          - type: grid
            columns: 1
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Alles uit
                secondary: Tweede verdieping
                icon: mdi:lightbulb-group-off
                icon_color: grey
                tap_action:
                  action: perform-action
                  perform_action: light.turn_off
                  target:
                    entity_id:
                      - light.overloop_zolder_lampen
                      - light.slaapkamer_mini_lampen
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-light-card
                entity: light.overloop_zolder_lampen
                name: Overloop zolder
                show_brightness_control: true
                use_light_color: true
              - type: custom:mushroom-light-card
                entity: light.slaapkamer_mini_lampen
                name: Slaapkamer Emma
                show_brightness_control: true
                use_light_color: true

          # ----- 3. Rolluiken -----
          # Deze verdieping heeft één rolluik (slaapkamer Emma). Het knoppenpaar
          # staat er toch, zodat de popups over de verdiepingen heen gelijk
          # aanvoelen; hij heeft geen low_speed-variant.
          - type: custom:mushroom-title-card
            subtitle: Rolluiken
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Rolluiken omhoog
                secondary: Hele verdieping
                icon: mdi:window-shutter-open
                icon_color: blue
                tap_action:
                  action: perform-action
                  perform_action: cover.open_cover
                  target:
                    entity_id:
                      - cover.slaapkamer_mini
              - type: custom:mushroom-template-card
                primary: Rolluiken omlaag
                secondary: Hele verdieping
                icon: mdi:window-shutter
                icon_color: grey
                tap_action:
                  action: perform-action
                  perform_action: cover.close_cover
                  target:
                    entity_id:
                      - cover.slaapkamer_mini
          - type: grid
            columns: 1
            square: false
            cards:
              - type: custom:mushroom-cover-card
                entity: cover.slaapkamer_mini
                name: Slaapkamer Emma
                show_buttons_control: true
                show_position_control: true

          # ----- 4. Klimaat -----
          - type: custom:mushroom-title-card
            subtitle: Klimaat
          - type: grid
            columns: 1
            square: false
            cards:
              - type: custom:mushroom-climate-card
                entity: climate.airco_zolder
                name: Airco zolder
            hvac_modes:
              - "off"
              - cool
              - heat
              - dry
              - fan_only
            show_temperature_control: true
            collapsible_controls: true
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-garage"
        name: Garage / speelkamer
        icon: mdi:garage
        width_desktop: *ov_popup_width
        styles: *ov_popup
        cards:
          # ----- 1. Temperatuur -----
          # Dezelfde twee thermometers staan ook in #ov-groundfloor (garage en
          # speelkamer liggen nu eenmaal op de begane grond). Bewuste dubbeling:
          # wie hier binnenkomt moet niet eerst naar een andere popup hoeven.
          - type: custom:mushroom-title-card
            subtitle: Temperatuur
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.speelkamer_speelkamer_temperatuur_temperatuur
                primary: Speelkamer
                secondary: >-
                  {% set t = states('sensor.speelkamer_speelkamer_temperatuur_temperatuur') | float(none) %}
                  {{ (t | round(1) | string | replace('.', ',') ~ ' °C') if t is not none else 'Geen meting' }}
                icon: mdi:teddy-bear
                icon_color: >-
                  {% set t = states('sensor.speelkamer_speelkamer_temperatuur_temperatuur') | float(none) %}
                  {{ 'grey' if t is none else 'blue' if t < 18 else 'green' if t < 23 else 'orange' if t < 26 else 'red' }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.garage_garage_temperatuur_temperatuur
                primary: Garage
                secondary: >-
                  {% set t = states('sensor.garage_garage_temperatuur_temperatuur') | float(none) %}
                  {{ (t | round(1) | string | replace('.', ',') ~ ' °C') if t is not none else 'Geen meting' }}
                icon: mdi:garage-variant
                icon_color: >-
                  {% set t = states('sensor.garage_garage_temperatuur_temperatuur') | float(none) %}
                  {{ 'grey' if t is none else 'blue' if t < 18 else 'green' if t < 23 else 'orange' if t < 26 else 'red' }}
                tap_action:
                  action: more-info

          # ----- 2. Verlichting -----
          - type: custom:mushroom-title-card
            subtitle: Verlichting
          # homeassistant.turn_off in plaats van light.turn_off, want de
          # verwarmingsplaat is een switch en moet hier ook mee uit.
          - type: grid
            columns: 1
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Alles uit
                secondary: Garage / speelkamer
                icon: mdi:lightbulb-group-off
                icon_color: grey
                tap_action:
                  action: perform-action
                  perform_action: homeassistant.turn_off
                  target:
                    entity_id:
                      - light.garage_lampen
                      - light.speelkamer_lampen
                      - switch.speelkamer_stopcontact_verwarming
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-light-card
                entity: light.garage_lampen
                name: Garage
                show_brightness_control: true
                use_light_color: true
              - type: custom:mushroom-light-card
                entity: light.speelkamer_lampen
                name: Speelkamer
                show_brightness_control: true
                use_light_color: true

          # ----- 3. Rolluiken: bestaan hier niet, blok valt weg -----

          # ----- 4. Klimaat -----
          # Plafond-verwarmingsplaat speelkamer; verbruik alleen tonen als hij aan staat.
          - type: custom:mushroom-title-card
            subtitle: Klimaat
          - type: grid
            columns: 1
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: switch.speelkamer_stopcontact_verwarming
                primary: Verwarmingsplaat
                secondary: >-
                  {% if is_state('switch.speelkamer_stopcontact_verwarming','on') %}Aan{{
                  (' · ' ~ states('sensor.speelkamer_stopcontact_verwarming_power') ~ ' W')
                  if has_value('sensor.speelkamer_stopcontact_verwarming_power') else '' }}{%
                  else %}Uit{% endif %}
                icon: mdi:heat-wave
                icon_color: "{{ 'orange' if is_state('switch.speelkamer_stopcontact_verwarming','on') else 'grey' }}"
                tap_action:
                  action: toggle
      # De losse knoppen die vroeger op de oude dashboard-view stonden. Ze
      # zaten eerst als twee panelen in de rechterkolom, maar dat waren tien
      # rijen op de belangrijkste kolom van het paneel - hier staan ze net zo
      # goed en kost het niets (Robin, 14 augustus 2026).
      #
      # Waarom hier en niet in #ov-outside: de jacuzzi hoort buiten, maar de
      # koffiemachine en de luchtreinigers niet. Eén plek waar álle losse
      # schakelaars staan is makkelijker te onthouden dan vier popups waar er
      # telkens één tussen de kamerkaarten verstopt zit.
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-schakelaars"
        name: Schakelaars
        icon: mdi:toggle-switch-outline
        width_desktop: *ov_popup_width
        styles: *ov_popup
        cards:
          # ----- 1. Jacuzzi -----
          # `power` is de stekker, `keep_warm` is de automatisering in
          # packages/3 - Outside/Backyard/Spa.yaml die de temperatuur
          # vasthoudt. Twee verschillende dingen, dus allebei een eigen knop.
          # Het hele blok verdwijnt zodra de spa is opgeruimd, kop en al -
          # anders staan hier een half jaar vier grijze knoppen die niets doen,
          # met een kop erboven die suggereert dat er een jacuzzi is. Komt
          # vanzelf terug in het voorjaar. Zie binary_sensor.
          # backyard_spa_aanwezig in packages/3 - Outside/Backyard/Spa.yaml.
          - type: custom:mushroom-title-card
            subtitle: Jacuzzi
            visibility: &spa_aanwezig
              - condition: state
                entity: binary_sensor.backyard_spa_aanwezig
                state: "on"
          - type: grid
            columns: 2
            square: false
            visibility: *spa_aanwezig
            cards:
              - type: custom:mushroom-template-card
                entity: switch.intex_purespa_power
                primary: Jacuzzi
                secondary: >-
                  {% if is_state('switch.intex_purespa_power','on') %}
                    {% set t = state_attr('climate.intex_purespa','current_temperature') | float(none) %}
                    Aan{{ (' · ' ~ (t | round(1) | string | replace('.', ',')) ~ ' °C') if t is not none else '' }}
                  {% else %}Uit{% endif %}
                icon: mdi:hot-tub
                icon_color: "{{ 'blue' if is_state('switch.intex_purespa_power','on') else 'grey' }}"
                tap_action:
                  action: toggle
              - type: custom:mushroom-template-card
                entity: input_boolean.backyard_spa_keep_warm
                primary: Warmhouden
                secondary: >-
                  {{ 'Houdt de temperatuur vast'
                     if is_state('input_boolean.backyard_spa_keep_warm','on') else 'Uit' }}
                icon: mdi:thermometer-check
                icon_color: "{{ 'blue' if is_state('input_boolean.backyard_spa_keep_warm','on') else 'grey' }}"
                tap_action:
                  action: toggle
              - type: custom:mushroom-template-card
                entity: switch.intex_purespa_filter
                primary: Filter
                secondary: "{{ 'Aan' if is_state('switch.intex_purespa_filter','on') else 'Uit' }}"
                icon: mdi:air-filter
                icon_color: "{{ 'blue' if is_state('switch.intex_purespa_filter','on') else 'grey' }}"
                tap_action:
                  action: toggle
              - type: custom:mushroom-template-card
                entity: switch.intex_purespa_sanitizer
                primary: Sanitizer
                secondary: "{{ 'Aan' if is_state('switch.intex_purespa_sanitizer','on') else 'Uit' }}"
                icon: mdi:water-opacity
                icon_color: "{{ 'blue' if is_state('switch.intex_purespa_sanitizer','on') else 'grey' }}"
                tap_action:
                  action: toggle

          # ----- 2. In huis -----
          - type: custom:mushroom-title-card
            subtitle: In huis
          - type: grid
            columns: 2
            square: false
            cards:
              # De koffiemachine gaat ook vanzelf aan en uit (Kitchen/
              # Coffee.yaml stuurt op thuiskomen, het alarm en de klok).
              # Vandaar hoe lang hij al zo staat: dan zie je of jij dat was
              # of het huis.
              - type: custom:mushroom-template-card
                entity: switch.linea_micra_kroon_18
                primary: Koffiemachine
                secondary: >-
                  {% set e = states.switch.linea_micra_kroon_18 %}
                  {% if e is none or e.state in ['unavailable','unknown'] %}Geen verbinding
                  {% else %}
                    {% set m = ((now() - e.last_changed).total_seconds() / 60) | round(0) | int %}
                    {{ 'Aan' if e.state == 'on' else 'Uit' }} ·
                    {{ (m ~ ' min') if m < 60 else ((m / 60) | round(0) | int ~ ' uur') }}
                  {% endif %}
                icon: mdi:coffee
                icon_color: "{{ 'orange' if is_state('switch.linea_micra_kroon_18','on') else 'grey' }}"
                tap_action:
                  action: toggle
              # Zonder deze regel is een uitgestaan koffieapparaat midden op de
              # dag niet te verklaren: de automatisering zet hem normaal binnen
              # een tel weer aan, dus "uit" betekent hier altijd dat de pauze
              # loopt. Hier zie je dat, en zet je hem in één tik weer vrij.
              - type: custom:mushroom-template-card
                entity: input_boolean.koffie_pauze
                primary: Geen koffie meer
                secondary: >-
                  {% if is_state('input_boolean.koffie_pauze','on') %}
                    Blijft uit tot 07:00
                  {% elif today_at('07:00') <= now() < today_at('19:00')
                          and is_state('group.all_adults','home') %}
                    Machine hoort nu aan te staan
                  {% else %}
                    Buiten koffietijd
                  {% endif %}
                icon: mdi:coffee-off-outline
                icon_color: "{{ 'red' if is_state('input_boolean.koffie_pauze','on') else 'grey' }}"
                tap_action:
                  action: toggle
              - type: custom:mushroom-template-card
                entity: switch.woonkamer_woonkamer_stopcontact_luchtreiniger
                primary: Luchtreiniger woonkamer
                secondary: >-
                  {{ 'Aan' if is_state('switch.woonkamer_woonkamer_stopcontact_luchtreiniger','on') else 'Uit' }}
                icon: mdi:air-purifier
                icon_color: >-
                  {{ 'green' if is_state('switch.woonkamer_woonkamer_stopcontact_luchtreiniger','on') else 'grey' }}
                tap_action:
                  action: toggle
              - type: custom:mushroom-template-card
                entity: switch.eettafel_eettafel_stopcontact_luchtreiniger
                primary: Luchtreiniger eettafel
                secondary: >-
                  {{ 'Aan' if is_state('switch.eettafel_eettafel_stopcontact_luchtreiniger','on') else 'Uit' }}
                icon: mdi:air-purifier
                icon_color: >-
                  {{ 'green' if is_state('switch.eettafel_eettafel_stopcontact_luchtreiniger','on') else 'grey' }}
                tap_action:
                  action: toggle
              - type: custom:mushroom-template-card
                entity: switch.meterkast_meterkast_stopcontact_ledstrip
                primary: Ledstrip meterkast
                secondary: >-
                  {{ 'Aan' if is_state('switch.meterkast_meterkast_stopcontact_ledstrip','on') else 'Uit' }}
                icon: mdi:led-strip-variant
                icon_color: >-
                  {{ 'orange' if is_state('switch.meterkast_meterkast_stopcontact_ledstrip','on') else 'grey' }}
                tap_action:
                  action: toggle

          # ----- 3. Kinderen -----
          # De enige schakelaar hier die niets aanzet maar iets afspreekt: hij
          # verandert wat het huis morgenochtend doet als een kinderdeur
          # opengaat. Hij hoort daarom bij de knoppen die je zelf omzet en niet
          # tussen de kamerkaarten - je zet hem 's avonds aan, beneden, als je
          # weet dat het zaterdag is. Zie packages/9 - Other/Kinderen Wakker.yaml
          # voor de drie automatiseringen die eraan hangen.
          - type: custom:mushroom-title-card
            subtitle: Kinderen
          - type: grid
            columns: 1
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: input_boolean.kinderen_mogen_wakker_worden
                primary: Kinderen mogen wakker worden
                # De ondertekst zegt wat er gebeurt en tot wanneer, want dit is
                # de enige knop hier waarvan je het resultaat pas morgen ziet.
                secondary: >-
                  {% if is_state('input_boolean.kinderen_mogen_wakker_worden','on') %}
                    Deur open = kamerlicht aan · vanzelf uit om 09:30
                  {% else %}
                    Uit · een open deur na bedtijd geeft een seintje beneden
                  {% endif %}
                icon: mdi:weather-sunset-up
                icon_color: >-
                  {{ 'amber' if is_state('input_boolean.kinderen_mogen_wakker_worden','on') else 'grey' }}
                tap_action:
                  action: toggle

          # ----- 4. Buiten en alles -----
          - type: custom:mushroom-title-card
            subtitle: Buiten en alles
          - type: grid
            columns: 2
            square: false
            cards:
              # De frietpan staat in de buitenkeuken en is de enige knop hier
              # die je aanzet om te wachten: hij trekt een paar duizend watt
              # tot de thermostaat dichtvalt, en juist dat inzakken is het
              # signaal dat hij op temperatuur is. De ondertekst laat dat
              # verloop zien, backyard_frietpan_op_temperatuur (packages/
              # 3 - Outside/Backyard/Outdoor Kitchen.yaml) stuurt het als
              # bericht naar de volwassenen. Dezelfde drempels als daar.
              #
              # "Op temperatuur" pas na 3 minuten: de eerste minuten na het
              # aanzetten is weinig verbruik gewoon een frietpan die nog moet
              # beginnen, en dat mag er niet uitzien als warm.
              - type: custom:mushroom-template-card
                entity: switch.achtertuin_achtertuin_buitenkeuken_frietpan
                primary: Frietpan
                secondary: >-
                  {% set e = states.switch.achtertuin_achtertuin_buitenkeuken_frietpan %}
                  {% if e is none or e.state in ['unavailable','unknown'] %}Geen verbinding
                  {% elif e.state == 'off' %}Uit
                  {% else %}
                    {% set w = states('sensor.achtertuin_achtertuin_buitenkeuken_frietpan_vermogen') | float(none) %}
                    {% set m = ((now() - e.last_changed).total_seconds() / 60) | round(0) | int %}
                    {% if w is none %}Aan · {{ m }} min
                    {% elif w > 500 %}Opwarmen · {{ w | round(0) | int }} W
                    {% elif w < 150 and m >= 3 %}Op temperatuur · {{ m }} min aan
                    {% else %}Aan · {{ m }} min · {{ w | round(0) | int }} W
                    {% endif %}
                  {% endif %}
                icon: mdi:french-fries
                icon_color: >-
                  {% set e = states.switch.achtertuin_achtertuin_buitenkeuken_frietpan %}
                  {% if e is none or e.state != 'on' %}grey
                  {% else %}
                    {% set w = states('sensor.achtertuin_achtertuin_buitenkeuken_frietpan_vermogen') | float(none) %}
                    {% set m = ((now() - e.last_changed).total_seconds() / 60) | round(0) | int %}
                    {{ 'green' if (w is not none and w < 150 and m >= 3) else 'orange' }}
                  {% endif %}
                tap_action:
                  action: toggle
              - type: custom:mushroom-template-card
                entity: switch.achtertuin_schuur_lampen
                primary: Schuurlampen
                secondary: "{{ 'Aan' if is_state('switch.achtertuin_schuur_lampen','on') else 'Uit' }}"
                icon: mdi:lightbulb-outline
                icon_color: "{{ 'orange' if is_state('switch.achtertuin_schuur_lampen','on') else 'grey' }}"
                tap_action:
                  action: toggle
              # "Aan" zegt bij een groep alleen dat er minstens één brandt,
              # dus hier het echte aantal.
              - type: custom:mushroom-template-card
                entity: light.all_lights
                primary: Alle lichten
                secondary: >-
                  {% set leden = state_attr('light.all_lights','entity_id') or [] %}
                  {% set n = leden | select('is_state','on') | list | count %}
                  {% if leden | count == 0 %}Onbekend
                  {% elif n == 0 %}Alles uit
                  {% elif n == 1 %}1 lamp aan
                  {% else %}{{ n }} lampen aan{% endif %}
                icon: mdi:lightbulb-group
                icon_color: "{{ 'orange' if is_state('light.all_lights','on') else 'grey' }}"
                tap_action:
                  action: toggle

      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-outside"
        name: Buiten
        icon: mdi:flower-tulip-outline
        width_desktop: *ov_popup_width
        styles: *ov_popup
        cards:
          # ----- 1. Temperatuur -----
          # Er hangt geen thermometer in de tuin; `sensor.knmi_temperatuur` is
          # echt de buitentemperatuur, alleen niet uit deze tuin - zelfde keuze
          # als in kamers.jinja, waar de achtertuin hem via `extra` leest. De
          # voortuin heeft niets en staat er dus niet bij.
          - type: custom:mushroom-title-card
            subtitle: Temperatuur
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.knmi_temperatuur
                primary: Buiten
                secondary: >-
                  {% set t = states('sensor.knmi_temperatuur') | float(none) %}
                  {{ (t | round(1) | string | replace('.', ',') ~ ' °C') if t is not none else 'Geen meting' }}
                icon: mdi:tree-outline
                icon_color: >-
                  {% set t = states('sensor.knmi_temperatuur') | float(none) %}
                  {{ 'grey' if t is none else 'blue' if t < 18 else 'green' if t < 23 else 'orange' if t < 26 else 'red' }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.achtertuin_schuur_temperatuur_temperature
                primary: Schuur
                secondary: >-
                  {% set t = states('sensor.achtertuin_schuur_temperatuur_temperature') | float(none) %}
                  {{ (t | round(1) | string | replace('.', ',') ~ ' °C') if t is not none else 'Geen meting' }}
                icon: mdi:home-outline
                icon_color: >-
                  {% set t = states('sensor.achtertuin_schuur_temperatuur_temperature') | float(none) %}
                  {{ 'grey' if t is none else 'blue' if t < 18 else 'green' if t < 23 else 'orange' if t < 26 else 'red' }}
                tap_action:
                  action: more-info

          # ----- 2. Verlichting -----
          - type: custom:mushroom-title-card
            subtitle: Verlichting
          - type: grid
            columns: 1
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Alle buitenverlichting uit
                secondary: Buiten
                icon: mdi:lightbulb-group-off
                icon_color: grey
                tap_action:
                  action: perform-action
                  perform_action: light.turn_off
                  target:
                    entity_id:
                      - light.voortuin_lampen
                      - light.achtertuin_lampen
                      - light.carport_lampen
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-light-card
                entity: light.voortuin_lampen
                name: Voortuin
                show_brightness_control: true
                use_light_color: true
              - type: custom:mushroom-light-card
                entity: light.achtertuin_lampen
                name: Achtertuin
                show_brightness_control: true
                use_light_color: true
              - type: custom:mushroom-light-card
                entity: light.carport_lampen
                name: Carport
                show_brightness_control: true
                use_light_color: true

          # ----- 3. Schermen -----
          # LET OP bij het maken van knoppen hier: bij dit scherm is `open` =
          # uitgeschoven en `closed` = ingetrokken, andersom dan bij een rolluik.
          # Zie packages/3 - Outside/Backyard/Sunscreen.yaml.
          - type: custom:mushroom-title-card
            subtitle: Schermen
          - type: grid
            columns: 1
            square: false
            cards:
              - type: custom:mushroom-cover-card
                entity: cover.achtertuin_zonnescherm
                name: Zonnescherm achtertuin
                show_buttons_control: true
                show_position_control: true

          # ----- 4. Klimaat: bestaat hier niet, blok valt weg -----

      # --------- Media / multiroom popup ---------
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-media"
        name: Media
        icon: mdi:music
        width_desktop: *ov_popup_width
        styles: *ov_popup
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              # ---- Overkapping toggle ----
              # Was twee kaarten met tegengestelde zichtbaarheidsregels, elk met
              # een eigen join/unjoin die ook al in de overkappingsknop stond.
              # Nu één kaart die zichzelf omschrijft naar de groepsstatus en het
              # gedeelde script aanroept (packages/9 - Other/Sonos Groups.yaml).
              - type: custom:mushroom-template-card
                entity: binary_sensor.sonos_overkapping_bij_woonkamer
                primary: >-
                  {{ 'Overkapping eraf' if is_state(entity, 'on')
                     else 'Overkapping erbij' }}
                secondary: >-
                  {{ 'loskoppelen' if is_state(entity, 'on')
                     else 'bij Woonkamer voegen' }}
                icon: >-
                  {{ 'mdi:speaker-off' if is_state(entity, 'on')
                     else 'mdi:speaker-multiple' }}
                icon_color: "{{ 'orange' if is_state(entity, 'on') else 'blue' }}"
                tap_action:
                  action: perform-action
                  perform_action: script.sonos_overkapping_toggle
              # ---- Benedenverdieping toggle ----
              - type: custom:mushroom-template-card
                primary: Benedenverdieping
                secondary: samen afspelen
                icon: mdi:home-floor-0
                icon_color: blue
                visibility:
                  - condition: state
                    entity: binary_sensor.sonos_benedenverdieping_samen
                    state: "off"
                tap_action:
                  action: perform-action
                  perform_action: media_player.join
                  target:
                    entity_id: media_player.woonkamer_sonos
                  data:
                    group_members:
                      - media_player.keuken_sonos
                      - media_player.keuken_sonos_2
                      - media_player.toilet_sonos
                      - media_player.overkapping_sonos
              - type: custom:mushroom-template-card
                primary: Benedenverdieping uit
                secondary: loskoppelen
                icon: mdi:home-floor-0
                icon_color: orange
                visibility:
                  - condition: state
                    entity: binary_sensor.sonos_benedenverdieping_samen
                    state: "on"
                tap_action:
                  action: perform-action
                  perform_action: media_player.unjoin
                  target:
                    entity_id:
                      - media_player.keuken_sonos
                      - media_player.keuken_sonos_2
                      - media_player.toilet_sonos
                      - media_player.overkapping_sonos
              # ---- Gehele huis toggle ----
              - type: custom:mushroom-template-card
                primary: Gehele huis
                secondary: alle speakers samen
                icon: mdi:home-group
                icon_color: green
                visibility:
                  - condition: state
                    entity: binary_sensor.sonos_gehele_huis_samen
                    state: "off"
                tap_action:
                  action: perform-action
                  perform_action: media_player.join
                  target:
                    entity_id: media_player.woonkamer_sonos
                  data:
                    group_members:
                      - media_player.keuken_sonos
                      - media_player.keuken_sonos_2
                      - media_player.overkapping_sonos
                      - media_player.toilet_sonos
                      - media_player.kantoor_sonos
                      - media_player.speelkamer_sonos
                      - media_player.garage_sonos
                      - media_player.badkamer_sonos
                      - media_player.slaapkamer_maxi_sonos
                      - media_player.slaapkamer_mini_sonos
              - type: custom:mushroom-template-card
                primary: Gehele huis uit
                secondary: alles loskoppelen
                icon: mdi:home-group
                icon_color: orange
                visibility:
                  - condition: state
                    entity: binary_sensor.sonos_gehele_huis_samen
                    state: "on"
                tap_action:
                  action: perform-action
                  perform_action: media_player.unjoin
                  target:
                    entity_id:
                      - media_player.woonkamer_sonos
                      - media_player.keuken_sonos
                      - media_player.keuken_sonos_2
                      - media_player.overkapping_sonos
                      - media_player.toilet_sonos
                      - media_player.kantoor_sonos
                      - media_player.speelkamer_sonos
                      - media_player.garage_sonos
                      - media_player.badkamer_sonos
                      - media_player.slaapkamer_maxi_sonos
                      - media_player.slaapkamer_mini_sonos
              # ---- Alles los (altijd) ----
              - type: custom:mushroom-template-card
                primary: Alles los
                secondary: alle groepen ontkoppelen
                icon: mdi:speaker-off
                icon_color: red
                tap_action:
                  action: perform-action
                  perform_action: media_player.unjoin
                  target:
                    entity_id:
                      - media_player.woonkamer_sonos
                      - media_player.keuken_sonos
                      - media_player.keuken_sonos_2
                      - media_player.overkapping_sonos
                      - media_player.toilet_sonos
                      - media_player.kantoor_sonos
                      - media_player.speelkamer_sonos
                      - media_player.garage_sonos
                      - media_player.badkamer_sonos
                      - media_player.slaapkamer_maxi_sonos
                      - media_player.slaapkamer_mini_sonos
          - type: custom:mini-media-player
            entity: media_player.woonkamer_sonos
            artwork: cover
            source: icon
            info: short
            hide:
              power_state: false
            speaker_group: &sonos_group
              platform: sonos
              show_group_count: true
              entities:
                - entity_id: media_player.woonkamer_sonos
                  name: Woonkamer
                - entity_id: media_player.keuken_sonos
                  name: Keuken
                - entity_id: media_player.overkapping_sonos
                  name: Overkapping
                - entity_id: media_player.toilet_sonos
                  name: Toilet
                - entity_id: media_player.kantoor_sonos
                  name: Kantoor
                - entity_id: media_player.speelkamer_sonos
                  name: Speelkamer
                - entity_id: media_player.garage_sonos
                  name: Garage
                - entity_id: media_player.badkamer_sonos
                  name: Badkamer
                - entity_id: media_player.slaapkamer_maxi_sonos
                  name: Slaapkamer Logan
                - entity_id: media_player.slaapkamer_mini_sonos
                  name: Slaapkamer Emma
          - type: custom:mushroom-title-card
            title: Kamers
          - type: custom:mini-media-player
            entity: media_player.keuken_sonos
            hide:
              power: true
            speaker_group: *sonos_group
          - type: custom:mini-media-player
            entity: media_player.overkapping_sonos
            hide:
              power: true
            speaker_group: *sonos_group
          - type: custom:mini-media-player
            entity: media_player.toilet_sonos
            hide:
              power: true
            speaker_group: *sonos_group
          - type: custom:mini-media-player
            entity: media_player.kantoor_sonos
            hide:
              power: true
            speaker_group: *sonos_group
          - type: custom:mini-media-player
            entity: media_player.speelkamer_sonos
            hide:
              power: true
            speaker_group: *sonos_group
          - type: custom:mini-media-player
            entity: media_player.garage_sonos
            hide:
              power: true
            speaker_group: *sonos_group
          - type: custom:mini-media-player
            entity: media_player.badkamer_sonos
            hide:
              power: true
            speaker_group: *sonos_group
          # `when_paused` staat alleen bij de twee kinderkamers aan. Een Sonos
          # die een radiostream gepauzeerd heeft, houdt die stream als bron en
          # blijft dus artwork en titel tonen - `media_stop` verandert daar bij
          # een stream niets aan, dat is een pauze op een ander knopje. Beneden
          # is dat prima informatie, maar op een slaapkamerkaart leest het als
          # "er staat muziek aan bij een slapend kind" (2026-08-09 zo gelezen).
          # Met de idle-view blijft alleen de naam staan tot er echt gespeeld
          # wordt.
          - type: custom:mini-media-player
            entity: media_player.slaapkamer_maxi_sonos
            name: Slaapkamer Logan
            hide:
              power: true
            idle_view:
              when_paused: true
            speaker_group: *sonos_group
          - type: custom:mini-media-player
            entity: media_player.slaapkamer_mini_sonos
            name: Slaapkamer Emma
            hide:
              power: true
            idle_view:
              when_paused: true
            speaker_group: *sonos_group
          - type: custom:mushroom-title-card
            title: TV
          - type: custom:mini-media-player
            entity: media_player.woonkamer_77_oled_3
            artwork: cover
            hide:
              power_state: false
          - type: custom:mini-media-player
            entity: media_player.woonkamer_appletv
            hide:
              power: true
          - type: custom:mini-media-player
            entity: media_player.speelkamer_tv
            hide:
              power: true
