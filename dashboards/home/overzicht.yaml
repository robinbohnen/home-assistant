kiosk_mode:
  user_settings:
    - users:
        - Robin Bohnen
        - Samantha Henkelman
      kiosk: true
      hide_header: true
      hide_sidebar: true
      hide_menu_button: true
      hide_overflow: true
title: Overzicht
path: overzicht
icon: mdi:view-dashboard-outline
panel: true
cards:
  - type: vertical-stack
    card_mod:
      style: |
        :host { height: 100% !important; }
        #root {
          /* Paneelstijl staat hier als custom properties. Die erven door shadow-DOM
             heen, zodat de kolombestanden geen YAML-anchor nodig hebben. */
          --ov-panel-bg: rgba(22,24,31,0.72);
          --ov-panel-border: 1px solid rgba(255,255,255,0.06);
          --ov-panel-radius: 20px;
          --ov-panel-padding: 13px 16px;
          gap: 14px !important;
          min-height: calc(100vh - 8px) !important;
          margin: 0 !important;
          padding: 20px 24px 24px 24px !important;
          background: #0b0d12 !important;
          box-sizing: border-box !important;
        }
        @media (max-width: 800px) {
          #root { padding: 14px 12px 16px 12px !important; gap: 14px !important; }
        }
    cards:
      # =================== HEADER ===================
      - !include overzicht/header.yaml

      # =================== BODY (3 columns) ===================
      - type: horizontal-stack
        card_mod:
          style: |
            #root {
              display: grid !important;
              grid-template-columns: 1fr 1.95fr 1fr !important;
              gap: 16px !important;
              align-items: start !important;
            }
            @media (max-width: 1000px) {
              #root { grid-template-columns: 1fr !important; }
            }
        cards:
          # ----------- LEFT COLUMN -----------
          - !include overzicht/kolom_links.yaml
          # ----------- CENTER COLUMN -----------
          - !include overzicht/kolom_midden.yaml
          # ----------- RIGHT COLUMN -----------
          - !include overzicht/kolom_rechts.yaml

      # =================== TIJDLIJN (12 uur) ===================
      - !include overzicht/tijdlijn.yaml

      # =================== POPUPS ===================
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-personen"
        name: Personen
        icon: mdi:account-group
        styles: &ov_popup |
          .bubble-pop-up {
            background: rgba(13, 15, 20, 0.98) !important;
            backdrop-filter: blur(18px) !important;
            border: 1px solid rgba(255, 255, 255, 0.06) !important;
            --ha-card-background: rgba(30, 33, 42, 0.72);
            --card-background-color: rgba(30, 33, 42, 0.72);
            --ha-card-border-color: rgba(255, 255, 255, 0.07);
            --ha-card-border-width: 1px;
            --ha-card-border-radius: 16px;
            --primary-text-color: #ffffff;
            --secondary-text-color: rgba(255, 255, 255, 0.55);
            --mush-rgb-disabled: 130, 130, 140;
          }
          .bubble-pop-up-background {
            backdrop-filter: blur(4px) !important;
            background: rgba(0, 0, 0, 0.5) !important;
          }
          .bubble-header {
            background: transparent !important;
          }
          .bubble-header .bubble-button-card-container,
          .bubble-button-card-container {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.06) !important;
            box-shadow: none !important;
          }
          .bubble-icon-container {
            background: rgba(255, 255, 255, 0.08) !important;
          }
          .bubble-icon {
            color: rgba(255, 255, 255, 0.9) !important;
          }
          .bubble-name,
          .bubble-header-name {
            color: #ffffff !important;
          }
          .bubble-close,
          .bubble-close-container {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.06) !important;
            box-shadow: none !important;
          }
          .bubble-close {
            color: rgba(255, 255, 255, 0.85) !important;
          }
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: person.robin_bohnen
                primary: Robin
                secondary: >-
                  {{ 'Thuis' if is_state('person.robin_bohnen','home') else 'Afwezig' }}{{ (' · ' ~ states('sensor.iphone_van_robin_battery_level') ~ '%') if has_value('sensor.iphone_van_robin_battery_level') else '' }}
                icon: mdi:account
                icon_color: "{{ 'green' if is_state('person.robin_bohnen','home') else 'grey' }}"
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: person.samantha_henkelman
                primary: Samantha
                secondary: >-
                  {{ 'Thuis' if is_state('person.samantha_henkelman','home') else 'Afwezig' }}{{ (' · ' ~ states('sensor.iphone_van_samantha_battery_level') ~ '%') if has_value('sensor.iphone_van_samantha_battery_level') else '' }}
                icon: mdi:account
                icon_color: "{{ 'green' if is_state('person.samantha_henkelman','home') else 'grey' }}"
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: person.emma_bohnen
                primary: Emma
                secondary: >-
                  {{ 'Thuis' if is_state('person.emma_bohnen','home') else 'Afwezig' }}{{ (' · ' ~ states('sensor.iphone_van_emma_battery_level') ~ '%') if has_value('sensor.iphone_van_emma_battery_level') else '' }}
                icon: mdi:account
                icon_color: "{{ 'green' if is_state('person.emma_bohnen','home') else 'grey' }}"
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: person.logan_veen
                primary: Logan
                secondary: >-
                  {{ 'Thuis' if is_state('person.logan_veen','home') else 'Afwezig' }}{{ (' · ' ~ states('sensor.iphone_battery_level') ~ '%') if has_value('sensor.iphone_battery_level') else '' }}
                icon: mdi:account
                icon_color: "{{ 'green' if is_state('person.logan_veen','home') else 'grey' }}"
                tap_action:
                  action: more-info
          - type: map
            default_zoom: 11
            hours_to_show: 12
            aspect_ratio: "16:9"
            entities:
              - person.robin_bohnen
              - person.samantha_henkelman
              - person.emma_bohnen
              - person.logan_veen
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-energie"
        name: Energie
        icon: mdi:flash
        styles: *ov_popup
        cards:
          - type: custom:apexcharts-card
            graph_span: 24h
            header:
              show: true
              title: Verbruik & productie (24u)
            series:
              - entity: sensor.electricity_meter_energieverbruik
                name: Verbruik
                type: area
                color: "#3b82f6"
                stroke_width: 2
                group_by:
                  duration: 5m
                  func: avg
              - entity: sensor.solar_power_generated_now
                name: Productie
                type: area
                color: "#4ade80"
                stroke_width: 2
                group_by:
                  duration: 5m
                  func: avg
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.solar_power_generated_today
                primary: Opgewekt vandaag
                secondary: "{{ (states('sensor.solar_power_generated_today') ~ ' kWh') if has_value('sensor.solar_power_generated_today') else '—' }}"
                icon: mdi:solar-power-variant
                icon_color: amber
              - type: custom:mushroom-template-card
                entity: sensor.forecast_solar_production_today
                primary: Verwacht
                secondary: "{{ (states('sensor.forecast_solar_production_today') ~ ' kWh') if has_value('sensor.forecast_solar_production_today') else '—' }}"
                icon: mdi:weather-sunny
                icon_color: amber
              - type: custom:mushroom-template-card
                entity: sensor.zonneplan_electricity_consumption_today
                primary: Verbruik vandaag
                secondary: "{{ (states('sensor.zonneplan_electricity_consumption_today') ~ ' kWh') if has_value('sensor.zonneplan_electricity_consumption_today') else '—' }}"
                icon: mdi:flash
                icon_color: blue
              - type: custom:mushroom-template-card
                entity: sensor.zonneplan_gas_consumption_today
                primary: Gas vandaag
                secondary: "{{ (states('sensor.zonneplan_gas_consumption_today') ~ ' m³') if has_value('sensor.zonneplan_gas_consumption_today') else '—' }}"
                icon: mdi:fire
                icon_color: orange
              - type: custom:mushroom-template-card
                entity: sensor.total_costs_today_calculated
                primary: Kosten vandaag
                secondary: "{{ ('€ ' ~ states('sensor.total_costs_today_calculated')) if has_value('sensor.total_costs_today_calculated') else '—' }}"
                icon: mdi:currency-eur
                icon_color: "{{ 'green' if states('sensor.total_costs_today_calculated')|float(0) < 0 else 'grey' }}"
              - type: custom:mushroom-template-card
                entity: sensor.zonneplan_current_electricity_tariff
                primary: Huidig tarief
                secondary: "{{ ('€ ' ~ states('sensor.zonneplan_current_electricity_tariff')) if has_value('sensor.zonneplan_current_electricity_tariff') else '—' }}"
                icon: mdi:cash-clock
                icon_color: "{{ 'green' if is_state('sensor.zonneplan_current_tariff_group','low') else 'grey' }}"
              - type: custom:mushroom-template-card
                entity: sensor.lilygo_rs485_marstek_battery_state_of_charge
                primary: Thuisbatterij
                secondary: >-
                  {{ (states('sensor.lilygo_rs485_marstek_battery_state_of_charge') ~ '%')
                     if has_value('sensor.lilygo_rs485_marstek_battery_state_of_charge') else '—' }} ·
                  {{ (states('sensor.lilygo_rs485_marstek_battery_power') ~ ' W')
                     if has_value('sensor.lilygo_rs485_marstek_battery_power') else '—' }}
                icon: mdi:home-battery
                icon_color: green
              - type: custom:mushroom-template-card
                entity: sensor.solar_power_generated_now
                primary: Productie nu
                secondary: "{{ (states('sensor.solar_power_generated_now') ~ ' W') if has_value('sensor.solar_power_generated_now') else '—' }}"
                icon: mdi:solar-power
                icon_color: amber
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-auto"
        name: Auto
        icon: mdi:car-electric
        styles: *ov_popup
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.hrh85f_batterij
                primary: Batterij
                secondary: "{{ (states('sensor.hrh85f_batterij') ~ '%') if has_value('sensor.hrh85f_batterij') else '—' }}"
                icon: mdi:battery-charging
                icon_color: "{{ 'green' if states('sensor.hrh85f_batterij')|float(0) > 20 else 'amber' }}"
              - type: custom:mushroom-template-card
                entity: sensor.hrh85f_battery_autonomy
                primary: Bereik
                secondary: "{{ (states('sensor.hrh85f_battery_autonomy') ~ ' km') if has_value('sensor.hrh85f_battery_autonomy') else '—' }}"
                icon: mdi:map-marker-distance
                icon_color: blue
              - type: custom:mushroom-template-card
                entity: sensor.hrh85f_kilometerstand
                primary: Kilometerstand
                secondary: "{{ (states('sensor.hrh85f_kilometerstand') ~ ' km') if has_value('sensor.hrh85f_kilometerstand') else '—' }}"
                icon: mdi:counter
                icon_color: grey
              - type: custom:mushroom-template-card
                entity: sensor.hrh85f_charge_state
                primary: Laadstatus
                secondary: >-
                  {% set m = {'charge_in_progress': 'aan het laden', 'not_in_charge': 'niet aan lader',
                              'waiting_for_a_planned_charge': 'gepland', 'waiting_for_current_charge': 'wacht',
                              'charge_error': 'laadfout', 'energy_flap_opened': 'klep open', 'charge_ended': 'vol'} %}
                  {{ m.get(states('sensor.hrh85f_charge_state'), states('sensor.hrh85f_charge_state'))
                     if has_value('sensor.hrh85f_charge_state') else '—' }}
                icon: mdi:ev-station
                icon_color: "{{ 'green' if is_state('sensor.hrh85f_charge_state','charge_in_progress') else 'grey' }}"
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Start opladen
                icon: mdi:ev-station
                icon_color: green
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.hrh85f_start_opladen
              - type: custom:mushroom-template-card
                entity: binary_sensor.hrh85f_hvac
                primary: >-
                  {% set t = state_attr('weather.knmi_thuis','temperature') | float(18) %}
                  {{ 'Voorverwarmen' if t < 15 else ('Voorkoelen' if t > 22 else 'Klimaat starten') }}
                secondary: >-
                  {% if is_state('binary_sensor.hrh85f_hvac','on') %}actief
                  {%- else %}{% set t = state_attr('weather.knmi_thuis','temperature') %}
                  {{- 'buiten ' ~ (t | round(0)) ~ '°' if t is not none else 'tik om te starten' }}{% endif %}
                icon: >-
                  {% set t = state_attr('weather.knmi_thuis','temperature') | float(18) %}
                  {{ 'mdi:fire' if t < 15 else ('mdi:snowflake' if t > 22 else 'mdi:air-conditioner') }}
                icon_color: >-
                  {% if is_state('binary_sensor.hrh85f_hvac','on') %}green
                  {%- else %}{% set t = state_attr('weather.knmi_thuis','temperature') | float(18) %}{{ 'orange' if t < 15 else 'blue' }}{% endif %}
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.hrh85f_start_air_conditioner
          - type: map
            default_zoom: 10
            aspect_ratio: "16:9"
            entities:
              - device_tracker.hrh85f_locatie
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-vandaag"
        name: Vandaag
        icon: mdi:calendar-check
        styles: *ov_popup
        cards:
          - type: custom:mushroom-title-card
            title: Afval
            subtitle: Ophaalmomenten
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.afvalinfo_home_trash_type_today
                primary: Vandaag
                secondary: "{{ (states('sensor.afvalinfo_home_trash_type_today')) if has_value('sensor.afvalinfo_home_trash_type_today') else '—' }}"
                icon: mdi:trash-can
                icon_color: teal
              - type: custom:mushroom-template-card
                entity: sensor.afvalinfo_home_trash_type_tomorrow
                primary: Morgen
                secondary: "{{ (states('sensor.afvalinfo_home_trash_type_tomorrow')) if has_value('sensor.afvalinfo_home_trash_type_tomorrow') else '—' }}"
                icon: mdi:trash-can-outline
                icon_color: teal
              - type: custom:mushroom-template-card
                entity: sensor.afvalinfo_home_gft
                primary: GFT
                secondary: "{{ (states('sensor.afvalinfo_home_gft')) if has_value('sensor.afvalinfo_home_gft') else '—' }}"
                icon: mdi:leaf
                icon_color: green
              - type: custom:mushroom-template-card
                entity: sensor.afvalinfo_home_papier
                primary: Papier
                secondary: "{{ (states('sensor.afvalinfo_home_papier')) if has_value('sensor.afvalinfo_home_papier') else '—' }}"
                icon: mdi:newspaper
                icon_color: blue
              - type: custom:mushroom-template-card
                entity: sensor.afvalinfo_home_pbd
                primary: PBD
                secondary: "{{ (states('sensor.afvalinfo_home_pbd')) if has_value('sensor.afvalinfo_home_pbd') else '—' }}"
                icon: mdi:recycle
                icon_color: orange
              - type: custom:mushroom-template-card
                entity: sensor.afvalinfo_home_restafval
                primary: Restafval
                secondary: "{{ (states('sensor.afvalinfo_home_restafval')) if has_value('sensor.afvalinfo_home_restafval') else '—' }}"
                icon: mdi:delete
                icon_color: grey
          - type: custom:mushroom-title-card
            title: Agenda
          - type: calendar
            initial_view: listWeek
            entities:
              - calendar.r_bohnen_vrbn_nl_agenda
              - calendar.robin_bohnen_nl_agenda
              - calendar.robin_en_sam
              - calendar.brandweer
              - calendar.maxi
              - calendar.mini
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-klimaat"
        name: Klimaat
        icon: mdi:thermometer
        styles: *ov_popup
        cards:
          - type: custom:mushroom-climate-card
            entity: climate.airco_woonkamer
            name: Airco woonkamer
            hvac_modes:
              - "off"
              - cool
              - heat
              - dry
              - fan_only
            show_temperature_control: true
            collapsible_controls: true
          - type: custom:mushroom-climate-card
            entity: climate.airco_zolder
            name: Airco zolder
            hvac_modes:
              - "off"
              - cool
              - heat
              - dry
              - fan_only
            show_temperature_control: true
            collapsible_controls: true
          - type: custom:mushroom-climate-card
            entity: climate.intex_purespa
            name: Intex PureSpa
            show_temperature_control: true
            collapsible_controls: true
          - type: custom:mushroom-cover-card
            entity: cover.achtertuin_zonnescherm
            name: Zonnescherm achtertuin
            show_buttons_control: true
            show_position_control: true
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#ov-brandweer"
        name: Brandweer
        icon: mdi:fire-truck
        styles: *ov_popup
        cards:
          - type: custom:mushroom-template-card
            entity: input_text.brandweer_laatste_melding
            primary: Laatste melding
            secondary: "{{ (states('input_text.brandweer_laatste_melding')) if has_value('input_text.brandweer_laatste_melding') else '—' }}"
            icon: mdi:message-alert
            icon_color: red
            multiline_secondary: true
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: input_select.brandweer_dienstdoende_ploeg
                primary: Dienstdoend
                secondary: "{{ (states('input_select.brandweer_dienstdoende_ploeg')) if has_value('input_select.brandweer_dienstdoende_ploeg') else '—' }}"
                icon: mdi:account-group
                icon_color: blue
              - type: custom:mushroom-template-card
                entity: input_select.brandweer_mijn_huidige_ploeg
                primary: Mijn ploeg
                secondary: "{{ (states('input_select.brandweer_mijn_huidige_ploeg')) if has_value('input_select.brandweer_mijn_huidige_ploeg') else '—' }}"
                icon: mdi:account
                icon_color: blue
              - type: custom:mushroom-template-card
                entity: sensor.robin_reistijd_naar_brandweer_uden
                primary: Reistijd kazerne
                secondary: "{{ (states('sensor.robin_reistijd_naar_brandweer_uden') ~ ' min') if has_value('sensor.robin_reistijd_naar_brandweer_uden') else '—' }}"
                icon: mdi:fire-station
                icon_color: orange
          - type: custom:mushroom-title-card
            title: Bezetting per ploeg
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.bezetting_ploeg_a
                primary: >-
                  {% if states('input_select.brandweer_dienstdoende_ploeg')[0] | lower == 'a' %}A-ploeg · dienst{% else %}A-ploeg{% endif %}
                secondary: >-
                  {{ (states('sensor.bezetting_ploeg_a') ~ ' beschikbaar')
                     if has_value('sensor.bezetting_ploeg_a') else '—' }}
                icon: >-
                  {% if states('input_select.brandweer_dienstdoende_ploeg')[0] | lower == 'a' %}mdi:account-multiple-check{% else %}mdi:account-multiple-outline{% endif %}
                icon_color: >-
                  {% set n = states('sensor.bezetting_ploeg_a') | int(0) %}
                  {{ 'red' if n < 4 else ('orange' if n < 6 else 'green') }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.bezetting_ploeg_b
                primary: >-
                  {% if states('input_select.brandweer_dienstdoende_ploeg')[0] | lower == 'b' %}B-ploeg · dienst{% else %}B-ploeg{% endif %}
                secondary: >-
                  {{ (states('sensor.bezetting_ploeg_b') ~ ' beschikbaar')
                     if has_value('sensor.bezetting_ploeg_b') else '—' }}
                icon: >-
                  {% if states('input_select.brandweer_dienstdoende_ploeg')[0] | lower == 'b' %}mdi:account-multiple-check{% else %}mdi:account-multiple-outline{% endif %}
                icon_color: >-
                  {% set n = states('sensor.bezetting_ploeg_b') | int(0) %}
                  {{ 'red' if n < 4 else ('orange' if n < 6 else 'green') }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.bezetting_ploeg_c
                primary: >-
                  {% if states('input_select.brandweer_dienstdoende_ploeg')[0] | lower == 'c' %}C-ploeg · dienst{% else %}C-ploeg{% endif %}
                secondary: >-
                  {{ (states('sensor.bezetting_ploeg_c') ~ ' beschikbaar')
                     if has_value('sensor.bezetting_ploeg_c') else '—' }}
                icon: >-
                  {% if states('input_select.brandweer_dienstdoende_ploeg')[0] | lower == 'c' %}mdi:account-multiple-check{% else %}mdi:account-multiple-outline{% endif %}
                icon_color: >-
                  {% set n = states('sensor.bezetting_ploeg_c') | int(0) %}
                  {{ 'red' if n < 4 else ('orange' if n < 6 else 'green') }}
                tap_action:
                  action: more-info
          - type: custom:mushroom-title-card
            title: Uitrukken
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: counter.brandweer_totaal_aantal_uitrukken
                primary: Totaal
                secondary: "{{ (states('counter.brandweer_totaal_aantal_uitrukken')) if has_value('counter.brandweer_totaal_aantal_uitrukken') else '—' }}"
                icon: mdi:sigma
                icon_color: grey
              - type: custom:mushroom-template-card
                entity: counter.brandweer_uden_a_ploeg_uitrukken
                primary: A
                secondary: "{{ (states('counter.brandweer_uden_a_ploeg_uitrukken')) if has_value('counter.brandweer_uden_a_ploeg_uitrukken') else '—' }}"
                icon: mdi:alpha-a-circle
                icon_color: blue
              - type: custom:mushroom-template-card
                entity: counter.brandweer_uden_b_ploeg_uitrukken
                primary: B
                secondary: "{{ (states('counter.brandweer_uden_b_ploeg_uitrukken')) if has_value('counter.brandweer_uden_b_ploeg_uitrukken') else '—' }}"
                icon: mdi:alpha-b-circle
                icon_color: blue
              - type: custom:mushroom-template-card
                entity: counter.brandweer_uden_c_ploeg_uitrukken
                primary: C
                secondary: "{{ (states('counter.brandweer_uden_c_ploeg_uitrukken')) if has_value('counter.brandweer_uden_c_ploeg_uitrukken') else '—' }}"
                icon: mdi:alpha-c-circle
                icon_color: blue
          - type: logbook
            hours_to_show: 336
            entities:
              - input_text.brandweer_laatste_melding
              - binary_sensor.brandweer_uitgerukt_op_laatste_melding

      # --------- Ruimte-popups (lichtbediening) ---------
      - type: custom:bubble-card
        card_type: pop-up
