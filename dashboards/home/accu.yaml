# Thuisaccu: wat hij doet, of hij gezond is, en of het goede momenten waren.
#
# VAN PLAN NAAR VERANTWOORDING (20 september 2026)
# Deze pagina liet tot vandaag zien wat de kwartierregie van plan was: welke
# blokken laden, welke ontladen, en waarom hij nu niets deed. Die regie stuurde
# de Marstek. Die accu gaat eruit; de Deye wordt gestuurd door de MarkeDroid-
# appliance van ModuSun, niet door Home Assistant.
#
# Daarom staat er geen enkele knop meer op. Een schuifje dat naar een register
# schrijft waar MarkeDroid ook aan draait, geeft een accu met twee bazen - en
# die ruzie zie je pas terug in een rekening. Alles wat je hier ziet is
# gelezen. De vraag die de pagina beantwoordt is niet "wat gaat hij doen" maar
# "heeft hij het goed gedaan", en dat lees je af aan de grafiek onderaan: de
# lading van vandaag over de kwartierprijzen heen.
#
# ALLES KOMT VAN MARKEDROID, NIETS MEER VAN SOLARMAN (22 september 2026).
# Lading, vermogen, status en inhoud uit `sensor.accu_*` (Battery.yaml), de
# dagtellers uit `sensor.accu_geladen_vandaag` / `_ontladen_vandaag`, en de
# rest uit `sensor.markedroid_*`. Tot die dag las deze pagina een dozijn
# `sensor.deye_*`-sensoren via de Solarman-logger; die botste met MarkeDroid
# op dezelfde lijn (zie de kop van Battery.yaml). Wat MarkeDroid niet stuurt -
# meldingen en storingscodes van de omvormer, zijn eigen temperatuur, het
# omzettingsverlies - staat hier daarom niet meer; dat is de ModuSun-app.
title: Accu
path: accu
icon: mdi:home-battery

cards:
  # ---------------------------------------------------------------- de accu
  - type: vertical-stack
    cards:
      - type: custom:button-card
        template: ov_title
        variables:
          title: DE ACCU

      # Lading, richting en inhoud in één regel. Zelfde opzet als de
      # accukaart die hier stond, maar zonder de ondergrens-badge (die was een
      # instelling van de regie) - er staat nu wat er in zit.
      - type: custom:button-card
        entity: sensor.accu_lading
        triggers_update:
          - sensor.accu_vermogen
          - sensor.accu_status
          - sensor.accu_inhoud
        show_icon: false
        show_name: false
        show_state: false
        tap_action:
          action: more-info
        styles:
          grid:
            - grid-template-areas: '"ic t badge" "ic sub badge"'
            - grid-template-columns: 34px 1fr auto
            - align-items: center
            - column-gap: 12px
          card:
            - background: none
            - border: none
            - box-shadow: none
            - padding: 11px 2px
          custom_fields:
            ic:
              - grid-area: ic
            t:
              - grid-area: t
              - justify-self: start
              - font-size: 14.5px
              - font-weight: "600"
              - color: var(--primary-text-color)
            sub:
              - grid-area: sub
              - justify-self: start
              - font-size: 12.5px
              - color: var(--ov-ink-58)
              - padding-top: 2px
            badge:
              - grid-area: badge
              - justify-self: end
        custom_fields:
          ic: |
            [[[
              var st = states['sensor.accu_status'];
              var m = {laden:   ['mdi:battery-arrow-up','var(--ov-ok)'],
                       ontladen:['mdi:battery-arrow-down','var(--ov-warn)'],
                       rust:    ['mdi:battery-clock','var(--ov-ink-35)']};
              var v = m[st ? st.state : ''] || ['mdi:help-circle-outline','var(--ov-ink-25)'];
              return `<ha-icon icon="${v[0]}" style="--mdc-icon-size:22px;color:${v[1]}"></ha-icon>`;
            ]]]
          t: |
            [[[
              if(!entity || ['unavailable','unknown'].indexOf(entity.state) !== -1)
                return 'Accu niet bereikbaar';
              return 'Lading ' + Math.round(Number(entity.state)) + '%';
            ]]]
          sub: |
            [[[
              // Eén bron voor de richting: sensor.accu_status. Deze kaart had
              // vroeger een eigen dode zone van 20 W, de nest hub 15, de klok
              // ook 20 - drie waarheden over dezelfde accu.
              var st = states['sensor.accu_status'];
              var pwE = states['sensor.accu_vermogen'];
              if(!st || !pwE) return '';
              var pw = Number(pwE.state);
              if(isNaN(pw)) return '';
              // Boven de kilowatt leest een kaal wattgetal slecht; dit is een
              // accu die duizenden watts kan.
              var fmt = Math.abs(pw) >= 1000
                ? (Math.abs(pw)/1000).toFixed(1).replace('.',',') + ' kW'
                : Math.round(Math.abs(pw)) + ' W';
              if(st.state === 'laden')    return 'laadt met ' + fmt;
              if(st.state === 'ontladen') return 'levert ' + fmt + ' aan het huis';
              return 'staat stil';
            ]]]
          badge: |
            [[[
              // Kilowatturen en niet procenten: bij het afwegen of je de droger
              // nog aanzet zegt "13 kWh" iets en "44%" niet, zeker niet bij een
              // accu van deze omvang.
              var i = states['sensor.accu_inhoud'], c = states['sensor.accu_capaciteit'];
              if(!i || isNaN(Number(i.state))) return '';
              var t = Number(i.state).toFixed(1).replace('.',',');
              if(c && !isNaN(Number(c.state)))
                t += ' / ' + Number(c.state).toFixed(1).replace('.',',');
              return `<span style="font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;color:var(--ov-ink-60);background:var(--ov-ink-8)">${t} kWh</span>`;
            ]]]

  # ------------------------------------------------------------- noodstroom
  # Alle groepen hangen aan de backup-uitgang van de Deye, behalve de
  # laadpaal. Hoe er wordt vastgesteld dat het huis op de accu draait, en
  # waarom dat drie lagen nodig heeft, staat in de NOODSTROOM-kop van
  # packages/9 - Other/Battery.yaml. Deze kaart rekent zelf niets uit: de duur,
  # de bruikbare kilowatturen en de last komen uit `sensor.noodstroom_resterend`,
  # zodat de pil op het Overzicht precies hetzelfde getal noemt.
  - type: vertical-stack
    cards:
      - type: custom:button-card
        template: ov_title
        variables:
          title: NOODSTROOM

      # Wat er NU aan de hand is. Vier standen, en de twee storingsstanden
      # hebben een andere oplossing: bij een stroomstoring wacht je op de
      # netbeheerder, bij een omvormer die zichzelf losgekoppeld heeft ga je
      # naar de meterkast.
      - type: custom:button-card
        template: ov_listrow
        entity: binary_sensor.huis_op_accu
        triggers_update:
          - binary_sensor.accu_geinstalleerd
          - sensor.time
        custom_fields:
          ic: |
            [[[
              var inst = states['binary_sensor.accu_geinstalleerd'];
              var aan = entity && entity.state === 'on';
              var storing = aan && entity.attributes.oorzaak === 'stroomstoring';
              var v = !inst || inst.state !== 'on' ? ['mdi:transmission-tower-off','var(--ov-ink-35)']
                    : (!entity || entity.state === 'unavailable') ? ['mdi:help-circle-outline','var(--ov-ink-35)']
                    : storing ? ['mdi:flash-off','var(--ov-bad)']
                    : aan ? ['mdi:home-battery','var(--ov-warn)']
                    : ['mdi:transmission-tower','var(--ov-ok)'];
              return `<ha-icon icon="${v[0]}" style="--mdc-icon-size:22px;color:${v[1]}"></ha-icon>`;
            ]]]
          t: |
            [[[
              var inst = states['binary_sensor.accu_geinstalleerd'];
              if(!inst || inst.state !== 'on') return 'Nog niet actief';
              if(!entity || entity.state === 'unavailable') return 'Omvormer niet bereikbaar';
              if(entity.state !== 'on') return 'Het net is er';
              // Tijdstip plus hoe lang: om tien uur 's avonds wil je allebei
              // weten - wanneer het begon en of je al moet gaan rekenen.
              var d = new Date(entity.last_changed);
              var min = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));
              var klok = ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
              var duur = min < 60 ? min + ' min' : Math.floor(min/60) + ' u ' + (min % 60) + ' min';
              var wat = entity.attributes.oorzaak === 'stroomstoring'
                ? 'Stroomstoring' : 'Omvormer los van het net';
              return wat + ' · sinds ' + klok + ' (' + duur + ')';
            ]]]
          s: |
            [[[
              var inst = states['binary_sensor.accu_geinstalleerd'];
              if(!inst || inst.state !== 'on')
                return 'de omvormer heeft nog nooit netspanning gezien; dit gaat vanzelf aan na de installatie';
              if(!entity || entity.state === 'unavailable')
                return 'HA weet niet of het net er is';
              if(entity.state !== 'on')
                return 'valt het uit, dan neemt de accu het hele huis over, behalve de laadpaal';
              if(entity.attributes.oorzaak === 'stroomstoring')
                return 'het huis draait op de accu · de laadpaal ligt stil';
              // De meter praat nog, dus er ís net. De Deye heeft zichzelf
              // losgemaakt - daar is iets aan te doen, en dat moet er staan.
              return 'de meter heeft wél stroom · kijk naar de groep van de omvormer of zijn netbeveiliging · het huis draait zolang op de accu';
            ]]]

      # Hoe lang nog. Buiten een storing is het "als het nu uitvalt", tijdens
      # een storing "nog te gaan" - zelfde getal, andere vraag, en de sensor
      # rekent in die twee standen ook met een andere last (zie Battery.yaml).
      - type: custom:button-card
        template: ov_listrow
        entity: sensor.noodstroom_resterend
        triggers_update:
          - binary_sensor.huis_op_accu
        custom_fields:
          ic: |
            [[[
              var op = states['binary_sensor.huis_op_accu'];
              var kleur = (op && op.state === 'on') ? 'var(--ov-warn)' : 'var(--ov-info-strong)';
              return `<ha-icon icon="mdi:timer-sand" style="--mdc-icon-size:22px;color:${kleur}"></ha-icon>`;
            ]]]
          t: |
            [[[
              var op = states['binary_sensor.huis_op_accu'];
              var tijdens = op && op.state === 'on';
              if(!entity || entity.state === 'unavailable')
                return tijdens ? 'Nog te gaan' : 'Als het nu uitvalt';
              var a = entity.attributes || {};
              var h = Number(entity.state);
              var duur;
              if(a.stand === 'laadt_bij') duur = 'de zon vult hem bij';
              else if(a.stand === 'geen_last' || isNaN(h)) duur = 'nauwelijks last';
              else {
                // Eerst naar hele minuten, dan splitsen: `h % 1` afronden gaf
                // bij 5,995 uur "5 uur 60 min".
                var m = Math.round(h * 60);
                duur = m >= 60 ? Math.floor(m / 60) + ' uur' + (m % 60 ? ' ' + (m % 60) + ' min' : '')
                               : m + ' minuten';
              }
              return (tijdens ? 'Nog te gaan: ' : 'Als het nu uitvalt: ') + duur;
            ]]]
          s: |
            [[[
              if(!entity || entity.state === 'unavailable') return 'pas te berekenen na de installatie';
              var a = entity.attributes || {};
              var kwh = Number(a.bruikbaar_kwh);
              var w = Number(a.last_w);
              var t = (isNaN(kwh) ? '—' : kwh.toFixed(1).replace('.',',')) + ' kWh bruikbaar';
              // `last_w` is wat de accu AFGEEFT, dus negatief betekent dat hij
              // tijdens de storing oplaadt. Dat stond er eerst als "gaf 800 W"
              // - precies de verkeerde kant op.
              if(!isNaN(w) && Math.abs(w) >= 50)
                t += a.basis !== 'accu_kwartier'
                  ? ' · huis trok het laatste uur gemiddeld ' + Math.round(w) + ' W'
                  : (w > 0 ? ' · accu gaf het laatste kwartier ' + Math.round(w) + ' W'
                           : ' · zon laadt hem op met ' + Math.round(-w) + ' W');
              // HET HERSTARTPUNT HOORT ERBIJ ZODRA HET ERTOE DOET. Is de accu
              // eenmaal op zijn afslagpunt, dan gaat de uitgang pas weer aan
              // als hij terug op dit niveau is - bij een 28,8 kWh-accu ruim
              // 11 kWh zon. Buiten een storing is dat ruis; tijdens een storing
              // is het het verschil tussen "even donker" en "tot morgenmiddag".
              var op = states['binary_sensor.huis_op_accu'];
              if(op && op.state === 'on' && a.stand === 'loopt_leeg' && a.herstart_procent !== undefined)
                t += ' · daarna uit tot hij weer op ' + a.herstart_procent + '% is';
              return t;
            ]]]

      - type: custom:button-card
        template: ov_listrow
        entity: binary_sensor.accu_geinstalleerd
        variables:
          mdi: mdi:ev-station
          kleur: "var(--ov-ink-45)"
          title: De laadpaal hangt er niet aan
        custom_fields:
          # Staat er zodat niemand bij een storing gaat zoeken waarom de auto
          # niet laadt. De reden erbij, want "waarom niet?" is de volgende vraag.
          s: "auto laden uit de accu is twee keer omzettingsverlies, dus die blijft aan de netkant"

  # ------------------------------------------------------------- vandaag
  - type: vertical-stack
    cards:
      - type: custom:button-card
        template: ov_title
        variables:
          title: VANDAAG
      # Tellers die HA zelf bijhoudt uit MarkeDroids berichten (Wh sinds het
      # vorige bericht, opgeteld), elke nacht op nul. Wat MarkeDroid publiceert
      # terwijl HA plat ligt telt niet mee - een gat, geen verkeerd getal.
      - type: custom:button-card
        template: ov_listrow
        entity: sensor.accu_geladen_vandaag
        variables:
          mdi: mdi:battery-arrow-up
          kleur: "var(--ov-ok)"
          title: Geladen
        custom_fields:
          s: |
            [[[
              var v = entity && !isNaN(Number(entity.state)) ? Number(entity.state) / 1000 : null;
              return v === null ? '—' : v.toFixed(1).replace('.',',') + ' kWh erin';
            ]]]
      # HET RENDEMENT IS EEN DAGCIJFER EN GEEN MOMENTOPNAME. Halverwege de
      # ochtend staat er 4 kWh in en 0,2 kWh uit, en dan is "5%" onzin. Daarom
      # pas een verhouding zodra er aan beide kanten genoeg staat. Het is geen
      # zuiver rendement: de lading aan het begin en eind van de dag verschilt.
      - type: custom:button-card
        template: ov_listrow
        entity: sensor.accu_ontladen_vandaag
        triggers_update:
          - sensor.accu_geladen_vandaag
        variables:
          mdi: mdi:battery-arrow-down
          kleur: "var(--ov-warn)"
          title: Ontladen
        custom_fields:
          s: |
            [[[
              var num = function(id){ var s = states[id];
                return (s && !isNaN(Number(s.state))) ? Number(s.state) / 1000 : null; };
              var uit = num('sensor.accu_ontladen_vandaag'), inn = num('sensor.accu_geladen_vandaag');
              if(uit === null) return '—';
              var t = uit.toFixed(1).replace('.',',') + ' kWh eruit';
              if(inn !== null && inn >= 2 && uit >= 2)
                t += ' · ' + Math.round(uit / inn * 100) + '% van wat erin ging';
              return t;
            ]]]

  # ------------------------------------------------------- lading vs. prijs
  # DE KERNVRAAG VAN DEZE PAGINA
  # MarkeDroid bepaalt wanneer er geladen en ontladen wordt, en er is geen
  # kaart die vertelt wat het opleverde. Dit is de goedkoopste benadering: de
  # lading van vandaag over de kwartierprijzen heen. Loopt de lijn omhoog onder
  # de lage balken en omlaag onder de hoge, dan doet de appliance zijn werk.
  #
  # VENSTER = DE DAG en niet "de laatste 24 uur": de prijzen komen uit
  # `raw_today`, dat precies 00:00-24:00 dekt. Met een schuivend venster van 24
  # uur zou de linkerhelft van de balken van gisteren moeten komen, en die
  # bewaart de integratie niet - dan hangt de ladingslijn boven een lege helft.
  - type: custom:apexcharts-card
    graph_span: 24h
    span:
      start: day
    now:
      show: true
      label: nu
      color: var(--primary-text-color)
    header:
      show: true
      title: Lading van vandaag over de kwartierprijzen
    yaxis:
      - id: kwh_prijs
        min: ~0
        max: ~0.4
        decimals: 2
        apex_config:
          title:
            text: Prijs €/kWh
      - id: procent
        opposite: true
        min: 0
        max: 100
        decimals: 0
        apex_config:
          title:
            text: Lading %
    apex_config:
      tooltip:
        x:
          show: false
      plotOptions:
        bar:
          # 96 balken op een dag; met de standaardbreedte streept dat. Zelfde
          # keuze als de stroomprijskaart op het Overzicht.
          columnWidth: 96%
    series:
      - entity: sensor.slimhuys_zonneplan_prijzen_vandaag_kwartier
        name: Prijs
        stroke_width: 0
        float_precision: 3
        type: column
        color: "#3f5a70"
        show:
          legend_value: false
        yaxis_id: kwh_prijs
        data_generator: |
          const blokken = (ent, key) => (ent && ent.attributes && ent.attributes[key]) || [];
          const st = (typeof hass !== 'undefined' && hass.states) ? hass.states : {};
          const vandaag = blokken(entity, 'raw_today').length
            ? blokken(entity, 'raw_today')
            : blokken(st['sensor.slimhuys_zonneplan_prijzen_vandaag'], 'raw_today');
          return vandaag
            .map((e) => {
              const s = new Date(e.start).getTime();
              const t = new Date(e.end).getTime();
              const p = Number(e.value);
              // ApexCharts centreert een kolom op zijn timestamp; plotten op
              // het midden van [start, end) laat de balk zijn eigen blok
              // dekken in plaats van een half blok ernaast.
              return [isFinite(t) ? (s + t) / 2 : s, isNaN(p) ? null : p];
            })
            .filter((d) => isFinite(d[0]))
            .sort((a, b) => a[0] - b[0]);
      - entity: sensor.accu_lading
        name: Lading
        type: line
        curve: smooth
        stroke_width: 2
        color: "var(--ov-ok)"
        float_precision: 0
        yaxis_id: procent
        # Vijf minuten en niet ruw: de laadtoestand komt per procent binnen en
        # springt dus toch al trapsgewijs. Ruw uitlezen kost alleen punten.
        group_by:
          duration: 5min
          func: avg
        show:
          legend_value: true

  # -------------------------------------------------------------- gezondheid
  # Wat MarkeDroid over de accu meldt. De meldingen, storingscodes en
  # temperatuur van de omvormer zelf stonden hier tot 22 september uit
  # Solarman; MarkeDroid stuurt ze niet door (zie de kop van dit bestand).
  - type: vertical-stack
    cards:
      - type: custom:button-card
        template: ov_title
        variables:
          title: STAAT VAN DE ACCU
      - type: custom:button-card
        template: ov_listrow
        entity: sensor.markedroid_accu_temperatuur
        variables:
          mdi: mdi:thermometer
          title: Temperatuur
        custom_fields:
          s: |
            [[[
              if(!entity || isNaN(Number(entity.state))) return '—';
              var t = Number(entity.state);
              var txt = t.toFixed(1).replace('.',',') + ' °C';
              // LFP laadt niet onder 0 °C en houdt niet van boven 45 °C; binnen
              // 5-40 °C is er niets om over na te denken.
              if(t < 5 || t > 40) return '<span style="color:var(--ov-warn)">' + txt + ' · buiten het comfortgebied van de cellen</span>';
              return txt;
            ]]]
      # WAT MARKEDROID MET DE ACCU DOET
      # Eén regel: de stand die hij gekozen heeft, en alleen als het iets zegt
      # de exportbegrenzer erachter. Zonder regie-veld in de berichten (nog
      # niet uitgerold, zie Battery.yaml) staat er gewoon dat hij praat.
      - type: custom:button-card
        template: ov_listrow
        entity: binary_sensor.markedroid_verbinding
        triggers_update:
          - sensor.markedroid_regie
          - sensor.markedroid_exportbegrenzer
        variables:
          mdi: mdi:robot-outline
          title: MarkeDroid
        custom_fields:
          s: |
            [[[
              if(!entity) return '—';
              if(entity.state !== 'on') return '<span style="color:var(--ov-bad)">geen berichten meer van MarkeDroid</span>';
              var r = states['sensor.markedroid_regie'];
              var e = states['sensor.markedroid_exportbegrenzer'];
              var delen = [];
              delen.push((r && r.state !== 'niet_geleverd' && r.attributes.omschrijving)
                ? r.attributes.omschrijving : 'verbonden');
              if(r && r.attributes.flex_w !== null && r.attributes.flex_w !== undefined)
                delen.push('flex ' + r.attributes.flex_w + ' W');
              if(e && e.state === 'actief') delen.push('teruglevering dicht');
              if(e && e.state === 'storing') delen.push('<span style="color:var(--ov-bad)">exportbegrenzer in storing</span>');
              return delen.join(' · ');
            ]]]
