# Thuisaccu: wat hij doet, of hij gezond is, en of het goede momenten waren.
#
# VAN PLAN NAAR VERANTWOORDING (20 september 2026)
# Deze pagina liet tot vandaag zien wat de kwartierregie van plan was: welke
# blokken laden, welke ontladen, en waarom hij nu niets deed. Die regie stuurde
# de Marstek. Die accu gaat eruit; de Deye wordt gestuurd door de MarkeDroid-
# appliance van ModuSun, niet door Home Assistant.
#
# Daarom staat er geen enkele knop meer op. Een schuifje dat naar een register
# schrijft waar MarkeDroid ook aan draait, geeft een accu met twee bazen - en
# die ruzie zie je pas terug in een rekening. Alles wat je hier ziet is
# gelezen. De vraag die de pagina beantwoordt is niet "wat gaat hij doen" maar
# "heeft hij het goed gedaan", en dat lees je af aan de grafiek onderaan: de
# lading van vandaag over de kwartierprijzen heen.
#
# ALLE ACCUGETALLEN KOMEN UIT sensor.accu_* EN NIET UIT sensor.deye_*.
# Die laag staat in packages/9 - Other/Battery.yaml en draait onder meer het
# teken van het vermogen om (de Deye telt ontladen positief). Zet hier een
# `sensor.deye_battery_power` neer en de kaart wijst de verkeerde kant op.
title: Accu
path: accu
icon: mdi:home-battery

cards:
  # ---------------------------------------------------------------- de accu
  - type: vertical-stack
    cards:
      - type: custom:button-card
        template: ov_title
        variables:
          title: DE ACCU

      # DE WAARSCHUWING STAAT BOVENAAN EN NIET ONDERIN
      # Op 20 september stond de Deye wel in HA maar nog niet in de meterkast:
      # alle drie de netfases op 0 V. Elk getal op deze pagina was toen echt,
      # maar sloeg nergens op - de accu liep leeg op zijn eigen elektronica.
      # Zolang die situatie kan bestaan hoort dat als eerste in beeld, anders
      # sta je naar een kloppende kaart te kijken met een verkeerd verhaal.
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.deye_grid
            state_not: "on"
        card:
          type: custom:button-card
          entity: binary_sensor.deye_grid
          show_icon: false
          show_name: false
          show_state: false
          tap_action:
            action: more-info
          styles:
            card:
              - background: var(--ov-warn-15)
              - border: none
              - box-shadow: none
              - border-radius: 14px
              - padding: 11px 14px
            grid:
              - grid-template-areas: '"ic t"'
              - grid-template-columns: 26px 1fr
              - align-items: center
              - column-gap: 11px
            custom_fields:
              ic:
                - grid-area: ic
              t:
                - grid-area: t
                - justify-self: start
                - font-size: 13px
                - color: var(--primary-text-color)
          custom_fields:
            ic: '<ha-icon icon="mdi:transmission-tower-off" style="--mdc-icon-size:20px;color:var(--ov-warn)"></ha-icon>'
            t: |
              [[[
                var v = states['sensor.deye_grid_l1_voltage'];
                var volt = (v && !isNaN(Number(v.state))) ? Number(v.state) : null;
                return '<b>Geen netspanning op de omvormer</b> — '
                  + (volt === 0 ? 'alle fases op 0 V. '
                               : (volt === null ? '' : volt + ' V op L1. '))
                  + 'Alles hieronder klopt wel, maar gaat over een accu die op '
                  + 'een eiland draait: laden uit het net kan niet en de zon '
                  + 'komt er niet in.';
              ]]]

      # Lading, richting en inhoud in één regel. Zelfde opzet als de
      # accukaart die hier stond, maar zonder de ondergrens-badge (die was een
      # instelling van de regie) - er staat nu wat er in zit.
      - type: custom:button-card
        entity: sensor.accu_lading
        triggers_update:
          - sensor.accu_vermogen
          - sensor.accu_status
          - sensor.accu_inhoud
        show_icon: false
        show_name: false
        show_state: false
        tap_action:
          action: more-info
        styles:
          grid:
            - grid-template-areas: '"ic t badge" "ic sub badge"'
            - grid-template-columns: 34px 1fr auto
            - align-items: center
            - column-gap: 12px
          card:
            - background: none
            - border: none
            - box-shadow: none
            - padding: 11px 2px
          custom_fields:
            ic:
              - grid-area: ic
            t:
              - grid-area: t
              - justify-self: start
              - font-size: 14.5px
              - font-weight: "600"
              - color: var(--primary-text-color)
            sub:
              - grid-area: sub
              - justify-self: start
              - font-size: 12.5px
              - color: var(--ov-ink-58)
              - padding-top: 2px
            badge:
              - grid-area: badge
              - justify-self: end
        custom_fields:
          ic: |
            [[[
              var st = states['sensor.accu_status'];
              var m = {laden:   ['mdi:battery-arrow-up','var(--ov-ok)'],
                       ontladen:['mdi:battery-arrow-down','var(--ov-warn)'],
                       rust:    ['mdi:battery-clock','var(--ov-ink-35)']};
              var v = m[st ? st.state : ''] || ['mdi:help-circle-outline','var(--ov-ink-25)'];
              return `<ha-icon icon="${v[0]}" style="--mdc-icon-size:22px;color:${v[1]}"></ha-icon>`;
            ]]]
          t: |
            [[[
              if(!entity || ['unavailable','unknown'].indexOf(entity.state) !== -1)
                return 'Accu niet bereikbaar';
              return 'Lading ' + Math.round(Number(entity.state)) + '%';
            ]]]
          sub: |
            [[[
              // Eén bron voor de richting: sensor.accu_status. Deze kaart had
              // vroeger een eigen dode zone van 20 W, de nest hub 15, de klok
              // ook 20 - drie waarheden over dezelfde accu.
              var st = states['sensor.accu_status'];
              var pwE = states['sensor.accu_vermogen'];
              if(!st || !pwE) return '';
              var pw = Number(pwE.state);
              if(isNaN(pw)) return '';
              // Boven de kilowatt leest een kaal wattgetal slecht; dit is een
              // accu die duizenden watts kan.
              var fmt = Math.abs(pw) >= 1000
                ? (Math.abs(pw)/1000).toFixed(1).replace('.',',') + ' kW'
                : Math.round(Math.abs(pw)) + ' W';
              if(st.state === 'laden')    return 'laadt met ' + fmt;
              if(st.state === 'ontladen') return 'levert ' + fmt + ' aan het huis';
              return 'staat stil';
            ]]]
          badge: |
            [[[
              // Kilowatturen en niet procenten: bij het afwegen of je de droger
              // nog aanzet zegt "13 kWh" iets en "44%" niet, zeker niet bij een
              // accu van deze omvang.
              var i = states['sensor.accu_inhoud'], c = states['sensor.accu_capaciteit'];
              if(!i || isNaN(Number(i.state))) return '';
              var t = Number(i.state).toFixed(1).replace('.',',');
              if(c && !isNaN(Number(c.state)))
                t += ' / ' + Number(c.state).toFixed(1).replace('.',',');
              return `<span style="font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;color:var(--ov-ink-60);background:var(--ov-ink-8)">${t} kWh</span>`;
            ]]]

      # HOE LANG NOG - de enige vraag die telt tijdens een stroomstoring.
      # De meter telde er 127, waarvan 35 lange
      # (sensor.meterkast_slimhuys_zonneplan_stroomuitvallen), dus dit is geen
      # theoretische kaart. Gerekend tot het AFSLAGPUNT VAN DE OMVORMER en niet
      # tot 0%: onder `number.deye_battery_shutdown_soc` komt er niets meer uit,
      # dus die kilowatturen meetellen zou een uur beloven dat er niet is.
      - type: custom:button-card
        template: ov_listrow
        entity: sensor.accu_inhoud
        triggers_update:
          - sensor.deye_load_power
          - sensor.accu_lading
        variables:
          mdi: mdi:home-lightning-bolt-outline
          kleur: "var(--ov-info-strong)"
          title: Hiermee draait het huis door
        custom_fields:
          s: |
            [[[
              var num = function(id){ var s = states[id];
                return (s && !isNaN(Number(s.state))) ? Number(s.state) : null; };
              var soc = num('sensor.accu_lading');
              var cap = num('sensor.accu_capaciteit');
              var vloer = num('number.deye_battery_shutdown_soc');
              var last = num('sensor.deye_load_power');
              if(soc === null || cap === null) return 'accu niet leesbaar';
              if(vloer === null) vloer = 10;
              var bruikbaar = Math.max(0, (soc - vloer) / 100 * cap);
              var tekst = bruikbaar.toFixed(1).replace('.',',') + ' kWh bruikbaar';
              if(last === null || last < 50)
                return tekst + ' · geen noemenswaardige last om mee te rekenen';
              var uren = bruikbaar / (last / 1000);
              var duur = uren >= 1
                ? Math.floor(uren) + ' uur ' + Math.round((uren % 1) * 60) + ' min'
                : Math.round(uren * 60) + ' minuten';
              return tekst + ' · ' + duur + ' bij ' + Math.round(last) + ' W';
            ]]]

  # ------------------------------------------------------------- vandaag
  - type: vertical-stack
    cards:
      - type: custom:button-card
        template: ov_title
        variables:
          title: VANDAAG
      - type: custom:button-card
        template: ov_listrow
        entity: sensor.deye_today_battery_charge
        variables:
          mdi: mdi:battery-arrow-up
          kleur: "var(--ov-ok)"
          title: Geladen
        custom_fields:
          s: |
            [[[
              var v = entity && !isNaN(Number(entity.state)) ? Number(entity.state) : null;
              return v === null ? '—' : v.toFixed(1).replace('.',',') + ' kWh erin';
            ]]]
      - type: custom:button-card
        template: ov_listrow
        entity: sensor.deye_today_battery_discharge
        variables:
          mdi: mdi:battery-arrow-down
          kleur: "var(--ov-warn)"
          title: Ontladen
        custom_fields:
          s: |
            [[[
              var v = entity && !isNaN(Number(entity.state)) ? Number(entity.state) : null;
              return v === null ? '—' : v.toFixed(1).replace('.',',') + ' kWh eruit';
            ]]]
      # HET RENDEMENT IS EEN DAGCIJFER EN GEEN MOMENTOPNAME. Halverwege de
      # ochtend staat er 4 kWh in en 0,2 kWh uit, en dan is "5%" onzin. Daarom
      # pas een percentage zodra er aan beide kanten genoeg staat; daaronder
      # gewoon de kale verliezen.
      - type: custom:button-card
        template: ov_listrow
        entity: sensor.deye_today_losses
        triggers_update:
          - sensor.deye_today_battery_charge
          - sensor.deye_today_battery_discharge
        variables:
          mdi: mdi:transfer
          kleur: "var(--ov-ink-45)"
          title: Omzettingsverlies
        custom_fields:
          s: |
            [[[
              var num = function(id){ var s = states[id];
                return (s && !isNaN(Number(s.state))) ? Number(s.state) : null; };
              var verl = num('sensor.deye_today_losses');
              var inn = num('sensor.deye_today_battery_charge');
              var uit = num('sensor.deye_today_battery_discharge');
              var t = verl === null ? '—' : verl.toFixed(1).replace('.',',') + ' kWh';
              if(inn !== null && uit !== null && inn >= 2 && uit >= 2)
                t += ' · retourrendement ' + Math.round(uit / inn * 100) + '%';
              return t;
            ]]]

  # ------------------------------------------------------- lading vs. prijs
  # DE KERNVRAAG VAN DEZE PAGINA
  # MarkeDroid bepaalt wanneer er geladen en ontladen wordt, en er is geen
  # kaart die vertelt wat het opleverde. Dit is de goedkoopste benadering: de
  # lading van vandaag over de kwartierprijzen heen. Loopt de lijn omhoog onder
  # de lage balken en omlaag onder de hoge, dan doet de appliance zijn werk.
  #
  # VENSTER = DE DAG en niet "de laatste 24 uur": de prijzen komen uit
  # `raw_today`, dat precies 00:00-24:00 dekt. Met een schuivend venster van 24
  # uur zou de linkerhelft van de balken van gisteren moeten komen, en die
  # bewaart de integratie niet - dan hangt de ladingslijn boven een lege helft.
  - type: custom:apexcharts-card
    graph_span: 24h
    span:
      start: day
    now:
      show: true
      label: nu
      color: var(--primary-text-color)
    header:
      show: true
      title: Lading van vandaag over de kwartierprijzen
    yaxis:
      - id: kwh_prijs
        min: ~0
        max: ~0.4
        decimals: 2
        apex_config:
          title:
            text: Prijs €/kWh
      - id: procent
        opposite: true
        min: 0
        max: 100
        decimals: 0
        apex_config:
          title:
            text: Lading %
    apex_config:
      tooltip:
        x:
          show: false
      plotOptions:
        bar:
          # 96 balken op een dag; met de standaardbreedte streept dat. Zelfde
          # keuze als de stroomprijskaart op het Overzicht.
          columnWidth: 96%
    series:
      - entity: sensor.slimhuys_zonneplan_prijzen_vandaag_kwartier
        name: Prijs
        stroke_width: 0
        float_precision: 3
        type: column
        color: "#3f5a70"
        show:
          legend_value: false
        yaxis_id: kwh_prijs
        data_generator: |
          const blokken = (ent, key) => (ent && ent.attributes && ent.attributes[key]) || [];
          const st = (typeof hass !== 'undefined' && hass.states) ? hass.states : {};
          const vandaag = blokken(entity, 'raw_today').length
            ? blokken(entity, 'raw_today')
            : blokken(st['sensor.slimhuys_zonneplan_prijzen_vandaag'], 'raw_today');
          return vandaag
            .map((e) => {
              const s = new Date(e.start).getTime();
              const t = new Date(e.end).getTime();
              const p = Number(e.value);
              // ApexCharts centreert een kolom op zijn timestamp; plotten op
              // het midden van [start, end) laat de balk zijn eigen blok
              // dekken in plaats van een half blok ernaast.
              return [isFinite(t) ? (s + t) / 2 : s, isNaN(p) ? null : p];
            })
            .filter((d) => isFinite(d[0]))
            .sort((a, b) => a[0] - b[0]);
      - entity: sensor.accu_lading
        name: Lading
        type: line
        curve: smooth
        stroke_width: 2
        color: "var(--ov-ok)"
        float_precision: 0
        yaxis_id: procent
        # Vijf minuten en niet ruw: de laadtoestand komt per procent binnen en
        # springt dus toch al trapsgewijs. Ruw uitlezen kost alleen punten.
        group_by:
          duration: 5min
          func: avg
        show:
          legend_value: true

  # -------------------------------------------------------------- gezondheid
  - type: vertical-stack
    cards:
      - type: custom:button-card
        template: ov_title
        variables:
          title: STAAT VAN DE OMVORMER
      # De drie meldsensoren van de Deye op één regel. Ze staan bijna altijd op
      # OK, en dan hoort er één rustige regel te staan en geen lijstje groene
      # vinkjes - dat leest niemand na een week nog.
      - type: custom:button-card
        template: ov_listrow
        entity: sensor.deye_device_state
        triggers_update:
          - sensor.deye_device_fault
          - sensor.deye_device_alarm
          - binary_sensor.deye_battery_alarm
          - binary_sensor.deye_battery_fault
        variables:
          mdi: mdi:state-machine
          title: Meldingen
        custom_fields:
          s: |
            [[[
              var mel = [];
              var tekst = function(id){ var s = states[id];
                return (s && ['OK','unknown','unavailable'].indexOf(s.state) === -1) ? s.state : null; };
              var aan = function(id, label){ var s = states[id];
                return (s && s.state === 'on') ? label : null; };
              [tekst('sensor.deye_device_fault'),
               tekst('sensor.deye_device_alarm'),
               aan('binary_sensor.deye_battery_fault', 'accustoring'),
               aan('binary_sensor.deye_battery_alarm', 'accualarm')]
                .forEach(function(m){ if(m) mel.push(m); });
              var st = states['sensor.deye_device_state'];
              var stand = st ? st.state : '—';
              return mel.length
                ? '<span style="color:var(--ov-bad)">' + mel.join(' · ') + '</span> · staat op ' + stand
                : 'geen meldingen · staat op ' + stand;
            ]]]
      - type: custom:button-card
        template: ov_listrow
        entity: sensor.deye_battery_temperature
        triggers_update:
          - sensor.deye_temperature
        variables:
          mdi: mdi:thermometer
          title: Temperatuur
        custom_fields:
          s: |
            [[[
              var f = function(id){ var s = states[id];
                return (s && !isNaN(Number(s.state)))
                  ? Number(s.state).toFixed(1).replace('.',',') + ' °C' : '—'; };
              return 'accu ' + f('sensor.deye_battery_temperature')
                   + ' · omvormer ' + f('sensor.deye_temperature');
            ]]]
      # DE VERBINDING VALT KORT WEG EN DAT IS GEEN STORING
      # Op 20 september tussen 05:00 en 07:00 twee keer, allebei ongeveer tien
      # seconden. Daarom hier geen rood vlak maar het tijdstip van de laatste
      # onderbreking: eens per uur tien seconden is normaal, elke minuut niet.
      - type: custom:button-card
        template: ov_listrow
        entity: binary_sensor.deye_connection
        variables:
          mdi: mdi:lan-connect
          title: Verbinding
        custom_fields:
          s: |
            [[[
              if(!entity) return '—';
              if(entity.state !== 'on') return '<span style="color:var(--ov-bad)">geen verbinding met de omvormer</span>';
              var d = new Date(entity.last_changed);
              var min = Math.round((Date.now() - d.getTime()) / 60000);
              var duur = min < 60 ? min + ' min'
                       : (min < 1440 ? Math.round(min/60) + ' uur' : Math.round(min/1440) + ' dagen');
              return 'in orde · laatste onderbreking ' + duur + ' geleden';
            ]]]
