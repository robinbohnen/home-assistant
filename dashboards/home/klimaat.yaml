# Klimaatregie: bedienen en meekijken.
#
# Deze weergave is bewust met standaardkaarten gebouwd (geen button-card of
# card-mod): het is een instel- en controlepagina, geen wandpaneel, en hij moet
# het ook doen als de custom cards een keer niet laden.
#
# In de eerste week is de kolom "Wat wil elke zone" de belangrijkste: daar zie
# je wat het systeem zou doen terwijl de hoofdschakelaar nog uit staat.
type: sections
max_columns: 3
title: Klimaat
path: klimaat
icon: mdi:home-thermometer
dense_section_placement: true
sections:
  #############################################################################
  ## Bediening
  #############################################################################
  - type: grid
    cards:
      - type: heading
        heading: Regelaar
        heading_style: title
        icon: mdi:tune-variant

      - type: entities
        title: Aan en uit
        state_color: true
        entities:
          - entity: input_boolean.klimaatregie_actief
            name: Klimaatregie stuurt de zonwering
            secondary_info: last-changed
          - entity: input_boolean.klimaat_nachtspui
            name: Nachtspui toestaan
          # Staat deze uit, dan blijven de slaapzones ná 07:00 staan waar ze
          # staan tot iemand op de slaapkamerknop drukt (of tot 10:00). Hier
          # zichtbaar én met de hand te zetten, want anders stuurt hij gedrag
          # dat je nergens kunt zien of overrulen.
          - entity: input_boolean.klimaat_wakker
            name: Het huis is wakker
            secondary_info: last-changed
          - type: divider
          - entity: input_select.klimaat_regime
            name: Regime vandaag
          - entity: input_boolean.klimaat_regime_handmatig
            name: Regime handmatig vastzetten
          - entity: input_number.klimaat_verwachte_max
            name: Verwachte max vandaag

      - type: heading
        heading: Instellingen
        heading_style: subtitle
        icon: mdi:sliders

      - type: entities
        title: Grenzen
        entities:
          - entity: input_number.klimaat_koelen_vanaf
            name: Koelen vanaf
          - entity: input_number.klimaat_verwarmen_tot
            name: Verwarmen tot
          - entity: input_number.klimaat_hittedag_vanaf
            name: Hittedag vanaf
          - type: divider
          - entity: input_number.klimaat_kamer_warm
            name: Kamer is warm boven
          - entity: input_number.klimaat_spui_delta
            name: Spuien vanaf verschil
          - entity: input_number.klimaat_kier_positie
            name: Stand van een kier
          - entity: input_number.klimaat_override_uren
            name: Handbediening geldt
          - entity: input_number.klimaat_screen_max_wind
            name: Screens in boven windsnelheid
          - entity: input_number.klimaat_screen_max_regen
            name: Screens in boven verwachte neerslag
          - type: divider
          - entity: input_number.klimaat_voorgevel_richting
            name: Voorgevel kijkt op
          - entity: input_number.klimaat_zijgevel_richting
            name: Zijgevel kijkt op
          - entity: input_number.klimaat_gevel_breedte
            name: Hoek waarover een gevel zon vangt
          - entity: input_number.klimaat_zon_lux_drempel
            name: Zon lux drempel
          - entity: input_number.klimaat_zon_min_elevatie
            name: Zon minimale hoogte

  #############################################################################
  ## Wat wil elke zone
  #############################################################################
  - type: grid
    cards:
      - type: heading
        heading: Wat wil elke zone
        heading_style: title
        icon: mdi:window-shutter-auto

      - type: entities
        title: Advies
        state_color: true
        entities:
          - entity: sensor.zonwering_advies_keuken_screens
            name: Keuken screens
          - entity: sensor.zonwering_advies_keuken_rolgordijn_groot
            name: Keuken rolgordijn groot
          - entity: sensor.zonwering_advies_keuken_rolgordijn_klein
            name: Keuken rolgordijn klein
          - entity: sensor.zonwering_advies_kantoor_links
            name: Kantoor links
          - entity: sensor.zonwering_advies_kantoor_rechts
            name: Kantoor rechts
          - entity: sensor.zonwering_advies_badkamer
            name: Badkamer
          - entity: sensor.zonwering_advies_slaapkamer
            name: Slaapkamer
          - entity: sensor.zonwering_advies_slaapkamer_logan
            name: Slaapkamer Logan
          - entity: sensor.zonwering_advies_slaapkamer_emma
            name: Slaapkamer Emma
          - entity: sensor.zonwering_advies_zonnescherm
            name: Zonnescherm achtertuin

      - type: entities
        title: Waarom
        entities:
          - entity: sensor.zonwering_advies_keuken_screens
            type: attribute
            attribute: reden
            name: Keuken screens
          - entity: sensor.zonwering_advies_keuken_rolgordijn_groot
            type: attribute
            attribute: reden
            name: Keuken rolgordijn groot
          - entity: sensor.zonwering_advies_keuken_rolgordijn_klein
            type: attribute
            attribute: reden
            name: Keuken rolgordijn klein
          - entity: sensor.zonwering_advies_kantoor_links
            type: attribute
            attribute: reden
            name: Kantoor links
          - entity: sensor.zonwering_advies_kantoor_rechts
            type: attribute
            attribute: reden
            name: Kantoor rechts
          - entity: sensor.zonwering_advies_badkamer
            type: attribute
            attribute: reden
            name: Badkamer
          - entity: sensor.zonwering_advies_slaapkamer
            type: attribute
            attribute: reden
            name: Slaapkamer
          - entity: sensor.zonwering_advies_slaapkamer_logan
            type: attribute
            attribute: reden
            name: Slaapkamer Logan
          - entity: sensor.zonwering_advies_slaapkamer_emma
            type: attribute
            attribute: reden
            name: Slaapkamer Emma
          - entity: sensor.zonwering_advies_zonnescherm
            type: attribute
            attribute: reden
            name: Zonnescherm achtertuin

      # Staat hier een reden, dan voert de klimaatregie het advies niet uit.
      # Zonder deze kaart zou dat stil gebeuren.
      - type: entities
        title: Wordt niet uitgevoerd omdat
        entities:
          - entity: sensor.zonwering_advies_keuken_screens
            type: attribute
            attribute: blokkade
            name: Keuken screens
          - entity: sensor.zonwering_advies_keuken_rolgordijn_groot
            type: attribute
            attribute: blokkade
            name: Keuken rolgordijn groot
          - entity: sensor.zonwering_advies_keuken_rolgordijn_klein
            type: attribute
            attribute: blokkade
            name: Keuken rolgordijn klein
          - entity: sensor.zonwering_advies_kantoor_links
            type: attribute
            attribute: blokkade
            name: Kantoor links
          - entity: sensor.zonwering_advies_kantoor_rechts
            type: attribute
            attribute: blokkade
            name: Kantoor rechts
          - entity: sensor.zonwering_advies_badkamer
            type: attribute
            attribute: blokkade
            name: Badkamer
          - entity: sensor.zonwering_advies_slaapkamer
            type: attribute
            attribute: blokkade
            name: Slaapkamer
          - entity: sensor.zonwering_advies_slaapkamer_logan
            type: attribute
            attribute: blokkade
            name: Slaapkamer Logan
          - entity: sensor.zonwering_advies_slaapkamer_emma
            type: attribute
            attribute: blokkade
            name: Slaapkamer Emma
          - entity: sensor.zonwering_advies_zonnescherm
            type: attribute
            attribute: blokkade
            name: Zonnescherm achtertuin

      - type: entities
        title: Werkelijke stand
        state_color: true
        entities:
          - entity: cover.covers_kitchen_screens
            name: Keuken screens
          - entity: cover.rollerblind_0001
            name: Keuken rolgordijn groot
          - entity: cover.rollerblind_0002
            name: Keuken rolgordijn klein
          - entity: cover.kantoor_links_low_speed
            name: Kantoor links
          - entity: cover.kantoor_rechts_low_speed
            name: Kantoor rechts
          - entity: cover.badkamer_rolluik_low_speed
            name: Badkamer
          - entity: cover.slaapkamer_rolluik_low_speed
            name: Slaapkamer
          - entity: cover.covers_bedroom_maxi
            name: Slaapkamer Logan
          - entity: cover.slaapkamer_mini
            name: Slaapkamer Emma
          # Let op: deze cover is omgekeerd bedraad, 'open' betekent hier
          # uitgeschoven. Zie docs/klimaatregie.md.
          - entity: cover.achtertuin_zonnescherm
            name: Zonnescherm achtertuin

  #############################################################################
  ## Waarnemingen en uitzonderingen
  #############################################################################
  - type: grid
    cards:
      - type: heading
        heading: Zon en buiten
        heading_style: title
        icon: mdi:weather-sunny

      - type: entities
        title: Staat de zon op de gevel
        state_color: true
        entities:
          - entity: binary_sensor.zon_op_voorgevel
            name: Zon op voorgevel (oost)
          - entity: binary_sensor.zon_op_zijgevel
            name: Zon op zijgevel (zuid)
          - entity: binary_sensor.zon_op_achtergevel
            name: Zon op achtergevel (west)
          - type: divider
          - entity: binary_sensor.zon_richting_voorgevel
            name: Zon draait naar de voorgevel
          - entity: binary_sensor.zon_richting_zijgevel
            name: Zon draait naar de zijgevel
          - entity: binary_sensor.zon_richting_achtergevel
            name: Zon draait naar de achtergevel

      - type: entities
        title: Meetwaarden
        entities:
          - entity: sensor.klimaat_zon_azimut
            name: Zon azimut (kompas)
          - entity: sensor.klimaat_zon_elevatie
            name: Zon hoogte
          - entity: sensor.voortuin_zon_luminance
            name: Licht voortuin
          - entity: sensor.achtertuin_zon_luminance
            name: Licht achtertuin
          - type: divider
          - entity: sensor.knmi_temperatuur
            name: Buiten
          - entity: weather.knmi_thuis
            type: attribute
            attribute: wind_speed
            name: Windsnelheid
          - entity: binary_sensor.knmi_waarschuwing
            name: Weerwaarschuwing
          # De sensor staat vaak op "onveilig" zonder dat er iets is; deze
          # tekst is wat er echt telt voor de screens.
          - entity: binary_sensor.knmi_waarschuwing
            type: attribute
            attribute: description
            name: Waarschuwing zegt

      # Voor het kalibreren van de gevelsectoren, zie docs/klimaatregie.md.
      - type: history-graph
        title: Zonstand tegen het licht buiten (voor kalibratie)
        hours_to_show: 24
        entities:
          - entity: sensor.klimaat_zon_azimut
          - entity: sensor.voortuin_zon_luminance
          - entity: sensor.achtertuin_zon_luminance

      - type: heading
        heading: Uitzonderingen
        heading_style: title
        icon: mdi:hand-back-right

      - type: entities
        title: Handbediening actief
        state_color: true
        entities:
          - entity: timer.override_keuken_screens
            name: Keuken screens
          - entity: timer.override_keuken_rolgordijn_groot
            name: Keuken rolgordijn groot
          - entity: timer.override_keuken_rolgordijn_klein
            name: Keuken rolgordijn klein
          - entity: timer.override_kantoor_links
            name: Kantoor links
          - entity: timer.override_kantoor_rechts
            name: Kantoor rechts
          - entity: timer.override_badkamer
            name: Badkamer
          - entity: timer.override_slaapkamer
            name: Slaapkamer
          - entity: timer.override_slaapkamer_logan
            name: Slaapkamer Logan
          - entity: timer.override_slaapkamer_emma
            name: Slaapkamer Emma
          - entity: timer.override_zonnescherm
            name: Zonnescherm achtertuin
          - type: divider
          # Loopt deze, dan is de vraag "zal ik het zonnescherm uitzetten?" al
          # gesteld en wacht de klimaatregie op een antwoord (of op het
          # aflopen van deze timer).
          - entity: timer.zonnescherm_vraag
            name: Zonnescherm - vraag gesteld

      - type: entities
        title: Zone op handmatig
        state_color: true
        entities:
          - entity: input_boolean.zonwering_handmatig_keuken_screens
            name: Keuken screens
          - entity: input_boolean.zonwering_handmatig_keuken_rolgordijn_groot
            name: Keuken rolgordijn groot
          - entity: input_boolean.zonwering_handmatig_keuken_rolgordijn_klein
            name: Keuken rolgordijn klein
          - entity: input_boolean.zonwering_handmatig_kantoor_links
            name: Kantoor links
          - entity: input_boolean.zonwering_handmatig_kantoor_rechts
            name: Kantoor rechts
          - entity: input_boolean.zonwering_handmatig_badkamer
            name: Badkamer
          - entity: input_boolean.zonwering_handmatig_slaapkamer
            name: Slaapkamer
          - entity: input_boolean.zonwering_handmatig_slaapkamer_logan
            name: Slaapkamer Logan
          - entity: input_boolean.zonwering_handmatig_slaapkamer_emma
            name: Slaapkamer Emma
          - entity: input_boolean.zonwering_handmatig_zonnescherm
            name: Zonnescherm achtertuin

  #############################################################################
  ## Laag 5 - de airco's
  ##
  ## Zelfde volgorde als bij de zonwering hierboven: eerst wat hij wil, dan
  ## waarom, dan wat er echt staat, dan de remmen. In de meekijkweek is
  ## "Wat wil elke unit" de kolom die telt - daar zie je wat de regie zou doen
  ## terwijl de schakelaar nog uit staat.
  #############################################################################
  - type: grid
    cards:
      - type: heading
        heading: Airco's
        heading_style: title
        icon: mdi:air-conditioner

      - type: entities
        title: Aan en uit
        state_color: true
        entities:
          - entity: input_boolean.aircoregie_actief
            name: Airco's automatisch regelen
            secondary_info: last-changed
          - type: divider
          - entity: input_boolean.airco_handmatig_woonkamer
            name: Woonkamer op handmatig
          - entity: input_boolean.airco_handmatig_zolder
            name: Boven op handmatig
          - type: divider
          # Gaat vanzelf om als een unit twee keer kort na het aanzetten
          # uitvalt, en elke nacht om 04:00 weer uit. Met de hand aanzetten kan
          # altijd; dit blokkeert alleen het automatisch starten.
          - entity: input_boolean.airco_storing_woonkamer
            name: Storing woonkamer
          - entity: input_boolean.airco_storing_zolder
            name: Storing boven

      - type: entities
        title: Wat wil elke unit
        state_color: true
        entities:
          - entity: sensor.airco_advies_woonkamer
            name: Woonkamer
            secondary_info: last-changed
          - entity: sensor.airco_advies_zolder
            name: Boven
            secondary_info: last-changed
          - type: divider
          - entity: sensor.airco_advies_woonkamer
            type: attribute
            attribute: doel
            name: Doeltemperatuur woonkamer
          - entity: sensor.airco_advies_zolder
            type: attribute
            attribute: doel
            name: Doeltemperatuur boven

      - type: entities
        title: Waarom
        entities:
          - entity: sensor.airco_advies_woonkamer
            type: attribute
            attribute: reden
            name: Woonkamer
          - entity: sensor.airco_advies_zolder
            type: attribute
            attribute: reden
            name: Boven

      - type: entities
        title: Wordt niet uitgevoerd omdat
        entities:
          - entity: sensor.airco_advies_woonkamer
            type: attribute
            attribute: blokkade
            name: Woonkamer
          - entity: sensor.airco_advies_zolder
            type: attribute
            attribute: blokkade
            name: Boven

      - type: entities
        title: Werkelijke stand
        state_color: true
        entities:
          - entity: climate.airco_woonkamer
            name: Airco woonkamer
          - entity: climate.airco_zolder
            name: Airco boven
          - type: divider
          - entity: sensor.woonkamer_woonkamer_multisensor_temperatuur
            name: Woonkamer nu
          # De zolderunit blaast op de overloop en bedient de hele verdieping,
          # dus hij regelt op dit gemiddelde en niet op één kamer.
          - entity: sensor.temperatuur_boven_gemiddeld
            name: Boven nu (gemiddelde)

      - type: entities
        title: Remmen tegen pendelen
        state_color: true
        entities:
          - entity: timer.airco_minimaal_aan_woonkamer
            name: Minimale looptijd woonkamer
          - entity: timer.airco_minimaal_aan_zolder
            name: Minimale looptijd boven
          - type: divider
          - entity: timer.airco_rust_woonkamer
            name: Rustpauze woonkamer
          - entity: timer.airco_rust_zolder
            name: Rustpauze boven
          - type: divider
          - entity: timer.airco_override_woonkamer
            name: Handbediening woonkamer
          - entity: timer.airco_override_zolder
            name: Handbediening boven
          - type: divider
          # Loopt vanaf onze eigen start; valt de unit binnen dit kwartier
          # vanzelf uit, dan telt dat als afgebroken start.
          - entity: timer.airco_gestart_woonkamer
            name: Net gestart woonkamer
          - entity: timer.airco_gestart_zolder
            name: Net gestart boven
          - entity: counter.airco_storingen_woonkamer
            name: Afgebroken starts woonkamer
          - entity: counter.airco_storingen_zolder
            name: Afgebroken starts boven

      - type: entities
        title: Grenzen airco
        entities:
          # De comfortband: kamer_warm is de bovenkant (staat hierboven bij de
          # zonweringgrenzen), kamer_koud de onderkant. De twee delta's maken
          # de dode zone - met de standaardwaarden aan op 23,5° en uit op 21,5°.
          - entity: input_number.klimaat_kamer_koud
            name: Kamer is koud onder
          - entity: input_number.klimaat_airco_aan_delta
            name: Aan vanaf boven de grens
          - entity: input_number.klimaat_airco_uit_delta
            name: Uit bij onder de grens
          - type: divider
          - entity: input_number.klimaat_airco_voorkoelen_min
            name: Voorkoelen vanaf reistijd
          - entity: binary_sensor.iemand_onderweg_naar_huis
            name: Iemand onderweg naar huis
          - entity: sensor.robin_reistijd_naar_huis
            name: Reistijd Robin
          - entity: sensor.samantha_reistijd_naar_huis
            name: Reistijd Samantha
