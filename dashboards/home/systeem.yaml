# Onderhoudsweergave: wat is er stuk of bijna leeg.
#
# De integratie per entiteit staat niet in `states` maar in het entiteitenregister
# (`hass.entities[...].platform`). Is dat register er niet, dan valt de groepering
# terug op het domein van de entiteit.
#
# Alle drie de kaarten lopen bij elke render door álle entiteiten heen. Hier stond
# `update_timer` om dat te begrenzen, maar die optie bestáát niet in button-card
# (het is `triggers_update`) en werd dus stil genegeerd. In plaats daarvan hangen
# de kaarten aan `sensor.time`: die tikt elke minuut, dus precies één render per
# minuut. Dat is meteen ook wat de leeftijden ("9 uur") live houdt op een paneel
# dat dagen open staat — button-card rendert alleen opnieuw als zijn entity
# verandert, en zonder entity bevriezen die teksten.
#
# Leeftijden worden uit last_changed/last_updated berekend, en na een herstart
# staat álles op het herstartmoment. `sensor.home_assistant_gestart` (zie
# packages/9 - Other/Dashboard Context.yaml) laat de kaarten dat verschil
# benoemen in plaats van een misleidend absoluut getal te tonen.
#
# SERVER-STIJL (7 november 2026). Zelfde schil en maten als dashboards/server.yaml
# en de stijlgids docs/dashboard-stijl.md: drie kolommen panelen, elk paneel een
# `sv_paneel`-kaart met een kop + badge, één groot getal of een rij tegels, en
# compacte regels. De HTML komt uit window.svKit (www/sv-kit.js).
#   kolom 1  STORINGEN   onbeschikbare entiteiten in vier bakken (zie daar)
#   kolom 2  BATTERIJEN  bijna leeg of stil, per apparaat
#            WAAKHOND    kritieke sensoren + leeftijd van de back-up (was een
#                        entities-kaart onder het raster)
#   kolom 3  MATTER      per apparaat, oudste rapportage eerst
# De lange lijsten scrollen binnen hun paneel, zodat de pagina op één
# 1080p-scherm past.
#
# KLIKKEN. Een regel van een apparaat opent zijn apparaatpagina, een losse
# entiteit zijn more-info - via S.klik (een navigate-actie, zoals een
# tap_action). Vroeger stond hier per regel een <a> met pointerdown/-up-trucs
# en pointer-events:auto; die waren nodig omdat button-card op een kaart zonder
# eigen actie `pointer-events: none` zet. `sv_paneel` zet dat terug op auto,
# dus een gewone onclick komt nu aan (tests/test_button_card_klikbaar.py).
#
# VEILIGHEID. Namen van apparaten, ruimtes, integraties en friendly_names gaan
# door S.esc(): ze komen uit het register of van een integratie en kunnen alles
# bevatten. Device-id's gaan alleen via S.klik, dat niets anders doorlaat dan
# een entity-id, #hash of /pad.
#
# Test: tests/test_systeem_pagina.py draait de JS van de panelen in node.
title: Systeem
path: systeem
icon: mdi:heart-pulse
panel: true
background: "var(--primary-background-color)"
cards:
  - type: vertical-stack
    card_mod:
      style: |
        :host { height: 100% !important; }
        #root {
          /* Kleurtokens komen uit www/ov-tokens.js, zie overzicht.yaml. */
          --ov-panel-border: 1px solid var(--ov-ink-6);
          gap: 0 !important;
          min-height: calc(100vh - 8px) !important;
          margin: 0 !important;
          padding: 12px 16px !important;
          background: var(--primary-background-color) !important;
          box-sizing: border-box !important;
        }
    cards:
      - type: horizontal-stack
        card_mod:
          style: |
            #root {
              display: grid !important;
              grid-template-columns: 1fr 1fr 1fr !important;
              gap: 12px !important;
              align-items: start !important;
            }
            @media (max-width: 1500px) {
              #root { grid-template-columns: 1fr 1fr !important; }
            }
            @media (max-width: 1000px) {
              #root { grid-template-columns: 1fr !important; }
            }
        cards:
          # =============== ONBESCHIKBARE ENTITEITEN ===============
          # Niet elke 'unavailable' is een storing, en zolang ze op één hoop
          # gaan staat de teller permanent op honderden en zegt hij niets meer.
          # Daarom vier bakken, waarvan alleen de eerste in de badge telt:
          #  - storing    : hier moet iemand iets aan doen
          #  - wees       : `restored: true`, oftewel entiteiten waarvan de
          #                 integratie weg is. Komen nooit meer terug; dit is
          #                 opruimwerk in het entiteitenregister, geen defect.
          #  - afgeleid   : sensoren die een ándere entiteit spiegelen (powercalc
          #                 volgt zijn bron). Ze vallen om als hun bron omvalt —
          #                 dezelfde storing, dubbel geteld.
          #  - ruis       : integraties die per netwerkclient entiteiten maken
          #                 (unifi). Elke gast die ooit op de wifi zat staat er
          #                 nog; 'weg' is daar de normale toestand.
          # De drie laatste bakken verdwijnen niet: rechts naast het grote getal
          # als telling, onderaan uitgesplitst per integratie.
          - type: custom:button-card
            template: sv_paneel
            entity: sensor.time
            triggers_update: sensor.time
            variables:
              kaart: storingen
              # 'unknown' erbij? Vaak ruis van entiteiten die nog nooit een waarde
              # hadden, daarom standaard uit.
              ook_unknown: false
              afgeleid:
                - powercalc
              ruis:
                - unifi
                - unifiprotect
              max_per_groep: 25
              # Staat iets er al even lang weg als Home Assistant draait, dan is
              # het bij de herstart niet teruggekomen. Entiteiten vallen niet
              # allemaal op dezelfde seconde om, vandaar de marge.
              herstart_marge_min: 3
            custom_fields:
              x: |
                [[[
                  // Zelf laden als de module er (nog) niet is, dan opnieuw tekenen;
                  // zie docs/dashboard-stijl.md ("Laden").
                  var S = window.svKit ? window.svKit(states) : null;
                  if(!S){ var svEl = this; (window.svKitLaden = window.svKitLaden || import('/local/sv-kit.js?v=1')).then(function(){ if(svEl && svEl.requestUpdate) svEl.requestUpdate(); }); }
                  if(!S) return '';
                  var esc = S.esc, nu = Date.now();
                  var reg = (hass && hass.entities) ? hass.entities : null;
                  var apparaten = (hass && hass.devices) ? hass.devices : null;
                  var gebieden = (hass && hass.areas) ? hass.areas : null;
                  var mee = function(s){ return s.state === 'unavailable' || (variables.ook_unknown && s.state === 'unknown'); };
                  var afgeleid = variables.afgeleid || [];
                  var ruis = variables.ruis || [];
                  // Hoe lang draait HA al? Een leeftijd die daarmee samenvalt
                  // betekent "niet teruggekomen na de herstart", en dat is iets
                  // anders dan een apparaat dat vanochtend spontaan uitviel.
                  var startS = states['sensor.home_assistant_gestart'];
                  var startMs = startS ? new Date(startS.state).getTime() : NaN;
                  var uptime = isNaN(startMs) ? null : nu - startMs;
                  var marge = (variables.herstart_marge_min || 3) * 60000;
                  // Eén ronde door alle states. Per bak, per integratie, een map
                  // van apparaat -> aantal entiteiten: één apparaat levert vaak
                  // 2 tot 4 entiteiten, die als losse regels maken de lijst onleesbaar.
                  var bakken = {storing: {}, wees: {}, afgeleid: {}, ruis: {}};
                  var alles = 0;
                  Object.keys(states).forEach(function(id){
                    var s = states[id];
                    if(!s || !mee(s)) return;
                    var e = reg ? reg[id] : null;
                    if(e && (e.hidden || e.hidden_by)) return;
                    alles++;
                    var integratie = (e && e.platform) ? e.platform : id.split('.')[0];
                    var soort = (s.attributes && s.attributes.restored) ? 'wees'
                              : (afgeleid.indexOf(integratie) !== -1 ? 'afgeleid'
                              : (ruis.indexOf(integratie) !== -1 ? 'ruis' : 'storing'));
                    var devId = (e && e.device_id) ? e.device_id : null;
                    var dev = (devId && apparaten) ? apparaten[devId] : null;
                    var sleutel = devId || ('los:' + id);
                    var gebiedId = (e && e.area_id) || (dev && dev.area_id) || null;
                    var gebied = (gebiedId && gebieden && gebieden[gebiedId]) ? gebieden[gebiedId].name : null;
                    var naam = dev ? (dev.name_by_user || dev.name || devId)
                                   : ((s.attributes && s.attributes.friendly_name) || id);
                    var sinds = s.last_changed ? new Date(s.last_changed).getTime() : NaN;
                    var duur = isNaN(sinds) ? null : nu - sinds;
                    var bak = bakken[soort];
                    if(!bak[integratie]) bak[integratie] = {};
                    var g = bak[integratie];
                    if(!g[sleutel]) g[sleutel] = {naam: naam, gebied: gebied, aantal: 0, duur: duur, los: !devId, dev_id: devId, ent: id};
                    g[sleutel].aantal++;
                    // langst weg binnen het apparaat telt
                    if(duur !== null && (g[sleutel].duur === null || duur > g[sleutel].duur)) g[sleutel].duur = duur;
                  });
                  var telVan = function(bak){
                    var per = Object.keys(bak).map(function(g){
                      var l = Object.keys(bak[g]).map(function(k){ return bak[g][k]; })
                        .sort(function(a,b){ return (b.duur||0) - (a.duur||0); });
                      return {naam: g, apparaten: l, entiteiten: l.reduce(function(a,x){ return a + x.aantal; }, 0)};
                    });
                    per.sort(function(a,b){ return b.entiteiten - a.entiteiten; });
                    return {per: per,
                            apparaten: per.reduce(function(a,x){ return a + x.apparaten.length; }, 0),
                            entiteiten: per.reduce(function(a,x){ return a + x.entiteiten; }, 0)};
                  };
                  var storing = telVan(bakken.storing), wees = telVan(bakken.wees),
                      afg = telVan(bakken.afgeleid), rs = telVan(bakken.ruis);
                  var duurTxt = function(ms){
                    if(ms === null) return 'onbekend';
                    if(uptime !== null && Math.abs(ms - uptime) < marge) return 'sinds herstart';
                    var m = Math.floor(ms / 60000);
                    if(m < 1) return 'net';
                    if(m < 60) return m + ' min';
                    var u = Math.floor(m / 60);
                    if(u < 48) return u + ' uur';
                    var d = Math.floor(u / 24);
                    return d + ' ' + (d === 1 ? 'dag' : 'dagen');
                  };
                  var duurKleur = function(ms){
                    if(ms === null) return 'ink-40';
                    if(ms > 7 * 86400000) return 'bad';
                    if(ms > 86400000) return 'warn';
                    return 'ink-60';
                  };
                  var n = storing.entiteiten;
                  var k = n === 0 ? 'ok' : (n > 10 ? 'bad' : 'warn');
                  var badge = n === 0 ? S.pil('ok', 'geen storingen') : S.pil(k, n + (n === 1 ? ' entiteit' : ' entiteiten'));
                  var groot = S.grootMetRegels(
                    {waarde: S.nl(storing.apparaten), k: k,
                     eenheid: storing.apparaten === 1 ? 'apparaat' : 'apparaten',
                     sub: S.nl(alles) + ' onbeschikbaar totaal'},
                    [{naam: 'Weesentiteiten', waarde: S.nl(wees.entiteiten)},
                     {naam: 'Afgeleid', waarde: S.nl(afg.entiteiten)},
                     {naam: 'Komen en gaan', waarde: S.nl(rs.entiteiten)}]);
                  var limiet = variables.max_per_groep || 25;
                  // Storingen: langst weg bovenaan, want dat is meestal het
                  // apparaat dat echt aandacht nodig heeft.
                  var blokken = storing.per.slice()
                    .sort(function(a,b){ return (b.apparaten[0].duur||0) - (a.apparaten[0].duur||0); })
                    .map(function(grp){
                      var app = grp.apparaten;
                      var teveel = Math.max(0, app.length - limiet);
                      var rijen = app.slice(0, limiet).map(function(x){
                        var plek = x.gebied ? '<span style="color:var(--ov-ink-35)"> · ' + esc(x.gebied) + '</span>' : '';
                        var aantal = x.aantal > 1 ? '<span style="color:var(--ov-ink-45);font-size:11.5px"> · ' + x.aantal + ' entiteiten</span>' : '';
                        return {klik: x.dev_id ? '/config/devices/device/' + x.dev_id : x.ent,
                                naam: esc(x.naam) + plek + aantal, waarde: duurTxt(x.duur), k: duurKleur(x.duur), vol: true};
                      });
                      if(teveel) rijen.push({naam: '<span style="color:var(--ov-ink-45)">+ ' + teveel + (teveel === 1 ? ' apparaat' : ' apparaten') + ' meer</span>', waarde: '', vol: true});
                      var ents = grp.entiteiten + (grp.entiteiten === 1 ? ' entiteit' : ' entiteiten');
                      var tel = app.every(function(x){ return x.los; })
                        ? ents
                        : app.length + (app.length === 1 ? ' apparaat' : ' apparaten') + ' · ' + ents;
                      return '<div style="display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;margin:10px 0 2px 0">'
                        + '<span style="color:var(--ov-info)">' + esc(grp.naam) + '</span>'
                        + '<span style="font-weight:600;color:var(--ov-ink-45)">' + tel + '</span></div>'
                        + S.rijen(rijen, 1, 0);
                    }).join('');
                  if(!n) blokken = '<div style="font-size:13px;color:var(--ov-ok);padding-top:10px">Geen storingen.</div>';
                  // De rest verdwijnt niet uit beeld maar telt niet mee: per bak
                  // een regel met de uitsplitsing per integratie.
                  var uitsplitsing = function(kop, uitleg, t){
                    if(!t.entiteiten) return '';
                    return '<div style="margin-top:6px"><b style="color:var(--ov-ink-55)">' + kop + '</b> · ' + uitleg + '<br>'
                      + t.per.map(function(p){ return '<span style="white-space:nowrap"><span style="color:var(--ov-ink-70)">' + esc(p.naam) + '</span> ' + p.entiteiten + '</span>'; }).join(' · ')
                      + '</div>';
                  };
                  var overig = uitsplitsing('Weesentiteiten', 'integratie bestaat niet meer, op te ruimen in het entiteitenregister', wees)
                    + uitsplitsing('Afgeleid', 'spiegelen een andere entiteit en vallen om met hun bron', afg)
                    + uitsplitsing('Komen en gaan', 'clients die niet altijd aanwezig zijn, weg is hier normaal', rs);
                  var waarschuwing = reg ? '' : '<div style="font-size:11.5px;color:var(--ov-warn);padding-top:8px">Entiteitenregister niet beschikbaar: gegroepeerd op domein in plaats van integratie.</div>';
                  return S.kop('STORINGEN', badge) + groot + waarschuwing
                    + '<div style="max-height:calc(100vh - 290px);overflow-y:auto;margin-top:4px">' + blokken
                    + (overig ? S.voet(overig) : '') + '</div>';
                ]]]

          # =============== BIJNA LEGE BATTERIJEN + WAAKHOND ===============
          - type: vertical-stack
            cards:
              # Deze kaart gaat over batterijen die je zelf vervangt. Omvormers en
              # thuisaccu's melden hun laadtoestand óók als `device_class: battery`,
              # dus die staan elke nacht op een paar procent en maken de kaart dan
              # onterecht rood. Zelfde valkuil als "veelgebruikers" op het Overzicht:
              # de device_class zegt niet wat je denkt dat hij zegt.
              #
              # TWEE GETALLEN, GEEN EEN: bijna leeg en stil (meldt zich niet meer)
              # zijn verschillende storingen met verschillende oplossingen (een
              # batterij versus gaan kijken). De kopbalk van het Overzicht noemt
              # `batterijen_stil` en `kritieke_batterijen` ook los.
              # GETELD PER APPARAAT, net als de lijst: een apparaat met zowel een
              # percentagesensor als een 'bijna leeg'-binarysensor is één apparaat
              # (stil wint van bijna leeg, het laagste percentage wint).
              - type: custom:button-card
                template: sv_paneel
                entity: sensor.time
                triggers_update: sensor.time
                variables:
                  kaart: batterijen
                  drempel: 25
                  # Integraties die alleen laadtoestand van accu's leveren.
                  negeer_integraties:
                    - sems
                    - goodwe
                    - anker_solix
                    # `solarman` sinds 20 september 2026, in plaats van `marstek`:
                    # de Deye komt via die integratie binnen (sinds 4 november 2026
                    # weer, na zes weken MarkeDroid) en `sensor.inverter_battery`
                    # draagt device_class `battery`. Zonder deze regel verschijnt de
                    # thuisaccu hier als "bijna lege batterij" zodra hij onder de
                    # 25% zakt - wat voor een accu die 's nachts leegloopt precies
                    # de bedoeling is en dus elke nacht vals alarm geeft.
                    # De zonnepanelen-omvormers lopen óók via solarman, maar hebben
                    # geen sensor met device_class battery: deze regel kost verder niets.
                    - solarman
                  # Vangnet voor accu's die via een andere integratie binnenkomen
                  # (denk aan een omvormer achter MQTT).
                  negeer_namen: "omvormer|inverter|thuisbatterij|accu|zonneplan"
                custom_fields:
                  x: |
                    [[[
                      // Zelf laden als de module er (nog) niet is, dan opnieuw tekenen;
                      // zie docs/dashboard-stijl.md ("Laden").
                      var S = window.svKit ? window.svKit(states) : null;
                      if(!S){ var svEl = this; (window.svKitLaden = window.svKitLaden || import('/local/sv-kit.js?v=1')).then(function(){ if(svEl && svEl.requestUpdate) svEl.requestUpdate(); }); }
                      if(!S) return '';
                      var esc = S.esc, nu = Date.now();
                      var drempel = variables.drempel;
                      var reg = (hass && hass.entities) ? hass.entities : null;
                      var apparaten = (hass && hass.devices) ? hass.devices : null;
                      var gebieden = (hass && hass.areas) ? hass.areas : null;
                      var negeerInt = variables.negeer_integraties || [];
                      var negeerNaam = variables.negeer_namen ? new RegExp(variables.negeer_namen, 'i') : null;
                      var groepen = {}, gemeten = 0;
                      Object.keys(states).forEach(function(id){
                        var s = states[id];
                        if(!s || !s.attributes || s.attributes.device_class !== 'battery') return;
                        // Alleen sensoren MÉTEN een batterij. Een number of select met
                        // device_class battery is een instelling: de Megane heeft
                        // `minimum_charge_level` op 20, en die kwam hier binnen als
                        // "bijna lege batterij" terwijl de auto op 99% stond.
                        if(id.lastIndexOf('sensor.', 0) !== 0 && id.lastIndexOf('binary_sensor.', 0) !== 0) return;
                        if(negeerNaam && negeerNaam.test(s.attributes.friendly_name || id)) return;
                        var e = reg ? reg[id] : null;
                        if(e && (e.hidden || e.hidden_by)) return;
                        var integratie = (e && e.platform) ? e.platform : id.split('.')[0];
                        if(negeerInt.indexOf(integratie) !== -1) return;
                        gemeten++;
                        // Een batterijapparaat op `unavailable` telt mee: stil betekent
                        // lege batterij of stuk. De pil in de kopbalk van het Overzicht
                        // noemt dit aantal ("N apparaten stil") en linkt hierheen.
                        var niveau = null, stil = false, sinds = null;
                        if(s.state === 'unavailable'){
                          stil = true;
                          // Wanneer viel hij stil? Vijf minuten of drie weken is het
                          // verschil tussen "even kijken" en "kabel pakken".
                          var t = s.last_changed ? new Date(s.last_changed).getTime() : NaN;
                          sinds = isNaN(t) ? null : t;
                        } else if(id.lastIndexOf('binary_sensor.', 0) === 0){
                          if(s.state !== 'on') return;
                        } else {
                          var v = Number(s.state);
                          if(s.state === '' || isNaN(v) || v > drempel) return;
                          niveau = v;
                        }
                        var devId = (e && e.device_id) ? e.device_id : null;
                        var dev = (devId && apparaten) ? apparaten[devId] : null;
                        var sleutel = devId || ('los:' + id);
                        var gebiedId = (e && e.area_id) || (dev && dev.area_id) || null;
                        var gebied = (gebiedId && gebieden && gebieden[gebiedId]) ? gebieden[gebiedId].name : null;
                        var naam = dev ? (dev.name_by_user || dev.name || devId)
                          : ((s.attributes.friendly_name || id).replace(/ ?batter[iy][j]?[ -]?(level|niveau|low|laag)?/i, '').trim() || id);
                        if(!groepen[integratie]) groepen[integratie] = {};
                        var g = groepen[integratie];
                        if(!g[sleutel]) g[sleutel] = {naam: naam, gebied: gebied, niveau: niveau, stil: stil, sinds: sinds, dev_id: devId, ent: id};
                        else {
                          if(stil) g[sleutel].stil = true;
                          // De JONGSTE van de stille entiteiten telt: zolang er nog
                          // eentje meldde was het apparaat niet weg.
                          if(sinds !== null && (g[sleutel].sinds === null || sinds > g[sleutel].sinds)) g[sleutel].sinds = sinds;
                          if(niveau !== null && (g[sleutel].niveau === null || niveau < g[sleutel].niveau)) g[sleutel].niveau = niveau;
                        }
                      });
                      var namen = Object.keys(groepen);
                      var leeg = 0, stilN = 0;
                      namen.forEach(function(g){ Object.keys(groepen[g]).forEach(function(k){ if(groepen[g][k].stil) stilN++; else leeg++; }); });
                      var problemen = [];
                      if(leeg) problemen.push({k: leeg > 5 ? 'bad' : 'warn', t: leeg + ' onder ' + drempel + '%'});
                      if(stilN) problemen.push({k: 'bad', t: stilN + ' stil'});
                      var badge = problemen.length === 2
                        ? S.pil(problemen[0].k, problemen[0].t) + ' ' + S.pil('bad', problemen[1].t)
                        : S.oordeel(problemen, 'alles in orde');
                      var tegels = S.tegels([
                        {label: 'ONDER ' + drempel + '%', waarde: S.nl(leeg), k: leeg ? (leeg > 5 ? 'bad' : 'warn') : 'ok', sub: 'bijna leeg'},
                        {label: 'STIL', waarde: S.nl(stilN), k: stilN ? 'bad' : 'ok', sub: 'meldt zich niet meer'},
                        {label: 'GEMETEN', waarde: S.nl(gemeten), k: 'ink-80', sub: 'batterijsensoren'}
                      ], {marge: 2});
                      if(!namen.length) return S.kop('BATTERIJEN', badge) + tegels
                        + '<div style="font-size:13px;color:var(--ov-ok);padding-top:10px">Geen bijna lege of stille batterijen.</div>';
                      // Zelfde herstartcorrectie als de Matter-kaart: na een herstart
                      // staat elke last_changed op het herstartmoment.
                      var startS = states['sensor.home_assistant_gestart'];
                      var startMs = startS ? new Date(startS.state).getTime() : NaN;
                      var uptime = isNaN(startMs) ? null : nu - startMs;
                      var duurTxt = function(ts){
                        if(ts === null) return 'onbekend hoe lang';
                        var ms = nu - ts;
                        if(uptime !== null && Math.abs(ms - uptime) < 180000) return 'sinds de herstart';
                        var m = Math.floor(ms / 60000);
                        if(m < 1) return 'net';
                        if(m < 60) return m + ' min';
                        var u = Math.floor(m / 60);
                        if(u < 48) return u + ' uur';
                        var dg = Math.floor(u / 24);
                        return dg + ' ' + (dg === 1 ? 'dag' : 'dagen');
                      };
                      // Stil bovenaan (-2), dan een kaal 'laag'-signaal (-1), dan op percentage.
                      var sleutelVan = function(x){ return x.stil ? -2 : (x.niveau === null ? -1 : x.niveau); };
                      var kleurVan = function(x){
                        if(x.stil || x.niveau === null) return 'bad';
                        return x.niveau <= 10 ? 'bad' : (x.niveau <= 20 ? 'warn' : 'ink-70');
                      };
                      var lijstVan = {};
                      namen.forEach(function(g){
                        lijstVan[g] = Object.keys(groepen[g]).map(function(k){ return groepen[g][k]; })
                          .sort(function(a,b){ return sleutelVan(a) - sleutelVan(b); });
                      });
                      namen.sort(function(a,b){ return sleutelVan(lijstVan[a][0]) - sleutelVan(lijstVan[b][0]); });
                      var blokken = namen.map(function(g){
                        var rijen = lijstVan[g].map(function(x){
                          var plek = x.gebied ? '<span style="color:var(--ov-ink-35)"> · ' + esc(x.gebied) + '</span>' : '';
                          var wanneer = x.stil ? '<span style="color:var(--ov-ink-35)"> · ' + duurTxt(x.sinds) + ' niets gehoord</span>' : '';
                          var pct = x.niveau === null ? 100 : Math.max(2, x.niveau);
                          var k = kleurVan(x);
                          var balkje = '<span style="display:inline-block;vertical-align:middle;width:48px;height:6px;border-radius:3px;background:var(--ov-ink-7);overflow:hidden;margin-right:8px">'
                            + '<span style="display:block;width:' + pct + '%;height:100%;background:var(--ov-' + k + ')"></span></span>';
                          return {klik: x.dev_id ? '/config/devices/device/' + x.dev_id : x.ent,
                                  naam: esc(x.naam) + plek + wanneer,
                                  waarde: balkje + (x.stil ? 'stil' : (x.niveau === null ? 'laag' : S.nl(x.niveau) + '%')), k: k, vol: true};
                        });
                        return '<div style="display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;margin:10px 0 2px 0">'
                          + '<span style="color:var(--ov-info)">' + esc(g) + '</span>'
                          + '<span style="font-weight:600;color:var(--ov-ink-45)">' + lijstVan[g].length + '</span></div>'
                          + S.rijen(rijen, 1, 0);
                      }).join('');
                      return S.kop('BATTERIJEN', badge) + tegels
                        + '<div style="max-height:calc(100vh - 470px);min-height:120px;overflow-y:auto;margin-top:4px">' + blokken + '</div>';
                    ]]]

              # =============== WAAKHOND ===============
              # De kaarten hierboven tellen álle entiteiten en slaan pas aan bij
              # een hoop tegelijk. Deze twee sensoren kijken juist naar een korte
              # lijst met naam en toenaam - één weggevallen lux-meter valt
              # daarboven weg, maar maakt de zonwering wel blind. Zie
              # packages/9 - Other/Watchdog.yaml (melding na een uur weg, en bij
              # een back-up ouder dan `max_dagen` = 3 dagen).
              - type: custom:button-card
                template: sv_paneel
                entity: sensor.watchdog_kritieke_sensoren
                triggers_update:
                  - sensor.watchdog_kritieke_sensoren
                  - sensor.watchdog_backup_leeftijd
                variables:
                  kaart: waakhond
                  backup_max_dagen: 3
                custom_fields:
                  x: |
                    [[[
                      // Zelf laden als de module er (nog) niet is, dan opnieuw tekenen;
                      // zie docs/dashboard-stijl.md ("Laden").
                      var S = window.svKit ? window.svKit(states) : null;
                      if(!S){ var svEl = this; (window.svKitLaden = window.svKitLaden || import('/local/sv-kit.js?v=1')).then(function(){ if(svEl && svEl.requestUpdate) svEl.requestUpdate(); }); }
                      if(!S) return '';
                      var K = 'sensor.watchdog_kritieke_sensoren', B = 'sensor.watchdog_backup_leeftijd';
                      var n = S.num(K), dagen = S.num(B);
                      var namen = S.attr(K, 'namen');
                      var laatste = S.attr(B, 'laatste_backup');
                      var max = variables.backup_max_dagen || 3;
                      var problemen = [];
                      if(n === null) problemen.push({k: 'warn', t: 'waakhond stil'});
                      else if(n > 0) problemen.push({k: 'bad', t: S.nl(n) + ' kritiek weg'});
                      var bk = dagen === null ? 'bad' : (dagen > max ? 'bad' : (dagen > 1.5 ? 'warn' : null));
                      if(bk) problemen.push({k: bk, t: dagen === null ? 'back-up onbekend' : 'back-up oud'});
                      var rijen = [
                        {klik: K, naam: 'Kritieke sensoren onbereikbaar', waarde: n === null ? '—' : S.nl(n), k: n ? 'bad' : (n === null ? 'ink-40' : 'ok')}
                      ];
                      if(n && namen) rijen.push({klik: K, naam: '<span style="color:var(--ov-ink-55)">Welke</span>', waarde: '<span style="white-space:normal">' + S.esc(namen) + '</span>', k: 'bad', vol: true});
                      rijen.push({klik: B, naam: 'Laatste back-up',
                        waarde: dagen === null ? 'onbekend' : (dagen < 1 ? 'vandaag' : S.nl(dagen, 1) + ' dagen geleden'), k: bk});
                      if(laatste) rijen.push({klik: B, naam: 'Gemaakt op', waarde: S.esc(String(laatste).replace(/:\d\d([+-]\d\d:\d\d)?$/, ''))});
                      return S.kop('WAAKHOND', S.oordeel(problemen)) + S.rijen(rijen, 1, 2);
                    ]]]

          # =============== MATTER APPARATEN ===============
          # Matter kent in de frontend geen 'laatst gezien'-veld; het dichtste
          # dat we hebben is last_updated van de entiteiten (elke rapportage van
          # het apparaat schrijft die bij). Per apparaat telt de nieuwste, dus
          # bovenaan staat het apparaat dat het langst niets heeft gestuurd.
          # Let op: een sensor die alleen bij verandering meldt (deurcontact)
          # kan legitiem uren stil zijn — oud betekent hier 'niets gehoord',
          # niet per se 'stuk'. Onbereikbare apparaten krijgen wel een label.
          # Apparaten die sinds de laatste herstart niets hebben gestuurd zeggen
          # 'sinds herstart' in plaats van een leeftijd die toevallig gelijk is
          # aan de uptime: die twee zijn niet hetzelfde en zagen er wel zo uit.
          # De badge telt alleen onbereikbare apparaten als probleem; "stil"
          # (langer dan stil_uren niets gehoord) staat als tegel, want een
          # deurcontact mag dat.
          - type: custom:button-card
            template: sv_paneel
            entity: sensor.time
            triggers_update: sensor.time
            variables:
              kaart: matter
              # Vanaf hier vindt de kaart het de moeite waard om te kleuren
              oud_uren: 6
              stil_uren: 24
              herstart_marge_min: 3
            custom_fields:
              x: |
                [[[
                  // Zelf laden als de module er (nog) niet is, dan opnieuw tekenen;
                  // zie docs/dashboard-stijl.md ("Laden").
                  var S = window.svKit ? window.svKit(states) : null;
                  if(!S){ var svEl = this; (window.svKitLaden = window.svKitLaden || import('/local/sv-kit.js?v=1')).then(function(){ if(svEl && svEl.requestUpdate) svEl.requestUpdate(); }); }
                  if(!S) return '';
                  var esc = S.esc, nu = Date.now();
                  var reg = (hass && hass.entities) ? hass.entities : null;
                  var apparaten = (hass && hass.devices) ? hass.devices : null;
                  var gebieden = (hass && hass.areas) ? hass.areas : null;
                  if(!reg) return S.kop('MATTER', S.pil('warn', 'geen register'))
                    + S.tekst('Entiteitenregister niet beschikbaar: Matter-apparaten zijn niet te herkennen.');
                  // Na een herstart staat elke last_updated op het herstartmoment,
                  // dus zonder deze correctie lijkt ieder stil apparaat precies zo
                  // lang stil als HA draait.
                  var startS = states['sensor.home_assistant_gestart'];
                  var startMs = startS ? new Date(startS.state).getTime() : NaN;
                  var uptime = isNaN(startMs) ? null : nu - startMs;
                  var marge = (variables.herstart_marge_min || 3) * 60000;
                  var groepen = {};
                  Object.keys(states).forEach(function(id){
                    var e = reg[id];
                    if(!e || e.platform !== 'matter') return;
                    var s = states[id];
                    if(!s || e.hidden || e.hidden_by) return;
                    var devId = e.device_id || null;
                    var dev = (devId && apparaten) ? apparaten[devId] : null;
                    var sleutel = devId || ('los:' + id);
                    var gebiedId = e.area_id || (dev && dev.area_id) || null;
                    var gebied = (gebiedId && gebieden && gebieden[gebiedId]) ? gebieden[gebiedId].name : null;
                    var naam = dev ? (dev.name_by_user || dev.name || devId)
                                   : ((s.attributes && s.attributes.friendly_name) || id);
                    var tijd = s.last_updated ? new Date(s.last_updated).getTime() : NaN;
                    if(!groepen[sleutel]) groepen[sleutel] = {naam: String(naam), gebied: gebied, aantal: 0, laatst: null, weg: 0, dev_id: devId, ent: id};
                    var g = groepen[sleutel];
                    g.aantal++;
                    if(s.state === 'unavailable' || s.state === 'unknown') g.weg++;
                    // nieuwste rapportage van dit apparaat telt
                    if(!isNaN(tijd) && (g.laatst === null || tijd > g.laatst)) g.laatst = tijd;
                  });
                  var lijst = Object.keys(groepen).map(function(k){ return groepen[k]; });
                  if(!lijst.length) return S.kop('MATTER', S.pil('grijs', 'geen apparaten'))
                    + S.tekst('Geen Matter-apparaten gevonden.');
                  // Oudste eerst; apparaten zonder tijdstempel helemaal bovenaan
                  lijst.sort(function(a,b){
                    if(a.laatst === b.laatst) return a.naam.localeCompare(b.naam);
                    if(a.laatst === null) return -1;
                    if(b.laatst === null) return 1;
                    return a.laatst - b.laatst;
                  });
                  var duurTxt = function(ms){
                    if(ms === null) return 'onbekend';
                    if(uptime !== null && Math.abs(ms - uptime) < marge) return 'sinds herstart';
                    var m = Math.floor(ms / 60000);
                    if(m < 1) return 'net';
                    if(m < 60) return m + ' min';
                    var u = Math.floor(m / 60);
                    if(u < 48) return u + ' uur';
                    var d = Math.floor(u / 24);
                    return d + ' ' + (d === 1 ? 'dag' : 'dagen');
                  };
                  var oud = (variables.oud_uren || 6) * 3600000;
                  var stil = (variables.stil_uren || 24) * 3600000;
                  var kleurVan = function(ms){
                    if(ms === null) return 'bad';
                    if(ms > stil) return 'bad';
                    if(ms > oud) return 'warn';
                    return 'ink-60';
                  };
                  var onbereikbaar = 0, stilN = 0;
                  var rijen = lijst.map(function(x){
                    var sinds = x.laatst === null ? null : nu - x.laatst;
                    var helemaalWeg = x.weg === x.aantal;
                    if(helemaalWeg) onbereikbaar++;
                    if(sinds === null || sinds > stil) stilN++;
                    var plek = x.gebied ? '<span style="color:var(--ov-ink-35)"> · ' + esc(x.gebied) + '</span>' : '';
                    // Alleen melden als het hele apparaat weg is; losse entiteiten
                    // die op unavailable staan zeggen te weinig om te tonen.
                    var status = helemaalWeg
                      ? '<span style="font-size:11.5px;font-weight:600;color:var(--ov-bad)"> · niet bereikbaar</span>'
                      : '<span style="font-size:11.5px;color:var(--ov-ink-45)"> · ' + x.aantal + (x.aantal === 1 ? ' entiteit' : ' entiteiten') + '</span>';
                    return {klik: x.dev_id ? '/config/devices/device/' + x.dev_id : x.ent,
                            naam: esc(x.naam) + plek + status, waarde: duurTxt(sinds), k: kleurVan(sinds), vol: true};
                  });
                  var badge = onbereikbaar ? S.pil('bad', onbereikbaar + ' niet bereikbaar') : S.pil('ok', 'alles bereikbaar');
                  var tegels = S.tegels([
                    {label: 'APPARATEN', waarde: S.nl(lijst.length), k: 'ink-80', sub: 'via Matter'},
                    {label: 'ONBEREIKBAAR', waarde: S.nl(onbereikbaar), k: onbereikbaar ? 'bad' : 'ok', sub: 'alle entiteiten weg'},
                    {label: 'STIL', waarde: S.nl(stilN), k: stilN ? 'warn' : 'ok', sub: '> ' + (variables.stil_uren || 24) + ' uur niets'}
                  ], {marge: 2});
                  return S.kop('MATTER', badge) + tegels
                    + S.subkop('OUDSTE RAPPORTAGE EERST', '')
                    + '<div style="max-height:calc(100vh - 300px);overflow-y:auto">' + S.rijen(rijen, 1, 0) + '</div>';
                ]]]
