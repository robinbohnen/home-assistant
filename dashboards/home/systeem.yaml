# Onderhoudsweergave: wat is er stuk of bijna leeg.
#
# De integratie per entiteit staat niet in `states` maar in het entiteitenregister
# (`hass.entities[...].platform`). Is dat register er niet, dan valt de groepering
# terug op het domein van de entiteit.
#
# Beide kaarten lezen alle entiteiten. Omdat button-card elke uitgelezen entiteit
# gaat volgen, zou dat bij elke statuswijziging in huis opnieuw renderen; daarom
# staat er een update_timer op. Die begrenst het tot één render per interval.
title: Systeem
path: systeem
icon: mdi:heart-pulse
panel: true
background: "#0b0d12"
cards:
  - type: vertical-stack
    card_mod:
      style: |
        :host { height: 100% !important; }
        #root {
          --ov-panel-bg: rgba(22,24,31,0.72);
          --ov-panel-border: 1px solid rgba(255,255,255,0.06);
          gap: 16px !important;
          min-height: calc(100vh - 8px) !important;
          margin: 0 !important;
          padding: 20px 24px 24px 24px !important;
          background: #0b0d12 !important;
          box-sizing: border-box !important;
        }
    cards:
      - type: horizontal-stack
        card_mod:
          style: |
            #root {
              display: grid !important;
              grid-template-columns: 1fr 1fr 1fr !important;
              gap: 16px !important;
              align-items: start !important;
            }
            @media (max-width: 1500px) {
              #root { grid-template-columns: 1fr 1fr !important; }
            }
            @media (max-width: 1000px) {
              #root { grid-template-columns: 1fr !important; }
            }
        cards:
          # =============== ONBESCHIKBARE ENTITEITEN ===============
          - type: custom:button-card
            show_icon: false
            show_name: false
            show_state: false
            update_timer: 30s
            tap_action:
              action: none
            variables:
              # 'unknown' erbij? Vaak ruis van entiteiten die nog nooit een waarde
              # hadden, daarom standaard uit.
              ook_unknown: false
              # Alleen deze integraties krijgen een uitgeklapte lijst; de rest
              # verschijnt onderaan als telling, zodat niets stilletjes wegvalt.
              focus:
                - mqtt
                - group
              max_per_groep: 25
            styles:
              card:
                - background: var(--ov-panel-bg)
                - border: var(--ov-panel-border)
                - border-radius: 20px
                - box-shadow: none
                - padding: 16px 18px
              grid:
                - grid-template-areas: '"t" "lijst"'
                - row-gap: 12px
              custom_fields:
                t:
                  - justify-self: stretch
                lijst:
                  - justify-self: stretch
            custom_fields:
              t: |
                [[[
                  var mee = function(s){ return s.state === 'unavailable' || (variables.ook_unknown && s.state === 'unknown'); };
                  var reg = (hass && hass.entities) ? hass.entities : null;
                  var n = Object.keys(states).filter(function(id){
                    var s = states[id];
                    if(!s || !mee(s)) return false;
                    var e = reg ? reg[id] : null;
                    return !(e && (e.hidden || e.hidden_by));   // zelfde filter als de lijst
                  }).length;
                  var kleur = n === 0 ? '#4ade80' : (n > 10 ? '#ef4444' : '#f59e0b');
                  return `<span style="display:flex;align-items:baseline;gap:12px;width:100%">
                    <span style="font-size:12px;font-weight:700;letter-spacing:1.2px;color:rgba(255,255,255,0.55)">ONBESCHIKBAAR</span>
                    <span style="font-size:11.5px;font-weight:600;padding:3px 11px;border-radius:20px;color:${kleur};background:rgba(255,255,255,0.06)">${n}</span>
                    <span style="margin-left:auto;font-size:11.5px;color:rgba(255,255,255,0.4)">uitgeklapt: ${(variables.focus || []).join(' · ') || 'alles'}</span></span>`;
                ]]]
              lijst: |
                [[[
                  var nu = Date.now();
                  var reg = (hass && hass.entities) ? hass.entities : null;
                  var apparaten = (hass && hass.devices) ? hass.devices : null;
                  var gebieden = (hass && hass.areas) ? hass.areas : null;
                  var mee = function(s){ return s.state === 'unavailable' || (variables.ook_unknown && s.state === 'unknown'); };
                  // Per integratie een map van apparaat -> aantal entiteiten.
                  // Eén apparaat levert vaak 2 tot 4 entiteiten; die als losse
                  // regels tonen maakt de lijst onleesbaar.
                  var groepen = {};
                  Object.keys(states).forEach(function(id){
                    var s = states[id];
                    if(!s || !mee(s)) return;
                    var e = reg ? reg[id] : null;
                    if(e && (e.hidden || e.hidden_by)) return;
                    var integratie = (e && e.platform) ? e.platform : id.split('.')[0];
                    var devId = (e && e.device_id) ? e.device_id : null;
                    var dev = (devId && apparaten) ? apparaten[devId] : null;
                    var sleutel = devId || ('los:' + id);
                    var gebiedId = (e && e.area_id) || (dev && dev.area_id) || null;
                    var gebied = (gebiedId && gebieden && gebieden[gebiedId]) ? gebieden[gebiedId].name : null;
                    var naam = dev ? (dev.name_by_user || dev.name || devId)
                                   : ((s.attributes && s.attributes.friendly_name) || id);
                    var sinds = s.last_changed ? new Date(s.last_changed).getTime() : null;
                    var duur = sinds === null ? null : nu - sinds;
                    if(!groepen[integratie]) groepen[integratie] = {};
                    var g = groepen[integratie];
                    if(!g[sleutel]) g[sleutel] = {naam: naam, gebied: gebied, aantal: 0, duur: duur, los: !devId, dev_id: devId, ent: id};
                    g[sleutel].aantal++;
                    // langst weg binnen het apparaat telt
                    if(duur !== null && (g[sleutel].duur === null || duur > g[sleutel].duur)) g[sleutel].duur = duur;
                  });
                  var namen = Object.keys(groepen);
                  if(!namen.length) return `<span style="font-size:14px;color:#4ade80">Alles bereikbaar.</span>`;
                  var lijstVan = function(g){ return Object.keys(groepen[g]).map(function(k){ return groepen[g][k]; }); };
                  var tel = {};
                  namen.forEach(function(g){
                    var l = lijstVan(g).sort(function(a,b){ return (b.duur||0) - (a.duur||0); });
                    tel[g] = {apparaten: l, entiteiten: l.reduce(function(a,x){ return a + x.aantal; }, 0)};
                  });
                  var focus = variables.focus || [];
                  var uitgeklapt = namen.filter(function(g){ return focus.indexOf(g) !== -1; });
                  var rest = namen.filter(function(g){ return focus.indexOf(g) === -1; });
                  uitgeklapt.sort(function(a,b){ return (tel[b].apparaten[0].duur||0) - (tel[a].apparaten[0].duur||0); });
                  rest.sort(function(a,b){ return tel[b].entiteiten - tel[a].entiteiten; });
                  var duurTxt = function(ms){
                    if(ms === null) return 'onbekend';
                    var m = Math.floor(ms / 60000);
                    if(m < 1) return 'net';
                    if(m < 60) return m + ' min';
                    var u = Math.floor(m / 60);
                    if(u < 48) return u + ' uur';
                    var d = Math.floor(u / 24);
                    return d + ' ' + (d === 1 ? 'dag' : 'dagen');
                  };
                  var duurKleur = function(ms){
                    if(ms === null) return 'rgba(255,255,255,0.4)';
                    if(ms > 7 * 86400000) return '#ef4444';
                    if(ms > 86400000) return '#f59e0b';
                    return 'rgba(255,255,255,0.6)';
                  };
                  // Rij klikbaar maken; zie de toelichting bij de Matter-kaart.
                  var klik = function(devId, entId, inner){
                    var doel = devId ? ('/config/devices/device/' + devId) : null;
                    var actie = doel
                      ? `history.pushState(null,'','${doel}');window.dispatchEvent(new CustomEvent('location-changed'));`
                      : `this.dispatchEvent(new CustomEvent('hass-more-info',{detail:{entityId:'${entId}'},bubbles:true,composed:true}));`;
                    return `<a href="${doel || ('/history?entity_id=' + entId)}"
                      style="display:block;color:inherit;text-decoration:none;cursor:pointer;pointer-events:auto"
                      onpointerdown="event.stopPropagation()"
                      onpointerup="event.stopPropagation();${actie}"
                      onclick="event.preventDefault();event.stopPropagation()">${inner}</a>`;
                  };
                  var limiet = variables.max_per_groep || 25;
                  var blokken = uitgeklapt.map(function(g){
                    var app = tel[g].apparaten;
                    var teveel = Math.max(0, app.length - limiet);
                    var rijen = app.slice(0, limiet).map(function(x){
                      var plek = x.gebied ? `<span style="color:rgba(255,255,255,0.35)"> · ${x.gebied}</span>` : '';
                      var aantal = x.aantal > 1
                        ? `<span style="font-size:11.5px;color:rgba(255,255,255,0.45);white-space:nowrap">${x.aantal} entiteiten</span>` : '';
                      return klik(x.dev_id, x.ent, `<div style="display:flex;align-items:baseline;gap:10px;padding:5px 0;border-top:1px solid rgba(255,255,255,0.04)">
                        <span style="flex:1;text-align:left;font-size:13.5px;color:rgba(255,255,255,0.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x.naam}${plek}</span>
                        ${aantal}
                        <span style="font-size:13px;font-weight:600;white-space:nowrap;color:${duurKleur(x.duur)}">${duurTxt(x.duur)}</span></div>`);
                    }).join('');
                    return `<div style="margin-bottom:12px">
                      <div style="display:flex;align-items:baseline;gap:8px;padding-bottom:2px;text-align:left">
                        <span style="font-size:12.5px;font-weight:700;color:#38bdf8">${g}</span>
                        <span style="font-size:11.5px;color:rgba(255,255,255,0.4)">${app.every(function(x){ return x.los; })
                          ? `${tel[g].entiteiten} entiteiten`
                          : `${app.length} ${app.length === 1 ? 'apparaat' : 'apparaten'} · ${tel[g].entiteiten} entiteiten`}</span></div>
                      ${rijen}
                      ${teveel ? `<div style="padding:5px 0;font-size:12px;color:rgba(255,255,255,0.45);text-align:left">+ ${teveel} ${teveel === 1 ? 'apparaat' : 'apparaten'} meer</div>` : ''}</div>`;
                  }).join('');
                  var overig = '';
                  if(rest.length){
                    var totApp = rest.reduce(function(a,g){ return a + tel[g].apparaten.length; }, 0);
                    var totEnt = rest.reduce(function(a,g){ return a + tel[g].entiteiten; }, 0);
                    var stukjes = rest.map(function(g){
                      return `<span style="white-space:nowrap"><span style="color:rgba(255,255,255,0.7)">${g}</span> <span style="color:rgba(255,255,255,0.45)">${tel[g].apparaten.length}</span></span>`;
                    }).join('<span style="color:rgba(255,255,255,0.2)"> · </span>');
                    overig = `<div style="border-top:1px solid rgba(255,255,255,0.08);padding-top:10px;margin-top:4px">
                      <div style="display:flex;align-items:baseline;gap:8px;padding-bottom:4px;text-align:left">
                        <span style="font-size:12.5px;font-weight:700;color:rgba(255,255,255,0.55)">overige integraties</span>
                        <span style="font-size:11.5px;color:rgba(255,255,255,0.4)">${totApp} apparaten · ${totEnt} entiteiten</span></div>
                      <div style="font-size:12.5px;line-height:1.7;text-align:left">${stukjes}</div></div>`;
                  }
                  var waarschuwing = reg ? '' : `<div style="font-size:11.5px;color:#f59e0b;padding-bottom:8px">Entiteitenregister niet beschikbaar — gegroepeerd op domein in plaats van integratie.</div>`;
                  return `<div style="max-height:calc(100vh - 190px);overflow-y:auto">${waarschuwing}${blokken}${overig}</div>`;
                ]]]

          # =============== BIJNA LEGE BATTERIJEN ===============
          - type: custom:button-card
            show_icon: false
            show_name: false
            show_state: false
            update_timer: 30s
            tap_action:
              action: none
            variables:
              drempel: 25
            styles:
              card:
                - background: var(--ov-panel-bg)
                - border: var(--ov-panel-border)
                - border-radius: 20px
                - box-shadow: none
                - padding: 16px 18px
              grid:
                - grid-template-areas: '"t" "lijst"'
                - row-gap: 12px
              custom_fields:
                t:
                  - justify-self: stretch
                lijst:
                  - justify-self: stretch
            custom_fields:
              t: |
                [[[
                  var d = variables.drempel;
                  var reg = (hass && hass.entities) ? hass.entities : null;
                  var n = Object.keys(states).filter(function(id){
                    var s = states[id];
                    if(!s || !s.attributes || s.attributes.device_class !== 'battery') return false;
                    var e = reg ? reg[id] : null;
                    if(e && (e.hidden || e.hidden_by)) return false;
                    if(id.lastIndexOf('binary_sensor.', 0) === 0) return s.state === 'on';
                    var v = Number(s.state);
                    return !isNaN(v) && v <= d;
                  }).length;
                  var kleur = n === 0 ? '#4ade80' : (n > 5 ? '#ef4444' : '#f59e0b');
                  return `<span style="display:flex;align-items:baseline;gap:12px;width:100%">
                    <span style="font-size:12px;font-weight:700;letter-spacing:1.2px;color:rgba(255,255,255,0.55)">BATTERIJEN</span>
                    <span style="font-size:11.5px;color:rgba(255,255,255,0.4)">onder ${d}%</span>
                    <span style="font-size:11.5px;font-weight:600;padding:3px 11px;border-radius:20px;color:${kleur};background:rgba(255,255,255,0.06)">${n}</span></span>`;
                ]]]
              lijst: |
                [[[
                  var drempel = variables.drempel;
                  var reg = (hass && hass.entities) ? hass.entities : null;
                  var apparaten = (hass && hass.devices) ? hass.devices : null;
                  var gebieden = (hass && hass.areas) ? hass.areas : null;
                  // Ook hier per apparaat: een apparaat kan zowel een
                  // percentagesensor als een 'bijna leeg'-binarysensor hebben.
                  var groepen = {};
                  Object.keys(states).forEach(function(id){
                    var s = states[id];
                    if(!s || !s.attributes || s.attributes.device_class !== 'battery') return;
                    var niveau = null, binair = false;
                    if(id.lastIndexOf('binary_sensor.', 0) === 0){
                      if(s.state !== 'on') return;
                      binair = true;
                    } else {
                      var v = Number(s.state);
                      if(isNaN(v) || v > drempel) return;
                      niveau = v;
                    }
                    var e = reg ? reg[id] : null;
                    if(e && (e.hidden || e.hidden_by)) return;
                    var integratie = (e && e.platform) ? e.platform : id.split('.')[0];
                    var devId = (e && e.device_id) ? e.device_id : null;
                    var dev = (devId && apparaten) ? apparaten[devId] : null;
                    var sleutel = devId || ('los:' + id);
                    var gebiedId = (e && e.area_id) || (dev && dev.area_id) || null;
                    var gebied = (gebiedId && gebieden && gebieden[gebiedId]) ? gebieden[gebiedId].name : null;
                    var naam = dev ? (dev.name_by_user || dev.name || devId)
                      : ((s.attributes.friendly_name || id).replace(/ ?batter[iy][j]?[ -]?(level|niveau|low|laag)?/i, '').trim() || id);
                    if(!groepen[integratie]) groepen[integratie] = {};
                    var g = groepen[integratie];
                    if(!g[sleutel]) g[sleutel] = {naam: naam, gebied: gebied, niveau: niveau, binair: binair, dev_id: devId, ent: id};
                    else {
                      // percentage wint van een enkel 'laag'-signaal; anders de laagste
                      if(niveau !== null && (g[sleutel].niveau === null || niveau < g[sleutel].niveau)) {
                        g[sleutel].niveau = niveau; g[sleutel].binair = false;
                      }
                    }
                  });
                  var namen = Object.keys(groepen);
                  if(!namen.length) return `<span style="font-size:14px;color:#4ade80">Geen bijna lege batterijen.</span>`;
                  var sleutelVan = function(x){ return x.niveau === null ? -1 : x.niveau; };
                  var kleurVan = function(x){
                    if(x.niveau === null) return '#ef4444';
                    return x.niveau <= 10 ? '#ef4444' : (x.niveau <= 20 ? '#f59e0b' : 'rgba(255,255,255,0.7)');
                  };
                  var lijstVan = {};
                  namen.forEach(function(g){
                    lijstVan[g] = Object.keys(groepen[g]).map(function(k){ return groepen[g][k]; })
                      .sort(function(a,b){ return sleutelVan(a) - sleutelVan(b); });
                  });
                  namen.sort(function(a,b){ return sleutelVan(lijstVan[a][0]) - sleutelVan(lijstVan[b][0]); });
                  // Rij klikbaar maken; zie de toelichting bij de Matter-kaart.
                  var klik = function(devId, entId, inner){
                    var doel = devId ? ('/config/devices/device/' + devId) : null;
                    var actie = doel
                      ? `history.pushState(null,'','${doel}');window.dispatchEvent(new CustomEvent('location-changed'));`
                      : `this.dispatchEvent(new CustomEvent('hass-more-info',{detail:{entityId:'${entId}'},bubbles:true,composed:true}));`;
                    return `<a href="${doel || ('/history?entity_id=' + entId)}"
                      style="display:block;color:inherit;text-decoration:none;cursor:pointer;pointer-events:auto"
                      onpointerdown="event.stopPropagation()"
                      onpointerup="event.stopPropagation();${actie}"
                      onclick="event.preventDefault();event.stopPropagation()">${inner}</a>`;
                  };
                  var blokken = namen.map(function(g){
                    var rijen = lijstVan[g].map(function(x){
                      var plek = x.gebied ? `<span style="color:rgba(255,255,255,0.35)"> · ${x.gebied}</span>` : '';
                      var pct = x.niveau === null ? 100 : Math.max(2, x.niveau);
                      var waarde = x.niveau === null ? 'laag' : x.niveau + '%';
                      return klik(x.dev_id, x.ent, `<div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-top:1px solid rgba(255,255,255,0.04)">
                        <span style="flex:1;text-align:left;font-size:13.5px;color:rgba(255,255,255,0.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x.naam}${plek}</span>
                        <span style="width:56px;height:6px;border-radius:3px;background:rgba(255,255,255,0.07);overflow:hidden;flex:0 0 auto">
                          <span style="display:block;width:${pct}%;height:100%;background:${kleurVan(x)}"></span></span>
                        <span style="width:44px;text-align:right;font-size:13px;font-weight:600;color:${kleurVan(x)}">${waarde}</span></div>`);
                    }).join('');
                    return `<div style="margin-bottom:12px">
                      <div style="display:flex;align-items:baseline;gap:8px;padding-bottom:2px;text-align:left">
                        <span style="font-size:12.5px;font-weight:700;color:#38bdf8">${g}</span>
                        <span style="font-size:11.5px;color:rgba(255,255,255,0.4)">${lijstVan[g].length}</span></div>
                      ${rijen}</div>`;
                  }).join('');
                  return `<div style="max-height:calc(100vh - 190px);overflow-y:auto">${blokken}</div>`;
                ]]]

          # =============== MATTER APPARATEN ===============
          # Matter kent in de frontend geen 'laatst gezien'-veld; het dichtste
          # dat we hebben is last_updated van de entiteiten (elke rapportage van
          # het apparaat schrijft die bij). Per apparaat telt de nieuwste, dus
          # bovenaan staat het apparaat dat het langst niets heeft gestuurd.
          # Let op: een sensor die alleen bij verandering meldt (deurcontact)
          # kan legitiem uren stil zijn — oud betekent hier 'niets gehoord',
          # niet per se 'stuk'. Onbereikbare apparaten krijgen wel een label.
          - type: custom:button-card
            show_icon: false
            show_name: false
            show_state: false
            update_timer: 30s
            tap_action:
              action: none
            variables:
              # Vanaf hier vindt de kaart het de moeite waard om te kleuren
              oud_uren: 6
              stil_uren: 24
            styles:
              card:
                - background: var(--ov-panel-bg)
                - border: var(--ov-panel-border)
                - border-radius: 20px
                - box-shadow: none
                - padding: 16px 18px
              grid:
                - grid-template-areas: '"t" "lijst"'
                - row-gap: 12px
              custom_fields:
                t:
                  - justify-self: stretch
                lijst:
                  - justify-self: stretch
            custom_fields:
              t: |
                [[[
                  var reg = (hass && hass.entities) ? hass.entities : null;
                  var devs = {};
                  if(reg) Object.keys(states).forEach(function(id){
                    var e = reg[id];
                    if(!e || e.platform !== 'matter') return;
                    if(e.hidden || e.hidden_by) return;
                    devs[e.device_id || ('los:' + id)] = true;
                  });
                  var n = Object.keys(devs).length;
                  return `<span style="display:flex;align-items:baseline;gap:12px;width:100%">
                    <span style="font-size:12px;font-weight:700;letter-spacing:1.2px;color:rgba(255,255,255,0.55)">MATTER</span>
                    <span style="font-size:11.5px;font-weight:600;padding:3px 11px;border-radius:20px;color:rgba(255,255,255,0.7);background:rgba(255,255,255,0.06)">${n}</span>
                    <span style="margin-left:auto;font-size:11.5px;color:rgba(255,255,255,0.4)">oudste eerst</span></span>`;
                ]]]
              lijst: |
                [[[
                  var nu = Date.now();
                  var reg = (hass && hass.entities) ? hass.entities : null;
                  var apparaten = (hass && hass.devices) ? hass.devices : null;
                  var gebieden = (hass && hass.areas) ? hass.areas : null;
                  if(!reg) return `<span style="font-size:12.5px;color:#f59e0b">Entiteitenregister niet beschikbaar — Matter-apparaten zijn niet te herkennen.</span>`;
                  var groepen = {};
                  Object.keys(states).forEach(function(id){
                    var s = states[id];
                    var e = reg[id];
                    if(!s || !e || e.platform !== 'matter') return;
                    if(e.hidden || e.hidden_by) return;
                    var devId = e.device_id || null;
                    var dev = (devId && apparaten) ? apparaten[devId] : null;
                    var sleutel = devId || ('los:' + id);
                    var gebiedId = e.area_id || (dev && dev.area_id) || null;
                    var gebied = (gebiedId && gebieden && gebieden[gebiedId]) ? gebieden[gebiedId].name : null;
                    var naam = dev ? (dev.name_by_user || dev.name || devId)
                                   : ((s.attributes && s.attributes.friendly_name) || id);
                    var tijd = s.last_updated ? new Date(s.last_updated).getTime() : null;
                    if(!groepen[sleutel]) groepen[sleutel] = {naam: naam, gebied: gebied, aantal: 0, laatst: null, weg: 0, dev_id: devId, ent: id};
                    var g = groepen[sleutel];
                    g.aantal++;
                    if(s.state === 'unavailable' || s.state === 'unknown') g.weg++;
                    // nieuwste rapportage van dit apparaat telt
                    if(tijd !== null && (g.laatst === null || tijd > g.laatst)) g.laatst = tijd;
                  });
                  var lijst = Object.keys(groepen).map(function(k){ return groepen[k]; });
                  if(!lijst.length) return `<span style="font-size:14px;color:rgba(255,255,255,0.6)">Geen Matter-apparaten gevonden.</span>`;
                  // Oudste eerst; apparaten zonder tijdstempel helemaal bovenaan
                  lijst.sort(function(a,b){
                    if(a.laatst === b.laatst) return a.naam.localeCompare(b.naam);
                    if(a.laatst === null) return -1;
                    if(b.laatst === null) return 1;
                    return a.laatst - b.laatst;
                  });
                  var duurTxt = function(ms){
                    if(ms === null) return 'onbekend';
                    var m = Math.floor(ms / 60000);
                    if(m < 1) return 'net';
                    if(m < 60) return m + ' min';
                    var u = Math.floor(m / 60);
                    if(u < 48) return u + ' uur';
                    var d = Math.floor(u / 24);
                    return d + ' ' + (d === 1 ? 'dag' : 'dagen');
                  };
                  var oud = (variables.oud_uren || 6) * 3600000;
                  var stil = (variables.stil_uren || 24) * 3600000;
                  var kleurVan = function(ms){
                    if(ms === null) return '#ef4444';
                    if(ms > stil) return '#ef4444';
                    if(ms > oud) return '#f59e0b';
                    return 'rgba(255,255,255,0.6)';
                  };
                  // Rij klikbaar maken. Drie dingen zitten een gewone link hier
                  // in de weg, dus alle drie afgevangen:
                  //  - button-card vangt de tik zelf af op de kaart, daarom
                  //    stopPropagation op pointerdown/-up en navigeren we op
                  //    pointerup in plaats van op click;
                  //  - een ouder-element met pointer-events:none, daarom
                  //    expliciet pointer-events:auto op de link zelf;
                  //  - een <a href> zou de hele frontend herladen, daarom
                  //    history.pushState + 'location-changed' (de HA-router
                  //    luistert daarop) en een preventDefault op de click.
                  // Draait inline JS niet, dan doet die preventDefault het ook
                  // niet en navigeert de href alsnog — trager, maar het werkt.
                  // Losse entiteiten hebben geen apparaatpagina; die openen hun
                  // more-info-dialoog via een event dat uit de kaart omhoog bubbelt.
                  var klik = function(devId, entId, inner){
                    var doel = devId ? ('/config/devices/device/' + devId) : null;
                    var actie = doel
                      ? `history.pushState(null,'','${doel}');window.dispatchEvent(new CustomEvent('location-changed'));`
                      : `this.dispatchEvent(new CustomEvent('hass-more-info',{detail:{entityId:'${entId}'},bubbles:true,composed:true}));`;
                    return `<a href="${doel || ('/history?entity_id=' + entId)}"
                      style="display:block;color:inherit;text-decoration:none;cursor:pointer;pointer-events:auto"
                      onpointerdown="event.stopPropagation()"
                      onpointerup="event.stopPropagation();${actie}"
                      onclick="event.preventDefault();event.stopPropagation()">${inner}</a>`;
                  };
                  var rijen = lijst.map(function(x){
                    var sinds = x.laatst === null ? null : nu - x.laatst;
                    var plek = x.gebied ? `<span style="color:rgba(255,255,255,0.35)"> · ${x.gebied}</span>` : '';
                    // Alleen melden als het hele apparaat weg is; losse entiteiten
                    // die op unavailable staan zeggen te weinig om te tonen.
                    var status = x.weg === x.aantal
                      ? `<span style="font-size:11.5px;font-weight:600;color:#ef4444;white-space:nowrap">niet bereikbaar</span>`
                      : `<span style="font-size:11.5px;color:rgba(255,255,255,0.45);white-space:nowrap">${x.aantal} ${x.aantal === 1 ? 'entiteit' : 'entiteiten'}</span>`;
                    return klik(x.dev_id, x.ent, `<div style="display:flex;align-items:baseline;gap:10px;padding:5px 0;border-top:1px solid rgba(255,255,255,0.04)">
                      <span style="flex:1;text-align:left;font-size:13.5px;color:rgba(255,255,255,0.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x.naam}${plek}</span>
                      ${status}
                      <span style="font-size:13px;font-weight:600;white-space:nowrap;color:${kleurVan(sinds)}">${duurTxt(sinds)}</span></div>`);
                  }).join('');
                  return `<div style="max-height:calc(100vh - 190px);overflow-y:auto">${rijen}</div>`;
                ]]]
