                # het blok van 10:00; nu toont de tooltip het hele interval.
                formatter: |
                  EVAL:function(val, opts) {
                    var xs = (opts && opts.w && opts.w.globals.seriesX[0]) || [];
                    var step = Infinity;
                    for (var i = 1; i < xs.length; i++) { var d = xs[i] - xs[i - 1]; if (d > 0 && d < step) { step = d; } }
                    if (!isFinite(step)) { step = 3600000; }
                    var s = new Date(val - step / 2), e = new Date(val + step / 2);
                    var klok = function(d) { return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); };
