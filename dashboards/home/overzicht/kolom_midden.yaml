# Middenkolom: energie nu (met de veelgebruikers als deel van het huis) en stroomprijs.
type: vertical-stack
card_mod:
  style: |
    #root { gap: 16px !important; }
cards:
  # ENERGIE NU
  - type: custom:mod-card
    card_mod:
      style: |
        ha-card {
          background: var(--ov-panel-bg) !important;
          border: var(--ov-panel-border) !important;
          border-radius: var(--ov-panel-radius) !important;
          box-shadow: none !important;
          padding: var(--ov-panel-padding) !important;
        }
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          template: ov_title
          tap_action:
            action: navigate
            navigation_path: "#ov-energie"
          variables:
            title: ENERGIE · NU
          custom_fields:
            b: |
              [[[
                var g = states['sensor.slimhuys_zonneplan_tariefniveau_nu'];
                var solar = states['sensor.zon_vermogen_nu'];
                // /low/ vangt zowel low als very_low; SlimHuys kent vijf niveaus.
                var cheap = g && /low/.test(g.state);
                // Deze sensor staat in W (zie het prod-veld hieronder). De oude
                // drempel 0,1 was als kW bedoeld en maakte "groen" al waar bij
                // het minste schemerlicht; 100 W is pas een echte bijdrage.
                var su = solar && solar.attributes ? solar.attributes.unit_of_measurement : null;
                var sw = solar && !isNaN(Number(solar.state)) ? Number(solar.state) * (su === 'kW' ? 1000 : 1) : 0;
                var green = sw > 100;
                // `peak` bevat het woord 'high' niet; zonder die tweede tak
                // stond op het duurste uur "stroom is normaal tarief".
                var duur = g && /high|peak/.test(g.state);
                // Het tarief wint van "groen": met alleen een zon-test stond hier
                // op het duurste moment van de dag een groene "stroom is groen",
                // wat leest als "goed moment om iets aan te zetten". Zelfde
                // driedeling als de kopregel op dashboards/home/nest_hub.yaml.
                var txt, col;
                if(cheap){
                  txt = green ? 'stroom is groen en goedkoop' : 'stroom is goedkoop';
                  col = 'var(--ov-ok)';
                } else if(duur){
                  txt = green ? 'stroom is groen maar duur' : 'stroom is duur';
                  col = green ? 'var(--ov-warn)' : 'var(--ov-bad)';
                } else {
                  txt = green ? 'stroom is groen' : 'normaal tarief';
                  col = green ? 'var(--ov-ok)' : 'var(--ov-ink-60)';
                }
                return `<span style="display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:${col}"><span style="width:8px;height:8px;border-radius:50%;background:${col}"></span>${txt}</span>`;
              ]]]
        # Energiebalans: twee gestapelde balken (waar de stroom vandaan komt
        # en waar hij heen gaat), een derde die het huisdeel uitsplitst naar
        # de stekkers die nu het meest trekken, en rechts het huisgetal.
        #
        # WAAROM GEEN STROOMLIJNEN MEER (3 oktober 2026)
        # Hier stond sinds 16-08 een flow met drie geanimeerde lijnen van
        # zon/net/accu naar het huis. Die liepen altijd naar het huis toe, ook
        # op een middag waarop de zon voor twee derde naar net en accu ging,
        # en kostten 106 px voor drie streepjes. In een balk is de lengte het
        # aandeel: je ziet de verdeling zonder voortekens of richting te lezen.
        #
        # HET HUISGETAL KOMT UIT DE SENSOR EN IS EEN MINUUTGEMIDDELDE
        # De kaart rekende net + zon - accu zelf nog eens uit, op het moment
        # van tekenen. Op 3 oktober stond er daardoor 0 W terwijl het huis
        # ~1,5 kW trok: de accu pendelde elke ~50 s tussen laden en ontladen,
        # meldt zich om de ~11 s, en de P1 komt 16 s te laat binnen - elke
        # losse som combineert dan waarden van verschillende momenten (2372
        # zon - 1662 terug - 963 accu = -253, afgekapt op 0). Nu leest de
        # kaart `sensor.huis_verbruik_gemiddeld` (Electricity.yaml, 60 s), met
        # `sensor.huis_verbruik` als terugval zolang die nog niet bestaat.
        # Prijs: een waterkoker staat na ~30 s in het getal in plaats van na 5.
        #
        # ELKE BALK IS ZIJN EIGEN 100%
        # Zon, net en accu zijn momentopnames en het huis is dat gemiddelde;
        # "komt van" en "gaat naar" tellen dus niet op de watt gelijk op. Elke
        # balk verdeelt daarom zijn eigen som in plaats van een gedeelde schaal.
        #
        # KLEUR VOLGT DE PARTIJ
        # zon groen, huis blauw (de verbruikskleur van de grafieken eronder),
        # accu effen grijs, net gearceerd grijs. Accu en net staan in beide
        # balken en hebben daarom geen eigen tint: paars naast het huisblauw
        # viel door de kleurenblind-check van de dataviz-validator (deutan
        # ΔE 0,3), en oranje/rood zijn op dit dashboard status. De arcering
        # houdt de twee grijzen ook zonder kleur uit elkaar, en elk segment
        # heeft zijn naam en getal in de regel eronder, in dezelfde volgorde.
        #
        # IN HUIS: DE STEKKERS ALS DEEL VAN HET HUISGETAL
        # Verving het losse VEELGEBRUIKERS-paneel, waar de balkjes schaalden
        # op de zwaarste van het moment - een koelkast van 89 W vulde de hele
        # breedte. Hier is de balk het huisverbruik: de zwaarste stekkers uit
        # `sensor.veelgebruikers` (hoogstens vijf, en alleen wie minstens 1,5%
        # van de balk is), dan "andere stekkers" (de rest van die lijst) en
        # "niet gemeten" (huis min alle stekkers: kookplaat, verlichting, alles
        # zonder stekker). De blauwtint loopt af met de rangorde; namen in
        # dezelfde volgorde eronder. De rijen per stekker staan in #ov-energie.
        #
        # PER SET, NIET SAMEN (ZW/O-percentages, overgenomen van de oude
        # productietegel): één percentage over beide omvormers haalt nooit
        # 100% - de sets pieken op verschillende momenten. Per set gedeeld
        # door zijn eigen capaciteit klopt het wel, en zie je de zuidwest op
        # een heldere middag ook echt klippen (geel bij >= 98). ZW =
        # achtertuin (sensor heet `overkapping`), O = zolder; plafonds uit de
        # capaciteitssensoren, terugval 5/3 kW.
        #
        # ACCU: "STANDBY" KOMT UIT `sensor.accu_status` (packages/9 - Other/
        # Battery.yaml), zodat deze kaart, de nest hub en de klokdisplay
        # hetzelfde woord gebruiken. In rust heeft de accu geen segment, maar
        # de lading blijft wel in de regel onder "gaat naar" staan.
        #
        # button-card rendert alleen opnieuw als zijn entity verandert; de
        # triggers_update-lijst dekt de andere bronnen. De entity is bewust
        # niet meer de P1 (~2 meldingen per seconde, dus ook zo vaak tekenen)
        # maar het huisverbruik, dat om de 5 s komt.
        - type: custom:button-card
          entity: sensor.huis_verbruik
          triggers_update:
            - sensor.huis_verbruik_gemiddeld
            - sensor.zon_vermogen_nu
            - sensor.accu_vermogen
            - sensor.accu_lading
            - sensor.accu_status
            - sensor.veelgebruikers
          show_icon: false
          show_name: false
          show_state: false
          tap_action:
            action: navigate
            navigation_path: "#ov-energie"
          styles:
            card:
              - background: none
              - border: none
              - box-shadow: none
              - padding: 6px 2px 8px 2px
            grid:
              - grid-template-areas: '"flow"'
            custom_fields:
              flow:
                - width: 100%
          custom_fields:
            flow: |
              [[[
                // ---------- waarden, alles in W ----------
                var num = function(id){ var s = states[id];
                  return (s && !isNaN(Number(s.state))) ? Number(s.state) : null; };
                // zon: sensor staat in W tenzij hij expliciet kW zegt
                var zonS = states['sensor.zon_vermogen_nu'];
                var zonW = null;
                if(zonS && !isNaN(Number(zonS.state))){
                  var zu = zonS.attributes.unit_of_measurement || '';
                  zonW = Number(zonS.state) * (zu === 'kW' ? 1000 : 1);
                }
                // netto (kW): negatief = teruglevering; ruis rond nul plat slaan
                var netto = num('sensor.live_energieverbruik_totaal');
                var nettoW = netto === null ? null : (Math.abs(netto) < 0.005 ? 0 : netto * 1000);
                var accuW = num('sensor.accu_vermogen');
                var huisKw = num('sensor.huis_verbruik_gemiddeld');
                if(huisKw === null) huisKw = num('sensor.huis_verbruik');
                var huisW = huisKw === null ? null : Math.max(0, huisKw * 1000);
                var soc = num('sensor.accu_lading');
                // Het woord komt uit de sensor en wordt hier alleen vertaald
                // naar de werkwoordsvorm die op deze kaart staat.
                var accuSt = states['sensor.accu_status'];
                var accuMode = (!accuSt || accuW === null) ? ''
                             : ({laden: 'laadt', ontladen: 'ontlaadt', rust: 'standby'}[accuSt.state] || '');
                // De percentages komen uit de attributen `zw`/`o` van
                // sensor.zon_vermogen_nu, die een uitval tot tien minuten
                // vasthoudt - zie packages/2 - Second Floor/Attic/Solarpanels.yaml.
                var zonAttr = (zonS || {}).attributes || {};
                var pct = function(vermogen, capId, terugval){
                  var p = (vermogen === undefined || vermogen === null || isNaN(Number(vermogen)))
                        ? null : Number(vermogen);
                  var c = num(capId);
                  c = (c === null ? terugval : c) * 1000;
                  return (p === null || c <= 0) ? null : Math.round(p / c * 100);
                };
                var zw = pct(zonAttr.zw, 'sensor.inverter_kroon_18_achtertuin_capacity', 5);
                var oo = pct(zonAttr.o, 'sensor.inverter_kroon_18_zolder_capacity', 3);
                // Alles in W, pas vanaf 10 kW in kW: "0,14 kW" en "2654 W"
                // onder elkaar las niet. Uitvoer [getal, eenheid] zodat het
                // huisgetal de eenheid kleiner kan zetten.
                var vermogen = function(w){
                  if(w === null) return ['—', ''];
                  w = Math.round(Math.abs(w));
                  return w < 10000 ? [String(w), 'W']
                                   : [(w / 1000).toFixed(1).replace('.',','), 'kW'];
                };
                var vtekst = function(w){ var f = vermogen(w); return f[1] ? f[0] + ' ' + f[1] : f[0]; };

                // ---------- bouwstenen ----------
                var INKT = 'var(--primary-text-color)', GRIJS = 'var(--ov-ink-55)', GEEL = 'var(--ov-clip)';
                var ZON = 'var(--ov-ok)', HUIS = 'var(--ov-info-strong)', ACCU = 'var(--ov-ink-70)';
                var NET = 'repeating-linear-gradient(135deg, var(--ov-ink-50) 0 2px, var(--ov-ink-14) 2px 5px)';
                var LEEG = 'var(--ov-ink-7)';
                // Kolommen in fr die samen de hele breedte vullen: een grid en
                // geen flex-rij, want die centreert button-card zelf.
                var balk = function(delen){
                  var aan = delen.filter(function(d){ return d.w > 0; });
                  if(!aan.length) return `<div style="height:10px;border-radius:5px;background:${LEEG}"></div>`;
                  var kolommen = aan.map(function(d){ return `minmax(3px,${Math.max(1, Math.round(d.w))}fr)`; }).join(' ');
                  return `<div style="display:grid;grid-template-columns:${kolommen};column-gap:2px;height:10px;border-radius:5px;overflow:hidden">`
                    + aan.map(function(d){ return `<div style="background:${d.bg};opacity:${d.op || 1}"></div>`; }).join('')
                    + `</div>`;
                };
                // Eén naam + getal onder de balk. Tekst in inkt, het blokje
                // draagt de kleur; `dof` is voor wat er wel is maar niet loopt.
                var item = function(d){
                  var blok = d.bg
                    ? `<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${d.bg};opacity:${d.op || 1};margin-right:5px"></span>`
                    : `<span style="display:inline-block;width:6px;height:6px;border-radius:2px;border:1px solid var(--ov-ink-35);margin-right:5px"></span>`;
                  return `<span style="display:inline-block;white-space:nowrap;margin-right:14px">${blok}`
                    + `<span style="color:${GRIJS}">${d.naam}</span>`
                    + (d.waarde ? ` <span style="font-weight:600;color:${d.dof ? GRIJS : INKT}">${d.waarde}</span>` : '')
                    + (d.extra || '') + `</span>`;
                };
                var rij = function(label, delen){
                  return `<div style="font-size:11.5px;line-height:10px;color:${GRIJS};white-space:nowrap">${label}</div>`
                    + `<div style="min-width:0">${balk(delen)}`
                    + `<div style="font-size:12px;line-height:1.5;padding-top:3px;text-align:left">${delen.map(item).join('')}</div></div>`;
                };

                // ---------- komt van / gaat naar ----------
                var deel = function(naam, p){
                  if(p === null) return '';
                  return ` <span style="color:${p >= 98 ? GEEL : GRIJS}">· ${naam} ${p}%</span>`;
                };
                var socTxt = soc === null ? '' : ` <span style="color:${GRIJS}">· ${Math.round(soc)}%</span>`;
                var accuDeel = {bg: ACCU, w: accuW === null ? 0 : Math.abs(accuW), naam: 'accu',
                                waarde: vtekst(accuW), extra: socTxt};
                var netDeel = {bg: NET, w: nettoW === null ? 0 : Math.abs(nettoW), naam: 'net', waarde: vtekst(nettoW)};
                var van = [], naar = [];
                // Onder 50 W is de zon geen bron maar schemerlicht; een bron
                // die zich niet meldt blijft als streepje zichtbaar.
                if(zonW === null) van.push({naam: 'zon', waarde: '—', dof: true});
                else if(zonW > 50) van.push({bg: ZON, w: zonW, naam: 'zon', waarde: vtekst(zonW),
                                             extra: deel('ZW', zw) + deel('O', oo)});
                if(accuMode === 'ontlaadt') van.push(accuDeel);
                if(nettoW === null) van.push({naam: 'net', waarde: '—', dof: true});
                else if(nettoW > 0) van.push(netDeel);

                if(huisW === null) naar.push({naam: 'huis', waarde: '—', dof: true});
                else naar.push({bg: HUIS, w: huisW, naam: 'huis', waarde: vtekst(huisW)});
                if(accuMode === 'laadt') naar.push(accuDeel);
                else if(accuMode === 'standby') naar.push({naam: 'accu standby', extra: socTxt, dof: true});
                else if(accuW === null) naar.push({naam: 'accu', waarde: '—', dof: true});
                if(nettoW !== null && nettoW < 0) naar.push(netDeel);

                // ---------- in huis ----------
                var vg = states['sensor.veelgebruikers'];
                var top = (vg && vg.attributes && vg.attributes.top) || [];
                var stekW = (vg && !isNaN(Number(vg.state))) ? Number(vg.state) : null;
                var huisRij = [];
                if(stekW !== null){
                  // Loopt de stekkersom even voor op het huisgemiddelde, dan
                  // is de som de schaal en blijft "niet gemeten" leeg.
                  var schaal = Math.max(huisW === null ? 0 : huisW, stekW);
                  var drempel = Math.max(5, schaal * 0.015);
                  var TINT = [1, 0.82, 0.66, 0.52, 0.4];
                  var benoemd = 0;
                  top.filter(function(r){ return r.watt >= drempel; }).slice(0, 5).forEach(function(r, i){
                    benoemd += r.watt;
                    huisRij.push({bg: HUIS, op: TINT[i], w: r.watt, naam: r.naam, waarde: vtekst(r.watt)});
                  });
                  var andere = Math.max(0, stekW - benoemd);
                  if(andere >= 1) huisRij.push({bg: HUIS, op: 0.22, w: andere, naam: 'andere stekkers', waarde: vtekst(andere)});
                  var onbekend = huisW === null ? 0 : Math.max(0, huisW - stekW);
                  if(onbekend >= 1) huisRij.push({bg: 'var(--ov-ink-18)', w: onbekend, naam: 'niet gemeten', waarde: vtekst(onbekend)});
                }
                if(!huisRij.length) huisRij.push({naam: stekW === null ? 'stekkers: nog geen meting' : 'geen stekker meldt zich', dof: true});

                var huis = vermogen(huisW);
                return `<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:22px;width:100%;text-align:left">
                  <div style="display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;row-gap:9px;align-items:start;min-width:0">
                    ${rij('komt van', van)}
                    ${rij('gaat naar', naar)}
                    ${rij('in huis', huisRij)}
                  </div>
                  <div style="text-align:left">
                    <div style="line-height:1;white-space:nowrap"><span style="font-size:30px;font-weight:700;color:${INKT}">${huis[0]}</span> <span style="font-size:13px;color:${GRIJS}">${huis[1]}</span></div>
                    <div style="font-size:11.5px;line-height:1.35;color:${GRIJS};padding-top:3px;white-space:nowrap"><ha-icon icon="mdi:home-lightning-bolt-outline" style="--mdc-icon-size:13px;width:13px;height:13px;vertical-align:middle;color:${HUIS}"></ha-icon> huis · verbruik</div>
                  </div>
                </div>`;
              ]]]
        # GRAFIEKEN NAAST ELKAAR: links 2 uur productie tegen huisverbruik,
        # rechts de live-strook van het laatste halfuur. Eerst stond de strook
        # erboven en groeide het paneel bijna 100 px ("neemt veel in de
        # hoogte", Robin 24-08-2026); naast elkaar kost het samen niet meer
        # hoogte dan de grote grafiek alleen. Beide tonen sinds 24-08 dezelfde
        # blauwe grootheid (sensor.huis_verbruik) op twee zoomniveaus.
        #
        # ALLEBEI EEN KOPREGEL, ALLEBEI EEN VLOER OP 0 (3 oktober 2026)
        # De linkergrafiek had geen legenda (de blauwe stip stond alleen boven
        # de strook) en een as die op 1,0 kW begon onder een gevuld vlak:
        # zon en verbruik leken daardoor veel dichter bij elkaar dan ze waren.
        # De bovengrens is nu de piek, afgerond naar boven op hele kW, met de
        # helft als enige tussenstreep. Zonder die regel koos ApexCharts voor
        # de strook 0-5-10 bij een piek van 4,9 en lag de lijn in de
        # onderste helft.
        # De flex-basis laat de strook op een smal scherm (telefoon, één
        # kolom) onder de grote grafiek vallen in plaats van onleesbaar
        # smal te worden.
        - type: horizontal-stack
          card_mod:
            style: |
              #root { gap: 2px 16px !important; flex-wrap: wrap !important; align-items: flex-end !important; }
              #root > :first-child { flex: 1.7 1 320px !important; }
              #root > :last-child { flex: 1 1 210px !important; }
          cards:
            # 2 uur productie tegen huisverbruik
            - type: vertical-stack
              cards:
                - type: custom:button-card
                  tap_action:
                    action: navigate
                    navigation_path: "#ov-energie"
                  styles:
                    card:
                      - background: none
                      - border: none
                      - box-shadow: none
                      - padding: 0 2px
                    grid:
                      - grid-template-areas: '"regel"'
                    custom_fields:
                      regel:
                        - width: 100%
                  custom_fields:
                    regel: |
                      [[[
                        var stip = function(kleur, tekst){
                          return `<span style="display:inline-flex;align-items:center;gap:6px;white-space:nowrap"><span style="width:7px;height:7px;border-radius:50%;background:${kleur}"></span>${tekst}</span>`;
                        };
                        return `<span style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%;font-size:11.5px;color:var(--ov-ink-52)">
                          <span style="display:inline-flex;align-items:center;gap:12px">${stip('var(--ov-ok)', 'zon')}${stip('var(--ov-info-strong)', 'huis')}</span>
                          <span style="color:var(--ov-ink-38);white-space:nowrap">laatste 2 uur</span></span>`;
                      ]]]
                - type: custom:apexcharts-card
                  # Twee uur productie tegen verbruik: bij tien minuten netto
                  # verbruik zag je vooral ruis rond nul. Nu zie je de vorm van
                  # de ochtend: wanneer de zon aankwam, wanneer de batterij laadt.
                  graph_span: 2h
                  update_interval: 60s
                  card_mod:
                    style: |
                      ha-card { background: none !important; box-shadow: none !important; border: none !important; }
                  header:
                    show: false
                  apex_config:
                    chart:
                      height: 140
                      toolbar:
                        show: false
                    grid:
                      show: false
                      padding:
                        left: 14
                        right: 4
                        top: -8
                        bottom: 0
                    legend:
                      show: false
                    yaxis:
                      show: true
                      min: 0
                      max: |
                        EVAL:function(max) { return Math.max(1, Math.ceil(max)); }
                      tickAmount: 2
                      labels:
                        style:
                          colors: "var(--ov-ink-50)"
                          fontSize: "10px"
                        formatter: |
                          EVAL:function(v) { return (v === null || v === undefined) ? '' : Number(v).toFixed(1).replace('.', ',') + ' kW'; }
                    xaxis:
                      axisBorder:
                        show: false
                      axisTicks:
                        show: false
                      tooltip:
                        enabled: false
                      labels:
                        show: true
                        style:
                          colors: "var(--ov-ink-50)"
                          fontSize: "10px"
                        datetimeFormatter:
                          hour: "HH:mm"
                          minute: "HH:mm"
                    tooltip:
                      enabled: true
                      shared: true
                      x:
                        format: "HH:mm"
                  series:
                    - entity: sensor.zon_vermogen_nu
                      name: productie
                      type: area
                      color: "var(--ov-ok)"
                      curve: smooth
                      stroke_width: 2
                      opacity: 0.22
                      float_precision: 2
                      # Deze sensor staat in W, verbruik in kW; hier gelijktrekken.
                      #
                      # WAAROM DIT ZO OMSLACHTIG STAAT
                      # Hier stond `unit === 'W' ? x / 1000 : x`. Dat gaat mis zodra een
                      # punt geen getal is: op 2026-08-06 stond deze sensor drie keer
                      # even op `unavailable` (de omvormers vielen weg tijdens de
                      # Zigbee-storing), en één zo'n punt kwam ongedeeld in de grafiek.
                      # Gevolg: de y-as sprong naar 3000 en de echte curve van 4-6 kW lag
                      # plat tegen de bodem - de grafiek leek stuk terwijl de data klopte.
                      #
                      # Twee dingen daartegen: niet-numerieke punten worden `null` (die
                      # tekent apexcharts gewoon niet), en de deling gebeurt TENZIJ de
                      # eenheid expliciet kW is. Ontbreekt het attribuut - historische
                      # punten dragen het niet altijd mee - dan delen we dus, en dat is
                      # hier de goede gok: dit is de som van twee omvormers die
                      # allebei in W meten.
                      #
                      # Sinds 27-08-2026 is dat `sensor.zon_vermogen_nu` en niet meer
                      # de min_max-som: die gaf `unknown` zodra één omvormer wegviel,
                      # en dat waren de gaten in deze grafiek.
