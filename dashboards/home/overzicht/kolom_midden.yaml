                    const t = new Date(e.end).getTime();
                    const p = Number(e.value);
                    // ApexCharts centreert een kolom op zijn timestamp; plotten op
                    // het midden van [start, end) laat de balk exact zijn eigen
                    // blok dekken in plaats van een half blok ernaast.
                    const x = isFinite(t) ? (s + t) / 2 : s;
                    return [x, (!isNaN(p) && niveau(e.level) === NIVEAU) ? p : null];
                  })
                  .filter((d) => isFinite(d[0]))
                  .sort((a, b) => a[0] - b[0]);
            - entity: sensor.slimhuys_zonneplan_prijzen_vandaag_kwartier
              name: piek
              type: column
              color: "#D85A30"
              opacity: 1
              stroke_width: 1
              float_precision: 3
              data_generator: |
                const NIVEAU = 'peak';
                // SlimHuys geeft per blok een start EN een end, dus de blokbreedte
                // hoeft niet uit de onderlinge afstand geraden te worden. Daarmee
                // werkt dit voor kwartieren net zo goed als voor uren, en zelfs
                // voor de dag waarop het overschakelt.
                const blokken = (ent, key) => (ent && ent.attributes && ent.attributes[key]) || [];
                const st = (typeof hass !== 'undefined' && hass.states) ? hass.states : {};
                const vandaag = blokken(entity, 'raw_today').length
                  ? blokken(entity, 'raw_today')
                  : blokken(st['sensor.slimhuys_zonneplan_prijzen_vandaag'], 'raw_today');
                // very_high is door peak vervangen maar kan nog langskomen; een
                // blok zonder (bekend) niveau valt op gemiddeld in plaats van
                // als gat in de grafiek.
                const BEKEND = ['very_low', 'low', 'medium', 'high', 'peak'];
                const niveau = (l) => l === 'very_high' ? 'peak' : (BEKEND.indexOf(l) >= 0 ? l : 'medium');
                // Ook de null-punten blijven staan: bij een gestapelde grafiek
                // moeten alle series exact dezelfde x-waarden hebben.
                return vandaag
                  .concat(blokken(st['sensor.slimhuys_zonneplan_prijzen_morgen'], 'raw_tomorrow'))
                  .map((e) => {
                    const s = new Date(e.start).getTime();
                    const t = new Date(e.end).getTime();
                    const p = Number(e.value);
                    // ApexCharts centreert een kolom op zijn timestamp; plotten op
                    // het midden van [start, end) laat de balk exact zijn eigen
                    // blok dekken in plaats van een half blok ernaast.
                    const x = isFinite(t) ? (s + t) / 2 : s;
                    return [x, (!isNaN(p) && niveau(e.level) === NIVEAU) ? p : null];
                  })
                  .filter((d) => isFinite(d[0]))
                  .sort((a, b) => a[0] - b[0]);
        # samenvatting laagste / hoogste per dag + kleurlegenda
        #
        # Eén custom_field in plaats van twee kolommen (dagen | legenda): een
        # grid van `1fr auto` kan niet afbreken, dus op een telefoon schoof de
        # legenda over de prijzen heen. Als flexbox met flex-wrap staat het op
        # een breed scherm nog steeds links/rechts op één regel, en zakt de
        # legenda eronder zodra het niet past.
        - type: custom:button-card
          tap_action:
            action: navigate
            navigation_path: "#ov-energie"
          styles:
            card:
              - background: none
              - border: none
              - box-shadow: none
              - padding: 6px 2px 0 2px
            grid:
              - grid-template-areas: '"regel"'
            custom_fields:
              regel:
                - width: 100%
                - justify-self: stretch
          custom_fields:
            regel: |
              [[[
                var blok = function(eid, key){ var e = states[eid]; return (e && e.attributes && e.attributes[key]) || []; };
                var extremen = function(eid, key){
                  var raw = blok(eid, key);
                  // vandaag: kwartierblokken hebben voorrang op de uurblokken
                  if(key === 'raw_today') {
                    var kw = blok('sensor.slimhuys_zonneplan_prijzen_vandaag_kwartier', 'raw_today');
                    if(kw.length) raw = kw;
                  }
                  var lo = null, hi = null;
                  raw.forEach(function(e){
                    var d = new Date(e.start), v = Number(e.value);
                    if(isNaN(d.getTime()) || isNaN(v)) return;
                    if(lo === null || v < lo.p) lo = {p: v, d: d};
                    if(hi === null || v > hi.p) hi = {p: v, d: d};
                  });
                  return lo === null ? null : {lo: lo, hi: hi};
                };
                var klok = function(d){ return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2); };
                // Op een breed scherm paste alles op één regel, en stond dus ook
                // alles even dicht op elkaar: prijs, tijd, laag en hoog liepen
                // in elkaar over als één rij cijfers. De afstanden zijn nu
                // getrapt - tijd hoort bij zijn prijs (4px), laag en hoog staan
                // los (14px), vandaag en morgen het verst uit elkaar (34px) -
                // en een pijltje zegt wat eerst alleen de kleur zei.
                var f = function(x, col, pijl){
                  return `<span style="display:inline-flex;align-items:baseline;gap:4px;white-space:nowrap">`
                    + `<span style="color:${col};font-size:10px;opacity:0.85">${pijl}</span>`
                    + `<span style="color:${col};font-weight:600">€ ${x.p.toFixed(3).replace('.',',')}</span>`
                    + `<span style="color:var(--ov-ink-32);font-size:11px">${klok(x.d)}</span></span>`;
                };
                // nowrap per dagdeel, zodat een regel hoogstens tussen "vandaag"
                // en "morgen" breekt en niet middenin een prijs.
                // Is de dag als geheel duur? SlimHuys zet het daggemiddelde af
                // tegen de mediaan van de afgelopen 30 dagen (dagniveau, sinds
                // integratie v1.15.0). Laag/hoog hiernaast zeggen alleen wanneer
                // het binnen die dag het goedkoopst is; op een dure dag is ook
                // dat moment duur. Zelfde niveaus en kleuren als de balken.
                var DAG = {very_low:['zeer goedkope dag','#9FE1CB'], low:['goedkope dag','#5DCAA5'],
                           medium:['gemiddelde dag','#FAC775'], high:['dure dag','#EF9F27'],
                           very_high:['zeer dure dag','#D85A30'], peak:['zeer dure dag','#D85A30']};
                var dagniveau = function(eid){
                  var s = states[eid], d = s ? DAG[s.state] : null;
                  if(!d) return '';
                  var gem = s.attributes ? Number(s.attributes.average_eur_per_kwh) : NaN;
                  var med = s.attributes ? Number(s.attributes.reference_median_eur_per_kwh) : NaN;
                  var tip = (isFinite(gem) && isFinite(med))
                    ? ` title="gemiddeld € ${gem.toFixed(3).replace('.',',')} · mediaan 30 dagen € ${med.toFixed(3).replace('.',',')}"` : '';
                  return `<span${tip} style="display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:11px;color:var(--ov-ink-65)"><span style="width:7px;height:7px;border-radius:50%;background:${d[1]}"></span>${d[0]}</span>`;
                };
                var deel = function(lbl, x, niveau){
                  var kop = `<span style="color:var(--ov-ink-45);font-size:11px;letter-spacing:0.3px">${lbl}</span>`;
                  var inhoud = x
                    ? `${kop}${niveau}${f(x.lo,'var(--ov-ok)','▼')}${f(x.hi,'var(--ov-bad)','▲')}`
                    : `${kop}<span style="color:var(--ov-ink-30)">nog niet bekend</span>`;
                  // Met het dagniveau erbij is een dag te breed voor een
                  // telefoon; hij mag dan breken, maar alleen tussen de delen
                  // (die zijn elk nowrap), nooit midden in een prijs.
                  return `<span style="display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;white-space:nowrap">${inhoud}</span>`;
                };
                var vandaag = extremen('sensor.slimhuys_zonneplan_prijzen_vandaag', 'raw_today');
                var morgen = extremen('sensor.slimhuys_zonneplan_prijzen_morgen', 'raw_tomorrow');
                var dagen = `<span style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 34px;font-size:12.5px">`
                  + deel('vandaag', vandaag, dagniveau('sensor.meterkast_slimhuys_zonneplan_dagniveau_vandaag'))
                  + deel('morgen', morgen, dagniveau('sensor.meterkast_slimhuys_zonneplan_dagniveau_morgen'))
                  + `</span>`;
                var dot = function(c, lbl){ return `<span style="display:inline-flex;align-items:center;gap:5px;white-space:nowrap"><span style="width:7px;height:7px;border-radius:50%;background:${c}"></span>${lbl}</span>`; };
                // De niveaus en kleuren van slimhuys.nl: elk blok afgezet tegen
                // de afgelopen 30 dagen.
                var legenda = `<span style="display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:11.5px;color:var(--ov-ink-52)">${dot('#9FE1CB','zeer laag')}${dot('#5DCAA5','laag')}${dot('#FAC775','gemiddeld')}${dot('#EF9F27','hoog')}${dot('#D85A30','piek')}</span>`;
                // space-between en niet margin-left:auto: zodra de legenda naar
                // een eigen regel zakt, hoort hij daar links te beginnen.
                return `<span style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 24px;width:100%">${dagen}${legenda}</span>`;
              ]]]
        # tips: goedkoopste blok, negatieve prijs, en hoe fijn de prijzen zijn
        - type: custom:button-card
          tap_action:
            action: navigate
            navigation_path: "#ov-energie"
          styles:
            card:
              - background: none
              - border: none
              - box-shadow: none
              - padding: 2px 2px 0 2px
            grid:
              - grid-template-areas: '"regel"'
            custom_fields:
              regel:
                - width: 100%
                - justify-self: stretch
          custom_fields:
            # Ook hier één veld in plaats van twee kolommen: de tip links en het
            # prijsinterval rechts stonden in een `1fr auto`-grid en overlapten
            # op een telefoon. Nu breekt het naar twee regels als het niet past.
            regel: |
              [[[
                var klok = function(d){ return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2); };
                // Safari struikelt over "2026-08-01 13:00"; met een T ertussen
                // parseert het overal. Lukt het niet, dan tonen we de tekst zelf.
                var lees = function(eid){
                  var s = states[eid];
                  if(!s || ['geen','none','unknown','unavailable',''].indexOf(String(s.state).toLowerCase()) >= 0) return null;
                  var d = new Date(String(s.state).replace(' ', 'T'));
                  return isNaN(d.getTime()) ? {tekst: s.state} : {d: d};
                };
                // Zelfde als `lees`, maar voor een tijdstip dat als attribuut
                // binnenkomt in plaats van als state (next_negative_start).
                var leesWaarde = function(v){
                  if(v === null || v === undefined) return null;
                  if(['geen','none','unknown','unavailable',''].indexOf(String(v).toLowerCase()) >= 0) return null;
                  var d = new Date(String(v).replace(' ', 'T'));
                  return isNaN(d.getTime()) ? {tekst: String(v)} : {d: d};
                };
                var wanneer = function(x){
                  if(!x) return '';
                  if(!x.d) return x.tekst;
                  return (new Date().toDateString() === x.d.toDateString() ? '' : 'morgen ') + klok(x.d);
                };
                var ico = function(n, extra){ return `<ha-icon icon="${n}" style="--mdc-icon-size:14px;width:14px;height:14px;vertical-align:middle;${extra||'opacity:0.45'}"></ha-icon>`; };
                var delen = [];
                // De "goedkoopste blok"-tip die hier stond is 2026-08-16
                // vervallen: hetzelfde moment staat al in de titel van deze
                // kaart ("laagste 14:30") én als LADEN-beugel op de tijdlijn.
                // Drie keer dezelfde mededeling was er twee te veel.
                // TWEE SENSOREN DIE BIJNA HETZELFDE HETEN
                //   ..._negatieve_all_in_prijs_nu  -> markt + inkoop +
                //      energiebelasting + btw. Dít is wat je betaalt, en alleen
                //      hierbij word je betaald om stroom te gebruiken.
                //   ..._negatieve_prijs_nu         -> de kale marktprijs.
                // Op 6 augustus 2026 stond de tweede op `on` terwijl het
                // totaaltarief 0,1277 was; de kop zei toen "prijs is nu
                // negatief" en dat was gewoon onwaar. Sindsdien levert SlimHuys
                // de all-in variant, dus er valt hier niets meer zelf uit te
                // rekenen - `total_now` staat als attribuut op de sensor.
                var allinNu = states['binary_sensor.meterkast_slimhuys_zonneplan_negatieve_all_in_prijs_nu'];
                var epexNu = states['binary_sensor.meterkast_slimhuys_zonneplan_negatieve_prijs_nu'];
                var euro = function(v){ return (v === null || v === undefined || isNaN(Number(v)))
                  ? null : '€ ' + Number(v).toFixed(3).replace('.', ','); };
                var straksAllin = leesWaarde((allinNu && allinNu.attributes) ? allinNu.attributes.next_negative_start : null);
                var straks = lees('sensor.slimhuys_zonneplan_volgende_negatieve_prijs');
                if(allinNu && allinNu.state === 'on') {
                  delen.push(`<span style="color:var(--ov-ok)">${ico('mdi:flash', 'color:var(--ov-ok)')} prijs is nu negatief</span>`);
                } else if(straksAllin) {
                  // Het moment waarop je wél betaald krijgt; dat weegt zwaarder
                  // dan een marktprijs die nu toevallig onder nul staat.
                  delen.push(`<span style="color:var(--ov-ok)">${ico('mdi:flash-outline', 'color:var(--ov-ok)')} negatief vanaf <span style="color:var(--primary-text-color)">${wanneer(straksAllin)}</span></span>`);
                } else if(epexNu && epexNu.state === 'on') {
                  // Goedkoopste moment van de dag, maar je betaalt nog steeds -
                  // dus geen groen en niet "negatief" zonder meer.
                  var nog = euro(epexNu.attributes ? epexNu.attributes.total_now : null);
                  delen.push(`<span>${ico('mdi:flash-outline')} marktprijs negatief${nog ? ` · je betaalt nog <span style="color:var(--primary-text-color)">${nog}</span>` : ''}</span>`);
                } else if(straks) {
                  delen.push(`<span>${ico('mdi:flash-outline')} marktprijs negatief vanaf <span style="color:var(--primary-text-color)">${wanneer(straks)}</span></span>`);
                }
                var tips = delen.length
                  ? `<span style="display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:12px;color:var(--ov-ink-55)">${delen.map(function(d){ return `<span style="white-space:nowrap">${d}</span>`; }).join('<span style="opacity:0.25">·</span>')}</span>`
                  : '';
                // hoe fijn de prijsblokken zijn (kwartier of uur)
                var pv = states['sensor.slimhuys_zonneplan_prijzen_vandaag'];
                var m = pv && pv.attributes ? Number(pv.attributes.granularity_minutes) : NaN;
                var gran = '';
                if(isFinite(m) && m > 0) {
                  var lbl = m === 15 ? 'kwartierprijzen' : (m === 60 ? 'uurprijzen' : `prijzen per ${m} min`);
                  // margin-left:auto en niet space-between: zonder tip blijft het
                  // label dan alsnog rechts staan in plaats van links.
                  gran = `<span style="margin-left:auto;white-space:nowrap;font-size:11.5px;color:var(--ov-ink-40)">${lbl}</span>`;
                }
                if(!tips && !gran) return '';
                return `<span style="display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;width:100%">${tips}${gran}</span>`;
              ]]]
