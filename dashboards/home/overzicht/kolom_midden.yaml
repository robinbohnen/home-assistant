        # samenvatting laagste / hoogste per dag + kleurlegenda (één regel)
        - type: custom:button-card
          tap_action:
            action: navigate
            navigation_path: "#ov-energie"
          styles:
            card:
              - background: none
              - border: none
              - box-shadow: none
              - padding: 6px 2px 0 2px
            grid:
              - grid-template-areas: '"dagen key"'
              - grid-template-columns: 1fr auto
              - align-items: center
              - column-gap: 12px
            custom_fields:
              dagen:
                - justify-self: start
              key:
                - justify-self: end
          custom_fields:
            dagen: |
              [[[
                var blok = function(eid, key){ var e = states[eid]; return (e && e.attributes && e.attributes[key]) || []; };
                var extremen = function(eid, key){
                  var raw = blok(eid, key);
                  // vandaag: kwartierblokken hebben voorrang op de uurblokken
                  if(key === 'raw_today') {
                    var kw = blok('sensor.slimhuys_zonneplan_prijzen_vandaag_kwartier', 'raw_today');
                    if(kw.length) raw = kw;
                  }
                  var lo = null, hi = null;
                  raw.forEach(function(e){
                    var d = new Date(e.start), v = Number(e.value);
                    if(isNaN(d.getTime()) || isNaN(v)) return;
                    if(lo === null || v < lo.p) lo = {p: v, d: d};
                    if(hi === null || v > hi.p) hi = {p: v, d: d};
                  });
                  return lo === null ? null : {lo: lo, hi: hi};
                };
                var klok = function(d){ return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2); };
                var f = function(x, col){ return `<span style="color:${col}">€ ${x.p.toFixed(3).replace('.',',')}</span><span style="color:rgba(255,255,255,0.35)"> ${klok(x.d)}</span>`; };
                var deel = function(lbl, x){
                  if(!x) return `<span style="color:rgba(255,255,255,0.55)">${lbl}</span> <span style="color:rgba(255,255,255,0.3)">nog niet bekend</span>`;
                  return `<span style="color:rgba(255,255,255,0.55)">${lbl}</span> ${f(x.lo,'#4ade80')} <span style="color:rgba(255,255,255,0.2)">·</span> ${f(x.hi,'#ef4444')}`;
                };
                var vandaag = extremen('sensor.slimhuys_zonneplan_prijzen_vandaag', 'raw_today');
                var morgen = extremen('sensor.slimhuys_zonneplan_prijzen_morgen', 'raw_tomorrow');
                return `<span style="display:flex;align-items:center;gap:14px;font-size:12px;white-space:nowrap">${deel('vandaag', vandaag)}${deel('morgen', morgen)}</span>`;
              ]]]
            key: |
              [[[
                var dot = function(c, lbl){ return `<span style="display:inline-flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:50%;background:${c}"></span>${lbl}</span>`; };
                return `<span style="display:flex;align-items:center;gap:10px;font-size:11.5px;color:rgba(255,255,255,0.52)">${dot('#4ade80','goedkoop')}${dot('#f59e0b','gemiddeld')}${dot('#ef4444','duur')}</span>`;
              ]]]
        # tips: goedkoopste blok, negatieve prijs, en hoe fijn de prijzen zijn
        - type: custom:button-card
          tap_action:
            action: navigate
            navigation_path: "#ov-energie"
          styles:
            card:
              - background: none
              - border: none
              - box-shadow: none
              - padding: 2px 2px 0 2px
            grid:
              - grid-template-areas: '"tips gran"'
              - grid-template-columns: 1fr auto
              - align-items: center
              - column-gap: 12px
            custom_fields:
              tips:
                - justify-self: start
              gran:
                - justify-self: end
          custom_fields:
            tips: |
              [[[
                var klok = function(d){ return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2); };
                // Safari struikelt over "2026-08-01 13:00"; met een T ertussen
                // parseert het overal. Lukt het niet, dan tonen we de tekst zelf.
                var lees = function(eid){
                  var s = states[eid];
                  if(!s || ['geen','none','unknown','unavailable',''].indexOf(String(s.state).toLowerCase()) >= 0) return null;
                  var d = new Date(String(s.state).replace(' ', 'T'));
                  return isNaN(d.getTime()) ? {tekst: s.state} : {d: d};
                };
                // Zelfde als `lees`, maar voor een tijdstip dat als attribuut
                // binnenkomt in plaats van als state (next_negative_start).
                var leesWaarde = function(v){
                  if(v === null || v === undefined) return null;
                  if(['geen','none','unknown','unavailable',''].indexOf(String(v).toLowerCase()) >= 0) return null;
                  var d = new Date(String(v).replace(' ', 'T'));
                  return isNaN(d.getTime()) ? {tekst: String(v)} : {d: d};
                };
                var wanneer = function(x){
                  if(!x) return '';
                  if(!x.d) return x.tekst;
                  return (new Date().toDateString() === x.d.toDateString() ? '' : 'morgen ') + klok(x.d);
                };
                var ico = function(n, extra){ return `<ha-icon icon="${n}" style="--mdc-icon-size:14px;vertical-align:-3px;${extra||'opacity:0.45'}"></ha-icon>`; };
                var delen = [];
                var blok = lees('sensor.slimhuys_zonneplan_goedkoopste_blok_start');
                if(blok) {
                  var p = states['sensor.slimhuys_zonneplan_goedkoopste_blok_gemiddelde'];
                  var pTxt = p && !isNaN(Number(p.state)) ? ` <span style="color:#4ade80">€ ${Number(p.state).toFixed(3).replace('.',',')}</span>` : '';
                  delen.push(`<span>${ico('mdi:clock-check-outline')} goedkoopste blok <span style="color:white">${wanneer(blok)}</span>${pTxt}</span>`);
                }
                // TWEE SENSOREN DIE BIJNA HETZELFDE HETEN
                //   ..._negatieve_all_in_prijs_nu  -> markt + inkoop +
                //      energiebelasting + btw. Dít is wat je betaalt, en alleen
                //      hierbij word je betaald om stroom te gebruiken.
                //   ..._negatieve_prijs_nu         -> de kale marktprijs.
                // Op 6 augustus 2026 stond de tweede op `on` terwijl het
                // totaaltarief 0,1277 was; de kop zei toen "prijs is nu
                // negatief" en dat was gewoon onwaar. Sindsdien levert SlimHuys
                // de all-in variant, dus er valt hier niets meer zelf uit te
                // rekenen - `total_now` staat als attribuut op de sensor.
                var allinNu = states['binary_sensor.meterkast_slimhuys_zonneplan_negatieve_all_in_prijs_nu'];
                var epexNu = states['binary_sensor.meterkast_slimhuys_zonneplan_negatieve_prijs_nu'];
                var euro = function(v){ return (v === null || v === undefined || isNaN(Number(v)))
                  ? null : '€ ' + Number(v).toFixed(3).replace('.', ','); };
                var straksAllin = leesWaarde((allinNu && allinNu.attributes) ? allinNu.attributes.next_negative_start : null);
                var straks = lees('sensor.slimhuys_zonneplan_volgende_negatieve_prijs');
                if(allinNu && allinNu.state === 'on') {
                  delen.push(`<span style="color:#4ade80">${ico('mdi:flash', 'color:#4ade80')} prijs is nu negatief</span>`);
                } else if(straksAllin) {
                  // Het moment waarop je wél betaald krijgt; dat weegt zwaarder
                  // dan een marktprijs die nu toevallig onder nul staat.
                  delen.push(`<span style="color:#4ade80">${ico('mdi:flash-outline', 'color:#4ade80')} negatief vanaf <span style="color:white">${wanneer(straksAllin)}</span></span>`);
                } else if(epexNu && epexNu.state === 'on') {
                  // Goedkoopste moment van de dag, maar je betaalt nog steeds -
                  // dus geen groen en niet "negatief" zonder meer.
                  var nog = euro(epexNu.attributes ? epexNu.attributes.total_now : null);
                  delen.push(`<span>${ico('mdi:flash-outline')} marktprijs negatief${nog ? ` · je betaalt nog <span style="color:white">${nog}</span>` : ''}</span>`);
                } else if(straks) {
                  delen.push(`<span>${ico('mdi:flash-outline')} marktprijs negatief vanaf <span style="color:white">${wanneer(straks)}</span></span>`);
                }
                if(!delen.length) return '';
                return `<span style="display:flex;align-items:center;gap:10px;font-size:12px;color:rgba(255,255,255,0.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${delen.join('<span style="opacity:0.25">·</span>')}</span>`;
              ]]]
            gran: |
              [[[
                var e = states['sensor.slimhuys_zonneplan_prijzen_vandaag'];
                var m = e && e.attributes ? Number(e.attributes.granularity_minutes) : NaN;
                if(!isFinite(m) || m <= 0) return '';
                var lbl = m === 15 ? 'kwartierprijzen' : (m === 60 ? 'uurprijzen' : `prijzen per ${m} min`);
                return `<span style="font-size:11.5px;color:rgba(255,255,255,0.4)">${lbl}</span>`;
              ]]]
  # VEELGEBRUIKERS
  - type: custom:mod-card
    card_mod:
      style: |
        ha-card {
          background: var(--ov-panel-bg) !important;
          border: var(--ov-panel-border) !important;
          border-radius: var(--ov-panel-radius) !important;
          box-shadow: none !important;
          padding: var(--ov-panel-padding) !important;
        }
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          template: ov_title
          variables:
            title: VEELGEBRUIKERS
        - type: custom:auto-entities
          show_empty: false
          card:
            type: vertical-stack
          card_param: cards
          filter:
            include:
              - domain: sensor
                name: "*Vermogen*"
                options:
                  type: custom:button-card
                  template: ov_bar
                  variables:
                    scale: auto
                  name: "[[[ return entity.attributes.friendly_name.replace(/ ?vermogen/i, '').replace(/ ?stopcontact/i, '').replace(/\\s+/g, ' ').trim(); ]]]"
                  tap_action:
                    action: more-info
            exclude:
              - name: Inverter*
              - name: "*Zonnepanel*"
              - name: "*zonneplan*"
              - name: "*SlimHuys*"
              - name: "*GoodWe*"
              - name: "*mvormer*"
              - state: "off"
              - state: unavailable
              - state: unknown
              - state: "0"
              - hidden_by: user
          sort:
            method: state
            numeric: true
            reverse: true
            count: 5
