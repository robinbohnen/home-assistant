              ha-card { background: none !important; box-shadow: none !important; border: none !important; }
          header:
            show: false
          apex_config:
            chart:
              height: 155
              toolbar:
                show: false
            grid:
              show: false
              padding:
                left: 14
                right: 4
                top: -8
                bottom: 0
            legend:
              show: false
            yaxis:
              show: true
              tickAmount: 3
              labels:
                style:
                  colors: "var(--ov-ink-50)"
                  fontSize: "10px"
                formatter: |
                  EVAL:function(v) { return (v === null || v === undefined) ? '' : '€ ' + Number(v).toFixed(2).replace('.', ','); }
            xaxis:
              axisBorder:
                show: false
              axisTicks:
                show: false
