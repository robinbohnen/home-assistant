            action: navigate
            navigation_path: "#ov-energie"
          variables:
            title: STROOMPRIJS
          custom_fields:
            b: |
              [[[
                var p = states['sensor.slimhuys_zonneplan_huidige_prijs'];
                var nu = p && !isNaN(Number(p.state)) ? Number(p.state) : null;
                // Het tariefniveau komt uit SlimHuys zelf, zodat deze stip
                // hetzelfde zegt als de pil in de header. Kleuren van
                // slimhuys.nl, gelijk aan de balken hieronder.
                var g = states['sensor.slimhuys_zonneplan_tariefniveau_nu'];
                var col = {very_low:'#9FE1CB', low:'#5DCAA5', medium:'#FAC775',
                           high:'#EF9F27', very_high:'#D85A30',
                           peak:'#D85A30'}[g ? g.state : ''] || 'var(--ov-ink-60)';
                // Kwartierblokken als de integratie ze levert, anders de uurblokken.
                var blok = function(eid){ var e = states[eid]; return (e && e.attributes && e.attributes.raw_today) || []; };
                var kw = blok('sensor.slimhuys_zonneplan_prijzen_vandaag_kwartier');
                var raw = kw.length ? kw : blok('sensor.slimhuys_zonneplan_prijzen_vandaag');
                // Goedkoopste blok dat nog komt, inclusief het blok dat nu loopt.
                var now = new Date();
                var best = null;
                raw.forEach(function(e){
                  var d = new Date(e.start), t = new Date(e.end), v = Number(e.value);
                  if(isNaN(d.getTime()) || isNaN(v)) return;
                  if(!isNaN(t.getTime()) && t <= now) return;
                  if(best === null || v < best.p) best = {p: v, d: d};
                });
                var nuTxt = nu !== null ? '€ ' + nu.toFixed(3).replace('.',',') : '—';
                var klok = function(d){ return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2); };
                var tip = best ? ` · laagste ${klok(best.d)}` : '';
                // KOSTEN VANDAAG, MET DE AFNAME ERBIJ (3 oktober 2026)
                // Stond als losse pil onder de energiegrafieken, zonder iets
                // om het aan af te meten. Het bedrag is afname - teruglevering
                // + gas (Electricity.yaml); de kWh ernaast is alleen de
                // stroomafname van het net, vandaar het woord erbij. Groen
                // als de dag geld oplevert, zoals de pil dat deed.
                var k = states['sensor.total_costs_today_calculated'];
                var a = states['sensor.meterkast_slimhuys_zonneplan_verbruik_vandaag'];
                var kosten = '';
                if(k && !isNaN(Number(k.state))){
                  var kv = Number(k.state);
                  var kwh = (a && !isNaN(Number(a.state))) ? ` · ${Number(a.state).toFixed(1).replace('.',',')} kWh afname` : '';
                  kosten = `<span style="white-space:nowrap"> · vandaag <span style="font-weight:600;color:${kv < 0 ? 'var(--ov-ok)' : 'var(--primary-text-color)'}">€ ${kv.toFixed(2).replace('.',',')}</span>${kwh}</span>`;
                }
