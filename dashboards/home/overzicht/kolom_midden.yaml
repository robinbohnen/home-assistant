# Middenkolom: energie nu, stroomprijs, veelgebruikers.
type: vertical-stack
card_mod:
  style: |
    #root { gap: 16px !important; }
cards:
  # ENERGIE NU
  - type: custom:mod-card
    card_mod:
      style: |
        ha-card {
          background: var(--ov-panel-bg) !important;
          border: var(--ov-panel-border) !important;
          border-radius: var(--ov-panel-radius) !important;
          box-shadow: none !important;
          padding: var(--ov-panel-padding) !important;
        }
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          template: ov_title
          tap_action:
            action: navigate
            navigation_path: "#ov-energie"
          variables:
            title: ENERGIE · NU
          custom_fields:
            b: |
              [[[
                var g = states['sensor.slimhuys_zonneplan_tariefniveau_nu'];
                var solar = states['sensor.zon_vermogen_nu'];
                // /low/ vangt zowel low als very_low; SlimHuys kent vijf niveaus.
                var cheap = g && /low/.test(g.state);
                // Deze sensor staat in W (zie het prod-veld hieronder). De oude
                // drempel 0,1 was als kW bedoeld en maakte "groen" al waar bij
                // het minste schemerlicht; 100 W is pas een echte bijdrage.
                var su = solar && solar.attributes ? solar.attributes.unit_of_measurement : null;
                var sw = solar && !isNaN(Number(solar.state)) ? Number(solar.state) * (su === 'kW' ? 1000 : 1) : 0;
                var green = sw > 100;
                var duur = g && /high/.test(g.state);
                // Het tarief wint van "groen": met alleen een zon-test stond hier
                // op het duurste moment van de dag een groene "stroom is groen",
                // wat leest als "goed moment om iets aan te zetten". Zelfde
                // driedeling als de kopregel op dashboards/home/nest_hub.yaml.
                var txt, col;
                if(cheap){
                  txt = green ? 'stroom is groen en goedkoop' : 'stroom is goedkoop';
                  col = '#4ade80';
                } else if(duur){
                  txt = green ? 'stroom is groen maar duur' : 'stroom is duur';
                  col = green ? '#f59e0b' : '#ef4444';
                } else {
                  txt = green ? 'stroom is groen' : 'normaal tarief';
                  col = green ? '#4ade80' : 'rgba(255,255,255,0.6)';
                }
                return `<span style="display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:${col}"><span style="width:8px;height:8px;border-radius:50%;background:${col}"></span>${txt}</span>`;
              ]]]
        # Energiestroom: zon, net en accu links, het huis rechts, met
        # geanimeerde lijnen die laten zien wat er nú loopt en welke kant op.
        # Verving op 2026-08-16 de rij van vier losse getallen; alle vier de
        # waarden staan er nog (zon/net/accu links, verbruik bij het huis),
        # maar de richting hoef je niet meer uit voortekens af te leiden.
        #
        # VASTE TEKST, REKBARE LIJNEN
        # Eerste versie was één SVG met de tekst erin; die schaalde alles mee
        # met de kolombreedte en op het wandpaneel werden de cijfers dan
        # groter dan de rest van het paneel ("verhoudingen zoek", Robin
        # 16-08-2026). Nu is het een grid van drie kolommen: tekst links en
        # rechts in gewone pixels (zelfde maten als de andere panelen), en
        # alleen het lijnenveld ertussen is SVG met preserveAspectRatio=none -
        # dat mag uitrekken, want het bevat niets dan de drie paden.
        # vector-effect=non-scaling-stroke houdt de lijndikte daarbij op 2px.
        # De dash-animatie is SMIL (<animate>), geen CSS: die werkt ook binnen
        # de shadow-DOM van button-card zonder <style>-tag.
        #
        # KLEUR VOLGT DE BRON, RICHTING VOLGT DE ANIMATIE
        # zon groen, net blauw (de verbruikskleur van de grafiek eronder),
        # accu wit. Bij teruglevering blijft de netlijn dus blauw en loopt de
        # animatie naar het net toe; alleen het getal kleurt groen, net als op
        # de oude tegel. Gecontroleerd met de dataviz-validator: CVD- en
        # normaalzicht-afstanden en contrast op deze achtergrond zijn ruim
        # voldoende, en elke lijn heeft zijn eigen tekstlabel.
        #
        # PER SET, NIET SAMEN (ZW/O-percentages, overgenomen van de oude
        # productietegel): één percentage over beide omvormers haalt nooit
        # 100% - de sets pieken op verschillende momenten. Per set gedeeld
        # door zijn eigen capaciteit klopt het wel, en zie je de zuidwest op
        # een heldere middag ook echt klippen (geel bij >= 98). ZW =
        # achtertuin (sensor heet `overkapping`), O = zolder; plafonds uit de
        # capaciteitssensoren, terugval 5/3 kW.
        #
        # ACCU: ONDER 15 W GEBEURT ER NIETS - dat is de Marstek zelf (rust-
        # verbruik van de elektronica; band gemeten 15-16 aug 2026: 65% van
        # alle metingen zat op 0-15 W). Dan dus "standby" en geen animatie,
        # anders leek de accu twee derde van de dag leeg te lopen.
        #
        # button-card rendert alleen opnieuw als zijn entity verandert; de
        # triggers_update-lijst dekt de andere bronnen.
        - type: custom:button-card
          entity: sensor.live_energieverbruik_totaal
          triggers_update:
            - sensor.zon_vermogen_nu
            - sensor.electricity_meter_energieverbruik
            - sensor.lilygo_rs485_marstek_battery_power
            - sensor.lilygo_rs485_marstek_battery_state_of_charge
          show_icon: false
          show_name: false
          show_state: false
          tap_action:
            action: navigate
            navigation_path: "#ov-energie"
          styles:
            card:
              - background: none
              - border: none
              - box-shadow: none
              - padding: 6px 2px 8px 2px
            grid:
              - grid-template-areas: '"flow"'
            custom_fields:
              flow:
                - width: 100%
          custom_fields:
            flow: |
              [[[
                // ---------- waarden (zelfde regels als de oude vier tegels) ----------
                var num = function(id){ var s = states[id];
                  return (s && !isNaN(Number(s.state))) ? Number(s.state) : null; };
                // zon: sensor staat in W tenzij hij expliciet kW zegt
                var zonS = states['sensor.zon_vermogen_nu'];
                var zonKw = null;
                if(zonS && !isNaN(Number(zonS.state))){
                  var zu = zonS.attributes.unit_of_measurement || '';
                  zonKw = (zu === 'kW') ? Number(zonS.state) : Number(zonS.state) / 1000;
                }
                // netto: negatief = teruglevering; ruis rond nul plat slaan
                var netto = num('sensor.live_energieverbruik_totaal');
                if(netto !== null && Math.abs(netto) < 0.005) netto = 0;
                var accuW = num('sensor.lilygo_rs485_marstek_battery_power');
                // VERBRUIK VAN HET HUIS ZELF - NIET DE METERSTAND
                // Hier stond `sensor.electricity_meter_energieverbruik`, en dat
                // is de netafname: exact dezelfde bron als de netknoop hierboven.
                // Op 18 augustus 2026 stond er daardoor twee keer 0,49 kW op één
                // kaart terwijl de zon 0,25 kW leverde en het huis dus 0,74 kW
                // trok. Bij teruglevering is het erger: dan wijst de huisknoop 0
                // aan terwijl de vaatwasser draait.
                // Het huis is wat er binnenkomt: net + zon, min wat de accu
                // wegzet (laden is positief, ontladen negatief, dus aftrekken).
                var verbruik = (netto === null || zonKw === null) ? null
                             : Math.max(0, netto + zonKw - (accuW === null ? 0 : accuW / 1000));
                var accuPv = accuW === null ? null : Math.round(accuW);
                var soc = num('sensor.lilygo_rs485_marstek_battery_state_of_charge');
                var accuMode = accuPv === null ? ''
                             : (Math.abs(accuPv) <= 15 ? 'standby'
                             : (accuPv < 0 ? 'ontlaadt' : 'laadt'));
                // De percentages lazen tot 27-08-2026 de ruwe omvormersensoren en
                // verdwenen daardoor bij elke hik van de integratie (elf keer op
                // die dag). Ze komen nu uit de attributen `zw`/`o` van
                // sensor.zon_vermogen_nu, die een uitval tot tien minuten
                // vasthoudt - zie packages/2 - Second Floor/Attic/Solarpanels.yaml.
                var zonAttr = (states['sensor.zon_vermogen_nu'] || {}).attributes || {};
                var pct = function(vermogen, capId, terugval){
                  var p = (vermogen === undefined || vermogen === null || isNaN(Number(vermogen)))
                        ? null : Number(vermogen);
                  var c = num(capId);
                  c = (c === null ? terugval : c) * 1000;
                  return (p === null || c <= 0) ? null : Math.round(p / c * 100);
                };
                var zw = pct(zonAttr.zw, 'sensor.inverter_kroon_18_achtertuin_capacity', 5);
                var oo = pct(zonAttr.o, 'sensor.inverter_kroon_18_zolder_capacity', 3);
                var kw = function(v){ return v === null ? '—' : v.toFixed(2).replace('.',','); };

                // ---------- teksten ----------
                var GROEN = '#4ade80', BLAUW = '#3b82f6', GEEL = '#FFD60A';
                var WIT = 'rgba(255,255,255,0.85)', GRIJS = 'rgba(255,255,255,0.55)';
                var zonActief = zonKw !== null && zonKw * 1000 > 50;
                var deel = function(naam, p){
                  if(p === null) return '';
                  return ` · <span style="color:${p >= 98 ? GEEL : GRIJS}">${naam} ${p}%</span>`;
                };
                var zonLabel = 'zon' + deel('ZW', zw) + deel('O', oo);
                var terug = netto !== null && netto < 0;
                var netActief = netto !== null && netto !== 0;
                var netWaarde = netto === null ? '—' : kw(Math.abs(netto)) + ' kW';
                var netLabel = 'net' + (netto === null ? '' : (terug ? ' · teruglevering' : (netto === 0 ? '' : ' · afname')));
                var accuActief = accuMode === 'laadt' || accuMode === 'ontlaadt';
                var accuWaarde = accuPv === null ? '—' : Math.abs(accuPv) + ' W';
                var accuLabel = 'accu' + (accuMode ? ' · ' + accuMode : '') + (soc === null ? '' : ' · ' + Math.round(soc) + '%');

                // Bron-knoop links: vaste hoogte 34px zodat de middens exact op
                // y = 17/53/89 van het lijnenveld liggen (3×34 + 2×2 gap = 106).
                var knoop = function(waarde, waardeKleur, label){
                  return `<div style="height:34px;display:flex;flex-direction:column;justify-content:center">`
                    + `<div style="font-size:17px;font-weight:700;line-height:1.15;color:${waardeKleur};white-space:nowrap">${waarde}</div>`
                    + `<div style="font-size:11.5px;color:${GRIJS};white-space:nowrap">${label}</div></div>`;
                };

                // ---------- lijnenveld ----------
                // Alleen paden, dus dit mag horizontaal uitrekken
                // (preserveAspectRatio=none); non-scaling-stroke houdt ze 2px.
                var LIJN_UIT = 'rgba(255,255,255,0.10)';
                var lijn = function(d, kleur, actief, richting){
                  var basis = `<path d="${d}" fill="none" stroke="${LIJN_UIT}" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
                  if(!actief) return basis;
                  var van = richting === -1 ? 0 : 28, naar = richting === -1 ? 28 : 0;
                  return basis + `<path d="${d}" fill="none" stroke="${kleur}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-dasharray="4 10" opacity="0.9">`
                    + `<animate attributeName="stroke-dashoffset" from="${van}" to="${naar}" dur="1.6s" repeatCount="indefinite"/></path>`;
                };

                return `<div style="display:grid;grid-template-columns:auto minmax(60px,1fr) auto;align-items:center;column-gap:14px;width:100%">
                  <div style="display:flex;flex-direction:column;gap:2px">
                    ${knoop(kw(zonKw) + ' kW', GROEN, zonLabel)}
                    ${knoop(netWaarde, terug ? GROEN : 'white', netLabel)}
                    ${knoop(accuWaarde, 'white', accuLabel)}
                  </div>
                  <svg viewBox="0 0 300 106" preserveAspectRatio="none" style="display:block;width:100%;height:106px">
                    ${lijn('M2,17 C 120,17 180,45 298,45', GROEN, zonActief, 1)}
                    ${lijn('M2,53 L298,53', BLAUW, netActief, terug ? -1 : 1)}
                    ${lijn('M2,89 C 120,89 180,61 298,61', WIT, accuActief, accuMode === 'ontlaadt' ? 1 : -1)}
                  </svg>
                  <div style="display:flex;flex-direction:column;justify-content:center">
                    <div style="line-height:1;white-space:nowrap"><span style="font-size:30px;font-weight:700;color:white">${kw(verbruik)}</span> <span style="font-size:13px;color:${GRIJS}">kW</span></div>
                    <div style="font-size:11.5px;line-height:1.35;color:${GRIJS};padding-top:3px;white-space:nowrap"><ha-icon icon="mdi:home-lightning-bolt-outline" style="--mdc-icon-size:13px;width:13px;height:13px;vertical-align:middle;color:${GRIJS}"></ha-icon> huis · verbruik</div>
                  </div>
                </div>`;
              ]]]
        # GRAFIEKEN NAAST ELKAAR: links 2 uur productie tegen huisverbruik,
        # rechts de live-strook van het laatste halfuur. Eerst stond de strook
        # erboven en groeide het paneel bijna 100 px ("neemt veel in de
        # hoogte", Robin 24-08-2026); naast elkaar kost het samen niet meer
        # hoogte dan de grote grafiek alleen. Beide tonen sinds 24-08 dezelfde
        # blauwe grootheid (sensor.huis_verbruik) op twee zoomniveaus; de
        # kopregel van de strook benoemt hem voor allebei.
        # De flex-basis laat de strook op een smal scherm (telefoon, één
        # kolom) onder de grote grafiek vallen in plaats van onleesbaar
        # smal te worden.
        - type: horizontal-stack
          card_mod:
            style: |
              #root { gap: 2px 16px !important; flex-wrap: wrap !important; align-items: flex-end !important; }
              #root > :first-child { flex: 1.7 1 320px !important; }
              #root > :last-child { flex: 1 1 210px !important; }
          cards:
            # 2 uur productie tegen huisverbruik
            - type: custom:apexcharts-card
              # Twee uur productie tegen verbruik: bij tien minuten netto
              # verbruik zag je vooral ruis rond nul. Nu zie je de vorm van
              # de ochtend: wanneer de zon aankwam, wanneer de batterij laadt.
              graph_span: 2h
              update_interval: 60s
              card_mod:
                style: |
                  ha-card { background: none !important; box-shadow: none !important; border: none !important; }
              header:
                show: false
              apex_config:
                chart:
                  height: 150
                  toolbar:
                    show: false
                grid:
                  show: false
                  padding:
                    left: 14
                    right: 4
                    top: -8
                    bottom: 0
                legend:
                  show: false
                yaxis:
                  show: true
                  tickAmount: 3
                  labels:
                    style:
                      colors: "rgba(255,255,255,0.5)"
                      fontSize: "10px"
                    formatter: |
                      EVAL:function(v) { return (v === null || v === undefined) ? '' : Number(v).toFixed(1).replace('.', ',') + ' kW'; }
                xaxis:
                  axisBorder:
                    show: false
                  axisTicks:
                    show: false
                  tooltip:
                    enabled: false
                  labels:
                    show: true
                    style:
                      colors: "rgba(255,255,255,0.5)"
                      fontSize: "10px"
                    datetimeFormatter:
                      hour: "HH:mm"
                      minute: "HH:mm"
                tooltip:
                  enabled: true
                  shared: true
                  x:
                    format: "HH:mm"
              series:
                - entity: sensor.zon_vermogen_nu
                  name: productie
                  type: area
                  color: "#4ade80"
                  curve: smooth
                  stroke_width: 2
                  opacity: 0.22
                  float_precision: 2
                  # Deze sensor staat in W, verbruik in kW; hier gelijktrekken.
                  #
                  # WAAROM DIT ZO OMSLACHTIG STAAT
                  # Hier stond `unit === 'W' ? x / 1000 : x`. Dat gaat mis zodra een
                  # punt geen getal is: op 2026-08-06 stond deze sensor drie keer
                  # even op `unavailable` (de omvormers vielen weg tijdens de
                  # Zigbee-storing), en één zo'n punt kwam ongedeeld in de grafiek.
                  # Gevolg: de y-as sprong naar 3000 en de echte curve van 4-6 kW lag
                  # plat tegen de bodem - de grafiek leek stuk terwijl de data klopte.
                  #
                  # Twee dingen daartegen: niet-numerieke punten worden `null` (die
                  # tekent apexcharts gewoon niet), en de deling gebeurt TENZIJ de
                  # eenheid expliciet kW is. Ontbreekt het attribuut - historische
                  # punten dragen het niet altijd mee - dan delen we dus, en dat is
                  # hier de goede gok: dit is de som van twee omvormers die
                  # allebei in W meten.
                  #
                  # Sinds 27-08-2026 is dat `sensor.zon_vermogen_nu` en niet meer
                  # de min_max-som: die gaf `unknown` zodra één omvormer wegviel,
                  # en dat waren de gaten in deze grafiek.
                  transform: >-
                    var s = hass.states['sensor.zon_vermogen_nu'];
                    var u = (s && s.attributes) ? s.attributes.unit_of_measurement : null;
                    var v = Number(x);
                    return (x === null || x === undefined || isNaN(v))
                      ? null : (u === 'kW' ? v : v / 1000);
                  group_by:
                    duration: 2m
                    func: avg
                # Tot 24-08-2026 stond hier `sensor.electricity_meter_energie-
                # verbruik` onder de naam "verbruik", maar dat is de NETAFNAME:
                # die zakt naar 0 zodra de zon je verbruik dekt, ook met een
                # draaiende vaatwasser. Nu dus hetzelfde huisverbruik als de
                # live-strook hiernaast (net + zon - accu). De sensor bestaat
                # pas sinds die datum, dus ouder dan zijn eerste meting begint
                # de lijn gewoon later in de grafiek.
                - entity: sensor.huis_verbruik
                  name: huis
                  type: line
                  color: "#3b82f6"
                  curve: smooth
                  stroke_width: 2
                  opacity: 1
                  float_precision: 2
                  # Sensor staat al in kW; alleen niet-numerieke punten naar
                  # null, zodat een weggevallen bron de as niet kan opblazen -
                  # zelfde les als bij de productielijn hierboven.
                  transform: >-
                    var v = Number(x);
                    return (x === null || x === undefined || isNaN(v)) ? null : v;
                  group_by:
                    duration: 2m
                    func: avg
            # LIVE-STROOK: het huis-getal van de flow als verloop. De grote
            # grafiek hiernaast middelt per 2 minuten over 2 uur; wat je NU
            # aanzet zie je daar pas minuten later als een bobbeltje. Deze
            # strook toont `sensor.huis_verbruik` (Electricity.yaml, zelfde
            # optelsom net + zon - accu als de flow, gesampled op 5 s) over
            # het laatste halfuur, dus een waterkoker is binnen een paar
            # seconden zichtbaar. Eén serie, dus geen legenda: de kopregel
            # benoemt hem, met de blauwe stip als koppeling naar de lijnkleur
            # (blauw = verbruik, overal op deze kaart).
            - type: vertical-stack
              cards:
                - type: custom:button-card
                  tap_action:
                    action: navigate
                    navigation_path: "#ov-energie"
                  styles:
                    card:
                      - background: none
                      - border: none
                      - box-shadow: none
                      - padding: 0 2px
                    grid:
                      - grid-template-areas: '"regel"'
                    custom_fields:
                      regel:
                        - width: 100%
                  custom_fields:
                    regel: |
                      [[[
                        return `<span style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%;font-size:11.5px;color:rgba(255,255,255,0.52)">
                          <span style="display:inline-flex;align-items:center;gap:6px;white-space:nowrap"><span style="width:7px;height:7px;border-radius:50%;background:#3b82f6"></span>live · wat het huis trekt</span>
                          <span style="color:rgba(255,255,255,0.38);white-space:nowrap">laatste 30 min</span></span>`;
                      ]]]
                - type: custom:apexcharts-card
                  # Geen x-as: de kopregel zegt al "laatste 30 min" en de as
                  # van de 2-uursgrafiek ernaast zou er een tweede, nét andere
                  # tijdschaal naast zetten. De tooltip geeft het exacte
                  # tijdstip. Hoogte: 126 + kopregel ≈ de 150 van de grote
                  # grafiek, zodat de onderkanten gelijk lopen (align-items
                  # flex-end op de rij).
                  graph_span: 30min
                  update_interval: 5s
                  card_mod:
                    style: |
                      ha-card { background: none !important; box-shadow: none !important; border: none !important; }
                  header:
                    show: false
                  apex_config:
                    chart:
                      height: 126
                      toolbar:
                        show: false
                    grid:
                      show: false
                      padding:
                        left: 14
                        right: 4
                        top: -12
                        bottom: -8
                    legend:
                      show: false
                    yaxis:
                      show: true
                      # De vloer op 0 houdt de strook rustig: zonder min zoomt
                      # ApexCharts op het bereik van het halfuur in en wordt
                      # 100 W ruis een berglandschap.
                      min: 0
                      tickAmount: 2
                      labels:
                        style:
                          colors: "rgba(255,255,255,0.5)"
                          fontSize: "10px"
                        formatter: |
                          EVAL:function(v) { return (v === null || v === undefined) ? '' : Number(v).toFixed(1).replace('.', ',') + ' kW'; }
                    xaxis:
                      axisBorder:
                        show: false
                      axisTicks:
                        show: false
                      labels:
                        show: false
                      tooltip:
                        enabled: false
                    tooltip:
                      enabled: true
                      x:
                        format: "HH:mm"
                  series:
                    - entity: sensor.huis_verbruik
                      name: huis
                      type: area
                      color: "#3b82f6"
                      curve: smooth
                      stroke_width: 2
                      opacity: 0.18
                      float_precision: 2
                      # Sensor staat al in kW; alleen niet-numerieke punten
                      # (sensor even unavailable) naar null, anders blaast één
                      # zo'n punt de as op.
                      transform: >-
                        var v = Number(x);
                        return (x === null || x === undefined || isNaN(v)) ? null : v;
        # chips row
        - type: horizontal-stack
          card_mod:
            style: |
              #root { gap: 10px !important; flex-wrap: wrap !important; }
              #root > * { flex: 0 0 auto !important; white-space: nowrap !important; }
          cards:
            - type: custom:button-card
              template: ov_pill
              entity: sensor.zon_opgewekt_vandaag
              tap_action:
                action: more-info
              custom_fields:
                c: |
                  [[[
                    var g = states['sensor.zon_opgewekt_vandaag'];
                    return `<span style="color:rgba(255,255,255,0.8)">vandaag opgewekt · ${g && !isNaN(Number(g.state)) ? Number(g.state).toFixed(1).replace('.',',') : '—'} kWh</span>`;
                  ]]]
            - type: custom:button-card
              template: ov_pill
              entity: sensor.forecast_solar_production_today
              tap_action:
                action: more-info
              custom_fields:
                c: |
                  [[[
                    var f = states['sensor.forecast_solar_production_today'];
                    return `<span style="color:rgba(255,255,255,0.8)">verwacht · ${f && !isNaN(Number(f.state)) ? Number(f.state).toFixed(1).replace('.',',') : '—'} kWh</span>`;
                  ]]]
