# Middenkolom: energie nu, stroomprijs, veelgebruikers.
type: vertical-stack
card_mod:
  style: |
    #root { gap: 16px !important; }
cards:
  # ENERGIE NU
  - type: custom:mod-card
    card_mod:
      style: |
        ha-card {
          background: var(--ov-panel-bg) !important;
          border: var(--ov-panel-border) !important;
          border-radius: var(--ov-panel-radius) !important;
          box-shadow: none !important;
          padding: var(--ov-panel-padding) !important;
        }
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          template: ov_title
          tap_action:
            action: navigate
            navigation_path: "#ov-energie"
          variables:
            title: ENERGIE · NU
          custom_fields:
            b: |
              [[[
                var g = states['sensor.slimhuys_zonneplan_tariefniveau_nu'];
                var solar = states['sensor.solar_power_generated_now'];
                // /low/ vangt zowel low als very_low; SlimHuys kent vijf niveaus.
                var cheap = g && /low/.test(g.state);
                // Deze sensor staat in W (zie het prod-veld hieronder). De oude
                // drempel 0,1 was als kW bedoeld en maakte "groen" al waar bij
                // het minste schemerlicht; 100 W is pas een echte bijdrage.
                var su = solar && solar.attributes ? solar.attributes.unit_of_measurement : null;
                var sw = solar && !isNaN(Number(solar.state)) ? Number(solar.state) * (su === 'kW' ? 1000 : 1) : 0;
                var green = sw > 100;
                var duur = g && /high/.test(g.state);
                // Het tarief wint van "groen": met alleen een zon-test stond hier
                // op het duurste moment van de dag een groene "stroom is groen",
                // wat leest als "goed moment om iets aan te zetten". Zelfde
                // driedeling als de kopregel op dashboards/home/nest_hub.yaml.
                var txt, col;
                if(cheap){
                  txt = green ? 'stroom is groen en goedkoop' : 'stroom is goedkoop';
                  col = '#4ade80';
                } else if(duur){
                  txt = green ? 'stroom is groen maar duur' : 'stroom is duur';
                  col = green ? '#f59e0b' : '#ef4444';
                } else {
                  txt = green ? 'stroom is groen' : 'normaal tarief';
                  col = green ? '#4ade80' : 'rgba(255,255,255,0.6)';
                }
                return `<span style="display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:${col}"><span style="width:8px;height:8px;border-radius:50%;background:${col}"></span>${txt}</span>`;
              ]]]
        # Energiestroom: zon, net en accu links, het huis rechts, met
        # geanimeerde lijnen die laten zien wat er nú loopt en welke kant op.
        # Verving op 2026-08-16 de rij van vier losse getallen; alle vier de
        # waarden staan er nog (zon/net/accu links, verbruik bij het huis),
        # maar de richting hoef je niet meer uit voortekens af te leiden.
        #
        # Eén SVG met een vaste viewBox die met de kolom meeschaalt; tekst
        # staat ín de SVG zodat lijnen en labels nooit uit elkaar schuiven
        # (zelfde aanpak als de auto-illustratie in kolom_links). De
        # dash-animatie is SMIL (<animate>), geen CSS: die werkt ook binnen
        # de shadow-DOM van button-card zonder <style>-tag.
        #
        # KLEUR VOLGT DE BRON, RICHTING VOLGT DE ANIMATIE
        # zon groen, net blauw (de verbruikskleur van de grafiek eronder),
        # accu wit. Bij teruglevering blijft de netlijn dus blauw en loopt de
        # animatie naar het net toe; alleen het getal kleurt groen, net als op
        # de oude tegel. Gecontroleerd met de dataviz-validator: CVD- en
        # normaalzicht-afstanden en contrast op deze achtergrond zijn ruim
        # voldoende, en elke lijn heeft zijn eigen tekstlabel.
        #
        # PER SET, NIET SAMEN (ZW/O-percentages, overgenomen van de oude
        # productietegel): één percentage over beide omvormers haalt nooit
        # 100% - de sets pieken op verschillende momenten. Per set gedeeld
        # door zijn eigen capaciteit klopt het wel, en zie je de zuidwest op
        # een heldere middag ook echt klippen (geel bij >= 98). ZW =
        # achtertuin (sensor heet `overkapping`), O = zolder; plafonds uit de
        # capaciteitssensoren, terugval 5/3 kW.
        #
        # ACCU: ONDER 15 W GEBEURT ER NIETS - dat is de Marstek zelf (rust-
        # verbruik van de elektronica; band gemeten 15-16 aug 2026: 65% van
        # alle metingen zat op 0-15 W). Dan dus "standby" en geen animatie,
        # anders leek de accu twee derde van de dag leeg te lopen.
        #
        # button-card rendert alleen opnieuw als zijn entity verandert; de
        # triggers_update-lijst dekt de andere bronnen.
        - type: custom:button-card
          entity: sensor.live_energieverbruik_totaal
          triggers_update:
            - sensor.solar_power_generated_now
            - sensor.electricity_meter_energieverbruik
            - sensor.lilygo_rs485_marstek_battery_power
            - sensor.lilygo_rs485_marstek_battery_state_of_charge
          show_icon: false
          show_name: false
          show_state: false
          tap_action:
            action: navigate
            navigation_path: "#ov-energie"
          styles:
            card:
              - background: none
              - border: none
              - box-shadow: none
              - padding: 4px 2px 6px 2px
            grid:
              - grid-template-areas: '"flow"'
            custom_fields:
              flow:
                - width: 100%
          custom_fields:
            flow: |
              [[[
                // ---------- waarden (zelfde regels als de oude vier tegels) ----------
                var num = function(id){ var s = states[id];
                  return (s && !isNaN(Number(s.state))) ? Number(s.state) : null; };
                // zon: sensor staat in W tenzij hij expliciet kW zegt
                var zonS = states['sensor.solar_power_generated_now'];
                var zonKw = null;
                if(zonS && !isNaN(Number(zonS.state))){
                  var zu = zonS.attributes.unit_of_measurement || '';
                  zonKw = (zu === 'kW') ? Number(zonS.state) : Number(zonS.state) / 1000;
                }
                // netto: negatief = teruglevering; ruis rond nul plat slaan
                var netto = num('sensor.live_energieverbruik_totaal');
                if(netto !== null && Math.abs(netto) < 0.005) netto = 0;
                // verbruik van het huis zelf
                var verbruik = num('sensor.electricity_meter_energieverbruik');
                var accuW = num('sensor.lilygo_rs485_marstek_battery_power');
                var accuPv = accuW === null ? null : Math.round(accuW);
                var soc = num('sensor.lilygo_rs485_marstek_battery_state_of_charge');
                var accuMode = accuPv === null ? ''
                             : (Math.abs(accuPv) <= 15 ? 'standby'
                             : (accuPv < 0 ? 'ontlaadt' : 'laadt'));
                var pct = function(vermogenId, capId, terugval){
                  var p = num(vermogenId), c = num(capId);
                  c = (c === null ? terugval : c) * 1000;
                  return (p === null || c <= 0) ? null : Math.round(p / c * 100);
                };
                var zw = pct('sensor.inverter_kroon_18_overkapping',
                             'sensor.inverter_kroon_18_achtertuin_capacity', 5);
                var oo = pct('sensor.inverter_kroon_18_zolder_voorzijde',
                             'sensor.inverter_kroon_18_zolder_capacity', 3);
                var kw = function(v){ return v === null ? '—' : v.toFixed(2).replace('.',','); };

                // ---------- opbouw ----------
                var GROEN = '#4ade80', BLAUW = '#3b82f6', GEEL = '#FFD60A';
                var WIT = 'rgba(255,255,255,0.85)', GRIJS = 'rgba(255,255,255,0.55)';
                var LIJN_UIT = 'rgba(255,255,255,0.10)';
                // Lijn met optionele stroom-animatie. richting: 1 = naar het
                // huis, -1 = van het huis terug naar de bron.
                var lijn = function(d, kleur, actief, richting){
                  var basis = `<path d="${d}" fill="none" stroke="${LIJN_UIT}" stroke-width="2"/>`;
                  if(!actief) return basis;
                  var van = richting === -1 ? 0 : 24, naar = richting === -1 ? 24 : 0;
                  return basis + `<path d="${d}" fill="none" stroke="${kleur}" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 9" opacity="0.9">`
                    + `<animate attributeName="stroke-dashoffset" from="${van}" to="${naar}" dur="1.4s" repeatCount="indefinite"/></path>`;
                };
                // Bron-knoop links: waarde + label, verticaal rond cy.
                var knoop = function(cy, waarde, waardeKleur, label){
                  return `<text x="8" y="${cy - 1}" font-size="15" font-weight="700" fill="${waardeKleur}">${waarde}</text>`
                       + `<text x="8" y="${cy + 13}" font-size="9.5" fill="${GRIJS}">${label}</text>`;
                };

                // zon (vanaf ~50 W echt aan het leveren, anders schemerruis)
                var zonActief = zonKw !== null && zonKw * 1000 > 50;
                var deel = function(naam, p){
                  if(p === null) return '';
                  return ` · <tspan fill="${p >= 98 ? GEEL : GRIJS}">${naam} ${p}%</tspan>`;
                };
                var zonLabel = 'zon' + deel('ZW', zw) + deel('O', oo);
                // net
                var terug = netto !== null && netto < 0;
                var netActief = netto !== null && netto !== 0;
                var netWaarde = netto === null ? '—' : kw(Math.abs(netto)) + ' kW';
                var netLabel = 'net' + (netto === null ? '' : (terug ? ' · teruglevering' : (netto === 0 ? '' : ' · afname')));
                // accu
                var accuActief = accuMode === 'laadt' || accuMode === 'ontlaadt';
                var accuWaarde = accuPv === null ? '—' : Math.abs(accuPv) + ' W';
                var accuLabel = 'accu' + (accuMode ? ' · ' + accuMode : '') + (soc === null ? '' : ' · ' + Math.round(soc) + '%');

                return `<svg viewBox="0 0 520 120" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block">
                  ${lijn('M150,24 C 250,24 280,52 358,54', GROEN, zonActief, 1)}
                  ${lijn('M150,60 L358,60', BLAUW, netActief, terug ? -1 : 1)}
                  ${lijn('M150,96 C 250,96 280,68 358,66', WIT, accuActief, accuMode === 'ontlaadt' ? 1 : -1)}
                  ${knoop(24, kw(zonKw) + ' kW', GROEN, zonLabel)}
                  ${knoop(60, netWaarde, terug ? GROEN : 'white', netLabel)}
                  ${knoop(96, accuWaarde, 'white', accuLabel)}
                  <text x="372" y="66" font-size="27" font-weight="700" fill="white">${kw(verbruik)}<tspan font-size="13" font-weight="400" fill="${GRIJS}"> kW</tspan></text>
                  <text x="372" y="82" font-size="9.5" fill="${GRIJS}">huis · verbruik</text>
                  <path d="M380,30 l9,-9 9,9 M382,28 v10 h14 v-10" fill="none" stroke="${WIT}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
                </svg>`;
              ]]]
        # live chart
        - type: custom:apexcharts-card
          # Twee uur productie tegen verbruik: bij tien minuten netto
          # verbruik zag je vooral ruis rond nul. Nu zie je de vorm van
          # de ochtend: wanneer de zon aankwam, wanneer de batterij laadt.
          graph_span: 2h
          update_interval: 60s
          card_mod:
            style: |
              ha-card { background: none !important; box-shadow: none !important; border: none !important; }
          header:
            show: false
          apex_config:
            chart:
              height: 175
              toolbar:
                show: false
            grid:
              show: false
              padding:
                left: 14
                right: 4
                top: -8
                bottom: 0
            legend:
              show: false
            yaxis:
              show: true
              tickAmount: 3
              labels:
                style:
                  colors: "rgba(255,255,255,0.5)"
                  fontSize: "10px"
                formatter: |
                  EVAL:function(v) { return (v === null || v === undefined) ? '' : Number(v).toFixed(1).replace('.', ',') + ' kW'; }
            xaxis:
              axisBorder:
                show: false
              axisTicks:
                show: false
              tooltip:
                enabled: false
              labels:
                show: true
                style:
                  colors: "rgba(255,255,255,0.5)"
                  fontSize: "10px"
                datetimeFormatter:
                  hour: "HH:mm"
                  minute: "HH:mm"
            tooltip:
              enabled: true
              shared: true
              x:
                format: "HH:mm"
          series:
            - entity: sensor.solar_power_generated_now
              name: productie
              type: area
              color: "#4ade80"
              curve: smooth
              stroke_width: 2
              opacity: 0.22
              float_precision: 2
              # Deze sensor staat in W, verbruik in kW; hier gelijktrekken.
              #
              # WAAROM DIT ZO OMSLACHTIG STAAT
              # Hier stond `unit === 'W' ? x / 1000 : x`. Dat gaat mis zodra een
              # punt geen getal is: op 2026-08-06 stond deze sensor drie keer
              # even op `unavailable` (de omvormers vielen weg tijdens de
              # Zigbee-storing), en één zo'n punt kwam ongedeeld in de grafiek.
              # Gevolg: de y-as sprong naar 3000 en de echte curve van 4-6 kW lag
              # plat tegen de bodem - de grafiek leek stuk terwijl de data klopte.
              #
              # Twee dingen daartegen: niet-numerieke punten worden `null` (die
              # tekent apexcharts gewoon niet), en de deling gebeurt TENZIJ de
              # eenheid expliciet kW is. Ontbreekt het attribuut - historische
              # punten dragen het niet altijd mee - dan delen we dus, en dat is
              # hier de goede gok: dit is een min_max van twee omvormers die
              # allebei in W meten.
              transform: >-
                var s = hass.states['sensor.solar_power_generated_now'];
                var u = (s && s.attributes) ? s.attributes.unit_of_measurement : null;
                var v = Number(x);
                return (x === null || x === undefined || isNaN(v))
                  ? null : (u === 'kW' ? v : v / 1000);
              group_by:
                duration: 2m
                func: avg
            - entity: sensor.electricity_meter_energieverbruik
              name: verbruik
              type: line
              color: "#3b82f6"
              curve: smooth
              stroke_width: 2
              opacity: 1
              float_precision: 2
              # Spiegelbeeld van de productielijn hierboven, met één verschil:
              # deze meter staat in kW, dus hier delen we alleen als de eenheid
              # expliciet W is. Ook hier worden niet-numerieke punten `null`,
              # zodat een weggevallen meter de as niet meer kan opblazen.
              transform: >-
                var s = hass.states['sensor.electricity_meter_energieverbruik'];
                var u = (s && s.attributes) ? s.attributes.unit_of_measurement : null;
                var v = Number(x);
                return (x === null || x === undefined || isNaN(v))
                  ? null : (u === 'W' ? v / 1000 : v);
              group_by:
                duration: 2m
                func: avg
        # chips row
        - type: horizontal-stack
          card_mod:
            style: |
              #root { gap: 10px !important; flex-wrap: wrap !important; }
              #root > * { flex: 0 0 auto !important; white-space: nowrap !important; }
          cards:
            - type: custom:button-card
              template: ov_pill
              entity: sensor.solar_power_generated_today
              tap_action:
                action: more-info
              custom_fields:
                c: |
                  [[[
                    var g = states['sensor.solar_power_generated_today'];
                    return `<span style="color:rgba(255,255,255,0.8)">vandaag opgewekt · ${g && !isNaN(Number(g.state)) ? Number(g.state).toFixed(1).replace('.',',') : '—'} kWh</span>`;
                  ]]]
            - type: custom:button-card
              template: ov_pill
              entity: sensor.forecast_solar_production_today
              tap_action:
                action: more-info
              custom_fields:
                c: |
                  [[[
                    var f = states['sensor.forecast_solar_production_today'];
                    return `<span style="color:rgba(255,255,255,0.8)">verwacht · ${f && !isNaN(Number(f.state)) ? Number(f.state).toFixed(1).replace('.',',') : '—'} kWh</span>`;
                  ]]]
            - type: custom:button-card
              template: ov_pill
              entity: sensor.zonneplan_gas_consumption_today
              tap_action:
                action: more-info
              custom_fields:
                c: |
                  [[[
                    var g = states['sensor.zonneplan_gas_consumption_today'];
                    return `<span style="color:rgba(255,255,255,0.8)">gas · ${g && !isNaN(Number(g.state)) ? Number(g.state).toFixed(2).replace('.',',') : '—'} m³</span>`;
                  ]]]
            - type: custom:button-card
              template: ov_pill
              entity: sensor.total_costs_today_calculated
              tap_action:
                action: more-info
              custom_fields:
                c: |
                  [[[
                    var k = states['sensor.total_costs_today_calculated'];
                    var v = k && !isNaN(Number(k.state)) ? Number(k.state) : 0;
                    var col = v < 0 ? '#4ade80' : 'rgba(255,255,255,0.85)';
                    return `<span style="color:${col};font-weight:600">kosten vandaag · € ${v.toFixed(2).replace('.',',')}</span>`;
                  ]]]
  # STROOMPRIJS (vandaag + morgen)
  - type: custom:mod-card
    card_mod:
      style: |
        ha-card {
          background: var(--ov-panel-bg) !important;
          border: var(--ov-panel-border) !important;
          border-radius: var(--ov-panel-radius) !important;
          box-shadow: none !important;
          padding: var(--ov-panel-padding) !important;
        }
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          template: ov_title
          tap_action:
            action: navigate
            navigation_path: "#ov-energie"
          variables:
            title: STROOMPRIJS
          custom_fields:
            b: |
              [[[
                var p = states['sensor.slimhuys_zonneplan_huidige_prijs'];
                var nu = p && !isNaN(Number(p.state)) ? Number(p.state) : null;
                // Het tariefniveau komt uit SlimHuys zelf, zodat deze stip
                // hetzelfde zegt als de pil in de header en waar de batterij
                // op schakelt.
                var g = states['sensor.slimhuys_zonneplan_tariefniveau_nu'];
                var col = {very_low:'#4ade80', low:'#4ade80', medium:'#f59e0b',
                           high:'#ef4444', very_high:'#ef4444'}[g ? g.state : ''] || 'rgba(255,255,255,0.6)';
                // Kwartierblokken als de integratie ze levert, anders de uurblokken.
                var blok = function(eid){ var e = states[eid]; return (e && e.attributes && e.attributes.raw_today) || []; };
                var kw = blok('sensor.slimhuys_zonneplan_prijzen_vandaag_kwartier');
                var raw = kw.length ? kw : blok('sensor.slimhuys_zonneplan_prijzen_vandaag');
                // Goedkoopste blok dat nog komt, inclusief het blok dat nu loopt.
                var now = new Date();
                var best = null;
                raw.forEach(function(e){
                  var d = new Date(e.start), t = new Date(e.end), v = Number(e.value);
                  if(isNaN(d.getTime()) || isNaN(v)) return;
                  if(!isNaN(t.getTime()) && t <= now) return;
                  if(best === null || v < best.p) best = {p: v, d: d};
                });
                var nuTxt = nu !== null ? '€ ' + nu.toFixed(3).replace('.',',') : '—';
                var klok = function(d){ return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2); };
                var tip = best ? ` · laagste ${klok(best.d)}` : '';
                return `<span style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:rgba(255,255,255,0.65)"><span style="width:8px;height:8px;border-radius:50%;background:${col}"></span><span style="color:white;font-weight:600">nu ${nuTxt}</span>${tip}</span>`;
              ]]]
        - type: custom:apexcharts-card
          # Meeschuivend venster: 3 uur terug tot 27 uur vooruit. Een vast
          # etmaalvenster stond tot ~15:00 half leeg, omdat de prijzen van
          # morgen dan nog niet gepubliceerd zijn.
          graph_span: 30h
          stacked: true
          span:
            start: hour
            offset: "-3h"
          # Alleen de stippellijn: een `label` rendert een ongestyled
          # wit annotatieblok bovenin de grafiek.
          now:
            show: true
            color: rgba(255,255,255,0.75)
          card_mod:
            style: |
              ha-card { background: none !important; box-shadow: none !important; border: none !important; }
          header:
            show: false
          apex_config:
            chart:
              height: 155
              toolbar:
                show: false
            grid:
              show: false
              padding:
                left: 14
                right: 4
                top: -8
                bottom: 0
            legend:
              show: false
            yaxis:
              show: true
              tickAmount: 3
              labels:
                style:
                  colors: "rgba(255,255,255,0.5)"
                  fontSize: "10px"
                formatter: |
                  EVAL:function(v) { return (v === null || v === undefined) ? '' : '€ ' + Number(v).toFixed(2).replace('.', ','); }
            xaxis:
              axisBorder:
                show: false
              axisTicks:
                show: false
              # los van de gewone tooltip rendert ApexCharts standaard nog een
              # label onder de x-as; die gaf het dubbele "wo. 08:00"
              tooltip:
                enabled: false
              labels:
                show: true
                style:
                  colors: "rgba(255,255,255,0.5)"
                  fontSize: "10px"
                datetimeFormatter:
                  minute: "HH:mm"
                  hour: "HH:mm"
                  day: "dd/MM"
            tooltip:
              enabled: true
              shared: false
              intersect: true
              x:
                # De balken staan op het midden van hun prijsblok (zie
                # data_generator). Zonder terugrekenen zou hier "10:30" staan voor
                # het blok van 10:00; nu toont de tooltip het hele interval.
                formatter: |
                  EVAL:function(val, opts) {
                    var xs = (opts && opts.w && opts.w.globals.seriesX[0]) || [];
                    var step = Infinity;
                    for (var i = 1; i < xs.length; i++) { var d = xs[i] - xs[i - 1]; if (d > 0 && d < step) { step = d; } }
                    if (!isFinite(step)) { step = 3600000; }
                    var s = new Date(val - step / 2), e = new Date(val + step / 2);
                    var klok = function(d) { return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); };
                    return s.toLocaleDateString('nl-NL', { weekday: 'short' }) + ' ' + klok(s) + '–' + klok(e);
                  }
            plotOptions:
              bar:
                # Met kwartierblokken passen er 120 balken in het venster van
                # 30 uur; bij 82% blijft daar zoveel wit tussen dat het streept.
                # Vrijwel dicht tegen elkaar leest het als een prijsverloop.
                columnWidth: 96%
          series:
            # Drie series over dezelfde tijdstippen: per prijsblok vult er precies
            # een, de andere twee zijn null. Gestapeld levert dat een balk per blok
            # in de kleur van de prijsklasse (t.o.v. de rest van die dag).
            - entity: sensor.slimhuys_zonneplan_prijzen_vandaag_kwartier
              name: goedkoop
              type: column
              color: "#4ade80"
              opacity: 1
              stroke_width: 1
              float_precision: 3
              data_generator: |
                const BAND = 0;
                // SlimHuys geeft per blok een start EN een end, dus de blokbreedte
                // hoeft niet uit de onderlinge afstand geraden te worden. Daarmee
                // werkt dit voor kwartieren net zo goed als voor uren, en zelfs
                // voor de dag waarop het overschakelt.
                const blokken = (ent, key) => (ent && ent.attributes && ent.attributes[key]) || [];
                const st = (typeof hass !== 'undefined' && hass.states) ? hass.states : {};
                const vandaag = blokken(entity, 'raw_today').length
                  ? blokken(entity, 'raw_today')
                  : blokken(st['sensor.slimhuys_zonneplan_prijzen_vandaag'], 'raw_today');
                const pts = vandaag
                  .concat(blokken(st['sensor.slimhuys_zonneplan_prijzen_morgen'], 'raw_tomorrow'))
                  .map((e) => {
                    const s = new Date(e.start).getTime();
                    const t = new Date(e.end).getTime();
                    const p = Number(e.value);
                    // ApexCharts centreert een kolom op zijn timestamp; plotten op
                    // het midden van [start, end) laat de balk exact zijn eigen
                    // blok dekken in plaats van een half blok ernaast.
                    return { x: isFinite(t) ? (s + t) / 2 : s, dag: new Date(s).toDateString(), p: isNaN(p) ? null : p };
                  })
                  .filter((o) => isFinite(o.x))
                  .sort((a, b) => a.x - b.x);
                const stats = {};
                pts.forEach((o) => {
                  if (o.p === null) return;
                  const st2 = stats[o.dag] || (stats[o.dag] = { min: o.p, max: o.p });
                  st2.min = Math.min(st2.min, o.p); st2.max = Math.max(st2.max, o.p);
                });
                // Ook de null-punten blijven staan: bij een gestapelde grafiek
                // moeten alle series exact dezelfde x-waarden hebben.
                return pts.map((o) => {
                  if (o.p === null) return [o.x, null];
                  const d = stats[o.dag];
                  const spread = d.max - d.min;
                  // vlakke dag (< 2 ct verschil): niets is echt goedkoop of duur
                  const r = (spread < 0.02) ? 0.5 : (o.p - d.min) / spread;
                  const band = r <= 0.33 ? 0 : (r >= 0.66 ? 2 : 1);
                  return [o.x, band === BAND ? o.p : null];
                });
