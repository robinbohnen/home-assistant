# Tijdlijn van de komende twaalf uur, als voetregel onder de drie kolommen.
#
# Alle lagen delen één schaalfunctie pct(t); daardoor kunnen ze niet uit elkaar
# lopen. Vormen worden met SVG getekend (die mag uitgerekt worden), alles met
# letters met HTML op percentages (blijft scherp bij elke kolombreedte).
#
# De nu-lijn moet meeschuiven, dus de kaart moet uit zichzelf blijven renderen.
# Hier stond `update_timer` voor, maar die optie bestaat niet in button-card en
# deed dus niets: de kaart hing alleen aan de prijssensor en de nu-lijn sprong
# één keer per uur. `triggers_update` bestaat wél; met sensor.time erbij (tikt
# elke minuut) schuift de lijn weer mee.
type: custom:mod-card
card_mod:
  style: |
    ha-card {
      background: var(--ov-panel-bg) !important;
      border: var(--ov-panel-border) !important;
      border-radius: var(--ov-panel-radius) !important;
      box-shadow: none !important;
      padding: 9px 14px !important;
    }
card:
  type: vertical-stack
  cards:
    - type: custom:button-card
      template: ov_title
      styles:
        card:
          - padding: 0 2px 4px 2px
      variables:
        title: KOMENDE 12 UUR
      custom_fields:
        b: |
          [[[
            var z = states['sun.sun'];
            if(!z || !z.attributes.next_setting) return '';
            var t = new Date(z.attributes.next_setting);
            var klok = ('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);
            var op = z.state === 'below_horizon';
            return `<span style="font-size:12px;color:rgba(255,255,255,0.55)">${op ? 'zon op' : 'zon onder'} ${klok}</span>`;
          ]]]
    - type: custom:button-card
      entity: sensor.slimhuys_zonneplan_huidige_prijs
      show_icon: false
      show_name: false
      show_state: false
      triggers_update:
        - sensor.time
        - sensor.slimhuys_zonneplan_huidige_prijs
        - sensor.goedkoopste_laadvenster
        - sensor.droger_status
      # Tik = agenda/afval (daar staat de volledige lijst, ook wat achter "+N meer"
      # zit); lang indrukken = de prijsdetails. Hover bestaat niet op het wandpaneel.
      tap_action:
        action: navigate
        navigation_path: "#ov-vandaag"
      hold_action:
        action: navigate
        navigation_path: "#ov-energie"
      variables:
        uren_terug: 1
        uren_vooruit: 11
        # laadvenster_uren is vervallen: de vensterlengte staat nu op één
        # plek, in sensor.goedkoopste_laadvenster (Stroomprijs.yaml).
      styles:
        card:
          - background: none
          - border: none
          - box-shadow: none
          - padding: 2px 0 0 0
        grid:
          - grid-template-areas: '"lijn"'
      custom_fields:
        lijn: |
          [[[
            // ---------- schaal ----------
            var nu = Date.now();
            var start = nu - variables.uren_terug * 3600000;
            var eind = nu + variables.uren_vooruit * 3600000;
            var pct = function(t){ return (t - start) / (eind - start) * 100; };
            var klem = function(v){ return Math.max(0, Math.min(100, v)); };
            var klok = function(t){ var d = new Date(t); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); };
            var H = {zon: 20, prijs: 12, markers: 27, as: 10};
            var top = {zon: 0, prijs: 22, markers: 36, as: 0};
            // Markers staan in twee rijen; met tekst erbij moeten die rijen ver
            // genoeg uit elkaar liggen om als aparte regels te lezen (bij 9px liep
            // een lang label uit rij 0 langs de iconen van rij 1).
            var rijHoogte = 14;
            top.as = top.markers + H.markers;
            var totaal = top.as + H.as;
            var lagen = [];

            // ---------- laag 1: nacht ----------
            var z = states['sun.sun'];
            var onder = z && z.attributes.next_setting ? new Date(z.attributes.next_setting).getTime() : null;
            var op = z && z.attributes.next_rising ? new Date(z.attributes.next_rising).getTime() : null;
            var nachten = [];
            if(z){
              if(z.state === 'below_horizon' && op) nachten.push([start, op]);
              if(onder) nachten.push([onder, (op && op > onder) ? op : eind]);
            }
            nachten.forEach(function(n){
              var a = klem(pct(n[0])), b = klem(pct(n[1]));
              if(b - a > 0.2) lagen.push(`<div style="position:absolute;left:${a}%;width:${b-a}%;top:0;height:${H.zon}px;background:rgba(10,12,18,0.55)"></div>`);
            });

            // ---------- laag 2: zon ----------
            // Echte voorspelling als Forecast.Solar die per tijdstip levert,
            // anders een klokvorm tussen op- en ondergang op het dagtotaal.
            var zonBron = null, punten = [];
            // De voorspelling per tijdstip zit in een ATTRIBUUT van een sensor,
            // maar hoe dat heet verschilt per integratie én per versie:
            // watt_hours, wh_hours, wh_period, watts, detailedForecast...
            // Zoeken op naam brak daar stilletjes op (dan stond er weer
            // "benadering"). Daarom herkennen we hier de VORM, niet de naam:
            //   a) {"2026-08-01T14:00:00+02:00": 3200, ...}
            //   b) [{period_start: "...", pv_estimate: 3.2}, ...]
            var venster = 3 * 86400000;
            var alsReeks = function(v){
              if(!v || typeof v !== 'object') return null;
              var p = [];
              if(Array.isArray(v)){
                v.forEach(function(o){
                  if(!o || typeof o !== 'object') return;
                  var t = null, w = null;
                  Object.keys(o).forEach(function(k){
                    if(t === null && typeof o[k] === 'string'){
                      var d = new Date(o[k]);
                      if(!isNaN(d.getTime())) t = d.getTime();
                    }
                    if(w === null && typeof o[k] === 'number') w = o[k];
                  });
                  if(t !== null && w !== null) p.push({t: t, v: w});
                });
              } else {
                Object.keys(v).forEach(function(k){
                  if(typeof v[k] === 'boolean' || v[k] === null) return;
                  var d = new Date(k), w = Number(v[k]);
                  if(!isNaN(d.getTime()) && !isNaN(w)) p.push({t: d.getTime(), v: w});
                });
              }
              if(p.length < 3) return null;
              // Moet rond vandaag liggen en variatie hebben. Dat sluit tabellen
              // met vaste waarden en reeksen over heel andere periodes uit.
              var tmin = Infinity, tmax = -Infinity, vmin = Infinity, vmax = -Infinity;
              p.forEach(function(o){
                if(o.t < tmin) tmin = o.t;
                if(o.t > tmax) tmax = o.t;
                if(o.v < vmin) vmin = o.v;
                if(o.v > vmax) vmax = o.v;
              });
              if(tmax < nu - venster || tmin > nu + venster) return null;
              if(vmax <= vmin) return null;
              return p;
            };
            // Alleen sensoren die iets met zon te maken hebben, zodat een
            // willekeurig ander tijdreeks-attribuut (bv. prijzen) niet meetelt.
            var zonNaam = /solar|zonnepane|zonnesch|pv_|_pv|energy_production|forecast/i;
            var gevonden = [];
            Object.keys(states).forEach(function(id){
              if(id.lastIndexOf('sensor.', 0) !== 0) return;
              var s = states[id];
              if(!s || !s.attributes) return;
              if(!zonNaam.test((s.attributes.friendly_name || '') + ' ' + id)) return;
              Object.keys(s.attributes).some(function(a){
                var r = alsReeks(s.attributes[a]);
                if(r) gevonden.push({id: id, punten: r});
                return !!r;   // één reeks per sensor is genoeg
              });
            });
            if(gevonden.length){
              // Er staan twee installaties op het dak (zolder + overkapping),
              // elk met een eigen voorspelling. Per tijdstip optellen, net als
              // het dagtotaal in packages/3 - Outside/Backyard/Solarpanels.yaml.
              var som = {};
              gevonden.forEach(function(g){
                g.punten.forEach(function(o){ som[o.t] = (som[o.t] || 0) + o.v; });
              });
              Object.keys(som).forEach(function(t){ punten.push({t: Number(t), v: som[t]}); });
              zonBron = 'echt';
            }
            if(zonBron) punten.sort(function(a,b){ return a.t - b.t; });
            if(!zonBron && onder && op){
              // benadering: zonsopkomst afleiden en een sinusboog leggen
              var zonOp = (op > onder) ? op - 86400000 : op;
              var zonOnder = (onder > zonOp) ? onder : onder + 86400000;
              var totaalKwh = 0;
              var f = states['sensor.forecast_solar_production_today'];
              if(f && !isNaN(Number(f.state))) totaalKwh = Number(f.state);
              for(var i = 0; i <= 48; i++){
                var t = zonOp + (zonOnder - zonOp) * i / 48;
                var v = Math.sin(Math.PI * i / 48);
                punten.push({t: t, v: v * Math.max(totaalKwh, 1)});
              }
              zonBron = 'benadering';
            }
            var zichtbaar = punten.filter(function(p){ return p.t >= start - 3600000 && p.t <= eind + 3600000; });
            if(zichtbaar.length > 1){
              var max = Math.max.apply(null, zichtbaar.map(function(p){ return p.v; })) || 1;
              var d = zichtbaar.map(function(p, i){
                var x = klem(pct(p.t));
                var y = H.zon - (p.v / max) * (H.zon - 2);
                return (i === 0 ? 'M' : 'L') + x.toFixed(2) + ',' + y.toFixed(2);
              }).join(' ');
              var eersteX = klem(pct(zichtbaar[0].t)).toFixed(2);
              var laatsteX = klem(pct(zichtbaar[zichtbaar.length-1].t)).toFixed(2);
              var streep = zonBron === 'benadering' ? 'stroke-dasharray="2 2"' : '';
              lagen.push(`<svg viewBox="0 0 100 ${H.zon}" preserveAspectRatio="none" style="position:absolute;left:0;top:0;width:100%;height:${H.zon}px">
                <path d="${d} L${laatsteX},${H.zon} L${eersteX},${H.zon} Z" fill="rgba(74,222,128,0.16)"/>
                <path d="${d}" fill="none" stroke="#4ade80" stroke-width="0.6" vector-effect="non-scaling-stroke" ${streep}/>
              </svg>`);
              lagen.push(`<div style="position:absolute;left:6px;top:2px;font-size:9.5px;color:rgba(255,255,255,0.45)">zon ${zonBron === 'benadering' ? '(benadering)' : '(verwacht)'}</div>`);
            }

            // ---------- laag 3: prijsblokken ----------
            // Prijsblokken uit SlimHuys: kwartieren als die er zijn, anders uren,
            // plus die van morgen. 't' is de START van een blok; de code hieronder
            // leidt de bloklengte af uit het verschil tussen twee starts.
            var blok = function(eid, sleutel){ var e = states[eid]; return (e && e.attributes && e.attributes[sleutel]) || []; };
            var kw = blok('sensor.slimhuys_zonneplan_prijzen_vandaag_kwartier', 'raw_today');
            var raw = (kw.length ? kw : blok('sensor.slimhuys_zonneplan_prijzen_vandaag', 'raw_today'))
              .concat(blok('sensor.slimhuys_zonneplan_prijzen_morgen', 'raw_tomorrow'));
            var slots = raw.map(function(e){
              var d = new Date(e.start), p = Number(e.value);
              return (isNaN(d.getTime()) || isNaN(p)) ? null : {t: d.getTime(), p: p};
            }).filter(Boolean).sort(function(a,b){ return a.t - b.t; });
            var stap = slots.length > 1 ? slots[1].t - slots[0].t : 3600000;
            // dezelfde bandindeling als de stroomprijsgrafiek: per kalenderdag
            var perDag = {};
            slots.forEach(function(s){
              var k = new Date(s.t).toDateString();
              if(!perDag[k]) perDag[k] = {min: s.p, max: s.p};
              else { perDag[k].min = Math.min(perDag[k].min, s.p); perDag[k].max = Math.max(perDag[k].max, s.p); }
            });
            // ---------- goedkoopste laadvenster ----------
            // Vóór het tekenen van de blokken, want binnen de beugel laten we het
            // prijsje weg (daar staat "LADEN" al, en 12px hoog past niet twee keer).
            // De berekening zelf staat sinds 2026-08-16 in
            // sensor.goedkoopste_laadvenster (packages/9 - Other/Stroomprijs.yaml);
            // de laadkaart onder AUTO leest dezelfde sensor, dus die twee kunnen
            // niet meer van elkaar afwijken.
            var beste = null;
            var lv = states['sensor.goedkoopste_laadvenster'];
            if(lv && ['unavailable','unknown',''].indexOf(lv.state) === -1 && lv.attributes){
              var lvVan = new Date(lv.state).getTime();
              var lvTot = new Date(lv.attributes.tot).getTime();
              var lvGem = Number(lv.attributes.gemiddelde);
              if(!isNaN(lvVan) && !isNaN(lvTot) && !isNaN(lvGem)) beste = {gem: lvGem, van: lvVan, tot: lvTot};
            }

            // Prijs als tekst in het blok: op een touchscreen is een title=-tooltip
            // onbereikbaar, dus het getal moet gewoon zichtbaar zijn.
            var euro = function(p){ return p.toFixed(2).replace('.', ','); };
            slots.forEach(function(s){
              if(s.t + stap < start || s.t > eind) return;
              var d = perDag[new Date(s.t).toDateString()];
              var spreiding = d.max - d.min;
              var r = spreiding < 0.02 ? 0.5 : (s.p - d.min) / spreiding;
              var kleur = r <= 0.33 ? '#4ade80' : (r >= 0.66 ? '#ef4444' : '#f59e0b');
              var a = klem(pct(s.t)), b = klem(pct(s.t + stap));
              if(b - a <= 0.05) return;
              var inVenster = beste && s.t < beste.tot && s.t + stap > beste.van;
              var etiket = '';
              if(!inVenster && (b - a) >= 3.5){
                etiket = `<span style="font-size:8px;font-weight:700;color:rgba(0,0,0,0.72);letter-spacing:-0.2px">${(b - a) >= 6 ? '€' : ''}${euro(s.p)}</span>`;
              }
              lagen.push(`<div title="${klok(s.t)} · € ${s.p.toFixed(3)}" style="position:absolute;left:${a}%;width:${b-a}%;top:${top.prijs}px;height:${H.prijs}px;background:${kleur};opacity:0.85;display:flex;align-items:center;justify-content:center;overflow:hidden">${etiket}</div>`);
            });

            // ---------- laadvenster als beugel over de blokken ----------
            if(beste && beste.van < eind){
              var a = klem(pct(beste.van)), b = klem(pct(beste.tot));
              // Volledig etiket alleen als de beugel breed genoeg is; anders klapt
              // hij terug naar "LADEN" en daaronder naar alleen de beugel.
              var tekst = (b - a) > 16 ? `LADEN ${klok(beste.van)}–${klok(beste.tot)} · € ${euro(beste.gem)}` : ((b - a) > 7 ? 'LADEN' : '');
              // Cyaan op een groen/amber blok is onleesbaar, dus het etiket krijgt
              // een donkere chip; zo blijft het leesbaar op elke blokkleur.
              var etiket = tekst
                ? `<span style="font-size:8.5px;font-weight:700;color:#e0f2fe;letter-spacing:0.4px;background:rgba(8,25,45,0.92);padding:0 4px;border-radius:3px;line-height:1.2">${tekst}</span>`
                : '';
              if(b - a > 1) lagen.push(`<div title="goedkoopst laden" style="position:absolute;left:${a}%;width:${b-a}%;top:${top.prijs - 2}px;height:${H.prijs + 4}px;border:1.5px solid #38bdf8;border-radius:4px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap">${etiket}</div>`);
            }

            // ---------- laag 4: markers ----------
            var markers = [];
            var agenda = states['sensor.agenda_afspraken_vandaag'];
            if(agenda && agenda.attributes){
              ['vandaag','morgen'].forEach(function(k){
                var lijst = agenda.attributes[k];
                if(!Array.isArray(lijst)) return;
                lijst.forEach(function(a){
                  if(a.hele_dag || !a.tijd) return;
                  var t = new Date(a.datum + 'T' + a.tijd + ':00').getTime();
                  if(!isNaN(t)) markers.push({t: t, icon: 'mdi:calendar', kleur: '#38bdf8', tekst: a.titel});
                });
              });
            } else {
              // terugval zolang de get_events-sensor er niet is: eerstvolgende per agenda
              [['calendar.r_bohnen_vrbn_nl_agenda','Werk'],['calendar.robin_bohnen_nl_agenda','Privé'],
               ['calendar.robin_en_sam','Samen'],['calendar.brandweer','Brandweer'],
               ['calendar.maxi','Logan'],['calendar.mini','Emma']].forEach(function(c){
                var e = states[c[0]];
                if(!e || !e.attributes || !e.attributes.start_time || e.attributes.all_day) return;
                var t = new Date(String(e.attributes.start_time).replace(' ','T')).getTime();
                if(!isNaN(t)) markers.push({t: t, icon: 'mdi:calendar', kleur: '#38bdf8', tekst: e.attributes.message || c[1]});
              });
            }
            if(onder) markers.push({t: onder, icon: 'mdi:weather-sunset-down', kleur: '#f59e0b', tekst: 'zonsondergang'});
            if(op && op < eind) markers.push({t: op, icon: 'mdi:weather-sunset-up', kleur: '#f59e0b', tekst: 'zonsopkomst'});
            var afval = states['sensor.afvalinfo_home_trash_type_tomorrow'];
            if(afval && afval.state && afval.state !== 'Geen'){
              var m = new Date(); m.setDate(m.getDate() + 1); m.setHours(7, 30, 0, 0);
              var soorten = [[/gft|groente|tuin/i,'#4ade80'], [/pbd|plastic|blik|drank/i,'#f59e0b'], [/papier/i,'#38bdf8']];
              var kl = 'rgba(255,255,255,0.7)';
              for(var i=0;i<soorten.length;i++) if(soorten[i][0].test(afval.state)) { kl = soorten[i][1]; break; }
              markers.push({t: m.getTime(), icon: 'mdi:trash-can-outline', kleur: kl, tekst: afval.state});
            }
            // Bedtijd van de kinderen. Doordeweeks de gewone helper, op
            // vrijdag- en zaterdagavond de weekendvariant (de bedtijd-
            // automatiseringen triggeren op allebei de tijdstippen; dit is
            // het tijdstip dat die avond in de praktijk geldt). Hebben Logan
            // en Emma dezelfde tijd, dan wordt het één marker - twee iconen
            // op exact hetzelfde punt duwen elkaar alleen maar naar rij twee.
            var bedTijd = function(gewoon, weekend){
              var wd = new Date().getDay();
              var e = states[(wd === 5 || wd === 6) ? weekend : gewoon] || states[gewoon];
              if(!e || !/^\d{2}:\d{2}/.test(String(e.state))) return null;
              var d = new Date();
              d.setHours(Number(String(e.state).slice(0,2)), Number(String(e.state).slice(3,5)), 0, 0);
              return d.getTime();
            };
            var bedLogan = bedTijd('input_datetime.bedtime_maxi', 'input_datetime.bedtime_maxi_weekend');
            var bedEmma = bedTijd('input_datetime.bedtime_mini', 'input_datetime.bedtime_mini_weekend');
            if(bedLogan !== null && bedLogan === bedEmma){
              markers.push({t: bedLogan, icon: 'mdi:sleep', kleur: '#a78bfa', tekst: 'bedtijd Logan & Emma'});
            } else {
              if(bedLogan !== null) markers.push({t: bedLogan, icon: 'mdi:sleep', kleur: '#a78bfa', tekst: 'bedtijd Logan'});
              if(bedEmma !== null) markers.push({t: bedEmma, icon: 'mdi:sleep', kleur: '#a78bfa', tekst: 'bedtijd Emma'});
            }
            // Droger: wanneer het programma klaar is, zolang er echt één
            // loopt. De eindtijd-sensor houdt buiten een programma zijn oude
            // tijdstip vast, vandaar de check op de status.
            var drS = states['sensor.droger_status'];
            var drE = states['sensor.droger_programma_eindtijd'];
            if(drS && drS.state === 'run' && drE && drE.state){
              var drT = new Date(drE.state).getTime();
              if(!isNaN(drT)) markers.push({t: drT, icon: 'mdi:tumble-dryer', kleur: '#38bdf8', tekst: 'droger klaar'});
            }

            markers = markers.filter(function(m){ return m.t >= start && m.t <= eind; })
                             .sort(function(a,b){ return a.t - b.t; });
            var verborgen = Math.max(0, markers.length - 8);
            // Eerst plaatsen, dan renderen: pas als de rijindeling vaststaat weten
            // we hoeveel ruimte er tot de volgende marker in dezelfde rij is, en
            // dus of het label erbij past. Op een touchscreen bestaat hover niet,
            // dus de tekst moet zichtbaar zijn en niet in een title= zitten.
            var rijen = [[], []];
            var rijLaatste = [-99, -99];
            markers.slice(0, 8).forEach(function(m){
              var x = pct(m.t);
              // botsing: te dicht op de vorige in rij 0? dan naar rij 1
              var rij = (x - rijLaatste[0] > 7) ? 0 : ((x - rijLaatste[1] > 7) ? 1 : -1);
              if(rij === -1) { verborgen++; return; }   // nooit stil weglaten
              rijLaatste[rij] = x;
              rijen[rij].push({m: m, x: klem(x)});
            });
            var esc = function(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
            rijen.forEach(function(rij, ri){
              rij.forEach(function(p, i){
                var y = top.markers + ri * rijHoogte;
                // rechts ruimte vrijhouden voor de "+N meer"-badge als die er is
                var rand = 100 - (verborgen > 0 ? 9 : 0);
                var ruimte = ((i + 1 < rij.length) ? rij[i+1].x : rand) - p.x - 1;
                var tekst = esc(p.m.tekst);
                var tip = `${klok(p.m.t)} · ${tekst}`;
                // Eén inline tekstregel (geen flexbox): het icoon zit in de tekstflow
                // en kan dus nooit los van de tijd komen te staan.
                // `vertical-align:middle` met een expliciete icoonbox: een
                // `ha-icon` is zelf een inline-flex, dus met een offset in
                // pixels gok je op de regelhoogte én rekt het icoon de regel op.
                // Zie de brandweer- en mediaregel, waar dat twee keer zichtbaar
                // misging (18-08).
                var regel = `<ha-icon icon="${p.m.icon}" style="--mdc-icon-size:12px;width:12px;height:12px;vertical-align:middle;color:${p.m.kleur}"></ha-icon> ${klok(p.m.t)}`;
                if(!tekst || ruimte < 6 || p.x > 93){
                  // te weinig ruimte voor tekst: alleen icoon + tijd, gecentreerd
                  lagen.push(`<div title="${tip}" style="position:absolute;left:${Math.min(p.x, 96)}%;transform:translateX(-50%);top:${y}px;white-space:nowrap;font-size:10px;color:rgba(255,255,255,0.62)">${regel}</div>`);
                  return;
                }
                // Links uitgelijnd zodat de tekst de vrije ruimte naar rechts in
                // loopt; -7px trekt het icoon terug op het echte tijdstip. De
                // breedte stopt vóór de volgende marker in dezelfde rij.
                lagen.push(`<div title="${tip}" style="position:absolute;left:${p.x}%;width:${ruimte}%;margin-left:-7px;top:${y}px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;color:rgba(255,255,255,0.62)">${regel} <span style="color:rgba(255,255,255,0.42)">${tekst}</span></div>`);
              });
            });

            if(verborgen > 0){
              lagen.push(`<div title="${verborgen} extra afspraak/afspraken passen niet naast elkaar" style="position:absolute;right:0;top:${top.markers}px;font-size:9.5px;color:rgba(255,255,255,0.45)">+${verborgen} meer</div>`);
            }

            // ---------- laag 5: nu ----------
            lagen.push(`<div style="position:absolute;left:${klem(pct(nu))}%;top:0;height:${top.as - 2}px;border-left:1px dashed rgba(255,255,255,0.75)"></div>`);

            // ---------- laag 6: tijdas ----------
            var eersteUur = new Date(start);
            eersteUur.setMinutes(0, 0, 0);
            if(eersteUur.getHours() % 2 !== 0) eersteUur.setHours(eersteUur.getHours() + 1);
            else eersteUur.setHours(eersteUur.getHours() + 2);
            for(var t = eersteUur.getTime(); t < eind; t += 7200000){
              var x = pct(t);
              if(x < 2 || x > 98) continue;
              lagen.push(`<div style="position:absolute;left:${x}%;transform:translateX(-50%);top:${top.as}px;font-size:9.5px;color:rgba(255,255,255,0.5)">${klok(t)}</div>`);
            }

            return `<div style="position:relative;width:100%;height:${totaal}px">${lagen.join('')}</div>`;
          ]]]
