# Rechterkolom: vandaag, klimaat, brandweer.
type: vertical-stack
card_mod:
  style: |
    #root { gap: 16px !important; }
cards:
  # VANDAAG
  - type: custom:mod-card
    card_mod:
      style: |
        ha-card {
          background: var(--ov-panel-bg) !important;
          border: var(--ov-panel-border) !important;
          border-radius: var(--ov-panel-radius) !important;
          box-shadow: none !important;
          padding: var(--ov-panel-padding) !important;
        }
    card:
      type: vertical-stack
      card_mod:
        style: |
          #root > *:nth-child(n+2) { border-top: 1px solid rgba(255,255,255,0.06) !important; }
      cards:
        - type: custom:button-card
          template: ov_title
          tap_action:
            action: navigate
            navigation_path: "#ov-vandaag"
          variables:
            title: VANDAAG
        - type: custom:button-card
          template: ov_listrow
          entity: sensor.afvalinfo_home_trash_type_today
          tap_action:
            action: navigate
            navigation_path: "#ov-vandaag"
          variables:
            title: Afval vandaag
            mdi: mdi:trash-can-outline
            kleur: |
              [[[
                var e = states['sensor.afvalinfo_home_trash_type_today'];
                var v = e && e.state && e.state !== 'Geen' ? e.state : '';
                // PBD vóór papier: "Drinkkartons" bevat 'karton'
                var soorten = [[/gft|groente|tuin/i,'#4ade80'], [/pbd|plastic|blik|drank/i,'#f59e0b'],
                               [/papier/i,'#38bdf8'], [/rest/i,'rgba(255,255,255,0.6)']];
                for(var i=0;i<soorten.length;i++) if(soorten[i][0].test(v)) return soorten[i][1];
                return 'rgba(255,255,255,0.35)';
              ]]]
          custom_fields:
            s: |
              [[[
                var e = states['sensor.afvalinfo_home_trash_type_today'];
                var v = e && e.state && e.state !== 'Geen' ? e.state : null;
                if(!v) return 'geen ophaal vandaag';
                // Kleur per soort, zodat je in één oogopslag ziet wat er buiten moet
                // PBD vóór papier: "Drinkkartons" bevat 'karton'
                var soorten = [[/gft|groente|tuin/i,'#4ade80'], [/pbd|plastic|blik|drank/i,'#f59e0b'],
                               [/papier/i,'#38bdf8'], [/rest/i,'rgba(255,255,255,0.7)']];
                var kleur = 'rgba(255,255,255,0.7)';
                for(var i=0;i<soorten.length;i++) if(soorten[i][0].test(v)) { kleur = soorten[i][1]; break; }
                return `<span style="color:${kleur}">${v}</span>`;
              ]]]
        - type: custom:button-card
          template: ov_listrow
          entity: sensor.afvalinfo_home_trash_type_tomorrow
          tap_action:
            action: navigate
            navigation_path: "#ov-vandaag"
          variables:
            title: Afval morgen
            mdi: mdi:recycle
            kleur: |
              [[[
                var e = states['sensor.afvalinfo_home_trash_type_tomorrow'];
                var v = e && e.state && e.state !== 'Geen' ? e.state : '';
                // PBD vóór papier: "Drinkkartons" bevat 'karton'
                var soorten = [[/gft|groente|tuin/i,'#4ade80'], [/pbd|plastic|blik|drank/i,'#f59e0b'],
                               [/papier/i,'#38bdf8'], [/rest/i,'rgba(255,255,255,0.6)']];
                for(var i=0;i<soorten.length;i++) if(soorten[i][0].test(v)) return soorten[i][1];
                return 'rgba(255,255,255,0.35)';
              ]]]
          custom_fields:
            s: |
              [[[
                var e = states['sensor.afvalinfo_home_trash_type_tomorrow'];
                var v = e && e.state && e.state !== 'Geen' ? e.state : null;
                if(!v) return 'geen ophaal morgen';
                // Kleur per soort, zodat je in één oogopslag ziet wat er buiten moet
                // PBD vóór papier: "Drinkkartons" bevat 'karton'
                var soorten = [[/gft|groente|tuin/i,'#4ade80'], [/pbd|plastic|blik|drank/i,'#f59e0b'],
                               [/papier/i,'#38bdf8'], [/rest/i,'rgba(255,255,255,0.7)']];
                var kleur = 'rgba(255,255,255,0.7)';
                for(var i=0;i<soorten.length;i++) if(soorten[i][0].test(v)) { kleur = soorten[i][1]; break; }
                return `<span style="color:${kleur}">${v}</span>`;
              ]]]
        # Volgende afspraak over alle agenda's heen. Kalender-entiteiten
        # exposen alleen hun eerstvolgende event als attribuut, dus we
        # verzamelen er één per agenda en kiezen de vroegste.
        - type: custom:button-card
          template: ov_listrow
          entity: calendar.r_bohnen_vrbn_nl_agenda
          tap_action:
            action: navigate
            navigation_path: "#ov-vandaag"
          variables:
            mdi: mdi:calendar
            agendas:
              - [calendar.r_bohnen_vrbn_nl_agenda, Werk]
              - [calendar.robin_bohnen_nl_agenda, Privé]
              - [calendar.robin_en_sam, Samen]
              - [calendar.brandweer, Brandweer]
              - [calendar.maxi, Logan]
              - [calendar.mini, Emma]
          custom_fields:
            t: |
              [[[
                // Voorkeur: de get_events-sensor (telt en kent alle afspraken).
                // Bestaat die nog niet, dan terugvallen op de kalender-attributen.
                var sen = states['sensor.agenda_afspraken_vandaag'];
                var v = sen && sen.attributes ? sen.attributes.volgende : null;
                if(v && v.titel){
                  var titel = String(v.titel);
                  return titel.length > 30 ? titel.slice(0,29) + '…' : titel;
                }
                var now = new Date();
                var lijst = [];
                (variables.agendas || []).forEach(function(c){
                  var e = states[c[0]];
                  if(!e || !e.attributes || !e.attributes.start_time) return;
                  var st = new Date(String(e.attributes.start_time).replace(' ','T'));
                  if(isNaN(st.getTime())) return;
                  var en = e.attributes.end_time ? new Date(String(e.attributes.end_time).replace(' ','T')) : null;
                  if(en && !isNaN(en.getTime()) && en < now) return;
                  lijst.push({msg: e.attributes.message || 'Afspraak', st: st, allday: !!e.attributes.all_day});
                });
                if(!lijst.length) return 'Agenda';
                // afspraken met tijd gaan voor meerdaagse hele-dag-notities
                lijst.sort(function(a,b){ return a.allday !== b.allday ? (a.allday ? 1 : -1) : a.st - b.st; });
                var m = lijst[0].msg;
                if(m.length > 30) m = m.slice(0,29) + '…';
                return m;
              ]]]
            s: |
              [[[
                var sen = states['sensor.agenda_afspraken_vandaag'];
                var v = sen && sen.attributes ? sen.attributes.volgende : null;
                if(v && v.datum){
                  var d = new Date(v.datum + 'T00:00:00');
                  var mid = new Date(); mid.setHours(0,0,0,0);
                  var dag = Math.round((d - mid) / 86400000);
                  var dagTxt = dag === 0 ? 'vandaag' : (dag === 1 ? 'morgen' : d.toLocaleDateString('nl-NL',{day:'numeric',month:'short'}));
                  var klok = new Date().toTimeString().slice(0,5);
                  var tijd;
                  if(v.hele_dag) tijd = 'hele dag';
                  else if(dag === 0 && v.tijd <= klok && (!v.eind || v.eind >= klok)) tijd = 'nu bezig';
                  else tijd = v.tijd || '';
                  var n = Number(sen.state);
                  var extra = (dag === 0 && !isNaN(n) && n > 1) ? ` · nog ${n - 1} vandaag` : '';
                  return `${dagTxt} · ${tijd} · ${v.agenda}${extra}`;
                }
                var now = new Date();
                var lijst = [];
                (variables.agendas || []).forEach(function(c){
                  var e = states[c[0]];
                  if(!e || !e.attributes || !e.attributes.start_time) return;
                  var st = new Date(String(e.attributes.start_time).replace(' ','T'));
                  if(isNaN(st.getTime())) return;
                  var en = e.attributes.end_time ? new Date(String(e.attributes.end_time).replace(' ','T')) : null;
                  if(en && !isNaN(en.getTime()) && en < now) return;
                  lijst.push({st: st, en: en, allday: !!e.attributes.all_day, bron: c[1]});
                });
                if(!lijst.length) return 'geen afspraken';
                lijst.sort(function(a,b){ return a.allday !== b.allday ? (a.allday ? 1 : -1) : a.st - b.st; });
                var it = lijst[0];
                var mid = new Date(now); mid.setHours(0,0,0,0);
                var dag = Math.round((new Date(it.st).setHours(0,0,0,0) - mid.getTime()) / 86400000);
                var dagTxt = dag === 0 ? 'vandaag' : (dag === 1 ? 'morgen' : it.st.toLocaleDateString('nl-NL',{day:'numeric',month:'short'}));
                var tijd;
                if(it.allday) tijd = 'hele dag';
                else if(it.st <= now && it.en && it.en >= now) tijd = 'nu bezig';
                else tijd = it.st.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
                return `${dagTxt} · ${tijd} · ${it.bron}`;
              ]]]
  # KLIMAAT
  - type: custom:mod-card
    card_mod:
      style: |
        ha-card {
          background: var(--ov-panel-bg) !important;
          border: var(--ov-panel-border) !important;
          border-radius: var(--ov-panel-radius) !important;
          box-shadow: none !important;
          padding: var(--ov-panel-padding) !important;
        }
    card:
      type: vertical-stack
      card_mod:
        style: |
          #root > *:nth-child(n+2) { border-top: 1px solid rgba(255,255,255,0.06) !important; }
      cards:
        - type: custom:button-card
          template: ov_title
          tap_action:
            action: navigate
            navigation_path: "#ov-klimaat"
          variables:
            title: KLIMAAT
        - type: custom:button-card
          template: ov_climate
          entity: climate.airco_woonkamer
          name: Airco woonkamer
        - type: custom:button-card
          template: ov_climate
          entity: climate.airco_zolder
          name: Airco zolder
        - type: custom:button-card
          template: ov_climate
          entity: climate.intex_purespa
          name: Intex PureSpa
        # Lucht woonkamer (multisensor): CO2, fijnstof en vocht op één regel,
        # met de luchtkwaliteitsklasse als badge. Zelfde grid als ov_climate,
        # maar de subregel bouwt zijn eigen waarden op dus geen template.
        - type: custom:button-card
          entity: sensor.woonkamer_woonkamer_multisensor_luchtkwaliteit
          show_icon: false
          show_name: false
          show_state: false
          # Deze regel vat drie metingen samen; more-info gaf de geschiedenis
          # van alleen de luchtkwaliteitsklasse. De popup heeft CO2, fijnstof
          # en vocht elk als eigen grafiek.
          tap_action:
            action: navigate
            navigation_path: "#ov-lucht"
          styles:
            grid:
              - grid-template-areas: '"n badge" "sub badge"'
              - grid-template-columns: 1fr auto
              - align-items: center
              - column-gap: 10px
            card:
              - background: none
              - border: none
              - box-shadow: none
              - padding: 11px 2px
            custom_fields:
              n:
                - grid-area: n
                - justify-self: start
              sub:
                - grid-area: sub
                - justify-self: start
                - font-size: 12.5px
                - padding-top: 2px
              badge:
                - grid-area: badge
                - justify-self: end
          custom_fields:
            n: |
              [[[ return `<span style="font-size:14.5px;font-weight:600;color:white">Lucht woonkamer</span>`; ]]]
            sub: |
              [[[
                var grijs = 'rgba(255,255,255,0.58)';
                // getal ophalen; null als de sensor er niet is of niets zinnigs geeft
                var num = function(id){
                  var e = states[id];
                  if(!e || isNaN(Number(e.state))) return null;
                  return Number(e.state);
                };
                // tekst() krijgt de waarde binnen, zodat een ontbrekende sensor
                // hier stopt in plaats van in de opmaak van een null.
                var deel = function(waarde, tekst, drempel, alarm){
                  if(waarde === null) return null;
                  var kleur = waarde >= alarm ? '#ef4444' : (waarde >= drempel ? '#f59e0b' : grijs);
                  return `<span style="color:${kleur};font-weight:${waarde >= drempel ? 600 : 400}">${tekst(waarde)}</span>`;
                };
                var co2 = num('sensor.woonkamer_woonkamer_multisensor_kooldioxide');
                var pm = num('sensor.woonkamer_woonkamer_multisensor_pm2_5');
                var rv = num('sensor.woonkamer_woonkamer_multisensor_luchtvochtigheid');
                var d = [];
                // CO2: boven ~800 ppm wordt het benauwd, boven 1200 echt ventileren
                var c = deel(co2, v => `${Math.round(v)} ppm`, 800, 1200);
                if(c) d.push(c);
                // PM2.5: WHO-daggemiddelde ligt op 15 µg/m³
                var p = deel(pm, v => `PM2.5 ${v.toFixed(1).replace('.',',')}`, 15, 35);
                if(p) d.push(p);
                if(rv !== null) {
                  // Vocht knijpt aan twee kanten: te droog én te vochtig is mis
                  var kleur = (rv < 30 || rv > 70) ? '#f59e0b' : grijs;
                  d.push(`<span style="color:${kleur}">${Math.round(rv)}% rv</span>`);
                }
                if(!d.length) return `<span style="color:${grijs}">geen meting</span>`;
                return d.join(`<span style="color:rgba(255,255,255,0.2)"> · </span>`);
              ]]]
            badge: |
              [[[
                if(!entity || entity.state === 'unavailable' || entity.state === 'unknown') return '';
                var groen = ['#4ade80','rgba(74,222,128,0.15)'];
                var grijs = ['rgba(255,255,255,0.6)','rgba(255,255,255,0.08)'];
                var oranje = ['#f59e0b','rgba(245,158,11,0.15)'];
                var rood = ['#ef4444','rgba(239,68,68,0.15)'];
                var map = {excellent:['uitstekend'].concat(groen),
                           good:['goed'].concat(groen),
                           fair:['redelijk'].concat(grijs),
                           moderate:['matig'].concat(oranje),
                           poor:['slecht'].concat(oranje),
                           very_poor:['zeer slecht'].concat(rood),
                           extremely_poor:['extreem slecht'].concat(rood)};
                var m = map[entity.state];
                if(!m) m = [String(entity.state).replace(/_/g,' ')].concat(grijs);
                return `<span style="font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;color:${m[1]};background:${m[2]}">${m[0]}</span>`;
              ]]]
        # Zonnescherm met knoppen
        - type: horizontal-stack
          card_mod:
            style: |
              #root {
                display: grid !important;
                grid-template-columns: 1fr auto auto !important;
                align-items: center !important;
                gap: 8px !important;
              }
          cards:
            - type: custom:button-card
              entity: cover.achtertuin_zonnescherm
              show_icon: false
              show_name: false
              show_state: false
              tap_action:
                action: more-info
              styles:
                card:
                  - background: none
                  - border: none
                  - box-shadow: none
                  - padding: 11px 2px
                grid:
                  - grid-template-areas: '"n" "s"'
                  - justify-items: start
              custom_fields:
                n: |
                  [[[ return `<span style="font-size:14.5px;font-weight:600;color:white">Zonnescherm</span>`; ]]]
                s: |
                  [[[
                    var c = states['cover.achtertuin_zonnescherm'];
                    // open = uitgeschoven, closed = ingetrokken (zie Sunscreen.yaml)
                    var m = {open:'uit', closed:'ingetrokken', opening:'gaat uit', closing:'gaat in'};
                    return `<span style="font-size:12.5px;color:rgba(255,255,255,0.58)">achtertuin · ${c ? (m[c.state] || c.state) : '?'}</span>`;
                  ]]]
            # Uitschuiven gaat naar beneden/naar buiten, dus geen chevron-omhoog:
            # dat las als "scherm optrekken" terwijl open_cover hem juist uitzet.
            - type: custom:button-card
              icon: mdi:arrow-expand-down
              tap_action:
                action: perform-action
                perform_action: cover.open_cover
                target:
                  entity_id: cover.achtertuin_zonnescherm
              styles:
                card:
                  - background: rgba(255,255,255,0.05)
                  - border: 1px solid rgba(255,255,255,0.08)
                  - border-radius: 12px
                  - padding: 8px
                  - width: 42px
                  - height: 42px
                icon:
                  - color: rgba(255,255,255,0.8)
                  - width: 22px
            - type: custom:button-card
              icon: mdi:arrow-collapse-up
              tap_action:
                action: perform-action
                perform_action: cover.close_cover
                target:
                  entity_id: cover.achtertuin_zonnescherm
              styles:
                card:
                  - background: rgba(255,255,255,0.05)
                  - border: 1px solid rgba(255,255,255,0.08)
                  - border-radius: 12px
                  - padding: 8px
                  - width: 42px
                  - height: 42px
                icon:
                  - color: rgba(255,255,255,0.8)
                  - width: 22px
  # SCHAKELAARS
  # Eén regel in plaats van twee panelen met tien losse rijen (Robin,
  # 14 augustus 2026: "dit neemt veel te veel ruimte in"). De volledige lijst
  # zit achter #ov-schakelaars; hier staan alleen een samenvatting en de twee
  # knoppen die het vaakst gebruikt worden. Zelfde opzet als de
  # zonnescherm-regel hierboven: tekst links, mini-knoppen rechts.
  - type: custom:mod-card
    card_mod:
      style: |
        ha-card {
          background: var(--ov-panel-bg) !important;
          border: var(--ov-panel-border) !important;
          border-radius: var(--ov-panel-radius) !important;
          box-shadow: none !important;
          padding: var(--ov-panel-padding) !important;
        }
    card:
      type: horizontal-stack
      card_mod:
        style: |
          #root {
            display: grid !important;
            grid-template-columns: 1fr auto auto !important;
            align-items: center !important;
            gap: 8px !important;
          }
      cards:
        - type: custom:button-card
          entity: sensor.time
          show_icon: false
          show_name: false
          show_state: false
          tap_action:
            action: navigate
            navigation_path: "#ov-schakelaars"
          styles:
            card:
              - background: none
              - border: none
              - box-shadow: none
              - padding: 2px
            grid:
              - grid-template-areas: '"n" "s"'
              - justify-items: start
          custom_fields:
            n: |
              [[[ return `<span style="font-size:14.5px;font-weight:600;color:white">Schakelaars</span>`; ]]]
            s: |
              [[[
                // Alleen tellen wat je hier ook echt kunt omzetten - dezelfde
                // met de hand aangewezen lijst als in de popup, geen scan over
                // alle switches.
                //
                // De drie spa-schakelaars staan apart omdat ze nooit los
                // wegvallen: de wifi-module van de jacuzzi is er of niet, en
                // dan gaan ze alle drie tegelijk (15-08-2026 02:50, code e81).
                // "3 onbereikbaar" liet je dan zoeken welke drie; "spa offline"
                // zegt meteen dat het één apparaat is en welk.
                var spa = ['switch.intex_purespa_power','switch.intex_purespa_filter',
                           'switch.intex_purespa_sanitizer'];
                var rest = ['input_boolean.backyard_spa_keep_warm',
                            'switch.linea_micra_kroon_18',
                            'switch.woonkamer_woonkamer_stopcontact_luchtreiniger',
                            'switch.eettafel_eettafel_stopcontact_luchtreiniger',
                            'switch.achtertuin_schuur_lampen',
                            'switch.meterkast_meterkast_stopcontact_ledstrip'];
                var weg = function(e){
                  return !states[e] || ['unavailable','unknown'].indexOf(states[e].state) !== -1; };
                var aan = spa.concat(rest).filter(function(e){
                  return states[e] && states[e].state === 'on'; }).length;
                var spa_weg = spa.filter(weg).length;
                var t = aan === 0 ? 'alles uit' : aan + ' aan';
                // Valt maar een deel van de spa weg, dan is het geen offline
                // module en telt hij gewoon mee in het aantal.
                var los = rest.filter(weg).length + (spa_weg === spa.length ? 0 : spa_weg);
                if(spa_weg === spa.length) t += ' · spa offline';
                if(los) t += ' · ' + los + ' onbereikbaar';
                return `<span style="font-size:12.5px;color:rgba(255,255,255,0.58)">${t}</span>`;
              ]]]
        # Koffie en alle lichten staan hier los omdat dat de twee zijn die je
        # in het voorbijgaan omzet; de rest is een tik extra waard.
        - type: custom:button-card
          entity: switch.linea_micra_kroon_18
          icon: mdi:coffee
          show_name: false
          show_state: false
          tap_action:
            action: toggle
          hold_action:
            action: more-info
          styles:
            card:
              - background: rgba(255,255,255,0.05)
              - border: 1px solid rgba(255,255,255,0.08)
              - border-radius: 12px
              - padding: 8px
              - width: 42px
              - height: 42px
            icon:
              - width: 22px
              - color: |
                  [[[
                    var e = states['switch.linea_micra_kroon_18'];
                    if(!e || ['unavailable','unknown'].indexOf(e.state) !== -1)
                      return 'rgba(255,255,255,0.25)';
                    return e.state === 'on' ? '#f59e0b' : 'rgba(255,255,255,0.35)';
                  ]]]
        - type: custom:button-card
          entity: light.all_lights
          icon: mdi:lightbulb-group
          show_name: false
          show_state: false
          tap_action:
            action: toggle
          hold_action:
            action: more-info
          styles:
            card:
              - background: rgba(255,255,255,0.05)
              - border: 1px solid rgba(255,255,255,0.08)
              - border-radius: 12px
              - padding: 8px
              - width: 42px
              - height: 42px
            icon:
              - width: 22px
              - color: |
                  [[[
                    var e = states['light.all_lights'];
                    if(!e || ['unavailable','unknown'].indexOf(e.state) !== -1)
                      return 'rgba(255,255,255,0.25)';
                    return e.state === 'on' ? '#f59e0b' : 'rgba(255,255,255,0.35)';
                  ]]]

  # BRANDWEER
  - type: custom:mod-card
    card_mod:
      style: |
        ha-card {
          background: var(--ov-panel-bg) !important;
          border: var(--ov-panel-border) !important;
          border-radius: var(--ov-panel-radius) !important;
          box-shadow: none !important;
          padding: var(--ov-panel-padding) !important;
        }
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          template: ov_title
          tap_action:
            action: navigate
            navigation_path: "#ov-brandweer"
          variables:
            title: BRANDWEER
          custom_fields:
            b: |
              [[[
                var p = states['input_select.brandweer_dienstdoende_ploeg'];
                var t = p ? p.state : '—';
                return `<span style="font-size:11.5px;font-weight:600;padding:3px 11px;border-radius:20px;color:#38bdf8;background:rgba(56,189,248,0.15)">${t}</span>`;
              ]]]
        - type: custom:button-card
          entity: input_text.brandweer_laatste_melding
          show_icon: false
          show_name: false
          show_state: false
          tap_action:
            action: navigate
            navigation_path: "#ov-brandweer"
          styles:
            card:
              - background: none
              - border: none
              - box-shadow: none
              - padding: 8px 2px
            grid:
              - grid-template-areas: '"pri msg badge" "pri sub badge"'
              - grid-template-columns: 44px 1fr auto
              - align-items: center
              - column-gap: 12px
            custom_fields:
              pri:
                - grid-area: pri
              msg:
                - grid-area: msg
                - justify-self: start
              sub:
                - grid-area: sub
                - justify-self: start
              badge:
                - grid-area: badge
                - justify-self: end
          custom_fields:
            pri: |
              [[[
                var e = states['input_text.brandweer_laatste_melding'];
                var t = e && e.state ? e.state : '';
                var m = t.match(/^\s*([A-Pa-p])\s*(\d)/);
                if(m){
                  var code = (m[1] + m[2]).toUpperCase();
                  return `<div style="min-width:34px;height:34px;padding:0 8px;box-sizing:border-box;border-radius:9px;background:rgba(245,158,11,0.16);color:#f59e0b;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">${code}</div>`;
                }
                return `<div style="width:38px;height:38px;border-radius:10px;background:rgba(245,158,11,0.16);color:#f59e0b;display:flex;align-items:center;justify-content:center"><ha-icon icon="mdi:fire-truck" style="--mdc-icon-size:20px"></ha-icon></div>`;
              ]]]
            msg: |
              [[[
                var e = states['input_text.brandweer_laatste_melding'];
                var t = e && e.state ? e.state : 'Geen recente melding';
                t = t.replace(/^\s*[A-Pa-p]\s*\d\s*/, '');
                if(t.length > 46) t = t.slice(0,45) + '…';
                return `<span style="font-size:14px;font-weight:600;color:white">${t}</span>`;
              ]]]
            sub: |
              [[[
                var d = states['input_datetime.brandweer_laatste_melding'];
                if(!d || !d.state) return `<span style="font-size:12px;color:rgba(255,255,255,0.55)">—</span>`;
                var dt = new Date(d.state.replace(' ','T'));
                var s = dt.toLocaleDateString('nl-NL',{day:'numeric',month:'short'}) + ' ' + dt.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
                return `<span style="font-size:12px;color:rgba(255,255,255,0.55)">${s}</span>`;
              ]]]
            badge: |
              [[[
                var out = states['binary_sensor.brandweer_uitgerukt_op_laatste_melding'];
                var secs = states['input_number.brandweer_uitruktijd_secondes'];
                if(!out || out.state !== 'on') return '';
                var s = secs && !isNaN(Number(secs.state)) ? Math.round(Number(secs.state)) + ' s' : '';
                return `<span style="font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;color:#4ade80;background:rgba(52,168,120,0.15)">uitgerukt · ${s}</span>`;
              ]]]
        # Bezetting van alle drie de ploegen; de dienstdoende licht op.
        #
        # Twee bronnen, in deze volgorde: sensor.brandweer_bezetting (de
        # PreCom-webhook, weet per ploeg de status én per functie waar het gat
        # zit) en anders sensor.bezetting_ploeg_* (de poll van elke vijf
        # minuten, kent alleen een aantal). De webhook vuurt bij elke PreCom-
        # wijziging, maar vlak na het opzetten van deze koppeling (of na een
        # herstart met een lege sensor) is er nog niets — vandaar de terugval.
        #
        # triggers_update: button-card hertekent alleen als zijn eigen `entity`
        # verandert, en dat is hier de dienstdoende ploeg (wisselt één keer per
        # week). Zonder deze lijst bleven de cijfers op het wandpaneel staan
        # waar ze bij de laatste ploegwissel stonden.
        - type: custom:button-card
          entity: input_select.brandweer_dienstdoende_ploeg
          triggers_update:
            - sensor.brandweer_bezetting
            - sensor.bezetting_ploeg_a
            - sensor.bezetting_ploeg_b
            - sensor.bezetting_ploeg_c
          show_icon: false
          show_name: false
          show_state: false
          tap_action:
            action: navigate
            navigation_path: "#ov-brandweer"
          styles:
            card:
              - background: none
              - border: none
              - box-shadow: none
              - padding: 11px 2px 4px 2px
              - border-top: 1px solid rgba(255,255,255,0.06)
            grid:
              - grid-template-areas: '"cap" "ploegen" "gat"'
              - row-gap: 7px
            custom_fields:
              cap:
                - grid-area: cap
                - justify-self: start
              ploegen:
                - grid-area: ploegen
              gat:
                - grid-area: gat
                - justify-self: stretch
          custom_fields:
            cap: |
              [[[
                var ds = states['input_select.brandweer_dienstdoende_ploeg'];
                var p = ds && ds.state ? ds.state.charAt(0).toUpperCase() : null;
                var staart = p && 'ABC'.indexOf(p) !== -1
                  ? `<span style="color:#38bdf8;font-weight:600">${p}-ploeg heeft dienst</span>`
                  : `<span style="color:rgba(255,255,255,0.4)">dienstdoende ploeg onbekend</span>`;
                return `<span style="font-size:12.5px;color:rgba(255,255,255,0.55)">Bezetting · ${staart}</span>`;
              ]]]
            ploegen: |
              [[[
                var ds = states['input_select.brandweer_dienstdoende_ploeg'];
                var dienst = ds && ds.state ? ds.state.charAt(0).toUpperCase() : '';
                var bez = states['sensor.brandweer_bezetting'];
                var attrs = (bez && bez.attributes) ? bez.attributes : {};
                var uitWebhook = {};
                (attrs.ploegen || []).forEach(function(p){ uitWebhook[p.ploeg] = p; });
                var cellen = ['A','B','C'].map(function(letter){
                  var w = uitWebhook[letter];
                  var s = states['sensor.bezetting_ploeg_' + letter.toLowerCase()];
                  var n = w ? w.aantal : (s && !isNaN(Number(s.state)) ? Number(s.state) : null);
                  // Kleur uit de status die PreCom zelf bepaalt; zonder webhook
                  // terug naar de vuistregel op het aantal.
                  var col = w ? ({onderbezet:'#ef4444', krap:'#f59e0b'}[w.status] || '#4ade80')
                          : (n === null ? 'rgba(255,255,255,0.35)'
                          : (n < 4 ? '#ef4444' : (n < 6 ? '#f59e0b' : '#4ade80')));
                  var aan = letter === dienst;
                  var bg = aan ? 'rgba(56,189,248,0.12)' : 'rgba(255,255,255,0.04)';
                  var rand = aan ? '1px solid rgba(56,189,248,0.35)' : '1px solid rgba(255,255,255,0.06)';
                  // Vaste onderregel, ook als hij leeg is, zodat de drie cellen even hoog blijven.
                  var onder = aan
                    ? `<span style="font-size:9.5px;font-weight:700;letter-spacing:0.6px;color:#38bdf8">DIENST</span>`
                    : `<span style="font-size:9.5px">&nbsp;</span>`;
                  return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px 0;border-radius:11px;background:${bg};border:${rand}"><span style="font-size:11px;font-weight:700;letter-spacing:0.8px;color:${aan ? '#38bdf8' : 'rgba(255,255,255,0.5)'}">${letter}</span><span style="font-size:19px;font-weight:700;line-height:1.1;color:${col}">${n === null ? '—' : n}</span>${onder}</div>`;
                });
                return `<div style="display:flex;gap:8px">${cellen.join('')}</div>`;
              ]]]
            # Welke functie het gat veroorzaakt, en hoeveel mensen hun pager uit
            # hebben staan — dat laatste is wie het gat nog kan dichten. Leeg
            # zodra de bezetting op orde is; dan valt de rij weg.
            gat: |
              [[[
                var bez = states['sensor.brandweer_bezetting'];
                var attrs = (bez && bez.attributes) ? bez.attributes : {};
                var gaten = attrs.gaten || [];
                if(!gaten.length) return '';
                var hard = gaten.some(function(g){ return g.status === 'onderbezet'; });
                var col = hard ? '#ef4444' : '#f59e0b';
                var tekst = gaten.map(function(g){ return g.kort; }).join(' · ');
                var pager = (attrs.pager_uit || []).length;
                var staart = pager
                  ? `<span style="color:rgba(255,255,255,0.55)"> · ${pager}× pager uit</span>` : '';
                return `<div style="display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:10px;background:${hard ? 'rgba(239,68,68,0.12)' : 'rgba(245,158,11,0.12)'};border:1px solid ${hard ? 'rgba(239,68,68,0.3)' : 'rgba(245,158,11,0.3)'}">
                  <ha-icon icon="mdi:account-alert" style="--mdc-icon-size:15px;color:${col};flex:0 0 auto"></ha-icon>
                  <span style="font-size:12px;font-weight:600;color:${col};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${tekst}${staart}</span></div>`;
              ]]]
        - type: custom:button-card
          tap_action:
            action: none
          styles:
            card:
              - background: none
              - border: none
              - box-shadow: none
              - padding: 10px 2px 2px 2px
              - border-top: 1px solid rgba(255,255,255,0.06)
            grid:
              - grid-template-areas: '"tot a b c"'
              - grid-template-columns: 1.4fr 1fr 1fr 1fr
              - align-items: center
          custom_fields:
            tot: |
              [[[
                var e = states['counter.brandweer_totaal_aantal_uitrukken'];
                return `<span><span style="font-size:16px;font-weight:700;color:white">${e ? e.state : '—'}</span> <span style="font-size:12px;color:rgba(255,255,255,0.55)">totaal</span></span>`;
              ]]]
            a: |
              [[[
                var e = states['counter.brandweer_uden_a_ploeg_uitrukken'];
                return `<span><span style="font-size:15px;font-weight:600;color:rgba(255,255,255,0.85)">${e ? e.state : '—'}</span> <span style="font-size:12px;color:rgba(255,255,255,0.55)">A</span></span>`;
              ]]]
            b: |
              [[[
                var e = states['counter.brandweer_uden_b_ploeg_uitrukken'];
                return `<span><span style="font-size:15px;font-weight:600;color:rgba(255,255,255,0.85)">${e ? e.state : '—'}</span> <span style="font-size:12px;color:rgba(255,255,255,0.55)">B</span></span>`;
              ]]]
            c: |
              [[[
                var e = states['counter.brandweer_uden_c_ploeg_uitrukken'];
                return `<span><span style="font-size:15px;font-weight:600;color:rgba(255,255,255,0.85)">${e ? e.state : '—'}</span> <span style="font-size:12px;color:rgba(255,255,255,0.55)">C</span></span>`;
              ]]]
