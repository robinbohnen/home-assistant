# Kopbalk van het Overzicht-dashboard: begroeting plus conditionele pillen.
type: horizontal-stack
card_mod:
  style: |
    #root {
      display: grid !important;
      grid-template-columns: 1fr auto !important;
      align-items: center !important;
      gap: 16px !important;
      padding: 2px 4px 4px 4px !important;
    }
    @media (max-width: 800px) {
      #root { grid-template-columns: 1fr !important; gap: 12px !important; }
    }
cards:
  - type: custom:button-card
    # De klok hieronder wordt in JS opgebouwd uit new Date(), maar button-card
    # rendert een kaart alleen opnieuw als zijn entity verandert. Zonder entity
    # bleef de tijd hangen op het moment van de laatste page-load — op een
    # wandpaneel dat dagen open staat liep dat ver achter. sensor.time tikt elke
    # minuut (time_date, zie packages/9 - Other/Dashboard Context.yaml).
    entity: sensor.time
    show_name: false
    show_state: false
    show_icon: false
    tap_action:
      action: none
    styles:
      card:
        - background: none
        - border: none
        - box-shadow: none
        - padding: 0
      grid:
        - grid-template-areas: '"h"'
        - justify-items: start
    custom_fields:
      h: |
        [[[
          var u = (user && typeof user === 'object') ? (user.name || 'thuis') : user;
          if(u) u = String(u).split(' ')[0];
          var d = new Date();
          var days = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
          var months = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
          var t = ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
          var ds = `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} · ${t}`;
          return `<span style="display:flex;align-items:baseline;gap:12px"><span style="font-size:22px;font-weight:700;color:white">Hallo ${u}</span><span style="font-size:14px;color:rgba(255,255,255,0.52)">${ds}</span></span>`;
        ]]]
  - type: horizontal-stack
    card_mod:
      style: |
        #root { gap: 10px !important; flex-wrap: wrap !important; }
        #root > * { flex: 0 0 auto !important; }
    cards:
      - type: custom:button-card
        template: ov_pill
        tap_action:
          action: none
        styles:
          card:
            - background: >
                [[[ var g = states['sensor.slimhuys_zonneplan_tariefniveau_nu']; return (g && /low/.test(g.state)) ? 'rgba(52,168,120,0.14)' : 'rgba(255,255,255,0.05)'; ]]]
            - border: >
                [[[ var g = states['sensor.slimhuys_zonneplan_tariefniveau_nu']; return (g && /low/.test(g.state)) ? '1px solid rgba(52,168,120,0.28)' : '1px solid rgba(255,255,255,0.06)'; ]]]
        custom_fields:
          c: |
            [[[
              var g = states['sensor.slimhuys_zonneplan_tariefniveau_nu'];
              var p = states['sensor.slimhuys_zonneplan_huidige_prijs'];
              // SlimHuys levert vijf niveaus, niet drie. Een niveau dat hier nog
              // niet in staat valt terug op zijn eigen naam plus een grijze stip,
              // dus het leest nooit meer als "tarief very_low".
              var lbl = {very_low:'zeer laag', low:'laag', medium:'gemiddeld', high:'hoog', very_high:'zeer hoog'};
              // Dezelfde drie kleuren als de legenda onder de stroomprijsgrafiek,
              // zodat deze stip hetzelfde zegt als een balk daar.
              var col = {very_low:'#4ade80', low:'#4ade80', medium:'#f59e0b', high:'#ef4444', very_high:'#ef4444'};
              var gs = g ? g.state : 'medium';
              var price = p && !isNaN(Number(p.state)) ? '€ ' + Number(p.state).toFixed(3).replace('.',',') : '';
              var txt = /low/.test(gs) ? '#4ade80' : 'rgba(255,255,255,0.85)';
              return `<span style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:${col[gs]||'#888'}"></span><span style="color:${txt}">tarief ${lbl[gs]||String(gs).replace(/_/g,' ')} · ${price}</span></span>`;
            ]]]
      # Conditioneel: er is aangebeld (blijft 3 min staan, zie Dashboard Context.yaml).
      # Staat vooraan omdat er dan iemand voor de deur kan staan.
      - type: custom:button-card
        template: ov_pill
        entity: binary_sensor.deurbel_recent
        tap_action:
          action: navigate
          navigation_path: "#ov-deurbel"
        visibility:
          - condition: state
            entity: binary_sensor.deurbel_recent
            state: "on"
        styles:
          card:
            - background: rgba(245,158,11,0.16)
            - border: 1px solid rgba(245,158,11,0.35)
        custom_fields:
          c: |
            [[[
              // Het tijdstip zelf, niet "x min geleden": die tekst zou meelopen
              // met de klok en de kaart rendert alleen bij statuswijzigingen.
              var d = states['binary_sensor.deurbel_recent'];
              var t = d && d.last_changed ? new Date(d.last_changed) : null;
              var klok = (t && !isNaN(t.getTime())) ? ('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2) : '';
              return `<span style="display:flex;align-items:center;gap:7px;color:#f59e0b"><ha-icon icon="mdi:doorbell-video" style="--mdc-icon-size:16px"></ha-icon>er is aangebeld${klok ? ' · ' + klok : ''}</span>`;
            ]]]
      # Conditioneel: het huis heeft een vraag gesteld (satelliet + telefoon,
      # zie script.spraak_vraag_stellen in Kitchen/Voice.yaml) en het
      # antwoordvenster loopt nog. Tik opent #ov-vraag met Ja/Nee-knoppen -
      # het derde antwoordkanaal, zodat ook wie zijn telefoon niet bij zich
      # heeft kan antwoorden. Verdwijnt vanzelf zodra er geantwoord is of het
      # venster verloopt (de opruim-automatisering leegt dan de input_text).
      - type: custom:button-card
        template: ov_pill
        entity: input_text.spraak_openstaande_vraag
        triggers_update:
          - timer.spraak_antwoordvenster
        tap_action:
          action: navigate
          navigation_path: "#ov-vraag"
        visibility:
          - condition: state
            entity: timer.spraak_antwoordvenster
            state: active
          - condition: state
            entity: input_text.spraak_openstaande_vraag
            state_not: ""
        styles:
          card:
            - background: rgba(56,189,248,0.14)
            - border: 1px solid rgba(56,189,248,0.32)
        custom_fields:
          c: |
            [[[
              var v = states['input_text.spraak_openstaande_vraag'];
              var sleutel = v ? String(v.state) : '';
              // Sleutel -> leesbare vraag; een onbekende sleutel toont
              // zichzelf, zodat een nieuwe vraagsoort nooit onzichtbaar is.
              var tekst = ({zonnescherm: 'zonnescherm uitzetten?',
                            spa_gratis: 'spa opwarmen op gratis stroom?',
                            spa_warm: 'spa opwarmen?'})[sleutel]
                          || (sleutel.replace(/_/g, ' ') + '?');
              return `<span style="display:flex;align-items:center;gap:7px;color:#38bdf8"><ha-icon icon="mdi:comment-question-outline" style="--mdc-icon-size:16px"></ha-icon>vraag · ${tekst}</span>`;
            ]]]
      # Conditioneel: er is iets stuk in huis. Tikken gaat naar het
      # systeem-dashboard, waar de volledige lijst per integratie staat.
      - type: custom:button-card
        template: ov_pill
        entity: sensor.systeem_status
        tap_action:
          action: navigate
          navigation_path: /lovelace/systeem
        visibility:
          - condition: state
            entity: sensor.systeem_status
            state: aandacht
        custom_fields:
          c: |
            [[[
              var s = states['sensor.systeem_status'];
              if(!s) return '';
              var a = s.attributes || {};
              var n = function(k){ var v = Number(a[k]); return isNaN(v) ? 0 : v; };
              var delen = [];
              // Volgorde = urgentie: een omgevallen bridge verklaart meestal
              // meteen de onbeschikbare entiteiten eronder.
              if(a.zigbee === 'stuk') delen.push('zigbee-bridge offline');
              if(n('kritiek') > 0) delen.push(n('kritiek') + (n('kritiek') === 1 ? ' kritieke sensor weg' : ' kritieke sensoren weg'));
              // Een batterijapparaat dat stil valt kun je niet wegredeneren met
              // "die staat uit"; vandaar dat dit hoger staat dan een lege accu.
              // "apparaat stil" kon van alles zijn - een lamp, een stekker, de
              // wasmachine. Het gaat hier over `batterijen_stil`: apparaten op
              // een batterij die zich niet meer melden, en dat is precies de
              // storing waar je een naam bij wil (zie het dode raamcontact dat
              // twee avonden een rolgordijn tegenhield).
              if(n('batterijen_stil') > 0) delen.push(n('batterijen_stil') + (n('batterijen_stil') === 1 ? ' batterij stil' : ' batterijen stil'));
              if(n('kritieke_batterijen') > 0) delen.push(n('kritieke_batterijen') + (n('kritieke_batterijen') === 1 ? ' lege batterij' : ' lege batterijen'));
              if(n('updates') > 0) delen.push(n('updates') + ' update' + (n('updates') === 1 ? '' : 's'));
              if(!delen.length) return '';
              // Op een slechte dag staan hier vier dingen en duwt de pil de rest
              // van de kopbalk weg. De lijst is al op urgentie gesorteerd, dus
              // afkappen laat vanzelf het minst dringende (updates) vallen.
              var rest = delen.length - 3;
              var tekst = delen.slice(0, 3).join(' · ') + (rest > 0 ? ' · +' + rest : '');
              return `<span style="display:flex;align-items:center;gap:7px;color:#f59e0b"><ha-icon icon="mdi:heart-pulse" style="--mdc-icon-size:16px"></ha-icon>${tekst}</span>`;
            ]]]
      # Conditioneel: auto laadt
      - type: custom:button-card
        template: ov_pill
        entity: sensor.hrh85f_charge_state
        tap_action:
          action: navigate
          navigation_path: "#ov-auto"
        visibility:
          - condition: state
            entity: sensor.hrh85f_charge_state
            state: charge_in_progress
        custom_fields:
          c: |
            [[[
              var b = states['sensor.hrh85f_batterij'];
              var pct = b && !isNaN(Number(b.state)) ? Math.round(Number(b.state)) : '—';
              return `<span style="display:flex;align-items:center;gap:7px;color:#4ade80"><ha-icon icon="mdi:ev-station" style="--mdc-icon-size:16px"></ha-icon>auto laadt · ${pct}%</span>`;
            ]]]
      # Conditioneel: alarm ingeschakeld
      - type: custom:button-card
        template: ov_pill
        entity: alarm_control_panel.alarmo
        # Naar de #ov-alarm-popup in plaats van more-info: daar staan de uit- en
        # aan-knoppen mét de camera's ernaast, en het is dezelfde plek waar de
        # rode balk bij een afgegaan alarm naartoe gaat.
        tap_action:
          action: navigate
          navigation_path: "#ov-alarm"
        visibility:
          - condition: state
            entity: alarm_control_panel.alarmo
            state:
              - armed_away
              - armed_home
              - armed_night
              - armed_vacation
        custom_fields:
          c: |
            [[[
              return `<span style="display:flex;align-items:center;gap:7px;color:#f59e0b"><ha-icon icon="mdi:shield-lock" style="--mdc-icon-size:16px"></ha-icon>alarm ingeschakeld</span>`;
            ]]]
      # Conditioneel: de pc van Logan staat aan. Alleen dan zegt zijn gametijd
      # van vandaag iets; staat de pc uit, dan blijft de pil helemaal weg.
      #
      # `visibility` met `condition: template` werkt op dit dashboard niet (dat
      # verbergt stil alles), dus dit gaat via `condition: state` op de
      # binary_sensor - dezelfde constructie als bij de Sonos-groepstoggles.
      #
      # LET OP: die sensor heeft `delay_off: 3 minuten`, dus de pil blijft na
      # het uitzetten nog een paar minuten hangen. Dat is geen storing maar de
      # marge die voorkomt dat een slaapstand als "pc uit" leest; zie de kop
      # van packages/1 - First Floor/Bedroom Maxi/PC.yaml.
      - type: custom:button-card
        template: ov_pill
        # De teller loopt elke minuut op en button-card hertekent alleen als
        # zijn eigen entity verandert - dit is dus precies de goede entity.
        # De limiet staat ook in de tekst en kan tussendoor gedraaid worden,
        # vandaar de tweede als `triggers_update`.
        entity: sensor.pc_logan_gametijd
        triggers_update:
          - input_number.pc_logan_gametijd_limiet
        tap_action:
          action: more-info
        visibility:
          - condition: state
            entity: binary_sensor.pc_logan_aan
            state: "on"
        styles:
          card:
            - background: >
                [[[ var g = states['sensor.pc_logan_gametijd'], l = states['input_number.pc_logan_gametijd_limiet']; return (g && l && Number(g.state) > Number(l.state)) ? 'rgba(239,68,68,0.16)' : 'rgba(255,255,255,0.05)'; ]]]
            - border: >
                [[[ var g = states['sensor.pc_logan_gametijd'], l = states['input_number.pc_logan_gametijd_limiet']; return (g && l && Number(g.state) > Number(l.state)) ? '1px solid rgba(239,68,68,0.35)' : '1px solid rgba(255,255,255,0.06)'; ]]]
        custom_fields:
          c: |
            [[[
              var g = states['sensor.pc_logan_gametijd'];
              var l = states['input_number.pc_logan_gametijd_limiet'];
              var m = g && !isNaN(Number(g.state)) ? Math.round(Number(g.state)) : null;
              var lim = l && !isNaN(Number(l.state)) ? Math.round(Number(l.state)) : null;
              // Onder het uur leest een plat aantal minuten prettiger ("45
              // min"), daarboven niet meer ("1u19" in plaats van "79 min").
              var kort = function(x){ return x >= 60 ? Math.floor(x / 60) + 'u' + ('0' + (x % 60)).slice(-2) : x + ' min'; };
              // De sensor kan er even niet zijn (history_stats start na een
              // herstart later op dan de kaart); dan liever niets dan "0 min",
              // want dat leest als "hij is net begonnen".
              if(m === null) return '';
              var over = lim !== null && m > lim;
              // ALTIJD "X van Y", OOK BOVEN DE LIMIET
              // Stond eerst op "1u47 · over" zodra hij eroverheen was. Dat las
              // Robin op 22 augustus 2026 als een storing ("wat is dat over?"),
              // en terecht: de pil wisselde precies op het interessante moment
              // van vorm, dus je kon niet meer zien hoever hij eroverheen zat -
              // én je kon niet zien dat de limiet zelf verkeerd stond (die stond
              // toen op 15 minuten in plaats van 90). De vorm is nu vast en
              // alleen de kleur zegt of het te veel is.
              var col = over ? '#ef4444' : 'rgba(255,255,255,0.7)';
              var staart = lim === null ? '' : ' van ' + kort(lim);
              return `<span style="display:flex;align-items:center;gap:7px;color:${col}"><ha-icon icon="mdi:desktop-tower-monitor" style="--mdc-icon-size:16px;color:${col}"></ha-icon>gametijd Logan \u00b7 ${kort(m)}${staart}</span>`;
            ]]]
      # Conditioneel: stroom wordt straks duurder
      - type: custom:button-card
        template: ov_pill
        tap_action:
          action: navigate
          navigation_path: "#ov-energie"
        visibility:
          - condition: state
            entity: sensor.stroomprijs_niveau_volgend_uur
            state: high
          # state_not in plaats van een opsomming van de lage niveaus: SlimHuys
          # kent ook very_low/very_high, en met een opsomming bleef de pil juist
          # bij het allergoedkoopste tarief verborgen.
          - condition: state
            entity: sensor.slimhuys_zonneplan_tariefniveau_nu
            state_not:
              - high
              - very_high
        custom_fields:
          c: |
            [[[
              var p = states['sensor.stroomprijs_volgend_uur'];
              var price = p && !isNaN(Number(p.state)) ? '€ ' + Number(p.state).toFixed(3).replace('.',',') : '';
              return `<span style="display:flex;align-items:center;gap:7px;color:#f59e0b"><ha-icon icon="mdi:trending-up" style="--mdc-icon-size:16px"></ha-icon>straks duurder${price ? ' · ' + price : ''}</span>`;
            ]]]
      # Conditioneel: regen op komst
      - type: custom:button-card
        template: ov_pill
        entity: sensor.neerslag_komende_30_minuten
        tap_action:
          action: more-info
        visibility:
          - condition: numeric_state
            entity: sensor.neerslag_komende_30_minuten
            above: 0.1
        custom_fields:
          c: |
            [[[
              var r = states['sensor.neerslag_komende_30_minuten'];
              var mm = r && !isNaN(Number(r.state)) ? Number(r.state).toFixed(1).replace('.',',') : '?';
              return `<span style="display:flex;align-items:center;gap:7px;color:#38bdf8"><ha-icon icon="mdi:weather-pouring" style="--mdc-icon-size:16px"></ha-icon>regen · ${mm} mm (30 min)</span>`;
            ]]]
      # Conditioneel: iemand onderweg naar huis
      - type: custom:button-card
        template: ov_pill
        tap_action:
          action: navigate
          navigation_path: "#ov-personen"
        visibility:
          - condition: state
            entity: binary_sensor.iemand_onderweg_naar_huis
            state: "on"
        custom_fields:
          c: |
            [[[
              var ppl = [
                ['Robin','person.robin_bohnen','sensor.robin_reistijd_naar_huis'],
                ['Samantha','person.samantha_henkelman','sensor.samantha_reistijd_naar_huis'],
                ['Emma','person.emma_bohnen','sensor.emma_reistijd_naar_huis'],
                ['Logan','person.logan_veen','sensor.logan_reistijd_naar_huis']
              ];
              var best = null;
              ppl.forEach(function(x){
                var ps = states[x[1]]; var rs = states[x[2]];
                if(ps && ['home','unknown','unavailable'].indexOf(ps.state) === -1 && rs && !isNaN(Number(rs.state)) && Number(rs.state) > 0){
                  var t = Number(rs.state);
                  if(best === null || t < best.t) best = {name:x[0], t:t};
                }
              });
              if(!best) return '';
              return `<span style="display:flex;align-items:center;gap:7px;color:rgba(255,255,255,0.85)"><ha-icon icon="mdi:car" style="--mdc-icon-size:16px;color:#4ade80"></ha-icon>${best.name} thuis · ${Math.round(best.t)} min</span>`;
            ]]]
      # Conditioneel: zonnescherm-tip (veel zon + scherm nog niet uit).
      # Voor deze cover geldt: open = uitgeschoven, closed = ingetrokken
      # (zie packages/3 - Outside/Backyard/Sunscreen.yaml), dus de tip hoort
      # bij state closed en moet open_cover aanroepen.
      - type: custom:button-card
        template: ov_pill
        tap_action:
          action: perform-action
          perform_action: cover.open_cover
          target:
            entity_id: cover.achtertuin_zonnescherm
        visibility:
          - condition: numeric_state
            entity: sensor.achtertuin_zon_luminance
            above: 25000
          - condition: state
            entity: cover.achtertuin_zonnescherm
            state: closed
        custom_fields:
          c: |
            [[[
              return `<span style="display:flex;align-items:center;gap:7px;color:#f59e0b"><ha-icon icon="mdi:blinds-horizontal" style="--mdc-icon-size:16px"></ha-icon>veel zon · zonnescherm uit?</span>`;
            ]]]
      - type: custom:button-card
        template: ov_pill
        tap_action:
          action: more-info
        entity: weather.knmi_thuis
        custom_fields:
          c: |
            [[[
              var w = states['weather.knmi_thuis'];
              if(!w) return 'weer';
              var t = w.attributes.temperature;
              var map = {sunny:'zonnig', 'clear-night':'helder', cloudy:'bewolkt', partlycloudy:'half bewolkt', rainy:'regen', pouring:'zware regen', snowy:'sneeuw', 'snowy-rainy':'natte sneeuw', fog:'mist', windy:'winderig', 'windy-variant':'winderig', hail:'hagel', lightning:'onweer', 'lightning-rainy':'onweer', exceptional:'extreem'};
              var icon = {sunny:'mdi:weather-sunny', 'clear-night':'mdi:weather-night', cloudy:'mdi:weather-cloudy', partlycloudy:'mdi:weather-partly-cloudy', rainy:'mdi:weather-rainy', pouring:'mdi:weather-pouring', snowy:'mdi:weather-snowy', 'snowy-rainy':'mdi:weather-snowy-rainy', fog:'mdi:weather-fog', windy:'mdi:weather-windy', 'windy-variant':'mdi:weather-windy-variant', hail:'mdi:weather-hail', lightning:'mdi:weather-lightning', 'lightning-rainy':'mdi:weather-lightning-rainy', exceptional:'mdi:weather-cloudy-alert'};
              var s = map[w.state] || w.state;
              var ic = icon[w.state] || 'mdi:weather-cloudy';
              return `<span style="display:flex;align-items:center;gap:7px;color:rgba(255,255,255,0.7)"><ha-icon icon="${ic}" style="--mdc-icon-size:16px;color:rgba(255,255,255,0.65)"></ha-icon>${s} · ${t != null ? Math.round(t) : '—'}°</span>`;
            ]]]
