# Linkerkolom: personen, ruimtes, auto, media.
type: vertical-stack
card_mod:
  style: |
    #root { gap: 16px !important; }
cards:
  # PERSONEN
  - type: custom:mod-card
    card_mod:
      style: |
        ha-card {
          background: var(--ov-panel-bg) !important;
          border: var(--ov-panel-border) !important;
          border-radius: var(--ov-panel-radius) !important;
          box-shadow: none !important;
          padding: var(--ov-panel-padding) !important;
        }
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          template: ov_title
          tap_action:
            action: navigate
            navigation_path: "#ov-personen"
          variables:
            title: PERSONEN
          custom_fields:
            b: |
              [[[
                var ppl = ['person.robin_bohnen','person.samantha_henkelman','person.emma_bohnen','person.logan_veen'];
                var n = ppl.filter(e => states[e] && states[e].state === 'home').length;
                return `<span style="font-size:11.5px;font-weight:600;padding:3px 11px;border-radius:20px;color:var(--ov-ok);background:var(--ov-ok-wash-15)">${n} thuis</span>`;
              ]]]
        - type: custom:button-card
          template: ov_person
          entity: person.robin_bohnen
          # Tikken opent de persoonspopup met het spoor van de laatste twee uur
          # (zie #ov-persoon-robin in overzicht.yaml). De more-info van een
          # person toont alleen de huidige speld; die blijft bereikbaar door
          # ingedrukt te houden.
          tap_action:
            action: navigate
            navigation_path: "#ov-persoon-robin"
          hold_action:
            action: more-info
          variables:
            travel: sensor.robin_reistijd_naar_huis
            battery: sensor.iphone_van_robin_battery_level
        - type: custom:button-card
          template: ov_person
          entity: person.samantha_henkelman
          # Tikken opent de persoonspopup met het spoor van de laatste twee uur
          # (zie #ov-persoon-samantha in overzicht.yaml). De more-info van een
          # person toont alleen de huidige speld; die blijft bereikbaar door
          # ingedrukt te houden.
          tap_action:
            action: navigate
            navigation_path: "#ov-persoon-samantha"
          hold_action:
            action: more-info
          variables:
            travel: sensor.samantha_reistijd_naar_huis
            battery: sensor.iphone_van_samantha_battery_level
        - type: custom:button-card
          template: ov_person
          entity: person.emma_bohnen
          # Tikken opent de persoonspopup met het spoor van de laatste twee uur
          # (zie #ov-persoon-emma in overzicht.yaml). De more-info van een
          # person toont alleen de huidige speld; die blijft bereikbaar door
          # ingedrukt te houden.
          tap_action:
            action: navigate
            navigation_path: "#ov-persoon-emma"
          hold_action:
            action: more-info
          variables:
            travel: sensor.emma_reistijd_naar_huis
            battery: sensor.iphone_van_emma_battery_level
        - type: custom:button-card
          template: ov_person
          entity: person.logan_veen
          # Tikken opent de persoonspopup met het spoor van de laatste twee uur
          # (zie #ov-persoon-logan in overzicht.yaml). De more-info van een
          # person toont alleen de huidige speld; die blijft bereikbaar door
          # ingedrukt te houden.
          tap_action:
            action: navigate
            navigation_path: "#ov-persoon-logan"
          hold_action:
            action: more-info
          variables:
            travel: sensor.logan_reistijd_naar_huis
            battery: sensor.iphone_battery_level
  # RUIMTES
  - type: custom:mod-card
    card_mod:
      style: |
        ha-card {
          background: var(--ov-panel-bg) !important;
          border: var(--ov-panel-border) !important;
          border-radius: var(--ov-panel-radius) !important;
          box-shadow: none !important;
          padding: var(--ov-panel-padding) !important;
        }
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          template: ov_title
          variables:
            title: RUIMTES
        - type: custom:button-card
          template: ov_room
          name: Begane grond
          tap_action:
            action: navigate
            navigation_path: "#ov-groundfloor"
          variables:
            lights:
              - light.woonkamer_lampen
              # Eigen groep sinds de plafondspots op Matter zitten; zonder deze
              # regel telt de kaart "alles uit" terwijl het plafond brandt.
              - light.woonkamer_spots
              - light.keuken_lampen
              - light.eettafel_lampen
              - light.entree_lampen
              # De kastlamp zit sinds 4 september 2026 op Matter en dus
              # buiten de Zigbee2MQTT-groep.
              - light.entree_entree_kast_lamp
              - light.trapkast_lampen
            temp:
              - sensor.woonkamer_woonkamer_multisensor_temperatuur
              - sensor.woonkamer_kamertemperatuur
              - climate.airco_woonkamer
        - type: custom:button-card
          template: ov_room
          name: Eerste verdieping
          tap_action:
            action: navigate
            navigation_path: "#ov-firstfloor"
          variables:
            lights:
              - light.badkamer_lampen
              - light.slaapkamer_lampen
              - light.slaapkamer_maxi_lampen
              # Apart, want hij zit niet in de zigbee-groep hierboven; zonder
              # deze regel telde de tegel hem niet mee en stond er "0 aan"
              # terwijl hij brandde. Zelfde lijst als de "Alles uit"-knop in
              # de #ov-firstfloor-popup (overzicht.yaml) - houd ze gelijk.
              - light.slaapkamer_losse_lamp_maxi
              - light.kantoor_lampen
              - light.overloop_lampen
            temp:
              - sensor.slaapkamer_slaapkamer_temperatuur_temperatuur
              - sensor.badkamer_badkamer_temperatuur_temperatuur
              - sensor.kantoor_kantoor_temperatuur_temperatuur
              - sensor.slaapkamer_logan_slaapkamer_maxi_multisensor_temperatuur
        - type: custom:button-card
          template: ov_room
          name: Tweede verdieping
          tap_action:
            action: navigate
            navigation_path: "#ov-secondfloor"
          variables:
            lights:
              - light.overloop_zolder_lampen
              - light.slaapkamer_mini_lampen
            temp:
              - sensor.slaapkamer_emma_slaapkamer_mini_temperatuur_temperatuur
              - climate.airco_zolder
        - type: custom:button-card
          template: ov_room
          name: Garage / speelkamer
          tap_action:
            action: navigate
            navigation_path: "#ov-garage"
          variables:
            lights:
              - light.garage_lampen
              - light.speelkamer_lampen
            temp:
              - sensor.speelkamer_speelkamer_temperatuur_temperatuur
              - sensor.garage_garage_temperatuur_temperatuur
        - type: custom:button-card
          template: ov_room
          name: Buiten
          entity: cover.achtertuin_zonnescherm
          tap_action:
            action: navigate
            navigation_path: "#ov-outside"
          custom_fields:
            sum: |
              [[[
                var t = states['sensor.knmi_temperatuur'];
                var w = states['weather.knmi_thuis'];
                var g = t && !isNaN(Number(t.state)) ? Number(t.state)
                      : (w && w.attributes.temperature != null ? Number(w.attributes.temperature) : null);
                var c = states['cover.achtertuin_zonnescherm'];
                var pos = c && c.attributes && c.attributes.current_position != null ? Number(c.attributes.current_position) : null;
                // open = uitgeschoven, closed = ingetrokken (zie Sunscreen.yaml)
                var m = {open:'uit', closed:'ingetrokken', opening:'gaat uit', closing:'gaat in'};
                var scherm = c ? (m[c.state] || c.state) : '?';
                // Positie alleen tonen als hij ergens halverwege hangt.
                if(pos !== null && pos > 0 && pos < 100) scherm = pos + '%';
                var graden = g === null ? ''
                  : `<span style="color:${g < 5 ? 'var(--ov-info)' : (g > 25 ? 'var(--ov-warn)' : 'var(--ov-ink-85)')};font-weight:600">${g.toFixed(1).replace('.',',')}°</span><span style="color:var(--ov-ink-20)">·</span>`;
                return `<span style="display:inline-flex;align-items:baseline;gap:8px">${graden}<span style="color:var(--ov-ink-72)">scherm ${scherm}</span></span>`;
              ]]]
            dot: |
              [[[
                var c = states['cover.achtertuin_zonnescherm'];
                var act = c && c.state !== 'closed';
                return `<div style="width:9px;height:9px;border-radius:50%;background:${act ? 'var(--ov-info-strong)' : 'var(--ov-ink-14)'}"></div>`;
              ]]]
        # Deuren & ramen: één blik of het huis dicht is
        #
        # BUITENDEUREN, GEEN BINNENDEUREN
        # Hier stond `binary_sensor.all_doors`, en daar zitten de slaapkamer-
        # deuren, de speelkamer-tussendeur en de deur van de vaatwasser in. Op
        # 18 augustus 2026 stond deze regel daardoor oranje op "deur & raam
        # open" terwijl alle buitendeuren dicht waren en alleen de vaatwasser
        # openstond. De lijst hieronder is dezelfde als in
        # dashboards/home/nest_hub.yaml (custom_field `huis`), waar dit al goed
        # ging - komt er een buitendeur bij, zet hem dan op BEIDE plekken.
        - type: custom:button-card
          entity: binary_sensor.all_windows
          # De kaart hertekent alleen als zijn eigen entity verandert, en die
          # is nu de ramengroep. De buitendeuren en het slot staan daarom
          # expliciet als extra aanleiding erbij.
          triggers_update:
            - binary_sensor.all_windows
            - binary_sensor.entree_entree_voordeur_deur
            - binary_sensor.woonkamer_achterdeur_contact
            - binary_sensor.woonkamer_openslaande_deuren_contact
            - binary_sensor.speelkamer_openslaande_deuren_contact
            - binary_sensor.garage_achterdeur_contact
            - lock.kroon18voordeur
          # more-info gaf de geschiedenisgrafiek van de groep, en de ramen zaten
          # daar niet eens in; de popup noemt wél welk contact open staat.
          tap_action:
            action: navigate
            navigation_path: "#ov-deuren"
          show_icon: false
          show_name: false
          show_state: false
          styles:
            card:
              - background: none
              - border: none
              - box-shadow: none
              - padding: 11px 2px 2px 2px
              - border-top: 1px solid var(--ov-ink-6)
            grid:
              - grid-template-areas: '"n sum dot"'
              # Zelfde raster en zelfde reden als template ov_room hierboven:
              # de naam is de rekbare kolom en kapt af, de samenvatting
              # ("1 raam open · niet op slot") houdt zijn breedte.
              - grid-template-columns: minmax(0, 1fr) auto auto
              - align-items: center
              - column-gap: 10px
            custom_fields:
              n:
                - justify-self: start
                - min-width: 0
                - white-space: nowrap
                - overflow: hidden
                - text-overflow: ellipsis
              sum:
                - justify-self: end
                - font-size: 13px
                - white-space: nowrap
              dot:
                - justify-self: end
          custom_fields:
            n: |
              [[[ return `<span style="font-size:14.5px;font-weight:500;color:var(--primary-text-color)">Deuren & ramen</span>`; ]]]
            sum: |
              [[[
                // `telOpen` slaat unavailable/unknown over en geeft null terug
                // als er van de hele lijst niets bekend is: een contact dat van
                // het net valt mag hier niet als "open" tellen (dat is precies
                // de fout die de keukenrolgordijnen twee avonden omhoog hield),
                // maar een lijst die volledig zwijgt mag ook geen "alles dicht"
                // worden.
                var buitendeuren = ['binary_sensor.entree_entree_voordeur_deur','binary_sensor.woonkamer_achterdeur_contact',
                                    'binary_sensor.woonkamer_openslaande_deuren_contact','binary_sensor.speelkamer_openslaande_deuren_contact',
                                    'binary_sensor.garage_achterdeur_contact'];
                var telOpen = function(lijst){
                  var n = 0, bekend = 0;
                  lijst.forEach(function(id){
                    var e = states[id];
                    if(!e || e.state === 'unavailable' || e.state === 'unknown') return;
                    bekend++;
                    if(e.state === 'on') n++;
                  });
                  return bekend ? n : null;
                };
                var leden = function(id){
                  var g = states[id];
                  if(!g) return null;
                  var l = g.attributes && g.attributes.entity_id;
                  return Array.isArray(l) ? telOpen(l) : (g.state === 'on' ? 1 : 0);
                };
                var d = telOpen(buitendeuren);
                var r = leden('binary_sensor.all_windows');
                var open = [];
                if(d) open.push(d + (d === 1 ? ' deur' : ' deuren'));
                if(r) open.push(r + (r === 1 ? ' raam' : ' ramen'));
                // Het voordeurslot hoort bij "is het huis dicht", maar een
                // ontgrendeld slot overdag is normaal (er is iemand thuis) en
                // mag de regel niet oranje maken. Grijs "niet op slot" is
                // informatie, geen alarm; alleen een klemmend slot is er een.
                var l = states['lock.kroon18voordeur'];
                var slot = '';
                if(l && ['unavailable','unknown'].indexOf(l.state) === -1){
                  var m = {locked:'op slot', unlocked:'niet op slot', open:'niet op slot',
                           locking:'gaat op slot', unlocking:'gaat van slot'};
                  slot = l.state === 'jammed'
                    ? ` <span style="color:var(--ov-ink-20)">·</span> <span style="color:var(--ov-bad);font-weight:600">slot klemt</span>`
                    : ` <span style="color:var(--ov-ink-20)">·</span> <span style="color:var(--ov-ink-60)">${m[l.state] || l.state}</span>`;
                }
                if(d === null && r === null) return `<span style="color:var(--ov-ink-60)">onbekend</span>${slot}`;
                if(!open.length) return `<span style="color:var(--ov-ink-60)">alles dicht</span>${slot}`;
                return `<span style="color:var(--ov-warn);font-weight:600">${open.join(' &amp; ')} open</span>${slot}`;
              ]]]
            dot: |
              [[[
                // Zelfde buitendeurenlijst als hierboven; zie de toelichting
                // bij deze kaart waarom het niet `binary_sensor.all_doors` is.
                var buitendeuren = ['binary_sensor.entree_entree_voordeur_deur','binary_sensor.woonkamer_achterdeur_contact',
                                    'binary_sensor.woonkamer_openslaande_deuren_contact','binary_sensor.speelkamer_openslaande_deuren_contact',
                                    'binary_sensor.garage_achterdeur_contact'];
                var deurOpen = buitendeuren.some(function(id){
                  var e = states[id];
                  return e && e.state === 'on';
                });
                var r = states['binary_sensor.all_windows'];
                var l = states['lock.kroon18voordeur'];
                var iets = deurOpen || (r && r.state === 'on');
                var klemt = l && l.state === 'jammed';
                var kleur = klemt ? 'var(--ov-bad)' : (iets ? 'var(--ov-warn)' : 'var(--ov-ink-14)');
                return `<div style="width:9px;height:9px;border-radius:50%;background:${kleur}"></div>`;
              ]]]
  # AUTO
  - type: custom:mod-card
    card_mod:
      style: |
        ha-card {
          background: var(--ov-panel-bg) !important;
          border: var(--ov-panel-border) !important;
          border-radius: var(--ov-panel-radius) !important;
          box-shadow: none !important;
          padding: var(--ov-panel-padding) !important;
        }
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          template: ov_title
          tap_action:
            action: navigate
            navigation_path: "#ov-auto"
          variables:
            title: AUTO
          custom_fields:
            b: |
              [[[
                var b = states['sensor.hrh85f_batterij'];
                var r = states['sensor.hrh85f_battery_autonomy'];
                var cs = states['sensor.hrh85f_charge_state'];
                var rest = states['sensor.hrh85f_charging_remaining_time'];
                var bs = b && !isNaN(Number(b.state)) ? Math.round(Number(b.state)) : null;
                var rs = r && !isNaN(Number(r.state)) ? Math.round(Number(r.state)) : null;
                var laag = bs !== null && bs <= 20;
                var m = {charge_in_progress:['laadt','var(--ov-ok)','var(--ov-ok-wash-15)','mdi:flash'],
                         charge_ended:['vol','var(--ov-ok)','var(--ov-ok-wash-15)','mdi:battery-check'],
                         not_in_charge:['niet aan lader','var(--ov-ink-50)','var(--ov-ink-6)','mdi:power-plug-off'],
                         waiting_for_a_planned_charge:['gepland','var(--ov-info)','var(--ov-info-15)','mdi:clock-outline'],
                         waiting_for_current_charge:['wacht','var(--ov-info)','var(--ov-info-15)','mdi:clock-outline'],
                         charge_error:['laadfout','var(--ov-bad)','var(--ov-bad-15)','mdi:alert-circle'],
                         energy_flap_opened:['klep open','var(--ov-warn)','var(--ov-warn-15)','mdi:ev-plug-type2']};
                var c = m[cs && cs.state] || ['onbekend','var(--ov-ink-40)','var(--ov-ink-6)','mdi:help-circle-outline'];
                var lbl = c[0];
                if(cs && cs.state === 'charge_in_progress' && rest && !isNaN(Number(rest.state))) {
                  var min = Math.round(Number(rest.state));
                  lbl += min >= 60 ? ` · ${Math.floor(min/60)}u${('0'+(min%60)).slice(-2)}` : ` · ${min}m`;
                }
                var pill = function(txt, fg, bg, icon){
                  var ic = icon ? `<ha-icon icon="${icon}" style="--mdc-icon-size:13px"></ha-icon>` : '';
                  return `<span style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;color:${fg};background:${bg}">${ic}${txt}</span>`;
                };
                var accu = pill((bs === null ? '—' : bs + '%') + (rs === null ? '' : ' · ' + rs + ' km'),
                                laag ? 'var(--ov-warn)' : 'var(--ov-ok)',
                                laag ? 'var(--ov-warn-15)' : 'var(--ov-ok-wash-15)', null);
                // Twee pillen naast elkaar passen niet altijd naast de titel
                // AUTO (smalle kolom, of een lange laadtekst met resterende
                // tijd). `flex-wrap` laat de tweede dan onder de eerste zakken
                // in plaats van over de titel heen te lopen.
                return `<span style="display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:7px">${pill(lbl, c[1], c[2], c[3])}${accu}</span>`;
              ]]]
        # Auto-illustratie (Megane E-Tech, matgrijs) + kilometerstand + klimaatknop
        - type: horizontal-stack
          card_mod:
            style: |
              #root {
                display: grid !important;
                grid-template-columns: 112px minmax(0, 1fr) !important;
                align-items: center !important;
                gap: 14px !important;
              }
          cards:
            - type: custom:button-card
              show_icon: false
              show_name: false
              show_state: false
              tap_action:
                action: navigate
                navigation_path: "#ov-auto"
              styles:
                card:
                  - background: none
                  - border: none
                  - box-shadow: none
                  - padding: 4px 0
                grid:
                  - grid-template-areas: '"car"'
              custom_fields:
                car: |
                  [[[
                    var cs = states['sensor.hrh85f_charge_state'];
                    var laadt = cs && cs.state === 'charge_in_progress';
                    var kop = laadt ? 'var(--ov-ok)' : 'var(--ov-ink-85)';
                    var bout = laadt ? '<path d="M104,44 l-9,15 h7 l-4,12 12,-16 h-7 z" fill="var(--ov-ok)"/>' : '';
                    return `<svg viewBox="0 0 200 96" width="112" height="54" xmlns="http://www.w3.org/2000/svg" style="display:block">
                      <path d="M6,62 C6,52 10,47 20,45 L40,42 C46,41 50,39 54,35 L66,24 C71,19 78,16 86,16 L126,16 C136,16 145,19 151,25 L166,39 C172,44 180,46 187,49 C193,51 196,55 196,61 L196,70 C196,74 193,76 189,76 L12,76 C8,76 6,74 6,70 Z" fill="var(--ov-ink-55)"/>
                      <path d="M70,27 C74,22 79,20 86,20 L103,20 L103,41 L61,41 Z" fill="var(--ov-surface-2)"/>
                      <path d="M109,20 L124,20 C132,20 138,22 143,27 L155,41 L109,41 Z" fill="var(--ov-surface-2)"/>
                      <rect x="12" y="63" width="176" height="13" rx="6.5" fill="var(--ov-surface)"/>
                      <circle cx="53" cy="70" r="21" fill="var(--ov-surface)"/>
                      <circle cx="150" cy="70" r="21" fill="var(--ov-surface)"/>
                      <circle cx="53" cy="70" r="16" fill="var(--ov-surface-deep)"/>
                      <circle cx="150" cy="70" r="16" fill="var(--ov-surface-deep)"/>
                      <circle cx="53" cy="70" r="7" fill="var(--ov-ink-45)"/>
                      <circle cx="150" cy="70" r="7" fill="var(--ov-ink-45)"/>
                      <rect x="5" y="51" width="11" height="5" rx="2.5" fill="${kop}" opacity="0.9"/>
                      <rect x="185" y="51" width="11" height="5" rx="2.5" fill="var(--ov-bad)" opacity="0.8"/>
                      ${bout}
                    </svg>`;
                  ]]]
            - type: vertical-stack
              card_mod:
                style: |
                  #root { gap: 8px !important; }
              cards:
                - type: custom:button-card
                  entity: sensor.hrh85f_kilometerstand
                  show_icon: false
                  show_name: false
                  show_state: false
                  tap_action:
                    action: navigate
                    navigation_path: "#ov-auto"
                  styles:
                    card:
                      - background: none
                      - border: none
                      - box-shadow: none
                      - padding: 0 2px
                    grid:
                      - grid-template-areas: '"km"'
                      - justify-items: start
                  custom_fields:
                    km: |
                      [[[
                        var e = states['sensor.hrh85f_kilometerstand'];
                        var v = e && !isNaN(Number(e.state)) ? Number(e.state).toLocaleString('nl-NL') : '—';
                        return `<span style="display:flex;align-items:baseline;gap:6px"><span style="font-size:21px;font-weight:700;color:var(--primary-text-color);line-height:1">${v}</span><span style="font-size:12px;color:var(--ov-ink-55)">km totaal</span></span>`;
                      ]]]
                # Voorverwarmen / voorkoelen (Renault pre-conditioning)
                - type: custom:button-card
                  entity: binary_sensor.hrh85f_hvac
                  show_icon: false
                  show_name: false
                  show_state: false
                  tap_action:
                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.hrh85f_start_air_conditioner
                    confirmation:
                      text: Klimaatregeling van de auto starten?
                  styles:
                    card:
                      - background: >
                          [[[ var h = states['binary_sensor.hrh85f_hvac']; return (h && h.state === 'on') ? 'var(--ov-ok-wash-14)' : 'var(--ov-ink-5)'; ]]]
                      - border: >
                          [[[ var h = states['binary_sensor.hrh85f_hvac']; return (h && h.state === 'on') ? '1px solid var(--ov-ok-wash-28)' : '1px solid var(--ov-ink-8)'; ]]]
                      - border-radius: 12px
                      - box-shadow: none
                      - padding: 8px 12px
                    grid:
                      - grid-template-areas: '"ic t"'
                      - grid-template-columns: 20px 1fr
                      - align-items: center
                      - column-gap: 10px
                    custom_fields:
                      ic:
                        - grid-area: ic
                      t:
                        - grid-area: t
                        - justify-self: start
                  custom_fields:
                    ic: |
                      [[[
                        var w = states['weather.knmi_thuis'];
                        var temp = w && w.attributes.temperature != null ? Number(w.attributes.temperature) : null;
                        var h = states['binary_sensor.hrh85f_hvac'];
                        var mode = temp === null ? 'auto' : (temp < 15 ? 'heat' : (temp > 22 ? 'cool' : 'auto'));
                        var ico = {heat:'mdi:fire', cool:'mdi:snowflake', auto:'mdi:air-conditioner'}[mode];
                        var col = (h && h.state === 'on') ? 'var(--ov-ok)' : {heat:'var(--ov-warn)', cool:'var(--ov-info)', auto:'var(--ov-ink-70)'}[mode];
                        return `<ha-icon icon="${ico}" style="--mdc-icon-size:19px;color:${col}"></ha-icon>`;
                      ]]]
                    t: |
                      [[[
                        var h = states['binary_sensor.hrh85f_hvac'];
                        var w = states['weather.knmi_thuis'];
                        var temp = w && w.attributes.temperature != null ? Math.round(Number(w.attributes.temperature)) : null;
                        if(h && h.state === 'on') return `<span style="display:flex;align-items:baseline;gap:6px"><span style="font-size:14px;font-weight:600;color:var(--ov-ok)">Klimaat actief</span></span>`;
                        var lbl = temp === null ? 'Klimaat starten' : (temp < 15 ? 'Voorverwarmen' : (temp > 22 ? 'Voorkoelen' : 'Klimaat starten'));
                        var suf = temp === null ? '' : `<span style="font-size:12px;color:var(--ov-ink-50)">${temp}°</span>`;
                        return `<span style="display:flex;align-items:baseline;gap:7px"><span style="font-size:14px;font-weight:600;color:var(--primary-text-color)">${lbl}</span>${suf}</span>`;
                      ]]]
        # Goedkoopste aaneengesloten laadvenster uit de prijsvoorspelling.
        # De berekening staat sinds 2026-08-16 in sensor.goedkoopste_laadvenster
        # (packages/9 - Other/Stroomprijs.yaml); de tijdlijn leest dezelfde
        # sensor, dus deze kaart en de beugel daar kunnen niet meer verschillen.
        - type: custom:button-card
          entity: sensor.goedkoopste_laadvenster
          show_icon: false
          show_name: false
          show_state: false
          tap_action:
            action: navigate
            navigation_path: "#ov-auto"
          variables:
            # Eén keer uitpakken; de drie velden lezen het resultaat uit.
            # State = start (ISO), attributen: tot/gemiddelde/uren/nu/winst.
            venster: |
              [[[
                var s = states['sensor.goedkoopste_laadvenster'];
                if(!s || ['unavailable','unknown',''].indexOf(s.state) !== -1) return null;
                var a = s.attributes || {};
                var van = new Date(s.state), tot = new Date(a.tot);
                if(isNaN(van.getTime()) || isNaN(tot.getTime())) return null;
                var gem = Number(a.gemiddelde);
                if(isNaN(gem)) return null;
                var winst = Number(a.winst);
                return {van: van.getTime(), tot: tot.getTime(), gem: gem,
                        uren: Number(a.uren) || (tot - van) / 3600000,
                        nu: a.nu === true,
                        winst: isNaN(winst) ? null : winst};
              ]]]
          styles:
            card:
              - background: var(--ov-ink-4)
              - border: 1px solid var(--ov-ink-7)
              - border-radius: 12px
              - box-shadow: none
              - padding: 8px 12px
              - margin-top: 6px
            grid:
              - grid-template-areas: '"ic t" "ic s"'
              - grid-template-columns: 20px 1fr
              - align-items: center
              - column-gap: 10px
            custom_fields:
              ic:
                - grid-area: ic
              t:
                - grid-area: t
                - justify-self: start
              s:
                - grid-area: s
                - justify-self: start
          custom_fields:
            ic: |
              [[[
                var v = variables.venster;
                var kleur = !v ? 'var(--ov-ink-35)' : (v.nu ? 'var(--ov-ok)' : 'var(--ov-info)');
                return `<ha-icon icon="mdi:cash-clock" style="--mdc-icon-size:19px;color:${kleur}"></ha-icon>`;
              ]]]
            t: |
              [[[
                var v = variables.venster;
                if(!v) return `<span style="font-size:14px;font-weight:600;color:var(--ov-ink-50)">Laadvenster onbekend</span>`;
                if(v.nu) return `<span style="font-size:14px;font-weight:600;color:var(--ov-ok)">Nu is het goedkoopste moment</span>`;
                var klok = function(ms){ var d = new Date(ms); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); };
                // Zonder dag-aanduiding leest een venster van morgen als "nu
                // bezig": om 14:15 stond hier "12:15-15:15" voor een blok dat
                // pas 22 uur later begint. Zelfde 'morgen'-notatie als de tip
                // onder de stroomprijsgrafiek.
                var dag = function(ms){
                  var d = new Date(ms), mid = new Date();
                  mid.setHours(0, 0, 0, 0);
                  var n = Math.round((new Date(ms).setHours(0, 0, 0, 0) - mid.getTime()) / 86400000);
                  return n <= 0 ? '' : (n === 1 ? 'morgen ' : d.toLocaleDateString('nl-NL', {weekday: 'short'}) + ' ');
                };
                return `<span style="display:flex;align-items:baseline;gap:7px"><span style="font-size:14px;font-weight:600;color:var(--primary-text-color)">Goedkoopst laden</span><span style="font-size:13px;color:var(--ov-info);font-weight:600">${dag(v.van)}${klok(v.van)}–${klok(v.tot)}</span></span>`;
              ]]]
            s: |
              [[[
                var v = variables.venster;
                if(!v) return `<span style="font-size:12.5px;color:var(--ov-ink-45)">geen prijsvoorspelling</span>`;
                var eur = function(x){ return '€ ' + x.toFixed(3).replace('.',','); };
                var uurTxt = v.uren >= 1 ? (Math.round(v.uren * 10) / 10).toString().replace('.',',') + ' uur'
                                         : Math.round(v.uren * 60) + ' min';
                var deel = `${uurTxt} · gem. ${eur(v.gem)}`;
                if(v.winst !== null && v.winst > 0.001) deel += ` <span style="color:var(--ov-ink-25)">·</span> <span style="color:var(--ov-ok)">${eur(v.winst)}/kWh goedkoper</span>`;
                return `<span style="font-size:12.5px;color:var(--ov-ink-55)">${deel}</span>`;
              ]]]
  # MEDIA
  - type: custom:mod-card
    card_mod:
      style: |
        ha-card {
          background: var(--ov-panel-bg) !important;
          border: var(--ov-panel-border) !important;
          border-radius: var(--ov-panel-radius) !important;
          box-shadow: none !important;
          padding: var(--ov-panel-padding) !important;
        }
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          template: ov_title
          tap_action:
            action: navigate
            navigation_path: "#ov-media"
          variables:
            title: MEDIA
        - type: horizontal-stack
          card_mod:
            style: |
              #root {
                display: grid !important;
                /* De twee knoppen zijn samen 84px; wat overblijft is voor de
                   hoes plus de titelregels. `minmax(0, ...)` + `min-width: 0`
                   op het eerste vak zorgt dat dat vak ook echt krimpt: zonder
                   dat hield het zijn inhoudsbreedte en liep de voortgangs-
                   balk met "volume 14%" de kaart uit (afgeknipt op de rand
                   in plaats van netjes met een ellipsis). */
                grid-template-columns: minmax(0, 1fr) auto auto !important;
                align-items: center !important;
                gap: 8px !important;
              }
              #root > *:nth-child(1) { min-width: 0 !important; }
          cards:
            # Nu speelt (tik = multiroom-popup)
            - type: custom:button-card
              template: ov_sonos
              show_icon: false
              show_name: false
              show_state: false
              # De voortgangsbalk hieronder rekent met `new Date()`, en een
              # button-card hertekent niet uit zichzelf. `sensor.time` tikt elke
              # minuut en houdt hem lopend, ook als er verder niets verandert.
              # (De optie heet `triggers_update`, niet `update_timer` - die
              # laatste bestaat niet en wordt stil genegeerd.)
              triggers_update: sensor.time
              tap_action:
                action: navigate
                navigation_path: "#ov-media"
              styles:
                card:
                  - background: none
                  - border: none
                  - box-shadow: none
                  - padding: 6px 2px 2px 2px
                grid:
                  - grid-template-areas: '"art info"'
                  - grid-template-columns: 60px minmax(0, 1fr)
                  - align-items: center
                  - column-gap: 14px
                custom_fields:
                  art:
                    - grid-area: art
                  info:
                    - grid-area: info
                    - justify-self: start
                    # `width: 100%` is hier geen franje: een custom_fields-gebied
                    # krijgt de breedte van zijn INHOUD en niet van de kaart. Zonder
                    # deze regel is het tekstblok bij "Head & Heart" smal en bij een
                    # lange titel juist breder dan de kaart - dan knipt
                    # `overflow: hidden` hem hard af in plaats van netjes met een
                    # ellipsis. De tekst verspringt daarmee per nummer van breedte.
                    # Zelfde valkuil als bij de chips van `kamer_samenvatting`.
                    - width: 100%
                    - min-width: 0
                    - overflow: hidden
              custom_fields:
                art: |
                  [[[
                    var sp = variables.speakers || [];
                    var act = sp.find(function(e){ return states[e] && states[e].state === 'playing'; })
                           || sp.find(function(e){ return states[e] && states[e].state === 'paused'; });
                    var s = act ? states[act] : null;
                    var pic = s && s.attributes.entity_picture ? s.attributes.entity_picture : null;
                    // 60px en niet 52: de hoes is het enige beeld in deze kolom
                    // en mag dat ook zijn. Het randje eromheen houdt een donkere
                    // hoes van de donkere achtergrond gescheiden.
                    if(pic) return `<div style="width:60px;height:60px;border-radius:10px;border:1px solid var(--ov-ink-8);background-image:url('${pic}');background-size:cover;background-position:center"></div>`;
                    return `<div style="width:60px;height:60px;border-radius:10px;background:var(--ov-ink-6);display:flex;align-items:center;justify-content:center"><ha-icon icon="mdi:music" style="--mdc-icon-size:26px;color:var(--ov-ink-60)"></ha-icon></div>`;
                  ]]]
                info: |
                  [[[
                    var sp = variables.speakers || [];
                    var act = sp.find(function(e){ return states[e] && states[e].state === 'playing'; });
                    var pauze = !act;
                    if(pauze) act = sp.find(function(e){ return states[e] && states[e].state === 'paused'; });
                    if(!act) return `<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14.5px;line-height:1.3;font-weight:600;color:var(--primary-text-color)">Niets speelt</span><span style="font-size:12.5px;line-height:1.35;color:var(--ov-ink-55)">tik voor multiroom</span></div>`;
                    var s = states[act];
                    // Radiostreams sturen tijdens de reclame technische markers mee
                    // ("commercial-in"), en soms een URL. Dan liever de zendernaam.
                    var titel = (s.attributes.media_title || '').trim();
                    var artiest = (s.attributes.media_artist || s.attributes.media_album_name || '').trim();
                    var zender = (s.attributes.media_channel || s.attributes.app_name || s.attributes.source || '').trim();
                    var reclame = /^(commercial|advert(isement)?|adbreak|ad)[-_ ]?(in|out|start|end|break)?$/i.test(titel);
                    var onbruikbaar = !titel || reclame || /^https?:\/\//i.test(titel) || titel.toLowerCase() === 'unknown';
                    if(onbruikbaar){ titel = zender || 'Radio'; artiest = ''; }

                    // DE VELDEN VAN EEN RADIOSTREAM STAAN OMGEKEERD
                    // Qmusic zet de ARTIEST in `media_title`, in kapitalen, en het
                    // NUMMER in `media_artist`. Op het paneel stond daardoor
                    // "ZARA LARSSON" als kop, met "Midnight Sun" weggestopt achter
                    // de speakernaam op de tweede regel (18-08). Staat de titel
                    // volledig in hoofdletters en het andere veld niet, dan is dat
                    // wat er aan de hand is en draaien we ze terug. Een gewone
                    // speler (Spotify, tv) raakt dit niet: die schrijft geen
                    // kapitalen.
                    var kapitalen = function(t){
                      return !!t && t === t.toUpperCase() && t !== t.toLowerCase() && /[A-Z\u00c0-\u00de]{4}/.test(t);
                    };
                    if(kapitalen(titel) && artiest && !kapitalen(artiest)){
                      var wissel = titel; titel = artiest; artiest = wissel;
                    }
                    // En wat er dan nog schreeuwt, temperen we. Woorden van één of
                    // twee letters blijven staan, anders wordt DJ ineens Dj.
                    var netjes = function(t){
                      if(!kapitalen(t)) return t;
                      return t.toLowerCase().split(' ').map(function(w){
                        if(w.length <= 2) return w.toUpperCase();
                        return w.charAt(0).toUpperCase() + w.slice(1);
                      }).join(' ');
                    };
                    titel = netjes(titel); artiest = netjes(artiest);
                    var naam = s.attributes.friendly_name ? s.attributes.friendly_name.replace(/ ?Sonos/i,'').trim() : '';
                    var grp = s.attributes.group_members ? s.attributes.group_members.length : 1;
                    var extra = grp > 1 ? `<span style="color:var(--ov-info-strong);font-weight:600"> +${grp-1}</span>` : '';
                    var kleur = pauze ? 'var(--ov-ink-40)' : 'var(--ov-ok)';
                    var staat = pauze ? '<span style="color:var(--ov-ink-52)">gepauzeerd</span> <span style="color:var(--ov-ink-25)">·</span> ' : '';
                    if(!pauze && reclame) staat = '<span style="color:var(--ov-ink-52)">reclame</span> <span style="color:var(--ov-ink-25)">·</span> ';
                    // HET LUIDSPREKERTJE MAG DE REGEL NIET OPREKKEN
                    // `vertical-align:-2px` gokte op de regelhoogte, en een
                    // `ha-icon` is zelf een inline-flex die de regel ondertussen
                    // hóger maakt dan de tekst. Gevolg: de twee regels dreven uit
                    // elkaar en het icoon hing onder de tekst (18-08).
                    //
                    // Hier kan het niet met een inline-flex zoals bij de
                    // brandweermelding, want deze regel moet kunnen afkappen met
                    // een ellipsis en dat werkt niet op flex-kinderen. Dus:
                    // `vertical-align:middle` (centreert op de tekst in plaats van
                    // op de baseline), een icoon met een expliciete box van 13px,
                    // en een vaste `line-height` op de regel zodat een icoon dat
                    // ooit groter wordt de hoogte niet meer kan bepalen.
                    // Volgorde: eerst wát er speelt, dan pas wáár. De artiest hoort
                    // bij het nummer erboven; de speaker is context en mag achteraan.
                    var punt = ' <span style="color:var(--ov-ink-25)">·</span> ';
                    var sub = staat + (artiest ? artiest + punt : '')
                            + `<ha-icon icon="mdi:speaker" style="--mdc-icon-size:13px;width:13px;height:13px;vertical-align:middle;color:${kleur}"></ha-icon> ${naam}${extra}`;

                    // DERDE REGEL: DE LEGE RUIMTE RECHTS OPVULLEN
                    // Een korte titel liet de halve rij leeg staan. Deze balk loopt
                    // over de volle breedte en zegt bij een nummer hoe ver het is,
                    // en bij radio - dat geen lengte meestuurt - wat het volume van
                    // die speaker is. Dat laatste is hier geen vulling maar nuttig:
                    // deze Sonossen staan standaard op 5%, en dat verklaart menig
                    // "hij doet het niet". Gedempt zegt hij dat met zoveel woorden.
                    //
                    // De balk is 4px hoog en de regel ~14px, dus het tekstblok blijft
                    // onder de 60px van de hoes: de rij wordt er niet hoger van.
                    var mmss = function(sec){
                      sec = Math.max(0, Math.round(sec));
                      var m = Math.floor(sec / 60), r = sec % 60;
                      return m + ':' + (r < 10 ? '0' : '') + r;
                    };
                    var balk = function(pct, rechts, vulkleur){
                      pct = Math.max(0, Math.min(100, pct));
                      return `<div style="display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:8px;padding-top:6px">
                        <div style="height:4px;border-radius:2px;background:var(--ov-ink-10);overflow:hidden"><div style="width:${pct}%;height:100%;background:${vulkleur};border-radius:2px"></div></div>
                        <span style="font-size:11px;line-height:1;color:var(--ov-ink-45);white-space:nowrap">${rechts}</span></div>`;
                    };
                    var duur = Number(s.attributes.media_duration) || 0;
                    var derde;
                    if(duur > 0){
                      // `media_position` is de stand op het moment van
                      // `media_position_updated_at`; loopt het nummer, dan tellen we
                      // de tijd sindsdien erbij op. Zo klopt de balk op elk moment
                      // dat de kaart hertekent, ook als dat onregelmatig gebeurt.
                      var pos = Number(s.attributes.media_position) || 0;
                      var upd = s.attributes.media_position_updated_at;
                      var sinds = (!pauze && upd) ? (Date.now() - new Date(upd).getTime()) / 1000 : 0;
                      var nu = Math.max(0, Math.min(duur, pos + (isNaN(sinds) ? 0 : sinds)));
                      derde = balk(nu / duur * 100, mmss(nu) + ' / ' + mmss(duur), 'var(--ov-info-strong)');
                    } else if(s.attributes.is_volume_muted){
                      derde = balk(0, 'gedempt', 'var(--ov-ink-30)');
                    } else {
                      var vol = Math.round((Number(s.attributes.volume_level) || 0) * 100);
                      derde = balk(vol, 'volume ' + vol + '%', 'var(--ov-ink-30)');
                    }
                    return `<div style="display:flex;flex-direction:column;gap:2px;overflow:hidden"><span style="font-size:14.5px;line-height:1.3;font-weight:600;color:var(--primary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${titel}</span><span style="font-size:12.5px;line-height:1.35;color:var(--ov-ink-55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${sub}</span>${derde}</div>`;
                  ]]]
            # Afspelen / pauzeren van de actieve speaker (Sonos pauzeert de hele groep)
            - type: custom:button-card
              template: ov_sonos
              show_icon: false
              show_name: false
              show_state: false
              tap_action:
                action: perform-action
                perform_action: media_player.media_play_pause
                target:
                  entity_id: |
                    [[[
                      var sp = variables.speakers || [];
                      return sp.find(function(e){ return states[e] && states[e].state === 'playing'; })
                          || sp.find(function(e){ return states[e] && states[e].state === 'paused'; })
                          || sp[0];
                    ]]]
              styles:
                card:
                  - background: var(--ov-ink-5)
                  - border: 1px solid var(--ov-ink-8)
                  - border-radius: 12px
                  - box-shadow: none
                  - padding: 0
                  - width: 38px
                  - height: 38px
                grid:
                  - grid-template-areas: '"i"'
                  - align-items: center
                  - justify-items: center
              custom_fields:
                i: |
                  [[[
                    var sp = variables.speakers || [];
                    var speelt = sp.some(function(e){ return states[e] && states[e].state === 'playing'; });
                    var actief = speelt || sp.some(function(e){ return states[e] && states[e].state === 'paused'; });
                    var col = actief ? 'var(--ov-ink-85)' : 'var(--ov-ink-25)';
                    return `<ha-icon icon="${speelt ? 'mdi:pause' : 'mdi:play'}" style="--mdc-icon-size:20px;color:${col}"></ha-icon>`;
                  ]]]
            # Volgende nummer
            - type: custom:button-card
              template: ov_sonos
              show_icon: false
              show_name: false
              show_state: false
              tap_action:
                action: perform-action
                perform_action: media_player.media_next_track
                target:
                  entity_id: |
                    [[[
                      var sp = variables.speakers || [];
                      return sp.find(function(e){ return states[e] && states[e].state === 'playing'; })
                          || sp.find(function(e){ return states[e] && states[e].state === 'paused'; })
                          || sp[0];
                    ]]]
              styles:
                card:
                  - background: var(--ov-ink-5)
                  - border: 1px solid var(--ov-ink-8)
                  - border-radius: 12px
                  - box-shadow: none
                  - padding: 0
                  - width: 38px
                  - height: 38px
                grid:
                  - grid-template-areas: '"i"'
                  - align-items: center
                  - justify-items: center
              custom_fields:
                i: |
                  [[[
                    var sp = variables.speakers || [];
                    var actief = sp.some(function(e){ return states[e] && ['playing','paused'].indexOf(states[e].state) !== -1; });
                    return `<ha-icon icon="mdi:skip-next" style="--mdc-icon-size:20px;color:${actief ? 'var(--ov-ink-85)' : 'var(--ov-ink-25)'}"></ha-icon>`;
                  ]]]
