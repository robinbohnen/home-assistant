      - padding: 0 2px 6px 2px
      grid:
      - grid-template-areas: '"x"'
      - grid-template-columns: minmax(0, 1fr)
      custom_fields:
        x:
        - justify-self: stretch
        - text-align: left
        - min-width: '0'
    custom_fields:
      x: "[[[\n\n        var num = function(id){ var s = states[id]; if(!s) return null; var n = Number(s.state);\n          return (s.state === '' || isNaN(n)) ? null : n; };\n        var nl = function(n, d){ return n.toLocaleString('nl-NL', {maximumFractionDigits: d === undefined ? 0 : d}); };\n        var watt = function(w){ if(w === null) return '—'; var a = Math.abs(w);\n          return a >= 1000 ? nl(a/1000, 1) + ' kW' : nl(a) + ' W'; };\n        var info = function(id){ return 'this.dispatchEvent(new CustomEvent(\\'hass-more-info\\',{detail:{entityId:\\'' + id + '\\'},bubbles:true,composed:true}))'; };\n        var stip = function(k){ return '<span style=\"display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;background:var(--ov-' + k + ')\"></span>'; };\n\n        var rij = function(id, k, naam, tekst, i){\n          return '<div onclick=\"' + info(id) + '\" style=\"cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 0;'\n            + (i ? 'border-top:1px solid var(--ov-ink-6)' : '') + '\">' + stip(k)\n            + '<span style=\"font-size:14px;color:var(--ov-ink-80);flex:1\">' + naam + '</span>'\n            + '<span style=\"font-size:14px;font-weight:600;text-align:right;color:' + (k === 'ok' ? 'var(--primary-text-color)' : 'var(--ov-' + k + ')') + '\">' + tekst + '</span></div>';\n        };\n        var r = [];\n        var ds = states['sensor.deye_device_state'];\n        var stand = ds ? ds.state : null;\n        r.push(['sensor.deye_device_state', stand === 'Normal' ? 'ok' : (stand === 'Standby' || stand === 'Self-test' ? 'warn' : 'bad'), 'Omvormer',\n          {Normal:'normaal', Standby:'stand-by', 'Self-test':'zelftest', Alarm:'alarm', Fault:'storing'}[stand] || (stand || '—')]);\n\n        var mel = [];\n        ['sensor.deye_device_alarm','sensor.deye_device_fault'].forEach(function(id){ var s = states[id];\n          if(s && ['OK','unknown','unavailable'].indexOf(s.state) === -1) mel.push(s.state); });\n        if(states['binary_sensor.deye_battery_alarm'] && states['binary_sensor.deye_battery_alarm'].state === 'on') mel.push('accu-alarm');\n        if(states['binary_sensor.deye_battery_fault'] && states['binary_sensor.deye_battery_fault'].state === 'on') mel.push('accustoring');\n        r.push(['sensor.deye_device_alarm', mel.length ? 'bad' : 'ok', 'Meldingen', mel.length ? mel.join(', ') : 'geen']);\n\n        var grid = states['binary_sensor.deye_grid'];\n        var vs = ['1','2','3'].map(function(f){ return num('sensor.deye_grid_l' + f + '_voltage'); }).filter(function(v){ return v !== null; });\n        var hz = num('sensor.deye_grid_frequency');\n        // Deye ziet geen net: kijk naar de P1 om stroomstoring van afkoppelen te\n        // scheiden. Op 21-9 ging het relais drie keer ~30 s open terwijl de P1\n        // gewoon 231 V zag.\n        var p1v = num('sensor.slimhuys_zonneplan_spanning_l1');\n        if(grid && grid.state !== 'on') r.push(['binary_sensor.deye_grid', (p1v !== null && p1v > 200) ? 'warn' : 'bad', 'Net',\n          (p1v !== null && p1v > 200) ? 'omvormer koppelt af, net is er wel' : 'stroomstoring — huis op accu']);\n        else {\n          var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);\n          var goed = vs.length === 3 && lo >= 207 && hi <= 253 && hz !== null && Math.abs(hz - 50) <= 0.2;\n          r.push(['sensor.deye_grid_l1_voltage', goed ? 'ok' : 'warn', 'Net',\n            (vs.length ? nl(lo) + (hi !== lo ? '–' + nl(hi) : '') + ' V' : '—') + (hz !== null ? ' · ' + hz.toFixed(2).replace('.', ',') + ' Hz' : '')]);\n        }\n\n        var ta = num('sensor.deye_battery_temperature'), ti = num('sensor.deye_temperature');\n        var tk = 'ok';\n        if(ta !== null && (ta < 5 || ta > 40)) tk = 'warn';\n        if(ti !== null && ti > 65) tk = 'warn';\n        if((ta !== null && (ta < 0 || ta > 45)) || (ti !== null && ti > 75)) tk = 'bad';\n        r.push(['sensor.deye_temperature', tk, 'Temperatuur',\n          'accu ' + (ta === null ? '—' : nl(ta, 1)) + ' · omvormer ' + (ti === null ? '—' : nl(ti)) + ' °C']);\n\n        var weg = [];\n        if(!states['binary_sensor.deye_connection'] || states['binary_sensor.deye_connection'].state !== 'on') weg.push('Solarman');\n        if(!states['binary_sensor.markedroid_verbinding'] || states['binary_sensor.markedroid_verbinding'].state !== 'on') weg.push('MarkeDroid');\n        var ui = num('sensor.deye_update_interval');\n        r.push(['binary_sensor.deye_connection', weg.length ? 'bad' : (ui !== null && ui > 15 ? 'warn' : 'ok'), 'Verbindingen',\n          weg.length ? weg.join(' en ') + ' stil' : (ui !== null && ui > 15 ? 'Solarman traag (' + nl(ui) + ' s)' : 'Solarman · MarkeDroid')]);\n\n        return r.map(function(x, i){ return rij(x[0], x[1], x[2], x[3], i); }).join('');\n      ]]]"
    grid_options:
      columns: full
