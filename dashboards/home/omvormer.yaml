# Omvormer: wat gebeurt er nu, is alles in orde, en kloppen de bronnen.
#
# ALLEEN LEZEN (21 september 2026). De Deye wordt gestuurd door MarkeDroid;
# de `number.deye_*`, `select.deye_*`, `switch.deye_*` en `time.deye_*` zijn
# registers waar MarkeDroid op schrijft en staan hier bewust niet - ook niet
# als "alleen tonen", want dan is de stap naar een schuifje klein.
#
# OPBOUW. Bovenaan vier kaarten die elk één vraag beantwoorden: NU (grote
# getallen, kleur = richting), IN ORDE? (stoplicht per onderwerp), KLOPPEN DE
# BRONNEN? (P1, MarkeDroid en Deye naast elkaar) en PER FASE (balkjes vanuit
# het midden). Daaronder "Alle waarden": alle ~100 Deye- en MarkeDroid-
# sensoren, fases samengevoegd op één regel, zonder uitleg - alleen een label
# waar een getal iets anders betekent dan zijn naam doet vermoeden. De
# uitleg per sensor staat in de koppen van packages/9 - Other/Battery.yaml.
# Een eerste versie had bij elke regel een zin uitleg; dat was 131 regels
# tekst waarin niets opviel.
#
# SECTIONS EN GEEN MASONRY: masonry zet elke kaart in de kortste kolom, en
# dan staat de volgorde op zijn kop.
#
# KLEUREN: zon = clip (geel), afname = info (blauw), teruglevering en laden =
# ok (groen), accu levert = warn (oranje), MarkeDroid = accent (paars).
#
# DE LABELS 'niet het huis' EN 'onduidelijk' ZIJN METINGEN, geen handleiding:
# op 21 september liep `deye_load_l3_power` gelijk op met min de ZW-omvormer
# op zolder, en `deye_load_ups_power` gaf 50-100 W bij een huis van ruim 1 kW.
# Klopt dat na de definitieve aansluiting niet meer, pas dan de labels aan.
#
# De tabellen onderaan zijn gegenereerd uit een lijst maar met de hand te
# onderhouden: zie het template `ov_uitlegtabel` in overzicht_templates.yaml.
# Een entiteit erbij? Zet hem ook in `triggers_update` van dezelfde kaart.
type: sections
max_columns: 3
title: Omvormer
path: omvormer
icon: mdi:solar-power-variant
sections:
- type: grid
  column_span: 3
  cards:
  - type: custom:button-card
    template: ov_title
    variables:
      title: NU
    grid_options:
      columns: full
  - type: custom:button-card
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    triggers_update:
    - sensor.zon_vermogen_nu
    - sensor.meterkast_slimhuys_zonneplan_netto_vermogen
    - sensor.accu_vermogen
    - sensor.accu_status
    - sensor.accu_lading
    - sensor.huis_verbruik
    - sensor.markedroid_regie
    - sensor.markedroid_exportbegrenzer
    - binary_sensor.markedroid_verbinding
    - binary_sensor.markedroid_flex_actief
    styles:
      card:
      - background: none
      - border: none
      - box-shadow: none
      - padding: 0 2px 6px 2px
      grid:
      - grid-template-areas: '"x"'
      - grid-template-columns: minmax(0, 1fr)
      custom_fields:
        x:
        - justify-self: stretch
        - text-align: left
        - min-width: '0'
    custom_fields:
      x: "[[[\n\n        var num = function(id){ var s = states[id]; if(!s) return null; var n = Number(s.state);\n          return (s.state === '' || isNaN(n)) ? null : n; };\n        var nl = function(n, d){ return n.toLocaleString('nl-NL', {maximumFractionDigits: d === undefined ? 0 : d}); };\n        var watt = function(w){ if(w === null) return '—'; var a = Math.abs(w);\n          return a >= 1000 ? nl(a/1000, 1) + ' kW' : nl(a) + ' W'; };\n        var info = function(id){ return 'this.dispatchEvent(new CustomEvent(\\'hass-more-info\\',{detail:{entityId:\\'' + id + '\\'},bubbles:true,composed:true}))'; };\n        var stip = function(k){ return '<span style=\"display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;background:var(--ov-' + k + ')\"></span>'; };\n\n        var tegel = function(id, label, waarde, kleur, sub){\n          return '<div onclick=\"' + info(id) + '\" style=\"cursor:pointer;flex:1 1 150px;min-width:0;background:var(--ov-ink-4);border-radius:14px;padding:13px 16px\">'\n            + '<div style=\"font-size:11px;font-weight:700;letter-spacing:1.1px;color:var(--ov-ink-55)\">' + label + '</div>'\n            + '<div style=\"font-size:26px;font-weight:700;line-height:1.25;margin-top:4px;white-space:nowrap;font-variant-numeric:tabular-nums;color:' + kleur + '\">' + waarde + '</div>'\n            + '<div style=\"font-size:12.5px;color:var(--ov-ink-58);margin-top:1px\">' + sub + '</div></div>';\n        };\n        var t = [];\n\n        var zon = num('sensor.zon_vermogen_nu');\n        t.push(tegel('sensor.zon_vermogen_nu', 'ZON', watt(zon),\n          (zon || 0) > 50 ? 'var(--ov-clip)' : 'var(--ov-ink-35)', 'zolderpanelen'));\n\n        var net = num('sensor.meterkast_slimhuys_zonneplan_netto_vermogen');\n        t.push(tegel('sensor.meterkast_slimhuys_zonneplan_netto_vermogen', 'NET', watt(net),\n          net === null ? 'var(--ov-ink-35)' : (net < -50 ? 'var(--ov-ok)' : (net > 50 ? 'var(--ov-info)' : 'var(--ov-ink-35)')),\n          net === null ? 'P1-meter stil' : (net < -50 ? 'terug naar het net' : (net > 50 ? 'van het net' : 'in balans'))));\n\n        var acc = num('sensor.accu_vermogen'), st = states['sensor.accu_status'], ld = num('sensor.accu_lading');\n        var ak = st && st.state === 'laden' ? 'var(--ov-ok)' : (st && st.state === 'ontladen' ? 'var(--ov-warn)' : 'var(--ov-ink-35)');\n        var aw = st && st.state === 'laden' ? 'laadt' : (st && st.state === 'ontladen' ? 'levert' : 'rust');\n        t.push(tegel('sensor.accu_vermogen', 'ACCU', watt(acc), ak, aw + (ld !== null ? ' · ' + nl(ld) + '% vol' : '')));\n\n        var huis = num('sensor.huis_verbruik');\n        t.push(tegel('sensor.huis_verbruik', 'HUIS', huis === null ? '—' : watt(huis * 1000), 'var(--primary-text-color)', 'verbruik nu'));\n\n        // MarkeDroid: zijn keuze, of - zolang hij die nog niet meestuurt - dat hij er is.\n        var vb = states['binary_sensor.markedroid_verbinding'], rg = states['sensor.markedroid_regie'];\n        var ex = states['sensor.markedroid_exportbegrenzer'], fl = states['binary_sensor.markedroid_flex_actief'];\n        var mw, mk, ms;\n        if(!vb || vb.state !== 'on'){ mw = 'stil'; mk = 'var(--ov-bad)'; ms = 'geen berichten meer'; }\n        else if(rg && rg.state !== 'niet_geleverd' && rg.attributes.omschrijving){\n          mw = rg.state.replace(/_/g, ' '); mk = 'var(--ov-accent)'; ms = rg.attributes.omschrijving;\n        } else { mw = 'verbonden'; mk = 'var(--ov-accent)'; ms = 'stuurt zijn keuze nog niet mee'; }\n        if(fl && fl.state === 'on') ms = 'flex-opdracht loopt';\n        if(ex && ex.state === 'actief') ms = 'teruglevering dichtgezet';\n        t.push(tegel('sensor.markedroid_regie', 'MARKEDROID', mw, mk, ms));\n\n        return '<div style=\"display:flex;flex-wrap:wrap;gap:10px\">' + t.join('') + '</div>';\n      ]]]"
    grid_options:
      columns: full
