    - sensor.deye_grid_l1_voltage
    styles:
      card:
      - background: none
      - border: none
      - box-shadow: none
      - padding: 0 2px 6px 2px
      grid:
      - grid-template-areas: '"x"'
      - grid-template-columns: minmax(0, 1fr)
      custom_fields:
        x:
        - justify-self: stretch
        - text-align: left
        - min-width: '0'
    custom_fields:
      x: "[[[\n\n        var num = function(id){ var s = states[id]; if(!s) return null; var n = Number(s.state);\n          return (s.state === '' || isNaN(n)) ? null : n; };\n        var nl = function(n, d){ return n.toLocaleString('nl-NL', {maximumFractionDigits: d === undefined ? 0 : d}); };\n        var watt = function(w){ if(w === null) return '—'; var a = Math.abs(w);\n          return a >= 1000 ? nl(a/1000, 1) + ' kW' : nl(a) + ' W'; };\n        var info = function(id){ return 'this.dispatchEvent(new CustomEvent(\\'hass-more-info\\',{detail:{entityId:\\'' + id + '\\'},bubbles:true,composed:true}))'; };\n        var stip = function(k){ return '<span style=\"display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;background:var(--ov-' + k + ')\"></span>'; };\n\n        // Zelfde getal uit twee bronnen. Groen als ze binnen de marge liggen;\n        // de meetmomenten lopen tot ~10 s uiteen, dus bij wisselende last\n        // mag er af en toe een oranje tussen zitten.\n        var bron = function(naam, w, eh){ return '<span style=\"color:var(--ov-ink-45);font-weight:500;font-size:11.5px\">' + naam + '</span> '\n          + (w === null ? '—' : w) + (eh && w !== null ? ' ' + eh : ''); };\n        var rij = function(id, naam, k, delen, noot, i){\n          return '<div onclick=\"' + info(id) + '\" style=\"cursor:pointer;padding:9px 0;' + (i ? 'border-top:1px solid var(--ov-ink-6)' : '') + '\">'\n            + '<div style=\"display:flex;align-items:center;gap:10px\">' + stip(k)\n            + '<span style=\"font-size:14px;color:var(--ov-ink-80);flex:1\">' + naam + '</span>'\n            + '<span style=\"font-size:14px;font-weight:600;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums\">' + delen.join('<span style=\"color:var(--ov-ink-25)\">  ·  </span>') + '</span></div>'\n            + (noot ? '<div style=\"font-size:11.5px;color:var(--ov-ink-45);margin:2px 0 0 19px\">' + noot + '</div>' : '') + '</div>';\n        };\n        var eens = function(a, b, marge){ if(a === null || b === null) return 'ink-25';\n          return Math.abs(a - b) <= Math.max(marge, 0.15 * Math.max(Math.abs(a), Math.abs(b))) ? 'ok' : 'warn'; };\n        var r = [];\n\n        // MarkeDroid leest het net via de externe klemmen van de Deye, niet via\n        // de P1: die twee horen gelijk te lopen. Het verschil met de P1 is wat\n        // er aan de netkant van die klemmen hangt (21-9: 100-900 W).\n        var p1 = num('sensor.meterkast_slimhuys_zonneplan_netto_vermogen'), mdn = num('sensor.markedroid_net_vermogen'), dx = num('sensor.deye_external_power');\n        var buiten = (p1 === null || dx === null) ? '' : 'P1 (hele aansluiting): ' + nl(p1) + ' W — ' + nl(Math.abs(p1 - dx)) + ' W '\n          + (p1 >= dx ? 'meer' : 'minder') + ' dan de klemmen zien';\n        r.push(rij('sensor.markedroid_net_vermogen', 'Net bij de klemmen', eens(dx, mdn, 100),\n          [bron('Deye', dx === null ? null : nl(dx)), bron('MD', mdn === null ? null : nl(mdn), 'W')], buiten, 0));\n\n        var da = num('sensor.accu_vermogen'), ma = num('sensor.markedroid_accu_vermogen');\n        r.push(rij('sensor.markedroid_accu_vermogen', 'Accu vermogen', eens(da, ma, 100),\n          [bron('Deye', da === null ? null : nl(da)), bron('MD', ma === null ? null : nl(ma), 'W')], '', 1));\n\n        var dl = num('sensor.accu_lading'), ml = num('sensor.markedroid_accu_lading');\n        r.push(rij('sensor.markedroid_accu_lading', 'Lading', eens(dl, ml, 1.5),\n          [bron('Deye', dl === null ? null : nl(dl)), bron('MD', ml === null ? null : nl(ml), '%')], '', 2));\n\n        var pv = num('sensor.slimhuys_zonneplan_spanning_l1'), mv = num('sensor.markedroid_net_spanning_l1'), dv = num('sensor.deye_grid_l1_voltage');\n        var vk = (pv === null || mv === null || dv === null) ? 'ink-25'\n               : (Math.max(pv, mv, dv) - Math.min(pv, mv, dv) <= 4 ? 'ok' : 'warn');\n        r.push(rij('sensor.markedroid_net_spanning_l1', 'Spanning L1', vk,\n          [bron('P1', pv === null ? null : nl(pv)), bron('MD', mv === null ? null : nl(mv)), bron('Deye', dv === null ? null : nl(dv), 'V')], '', 3));\n\n        return r.join('');\n      ]]]"
    grid_options:
      columns: full
