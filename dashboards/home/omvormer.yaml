      rijen:
      - e: sensor.deye_pv_power
        n: Panelen op de Deye
        u: 'De twee eigen MPPT-ingangen. Daar hangt niets aan: 0,2 V terwijl de zolderpanelen 1 kW leverden. Die hebben hun eigen omvormers.'
      - e: sensor.deye_pv1_power
        n: PV1
        u: Ingang 1.
      - e: sensor.deye_pv1_voltage
        n: PV1 spanning
        u: Staat er een string op, dan honderden volts.
      - e: sensor.deye_pv1_current
        n: PV1 stroom
        u: Idem, stroom.
      - e: sensor.deye_pv2_power
        n: PV2
        u: Ingang 2.
      - e: sensor.deye_pv2_voltage
        n: PV2 spanning
        u: Idem.
      - e: sensor.deye_pv2_current
        n: PV2 stroom
        u: Idem.
      - e: sensor.deye_today_production
        n: Opgewekt vandaag
        u: Van deze twee ingangen.
      - e: sensor.deye_total_production
        n: Opgewekt totaal
        u: Idem, sinds de installatie (blijft leeg zolang er niets is opgewekt).
      - e: binary_sensor.deye_microinverter
        n: GEN-poort als zoningang
        u: De GEN-poort kan een generator of een micro-omvormer (AC-gekoppelde panelen) aannemen. Aan = ingesteld als zoningang.
      - e: sensor.deye_microinverter_power
        n: GEN-poort vermogen
        u: 'Wat er via de GEN-poort binnenkomt. Staat bij ons op 0: de zolderomvormers hangen daar niet aan.'
      - e: sensor.deye_microinverter_l1_power
        n: GEN L1
        u: Idem, fase 1.
      - e: sensor.deye_microinverter_l2_power
        n: GEN L2
        u: Idem, fase 2.
      - e: sensor.deye_microinverter_l3_power
        n: GEN L3
        u: Idem, fase 3.
      - e: sensor.deye_microinverter_l1_voltage
        n: GEN L1 spanning
        u: Spanning op de GEN-poort.
      - e: sensor.deye_microinverter_l2_voltage
        n: GEN L2 spanning
        u: Idem, fase 2.
      - e: sensor.deye_microinverter_l3_voltage
        n: GEN L3 spanning
        u: Idem, fase 3.
      - e: sensor.deye_microinverter_energy_today
        n: GEN vandaag
        u: Energie via de GEN-poort vandaag.
      - e: sensor.deye_microinverter_energy
        n: GEN totaal
        u: Idem, totaal.
- type: vertical-stack
  cards:
  - type: custom:button-card
    template: ov_title
    variables:
      title: DEYE · DE OMVORMER ZELF
  - type: custom:button-card
    template: ov_uitlegtabel
    triggers_update:
    - sensor.deye_temperature
    - sensor.deye_dc_temperature
    - sensor.deye_power_losses
    - sensor.deye_today_losses
    - sensor.deye_total_losses
    variables:
      rijen:
      - e: sensor.deye_temperature
        n: Temperatuur
        u: Temperatuur van de omvormer (AC-kant/koelplaat). Onder de 60 °C is ruim binnen de marge.
      - e: sensor.deye_dc_temperature
        n: Temperatuur DC
        u: Temperatuur van de DC-omzetting (accu- en paneelkant).
      - e: sensor.deye_power_losses
        n: Verlies nu
        u: Eigenverbruik van de omvormer plus omzettingsverlies.
      - e: sensor.deye_today_losses
        n: Verlies vandaag
        u: Idem, opgeteld over vandaag.
      - e: sensor.deye_total_losses
        n: Verlies totaal
        u: Idem, sinds de installatie.
