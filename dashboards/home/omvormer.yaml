# Omvormer: wat gebeurt er nu, is alles in orde, en wat zegt MarkeDroid.
#
# ALLEEN LEZEN. De Deye wordt gestuurd door MarkeDroid (ModuSun), niet door
# Home Assistant. De METINGEN komen sinds 4 november 2026 weer uit de
# Solarman-integratie (`*.inverter_*`, om de ~5 s), wat MarkeDroid BESLIST
# (regie, exportbegrenzer, flex) uit zijn MQTT-berichten. Tussen 22 september
# en 4 november kwam alles van MarkeDroid; zie de kop van
# packages/9 - Other/Battery.yaml voor de hele geschiedenis.
#
# OPBOUW. Bovenaan NU (grote getallen, kleur = richting), dan IN ORDE?
# (stoplicht), WAT MARKEDROID BESLIST en PER FASE (P1, balkjes vanuit het
# midden). Daaronder de ruwe Solarman-waarden, compact, zonder uitleg per
# regel - alleen een label waar een getal iets anders betekent dan zijn naam
# doet vermoeden. Een eerste versie had bij elke regel een zin uitleg; dat
# was 131 regels tekst waarin niets opviel.
#
# DE INSTELLINGEN STAAN ER ALLEEN OM TE LEZEN. Solarman biedt ze ook als
# `number.`/`select.`/`switch.` aan, maar dat zijn de registers waar
# MarkeDroid op stuurt: geen bediening op deze pagina.
#
# SECTIONS EN GEEN MASONRY: masonry zet elke kaart in de kortste kolom, en
# dan staat de volgorde op zijn kop.
#
# KLEUREN: zon = clip (geel), afname = info (blauw), teruglevering en laden =
# ok (groen), accu levert = warn (oranje), MarkeDroid = accent (paars).
#
# De tabellen zijn gegenereerd uit een lijst maar met de hand te onderhouden:
# zie het template `ov_uitlegtabel` in overzicht_templates.yaml. Een entiteit
# erbij? Zet hem ook in `triggers_update` van dezelfde kaart.
type: sections
max_columns: 3
title: Omvormer
path: omvormer
icon: mdi:solar-power-variant
sections:
- type: grid
  column_span: 3
  cards:
  - type: custom:button-card
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    triggers_update:
    - sensor.zon_vermogen_nu
    - sensor.zon_vermogen_zw
    - sensor.zon_vermogen_o
    - sensor.meterkast_slimhuys_zonneplan_netto_vermogen
    - sensor.accu_vermogen
    - sensor.accu_status
    - sensor.accu_lading
    - sensor.huis_verbruik
    - sensor.markedroid_regie
    - sensor.markedroid_exportbegrenzer
    - binary_sensor.markedroid_verbinding
    - binary_sensor.markedroid_flex_actief
    styles:
      card:
      # Zonder pointer-events: auto doen de onclicks niets: button-card zet
      # pointer-events: none op een kaart met tap_action none (7 nov 2026).
      - pointer-events: auto
      - background: none
      - border: none
      - box-shadow: none
      - padding: 0 2px 6px 2px
      grid:
      - grid-template-areas: '"x"'
      - grid-template-columns: minmax(0, 1fr)
      custom_fields:
        x:
        - justify-self: stretch
        - text-align: left
        - min-width: '0'
        - white-space: normal
    custom_fields:
      x: "[[[\n\n        // Zelfde leesfout-filter als in ov_uitlegtabel: een negatief vermogen\n        // zonder teken (65.286 = -250 W), onzin in de miljarden, 0 Hz.\n        var num = function(id){ var s = states[id]; if(!s) return null; var n = Number(s.state);\n          if(s.state === '' || isNaN(n)) return null;\n          var eh = s.attributes.unit_of_measurement;\n          if(eh === 'W'){ if(n >= 32768 && n < 65536) n = n - 65536; if(Math.abs(n) > 100000) return null; }\n          if(eh === 'Hz' && n < 40) return null;\n          return n; };\n        var nl = function(n, d){ return n.toLocaleString('nl-NL', {maximumFractionDigits: d === undefined ? 0 : d}); };\n        var watt = function(w){ if(w === null) return '—'; var a = Math.abs(w);\n          return a >= 1000 ? nl(a/1000, 1) + ' kW' : nl(a) + ' W'; };\n        var info = function(id){ return 'this.dispatchEvent(new CustomEvent(\\'hass-more-info\\',{detail:{entityId:\\'' + id + '\\'},bubbles:true,composed:true}))'; };\n        var stip = function(k){ return '<span style=\"display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;background:var(--ov-' + k + ')\"></span>'; };\n        var inhoud = (function(){\n\n        var tegel = function(id, label, waarde, kleur, sub){\n          return '<div onclick=\"' + info(id) + '\" style=\"cursor:pointer;flex:1 1 150px;min-width:0;background:var(--ov-ink-4);border-radius:14px;padding:13px 16px\">'\n            + '<div style=\"font-size:11px;font-weight:700;letter-spacing:1.1px;color:var(--ov-ink-55)\">' + label + '</div>'\n            + '<div style=\"font-size:26px;font-weight:700;line-height:1.25;margin-top:4px;white-space:nowrap;font-variant-numeric:tabular-nums;color:' + kleur + '\">' + waarde + '</div>'\n            + '<div style=\"font-size:12.5px;color:var(--ov-ink-58);margin-top:1px\">' + sub + '</div></div>';\n        };\n        var t = [];\n\n        var zon = num('sensor.zon_vermogen_nu');\n        t.push(tegel('sensor.zon_vermogen_nu', 'ZON', watt(zon),\n          (zon || 0) > 50 ? 'var(--ov-clip)' : 'var(--ov-ink-35)',\n          (function(){ var zw = num('sensor.zon_vermogen_zw'), o = num('sensor.zon_vermogen_o');\n            return (zw === null && o === null) ? 'alle panelen' : 'ZW ' + watt(zw) + ' · O ' + watt(o); })()));\n\n        var net = num('sensor.meterkast_slimhuys_zonneplan_netto_vermogen');\n        t.push(tegel('sensor.meterkast_slimhuys_zonneplan_netto_vermogen', 'NET', watt(net),\n          net === null ? 'var(--ov-ink-35)' : (net < -50 ? 'var(--ov-ok)' : (net > 50 ? 'var(--ov-info)' : 'var(--ov-ink-35)')),\n          net === null ? 'P1-meter stil' : (net < -50 ? 'terug naar het net' : (net > 50 ? 'van het net' : 'in balans'))));\n\n        var acc = num('sensor.accu_vermogen'), st = states['sensor.accu_status'], ld = num('sensor.accu_lading');\n        var ak = st && st.state === 'laden' ? 'var(--ov-ok)' : (st && st.state === 'ontladen' ? 'var(--ov-warn)' : 'var(--ov-ink-35)');\n        var aw = st && st.state === 'laden' ? 'laadt' : (st && st.state === 'ontladen' ? 'levert' : 'rust');\n        t.push(tegel('sensor.accu_vermogen', 'ACCU', watt(acc), ak, aw + (ld !== null ? ' · ' + nl(ld) + '% vol' : '')));\n\n        var huis = num('sensor.huis_verbruik');\n        t.push(tegel('sensor.huis_verbruik', 'HUIS', huis === null ? '—' : watt(huis * 1000), 'var(--primary-text-color)', 'verbruik nu'));\n\n        // MarkeDroid: zijn keuze, of - zolang hij die nog niet meestuurt - dat hij er is.\n        var vb = states['binary_sensor.markedroid_verbinding'], rg = states['sensor.markedroid_regie'];\n        var ex = states['sensor.markedroid_exportbegrenzer'], fl = states['binary_sensor.markedroid_flex_actief'];\n        var mw, mk, ms;\n        if(!vb || vb.state !== 'on'){ mw = 'stil'; mk = 'var(--ov-bad)'; ms = 'geen berichten meer'; }\n        else if(rg && rg.state !== 'niet_geleverd' && rg.attributes.omschrijving){\n          mw = rg.state.replace(/_/g, ' '); mk = 'var(--ov-accent)'; ms = rg.attributes.omschrijving;\n        } else { mw = 'verbonden'; mk = 'var(--ov-accent)'; ms = 'stuurt zijn keuze nog niet mee'; }\n        if(fl && fl.state === 'on') ms = 'flex-opdracht loopt';\n        if(ex && ex.state === 'actief') ms = 'teruglevering dichtgezet';\n        t.push(tegel('sensor.markedroid_regie', 'MARKEDROID', mw, mk, ms));\n\n        return '<div style=\"display:flex;flex-wrap:wrap;gap:10px\">' + t.join('') + '</div>';\n        })();\n        return '<div style=\"font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--ov-ink-55);padding:2px 0 10px 0\">NU</div>' + inhoud;\n      ]]]"
    grid_options:
      columns: full
- type: grid
  cards:
  - type: custom:button-card
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    triggers_update:
    - binary_sensor.huis_op_accu
    - sensor.inverter_grid_l1_voltage
    - sensor.inverter_grid_frequency
    - sensor.accu_temperatuur
    - sensor.inverter_temperature
    - binary_sensor.omvormer_storing
    - binary_sensor.inverter_connection
    - binary_sensor.markedroid_verbinding
    styles:
      card:
      # Zonder pointer-events: auto doen de onclicks niets: button-card zet
      # pointer-events: none op een kaart met tap_action none (7 nov 2026).
      - pointer-events: auto
      - background: none
      - border: none
      - box-shadow: none
      - padding: 0 2px 6px 2px
      grid:
      - grid-template-areas: '"x"'
      - grid-template-columns: minmax(0, 1fr)
      custom_fields:
        x:
        - justify-self: stretch
        - text-align: left
        - min-width: '0'
        - white-space: normal
    custom_fields:
      x: "[[[\n\n        // Zelfde leesfout-filter als in ov_uitlegtabel: een negatief vermogen\n        // zonder teken (65.286 = -250 W), onzin in de miljarden, 0 Hz.\n        var num = function(id){ var s = states[id]; if(!s) return null; var n = Number(s.state);\n          if(s.state === '' || isNaN(n)) return null;\n          var eh = s.attributes.unit_of_measurement;\n          if(eh === 'W'){ if(n >= 32768 && n < 65536) n = n - 65536; if(Math.abs(n) > 100000) return null; }\n          if(eh === 'Hz' && n < 40) return null;\n          return n; };\n        var nl = function(n, d){ return n.toLocaleString('nl-NL', {maximumFractionDigits: d === undefined ? 0 : d}); };\n        var watt = function(w){ if(w === null) return '—'; var a = Math.abs(w);\n          return a >= 1000 ? nl(a/1000, 1) + ' kW' : nl(a) + ' W'; };\n        var info = function(id){ return 'this.dispatchEvent(new CustomEvent(\\'hass-more-info\\',{detail:{entityId:\\'' + id + '\\'},bubbles:true,composed:true}))'; };\n        var stip = function(k){ return '<span style=\"display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;background:var(--ov-' + k + ')\"></span>'; };\n        var inhoud = (function(){\n\n        var rij = function(id, k, naam, tekst, i){\n          return '<div onclick=\"' + info(id) + '\" style=\"cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 0;'\n            + (i ? 'border-top:1px solid var(--ov-ink-6)' : '') + '\">' + stip(k)\n            + '<span style=\"font-size:14px;color:var(--ov-ink-80);flex:1\">' + naam + '</span>'\n            + '<span style=\"font-size:14px;font-weight:600;text-align:right;color:' + (k === 'ok' ? 'var(--primary-text-color)' : 'var(--ov-' + k + ')') + '\">' + tekst + '</span></div>';\n        };\n        var r = [];\n        // Net: `huis_op_accu` is het oordeel (Battery.yaml), spanning en\n        // frequentie meet de Deye zelf op zijn netaansluiting.\n        var op = states['binary_sensor.huis_op_accu'];\n        var vs = ['1','2','3'].map(function(f){ return num('sensor.inverter_grid_l' + f + '_voltage'); }).filter(function(v){ return v !== null; });\n        var hz = num('sensor.inverter_grid_frequency');\n        if(op && op.state === 'on')\n          r.push(['binary_sensor.huis_op_accu', op.attributes.oorzaak === 'stroomstoring' ? 'bad' : 'warn', 'Net',\n            op.attributes.oorzaak === 'stroomstoring' ? 'stroomstoring — huis op accu' : 'omvormer ziet geen net, P1 wel']);\n        else if(!vs.length) r.push(['sensor.inverter_grid_l1_voltage', 'warn', 'Net', 'geen spanning bekend']);\n        else {\n          var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);\n          var goed = vs.length === 3 && lo >= 207 && hi <= 253 && (hz === null || Math.abs(hz - 50) <= 0.2);\n          r.push(['sensor.inverter_grid_l1_voltage', goed ? 'ok' : 'warn', 'Net',\n            nl(lo) + (nl(hi) !== nl(lo) ? '–' + nl(hi) : '') + ' V' + (hz !== null ? ' · ' + hz.toFixed(2).replace('.', ',') + ' Hz' : '')]);\n        }\n\n        var ta = num('sensor.accu_temperatuur'), ti = num('sensor.inverter_temperature');\n        var tk = 'ok';\n        if(ta !== null && (ta < 5 || ta > 40)) tk = 'warn';\n        if(ti !== null && ti > 65) tk = 'warn';\n        if((ta !== null && (ta < 0 || ta > 45)) || (ti !== null && ti > 75)) tk = 'bad';\n        r.push(['sensor.accu_temperatuur', tk, 'Temperatuur',\n          'accu ' + (ta === null ? '—' : nl(ta, 1) + ' °C') + (ti !== null ? ' · omvormer ' + nl(ti) + ' °C' : '')]);\n\n        // Meldingen van omvormer en BMS (`binary_sensor.omvormer_storing`).\n        var sg = states['binary_sensor.omvormer_storing'];\n        if(sg && sg.state === 'on') r.push(['binary_sensor.omvormer_storing', 'bad', 'Meldingen', sg.attributes.omschrijving || 'probleem']);\n        else if(sg && sg.state === 'off') r.push(['binary_sensor.omvormer_storing', 'ok', 'Meldingen', 'geen']);\n\n        var weg = [];\n        if(!states['binary_sensor.inverter_connection'] || states['binary_sensor.inverter_connection'].state !== 'on') weg.push('Solarman');\n        if(!states['binary_sensor.markedroid_verbinding'] || states['binary_sensor.markedroid_verbinding'].state !== 'on') weg.push('MarkeDroid');\n        r.push([weg[0] === 'MarkeDroid' ? 'binary_sensor.markedroid_verbinding' : 'binary_sensor.inverter_connection', weg.length ? 'bad' : 'ok', 'Verbinding',\n          weg.length ? weg.join(' en ') + ' stil' : 'Solarman · MarkeDroid']);\n\n        return r.map(function(x, i){ return rij(x[0], x[1], x[2], x[3], i); }).join('');\n        })();\n        return '<div style=\"font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--ov-ink-55);padding:2px 0 10px 0\">IN ORDE?</div>' + inhoud;\n      ]]]"
    grid_options:
      columns: full
- type: grid
  cards:
  - type: custom:button-card
    template: ov_uitlegtabel
    triggers_update:
    - sensor.markedroid_regie
    - sensor.markedroid_exportbegrenzer
    - binary_sensor.markedroid_negatieve_prijs
    - binary_sensor.markedroid_flex_actief
    - sensor.markedroid_flex_vermogen
    - binary_sensor.markedroid_verbinding
    variables:
      titel: WAT MARKEDROID BESLIST
      rijen:
      - e: sensor.markedroid_regie
        n: Regie
        a: omschrijving
        tag: nog niet geleverd
        tk: info
      - e:
        - sensor.markedroid_exportbegrenzer
        - binary_sensor.markedroid_negatieve_prijs
        n: Exportbegrenzer · dicht
        tag: nog niet geleverd
        tk: info
      - e:
        - binary_sensor.markedroid_flex_actief
        - sensor.markedroid_flex_vermogen
        n: Flex-opdracht
      - e: binary_sensor.markedroid_verbinding
        n: Verbinding
    grid_options:
      columns: full
- type: grid
  cards:
  - type: custom:button-card
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    triggers_update:
    - sensor.slimhuys_zonneplan_vermogen_l1
    - sensor.slimhuys_zonneplan_vermogen_l2
    - sensor.slimhuys_zonneplan_vermogen_l3
    - sensor.slimhuys_zonneplan_spanning_l1
    - sensor.slimhuys_zonneplan_spanning_l2
    - sensor.slimhuys_zonneplan_spanning_l3
    - sensor.inverter_load_l1_power
    - sensor.inverter_load_l2_power
    - sensor.inverter_load_l3_power
    styles:
      card:
      # Zonder pointer-events: auto doen de onclicks niets: button-card zet
      # pointer-events: none op een kaart met tap_action none (7 nov 2026).
      - pointer-events: auto
      - background: none
      - border: none
      - box-shadow: none
      - padding: 0 2px 6px 2px
      grid:
      - grid-template-areas: '"x"'
      - grid-template-columns: minmax(0, 1fr)
      custom_fields:
        x:
        - justify-self: stretch
        - text-align: left
        - min-width: '0'
        - white-space: normal
    custom_fields:
      x: "[[[\n\n        // Zelfde leesfout-filter als in ov_uitlegtabel: een negatief vermogen\n        // zonder teken (65.286 = -250 W), onzin in de miljarden, 0 Hz.\n        var num = function(id){ var s = states[id]; if(!s) return null; var n = Number(s.state);\n          if(s.state === '' || isNaN(n)) return null;\n          var eh = s.attributes.unit_of_measurement;\n          if(eh === 'W'){ if(n >= 32768 && n < 65536) n = n - 65536; if(Math.abs(n) > 100000) return null; }\n          if(eh === 'Hz' && n < 40) return null;\n          return n; };\n        var nl = function(n, d){ return n.toLocaleString('nl-NL', {maximumFractionDigits: d === undefined ? 0 : d}); };\n        var watt = function(w){ if(w === null) return '—'; var a = Math.abs(w);\n          return a >= 1000 ? nl(a/1000, 1) + ' kW' : nl(a) + ' W'; };\n        var info = function(id){ return 'this.dispatchEvent(new CustomEvent(\\'hass-more-info\\',{detail:{entityId:\\'' + id + '\\'},bubbles:true,composed:true}))'; };\n        var stip = function(k){ return '<span style=\"display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;background:var(--ov-' + k + ')\"></span>'; };\n        var inhoud = (function(){\n\n        // Balk vanuit het midden: rechts = afname/verbruik, links = teruglevering.\n        // Schaal: 3 kW per kant, of meer als een fase daarboven zit.\n        var ids = {net: ['1','2','3'].map(function(f){ return 'sensor.slimhuys_zonneplan_vermogen_l' + f; }),\n                   uit: ['1','2','3'].map(function(f){ return 'sensor.inverter_load_l' + f + '_power'; })};\n        var alle = ids.net.concat(ids.uit).map(num).filter(function(v){ return v !== null; }).map(Math.abs);\n        var schaal = Math.max.apply(null, [3000].concat(alle));\n        var balk = function(w){\n          if(w === null) return '<div style=\"height:8px;border-radius:4px;background:var(--ov-ink-6)\"></div>';\n          var pct = Math.min(Math.abs(w) / schaal * 50, 50);\n          var kl = w < 0 ? 'var(--ov-ok)' : 'var(--ov-info)';\n          return '<div style=\"position:relative;height:8px;border-radius:4px;background:var(--ov-ink-6)\">'\n            + '<div style=\"position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--ov-ink-25)\"></div>'\n            + '<div style=\"position:absolute;top:0;bottom:0;border-radius:4px;background:' + kl + ';'\n            + (w < 0 ? 'right:50%;' : 'left:50%;') + 'width:' + pct + '%\"></div></div>';\n        };\n        var regel = function(label, id, w){\n          return '<div onclick=\"' + info(id) + '\" style=\"cursor:pointer;display:grid;grid-template-columns:52px minmax(0,1fr) 62px;align-items:center;column-gap:10px;margin:3px 0\">'\n            + '<span style=\"font-size:11.5px;color:var(--ov-ink-50)\">' + label + '</span>' + balk(w)\n            + '<span style=\"font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums\">' + (w === null ? '—' : nl(w)) + '</span></div>';\n        };\n        var html = '';\n        ['1','2','3'].forEach(function(f, i){\n          var v = num('sensor.slimhuys_zonneplan_spanning_l' + f);\n          html += '<div style=\"padding:9px 0;' + (i ? 'border-top:1px solid var(--ov-ink-6)' : '') + '\">'\n            + '<div style=\"display:flex;justify-content:space-between;font-size:14px;margin-bottom:3px\">'\n            + '<span style=\"font-weight:600\">L' + f + '</span><span style=\"color:var(--ov-ink-50);font-size:12.5px\">' + (v === null ? '—' : nl(v) + ' V') + '</span></div>'\n            + regel('net', ids.net[i], num(ids.net[i]))\n            + (states[ids.uit[i]] ? regel('last', ids.uit[i], num(ids.uit[i])) : '') + '</div>';\n        });\n        html += '<div style=\"font-size:11.5px;color:var(--ov-ink-45);margin-top:4px\">'\n          + '<span style=\"color:var(--ov-info)\">■</span> afname / verbruik  ·  <span style=\"color:var(--ov-ok)\">■</span> teruglevering  ·  '\n          + 'net volgens de P1-meter, last volgens de Deye.</div>';\n        return html;\n        })();\n        return '<div style=\"font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--ov-ink-55);padding:2px 0 10px 0\">PER FASE</div>' + inhoud;\n      ]]]"
    grid_options:
      columns: full
