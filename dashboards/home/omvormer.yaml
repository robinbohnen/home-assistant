# Omvormer: alles wat MarkeDroid en de Deye (Solarman) melden, met uitleg.
#
# ALLEEN LEZEN (21 september 2026). De Deye wordt gestuurd door MarkeDroid;
# de `number.deye_*`, `select.deye_*`, `switch.deye_*` en `time.deye_*` zijn
# registers waar MarkeDroid op schrijft en staan hier bewust niet - ook niet
# als "alleen tonen", want dan is de stap naar een schuifje klein.
#
# SECTIONS EN GEEN MASONRY: masonry zet elke kaart in de kortste kolom, en dan
# stond "Deye · netkant" midden tussen de MarkeDroid-blokken. Hier is de
# volgorde vast: eerst MarkeDroid, dan de Deye, met een kop ertussen.
#
# Elke regel is `e` (entiteit, of een lijst voor L1/L2/L3 op één regel), `n`
# (naam), `u` (uitleg) en optioneel `a`/`s`/`eh`/`d`/`min`/`m` - zie het
# template `ov_uitlegtabel` in overzicht_templates.yaml. Een entiteit erbij?
# Zet hem ook in `triggers_update` van dezelfde kaart, anders ververst hij niet.
#
# De uitleg bij de uitgang en de UPS-last is een meting en geen handleiding:
# op 21 september liep `deye_load_l3_power` gelijk op met min de ZW-omvormer
# op zolder, en `deye_load_ups_power` gaf 50-100 W bij een huis van ruim 1 kW.
# Klopt dat na de definitieve aansluiting niet meer, pas dan de tekst aan.
type: sections
max_columns: 3
title: Omvormer
path: omvormer
icon: mdi:solar-power-variant
sections:
- type: grid
  column_span: 3
  cards:
  - type: markdown
    content: '**Alles hier is gelezen; niets is een knop.** De Deye wordt gestuurd door MarkeDroid (ModuSun), niet door Home Assistant. Bovenaan wat MarkeDroid zelf meldt, daaronder wat de omvormer via Solarman meldt. Veel getallen staan er dubbel en lopen niet altijd gelijk: wat het huis gebruikt komt uit de P1-meter en `sensor.huis_verbruik`, wat de accu doet uit `sensor.accu_*`. Tik op een regel voor de historie.'
- type: grid
  column_span: 3
  cards:
  - type: heading
    heading: MarkeDroid
    heading_style: title
- type: grid
  cards:
  - type: custom:button-card
    template: ov_title
    variables:
      title: WAT HIJ BESLIST
    grid_options:
      columns: full
  - type: custom:button-card
    template: ov_uitlegtabel
    triggers_update:
    - binary_sensor.markedroid_verbinding
    - sensor.markedroid_regie
    - sensor.markedroid_exportbegrenzer
    - binary_sensor.markedroid_negatieve_prijs
    - binary_sensor.markedroid_flex_actief
    - sensor.markedroid_flex_vermogen
    variables:
      rijen:
      - e: binary_sensor.markedroid_verbinding
        n: Verbinding
        u: Berichten komen om de ~10 s binnen; na een minuut stilte gaat dit uit.
      - e: sensor.markedroid_regie
        n: Regie
        a: omschrijving
        u: De stand waarin MarkeDroid de accu zet (eigen verbruik, vasthouden, laden van het net, flex…). ModuSun rolt dit veld nog uit; bij ons ontbreekt het.
      - e:
        - sensor.markedroid_exportbegrenzer
        - binary_sensor.markedroid_negatieve_prijs
        n: Exportbegrenzer · dicht
        u: '''actief'' = teruglevering op 0 W gezet, meestal bij een negatieve prijs. Ontbreekt ook nog in onze berichten.'
      - e:
        - binary_sensor.markedroid_flex_actief
        - sensor.markedroid_flex_vermogen
        n: Flex-opdracht
        u: Een energiebedrijf vraagt via MarkeDroid vermogen van de accu. Positief = kopen, negatief = verkopen.
    grid_options:
      columns: full
  - type: custom:button-card
    template: ov_title
    variables:
      title: OPGETELD SINDS 21 SEPTEMBER
    grid_options:
      columns: full
  - type: custom:button-card
    template: ov_uitlegtabel
