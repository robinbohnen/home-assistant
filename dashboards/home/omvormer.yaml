    - sensor.markedroid_accu_ontladen
    - sensor.markedroid_net_afname
    - sensor.markedroid_net_teruglevering
    - sensor.markedroid_zon_energie
    - sensor.markedroid_last_energie
    - binary_sensor.markedroid_teruglevering
    - binary_sensor.markedroid_net_uitgevallen
    variables:
      rijen:
      - e:
        - sensor.markedroid_accu_geladen
        - sensor.markedroid_accu_ontladen
        n: Accu geladen · ontladen
        s: 0.001
        eh: kWh
        d: 2
        u: Opgeteld uit MarkeDroids eigen metingen sinds 21 september. Terwijl HA plat ligt telt er niets.
      - e:
        - sensor.markedroid_net_afname
        - sensor.markedroid_net_teruglevering
        n: Net afname · terug
        s: 0.001
        eh: kWh
        d: 2
        u: De rekening volgt de P1-meter, niet dit.
      - e:
        - sensor.markedroid_zon_energie
        - sensor.markedroid_last_energie
