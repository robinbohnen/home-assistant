# Button-card templates for the "Overzicht" wall dashboard.
# Included at the Lovelace root via ui-lovelace.yaml (button_card_templates).
#
# De naam is historisch: dit is de enige plek waar button-card-templates
# geladen worden, dus de kamertegels onderaan (dashboards/home/kamers.yaml)
# staan hier ook. Templates met voorvoegsel `ov_` horen bij Overzicht,
# `kamer_` bij de Kamers-weergave.

# --- Person row: avatar initial, name, status, battery -----------------------
ov_person:
  show_icon: false
  show_name: false
  show_state: false
  variables:
    battery: sensor.none
    travel: sensor.none
  tap_action:
    action: more-info
  styles:
    grid:
      - grid-template-areas: '"av info bat"'
      # `minmax(0, 1fr)` en niet `1fr`: een grid-item mag standaard niet kleiner
      # worden dan zijn eigen inhoud, dus een lange status ("onderweg · 72 min")
      # duwde deze kolom breder dan de kaart en liep dan dwars over het
      # batterijpercentage heen. Met een ondergrens van 0 krimpt de kolom wel en
      # kapt de tekst af met een ellipsis (zie het `info`-veld hieronder).
      - grid-template-columns: 30px minmax(0, 1fr) auto
      - align-items: center
      - column-gap: 11px
    card:
      - background: none
      - border: none
      - box-shadow: none
      # COMPACTER SINDS 17 SEPTEMBER 2026: was 8px padding en een foto van
      # 34px, dus 50px per persoon. Nu 5px en 30px = 40px, nog steeds een
      # ruim tikvlak over de volle kaartbreedte. Robin wilde de linkerkolom
      # korter zonder iets weg te halen; deze vier regels leveren 40px op.
      # `ov_person` wordt alleen in overzicht/kolom_links.yaml gebruikt.
      - padding: 5px 2px
    custom_fields:
      av:
        - grid-area: av
      info:
        - grid-area: info
        - justify-self: start
        - min-width: 0
        - overflow: hidden
      bat:
        - grid-area: bat
        - justify-self: end
  custom_fields:
    av: |
      [[[
        var n = entity && entity.attributes.friendly_name ? entity.attributes.friendly_name : '?';
        var home = entity && entity.state === 'home';
        // Foto uit de person-entiteit; thuis/afwezig zit in de ringkleur en
        // (net als vroeger) in de tekst ernaast. Afwezig wordt de foto iets
        // gedimd, zodat je op afstand ziet wie er is zonder te lezen.
        var pic = entity && entity.attributes.entity_picture ? entity.attributes.entity_picture : null;
        var ring = home ? 'var(--ov-ok-75)' : 'var(--ov-ink-18)';
        if(pic){
          return `<div style="width:30px;height:30px;border-radius:50%;border:2px solid ${ring};box-sizing:border-box;background-image:url('${pic}');background-size:cover;background-position:center;${home ? '' : 'filter:grayscale(0.7);opacity:0.7'}"></div>`;
        }
        var bg = home ? 'var(--ov-ok-wash-16)' : 'var(--ov-ink-6)';
        var col = home ? 'var(--ov-ok)' : 'var(--ov-ink-55)';
        return `<div style="width:30px;height:30px;border-radius:50%;background:${bg};color:${col};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;">${n.charAt(0)}</div>`;
      ]]]
    info: |
      [[[
        var fn = entity && entity.attributes.friendly_name ? entity.attributes.friendly_name.split(' ')[0] : '?';
        var home = entity && entity.state === 'home';
        var st = home ? 'thuis' : 'afwezig';
        var kleur = 'var(--ov-ink-52)';
        if(!home) {
          // In een bekende zone is de person-state de zonenaam zelf; die is
          // informatiever dan "afwezig" of "onderweg", dus die tonen we.
          var zone = entity ? entity.state : '';
          var bekend = zone && ['not_home','unavailable','unknown'].indexOf(zone) === -1;
          if(bekend) { st = zone; kleur = 'var(--ov-info)'; }
          // Reistijd naar huis, als de routesensor een bruikbare waarde heeft.
          var r = states[variables.travel];
          if(r && !isNaN(Number(r.state)) && Number(r.state) > 0) {
            st = (bekend ? zone : 'onderweg') + ' · ' + Math.round(Number(r.state)) + ' min';
            kleur = 'var(--ov-info)';
          }
        }
        // De voornaam blijft heel (`flex:0 0 auto`), de status krijgt de rest en
        // kapt af als die er niet in past - anders schuift hij over de batterij.
        return `<span style="display:flex;align-items:baseline;gap:9px;min-width:0"><span style="flex:0 0 auto;font-size:15px;font-weight:600;color:var(--primary-text-color)">${fn}</span><span style="flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:${kleur}">${st}</span></span>`;
      ]]]
    bat: |
      [[[
        var b = states[variables.battery];
        if(!b || isNaN(Number(b.state))) return '';
        var v = Math.round(Number(b.state));
        var c = v <= 10 ? 'var(--ov-bad)' : (v <= 20 ? 'var(--ov-warn)' : 'var(--primary-text-color)');
        return `<span style="font-size:15px;font-weight:600;color:${c}">${v}%</span>`;
      ]]]

# --- Room row: name, "x lampen aan"/"alles uit", on-dot --------------------
ov_room:
  show_icon: false
  show_name: true
  variables:
    lights: []
    temp: sensor.none
  styles:
    grid:
      # Zie ov_person: zonder een ondergrens van 0 groeit een kolom door tot
      # zijn inhoud past en schuift de samenvatting over de kamernaam heen.
      # De rekbare kolom is hier de NAAM en niet de samenvatting: van
      # "Garage / speelkamer" is de helft nog te herkennen, van "22,2° · alles
      # uit" niet. De naam kapt dus af met een ellipsis, de samenvatting houdt
      # altijd zijn volle breedte.
      - grid-template-areas: '"n sum dot"'
      - grid-template-columns: minmax(0, 1fr) auto auto
      - align-items: center
      - column-gap: 10px
    card:
      - background: none
      - border: none
      - box-shadow: none
      # Was 9px (17 september 2026 naar 6px, zelfde ronde als `ov_person`):
      # een regel van ~32px over de volle breedte blijft goed te raken, en
      # de vijf ruimtes plus de deurenregel leveren samen ruim 30px op. De
      # deurenregel in kolom_links.yaml heeft zijn eigen padding; houd die
      # erbij in de pas.
      - padding: 6px 2px
    name:
      - grid-area: n
      - justify-self: start
      - font-size: 14.5px
      - font-weight: "500"
      - color: var(--primary-text-color)
      - min-width: 0
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
    custom_fields:
      sum:
        - grid-area: sum
        - justify-self: end
        - font-size: 13px
      dot:
        - grid-area: dot
        - justify-self: end
  custom_fields:
    sum: |
      [[[
        var ls = variables.lights || [];
        var on = ls.filter(e => states[e] && states[e].state === 'on').length;
        var lamp = on === 0
          ? `<span style="color:var(--ov-ink-60)">alles uit</span>`
          : `<span style="color:var(--ov-ink-72)">${on} ${on===1?'lamp':'lampen'} aan</span>`;
        // temp mag één entiteit zijn of een lijstje; de eerste met een bruikbaar
        // getal wint. Klimaatentiteiten leveren hem via current_temperature.
        var bronnen = variables.temp;
        if(typeof bronnen === 'string') bronnen = [bronnen];
        var g = null;
        (bronnen || []).some(function(id){
          var e = states[id];
          if(!e) return false;
          if(!isNaN(Number(e.state))) { g = Number(e.state); return true; }
          var a = e.attributes ? e.attributes.current_temperature : null;
          if(a != null && !isNaN(Number(a))) { g = Number(a); return true; }
          return false;
        });
        if(g === null) return lamp;
        // Alleen kleuren bij uitschieters; anders blijft het rustig.
        var kleur = g < 17 ? 'var(--ov-info)' : (g > 25 ? 'var(--ov-warn)' : 'var(--ov-ink-85)');
        var graden = `<span style="color:${kleur};font-weight:600">${g.toFixed(1).replace('.',',')}°</span>`;
        return `<span style="display:inline-flex;align-items:baseline;gap:8px;white-space:nowrap">${graden}<span style="color:var(--ov-ink-20)">·</span>${lamp}</span>`;
      ]]]
    dot: |
      [[[
        var ls = variables.lights || [];
        var on = ls.filter(e => states[e] && states[e].state === 'on').length;
        var c = on > 0 ? 'var(--ov-info-strong)' : 'var(--ov-ink-14)';
        return `<div style="width:9px;height:9px;border-radius:50%;background:${c}"></div>`;
      ]]]

# --- Power consumer bar row -------------------------------------------------
ov_bar:
  show_name: true
  show_state: false
  show_icon: false
  variables:
    max: 4000
  tap_action:
    action: more-info
  styles:
    grid:
      - grid-template-areas: '"n bar val"'
      # 205px is de gewenste breedte, geen harde eis: op een smalle kolom mag
      # de naam inleveren (hij kapt af met een ellipsis, zie `name` hieronder)
      # in plaats van de balk de kaart uit te duwen.
      - grid-template-columns: minmax(0, 205px) minmax(0, 1fr) 72px
      - align-items: center
      - column-gap: 14px
    card:
      - background: none
      - border: none
      - box-shadow: none
      - padding: 7px 2px
    name:
      - grid-area: n
      - justify-self: start
      - font-size: 14px
      - color: var(--ov-ink-85)
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
    custom_fields:
      bar:
        - grid-area: bar
      val:
        - grid-area: val
        - justify-self: end
  custom_fields:
    bar: |
      [[[
        var v = entity && !isNaN(Number(entity.state)) ? Number(entity.state) : 0;
        var m;
        if(variables.scale === 'auto') {
          // Schaal op de zwaarste verbruiker van dit moment, anders zijn alle
          // balkjes even kort zodra er niets groots aan staat. Dezelfde
          // uitsluitingen als de auto-entities-filter, zodat zon/omvormer
          // de schaal niet kapen.
          var skip = /inverter|zonnepanel|zonneplan|slimhuys|goodwe|mvormer|solar/i;
          m = 0;
          Object.keys(states).forEach(function(k){
            if(k.lastIndexOf('sensor.', 0) !== 0) return;
            var s = states[k];
            var fn = s && s.attributes ? s.attributes.friendly_name : null;
            if(!fn || !/vermogen/i.test(fn) || skip.test(fn)) return;
            var n = Number(s.state);
            if(!isNaN(n) && n > m) m = n;
          });
          m = Math.max(m, 10);
        } else {
          m = variables.max || 1000;
        }
        var pct = Math.max(2, Math.min(100, v / m * 100));
        return `<div style="width:100%;height:6px;background:var(--ov-ink-7);border-radius:3px;overflow:hidden"><div style="width:${pct}%;height:100%;background:var(--ov-info-strong);border-radius:3px"></div></div>`;
      ]]]
    val: |
      [[[
        var v = entity && !isNaN(Number(entity.state)) ? Math.round(Number(entity.state)) : 0;
        return `<span style="font-size:14px;font-weight:600;color:var(--primary-text-color)">${v} W</span>`;
      ]]]

# --- Climate row: name, temp/doel, action badge ----------------------------
ov_climate:
  show_name: true
  show_icon: false
  show_state: false
  tap_action:
    action: more-info
  styles:
    grid:
      - grid-template-areas: '"n badge" "sub badge"'
      - grid-template-columns: minmax(0, 1fr) auto
      - align-items: center
      - column-gap: 10px
    card:
      - background: none
      - border: none
      - box-shadow: none
      - padding: 11px 2px
    name:
      - grid-area: n
      - justify-self: start
      - font-size: 14.5px
      - font-weight: "600"
      - color: var(--primary-text-color)
      - min-width: 0
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
    custom_fields:
      sub:
        - grid-area: sub
        - justify-self: start
        - font-size: 12.5px
        - color: var(--ov-ink-58)
        - padding-top: 2px
        - min-width: 0
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
      badge:
        - grid-area: badge
        - justify-self: end
        # button-card zet `overflow: hidden` op elk custom_field en dit veld
        # is maar zo hoog als één regel tekst; de padding van het pilletje
        # viel daarbuiten en werd onderaan weggeknipt (4 oktober 2026).
        - overflow: visible
  custom_fields:
    sub: |
      [[[
        // DE KAMER, NIET DE BINNENUNIT
        // Een airco meet bij zijn eigen unit en zat op 18 augustus 2026 1,3°
        // naast de multisensor van de woonkamer: RUIMTES zei 25,3° en KLIMAAT
        // 24,0° voor dezelfde kamer, op hetzelfde scherm. Zet `variables.temp`
        // op de kamersensor en die wint; laat je hem leeg, dan blijft het de
        // meting van het apparaat zelf (voor de zolder en de spa is dat de
        // enige die er is).
        var bron = (variables && variables.temp) ? states[variables.temp] : null;
        var cur = (bron && !isNaN(Number(bron.state)))
                ? Number(bron.state)
                : entity.attributes.current_temperature;
        var tgt = entity.attributes.temperature;
        var off = entity.state === 'off' || entity.state === 'unavailable';
        if(cur != null) {
          var s = Number(cur).toFixed(1).replace('.',',') + '°';
          if(!off && tgt != null) s += ' · doel ' + Number(tgt).toFixed(1).replace('.',',') + '°';
          return s;
        }
        return off ? (entity.state === 'unavailable' ? 'niet beschikbaar' : 'uit') : (entity.state || '');
      ]]]
    badge: |
      [[[
        // Geen badge als de airco offline is; de subregel meldt dat al.
        if(!entity || entity.state === 'unavailable' || entity.state === 'unknown') return '';
        var blauw = ['var(--ov-info)','var(--ov-info-15)'];
        var oranje = ['var(--ov-warn)','var(--ov-warn-15)'];
        var grijs = ['var(--ov-ink-60)','var(--ov-ink-8)'];
        var uit = ['var(--ov-ink-50)','var(--ov-ink-6)'];
        // hvac_action = wat hij nu doet, state = de ingestelde stand.
        // Niet elke airco levert hvac_action, dus beide moeten vertaald worden.
        var map = {cooling:['koelen'].concat(blauw),
                   heating:['verwarmt'].concat(oranje),
                   drying:['ontvochtigt'].concat(blauw),
                   fan:['ventileert'].concat(grijs),
                   preheating:['voorverwarmt'].concat(oranje),
                   defrosting:['ontdooit'].concat(oranje),
                   idle:['idle'].concat(grijs),
                   off:['uit'].concat(uit),
                   cool:['koelen'].concat(blauw),
                   heat:['verwarmen'].concat(oranje),
                   dry:['ontvochtigen'].concat(blauw),
                   fan_only:['ventileren'].concat(grijs),
                   heat_cool:['automatisch'].concat(grijs),
                   auto:['automatisch'].concat(grijs)};
        var m = map[entity.attributes.hvac_action] || map[entity.state];
        if(!m) m = [String(entity.state).replace(/_/g,' ')].concat(grijs);
        return `<span style="font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;color:${m[1]};background:${m[2]}">${m[0]}</span>`;
      ]]]

# --- Aan/uit-schakelaar: icoon, naam, subregel en een aan/uit-badge --------
# Tikken schakelt meteen, vasthouden geeft more-info. Bewust `toggle` en niet
# turn_on/turn_off: dit is een knop die de stand omklapt, en de badge laat
# zien welke kant je op gaat.
#
# Werkt voor elk domein met een aan/uit-stand (switch, input_boolean, light).
# `variables.sub` is optioneel; laat je hem leeg, dan valt de subregel weg.
ov_toggle:
  show_name: true
  show_icon: false
  show_state: false
  tap_action:
    action: toggle
  hold_action:
    action: more-info
  variables:
    mdi: mdi:toggle-switch
    sub: ""
    aan_kleur: "var(--ov-ok)"
  styles:
    grid:
      - grid-template-areas: '"ic n badge" "ic sub badge"'
      - grid-template-columns: 34px minmax(0, 1fr) auto
      - align-items: center
      - column-gap: 12px
    card:
      - background: none
      - border: none
      - box-shadow: none
      - padding: 11px 2px
    name:
      - grid-area: n
      - justify-self: start
      - font-size: 14.5px
      - font-weight: "600"
      - color: var(--primary-text-color)
      - min-width: 0
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
    custom_fields:
      ic:
        - grid-area: ic
      sub:
        - grid-area: sub
        - justify-self: start
        - font-size: 12.5px
        - color: var(--ov-ink-58)
        - padding-top: 2px
        - min-width: 0
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
      badge:
        - grid-area: badge
        - justify-self: end
        - overflow: visible  # zie ov_climate
  custom_fields:
    ic: |
      [[[
        var aan = entity && entity.state === 'on';
        var weg = !entity || ['unavailable','unknown'].indexOf(entity.state) !== -1;
        var col = weg ? 'var(--ov-ink-25)'
                      : (aan ? variables.aan_kleur : 'var(--ov-ink-35)');
        return `<ha-icon icon="${variables.mdi}" style="--mdc-icon-size:22px;color:${col}"></ha-icon>`;
      ]]]
    sub: |
      [[[ return variables.sub || ''; ]]]
    badge: |
      [[[
        // Een weggevallen schakelaar krijgt bewust geen "uit"-badge: dan lijkt
        // hij bediend terwijl er niets te bedienen valt.
        if(!entity || ['unavailable','unknown'].indexOf(entity.state) !== -1)
          return `<span style="font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;color:var(--ov-ink-50);background:var(--ov-ink-6)">geen verbinding</span>`;
        var aan = entity.state === 'on';
        var kleur = aan ? variables.aan_kleur : 'var(--ov-ink-50)';
        var vlak = aan ? 'var(--ov-ok-15)' : 'var(--ov-ink-6)';
        return `<span style="font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;color:${kleur};background:${vlak}">${aan ? 'aan' : 'uit'}</span>`;
      ]]]

# --- Vandaag / list row: icon, title, subtitle -----------------------------
ov_listrow:
  show_icon: false
  show_name: false
  variables:
    title: ""
    mdi: mdi:information
    kleur: var(--ov-ink-60)
  styles:
    grid:
      - grid-template-areas: '"ic t" "ic s"'
      # Anders dan de regels hierboven kapt deze niet af maar breekt hij af naar
      # een tweede regel (een afspraaknaam moet leesbaar blijven). Daarvoor is
      # alleen nodig dat de kolom smaller mag worden dan de tekst; de tekst
      # zelf staat niet op `nowrap`.
      - grid-template-columns: 40px minmax(0, 1fr)
      - align-items: center
      - column-gap: 14px
    card:
      - background: none
      - border: none
      - box-shadow: none
      - padding: 10px 2px
    custom_fields:
      ic:
        - grid-area: ic
      t:
        - grid-area: t
        - justify-self: start
        - font-size: 14.5px
        - font-weight: "600"
        - color: var(--primary-text-color)
        - min-width: 0
      s:
        - grid-area: s
        - justify-self: start
        - font-size: 12.5px
        - color: var(--ov-ink-58)
        - min-width: 0
  custom_fields:
    ic: |
      [[[
        return `<ha-icon icon="${variables.mdi}" style="--mdc-icon-size:22px;color:${variables.kleur}"></ha-icon>`;
      ]]]
    t: |
      [[[ return variables.title; ]]]

# --- Luchtregel: CO2, fijnstof en vocht op één regel met kwaliteitsbadge ----
# Stond tot 4 september 2026 uitgeschreven in `overzicht/kolom_rechts.yaml` als
# één kaart voor de woonkamer. Toen Maxi's kamer er een multisensor bij kreeg
# was de keuze: die negentig regels JS er een tweede keer in plakken, of ze hier
# één keer neerzetten. Dat laatste dus - anders lopen de drempels van de twee
# kamers vroeg of laat uit elkaar.
#
# De instantie zet zelf `entity` (de luchtkwaliteits-entiteit, die stuurt ook de
# badge én zorgt dat de kaart hertekent) en `tap_action`.
ov_lucht:
  show_icon: false
  show_name: false
  show_state: false
  variables:
    naam: Lucht
    co2: sensor.none
    pm25: sensor.none
    rv: sensor.none
    # Halve breedte (garage en meterkast delen één regel): dan valt het
    # vochtgetal weg. Kleurt het vocht wél (onder 30 of boven 70%), dan
    # blijft het staan - een waarschuwing laat je niet weg om ruimte.
    kort: false
  styles:
    grid:
      - grid-template-areas: '"n badge" "sub badge"'
      # Zelfde raster als ov_climate, inclusief de ondergrens van 0:
      # "591 ppm · PM2.5 2,0 · 53% rv" is een lange regel en liep zonder dat
      # over de kwaliteitsbadge heen.
      - grid-template-columns: minmax(0, 1fr) auto
      - align-items: center
      - column-gap: 10px
    card:
      - background: none
      - border: none
      - box-shadow: none
      - padding: 11px 2px
    custom_fields:
      n:
        - grid-area: n
        - justify-self: start
        - min-width: 0
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
      sub:
        - grid-area: sub
        - justify-self: start
        - font-size: 12.5px
        - padding-top: 2px
        - min-width: 0
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
      badge:
        - grid-area: badge
        - justify-self: end
        - overflow: visible  # zie ov_climate
  custom_fields:
    n: |
      [[[
        return `<span style="font-size:14.5px;font-weight:600;color:var(--primary-text-color)">${variables.naam}</span>`;
      ]]]
    sub: |
      [[[
        var grijs = 'var(--ov-ink-58)';
        // getal ophalen; null als de sensor er niet is of niets zinnigs geeft
        var num = function(id){
          var e = id ? states[id] : null;
          if(!e || isNaN(Number(e.state))) return null;
          return Number(e.state);
        };
        // tekst() krijgt de waarde binnen, zodat een ontbrekende sensor
        // hier stopt in plaats van in de opmaak van een null.
        var deel = function(waarde, tekst, drempel, alarm){
          if(waarde === null) return null;
          var kleur = waarde >= alarm ? 'var(--ov-bad)' : (waarde >= drempel ? 'var(--ov-warn)' : grijs);
          return `<span style="color:${kleur};font-weight:${waarde >= drempel ? 600 : 400}">${tekst(waarde)}</span>`;
        };
        var co2 = num(variables.co2);
        var pm = num(variables.pm25);
        var rv = num(variables.rv);
        var d = [];
        // CO2: boven ~800 ppm wordt het benauwd, boven 1200 echt ventileren
        var c = deel(co2, v => `${Math.round(v)} ppm`, 800, 1200);
        if(c) d.push(c);
        // PM2.5: WHO-daggemiddelde ligt op 15 µg/m³
        var p = deel(pm, v => `PM2.5 ${v.toFixed(1).replace('.',',')}`, 15, 35);
        if(p) d.push(p);
        if(rv !== null && !(variables.kort && rv >= 30 && rv <= 70)) {
          // Vocht knijpt aan twee kanten: te droog én te vochtig is mis
          var kleur = (rv < 30 || rv > 70) ? 'var(--ov-warn)' : grijs;
          d.push(`<span style="color:${kleur}">${Math.round(rv)}% rv</span>`);
        }
        if(!d.length) return `<span style="color:${grijs}">geen meting</span>`;
        return d.join(`<span style="color:var(--ov-ink-20)"> · </span>`);
      ]]]
    badge: |
      [[[
        if(!entity || entity.state === 'unavailable' || entity.state === 'unknown') return '';
        var groen = ['var(--ov-ok)','var(--ov-ok-15)'];
        var grijs = ['var(--ov-ink-60)','var(--ov-ink-8)'];
        var oranje = ['var(--ov-warn)','var(--ov-warn-15)'];
        var rood = ['var(--ov-bad)','var(--ov-bad-15)'];
        var map = {excellent:['uitstekend'].concat(groen),
                   good:['goed'].concat(groen),
                   fair:['redelijk'].concat(grijs),
                   moderate:['matig'].concat(oranje),
                   poor:['slecht'].concat(oranje),
                   very_poor:['zeer slecht'].concat(rood),
                   extremely_poor:['extreem slecht'].concat(rood)};
        var m = map[entity.state];
        // De UniFi-sensoren (garage, meterkast) geven geen klasse maar een
        // getal: de Amerikaanse AQI, met de banden van de EPA.
        var aqi = Number(entity.state);
        if(!m && entity.state !== '' && !isNaN(aqi))
          m = aqi <= 50 ? ['goed'].concat(groen)
            : aqi <= 100 ? ['matig'].concat(oranje)
            : aqi <= 150 ? ['slecht'].concat(oranje)
            : ['ongezond'].concat(rood);
        if(!m) m = [String(entity.state).replace(/_/g,' ')].concat(grijs);
        return `<span style="font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;color:${m[1]};background:${m[2]}">${m[0]}</span>`;
      ]]]

# --- Panel title (uppercase label, optional right badge) -------------------
ov_title:
  show_name: false
  show_icon: false
  variables:
    title: ""
    badge: ""
  tap_action:
    action: none
  styles:
    grid:
      # De badge is soms twee pillen breed (AUTO: laadstand + actieradius). Op
      # een smalle kolom liep die over de titel heen; `minmax(0, ...)` laat de
      # titelkolom krimpen en `flex-wrap` op de badge laat de pillen afbreken.
      - grid-template-areas: '"t b"'
      - grid-template-columns: minmax(0, 1fr) auto
      - align-items: center
      - column-gap: 8px
    card:
      - background: none
      - border: none
      - box-shadow: none
      - padding: 2px 2px 10px 2px
    custom_fields:
      t:
        - grid-area: t
        - justify-self: start
        - min-width: 0
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
        - font-size: 12px
        - font-weight: "700"
        - letter-spacing: 1.2px
        - color: var(--ov-ink-55)
      b:
        - grid-area: b
        - justify-self: end
  custom_fields:
    t: |
      [[[ return variables.title; ]]]
    b: |
      [[[
        if(!variables.badge) return '';
        return `<span style="font-size:11.5px;font-weight:600;padding:3px 11px;border-radius:20px;color:var(--ov-ok);background:var(--ov-ok-wash-15)">${variables.badge}</span>`;
      ]]]

# --- Header pill -----------------------------------------------------------
ov_pill:
  show_name: false
  show_icon: false
  styles:
    grid:
      - grid-template-areas: '"c"'
    card:
      - background: var(--ov-ink-5)
      - border: 1px solid var(--ov-ink-6)
      - border-radius: 20px
      - padding: 7px 14px
      - height: auto
      - width: max-content
      - overflow: visible
    custom_fields:
      c:
        - font-size: 13px
        - font-weight: "500"
        - white-space: nowrap
        - overflow: visible

# --- Gedeelde Sonos-speakerlijst -------------------------------------------
# Kaarten die media uitlezen of bedienen erven deze via `template: ov_sonos`,
# zodat de lijst op één plek staat. Volgorde bepaalt welke speaker wint als er
# meerdere tegelijk spelen (woonkamer is altijd de groepsmaster).
ov_sonos:
  variables:
    speakers:
      - media_player.woonkamer_sonos
      - media_player.keuken_sonos
      - media_player.overkapping_sonos
      - media_player.speelkamer_sonos
      - media_player.kantoor_sonos
      - media_player.badkamer_sonos
      - media_player.toilet_sonos
      - media_player.garage_sonos
      - media_player.slaapkamer_maxi_sonos
      - media_player.slaapkamer_mini_sonos

#############################################################################
## Kamers (dashboards/home/kamers.yaml) - Server-stijl sinds 7 november 2026
#############################################################################
# Alle kaarten lezen dezelfde entiteit, `sensor.kamers` (custom_templates/
# kamers.jinja via packages/9 - Other/Kamers.yaml), en rekenen in de browser.
# Ze bevatten geen enkele drempel: goed/let op/slecht komt kant en klaar uit
# de jinja. Wil je de grenzen bijstellen, dan is dit niet het bestand dat je
# zoekt. De bouwstenen (kop, badge, regel) komen uit www/sv-kit.js, de
# paneelstijl uit `sv_paneel`; zie docs/dashboard-stijl.md.
#
# Kleuren per status (staan in elke kaart opnieuw, button-card kent geen
# gedeelde JS buiten sv-kit): goed ok · let op warn · slecht bad · geen meting
# grijs (ink-25). "Geen meting" telt bewust niet als probleem in de badge:
# dat is een lege batterij of een kamer zonder sensor, en die staat met reden
# en advies gewoon op zijn regel.
#
# Tekst uit `sensor.kamers` (naam, reden, advies, entity-id's, namen van
# ramen) gaat door S.esc(): het is onze eigen jinja, maar een friendly_name
# komt van een integratie.

# --- Paneel per verdieping -------------------------------------------------
# Eén paneel per `verdieping` uit de KAMERS-tabel in kamers.jinja; de kamers
# komen in de volgorde van die tabel. Een nieuwe kamer verschijnt dus vanzelf
# op de juiste verdieping - alleen zijn pop-up (#kamer-<slug>, `_` wordt `-`)
# moet in kamers.yaml bij (tests/test_kamers_pagina.py bewaakt dat).
#
# Per kamer drie korte regels:
#   1. stip in de statuskleur, icoon, naam, temperatuur (gekleurd als hij
#      zelf de uitschieter is, half doorzichtig als de meting oud is)
#   2. reden · advies (in de statuskleur), rechts de overige metingen
#      (CO₂, PM2.5, RV, licht - alleen wat er écht gemeten wordt)
#   3. beweging links, ramen/deuren rechts
# Een kamer zonder aangewezen sensor (`gekoppeld` 0) heeft geen temperatuur;
# zijn regel 2 legt uit waarom (dat zegt de jinja in `reden`).
kamer_verdieping:
  template: sv_paneel
  entity: sensor.kamers
  triggers_update:
    - sensor.kamers
  variables:
    verdieping: ""
    titel: ""
  custom_fields:
    x: |
      [[[
        var S = window.svKit && window.svKit(states);
        if(!S) return '';
        var bron = states['sensor.kamers'];
        var L = (bron && bron.attributes && bron.attributes.kamers) || [];
        var titel = S.esc(variables.titel || variables.verdieping || '').toUpperCase();
        if(!L.length) return S.kop(titel, S.pil('bad', 'geen data'))
          + S.tekst('<span style="color:var(--ov-bad)">sensor.kamers heeft nog geen waarde</span> - zie packages/9 - Other/Kamers.yaml.');
        var K = {'goed': 'ok', 'let op': 'warn', 'slecht': 'bad'};
        var hier = L.filter(function(k){ return k && k.verdieping === variables.verdieping; });
        var problemen = hier.filter(function(k){ return k.status === 'let op' || k.status === 'slecht'; });
        var badge;
        if(!hier.length) badge = S.pil(null, 'geen kamers');
        else if(!problemen.length) badge = S.pil('ok', 'in orde');
        else if(problemen.length === 1) badge = S.pil(K[problemen[0].status], S.esc(problemen[0].naam || problemen[0].slug).toLowerCase());
        else badge = S.pil(problemen.some(function(k){ return k.status === 'slecht'; }) ? 'bad' : 'warn', problemen.length + ' kamers');
        var getal = function(w){ return typeof w === 'number' && isFinite(w); };
        var scoreKleur = function(sc, rust){ return sc >= 2 ? 'var(--ov-bad)' : (sc === 1 ? 'var(--ov-warn)' : rust); };
        // Icoon in de tekstflow: vertical-align en een vaste box, zie de
        // opmerking over ha-icon in kolom_midden.yaml.
        var ic = function(naam, kleur, maat){
          return '<ha-icon icon="' + S.esc(naam) + '" style="--mdc-icon-size:' + maat + 'px;width:' + maat + 'px;height:' + maat + 'px;vertical-align:middle;color:' + kleur + '"></ha-icon> ';
        };
        var blok = function(k){
          var kk = K[k.status] || 'ink-25';
          var M = k.metingen || [];
          var t = M.filter(function(m){ return m.k === 'temp'; })[0];
          var temp = '';
          if(t && getal(t.w)) temp = '<span style="color:' + scoreKleur(t.score, 'var(--primary-text-color)') + (t.oud ? ';opacity:0.45' : '') + '">' + S.nl(t.w, 1) + '°</span>';
          else if(k.gekoppeld !== 0) temp = '<span style="color:var(--ov-ink-25)">—</span>';
          var strip = ['co2', 'pm25', 'rv', 'lux'].map(function(key){
            var m = M.filter(function(x){ return x.k === key; })[0];
            if(!m || !getal(m.w)) return '';
            var v = key === 'pm25' ? S.nl(m.w, Math.round(m.w * 10) % 10 ? 1 : 0) : S.nl(m.w, 0) + (key === 'rv' ? '%' : '');
            var lab = {co2: 'CO₂', pm25: 'PM2.5', rv: 'RV', lux: 'lx'}[key];
            return '<span style="color:' + scoreKleur(m.score, 'var(--ov-ink-72)') + (m.oud ? ';opacity:0.45' : '') + '">' + v + '</span><span style="color:var(--ov-ink-34)"> ' + lab + '</span>';
          }).filter(function(x){ return x; }).join('<span style="color:var(--ov-ink-18)"> · </span>');
          var rk = kk === 'warn' || kk === 'bad' ? 'var(--ov-' + kk + ')' : 'var(--ov-ink-50)';
          var reden = S.esc(k.reden || '') + (k.advies ? ' · ' + S.esc(k.advies) : '');
          var stil = 'var(--ov-ink-25)', grijs = 'var(--ov-ink-45)';
          var b = k.beweging || {}, bew;
          if(!b.gemeten) bew = ic('mdi:motion-sensor-off', stil, 13) + '<span style="color:' + stil + '">geen melder</span>';
          else if(b.actief) bew = ic('mdi:motion-sensor', 'var(--ov-ok)', 13) + '<span style="color:var(--ov-ok)">nu aanwezig</span>';
          else {
            var mi = b.minuten;
            var tt = !getal(mi) ? 'onbekend' : (mi < 1 ? 'net nog' : (mi < 60 ? Math.round(mi) + ' min geleden'
              : (mi < 1440 ? Math.round(mi / 60) + ' uur geleden' : Math.round(mi / 1440) + ' dagen geleden')));
            bew = ic('mdi:motion-sensor', grijs, 13) + '<span style="color:' + grijs + '">' + tt + '</span>';
          }
          var ct = k.contacten || {}, con;
          if(!ct.gemeten) con = '<span style="color:' + stil + '">geen contact</span>';
          else if(!ct.open) con = '<span style="color:' + grijs + '">alles dicht</span>';
          else con = ic('mdi:window-open-variant', 'var(--ov-info)', 13) + '<span style="color:var(--ov-info)">' + S.nl(ct.open) + ' open</span>';
          var slug = String(k.slug || '').replace(/_/g, '-');
          var klik = S.klik('#kamer-' + slug);
          return '<div' + klik + ' style="' + (klik ? 'cursor:pointer;' : '') + 'padding:6px 0 5px 0;border-top:1px solid var(--ov-ink-6);min-width:0">'
            + '<div style="display:flex;align-items:center;gap:8px;min-width:0">' + S.stip(kk)
              + ic(k.icoon || 'mdi:help', 'var(--ov-ink-55)', 16)
              + '<span style="flex:1;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + S.esc(k.naam || k.slug || '?') + '</span>'
              + '<span style="font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap">' + temp + '</span></div>'
            + '<div style="display:flex;justify-content:space-between;gap:10px;font-size:12px;line-height:1.35;margin-top:1px;padding-left:16px;min-width:0">'
              + '<span style="min-width:0;color:' + rk + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + reden + '</span>'
              + '<span style="flex:none;font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums">' + strip + '</span></div>'
            + '<div style="display:flex;justify-content:space-between;gap:10px;font-size:11.5px;line-height:1.35;margin-top:1px;padding-left:16px;white-space:nowrap">'
              + '<span>' + bew + '</span><span>' + con + '</span></div>'
            + '</div>';
        };
        return S.kop(titel, badge) + hier.map(blok).join('');
      ]]]

# --- Detail in de pop-up ---------------------------------------------------
# De enige plek waar je ziet WELKE entiteit een waarde geleverd heeft. Klopt
# een cijfer niet, dan hoort de juiste sensor als `klimaat` of `voorkeur` in
# de tabel in custom_templates/kamers.jinja. Een regel aantikken opent het
# more-info-venster van die sensor, met zijn historie.
#
# Bewust button-card en geen markdown: een markdown-kaart is een
# `render_template`-abonnement op de server, en zeventien verborgen pop-ups
# zouden er zeventien openhouden die elke minuut opnieuw renderen.
#
# Wat er NIET gemeten wordt staat onderaan ("niet gemeten: CO₂, licht"): de
# kamerregels tonen alleen wat er is, dus anders stond "geen CO₂ in de
# slaapkamer" nergens meer.
kamer_detail:
  template: sv_paneel
  entity: sensor.kamers
  variables:
    slug: ""
  custom_fields:
    x: |
      [[[
        var S = window.svKit && window.svKit(states);
        if(!S) return '';
        var bron = states['sensor.kamers'];
        var L = (bron && bron.attributes && bron.attributes.kamers) || [];
        var k = L.filter(function(x){ return x && x.slug === variables.slug; })[0];
        if(!k) return S.kop('METINGEN', S.pil('warn', 'geen data'))
          + S.tekst('sensor.kamers heeft nog geen waarde voor ' + S.esc(variables.slug) + '.');
        var K = {'goed': 'ok', 'let op': 'warn', 'slecht': 'bad'};
        var kk = K[k.status] || null;
        var getal = function(w){ return typeof w === 'number' && isFinite(w); };
        var uit = S.kop('METINGEN', S.pil(kk, S.esc(k.status || '?')))
          + '<div style="font-size:15px;font-weight:600;line-height:1.35;color:' + (kk ? 'var(--ov-' + kk + ')' : 'var(--ov-ink-55)') + '">' + S.esc(k.reden || '') + '</div>'
          + (k.advies ? S.tekst(S.esc(k.advies)) : '');
        var M = k.metingen || [];
        var er = M.filter(function(x){ return getal(x.w); });
        if(!er.length) {
          // Geen cijfer heeft twee heel verschillende oorzaken; die moeten uit
          // elkaar te houden zijn, anders zoek je de verkeerde kant op.
          uit += S.tekst(k.gekoppeld === 0
            ? 'Aan deze ruimte is geen sensor gekoppeld. Wijs er één aan bij <code>klimaat</code> in <code>custom_templates/kamers.jinja</code>.'
            : 'De aangewezen sensor geeft geen waarde door - batterij of verbinding.');
        } else {
          uit += S.rijen(er.map(function(x){
            var c = x.score >= 2 ? 'bad' : (x.score === 1 ? 'warn' : null);
            var v = S.nl(x.w, Math.round(x.w * 10) % 10 ? 1 : 0) + S.esc(x.eenheid || '');
            return {klik: x.id, k: c,
              naam: '<span style="display:inline-block;width:58px;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ov-ink-45)">' + S.esc(x.label || x.k) + '</span>'
                + '<span style="font-family:monospace;font-size:11px;color:var(--ov-ink-35)">' + S.esc(x.id || '') + '</span>',
              waarde: '<span' + (x.oud ? ' style="opacity:0.45"' : '') + '>' + v + (x.oud ? ' · oud' : '') + '</span>'};
          }), 1);
        }
        // Beweging en ramen/deuren: hier met de namen van wat er open staat.
        var b = k.beweging || {}, ct = k.contacten || {};
        var bew = !b.gemeten ? 'geen melder' : (b.actief ? 'nu aanwezig'
          : (getal(b.minuten) ? S.duur(b.minuten * 60000) + ' geleden' : 'onbekend'));
        var open = !ct.gemeten ? 'geen contact' : (!ct.open ? 'alles dicht' + (getal(ct.totaal) ? ' (' + S.nl(ct.totaal) + ')' : '')
          : S.nl(ct.open) + ' open' + ((ct.namen || []).length ? ': ' + ct.namen.map(S.esc).join(', ') : ''));
        uit += S.subkop('AANWEZIGHEID EN OPENINGEN', '')
          + S.rijen([{naam: 'Beweging', waarde: bew, k: b.actief ? 'ok' : null},
                     {naam: 'Ramen en deuren', waarde: open, k: ct.open ? 'info' : null}], 1, 0);
        var mist = M.filter(function(x){ return !getal(x.w); }).map(function(x){ return S.esc(x.label || x.k); });
        if(mist.length) uit += S.voet('Niet gemeten: ' + mist.join(', ') + '.');
        return uit;
      ]]]

# --- Onderhoud: wat hangt er wél, maar is nergens gekoppeld ------------------
# De keerzijde van aanwijzen in plaats van zoeken: een nieuwe sensor verschijnt
# niet vanzelf op een kamer. `sensor.kamers_niet_gekoppeld` loopt daarom één
# keer per uur de areas af (packages/9 - Other/Kamers.yaml). Op de pagina een
# klein paneel met het aantal per kamer; de lijst zelf staat in een pop-up.
kamer_onderhoud:
  template: sv_paneel
  entity: sensor.kamers_niet_gekoppeld
  triggers_update:
    - sensor.kamers_niet_gekoppeld
  custom_fields:
    x: |
      [[[
        var S = window.svKit && window.svKit(states);
        if(!S) return '';
        var s = states['sensor.kamers_niet_gekoppeld'];
        if(!s) return S.kop('ONDERHOUD', S.pil('warn', 'geen data'))
          + S.tekst('sensor.kamers_niet_gekoppeld bestaat nog niet.');
        var L = (s.attributes && s.attributes.sensoren) || [];
        if(!L.length) return S.kop('ONDERHOUD', S.pil('ok', 'alles gekoppeld'))
          + S.tekst('Elke meetsensor in een ruimte van deze pagina levert er ook een waarde voor.');
        var per = {};
        L.forEach(function(x){ var n = String(x.kamer || '?'); per[n] = (per[n] || 0) + 1; });
        return S.kop('ONDERHOUD', S.pil(null, L.length + ' niet gekoppeld'), {klik: '#kamers-onderhoud'})
          + S.rijen(Object.keys(per).sort().map(function(n){
              return {klik: '#kamers-onderhoud', naam: S.esc(n), waarde: S.nl(per[n])};
            }), 2, 0)
          + S.voet('Sensoren die in een ruimte hangen maar nergens zijn aangewezen. Tik voor de lijst.');
      ]]]

# --- De lijst in de pop-up ---------------------------------------------------
kamer_onderhoud_lijst:
  template: sv_paneel
  entity: sensor.kamers_niet_gekoppeld
  custom_fields:
    x: |
      [[[
        var S = window.svKit && window.svKit(states);
        if(!S) return '';
        var s = states['sensor.kamers_niet_gekoppeld'];
        var L = s && s.attributes ? (s.attributes.sensoren || []) : [];
        if(!L.length) return S.kop('NIET GEKOPPELD', S.pil('ok', 'alles gekoppeld'))
          + S.tekst('Alle meetsensoren zijn gekoppeld.');
        var per = {};
        L.forEach(function(x){ var n = String(x.kamer || '?'); (per[n] = per[n] || []).push(x); });
        return S.kop('NIET GEKOPPELD', S.pil(null, L.length + ' sensor' + (L.length > 1 ? 'en' : '')))
          + S.tekst('Deze hangen in een ruimte van dit overzicht maar leveren er geen waarde voor. '
            + 'Bewust? Zet ze in <code>negeer</code>. Anders in <code>klimaat</code> of <code>voorkeur</code>, '
            + 'in <code>custom_templates/kamers.jinja</code>.')
          + Object.keys(per).sort().map(function(n){
              var lijst = per[n].slice().sort(function(a, b){ return String(a.id) < String(b.id) ? -1 : 1; });
              return S.subkop(S.esc(n).toUpperCase(), S.nl(lijst.length))
                + S.rijen(lijst.map(function(x){
                    return {klik: x.id, naam: S.esc(x.naam || x.id || '?'),
                      waarde: '<span style="font-family:monospace;font-size:11px;font-weight:400;color:var(--ov-ink-35)">' + S.esc(x.id || '') + '</span>'};
                  }), 1, 0);
            }).join('');
      ]]]

# --- Uitlegtabel in Server-stijl ---------------------------------------------
# Voor de Omvormer-pagina (dashboards/home/omvormer.yaml): ruim vijftig ruwe
# Solarman-waarden in panelen. Eén button-card per groep en niet één per regel -
# honderd kaarten die elk om de vijf seconden hertekenen merk je op een
# wandpaneel. Was tot 7 november 2026 `ov_uitlegtabel` (één kolom, eigen
# opmaak); nu een paneel (sv_paneel) met regels uit www/sv-kit.js, standaard in
# twee kolommen, en rechtsboven een badge: `in orde`, of hoeveel waarden weg
# (unavailable) of onleesbaar zijn.
#
# `variables.rijen` is een lijst van:
#   e    entity_id, of een LIJST entity_id's (bijv. L1/L2/L3): die komen dan
#        als "2 · 4 · 1 W" op één regel, met de eenheid één keer achteraan
#   n    naam op de regel
#   a    optioneel: toon dit attribuut in plaats van de state
#   s    optioneel: vermenigvuldig met dit getal (Wh -> kWh = 0.001)
#   eh   optioneel: eenheid die de sensor-eenheid vervangt
#   d    optioneel: maximaal aantal decimalen (standaard 1)
#   min  optioneel: minimaal aantal decimalen (50,00 Hz i.p.v. 50 Hz)
#   m    optioneel: vertaaltabel voor tekststanden, {charging: laden}
#   tag  optioneel: kort label achter de naam voor een valkuil ("teken
#        omgekeerd", "niet het huis"); `tk` kiest de kleur (warn|info|bad)
# `variables.titel`: kop van het paneel; `variables.kolommen`: 1 of 2.
# Bestaat GEEN ENKELE entiteit uit de tabel meer (een integratie die eruit is
# gehaald), dan klapt het hele paneel dicht in plaats van rijen "bestaat niet".
#
# De instantie moet zelf `triggers_update` zetten met dezelfde entiteiten:
# zonder `entity` hertekent button-card anders nooit, en `all` zou hem bij elke
# statuswissel van het hele huis laten rekenen.
#
# Een regel aanklikken opent more-info (met historie) van de eerste entiteit
# op die regel. Tekst uit een state gaat door S.esc() (een select of
# foutmelding van de omvormer kan alles bevatten).
sv_uitlegtabel:
  template: sv_paneel
  variables:
    rijen: []
    titel: ""
    kolommen: 2
  styles:
    card:
      - display: |
          [[[
            var er = (variables.rijen || []).some(function(r){
              return (Array.isArray(r.e) ? r.e : [r.e]).some(function(id){ return !!states[id]; }); });
            return er ? 'block' : 'none';
          ]]]
      # Zie sv_html: zonder dit doen de onclicks per regel niets.
      - pointer-events: auto
  custom_fields:
    x: |
      [[[
        var S = window.svKit && window.svKit(states);
        if(!S) return '';
        var grijs = function(t){ return '<span style="color:var(--ov-ink-40);font-weight:400">' + t + '</span>'; };
        var weg = 0, fout = 0;
        // Eén waarde: {t: tekst, eh: eenheid} of {t: html} als er niets te rekenen valt.
        var een = function(r, id){
          var s = states[id];
          if(!s) return {t: grijs('bestaat niet')};
          var v = r.a ? (s.attributes || {})[r.a] : s.state;
          if(v === undefined || v === null || v === 'unknown' || v === '') return {t: grijs('—')};
          if(v === 'unavailable') { weg++; return {t: '<span style="color:var(--ov-bad)">weg</span>'}; }
          if(!r.a && id.indexOf('binary_sensor.') === 0) return {t: v === 'on' ? 'aan' : 'uit'};
          var n = Number(v);
          if(typeof v !== 'boolean' && !isNaN(n)){
            var eh0 = (s.attributes || {}).unit_of_measurement;
            // Leesfouten van ha-solarman (21-9 in de historie gevonden): een
            // negatief vermogen dat zonder teken binnenkomt (65.286 = -250 W),
            // en af en toe onzin in de miljarden. Alleen voor watts; de
            // omvormer kan er 20.000 aan.
            if(!r.a && eh0 === 'W'){
              if(n >= 32768 && n < 65536) n = n - 65536;
              if(Math.abs(n) > 100000) { fout++; return {t: grijs('leesfout')}; }
            }
            // Frequentie 0 terwijl er spanning staat is ook een leesfout.
            if(!r.a && eh0 === 'Hz' && n < 40) return {t: grijs('—')};
            if(r.s) n = n * r.s;
            return {
              t: n.toLocaleString('nl-NL', {minimumFractionDigits: r.min || 0,
                                            maximumFractionDigits: Math.max(r.d !== undefined ? r.d : 1, r.min || 0)}),
              eh: S.esc((r.eh !== undefined) ? r.eh : (r.a ? '' : (eh0 || '')))
            };
          }
          v = String(v);
          return {t: (r.m && r.m[v] !== undefined) ? r.m[v] : S.esc(v)};
        };
        var waarde = function(r){
          var ids = Array.isArray(r.e) ? r.e : [r.e];
          var w = ids.map(function(id){ return een(r, id); });
          // Eén eenheid achteraan als ze allemaal gelijk zijn (230 · 231 · 229 V),
          // anders elk zijn eigen (52,4 V · -2,6 A).
          var ehs = w.map(function(x){ return x.eh || ''; }).filter(function(x){ return x; });
          var gelijk = ehs.every(function(x){ return x === ehs[0]; });
          if(gelijk) return w.map(function(x){ return x.t; }).join(grijs(' · ')) + (ehs.length ? ' ' + ehs[0] : '');
          return w.map(function(x){ return x.t + (x.eh ? ' ' + x.eh : ''); }).join(grijs(' · '));
        };
        var lijst = (variables.rijen || []).map(function(r){
          var eerste = Array.isArray(r.e) ? r.e[0] : r.e;
          var tag = r.tag ? ' <span style="font-size:10px;font-weight:600;padding:1px 6px;margin-left:2px;border-radius:10px;white-space:nowrap;'
            + 'color:var(--ov-' + (r.tk || 'warn') + ');background:var(--ov-' + (r.tk || 'warn') + '-12)">' + r.tag + '</span>' : '';
          return {klik: eerste, naam: r.n + tag, waarde: waarde(r)};
        });
        var problemen = [];
        if(weg) problemen.push({k: 'bad', t: weg + ' weg'});
        if(fout) problemen.push({k: 'warn', t: fout + ' leesfout' + (fout > 1 ? 'en' : '')});
        return S.kop(variables.titel || '', S.oordeel(problemen))
          + S.rijen(lijst, variables.kolommen || 2, 0);
      ]]]

# =============================================================================
# SERVER-STIJL (7 november 2026) - zie docs/dashboard-stijl.md
# =============================================================================
# `sv_html`   een button-card die alleen HTML tekent (custom field `x`), zonder
#             eigen achtergrond: voor binnen een paneel (custom:mod-card met
#             de paneelstijl) naast bv. een apexcharts-grafiek.
# `sv_paneel` hetzelfde, maar de kaart IS het paneel (achtergrond, rand,
#             ronde hoeken): voor panelen die alleen uit HTML bestaan.
# De HTML komt uit window.svKit (www/sv-kit.js). Zet in de kaart zelf:
#   custom_fields:
#     x: |
#       [[[ var S = window.svKit && window.svKit(states); if(!S) return '';
#           return S.kop('TITEL', S.pil('ok', 'in orde')) + ...; ]]]
#
# pointer-events: auto MOET blijven: met tap_action none zet button-card
# `pointer-events: none` op de kaart en doet geen enkele onclick in de HTML
# nog iets (tests/test_button_card_klikbaar.py).
sv_html:
  show_icon: false
  show_name: false
  show_state: false
  tap_action:
    action: none
  hold_action:
    action: none
  styles:
    card:
      - pointer-events: auto
      - background: none
      - border: none
      - box-shadow: none
      - padding: 0 2px 4px 2px
    grid:
      - grid-template-areas: '"x"'
      - grid-template-columns: minmax(0, 1fr)
    custom_fields:
      x:
        - justify-self: stretch
        - text-align: left
        - min-width: "0"
        - white-space: normal

sv_paneel:
  template: sv_html
  styles:
    card:
      - pointer-events: auto
      - background: var(--ov-panel-bg)
      - border: 1px solid var(--ov-ink-6)
      - border-radius: 16px
      - box-shadow: none
      - padding: 12px 16px
