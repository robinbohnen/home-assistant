# Button-card templates for the "Overzicht" wall dashboard.
# Included at the Lovelace root via ui-lovelace.yaml (button_card_templates).
#
# De naam is historisch: dit is de enige plek waar button-card-templates
# geladen worden, dus de kamertegels onderaan (dashboards/home/kamers.yaml)
# staan hier ook. Templates met voorvoegsel `ov_` horen bij Overzicht,
# `kamer_` bij de Kamers-weergave.

# --- Person row: avatar initial, name, status, battery -----------------------
ov_person:
  show_icon: false
  show_name: false
  show_state: false
  variables:
    battery: sensor.none
    travel: sensor.none
  tap_action:
    action: more-info
  styles:
    grid:
      - grid-template-areas: '"av info bat"'
      - grid-template-columns: 34px 1fr auto
      - align-items: center
      - column-gap: 11px
    card:
      - background: none
      - border: none
      - box-shadow: none
      - padding: 8px 2px
    custom_fields:
      av:
        - grid-area: av
      info:
        - grid-area: info
        - justify-self: start
      bat:
        - grid-area: bat
        - justify-self: end
  custom_fields:
    av: |
      [[[
        var n = entity && entity.attributes.friendly_name ? entity.attributes.friendly_name : '?';
        var home = entity && entity.state === 'home';
        // Foto uit de person-entiteit; thuis/afwezig zit in de ringkleur en
        // (net als vroeger) in de tekst ernaast. Afwezig wordt de foto iets
        // gedimd, zodat je op afstand ziet wie er is zonder te lezen.
        var pic = entity && entity.attributes.entity_picture ? entity.attributes.entity_picture : null;
        var ring = home ? 'rgba(74,222,128,0.75)' : 'rgba(255,255,255,0.18)';
        if(pic){
          return `<div style="width:34px;height:34px;border-radius:50%;border:2px solid ${ring};box-sizing:border-box;background-image:url('${pic}');background-size:cover;background-position:center;${home ? '' : 'filter:grayscale(0.7);opacity:0.7'}"></div>`;
        }
        var bg = home ? 'rgba(52,168,120,0.16)' : 'rgba(255,255,255,0.06)';
        var col = home ? '#4ade80' : 'rgba(255,255,255,0.55)';
        return `<div style="width:34px;height:34px;border-radius:50%;background:${bg};color:${col};display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;">${n.charAt(0)}</div>`;
      ]]]
    info: |
      [[[
        var fn = entity && entity.attributes.friendly_name ? entity.attributes.friendly_name.split(' ')[0] : '?';
        var home = entity && entity.state === 'home';
        var st = home ? 'thuis' : 'afwezig';
        var kleur = 'rgba(255,255,255,0.52)';
        if(!home) {
          // Reistijd naar huis, als de routesensor een bruikbare waarde heeft.
          var r = states[variables.travel];
          if(r && !isNaN(Number(r.state)) && Number(r.state) > 0) {
            st = 'onderweg · ' + Math.round(Number(r.state)) + ' min';
            kleur = '#38bdf8';
          }
        }
        return `<span style="display:flex;align-items:baseline;gap:9px"><span style="font-size:15px;font-weight:600;color:white">${fn}</span><span style="font-size:13px;color:${kleur}">${st}</span></span>`;
      ]]]
    bat: |
      [[[
        var b = states[variables.battery];
        if(!b || isNaN(Number(b.state))) return '';
        var v = Math.round(Number(b.state));
        var c = v <= 10 ? '#ef4444' : (v <= 20 ? '#f59e0b' : 'white');
        return `<span style="font-size:15px;font-weight:600;color:${c}">${v}%</span>`;
      ]]]

# --- Room row: name, "x lampen aan"/"alles uit", on-dot --------------------
ov_room:
  show_icon: false
  show_name: true
  variables:
    lights: []
    temp: sensor.none
  styles:
    grid:
      - grid-template-areas: '"n sum dot"'
      - grid-template-columns: auto 1fr auto
      - align-items: center
      - column-gap: 10px
    card:
      - background: none
      - border: none
      - box-shadow: none
      - padding: 9px 2px
    name:
      - grid-area: n
      - justify-self: start
      - font-size: 14.5px
      - font-weight: "500"
      - color: white
    custom_fields:
      sum:
        - grid-area: sum
        - justify-self: end
        - font-size: 13px
      dot:
        - grid-area: dot
        - justify-self: end
  custom_fields:
    sum: |
      [[[
        var ls = variables.lights || [];
        var on = ls.filter(e => states[e] && states[e].state === 'on').length;
        var lamp = on === 0
          ? `<span style="color:rgba(255,255,255,0.60)">alles uit</span>`
          : `<span style="color:rgba(255,255,255,0.72)">${on} ${on===1?'lamp':'lampen'} aan</span>`;
        // temp mag één entiteit zijn of een lijstje; de eerste met een bruikbaar
        // getal wint. Klimaatentiteiten leveren hem via current_temperature.
        var bronnen = variables.temp;
        if(typeof bronnen === 'string') bronnen = [bronnen];
        var g = null;
        (bronnen || []).some(function(id){
          var e = states[id];
          if(!e) return false;
          if(!isNaN(Number(e.state))) { g = Number(e.state); return true; }
          var a = e.attributes ? e.attributes.current_temperature : null;
          if(a != null && !isNaN(Number(a))) { g = Number(a); return true; }
          return false;
        });
        if(g === null) return lamp;
        // Alleen kleuren bij uitschieters; anders blijft het rustig.
        var kleur = g < 17 ? '#38bdf8' : (g > 25 ? '#f59e0b' : 'rgba(255,255,255,0.85)');
        var graden = `<span style="color:${kleur};font-weight:600">${g.toFixed(1).replace('.',',')}°</span>`;
        return `<span style="display:inline-flex;align-items:baseline;gap:8px">${graden}<span style="color:rgba(255,255,255,0.2)">·</span>${lamp}</span>`;
      ]]]
    dot: |
      [[[
        var ls = variables.lights || [];
        var on = ls.filter(e => states[e] && states[e].state === 'on').length;
        var c = on > 0 ? '#3b82f6' : 'rgba(255,255,255,0.14)';
        return `<div style="width:9px;height:9px;border-radius:50%;background:${c}"></div>`;
      ]]]

# --- Power consumer bar row -------------------------------------------------
ov_bar:
  show_name: true
  show_state: false
  show_icon: false
  variables:
    max: 4000
  tap_action:
    action: more-info
  styles:
    grid:
      - grid-template-areas: '"n bar val"'
      - grid-template-columns: 205px 1fr 72px
      - align-items: center
      - column-gap: 14px
    card:
      - background: none
      - border: none
      - box-shadow: none
      - padding: 7px 2px
    name:
      - grid-area: n
      - justify-self: start
      - font-size: 14px
      - color: rgba(255,255,255,0.85)
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
    custom_fields:
      bar:
        - grid-area: bar
      val:
        - grid-area: val
        - justify-self: end
  custom_fields:
    bar: |
      [[[
        var v = entity && !isNaN(Number(entity.state)) ? Number(entity.state) : 0;
        var m;
        if(variables.scale === 'auto') {
          // Schaal op de zwaarste verbruiker van dit moment, anders zijn alle
          // balkjes even kort zodra er niets groots aan staat. Dezelfde
          // uitsluitingen als de auto-entities-filter, zodat zon/omvormer
          // de schaal niet kapen.
          var skip = /inverter|zonnepanel|zonneplan|slimhuys|goodwe|mvormer|solar/i;
          m = 0;
          Object.keys(states).forEach(function(k){
            if(k.lastIndexOf('sensor.', 0) !== 0) return;
            var s = states[k];
            var fn = s && s.attributes ? s.attributes.friendly_name : null;
            if(!fn || !/vermogen/i.test(fn) || skip.test(fn)) return;
            var n = Number(s.state);
            if(!isNaN(n) && n > m) m = n;
          });
          m = Math.max(m, 10);
        } else {
          m = variables.max || 1000;
        }
        var pct = Math.max(2, Math.min(100, v / m * 100));
        return `<div style="width:100%;height:6px;background:rgba(255,255,255,0.07);border-radius:3px;overflow:hidden"><div style="width:${pct}%;height:100%;background:#3b82f6;border-radius:3px"></div></div>`;
      ]]]
    val: |
      [[[
        var v = entity && !isNaN(Number(entity.state)) ? Math.round(Number(entity.state)) : 0;
        return `<span style="font-size:14px;font-weight:600;color:white">${v} W</span>`;
      ]]]

# --- Climate row: name, temp/doel, action badge ----------------------------
ov_climate:
  show_name: true
  show_icon: false
  show_state: false
  tap_action:
    action: more-info
  styles:
    grid:
      - grid-template-areas: '"n badge" "sub badge"'
      - grid-template-columns: 1fr auto
      - align-items: center
      - column-gap: 10px
    card:
      - background: none
      - border: none
      - box-shadow: none
      - padding: 11px 2px
    name:
      - grid-area: n
      - justify-self: start
      - font-size: 14.5px
      - font-weight: "600"
      - color: white
    custom_fields:
      sub:
        - grid-area: sub
        - justify-self: start
        - font-size: 12.5px
        - color: rgba(255,255,255,0.58)
        - padding-top: 2px
      badge:
        - grid-area: badge
        - justify-self: end
  custom_fields:
    sub: |
      [[[
        var cur = entity.attributes.current_temperature;
        var tgt = entity.attributes.temperature;
        var off = entity.state === 'off' || entity.state === 'unavailable';
        if(cur != null) {
          var s = Number(cur).toFixed(1).replace('.',',') + '°';
          if(!off && tgt != null) s += ' · doel ' + Number(tgt).toFixed(1).replace('.',',') + '°';
          return s;
        }
        return off ? (entity.state === 'unavailable' ? 'niet beschikbaar' : 'uit') : (entity.state || '');
      ]]]
    badge: |
      [[[
        // Geen badge als de airco offline is; de subregel meldt dat al.
        if(!entity || entity.state === 'unavailable' || entity.state === 'unknown') return '';
        var blauw = ['#38bdf8','rgba(56,189,248,0.15)'];
        var oranje = ['#f59e0b','rgba(245,158,11,0.15)'];
        var grijs = ['rgba(255,255,255,0.6)','rgba(255,255,255,0.08)'];
        var uit = ['rgba(255,255,255,0.5)','rgba(255,255,255,0.06)'];
        // hvac_action = wat hij nu doet, state = de ingestelde stand.
        // Niet elke airco levert hvac_action, dus beide moeten vertaald worden.
        var map = {cooling:['koelen'].concat(blauw),
                   heating:['verwarmt'].concat(oranje),
                   drying:['ontvochtigt'].concat(blauw),
                   fan:['ventileert'].concat(grijs),
                   preheating:['voorverwarmt'].concat(oranje),
                   defrosting:['ontdooit'].concat(oranje),
                   idle:['idle'].concat(grijs),
                   off:['uit'].concat(uit),
                   cool:['koelen'].concat(blauw),
                   heat:['verwarmen'].concat(oranje),
                   dry:['ontvochtigen'].concat(blauw),
                   fan_only:['ventileren'].concat(grijs),
                   heat_cool:['automatisch'].concat(grijs),
                   auto:['automatisch'].concat(grijs)};
        var m = map[entity.attributes.hvac_action] || map[entity.state];
        if(!m) m = [String(entity.state).replace(/_/g,' ')].concat(grijs);
        return `<span style="font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;color:${m[1]};background:${m[2]}">${m[0]}</span>`;
      ]]]

# --- Aan/uit-schakelaar: icoon, naam, subregel en een aan/uit-badge --------
# Tikken schakelt meteen, vasthouden geeft more-info. Bewust `toggle` en niet
# turn_on/turn_off: dit is een knop die de stand omklapt, en de badge laat
# zien welke kant je op gaat.
#
# Werkt voor elk domein met een aan/uit-stand (switch, input_boolean, light).
# `variables.sub` is optioneel; laat je hem leeg, dan valt de subregel weg.
ov_toggle:
  show_name: true
  show_icon: false
  show_state: false
  tap_action:
    action: toggle
  hold_action:
    action: more-info
  variables:
    mdi: mdi:toggle-switch
    sub: ""
    aan_kleur: "#4ade80"
  styles:
    grid:
      - grid-template-areas: '"ic n badge" "ic sub badge"'
      - grid-template-columns: 34px 1fr auto
      - align-items: center
      - column-gap: 12px
    card:
      - background: none
      - border: none
      - box-shadow: none
      - padding: 11px 2px
    name:
      - grid-area: n
      - justify-self: start
      - font-size: 14.5px
      - font-weight: "600"
      - color: white
    custom_fields:
      ic:
        - grid-area: ic
      sub:
        - grid-area: sub
        - justify-self: start
        - font-size: 12.5px
        - color: rgba(255,255,255,0.58)
        - padding-top: 2px
      badge:
        - grid-area: badge
        - justify-self: end
  custom_fields:
    ic: |
      [[[
        var aan = entity && entity.state === 'on';
        var weg = !entity || ['unavailable','unknown'].indexOf(entity.state) !== -1;
        var col = weg ? 'rgba(255,255,255,0.25)'
                      : (aan ? variables.aan_kleur : 'rgba(255,255,255,0.35)');
        return `<ha-icon icon="${variables.mdi}" style="--mdc-icon-size:22px;color:${col}"></ha-icon>`;
      ]]]
    sub: |
      [[[ return variables.sub || ''; ]]]
    badge: |
      [[[
        // Een weggevallen schakelaar krijgt bewust geen "uit"-badge: dan lijkt
        // hij bediend terwijl er niets te bedienen valt.
        if(!entity || ['unavailable','unknown'].indexOf(entity.state) !== -1)
          return `<span style="font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.06)">geen verbinding</span>`;
        var aan = entity.state === 'on';
        var kleur = aan ? variables.aan_kleur : 'rgba(255,255,255,0.5)';
        var vlak = aan ? 'rgba(74,222,128,0.15)' : 'rgba(255,255,255,0.06)';
        return `<span style="font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;color:${kleur};background:${vlak}">${aan ? 'aan' : 'uit'}</span>`;
      ]]]

# --- Vandaag / list row: icon, title, subtitle -----------------------------
ov_listrow:
  show_icon: false
  show_name: false
  variables:
    title: ""
    mdi: mdi:information
    kleur: rgba(255,255,255,0.6)
  styles:
    grid:
      - grid-template-areas: '"ic t" "ic s"'
      - grid-template-columns: 40px 1fr
      - align-items: center
      - column-gap: 14px
    card:
      - background: none
      - border: none
      - box-shadow: none
      - padding: 10px 2px
    custom_fields:
      ic:
        - grid-area: ic
      t:
        - grid-area: t
        - justify-self: start
        - font-size: 14.5px
        - font-weight: "600"
        - color: white
      s:
        - grid-area: s
        - justify-self: start
        - font-size: 12.5px
        - color: rgba(255,255,255,0.58)
  custom_fields:
    ic: |
      [[[
        return `<ha-icon icon="${variables.mdi}" style="--mdc-icon-size:22px;color:${variables.kleur}"></ha-icon>`;
      ]]]
    t: |
      [[[ return variables.title; ]]]

# --- Panel title (uppercase label, optional right badge) -------------------
ov_title:
  show_name: false
  show_icon: false
  variables:
    title: ""
    badge: ""
  tap_action:
    action: none
  styles:
    grid:
      - grid-template-areas: '"t b"'
      - grid-template-columns: 1fr auto
      - align-items: center
    card:
      - background: none
      - border: none
      - box-shadow: none
      - padding: 2px 2px 10px 2px
    custom_fields:
      t:
        - grid-area: t
        - justify-self: start
        - font-size: 12px
        - font-weight: "700"
        - letter-spacing: 1.2px
        - color: rgba(255,255,255,0.55)
      b:
        - grid-area: b
        - justify-self: end
  custom_fields:
    t: |
      [[[ return variables.title; ]]]
    b: |
      [[[
        if(!variables.badge) return '';
        return `<span style="font-size:11.5px;font-weight:600;padding:3px 11px;border-radius:20px;color:#4ade80;background:rgba(52,168,120,0.15)">${variables.badge}</span>`;
      ]]]

# --- Header pill -----------------------------------------------------------
ov_pill:
  show_name: false
  show_icon: false
  styles:
    grid:
      - grid-template-areas: '"c"'
    card:
      - background: rgba(255,255,255,0.05)
      - border: 1px solid rgba(255,255,255,0.06)
      - border-radius: 20px
      - padding: 7px 14px
      - height: auto
      - width: max-content
      - overflow: visible
    custom_fields:
      c:
        - font-size: 13px
        - font-weight: "500"
        - white-space: nowrap
        - overflow: visible

# --- Gedeelde Sonos-speakerlijst -------------------------------------------
# Kaarten die media uitlezen of bedienen erven deze via `template: ov_sonos`,
# zodat de lijst op één plek staat. Volgorde bepaalt welke speaker wint als er
# meerdere tegelijk spelen (woonkamer is altijd de groepsmaster).
ov_sonos:
  variables:
    speakers:
      - media_player.woonkamer_sonos
      - media_player.keuken_sonos
      - media_player.overkapping_sonos
      - media_player.speelkamer_sonos
      - media_player.kantoor_sonos
      - media_player.badkamer_sonos
      - media_player.toilet_sonos
      - media_player.garage_sonos
      - media_player.slaapkamer_maxi_sonos
      - media_player.slaapkamer_mini_sonos

#############################################################################
## Kamers - tegelraster
#############################################################################
# Alle tegels lezen dezelfde entiteit, `sensor.kamers`, en zoeken daarin hun
# eigen kamer op via `variables.slug`. Dat is geen omweg maar de reden dat het
# werkt: een button-card rendert alleen opnieuw als zijn `entity` verandert, en
# zo ververst het hele raster in één keer. Zie packages/9 - Other/Kamers.yaml.
#
# De kaarten bevatten geen enkele drempel; groen/oranje/rood komt kant en klaar
# uit custom_templates/kamers.jinja. Wil je de grenzen bijstellen, dan is dit
# niet het bestand dat je zoekt.

# --- Gedeelde kleuren en tekst ---------------------------------------------
# button-card kent geen JS-includes, dus de kleurentabel staat in elk veld dat
# hem nodig heeft opnieuw. Verander je er één, verander ze dan allemaal:
#   goed #4ade80 · let op #f59e0b · slecht #ef4444 · geen meting wit op 32%

# --- Kamertegel -------------------------------------------------------------
# Eén sjabloon, twee maten. Een kamer met een aangewezen sensor krijgt de volle
# tegel: temperatuur groot, de overige metingen klein eronder, en een voetregel
# met beweging en contacten. Een kamer waar niets is aangewezen (`gekoppeld`
# is 0) krijgt een platte regel van twee tekstregels hoog, met beweging en
# contacten rechts in plaats van in een eigen voetregel.
#
# WAT HIER OP 2026-08-03 UIT IS GEHAALD, EN WAAROM
# Elke tegel had een strip van vier vaste kolommen (RV, CO2, PM2.5, licht),
# met een streepje in de vakjes zonder meting. De redenering was dat zo'n leeg
# vakje informatie is: daar hangt geen sensor. Dat klopt bij één ontbrekende
# meting, maar in dit huis meet precies één kamer CO2 en meet er geen enkele
# licht - dus stonden er over de hele muur drie streepjes per tegel en één
# getal, en was een tegel 146 pixels hoog waar 94 volstaat. Wat er níét gemeten
# wordt staat nu op de plek waar je die vraag ook echt stelt: in de pop-up,
# waar `kamer_detail` per waarde de bron noemt, en in de onderhoudsregel
# onderaan de weergave.
#
# De slimme/volle keuze hangt aan `gekoppeld === 0` en bewust niet aan
# `aantal_metingen === 0`: een kamer met een aangewezen sensor die niets
# doorgeeft (lege batterij) hoort juist een volle tegel te houden, anders
# verdwijnt een storing in de kleine regels.
kamer_tegel:
  entity: sensor.kamers
  show_icon: false
  show_name: false
  show_state: false
  variables:
    slug: ""
  hold_action:
    action: more-info
  styles:
    card:
      - background: rgba(255,255,255,0.04)
      - border: 1px solid rgba(255,255,255,0.07)
      - border-radius: 16px
      - padding: 12px 15px 11px 15px
      - height: 100%
      # Smalle gekleurde rand links, zodat je van een meter afstand ziet welke
      # kamer eruit springt zonder de cijfers te lezen.
      - box-shadow: |
          [[[
            var L = (states['sensor.kamers'] && states['sensor.kamers'].attributes.kamers) || [];
            var k = L.find(function(x){ return x.slug === variables.slug; });
            var C = {'goed':'#4ade80','let op':'#f59e0b','slecht':'#ef4444'};
            var c = C[k ? k.status : ''] || 'rgba(255,255,255,0.10)';
            return 'inset 3px 0 0 ' + c;
          ]]]
    grid:
      # De voetrij staat er altijd in. Bij een platte tegel is hij leeg en
      # halen de stijlen hieronder zijn marge, padding en scheidingslijn weg,
      # zodat de rij op nul pixels uitkomt. Zou het gebied uit deze opsomming
      # verdwijnen, dan plaatst de browser dat lege blok alsnog in een eigen
      # impliciete rij - inclusief streep.
      - grid-template-areas: '"ic naam waarde" "ic sub waarde" "voet voet voet"'
      - grid-template-columns: |
          [[[
            var L = (states['sensor.kamers'] && states['sensor.kamers'].attributes.kamers) || [];
            var k = L.find(function(x){ return x.slug === variables.slug; });
            return (k && k.gekoppeld === 0) ? '34px 1fr auto' : '44px 1fr auto';
          ]]]
      - align-items: center
      - column-gap: 12px
    custom_fields:
      ic:
        - grid-area: ic
      naam:
        - grid-area: naam
        - justify-self: start
        - align-self: end
      sub:
        - grid-area: sub
        - justify-self: start
        - align-self: start
        - padding-top: 2px
        # Op een wandpaneel bestaat geen tooltip, dus een lange reden moet hier
        # netjes afbreken in plaats van de tegel op te rekken.
        - overflow: hidden
        - max-width: 100%
      waarde:
        - grid-area: waarde
        - justify-self: end
        - align-self: center
        - text-align: right
      voet:
        - grid-area: voet
        - width: 100%
        - margin-top: |
            [[[
              var L = (states['sensor.kamers'] && states['sensor.kamers'].attributes.kamers) || [];
              var k = L.find(function(x){ return x.slug === variables.slug; });
              return (k && k.gekoppeld === 0) ? '0' : '9px';
            ]]]
        - padding-top: |
            [[[
              var L = (states['sensor.kamers'] && states['sensor.kamers'].attributes.kamers) || [];
              var k = L.find(function(x){ return x.slug === variables.slug; });
              return (k && k.gekoppeld === 0) ? '0' : '8px';
            ]]]
        - border-top: |
            [[[
              var L = (states['sensor.kamers'] && states['sensor.kamers'].attributes.kamers) || [];
              var k = L.find(function(x){ return x.slug === variables.slug; });
              return (k && k.gekoppeld === 0) ? 'none' : '1px solid rgba(255,255,255,0.06)';
            ]]]
  custom_fields:
    ic: |
      [[[
        var L = (states['sensor.kamers'] && states['sensor.kamers'].attributes.kamers) || [];
        var k = L.find(function(x){ return x.slug === variables.slug; });
        if(!k) return '';
        var C = {'goed':['#4ade80','rgba(74,222,128,0.14)'],
                 'let op':['#f59e0b','rgba(245,158,11,0.14)'],
                 'slecht':['#ef4444','rgba(239,68,68,0.14)']};
        var c = C[k.status] || ['rgba(255,255,255,0.32)','rgba(255,255,255,0.05)'];
        // Platte tegel krijgt een kleiner vlak; icoon en ronding schalen mee,
        // zodat de twee maten dezelfde verhouding houden (52% en een derde).
        var vlak = k.gekoppeld === 0 ? 34 : 44;
        return `<div style="width:${vlak}px;height:${vlak}px;border-radius:${Math.round(vlak / 3)}px;background:${c[1]};display:flex;align-items:center;justify-content:center"><ha-icon icon="${k.icoon}" style="--mdc-icon-size:${Math.round(vlak * 0.52)}px;color:${c[0]}"></ha-icon></div>`;
      ]]]
    naam: |
      [[[
        var L = (states['sensor.kamers'] && states['sensor.kamers'].attributes.kamers) || [];
        var k = L.find(function(x){ return x.slug === variables.slug; });
        if(!k) return `<span style="font-size:15px;color:#ef4444">? ${variables.slug}</span>`;
        return `<span style="font-size:15.5px;font-weight:600;color:white">${k.naam}</span>`;
      ]]]
    sub: |
      [[[
        var L = (states['sensor.kamers'] && states['sensor.kamers'].attributes.kamers) || [];
        var k = L.find(function(x){ return x.slug === variables.slug; });
        if(!k) return '';
        var C = {'let op':'#f59e0b','slecht':'#ef4444'};
        var c = C[k.status] || 'rgba(255,255,255,0.50)';
        var t = k.reden || '';
        if(k.advies) t += ' · ' + k.advies;
        return `<span style="display:block;font-size:12.5px;color:${c};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t}</span>`;
      ]]]
    waarde: |
      [[[
        var L = (states['sensor.kamers'] && states['sensor.kamers'].attributes.kamers) || [];
        var k = L.find(function(x){ return x.slug === variables.slug; });
        if(!k) return '';
        var stil = 'rgba(255,255,255,0.20)';
        var grijs = 'rgba(255,255,255,0.45)';
        function ic(naam, kleur, maat){
          return `<ha-icon icon="${naam}" style="--mdc-icon-size:${maat}px;vertical-align:-3px;color:${kleur}"></ha-icon> `;
        }
        // Beweging en contacten in tekstvorm; de volle tegel zet ze naast
        // elkaar in de voetregel, de platte tegel onder elkaar hier rechts.
        var b = k.beweging || {};
        var bew;
        if(!b.gemeten) bew = ic('mdi:motion-sensor-off', stil, 13) + `<span style="color:${stil}">geen melder</span>`;
        else if(b.actief) bew = ic('mdi:motion-sensor', '#4ade80', 13) + `<span style="color:#4ade80">nu aanwezig</span>`;
        else {
          var mi = b.minuten;
          var t = mi === null ? 'onbekend'
                : (mi < 1 ? 'net nog'
                : (mi < 60 ? mi + ' min geleden'
                : (mi < 1440 ? Math.round(mi / 60) + ' uur geleden' : Math.round(mi / 1440) + ' dagen geleden')));
          bew = ic('mdi:motion-sensor', grijs, 13) + `<span style="color:${grijs}">${t}</span>`;
        }
        var ct = k.contacten || {};
        var con;
        if(!ct.gemeten) con = `<span style="color:${stil}">geen contact</span>`;
        else if(ct.open === 0) con = `<span style="color:${grijs}">alles dicht</span>`;
        else con = `<span style="color:#38bdf8">${ct.open} open</span> ` + ic('mdi:window-open-variant', '#38bdf8', 13);
        if(k.gekoppeld === 0){
          return `<div style="font-size:11.5px;line-height:1.55;white-space:nowrap">${bew}<br>${con}</div>`;
        }
        var t2 = (k.metingen || []).find(function(m){ return m.k === 'temp'; });
        var kop;
        if(!t2 || t2.w === null) kop = `<span style="font-size:17px;color:rgba(255,255,255,0.18)">–</span>`;
        else {
          // Alleen de uitschieters kleuren; anders is de hele muur bont.
          var c = t2.score >= 2 ? '#ef4444' : (t2.score === 1 ? '#f59e0b' : 'white');
          var v = t2.w.toFixed(1).replace('.', ',');
          kop = `<span style="font-size:24px;font-weight:600;letter-spacing:-0.5px;color:${c}${t2.oud ? ';opacity:0.45' : ''}">${v}<span style="font-size:15px;opacity:0.5">°</span></span>`;
        }
        // Alleen wat er écht gemeten wordt, in de volgorde waarin het ertoe
        // doet: lucht voor comfort. Zit er niets bij, dan blijft deze regel
        // helemaal weg in plaats van vier streepjes te tonen.
        var orde = ['co2', 'pm25', 'rv', 'lux'];
        var delen = orde.map(function(key){
          var m = (k.metingen || []).find(function(x){ return x.k === key; });
          if(!m || m.w === null) return '';
          var c2 = m.score >= 2 ? '#ef4444' : (m.score === 1 ? '#f59e0b' : 'rgba(255,255,255,0.72)');
          var v2, lab;
          if(key === 'rv'){ v2 = Math.round(m.w) + '%'; lab = 'RV'; }
          else if(key === 'co2'){ v2 = Math.round(m.w); lab = 'CO₂'; }
          else if(key === 'lux'){ v2 = Math.round(m.w); lab = 'lx'; }
          else { v2 = (Math.round(m.w * 10) / 10).toString().replace('.', ','); lab = 'PM2.5'; }
          return `<span style="color:${c2}${m.oud ? ';opacity:0.45' : ''}">${v2}</span><span style="color:rgba(255,255,255,0.34)"> ${lab}</span>`;
        }).filter(function(x){ return x !== ''; });
        var strip = delen.length
          ? `<div style="font-size:11.5px;margin-top:1px;white-space:nowrap">${delen.join('<span style="color:rgba(255,255,255,0.18)"> · </span>')}</div>`
          : '';
        return kop + strip;
      ]]]
    voet: |
      [[[
        var L = (states['sensor.kamers'] && states['sensor.kamers'].attributes.kamers) || [];
        var k = L.find(function(x){ return x.slug === variables.slug; });
        // Bij een platte tegel staan beweging en contacten al rechtsboven; de
        // stijlen hierboven vouwen deze rij dan tot nul pixels dicht.
        if(!k || k.gekoppeld === 0) return '';
        var stil = 'rgba(255,255,255,0.20)';
        var grijs = 'rgba(255,255,255,0.45)';
        function ic(naam, kleur){
          return `<ha-icon icon="${naam}" style="--mdc-icon-size:14px;vertical-align:-3px;color:${kleur}"></ha-icon> `;
        }
        var b = k.beweging || {};
        var links;
        if(!b.gemeten) links = ic('mdi:motion-sensor-off', stil) + `<span style="color:${stil}">geen melder</span>`;
        else if(b.actief) links = ic('mdi:motion-sensor', '#4ade80') + `<span style="color:#4ade80">nu aanwezig</span>`;
        else {
          var m = b.minuten;
          var t = m === null ? 'onbekend'
                : (m < 1 ? 'net nog'
                : (m < 60 ? m + ' min geleden'
                : (m < 1440 ? Math.round(m / 60) + ' uur geleden' : Math.round(m / 1440) + ' dagen geleden')));
          links = ic('mdi:motion-sensor', grijs) + `<span style="color:${grijs}">${t}</span>`;
        }
        var ct = k.contacten || {};
        var rechts;
        if(!ct.gemeten) rechts = `<span style="color:${stil}">geen contact</span>` + ' ' + ic('mdi:door-closed', stil);
        else if(ct.open === 0) rechts = `<span style="color:${grijs}">alles dicht</span>` + ' ' + ic('mdi:door-closed', grijs);
        else rechts = `<span style="color:#38bdf8">${ct.open} open</span>` + ' ' + ic('mdi:window-open-variant', '#38bdf8');
        return `<div style="display:grid;grid-template-columns:1fr auto;width:100%;font-size:12px"><div style="text-align:left">${links}</div><div style="text-align:right">${rechts}</div></div>`;
      ]]]

# --- Detailkaart in de pop-up ----------------------------------------------
# Vervangt sinds 2026-08-03 de markdown-kaart die hier stond. Reden is niet de
# opmaak maar de kosten: een markdown-kaart is een `render_template`-abonnement
# op de server, en met zeventien pop-ups in één weergave zijn dat zeventien
# abonnementen die állemaal opnieuw renderen zodra `sensor.kamers` verandert -
# elke minuut. Een button-card rekent in de browser en leest dezelfde entiteit
# die de tegels toch al lezen.
#
# Deze kaart is de enige plek waar je ziet WELKE entiteit een waarde geleverd
# heeft. Klopt een cijfer niet, dan hoort de juiste sensor als `klimaat` of
# `voorkeur` in de tabel in custom_templates/kamers.jinja.
kamer_detail:
  entity: sensor.kamers
  show_icon: false
  show_name: false
  show_state: false
  tap_action:
    action: none
  variables:
    slug: ""
  styles:
    card:
      - background: rgba(255,255,255,0.04)
      - border: 1px solid rgba(255,255,255,0.07)
      - border-radius: 16px
      - padding: 16px 18px
    grid:
      - grid-template-areas: '"kop" "bronnen"'
      # Zonder dit is de enige kolom `auto`, dus zo breed als zijn inhoud, en
      # dan is de `width: 100%` hieronder een cirkel: 100% van een kolom die
      # zich naar de inhoud voegt. De lange entity-id's liepen daardoor de kaart
      # uit in plaats van af te kappen.
      - grid-template-columns: minmax(0, 1fr)
      - row-gap: 10px
    custom_fields:
      kop:
        - grid-area: kop
        - justify-self: start
        - text-align: left
      bronnen:
        - grid-area: bronnen
        - justify-self: start
        - width: 100%
        - text-align: left
  custom_fields:
    kop: |
      [[[
        var L = (states['sensor.kamers'] && states['sensor.kamers'].attributes.kamers) || [];
        var k = L.find(function(x){ return x.slug === variables.slug; });
        if(!k) return `<span style="font-size:14px;color:#f59e0b">sensor.kamers heeft nog geen waarde</span>`;
        var C = {'goed':'#4ade80','let op':'#f59e0b','slecht':'#ef4444'};
        var c = C[k.status] || 'rgba(255,255,255,0.45)';
        var r = `<div style="font-size:16px;font-weight:600;color:${c}">${k.status} — ${k.reden}</div>`;
        if(k.advies) r += `<div style="font-size:13px;color:rgba(255,255,255,0.55);margin-top:3px">${k.advies}</div>`;
        return r;
      ]]]
    bronnen: |
      [[[
        var L = (states['sensor.kamers'] && states['sensor.kamers'].attributes.kamers) || [];
        var k = L.find(function(x){ return x.slug === variables.slug; });
        if(!k) return '';
        var m = (k.metingen || []).filter(function(x){ return x.w !== null; });
        if(!m.length){
          // Geen cijfer heeft twee heel verschillende oorzaken en die moeten
          // hier uit elkaar te houden zijn, anders ga je de verkeerde kant op
          // zoeken.
          var t = k.gekoppeld === 0
            ? 'Aan deze ruimte is geen sensor gekoppeld. Wijs er één aan bij <code>klimaat</code> in <code>custom_templates/kamers.jinja</code>.'
            : 'De aangewezen sensor geeft geen waarde door — batterij of verbinding.';
          return `<div style="font-size:13px;color:rgba(255,255,255,0.45);line-height:1.5">${t}</div>`;
        }
        var r = m.map(function(x){
          var C = {2:'#ef4444', 1:'#f59e0b'};
          var c = C[x.score] || 'rgba(255,255,255,0.88)';
          var v = (Math.round(x.w * 10) / 10).toString().replace('.', ',') + x.eenheid;
          return `<div style="display:grid;grid-template-columns:56px auto 1fr;align-items:baseline;column-gap:10px;padding:5px 0;border-top:1px solid rgba(255,255,255,0.05)">`
            + `<div style="font-size:10px;letter-spacing:0.6px;text-transform:uppercase;color:rgba(255,255,255,0.36)">${x.label}</div>`
            + `<div style="font-size:14px;font-weight:600;color:${c}${x.oud ? ';opacity:0.45' : ''}">${v}${x.oud ? ' ·&nbsp;oud' : ''}</div>`
            + `<div style="font-size:11px;color:rgba(255,255,255,0.30);font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right">${x.id}</div>`
            + `</div>`;
        }).join('');
        // De tegel toont sinds 2026-08-03 alleen de metingen die er zijn. Wat
        // er niet is, is daarmee niet onbelangrijk geworden - het staat hier,
        // op de plek waar je die vraag ook echt stelt. Zonder deze regel zou
        // "geen CO2 in de slaapkamer" nergens meer op het dashboard staan.
        var mist = (k.metingen || []).filter(function(x){ return x.w === null; })
                                     .map(function(x){ return x.label; });
        var staart = mist.length
          ? `<div style="font-size:11.5px;color:rgba(255,255,255,0.28);padding:7px 0 0 0;border-top:1px solid rgba(255,255,255,0.05)">niet gemeten: ${mist.join(', ')}</div>`
          : '';
        return `<div style="width:100%">${r}${staart}</div>`;
      ]]]

#############################################################################
## Kamers - onderhoud: wat hangt er wél, maar is nergens gekoppeld
#############################################################################
# De keerzijde van aanwijzen in plaats van zoeken: een nieuwe sensor verschijnt
# niet vanzelf op een tegel. `sensor.kamers_niet_gekoppeld` loopt daarom één
# keer per uur de areas af (zie packages/9 - Other/Kamers.yaml).
#
# Dat is onderhoud en geen overzicht, dus het staat onderaan de weergave als
# één regel die een pop-up opent. Uitgeklapt was het een blok van tien regels
# onder een muur die juist korter moest.
#
# Bewust button-card en geen markdown: een markdown-kaart is een
# `render_template`-abonnement op de server, en deze staat permanent (verborgen)
# in de weergave. Dezelfde afweging als bij `kamer_detail` hierboven.

# --- De regel die de pop-up opent ------------------------------------------
kamer_onderhoud_knop:
  entity: sensor.kamers_niet_gekoppeld
  show_icon: false
  show_name: false
  show_state: false
  styles:
    card:
      - background: rgba(255,255,255,0.03)
      - border: 1px solid rgba(255,255,255,0.06)
      - border-radius: 14px
      - padding: 11px 16px
    grid:
      - grid-template-areas: '"regel"'
      - grid-template-columns: minmax(0, 1fr)
    custom_fields:
      regel:
        - grid-area: regel
        - width: 100%
        - text-align: left
  custom_fields:
    regel: |
      [[[
        var s = states['sensor.kamers_niet_gekoppeld'];
        var n = s ? ((s.attributes.sensoren || []).length) : 0;
        var grijs = 'rgba(255,255,255,0.45)';
        function ic(naam, kleur){
          return `<ha-icon icon="${naam}" style="--mdc-icon-size:15px;vertical-align:-3px;color:${kleur}"></ha-icon> `;
        }
        if(!s) return `<span style="font-size:13px;color:#f59e0b">${ic('mdi:help-circle-outline','#f59e0b')}sensor.kamers_niet_gekoppeld bestaat nog niet</span>`;
        if(n === 0) return `<span style="font-size:13px;color:${grijs}">${ic('mdi:check', '#4ade80')}Alle meetsensoren zijn gekoppeld</span>`;
        return `<div style="display:grid;grid-template-columns:1fr auto;align-items:center;font-size:13px">`
          + `<div style="text-align:left;color:${grijs}">${ic('mdi:link-variant-off', grijs)}${n} sensor${n > 1 ? 'en' : ''} niet gekoppeld</div>`
          + `<div style="text-align:right;color:rgba(255,255,255,0.28)">bekijken ›</div></div>`;
      ]]]

# --- De lijst in de pop-up --------------------------------------------------
kamer_onderhoud_lijst:
  entity: sensor.kamers_niet_gekoppeld
  show_icon: false
  show_name: false
  show_state: false
  tap_action:
    action: none
  styles:
    card:
      - background: rgba(255,255,255,0.04)
      - border: 1px solid rgba(255,255,255,0.07)
      - border-radius: 16px
      - padding: 16px 18px
    grid:
      - grid-template-areas: '"uitleg" "lijst"'
      - grid-template-columns: minmax(0, 1fr)
      - row-gap: 10px
    custom_fields:
      uitleg:
        - grid-area: uitleg
        - width: 100%
        - text-align: left
      lijst:
        - grid-area: lijst
        - width: 100%
        - text-align: left
  custom_fields:
    uitleg: |
      [[[
        var s = states['sensor.kamers_niet_gekoppeld'];
        var L = s ? (s.attributes.sensoren || []) : [];
        if(!L.length) return `<div style="font-size:14px;color:#4ade80">Alle meetsensoren zijn gekoppeld.</div>`;
        return `<div style="font-size:13px;color:rgba(255,255,255,0.50);line-height:1.55">`
          + `Deze hangen in een ruimte van dit overzicht maar leveren er geen waarde voor. `
          + `Bewust? Zet ze in <code>negeer</code>. Anders in <code>klimaat</code> of <code>voorkeur</code>, `
          + `in <code>custom_templates/kamers.jinja</code>.</div>`;
      ]]]
    lijst: |
      [[[
        var s = states['sensor.kamers_niet_gekoppeld'];
        var L = s ? (s.attributes.sensoren || []) : [];
        if(!L.length) return '';
        var per = {};
        L.forEach(function(x){
          if(!per[x.kamer]) per[x.kamer] = [];
          per[x.kamer].push(x.id);
        });
        var r = Object.keys(per).sort().map(function(kamer){
          var ids = per[kamer].sort().map(function(id){
            return `<div style="font-family:monospace;font-size:11px;color:rgba(255,255,255,0.32);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${id}</div>`;
          }).join('');
          return `<div style="padding:8px 0;border-top:1px solid rgba(255,255,255,0.05)">`
            + `<div style="font-size:13px;font-weight:600;color:white;margin-bottom:3px">${kamer} <span style="font-weight:400;color:rgba(255,255,255,0.30)">· ${per[kamer].length}</span></div>`
            + `${ids}</div>`;
        }).join('');
        return `<div style="width:100%">${r}</div>`;
      ]]]
