# Kamers: hoe staat het ervoor in elke ruimte.
#
# Deze weergave tekent alleen. Alle drempels, kleuren en teksten komen uit
# `sensor.kamers`, dat gevuld wordt door custom_templates/kamers.jinja via
# packages/9 - Other/Kamers.yaml. Wil je weten waarom een tegel oranje is, kijk
# dan daar - hier staat geen enkel getal.
#
# Bewust een `sections`-weergave met native kolommen en zonder card-mod: de
# tegels brengen hun eigen achtergrond mee (button-card `styles`), dus als
# card-mod een keer niet laadt blijft dit gewoon leesbaar. Dat maakt hem ook
# bruikbaar op de Nest Hub, waar card-mod helemaal niet draait.
#
# Elke tegel opent een pop-up. Die begint met een markdown-kaart die WELKE
# entiteit elke waarde geleverd heeft laat zien - dat is de enige plek waar je
# ziet of de automatische koppeling de juiste sensor te pakken had. Daaronder
# staan lijsten van auto-entities op de area. Blijft dat leeg terwijl er wel
# sensoren hangen, dan klopt de area-naam niet.
#
# LET OP bij het bewerken van de filters: `device_class` is geen filtersleutel
# in auto-entities, die hoort onder `attributes:`. Met device_class op het
# hoogste niveau gaf elke pop-up drie keer "Configuratiefout".
type: sections
max_columns: 4
title: Kamers
path: kamers
icon: mdi:home-heart
dense_section_placement: true
sections:
  #############################################################################
  ## Samenvatting
  #############################################################################
  # Staat los boven de kolommen zodat je bij binnenkomst niet zeventien tegels
  # hoeft af te lezen om te zien of er iets aan de hand is.
  - type: grid
    column_span: 4
    cards:
      - type: custom:button-card
        template: kamer_samenvatting

  #############################################################################
  ## Begane grond
  #############################################################################
  - type: grid
    cards:
      - type: heading
        heading: Begane grond
        heading_style: title
        icon: mdi:home-floor-g
      - type: custom:button-card
        template: kamer_tegel
        variables:
          slug: woonkamer
        tap_action:
          action: navigate
          navigation_path: "#kamer-woonkamer"
      - type: custom:button-card
        template: kamer_tegel
        variables:
          slug: keuken
        tap_action:
          action: navigate
          navigation_path: "#kamer-keuken"
      - type: custom:button-card
        template: kamer_tegel
        variables:
          slug: entree
        tap_action:
          action: navigate
          navigation_path: "#kamer-entree"
      - type: custom:button-card
        template: kamer_tegel
        variables:
          slug: toilet
        tap_action:
          action: navigate
          navigation_path: "#kamer-toilet"
      - type: custom:button-card
        template: kamer_tegel
        variables:
          slug: speelkamer
        tap_action:
          action: navigate
          navigation_path: "#kamer-speelkamer"
      - type: custom:button-card
        template: kamer_tegel
        variables:
          slug: garage
        tap_action:
          action: navigate
          navigation_path: "#kamer-garage"
      - type: custom:button-card
        template: kamer_tegel
        variables:
          slug: meterkast
        tap_action:
          action: navigate
          navigation_path: "#kamer-meterkast"

  #############################################################################
  ## Eerste verdieping
  #############################################################################
  - type: grid
    cards:
      - type: heading
        heading: Eerste verdieping
        heading_style: title
        icon: mdi:home-floor-1
      - type: custom:button-card
        template: kamer_tegel
        variables:
          slug: slaapkamer
        tap_action:
          action: navigate
          navigation_path: "#kamer-slaapkamer"
      - type: custom:button-card
        template: kamer_tegel
        variables:
          slug: slaapkamer_logan
        tap_action:
          action: navigate
          navigation_path: "#kamer-slaapkamer_logan"
      - type: custom:button-card
        template: kamer_tegel
        variables:
          slug: badkamer
        tap_action:
          action: navigate
          navigation_path: "#kamer-badkamer"
      - type: custom:button-card
        template: kamer_tegel
        variables:
          slug: kantoor
        tap_action:
          action: navigate
          navigation_path: "#kamer-kantoor"
      - type: custom:button-card
        template: kamer_tegel
        variables:
          slug: overloop
        tap_action:
          action: navigate
          navigation_path: "#kamer-overloop"

  #############################################################################
  ## Tweede verdieping
  #############################################################################
  - type: grid
    cards:
      - type: heading
        heading: Tweede verdieping
        heading_style: title
        icon: mdi:home-floor-2
      - type: custom:button-card
        template: kamer_tegel
        variables:
          slug: slaapkamer_emma
        tap_action:
          action: navigate
          navigation_path: "#kamer-slaapkamer_emma"
      - type: custom:button-card
        template: kamer_tegel
        variables:
          slug: zolder
        tap_action:
          action: navigate
          navigation_path: "#kamer-zolder"

  #############################################################################
  ## Buiten
  #############################################################################
  - type: grid
    cards:
      - type: heading
        heading: Buiten
        heading_style: title
        icon: mdi:tree-outline
      - type: custom:button-card
        template: kamer_tegel
        variables:
          slug: schuur
        tap_action:
          action: navigate
          navigation_path: "#kamer-schuur"
      - type: custom:button-card
        template: kamer_tegel
        variables:
          slug: achtertuin
        tap_action:
          action: navigate
          navigation_path: "#kamer-achtertuin"
      - type: custom:button-card
        template: kamer_tegel
        variables:
          slug: voortuin
        tap_action:
          action: navigate
          navigation_path: "#kamer-voortuin"

  #############################################################################
  ## Pop-ups
  #############################################################################
  # Onzichtbaar tot je een tegel aantikt. De opmaak staat één keer bij de
  # eerste pop-up (&kamer_popup) en wordt door de rest hergebruikt; hetzelfde
  # blok als op Overzicht, maar YAML-ankers werken niet over bestanden heen.
  - type: grid
    column_span: 4
    cards:
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#kamer-woonkamer"
        name: Woonkamer
        icon: mdi:sofa-outline
        styles: &kamer_popup |
          .bubble-pop-up {
            background: rgba(13, 15, 20, 0.98) !important;
            backdrop-filter: blur(18px) !important;
            border: 1px solid rgba(255, 255, 255, 0.06) !important;
            --ha-card-background: rgba(30, 33, 42, 0.72);
            --card-background-color: rgba(30, 33, 42, 0.72);
            --ha-card-border-color: rgba(255, 255, 255, 0.07);
            --ha-card-border-width: 1px;
            --ha-card-border-radius: 16px;
            --primary-text-color: #ffffff;
            --secondary-text-color: rgba(255, 255, 255, 0.55);
          }
          .bubble-pop-up-background {
            backdrop-filter: blur(4px) !important;
            background: rgba(0, 0, 0, 0.5) !important;
          }
          .bubble-header {
            background: transparent !important;
          }
          .bubble-header .bubble-button-card-container,
          .bubble-button-card-container {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.06) !important;
            box-shadow: none !important;
          }
          .bubble-icon-container {
            background: rgba(255, 255, 255, 0.08) !important;
          }
          .bubble-icon {
            color: rgba(255, 255, 255, 0.9) !important;
          }
          .bubble-name,
          .bubble-header-name {
            color: #ffffff !important;
          }
          .bubble-close,
          .bubble-close-container {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.06) !important;
            box-shadow: none !important;
          }
          .bubble-close {
            color: rgba(255, 255, 255, 0.85) !important;
          }

        cards:
          # Kernkaart: werkt zonder custom cards en noemt per meting de bron.
          # Staat een tegel op een raar getal, dan zie je hier meteen welke
          # entiteit gewonnen heeft en hoort die in `voorkeur` of in
          # NEGEER_PATRONEN in kamers.jinja.
          - type: markdown
            content: |
              {% set K = state_attr('sensor.kamers', 'kamers') or [] %}
              {% set k = (K | selectattr('slug', 'eq', 'woonkamer') | list | first) | default(none) %}
              {% if k is none %}
              `sensor.kamers` heeft nog geen waarde.
              {% else %}
              ### {{ k.status }} — {{ k.reden }}
              {% if k.advies %}*{{ k.advies }}*{% endif %}

              {% for m in k.metingen %}{% if m.w is not none %}- **{{ m.label }}** {{ m.w }}{{ m.eenheid }}{% if m.oud %} · al uren niet bijgewerkt{% endif %}
                `{{ m.id }}`
              {% endif %}{% endfor %}

              {% if k.aantal_metingen == 0 %}
              Geen enkele meting gevonden in area **Woonkamer**. Klopt die naam?
              {% endif %}
              {% endif %}
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              title: Alle metingen in deze ruimte
            filter:
              include:
                - area: Woonkamer
                  domain: sensor
                  attributes:
                    device_class: temperature
                - area: Woonkamer
                  domain: sensor
                  attributes:
                    device_class: humidity
                - area: Woonkamer
                  domain: sensor
                  attributes:
                    device_class: carbon_dioxide
                - area: Woonkamer
                  domain: sensor
                  attributes:
                    device_class: pm25
                - area: Woonkamer
                  domain: sensor
                  attributes:
                    device_class: illuminance
            sort:
              method: friendly_name
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              title: Beweging, ramen en deuren
              state_color: true
            filter:
              include:
                - area: Woonkamer
                  domain: binary_sensor
                  attributes:
                    device_class: motion
                - area: Woonkamer
                  domain: binary_sensor
                  attributes:
                    device_class: occupancy
                - area: Woonkamer
                  domain: binary_sensor
                  attributes:
                    device_class: presence
                - area: Woonkamer
                  domain: binary_sensor
                  attributes:
                    device_class: door
                - area: Woonkamer
                  domain: binary_sensor
                  attributes:
                    device_class: window
                - area: Woonkamer
                  domain: binary_sensor
                  attributes:
                    device_class: opening
                - area: Woonkamer
                  domain: binary_sensor
                  attributes:
                    device_class: garage_door
            sort:
              method: friendly_name
          - type: custom:auto-entities
            show_empty: false
            card:
              type: history-graph
              hours_to_show: 24
            filter:
              include:
                - area: Woonkamer
                  domain: sensor
                  attributes:
                    device_class: temperature
                - area: Woonkamer
                  domain: sensor
                  attributes:
                    device_class: humidity
                - area: Woonkamer
                  domain: sensor
                  attributes:
                    device_class: carbon_dioxide
                - area: Woonkamer
                  domain: sensor
                  attributes:
                    device_class: pm25
            sort:
              method: friendly_name
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#kamer-keuken"
