  #############################################################################
  ## Onderhoud: wat hangt er wél, maar is niet gekoppeld
  #############################################################################
  # De keerzijde van een vaste koppeling is dat een nieuwe sensor niet vanzelf
  # verschijnt. Deze lijst is het tegengif: `sensor.kamers_niet_gekoppeld`
  # loopt één keer per uur de areas af en meldt elke meetsensor die nergens is
  # aangewezen. Staat hier iets dat er hoort, zet het dan bij `klimaat` of
  # `voorkeur` in custom_templates/kamers.jinja; staat er iets dat er nooit bij
  # hoort (koelkast, espressomachine), zet het dan in `negeer` bij die kamer.
  #
  # Sinds 2026-08-03 één regel met een pop-up erachter in plaats van een
  # uitgeklapte markdown-lijst: met negenenveertig entiteiten was dat het
  # langste blok van de pagina, terwijl je er hooguit een paar keer per jaar
  # iets mee doet. De inhoud staat in `kamer_onderhoud_lijst`; die rekent in de
  # browser en houdt dus geen `render_template`-abonnement op de server aan.
  - type: grid
    column_span: 3
    cards:
      - type: custom:button-card
        template: kamer_onderhoud_knop
        grid_options:
          columns: full
        tap_action:
          action: navigate
          navigation_path: "#kamers-onderhoud"
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#kamers-onderhoud"
        name: Niet gekoppelde sensoren
        icon: mdi:link-variant-off
        styles: *kamer_popup
        cards:
          - type: custom:button-card
            template: kamer_onderhoud_lijst
