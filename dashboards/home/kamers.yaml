# Kamers: hoe staat het ervoor in elke ruimte.
#
# Sinds 7 november 2026 in de Server-stijl (docs/dashboard-stijl.md): panelen
# in drie kolommen, per verdieping één paneel met een badge rechtsboven, en
# per kamer drie compacte regels. Past op één 1080p-scherm.
#
# OPBOUW
#   kolom 1  BEGANE GROND        (7 kamers)
#   kolom 2  EERSTE VERDIEPING   (5) en TWEEDE VERDIEPING (2)
#   kolom 3  BUITEN              (3) en ONDERHOUD (niet gekoppelde sensoren)
# Een kamer aantikken opent zijn pop-up (#kamer-<slug>, met `_` als `-`):
# reden en advies, elke meting met de entiteit die hem levert (aantikken =
# more-info met historie), beweging en ramen/deuren, wat er niet gemeten
# wordt, en een lijst van de bewegings- en contactsensoren in die area.
#
# DEZE WEERGAVE TEKENT ALLEEN. Alle drempels, kleuren en teksten komen uit
# `sensor.kamers`, gevuld door custom_templates/kamers.jinja via
# packages/9 - Other/Kamers.yaml. Wil je weten waarom een kamer oranje is,
# kijk dan daar - hier staat geen enkel getal. De kaarten zijn templates in
# dashboards/home/overzicht_templates.yaml (`kamer_verdieping`,
# `kamer_detail`, `kamer_onderhoud`, `kamer_onderhoud_lijst`).
#
# WELKE KAMER WAAR STAAT bepaalt `verdieping` in de KAMERS-tabel van
# kamers.jinja: het paneel toont elke kamer met die verdieping, in de volgorde
# van de tabel. Een nieuwe kamer verschijnt dus vanzelf; alleen zijn pop-up
# moet hieronder bij (kopieer er één en vervang slug, naam, icoon en area).
# tests/test_kamers_pagina.py faalt tegen een live states-dump als een kamer
# geen pop-up heeft.
#
# WAAROM GEEN SECTIONS EN GEEN TEGELS MEER. Tot 7 november 2026 was dit een
# sections-weergave met één button-card-tegel per kamer en bewust zonder
# card-mod, zodat hij ook op de Nest Hub zou werken. Hij wordt niet naar de Hub
# gecast (alleen `mini-dashboard`, zie Livingroom/Cast.yaml), en Robin koos
# voor één stijl over alle beheerpagina's. Wat van de tegels bleef: de kleur
# per status, alleen de metingen die er écht zijn, en de platte regel voor een
# kamer zonder sensor (geen temperatuur, de reden zegt waarom).
#
# POP-UPS ZONDER HISTORIE (sinds 2026-08-03). Een pop-up is verborgen, niet
# afwezig: zeventien history-graphs of apexcharts in deze weergave vuurden bij
# elk openen zeventien historie-queries af. De historie zit achter de
# meetregels in de pop-up (more-info), en op de Klimaat-weergave.
#
# LET OP bij het bewerken van de auto-entities-filters: `device_class` is geen
# filtersleutel, die hoort onder `attributes:`. Met device_class op het hoogste
# niveau gaf elke pop-up "Configuratiefout".
#
# Test: tests/test_kamers_pagina.py (de JS van de panelen in node) en
# tests/test_kamers.py (de jinja erachter).
title: Kamers
path: kamers
icon: mdi:home-heart
panel: true
background: "var(--primary-background-color)"
cards:
  - type: vertical-stack
    card_mod:
      style: |
        :host { height: 100% !important; }
        #root {
          /* Kleurtokens komen uit www/ov-tokens.js, zie overzicht.yaml. */
          --ov-panel-border: 1px solid var(--ov-ink-6);
          /* 0: na de kolommen volgen alleen de (verborgen) pop-ups; een gap
             zou onderaan ruimte maken en het scherm laten scrollen. */
          gap: 0 !important;
          min-height: calc(100vh - 8px) !important;
          margin: 0 !important;
          padding: 12px 16px !important;
          background: var(--primary-background-color) !important;
          box-sizing: border-box !important;
        }
    cards:
      - type: horizontal-stack
        card_mod:
          style: |
            #root {
              display: grid !important;
              grid-template-columns: 1fr 1fr 1fr !important;
              gap: 12px !important;
              align-items: start !important;
            }
            @media (max-width: 1500px) {
              #root { grid-template-columns: 1fr 1fr !important; }
            }
            @media (max-width: 1000px) {
              #root { grid-template-columns: 1fr !important; }
            }
        cards:
          # ===================== KOLOM 1: BEGANE GROND ======================
          - type: custom:button-card
            template: kamer_verdieping
            variables:
              kaart: begane_grond
              verdieping: Begane grond

          # ============ KOLOM 2: EERSTE EN TWEEDE VERDIEPING ===============
          # Samen in één kolom: de tweede verdieping is twee kamers groot en
          # zou als eigen kolom vooral witruimte zijn.
          - type: vertical-stack
            cards:
              - type: custom:button-card
                template: kamer_verdieping
                variables:
                  kaart: eerste_verdieping
                  verdieping: Eerste verdieping
              - type: custom:button-card
                template: kamer_verdieping
                variables:
                  kaart: tweede_verdieping
                  verdieping: Tweede verdieping

          # ===================== KOLOM 3: BUITEN, ONDERHOUD =================
          # Onderhoud: meetsensoren die in een ruimte hangen maar nergens zijn
          # aangewezen. Staat er iets dat er hoort, zet het dan bij `klimaat`
          # of `voorkeur` in custom_templates/kamers.jinja; hoort het er nooit
          # bij (koelkast, espressomachine), zet het dan in `negeer`.
          - type: vertical-stack
            cards:
              - type: custom:button-card
                template: kamer_verdieping
                variables:
                  kaart: buiten
                  verdieping: Buiten
              - type: custom:button-card
                template: kamer_onderhoud
                variables:
                  kaart: onderhoud

      # ============================ POP-UPS =================================
      # Onzichtbaar tot je een kamer aantikt. De opmaak staat één keer bij de
      # eerste pop-up (&kamer_popup, dezelfde als de pop-ups van server.yaml)
      # en wordt door de rest hergebruikt.
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#kamer-woonkamer"
        name: Woonkamer
        icon: mdi:sofa-outline
        styles: &kamer_popup |
          .bubble-pop-up, .bubble-pop-up-background {
            background: var(--ov-popup-bg, var(--primary-background-color)) !important;
          }
          .bubble-pop-up {
            border: 1px solid var(--ov-ink-6) !important;
            --ha-card-background: var(--ov-panel-bg);
            --card-background-color: var(--ov-panel-bg);
            --ha-card-border-color: var(--ov-ink-6);
            --ha-card-border-radius: 16px;
            --secondary-text-color: var(--ov-ink-55);
          }
          .bubble-header { background: transparent !important; }
          .bubble-header .bubble-button-card-container,
          .bubble-close, .bubble-close-container {
            background: var(--ov-ink-5) !important;
            border: 1px solid var(--ov-ink-6) !important;
            box-shadow: none !important;
          }
          .bubble-name, .bubble-header-name { color: var(--primary-text-color) !important; }
        cards:
          - type: custom:button-card
            template: kamer_detail
            variables:
              slug: woonkamer
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              title: Beweging, ramen en deuren
              state_color: true
            filter:
              include:
                - {area: Woonkamer, domain: binary_sensor, attributes: {device_class: motion}}
                - {area: Woonkamer, domain: binary_sensor, attributes: {device_class: occupancy}}
                - {area: Woonkamer, domain: binary_sensor, attributes: {device_class: presence}}
                - {area: Woonkamer, domain: binary_sensor, attributes: {device_class: door}}
                - {area: Woonkamer, domain: binary_sensor, attributes: {device_class: window}}
                - {area: Woonkamer, domain: binary_sensor, attributes: {device_class: opening}}
                - {area: Woonkamer, domain: binary_sensor, attributes: {device_class: garage_door}}
            sort:
              method: friendly_name
