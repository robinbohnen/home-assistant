      - type: custom:bubble-card
        card_type: pop-up
        hash: "#kamer-woonkamer"
        name: Woonkamer
        icon: mdi:sofa-outline
        styles: &kamer_popup |
          .bubble-pop-up {
            background: rgba(13, 15, 20, 0.98) !important;
            backdrop-filter: blur(18px) !important;
            border: 1px solid rgba(255, 255, 255, 0.06) !important;
            --ha-card-background: rgba(30, 33, 42, 0.72);
            --card-background-color: rgba(30, 33, 42, 0.72);
            --ha-card-border-color: rgba(255, 255, 255, 0.07);
            --ha-card-border-width: 1px;
            --ha-card-border-radius: 16px;
            --primary-text-color: #ffffff;
            --secondary-text-color: rgba(255, 255, 255, 0.55);
          }
          .bubble-pop-up-background {
            backdrop-filter: blur(4px) !important;
            background: rgba(0, 0, 0, 0.5) !important;
          }
          .bubble-header {
            background: transparent !important;
          }
          .bubble-header .bubble-button-card-container,
          .bubble-button-card-container {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.06) !important;
            box-shadow: none !important;
          }
          .bubble-icon-container {
            background: rgba(255, 255, 255, 0.08) !important;
          }
          .bubble-icon {
            color: rgba(255, 255, 255, 0.9) !important;
          }
          .bubble-name,
          .bubble-header-name {
            color: #ffffff !important;
          }
          .bubble-close,
          .bubble-close-container {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.06) !important;
            box-shadow: none !important;
          }
          .bubble-close {
            color: rgba(255, 255, 255, 0.85) !important;
          }

        cards:
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              title: Metingen
            filter:
              include:
              - area: Woonkamer
                domain: sensor
                device_class: temperature
              - area: Woonkamer
                domain: sensor
                device_class: humidity
              - area: Woonkamer
                domain: sensor
                device_class: carbon_dioxide
              - area: Woonkamer
                domain: sensor
                device_class: pm25
              - area: Woonkamer
