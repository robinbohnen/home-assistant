  #############################################################################
  ## Pop-ups
  #############################################################################
  # Onzichtbaar tot je een tegel aantikt. De opmaak staat één keer bij de
  # eerste pop-up (&kamer_popup) en wordt door de rest hergebruikt; hetzelfde
  # blok als op Overzicht, maar YAML-ankers werken niet over bestanden heen.
  #
  # WAT HIER OP 2026-08-03 UIT IS GEHAALD, EN WAAROM
  # Elke pop-up had een markdown-kaart, twee `auto-entities`-lijsten en een
  # `history-graph` met 24 uur historie. Die staan alle zeventien ín de weergave
  # - een pop-up is verborgen, niet afwezig - dus bij het openen van deze pagina
  # vuurde de browser zeventien historie-queries op de recorder af en hielden
  # eenenvijftig auto-entities-kaarten hun filter bij over de hele state
  # machine. De pagina was daardoor traag op het wandpaneel.
  #
  # Wat overblijft per pop-up:
  #   - `kamer_detail`, die uit `sensor.kamers` leest wat er aan de hand is en
  #     welke entiteit elke waarde geleverd heeft. Rekent in de browser.
  #   - één auto-entities met beweging, ramen en deuren. Die blijft area-based,
  #     want dat is de kant waar automatisch zoeken wél mag (zie de kop van
  #     custom_templates/kamers.jinja).
  # De lijst "alle metingen in deze ruimte" is niet meer nodig nu de koppeling
  # vastligt: `kamer_detail` noemt de bron per waarde, en wat er niet in zit
  # staat onderaan deze weergave. Historie zie je via hold op een tegel
  # (more-info) of op de Klimaat-weergave.
