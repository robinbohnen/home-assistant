# Kamers: hoe staat het ervoor in elke ruimte.
#
# Deze weergave tekent alleen. Alle drempels, kleuren en teksten komen uit
# `sensor.kamers`, dat gevuld wordt door custom_templates/kamers.jinja via
# packages/9 - Other/Kamers.yaml. Wil je weten waarom een tegel oranje is, kijk
# dan daar - hier staat geen enkel getal.
#
# Bewust een `sections`-weergave met native kolommen en zonder card-mod: de
# tegels brengen hun eigen achtergrond mee (button-card `styles`), dus als
# card-mod een keer niet laadt blijft dit gewoon leesbaar. Dat maakt hem ook
# bruikbaar op de Nest Hub, waar card-mod helemaal niet draait.
#
# Elke tegel opent een pop-up met `kamer_detail`: die laat zien WELKE entiteit
# elke waarde geleverd heeft. Klopt een cijfer niet, dan wijs je in de tabel in
# custom_templates/kamers.jinja de juiste sensor aan - een kamer meet sinds
# 2026-08-03 alleen nog wat daar staat. Onderaan deze weergave staat de
# tegenhanger: sensoren die er wél hangen maar nergens gekoppeld zijn.
#
# LET OP bij het bewerken van de auto-entities-filters: `device_class` is geen
# filtersleutel, die hoort onder `attributes:`. Met device_class op het hoogste
# niveau gaf elke pop-up "Configuratiefout".
#
# DRIE KOLOMMEN, NIET VIER (2026-08-03)
# Met vier kolommen paste de reden-en-advies-regel van een tegel niet meer en
# werd hij afgekapt met een beletselteken - precies de regel waarvoor je naar
# deze pagina kijkt. De eerste en tweede verdieping delen daarom één kolom, met
# twee koppen onder elkaar: samen zeven tegels, evenveel als de begane grond.
#
# GEEN SAMENVATTINGSBALK MEER (2026-08-03)
# Bovenaan stond een balk die de ruimtes met een probleem als chips herhaalde
# ("3 ruimtes vragen aandacht"). Die is eruit: sinds de tegels compact zijn pas
# het hele huis op één scherm, en dan doen de gekleurde randen datzelfde werk
# al - de balk noemde precies de tegels die je er tegelijk naast zag staan.
#
# Wat die balk óók deed was melden dat `sensor.kamers` nog geen waarde had. Dat
# blijft zichtbaar zonder hem: `kamer_tegel` zet dan op elke tegel een rode
# "? <slug>" waar de kamernaam hoort. Zeventien rode vraagtekens zijn een
# duidelijker signaal dan één regel bovenaan, dus daar is niets voor in de
# plaats gekomen.
type: sections
max_columns: 3
title: Kamers
path: kamers
icon: mdi:home-heart
dense_section_placement: true
sections:
  #############################################################################
  ## Begane grond
  #############################################################################
  - type: grid
    cards:
      - type: heading
        heading: Begane grond
        heading_style: title
        icon: mdi:home-floor-g
      - type: custom:button-card
        template: kamer_tegel
        variables:
          slug: woonkamer
        tap_action:
          action: navigate
          navigation_path: "#kamer-woonkamer"
      - type: custom:button-card
        template: kamer_tegel
        variables:
          slug: keuken
        tap_action:
          action: navigate
          navigation_path: "#kamer-keuken"
      - type: custom:button-card
        template: kamer_tegel
        variables:
          slug: entree
        tap_action:
          action: navigate
          navigation_path: "#kamer-entree"
      - type: custom:button-card
        template: kamer_tegel
        variables:
          slug: toilet
        tap_action:
          action: navigate
          navigation_path: "#kamer-toilet"
      - type: custom:button-card
        template: kamer_tegel
        variables:
          slug: speelkamer
        tap_action:
          action: navigate
          navigation_path: "#kamer-speelkamer"
      - type: custom:button-card
        template: kamer_tegel
        variables:
          slug: garage
