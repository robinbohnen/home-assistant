# Mini dashboard voor de Nest Hub (cast-doel media_player.woonkamer).
#
# Zelfde vormtaal als het Overzicht-dashboard, maar op kijkafstand: één scherm
# zonder scrollen, vier kwadranten, en typografie in vh zodat hij zowel een
# Nest Hub (1024x600) als een Hub Max (1280x800) precies vult.
#
# ============================ LET OP: GEEN CARD-MOD ==========================
# In een Cast-sessie draait card-mod NIET. Gemeten op de Nest Hub met een
# afwijkende achtergrondkleur in een card_mod-blok: die kleur kwam niet door,
# en `grid-template-columns: 1fr 1.25fr` op de rijen ook niet (de kolommen zijn
# gewoon gelijk breed). Resources laden wél — button-card rendert immers — maar
# card-mod haakt zich niet in op de frontend die de receiver van
# cast.home-assistant.io serveert.
#
# Gevolg voor dit bestand: gebruik voor layout ALLEEN wat de kaart zelf kan,
# dus button-card's eigen `styles:` (card/grid/custom_fields). Zet hier geen
# card_mod-blokken in — die doen niets op de Hub en geven een vals gevoel van
# controle. Concreet gemist en geaccepteerd: gelijke kolombreedtes i.p.v.
# 1fr/1.25fr.
#
# De hoogtes zijn daardoor met de hand begroot; zie HOOGTEBEGROTING onderaan
# deze kop. `100vh` is op de Hub wel degelijk het volledige scherm (gemeten:
# de view-achtergrond loopt tot de onderrand).
#
# HOOGTEBEGROTING (1vh = 6px op een 1024x600 Hub), samen ~99,6vh:
#   0,67vh  panel-view padding boven (HA-default 4px, onderaan 0)
#   2,33vh  margin-top kopbalk       -> zichtbare marge boven = 3,00vh = 18px
#   7,00vh  kopbalk (klok, vaste hoogte)
#   2,00vh  gat kopbalk -> rij 1     (margin-top rij-1-kaarten)
#  41,20vh  rij 1
#   2,20vh  gat rij 1 -> rij 2       (1,1vh onder rij 1 + 1,1vh boven rij 2)
#  41,20vh  rij 2
#   3,00vh  margin-bottom rij 2      -> zichtbare marge onder = 3,00vh = 18px
# LET OP: de Cast-frontend zet GEEN gap tussen stack-kinderen of gridcellen
# (gemeten op de Hub: de vier kaarten stonden strak tegen elkaar). Alle gaten
# staan daarom expliciet als kaartmarges: verticaal zoals hierboven, en tussen
# de twee kolommen 1,1vh rechtermarge (linkerkaart) + 1,1vh linkermarge
# (rechterkaart) = 2,2vh = 13px.
#
# HORIZONTAAL IS EEN MARGE NIET GENOEG. button-card zet zijn eigen ha-card op
# `width: 100%` (en `height: 100%`). De hoogte overschrijven we hierboven met
# een vaste vh-waarde, dus daar knippen de marges netjes ruimte uit. De breedte
# bleef 100% van de gridcel, en dan schuift `margin-left` de kaart alleen op
# terwijl `margin-right` buiten de cel valt: op de Hub was verticaal wél ruimte
# te zien en tussen de kolommen niet. Daarom staat op elke kaart óók een
# expliciete breedte.
#
# WAARSCHUWING: die breedte moet in vw, NIET in procenten. Met
# `width: calc(100% - ...)` sizet de browser de `1fr`-kolommen van de grid-kaart
# op de inhoud in plaats van op de helft — een percentage kan hij niet oplossen
# terwijl hij de kolom nog aan het meten is. Gemeten op de Hub: de twee
# linkerkaarten kregen elk een andere, veel te smalle breedte en het gat tussen
# de kolommen werd enorm. Vandaar `calc(50vw - 4.1vh)`: de halve viewport min de
# buitenmarge (2,33vh) en de halve tussenmarge (1,1vh), plus de halve
# panel-padding — één vast getal, niets circulairs.
#
# Links/rechts buitenrand: 0,67vh panel-padding + 2,33vh kaartmarge = 18px,
# gelijk aan boven en onder. Een kleinere maat werkt niet: de eerste poging
# stond op 1,7vh = 10px en dat is op kijkafstand niet als ruimte te zien.
title: Mini Dashboard
path: mini-dashboard
icon: mdi:monitor
panel: true
# Kern-eigenschap van de view: dit is een gewone view-property en werkt dus
# ook zonder card-mod/thema in de Cast-sessie.
background: "#0b0d12"
cards:
  - type: vertical-stack
    cards:
      # =================== KOPBALK ===================
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            # Deze klok komt uit new Date() en heeft dus geen bron die hem laat
            # tikken; button-card rendert pas opnieuw als zijn entity wijzigt.
            # sensor.time (time_date, zie packages/9 - Other/Dashboard
            # Context.yaml) verandert elke minuut en is die bron. Zonder
            # entity bleef de tijd staan op het moment dat de Cast-sessie begon.
            entity: sensor.time
            show_name: false
            show_state: false
            show_icon: false
            tap_action:
              action: none
            styles:
              card:
                - background: none
                - border: none
                - box-shadow: none
                - padding: 0
                # Vaste kopbalkhoogte: de rijhoogtes eronder zijn hierop
                # begroot, dus deze niet aan de inhoud laten hangen.
                - height: 7vh
                # Boven + links de zichtbare buitenmarge (bovenop de 4px
                # panel-padding van HA komt dit uit op 18px).
                - margin: 2.33vh 0 0 2.33vh
              grid:
                - grid-template-areas: '"k"'
                - justify-items: start
            custom_fields:
              k: |
                [[[
                  var d = new Date();
                  var dagen = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
                  var mnd = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
                  var t = ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
                  return `<span style="display:flex;align-items:baseline;gap:2.2vh">
                    <span style="font-size:6.5vh;font-weight:700;color:white;line-height:1">${t}</span>
                    <span style="font-size:3.1vh;color:rgba(255,255,255,0.72)">${dagen[d.getDay()]} ${d.getDate()} ${mnd[d.getMonth()]}</span>
                  </span>`;
                ]]]
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: sensor.slimhuys_zonneplan_huidige_prijs
                show_icon: false
                show_name: false
                show_state: false
                tap_action:
                  action: none
                styles:
                  card:
                    - background: >
                        [[[ var g = states['sensor.slimhuys_zonneplan_tariefniveau_nu']; return (g && /low/.test(g.state)) ? 'rgba(52,168,120,0.14)' : 'rgba(255,255,255,0.05)'; ]]]
                    - border: 1px solid rgba(255,255,255,0.07)
                    - border-radius: 999px
                    - box-shadow: none
                    - padding: 1vh 1.8vh
                    - width: max-content
                    - overflow: visible
                    # Pil is lager dan de 7vh kopbalk; deze marge zet hem
                    # optisch op de hoogte van de klok. Loopt mee met de
                    # margin-top van de klokkaart (2,33vh + 0,8vh offset).
                    - margin: 3.13vh 0 0 0
                  grid:
                    - grid-template-areas: '"c"'
                custom_fields:
                  c: |
                    [[[
                      var g = states['sensor.slimhuys_zonneplan_tariefniveau_nu'];
                      var p = states['sensor.slimhuys_zonneplan_huidige_prijs'];
                      // SlimHuys levert vijf niveaus, niet drie. Zonder very_low
                      // en very_high stond hier letterlijk "tarief very_low".
                      var lbl = {very_low:'zeer laag', low:'laag', medium:'gemiddeld', high:'hoog', very_high:'zeer hoog'};
                      var col = {very_low:'#4ade80', low:'#4ade80', medium:'#f59e0b', high:'#ef4444', very_high:'#ef4444'};
                      var gs = g ? g.state : 'medium';
                      var prijs = p && !isNaN(Number(p.state)) ? '€ ' + Number(p.state).toFixed(3).replace('.',',') : '—';
                      return `<span style="display:flex;align-items:center;gap:1vh;white-space:nowrap;font-size:2.7vh;font-weight:500;color:${/low/.test(gs) ? '#4ade80' : 'rgba(255,255,255,0.85)'}">
                        <span style="width:1.1vh;height:1.1vh;border-radius:50%;background:${col[gs]||'#888'}"></span>tarief ${lbl[gs]||String(gs).replace(/_/g,' ')} · ${prijs}</span>`;
                    ]]]
              - type: custom:button-card
                entity: weather.knmi_thuis
                show_icon: false
                show_name: false
                show_state: false
                tap_action:
                  action: none
                styles:
                  card:
                    - background: rgba(255,255,255,0.05)
                    - border: 1px solid rgba(255,255,255,0.07)
                    - border-radius: 999px
                    - box-shadow: none
                    - padding: 1vh 1.8vh
                    - width: max-content
                    - overflow: visible
                    # Pil is lager dan de 7vh kopbalk; deze marge zet hem
                    # optisch op de hoogte van de klok. Loopt mee met de
                    # margin-top van de klokkaart (2,33vh + 0,8vh offset).
                    - margin: 3.13vh 0 0 0
                  grid:
                    - grid-template-areas: '"c"'
                custom_fields:
                  c: |
                    [[[
                      var w = states['weather.knmi_thuis'];
                      if(!w) return '';
                      var map = {sunny:'zonnig','clear-night':'helder',cloudy:'bewolkt',partlycloudy:'half bewolkt',rainy:'regen',pouring:'zware regen',snowy:'sneeuw','snowy-rainy':'natte sneeuw',fog:'mist',windy:'winderig','windy-variant':'winderig',hail:'hagel',lightning:'onweer','lightning-rainy':'onweer',exceptional:'extreem'};
                      var ico = {sunny:'mdi:weather-sunny','clear-night':'mdi:weather-night',cloudy:'mdi:weather-cloudy',partlycloudy:'mdi:weather-partly-cloudy',rainy:'mdi:weather-rainy',pouring:'mdi:weather-pouring',snowy:'mdi:weather-snowy','snowy-rainy':'mdi:weather-snowy-rainy',fog:'mdi:weather-fog',windy:'mdi:weather-windy','windy-variant':'mdi:weather-windy-variant',hail:'mdi:weather-hail',lightning:'mdi:weather-lightning','lightning-rainy':'mdi:weather-lightning-rainy',exceptional:'mdi:weather-cloudy-alert'};
                      var t = w.attributes.temperature;
                      return `<span style="display:flex;align-items:center;gap:1vh;white-space:nowrap;font-size:2.7vh;color:rgba(255,255,255,0.8)">
                        <ha-icon icon="${ico[w.state]||'mdi:weather-cloudy'}" style="--mdc-icon-size:3.1vh;color:rgba(255,255,255,0.6)"></ha-icon>
                        ${map[w.state]||w.state} · ${t != null ? Math.round(t) : '—'}°</span>`;
                    ]]]

      # =================== BOVENSTE RIJ ===================
      - type: grid
        columns: 2
        square: false
        cards:
          # ---------- BRANDWEER ----------
          - type: custom:button-card
            entity: input_select.brandweer_dienstdoende_ploeg
            # De cijfers hieronder komen van andere entiteiten dan de `entity`
            # van deze kaart (die wisselt één keer per week). Zonder deze lijst
            # hertekent button-card niet en bevriest de bezetting op de Hub.
            triggers_update:
              - sensor.brandweer_bezetting
              - sensor.bezetting_ploeg_a
              - sensor.bezetting_ploeg_b
              - sensor.bezetting_ploeg_c
              - input_text.brandweer_laatste_melding
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            styles:
              card:
                  - background: rgba(255,255,255,0.06)
                  - border: 1px solid rgba(255,255,255,0.18)
                  - border-radius: 18px
                  - box-shadow: none
                  - padding: 1.6vh 2vh
                  # Vaste rijhoogte uit de HOOGTEBEGROTING bovenaan dit bestand.
                  # Geen 100%: zonder card-mod krijgt de hui-card-wrapper geen
                  # hoogte doorgegeven en valt een percentage terug op auto.
                  - height: 41.2vh
                  - box-sizing: border-box
                  # Net als bij height: button-card zet zijn ha-card zelf op
                  # width:100%, en dan doet een horizontale marge niets — de
                  # kaart wordt niet smaller maar schuift alleen op. Breedte in
                  # vw, NIET in %: zie de WAARSCHUWING bovenaan dit bestand.
                  - width: calc(50vw - 4.1vh)
                  # Linkerkolom, bovenste rij: links buitenmarge, rechts en
                  # onder een halve tussenmarge (de andere helft zit op de
                  # buurkaarten — de Cast-frontend heeft zelf geen grid-gap).
                  - margin: 2vh 1.1vh 1.1vh 2.33vh
              grid:
                - grid-template-areas: '"t" "ploegen" "uitrukken" "melding"'
                - grid-template-rows: auto auto auto auto
                - align-content: space-evenly
                - row-gap: 1.4vh
                - height: 100%
              custom_fields:
                t:
                  - justify-self: stretch
                ploegen:
                  - justify-self: stretch
                uitrukken:
                  - justify-self: stretch
                melding:
                  - justify-self: stretch
            custom_fields:
              t: |
                [[[
                  var ds = states['input_select.brandweer_dienstdoende_ploeg'];
                  var p = ds && ds.state ? ds.state.charAt(0).toUpperCase() : null;
                  var staart = (p && 'ABC'.indexOf(p) !== -1)
                    ? `<span style="color:#38bdf8;font-weight:600">${p}-ploeg heeft dienst</span>`
                    : `<span style="color:rgba(255,255,255,0.62)">dienst onbekend</span>`;
                  var r = states['sensor.robin_reistijd_naar_brandweer_uden'];
                  var kazerne = (r && !isNaN(Number(r.state)))
                    ? `<span style="font-size:2.2vh;color:rgba(255,255,255,0.68);margin-left:auto;white-space:nowrap">kazerne ${Math.round(Number(r.state))} min</span>` : '';
                  return `<span style="display:flex;align-items:baseline;gap:1.2vh;width:100%">
                    <span style="font-size:2.5vh;font-weight:700;letter-spacing:0.12vh;color:rgba(255,255,255,0.68)">BRANDWEER</span>
                    <span style="font-size:2.5vh">${staart}</span>${kazerne}</span>`;
                ]]]
              # Aantal en kleur komen bij voorkeur uit sensor.brandweer_bezetting
              # (de PreCom-webhook: kent de status die PreCom zelf bepaalt en
              # weet welke functie het gat veroorzaakt) en anders uit de
              # vijfminuten-poll sensor.bezetting_ploeg_*.
              #
              # De onderregel van elke cel houdt zijn vaste hoogte: hij toont
              # DIENST, of - als het niet op orde is - waar het aan schort. Zo
              # verandert er niets aan de HOOGTEBEGROTING bovenaan dit bestand.
              ploegen: |
                [[[
                  var ds = states['input_select.brandweer_dienstdoende_ploeg'];
                  var dienst = ds && ds.state ? ds.state.charAt(0).toUpperCase() : '';
                  var bez = states['sensor.brandweer_bezetting'];
                  var attrs = (bez && bez.attributes) ? bez.attributes : {};
                  var uitWebhook = {};
                  (attrs.ploegen || []).forEach(function(p){ uitWebhook[p.ploeg] = p; });
                  var kleuren = {onderbezet:'#ef4444', krap:'#f59e0b'};
                  var cellen = ['A','B','C'].map(function(letter){
                    var w = uitWebhook[letter];
                    var s = states['sensor.bezetting_ploeg_' + letter.toLowerCase()];
                    var n = w ? w.aantal : (s && !isNaN(Number(s.state)) ? Number(s.state) : null);
                    var col = w ? (kleuren[w.status] || '#4ade80')
                            : (n === null ? 'rgba(255,255,255,0.35)' : (n < 4 ? '#ef4444' : (n < 6 ? '#f59e0b' : '#4ade80')));
                    var aan = letter === dienst;
                    // De functiedetails in de payload gaan alleen over de
                    // dienstdoende ploeg; de andere twee hebben enkel een status.
                    // Eén regel breed is hier ~12 tekens, dus bij meerdere gaten
                    // alleen de eerste plus een teller.
                    var gaten = attrs.gaten || [];
                    var label = null;
                    if(w && w.status && w.status !== 'ok'){
                      label = (aan && gaten.length)
                        ? gaten[0].kort + (gaten.length > 1 ? ' +' + (gaten.length - 1) : '')
                        : (w.status === 'onderbezet' ? 'tekort' : w.status);
                    }
                    var onder = label
                      ? `<span style="display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1.7vh;font-weight:700;letter-spacing:0.08vh;color:${col}">${label.toUpperCase()}</span>`
                      : (aan
                        ? `<span style="font-size:1.7vh;font-weight:700;letter-spacing:0.08vh;color:#38bdf8">DIENST</span>`
                        : `<span style="font-size:1.7vh">&nbsp;</span>`);
                    return `<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:0.2vh;padding:1vh 0 0.8vh 0;border-radius:1.4vh;background:${aan ? 'rgba(56,189,248,0.12)' : 'rgba(255,255,255,0.04)'};border:1px solid ${aan ? 'rgba(56,189,248,0.35)' : 'rgba(255,255,255,0.06)'}">
                      <span style="font-size:2.1vh;font-weight:700;letter-spacing:0.1vh;color:${aan ? '#38bdf8' : 'rgba(255,255,255,0.7)'}">${letter}</span>
                      <span style="font-size:4.7vh;font-weight:700;line-height:1.05;color:${col}">${n === null ? '—' : n}</span>${onder}</div>`;
                  });
                  return `<div style="display:flex;gap:1.2vh">${cellen.join('')}</div>`;
                ]]]
              uitrukken: |
                [[[
                  var lees = function(id){ var e = states[id]; return (e && !isNaN(Number(e.state))) ? Number(e.state) : null; };
                  var tot = lees('counter.brandweer_totaal_aantal_uitrukken');
                  var perPloeg = ['a','b','c'].map(function(l){ return [l.toUpperCase(), lees('counter.brandweer_uden_' + l + '_ploeg_uitrukken')]; });
                  if(tot === null && perPloeg.every(function(x){ return x[1] === null; })) return '';
                  var cel = function(waarde, label, groot){
                    return `<div style="display:flex;flex-direction:column;align-items:center;gap:0.2vh">
                      <span style="font-size:${groot ? '2.8vh' : '2.2vh'};font-weight:700;color:${groot ? 'white' : 'rgba(255,255,255,0.8)'}">${waarde === null ? '—' : waarde}</span>
                      <span style="font-size:1.8vh;color:rgba(255,255,255,0.68)">${label}</span></div>`;
                  };
                  return `<div style="display:flex;justify-content:space-around;align-items:end;width:100%;box-sizing:border-box;border-top:1px solid rgba(255,255,255,0.07);padding-top:1.2vh">
                    ${cel(tot, 'mijn uitrukken', true)}
                    ${perPloeg.map(function(x){ return cel(x[1], x[0] + '-ploeg', false); }).join('')}</div>`;
                ]]]
              melding: |
                [[[
                  var e = states['input_text.brandweer_laatste_melding'];
                  var tekst = e && e.state ? e.state : '';
                  if(!tekst) return `<span style="font-size:2.5vh;color:rgba(255,255,255,0.62)">geen recente melding</span>`;
                  var m = tekst.match(/^\s*([A-Pa-p])\s*(\d)/);
                  var code = m ? (m[1] + m[2]).toUpperCase() : null;
                  var kort = tekst.replace(/^\s*[A-Pa-p]\s*\d\s*/, '');
                  // De zescijferige getallen achteraan zijn de roepnummers van
                  // de voertuigen die eropaf gaan ("213831" = 21-3831), soms
                  // meerdere. Achter een straatnaam lazen ze als huisnummer -
                  // "Industrielaan Uden 213831". Los eronder, in de notatie met
                  // streepje, zijn ze meteen wat ze zijn.
                  var voertuigen = [];
                  var vm = kort.match(/(?:\s\d{6})+\s*$/);
                  if(vm){
                    voertuigen = vm[0].trim().split(/\s+/).map(function(n){ return n.slice(0,2) + '-' + n.slice(2); });
                    kort = kort.slice(0, vm.index).trim();
                  }
                  if(kort.length > 58) kort = kort.slice(0,57) + '…';
                  var d = states['input_datetime.brandweer_laatste_melding'];
                  var wanneer = '';
                  if(d && d.state){
                    var dt = new Date(String(d.state).replace(' ','T'));
                    if(!isNaN(dt.getTime())) wanneer = dt.toLocaleDateString('nl-NL',{day:'numeric',month:'short'}) + ' ' + ('0'+dt.getHours()).slice(-2)+':'+('0'+dt.getMinutes()).slice(-2);
                  }
                  var badge = code
                    ? `<div style="min-width:5.7vh;padding:0.4vh 1vh;border-radius:1vh;background:rgba(245,158,11,0.16);color:#f59e0b;font-size:2.5vh;font-weight:700;text-align:center">${code}</div>`
                    : `<ha-icon icon="mdi:fire-truck" style="--mdc-icon-size:3.4vh;color:#f59e0b"></ha-icon>`;
                  return `<div style="display:flex;align-items:center;justify-content:flex-start;width:100%;box-sizing:border-box;gap:1.4vh;border-top:1px solid rgba(255,255,255,0.07);padding-top:1.2vh">${badge}
                    <div style="display:flex;flex-direction:column;gap:0.3vh;overflow:hidden">
                      <span style="font-size:2.5vh;line-height:1.2;font-weight:600;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${kort}</span>
                      <span style="display:inline-flex;align-items:center;gap:0.8vh;font-size:2.1vh;line-height:1;color:rgba(255,255,255,0.68)">
                        <span>${wanneer}</span>${voertuigen.length
                        ? `<span style="color:rgba(255,255,255,0.25)">·</span>
                        <span style="display:inline-flex;align-items:center;gap:0.5vh"><ha-icon icon="mdi:fire-truck" style="--mdc-icon-size:2.1vh;color:rgba(255,255,255,0.5)"></ha-icon>${voertuigen.join(', ')}</span>`
                        : ''}</span></div></div>`;
                ]]]

        # ---------- ENERGIE ----------
          - type: custom:button-card
            entity: sensor.live_energieverbruik_totaal
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            variables:
              laadvenster_uren: 3
            styles:
              card:
                  - background: rgba(255,255,255,0.06)
                  - border: 1px solid rgba(255,255,255,0.18)
                  - border-radius: 18px
                  - box-shadow: none
                  - padding: 1.6vh 2vh
                  - height: 41.2vh
                  - box-sizing: border-box
                  # Net als bij height: button-card zet zijn ha-card zelf op
                  # width:100%, en dan doet een horizontale marge niets — de
                  # kaart wordt niet smaller maar schuift alleen op. Breedte in
                  # vw, NIET in %: zie de WAARSCHUWING bovenaan dit bestand.
                  - width: calc(50vw - 4.1vh)
                  # Rechterkolom, bovenste rij: rechts buitenmarge, links en
                  # onder een halve tussenmarge.
                  - margin: 2vh 2.33vh 1.1vh 1.1vh
              grid:
                - grid-template-areas: '"t" "cijfers" "strook"'
                - grid-template-rows: auto auto auto
                - align-content: space-evenly
                - row-gap: 1.2vh
                - height: 100%
              custom_fields:
                t:
                  - justify-self: stretch
                cijfers:
                  - justify-self: stretch
                strook:
                  - justify-self: stretch
            custom_fields:
              t: |
                [[[
                  var g = states['sensor.slimhuys_zonneplan_tariefniveau_nu'];
                  var s = states['sensor.solar_power_generated_now'];
                  // 'groen' zegt alleen dat de eigen panelen leveren (> 100 W,
                  // met dezelfde W/kW-normalisatie als de cijfers hieronder);
                  // het Zonneplan-tarief bepaalt goedkoop/duur en wint qua
                  // kleur, zodat er nooit "groen" staat terwijl stroom duur is
                  // zonder dat je dat ziet.
                  var prod = null;
                  if(s && !isNaN(Number(s.state))){
                    prod = Number(s.state);
                    if((s.attributes.unit_of_measurement || '') === 'W') prod = prod / 1000;
                  }
                  var groen = prod !== null && prod > 0.1;
                  // /low/ en /high/ vangen ook very_low en very_high; SlimHuys
                  // kent vijf niveaus en een test op alleen 'low' miste juist
                  // het goedkoopste tarief.
                  var gs = g ? g.state : null;
                  var txt, col;
                  if(gs && /low/.test(gs)){
                    txt = groen ? 'groen en goedkoop' : 'goedkoop';
                    col = '#4ade80';
                  } else if(gs && /high/.test(gs)){
                    txt = groen ? 'groen maar duur' : 'duur';
                    col = groen ? '#f59e0b' : '#ef4444';
                  } else {
                    txt = groen ? 'groen · normaal tarief' : 'normaal tarief';
                    col = groen ? '#4ade80' : 'rgba(255,255,255,0.6)';
                  }
                  var k = states['sensor.total_costs_today_calculated'];
                  var kosten = '';
                  if(k && !isNaN(Number(k.state))){
                    var kv = Number(k.state);
                    kosten = `<span style="font-size:2.2vh;margin-left:auto;white-space:nowrap;color:${kv < 0 ? '#4ade80' : 'rgba(255,255,255,0.72)'}">€ ${kv.toFixed(2).replace('.',',')} vandaag</span>`;
                  }
                  return `<span style="display:flex;align-items:baseline;gap:1.2vh;width:100%">
                    <span style="font-size:2.5vh;font-weight:700;letter-spacing:0.12vh;color:rgba(255,255,255,0.68)">ENERGIE · NU</span>
                    <span style="font-size:2.5vh;color:${col}">stroom is ${txt}</span>${kosten}</span>`;
                ]]]
              cijfers: |
                [[[
                  var lees = function(id, alsW){
                    var e = states[id];
                    if(!e || isNaN(Number(e.state))) return null;
                    var v = Number(e.state);
                    var u = e.attributes.unit_of_measurement || '';
                    return (alsW && u === 'W') ? v / 1000 : v;
                  };
                  var netto = lees('sensor.live_energieverbruik_totaal');
                  if(netto !== null && Math.abs(netto) < 0.005) netto = 0;
                  var prod = lees('sensor.solar_power_generated_now', true);
                  var soc = states['sensor.lilygo_rs485_marstek_battery_state_of_charge'];
                  var bp = states['sensor.lilygo_rs485_marstek_battery_power'];
                  var socv = soc && !isNaN(Number(soc.state)) ? Math.round(Number(soc.state)) : null;
                  var bpv = bp && !isNaN(Number(bp.state)) ? Math.round(Number(bp.state)) : null;
                  // HUIS, NIET DE METERSTAND
                  // Hier stond `sensor.electricity_meter_energieverbruik`, en dat
                  // is de netafname - die staat links al als "netto verbruik".
                  // Twee tegels naast elkaar met hetzelfde getal en een ander
                  // label, en bij zon allebei te laag. Zie dezelfde som en
                  // toelichting bij `verbruik` in overzicht/kolom_midden.yaml.
                  var verbr = (netto === null || prod === null) ? null
                            : Math.max(0, netto + prod - (bpv === null ? 0 : bpv / 1000));
                  // Zelfde standby-grens als op het overzicht (zie de
                  // toelichting bij `batt` in overzicht/kolom_midden.yaml): de
                  // omvormer trekt in rust tot 15 W uit de accu, en dat is
                  // geen ontladen. Hier stond dezelfde `> 0 / < 0 / idle`-reeks
                  // en dus dezelfde fout, op het scherm waar je er het hele
                  // ontbijt tegenaan kijkt.
                  var bmode = bpv === null ? ''
                            : (Math.abs(bpv) <= 15 ? ' · standby'
                            : (bpv < 0 ? ' · ontlaadt' : ' · laadt'));
                  var fmt = function(v){ return v === null ? '—' : v.toFixed(2).replace('.',','); };
                  var klein = function(waarde, label, kleur){
                    return `<div style="display:flex;flex-direction:column;gap:0.3vh">
                      <span style="font-size:4.2vh;font-weight:700;line-height:1;color:${kleur}">${waarde}</span>
                      <span style="font-size:2.1vh;color:rgba(255,255,255,0.7)">${label}</span></div>`;
                  };
                  var nettoKleur = (netto !== null && netto < 0) ? '#4ade80' : 'white';
                  return `<div style="display:grid;grid-template-columns:1.5fr 1fr 1fr 1.1fr;align-items:end;column-gap:1.2vh">
                    <div style="display:flex;flex-direction:column;gap:0.3vh">
                      <span><span style="font-size:7vh;font-weight:700;line-height:1;color:${nettoKleur}">${fmt(netto)}</span>
                      <span style="font-size:2.6vh;color:rgba(255,255,255,0.72)">kW</span></span>
                      <span style="font-size:2.1vh;color:rgba(255,255,255,0.7)">netto verbruik</span></div>
                    ${klein(fmt(prod), 'productie', '#4ade80')}
                    ${klein(fmt(verbr), 'huis verbruik', '#3b82f6')}
                    ${klein(socv === null ? '—' : socv + '%', 'batterij' + bmode, 'white')}
                  </div>`;
                ]]]
              strook: |
                [[[
                  // Compacte prijsstrook voor de komende 12 uur: dezelfde
                  // bandindeling per kalenderdag als op het grote dashboard.
                  var nu = Date.now();
                  var start = nu - 3600000, eind = nu + 11 * 3600000;
                  var pct = function(t){ return (t - start) / (eind - start) * 100; };
                  var klem = function(v){ return Math.max(0, Math.min(100, v)); };
                  // Prijsblokken uit SlimHuys: kwartieren als die er zijn, anders uren,
                  // plus die van morgen. 't' is de START van een blok; de code hieronder
                  // leidt de bloklengte af uit het verschil tussen twee starts.
                  var blok = function(eid, sleutel){ var e = states[eid]; return (e && e.attributes && e.attributes[sleutel]) || []; };
                  var kw = blok('sensor.slimhuys_zonneplan_prijzen_vandaag_kwartier', 'raw_today');
                  var raw = (kw.length ? kw : blok('sensor.slimhuys_zonneplan_prijzen_vandaag', 'raw_today'))
                    .concat(blok('sensor.slimhuys_zonneplan_prijzen_morgen', 'raw_tomorrow'));
                  var slots = raw.map(function(e){
                    var d = new Date(e.start), p = Number(e.value);
                    return (isNaN(d.getTime()) || isNaN(p)) ? null : {t: d.getTime(), p: p};
                  }).filter(Boolean).sort(function(a,b){ return a.t - b.t; });
                  if(slots.length < 2) return `<span style="font-size:2.1vh;color:rgba(255,255,255,0.35)">geen prijsvoorspelling</span>`;
                  var stap = slots[1].t - slots[0].t;
                  var perDag = {};
                  slots.forEach(function(s){
                    var k = new Date(s.t).toDateString();
                    if(!perDag[k]) perDag[k] = {min: s.p, max: s.p};
                    else { perDag[k].min = Math.min(perDag[k].min, s.p); perDag[k].max = Math.max(perDag[k].max, s.p); }
                  });
                  var klok = function(x){ var d = new Date(x); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); };
                  var euro = function(p){ return p.toFixed(2).replace('.', ','); };

                  // Goedkoopste aaneengesloten laadvenster, vóór de blokken zodat
                  // het prijsje binnen dat venster kan worden weggelaten.
                  var beste = null;
                  var nodig = Math.max(1, Math.round((variables.laadvenster_uren || 3) * 3600000 / stap));
                  for(var len = nodig; len >= 1 && beste === null; len--){
                    for(var i = 0; i + len <= slots.length; i++){
                      if(slots[i].t + stap <= nu) continue;
                      var som = 0, aaneen = true;
                      for(var j = 0; j < len; j++){
                        if(j > 0 && slots[i+j].t - slots[i+j-1].t !== stap){ aaneen = false; break; }
                        som += slots[i+j].p;
                      }
                      if(!aaneen) continue;
                      var gem = som / len;
                      if(beste === null || gem < beste.gem) beste = {gem: gem, van: slots[i].t, tot: slots[i+len-1].t + stap};
                    }
                  }

                  var blokken = [];
                  slots.forEach(function(s){
                    if(s.t + stap < start || s.t > eind) return;
                    var d = perDag[new Date(s.t).toDateString()];
                    var spreiding = d.max - d.min;
                    var r = spreiding < 0.02 ? 0.5 : (s.p - d.min) / spreiding;
                    var kleur = r <= 0.33 ? '#4ade80' : (r >= 0.66 ? '#ef4444' : '#f59e0b');
                    var a = klem(pct(s.t)), b = klem(pct(s.t + stap));
                    if(b - a <= 0.05) return;
                    // Prijs in het blok: op een wandpaneel is er geen hover, dus
                    // het getal moet zichtbaar zijn.
                    var inVenster = beste && s.t < beste.tot && s.t + stap > beste.van;
                    var etiket = (!inVenster && (b - a) >= 5)
                      ? `<span style="font-size:1.6vh;font-weight:700;color:rgba(0,0,0,0.72)">${(b - a) >= 7 ? '€' : ''}${euro(s.p)}</span>` : '';
                    blokken.push(`<div style="position:absolute;left:${a}%;width:${b-a}%;top:0;bottom:0;background:${kleur};opacity:0.85;display:flex;align-items:center;justify-content:center;overflow:hidden">${etiket}</div>`);
                  });

                  // De beugel markeert het venster; de tijden en de prijs staan als
                  // aparte regel onder de as. In deze smalle strook past een etiket
                  // met tijden er niet in — dat werd afgekapt.
                  var beugel = '', regel = '';
                  if(beste && beste.van < eind){
                    var ba = klem(pct(beste.van)), bb = klem(pct(beste.tot));
                    // Cyaan op groen is onleesbaar: donkere chip eronder.
                    var chip = (bb - ba) > 12
                      ? `<span style="font-size:1.7vh;font-weight:700;color:#e0f2fe;letter-spacing:0.05vh;background:rgba(8,25,45,0.92);padding:0 0.7vh;border-radius:0.4vh;line-height:1.25;white-space:nowrap">LADEN</span>`
                      : '';
                    if(bb - ba > 1) beugel = `<div style="position:absolute;left:${ba}%;width:${bb-ba}%;top:-0.3vh;height:3.8vh;border:0.25vh solid #38bdf8;border-radius:0.6vh;box-sizing:border-box;display:flex;align-items:center;justify-content:center;overflow:hidden">${chip}</div>`;
                    // De huidige prijs staat al in de pil in de kopbalk, dus die
                    // niet nog eens hier.
                    var dur = null;
                    slots.forEach(function(s){ if(s.t >= nu && s.t <= eind && (dur === null || s.p > dur.p)) dur = s; });
                    regel = `<div style="position:absolute;left:0;right:0;top:7vh;display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:0.8vh;text-align:left">
                      <span style="width:1.1vh;height:1.1vh;border-radius:50%;background:#38bdf8"></span>
                      <span style="font-size:1.9vh;color:rgba(255,255,255,0.7);white-space:nowrap;text-align:left">goedkoopst laden <span style="color:white;font-weight:600">${klok(beste.van)}–${klok(beste.tot)}</span> · gem. € ${euro(beste.gem)}${dur === null ? '' : ` · duurst ${klok(dur.t)} € ${euro(dur.p)}`}</span></div>`;
                  }

                  var assen = [];
                  var u = new Date(start); u.setMinutes(0,0,0);
                  u.setHours(u.getHours() + (3 - (u.getHours() % 3)));
                  for(var x = u.getTime(); x < eind; x += 10800000){
                    var px = pct(x);
                    if(px < 3 || px > 97) continue;
                    assen.push(`<div style="position:absolute;left:${px}%;transform:translateX(-50%);top:4.2vh;font-size:1.8vh;color:rgba(255,255,255,0.68)">${('0'+new Date(x).getHours()).slice(-2)}:00</div>`);
                  }
                  return `<div style="position:relative;width:100%;height:${regel ? '9.6vh' : '6.8vh'}">
                    <div style="position:absolute;left:0;right:0;top:0;height:3.2vh;border-radius:0.5vh;overflow:hidden;background:rgba(255,255,255,0.05)">${blokken.join('')}</div>
                    <div style="position:absolute;left:${klem(pct(nu))}%;top:0;height:3.2vh;border-left:2px dashed rgba(255,255,255,0.85)"></div>
                    ${beugel}
                    ${assen.join('')}
                    ${regel}</div>`;
                ]]]

    # =================== ONDERSTE RIJ ===================
      - type: grid
        columns: 2
        square: false
        cards:
          # ---------- VANDAAG ----------
          - type: custom:button-card
            entity: sensor.afvalinfo_home_trash_type_today
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            styles:
              card:
                  - background: rgba(255,255,255,0.06)
                  - border: 1px solid rgba(255,255,255,0.18)
                  - border-radius: 18px
                  - box-shadow: none
                  - padding: 1.6vh 2vh
                  - height: 41.2vh
                  - box-sizing: border-box
                  # Net als bij height: button-card zet zijn ha-card zelf op
                  # width:100%, en dan doet een horizontale marge niets — de
                  # kaart wordt niet smaller maar schuift alleen op. Breedte in
                  # vw, NIET in %: zie de WAARSCHUWING bovenaan dit bestand.
                  - width: calc(50vw - 4.1vh)
                  # Onderste rij: boven en rechts een halve tussenmarge; de
                  # zichtbare marge onderaan het scherm zit hier, want de
                  # panel-view heeft onder geen padding.
                  - margin: 1.1vh 1.1vh 3vh 2.33vh
              grid:
                - grid-template-areas: '"t" "afval" "agenda" "voet"'
                - grid-template-rows: auto auto auto auto
                - align-content: space-evenly
                - row-gap: 1.2vh
                - height: 100%
              custom_fields:
                t:
                  - justify-self: start
                afval:
                  - justify-self: stretch
                agenda:
                  - justify-self: stretch
                voet:
                  - justify-self: stretch
            custom_fields:
              t: |
                [[[ return `<span style="font-size:2.5vh;font-weight:700;letter-spacing:0.12vh;color:rgba(255,255,255,0.68)">VANDAAG</span>`; ]]]
              afval: |
                [[[
                  // PBD vóór papier: "Drinkkartons" bevat 'karton'
                  var soorten = [[/gft|groente|tuin/i,'#4ade80'], [/pbd|plastic|blik|drank/i,'#f59e0b'], [/papier/i,'#38bdf8'], [/rest/i,'rgba(255,255,255,0.7)']];
                  var kleurVan = function(v){ for(var i=0;i<soorten.length;i++) if(soorten[i][0].test(v)) return soorten[i][1]; return 'rgba(255,255,255,0.35)'; };
                  var regel = function(id, label){
                    var e = states[id];
                    // Hier stond `!== 'Geen'` met een hoofdletter terwijl de
                    // sensor 'geen' teruggeeft, dus stond er op een rustige dag
                    // letterlijk "geen" in plaats van "geen ophaal" - en in de
                    // kleur van een afvalsoort. Zelfde fout als op het
                    // overzicht, zie overzicht/kolom_rechts.yaml.
                    //
                    // `unknown` telt als niets: dat is de halve minuut die de
                    // integratie bij elke verversing op onbekend staat. Alleen
                    // een sensor die écht weg is (`unavailable`) heet hier
                    // onbekend, anders leest een storing als een rustige dag.
                    var raw = e && e.state ? String(e.state).trim() : '';
                    var stuk = !raw || /^unavailable$/i.test(raw);
                    var v = (stuk || /^(geen|unknown)$/i.test(raw)) ? null : raw;
                    var leeg = stuk ? 'onbekend' : 'geen ophaal';
                    var kl = v ? kleurVan(v) : 'rgba(255,255,255,0.3)';
                    if(v && v.length > 30) v = v.slice(0,29) + '…';
                    // Grid met vaste kolommen + expliciete text-align: flexbox in
                    // een button-card custom field wordt door de kaart zelf
                    // gecentreerd/uitgespreid, een grid dat 100% vult niet.
                    return `<div style="display:grid;grid-template-columns:auto 9vh 1fr;align-items:center;column-gap:1.2vh;width:100%;text-align:left">
                      <ha-icon icon="mdi:trash-can-outline" style="--mdc-icon-size:3.1vh;color:${kl}"></ha-icon>
                      <span style="font-size:2.2vh;color:rgba(255,255,255,0.7);text-align:left">${label}</span>
                      <span style="font-size:2.6vh;font-weight:600;text-align:left;color:${v ? kl : 'rgba(255,255,255,0.35)'}">${v || leeg}</span></div>`;
                  };
                  return `<div style="display:grid;row-gap:0.9vh;width:100%;text-align:left">
                    ${regel('sensor.afvalinfo_home_trash_type_today','vandaag')}
                    ${regel('sensor.afvalinfo_home_trash_type_tomorrow','morgen')}</div>`;
                ]]]
              # Niet één "volgende afspraak" maar de hele lijst tot en met morgen:
              # er bleef veel ruimte over en dit is wat je van een wandpaneel wil
              # weten. Wat al voorbij is valt weg op sorteer_eind.
              agenda: |
                [[[
                  var pad = function(n){ return ('0'+n).slice(-2); };
                  var dagStr = function(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
                  var esc = function(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
                  var nu = new Date();
                  var nuStr = dagStr(nu) + ' ' + pad(nu.getHours()) + ':' + pad(nu.getMinutes());
                  var vandaag = dagStr(nu);
                  var sen = states['sensor.agenda_afspraken_vandaag'];
                  var items = [];
                  if(sen && sen.attributes && Array.isArray(sen.attributes.vandaag)){
                    ['vandaag','morgen'].forEach(function(k){
                      var l = sen.attributes[k];
                      if(!Array.isArray(l)) return;
                      l.forEach(function(a){
                        items.push({titel: a.titel, agenda: a.agenda, datum: a.datum, tijd: a.tijd,
                                    hele_dag: a.hele_dag,
                                    eind: a.sorteer_eind || (a.datum + ' 23:59'),
                                    sorteer: a.sorteer || (a.datum + ' ' + (a.tijd || '00:00'))});
                      });
                    });
                    items = items.filter(function(a){ return String(a.eind) >= nuStr; });
                  } else {
                    // terugval zolang de get_events-sensor er niet is: per agenda
                    // alleen de eerstvolgende afspraak
                    [['calendar.r_bohnen_vrbn_nl_agenda','Werk'],['calendar.robin_bohnen_nl_agenda','Privé'],
                     ['calendar.robin_en_sam','Samen'],['calendar.brandweer','Brandweer'],
                     ['calendar.maxi','Logan'],['calendar.mini','Emma']].forEach(function(c){
                      var e = states[c[0]];
                      if(!e || !e.attributes || !e.attributes.start_time) return;
                      var st = new Date(String(e.attributes.start_time).replace(' ','T'));
                      if(isNaN(st.getTime())) return;
                      var en = e.attributes.end_time ? new Date(String(e.attributes.end_time).replace(' ','T')) : null;
                      if(en && !isNaN(en.getTime()) && en < nu) return;
                      items.push({titel: e.attributes.message || 'Afspraak', agenda: c[1], datum: dagStr(st),
                                  tijd: pad(st.getHours()) + ':' + pad(st.getMinutes()),
                                  hele_dag: !!e.attributes.all_day, eind: '9999',
                                  sorteer: dagStr(st) + ' ' + pad(st.getHours()) + ':' + pad(st.getMinutes())});
                    });
                  }
                  items.sort(function(a,b){ return String(a.sorteer) < String(b.sorteer) ? -1 : (String(a.sorteer) > String(b.sorteer) ? 1 : 0); });
                  // Vier regels is wat er in een kaartrij (~42vh) past naast
                  // afval en de voetregel.
                  var maxRijen = 4;
                  var omhullend = function(inhoud){
                    return `<div style="display:grid;row-gap:0.7vh;width:100%;box-sizing:border-box;text-align:left;border-top:1px solid rgba(255,255,255,0.07);padding-top:1vh">${inhoud}</div>`;
                  };
                  if(!items.length) return omhullend(`<span style="font-size:2.4vh;color:rgba(255,255,255,0.55);text-align:left">niets meer vandaag of morgen</span>`);
                  var rijen = items.slice(0, maxRijen).map(function(a){
                    var morgen = a.datum !== vandaag;
                    var tijd = a.hele_dag ? 'dag' : (a.tijd || '');
                    // tijd | titel (rekt op) | agenda: kolommen vullen exact 100%,
                    // dus de kaart kan er niets meer aan uitspreiden.
                    return `<div style="display:grid;grid-template-columns:9vh 1fr auto;align-items:baseline;column-gap:1.2vh;width:100%;text-align:left">
                      <span style="font-size:2.2vh;font-weight:700;white-space:nowrap;text-align:left;color:${morgen ? 'rgba(255,255,255,0.45)' : '#38bdf8'}">${morgen ? 'mo ' : ''}${tijd}</span>
                      <span style="font-size:2.4vh;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:${morgen ? 'rgba(255,255,255,0.72)' : 'white'}">${esc(a.titel)}</span>
                      <span style="font-size:1.9vh;color:rgba(255,255,255,0.45);white-space:nowrap;text-align:right">${esc(a.agenda)}</span></div>`;
                  });
                  if(items.length > maxRijen) rijen.push(`<span style="font-size:1.9vh;color:rgba(255,255,255,0.42);text-align:left">+${items.length - maxRijen} meer</span>`);
                  return omhullend(rijen.join(''));
                ]]]
              voet: |
                [[[
                  var pad = function(n){ return ('0'+n).slice(-2); };
                  var klok = function(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
                  // inline-grid: krimpt om zijn inhoud (dus niets om uit te spreiden)
                  // en lijnt icoon en tekst verticaal op het midden uit.
                  var blok = function(icon, kleur, tekst){
                    return `<span style="display:inline-grid;grid-template-columns:auto auto;align-items:center;column-gap:0.8vh;white-space:nowrap">
                      <ha-icon icon="${icon}" style="--mdc-icon-size:2.6vh;color:${kleur}"></ha-icon>
                      <span style="font-size:2.1vh;color:rgba(255,255,255,0.7)">${tekst}</span></span>`;
                  };
                  var delen = [];
                  var z = states['sun.sun'];
                  if(z && z.attributes){
                    var boven = z.state === 'above_horizon';
                    var t = boven ? z.attributes.next_setting : z.attributes.next_rising;
                    if(t){
                      var d = new Date(t);
                      if(!isNaN(d.getTime())) delen.push(blok(boven ? 'mdi:weather-sunset-down' : 'mdi:weather-sunset-up', '#f59e0b', (boven ? 'zon onder ' : 'zon op ') + klok(d)));
                    }
                  }
                  var n = states['sensor.neerslag_komende_30_minuten'];
                  if(n && !isNaN(Number(n.state))){
                    var mm = Number(n.state);
                    var eenheid = (n.attributes && n.attributes.unit_of_measurement) || '';
                    delen.push(mm > 0
                      ? blok('mdi:weather-pouring', '#38bdf8', `regen komend halfuur · ${mm.toFixed(1).replace('.',',')} ${eenheid}`.trim())
                      : blok('mdi:weather-partly-cloudy', 'rgba(255,255,255,0.5)', 'droog komend halfuur'));
                  }
                  if(!delen.length) return '';
                  // Laatste kolom is een lege 1fr die de restruimte opslokt, zodat
                  // de blokken links blijven staan.
                  return `<div style="display:grid;grid-template-columns:${delen.map(function(){ return 'auto'; }).join(' ')} 1fr;align-items:center;column-gap:2.4vh;width:100%;box-sizing:border-box;text-align:left;border-top:1px solid rgba(255,255,255,0.07);padding-top:1.2vh">${delen.join('')}<span></span></div>`;
                ]]]

        # ---------- PERSONEN ----------
          - type: custom:button-card
            entity: person.robin_bohnen
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            styles:
              card:
                  - background: rgba(255,255,255,0.06)
                  - border: 1px solid rgba(255,255,255,0.18)
                  - border-radius: 18px
                  - box-shadow: none
                  - padding: 1.6vh 2vh
                  - height: 41.2vh
                  - box-sizing: border-box
                  # Net als bij height: button-card zet zijn ha-card zelf op
                  # width:100%, en dan doet een horizontale marge niets — de
                  # kaart wordt niet smaller maar schuift alleen op. Breedte in
                  # vw, NIET in %: zie de WAARSCHUWING bovenaan dit bestand.
                  - width: calc(50vw - 4.1vh)
                  - margin: 1.1vh 2.33vh 3vh 1.1vh
              grid:
                - grid-template-areas: '"t" "mensen" "huis"'
                - grid-template-rows: auto auto auto
                - align-content: space-evenly
                - row-gap: 1.2vh
                - height: 100%
              custom_fields:
                t:
                  - justify-self: start
                mensen:
                  - justify-self: stretch
                huis:
                  - justify-self: stretch
            custom_fields:
              t: |
                [[[
                  var ppl = ['person.robin_bohnen','person.samantha_henkelman','person.emma_bohnen','person.logan_veen'];
                  var n = ppl.filter(function(e){ return states[e] && states[e].state === 'home'; }).length;
                  return `<span style="display:flex;align-items:baseline;gap:1.2vh">
                    <span style="font-size:2.5vh;font-weight:700;letter-spacing:0.12vh;color:rgba(255,255,255,0.68)">PERSONEN</span>
                    <span style="font-size:2.2vh;font-weight:600;padding:0.3vh 1.2vh;border-radius:999px;color:#4ade80;background:rgba(52,168,120,0.15)">${n} thuis</span></span>`;
                ]]]
              mensen: |
                [[[
                  var mensen = [
                    ['person.robin_bohnen','sensor.iphone_van_robin_battery_level','sensor.robin_reistijd_naar_huis'],
                    ['person.samantha_henkelman','sensor.iphone_van_samantha_battery_level','sensor.samantha_reistijd_naar_huis'],
                    ['person.emma_bohnen','sensor.iphone_van_emma_battery_level','sensor.emma_reistijd_naar_huis'],
                    ['person.logan_veen','sensor.iphone_battery_level','sensor.logan_reistijd_naar_huis']
                  ];
                  var cellen = mensen.map(function(m){
                    var p = states[m[0]];
                    if(!p) return '';
                    var naam = p.attributes.friendly_name ? p.attributes.friendly_name.split(' ')[0] : '?';
                    var thuis = p.state === 'home';
                    var st = thuis ? 'thuis' : 'afwezig';
                    var stKleur = 'rgba(255,255,255,0.7)';
                    if(!thuis){
                      var r = states[m[2]];
                      if(r && !isNaN(Number(r.state)) && Number(r.state) > 0){
                        st = Math.round(Number(r.state)) + ' min';
                        stKleur = '#38bdf8';
                      }
                    }
                    var b = states[m[1]];
                    var acc = b && !isNaN(Number(b.state)) ? Math.round(Number(b.state)) : null;
                    var accKleur = acc === null ? 'rgba(255,255,255,0.3)' : (acc <= 10 ? '#ef4444' : (acc <= 20 ? '#f59e0b' : 'rgba(255,255,255,0.75)'));
                    // Foto uit de person-entiteit, net als op het overzichtsdashboard:
                    // thuis/afwezig zit in de ringkleur, afwezig dimt de foto zodat je
                    // van een afstand ziet wie er is zonder te lezen. Zonder foto valt
                    // de cirkel terug op de eerste letter.
                    //
                    // entity_picture is een RELATIEF pad (/api/image/serve/...). In een
                    // Cast-sessie draait de frontend op cast.home-assistant.io, dus een
                    // relatieve URL zou daar zoeken en niets vinden. Vandaar de basis-URL
                    // van de HA-verbinding ervoor. (Het plaatje zelf heeft geen token
                    // nodig; /api/image/serve serveert onbeveiligd.)
                    var pic = p.attributes.entity_picture || null;
                    if(pic && pic.charAt(0) === '/'){
                      var basis = '';
                      try {
                        if(hass && typeof hass.hassUrl === 'function') basis = hass.hassUrl('');
                        else if(hass && hass.auth && hass.auth.data && hass.auth.data.hassUrl) basis = hass.auth.data.hassUrl;
                      } catch(e) { basis = ''; }
                      pic = String(basis).replace(/\/$/, '') + pic;
                    }
                    var av = pic
                      ? `<div style="width:8vh;height:8vh;border-radius:50%;box-sizing:border-box;border:0.3vh solid ${thuis ? 'rgba(74,222,128,0.75)' : 'rgba(255,255,255,0.18)'};
                           background-image:url('${pic}');background-size:cover;background-position:center;${thuis ? '' : 'filter:grayscale(0.7);opacity:0.7'}"></div>`
                      : `<div style="width:8vh;height:8vh;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3.8vh;font-weight:600;
                           background:${thuis ? 'rgba(52,168,120,0.16)' : 'rgba(255,255,255,0.06)'};color:${thuis ? '#4ade80' : 'rgba(255,255,255,0.72)'}">${naam.charAt(0)}</div>`;
                    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:0.5vh">
                      ${av}
                      <span style="font-size:2.5vh;font-weight:600;color:white">${naam}</span>
                      <span style="font-size:2.1vh;color:${stKleur}">${st}</span>
                      <span style="font-size:2.1vh;font-weight:600;color:${accKleur}">${acc === null ? '—' : acc + '%'}</span></div>`;
                  });
                  return `<div style="display:flex;gap:1vh">${cellen.join('')}</div>`;
                ]]]
              # Huisstatus onder de personen: het paneel had ruimte over en dit is
              # wat je bij de deur wil zien. Buitendeuren staan los van
              # binary_sensor.all_doors, want daar zitten ook binnendeuren in
              # (badkamer/toilet/slaapkamers) en die staan normaal gewoon open.
              huis: |
                [[[
                  var buitendeuren = ['binary_sensor.entree_entree_voordeur_deur','binary_sensor.woonkamer_achterdeur_contact',
                                      'binary_sensor.woonkamer_openslaande_deuren_contact','binary_sensor.speelkamer_openslaande_deuren_contact',
                                      'binary_sensor.garage_achterdeur_contact'];
                  var telOpen = function(lijst){
                    var n = 0, bekend = 0;
                    lijst.forEach(function(id){
                      var e = states[id];
                      if(!e || e.state === 'unavailable' || e.state === 'unknown') return;
                      bekend++;
                      if(e.state === 'on') n++;
                    });
                    return bekend ? n : null;
                  };
                  var leden = function(id){
                    var g = states[id];
                    if(!g) return null;
                    var l = g.attributes && g.attributes.entity_id;
                    return Array.isArray(l) ? telOpen(l) : (g.state === 'on' ? 1 : 0);
                  };
                  // icoon | label | waarde rechts. Het icoon is een eigen
                  // gridkolom met align-items:center in plaats van een inline
                  // vertical-align-offset: dat laatste is gokken op de
                  // regelhoogte en stond er net naast.
                  var cel = function(icon, label, waarde, kleur){
                    return `<div style="display:grid;grid-template-columns:auto auto 1fr;align-items:center;column-gap:1vh;min-width:0;text-align:left">
                      <ha-icon icon="${icon}" style="--mdc-icon-size:2.8vh;color:${kleur}"></ha-icon>
                      <span style="font-size:2.1vh;color:rgba(255,255,255,0.62);white-space:nowrap;text-align:left">${label}</span>
                      <span style="font-size:2.2vh;font-weight:600;color:${kleur};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right">${waarde}</span></div>`;
                  };
                  var cellen = [];

                  var dOpen = telOpen(buitendeuren);
                  cellen.push(dOpen === null
                    ? cel('mdi:door-closed', 'buitendeuren', 'onbekend', 'rgba(255,255,255,0.35)')
                    : cel(dOpen ? 'mdi:door-open' : 'mdi:door-closed', 'buitendeuren',
                          dOpen ? dOpen + ' open' : 'dicht', dOpen ? '#f59e0b' : 'rgba(255,255,255,0.7)'));

                  var rOpen = leden('binary_sensor.all_windows');
                  cellen.push(rOpen === null
                    ? cel('mdi:window-closed-variant', 'ramen', 'onbekend', 'rgba(255,255,255,0.35)')
                    : cel(rOpen ? 'mdi:window-open-variant' : 'mdi:window-closed-variant', 'ramen',
                          rOpen ? rOpen + ' open' : 'dicht', rOpen ? '#f59e0b' : 'rgba(255,255,255,0.7)'));

                  // Alle kamergroepen volgen de *_lampen-conventie, dus nieuwe
                  // ruimtes tellen automatisch mee.
                  var aan = Object.keys(states).filter(function(id){
                    return /^light\..*_lampen$/.test(id) && states[id].state === 'on';
                  }).length;
                  cellen.push(cel(aan ? 'mdi:lightbulb-on' : 'mdi:lightbulb-off-outline', 'lampen',
                                  aan ? aan + ' aan' : 'alles uit', aan ? '#f59e0b' : 'rgba(255,255,255,0.7)'));

                  var c = states['cover.achtertuin_zonnescherm'];
                  var m = {open:'uit', closed:'ingetrokken', opening:'gaat uit', closing:'gaat in'};
                  var pos = c && c.attributes && c.attributes.current_position != null ? Number(c.attributes.current_position) : null;
                  var schermTxt = c ? (m[c.state] || c.state) : 'onbekend';
                  if(pos !== null && pos > 0 && pos < 100) schermTxt = pos + '%';
                  cellen.push(cel('mdi:blinds-horizontal', 'zonnescherm', schermTxt,
                                  c && c.state !== 'closed' ? '#4ade80' : 'rgba(255,255,255,0.7)'));

                  var graden = function(id){
                    var e = states[id];
                    return (e && !isNaN(Number(e.state))) ? Number(e.state) : null;
                  };
                  var binnen = graden('sensor.woonkamer_woonkamer_multisensor_temperatuur');
                  var buiten = graden('sensor.knmi_temperatuur');
                  var fmt = function(v){ return v === null ? '—' : v.toFixed(1).replace('.',',') + '°'; };
                  cellen.push(cel('mdi:home-thermometer', 'binnen', `${fmt(binnen)} · buiten ${fmt(buiten)}`, 'rgba(255,255,255,0.8)'));

                  var accu = graden('sensor.hrh85f_batterij');
                  var km = graden('sensor.hrh85f_battery_autonomy');
                  var cs = states['sensor.hrh85f_charge_state'];
                  var laadt = cs && cs.state === 'charge_in_progress';
                  var autoTxt = accu === null ? 'onbekend'
                    : Math.round(accu) + '%' + (km === null ? '' : ' · ' + Math.round(km) + ' km') + (laadt ? ' · laadt' : '');
                  cellen.push(cel(laadt ? 'mdi:ev-station' : 'mdi:car-electric', 'auto', autoTxt,
                                  accu !== null && accu <= 20 ? '#f59e0b' : (laadt ? '#4ade80' : 'rgba(255,255,255,0.8)')));

                  return `<div style="display:grid;grid-template-columns:1fr 1fr;column-gap:2.4vh;row-gap:0.9vh;width:100%;box-sizing:border-box;text-align:left;border-top:1px solid rgba(255,255,255,0.07);padding-top:1.2vh">${cellen.join('')}</div>`;
                ]]]
