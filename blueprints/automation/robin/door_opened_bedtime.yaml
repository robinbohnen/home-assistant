# Kinderdeur open na bedtijd: één keer opgeschreven in plaats van per kamer.
#
# Gebruikt door:
#   - packages/1 - First Floor/Bedroom Maxi/Door Opened During Bedtime Maxi.yaml
#     (id: maxi_opened_door_bedtime, blauw)
#   - packages/2 - Second Floor/Bedroom Mini/Door Opened During Bedtime Mini.yaml
#     (id: mini_opened_door_bedtime, roze)
#
# De twee kopieën waren regel voor regel gelijk op de sensor, de bedtijd-helper,
# het scene_id, de meldingstekst en de kleur na. Twee dingen zijn hier bewust
# anders dan in die kopieën:
#
#   1. De melding "lampen zijn uit dus" hing aan de stand van één vaste lamp
#      (de Hue bar). Stond die uit maar de tuinspot aan, dan kwam er een melding
#      terwijl er wél een lamp knipperde; andersom kreeg je niets. Nu telt of er
#      überhaupt géén attentielamp aan staat. Een lamp die 'unavailable' is telt
#      daarbij als niet-aan: dan is er geen zichtbaar signaal en is de melding
#      juist het vangnet.
#   2. De lampen worden doorlopen in plaats van per stuk uitgeschreven, zodat
#      een derde kinderkamer of een extra lamp alleen nog een regel in de
#      instantie is.
#
# Let op de volgorde: eerst de scene aanmaken (momentopname van hoe het huis er
# nu bij staat), dan pas laten ademen. Andersom leg je de ademstand vast en
# blijft het huis daarna blauw of roze staan.
blueprint:
  name: Kinderdeur open tijdens bedtijd
  description: >-
    Gaat de deur van een kinderkamer na bedtijd open, dan ademen een paar lampen
    beneden even in een kleur die bij die kamer hoort, pauzeert de tv en gaat
    daarna alles terug naar hoe het stond. Staat er geen enkele lamp aan, dan is
    er niets te zien en gaat er in plaats daarvan een pushmelding uit.
  author: Robin Bohnen
  domain: automation
  homeassistant:
    # triggers:/actions:/action: in de nieuwe schrijfwijze.
    min_version: 2024.10.0
  input:
    deur_contact:
      name: Deurcontact
      description: Het contact op de slaapkamerdeur van dit kind.
      selector:
        entity:
          filter:
            domain: binary_sensor
    bedtijd:
      name: Bedtijd-helper
      description: >-
        input_datetime met het moment waarop dit kind in bed hoort te liggen
        (de bedtime_*_1h_off-helpers). Vanaf dat tijdstip telt een open deur.
      selector:
        entity:
          filter:
            domain: input_datetime
    tot:
      name: Tot en met
      description: >-
        Vanaf dit tijdstip 's ochtends mag de deur gewoon open en gebeurt er
        niets meer.
      default: "09:30:00"
      selector:
        time:
    stil_wanneer:
      name: Schakelaar die dit alles stilzet
      description: >-
        Staat deze aan, dan gebeurt er niets: geen ademende lampen beneden en
        ook geen pushbericht. Bedoeld voor "kinderen mogen wakker worden"
        (packages/9 - Other/Kinderen Wakker.yaml): het lampenspel is een alarm
        - er is er een uit bed - en dat heb je met die schakelaar zelf net
        toegestaan. Een melding krijgen over iets wat mag, leert je de meldingen
        wegklikken.
      default: input_boolean.kinderen_mogen_wakker_worden
      selector:
        entity:
          filter:
            domain: input_boolean
    scene_id:
      name: Scene-id voor de momentopname
      description: >-
        MOET per kamer uniek zijn. Twee automatiseringen die hetzelfde scene_id
        aanmaken overschrijven elkaars momentopname, en dan zet de ene kamer de
        lampen terug in de stand die de andere net vastlegde.
      selector:
        text:
    attentie_lampen:
      name: Attentielampen
      description: >-
        De lampen beneden die gaan ademen. Hiervan wordt ook de momentopname
        gemaakt, zodat precies terugkomt wat er is aangepast.
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    kleur:
      name: Kleur
      description: Per kamer een eigen kleur, zodat je aan de lamp ziet wie er uit bed is.
      selector:
        color_rgb:
    melding_titel:
      name: Titel van de melding
      selector:
        text:
    melding_tekst:
      name: Tekst van de melding
      selector:
        text:
          multiline: true
    mediaspeler:
      name: Mediaspeler om te pauzeren (optioneel)
      description: >-
        Speelt deze af, dan wordt hij gepauzeerd: met een film aan zie je een
        ademende lamp niet. Bewust geen hervatting achteraf, dat is precies de
        bedoeling van de onderbreking.
      default: media_player.woonkamer_appletv
      selector:
        entity:
          filter:
            domain: media_player
    ademduur:
      name: Hoe lang ademen
      description: Daarna gaat de momentopname weer aan.
      default:
        hours: 0
        minutes: 0
        seconds: 20
      selector:
        duration:
    bezet_timer:
      name: Slot op de lampen
      description: >-
        Eén timer die door ALLE kamers met deze blueprint gedeeld wordt.
        `mode: single` beschermt maar één automatisering tegen zichzelf; gaan de
        deuren van twee kinderen binnen de ademduur open, dan maakt de tweede
        een momentopname van de al ademende lampen en zet die naderhand terug -
        waarna ze blauw (of roze) blijven staan tot iemand het opmerkt. Zolang
        deze timer loopt houdt de tweede kamer daarom van de lampen af; hij
        stuurt dan wél gewoon een bericht, want zichtbaar maken lukt niet.
        Een timer en geen input_boolean: gaat een run onderweg stuk - een reload
        is al genoeg - dan loopt een timer vanzelf af en zit het slot niet voor
        altijd vast.
      selector:
        entity:
          filter:
            domain: timer

# single, want de momentopname en het terugzetten horen bij elkaar. Bij restart
# zou een tweede deur die opengaat het terugzetten overslaan en blijft het huis
# ademen; max_exceeded houdt het log schoon voor iets dat gewoon klopt.
mode: single
max_exceeded: silent

# !input werkt niet binnen templates; alles wat een template raakt gaat hierlangs.
variables:
  scene_id: !input scene_id
  stil_wanneer: !input stil_wanneer
  attentie_lampen: !input attentie_lampen
  mediaspeler: !input mediaspeler
  bezet_timer: !input bezet_timer

triggers:
  - trigger: state
    entity_id: !input deur_contact
    from: "off"
    to: "on"

conditions:
  - alias: "Tussen bedtijd en de ochtend"
    condition: time
    after: !input bedtijd
    before: !input tot
  # Bewust `is_state(..., 'on')` en niet `!= 'off'`: bestaat de schakelaar niet
  # (of is hij weg), dan telt hij als uit en doet de blueprint gewoon wat hij
  # altijd deed. Een ontbrekende helper hoort het seintje naar beneden niet
  # stil te leggen.
  - alias: "Tenzij de kinderen wakker mogen worden"
    condition: template
    value_template: >-
      {{ stil_wanneer in ['', none] or not is_state(stil_wanneer, 'on') }}

actions:
  - variables:
      # Doet een andere kinderkamer op dit moment het lampenspel? Dan blijven
      # we er helemaal vanaf: een momentopname maken van al ademende lampen en
      # die naderhand terugzetten laat ze juist ademend achter.
      lampen_vrij: "{{ is_state(bezet_timer, 'idle') }}"

  # expand() slaat entiteiten over die niet bestaan, dus alles wat niet
  # aantoonbaar aan staat (uit, unavailable, typefout) telt hier als "niet te
  # zien" en levert een melding op.
  #
  # Is het slot bezet, dan gaat het bericht er sowieso uit. De lampen ademen dan
  # namelijk in de kleur van het ándere kind, en dan wijst de verlichting je de
  # verkeerde kant op - een bericht is dan het enige dat klopt.
  - alias: "Niets te zien? Dan maar een pushbericht"
    if:
      - condition: template
        value_template: >-
          {{ not lampen_vrij
             or expand(attentie_lampen) | selectattr('state', 'eq', 'on')
                | list | count == 0 }}
    then:
      - action: notify.mobile_devices_adults
        data:
          title: !input melding_titel
          message: !input melding_tekst

  - alias: "Het lampenspel, als geen andere kamer bezig is"
    if:
      - condition: template
        value_template: "{{ lampen_vrij }}"
    then:
      # Slot eerst, dan pas de momentopname: andersom zou de andere kamer er
      # precies tussen kunnen glippen. De looptijd is ruimer dan de ademduur,
      # zodat hij ook bij een vastgelopen run vanzelf weer vrijgeeft.
      - action: timer.start
        target:
          entity_id: "{{ bezet_timer }}"

      - alias: "Momentopname van hoe het beneden stond"
        action: scene.create
        data:
          scene_id: !input scene_id
          snapshot_entities: !input attentie_lampen

      # Alleen lampen die al aan staan gaan ademen: een lamp die uit is
      # aanzetten zou 's nachts het halve huis verlichten in plaats van een
      # seintje geven.
      - alias: "Lampen die aan staan laten ademen"
        repeat:
          for_each: !input attentie_lampen
          sequence:
            - if:
                - condition: template
                  value_template: "{{ is_state(repeat.item, 'on') }}"
              then:
                - action: light.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    rgb_color: !input kleur
                    effect: breathe

      # media_play_pause is een schakelaar, geen pauzeknop: had de andere kamer
      # de film al stilgezet, dan zou dit hem weer laten lopen. De conditie op
      # `playing` vangt dat af.
      - alias: "Film op pauze"
        if:
          - condition: template
            value_template: >-
              {{ mediaspeler not in ['', none] and is_state(mediaspeler, 'playing') }}
        then:
          - action: media_player.media_play_pause
            target:
              entity_id: "{{ mediaspeler }}"

      - delay: !input ademduur

      - alias: "Alles terug zoals het stond"
        action: scene.turn_on
        target:
          entity_id: "scene.{{ scene_id }}"

      # Slot meteen vrijgeven; de looptijd van de timer is alleen het vangnet.
      - action: timer.cancel
        target:
          entity_id: "{{ bezet_timer }}"
