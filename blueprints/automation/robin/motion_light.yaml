# Bewegingslicht: het patroon dat acht kamers deelden, één keer opgeschreven.
#
# Vóór deze blueprint had elke kamer zijn eigen kopie van ~120 regels; een fix
# in de ene kamer belandde nooit in de andere zeven. Twee van die verschillen
# waren geen keuze maar een bug, en die zijn hier meteen anders dan in de
# kopieën:
#
#   1. Blokkades (bedtijd, nachtvenster, Apple TV) gelden alleen nog voor het
#      AANzetten. Ze stonden als automatiseringsconditie en blokkeerden dus ook
#      het UITzetten: licht dat net vóór het blokkadevenster aanging, bleef de
#      hele nacht branden.
#   2. Er is geen default-tak met light.toggle meer. Die was overal dood
#      (elke trigger-id had een eigen tak), maar één nieuwe trigger zonder
#      afgedekte id en de lamp ging 's avonds spontaan aan.
#
# De dubbele-uit uit de hal (transition-uit die soms niet aankomt) is hier
# veralgemeend: na het uitzetten wordt even gewacht en alleen als de lamp dan
# nog aan staat, gaat er een tweede uit-commando zonder transition achteraan.
# Sinds 11 augustus 2026 geldt hetzelfde voor het AANzetten, telt een deur die
# net open- of dichtging als aanwezigheid, en kan een kamer het uitzetten
# uitstellen zolang er iets loopt (`uit_uitstel`, in de badkamer: de douche).
# Alle drie komen uit dezelfde ochtend in die badkamer; de toelichting staat
# bij de takken onderaan.
blueprint:
  name: Bewegingslicht
  description: >-
    Lamp aan bij beweging (en optioneel bij een deur die opengaat), uit na een
    instelbare tijd zonder beweging, en uit zodra iedereen weg is (alarm op
    armed_away/armed_home of de voordeur een minuut op slot). Helderheid en
    overgangstijd komen uit helpers zodat ze per kamer en vanaf het dashboard
    instelbaar blijven. Blokkades gelden alleen voor het aanzetten; uitzetten
    mag altijd.
  author: Robin Bohnen
  domain: automation
  homeassistant:
    # Trigger-/conditieselectors en het mengen van eigen en meegegeven
    # triggers bestaan sinds 2024.10.
    min_version: 2024.10.0
  input:
    bewegingssensor:
      name: Bewegingssensor
      description: >-
        PIR of PIR-groep. Aan = lamp aan; een tijd uit = lamp uit.
      selector:
        entity:
          filter:
            domain: binary_sensor
    deur_contacten:
      name: Deurcontacten (optioneel)
      description: Deuren die de lamp ook aanzetten zodra ze opengaan.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: binary_sensor
    lamp:
      name: Lamp
      selector:
        entity:
          filter:
            domain: light
    schakelaar:
      name: Aan/uit-schakelaar
      description: >-
        input_boolean waarmee de hele automatisering aan of uit kan (de
        enable_pir_*-helpers op het dashboard). Uit = er beweegt hier niets,
        ook niet bij vertrek.
      selector:
        entity:
          filter:
            domain: input_boolean
    helderheid:
      name: Helderheid-helper
      description: input_number met het percentage waarmee de lamp aangaat.
      selector:
        entity:
          filter:
            domain: input_number
    overgang:
      name: Overgangstijd-helper
      description: input_number met de fade-tijd in seconden.
      default: input_number.lights_transition_seconds
      selector:
        entity:
          filter:
            domain: input_number
    uit_na:
      name: Uit na
      description: Zo lang geen beweging, dan gaat de lamp uit.
      default:
        hours: 0
        minutes: 2
        seconds: 0
      selector:
        duration:
    aan_blokkades:
      name: Blokkades voor het aanzetten (optioneel)
      description: >-
        Condities die het AANzetten tegenhouden: bedtijden, een nachtvenster,
        een tv die speelt. Het uitzetten gaat hier bewust buitenom, anders
        blijft een lamp die net vóór het venster aanging de hele nacht branden.
      default: []
      selector:
        condition:
    uit_vereisten:
      name: Voorwaarden voor het uitzetten (optioneel)
      description: >-
        Condities waaraan voldaan moet zijn vóór de lamp uitgaat, zoals "de tv
        in deze kamer staat uit". Leeg = altijd uitzetten na de wachttijd.
      default: []
      selector:
        condition:
    uit_uitstel:
      name: Uitstel voor het uitzetten (optioneel)
      description: >-
        Condities die het uitzetten UITSTELLEN zolang ze waar zijn, zoals "er
        loopt water" onder de douche. Anders dan `uit_vereisten` is dit geen
        veto maar een pauze: zodra ze allemaal zakken gaat de lamp alsnog uit.
        Meerdere condities gelden als OF - zolang er één waar is blijft de lamp
        aan. Leeg = geen uitstel.
      default: []
      selector:
        condition:
    extra_uit_triggers:
      name: Extra uit-triggers (optioneel)
      description: >-
        Triggers die de lamp direct uitzetten, zoals de slaapkamerknop in de
        hal. Geef elke trigger hier `id: uit` mee, anders doet hij niets.
      default: []
      selector:
        trigger:
    lux_sensor:
      name: Lichtsensor (optioneel)
      description: >-
        Illuminance-sensor voor daglichtdetectie. Leeg laten = de lamp gaat
        bij elke beweging aan, ook overdag.
      default: ""
      selector:
        entity:
          filter:
            domain: sensor
            device_class: illuminance
    lux_drempel:
      name: Boven deze lux geen licht
      description: >-
        Meet de lichtsensor meer dan dit, dan is het licht genoeg en blijft de
        lamp uit bij beweging. 0 = daglichtdetectie uit.
      default: 0
      selector:
        number:
          min: 0
          max: 100000
          step: 100
          unit_of_measurement: lx
          mode: box
    alarm_paneel:
      name: Alarmpaneel
      default: alarm_control_panel.alarmo
      selector:
        entity:
          filter:
            domain: alarm_control_panel
    voordeur_slot:
      name: Voordeurslot
      default: lock.kroon18voordeur
      selector:
        entity:
          filter:
            domain: lock
    volwassenen:
      name: Volwassenen-groep
      description: Alleen als deze groep niet thuis is, dooft vertrek de lamp.
      default: group.all_adults
      selector:
        entity:
          filter:
            domain: group

# restart en niet single: in de uit-tak zit een korte wachttijd (zie onderaan),
# en beweging tijdens dat wachten moet de lamp meteen weer aan kunnen zetten in
# plaats van genegeerd te worden.
mode: restart
max_exceeded: silent

# !input werkt niet binnen templates; alles wat een template nodig heeft gaat
# via deze variabelen.
variables:
  lamp: !input lamp
  helderheid: !input helderheid
  overgang: !input overgang
  lux_sensor: !input lux_sensor
  lux_drempel: !input lux_drempel
  volwassenen: !input volwassenen
  deur_contacten: !input deur_contacten
  uit_na: !input uit_na
  # De duration-selector levert {hours, minutes, seconds}; een met de hand
  # geschreven "00:02:00" wordt ook nog begrepen. In seconden nodig omdat de
  # deur-coulance onderaan met `last_changed` rekent.
  uit_na_sec: >-
    {% if uit_na is mapping %}
      {{ (uit_na.days | default(0) | int) * 86400
         + (uit_na.hours | default(0) | int) * 3600
         + (uit_na.minutes | default(0) | int) * 60
         + (uit_na.seconds | default(0) | int) }}
    {% else %}
      {% set p = (uit_na | string).split(':') | map('int') | list %}
      {{ p[0] * 3600 + p[1] * 60 + p[2] }}
    {% endif %}

triggers:
  - trigger: state
    entity_id: !input bewegingssensor
    to: "on"
    id: beweging
  - trigger: state
    entity_id: !input bewegingssensor
    to: "off"
    for: !input uit_na
    id: geen_beweging
    # Na een herstart komen deze entiteiten uit `unavailable`/`unknown`
    # tevoorschijn. Zonder deze guard telt dat als een echte overgang: op
    # 2026-08-06 vuurden om 13:25:42 alle acht kamers tegelijk hun uit-tak,
    # twee minuten na de herstart van 13:23, met een reeks "Referenced
    # entities ... are missing or not currently available" tot gevolg omdat de
    # lampen zelf nog niet gemeld hadden. Erger dan logruis: zat je op dat
    # moment in de badkamer, dan ging het licht uit.
    #
    # Prijs: valt een PIR er tussendoor uit en komt hij terug op `off`, dan
    # blijft het licht aan tot de volgende echte bewegingscyclus. Dat corrigeert
    # zichzelf zodra er weer iemand loopt.
    not_from:
      - unknown
      - unavailable
  # Een lege lijst deurcontacten is een geldige trigger die nooit afgaat.
  - trigger: state
    entity_id: !input deur_contacten
    to: "on"
    id: beweging
  - trigger: state
    entity_id: !input alarm_paneel
    to:
      - armed_away
      - armed_home
    id: vertrokken
    not_from:
      - unknown
      - unavailable
  - trigger: state
    entity_id: !input voordeur_slot
    to: locked
    for: "00:01:00"
    id: vertrokken
    not_from:
      - unknown
      - unavailable
  # Genest triggers-blok: zo voeg je een trigger-selector-input samen met de
  # vaste triggers hierboven. De input zelf direct als lijstitem plakken
  # (`- !input ...`) is ongeldig en liet de hele blueprint stuklopen.
  - triggers: !input extra_uit_triggers

conditions:
  - alias: "Bewegingslicht staat hier aan"
    condition: state
    entity_id: !input schakelaar
    state: "on"

actions:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - beweging
          - alias: "Donker genoeg (of geen lichtsensor ingesteld)"
            condition: template
            value_template: >-
              {{ lux_sensor in ['', none]
                 or lux_drempel | float(0) <= 0
                 or states(lux_sensor) | float(0) <= lux_drempel | float(0) }}
          - alias: "Kamerspecifieke blokkades"
            condition: and
            conditions: !input aan_blokkades
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input lamp
            data:
              transition: "{{ states(overgang) | int(1) }}"
              brightness_pct: "{{ states(helderheid) | int(100) }}"
          # DE DUBBELE AAN, spiegelbeeld van de dubbele uit hieronder
          # Ook een aan-commando komt niet altijd aan. Op 11 augustus 2026 ging
          # om 08:05:30 de badkamerdeur open, vuurde deze automatisering keurig
          # (dat staat in het logboek) en bleef het licht toch uit; het ging pas
          # 68 seconden later met de hand aan. Even kijken of de lamp echt
          # brandt en zo niet nog een keer sturen, nu zonder transition - dat is
          # hetzelfde recept dat de hal voor het uitzetten al had.
          #
          # Alleen bij een lamp die hard `off` meldt: bij `unavailable` heeft
          # een tweede commando toch geen zin en hoort het bij de zigbee-radio
          # thuis, niet hier.
          - wait_template: "{{ is_state(lamp, 'on') }}"
            timeout: "{{ states(overgang) | int(1) + 3 }}"
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ is_state(lamp, 'off') }}"
            then:
              - action: light.turn_on
                target:
                  entity_id: !input lamp
                data:
                  brightness_pct: "{{ states(helderheid) | int(100) }}"

      - conditions:
          - condition: trigger
            id:
              - geen_beweging
              - uit
          - alias: "Kamerspecifieke voorwaarden voor uitzetten"
            condition: and
            conditions: !input uit_vereisten
        sequence:
          # EEN DEUR DIE NET BEWOOG TELT OOK ALS AANWEZIGHEID
          # De uit-trigger hangt alleen aan de bewegingsmelder, en die staat na
          # een lange bezetting soms al bijna twee minuten op `off` terwijl er
          # net iemand binnenkomt. Op 11 augustus 2026 ging om 08:17:21 de
          # badkamerdeur open en om 08:18:01 - veertig seconden later - het
          # licht uit, want toen was de PIR precies `uit_na` lang stil. Wie net
          # binnenstapt staat dan in het donker te wachten tot de melder hem
          # oppikt, en juist dat wachten is wat je van een bewegingslicht niet
          # verwacht.
          #
          # Dus: gebeurde er korter dan `uit_na` geleden iets met een deur, dan
          # wachten we op de volgende deurbeweging - en blijft die uit, dan op
          # de stilte daarna. Open én dicht tellen allebei: allebei betekenen
          # ze dat er iemand loopt, en de deur achter je dichtdoen is nu net het
          # gebaar waarna je het licht wilt houden.
          #
          # Dit wordt bewust in de actie afgehandeld en niet met extra
          # deur-triggers bovenaan: triggers met `for` gaan na een herstart van
          # Home Assistant alsnog af op de teruggezette begintoestand, en dat is
          # precies het lek van 6 augustus dat de `not_from`-guard hierboven
          # dichtzette. Een `wait_for_trigger` bestaat alleen zolang deze tak
          # loopt en heeft dat probleem niet.
          #
          # Beweging tijdens het wachten herstart de hele automatisering
          # (`mode: restart`) en zet het licht gewoon weer aan; een expliciete
          # uit-knop (`id: uit`) slaat het wachten over en doet wat er staat.
          - alias: Wachten zolang de deur nog van zich laat horen
            repeat:
              while:
                - condition: template
                  value_template: >-
                    {% set ns = namespace(recent=false) %}
                    {% for s in expand(deur_contacten) %}
                      {% if (now() - s.last_changed).total_seconds()
                            < uit_na_sec | int %}
                        {% set ns.recent = true %}
                      {% endif %}
                    {% endfor %}
                    {{ trigger.id != 'uit' and ns.recent }}
              sequence:
                - wait_for_trigger:
                    - trigger: state
                      entity_id: !input deur_contacten
                      to:
                        - "on"
                        - "off"
                  timeout: "{{ uit_na_sec | int }}"
                  continue_on_timeout: true
          # EN DAARNA NOG WACHTEN OP WAT DE KAMER ZELF ZEGT
          # De badkamer is hier de aanleiding: onder de douche sta je stil
          # achter het gordijn, de melder verliest je en het licht ging uit
          # terwijl je er nog stond. Zolang `uit_uitstel` waar is gaat de lamp
          # niet uit, en zodra het zakt alsnog - dat is het verschil met
          # `uit_vereisten`, dat het uitzetten hélemaal overslaat en de lamp dan
          # tot de volgende bewegingscyclus laat branden.
          #
          # De lege lijst wordt hier door een `or` afgevangen en niet door een
          # `and`: een lege `and` is in Home Assistant WAAR (daar leunen de
          # `aan_blokkades` hierboven op) en zou elke kamer zonder uitstel
          # eindeloos laten rondjes draaien. Een lege `or` is onwaar en valt dus
          # meteen weg. Meegenomen voordeel: bij meerdere condities betekent
          # `or` "zolang er één van waar is", en dat is precies wat uitstel
          # hoort te doen.
          - alias: Wachten zolang de kamer om licht blijft vragen
            repeat:
              while:
                - alias: "Kamerspecifiek uitstel (lege lijst = geen uitstel)"
                  condition: or
                  conditions: !input uit_uitstel
                # Een expliciete uit-knop wacht nergens op. En na een uur is het
                # klaar: 120 rondjes van dertig seconden, dezelfde noodrem als
                # de douchetimer, voor het geval een conditie blijft hangen.
                - alias: "Geen uit-knop, en de noodrem is nog niet bereikt"
                  condition: template
                  value_template: >-
                    {{ trigger.id != 'uit' and repeat.index <= 120 }}
              sequence:
                - delay: "00:00:30"
          - action: light.turn_off
            target:
              entity_id: !input lamp
            data:
              transition: "{{ states(overgang) | int(1) }}"
          # Een uit-commando met transition komt niet altijd aan (dit was de
          # dubbele-uit-hack in de hal). Even wachten en alleen nog een keer
          # sturen als de lamp dan echt nog aan staat.
          - wait_template: "{{ is_state(lamp, 'off') }}"
            timeout: "{{ states(overgang) | int(1) + 3 }}"
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ is_state(lamp, 'on') }}"
            then:
              - action: light.turn_off
                target:
                  entity_id: !input lamp

      - conditions:
          - condition: trigger
            id:
              - vertrokken
          - alias: "Geen volwassenen meer thuis"
            condition: template
            value_template: "{{ not is_state(volwassenen, 'home') }}"
          - alias: "Lamp staat nog aan"
            condition: template
            value_template: "{{ is_state(lamp, 'on') }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input lamp
            data:
              transition: "{{ states(overgang) | int(1) }}"
    # Bewust geen default: een trigger zonder afgedekte id doet niets. Hier
    # stond light.toggle, en dat is precies hoe je een lamp 's avonds spontaan
    # aan krijgt zodra iemand een trigger toevoegt.
