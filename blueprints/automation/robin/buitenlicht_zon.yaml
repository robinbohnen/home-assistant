# Buitenlicht op de zon: carport en voordeur hadden hier hun eigen kopie van.
#
# De twee bestanden waren op de pakketnaam, de lampgroep en de helderheids-
# helper na letter voor letter gelijk (52 regels per stuk), inclusief allebei
# hetzelfde commentaar over dezelfde bug. Dat is precies het geval waarin één
# van de twee ooit stilletjes achterloopt.
#
# Gebruikt door:
#   packages/3 - Outside/Carport/Lights.yaml    (lights_carport)
#   packages/3 - Outside/Frontyard/Lights.yaml  (lights_frontdoor)
#
# NIET de achtertuin. `packages/3 - Outside/Backyard/Lights.yaml` doet meer:
# die reageert ook op het ontwapenen van het alarm en op de luxmeter in de
# tuin, met een eigen tijdvenster op de uit-tak. Dat hierin proppen zou van
# deze blueprint een verzameling schakelaars maken voor gedrag dat maar op één
# plek bestaat.
#
# TWEE DINGEN DIE UIT DE KOPIEËN ZIJN OVERGENOMEN EN NIET WEG MOGEN:
#
#   1. Beide triggers hebben een `id`. Zonder id krijgt een trigger zijn
#      volgnummer, terwijl de uit-tak op "sunrise" test - de lampen bleven toen
#      de hele dag branden. Hier kan dat niet meer misgaan omdat de triggers in
#      de blueprint staan en niet in de instantie.
#   2. Bewust geen `default:` onder de choose. Daar stond `light.toggle`, en
#      dat is wat die bug destijds verborg: elke niet-afgedekte trigger klapte
#      de lamp gewoon om.
blueprint:
  name: Buitenlicht op de zon
  description: >-
    Buitenlamp aan rond zonsondergang en uit rond zonsopkomst. Helderheid en
    overgangstijd komen uit helpers, zodat ze per lamp en vanaf het dashboard
    instelbaar blijven.
  author: Robin Bohnen
  domain: automation
  input:
    lamp:
      name: Lamp
      selector:
        entity:
          filter:
            domain: light
    helderheid:
      name: Helderheid-helper
      description: input_number met het percentage waarmee de lamp aangaat.
      selector:
        entity:
          filter:
            domain: input_number
    overgang:
      name: Overgangstijd-helper
      description: input_number met de fade-tijd in seconden.
      default: input_number.lights_transition_seconds
      selector:
        entity:
          filter:
            domain: input_number
    aan_offset:
      name: Aan-offset op zonsondergang
      description: >-
        Standaard een uur vóór zonsondergang: dan is het buiten al donker
        genoeg om verschil te maken.
      default: "-01:00:00"
      selector:
        text:
    uit_offset:
      name: Uit-offset op zonsopkomst
      default: "+01:00:00"
      selector:
        text:

# Single is hier genoeg: de twee triggers liggen een halve dag uit elkaar.
mode: single

variables:
  # Via variabelen zodat de templates hieronder gewone entity-id's lezen; een
  # `!input` staat niet zomaar in een Jinja-expressie.
  helderheid: !input helderheid
  overgang: !input overgang

triggers:
  - id: aan
    trigger: sun
    event: sunset
    offset: !input aan_offset
  - id: uit
    trigger: sun
    event: sunrise
    offset: !input uit_offset

actions:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - aan
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input lamp
            data:
              transition: "{{ states(overgang) | int(1) }}"
              brightness_pct: "{{ states(helderheid) | int(100) }}"
      - conditions:
          - condition: trigger
            id:
              - uit
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input lamp
            data:
              transition: "{{ states(overgang) | int(1) }}"
